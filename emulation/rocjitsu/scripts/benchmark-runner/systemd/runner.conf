[Unit]
BindsTo=rocjitsu-bpfland.service
After=rocjitsu-bpfland.service

[Service]
User=@RUNNER_USER@
Group=@RUNNER_GROUP@
Slice=benchmark.slice
CPUAffinity=0-15
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
MemorySwapMax=0
Delegate=no
ProtectControlGroups=yes
# Do not inherit administrator-selected supplementary groups from another unit.
# This does not clear the runner account's groups from the account database: remove those too.
SupplementaryGroups=
