[Unit]
BindsTo=rocjitsu-bpfland.service
After=rocjitsu-bpfland.service

[Service]
User=@RUNNER_USER@
Group=@RUNNER_GROUP@
Slice=benchmark.slice
AllowedCPUs=0-63
CPUAffinity=0-15
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
Delegate=no
ProtectControlGroups=yes
# Do not inherit administrator-selected supplementary groups from another unit.
# Remove unnecessary administrative groups from the account; preserve required Docker access.
SupplementaryGroups=
