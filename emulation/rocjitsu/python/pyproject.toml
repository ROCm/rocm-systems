[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rocjitsu"
version = "0.3.0"
description = "Python launch and session API for rocjitsu GPU simulation"
readme = "README.md"
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
requires-python = ">=3.10"
dependencies = ["cloudpickle>=3.0,<4"]
license = "MIT"

[tool.setuptools.packages.find]
include = ["rocjitsu*"]
