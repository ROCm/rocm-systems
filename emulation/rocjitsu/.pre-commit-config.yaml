exclude: |
  (?x)
    third_party/
    | build/
    | build-.*/
    | _build/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^emulation/rocjitsu/
      - id: end-of-file-fixer
        files: ^emulation/rocjitsu/
      - id: check-yaml
        files: ^emulation/rocjitsu/
      - id: check-added-large-files
        files: ^emulation/rocjitsu/

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        name: black (skip-string-normalization)
        args: ["--skip-string-normalization"]
        files: ^emulation/rocjitsu/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.4
    hooks:
      - id: clang-format
        name: clang-format (C/C++/ObjC)
        entry: clang-format -i -style=file
        files: ^emulation/rocjitsu/.*\.(c|cpp|cc|h|hpp|m|mm)$

  - repo: https://github.com/BlankSpruce/gersemi
    rev: 0.25.1
    hooks:
      - id: gersemi
        files: ^emulation/rocjitsu/(CMakeLists\.txt|.*\.cmake)$
