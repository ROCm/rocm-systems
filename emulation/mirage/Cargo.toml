[package]
name = "mirage"
version.workspace = true
edition = "2024"

[[bin]]
name = "mirage"
path = "src/main.rs"

[dependencies]
mirage_core = { workspace = true }
mirage_ctl = { workspace = true }
# Emulator backends. Each is an optional, link-only dependency pulled in
# by its matching feature below; the binary never references them
# directly — they register themselves into the emulator registry via
# `inventory` at link time (see `src/main.rs`). Toggle a backend on or
# off with its feature flag.
mirage_rocjitsu = { workspace = true, optional = true }
mirage_hotswap = { workspace = true, optional = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }

[features]
# All backends are compiled in by default. Disable a backend by
# building with `--no-default-features` and selecting the subset you
# want, e.g. `cargo build --no-default-features --features rocjitsu`.
default = ["rocjitsu"]
rocjitsu = ["dep:mirage_rocjitsu"]
hotswap = ["dep:mirage_hotswap"]

[lints]
workspace = true

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
mirage_builtin = { workspace = true }
mirage_supervisor = { workspace = true }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde = { workspace = true }
serde_json = "1.0"
chrono = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }

[workspace]
members = [
    "builtin",
    "core",
    "container",
    "ctl",
    "hotswap",
    "rocjitsu",
    "rocjitsu_sys",
    "supervisor",
    "sys",
]

# Fields shared by every crate in the workspace. Members inherit them with
# `version.workspace = true`, so a release is a one-line change here.
[workspace.package]
version = "0.2.0"

# =============================================================================
# Workspace lint policy
# =============================================================================
#
# Every crate opts in with `[lints] workspace = true`. There are exactly
# two exceptions, and both are crates whose entire job is to contain
# `unsafe` so that nothing else has to:
#
#   * `rocjitsu_sys` — the FFI binding layer to `librocjitsu.so`.
#   * `mirage_sys`   — the post-fork operations that cannot be expressed
#                      safely (today: `PR_SET_PDEATHSIG`).
#
# Both carry their own equivalent `[lints]` table with `unsafe_code`
# allowed. Because `forbid` cannot be relaxed by a later `allow`, they
# deliberately do not inherit this table rather than trying to override
# it. Keeping the exceptions to crates named for the purpose is what makes
# "where is the unsafe?" answerable by reading the workspace members.
#
# `unwrap_used` / `expect_used` are denied in production code. Test modules
# opt out locally with an inner
# `#![allow(clippy::unwrap_used, clippy::expect_used)]`, since a panic in a
# test *is* the failure mechanism.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
# Async-correctness lints. The supervisor holds locks around a lot of
# process bookkeeping; holding a std lock across an await would silently
# serialise (or deadlock) the runtime.
await_holding_lock = "deny"
let_underscore_future = "deny"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6.1", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
async-trait = "0.1"
nix = { version = "0.29", features = [
    "fs",
    "poll",
    "process",
    "signal",
    "term",
    "user",
] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
once_cell = "1"
inventory = "0.3.24"
libloading = "0.8"

mirage_core = { path = "core" }
mirage_ctl = { path = "ctl" }
mirage_builtin = { path = "builtin" }
mirage_supervisor = { path = "supervisor" }
mirage_rocjitsu = { path = "rocjitsu" }
mirage_hotswap = { path = "hotswap" }
mirage_container = { path = "container" }
rocjitsu_sys = { path = "rocjitsu_sys" }
mirage_sys = { path = "sys" }
