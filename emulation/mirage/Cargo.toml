[package]
name = "mirage"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mirage"
path = "src/main.rs"

[dependencies]
mirage_core = { workspace = true }
mirage_ctl = { workspace = true }
# The supervisor daemon: owns every session in-process and serves the
# control plane over a Unix socket. Not optional — it *is* the runtime.
# Its HTTP/WebSocket dashboard is what's optional, behind the `daemon`
# and `webui` features below.
mirage_daemon = { workspace = true }
# Emulator backends. Each is an optional, link-only dependency pulled in
# by its matching feature below; the binary never references them
# directly — they register themselves into the emulator registry via
# `inventory` at link time (see `src/main.rs`). Toggle a backend on or
# off with its feature flag.
mirage_rocjitsu = { workspace = true, optional = true }
mirage_hotswap = { workspace = true, optional = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# All backends are compiled in by default. Disable a backend by
# building with `--no-default-features` and selecting the subset you
# want, e.g. `cargo build --no-default-features --features rocjitsu`.
#
# The web UI is OFF by default. Enable just the HTTP API server with
# `--features daemon`, or the full dashboard (API + bundled SPA, needs
# the Node.js toolchain) with `--features webui`.
default = ["rocjitsu"]
rocjitsu = ["dep:mirage_rocjitsu"]
hotswap = ["dep:mirage_hotswap"]
# Serve the HTTP/WebSocket API alongside the daemon's Unix-socket
# control plane. No SPA, no Node.js.
daemon = ["mirage_daemon/http"]
# Everything in `daemon` plus the embedded dashboard SPA and its
# client-side routing (via `mirage_daemon/webui` ->
# `mirage_dashboard/webui`).
webui = ["daemon", "mirage_daemon/webui"]

[[test]]
name = "daemon_e2e"
required-features = ["webui"]

[lints]
workspace = true

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
mirage_builtin = { workspace = true }
mirage_supervisor = { workspace = true }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde = { workspace = true }
serde_json = "1.0"
chrono = { workspace = true }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tungstenite = "0.24"
libc = { workspace = true }
nix = { workspace = true }
pty-process = "0.5.3"

[workspace]
members = [
    "builtin",
    "core",
    "container",
    "ctl",
    "daemon",
    "dashboard",
    "hotswap",
    "rocjitsu",
    "rocjitsu_sys",
    "supervisor",
]

# =============================================================================
# Workspace lint policy
# =============================================================================
#
# Every crate opts in with `[lints] workspace = true`. The one exception is
# `rocjitsu_sys`, which is the FFI binding layer to `librocjitsu.so` and
# therefore *must* be able to write `unsafe`; it carries its own equivalent
# `[lints]` table with `unsafe_code` allowed. Because `forbid` cannot be
# relaxed by a later `allow`, that crate deliberately does not inherit this
# table rather than trying to override it.
#
# `unwrap_used` / `expect_used` are denied in production code. Test modules
# opt out locally with an inner
# `#![allow(clippy::unwrap_used, clippy::expect_used)]`, since a panic in a
# test *is* the failure mechanism.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
# Async-correctness lints. The supervisor holds locks around a lot of
# process bookkeeping; holding a std lock across an await would silently
# serialise (or deadlock) the runtime.
await_holding_lock = "deny"
let_underscore_future = "deny"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6.1", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
async-trait = "0.1"
nix = { version = "0.29", features = [
    "fs",
    "poll",
    "process",
    "signal",
    "term",
    "user",
] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
once_cell = "1"
inventory = "0.3.24"
libloading = "0.8"

mirage_core = { path = "core" }
mirage_ctl = { path = "ctl" }
mirage_builtin = { path = "builtin" }
mirage_supervisor = { path = "supervisor" }
mirage_daemon = { path = "daemon" }
mirage_rocjitsu = { path = "rocjitsu" }
mirage_hotswap = { path = "hotswap" }
mirage_container = { path = "container" }
rocjitsu_sys = { path = "rocjitsu_sys" }
