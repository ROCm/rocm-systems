[package]
name = "mirage_daemon"
version.workspace = true
edition = "2024"

[dependencies]
mirage_core = { workspace = true }
mirage_ctl = { workspace = true }
mirage_dashboard = { path = "../dashboard", optional = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
nix = { workspace = true }
tokio-util = { workspace = true }
mirage_supervisor = { workspace = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace", "cors"], optional = true }

[features]
# Serve the HTTP/WebSocket JSON API (`/api`) alongside the daemon's
# always-present Unix-socket control plane. Pulls in axum and friends.
http = ["dep:axum", "dep:tower", "dep:tower-http"]
# Everything in `http` plus the bundled dashboard SPA and its
# client-side routing fallback. Pulls in `mirage_dashboard` with its own
# `webui` feature, which is what actually builds and embeds the SPA (and
# requires the Node.js toolchain).
webui = ["http", "dep:mirage_dashboard", "mirage_dashboard/webui"]

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[lints]
workspace = true
