[build-system]
# Keep in sync with TheRock's authoritative build recipe:
#   https://github.com/ROCm/TheRock/blob/main/comm-libs/CMakeLists.txt
#   https://github.com/ROCm/TheRock/blob/main/comm-libs/artifact-rocshmem.toml
requires = [
    # >=61 is required to read the PEP 621 [project] table (incl. name) and the
    # dynamic version from setup.py; older setuptools silently produces an
    # "UNKNOWN" distribution name.
    "setuptools>=61.0",
    "wheel",
    "cmake>=3.20",
    # Cap the major version: the CMake glue re-enables RTTI/exceptions by poking
    # nanobind's internal `nanobind-static` target (see CMakeLists.txt), which is
    # not a stable public contract and could change across a major bump.
    "nanobind>=2.12.0,<3.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "rocshmem4py"
# Version is computed in setup.py: the base release plus a PEP 440 local
# segment recording the linked rocSHMEM version, e.g. "0.1.0+rocshmem3.6.0".
dynamic = ["version"]
description = "Python bindings for ROCm OpenSHMEM (rocSHMEM) runtime library"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Advanced Micro Devices, Inc."}
]
keywords = ["rocm", "hip", "rocshmem", "pgas", "hpc", "distributed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/ROCm/rocm-systems"
Repository = "https://github.com/ROCm/rocm-systems"
"Bug Tracker" = "https://github.com/ROCm/rocm-systems/issues"

[project.optional-dependencies]
test = ["pytest>=6.0", "mpi4py>=3.0"]
mpi = ["mpi4py>=3.0"]

[tool.setuptools.packages.find]
include = ["rocshmem4py*"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501", "E731"]
