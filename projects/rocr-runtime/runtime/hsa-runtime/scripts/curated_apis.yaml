# HSA curated APIs for typed parameter capture.
# Schema is the same as the HIP equivalent (projects/clr/hipamd/scripts/curated_apis.yaml).

# --- hsa_queues ---

- api: hsa_queue_create
  args: [agent, size, type, callback, data, private_segment_size, group_segment_size, queue]
  out: [queue]

- api: hsa_queue_destroy
  args: [queue]

- api: hsa_amd_queue_intercept_create
  args: [agent_handle, size, type, callback, data, private_segment_size, group_segment_size, queue]
  out: [queue]
  notes: |
    Verified against /opt/rocm/include/hsa/hsa_api_trace.h.
    Same shape as hsa_queue_create with first param renamed agent_handle.

- api: hsa_soft_queue_create
  args: [region, size, type, features, doorbell_signal, queue]

- api: hsa_queue_inactivate
  args: [queue]

