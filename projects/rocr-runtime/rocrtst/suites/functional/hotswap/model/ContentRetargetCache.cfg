SPECIFICATION Spec

CONSTANTS
  Clients = {c1, c2, c3}
  Transforms = {t1}
  Contents = {contentA, contentB}
  Buckets = {forcedCollisionBucket}
  Readers = {reader1, reader2}
  BucketOf <- ForcedCollisionBucket
  Results = {success, failure}
  SuccessResults = {success}
  NoClient = noClient
  NoKey = noKey
  NoReader = noReader
  NoRecord = noRecord
  MaxGenerations = 2

INVARIANTS
  TypeOK
  OneLeaderPerFlight
  LeaderIsProducing
  WaitersMatchFlight
  WaitingHasFlightOrPublishedResult
  ReadyHasSuccessfulResult
  ObservedExactKey
  CollidingContentsRemainDistinct
  ObservedGenerationAgreement

CHECK_DEADLOCK FALSE
