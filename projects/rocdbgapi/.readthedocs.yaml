# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
   configuration: projects/rocdbgapi/docs/conf.py

formats: [htmlzip, pdf, epub]

python:
   install:
   - requirements: projects/rocdbgapi/docs/sphinx/requirements.txt

build:
   os: ubuntu-26.04
   tools:
      python: "3.10"
   jobs:
      post_checkout:
         - mkdir -p $HOME/.local/bin /tmp/doxygen
         - curl -fsSL https://api.github.com/repos/doxygen/doxygen/releases/latest | grep -oE 'https://[^"]*linux\.bin\.tar\.gz' | head -n1 | xargs curl -fsSL | tar xz -C /tmp/doxygen --strip-components=1
         - cp /tmp/doxygen/bin/doxygen $HOME/.local/bin/doxygen
