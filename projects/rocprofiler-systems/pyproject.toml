[build-system]
requires = [
    "setuptools >= 40.0.4",
    "setuptools_scm >= 2.0.0",
    "wheel >= 0.29.0",
]
build-backend = 'setuptools.build_meta'

[tool.black]
line-length = 90
target-version = ['py38']
include = '\.py$'
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.github
    | \.tox
    | \.venv
    | \.misc
    | \.vscode
    | dist
    | external
    | .pytest_cache
    | build
    | build-release
  )/
)
'''

[tool.ruff]
line-length = 90
target-version = "py38"
extend-exclude = [
    "external",
    "build",
]

[tool.ruff.lint]
ignore = ["BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# `profile` and `noprofile` are injected into builtins by rocprofsys/__main__.py
"examples/python/builtin.py" = ["F821"]
"examples/python/noprofile.py" = ["F821"]
