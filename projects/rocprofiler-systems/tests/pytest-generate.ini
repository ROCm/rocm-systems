# pytest configuration used only to generate CTestTestfile.cmake. It is passed with
# -c (plus --rootdir) in rocprof-sys-pytest.cmake. Without it pytest uses the nearest
# ancestor pytest.ini or pyproject.toml, and a super-project that embeds the build
# tree can hide the tests (TheRock's root pyproject.toml sets python_files = *_test.py).
[pytest]
python_files = test_*.py
