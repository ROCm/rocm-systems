# rocprofiler-systems test categories
#
# Defines tiered test categories for pytest-based tests.
# Use with ctest -L "<category>" to run tests at that tier and below.
#
# Tiering: quick < standard < comprehensive < full
#   ctest -L quick          -> runs quick tests only
#   ctest -L standard       -> runs quick + standard tests
#   ctest -L comprehensive  -> runs quick + standard + comprehensive tests
#   ctest -L full           -> runs all tests
#
# Each tier lists only its OWN test modules (not those from lower tiers).
# Tiered labels are applied automatically by parse_pytest_categories.py.
#
# Pattern syntax:
#   test_patterns:
#     - test_config                     # entire module (test_config.py)
#
#   exclude:
#     - test_openmp::TestOpenMPTarget   # exclude a class within a module
#     - test_openmp::TestOMPVV::test[x] # exclude a specific test

test_categories:
  quick:
    test_patterns:
      - test_config
      - test_binaries
      - test_units
      - test_presets

    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    test_patterns:
      - test_transpose
      - test_roctx
      - test_time_window
      - test_openmp
      - test_gpu_connect
      - test_videodecode
      - test_hip_stream
      - test_jpegdecode

    exclude:
      - test_openmp::TestOpenMPTarget

    labels:
      - "standard"
      - "pr"

  comprehensive:
    test_patterns:
      - test_pthread
      - test_thread_limit
      - test_rewrite_caller
      - test_user_api
      - test_fork
      - test_overflow
      - test_annotate
      - test_code_coverage
      - test_lulesh
      - test_python
      - test_attach

    labels:
      - "comprehensive"
      - "nightly"

  full:
    test_patterns:
      - test_causal
      - test_mpi
      - test_rccl
      - test_ucx
      - test_nic_perf

    labels:
      - "full"
      - "weekly"

# Exclude the following tests irrespective of the category they belong to.
# Use with ctest -LE "<label>" to exclude tests matching a label.
general_exclude:
  exclude_windows:
    test_patterns:
      - test_overflow
      - test_annotate


  exclude_linux:
    test_patterns:
