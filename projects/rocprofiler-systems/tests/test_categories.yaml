# rocprofiler-systems Test Categories Configuration
# Aligned with the test filter standardisation pattern across ROCm components.
#
# The CTestTestfile.cmake for rocprofiler-systems is generated by the pytest
# conftest (tests/pytest/conftest.py:_ctest_generate_tests).  At generate
# time the conftest reads this YAML and adds tier (quick/standard/
# comprehensive/full) and arch-exclude labels to each `set_tests_properties
# LABELS` block, so `ctest -L <tier>` works directly against the installed
# share/rocprofiler-systems/tests directory.
#
# Pattern semantics:
#   - `test_patterns` / `exclude` patterns are matched against the CTest
#     test name using Python `re.search` (substring regex match), mirroring
#     CTest's own `--tests-regex` semantics in the legacy TheRock script
#     test_rocprofiler_systems.py.
#   - `excluded_labels` lists pytest-marker-derived CTest labels (e.g. `mpi`,
#     `annotate`) that opt a test out of the tier even when its name matches.
#
# Source of truth for the always-excluded sets is the legacy
# TheRock/build_tools/.../test_executable_scripts/test_rocprofiler_systems.py
# (EXCLUDED_TESTS, EXCLUDED_LABELS, QUICK_TESTS_REGEX).  Keep this YAML and
# that script in sync until the legacy script is retired.

# Tier-agnostic always-excluded test name patterns (AIPROFSYST-441).
_common_excludes: &common_excludes
  - "transferbench-sys-run"
  - "fork.*"
  - "openmp-target.*"
  - "roctx-sampling"
  - "roctx-runtime-instrument"
  - "jacobi-usm-sys-run"
  - "jacobi-roctx.*"
  - "jpeg-decode.*"
  - "matrix-exponential.*"
  - "scratch-memory.*"
  - "selective-region-region-1-filter.*"
  - "selective-region-region-2-and-3.*"
  - "selective-region-no-marker-region-1-filter.*"
  - "shmem-pingpong.*"
  - "video-decode.*"

# Marker labels that opt a test out of the default CI tiers (heavy /
# environment-dependent suites).  These are already emitted as CTest LABELS
# by conftest based on pytest markers, so listing them here is enough to
# suppress the corresponding tier label injection.
_heavy_labels: &heavy_labels
  - "annotate"
  - "mpi"
  - "julia"
  - "attach"
  - "lulesh"
  - "network"
  - "overflow"
  - "thread_limit"

test_categories:
  quick:
    description: "Fast sanity checks (target: < 15 min) - subset of curated test families"
    # Mirrors QUICK_TESTS_REGEX from test_rocprofiler_systems.py.
    test_patterns:
      - "transpose.*"
      - "rocprofiler-systems.*"  # rocprof-sys-* binary smoke tests
      - "config.*"
      - "openmp.*"
      - "roctx.*"
      - "trace-time-window.*"
    exclude: *common_excludes
    excluded_labels: *heavy_labels
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Default PR tier (target: < 60 min) - mirrors legacy TEST_TYPE=full"
    # Everything that isn't always-broken and isn't tagged with a heavy marker.
    # Equivalent to the legacy `ctest --label-exclude annotate|mpi|...` default.
    test_patterns:
      - ".*"
    exclude: *common_excludes
    excluded_labels: *heavy_labels
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Nightly tier (target: < 7 hours) - includes mpi / lulesh / network / annotate"
    # Adds back the heavy markers excluded from the standard tier.  Still
    # honours the always-broken AIPROFSYST-441 exclude list.
    test_patterns:
      - ".*"
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Complete suite - everything that can run"
    test_patterns:
      - ".*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

# Optional: per-arch / per-OS exclusion of known-broken tests.  Empty for now;
# the conftest understands the `gfx<pattern>[_<os>]_exclude` label convention
# already honoured by TheRock test_runner.py.  Populate when AIPROFSYST tickets
# narrow a failure to a specific GPU family.
#
# Example shape:
# exclude_arch:
#   exclude_gpu_gfx950_linux:
#     test_patterns:
#       - "unified-memory-instrument"
#     labels:
#       - "gfx950_linux_exclude"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 900            # 15 minutes
    standard: 3600        # 60 minutes
    comprehensive: 25200  # 7 hours
    full: 28800           # 8 hours
