System Speed-of-Light:
  VALU FLOPs (FP16):
    rst: The total FP16 floating-point operations executed per second on the VALU.
    unit: GFLOP/s
  VALU FLOPs (FP32):
    rst: The total FP32 floating-point operations executed per second on the VALU.
    unit: GFLOP/s
  VALU FLOPs (FP64):
    rst: The total FP64 floating-point operations executed per second on the VALU.
    unit: GFLOP/s
  VALU IOPs:
    rst: The total integer operations executed per second on the VALU.
    unit: GIOP/s
  VALU Trans FLOPs (FP16):
    rst: The total FP16 transcendental (square root, reciprocal, trig) floating-point operations executed per second on the VALU.
    unit: GFLOP/s
  VALU Trans FLOPs (FP32):
    rst: The total FP32 transcendental (square root, reciprocal, trig) floating-point operations executed per second on the VALU.
    unit: GFLOP/s
  VALU Trans FLOPs (FP64):
    rst: The total FP64 transcendental (square root, reciprocal, trig) floating-point operations executed per second on the VALU.
    unit: GFLOP/s
  WMMA FLOPs (FP64):
    rst: The total number of FP64 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (FP32):
    rst: The total number of FP32 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (FP16):
    rst: The total number of FP16 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (BF16):
    rst: The total number of BF16 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (FP8):
    rst: The total number of FP8 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (MXFP8):
    rst: The total number of MXFP8 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (FP6):
    rst: The total number of FP6 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (FP4):
    rst: The total number of FP4 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA IOPs (Int8):
    rst: The total number of Int8 WMMA integer operations executed per second.
    unit: GIOP/s
  WMMA IOPs (Int4):
    rst: The total number of Int4 WMMA integer operations executed per second.
    unit: GIOP/s
  Active WGPs:
    rst: Average number of WGPs that had at least one active wavefront in a cycle.
    unit: Count
  IPC:
    rst: Average number of instructions per active WGP cycle.
    unit: Instructions per Cycle
  Wavefront Occupancy:
    rst: Average number of wavefronts in flight on GPU.
    unit: Wavefronts
  LDS Load Bandwidth:
    rst: The number of bytes per second read from the LDS into WGP registers.
    unit: GB/s
  LDS Store Bandwidth:
    rst: The number of bytes per second written from WGP registers to the LDS.
    unit: GB/s
  LDS Bank Conflicts per Access:
    rst: Number of LDS bank conflicts per LDS access.
    unit: Conflicts per Access
  GL0 Hit Rate:
    rst: Percentage of GL0 cache requests that hit in the cache.
    unit: Percent
  GL0 Cache Bandwidth:
    rst: The number of bytes per second loaded from, stored to, or atomically updated in the GL0 cache.
    unit: GB/s
  GL1A Utilization:
    rst: Percentage of cycles the GL1 Arbiter busy servicing GL0 miss requests.
    unit: Percent
  GL2 Cache Hit Rate:
    rst: Percentage of GL2 cache requests that hit in the cache.
    unit: Percent
  L2 Cache Bandwidth:
    rst: The number of bytes per second looked up in the L2 cache. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    unit: GB/s
  DRAM Read Bandwidth:
    rst: The number of bytes per second read from HBM (DRAM) through the EA.
    unit: GB/s
  DRAM Write Bandwidth:
    rst: The number of bytes per second written to HBM (DRAM) through the EA.
    unit: GB/s
  GL2 to DRAM Read Latency:
    rst: Average latency to read data from HBM to GL2.
    unit: Cycles
  GL2 to DRAM Write Latency:
    rst: Average latency to write data from GL2 to HBM.
    unit: Cycles
  sL1D Hit Rate (Excluding Duplicate Misses):
    rst: Percentage of sL1D requests that hit on a previously loaded line in the cache. Calculated as the number of sL1D hits over the number of hits and misses, excluding duplicate misses.
    unit: Percent
  sL1D Cache Bandwidth:
    rst: The number of bytes per second looked up in the sL1D cache.
    unit: GB/s
  L1I Hit Rate (Excluding Duplicate Misses):
    rst: Percentage of L1I requests that hit on a previously loaded line in the cache. Calculated as the number of L1I hits over the number of hits and misses, excluding duplicate misses.
    unit: Percent
  L1I Bandwidth:
    rst: The number of bytes per second looked up in the L1I cache.
    unit: GB/s
  Instruction Cache Fetch Latency:
    rst: Average latency to fetch instruction from GL1 to Instruction Cache.
    unit: Cycles
Memory chart - Instruction Cache:
  L1I Requests:
    rst: Total Instruction Cache fetch requests.
    unit: Requests per Normalization Unit
  ICache Utilization:
    rst: Percentage of shader-busy cycles the Instruction Cache is serving requests.
    unit: Percent
  L1I Hit Rate:
    rst: Percentage of Instruction Cache requests that hit in the cache.
    unit: Percent
  ICache Latency:
    rst: Average Instruction Cache request latency.
    unit: Cycles
  ICache Request Stall Rate:
    rst: Percentage of shader-busy cycles the instruction fetch unit is stalled.
    unit: Percent
  L1I-GL1 Read Bandwidth:
    rst: The number of bytes per second the instruction cache (L1I) requests from the GL1 cache. High values may indicate instruction cache pressure from large kernels or frequent instruction cache misses.
    unit: GB/s
  ICache-GL1 Request Latency:
    rst: Average latency of Instruction Cache requests sent to GL1.
    unit: Cycles
Memory chart - Scalar Data Cache:
  sL1D Requests:
    rst: Total Scalar Data Cache requests.
    unit: Requests per Normalization Unit
  Dcache Utilization:
    rst: Percentage of WGP cycles the Scalar Data Cache is serving requests.
    unit: Percent
  sL1D Hit Rate:
    rst: Percentage of Scalar Data Cache requests that hit in the cache.
    unit: Percent
  Dcache Latency:
    rst: Average Scalar Data Cache request latency.
    unit: Cycles
  Dcache Request Stall Rate:
    rst: Percentage of WGP cycles the SQC scalar cache is stalled.
    unit: Percent
  sL1D Load Bandwidth:
    rst: The number of bytes per second loaded by scalar memory instructions. The number of bytes is the number of dwords each instruction loads multiplied by four; bounds-check reductions are ignored.
    unit: GB/s
  sL1D-GL1 Read Bandwidth:
    rst: The number of bytes per second the scalar data cache (sL1D) reads from the GL1 cache. Scalar operations load uniform data shared across all threads in a wavefront, making efficient caching critical for performance.
    unit: GB/s
  Dcache-GL1 Request Latency:
    rst: Average latency of Scalar Data Cache requests sent to GL1.
    unit: Cycles
Memory chart - GL0 Cache (Vector L0):
  GL0 Utilization:
    rst: Percentage of GPU-active cycles (per WGP) the VMW cache controller is busy.
    unit: Percent
  GL0 Read Requests:
    rst: Number of GL0 read requests.
    unit: Requests per Normalization Unit
  GL0 Write Requests:
    rst: Number of GL0 write requests.
    unit: Requests per Normalization Unit
  GL0 Atomic Requests:
    rst: Number of GL0 atomic requests.
    unit: Requests per Normalization Unit
  GL0 Hit Rate:
    rst: Percentage of GL0 cache requests that hit in the cache.
    unit: Percent
  GL0 Total Requests:
    rst: Total GL0 cache requests.
    unit: Requests per Normalization Unit
  GL0 Request Latency:
    rst: Average GL0 cache request latency.
    unit: Cycles
Memory chart - LDS (Local Data Share):
  LDS Load Instructions:
    rst: Number of LDS load instructions processed by TXA.
    unit: Count per Normalization Unit
  LDS Store Instructions:
    rst: Number of LDS store instructions processed by TXA.
    unit: Count per Normalization Unit
  LDS Atomics Instructions:
    rst: Number of LDS atomic instructions processed by TXA.
    unit: Count per Normalization Unit
  TXA Async Load Instruction:
    rst: Number of async load instructions processed by TXA.
    unit: Count per Normalization Unit
  TXA Async Store Instruction:
    rst: Number of async store instructions processed by TXA.
    unit: Count per Normalization Unit
  LDS Utilization:
    rst: Percentage of VMW-busy cycles the LDS controller is executing an LDS operation.
    unit: Percent
  LDS Bank Conflict Stall Rate:
    rst: Percentage of VMW-busy cycles LDS is stalled due to bank conflict.
    unit: Percent
  LDS Load Bandwidth:
    rst: The number of bytes per second read from the LDS into WGP registers.
    unit: GB/s
  LDS Store Bandwidth:
    rst: The number of bytes per second written from WGP registers to the LDS.
    unit: GB/s
  LDS Atomic Bandwidth:
    rst: The number of bytes per second moved between the LDS and WGP registers by LDS atomic (read-modify-write) operations.
    unit: GB/s
  TXA Async Load Bandwidth:
    rst: The number of bytes per second loaded by asynchronous load operations.
    unit: GB/s
  TXA Async Store Bandwidth:
    rst: The number of bytes per second stored by asynchronous store operations.
    unit: GB/s
  TDM Load Bandwidth:
    rst: The number of bytes per second loaded by the TDM.
    unit: GB/s
  TDM Store Bandwidth:
    rst: The number of bytes per second stored by the TDM.
    unit: GB/s
  TDM Async Load Requests:
    rst: Number of TDM async load requests processed by TXA.
    unit: Count per Normalization Unit
  TDM Async Store Requests:
    rst: Number of TDM async store requests processed by TXA.
    unit: Count per Normalization Unit
  LDS Utilization - Load:
    rst: Percentage of VMW-busy cycles the LDS is executing a load.
    unit: Percent
  LDS Utilization - Store:
    rst: Percentage of VMW-busy cycles the LDS is executing a store.
    unit: Percent
  LDS Address Conflict Stall Rate:
    rst: Percentage of VMW-busy cycles LDS is stalled due to address conflict.
    unit: Percent
Memory chart - GL0-GL1 Interface:
  GL0-GL1 Read Bandwidth:
    rst: The number of bytes per second of read requests from the GL0 cache to the GL1 cache.
    unit: GB/s
  GL0-GL1 Write Bandwidth:
    rst: The number of bytes per second of write requests from the GL0 cache to the GL1 cache.
    unit: GB/s
  GL0-GL1 Atomic Bandwidth:
    rst: The number of bytes per second of atomic requests from the GL0 cache to the GL1 cache. Each request counts as 128 bytes.
    unit: GB/s
  GL1A Utilization:
    rst: Percentage of cycles the GL1 Arbiter busy servicing GL0 miss requests.
    unit: Percent
  GL1C Utilization:
    rst: Percentage of cycles the GL1 is processing requests.
    unit: Percent
  GL1C Buffer Full Stall:
    rst: Percentage of GL1-busy cycles GL1 is stalled due to no available buffer entries.
    unit: Percent
  GL0-GL1 Read Requests:
    rst: Number of GL0-GL1 read requests.
    unit: Requests per Normalization Unit
  GL0-GL1 Write Requests:
    rst: Number of GL0-GL1 write requests.
    unit: Requests per Normalization Unit
  GL0-GL1 Read Latency:
    rst: Average GL0-GL1 read latency.
    unit: Cycles
  GL0-GL1 Write Latency:
    rst: Average GL0-GL1 write latency.
    unit: Cycles
  GL0-GL1 Request Stall Rate:
    rst: Percentage of VMW-busy cycles GL0 is stalled sending requests to GL1.
    unit: Percent
Memory chart - GLARB (GL1-GL2 Arbiter):
  GLARBA Utilization:
    rst: Percentage of cycles the Graphics Level Arbiter is processing requests.
    unit: Percent
  GLARBC Utilization:
    rst: Percentage of cycles the Graphics Level Arbiter staging buffer is forwarding requests.
    unit: Percent
  GLARBC Buffer Full Stall:
    rst: Percentage of Graphics Level Arbiter busy cycles when it's stalled due to a full buffer.
    unit: Percent
  GL1C-GLARB Read Bandwidth:
    rst: The number of bytes per second of read requests from the GL1 cache to the Graphics Level Arbiter.
    unit: GB/s
  GL1C-GLARB Write Bandwidth:
    rst: The number of bytes per second of write requests from the GL1 cache to the Graphics Level Arbiter. The number of bytes is the number of 32-byte write data beats multiplied by 32.
    unit: GB/s
  GLARB-GL2 Read Bandwidth:
    rst: The number of bytes per second of read requests from the Graphics Level Arbiter to the GL2 cache.
    unit: GB/s
  GLARB-GL2 Write Bandwidth:
    rst: The number of bytes per second of write requests from the Graphics Level Arbiter to the GL2 cache.
    unit: GB/s
  GLARB-GL2 Atomic Bandwidth:
    rst: The number of bytes per second of atomic requests from the Graphics Level Arbiter to the GL2 cache. Each request counts as 64 bytes.
    unit: GB/s
  GLARBA Request Path Utilization:
    rst: Percentage of cycles the GL1 to Graphic Level Arbiter request path is busy.
    unit: Percent
  GLARBA Return Path Utilization:
    rst: Percentage of cycles the GL2 to GL1 return path is busy.
    unit: Percent
  GLARBA Request Latency:
    rst: Average latency of requests sent to the Graphics Level Arbiter.
    unit: Cycles
Memory chart - GL2 Cache (L2):
  GL2A Utilization:
    rst: Percentage of cycles the GL2 Arbiter is distributing requests across GL2 Cache partitions.
    unit: Percent
  GL2C Hit Rate:
    rst: Percentage of GL2 cache requests that hit in the cache.
    unit: Percent
  GL2-EA HBM Bandwidth - Read:
    rst: The number of bytes per second of read requests from the GL2 cache to HBM through the Efficiency Arbiter (EA). Each request counts as 32 bytes.
    unit: GB/s
  GL2-EA HBM Bandwidth - Write:
    rst: The number of bytes per second of write requests from the GL2 cache to HBM through the Efficiency Arbiter (EA). Each request counts as 32 bytes.
    unit: GB/s
  GL2-EA HBM Bandwidth - Atomic:
    rst: The number of bytes per second of atomic requests from the GL2 cache to HBM through the Efficiency Arbiter (EA). Each request counts as 32 bytes.
    unit: GB/s
Memory chart - EA to HBM:
  EA Utilization:
    rst: Percentage of cycles the Efficiency Arbiter is routing requests toward HBM, IO, or fabric.
    unit: Percent
  DRAM Read Bandwidth:
    rst: The number of bytes per second read from HBM (DRAM) through the EA.
    unit: GB/s
  DRAM Write Bandwidth:
    rst: The number of bytes per second written to HBM (DRAM) through the EA.
    unit: GB/s
  IO Read Bandwidth:
    rst: The number of bytes per second read from host CPU memory (pinned or mapped) through the EA.
    unit: GB/s
  IO Write Bandwidth:
    rst: The number of bytes per second written to host CPU memory (pinned or mapped) through the EA.
    unit: GB/s
  HDM Read Bandwidth:
    rst: The number of bytes per second read from Host Data Memory (unified memory pages) through the EA.
    unit: GB/s
  HDM Write Bandwidth:
    rst: The number of bytes per second written to Host Data Memory (unified memory pages) through the EA.
    unit: GB/s
  GMI Read Bandwidth:
    rst: The number of bytes per second read from peer GPU HBM over Infinity Fabric through the EA.
    unit: GB/s
  GMI Write Bandwidth:
    rst: The number of bytes per second written to peer GPU HBM over Infinity Fabric through the EA.
    unit: GB/s
  EA Stalled by SDP:
    rst: Percentage of EA-busy cycles where the EA has a request ready but cannot send it to the Scalable Data Port (SDP), the EA's link to the data fabric.
    unit: Percent
  Outstanding Requests:
    rst: Time-averaged total number of in-flight requests from EA to the SDP memory fabric. Higher outstanding counts hide memory latency by keeping HBM busy. Very high outstanding with EA stalls indicates request queues are backed up and the downstream memory controllers cannot accept requests fast enough.
    unit: Count
Memory chart - Workgroup Processors (WGPs):
  Wavefront Occupancy:
    rst: Resident :ref:`wavefronts <desc-wavefront>` per WGP, averaged over GPU-active cycles, as a percent of the maximum wavefronts per WGP.
    unit: Percent
  VGPRs:
    rst: 'The number of architected vector general-purpose registers allocated per wavefront. Note: this may not exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  SGPRs:
    rst: The number of scalar general-purpose registers (SGPRs) allocated per wavefront. On this architecture the hardware always allocates 128, whatever the kernel uses, so SGPRs do not limit occupancy.
    unit: Registers
  LDS Allocation:
    rst: 'The number of bytes of LDS memory (or, shared memory) allocated per :ref:`workgroup <desc-workgroup>`. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
    unit: Bytes per Workgroup
  Scratch Allocation per Wave:
    rst: 'The amount of scratch memory requested per :ref:`wavefront <desc-wavefront>`, in KB: the scratch bytes requested per :ref:`work-item <desc-work-item>` multiplied by the wavefront size. Scratch memory is used for stack memory on the accelerator, as well as for register spills and restores.'
    unit: KB per Wavefront
  Workgroups:
    rst: The number of :ref:`workgroups <desc-workgroup>` in the launch divided by the number of WGPs.
    unit: Workgroups per WGP
