SPI Utilization:
  SPI Utilization:
    rst: Percentage of GPU-busy cycles the SPI is dispatching workgroups.
    unit: Percent
SPI Wave Dispatch:
  Dispatched Workgroups:
    rst: Workgroups launched via successful SPI resource allocation (SPI_RA_REQ_ALLOC_sum). SPI_CSN_NUM_THREADGROUPS_sum is CS-pipe scoped and reads zero for gfx1250 compute dispatches.
    unit: Count
  Dispatched Waves:
    rst: Total wavefronts dispatched (SPI_ALL_WAVE_sum; SPI_CSN_WAVE_sum is CS-pipe scoped and reads zero for gfx1250 compute dispatches).
    unit: Count
  Dispatched Clusters:
    rst: Total cluster-level dispatches issued by SPI.
    unit: Count
  Dispatched Group-of-Groups:
    rst: Total group-of-groups dispatch operations issued by SPI.
    unit: Count
  Wave Dispatch Rate:
    rst: Average wavefronts launched per busy cycle.
    unit: Waves per Cycle
  Thread Dispatch Rate:
    rst: Average threads launched per busy cycle.
    unit: Threads per Cycle
  Per-SE Wave Occupancy:
    rst: Average wavefronts in-flight per Shader Engine.
    unit: Waves
  Per-SE Wave Life:
    rst: Average wavefront lifetime in cycles per Shader Engine.
    unit: Cycles
  Context Save Rate:
    rst: Percentage of SPI-busy cycles the GPU is saving wavefront contexts.
    unit: Percent
  Context Restore Rate:
    rst: Percentage of SPI-busy cycles the GPU is restoring wavefront contexts.
    unit: Percent
  Wave Dispatch FIFO Full Rate:
    rst: Percentage of SPI-busy cycles the wave dispatch FIFO is full.
    unit: Percent
SPI Resource Allocation:
  Resource No-Allocation Rate:
    rst: Percentage of SPI-busy cycles SPI failed to allocate resources for a workgroup.
    unit: Percent
  Resource Allocation Rate:
    rst: Percentage of SPI-busy cycles SPI successfully allocated resources and dispatched a workgroup.
    unit: Percent
  Alloc Failure - LDS Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed due to full LDS.
    unit: Percent
  Alloc Failure - Waveslots Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed due to full wavefront slots.
    unit: Percent
  Alloc Failure - VGPR Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed due to VGPR exhaustion.
    unit: Percent
  Alloc Failure - Barrier Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed due to full barrier slots.
    unit: Percent
  Alloc Failure - Bulky Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed because a bulky workgroup could not be placed.
    unit: Percent
  Alloc Failure - Named Barriers Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed due to named barrier exhaustion.
    unit: Percent
  Alloc Failure - Temp Space Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed due to exhausted scratch space.
    unit: Percent
