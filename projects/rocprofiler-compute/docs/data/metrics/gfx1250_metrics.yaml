WGP Wavefront Instruction Mix:
  Total Instructions:
    rst: Total instructions issued.
    unit: Count per Normalization Unit
  Instructions - Internal:
    rst: 'Number of internal SQ instructions issued: bookkeeping or other work that is not visible to the user.'
    unit: Count per Normalization Unit
  Instructions - VALU:
    rst: Number of VALU instructions issued. The VALU runs arithmetic and logic operations across all work-items in a wavefront. High VALU counts indicate compute-intensive kernels.
    unit: Count per Normalization Unit
  Instructions - SALU:
    rst: Number of SALU instructions issued. The SALU runs operations on values that are uniform across the wavefront. Efficient kernels often have a balance of VALU and SALU operations.
    unit: Count per Normalization Unit
  Instructions - SMEM:
    rst: Number of scalar memory (SMEM) instructions issued. SMEM loads constant and uniform data through the scalar cache. High counts may indicate heavy use of constant buffers or kernel arguments.
    unit: Count per Normalization Unit
  Instructions - Transcendental:
    rst: Number of transcendental VALU instructions issued. These are hardware approximations such as sin, cos and log on the VALU.
    unit: Count per Normalization Unit
  Instructions - Double Precision:
    rst: Number of double-precision VALU instructions issued.
    unit: Count per Normalization Unit
  Instructions - VMEM:
    rst: Number of vector memory (VMEM) instructions issued, including global, buffer and texture operations. High VMEM counts relative to VALU may indicate memory-bound workloads.
    unit: Count per Normalization Unit
  Instructions - LDS:
    rst: Number of LDS instructions issued, including FLAT instructions that resolve to LDS. It counts instructions, not data movement, so it does not distinguish reads from writes.
    unit: Count per Normalization Unit
