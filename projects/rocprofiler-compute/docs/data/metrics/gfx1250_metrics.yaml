  DRAM Read Bandwidth:
    rst: Total HBM read bandwidth.
    unit: GB/s
  DRAM Write Bandwidth:
    rst: Total HBM write bandwidth.
    unit: GB/s
  IO Read Bandwidth:
    rst: Total read bandwidth from host CPU memory (pinned or mapped) through the EA.
    unit: GB/s
  IO Write Bandwidth:
    rst: Total write bandwidth to host CPU memory (pinned or mapped) through the EA.
    unit: GB/s
  HDM Read Bandwidth:
    rst: Total read bandwidth from Host Data Memory (unified memory pages) through the EA.
    unit: GB/s
  HDM Write Bandwidth:
    rst: Total write bandwidth to Host Data Memory (unified memory pages) through the EA.
    unit: GB/s
  GMI Read Bandwidth:
    rst: Total read bandwidth from peer GPU HBM via Infinity Fabric.
    unit: GB/s
  GMI Write Bandwidth:
    rst: Total write bandwidth to peer GPU HBM via Infinity Fabric.
