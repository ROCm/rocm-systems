  EA Stall Rate:
    rst: Percentage of EA-busy cycles where the EA is stalled.
    unit: Percent
  Outstanding Requests:
    rst: Time-averaged total number of in-flight requests from EA to the SDP memory fabric. Higher outstanding counts hide memory latency by keeping HBM busy. Very high outstanding with EA stalls indicates request queues are backed up and the downstream memory controllers cannot accept requests fast enough.
    unit: Count
