  Performance (GFLOPs):
    rst: The total VALU and WMMA floating-point operations executed per second.
    unit: GFLOP/s
CPC Utilizations:
  CPC Utilization:
    rst: Percentage of GPU-active cycles the CPC is processing compute dispatch packets.
    unit: Percent
  CPC Micro-Engine Busy Dispatching Workgroups:
    rst: Percentage of CPC-busy cycles the micro-engine is sending dispatch commands to SPI.
    unit: Percent
  CPC ADC Pipe0 Busy Dispatching Workgroups:
    rst: Percentage of CPC-busy cycles Asynchronous Dispatch Controller pipe 0 is issuing workgroups to SPI.
    unit: Percent
  CPC ADC Pipe1 Busy Dispatching Workgroups:
    rst: Percentage of CPC-busy cycles Asynchronous Dispatch Controller pipe 1 is issuing workgroups to SPI.
    unit: Percent
  CPC ADC Pipe2 Busy Dispatching Workgroups:
    rst: Percentage of CPC-busy cycles Asynchronous Dispatch Controller pipe 2 is issuing workgroups to SPI.
    unit: Percent
  CPC ADC Pipe3 Busy Dispatching Workgroups:
    rst: Percentage of CPC-busy cycles Asynchronous Dispatch Controller pipe 3 is issuing workgroups to SPI.
    unit: Percent
SPI Utilization:
  SPI Utilization:
    rst: Percentage of GPU-busy cycles the SPI is dispatching workgroups.
    unit: Percent
SPI Wavefront Dispatch:
  Dispatched Workgroups:
    rst: Workgroups launched via successful SPI resource allocation (SPI_RA_REQ_ALLOC_sum). SPI_CSN_NUM_THREADGROUPS_sum is CS-pipe scoped and reads zero for gfx1250 compute dispatches.
    unit: Workgroups
  Dispatched Wavefronts:
    rst: Total wavefronts dispatched.
    unit: Wavefronts
  Dispatched Clusters:
    rst: Total cluster-level dispatches issued by SPI.
    unit: Count
  Dispatched Group-of-Groups:
    rst: Total group-of-groups dispatch operations issued by SPI.
    unit: Count
  Wavefront Dispatch Rate:
    rst: Average wavefronts launched per busy cycle.
    unit: Wavefronts per Cycle
  Thread Dispatch Rate:
    rst: Average threads launched per busy cycle.
    unit: Threads per Cycle
  Per-SE Wavefront Occupancy:
    rst: Average wavefronts in-flight per Shader Engine.
    unit: Wavefronts
  Per-SE Wavefront Life:
    rst: Average wavefront lifetime in cycles per Shader Engine.
    unit: Cycles
  Context Save Rate:
    rst: Percentage of SPI-busy cycles the GPU is saving wavefront contexts.
    unit: Percent
  Context Restore Rate:
    rst: Percentage of SPI-busy cycles the GPU is restoring wavefront contexts.
    unit: Percent
  Wavefront Dispatch FIFO Full Rate:
    rst: Percentage of SPI-busy cycles the wavefront dispatch FIFO is full.
    unit: Percent
SPI Resource Allocation:
  Resource No-Allocation Rate:
    rst: Percentage of SPI-busy cycles SPI failed to allocate resources for a workgroup.
    unit: Percent
  Resource Allocation Rate:
    rst: Percentage of SPI-busy cycles SPI successfully allocated resources and dispatched a workgroup.
    unit: Percent
  Allocation Failure - LDS Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed due to full LDS.
    unit: Percent
  Allocation Failure - Waveslots Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed due to full wavefront slots.
    unit: Percent
  Allocation Failure - VGPR Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed due to VGPR exhaustion.
    unit: Percent
  Allocation Failure - Barrier Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed due to full barrier slots.
    unit: Percent
  Allocation Failure - Bulky Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed because a bulky workgroup could not be placed.
    unit: Percent
  Allocation Failure - Named Barriers Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed due to named barrier exhaustion.
    unit: Percent
  Allocation Failure - Temp Space Full:
    rst: Percentage of SPI-busy cycles workgroup allocation failed due to exhausted scratch space.
    unit: Percent
SPI CPC-SPI Interface:
  Per-Queue Outstanding Dispatch Requests (P0_Q0_sum):
    rst: Average in-flight dispatch requests in CPC pipe 0, queue 0.
    unit: Requests
  Per-Queue Outstanding Dispatch Requests (P0_Q1_sum):
    rst: Average in-flight dispatch requests in CPC pipe 0, queue 1.
    unit: Requests
  Per-Queue Outstanding Dispatch Requests (P1_Q0_sum):
    rst: Average in-flight dispatch requests in CPC pipe 1, queue 0.
    unit: Requests
  Per-Queue Outstanding Dispatch Requests (P1_Q1_sum):
    rst: Average in-flight dispatch requests in CPC pipe 1, queue 1.
    unit: Requests
  CPC Pre-Allocation Request Stall Rate:
    rst: Percentage of SPI-busy cycles where SPI cannot accept new pre-allocation requests from CPC because its internal pre-allocation pipeline is full.
    unit: Percent
WGP Utilization:
  WGP Utilization:
    rst: Percentage of WGP clock cycles at least one wavefront is active.
    unit: Percent
  Wall Clock:
    rst: Total elapsed kernel clock cycles.
    unit: Cycles
  Active WGPs:
    rst: Average number of WGPs that had at least one active wavefront in a cycle.
    unit: Count
WGP Wavefront Launch Stats:
  Grid Size:
    rst: Total number of work-items in the dispatch grid.
    unit: Work-items
  Workgroup Size:
    rst: Number of work-items per workgroup.
    unit: Work-items
  VGPRs:
    rst: 'The number of architected vector general-purpose registers allocated per wavefront. Note: this may not exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  AGPRs:
    rst: Number of accumulation VGPRs allocated per wavefront.
    unit: Registers
  SGPRs:
    rst: The number of scalar general-purpose registers (SGPRs) allocated per wavefront. On this architecture the hardware always allocates 128, whatever the kernel uses, so SGPRs do not limit occupancy.
    unit: Registers
  LDS Allocation:
    rst: 'The number of bytes of LDS memory (or, shared memory) allocated per workgroup. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
