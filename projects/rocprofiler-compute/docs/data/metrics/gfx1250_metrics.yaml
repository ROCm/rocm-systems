    unit: GFLOP/s
  VALU Trans FLOPs (FP32):
    rst: The total FP32 transcendental (square root, reciprocal, trig) floating-point operations executed per second on the VALU.
    unit: GFLOP/s
  VALU Trans FLOPs (FP64):
    rst: The total FP64 transcendental (square root, reciprocal, trig) floating-point operations executed per second on the VALU.
    unit: GFLOP/s
  WMMA FLOPs (FP64):
    rst: The total number of FP64 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (FP32):
    rst: The total number of FP32 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (FP16):
    rst: The total number of FP16 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (BF16):
    rst: The total number of BF16 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (FP8):
    rst: The total number of FP8 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (MXFP8):
    rst: The total number of MXFP8 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (FP6):
    rst: The total number of FP6 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (FP4):
    rst: The total number of FP4 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA FLOPs (F6F4):
    rst: The total number of mixed FP6/FP4 WMMA floating-point operations executed per second.
    unit: GFLOP/s
  WMMA IOPs (Int8):
    rst: The total number of Int8 WMMA integer operations executed per second.
    unit: GIOP/s
  HBM Bandwidth:
    rst: The number of bytes per second read from and written to High-Bandwidth Memory (HBM). Its peak is the single-direction (read-only) bandwidth, so write-heavy or mixed kernels fall below it.
    unit: GB/s
  GL2 Cache Bandwidth:
    rst: The number of bytes per second transferred between the GL0 and GL1 caches by read, write, and atomic requests. Each request counts as 128 bytes.
    unit: GB/s
  GL0 Cache Bandwidth:
    rst: The number of bytes per second loaded from, stored to, or atomically updated in the GL0 cache.
    unit: GB/s
  Theoretical LDS Bandwidth:
    rst: The maximum number of bytes per second the LDS could have moved, from its active cycles without bank conflicts. It ignores the execution mask.
    unit: GB/s
  WMMA IOPs (Int4):
    rst: Achieved Int4 WMMA throughput.
    unit: GIOP/s
Roofline Plot Points:
  AI HBM:
    rst: Arithmetic intensity relative to HBM bandwidth.
    unit: FLOPs/Byte
  AI L2:
    rst: Arithmetic intensity relative to GL1 bandwidth.
