System Speed-of-Light:
  VALU Issue Rate:
    rst: Billions of VALU instruction issues per second. The counter includes floating-point and integer instructions and does not count FLOPs or active lanes. No percentage of FP32 peak is reported.
    unit: GInstr/s
  WMMA FLOPs (F16->F32 16x16x16):
    rst: Estimated matrix FLOPs per second, assuming FP16 inputs with FP32 accumulation for 16x16x16 matrices. The conversion of 8192 FLOPs per counter increment and peak of 1024 FLOPs/CU/cycle are provisional. The raw counter counts WMMA issues per vec32 and does not distinguish FP16, BF16, FP8, or BF8. A fixed wave32 FP16-to-FP32 16x16x16 diagnostic supports overlap with the general VALU instruction counter for that instruction. Counted wave population, other shapes/types, wave64 interpretation, and the applicable peak still require validation. Treat the FLOP conversion and percentage of peak as approximations.
    unit: GFLOP/s
  FP64 VALU Issue Rate:
    rst: Billions of double-precision VALU instruction issues per second. This is an instruction rate, without accounting for FLOPs per instruction or active lanes. No percentage of FP64 peak is reported.
    unit: GInstr/s
  IPC:
    rst: Instructions issued per busy SQ cycle, excluding internal instructions.
    unit: Instr/cycle
  Wavefront Occupancy:
    rst: Estimated average resident wave count over GPU-active cycles. Navi48 living-wave counter units and instance reduction still require validation; do not treat this as a validated occupancy or resource-limit measurement.
    unit: Wavefronts
  GL2 Cache Hit Rate:
    rst: Percentage of L2 lookups that hit.
    unit: Percent
  GL2-Fabric Read BW:
    rst: Size-weighted L2 read requests over its EA interface, from the configured 32, 64, 128, and 256-byte categories. Separate compressed request and data counters are not included; their overlap and byte coverage require qualification. Infinity Cache can serve this traffic, so it is not compared against the GDDR6 peak.
    unit: Bytes/s
  GL2-Fabric Write BW:
    rst: Size-weighted L2 write requests over its EA interface, from the configured 32, 64, 128, and 256-byte categories. Separate compressed request and data counters are not included; their overlap and byte coverage require qualification. Infinity Cache can absorb this traffic, so it is not compared against the GDDR6 peak.
    unit: Bytes/s
  LDS Bank Conflicts:
    rst: Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
    unit: Cycles
  Wave Dependency Wait:
    rst: Percentage of wave cycles spent waiting for anything, such as pending memory operations or prior instruction results.
    unit: Percent
  Wave Issue Wait:
    rst: Percentage of wave cycles spent waiting for any instruction to issue.
    unit: Percent
  GL0 Cache Hit Rate (TCP Cache):
    rst: Percentage of vector L0 cache line accesses that hit.
    unit: Percent
  GL0 Cache BW (TCP Cache):
    rst: Not available on gfx1201. The L0 counters give no access size.
    unit: Bytes/s
  GL1 Cache Hit Rate:
    rst: Not available in this gfx1201 configuration. No qualified GL1 data hit/miss measurement is collected for the Navi48 write-combining stage.
    unit: Percent
  GL1 Cache Read BW:
    rst: Bytes GL1 returned to its clients, from the physical 32-byte beats returned.
    unit: Bytes/s
  GL2 Cache BW:
    rst: Size-weighted uncompressed read requests measured at the GL2 output FIFOs, from the 32, 64, 128, and 256-byte categories. This request rate does not measure all L2 traffic or physical GDDR6 transfers. The percentage of peak uses the L2 interface width, not the GDDR6 peak.
    unit: Bytes/s
  Scalar Data Cache Hit Rate:
    rst: Percentage of scalar data cache requests that hit.
    unit: Percent
  Scalar Data Cache BW:
    rst: Bytes loaded by scalar memory instructions, from the dwords each instruction loads.
    unit: Bytes/s
  Instruction Cache Hit Rate:
    rst: Percentage of instruction cache requests that hit.
    unit: Percent
  Instruction Cache BW:
    rst: Not available on gfx1201. The instruction cache counters give no request size.
    unit: Bytes/s
Memory chart - Instruction Cache:
  ICache Requests:
    rst: Instruction cache requests from the SQ, normalized by the chosen unit.
    unit: Requests per Normalization Unit
  ICache Hit Rate:
    rst: Percentage of instruction cache requests that hit. The instruction cache is read-only and shared by the WGPs it serves.
    unit: Percent
  ICache-GL1 Read Bandwidth:
    rst: Not collected by this implementation. The instruction cache counters give no request size.
    unit: Bytes/s
Memory chart - Scalar Data Cache:
  DCache Requests:
    rst: Scalar data cache requests after bank serialization, normalized by the chosen unit.
    unit: Requests per Normalization Unit
  DCache Hit Rate:
    rst: Percentage of scalar data cache requests that hit. The scalar data cache is read-only.
    unit: Percent
  DCache Load Bandwidth:
    rst: Bytes loaded by scalar memory instructions, from the dwords each instruction loads. Bounds-check reductions are ignored.
    unit: Bytes/s
  DCache-GL1 Read Bandwidth:
    rst: Not collected by this implementation. The scalar data cache counters give no request size.
    unit: Bytes/s
Memory chart - GL0 Cache (Vector L0):
  GL0 Read Requests:
    rst: Read requests to the vector L0 cache (TCP), counted per cache line accessed.
    unit: Requests per Normalization Unit
  GL0 Write Requests:
    rst: Write requests to the vector L0 cache (TCP), counted per cache line accessed.
    unit: Requests per Normalization Unit
  GL0 Hit Rate:
    rst: Percentage of vector L0 cache line accesses that hit.
    unit: Percent
Memory chart - LDS (Local Data Share):
  LDS Req:
    rst: LDS instructions issued, including FLAT instructions that resolve to LDS. This counts instructions, not data, so it does not separate reads from writes.
    unit: Requests per Normalization Unit
  LDS Utilization:
    rst: Percentage of the LDS cycle budget across all CUs spent on indexed (non-direct, non-interpolation) accesses, over GPU-active cycles. Two CUs share a WGP's LDS, so a saturated LDS reads well below 100%.
    unit: Percent
  LDS Bank Conflict Rate:
    rst: LDS cycles stalled by bank conflicts, as a percentage of cycles LDS spent on indexed accesses.
    unit: Percent
  LDS Bandwidth:
    rst: LDS byte-access rate from load, store, and atomic dword counters, using four bytes per dword. Counter exposure and hardware normalization remain subject to Navi48 qualification.
    unit: Bytes/s
Memory chart - GL0-GL1 Interface:
  GL0-GL1 Read Bandwidth:
    rst: Bytes the vector L0 cache requested from GL1, from the 64-byte and 128-byte read request counts.
    unit: Bytes/s
  GL0-GL1 Write Bandwidth:
    rst: Not collected by this implementation. The GL0-GL1 write counters give no write size.
    unit: Bytes/s
Memory chart - GL1 Cache (L1):
  GL1 Utilization:
    rst: Percentage of GL1 cycles with a request pending. GL1 is a write-combining cache between the WGPs and L2.
    unit: Percent
  GL1 Request Credit Stall Rate:
    rst: Percentage of GL1 cycles stalled because GL1 had no L2 request credits.
    unit: Percent
  GL1 Data Credit Stall Rate:
    rst: Percentage of GL1 cycles stalled because GL1 had no L2 data credits.
    unit: Percent
  GL1 Buffer Full Stall Rate:
    rst: Percentage of GL1 cycles stalled because no buffer entry was free.
    unit: Percent
Memory chart - GL1-GL2 Interface:
  GL1-GL2 Read Bandwidth:
    rst: Bytes L2 returned to GL1, from the physical 32-byte beats returned.
    unit: Bytes/s
  GL1-GL2 Write Bandwidth:
    rst: Bytes GL1 wrote to L2, from the physical 32-byte data beats sent.
    unit: Bytes/s
Memory chart - GL2 Cache (L2):
  GL2 Utilization:
    rst: Percentage of L2 cycles with a request pending.
    unit: Percent
  GL2 Hit Rate:
    rst: Percentage of L2 lookups that hit.
    unit: Percent
  GL2-Fabric Read BW:
    rst: Bytes L2 read over its EA interface, from the 32, 64, 128, and 256-byte read request counts. This includes traffic the Infinity Cache serves.
    unit: Bytes/s
  GL2-Fabric Write BW:
    rst: Bytes L2 wrote over its EA interface, from the 32, 64, 128, and 256-byte write request counts. 64-byte requests include atomics.
    unit: Bytes/s
Memory chart - EA to DRAM:
  DRAM Read Requests:
    rst: L2 read requests over EA destined for DRAM. Infinity Cache can serve them before they reach GDDR6.
    unit: Requests per Normalization Unit
  DRAM Write Requests:
    rst: L2 write requests over EA destined for DRAM. Infinity Cache can absorb them before they reach GDDR6.
    unit: Requests per Normalization Unit
  DRAM Read Bandwidth:
    rst: Bytes L2 read over EA for requests destined for DRAM, in 32-byte units. Infinity Cache hits are included, so this can exceed the GDDR6 bandwidth peak.
    unit: Bytes/s
  DRAM Write Bandwidth:
    rst: Bytes L2 wrote over EA for requests destined for DRAM, in 32-byte units. Infinity Cache hits are included.
    unit: Bytes/s
Memory chart - Infinity Cache and GDDR6:
  Infinity Cache Hit Rate:
    rst: Not collected by this implementation. Memory-destined L2 traffic can be served by Infinity Cache; its hit rate cannot be inferred from that traffic.
    unit: Percent
  GDDR6 Read Bandwidth:
    rst: Not collected by this implementation. Memory-destined L2 read bandwidth includes Infinity Cache hits and does not measure traffic reaching GDDR6.
    unit: Bytes/s
  GDDR6 Write Bandwidth:
    rst: Not collected by this implementation. Memory-destined L2 write bandwidth does not measure traffic reaching GDDR6.
    unit: Bytes/s
Memory chart - Workgroup Processors (WGPs):
  Wavefront Occupancy:
    rst: Estimated resident waves relative to the configured maximum. Navi48 living-wave counter units, instance reduction, and WGP normalization still require validation; this is a provisional occupancy estimate.
    unit: Percent
  VGPR:
    rst: 'The number of architected vector general-purpose registers allocated for the kernel. Note: this may not exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  SGPR:
    rst: 'The number of scalar general-purpose registers allocated for the kernel. Note: this may not exactly match the number of SGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  LDS Allocation:
    rst: 'The number of bytes of LDS memory (or, shared memory) allocated per workgroup. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
    unit: Bytes per Workgroup
  Scratch Allocation:
    rst: 'The amount of scratch memory requested per wavefront, in KB: the scratch bytes requested per work-item multiplied by the wavefront size. Scratch memory is used for stack memory on the accelerator, as well as for register spills and restores.'
    unit: KB per Wave
  Workgroups:
    rst: The number of workgroups in the launch divided by the number of WGPs.
    unit: Workgroups per WGP
Roofline Performance Rates:
  VALU FLOPs (FP32):
    rst: Floating-point operations per second on the VALU, excluding WMMA instructions. Uses the aggregate VALU instruction counter, so it is an estimate rather than a precision-specific FLOP count.
    unit: GFLOP/s
  WMMA FLOPs (F16->F32):
    rst: Matrix operations per second at 8192 FLOPs per 16x16x16 WMMA instruction. The counter does not separate FP16, BF16, FP8, and BF8. The peak is the measured FP16 WMMA rate. BF8 has its own measured roof, V_WMMA_F32_16X16X16_BF8_BF8, at the same 8192 FLOPs per instruction.
    unit: GFLOP/s
  VALU FLOPs (F64):
    rst: 64-bit floating-point operations per second on the VALU.
    unit: GFLOP/s
  GL2 Cache BW:
    rst: Achieved bandwidth between the GL1 and GL2 caches.
    unit: Bytes/s
  GL1 Cache BW:
    rst: Achieved bandwidth between the GL0 (TCP Cache) and GL1 caches.
    unit: Bytes/s
  GL0 Cache BW (TCP Cache):
    rst: Achieved bandwidth at the GL0 vector cache (TCP Cache).
    unit: Bytes/s
  LDS BW:
    rst: Achieved bandwidth for Local Data Share memory operations.
    unit: Bytes/s
  GDDR6 BW:
    rst: Bandwidth of GL2C/EA read and write requests destined for DRAM, compared with the measured GDDR6 bandwidth. These requests are also served by the Infinity Cache, so a working set that fits in it can exceed this peak.
    unit: Bytes/s
  DRAM-Destined BW (Infinity Cache Peak):
    rst: Bandwidth of GL2C/EA read and write requests destined for DRAM, compared with the measured Infinity Cache bandwidth. No counter separates Infinity Cache hits from DRAM traffic.
    unit: Bytes/s
Roofline Plot Points:
  AI L2:
    rst: Arithmetic intensity relative to GL1-to-GL2 traffic.
    unit: FLOPs/Byte
  AI L1:
    rst: Arithmetic intensity relative to GL0-to-GL1 traffic.
    unit: FLOPs/Byte
  AI L0:
    rst: Arithmetic intensity relative to GL0 (TCP) requests.
    unit: FLOPs/Byte
  AI LDS:
    rst: Arithmetic intensity relative to Local Data Share traffic.
    unit: FLOPs/Byte
  AI GDDR6:
    rst: Arithmetic intensity relative to GL2C/EA requests destined for DRAM. The plot marks the point at the GDDR6 level. Compare it with both the GDDR6 roof and the Infinity Cache (MALL) roof, since those requests can hit in the Infinity Cache.
    unit: FLOPs/Byte
  Performance (GFLOPs):
    rst: Achieved VALU plus WMMA throughput in billions of floating-point operations per second.
    unit: GFLOP/s
