GL2 Cache Performance:
  GL2 Cache Hit Rate:
    rst: Percentage of L2 lookups that hit.
    unit: Percent
  GL2 Cache Hits:
    rst: L2 lookups that hit, normalized by the chosen unit.
    unit: Count per Normalization Unit
  GL2 Cache Misses:
    rst: L2 lookups that miss, normalized by the chosen unit.
    unit: Count per Normalization Unit
GRBM Metrics:
  GPU Busy:
    rst: Percentage of GRBM counted cycles with the GPU active.
    unit: Percent
