System Speed-of-Light:
  VALU Issue Rate:
    rst: Billions of VALU instruction issues per second. The counter includes floating-point and integer instructions and does not count FLOPs or active lanes. No percentage of FP32 peak is reported.
    unit: GInstr/s
  WMMA FLOPs (F16->F32 16x16x16):
    rst: Estimated matrix FLOPs per second, assuming FP16 inputs with FP32 accumulation for 16x16x16 matrices. The conversion of 8192 FLOPs per counter increment and peak of 1024 FLOPs/CU/cycle are provisional. The raw counter counts WMMA issues per vec32 and does not distinguish FP16, BF16, FP8, or BF8. A fixed wave32 FP16-to-FP32 16x16x16 diagnostic supports overlap with the general VALU instruction counter for that instruction. Counted wave population, other shapes/types, wave64 interpretation, and the applicable peak still require validation. Treat the FLOP conversion and percentage of peak as approximations.
    unit: GFLOP/s
  FP64 VALU Issue Rate:
    rst: Billions of double-precision VALU instruction issues per second. This is an instruction rate, without accounting for FLOPs per instruction or active lanes. No percentage of FP64 peak is reported.
    unit: GInstr/s
  IPC:
    rst: Instructions issued per busy SQ cycle, excluding internal instructions.
    unit: Instr/cycle
  Wavefront Occupancy:
    rst: Estimated average resident wave count over GPU-active cycles. Navi48 living-wave counter units and instance reduction still require validation; do not treat this as a validated occupancy or resource-limit measurement.
    unit: Wavefronts
  GL2 Cache Hit Rate:
    rst: Percentage of L2 lookups that hit.
    unit: Percent
  LDS Bank Conflicts:
    rst: Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
    unit: Cycles
  GL0 Cache Hit Rate (TCP Cache):
    rst: Percentage of vector L0 cache line accesses that hit.
    unit: Percent
  GL0 Cache BW (TCP Cache):
    rst: Not available on gfx1201. The L0 counters give no access size.
    unit: Bytes/s
  GL1 Cache Hit Rate:
    rst: Not available in this gfx1201 configuration. No qualified GL1 data hit/miss measurement is collected for the Navi48 write-combining stage.
    unit: Percent
  Scalar Data Cache Hit Rate:
    rst: Percentage of scalar data cache requests that hit.
    unit: Percent
  Scalar Data Cache BW:
    rst: Bytes loaded by scalar memory instructions, from the dwords each instruction loads.
    unit: Bytes/s
  Instruction Cache Hit Rate:
    rst: Percentage of instruction cache requests that hit.
    unit: Percent
  Instruction Cache BW:
    rst: Not available on gfx1201. The instruction cache counters give no request size.
    unit: Bytes/s
Memory chart - Instruction Cache:
  ICache Requests:
    rst: Instruction cache requests from the SQ, normalized by the chosen unit.
    unit: Requests per Normalization Unit
  ICache Hit Rate:
    rst: Percentage of instruction cache requests that hit. The instruction cache is read-only and shared by the WGPs it serves.
    unit: Percent
  ICache-GL1 Read Bandwidth:
    rst: Not collected by this implementation. The instruction cache counters give no request size.
    unit: Bytes/s
Memory chart - Scalar Data Cache:
  DCache Requests:
    rst: Scalar data cache requests after bank serialization, normalized by the chosen unit.
    unit: Requests per Normalization Unit
  DCache Hit Rate:
    rst: Percentage of scalar data cache requests that hit. The scalar data cache is read-only.
    unit: Percent
  DCache Load Bandwidth:
    rst: Bytes loaded by scalar memory instructions, from the dwords each instruction loads. Bounds-check reductions are ignored.
    unit: Bytes/s
  DCache-GL1 Read Bandwidth:
    rst: Not collected by this implementation. The scalar data cache counters give no request size.
    unit: Bytes/s
Memory chart - GL0 Cache (Vector L0):
  GL0 Hit Rate:
    rst: Percentage of vector L0 cache line accesses that hit.
    unit: Percent
Memory chart - LDS (Local Data Share):
  LDS Req:
    rst: LDS instructions issued, including FLAT instructions that resolve to LDS. This counts instructions, not data, so it does not separate reads from writes.
    unit: Requests per Normalization Unit
  LDS Utilization:
    rst: Percentage of the LDS cycle budget across all CUs spent on indexed (non-direct, non-interpolation) accesses, over GPU-active cycles. Two CUs share a WGP's LDS, so a saturated LDS reads well below 100%.
    unit: Percent
  LDS Bank Conflict Rate:
    rst: LDS cycles stalled by bank conflicts, as a percentage of cycles LDS spent on indexed accesses.
    unit: Percent
  LDS Bandwidth:
    rst: LDS byte-access rate from load, store, and atomic dword counters, using four bytes per dword. Counter exposure and hardware normalization remain subject to Navi48 qualification.
    unit: Bytes/s
Memory chart - GL2 Cache (L2):
  GL2 Hit Rate:
    rst: Percentage of L2 lookups that hit.
    unit: Percent
Memory chart - EA to DRAM:
  DRAM Read Requests:
    rst: L2 read requests over EA destined for DRAM. Infinity Cache can serve them before they reach VRAM.
    unit: Requests per Normalization Unit
  DRAM Write Requests:
    rst: L2 write requests over EA destined for DRAM. Infinity Cache can absorb them before they reach VRAM.
    unit: Requests per Normalization Unit
  DRAM Read Bandwidth:
    rst: Bytes L2 read over EA for requests destined for DRAM, in 32-byte units. Infinity Cache hits are included, so this can exceed the VRAM bandwidth peak.
    unit: Bytes/s
  DRAM Write Bandwidth:
    rst: Bytes L2 wrote over EA for requests destined for DRAM, in 32-byte units. Infinity Cache hits are included.
    unit: Bytes/s
Memory chart - Infinity Cache and VRAM:
  Infinity Cache Hit Rate:
    rst: Not collected by this implementation. Memory-destined L2 traffic can be served by Infinity Cache; its hit rate cannot be inferred from that traffic.
    unit: Percent
  VRAM Read Bandwidth:
    rst: Not collected by this implementation. Memory-destined L2 read bandwidth includes Infinity Cache hits and does not measure traffic reaching VRAM.
    unit: Bytes/s
  VRAM Write Bandwidth:
    rst: Not collected by this implementation. Memory-destined L2 write bandwidth does not measure traffic reaching VRAM.
    unit: Bytes/s
Memory chart - Workgroup Processors (WGPs):
  Wavefront Occupancy:
    rst: Estimated resident waves relative to the configured maximum. Navi48 living-wave counter units, instance reduction, and WGP normalization still require validation; this is a provisional occupancy estimate.
    unit: Percent
  VGPR:
    rst: 'The number of architected vector general-purpose registers allocated for the kernel. Note: this may not exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  SGPR:
    rst: 'The number of scalar general-purpose registers allocated for the kernel. Note: this may not exactly match the number of SGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  LDS Allocation:
    rst: 'The number of bytes of LDS memory (or, shared memory) allocated per workgroup. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
    unit: Bytes per Workgroup
  Scratch Allocation:
    rst: 'The amount of scratch memory requested per wavefront, in KB: the scratch bytes requested per work-item multiplied by the wavefront size. Scratch memory is used for stack memory on the accelerator, as well as for register spills and restores.'
    unit: KB per Wave
  Workgroups:
    rst: The number of workgroups in the launch divided by the number of WGPs.
    unit: Workgroups per WGP
Roofline Performance Rates:
  VALU FLOPs (FP32):
    rst: Floating-point operations per second on the VALU, excluding WMMA instructions. Uses the aggregate VALU instruction counter, so it is an estimate rather than a precision-specific FLOP count.
    unit: GFLOP/s
  WMMA FLOPs (F16->F32):
    rst: Matrix operations per second at 8192 FLOPs per 16x16x16 WMMA instruction. The counter does not separate FP16, BF16, FP8, and BF8. The peak is the measured FP16 WMMA rate. BF8 has its own measured roof, V_WMMA_F32_16X16X16_BF8_BF8, at the same 8192 FLOPs per instruction.
    unit: GFLOP/s
  VALU FLOPs (F64):
    rst: 64-bit floating-point operations per second on the VALU.
    unit: GFLOP/s
  GL0 Cache BW (TCP Cache):
    rst: Achieved bandwidth at the GL0 vector cache (TCP Cache).
    unit: Bytes/s
  LDS BW:
    rst: Achieved bandwidth for Local Data Share memory operations.
    unit: Bytes/s
  VRAM BW:
    rst: Bandwidth of GL2C/EA read and write requests destined for DRAM, compared with the measured VRAM bandwidth. These requests are also served by the Infinity Cache, so a working set that fits in it can exceed this peak.
    unit: Bytes/s
  DRAM-Destined BW (Infinity Cache Peak):
    rst: Bandwidth of GL2C/EA read and write requests destined for DRAM, compared with the measured Infinity Cache bandwidth. No counter separates Infinity Cache hits from DRAM traffic.
    unit: Bytes/s
Roofline Plot Points:
  AI L0:
    rst: Arithmetic intensity relative to GL0 (TCP) requests.
    unit: FLOPs/Byte
  AI LDS:
    rst: Arithmetic intensity relative to Local Data Share traffic.
    unit: FLOPs/Byte
  AI VRAM:
    rst: Arithmetic intensity relative to GL2C/EA requests destined for DRAM. The plot marks the point at the VRAM level. Compare it with both the VRAM roof and the Infinity Cache (MALL) roof, since those requests can hit in the Infinity Cache.
    unit: FLOPs/Byte
  Performance (GFLOPs):
    rst: Achieved VALU plus WMMA throughput in billions of floating-point operations per second.
    unit: GFLOP/s
Wave Dispatch Statistics:
  Compute Wave Dispatches:
    rst: Measured dispatched wave count, normalized by the chosen unit. Navi48 wave-count normalization still requires validation; this count need not match the application's launch geometry.
    unit: Count per Normalization Unit
  Wave Dispatch Rate:
    rst: Measured dispatched waves per GPU-active cycle. Navi48 wave-count normalization still requires validation; compare like workloads in the same performance state.
    unit: Waves/cycle
WGP Scalar Data Cache:
  Dcache Hit Rate:
    rst: Percentage of scalar data-cache requests that hit.
    unit: Percent
WGP Wavefront Dispatch:
  Dispatched Threads:
    rst: Measured valid work-items reported by the SQ counter. Navi48 work-item and wave-count normalization still require validation; this count need not match the application's launch geometry.
    unit: Threads
  Dispatched Waves:
    rst: Measured dispatched waves reported by the SQ counter. Navi48 wave-count normalization still requires validation; this count need not match the application's launch geometry.
    unit: Waves
WGP Wavefront Launch Stats:
  Grid Size:
    rst: Number of work-items in the dispatch grid, from dispatch metadata.
    unit: Work-items
  LDS Allocation:
    rst: Bytes of LDS allocated per workgroup, from dispatch metadata.
    unit: Bytes
  SGPRs:
    rst: Scalar general-purpose registers allocated for the kernel, from dispatch metadata. Allocation granularity can increase the reported value above the compiler's request.
    unit: Registers
  Scratch Allocation:
    rst: Bytes of scratch memory allocated per work-item, from dispatch metadata.
    unit: Bytes per Work-item
  VGPRs:
    rst: Architectural vector general-purpose registers allocated for the kernel, from dispatch metadata. Allocation granularity can increase the reported value above the compiler's request.
    unit: Registers
  Workgroup Size:
    rst: Number of work-items per workgroup, from dispatch metadata.
    unit: Work-items
WGP Instruction Cache:
  Icache Hit Rate:
    rst: Percentage of instruction-cache requests that hit.
    unit: Percent
WGP VMEM Instruction Mix:
  Instructions - Flat Load:
    rst: Issued flat-addressed load instructions, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Instructions - Flat Store:
    rst: Issued flat-addressed store instructions, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Instructions - TEX Load:
    rst: Issued buffer loads, image loads, samples, and atomics with a return value, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Instructions - TEX Store:
    rst: Issued buffer stores, image stores, and atomics without a return value, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Instructions - VMEM Flat:
    rst: Issued flat-addressed vector memory instructions, normalized by the chosen unit.
    unit: Count per Normalization Unit
WGP Wavefront Instruction Mix:
  Instructions - Internal:
    rst: Issued internal instructions, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Instructions - LDS:
    rst: Issued LDS instructions, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Instructions - SALU:
    rst: Issued scalar arithmetic instructions, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Instructions - SMEM:
    rst: Issued scalar memory instructions, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Instructions - Transcendental:
    rst: Issued transcendental vector arithmetic instructions, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Instructions - VALU:
    rst: Issued vector arithmetic instructions, normalized by the chosen unit. The counter includes integer and floating-point instructions.
    unit: Count per Normalization Unit
  Instructions - VMEM:
    rst: Issued vector memory instructions, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Total Instructions:
    rst: Total issued instructions, normalized by the chosen unit.
    unit: Count per Normalization Unit
WGP LDS Instruction Mix:
  LDS Direct Load Instructions:
    rst: Issued LDS direct-load instructions reported by the counter, normalized by the chosen unit.
    unit: Count per Normalization Unit
  LDS Parameter Load Instructions:
    rst: Issued LDS parameter-load instructions reported by the counter, normalized by the chosen unit.
    unit: Count per Normalization Unit
  WAVE32 LDS Parameter Load Instructions:
    rst: Not available on gfx1201. This configuration does not collect the WAVE32 LDS parameter-load instruction counter.
    unit: Count per Normalization Unit
WGP VALU Instruction Mix:
  SQ_INSTS_VALU:
    rst: Raw vector arithmetic instruction count. This includes integer and floating-point instructions and is not a FLOP count.
    unit: Instructions
  SQ_INST_CYCLES_VALU:
    rst: SDK-reported aggregate SIMD execution-cycle count for VALU operations. Overlapping V_OP32_1 and V_OP32_T instructions count separately. The counted instance and wave population still require qualification; this is not elapsed GPU time, a FLOP count, or a utilization percentage.
    unit: Cycles
WGP WMMA Instruction FLOPs and IOPs Counting:
  SQ_INST_CYCLES_VALU_WMMA:
    rst: Raw count of work cycles sent for WMMA reported by the SDK counter. Its conversion to instruction counts or FLOPs requires validation.
    unit: Cycles
  SQ_WMMA_VALU_INSTS:
    rst: Raw WMMA vector instruction count. The aggregate counter does not distinguish FP16, BF16, FP8, and BF8, and its wave-size interpretation requires validation.
    unit: Instructions
WGP Utilization:
  WGP Utilization:
    rst: Average SQ busy-cycle count relative to GPU-active cycles, expressed as a percentage. Navi48 counter-instance reduction requires validation.
    unit: Percent
WGP Instruction Issue Stalls:
  Wait for Barrier:
    rst: Not available on gfx1201 while wait-counter units and instance reduction are being validated.
    unit: Percent
  Wait for Counter:
    rst: Not available on gfx1201 while wait-counter units and instance reduction are being validated.
    unit: Percent
  Wait for Instruction Fetch:
    rst: Not available on gfx1201 while wait-counter units and instance reduction are being validated.
    unit: Percent
  Wait for Any:
    rst: Not available on gfx1201 while wait-counter normalization is being validated. Average, minimum and maximum wait percentages cannot yet be determined reliably.
    unit: Percent
WGP Wavefront Life:
  Wave Life:
    rst: Estimated average wave lifetime from accumulated living-wave cycles divided by measured dispatched waves. Navi48 counter units, instance reduction, and wave-count normalization still require validation.
    unit: Cycles
GL0 Cache Performance:
  Hit Rate:
    rst: Percentage of TCP requests that do not miss in the vector GL0 cache.
    unit: Percent
GL0 Request Statistics:
  Miss Requests:
    rst: Vector GL0 cache requests reported as misses, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Total Requests:
    rst: Total vector GL0 cache requests, normalized by the chosen unit.
    unit: Count per Normalization Unit
GL0 Stalls:
  TA Req Stall:
    rst: TCP request-stall counter toward the texture addresser, normalized by the chosen unit.
    unit: Cycles per Normalization Unit
GL1A Processing:
  Hit Rate:
    rst: Not available on gfx1201. The write-combining GL1 stage has no hit-rate measurement in this configuration.
    unit: Percent
GL1 Cache Request Statistics:
  Miss Requests:
    rst: Not available on gfx1201. This configuration does not collect GL1 miss-request counters.
    unit: Count per Normalization Unit
  Total Requests:
    rst: Total GL1 requests, normalized by the chosen unit.
    unit: Count per Normalization Unit
GL2 Cache Request Statistics:
  Total Requests:
    rst: L2 requests, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Read Requests:
    rst: L2 read requests, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Write Requests:
    rst: L2 write requests, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Atomic Requests:
    rst: L2 atomic requests, normalized by the chosen unit.
    unit: Count per Normalization Unit
  EA Read Requests (DRAM):
    rst: L2 read requests over EA destined for memory. Infinity Cache can serve these requests before they reach VRAM.
    unit: Count per Normalization Unit
  EA Write Requests (DRAM):
