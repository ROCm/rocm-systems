WGP VALU Instruction Mix:
  SQ_INSTS_VALU:
    rst: Raw vector arithmetic instruction count. This includes integer and floating-point instructions and is not a FLOP count.
    unit: Instructions
  SQ_INST_CYCLES_VALU:
    rst: SDK-reported aggregate SIMD execution-cycle count for VALU operations. Overlapping V_OP32_1 and V_OP32_T instructions count separately. The counted instance and wave population still require qualification; this is not elapsed GPU time, a FLOP count, or a utilization percentage.
    unit: Cycles
WGP WMMA Instruction FLOPs and IOPs Counting:
  SQ_INST_CYCLES_VALU_WMMA:
    rst: Raw count of work cycles sent for WMMA reported by the SDK counter. Its conversion to instruction counts or FLOPs requires validation.
    unit: Cycles
  SQ_WMMA_VALU_INSTS:
    rst: Raw WMMA vector instruction count. The aggregate counter does not distinguish FP16, BF16, FP8, and BF8, and its wave-size interpretation requires validation.
    unit: Instructions
WGP Utilization:
  WGP Utilization:
    rst: Average SQ busy-cycle count relative to GPU-active cycles, expressed as a percentage. Navi48 counter-instance reduction requires validation.
