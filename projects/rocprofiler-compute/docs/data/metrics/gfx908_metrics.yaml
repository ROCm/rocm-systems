System Speed-of-Light:
  Theoretical LDS Bandwidth:
    plain: The maximum number of bytes per second the LDS could have moved, from its active cycles without bank conflicts. It ignores the execution mask.
    rst: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS per unit time (see :ref:`LDS Bandwidth <lds-bandwidth>` example for more detail). This is also presented as a percent of the peak theoretical F64 MFMA operations achievable on the specific accelerator.
    unit: GB/s
  vL1D Cache Bandwidth:
    plain: The number of bytes per second looked up in the vL1D cache by VMEM instructions. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    rst: The number of bytes looked up in the vL1D cache as a result of :ref:`VMEM <desc-vmem>` instructions per unit time. The number of bytes is calculated as the number of cache lines requested multiplied by the cache line size. This value does not consider partial requests, so e.g., if only a single value is requested in a cache line, the data movement will still be counted as a full cache line. This is also presented as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
    unit: GB/s
  L2 Cache Bandwidth:
    plain: The number of bytes per second looked up in the L2 cache. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    rst: The number of bytes per second looked up in the L2 cache. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    unit: GB/s
  L2-Fabric Read Bandwidth:
    plain: The number of bytes per second read by the L2 over the Infinity Fabric interface.
    rst: The number of bytes read by the L2 over the :ref:`Infinity Fabric\u2122 interface <l2-fabric>` per unit time. This is also presented as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
    unit: GB/s
  L2-Fabric Write and Atomic Bandwidth:
    plain: The number of bytes per second sent by the L2 over the Infinity Fabric interface by write and atomic operations. Infinity Fabric considers a request atomic only if it targets non-write-cacheable memory, for example, fine-grained or uncached memory allocations.
    rst: The number of bytes sent by the L2 over the :ref:`Infinity Fabric interface <l2-fabric>` by write and atomic operations per unit time. This is also presented as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
    unit: GB/s
  Kernel Time:
    plain: The total duration of the executed kernel.
    rst: The total duration of the executed kernel.
    unit: Nanoseconds
  Kernel Time (Cycles):
    plain: The total duration of the executed kernel in cycles.
    rst: The total duration of the executed kernel in cycles.
    unit: Cycles
  CU Utilization:
    plain: Percentage of total SIMD cycles in the kernel where any SIMD on a CU was actively doing any work, summed over all CUs. Low values (less than 100%) indicate that the accelerator was not fully saturated by the kernel, or a potential load-imbalance issue.
    rst: The percent of :ref:`total SIMD cycles <total-simd-cycles>` in the kernel where any :ref:`SIMD <desc-valu>` on a CU was actively doing any work, summed over all CUs. Low values (less than 100%) indicate that the accelerator was not fully saturated by the kernel, or a potential load-imbalance issue.
    unit: Percent
  SALU Utilization:
    plain: Percentage of the kernel's duration the SALU was busy executing instructions. Computed as the ratio of the total number of cycles spent by the scheduler issuing SALU or SMEM instructions over the total CU cycles.
    rst: Indicates what percent of the kernel's duration the :ref:`SALU <desc-salu>` was busy executing instructions. Computed as the ratio of the total number of cycles spent by the :ref:`scheduler <desc-scheduler>` issuing SALU / :ref:`SMEM <desc-smem>` instructions over the :ref:`total CU cycles <total-cu-cycles>`.
    unit: Percent
  VALU Utilization:
    plain: Percentage of the kernel's duration the VALU was busy executing instructions. Does not include VMEM operations. Computed as the ratio of the total number of cycles spent by the scheduler issuing VALU instructions over the total CU cycles.
    rst: Indicates what percent of the kernel's duration the :ref:`VALU <desc-valu>` was busy executing instructions. Does not include :ref:`VMEM <desc-vmem>` operations. Computed as the ratio of the total number of cycles spent by the :ref:`scheduler <desc-scheduler>` issuing VALU instructions over the :ref:`total CU cycles <total-cu-cycles>`.
    unit: Percent
  IPC:
    plain: The ratio of the total number of instructions executed on the CU over the total active CU cycles.
    rst: The ratio of the total number of instructions executed on the :doc:`CU <compute-unit>` over the :ref:`total active CU cycles <total-active-cu-cycles>`.
    unit: Instructions per Cycle
  vL1D Utilization:
    plain: Percentage of vL1D active cycles the vL1D Cache RAM was actively processing any request. This indicates how busy the vL1D Cache RAM was during the kernel execution.
    rst: Percentage of vL1D active cycles the vL1D Cache RAM was actively processing any request. This indicates how busy the vL1D Cache RAM was during the kernel execution.
    unit: Percent
  LDS Utilization:
    plain: Percentage of the total CU cycles the LDS was actively executing instructions (including, but not limited to, load, store, atomic and HIP's __shfl operations). Calculated as the ratio of the total number of cycles LDS was active over the total CU cycles.
    rst: Percentage of the total CU cycles the LDS was actively executing instructions (including, but not limited to, load, store, atomic and HIP's __shfl operations). Calculated as the ratio of the total number of cycles LDS was active over the total CU cycles.
    unit: Percent
  L2 Cache Hit Rate:
    plain: Percentage of incoming cache line requests to the L2 cache that hit in the L2 cache. A low rate (<50%) indicates that the workload exceeds the L2 cache capacity, leading to high memory traffic.
    rst: Percentage of incoming cache line requests to the L2 cache that hit in the L2 cache. A low rate (<50%) indicates that the workload exceeds the L2 cache capacity, leading to high memory traffic.
    unit: Percent
  L2 Utilization:
    plain: Percentage of total L2 cycles an L2 channel was active, summed over all L2 channels on the accelerator.
    rst: Percentage of total L2 cycles an L2 channel was active, summed over all L2 channels on the accelerator.
    unit: Percent
  sL1D Cache Bandwidth:
    plain: The number of bytes per second looked up in the sL1D cache.
    rst: The number of bytes per second looked up in the sL1D cache.
    unit: GB/s
  sL1D Hit Rate (Excluding Duplicate Misses):
    plain: Percentage of sL1D requests that hit on a previously loaded line in the cache. Calculated as the number of sL1D hits over the number of hits and misses, excluding duplicate misses.
    rst: Percentage of sL1D requests that hit on a previously loaded line in the cache. Calculated as the number of sL1D hits over the number of hits and misses, excluding duplicate misses.
    unit: Percent
  L1I Hit Rate (Excluding Duplicate Misses):
    plain: Percentage of L1I requests that hit on a previously loaded line in the cache. Calculated as the number of L1I hits over the number of hits and misses, excluding duplicate misses.
    rst: The percent of L1I requests that hit on a previously loaded line the cache. Calculated as the ratio of the number of L1I requests that hit over the number of all L1I requests.
    unit: Percent
  L1I Bandwidth:
    plain: The number of bytes per second looked up in the L1I cache.
    rst: The number of bytes looked up in the L1I cache per unit time. This is also presented as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
    unit: GB/s
  Address Processing Unit Busy:
    plain: Percentage of the total CU cycles the address processor was busy.
    rst: Percentage of the total CU cycles the address processor was busy.
    unit: Percent
  Data-Return Busy:
    plain: Percentage of the total CU cycles the data-return unit was busy processing or waiting on data to return to the CU.
    rst: Percentage of the total CU cycles the data-return unit was busy processing or waiting on data to return to the CU.
    unit: Percent
  L1I-L2 Bandwidth:
    plain: The number of bytes per second transferred across L1I - L2 interface.
    rst: The number of bytes per second transferred across L1I - L2 interface.
    unit: GB/s
  sL1D-L2 Bandwidth:
    plain: The number of bytes per second read from, written to, or atomically updated across the sL1D<->L2 interface. Note that sL1D writes and atomics are typically unused on current CDNA accelerators, so in the majority of cases this can be interpreted as an sL1D->L2 read bandwidth.
    rst: The number of bytes per second read from, written to, or atomically updated across the sL1D<->L2 interface. Note that sL1D writes and atomics are typically unused on current CDNA accelerators, so in the majority of cases this can be interpreted as an sL1D->L2 read bandwidth.
    unit: GB/s
  VALU Active Threads:
    plain: Indicates the average level of divergence within a wavefront over the lifetime of the kernel. The number of work-items that were active in a wavefront during execution of each VALU instruction, time-averaged over all VALU instructions run on all wavefronts in the kernel.
    rst: Indicates the average level of :ref:`divergence <desc-divergence>` within a wavefront over the lifetime of the kernel. The number of work-items that were active in a wavefront during execution of each :ref:`VALU <desc-valu>` instruction, time-averaged over all VALU instructions run on all wavefronts in the kernel.
    unit: Work-items
  Wavefront Occupancy:
    plain: 'The time-averaged number of wavefronts resident on the accelerator over the lifetime of the kernel. Note: this metric may be inaccurate for short-running kernels (less than 1ms).'
    rst: 'The time-averaged number of wavefronts resident on the accelerator over the lifetime of the kernel. Note: this metric may be inaccurate for short-running kernels (less than 1ms).'
    unit: Wavefronts
  LDS Bank Conflicts per Access:
    plain: The ratio of the number of cycles spent in the LDS scheduler due to bank conflicts (as determined by the conflict resolution hardware) to the base number of cycles that would be spent in the LDS scheduler in a completely uncontended case. This is the unnormalized form of the Bank Conflict Rate.
    rst: The ratio of the number of cycles spent in the :doc:`LDS scheduler <local-data-share>` due to bank conflicts (as determined by the conflict resolution hardware) to the base number of cycles that would be spent in the LDS scheduler in a completely uncontended case. This is also presented in normalized form (i.e., the Bank Conflict Rate).
    unit: Conflicts per Access
  vL1D Cache Hit Rate:
    plain: Percentage of cache line requests to the vL1D Cache RAM that hit in the vL1D cache. Calculated as 100 minus the percent of requests that were sent to the L2.
    rst: The ratio of the number of vL1D cache line requests that hit in vL1D cache over the total number of cache line requests to the :ref:`vL1D cache RAM <desc-tc>`.
    unit: Percent
  L2-Fabric Read Latency:
    plain: The time-averaged number of cycles read requests spent in Infinity Fabric before data was returned to the L2.
    rst: The time-averaged number of cycles read requests spent in Infinity Fabric before data was returned to the L2.
    unit: Cycles
  L2-Fabric Write and Atomic Latency:
    plain: The time-averaged number of cycles write requests spent in Infinity Fabric before a completion acknowledgement was returned to the L2.
    rst: The time-averaged number of cycles write requests spent in Infinity Fabric before a completion acknowledgement was returned to the L2.
    unit: Cycles
  L1I Fetch Latency:
    plain: The average number of cycles spent to fetch instructions to a CU.
    rst: The average number of cycles spent to fetch instructions to a :doc:`CU <compute-unit>`.
    unit: Cycles
  VALU FLOPs:
    plain: 'The total floating-point operations executed per second on the VALU. This is also presented as a percent of the peak theoretical FLOPs achievable on the specific accelerator. Note: this does not include any floating-point operations from MFMA instructions.'
    rst: 'The total floating-point operations executed per second on the :ref:`VALU <desc-valu>`. This is also presented as a percent of the peak theoretical FLOPs achievable on the specific accelerator. Note: this does not include any floating-point operations from :ref:`MFMA <desc-mfma>` instructions.'
    unit: GFLOP/s
  MFMA FLOPs (BF16):
    plain: 'The total number of 16-bit brain floating point MFMA operations executed per second. Note: this does not include any 16-bit brain floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical BF16 MFMA operations achievable on the specific accelerator.'
    rst: 'The total number of 16-bit brain floating point MFMA operations executed per second. Note: this does not include any 16-bit brain floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical BF16 MFMA operations achievable on the specific accelerator.'
    unit: GFLOP/s
  MFMA FLOPs (F16):
    plain: 'The total number of 16-bit floating point MFMA operations executed per second. Note: this does not include any 16-bit floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F16 MFMA operations achievable on the specific accelerator.'
    rst: 'The total number of 16-bit floating point MFMA operations executed per second. Note: this does not include any 16-bit floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F16 MFMA operations achievable on the specific accelerator.'
    unit: GFLOP/s
  MFMA FLOPs (F32):
    plain: 'The total number of 32-bit floating point MFMA operations executed per second. Note: this does not include any 32-bit floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F32 MFMA operations achievable on the specific accelerator.'
    rst: 'The total number of 32-bit floating point MFMA operations executed per second. Note: this does not include any 32-bit floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F32 MFMA operations achievable on the specific accelerator.'
    unit: GFLOP/s
  MFMA FLOPs (F64):
    plain: 'The total number of 64-bit floating point MFMA operations executed per second. Note: this does not include any 64-bit floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F64 MFMA operations achievable on the specific accelerator.'
    rst: 'The total number of 64-bit floating point MFMA operations executed per second. Note: this does not include any 64-bit floating point operations from VALU instructions. This is also presented as a percent of the peak theoretical F64 MFMA operations achievable on the specific accelerator.'
    unit: GFLOP/s
  MFMA IOPs (Int8):
    plain: 'The total number of 8-bit integer MFMA operations executed per second. Note: this does not include any 8-bit integer operations from VALU instructions. This is also presented as a percent of the peak theoretical INT8 MFMA operations achievable on the specific accelerator.'
    rst: 'The total number of 8-bit integer MFMA operations executed per second. Note: this does not include any 8-bit integer operations from VALU instructions. This is also presented as a percent of the peak theoretical INT8 MFMA operations achievable on the specific accelerator.'
    unit: GIOP/s
  MFMA Utilization:
    plain: Indicates what percent of the kernel's duration the MFMA unit was busy executing instructions. Computed as the ratio of the total number of cycles the MFMA was busy over the total CU cycles.
    rst: Indicates what percent of the kernel's duration the :ref:`MFMA <desc-mfma>` unit was busy executing instructions. Computed as the ratio of the total number of cycles spent by the :ref:`MFMA <desc-salu>` was busy over the :ref:`total CU cycles <total-cu-cycles>`.
    unit: Percent
  VMEM Utilization:
    plain: Indicates what percent of the kernel's duration the VMEM unit was busy executing instructions, including both global/generic and spill/scratch operations (see the VMEM instruction count metrics) for more detail). Does not include VALU operations. Computed as the ratio of the total number of cycles spent by the scheduler issuing VMEM instructions over the total CU cycles.
    rst: Indicates what percent of the kernel's duration the :ref:`VMEM <desc-vmem>` unit was busy executing instructions, including both global/generic and spill/scratch operations (see the :ref:`VMEM instruction count metrics <ta-instruction-counts>` for more detail). Does not include :ref:`VALU <desc-valu>` operations. Computed as the ratio of the total number of cycles spent by the :ref:`scheduler <desc-scheduler>` issuing VMEM instructions over the :ref:`total CU cycles <total-cu-cycles>`.
    unit: Percent
  Branch Utilization:
    plain: Indicates what percent of the kernel's duration the branch unit was busy executing instructions. Computed as the ratio of the total number of cycles spent by the scheduler issuing branch instructions over the total CU cycles
    rst: Indicates what percent of the kernel's duration the :ref:`branch <desc-branch>` unit was busy executing instructions. Computed as the ratio of the total number of cycles spent by the :ref:`scheduler <desc-scheduler>` issuing branch instructions over the :ref:`total CU cycles <total-cu-cycles>`.
    unit: Percent
Memory chart:
  Wavefront Occupancy:
    plain: Percentage of the maximum wavefronts per CU that are resident on active CUs, averaged over GPU-active cycles.
    rst: Resident :ref:`wavefronts <desc-wavefront>` per active :doc:`CU <compute-unit>`, averaged over GPU-active cycles, as a percent of the maximum wavefronts per CU.
    unit: Percent
  VGPRs:
    plain: 'The number of architected vector general-purpose registers allocated per wavefront. Note: this may not exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
    rst: 'The number of architected vector general-purpose registers allocated for the kernel, see :ref:`VALU <desc-valu>`. Note: this may not exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  SGPRs:
    plain: 'The number of scalar general-purpose registers allocated per wavefront. Note: this may not exactly match the number of SGPRs requested by the compiler due to allocation granularity.'
    rst: 'The number of scalar general-purpose registers allocated for the kernel, see :ref:`SALU <desc-salu>`. Note: this may not exactly match the number of SGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  LDS Allocation:
    plain: 'The number of bytes of LDS memory (or, shared memory) allocated per workgroup. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
    rst: 'The number of bytes of :ref:`LDS <desc-lds>` memory (or, shared memory) allocated per :ref:`workgroup <desc-workgroup>`. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
    unit: Bytes per Workgroup
  Scratch Allocation per Wave:
    plain: 'The amount of scratch memory requested per wavefront, in KB: the scratch bytes requested per work-item multiplied by the wavefront size. Scratch memory is used for stack memory on the accelerator, as well as for register spills and restores.'
    rst: 'The amount of scratch memory requested per :ref:`wavefront <desc-wavefront>`, in KB: the scratch bytes requested per :ref:`work-item <desc-work-item>` multiplied by the wavefront size. Scratch memory is used for stack memory on the accelerator, as well as for register spills and restores.'
    unit: KB per Wavefront
  Workgroups per CU:
    plain: The number of workgroups in the launch divided by the number of active CUs.
    rst: The number of :ref:`workgroups <desc-workgroup>` in the launch divided by the number of active :doc:`CUs <compute-unit>`.
    unit: Workgroups per CU
  TA Global/Generic Read Instructions:
    plain: The total number of global & generic memory read instructions executed on all compute units on the accelerator, counted once per wavefront.
    rst: The total number of flat read instructions processed by the :ref:`address processing unit <desc-ta>`, counted once per :ref:`wavefront <desc-wavefront>`, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  TA Global/Generic Write Instructions:
    plain: The total number of global & generic memory write instructions executed on all compute units on the accelerator, counted once per wavefront.
    rst: The total number of flat write instructions processed by the :ref:`address processing unit <desc-ta>`, counted once per :ref:`wavefront <desc-wavefront>`, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  TA Global/Generic Atomic Instructions:
    plain: The total number of global & generic memory atomic (with and without return) instructions executed on all compute units on the accelerator, counted once per wavefront.
    rst: The total number of flat atomic instructions processed by the :ref:`address processing unit <desc-ta>`, counted once per :ref:`wavefront <desc-wavefront>`, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  TA Buffer Read Instructions:
    plain: The total number of buffer read instructions processed by the address processing unit, counted once per wavefront.
    rst: The total number of buffer read instructions processed by the :ref:`address processing unit <desc-ta>`, counted once per :ref:`wavefront <desc-wavefront>`, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  TA Buffer Write Instructions:
    plain: The total number of buffer write instructions processed by the address processing unit, counted once per wavefront.
    rst: The total number of buffer write instructions processed by the :ref:`address processing unit <desc-ta>`, counted once per :ref:`wavefront <desc-wavefront>`, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  TA Buffer Atomic Instructions:
    plain: The total number of buffer atomic instructions processed by the address processing unit, counted once per wavefront.
    rst: The total number of buffer atomic instructions processed by the :ref:`address processing unit <desc-ta>`, counted once per :ref:`wavefront <desc-wavefront>`, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  LDS Instructions:
    plain: The total number of LDS instructions (including, but not limited to, read/write/atomics and HIP's __shfl instructions) executed.
    rst: The total number of :ref:`LDS <desc-lds>` instructions (including, but not limited to, read/write/atomics and HIP's ``__shfl`` instructions) executed per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  LDS Utilization:
    plain: Percentage of the total CU cycles the LDS was actively executing instructions (including, but not limited to, load, store, atomic and HIP's __shfl operations). Calculated as the ratio of the total number of cycles LDS was active over the total CU cycles.
    rst: Indicates what percent of the :ref:`total CU cycles <total-cu-cycles>` the :ref:`LDS <desc-lds>` was actively executing instructions (including, but not limited to, load, store, atomic and HIP's ``__shfl`` operations). Calculated as the ratio of the total number of cycles LDS was active over the total CU cycles.
    unit: Percent
  vL1D Cache Hit Rate:
    plain: Percentage of cache line requests to the vL1D Cache RAM that hit in the vL1D cache. Calculated as 100 minus the percent of requests that were sent to the L2.
    rst: The percent of vL1D cache line requests that hit in the vL1D cache, over the total number of cache line requests to the :ref:`vL1D Cache RAM <desc-tc>`. Calculated as 100 minus the percent of requests that were sent to the :doc:`L2 <l2-cache>`.
    unit: Percent
  vL1D Coalescing:
    plain: Percentage of ideal coalescing the address processing unit achieved for memory instructions, ranging from uncoalesced (25%) to fully coalesced (100%). Calculated as the average number of thread-requests generated per instruction divided by the ideal number of thread-requests per instruction.
    rst: Indicates how well memory instructions were coalesced by the :ref:`address processing unit <desc-ta>`, ranging from uncoalesced (25%) to fully coalesced (100%). Calculated as the average number of :ref:`thread-requests <thread-requests>` generated per instruction divided by the ideal number of thread-requests per instruction.
    unit: Percent
  vL1D-L2 Read Bandwidth:
    plain: The number of bytes per second of read requests from the vL1D cache to the L2 cache.
    rst: Bandwidth of read requests from the vL1D cache to the :doc:`L2 <l2-cache>` cache per unit time.
    unit: GB/s
  vL1D-L2 Write Bandwidth:
    plain: The number of bytes per second of write requests from the vL1D cache to the L2 cache.
    rst: Bandwidth of write requests from the vL1D cache to the :doc:`L2 <l2-cache>` cache per unit time.
    unit: GB/s
  vL1D-L2 Atomic Bandwidth:
    plain: The number of bytes per second of atomic requests from the vL1D cache to the L2 cache.
    rst: Bandwidth of atomic requests from the vL1D cache to the :doc:`L2 <l2-cache>` cache per unit time.
    unit: GB/s
  sL1D Requests:
    plain: The total number of requests, of any size or type, made to the sL1D.
    rst: The total number of requests, of any size or type, made to the :ref:`sL1D <desc-sl1d>` per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  sL1D Hit:
    plain: Percentage of sL1D requests that hit on a previously loaded cache line. Calculated as the ratio of the number of sL1D requests that hit over the number of all sL1D requests.
    rst: The percent of :ref:`sL1D <desc-sl1d>` requests that hit on a previously loaded cache line. Calculated as the ratio of the number of sL1D requests that hit over the number of all sL1D requests.
    unit: Percent
  sL1D-L2 Read Bandwidth:
    plain: The number of bytes per second the sL1D cache requests from the L2 cache by read requests.
    rst: Bandwidth of read requests from the sL1D cache to the :doc:`L2 <l2-cache>` cache per unit time.
    unit: GB/s
  L1I Requests:
    plain: The total number of requests made to the L1I.
    rst: The total number of requests made to the :ref:`L1I <desc-l1i>` per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  L1I Hit Rate:
    plain: Percentage of L1I requests that hit on a previously loaded cache line. Calculated as the ratio of the number of L1I requests that hit over the number of all L1I requests.
    rst: The percent of :ref:`L1I <desc-l1i>` requests that hit on a previously loaded cache line. Calculated as the ratio of the number of L1I requests that hit over the number of all L1I requests.
    unit: Percent
  L1I-L2 Bandwidth:
    plain: The number of bytes per second transferred across L1I - L2 interface.
    rst: Bandwidth of read requests from the instruction L1 cache to the :doc:`L2 <l2-cache>` cache per unit time.
    unit: GB/s
  L2 Cache Hit Rate:
    plain: Percentage of incoming cache line requests to the L2 cache that hit in the L2 cache. A low rate (<50%) indicates that the workload exceeds the L2 cache capacity, leading to high memory traffic.
    rst: The percent of :doc:`L2 <l2-cache>` cache line requests that hit in the L2 cache, over the total number of incoming cache line requests to the L2 cache.
    unit: Percent
  L2-Fabric Read Bandwidth:
    plain: The number of bytes per second read by the L2 over the Infinity Fabric interface.
    rst: The number of bytes read by the L2 over the :ref:`Infinity Fabric interface <l2-fabric>` per unit time.
    unit: GB/s
  L2-Fabric Write and Atomic Bandwidth:
    plain: The number of bytes per second sent by the L2 over the Infinity Fabric interface by write and atomic operations. Infinity Fabric considers a request atomic only if it targets non-write-cacheable memory, for example, fine-grained or uncached memory allocations.
    rst: The number of bytes sent by the L2 over the :ref:`Infinity Fabric interface <l2-fabric>` by write and atomic operations per unit time.
    unit: GB/s
Roofline Performance Rates:
  L2 Cache Bandwidth:
    plain: The number of bytes per second transferred across the vL1D-L2 interface by VMEM instructions. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    rst: The number of bytes per second transferred across the vL1D-L2 interface by VMEM instructions. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    unit: GB/s
  vL1D Cache Bandwidth:
    plain: The number of bytes per second looked up in the vL1D cache by VMEM instructions. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    rst: The number of bytes per second looked up in the vL1D cache by VMEM instructions. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    unit: GB/s
  Theoretical LDS Bandwidth:
    plain: The maximum number of bytes per second the LDS could have moved, from its active cycles without bank conflicts. It ignores the execution mask.
    rst: The maximum number of bytes per second the LDS could have moved, from its active cycles without bank conflicts. It ignores the execution mask.
    unit: GB/s
  VALU FLOPs (F16):
    plain: 'The total 16-bit floating-point operations executed per second on the VALU. This is presented with the value of the peak empirical F16 FLOPs achievable on the specific accelerator. Note: this does not include any F16 operations from MFMA instructions.'
    rst: 'The total 16-bit floating-point operations executed per second on the VALU. This is presented with the value of the peak empirical F16 FLOPs achievable on the specific accelerator. Note: this does not include any F16 operations from MFMA instructions.'
    unit: GFLOP/s
  VALU FLOPs (F32):
    plain: 'The total 32-bit floating-point operations executed per second on the VALU. This is presented with the value of the peak empirical F32 FLOPs achievable on the specific accelerator. Note: this does not include any F32 operations from MFMA instructions.'
    rst: 'The total 32-bit floating-point operations executed per second on the VALU. This is presented with the value of the peak empirical F32 FLOPs achievable on the specific accelerator. Note: this does not include any F32 operations from MFMA instructions.'
    unit: GFLOP/s
  VALU FLOPs (F64):
    plain: 'The total 64-bit floating-point operations executed per second on the VALU. This is presented with the value of the peak empirical F64 FLOPs achievable on the specific accelerator. Note: this does not include any F64 operations from MFMA instructions.'
    rst: 'The total 64-bit floating-point operations executed per second on the VALU. This is presented with the value of the peak empirical F64 FLOPs achievable on the specific accelerator. Note: this does not include any F64 operations from MFMA instructions.'
    unit: GFLOP/s
  MFMA FLOPs (BF16):
    plain: 'The total number of 16-bit brain floating point MFMA operations executed per second. Note: this does not include any 16-bit brain floating point operations from VALU instructions. The peak empirically measured BF16 MFMA operations achievable on the specific accelerator is displayed alongside for comparison.'
    rst: 'The total number of 16-bit brain floating point MFMA operations executed per second. Note: this does not include any 16-bit brain floating point operations from VALU instructions. The peak empirically measured BF16 MFMA operations achievable on the specific accelerator is displayed alongside for comparison.'
    unit: GFLOP/s
  MFMA FLOPs (F16):
    plain: 'The total number of 16-bit floating point MFMA operations executed per second. Note: this does not include any 16-bit floating point operations from VALU instructions. The peak empirically measured F16 MFMA operations achievable on the specific accelerator is displayed alongside for comparison.'
    rst: 'The total number of 16-bit floating point MFMA operations executed per second. Note: this does not include any 16-bit floating point operations from VALU instructions. The peak empirically measured F16 MFMA operations achievable on the specific accelerator is displayed alongside for comparison.'
    unit: GFLOP/s
  MFMA FLOPs (F32):
    plain: 'The total number of 32-bit floating point MFMA operations executed per second. Note: this does not include any 32-bit floating point operations from VALU instructions. The peak empirically measured F32 MFMA operations achievable on the specific accelerator is displayed alongside for comparison.'
    rst: 'The total number of 32-bit floating point MFMA operations executed per second. Note: this does not include any 32-bit floating point operations from VALU instructions. The peak empirically measured F32 MFMA operations achievable on the specific accelerator is displayed alongside for comparison.'
    unit: GFLOP/s
  MFMA FLOPs (F64):
    plain: 'The total number of 64-bit floating point MFMA operations executed per second. Note: this does not include any 64-bit floating point operations from VALU instructions. The peak empirically measured F64 MFMA operations achievable on the specific accelerator is displayed alongside for comparison.'
    rst: 'The total number of 64-bit floating point MFMA operations executed per second. Note: this does not include any 64-bit floating point operations from VALU instructions. The peak empirically measured F64 MFMA operations achievable on the specific accelerator is displayed alongside for comparison.'
    unit: GFLOP/s
  MFMA IOPs (Int8):
    plain: 'The total number of 8-bit integer MFMA operations executed per second. Note: this does not include any 8-bit integer operations from VALU instructions. The peak empirically measured INT8 MFMA operations achievable on the specific accelerator is displayed alongside for comparison.'
    rst: 'The total number of 8-bit integer MFMA operations executed per second. Note: this does not include any 8-bit integer operations from VALU instructions. The peak empirically measured INT8 MFMA operations achievable on the specific accelerator is displayed alongside for comparison.'
    unit: GIOP/s
  HBM Bandwidth:
    plain: The total number of bytes read from and written to High-Bandwidth Memory (HBM) per second. The peak empirically measured bandwidth achievable on the specific accelerator is displayed alongside for comparison. It reflects peak single-direction (read-only) bandwidth, so write-heavy or mixed kernels fall below it.
    rst: The total number of bytes read from and written to High-Bandwidth Memory (HBM) per second. The peak empirically measured bandwidth achievable on the specific accelerator is displayed alongside for comparison. It reflects peak single-direction (read-only) bandwidth, so write-heavy or mixed kernels fall below it.
    unit: GB/s
Command processor fetcher (CPF):
  CPF Utilization:
    plain: Percentage of total cycles where the CPF was busy actively doing any work. The ratio of CPF busy cycles over total cycles counted by the CPF.
    rst: Percentage of total cycles where the CPF was busy actively doing any work. The ratio of CPF busy cycles over total cycles counted by the CPF.
    unit: Percent
  CPF Stall:
    plain: Percentage of CPF busy cycles where the CPF was stalled for any reason.
    rst: Percentage of CPF busy cycles where the CPF was stalled for any reason.
    unit: Percent
  CPF-L2 Utilization:
    plain: Percentage of total cycles counted by the CPF-L2 interface where the CPF-L2 interface was active doing any work. The ratio of CPF-L2 busy cycles over total cycles counted by the CPF-L2.
    rst: Percent of total cycles counted by the CPF-:doc:`L2 <l2-cache>` interface where the CPF-L2 interface was active doing any work. The ratio of CPF-L2 busy cycles over total cycles counted by the CPF-L2.
    unit: Percent
  CPF-L2 Stall:
    plain: Percentage of CPF-L2 L2 busy cycles where the CPF-L2 interface was stalled for any reason.
    rst: Percent of CPF-:doc:`L2 <l2-cache>` L2 busy cycles where the CPF-L2 interface was stalled for any reason.
    unit: Percent
  CPF-UTCL1 Stall:
    plain: Percentage of CPF busy cycles where the CPF was stalled by address translation.
    rst: Percentage of CPF busy cycles where the CPF was stalled by address translation.
    unit: Percent
Command processor packet processor (CPC):
  CPC Utilization:
    plain: Percentage of total cycles where the CPC was busy actively doing any work. The ratio of CPC busy cycles over total cycles counted by the CPC.
    rst: Percentage of total cycles where the CPC was busy actively doing any work. The ratio of CPC busy cycles over total cycles counted by the CPC.
    unit: Percent
  CPC Stall Rate:
    plain: Percentage of CPC busy cycles where the CPC was stalled for any reason.
    rst: Percentage of CPC busy cycles where the CPC was stalled for any reason.
    unit: Percent
  CPC Packet Decoding Utilization:
    plain: Percentage of CPC busy cycles spent decoding commands for processing.
    rst: Percentage of CPC busy cycles spent decoding commands for processing.
    unit: Percent
  CPC-Workgroup Manager Utilization:
    plain: Percentage of CPC busy cycles spent dispatching workgroups to the workgroup manager.
    rst: Percent of CPC busy cycles spent dispatching workgroups to the :ref:`workgroup manager <desc-spi>`.
    unit: Percent
  CPC-L2 Utilization:
    plain: Percentage of total cycles counted by the CPC-L2 interface where the CPC-L2 interface was active doing any work.
    rst: Percent of total cycles counted by the CPC-:doc:`L2 <l2-cache>` interface where the CPC-L2 interface was active doing any work.
    unit: Percent
  CPC-UTCL1 Stall:
    plain: Percentage of CPC busy cycles where the CPC was stalled by address translation.
    rst: Percentage of CPC busy cycles where the CPC was stalled by address translation.
    unit: Percent
  CPC-UTCL2 Utilization:
    plain: Percentage of total cycles counted by the CPC's L2 address translation interface where the CPC was busy doing address translation work.
    rst: Percent of total cycles counted by the CPC's :doc:`L2 <l2-cache>` address translation interface where the CPC was busy doing address translation work.
    unit: Percent
Workgroup manager utilizations:
  Accelerator Utilization:
    plain: Percentage of cycles in the kernel where the accelerator was actively doing any work.
    rst: Percentage of cycles in the kernel where the accelerator was actively doing any work.
    unit: Percent
  Scheduler-Pipe Utilization:
    plain: Percentage of total scheduler-pipe cycles in the kernel where the scheduler-pipes were actively doing any work.
    rst: 'The percent of :ref:`total scheduler-pipe cycles <total-pipe-cycles>` in the kernel where the scheduler-pipes were actively doing any work. Note: this value is expected to range between 0% and 25%. See :ref:`desc-spi`.'
    unit: Percent
  Workgroup Manager Utilization:
    plain: Percentage of cycles in the kernel where the workgroup manager was actively doing any work.
    rst: Percentage of cycles in the kernel where the workgroup manager was actively doing any work.
    unit: Percent
  Shader Engine Utilization:
    plain: Percentage of total shader engine cycles in the kernel where any CU in a shader-engine was actively doing any work, normalized over all shader-engines. Low values (for example, << 100%) indicate that the accelerator was not fully saturated by the kernel, or a potential load-imbalance issue.
    rst: The percent of :ref:`total shader engine cycles <total-se-cycles>` in the kernel where any CU in a shader-engine was actively doing any work, normalized over all shader-engines. Low values (e.g., << 100%) indicate that the accelerator was not fully saturated by the kernel, or a potential load-imbalance issue.
    unit: Percent
  CU Utilization:
    plain: Percentage of total SIMD cycles in the kernel where any SIMD on a CU was actively doing any work, summed over all CUs. Low values (less than 100%) indicate that the accelerator was not fully saturated by the kernel, or a potential load-imbalance issue.
    rst: The percent of :ref:`total SIMD cycles <total-simd-cycles>` in the kernel where any :ref:`SIMD <desc-valu>` on a CU was actively doing any work, summed over all CUs. Low values (less than 100%) indicate that the accelerator was not fully saturated by the kernel, or a potential load-imbalance issue.
    unit: Percent
  Dispatched Workgroups:
    plain: The total number of workgroups forming this kernel launch.
    rst: The total number of workgroups forming this kernel launch.
    unit: Workgroups
  Dispatched Wavefronts:
    plain: The total number of wavefronts, summed over all workgroups, forming this kernel launch. On AMD Instinct MI100 to MI350 series accelerators, a wavefront has 64 work-items, so this should equal the ceiling of the grid size divided by 64.
    rst: The total number of wavefronts, summed over all workgroups, forming this kernel launch. On AMD Instinct MI100 to MI350 series accelerators, a wavefront has 64 work-items, so this should equal the ceiling of the grid size divided by 64.
    unit: Wavefronts
  VGPR Writes:
    plain: The average number of cycles spent initializing VGPRs at wavefront creation.
    rst: The average number of cycles spent initializing :ref:`VGPRs <desc-valu>` at wave creation.
    unit: Cycles per Wavefront
  SGPR Writes:
    plain: The average number of cycles spent initializing SGPRs at wavefront creation.
    rst: The average number of cycles spent initializing :ref:`SGPRs <desc-salu>` at wave creation.
    unit: Cycles per Wavefront
Workgroup Manager - Resource Allocation:
  Not-Scheduled Rate (Workgroup Manager):
    plain: Percentage of total scheduler-pipe cycles in the kernel where a workgroup could not be scheduled to a CU due to a bottleneck within the workgroup manager rather than a lack of a CU or SIMD with sufficient resources.
    rst: 'The percent of :ref:`total scheduler-pipe cycles <total-pipe-cycles>` in the kernel where a workgroup could not be scheduled to a :doc:`CU <compute-unit>` due to a bottleneck within the workgroup manager rather than a lack of a CU or :ref:`SIMD <desc-valu>` with sufficient resources. Note: this value is expected to range between 0-25%. See note in :ref:`workgroup manager <desc-spi>` description.'
    unit: Percent
  Not-Scheduled Rate (Scheduler-Pipe):
    plain: Percentage of total scheduler-pipe cycles in the kernel where a workgroup could not be scheduled to a CU due to a bottleneck within the scheduler-pipes rather than a lack of a CU or SIMD with sufficient resources.
    rst: 'The percent of :ref:`total scheduler-pipe cycles <total-pipe-cycles>` in the kernel where a workgroup could not be scheduled to a :doc:`CU <compute-unit>` due to a bottleneck within the scheduler-pipes rather than a lack of a CU or :ref:`SIMD <desc-valu>` with sufficient resources. Note: this value is expected to range between 0-25%, see note in :ref:`workgroup manager <desc-spi>` description.'
    unit: Percent
  Scheduler-Pipe Stall Rate:
    plain: Percentage of total scheduler-pipe cycles in the kernel where a workgroup could not be scheduled to a CU due to occupancy limitations (like a lack of a CU or SIMD with sufficient resources).
    rst: 'The percent of :ref:`total scheduler-pipe cycles <total-pipe-cycles>` in the kernel where a workgroup could not be scheduled to a :doc:`CU <compute-unit>` due to occupancy limitations (like a lack of a CU or :ref:`SIMD <desc-valu>` with sufficient resources). Note: this value is expected to range between 0-25%, see note in :ref:`workgroup manager <desc-spi>` description.'
    unit: Percent
  Scratch Stall Rate:
    plain: Percentage of shader-engine cycles in the kernel where a workgroup could not be scheduled to a CU for lack of private (scratch) memory slots. It can reach 100%, but the occupancy this costs is usually small, for example under 1% of the wavefronts an accelerator can schedule.
    rst: The percent of :ref:`total shader-engine cycles <total-se-cycles>` in the kernel where a workgroup could not be scheduled to a :doc:`CU <compute-unit>` due to lack of :ref:`private (a.k.a., scratch) memory <memory-type>` slots. While this can reach up to 100%, note that the actual occupancy limitations on a kernel using private memory are typically quite small (for example, less than 1% of the total number of waves that can be scheduled to an accelerator).
    unit: Percent
  Insufficient SIMD Waveslots:
    plain: Percentage of total SIMD cycles in the kernel where a workgroup could not be scheduled to a SIMD due to lack of available waveslots.
    rst: The percent of :ref:`total SIMD cycles <total-simd-cycles>` in the kernel where a workgroup could not be scheduled to a :ref:`SIMD <desc-valu>` due to lack of available :ref:`waveslots <desc-valu>`.
    unit: Percent
  Insufficient SIMD VGPRs:
    plain: Percentage of total SIMD cycles in the kernel where a workgroup could not be scheduled to a SIMD due to lack of available VGPRs.
    rst: The percent of :ref:`total SIMD cycles <total-simd-cycles>` in the kernel where a workgroup could not be scheduled to a :ref:`SIMD <desc-valu>` due to lack of available :ref:`VGPRs <desc-valu>`.
    unit: Percent
  Insufficient SIMD SGPRs:
    plain: Percentage of total SIMD cycles in the kernel where a workgroup could not be scheduled to a SIMD due to lack of available SGPRs.
    rst: The percent of :ref:`total SIMD cycles <total-simd-cycles>` in the kernel where a workgroup could not be scheduled to a :ref:`SIMD <desc-valu>` due to lack of available :ref:`SGPRs <desc-salu>`.
    unit: Percent
  Insufficient CU LDS:
    plain: Percentage of total CU cycles in the kernel where a workgroup could not be scheduled to a CU due to lack of available LDS.
    rst: The percent of :ref:`total CU cycles <total-cu-cycles>` in the kernel where a workgroup could not be scheduled to a :doc:`CU <compute-unit>` due to lack of available :doc:`LDS <local-data-share>`.
    unit: Percent
  Insufficient CU Barriers:
    plain: Percentage of total CU cycles in the kernel where a workgroup could not be scheduled to a CU due to lack of available barriers.
    rst: The percent of :ref:`total CU cycles <total-cu-cycles>` in the kernel where a workgroup could not be scheduled to a :doc:`CU <compute-unit>` due to lack of available :ref:`barriers <desc-barrier>`.
    unit: Percent
  Reached CU Workgroup Limit:
    plain: Percentage of total CU cycles in the kernel where a workgroup could not be scheduled to a CU due to limits within the workgroup manager. This is expected to always be zero on CDNA2 or newer accelerators (and small for previous accelerators).
    rst: The percent of :ref:`total CU cycles <total-cu-cycles>` in the kernel where a workgroup could not be scheduled to a :doc:`CU <compute-unit>` due to limits within the workgroup manager. This is expected to be always be zero on CDNA2 or newer accelerators (and small for previous accelerators).
    unit: Percent
  Reached CU Wavefront Limit:
    plain: Percentage of total CU cycles in the kernel where a wavefront could not be scheduled to a CU due to limits within the workgroup manager. This is expected to always be zero on CDNA2 or newer accelerators (and small for previous accelerators).
    rst: The percent of :ref:`total CU cycles <total-cu-cycles>` in the kernel where a wavefront could not be scheduled to a :doc:`CU <compute-unit>` due to limits within the workgroup manager. This is expected to be always be zero on CDNA2 or newer accelerators (and small for previous accelerators).
    unit: Percent
Wavefront launch stats:
  Grid Size:
    plain: Total number of work-items in the dispatch grid.
    rst: Total number of work-items in the dispatch grid.
    unit: Work-items
  Workgroup Size:
    plain: Number of work-items per workgroup.
    rst: Number of work-items per workgroup.
    unit: Work-items
  Dispatched Wavefronts:
    plain: The total number of wavefronts, summed over all workgroups, forming this kernel launch. On AMD Instinct MI100 to MI350 series accelerators, a wavefront has 64 work-items, so this should equal the ceiling of the grid size divided by 64.
    rst: The total number of wavefronts, summed over all workgroups, forming this kernel launch. On AMD Instinct MI100 to MI350 series accelerators, a wavefront has 64 work-items, so this should equal the ceiling of the grid size divided by 64.
    unit: Wavefronts
  Saved Wavefronts:
    plain: The total number of wavefronts saved at a context-save.
    rst: The total number of wavefronts saved at a context-save. See `cwsr_enable <https://docs.kernel.org/gpu/amdgpu/module-parameters.html?highlight=cwsr>`_.
    unit: Wavefronts
  Restored Wavefronts:
    plain: The total number of wavefronts restored from a context-save.
    rst: The total number of wavefronts restored from a context-save. See `cwsr_enable <https://docs.kernel.org/gpu/amdgpu/module-parameters.html?highlight=cwsr>`_.
    unit: Wavefronts
  VGPRs:
    plain: 'The number of architected vector general-purpose registers allocated per wavefront. Note: this may not exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
    rst: 'The number of architected vector general-purpose registers allocated for the kernel, see :ref:`VALU <desc-valu>`. Note: this may not exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  AGPRs:
    plain: 'The number of accumulation vector general-purpose registers (AGPRs) allocated for the kernel. Note: this may not exactly match the number of AGPRs requested by the compiler due to allocation granularity.'
    rst: 'The number of accumulation vector general-purpose registers allocated for the kernel, see :ref:`AGPRs <desc-agprs>`. Note: this may not exactly match the number of AGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  SGPRs:
    plain: 'The number of scalar general-purpose registers allocated per wavefront. Note: this may not exactly match the number of SGPRs requested by the compiler due to allocation granularity.'
    rst: 'The number of scalar general-purpose registers allocated for the kernel, see :ref:`SALU <desc-salu>`. Note: this may not exactly match the number of SGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  LDS Allocation:
    plain: 'The number of bytes of LDS memory (or, shared memory) allocated per workgroup. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
    rst: 'The number of bytes of LDS memory (or, shared memory) allocated per workgroup. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
    unit: Bytes per Workgroup
  Scratch Allocation:
    plain: The number of bytes of scratch memory per work-item. Scratch memory holds the stack and register spills.
    rst: The number of bytes of scratch memory per work-item. Scratch memory holds the stack and register spills.
    unit: Bytes per Work-item
Wavefront runtime stats:
  Kernel Time:
    plain: The total duration of the executed kernel.
    rst: The total duration of the executed kernel.
    unit: Nanoseconds
  Kernel Time (Cycles):
    plain: The total duration of the executed kernel in cycles.
    rst: The total duration of the executed kernel in cycles.
    unit: Cycles
  Instructions per Wavefront:
    plain: The average number of instructions (of all types) executed per wavefront. This is averaged over all wavefronts in a kernel dispatch.
    rst: The average number of instructions (of all types) executed per wavefront. This is averaged over all wavefronts in a kernel dispatch.
    unit: Instructions per Wavefront
  Wavefront Cycles:
    plain: The number of cycles a wavefront in the kernel dispatch spent resident on a compute unit. This is averaged over all wavefronts in a kernel dispatch.
    rst: 'The number of cycles a wavefront in the kernel dispatch spent resident on a compute unit per :ref:`normalization unit <normalization-units>`. This is averaged over all wavefronts in a kernel dispatch. Note: this should not be directly compared to the kernel cycles above.'
    unit: Cycles per Normalization Unit
  Dependency Wait Cycles:
    plain: The number of cycles a wavefront in the kernel dispatch spent resident on a compute unit. This is averaged over all wavefronts in a kernel dispatch.
    rst: The number of cycles a wavefront in the kernel dispatch stalled waiting on memory of any kind (e.g., instruction fetch, vector or scalar memory, etc.) per :ref:`normalization unit <normalization-units>`. This counter is incremented at every cycle by *all* wavefronts on a CU stalled at a memory operation. As such, it is most useful to get a sense of how waves were spending their time, rather than identification of a precise limiter because another wave could be actively executing while a wave is stalled. The sum of this metric, Issue Wait Cycles and Active Cycles should be equal to the total Wave Cycles metric.
    unit: Cycles per Normalization Unit
  Issue Wait Cycles:
    plain: The number of cycles wavefronts in the kernel dispatch could not issue an instruction for any reason, for example execution pipe back-pressure or arbitration loss, counted per wavefront. It shows how wavefronts spend their time rather than a precise limiter.
    rst: The number of cycles a wavefront in the kernel dispatch was unable to issue an instruction for any reason (e.g., execution pipe back-pressure, arbitration loss, etc.) per :ref:`normalization unit <normalization-units>`. This counter is incremented at every cycle by *all* wavefronts on a CU unable to issue an instruction. As such, it is most useful to get a sense of how waves were spending their time, rather than identification of a precise limiter because another wave could be actively executing while a wave is issue stalled. The sum of this metric, Dependency Wait Cycles and Active Cycles should be equal to the total Wave Cycles metric.
    unit: Cycles per Normalization Unit
  Active Cycles:
    plain: The number of cycles wavefronts in the kernel dispatch were actively executing instructions, counted per wavefront, so it can include cycles another wavefront was executing or stalled. It shows how wavefronts spend their time rather than a precise limiter.
    rst: The average number of cycles a wavefront in the kernel dispatch was actively executing instructions per :ref:`normalization unit <normalization-units>`. This measurement is made on a per-wavefront basis, and may include cycles that another wavefront spent actively executing (on another execution unit, for example) or was stalled. As such, it is most useful to get a sense of how waves were spending their time, rather than identification of a precise limiter. The sum of this metric, Issue Wait Cycles and Active Wait Cycles should be equal to the total Wave Cycles metric.
    unit: Cycles per Normalization Unit
  Wavefront Occupancy:
    plain: 'The time-averaged number of wavefronts resident on the accelerator over the lifetime of the kernel. Note: this metric may be inaccurate for short-running kernels (less than 1ms).'
    rst: 'The time-averaged number of wavefronts resident on the accelerator over the lifetime of the kernel. Note: this metric may be inaccurate for short-running kernels (less than 1ms).'
    unit: Wavefronts
Overall instruction mix:
  LDS:
    plain: The total number of LDS instructions (including, but not limited to, read/write/atomics and HIP's __shfl instructions) executed.
    rst: The total number of LDS (also known as shared memory) operations issued. These include loads, stores, atomics, and HIP's ``__shfl`` operations.
    unit: Instructions per Normalization Unit
  SALU:
    plain: The total number of scalar arithmetic logic unit (SALU) operations issued, typically address calculations, literal constants and other operations that are uniform across a wavefront. Scalar memory (SMEM) operations are counted separately.
    rst: The total number of scalar arithmetic logic unit (SALU) operations issued, typically address calculations, literal constants and other operations that are uniform across a wavefront. Scalar memory (SMEM) operations are counted separately.
    unit: Instructions per Normalization Unit
  SMEM:
    plain: The total number of scalar memory (SMEM) operations issued. These are typically used for loading kernel arguments, base-pointers and loads from HIP's __constant__ memory.
    rst: The total number of scalar memory (SMEM) operations issued. These are typically used for loading kernel arguments, base-pointers and loads from HIP's ``__constant__`` memory.
    unit: Instructions per Normalization Unit
  Branch:
    plain: The total number of branch operations issued. These typically consist of jump or branch operations and are used to implement control flow.
    rst: The total number of branch operations issued. These typically consist of jump or branch operations and are used to implement control flow.
    unit: Instructions per Normalization Unit
Pipeline statistics:
  IPC:
    plain: The ratio of the total number of instructions executed on the CU over the total active CU cycles.
    rst: The ratio of the total number of instructions executed on the :doc:`CU <compute-unit>` over the :ref:`total active CU cycles <total-active-cu-cycles>`.
    unit: Instructions per Cycle
  IPC (Issued):
    plain: The ratio of the total number of (non-internal) instructions issued over the number of cycles where the scheduler was actively working on issuing instructions.
    rst: The ratio of the total number of (non-:ref:`internal <ipc-internal-instructions>`) instructions issued over the number of cycles where the :ref:`scheduler <desc-scheduler>` was actively working on issuing instructions. Refer to the :ref:`Issued IPC <issued-ipc>` example for further detail.
    unit: Instructions per Cycle
  SALU Utilization:
    plain: Percentage of the kernel's duration the SALU was busy executing instructions. Computed as the ratio of the total number of cycles spent by the scheduler issuing SALU or SMEM instructions over the total CU cycles.
    rst: Indicates what percent of the kernel's duration the :ref:`SALU <desc-salu>` was busy executing instructions. Computed as the ratio of the total number of cycles spent by the :ref:`scheduler <desc-scheduler>` issuing SALU / :ref:`SMEM <desc-smem>` instructions over the :ref:`total CU cycles <total-cu-cycles>`.
    unit: Percent
  VALU Utilization:
    plain: Percentage of the kernel's duration the VALU was busy executing instructions. Does not include VMEM operations. Computed as the ratio of the total number of cycles spent by the scheduler issuing VALU instructions over the total CU cycles.
    rst: Indicates what percent of the kernel's duration the :ref:`VALU <desc-valu>` was busy executing instructions. Does not include :ref:`VMEM <desc-vmem>` operations. Computed as the ratio of the total number of cycles spent by the :ref:`scheduler <desc-scheduler>` issuing VALU instructions over the :ref:`total CU cycles <total-cu-cycles>`.
    unit: Percent
  VALU Active Threads:
    plain: Indicates the average level of divergence within a wavefront over the lifetime of the kernel. The number of work-items that were active in a wavefront during execution of each VALU instruction, time-averaged over all VALU instructions run on all wavefronts in the kernel.
    rst: Indicates the average level of :ref:`divergence <desc-divergence>` within a wavefront over the lifetime of the kernel. The number of work-items that were active in a wavefront during execution of each :ref:`VALU <desc-valu>` instruction, time-averaged over all VALU instructions run on all wavefronts in the kernel.
    unit: Work-items
LDS Speed-of-Light:
  Utilization:
    plain: Percentage of the total CU cycles the LDS was actively executing instructions (including, but not limited to, load, store, atomic and HIP's __shfl operations). Calculated as the ratio of the total number of cycles LDS was active over the total CU cycles.
    rst: Indicates what percent of the kernel's duration the :ref:`LDS <desc-lds>` was actively executing instructions (including, but not limited to, load, store, atomic and HIP's ``__shfl`` operations). Calculated as the ratio of the total number of cycles LDS was active over the :ref:`total CU cycles <total-cu-cycles>`.
    unit: Percent
  Access Rate:
    plain: Percentage of SIMDs in the VALU actively issuing LDS instructions, averaged over the lifetime of the kernel. Calculated as the ratio of the total number of cycles spent by the scheduler issuing LDS instructions over the total CU cycles.
    rst: Indicates the percentage of SIMDs in the :ref:`VALU <desc-valu>` [#lds-workload]_ actively issuing LDS instructions, averaged over the lifetime of the kernel. Calculated as the ratio of the total number of cycles spent by the :ref:`scheduler <desc-scheduler>` issuing :ref:`LDS <desc-lds>` instructions over the :ref:`total CU cycles <total-cu-cycles>`.
    unit: Percent
  Theoretical Bandwidth Utilization:
    plain: Percentage of the theoretical peak LDS bandwidth used by the maximum number of bytes that could have been loaded from, stored to, or atomically updated in the LDS. Does not take into account the execution mask of the wavefront when the instruction was executed.
    rst: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS divided as percentage of theoretical peak. Does *not* take into account the execution mask of the wavefront when the instruction was executed. See the :ref:`LDS bandwidth example <lds-bandwidth>` for more detail.
    unit: Percent
  Bank Conflict Rate:
    plain: Percentage of active LDS cycles that were spent servicing bank conflicts. Calculated as the ratio of LDS cycles spent servicing bank conflicts over the number of LDS cycles that would have been required to move the same amount of data in an uncontended access.
    rst: Indicates the percentage of active LDS cycles that were spent servicing bank conflicts. Calculated as the ratio of LDS cycles spent servicing bank conflicts over the number of LDS cycles that would have been required to move the same amount of data in an uncontended access. [#lds-bank-conflict]_
    unit: Percent
LDS Statistics:
  LDS Instructions:
    plain: The total number of LDS instructions (including, but not limited to, read/write/atomics and HIP's __shfl instructions) executed.
    rst: The total number of LDS instructions (including, but not limited to, read/write/atomics and HIP's ``__shfl`` instructions) executed per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  Theoretical Bandwidth:
    plain: The maximum number of bytes per second the LDS could have moved, from its active cycles without bank conflicts. It ignores the execution mask.
    rst: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS divided by total duration. Does *not* take into account the execution mask of the wavefront when the instruction was executed. See the :ref:`LDS bandwidth example <lds-bandwidth>` for more detail.
    unit: GB/s
  LDS Latency:
    plain: The average number of round-trip cycles (i.e., from issue to data-return acknowledgment) required for an LDS instruction to complete.
    rst: The average number of round-trip cycles (i.e., from issue to data-return acknowledgment) required for an LDS instruction to complete.
    unit: Cycles
  Bank Conflicts/Access:
    plain: The ratio of the number of cycles spent in the LDS scheduler due to bank conflicts (as determined by the conflict resolution hardware) to the base number of cycles that would be spent in the LDS scheduler in a completely uncontended case. This is the unnormalized form of the Bank Conflict Rate.
    rst: The ratio of the number of cycles spent in the :ref:`LDS scheduler <desc-lds>` due to bank conflicts (as determined by the conflict resolution hardware) to the base number of cycles that would be spent in the LDS scheduler in a completely uncontended case. This is the unnormalized form of the Bank Conflict Rate.
    unit: Conflicts per Access
  Index Accesses:
    plain: The total number of cycles spent in the LDS scheduler over all operations.
    rst: The total number of cycles spent in the :ref:`LDS scheduler <desc-lds>` over all operations per :ref:`normalization unit <normalization-units>`.
    unit: Cycles per Normalization Unit
  Atomic Return Cycles:
    plain: The total number of cycles spent on LDS atomics with return.
    rst: The total number of cycles spent on LDS atomics with return per :ref:`normalization unit <normalization-units>`.
    unit: Cycles per Normalization Unit
  Bank Conflict:
    plain: The total number of cycles spent in the LDS scheduler due to bank conflicts (as determined by the conflict resolution hardware).
    rst: The total number of cycles spent in the :ref:`LDS scheduler <desc-lds>` due to bank conflicts (as determined by the conflict resolution hardware) per :ref:`normalization unit <normalization-units>`.
    unit: Cycles per Normalization Unit
  Addr Conflict:
    plain: The total number of cycles spent in the LDS scheduler due to address conflicts (as determined by the conflict resolution hardware).
    rst: The total number of cycles spent in the :ref:`LDS scheduler <desc-lds>` due to address conflicts (as determined by the conflict resolution hardware) per :ref:`normalization unit <normalization-units>`.
    unit: Cycles per Normalization Unit
  Unaligned Stall:
    plain: The total number of cycles spent in the LDS scheduler due to stalls from non-dword aligned addresses.
    rst: The total number of cycles spent in the :ref:`LDS scheduler <desc-lds>` due to stalls from non-dword aligned addresses per :ref:`normalization unit <normalization-units>`.
    unit: Cycles per Normalization Unit
  Mem Violations:
    plain: The total number of out-of-bounds accesses made to the LDS. This is unused and expected to be zero in most configurations for modern CDNA accelerators.
    rst: The total number of out-of-bounds accesses made to the LDS, per :ref:`normalization unit <normalization-units>`. This is unused and expected to be zero in most configurations for modern CDNA\u2122 accelerators.
    unit: Accesses per Normalization Unit
L1I Speed-of-Light:
  Bandwidth Utilization:
    plain: Percentage of the peak theoretical L1I cache bandwidth used by L1I cache lookups. Calculated as the ratio of L1I requests over the total L1I cycles.
    rst: The number of bytes looked up in the L1I cache, as a percent of the peak theoretical bandwidth. Calculated as the ratio of L1I requests over the :ref:`total L1I cycles <total-l1i-cycles>`.
    unit: Percent
  L1I-L2 Bandwidth Utilization:
    plain: Percentage of the peak theoretical L1I -> L2 cache request bandwidth achieved. Calculated as the ratio of the total number of requests from the L1I to the L2 cache over the total L1I-L2 interface cycles.
    rst: The percent of the peak theoretical L1I \u2192 L2 cache request bandwidth achieved. Calculated as the ratio of the total number of requests from the L1I to the L2 cache over the :ref:`total L1I-L2 interface cycles <total-l1i-cycles>`.
    unit: Percent
L1I cache accesses:
  L1I Hit Rate (Including Duplicate Misses):
    plain: Percentage of L1I requests that hit on a previously loaded line in the cache. Calculated as the number of L1I hits over the number of hits and misses, including duplicate misses.
    rst: Percentage of L1I requests that hit on a previously loaded line in the cache. Calculated as the number of L1I hits over the number of hits and misses, including duplicate misses.
    unit: Percent
  Req:
    plain: The total number of requests made to the L1I.
    rst: The total number of requests made to the L1I.
    unit: Requests per Normalization Unit
  Hits:
    plain: The total number of L1I requests that hit on a previously loaded cache line.
    rst: The total number of L1I requests that hit on a previously loaded cache line, per :ref:`normalization-unit <normalization-units>`.
    unit: Requests per Normalization Unit
  Misses - Non Duplicated:
    plain: The total number of L1I requests that missed on a cache line that were not already pending due to another request.
    rst: The total number of L1I requests that missed on a cache line that *were not* already pending due to another request, per :ref:`normalization-unit <normalization-units>`. See note in :ref:`desc-l1i-sol` for more detail.
    unit: Requests per Normalization Unit
  Misses - Duplicated:
    plain: The total number of L1I requests that missed on a cache line that were already pending due to another request.
    rst: The total number of L1I requests that missed on a cache line that *were* already pending due to another request, per :ref:`normalization-unit <normalization-units>`. See note in :ref:`desc-l1i-sol` for more detail.
    unit: Requests per Normalization Unit
  L1I Fetch Latency:
    plain: The average number of cycles spent to fetch instructions to a CU.
    rst: The average number of cycles spent to fetch instructions to a :doc:`CU <compute-unit>`.
    unit: Cycles
L1I <-> L2 interface:
  L1I-L2 Bandwidth:
    plain: The number of bytes per second transferred across L1I - L2 interface.
    rst: The number of bytes per second transferred across L1I - L2 interface.
    unit: GB/s
Scalar L1D Speed-of-Light:
  Bandwidth Utilization:
    plain: Percentage of the peak theoretical sL1D cache bandwidth used by sL1D cache lookups. Calculated as the ratio of sL1D requests over the total sL1D cycles.
    rst: The number of bytes looked up in the sL1D cache, as a percent of the peak theoretical bandwidth. Calculated as the ratio of sL1D requests over the :ref:`total sL1D cycles <total-sl1d-cycles>`.
    unit: Percent
  sL1D-L2 Bandwidth Utilization:
    plain: Percentage of the peak theoretical sL1D<->L2 interface bandwidth achieved. Calculated from the total number of read, write, and atomic requests across the sL1D<->L2 interface.
    rst: Percentage of the peak theoretical sL1D<->L2 interface bandwidth achieved. Calculated from the total number of read, write, and atomic requests across the sL1D<->L2 interface.
    unit: Percent
Scalar L1D cache accesses:
  sL1D Hit Rate (Including Duplicate Misses):
    plain: Percentage of sL1D requests that hit on a previously loaded line in the cache. Calculated as the number of sL1D hits over the number of hits and misses, including duplicate misses.
    rst: Indicates the percent of sL1D requests that hit on a previously loaded line the cache. The ratio of the number of sL1D requests that hit [#sl1d-cache]_ over the number of all sL1D requests.
    unit: Percent
  Req:
    plain: The total number of requests, of any size or type, made to the sL1D.
    rst: The total number of requests, of any size or type, made to the sL1D per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  Hits:
    plain: The total number of sL1D requests that hit on a previously loaded cache line.
    rst: The total number of sL1D requests that hit on a previously loaded cache line, per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  Misses - Non Duplicated:
    plain: The total number of sL1D requests that missed on a cache line that was not already pending due to another request.
    rst: The total number of sL1D requests that missed on a cache line that *was not* already pending due to another request, per :ref:`normalization unit <normalization-units>`. See :ref:`desc-sl1d-sol` for more detail.
    unit: Requests per Normalization Unit
  Misses- Duplicated:
    plain: The total number of sL1D requests that missed on a cache line that was already pending due to another request.
    rst: The total number of sL1D requests that missed on a cache line that *was* already pending due to another request, per :ref:`normalization unit <normalization-units>`. See :ref:`desc-sl1d-sol` for more detail.
    unit: Requests per Normalization Unit
  Read Req (Total):
    plain: The total number of sL1D read requests of any size.
    rst: The total number of sL1D read requests of any size, per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  Read Req (1 DWord):
    plain: The total number of sL1D read requests made for a single dword of data (4B).
    rst: The total number of sL1D read requests made for a single dword of data (4B), per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  Read Req (2 DWord):
    plain: The total number of sL1D read requests made for two dwords of data (8B).
    rst: The total number of sL1D read requests made for a two dwords of data (8B), per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  Read Req (4 DWord):
    plain: The total number of sL1D read requests made for four dwords of data (16B).
    rst: The total number of sL1D read requests made for a four dwords of data (16B), per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  Read Req (8 DWord):
    plain: The total number of sL1D read requests made for eight dwords of data (32B).
    rst: The total number of sL1D read requests made for a eight dwords of data (32B), per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  Read Req (16 DWord):
    plain: The total number of sL1D read requests made for sixteen dwords of data (64B).
    rst: The total number of sL1D read requests made for a sixteen dwords of data (64B), per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
Scalar L1D Cache - L2 Interface:
  Atomic Req:
    plain: The total number of atomic requests from sL1D to the L2. Typically unused on current CDNA accelerators.
    rst: The total number of atomic requests from sL1D to the :doc:`L2 <l2-cache>`, per :ref:`normalization unit <normalization-units>`. Typically unused on current CDNA accelerators.
    unit: Requests per Normalization Unit
  sL1D-L2 Bandwidth:
    plain: The number of bytes per second read from, written to, or atomically updated across the sL1D<->L2 interface. Note that sL1D writes and atomics are typically unused on current CDNA accelerators, so in the majority of cases this can be interpreted as an sL1D->L2 read bandwidth.
    rst: The total number of bytes read from, written to, or atomically updated across the sL1D\u2194:doc:`L2 <l2-cache>` interface, divided by total duration. Note that sL1D writes and atomics are typically unused on current CDNA accelerators, so in the majority of cases this can be interpreted as an sL1D\u2192L2 read bandwidth.
    unit: GB/s
  Read Req:
    plain: The total number of read requests from sL1D to the L2.
    rst: The total number of read requests from sL1D to the :doc:`L2 <l2-cache>`, per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  Write Req:
    plain: The total number of write requests from sL1D to the L2. Typically unused on current CDNA accelerators.
    rst: The total number of write requests from sL1D to the :doc:`L2 <l2-cache>`, per :ref:`normalization unit <normalization-units>`. Typically unused on current CDNA accelerators.
    unit: Requests per Normalization Unit
  Stall Cycles:
    plain: The total number of cycles the sL1D<->L2 interface was stalled.
    rst: The total number of cycles the sL1D\u2194 :doc:`L2 <l2-cache>` interface was stalled, per :ref:`normalization unit <normalization-units>`.
    unit: Cycles per Normalization Unit
Busy / stall metrics:
  Address Processing Unit Busy:
    plain: Percentage of the total CU cycles the address processor was busy.
    rst: Percent of the :ref:`total CU cycles <total-cu-cycles>` the address processor was busy
    unit: Percent
  Address Stall:
    plain: Percentage of the total CU cycles the address processor was stalled from sending address requests further into the vL1D pipeline.
    rst: Percent of the :ref:`total CU cycles <total-cu-cycles>` the address processor was stalled from sending address requests further into the vL1D pipeline
    unit: Percent
  Data Stall:
    plain: Percentage of the total CU cycles the address processor was stalled from sending write/atomic data further into the vL1D pipeline.
    rst: Percent of the :ref:`total CU cycles <total-cu-cycles>` the address processor was stalled from sending write/atomic data further into the vL1D pipeline
    unit: Percent
  Data-Processor -> Address Stall:
    plain: Percentage of total CU cycles the address processor was stalled waiting to send command data to the data processor.
    rst: Percent of :ref:`total CU cycles <total-cu-cycles>` the address processor was stalled waiting to send command data to the :ref:`data processor <desc-td>`
    unit: Percent
Instruction counts:
  Total Instructions:
    plain: The total number of memory instructions executed by the address processor over all compute units on the accelerator.
    rst: The total number of memory instructions executed by the address processor over all compute units on the accelerator.
    unit: Instructions per Normalization Unit
  Global/Generic Instructions:
    plain: The total number of global & generic memory instructions executed on all compute units on the accelerator.
    rst: The total number of global & generic memory instructions executed on all :doc:`compute units <compute-unit>` on the accelerator, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  Global/Generic Read Instructions:
    plain: The total number of global & generic memory read instructions executed on all compute units on the accelerator, counted once per wavefront.
    rst: The total number of global & generic memory read instructions executed on all :doc:`compute units <compute-unit>` on the accelerator, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  Global/Generic Write Instructions:
    plain: The total number of global & generic memory write instructions executed on all compute units on the accelerator, counted once per wavefront.
    rst: The total number of global & generic memory write instructions executed on all :doc:`compute units <compute-unit>` on the accelerator, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  Global/Generic Atomic Instructions:
    plain: The total number of global & generic memory atomic (with and without return) instructions executed on all compute units on the accelerator, counted once per wavefront.
    rst: The total number of global & generic memory atomic (with and without return) instructions executed on all :doc:`compute units <compute-unit>` on the accelerator, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  Buffer Instructions:
    plain: The total number of buffer memory instructions executed on all compute units on the accelerator.
    rst: The total number of spill/stack memory instructions executed on all :doc:`compute units <compute-unit>` on the accelerator, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  Buffer Read Instructions:
    plain: The total number of buffer read instructions processed by the address processing unit, counted once per wavefront.
    rst: The total number of spill/stack memory read instructions executed on all :doc:`compute units <compute-unit>` on the accelerator, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  Buffer Write Instructions:
    plain: The total number of buffer write instructions processed by the address processing unit, counted once per wavefront.
    rst: The total number of spill/stack memory write instructions executed on all :doc:`compute units <compute-unit>` on the accelerator, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  Buffer Atomic Instructions:
    plain: The total number of buffer atomic instructions processed by the address processing unit, counted once per wavefront.
    rst: The total number of spill/stack memory atomic (with and without return) instructions executed on all :doc:`compute units <compute-unit>` on the accelerator, per :ref:`normalization unit <normalization-units>`. Typically unused as these memory operations are typically used to implement thread-local storage.
    unit: Instructions per Normalization Unit
Spill / stack metrics:
  Buffer Total Cycles:
    plain: The number of cycles the address processing unit spent working on buffer instructions.
    rst: The number of cycles the address processing unit spent working on spill/stack instructions, per :ref:`normalization unit <normalization-units>`.
    unit: Cycles per Normalization Unit
  Buffer Coalesced Read:
    plain: The number of cycles the address processing unit spent working on coalesced buffer read instructions.
    rst: The number of cycles the address processing unit spent working on coalesced spill/stack read instructions, per :ref:`normalization unit <normalization-units>`.
    unit: Cycles per Normalization Unit
  Buffer Coalesced Write:
    plain: The number of cycles the address processing unit spent working on coalesced buffer write instructions.
    rst: The number of cycles the address processing unit spent working on coalesced spill/stack write instructions, per :ref:`normalization unit <normalization-units>`.
    unit: Cycles per Normalization Unit
Vector L1 data-return path or Texture Data (TD):
  Data-Return Busy:
    plain: Percentage of the total CU cycles the data-return unit was busy processing or waiting on data to return to the CU.
    rst: Percent of the :ref:`total CU cycles <total-cu-cycles>` the data-return unit was busy processing or waiting on data to return to the :doc:`CU <compute-unit>`.
    unit: Percent
  Cache RAM -> Data-Return Stall:
    plain: Percentage of the total CU cycles the data-return unit was stalled on data to be returned from the vL1D Cache RAM.
    rst: Percent of the :ref:`total CU cycles <total-cu-cycles>` the data-return unit was stalled on data to be returned from the :ref:`vL1D Cache RAM <desc-tc>`.
    unit: Percent
  Coalescable Instructions:
    plain: The number of instructions submitted to the data-return unit by the address processor that were found to be coalescable.
    rst: The number of instructions submitted to the :ref:`data-return unit <desc-td>` by the :ref:`address processor <desc-ta>` that were found to be coalescable, per :ref:`normalization unit <normalization-units>`.
    unit: Instructions per Normalization Unit
  Read Instructions:
    plain: The number of read instructions submitted to the data-return unit by the address processor summed over all compute units on the accelerator. This is expected to be the sum of global/generic and buffer reads in the address processor.
    rst: The number of read instructions submitted to the :ref:`data-return unit <desc-td>` by the :ref:`address processor <desc-ta>` summed over all :doc:`compute units <compute-unit>` on the accelerator, per :ref:`normalization unit <normalization-units>`. This is expected to be the sum of global/generic and spill/stack reads in the :ref:`address processor <desc-ta>`.
    unit: Instructions per Normalization Unit
  Write Instructions:
    plain: The number of store instructions submitted to the data-return unit by the address processor summed over all compute units on the accelerator. This is expected to be the sum of global/generic and buffer stores in the address processor.
    rst: The number of store instructions submitted to the :ref:`data-return unit <desc-td>` by the :ref:`address processor <desc-ta>` summed over all :doc:`compute units <compute-unit>` on the accelerator, per :ref:`normalization unit <normalization-units>`. This is expected to be the sum of global/generic and spill/stack stores counted by the :ref:`vL1D cache-front-end <ta-instruction-counts>`.
    unit: Instructions per Normalization Unit
  Atomic Instructions:
    plain: The number of atomic instructions submitted to the data-return unit by the address processor summed over all compute units on the accelerator. This is expected to be the sum of global/generic and buffer atomics in the address processor.
    rst: The number of atomic instructions submitted to the :ref:`data-return unit <desc-td>` by the :ref:`address processor <desc-ta>` summed over all :doc:`compute units <compute-unit>` on the accelerator, per :ref:`normalization unit <normalization-units>`. This is expected to be the sum of global/generic and spill/stack atomics in the :ref:`address processor <desc-ta>`.
    unit: Instructions per Normalization Unit
vL1D Speed-of-Light:
  Hit rate:
    plain: Percentage of cache line requests to the vL1D Cache RAM that hit in the vL1D cache. Calculated as 100 minus the percent of requests that were sent to the L2.
    rst: The ratio of the number of vL1D cache line requests that hit [#vl1d-hit]_ in vL1D cache over the total number of cache line requests to the :ref:`vL1D Cache RAM <desc-tc>`.
    unit: Percent
  Bandwidth Utilization:
    plain: Percentage of the peak theoretical vL1D cache bandwidth used by the bytes looked up in the vL1D cache by VMEM instructions. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    rst: The number of bytes looked up in the vL1D cache as a result of :ref:`VMEM <desc-vmem>` instructions, as a percent of the peak theoretical bandwidth achievable on the specific accelerator. The number of bytes is calculated as the number of cache lines requested multiplied by the cache line size. This value does not consider partial requests, so for instance, if only a single value is requested in a cache line, the data movement will still be counted as a full cache line.
    unit: Percent
  Utilization:
    plain: Percentage of vL1D active cycles the vL1D Cache RAM was actively processing any request. This indicates how busy the vL1D Cache RAM was during the kernel execution.
    rst: Indicates how busy the :ref:`vL1D Cache RAM <desc-tc>` was during the kernel execution. The number of cycles where the vL1D Cache RAM is actively processing any request divided by the number of cycles where the vL1D is active [#vl1d-activity]_.
    unit: Percent
  Coalescing:
    plain: Percentage of ideal coalescing the address processing unit achieved for memory instructions, ranging from uncoalesced (25%) to fully coalesced (100%). Calculated as the average number of thread-requests generated per instruction divided by the ideal number of thread-requests per instruction.
    rst: Indicates how well memory instructions were coalesced by the :ref:`address processing unit <desc-ta>`, ranging from uncoalesced (25%) to fully coalesced (100%). Calculated as the average number of :ref:`thread-requests <thread-requests>` generated per instruction divided by the ideal number of thread-requests per instruction.
    unit: Percent
vL1D cache stall metrics:
  Stalled on L2 Data:
    plain: Percentage of vL1D active cycles the vL1D was stalled waiting for requested data to return from the L2 cache.
    rst: Percentage of vL1D active cycles the vL1D was stalled waiting for requested data to return from the L2 cache.
  Stalled on L2 Req:
    plain: Percentage of vL1D active cycles the vL1D was stalled waiting to issue a request for data to the L2 cache.
    rst: Percentage of vL1D active cycles the vL1D was stalled waiting to issue a request for data to the L2 cache.
  Tag RAM Stall (Read):
    plain: Percentage of vL1D active cycles the vL1D was stalled because read requests with conflicting tags were looked up concurrently.
    rst: Percentage of vL1D active cycles the vL1D was stalled because read requests with conflicting tags were looked up concurrently.
  Tag RAM Stall (Write):
    plain: Percentage of vL1D active cycles the vL1D was stalled because write requests with conflicting tags were looked up concurrently.
    rst: Percentage of vL1D active cycles the vL1D was stalled because write requests with conflicting tags were looked up concurrently.
  Tag RAM Stall (Atomic):
    plain: Percentage of vL1D active cycles the vL1D was stalled because atomic requests with conflicting tags were looked up concurrently.
    rst: Percentage of vL1D active cycles the vL1D was stalled because atomic requests with conflicting tags were looked up concurrently.
vL1D cache access metrics:
  Total Req:
    plain: The total number of incoming requests from the address processing unit after coalescing.
    rst: The total number of incoming requests from the :ref:`address processing unit <desc-ta>` after coalescing.
    unit: Requests per Normalization Unit
  Read Req:
    plain: The total number of incoming read requests from the address processing unit after coalescing.
    rst: The total number of incoming read requests from the :ref:`address processing unit <desc-ta>` after coalescing per :ref:`normalization unit <normalization-units>`
    unit: Requests per Normalization Unit
  Write Req:
    plain: The total number of incoming write requests from the address processing unit after coalescing.
    rst: The total number of incoming write requests from the :ref:`address processing unit <desc-ta>` after coalescing per :ref:`normalization unit <normalization-units>`
    unit: Requests per Normalization Unit
  Atomic Req:
    plain: The total number of incoming atomic requests from the address processing unit after coalescing.
    rst: The total number of incoming atomic requests from the :ref:`address processing unit <desc-ta>` after coalescing per :ref:`normalization unit <normalization-units>`
    unit: Requests per Normalization Unit
  Cache Bandwidth:
    plain: The number of bytes per second looked up in the vL1D cache by VMEM instructions. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    rst: The number of bytes looked up in the vL1D cache as a result of :ref:`VMEM <desc-vmem>` instructions divided by total duration. The number of bytes is calculated as the number of cache lines requested multiplied by the cache line size. This value does not consider partial requests, so for instance, if only a single value is requested in a cache line, the data movement will still be counted as a full cache line.
    unit: GB/s
  Cache Hit Rate:
    plain: Percentage of cache line requests to the vL1D Cache RAM that hit in the vL1D cache. Calculated as 100 minus the percent of requests that were sent to the L2.
    rst: The ratio of the number of vL1D cache line requests that hit in vL1D cache over the total number of cache line requests to the :ref:`vL1D Cache RAM <desc-tc>`.
    unit: Percent
  Cache Accesses:
    plain: The total number of cache line lookups in the vL1D.
    rst: The total number of cache line lookups in the vL1D.
    unit: Requests per Normalization Unit
  Cache Hits:
    plain: The number of cache accesses minus the number of outgoing requests to the L2 cache, that is, the number of cache line requests serviced by the vL1D Cache RAM.
    rst: The number of cache accesses minus the number of outgoing requests to the :doc:`L2 cache <l2-cache>`, that is, the number of cache line requests serviced by the :ref:`vL1D Cache RAM <desc-tc>` per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  Invalidations:
    plain: The number of times the vL1D was issued a write-back invalidate command during the kernel's execution. This may be triggered by, for example, the buffer_wbinvl1 instruction.
    rst: The number of times the vL1D was issued a write-back invalidate command during the kernel's execution per :ref:`normalization unit <normalization-units>`. This may be triggered by, for instance, the ``buffer_wbinvl1`` instruction.
    unit: Requests per Normalization Unit
  vL1D-L2 Bandwidth:
    plain: The number of bytes per second transferred across the vL1D-L2 interface by VMEM instructions. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    rst: The number of bytes transferred across the vL1D-L2 interface as a result of :ref:`VMEM <desc-vmem>` instructions, divided by total duration. The number of bytes is calculated as the number of cache lines requested multiplied by the cache line size. This value does not consider partial requests, so for instance, if only a single value is requested in a cache line, the data movement will still be counted as a full cache line.
    unit: GB/s
  L1-L2 Read:
    plain: The number of read requests for a vL1D cache line that were not satisfied by the vL1D and must be retrieved from the to the L2 Cache.
    rst: The number of read requests for a vL1D cache line that were not satisfied by the vL1D and must be retrieved from the to the :doc:`L2 Cache <l2-cache>` per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  L1-L2 Write:
    plain: The number of write requests to a vL1D cache line that were sent through the vL1D to the L2 cache.
    rst: The number of write requests to a vL1D cache line that were sent through the vL1D to the :doc:`L2 cache <l2-cache>`, per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  L1-L2 Atomic:
    plain: The number of atomic requests that are sent through the vL1D to the L2 cache. This includes requests for atomics with, and without return.
    rst: The number of atomic requests that are sent through the vL1D to the :doc:`L2 cache <l2-cache>`, per :ref:`normalization unit <normalization-units>`. This includes requests for atomics with, and without return.
    unit: Requests per Normalization Unit
  vL1D Access Latency:
    plain: Calculated as the average number of cycles that a vL1D cache line request spent in the vL1D cache pipeline.
    rst: Calculated as the average number of cycles that a vL1D cache line request spent in the vL1D cache pipeline.
    unit: Cycles
  vL1D-L2 Read Latency:
    plain: Calculated as the average number of cycles that the vL1D cache took to issue and receive read requests from the L2 Cache. This number also includes requests for atomics with return values.
    rst: Calculated as the average number of cycles that the vL1D cache took to issue and receive read requests from the :doc:`L2 Cache <l2-cache>`. This number also includes requests for atomics with return values.
    unit: Cycles
  vL1D-L2 Write Latency:
    plain: Calculated as the average number of cycles that the vL1D cache took to issue and receive acknowledgement of a write request to the L2 Cache. This number also includes requests for atomics without return values.
    rst: Calculated as the average number of cycles that the vL1D cache took to issue and receive acknowledgement of a write request to the :doc:`L2 Cache <l2-cache>`. This number also includes requests for atomics without return values.
    unit: Cycles
L1 Unified Translation Cache (UTCL1):
  Req:
    plain: The number of translation requests made to the UTCL1.
    rst: The number of translation requests made to the UTCL1.
    unit: Requests per Normalization Unit
  Hit Ratio:
    plain: Percentage of translation requests to the UTCL1 that hit in the UTCL1.
    rst: Percentage of translation requests to the UTCL1 that hit in the UTCL1.
    unit: Percent
  Hits:
    plain: The number of translation requests that hit in the UTCL1, and could be reused.
    rst: The number of translation requests that hit in the UTCL1, and could be reused.
    unit: Requests per Normalization Unit
  Translation Misses:
    plain: The total number of translation requests that missed in the UTCL1 due to translation not being present in the cache.
    rst: The total number of translation requests that missed in the UTCL1 due to translation not being present in the cache.
    unit: Requests per Normalization Unit
  Permission Misses:
    plain: The total number of translation requests that missed in the UTCL1 due to a permission error. This is unused and expected to be zero in most configurations for modern CDNA accelerators.
    rst: The total number of translation requests that missed in the UTCL1 due to a permission error. This is unused and expected to be zero in most configurations for modern CDNA accelerators.
    unit: Requests per Normalization Unit
L2 Speed-of-Light:
  Utilization:
    plain: Percentage of total L2 cycles an L2 channel was active, summed over all L2 channels on the accelerator.
    rst: The ratio of the :ref:`number of cycles an L2 channel was active, summed over all L2 channels on the accelerator <total-active-l2-cycles>` over the :ref:`total L2 cycles <total-l2-cycles>`.
    unit: Percent
  Peak Bandwidth:
    plain: Percentage of the peak theoretical L2 cache bandwidth used by the bytes looked up in the L2 cache. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    rst: Percentage of the peak theoretical L2 cache bandwidth used by the bytes looked up in the L2 cache. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    unit: Percent
  Hit Rate:
    plain: Percentage of incoming cache line requests to the L2 cache that hit in the L2 cache. A low rate (<50%) indicates that the workload exceeds the L2 cache capacity, leading to high memory traffic.
    rst: Percentage of incoming cache line requests to the L2 cache that hit in the L2 cache. A low rate (<50%) indicates that the workload exceeds the L2 cache capacity, leading to high memory traffic.
    unit: Percent
  L2-Fabric Read Bandwidth:
    plain: The number of bytes per second read by the L2 over the Infinity Fabric interface.
    rst: The number of bytes read by the L2 over the :ref:`Infinity Fabric interface <l2-fabric>` per unit time.
    unit: GB/s
  L2-Fabric Write and Atomic Bandwidth:
    plain: The number of bytes per second sent by the L2 over the Infinity Fabric interface by write and atomic operations. Infinity Fabric considers a request atomic only if it targets non-write-cacheable memory, for example, fine-grained or uncached memory allocations.
    rst: The number of bytes sent by the L2 over the :ref:`Infinity Fabric interface <l2-fabric>` by write and atomic operations per unit time.
    unit: GB/s
  Peak HBM Bandwidth:
    plain: Maximum theoretical bandwidth of the accelerator's local high-bandwidth memory (HBM) per unit time. This value is calculated as the number of HBM channels multiplied by the HBM channel width multiplied by the HBM clock frequency.
    rst: Maximum theoretical bandwidth of the accelerator's local high-bandwidth memory (HBM) per unit time. This value is calculated as the number of HBM channels multiplied by the HBM channel width multiplied by the HBM clock frequency.
    unit: GB/s
L2-Fabric interface metrics:
  Read Bytes:
    plain: The total number of bytes read by the L2 cache from Infinity Fabric.
    rst: The total number of bytes read by the L2 cache from Infinity Fabric.
    unit: Bytes per Normalization Unit
  HBM Read Traffic:
    plain: Percentage of L2 read requests routed to the accelerator's local high-bandwidth memory (HBM). 32B and 64B requests count the same, so this only approximates the share of the L2-Fabric read bandwidth directed to the local HBM.
    rst: The percent of read requests generated by the L2 cache that are routed to the accelerator's local high-bandwidth memory (HBM). This breakdown does not consider the *size* of the request (meaning that 32B and 64B requests are both counted as a single request), so this metric only *approximates* the percent of the L2-Fabric Read bandwidth directed to the local HBM.
    unit: Percent
  Remote Read Traffic:
    plain: Percentage of L2 read requests routed to memory other than the accelerator's local HBM, for example the CPU's DRAM or a remote accelerator's HBM. 32B and 64B requests count the same, so this only approximates the share of the L2-Fabric read bandwidth directed to remote memory.
    rst: The percent of read requests generated by the L2 cache that are routed to any memory location other than the accelerator's local high-bandwidth memory (HBM) -- for example, the CPU's DRAM or a remote accelerator's HBM. This breakdown does not consider the *size* of the request (meaning that 32B and 64B requests are both counted as a single request), so this metric only *approximates* the percent of the L2-Fabric Read bandwidth directed to a remote location.
    unit: Percent
  Uncached Read Traffic:
    plain: Percentage of L2-Fabric read bytes that come from uncached memory allocations.
    rst: Percentage of L2-Fabric read bytes that come from :ref:`uncached memory allocations <memory-type>`.
    unit: Percent
  Write and Atomic Bytes:
    plain: The total number of bytes written by the L2 over Infinity Fabric by write and atomic operations. On MI2XX, Infinity Fabric treats only requests to fine-grained or uncached memory as atomic.
    rst: The total number of bytes written by the L2 over Infinity Fabric by write and atomic operations divided by total duration. Note that on current CDNA accelerators, such as the :ref:`MI2XX <mixxx-note>`, requests are only considered *atomic* by Infinity Fabric if they are targeted at non-write-cacheable memory, for example, :ref:`fine-grained memory <memory-type>` allocations or :ref:`uncached memory <memory-type>` allocations on the MI2XX.
    unit: Bytes per Normalization Unit
  HBM Write and Atomic Traffic:
    plain: Percentage of L2 write and atomic requests routed to the accelerator's local HBM. 32B and 64B requests count the same, so this only approximates the share of bandwidth. On MI2XX, Infinity Fabric treats only requests to fine-grained or uncached memory as atomic.
    rst: The percent of write and atomic requests generated by the L2 cache that are routed to the accelerator's local high-bandwidth memory (HBM). This breakdown does not consider the *size* of the request (meaning that 32B and 64B requests are both counted as a single request), so this metric only *approximates* the percent of the L2-Fabric Write and Atomic bandwidth directed to the local HBM. Note that on current CDNA accelerators, such as the :ref:`MI2XX <mixxx-note>`, requests are only considered *atomic* by Infinity Fabric if they are targeted at :ref:`fine-grained memory <memory-type>` allocations or :ref:`uncached memory <memory-type>` allocations.
    unit: Percent
  Remote Write and Atomic Traffic:
    plain: Percentage of L2 write and atomic requests routed to memory other than the local HBM, for example the CPU's DRAM. 32B and 64B requests count the same, so this only approximates the share of bandwidth. On MI2XX, Infinity Fabric treats only requests to fine-grained or uncached memory as atomic.
    rst: The percent of read requests generated by the L2 cache that are routed to any memory location other than the accelerator's local high-bandwidth memory (HBM) -- for example, the CPU's DRAM or a remote accelerator's HBM. This breakdown does not consider the *size* of the request (meaning that 32B and 64B requests are both counted as a single request), so this metric only *approximates* the percent of the L2-Fabric Read bandwidth directed to a remote location. Note that on current CDNA accelerators, such as the :ref:`MI2XX <mixxx-note>`, requests are only considered *atomic* by Infinity Fabric if they are targeted at :ref:`fine-grained memory <memory-type>` allocations or :ref:`uncached memory <memory-type>` allocations.
    unit: Percent
  Atomic Traffic:
    plain: Percentage of L2 write requests that are atomic requests to any memory location. 32B and 64B requests count the same, so this only approximates the share of the L2-Fabric write bandwidth used by atomics. On MI2XX, Infinity Fabric treats only requests to fine-grained or uncached memory as atomic.
    rst: The percent of write requests generated by the L2 cache that are atomic requests to *any* memory location. This breakdown does not consider the *size* of the request (meaning that 32B and 64B requests are both counted as a single request), so this metric only *approximates* the percent of the L2-Fabric Read bandwidth directed to a remote location. Note that on current CDNA accelerators, such as the :ref:`MI2XX <mixxx-note>`, requests are only considered *atomic* by Infinity Fabric if they are targeted at :ref:`fine-grained memory <memory-type>` allocations or :ref:`uncached memory <memory-type>` allocations.
    unit: Percent
  Uncached Write and Atomic Traffic:
    plain: Percentage of write and atomic requests generated by the L2 cache that target uncached memory allocations. A 64B write or atomic request counts as two uncached requests, so this metric can reach 200% of the write and atomic requests.
    rst: The percent of write and atomic requests generated by the L2 cache that are targeting :ref:`uncached memory allocations <memory-type>`. This breakdown does not consider the *size* of the request (meaning that 32B and 64B requests are both counted as a single request), so this metric only *approximates* the percent of the L2-Fabric read bandwidth directed to uncached memory allocations.
    unit: Percent
  Read Latency:
    plain: The time-averaged number of cycles read requests spent in Infinity Fabric before data was returned to the L2.
    rst: The time-averaged number of cycles read requests spent in Infinity Fabric before data was returned to the L2.
    unit: Cycles
  Write and Atomic Latency:
    plain: The time-averaged number of cycles write requests spent in Infinity Fabric before a completion acknowledgement was returned to the L2.
    rst: The time-averaged number of cycles write requests spent in Infinity Fabric before a completion acknowledgement was returned to the L2.
    unit: Cycles
  Atomic Latency:
    plain: The time-averaged number of cycles atomic requests spent in Infinity Fabric before a completion acknowledgement (atomic without return value) or data (atomic with return value) was returned to the L2.
    rst: The time-averaged number of cycles atomic requests spent in Infinity Fabric before a completion acknowledgement (atomic without return value) or data (atomic with return value) was returned to the L2.
    unit: Cycles
L2 cache accesses:
  Bandwidth:
    plain: The number of bytes per second looked up in the L2 cache. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    rst: The number of bytes per second looked up in the L2 cache. The number of bytes is the number of cache lines requested times the cache line size; a partial request counts as a full cache line.
    unit: GB/s
  Req:
    plain: The total number of incoming requests to the L2 from all clients for all request types.
    rst: The total number of incoming requests to the L2 from all clients for all request types, per :ref:`normalization unit <normalization-units>`.
    unit: Requests per Normalization Unit
  Read Req:
    plain: The total number of read requests to the L2 from all clients.
    rst: The total number of read requests to the L2 from all clients.
    unit: Requests per Normalization Unit
  Write Req:
    plain: The total number of write requests to the L2 from all clients.
    rst: The total number of write requests to the L2 from all clients.
    unit: Requests per Normalization Unit
  Atomic Req:
    plain: The total number of atomic requests (with and without return) to the L2 from all clients.
    rst: The total number of atomic requests (with and without return) to the L2 from all clients.
    unit: Requests per Normalization Unit
  Streaming Req:
    plain: The total number of incoming L2 requests marked as streaming; on MI2XX these are non-temporal loads and stores. When the L2 is full, it evicts streaming requests before normal ones.
    rst: The total number of incoming requests to the L2 that are marked as *streaming*. The exact meaning of this may differ depending on the targeted accelerator, however on an :ref:`MI2XX <mixxx-note>` this corresponds to `non-temporal load or stores <https://clang.llvm.org/docs/LanguageExtensions.html#non-temporal-load-store-builtins>`_. The L2 cache attempts to evict *streaming* requests before normal requests when the L2 is at capacity.
    unit: Requests per Normalization Unit
  Probe Req:
    plain: The number of coherence probe requests made to the L2 cache from outside the accelerator. On an MI2XX, probe requests may be generated by, for example, writes to fine-grained device memory or by writes to coarse-grained device memory.
    rst: The number of coherence probe requests made to the L2 cache from outside the accelerator. On an :ref:`MI2XX <mixxx-note>`, probe requests may be generated by, for example, writes to :ref:`fine-grained device <memory-type>` memory or by writes to :ref:`coarse-grained <memory-type>` device memory.
    unit: Requests per Normalization Unit
  L2 Cache Hit Rate:
    plain: Percentage of incoming cache line requests to the L2 cache that hit in the L2 cache. A low rate (<50%) indicates that the workload exceeds the L2 cache capacity, leading to high memory traffic.
    rst: Percentage of incoming cache line requests to the L2 cache that hit in the L2 cache. A low rate (<50%) indicates that the workload exceeds the L2 cache capacity, leading to high memory traffic.
    unit: Percent
  Hits:
    plain: The total number of requests to the L2 from all clients that hit in the cache. This includes hit-on-miss requests.
    rst: The total number of requests to the L2 from all clients that hit in the cache. As noted in the :ref:`Speed-of-Light <l2-sol>` section, this includes hit-on-miss requests.
    unit: Hits per Normalization Unit
  Misses:
    plain: The total number of requests to the L2 from all clients that miss in the cache. These do not include hit-on-miss requests.
    rst: The total number of requests to the L2 from all clients that miss in the cache. As noted in the :ref:`Speed-of-Light <l2-sol>` section, these do not include hit-on-miss requests.
    unit: Misses per Normalization Unit
  Writeback:
    plain: The total number of L2 cache lines written back to memory for any reason. Write-backs may occur due to user code (such as HIP kernel calls to _threadfence_system or atomic built-ins) by the command processor's memory acquire/release fences, or for other internal hardware reasons.
    rst: The total number of L2 cache lines written back to memory for any reason. Write-backs may occur due to user code (such as HIP kernel calls to ``__threadfence_system`` or atomic built-ins) by the :doc:`command processor <command-processor>`'s memory acquire/release fences, or for other internal hardware reasons.
    unit: Cachelines per Normalization Unit
  Writeback (Internal):
    plain: The total number of L2 cache lines written back to memory for internal hardware reasons.
    rst: The total number of L2 cache lines written back to memory for internal hardware reasons, per :ref:`normalization unit <normalization-units>`.
    unit: Cachelines per Normalization Unit
  Writeback (vL1D Req):
    plain: The total number of L2 cache lines written back to memory due to requests initiated by the vL1D cache.
    rst: The total number of L2 cache lines written back to memory due to requests initiated by the :doc:`vL1D cache <vector-l1-cache>`, per :ref:`normalization unit <normalization-units>`.
    unit: Cachelines per Normalization Unit
  Evict (Internal):
    plain: The total number of L2 cache lines evicted from the cache due to capacity limits.
    rst: The total number of L2 cache lines evicted from the cache due to capacity limits, per :ref:`normalization unit <normalization-units>`.
    unit: Cachelines per Normalization Unit
  Evict (vL1D Req):
    plain: The total number of L2 cache lines evicted from the cache due to invalidation requests initiated by the vL1D cache.
    rst: The total number of L2 cache lines evicted from the cache due to invalidation requests initiated by the :doc:`vL1D cache <vector-l1-cache>`, per :ref:`normalization unit <normalization-units>`.
    unit: Cachelines per Normalization Unit
  NC Req:
    plain: The total number of requests to the L2 to Not-hardware-Coherent (NC) memory allocations.
    rst: The total number of requests to the L2 to Not-hardware-Coherent (NC) memory allocations, per :ref:`normalization unit <normalization-units>`. See the :ref:`memory-type` for more information.
    unit: Requests per Normalization Unit
  UC Req:
    plain: The total number of requests to the L2 that go to Uncached (UC) memory allocations.
    rst: The total number of requests to the L2 that go to Uncached (UC) memory allocations. See the :ref:`memory-type` for more information.
    unit: Requests per Normalization Unit
  CC Req:
    plain: The total number of requests to the L2 that go to Coherently Cacheable (CC) memory allocations.
    rst: The total number of requests to the L2 that go to Coherently Cacheable (CC) memory allocations. See the :ref:`memory-type` for more information.
    unit: Requests per Normalization Unit
  RW Req:
    plain: The total number of requests to the L2 that go to Read-Write coherent memory (RW) allocations.
    rst: The total number of requests to the L2 that go to Read-Write coherent memory (RW) allocations. See the :ref:`memory-type` for more information.
    unit: Requests per Normalization Unit
L2 - Fabric Interface stalls:
  Write - Credit Starvation:
    plain: Percentage of active L2 cycles the L2-Fabric interface was stalled on write or atomic requests to any memory location because too many write/atomic requests were currently in flight.
    rst: The number of cycles the L2-Fabric interface was stalled on write or atomic requests to any memory location because too many write/atomic requests were currently in flight, as a percent of the :ref:`total active L2 cycles <total-active-l2-cycles>`.
    unit: Percent
L2 - Fabric interface detailed metrics:
  Read (32B):
    plain: The total number of L2 requests to Infinity Fabric to read 32B of data from any memory location.
    rst: The total number of L2 requests to Infinity Fabric to read 32B of data from any memory location, per :ref:`normalization unit <normalization-units>`. See :ref:`l2-request-flow` for more detail. Typically unused on CDNA accelerators.
    unit: Requests per Normalization Unit
  Read (64B):
    plain: The total number of L2 requests to Infinity Fabric to read 64B of data from any memory location.
    rst: The total number of L2 requests to Infinity Fabric to read 64B of data from any memory location, per :ref:`normalization unit <normalization-units>`. See :ref:`l2-request-flow` for more detail.
    unit: Requests per Normalization Unit
  Read (Uncached):
    plain: The total number of L2 requests to Infinity Fabric to read uncached data from any memory location. 64B requests for uncached data are counted as two 32B uncached data requests.
    rst: The total number of L2 requests to Infinity Fabric to read :ref:`uncached data <memory-type>` from any memory location, per :ref:`normalization unit <normalization-units>`. 64B requests for uncached data are counted as two 32B uncached data requests. See :ref:`l2-request-flow` for more detail.
    unit: Requests per Normalization Unit
  HBM Read:
    plain: The total number of L2 requests to Infinity Fabric to read 32B or 64B of data from the accelerator's local HBM.
    rst: The total number of L2 requests to Infinity Fabric to read 32B or 64B of data from the accelerator's local HBM, per :ref:`normalization unit <normalization-units>`. See :ref:`l2-request-flow` for more detail.
    unit: Requests per Normalization Unit
  Remote Read:
    plain: The total number of L2 requests to Infinity Fabric to read 32B or 64B of data from any source other than the accelerator's local HBM.
    rst: The total number of L2 requests to Infinity Fabric to read 32B or 64B of data from any source other than the accelerator's local HBM, per :ref:`normalization unit <normalization-units>`. See :ref:`l2-request-flow` for more detail.
    unit: Requests per Normalization Unit
  Write and Atomic (32B):
    plain: The total number of L2 requests to Infinity Fabric to write or atomically update 32B of data to any memory location.
    rst: The total number of L2 requests to Infinity Fabric to write or atomically update 32B of data to any memory location, per :ref:`normalization unit <normalization-units>`. See :ref:`l2-request-flow` for more detail.
    unit: Requests per Normalization Unit
  Write and Atomic (Uncached):
    plain: The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of uncached data.
    rst: The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of :ref:`uncached data <memory-type>`, per :ref:`normalization unit <normalization-units>`. See :ref:`l2-request-flow` for more detail.
    unit: Requests per Normalization Unit
  Write and Atomic (64B):
    plain: The total number of L2 requests to Infinity Fabric to write or atomically update 64B of data in any memory location.
    rst: The total number of L2 requests to Infinity Fabric to write or atomically update 64B of data in any memory location, per :ref:`normalization unit <normalization-units>`. See :ref:`l2-request-flow` for more detail.
    unit: Requests per Normalization Unit
  HBM Write and Atomic:
    plain: The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of data in the accelerator's local HBM.
    rst: The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of data in the accelerator's local HBM, per :ref:`normalization unit <normalization-units>`. See :ref:`l2-request-flow` for more detail. plain
    unit: Requests per Normalization Unit
  Remote Write and Atomic:
    plain: The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of data in any memory location other than the accelerator's local HBM.
    rst: The total number of L2 requests to Infinity Fabric to write or atomically update 32B or 64B of data in any memory location other than the accelerator's local HBM, per :ref:`normalization unit <normalization-units>`. See :ref:`l2-request-flow` for more detail.
    unit: Requests per Normalization Unit
  Atomic:
    plain: The total number of L2 requests to Infinity Fabric to atomically update 32B or 64B of data in any memory location. On MI2XX, Infinity Fabric treats only requests to fine-grained or uncached memory as atomic.
    rst: The total number of L2 requests to Infinity Fabric to atomically update 32B or 64B of data in any memory location, per :ref:`normalization unit <normalization-units>`. See :ref:`l2-request-flow` for more detail. Note that on current CDNA accelerators, such as the :ref:`MI2XX <mixxx-note>`, requests are only considered *atomic* by Infinity Fabric if they are targeted at non-write-cacheable memory, such as :ref:`fine-grained memory <memory-type>` allocations or :ref:`uncached memory <memory-type>` allocations on the MI2XX.
    unit: Requests per Normalization Unit
Roofline Plot Points:
  AI L1:
    plain: The Arithmetic Intensity (AI) relative to the L1 Cache. It is the ratio of total floating-point operations (FLOPs) to total bytes transferred between the L1 cache and the processing units.
    rst: The Arithmetic Intensity (AI) relative to the L1 Cache. It is the ratio of total floating-point operations (FLOPs) to total bytes transferred between the L1 cache and the processing units.
    unit: FLOPs/Byte
  AI L2:
    plain: The Arithmetic Intensity (AI) relative to the L2 Cache. It is the ratio of total floating-point operations (FLOPs) to total bytes transferred between the L2 cache and the L1 cache.
    rst: The Arithmetic Intensity (AI) relative to the L2 Cache. It is the ratio of total floating-point operations (FLOPs) to total bytes transferred between the L2 cache and the L1 cache.
    unit: FLOPs/Byte
  AI HBM:
    plain: The Arithmetic Intensity (AI) relative to High-Bandwidth Memory (HBM). It is the ratio of total floating-point operations (FLOPs) to total bytes transferred between HBM and the L2 cache.
    rst: The Arithmetic Intensity (AI) relative to High-Bandwidth Memory (HBM). It is the ratio of total floating-point operations (FLOPs) to total bytes transferred between HBM and the L2 cache.
    unit: FLOPs/Byte
  AI LDS:
    plain: Arithmetic Intensity relative to the Local Data Share (LDS). Higher values indicate more compute per byte of LDS traffic, suggesting effective reuse of shared data within a workgroup. Lower values suggest memory-bound behavior limited by LDS bandwidth or bank-conflict pressure.
    rst: Arithmetic Intensity relative to the Local Data Share (LDS). Higher values indicate more compute per byte of LDS traffic, suggesting effective reuse of shared data within a workgroup. Lower values suggest memory-bound behavior limited by LDS bandwidth or bank-conflict pressure.
    unit: FLOPs/Byte
  Performance (GFLOPs):
    plain: The overall achieved performance, measured in GigaFLOPs per second (GFLOP/s). This is calculated as the sum of all VALU and MFMA floating-point operations divided by the total execution time. This value is used as the y-coordinate for the kernel's point on the Roofline plot.
    rst: The overall achieved performance, measured in GigaFLOPs per second (GFLOP/s). This is calculated as the sum of all VALU and MFMA floating-point operations divided by the total execution time. This value is used as the y-coordinate for the kernel's point on the Roofline plot.
    unit: GFLOP/s
