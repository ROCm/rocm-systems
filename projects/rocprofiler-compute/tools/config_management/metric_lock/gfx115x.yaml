gl1.gl2_wr_req:
  formula: SUM(GL1C_GL2_REQ_WRITE_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GL1C_GL2_REQ_WRITE_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl1.hit_rate:
  formula: 100 * SUM(GL1C_REQ_sum - GL1C_REQ_MISS_sum) / SUM(GL1C_REQ_sum)
  unit: Percent
  peak: 100
  counters: [GL1C_REQ_MISS_sum, GL1C_REQ_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl1.lfifo_full_stall:
  formula: SUM(GL1C_STALL_LFIFO_FULL_sum) / SUM($denom)
  unit: (Cycles + $normUnit)
  counters: [GL1C_STALL_LFIFO_FULL_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl1.miss_req:
  formula: SUM(GL1C_REQ_MISS_sum) / SUM($denom)
  unit: (Count + $normUnit)
  counters: [GL1C_REQ_MISS_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl1.rd_req:
  formula: SUM(GL1C_REQ_READ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GL1C_REQ_READ_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl1.stall_gl2_backpressure:
  formula: 100 * SUM(GL1C_STALL_GL2_GL1_sum) / SUM(GL1C_BUSY_sum)
  unit: Percent
  counters: [GL1C_BUSY_sum, GL1C_STALL_GL2_GL1_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl1.starve:
  formula: 100 * SUM(GL1C_STARVE) / SUM(GL1C_CYCLE)
  unit: Percent
  counters: [GL1C_CYCLE, GL1C_STARVE, GRBM_GUI_ACTIVE, SQ_WAVES]
gl1.total_req:
  formula: SUM(GL1C_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GL1C_REQ_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl1.util:
  formula: 100 * SUM(GL1C_BUSY_sum) / SUM(GL1C_CYCLE_sum)
  unit: Percent
  counters: [GL1C_BUSY_sum, GL1C_CYCLE_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl1.wr_req:
  formula: SUM(GL1C_REQ_WRITE_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GL1C_REQ_WRITE_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl2.atomic_req:
  formula: SUM(GL2C_ATOMIC_sum) / SUM($denom)
  unit: (Count + $normUnit)
  counters: [GL2C_ATOMIC_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl2.ea_rd_req_dram:
  formula: SUM(GL2C_EA_RDREQ_DRAM_sum) / SUM($denom)
  unit: (Count + $normUnit)
  counters: [GL2C_EA_RDREQ_DRAM_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl2.ea_wr_req_dram:
  formula: SUM(GL2C_EA_WRREQ_DRAM_sum) / SUM($denom)
  unit: (Count + $normUnit)
  counters: [GL2C_EA_WRREQ_DRAM_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl2.fabric_rd_bw:
  formula: SUM(GL2C_EA_RDREQ_32B_sum * 32 + GL2C_EA_RDREQ_64B_sum * 64 + GL2C_EA_RDREQ_96B_sum * 96 + GL2C_EA_RDREQ_128B_sum * 128) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  peak: $max_mclk * 4 * $num_memory_channels * 4 / 1000
  counters: [GL2C_EA_RDREQ_128B_sum, GL2C_EA_RDREQ_32B_sum, GL2C_EA_RDREQ_64B_sum, GL2C_EA_RDREQ_96B_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl2.fabric_wr_bw:
  formula: SUM(GL2C_EA_WRREQ_64B_sum * 64 + (GL2C_MC_WRREQ_sum - GL2C_EA_WRREQ_64B_sum) * 32) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  peak: $max_mclk * 4 * $num_memory_channels * 4 / 1000
  counters: [GL2C_EA_WRREQ_64B_sum, GL2C_MC_WRREQ_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl2.hit_rate:
  formula: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
  unit: Percent
  peak: 100
  counters: [GL2C_HIT_sum, GL2C_MISS_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl2.hits:
  formula: SUM(GL2C_HIT_sum) / SUM($denom)
  unit: (Count + $normUnit)
  counters: [GL2C_HIT_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl2.misses:
  formula: SUM(GL2C_MISS_sum) / SUM($denom)
  unit: (Count + $normUnit)
  counters: [GL2C_MISS_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl2.rd_req:
  formula: SUM(GL2C_READ_sum) / SUM($denom)
  unit: (Count + $normUnit)
  counters: [GL2C_READ_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl2.total_req:
  formula: SUM(GL2C_REQ_sum) / SUM($denom)
  unit: (Count + $normUnit)
  counters: [GL2C_REQ_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl2.util:
  formula: 100 * SUM(GL2C_BUSY_sum) / SUM(GL2C_CYCLE_sum)
  unit: Percent
  counters: [GL2C_BUSY_sum, GL2C_CYCLE_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl2.wr_bw:
  formula: 64 * SUM(GL2C_WRITE_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  counters: [GL2C_WRITE_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
gl2.wr_req:
  formula: SUM(GL2C_WRITE_sum) / SUM($denom)
  unit: (Count + $normUnit)
  counters: [GL2C_WRITE_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
grbm.cp_util:
  formula: 100 * SUM(GRBM_CP_BUSY) / SUM(GRBM_GUI_ACTIVE)
  unit: Percent
  counters: [GRBM_CP_BUSY, GRBM_GUI_ACTIVE, SQ_WAVES]
grbm.gl2c_busy:
  formula: 100 * SUM(GRBM_GL2C_BUSY) / SUM(GRBM_GUI_ACTIVE)
  unit: Percent
  counters: [GRBM_GL2C_BUSY, GRBM_GUI_ACTIVE, SQ_WAVES]
grbm.gpu_busy:
  formula: 100 * SUM(GRBM_GUI_ACTIVE) / SUM(GRBM_COUNT)
  unit: Percent
  counters: [GRBM_COUNT, GRBM_GUI_ACTIVE, SQ_WAVES]
grbm.ta_busy:
  formula: 100 * SUM(GRBM_TA_BUSY) / SUM(GRBM_GUI_ACTIVE)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, GRBM_TA_BUSY, SQ_WAVES]
l1i.gl1_rd_bw:
  formula: 128 * SUM(SQC_TC_INST_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  peak: $sqc_per_gpu * 64 * $max_sclk / 1000
  counters: [GRBM_GUI_ACTIVE, SQC_TC_INST_REQ_sum, SQ_WAVES]
l1i.hit_rate_excl_dup:
  formula: 100 * SUM(SQC_ICACHE_HITS_sum) / SUM(SQC_ICACHE_HITS_sum + SQC_ICACHE_MISSES_sum)
  unit: Percent
  peak: 100
  counters: [GRBM_GUI_ACTIVE, SQC_ICACHE_HITS_sum, SQC_ICACHE_MISSES_sum, SQ_WAVES]
l1i.req:
  formula: SUM(SQC_ICACHE_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQC_ICACHE_REQ_sum, SQ_WAVES]
l2.ai:
  formula: SUM($valu_flops) / SUM($gl2_read_bytes + $gl2_write_bytes)
  unit: FLOPs/Byte
  counters: [GL1C_GL2_REQ_READ_128B_sum, GL1C_GL2_REQ_READ_32B_sum, GL1C_GL2_REQ_READ_64B_sum, GL1C_GL2_REQ_WRITE_32B_sum, GL1C_GL2_REQ_WRITE_64B_sum, GRBM_GUI_ACTIVE, SQ_INSTS_VALU_sum, SQ_WAVES]
l2.bw:
  formula: SUM(GL2C_READ_32_REQ_sum * 32 + GL2C_READ_64_REQ_sum * 64 + GL2C_READ_128_REQ_sum * 128 + GL2C_COMPRESSED_READ_96_REQ_sum * 96) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  peak: $total_l2_chan * 128 * $max_sclk / 1000
  counters: [GL2C_COMPRESSED_READ_96_REQ_sum, GL2C_READ_128_REQ_sum, GL2C_READ_32_REQ_sum, GL2C_READ_64_REQ_sum, GRBM_GUI_ACTIVE, SQ_WAVES]
lds.ai:
  formula: SUM($wave_size * SQ_INSTS_VALU_sum) / SUM((SQC_LDS_IDX_ACTIVE_sum - SQC_LDS_BANK_CONFLICT_sum) * 4 * $lds_banks_per_cu)
  unit: FLOPs/Byte
  counters: [GRBM_GUI_ACTIVE, SQC_LDS_BANK_CONFLICT_sum, SQC_LDS_IDX_ACTIVE_sum, SQ_INSTS_VALU_sum, SQ_WAVES]
lds.bank_conflict_rate:
  formula: 100 * SUM(SQC_LDS_BANK_CONFLICT_sum) / SUM(SQC_LDS_IDX_ACTIVE_sum)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, SQC_LDS_BANK_CONFLICT_sum, SQC_LDS_IDX_ACTIVE_sum, SQ_WAVES]
lds.bank_conflicts:
  formula: AVG(SQC_LDS_BANK_CONFLICT)
  unit: Conflicts
  counters: [GRBM_GUI_ACTIVE, SQC_LDS_BANK_CONFLICT, SQ_WAVES]
lds.theoretical_bw:
  formula: SUM((SQC_LDS_IDX_ACTIVE_sum - SQC_LDS_BANK_CONFLICT_sum) * 4 * $lds_banks_per_cu) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  peak_empirical: $LDSBw_empirical_peak
  counters: [GRBM_GUI_ACTIVE, SQC_LDS_BANK_CONFLICT_sum, SQC_LDS_IDX_ACTIVE_sum, SQ_WAVES]
lds.util:
  formula: 100 * SUM(SQC_LDS_IDX_ACTIVE_sum) / (SUM(GRBM_GUI_ACTIVE) * $cu_per_gpu)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, SQC_LDS_IDX_ACTIVE_sum, SQ_WAVES]
sl1d.gl1_rd_bw:
  formula: 128 * SUM(SQC_TC_DATA_READ_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  peak: $sqc_per_gpu * 64 * $max_sclk / 1000
  counters: [GRBM_GUI_ACTIVE, SQC_TC_DATA_READ_REQ_sum, SQ_WAVES]
sl1d.hit_rate_excl_dup:
  formula: 100 * SUM(SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_HITS_sum + SQC_DCACHE_MISSES_sum)
  unit: Percent
  peak: 100
  counters: [GRBM_GUI_ACTIVE, SQC_DCACHE_HITS_sum, SQC_DCACHE_MISSES_sum, SQ_WAVES]
sl1d.req:
  formula: SUM(SQC_DCACHE_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQC_DCACHE_REQ_sum, SQ_WAVES]
spi.compute_wave_dispatches:
  formula: SUM(SPI_CSN_WAVE) / SUM($denom)
  unit: (Count + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SPI_CSN_WAVE, SQ_WAVES]
spi.wave_dispatch_rate:
  formula: SUM(SPI_CSN_WAVE) / SUM(GRBM_GUI_ACTIVE)
  unit: Wavefronts per Cycle
  counters: [GRBM_GUI_ACTIVE, SPI_CSN_WAVE, SQ_WAVES]
spi.workgroup_manager_util:
  formula: 100 * SUM(GRBM_SPI_BUSY) / SUM(GRBM_GUI_ACTIVE)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, GRBM_SPI_BUSY, SQ_WAVES]
vl1d.ai:
  formula: SUM($wave_size * SQ_INSTS_VALU_sum) / (64 * SUM(TCP_GL1_REQ_READ_sum + TCP_GL1_REQ_WRITE_sum))
  unit: FLOPs/Byte
  counters: [GRBM_GUI_ACTIVE, SQ_INSTS_VALU_sum, SQ_WAVES, TCP_GL1_REQ_READ_sum, TCP_GL1_REQ_WRITE_sum]
wave.dispatched_threads:
  formula: AVG(SQ_ITEMS_sum)
  unit: Threads
  counters: [GRBM_GUI_ACTIVE, SQ_ITEMS_sum, SQ_WAVES]
wave.dispatched_wavefronts:
  formula: AVG(SQ_WAVES_sum)
  unit: Wavefronts
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, SQ_WAVES_sum]
wave.life:
  formula: SUM(SQ_WAVE_CYCLES_sum) / SUM(SQ_WAVES_sum)
  unit: Cycles
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, SQ_WAVES_sum, SQ_WAVE_CYCLES_sum]
wave.occupancy_pct:
  formula: 100 * SUM(SQ_WAVE_CYCLES_sum) / SUM(SQ_BUSY_CYCLES_sum * 2 * $max_waves_per_cu)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, SQ_BUSY_CYCLES_sum, SQ_WAVES, SQ_WAVE_CYCLES_sum]
wave.wait_for_any:
  formula: 100 * SUM(SQ_WAIT_ANY) / SUM(SQ_WAVE_CYCLES)
  unit: Percent
  peak: 100
  counters: [GRBM_GUI_ACTIVE, SQ_WAIT_ANY, SQ_WAVES, SQ_WAVE_CYCLES]
wave.wait_for_barrier:
  formula: 100 * SUM(SQ_WAIT_BARRIER) / SUM(SQ_WAVE_CYCLES)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, SQ_WAIT_BARRIER, SQ_WAVES, SQ_WAVE_CYCLES]
wave.wait_for_counter:
  formula: 100 * SUM(SQ_WAIT_CNT_ANY) / SUM(SQ_WAVE_CYCLES)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, SQ_WAIT_CNT_ANY, SQ_WAVES, SQ_WAVE_CYCLES]
wave.wait_for_inst_fetch:
  formula: 100 * SUM(SQ_WAIT_IFETCH) / SUM(SQ_WAVE_CYCLES)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, SQ_WAIT_IFETCH, SQ_WAVES, SQ_WAVE_CYCLES]
