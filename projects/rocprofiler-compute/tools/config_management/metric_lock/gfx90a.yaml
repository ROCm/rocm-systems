  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TOTAL_READ_sum]
vl1d.req:
  formula: SUM(TCP_UTCL1_REQUEST_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_UTCL1_REQUEST_sum]
vl1d.rw_atomic:
