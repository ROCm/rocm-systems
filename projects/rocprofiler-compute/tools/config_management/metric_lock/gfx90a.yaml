  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TD_ATOMIC_WAVEFRONT_sum, TD_LOAD_WAVEFRONT_sum, TD_STORE_WAVEFRONT_sum]
td.spi_stall:
  formula: 100 * SUM(TD_SPI_STALL_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TD_SPI_STALL_sum]
td.tc_stall:
  formula: 100 * SUM(TD_TC_STALL_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TD_TC_STALL_sum]
td.wr_insts:
  formula: SUM(TD_STORE_WAVEFRONT_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TD_STORE_WAVEFRONT_sum]
vl1d.access_lat:
  formula: SUM(TCP_TCP_LATENCY_sum) / SUM(TCP_TA_TCP_STATE_READ_sum)
  unit: Cycles
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TA_TCP_STATE_READ_sum, TCP_TCP_LATENCY_sum]
vl1d.ai:
  formula: SUM($valu_f16_flops + $valu_f32_flops + $valu_f64_flops + $mfma_f16_flops + $mfma_bf16_flops + $mfma_f32_flops + $mfma_f64_flops) / SUM($l1_bytes)
  unit: FLOPs/Byte
  counters: [GRBM_GUI_ACTIVE, SQ_INSTS_VALU_ADD_F16, SQ_INSTS_VALU_ADD_F32, SQ_INSTS_VALU_ADD_F64, SQ_INSTS_VALU_FMA_F16, SQ_INSTS_VALU_FMA_F32, SQ_INSTS_VALU_FMA_F64, SQ_INSTS_VALU_MFMA_MOPS_BF16, SQ_INSTS_VALU_MFMA_MOPS_F16, SQ_INSTS_VALU_MFMA_MOPS_F32, SQ_INSTS_VALU_MFMA_MOPS_F64, SQ_INSTS_VALU_MUL_F16, SQ_INSTS_VALU_MUL_F32, SQ_INSTS_VALU_MUL_F64, SQ_INSTS_VALU_TRANS_F16, SQ_INSTS_VALU_TRANS_F32, SQ_INSTS_VALU_TRANS_F64, SQ_WAVES, TCP_TOTAL_CACHE_ACCESSES_sum]
vl1d.atomic_req:
  formula: SUM(TCP_TOTAL_ATOMIC_WITH_RET_sum + TCP_TOTAL_ATOMIC_WITHOUT_RET_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TOTAL_ATOMIC_WITHOUT_RET_sum, TCP_TOTAL_ATOMIC_WITH_RET_sum]
vl1d.bw_util:
  formula: 100 * 64 * SUM(TCP_TOTAL_CACHE_ACCESSES_sum) / SUM(End_Timestamp - Start_Timestamp) / ($max_sclk / 1000 * 64 * $cu_per_gpu)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TOTAL_CACHE_ACCESSES_sum]
vl1d.cache_accesses:
  formula: SUM(TCP_TOTAL_CACHE_ACCESSES_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TOTAL_CACHE_ACCESSES_sum]
vl1d.cache_bw:
  formula: 64 * SUM(TCP_TOTAL_CACHE_ACCESSES_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  peak: $max_sclk / 1000 * 64 * $cu_per_gpu
  peak_empirical: $L1Bw_empirical_peak
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TOTAL_CACHE_ACCESSES_sum]
vl1d.cache_hits:
  formula: SUM($vl1d_accesses_minus_read_write_misses - $vl1d_atomic_requests) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum, TCP_TCC_ATOMIC_WITH_RET_REQ_sum, TCP_TCC_READ_REQ_sum, TCP_TCC_WRITE_REQ_sum, TCP_TOTAL_CACHE_ACCESSES_sum]
vl1d.cc_atomic:
  formula: SUM(TCP_TCC_CC_ATOMIC_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_CC_ATOMIC_REQ_sum]
vl1d.cc_rd:
  formula: SUM(TCP_TCC_CC_READ_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_CC_READ_REQ_sum]
vl1d.cc_wr:
  formula: SUM(TCP_TCC_CC_WRITE_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_CC_WRITE_REQ_sum]
vl1d.coalescing:
  formula: 100 * 64 * SUM(TA_TOTAL_WAVEFRONTS_sum) / (4 * SUM(TCP_TOTAL_ACCESSES_sum))
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TA_TOTAL_WAVEFRONTS_sum, TCP_TOTAL_ACCESSES_sum]
vl1d.hit_rate:
  formula: 100 - $vl1d_read_write_miss_rate - $vl1d_atomic_miss_rate
  unit: Percent
  peak: 100
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum, TCP_TCC_ATOMIC_WITH_RET_REQ_sum, TCP_TCC_READ_REQ_sum, TCP_TCC_WRITE_REQ_sum, TCP_TOTAL_CACHE_ACCESSES_sum]
vl1d.hit_ratio:
  formula: 100 * SUM(TCP_UTCL1_TRANSLATION_HIT_sum) / SUM(TCP_UTCL1_REQUEST_sum)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_UTCL1_REQUEST_sum, TCP_UTCL1_TRANSLATION_HIT_sum]
vl1d.hits:
  formula: SUM(TCP_UTCL1_TRANSLATION_HIT_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_UTCL1_TRANSLATION_HIT_sum]
vl1d.invalidations:
  formula: SUM(TCP_TOTAL_WRITEBACK_INVALIDATES_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TOTAL_WRITEBACK_INVALIDATES_sum]
vl1d.l2_atomic_bw:
  formula: 64 * SUM(TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum, TCP_TCC_ATOMIC_WITH_RET_REQ_sum]
vl1d.l2_atomic_req:
  formula: SUM(TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum, TCP_TCC_ATOMIC_WITH_RET_REQ_sum]
vl1d.l2_bw:
  formula: 64 * SUM(TCP_TCC_READ_REQ_sum + TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  peak_empirical: $L2Bw_empirical_peak
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum, TCP_TCC_ATOMIC_WITH_RET_REQ_sum, TCP_TCC_READ_REQ_sum, TCP_TCC_WRITE_REQ_sum]
vl1d.l2_rd_bw:
  formula: 128 * SUM(TCP_TCC_READ_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_READ_REQ_sum]
vl1d.l2_rd_lat:
  formula: SUM(TCP_TCC_READ_REQ_LATENCY_sum) / SUM(TCP_TCC_READ_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum)
  unit: Cycles
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_ATOMIC_WITH_RET_REQ_sum, TCP_TCC_READ_REQ_LATENCY_sum, TCP_TCC_READ_REQ_sum]
vl1d.l2_rd_req:
  formula: SUM(TCP_TCC_READ_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_READ_REQ_sum]
vl1d.l2_wr_bw:
  formula: 64 * SUM(TCP_TCC_WRITE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_WRITE_REQ_sum]
vl1d.l2_wr_lat:
  formula: SUM(TCP_TCC_WRITE_REQ_LATENCY_sum) / SUM(TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum)
  unit: Cycles
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum, TCP_TCC_WRITE_REQ_LATENCY_sum, TCP_TCC_WRITE_REQ_sum]
vl1d.l2_wr_req:
  formula: SUM(TCP_TCC_WRITE_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_WRITE_REQ_sum]
vl1d.nc_atomic:
  formula: SUM(TCP_TCC_NC_ATOMIC_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_NC_ATOMIC_REQ_sum]
vl1d.nc_rd:
  formula: SUM(TCP_TCC_NC_READ_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_NC_READ_REQ_sum]
vl1d.nc_wr:
