  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, TCP_TCC_RW_ATOMIC_REQ_sum]
vl1d.rw_rd:
  formula: SUM(TCP_TCC_RW_READ_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
