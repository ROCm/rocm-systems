wave.active_cycles:
  formula: 4 * SUM(SQ_ACTIVE_INST_ANY) / SUM($denom)
  unit: (Cycles + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_ACTIVE_INST_ANY, SQ_WAVES]
wave.cycles:
  formula: 4 * SUM(SQ_WAVE_CYCLES) / SUM($denom)
  unit: (Cycles + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, SQ_WAVE_CYCLES]
wave.dep_wait_cycles:
  formula: 4 * SUM(SQ_WAIT_ANY) / SUM($denom)
  unit: (Cycles + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAIT_ANY, SQ_WAVES]
wave.issue_wait_cycles:
  formula: 4 * SUM(SQ_WAIT_INST_ANY) / SUM($denom)
  unit: (Cycles + $normUnit)
  counters: [GRBM_GUI_ACTIVE, SQ_WAIT_INST_ANY, SQ_WAVES]
wave.occupancy:
  formula: SUM(SQ_LEVEL_WAVES_ACCUM) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
  unit: Wavefronts
  peak: $max_waves_per_cu * $cu_per_gpu
  counters: [GRBM_GUI_ACTIVE, SQ_LEVEL_WAVES_ACCUM, SQ_WAVES]
wave.occupancy_pct:
  formula: 100 * SUM(SQ_LEVEL_WAVES_ACCUM) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $numActiveCUs * $max_waves_per_cu)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE, SQ_BUSY_CU_CYCLES, SQ_LEVEL_WAVES_ACCUM, SQ_WAVES]
wave.restored:
  formula: AVG(SQ_WAVES_RESTORED)
  unit: Wavefronts
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, SQ_WAVES_RESTORED]
wave.saved:
  formula: AVG(SQ_WAVES_SAVED)
  unit: Wavefronts
  counters: [GRBM_GUI_ACTIVE, SQ_WAVES, SQ_WAVES_SAVED]
