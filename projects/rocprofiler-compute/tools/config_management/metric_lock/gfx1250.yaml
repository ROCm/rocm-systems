  counters: [GRBM_GUI_ACTIVE_sum, SQ_BUSY_CYCLES_sum, SQ_INST_CYCLES_VMEM_LOAD_sum, SQ_WAVES]
wgp.gl0_vmem_req_bus_util:
  formula: 100 * SUM(SQ_INST_CYCLES_VMEM_sum) / SUM(SQ_BUSY_CYCLES_sum)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE_sum, SQ_BUSY_CYCLES_sum, SQ_INST_CYCLES_VMEM_sum, SQ_WAVES]
wgp.gl0_vmem_wr_req_bus_util:
