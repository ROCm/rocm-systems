  formula: SUM(SQG_WAVE_CYCLES_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Wavefronts
  peak: $max_waves_per_cu * $cu_per_gpu
  counters: [GRBM_GUI_ACTIVE_sum, SQG_WAVE_CYCLES_sum, SQ_WAVES]
wave.occupancy_pct:
  formula: 100 * SUM(SQG_WAVE_CYCLES_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu * $max_waves_per_cu)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE_sum, SQG_WAVE_CYCLES_sum, SQ_WAVES]
wgp.active_wgps:
  formula: SUM(SQG_LEVEL_WGP_ACTIVE_ACCUM) / SUM(SQG_CYCLES_sum)
  unit: Count
  peak: $cu_per_gpu
  counters: [GRBM_GUI_ACTIVE_sum, SQG_CYCLES_sum, SQG_LEVEL_WGP_ACTIVE_ACCUM, SQ_WAVES]
wgp.bus_stall_rate_row0:
  formula: 100 * SUM(SQ_VMEM_REQ_ROW0_STALL_CYCLES_sum) / SUM(SQ_BUSY_CYCLES_sum)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE_sum, SQ_BUSY_CYCLES_sum, SQ_VMEM_REQ_ROW0_STALL_CYCLES_sum, SQ_WAVES]
wgp.bus_stall_rate_row1:
