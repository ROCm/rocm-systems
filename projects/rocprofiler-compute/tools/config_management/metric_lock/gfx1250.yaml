  unit: Percent
  counters: [GRBM_GUI_ACTIVE_sum, SQ_BUSY_CYCLES_sum, SQ_VMEM_REQ_ROW1_BUSY_CYCLES_sum, SQ_WAVES]
wgp.gl0_lds_req_bus_util:
  formula: 100 * SUM(SQ_INST_CYCLES_LDS_sum) / SUM(SQ_BUSY_CYCLES_sum)
  unit: Percent
  counters: [GRBM_GUI_ACTIVE_sum, SQ_BUSY_CYCLES_sum, SQ_INST_CYCLES_LDS_sum, SQ_WAVES]
wgp.gl0_req_bus_util:
