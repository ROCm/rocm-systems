  unit: GB/s
  peak_empirical: $LDSBw_empirical_peak
  counters: [GRBM_GUI_ACTIVE, SQC_LDS_BANK_CONFLICT_sum, SQC_LDS_IDX_ACTIVE_sum, SQ_WAVES]
