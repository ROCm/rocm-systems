  peak: 5
  counters: [GRBM_GUI_ACTIVE, SQ_BUSY_CYCLES_sum, SQ_INSTS_ALL_sum, SQ_INSTS_INTERNAL_sum, SQ_WAVES]
compute.lds_direct_load_insts:
