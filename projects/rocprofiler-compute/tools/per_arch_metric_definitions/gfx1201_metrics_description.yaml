Memory chart - LDS (Local Data Share):
  LDS Req:
    plain: LDS instructions issued, including FLAT instructions that resolve to LDS. This counts instructions, not data, so it does not separate reads from writes.
    rst: LDS instructions issued, including FLAT instructions that resolve to LDS. This counts instructions, not data, so it does not separate reads from writes.
    unit: Requests per Normalization Unit
  LDS Utilization:
    plain: Percentage of the LDS cycle budget across all CUs spent on indexed (non-direct, non-interpolation) accesses, over GPU-active cycles. Two CUs share a WGP's LDS, so a saturated LDS reads well below 100%.
    rst: Percentage of the LDS cycle budget across all CUs spent on indexed (non-direct, non-interpolation) accesses, over GPU-active cycles. Two CUs share a WGP's LDS, so a saturated LDS reads well below 100%.
    unit: Percent
  LDS Bank Conflict Rate:
    plain: LDS cycles stalled by bank conflicts, as a percentage of cycles LDS spent on indexed accesses.
    rst: LDS cycles stalled by bank conflicts, as a percentage of cycles LDS spent on indexed accesses.
    unit: Percent
  LDS Bandwidth:
    plain: LDS byte-access rate from load, store, and atomic dword counters, using four bytes per dword. Counter exposure and hardware normalization remain subject to Navi48 qualification.
    rst: LDS byte-access rate from load, store, and atomic dword counters, using four bytes per dword. Counter exposure and hardware normalization remain subject to Navi48 qualification.
    unit: Bytes/s
Memory chart - GL2 Cache (L2):
  GL2 Hit Rate:
    plain: Percentage of L2 lookups that hit.
    rst: Percentage of L2 lookups that hit.
    unit: Percent
Memory chart - L2 to Memory:
  Memory Read Requests:
    plain: L2 read requests over EA destined for DRAM. Infinity Cache can serve them before they reach VRAM.
    rst: L2 read requests over EA destined for DRAM. Infinity Cache can serve them before they reach VRAM.
    unit: Requests per Normalization Unit
  Memory Write Requests:
    plain: L2 write requests over EA destined for DRAM. Infinity Cache can absorb them before they reach VRAM.
    rst: L2 write requests over EA destined for DRAM. Infinity Cache can absorb them before they reach VRAM.
    unit: Requests per Normalization Unit
  Memory Read Bandwidth:
    plain: Bytes L2 read over EA for requests destined for DRAM, in 32-byte units. Infinity Cache hits are included, so this can exceed the VRAM bandwidth peak.
    rst: Bytes L2 read over EA for requests destined for DRAM, in 32-byte units. Infinity Cache hits are included, so this can exceed the VRAM bandwidth peak.
    unit: Bytes/s
  Memory Write Bandwidth:
    plain: Bytes L2 wrote over EA for requests destined for DRAM, in 32-byte units. Infinity Cache hits are included.
    rst: Bytes L2 wrote over EA for requests destined for DRAM, in 32-byte units. Infinity Cache hits are included.
    unit: Bytes/s
Memory chart - Infinity Cache and VRAM:
  Infinity Cache Hit Rate:
    plain: Not collected by this implementation. Memory-destined L2 traffic can be served by Infinity Cache; its hit rate cannot be inferred from that traffic.
    rst: Not collected by this implementation. Memory-destined L2 traffic can be served by Infinity Cache; its hit rate cannot be inferred from that traffic.
    unit: Percent
  VRAM Read Bandwidth:
    plain: Not collected by this implementation. Memory-destined L2 read bandwidth includes Infinity Cache hits and does not measure traffic reaching VRAM.
    rst: Not collected by this implementation. Memory-destined L2 read bandwidth includes Infinity Cache hits and does not measure traffic reaching VRAM.
    unit: Bytes/s
  VRAM Write Bandwidth:
    plain: Not collected by this implementation. Memory-destined L2 write bandwidth does not measure traffic reaching VRAM.
    rst: Not collected by this implementation. Memory-destined L2 write bandwidth does not measure traffic reaching VRAM.
    unit: Bytes/s
Memory chart - Workgroup Processors (WGPs):
  Wavefront Occupancy:
    plain: Estimated resident waves relative to the configured maximum. Navi48 living-wave counter units, instance reduction, and WGP normalization still require validation; this is a provisional occupancy estimate.
    rst: Estimated resident waves relative to the configured maximum. Navi48 living-wave counter units, instance reduction, and WGP normalization still require validation; this is a provisional occupancy estimate.
    unit: Percent
  VGPR:
    plain: 'The number of architected vector general-purpose registers allocated for the kernel. Note: this may not exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
    rst: 'The number of architected vector general-purpose registers allocated for the kernel. Note: this may not exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  SGPR:
    plain: 'The number of scalar general-purpose registers allocated for the kernel. Note: this may not exactly match the number of SGPRs requested by the compiler due to allocation granularity.'
    rst: 'The number of scalar general-purpose registers allocated for the kernel. Note: this may not exactly match the number of SGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  LDS Allocation:
    plain: 'The number of bytes of LDS memory (or, shared memory) allocated per workgroup. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
    rst: 'The number of bytes of LDS memory (or, shared memory) allocated per workgroup. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
    unit: Bytes per Workgroup
  Scratch Allocation:
    plain: 'The amount of scratch memory requested per wavefront, in KB: the scratch bytes requested per work-item multiplied by the wavefront size. Scratch memory is used for stack memory on the accelerator, as well as for register spills and restores.'
    rst: 'The amount of scratch memory requested per wavefront, in KB: the scratch bytes requested per work-item multiplied by the wavefront size. Scratch memory is used for stack memory on the accelerator, as well as for register spills and restores.'
    unit: KB per Wave
  Workgroups:
    plain: The number of workgroups in the launch divided by the number of WGPs.
    rst: The number of workgroups in the launch divided by the number of WGPs.
    unit: Workgroups per WGP
