System Speed-of-Light:
  VALU Issue Rate:
    plain: Billions of VALU instruction issues per second. The counter includes floating-point and integer instructions and does not count FLOPs or active lanes. No percentage of FP32 peak is reported.
    rst: Billions of VALU instruction issues per second. The counter includes floating-point and integer instructions and does not count FLOPs or active lanes. No percentage of FP32 peak is reported.
    unit: GInstr/s
  WMMA FLOPs (F16->F32 16x16x16):
    plain: Estimated matrix FLOPs per second, assuming FP16 inputs with FP32 accumulation for 16x16x16 matrices. The conversion of 8192 FLOPs per counter increment and peak of 1024 FLOPs/CU/cycle are provisional. The raw counter counts WMMA issues per vec32 and does not distinguish FP16, BF16, or FP8. A fixed wave32 FP16-to-FP32 16x16x16 diagnostic supports overlap with the general VALU instruction counter for that instruction. Counted wave population, other shapes/types, wave64 interpretation, and the applicable peak still require validation. Treat the FLOP conversion and percentage of peak as approximations.
    rst: Estimated matrix FLOPs per second, assuming FP16 inputs with FP32 accumulation for 16x16x16 matrices. The conversion of 8192 FLOPs per counter increment and peak of 1024 FLOPs/CU/cycle are provisional. The raw counter counts WMMA issues per vec32 and does not distinguish FP16, BF16, or FP8. A fixed wave32 FP16-to-FP32 16x16x16 diagnostic supports overlap with the general VALU instruction counter for that instruction. Counted wave population, other shapes/types, wave64 interpretation, and the applicable peak still require validation. Treat the FLOP conversion and percentage of peak as approximations.
    unit: GFLOP/s
  FP64 VALU Issue Rate:
    plain: Billions of double-precision VALU instruction issues per second. This is an instruction rate, without accounting for FLOPs per instruction or active lanes. No percentage of FP64 peak is reported.
    rst: Billions of double-precision VALU instruction issues per second. This is an instruction rate, without accounting for FLOPs per instruction or active lanes. No percentage of FP64 peak is reported.
    unit: GInstr/s
  IPC:
    plain: Instructions issued per busy SQ cycle, excluding internal instructions.
    rst: Instructions issued per busy SQ cycle, excluding internal instructions.
    unit: Instr/cycle
  Wavefront Occupancy:
    plain: Estimated average resident wave count over GPU-active cycles. Navi48 living-wave counter units and instance reduction still require validation; do not treat this as a validated occupancy or resource-limit measurement.
    rst: Estimated average resident wave count over GPU-active cycles. Navi48 living-wave counter units and instance reduction still require validation; do not treat this as a validated occupancy or resource-limit measurement.
    unit: Wavefronts
  GL2 Cache Hit Rate:
    plain: Percentage of L2 lookups that hit.
    rst: Percentage of L2 lookups that hit.
    unit: Percent
  GL2-Fabric Read BW:
    plain: Size-weighted L2 read requests over its EA interface, from the configured 32, 64, 128, and 256-byte categories. Separate compressed request and data counters are not included; their overlap and byte coverage require qualification. Infinity Cache can serve this traffic, so it is not compared against the GDDR6 peak.
    rst: Size-weighted L2 read requests over its EA interface, from the configured 32, 64, 128, and 256-byte categories. Separate compressed request and data counters are not included; their overlap and byte coverage require qualification. Infinity Cache can serve this traffic, so it is not compared against the GDDR6 peak.
    unit: Bytes/s
  GL2-Fabric Write BW:
    plain: Size-weighted L2 write requests over its EA interface, from the configured 32, 64, 128, and 256-byte categories. Separate compressed request and data counters are not included; their overlap and byte coverage require qualification. Infinity Cache can absorb this traffic, so it is not compared against the GDDR6 peak.
    rst: Size-weighted L2 write requests over its EA interface, from the configured 32, 64, 128, and 256-byte categories. Separate compressed request and data counters are not included; their overlap and byte coverage require qualification. Infinity Cache can absorb this traffic, so it is not compared against the GDDR6 peak.
    unit: Bytes/s
  LDS Bank Conflicts:
    plain: Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
    rst: Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
    unit: Cycles
  Wave Dependency Wait:
    plain: Percentage of wave cycles spent waiting for anything, such as pending memory operations or prior instruction results.
    rst: Percentage of wave cycles spent waiting for anything, such as pending memory operations or prior instruction results.
    unit: Percent
  Wave Issue Wait:
    plain: Percentage of wave cycles spent waiting for any instruction to issue.
    rst: Percentage of wave cycles spent waiting for any instruction to issue.
    unit: Percent
  GL0 Cache Hit Rate (TCP Cache):
    plain: Percentage of vector L0 cache line accesses that hit.
    rst: Percentage of vector L0 cache line accesses that hit.
    unit: Percent
  GL0 Cache BW (TCP Cache):
    plain: Not available on gfx1201. The L0 counters give no access size.
    rst: Not available on gfx1201. The L0 counters give no access size.
    unit: Bytes/s
  GL1 Cache Hit Rate:
    plain: Not available in this gfx1201 configuration. No qualified GL1 data hit/miss measurement is collected for the Navi48 write-combining stage.
    rst: Not available in this gfx1201 configuration. No qualified GL1 data hit/miss measurement is collected for the Navi48 write-combining stage.
    unit: Percent
  GL1 Cache Read BW:
    plain: Bytes GL1 returned to its clients, from the physical 32-byte beats returned.
    rst: Bytes GL1 returned to its clients, from the physical 32-byte beats returned.
    unit: Bytes/s
  GL2 Cache BW:
    plain: Size-weighted uncompressed read requests measured at the GL2 output FIFOs, from the 32, 64, 128, and 256-byte categories. This request rate does not measure all L2 traffic or physical GDDR6 transfers. The percentage of peak uses the L2 interface width, not the GDDR6 peak.
    rst: Size-weighted uncompressed read requests measured at the GL2 output FIFOs, from the 32, 64, 128, and 256-byte categories. This request rate does not measure all L2 traffic or physical GDDR6 transfers. The percentage of peak uses the L2 interface width, not the GDDR6 peak.
    unit: Bytes/s
  Scalar Data Cache Hit Rate:
    plain: Percentage of scalar data cache requests that hit.
    rst: Percentage of scalar data cache requests that hit.
    unit: Percent
  Scalar Data Cache BW:
    plain: Bytes loaded by scalar memory instructions, from the dwords each instruction loads.
    rst: Bytes loaded by scalar memory instructions, from the dwords each instruction loads.
    unit: Bytes/s
  Instruction Cache Hit Rate:
    plain: Percentage of instruction cache requests that hit.
    rst: Percentage of instruction cache requests that hit.
    unit: Percent
  Instruction Cache BW:
    plain: Not available on gfx1201. The instruction cache counters give no request size.
    rst: Not available on gfx1201. The instruction cache counters give no request size.
    unit: Bytes/s
