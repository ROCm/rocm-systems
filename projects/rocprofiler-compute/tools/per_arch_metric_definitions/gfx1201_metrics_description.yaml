System Speed-of-Light:
  VALU Issue Rate:
    plain: Billions of VALU instruction issues per second. The counter includes floating-point and integer instructions and does not count FLOPs or active lanes. No percentage of FP32 peak is reported.
    rst: Billions of VALU instruction issues per second. The counter includes floating-point and integer instructions and does not count FLOPs or active lanes. No percentage of FP32 peak is reported.
    unit: GInstr/s
  WMMA FLOPs (F16->F32 16x16x16):
    plain: Estimated matrix FLOPs per second, assuming FP16 inputs with FP32 accumulation for 16x16x16 matrices. The conversion of 8192 FLOPs per counter increment and peak of 1024 FLOPs/CU/cycle are provisional. The raw counter counts WMMA issues per vec32 and does not distinguish FP16, BF16, FP8, or BF8. A fixed wave32 FP16-to-FP32 16x16x16 diagnostic supports overlap with the general VALU instruction counter for that instruction. Counted wave population, other shapes/types, wave64 interpretation, and the applicable peak still require validation. Treat the FLOP conversion and percentage of peak as approximations. If this shows N/A, check SDK support for gfx1201 SQ event 233 and the configured SqcCounterBlockMaxEvent limit.
    rst: Estimated matrix FLOPs per second, assuming FP16 inputs with FP32 accumulation for 16x16x16 matrices. The conversion of 8192 FLOPs per counter increment and peak of 1024 FLOPs/CU/cycle are provisional. The raw counter counts WMMA issues per vec32 and does not distinguish FP16, BF16, FP8, or BF8. A fixed wave32 FP16-to-FP32 16x16x16 diagnostic supports overlap with the general VALU instruction counter for that instruction. Counted wave population, other shapes/types, wave64 interpretation, and the applicable peak still require validation. Treat the FLOP conversion and percentage of peak as approximations. If this shows N/A, check SDK support for gfx1201 SQ event 233 and the configured SqcCounterBlockMaxEvent limit.
    unit: GFLOP/s
  FP64 VALU Issue Rate:
    plain: Billions of double-precision VALU instruction issues per second. This is an instruction rate, without accounting for FLOPs per instruction or active lanes. No percentage of FP64 peak is reported.
    rst: Billions of double-precision VALU instruction issues per second. This is an instruction rate, without accounting for FLOPs per instruction or active lanes. No percentage of FP64 peak is reported.
    unit: GInstr/s
  IPC:
    plain: Instructions issued per busy SQ cycle, excluding internal instructions.
    rst: Instructions issued per busy SQ cycle, excluding internal instructions.
    unit: Instr/cycle
  Wavefront Occupancy:
    plain: Estimated average resident wave count over GPU-active cycles. Navi48 living-wave counter units and instance reduction still require validation; do not treat this as a validated occupancy or resource-limit measurement.
    rst: Estimated average resident wave count over GPU-active cycles. Navi48 living-wave counter units and instance reduction still require validation; do not treat this as a validated occupancy or resource-limit measurement.
    unit: Wavefronts
  GL2 Cache Hit Rate:
    plain: Percentage of L2 lookups that hit.
    rst: Percentage of L2 lookups that hit.
    unit: Percent
  LDS Bank Conflicts:
    plain: Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
    rst: Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
    unit: Cycles
  GL0 Cache Hit Rate (TCP Cache):
    plain: Percentage of vector L0 cache line accesses that hit.
    rst: Percentage of vector L0 cache line accesses that hit.
    unit: Percent
  GL0 Cache BW (TCP Cache):
    plain: Not available on gfx1201. The L0 counters give no access size.
    rst: Not available on gfx1201. The L0 counters give no access size.
    unit: Bytes/s
  GL1 Cache Hit Rate:
    plain: Not available in this gfx1201 configuration. No qualified GL1 data hit/miss measurement is collected for the Navi48 write-combining stage.
    rst: Not available in this gfx1201 configuration. No qualified GL1 data hit/miss measurement is collected for the Navi48 write-combining stage.
    unit: Percent
  Scalar Data Cache Hit Rate:
    plain: Percentage of scalar data cache requests that hit.
    rst: Percentage of scalar data cache requests that hit.
    unit: Percent
  Scalar Data Cache BW:
    plain: Bytes loaded by scalar memory instructions, from the dwords each instruction loads.
    rst: Bytes loaded by scalar memory instructions, from the dwords each instruction loads.
    unit: Bytes/s
  Instruction Cache Hit Rate:
    plain: Percentage of instruction cache requests that hit.
    rst: Percentage of instruction cache requests that hit.
    unit: Percent
  Instruction Cache BW:
    plain: Not available on gfx1201. The instruction cache counters give no request size.
    rst: Not available on gfx1201. The instruction cache counters give no request size.
    unit: Bytes/s
Memory chart - Instruction Cache:
