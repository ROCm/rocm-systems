System Speed-of-Light:
  VALU Issue Rate:
    plain: VALU instruction issues, including floating-point and integer instructions. This is not a FLOP count and does not account for active lanes.
    rst: VALU instruction issues, including floating-point and integer instructions. This is not a FLOP count and does not account for active lanes.
    unit: GInstructions/s
  WMMA FLOPs (F16->F32 16x16x16):
    plain: Estimated matrix floating-point operations from Wave Matrix Multiply Accumulate instructions. Each instruction counts as 8192 FLOPs for a 16x16x16 F16->F32 operation.
    rst: Estimated matrix floating-point operations from Wave Matrix Multiply Accumulate instructions. Each instruction counts as 8192 FLOPs for a 16x16x16 F16->F32 operation.
    unit: GFLOP/s
  FP64 VALU Issue Rate:
    plain: Double-precision VALU instruction issues. This is not a FLOP count and does not account for active lanes.
    rst: Double-precision VALU instruction issues. This is not a FLOP count and does not account for active lanes.
    unit: GInstructions/s
  IPC:
    plain: User instructions executed per Sequencer busy cycle, excluding internal Sequencer instructions.
    rst: User instructions executed per Sequencer busy cycle, excluding internal Sequencer instructions.
    unit: Instructions per Cycle
  Wavefront Occupancy:
    plain: Average number of wavefronts resident during GPU-active cycles.
    rst: Average number of wavefronts resident during GPU-active cycles.
    unit: Wavefronts
  GL2 Cache Hit Rate:
    plain: Percentage of GL2 lookups that hit.
    rst: Percentage of GL2 lookups that hit.
    unit: Percent
  LDS Bank Conflicts:
    plain: Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
    rst: Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
    unit: Cycles
  GL0 Cache Hit Rate (TCP Cache):
    plain: Percentage of GL0 vector cache (TCP Cache) requests that hit in cache.
    rst: Percentage of GL0 vector cache (TCP Cache) requests that hit in cache.
    unit: Percent
  Scalar Data Cache Hit Rate:
    plain: Percentage of scalar data cache accesses that hit in cache.
    rst: Percentage of scalar data cache accesses that hit in cache.
    unit: Percent
  Scalar Data Cache BW:
    plain: Bytes loaded by scalar memory instructions, from the dwords each instruction loads.
    rst: Bytes loaded by scalar memory instructions, from the dwords each instruction loads.
    unit: Bytes/s
  Instruction Cache Hit Rate:
    plain: Percentage of instruction cache requests that hit.
    rst: Percentage of instruction cache requests that hit.
    unit: Percent
Memory chart - Instruction Cache:
  ICache Requests:
    plain: Instruction cache requests from the Sequencer.
    rst: Instruction cache requests from the Sequencer.
    unit: Requests per Normalization Unit
  ICache Hit Rate:
    plain: Percentage of instruction cache requests that hit.
    rst: Percentage of instruction cache requests that hit.
    unit: Percent
Memory chart - Scalar Data Cache:
  DCache Requests:
    plain: Scalar data cache requests after bank serialization.
    rst: Scalar data cache requests after bank serialization.
    unit: Requests per Normalization Unit
  DCache Hit Rate:
    plain: Percentage of scalar data cache accesses that hit in cache.
    rst: Percentage of scalar data cache accesses that hit in cache.
    unit: Percent
  DCache Load Bandwidth:
    plain: Bytes loaded by scalar memory instructions, from the dwords each instruction loads.
    rst: Bytes loaded by scalar memory instructions, from the dwords each instruction loads.
    unit: Bytes/s
Memory chart - GL0 Cache (Vector L0):
  GL0 Hit Rate:
    plain: Percentage of GL0 vector cache (TCP Cache) requests that hit in cache.
    rst: Percentage of GL0 vector cache (TCP Cache) requests that hit in cache.
    unit: Percent
Memory chart - LDS (Local Data Share):
  LDS Instructions:
    plain: LDS instructions issued, including FLAT instructions that resolve to LDS. This counts instructions, not bytes, and does not distinguish reads from writes.
    rst: LDS instructions issued, including FLAT instructions that resolve to LDS. This counts instructions, not bytes, and does not distinguish reads from writes.
    unit: Instructions per Normalization Unit
  LDS Utilization:
    plain: Percentage of GPU-active cycles, across all CUs, spent on indexed LDS accesses.
    rst: Percentage of GPU-active cycles, across all CUs, spent on indexed LDS accesses.
    unit: Percent
  LDS Bank Conflict Rate:
    plain: Percentage of indexed-access LDS cycles spent stalled on bank conflicts.
    rst: Percentage of indexed-access LDS cycles spent stalled on bank conflicts.
    unit: Percent
  LDS Bandwidth:
    plain: The bandwidth between the WGP and LDS for loads, stores, and atomics. Each dword counts as 4 bytes.
    rst: The bandwidth between the WGP and LDS for loads, stores, and atomics. Each dword counts as 4 bytes.
    unit: Bytes/s
Memory chart - GL2 Cache (L2):
  GL2 Hit Rate:
    plain: Percentage of GL2 lookups that hit.
    rst: Percentage of GL2 lookups that hit.
    unit: Percent
Memory chart - L2 to Memory:
  Memory Read Requests:
    plain: GL2 read requests over the Efficiency Arbiter destined for memory. Requests served by Infinity Cache are included.
    rst: GL2 read requests over the Efficiency Arbiter destined for memory. Requests served by Infinity Cache are included.
    unit: Requests per Normalization Unit
  Memory Write Requests:
    plain: GL2 write requests over the Efficiency Arbiter destined for memory. Requests absorbed by Infinity Cache are included.
    rst: GL2 write requests over the Efficiency Arbiter destined for memory. Requests absorbed by Infinity Cache are included.
    unit: Requests per Normalization Unit
  Memory Read Bandwidth:
    plain: The read bandwidth from GL2 toward memory over the Efficiency Arbiter. Each counted request is 32 bytes. Requests served by Infinity Cache are included.
    rst: The read bandwidth from GL2 toward memory over the Efficiency Arbiter. Each counted request is 32 bytes. Requests served by Infinity Cache are included.
    unit: Bytes/s
  Memory Write Bandwidth:
    plain: The write bandwidth from GL2 toward memory over the Efficiency Arbiter. Each counted request is 32 bytes. Requests absorbed by Infinity Cache are included.
    rst: The write bandwidth from GL2 toward memory over the Efficiency Arbiter. Each counted request is 32 bytes. Requests absorbed by Infinity Cache are included.
    unit: Bytes/s
Memory chart - Workgroup Processors (WGPs):
  Wavefront Occupancy:
    plain: Resident wavefronts per WGP as a percentage of the maximum wavefronts per WGP, averaged over GPU-active cycles.
    rst: Resident :ref:`wavefronts <desc-wavefront>` per WGP, averaged over GPU-active cycles, as a percent of the maximum wavefronts per WGP.
    unit: Percent
  VGPRs:
    plain: Architected vector general-purpose registers allocated for the kernel. Allocation granularity can increase this above the compiler request.
    rst: Architected vector general-purpose registers allocated for the kernel. Allocation granularity can increase this above the compiler request.
    unit: Registers
  SGPRs:
    plain: Scalar general-purpose registers allocated for the kernel. Allocation granularity can increase this above the compiler request.
    rst: Scalar general-purpose registers allocated for the kernel. Allocation granularity can increase this above the compiler request.
    unit: Registers
  LDS Allocation:
    plain: Bytes of LDS allocated per workgroup. Allocation granularity and dynamic per-dispatch allocations can increase this above the compile-time request.
    rst: 'The number of bytes of LDS memory (or, shared memory) allocated per :ref:`workgroup <desc-workgroup>`. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
    unit: Bytes per Workgroup
  Scratch Allocation:
    plain: Bytes of scratch memory requested per work-item for stack memory and register spills and restores.
    rst: The number of bytes of scratch memory requested per :ref:`work-item <desc-work-item>` for this kernel. Scratch memory is used for stack memory on the accelerator, as well as for register spills and restores.
    unit: Bytes per Work-item
  Workgroups:
    plain: Number of workgroups in the launch for each WGP.
    rst: Number of :ref:`workgroups <desc-workgroup>` in the launch for each WGP.
    unit: Workgroups per WGP
Roofline Performance Rates:
  VALU FLOPs:
    plain: Estimated floating-point operations on the vector ALU, excluding Wave Matrix Multiply Accumulate. Each VALU instruction counts as wavefront-size FLOPs.
    rst: Estimated floating-point operations on the vector ALU, excluding Wave Matrix Multiply Accumulate. Each VALU instruction counts as wavefront-size FLOPs.
    unit: GFLOP/s
  WMMA FLOPs (FP16):
    plain: Estimated matrix floating-point operations from Wave Matrix Multiply Accumulate instructions of every data type (FP16, BF16, FP8, and BF8). Each instruction counts as 8192 FLOPs. This is not an FP16-only count.
    rst: Estimated matrix floating-point operations from Wave Matrix Multiply Accumulate instructions of every data type (FP16, BF16, FP8, and BF8). Each instruction counts as 8192 FLOPs. This is not an FP16-only count.
    unit: GFLOP/s
  VALU FLOPs (F64):
    plain: Estimated 64-bit floating-point operations on the vector ALU. Each double-precision VALU instruction counts as wavefront-size FLOPs.
    rst: Estimated 64-bit floating-point operations on the vector ALU. Each double-precision VALU instruction counts as wavefront-size FLOPs.
    unit: GFLOP/s
  GL0 Cache BW (TCP Cache):
    plain: The lookup bandwidth between the WGP and GL0. Each GL0 request counts as 128 bytes.
    rst: The lookup bandwidth between the WGP and GL0. Each GL0 request counts as 128 bytes.
    unit: Bytes/s
  LDS BW:
    plain: The bandwidth between the WGP and LDS for indexed accesses after bank- conflict stalls. Each bank access counts as 4 bytes.
    rst: The bandwidth between the WGP and LDS for indexed accesses after bank- conflict stalls. Each bank access counts as 4 bytes.
    unit: Bytes/s
  L2 to Memory BW:
    plain: The read and write bandwidth from GL2 toward memory over the Efficiency Arbiter. Each counted request is 32 bytes. Requests served by Infinity Cache are included.
    rst: The read and write bandwidth from GL2 toward memory over the Efficiency Arbiter. Each counted request is 32 bytes. Requests served by Infinity Cache are included.
    unit: Bytes/s
Roofline Plot Points:
  AI L0:
    plain: Floating-point operations per byte requested between the WGP and GL0. Each GL0 request counts as 128 bytes.
    rst: Floating-point operations per byte requested between the WGP and GL0. Each GL0 request counts as 128 bytes.
    unit: FLOPs/Byte
  AI LDS:
    plain: Floating-point operations per byte transferred between the WGP and LDS for indexed accesses after bank-conflict stalls.
    rst: Floating-point operations per byte transferred between the WGP and LDS for indexed accesses after bank-conflict stalls.
    unit: FLOPs/Byte
  AI VRAM:
    plain: Floating-point operations per byte requested from GL2 toward memory over the Efficiency Arbiter. Requests served by Infinity Cache are included.
    rst: Floating-point operations per byte requested from GL2 toward memory over the Efficiency Arbiter. Requests served by Infinity Cache are included.
    unit: FLOPs/Byte
  Performance (GFLOPs):
    plain: Estimated floating-point operations on the vector ALU and Wave Matrix Multiply Accumulate combined.
    rst: Estimated floating-point operations on the vector ALU and Wave Matrix Multiply Accumulate combined.
    unit: GFLOP/s
