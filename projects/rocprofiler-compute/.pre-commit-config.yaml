default_stages: [pre-commit]
fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        files: ^projects/rocprofiler-compute/
      - id: end-of-file-fixer
        files: ^projects/rocprofiler-compute/
      - id: trailing-whitespace
        files: ^projects/rocprofiler-compute/

  # Python import sorting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Check https://github.com/astral-sh/ruff-pre-commit#version-compatibility
    # for the latest ruff version supported by the hook.
    rev: v0.14.11
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^projects/rocprofiler-compute/
      - id: ruff-format
        files: ^projects/rocprofiler-compute/

  # CMake formatting
  - repo: https://github.com/BlankSpruce/gersemi
    rev: 0.22.1
    hooks:
      - id: gersemi
        files: ^projects/rocprofiler-compute/.*(CMakeLists\.txt|\.cmake)$

  # C/C++ formatting (matches rocprofiler-compute-formatting.yml workflow)
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.0
    hooks:
      - id: clang-format
        files: ^projects/rocprofiler-compute/src/.*\.(h|hpp|hh|c|cc|cpp)(\.in)?$
        exclude: ^projects/rocprofiler-compute/src/(lib/external|vendored)/

  # Reject committed Python bytecode
  - repo: local
    hooks:
      - id: no-python-bytecode
        name: Reject staged Python bytecode
        entry: >-
          bash -c 'printf "Error - Python bytecode staged for commit:\n";
          printf "  %s\n" "$@"; exit 1' --
        language: system
        files: ^projects/rocprofiler-compute/.*(__pycache__/.*|\.pyc)$

  # Local hook: copyright header check
  - repo: local
    hooks:
      - id: copyright-header-check
        name: Copyright header check
        entry: python projects/rocprofiler-compute/tools/copyright_header_check.py
        language: python
        files: ^projects/rocprofiler-compute/.*\.(py|hip|cpp)$
        stages: [pre-commit]

  # Local hook: sets metric ID validation
  - repo: local
    hooks:
      - id: sets-metric-id-check
        name: Sets metric ID validation
        entry: bash -lc 'cd projects/rocprofiler-compute && python3 tools/validate_sets_metric_ids.py'
        language: system
        files: (sets/gfx.*_sets\.yaml|analysis_configs/gfx.*/\d{4}_.*\.yaml|mi_gpu_spec\.yaml)$
        pass_filenames: false
        stages: [pre-commit]

  # Local hook: metric library and view checks, and the files generated from them
  - repo: local
    hooks:
      - id: metric-config-check
        name: Metric library, views and metric lock
        entry: bash -lc 'cd projects/rocprofiler-compute && python tools/config_management/check_metric_config.py --fix'
        language: python
        additional_dependencies: [pyyaml==6.0.3, ruamel.yaml==0.19.1]
        files: (metric_library/.*\.(yaml|py)|rocprof_compute_soc/views/.*\.yaml|mi_gpu_spec\.yaml|_membw_tree_spec\.yaml|_membw_guidance\.yaml|3000_mem_bw.*\.yaml|membw_analysis/models\.py|utils/(analysis_views|metrics/expression|utils_common|utils_counter_defs)\.py|tools/(validate_metric_library|validate_views|validate_membw_tree_spec)\.py|tools/config_management/.*|docs/data/metrics/.*)$
        pass_filenames: false
        stages: [pre-commit]

  # Local hook: memory chart layout formatting check (layout checks run as unit tests)
  - repo: local
    hooks:
      - id: memory-chart-layout-format
        name: Memory chart layout formatting
        entry: bash -lc 'cd projects/rocprofiler-compute && python3 tools/memory_chart_layout_format.py --check'
        language: system
        files: ^projects/rocprofiler-compute/src/memory_chart/layouts/.*\.json$
        pass_filenames: false
        stages: [pre-commit]

  # Local hook: YAML and metric equation formatting
  - repo: local
    hooks:
      - id: yaml-format-fix
        name: YAML metric equation formatting
        entry: python projects/rocprofiler-compute/tools/format_yaml.py --fix
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        files: ^projects/rocprofiler-compute/src/rocprof_compute_soc/(analysis_configs/(gfx|collectables/)|metric_library/gfx).*\.yaml$
        pass_filenames: true
        stages: [pre-commit]
