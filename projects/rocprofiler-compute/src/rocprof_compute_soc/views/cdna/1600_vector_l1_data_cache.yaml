- id: 1603
  title: vL1D cache access metrics
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: vl1d.total_req
    label: Total Req
    legacy_id: 16.3.0
  - metric: vl1d.rd_req
    label: Read Req
    legacy_id: 16.3.1
  - metric: vl1d.wr_req
    label: Write Req
    legacy_id: 16.3.2
  - metric: vl1d.atomic_req
    label: Atomic Req
    legacy_id: 16.3.3
  - metric: vl1d.cache_bw
    label: Cache BW
    archs:
    - gfx908
    - gfx90a
    - gfx942
    - gfx950
    unit: Gbps
    description: The number of bytes looked up in the vL1D cache as a result of VMEM instructions
      divided by total duration. The number of bytes is calculated as the number of cache
      lines requested multiplied by the cache line size. This value does not consider partial
      requests, so for instance, if only a single value is requested in a cache line, the
      data movement will still be counted as a full cache line.
  - metric: vl1d.cache_bw_128b
    label: Cache BW
    archs:
    - gfx940
    - gfx941
    unit: Gbps
    description: The number of bytes looked up in the vL1D cache as a result of VMEM instructions
      divided by total duration. The number of bytes is calculated as the number of cache
      lines requested multiplied by the cache line size. This value does not consider partial
      requests, so for instance, if only a single value is requested in a cache line, the
      data movement will still be counted as a full cache line.
  - metric: vl1d.hit_rate
    label: Cache Hit Rate
    archs:
    - gfx908
    - gfx90a
    - gfx940
    - gfx941
    - gfx950
    description: The ratio of the number of vL1D cache line requests that hit in vL1D cache
      over the total number of cache line requests to the vL1D Cache RAM.
  - metric: vl1d.hit_rate
    label: Cache Hit Rate
    archs:
    - gfx942
    display: noise_clamped_vl1d_hit_rate
    description: The ratio of the number of vL1D cache line requests that hit in vL1D cache
      over the total number of cache line requests to the vL1D Cache RAM.
  - metric: vl1d.cache_accesses
    label: Cache Accesses
    legacy_id: 16.3.6
  - metric: vl1d.cache_hits
    label: Cache Hits
    legacy_id: 16.3.7
  - metric: vl1d.invalidations
    label: Invalidations
    legacy_id: 16.3.8
  - metric: vl1d.l2_bw
    label: L1-L2 BW
    archs:
    - gfx908
    - gfx90a
    unit: Gbps
  - metric: vl1d.l2_bw_by_size
    label: L1-L2 BW
    archs:
    - gfx940
    - gfx941
    - gfx942
    - gfx950
    unit: Gbps
    legacy_id: 16.3.9
  - metric: vl1d.tag_ram_0_req
    label: Tag RAM 0 Req
    archs:
    - gfx950
    description: The total number of vL1D cache requests (cache line lookups) that mapped
      to Tag RAM bank 0 during the vL1D tag lookup process, per normalization unit. The vL1D
      cache uses multiple Tag RAM banks for parallel tag lookups. Distribution across banks
      affects lookup efficiency.
    legacy_id: 16.3.10
  - metric: vl1d.tag_ram_1_req
    label: Tag RAM 1 Req
    archs:
    - gfx950
    description: The total number of vL1D cache requests (cache line lookups) that mapped
      to Tag RAM bank 1 during the vL1D tag lookup process, per normalization unit. The vL1D
      cache uses multiple Tag RAM banks for parallel tag lookups. Distribution across banks
      affects lookup efficiency.
    legacy_id: 16.3.11
  - metric: vl1d.tag_ram_2_req
    label: Tag RAM 2 Req
    archs:
    - gfx950
    description: The total number of vL1D cache requests (cache line lookups) that mapped
      to Tag RAM bank 2 during the vL1D tag lookup process, per normalization unit. The vL1D
      cache uses multiple Tag RAM banks for parallel tag lookups. Distribution across banks
      affects lookup efficiency.
    legacy_id: 16.3.12
  - metric: vl1d.tag_ram_3_req
    label: Tag RAM 3 Req
    archs:
    - gfx950
    description: The total number of vL1D cache requests (cache line lookups) that mapped
      to Tag RAM bank 3 during the vL1D tag lookup process, per normalization unit. The vL1D
      cache uses multiple Tag RAM banks for parallel tag lookups. Distribution across banks
      affects lookup efficiency.
    legacy_id: 16.3.13
  - metric: vl1d.l2_rd_req
    label: L1-L2 Read
    legacy_id:
      gfx908: 16.3.10
      gfx90a: 16.3.10
      gfx940: 16.3.10
      gfx941: 16.3.10
      gfx942: 16.3.10
      gfx950: 16.3.14
  - metric: vl1d.l2_wr_req
    label: L1-L2 Write
    legacy_id:
      gfx908: 16.3.11
      gfx90a: 16.3.11
      gfx940: 16.3.11
      gfx941: 16.3.11
      gfx942: 16.3.11
      gfx950: 16.3.15
  - metric: vl1d.l2_atomic_req
    label: L1-L2 Atomic
    legacy_id:
      gfx908: 16.3.12
      gfx90a: 16.3.12
      gfx940: 16.3.12
      gfx941: 16.3.12
      gfx942: 16.3.12
      gfx950: 16.3.16
  - metric: vl1d.access_lat
    label: L1 Access Latency
    archs:
    - gfx908
    - gfx90a
    legacy_id: 16.3.13
  - metric: vl1d.l2_rd_lat
    label: L1-L2 Read Latency
    archs:
    - gfx908
    - gfx90a
    legacy_id: 16.3.14
  - metric: vl1d.l2_wr_lat
    label: L1-L2 Write Latency
    archs:
    - gfx908
    - gfx90a
    legacy_id: 16.3.15
  - metric: vl1d.access_lat_norm
    label: L1 Access Latency
    archs:
    - gfx950
    description: Calculated as the average number of cycles that a vL1D cache line request
      spent in the vL1D cache pipeline.
    legacy_id: 16.3.17
  - metric: vl1d.l2_rd_lat_norm
    label: L1-L2 Read Latency
    archs:
    - gfx950
    description: Calculated as the average number of cycles that the vL1D cache took to issue
      and receive read requests from the L2 Cache. This number also includes requests for
      atomics with return values.
    legacy_id: 16.3.18
  - metric: vl1d.l2_wr_lat_norm
    label: L1-L2 Write Latency
    archs:
    - gfx950
    description: Calculated as the average number of cycles that the vL1D cache took to issue
      and receive acknowledgement of a write request to the L2 Cache. This number also includes
      requests for atomics without return values.
    legacy_id: 16.3.19
