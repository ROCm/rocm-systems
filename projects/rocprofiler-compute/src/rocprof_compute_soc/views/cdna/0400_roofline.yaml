    legacy_id: 4.1.6
  - metric: compute.mfma_iops_int8
    label: MFMA IOPs (Int8)
    archs:
    - gfx908
    peak: null
    description_note: The peak empirically measured INT8 MFMA operations achievable on the
      specific accelerator is displayed alongside for comparison.
    legacy_id: 4.1.7
  - metric: fabric.hbm_bw
    archs:
    - gfx908
    description: The total number of bytes read from and written to High-Bandwidth Memory
      (HBM) per second. The peak empirically measured bandwidth achievable on the specific
      accelerator is displayed alongside for comparison. It reflects peak single-direction
      (read-only) bandwidth, so write-heavy or mixed kernels fall below it.
    legacy_id: 4.1.8
  - metric: vl1d.l2_bw
    label: L2 Cache Bandwidth
    archs:
    - gfx908
    display: roofline_l2_bw_64b
    description: The number of bytes looked up in the L2 cache per unit time. The number of
      bytes is calculated as the number of cache lines requested multiplied by the cache line
      size. This value does not consider partial requests, so e.g., if only a single value
      is requested in a cache line, the data movement will still be counted as a full cache
      line. The peak empirically measured bandwidth achievable on the specific accelerator
      is displayed alongside for comparison.
    legacy_id: 4.1.9
  - metric: vl1d.cache_bw
    label: L1 Cache Bandwidth
    archs:
    - gfx908
    peak: null
    description_note: The peak empirically measured bandwidth achievable on the specific accelerator
      is displayed alongside for comparison.
    legacy_id: 4.1.10
  - metric: lds.theoretical_bw
    label: LDS Bandwidth
    archs:
    - gfx908
    display: roofline_lds_bw
    peak: null
    description: Indicates the maximum amount of bytes that could have been loaded from, stored
      to, or atomically updated in the LDS per unit time (see LDS Bandwidth example for more
      detail). The peak empirically measured LDS bandwidth achievable on the specific accelerator
      is displayed alongside for comparison.
    legacy_id: 4.1.11
