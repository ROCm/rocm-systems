tables:
- id: 401
  title: Roofline Performance Rates
  cli_style: Roofline
  header:
    metric: Metric
    value: Value
    unit: Unit
    peak: Peak (Empirical)
  metrics:
  - metric: compute.valu_flops_f16
    archs:
    - gfx908
    description: 'The total 16-bit floating-point operations executed per second on the VALU.
      This is presented with the value of the peak empirical F16 FLOPs achievable on the specific
      accelerator. Note: this does not include any F16 operations from MFMA instructions.'
    legacy_id: 4.1.0
  - metric: compute.valu_flops_f32
    archs:
    - gfx908
    description: 'The total 32-bit floating-point operations executed per second on the VALU.
      This is presented with the value of the peak empirical F32 FLOPs achievable on the specific
      accelerator. Note: this does not include any F32 operations from MFMA instructions.'
    legacy_id: 4.1.1
  - metric: compute.valu_flops_f64
    archs:
    - gfx908
    description: 'The total 64-bit floating-point operations executed per second on the VALU.
      This is presented with the value of the peak empirical F64 FLOPs achievable on the specific
      accelerator. Note: this does not include any F64 operations from MFMA instructions.'
    legacy_id: 4.1.2
  - metric: compute.mfma_flops_f64
    archs:
    - gfx908
    peak: null
    description_note: The peak empirically measured F64 MFMA operations achievable on the
      specific accelerator is displayed alongside for comparison.
    legacy_id: 4.1.3
