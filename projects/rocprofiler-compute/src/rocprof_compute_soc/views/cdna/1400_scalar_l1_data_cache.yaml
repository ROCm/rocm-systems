- id: 1403
  title: Scalar L1D Cache - L2 Interface
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: sl1d.l2_bw
    label: sL1D-L2 BW
    unit: Gbps
    description: The total number of bytes read from, written to, or atomically updated across
      the sL1D\u2194L2 interface, divided by total duration. Note that sL1D writes and atomics
      are typically unused on current CDNA accelerators, so in the majority of cases this
      can be interpreted as an sL1D\u2192L2 read bandwidth.
    legacy_id: 14.3.0
  - metric: sl1d.l2_rd_req
    label: Read Req
    legacy_id: 14.3.1
  - metric: sl1d.l2_wr_req
    label: Write Req
    legacy_id: 14.3.2
  - metric: sl1d.l2_atomic_req
    label: Atomic Req
    legacy_id: 14.3.3
  - metric: sl1d.l2_stall_cycles
    label: Stall Cycles
    description: The total number of cycles the sL1D\u2194L2 interface was stalled, per normalization
      unit.
    legacy_id: 14.3.4
