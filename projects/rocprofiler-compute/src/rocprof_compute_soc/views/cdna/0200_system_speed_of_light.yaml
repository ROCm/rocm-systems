    - gfx940
    - gfx941
    - gfx942
    description: Indicates the maximum amount of bytes that could have been loaded from, stored
      to, or atomically updated in the LDS per unit time (see LDS Bandwidth example for more
      detail). This is also presented as a percent of the peak theoretical F64 MFMA operations
      achievable on the specific accelerator.
  - metric: lds.theoretical_bw
    archs:
    - gfx950
    description: Indicates the maximum amount of bytes that could have been loaded from, stored
      to, or atomically updated in the LDS per unit time (see LDS Bandwidth example for more
      detail).
  - metric: lds.bank_conflicts_access
    label: LDS Bank Conflicts/Access
    description: The ratio of the number of cycles spent in the LDS scheduler due to bank
      conflicts (as determined by the conflict resolution hardware) to the base number of
      cycles that would be spent in the LDS scheduler in a completely uncontended case. This
      is also presented in normalized form (i.e., the Bank Conflict Rate).
    legacy_id:
      gfx908: 2.1.15
      gfx90a: 2.1.15
      gfx940: 2.1.16
      gfx941: 2.1.16
      gfx942: 2.1.16
      gfx950: 2.1.18
  - metric: vl1d.hit_rate
    pct_of_peak: false
    description: The ratio of the number of vL1D cache line requests that hit in vL1D cache
      over the total number of cache line requests to the vL1D cache RAM.
