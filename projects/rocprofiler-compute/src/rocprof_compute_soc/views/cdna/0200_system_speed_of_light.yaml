  - label: MFMA Utilization
    archs:
    - gfx908
    unit: Percent
    peak: 100
    pct_of_peak: false
    description: Indicates what percent of the kernel's duration the MFMA unit was busy executing
      instructions. Computed as the ratio of the total number of cycles the MFMA was busy
      over the total CU cycles.
  - label: VMEM Utilization
    archs:
    - gfx908
    unit: Percent
    peak: 100
    pct_of_peak: false
    description: Indicates what percent of the kernel's duration the VMEM unit was busy executing
      instructions, including both global/generic and spill/scratch operations (see the VMEM
      instruction count metrics) for more detail). Does not include VALU operations. Computed
      as the ratio of the total number of cycles spent by the scheduler issuing VMEM instructions
      over the total CU cycles.
  - label: Branch Utilization
    archs:
    - gfx908
    unit: Percent
    peak: 100
    pct_of_peak: false
    description: Indicates what percent of the kernel's duration the branch unit was busy
      executing instructions. Computed as the ratio of the total number of cycles spent by
      the scheduler issuing branch instructions over the total CU cycles
