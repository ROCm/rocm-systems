view: System Speed-of-Light
legacy_panel_id: 200
alias: sol
tables:
- id: 201
  title: System Speed-of-Light
  header:
    metric: Metric
    value: Avg
    unit: Unit
    peak: Peak
    pct_of_peak: Percent of Peak
  metrics:
  - label: VALU FLOPs
    archs:
    - gfx908
    unit: GFLOP/s
    peak: $max_sclk * $cu_per_gpu * 64 * 2 / 1000
    pct_of_peak: false
    description: 'The total floating-point operations executed per second on the VALU. This
      is also presented as a percent of the peak theoretical FLOPs achievable on the specific
      accelerator. Note: this does not include any floating-point operations from MFMA instructions.'
  - metric: compute.mfma_flops_bf16
    archs:
    - gfx908
    unavailable: true
    pct_of_peak: false
    description_note: This is also presented as a percent of the peak theoretical BF16 MFMA
      operations achievable on the specific accelerator.
  - metric: compute.mfma_flops_f16
    archs:
    - gfx908
    unavailable: true
    pct_of_peak: false
    description_note: This is also presented as a percent of the peak theoretical F16 MFMA
      operations achievable on the specific accelerator.
  - metric: compute.mfma_flops_f32
    archs:
