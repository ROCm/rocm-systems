    label: Scratch Allocation
    unit: KB per Wave
    round: 3
    legacy_id: 3.1.4
  - metric: spi.workgroups_per_cu
    label: Workgroups
    round: 1
    legacy_id: 3.1.5
  - metric: ta.global_rd_insts
    label: Flat Read
    round: 0
    description: The total number of flat read instructions processed by the address processing
      unit, counted once per wavefront, per normalization unit.
    legacy_id: 3.1.6
  - metric: ta.global_wr_insts
    label: Flat Write
    round: 0
    description: The total number of flat write instructions processed by the address processing
      unit, counted once per wavefront, per normalization unit.
    legacy_id: 3.1.7
  - metric: ta.global_atomic_insts
    label: Flat Atomic
    round: 0
    description: The total number of flat atomic instructions processed by the address processing
      unit, counted once per wavefront, per normalization unit.
    legacy_id: 3.1.8
  - metric: ta.spill_rd_insts
    label: Buffer Read
    round: 0
    description: The total number of buffer read instructions processed by the address processing
      unit, counted once per wavefront, per normalization unit.
    legacy_id: 3.1.9
  - metric: ta.spill_wr_insts
    label: Buffer Write
    round: 0
    description: The total number of buffer write instructions processed by the address processing
      unit, counted once per wavefront, per normalization unit.
    legacy_id: 3.1.10
  - metric: ta.spill_atomic_insts
    label: Buffer Atomic
    round: 0
    description: The total number of buffer atomic instructions processed by the address processing
      unit, counted once per wavefront, per normalization unit.
    legacy_id: 3.1.11
  - metric: lds.insts
    label: LDS Req
    round: 0
    description: The total number of LDS instructions (including, but not limited to, read/write/atomics
      and HIP's __shfl instructions) executed per normalization unit.
    legacy_id: 3.1.12
