view: Memory Chart
legacy_panel_id: 300
alias: memchart
tables:
- id: 301
  title: Memory Chart
  cli_style: mem_chart
  header:
    metric: Metric
    value: Value
    unit: Unit
  metrics:
  - metric: wave.occupancy_pct
    label: Wavefront Occupancy
    round: 1
    legacy_id: 3.1.0
  - metric: dispatch.vgprs
    label: VGPR
    round: 0
    legacy_id: 3.1.1
  - metric: dispatch.sgprs
    label: SGPR
    round: 0
    legacy_id: 3.1.2
  - metric: dispatch.lds_allocation
    round: 0
    legacy_id: 3.1.3
