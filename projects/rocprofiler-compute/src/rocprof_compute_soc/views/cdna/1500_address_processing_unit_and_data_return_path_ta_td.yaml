- id: 1502
  title: Instruction counts
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: ta.total_insts
    label: Total Instructions
    legacy_id: 15.2.0
  - metric: ta.global_insts
    label: Global/Generic Instructions
  - metric: ta.global_rd_insts
    label: Global/Generic Read Instructions
    description: The total number of global & generic memory read instructions executed on
      all compute units on the accelerator, per normalization unit.
  - metric: ta.global_generic_rd_insts_for_lds
    label: Global/Generic Read Instructions for LDS
    archs:
    - gfx950
    legacy_id: 15.2.3
  - metric: ta.global_wr_insts
    label: Global/Generic Write Instructions
    description: The total number of global & generic memory write instructions executed on
      all compute units on the accelerator, per normalization unit.
  - metric: ta.global_atomic_insts
    label: Global/Generic Atomic Instructions
    description: The total number of global & generic memory atomic (with and without return)
      instructions executed on all compute units on the accelerator, per normalization unit.
  - metric: ta.spill_insts
    label: Spill/Stack Instructions
  - metric: ta.spill_rd_insts
    label: Spill/Stack Read Instructions
    description: The total number of spill/stack memory read instructions executed on all
      compute units on the accelerator, per normalization unit.
  - metric: ta.spill_stack_rd_insts_for_lds
    label: Spill/Stack Read Instructions for LDS
    archs:
    - gfx950
    legacy_id: 15.2.8
  - metric: ta.spill_wr_insts
    label: Spill/Stack Write Instructions
    description: The total number of spill/stack memory write instructions executed on all
      compute units on the accelerator, per normalization unit.
  - metric: ta.spill_atomic_insts
    label: Spill/Stack Atomic Instructions
    archs:
    - gfx908
    - gfx940
    - gfx941
    - gfx942
    - gfx950
    description: The total number of spill/stack memory atomic (with and without return) instructions
      executed on all compute units on the accelerator, per normalization unit. Typically
      unused as these memory operations are typically used to implement thread-local storage.
  - metric: ta.spill_atomic_insts
    label: Spill/Stack Atomic Instructions
    archs:
    - gfx90a
    display: spill_atomic_insts_max_as_min
    description: The total number of spill/stack memory atomic (with and without return) instructions
      executed on all compute units on the accelerator, per normalization unit. Typically
      unused as these memory operations are typically used to implement thread-local storage.
