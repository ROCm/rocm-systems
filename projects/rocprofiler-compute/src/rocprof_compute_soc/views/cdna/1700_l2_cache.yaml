- id: 1703
  title: L2 Cache Accesses
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: l2.bw
    label: Bandwidth
    unit: Gbps
    description: The number of bytes looked up in the L2 cache, divided by total duration.
      The number of bytes is calculated as the number of cache lines requested multiplied
      by the cache line size. This value does not consider partial requests, so for example,
      if only a single value is requested in a cache line, the data movement will still be
      counted as a full cache line.
  - metric: l2.rd_bw
    label: Read Bandwidth
    archs:
    - gfx950
    unit: Gbps
    legacy_id: 17.3.1
  - metric: l2.wr_bw
    label: Write Bandwidth
    archs:
    - gfx950
    unit: Gbps
    legacy_id: 17.3.2
  - metric: l2.atomic_bw
