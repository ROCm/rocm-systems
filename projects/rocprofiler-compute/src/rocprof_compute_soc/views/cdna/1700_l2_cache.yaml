  - metric: fabric.wr_atomic_bw
    label: Write and Atomic BW
    archs:
    - gfx940
    - gfx941
    - gfx942
    - gfx950
    unit: Gbps
    description: The total number of bytes written by the L2 over Infinity Fabric by write
      and atomic operations divided by total duration. Note that on current CDNA accelerators,
      such as the MI2XX, requests are only considered atomic by Infinity Fabric if they are
      targeted at non-write-cacheable memory, for example, fine-grained memory allocations
      or uncached memory allocations on the MI2XX.
  - metric: fabric.hbm_wr_atomic_traffic
    legacy_id: 17.2.5
