view: Memory Bandwidth Analysis
legacy_panel_id: 3000
alias: membw_analysis
tables:
- id: 3001
  title: L1 Cache
  header:
    metric: Metric
    value: Avg
    unit: Unit
  metrics:
  - metric: compute.l1_cache_vmem_stalled_by_l1_cache
    label: L1 Cache - VMEM stalled by L1 Cache
    description_note: 'Equation: SUM((SQ_VMEM_TA_CMD_FIFO_FULL * 100)) / SUM(SQ_BUSY_CYCLES)'
    legacy_id: 30.1.0
  - metric: ta.l1_cache_ta_coalesce_rate
    label: L1 Cache - TA coalesce rate
    description_note: 'Equation: SUM(((4 * TA_BUFFER_WAVEFRONTS_sum) * 100)) / SUM(TA_BUFFER_TOTAL_CYCLES_sum)'
    legacy_id: 30.1.1
  - metric: vl1d.coalescing
    label: L1 Cache - VL1 coalesce efficiency
    description: 'Measures how efficiently threads are packed into TCP requests via TA coalescing.
      Numerator: Total threads processed (64 threads/wavefront * wavefronts). Denominator:
      Maximum threads that could be served if every TCP request was fully coalesced (4 threads/request).
      100% = perfect 4:1 coalescing (4 contiguous threads share each cache line access). 25%
      = no coalescing (each thread requires a separate TCP request). A low rate indicates
      scattered memory access patterns that defeat coalescing. Equation: SUM(((TA_TOTAL_WAVEFRONTS_sum
      * 64) * 100)) / SUM((TCP_TOTAL_ACCESSES_sum * 4))'
  - metric: ta.l1_cache_ta_addr_stalled_by_tcp
    label: L1 Cache - TA addr stalled by TCP
    description_note: 'Equation: SUM((TA_ADDR_STALLED_BY_TC_CYCLES_sum * 100)) / SUM(TA_TA_BUSY_sum)'
    legacy_id: 30.1.3
  - metric: ta.l1_cache_ta_addr_stalled_by_td
    label: L1 Cache - TA addr stalled by TD
    description_note: 'Equation: SUM((TA_ADDR_STALLED_BY_TD_CYCLES_sum * 100)) / SUM(TA_TA_BUSY_sum)'
    legacy_id: 30.1.4
  - metric: ta.l1_cache_ta_data_stalled_by_tcp
    label: L1 Cache - TA data stalled by TCP
    description_note: 'Equation: SUM((TA_DATA_STALLED_BY_TC_CYCLES_sum * 100)) / SUM(TA_TA_BUSY_sum)'
    legacy_id: 30.1.5
  - metric: ta.l1_cache_ta_addresser_stalled
    label: L1 Cache - TA addresser stalled
    description_note: 'Equation: SUM((TA_ADDRESSER_STALLED_CYCLES_sum * 100)) / SUM(TA_TA_BUSY_sum)'
    legacy_id: 30.1.6
  - metric: vl1d.cache_ta_stalled_by_tcp_aggregated
    label: L1 Cache - TA stalled by TCP (aggregated)
    description_note: 'Equation: SUM((TCP_TCP_TA_ADDR_STALL_CYCLES_sum * 100)) / SUM(TCP_GATE_EN2_sum)'
    legacy_id: 30.1.7
  - metric: vl1d.cache_tcp_hit_rate
    label: L1 Cache - TCP hit rate
    description_note: 'Equation: SUM(((TCP_TOTAL_CACHE_ACCESSES_sum - TCP_CACHE_MISS_sum)
      * 100)) / SUM(TCP_TOTAL_CACHE_ACCESSES_sum)'
    legacy_id: 30.1.8
  - metric: vl1d.cache_tcp_miss_rate
    label: L1 Cache - TCP miss rate
    description_note: 'Equation: SUM((TCP_CACHE_MISS_sum * 100)) / SUM(TCP_TOTAL_CACHE_ACCESSES_sum)'
    legacy_id: 30.1.9
  - metric: vl1d.cache_tcp_stalled_by_utcl1
    label: L1 Cache - TCP stalled by UTCL1
    description_note: 'Equation: SUM((TCP_UTCL1_STALL_INFLIGHT_MAX_sum * 100)) / SUM(TCP_GATE_EN2_sum)'
    legacy_id: 30.1.10
  - metric: vl1d.cache_tcp_stalled_by_utcl2
    label: L1 Cache - TCP stalled by UTCL2
    description_note: 'Equation: SUM((TCP_PERF_SEL_UTCL1_STALL_LFIFO_NOT_RES_sum * 100)) /
      SUM(TCP_GATE_EN2_sum)'
    legacy_id: 30.1.11
  - metric: vl1d.hit_ratio
    label: L1 Cache - UTCL1 hit rate
    description: 'Percentage of UTCL1 (TLB) translation requests that hit. Higher is better
      for address translation performance. Equation: SUM((TCP_UTCL1_TRANSLATION_HIT_sum *
      100)) / SUM(TCP_UTCL1_REQUEST_sum)'
  - metric: vl1d.cache_utcl1_miss_rate
    label: L1 Cache - UTCL1 miss rate
    description_note: 'Equation: SUM((TCP_UTCL1_TRANSLATION_MISS_sum * 100)) / SUM(TCP_UTCL1_REQUEST_sum)'
    legacy_id: 30.1.13
  - metric: vl1d.cache_tcp_stalled_by_td
    label: L1 Cache - TCP stalled by TD
    description_note: 'Equation: SUM((TCP_TD_TCP_STALL_CYCLES_sum * 100)) / SUM(TCP_GATE_EN2_sum)'
    legacy_id: 30.1.14
  - metric: vl1d.cache_tcp_stalled_by_l2
    label: L1 Cache - TCP stalled by L2
    description_note: 'Equation: SUM((TCP_TCR_TCP_STALL_CYCLES_sum * 100)) / SUM(TCP_GATE_EN2_sum)'
    legacy_id: 30.1.15
  - metric: vl1d.tag_ram_0_req
    label: L1 Cache - Tag RAM 0 Req
    description: null
  - metric: vl1d.tag_ram_1_req
    label: L1 Cache - Tag RAM 1 Req
    description: null
  - metric: vl1d.tag_ram_2_req
    label: L1 Cache - Tag RAM 2 Req
    description: null
  - metric: vl1d.tag_ram_3_req
    label: L1 Cache - Tag RAM 3 Req
    description: null
- id: 3002
  title: L1 Traffic
  header:
    metric: Metric
    value: Avg
    unit: Unit
  metrics:
  - metric: compute.vmem_issue_rate
    label: VMEM issue rate
    description_note: 'Equation: SUM(SQ_INSTS_VMEM) / SUM(SQ_WAVE_CYCLES)'
    legacy_id: 30.2.0
  - metric: ta.total_insts
    label: L1 inbound traffic (TA_TOTAL_WAVEFRONTS)
    description: 'The number of wavefronts processed by TA (L1 front-end). Equation: SUM(TA_TOTAL_WAVEFRONTS_sum)
      / SUM($denom)'
  - metric: ta.processing_rate
    label: TA processing rate
    description_note: 'Equation: SUM(TA_TOTAL_WAVEFRONTS_sum) / SUM(TA_TA_BUSY_sum)'
    legacy_id: 30.2.2
  - metric: vl1d.cu_l1_throughput
    label: CU-L1 throughput
    description_note: 'Equation: SUM(TCP_TOTAL_ACCESSES_sum) / SUM(TCP_GATE_EN2_sum)'
    legacy_id: 30.2.3
  - metric: vl1d.util
    label: L1 utilization
    description: 'Percentage of time TCP is actively processing requests (busy cycles / free-running
      cycles). Equation: SUM((TCP_GATE_EN2_sum * 100)) / SUM(TCP_GATE_EN1_sum)'
  - metric: vl1d.average_lat
    label: L1 average latency
    description_note: 'Weighted average across all CUs (SUM/SUM gives more weight to CUs with
      more accesses). Equation: SUM(TCP_TCP_LATENCY_sum) / SUM(TCP_TOTAL_ACCESSES_sum)'
    legacy_id: 30.2.5
  - metric: vl1d.average_lat
    label: L1 latency
    display: avg_vl1d_average_lat
    description: 'Latency to complete memory access, from wave entering to wave leaving TCP.
      Ratio of averages across CUs (AVG/AVG gives equal weight to each CU). Equation: AVG(TCP_TCP_LATENCY_sum)
      / AVG(TCP_TOTAL_ACCESSES_sum)'
  - metric: vl1d.l2_throughput_reads_writes
    label: L1-L2 throughput (reads + writes)
    description_note: 'Equation: SUM((TCP_TCC_READ_REQ_sum + TCP_TCC_WRITE_REQ_sum)) / SUM(TCP_GATE_EN2_sum)'
    legacy_id: 30.2.7
  - metric: vl1d.l2_throughput_total
    label: L1-L2 throughput (total)
    description_note: 'Equation: SUM((TCP_TCC_READ_REQ_sum + TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum
      + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum)) / SUM(TCP_GATE_EN2_sum)'
    legacy_id: 30.2.8
  - metric: vl1d.l2_rd_average_lat
    label: L2 read average latency
    description_note: 'Weighted average across all CUs (SUM/SUM gives more weight to CUs with
      more accesses). Equation: SUM(TCP_TCC_READ_REQ_LATENCY_sum) / SUM(TCP_TCC_READ_REQ_sum)'
    legacy_id: 30.2.9
  - metric: vl1d.l2_rd_average_lat
    label: L2 read latency
    display: avg_vl1d_l2_rd_average_lat
    description: 'Latency to get a read response from L2 (TCC), including reads and atomics
      with return. Ratio of averages across CUs (AVG/AVG gives equal weight to each CU). Equation:
      AVG(TCP_TCC_READ_REQ_LATENCY_sum) / AVG(TCP_TCC_READ_REQ_sum)'
  - metric: vl1d.l2_wr_average_lat
    label: L2 write average latency
    description_note: 'Weighted average across all CUs (SUM/SUM gives more weight to CUs with
      more accesses). Equation: SUM(TCP_TCC_WRITE_REQ_LATENCY_sum) / SUM(TCP_TCC_WRITE_REQ_sum)'
    legacy_id: 30.2.11
  - metric: vl1d.l2_wr_average_lat
    label: L2 write latency
    display: avg_vl1d_l2_wr_average_lat
    description: 'Latency to get a write acknowledgment from L2 (TCC), including writes and
      atomics without return. Ratio of averages across CUs (AVG/AVG gives equal weight to
      each CU). Equation: AVG(TCP_TCC_WRITE_REQ_LATENCY_sum) / AVG(TCP_TCC_WRITE_REQ_sum)'
  - metric: vl1d.utcl1_average_lat
    label: UTCL1 average latency
    description_note: 'Weighted average across all CUs (SUM/SUM gives more weight to CUs with
      more accesses). Equation: SUM(TCP_CLIENT_UTCL1_INFLIGHT_sum) / SUM(TCP_UTCL1_REQUEST_sum)'
    legacy_id: 30.2.13
  - metric: vl1d.utcl1_average_lat
    label: UTCL1 latency
    display: avg_vl1d_utcl1_average_lat
    description: 'Latency for UTCL1 (L1 TLB) address translation, from request to completion.
      Includes both hits and misses. High latency indicates TLB pressure or UTCL2 miss penalty.
      MI350 restored this counter (removed in MI300 for power savings). Ratio of averages
      across CUs (AVG/AVG gives equal weight to each CU). Equation: AVG(TCP_CLIENT_UTCL1_INFLIGHT_sum)
      / AVG(TCP_UTCL1_REQUEST_sum)'
  - metric: vl1d.utcl1_to_utcl2_average_lat
    label: UTCL1 to UTCL2 average latency
    description_note: 'Weighted average across all CUs (SUM/SUM gives more weight to CUs with
      more accesses). Equation: SUM(TCP_UTCL1_UTCL2_INFLIGHT_sum) / SUM(TCP_UTCL1_TRANSLATION_MISS_sum)'
    legacy_id: 30.2.15
  - metric: vl1d.utcl1_to_utcl2_average_lat
    label: UTCL1 to UTCL2 latency
    display: avg_vl1d_utcl1_to_utcl2_average_lat
    description: 'Latency for UTCL1 misses to be resolved by UTCL2 (L2 TLB). Only counts requests
      that missed UTCL1 and went to UTCL2. High latency indicates page table walk overhead.
      Ratio of averages across CUs (AVG/AVG gives equal weight to each CU). Equation: AVG(TCP_UTCL1_UTCL2_INFLIGHT_sum)
      / AVG(TCP_UTCL1_TRANSLATION_MISS_sum)'
- id: 3003
  title: TD Return Path
  header:
    metric: Metric
    value: Avg
    unit: Unit
  metrics:
  - metric: td.stalled_by_tcp
    label: TD - stalled by TCP
    description_note: 'Equation: SUM((TD_TC_STALL_sum * 100)) / SUM(TD_TD_BUSY_sum)'
    legacy_id: 30.3.0
  - metric: td.input_fifo_full
    label: TD - input FIFO full
    description_note: 'Equation: SUM((TD_TC_TD_FIFO_FULL_sum * 100)) / SUM(TD_TD_BUSY_sum)'
    legacy_id: 30.3.1
  - metric: td.output_fifo_full
    label: TD - output FIFO full
    description_note: 'Equation: SUM((TD_OUTPUT_FIFO_FULL_sum * 100)) / SUM(TD_TD_BUSY_sum)'
    legacy_id: 30.3.2
  - metric: td.stalled_by_spi
    label: TD - stalled by SPI
    description_note: 'Equation: SUM((TD_SPI_STALL_sum * 100)) / SUM(TD_TD_BUSY_sum)'
    legacy_id: 30.3.3
  - metric: td.l1_cu_throughput
    label: TD - L1-CU throughput
    description_note: 'Equation: SUM(TD_LOAD_WAVEFRONT_sum) / SUM(TD_TD_BUSY_sum)'
    legacy_id: 30.3.4
  - metric: td.load_wavefronts
    label: TD - load wavefronts
    description_note: 'Equation: SUM(TD_LOAD_WAVEFRONT_sum) / SUM($denom)'
    legacy_id: 30.3.5
  - metric: td.atomic_insts
    label: TD - atomic wavefronts
    unit: (Wavefronts + $normUnit)
    description: 'Number of atomic operation wavefronts processed by TD. Equation: SUM(TD_ATOMIC_WAVEFRONT_sum)
      / SUM($denom)'
  - metric: td.wr_insts
    label: TD - store wavefronts
    unit: (Wavefronts + $normUnit)
    description: 'Number of store wavefronts processed by TD. Equation: SUM(TD_STORE_WAVEFRONT_sum)
      / SUM($denom)'
  - metric: td.coalescable_wavefronts_rate
    label: TD - coalescable wavefronts rate
    description_note: 'Equation: SUM((TD_COALESCABLE_WAVEFRONT_sum * 100)) / SUM(TD_LOAD_WAVEFRONT_sum)'
    legacy_id: 30.3.8
