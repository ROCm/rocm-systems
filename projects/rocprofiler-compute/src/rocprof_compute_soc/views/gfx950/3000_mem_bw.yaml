- id: 3012
  title: L2 Bottleneck Detection Indicators
  header:
    metric: Metric
    value: Avg
    unit: Unit
  metrics:
  - metric: l2.input_buffer_stall_rate
    label: L2 Back Pressure Indicator
    description: 'Percentage of L2 busy time the input buffer was stalled. A rate >= 10% indicates
      L2 is backpressuring L1 (GL1/GL2 potential bottleneck). Equation: 100 * (SUM(TCC_IB_STALL_sum)
      / SUM(TCC_BUSY_sum))'
  - metric: fabric.rd_hbm_stall
    label: L2 Memory BW Bound - Read Credit Pressure
    description: 'Percentage of L2 busy time read requests were stalled due to HBM credit
      exhaustion. High values (>10%) combined with high memory utilization indicate memory
      read bandwidth bound. Equation: 100 * (SUM(TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum))'
  - metric: fabric.wr_hbm_stall
    label: L2 Memory BW Bound - Write Credit Pressure
    description: 'Percentage of L2 busy time write requests were stalled due to HBM credit
      exhaustion. High values (>10%) combined with high memory utilization indicate memory
      write bandwidth bound. Equation: 100 * (SUM(TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum))'
  - metric: fabric.memory_bw_bound_combined_credit_pressure
    label: L2 Memory BW Bound - Combined Credit Pressure
    description_note: 'Equation: 100 * (SUM(TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum + TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum)
      / SUM(TCC_BUSY_sum))'
    legacy_id: 30.12.3
  - metric: l2.lat_fifo_full_rate
    label: L2 Internal Resource Pressure - Latency FIFO
    description: 'Percentage of L2 busy time the latency FIFO was full. A rate >= 10% indicates
      L2 internal resource exhaustion bottleneck. This is one of the TCC_TAG_STALL breakdown
      components (LFIFO full, 2-deep). Equation: 100 * (SUM(TCC_LATENCY_FIFO_FULL_sum) / SUM(TCC_BUSY_sum))'
  - metric: l2.wr_data_fifo_full_rate
    label: L2 Internal Resource Pressure - Source FIFO
    description: 'Percentage of L2 busy time the source data FIFO was full. A rate >= 10%
      indicates L2 write data path bottleneck. Equation: 100 * (SUM(TCC_SRC_FIFO_FULL_sum)
      / SUM(TCC_BUSY_sum))'
  - metric: l2.hit_rate
    label: L2 Cache Efficiency
    description: 'L2 cache hit rate. A low rate (<50%) indicates the workload exceeds L2 cache
      capacity, leading to high memory traffic. This helps distinguish cache-bound from memory
      bandwidth-bound scenarios. Equation: 100 * (SUM(TCC_HIT_sum) / SUM(TCC_HIT_sum + TCC_MISS_sum))'
  - metric: fabric.to_memory_traffic_ratio
    description_note: 'Equation: 100 * (SUM(TCC_EA0_RDREQ_sum + TCC_EA0_WRREQ_sum) / SUM(TCC_REQ_sum))'
    legacy_id: 30.12.7
  - metric: fabric.remote_access_pressure_gmi
    description_note: 'Equation: 100 * (SUM(TCC_EA0_RDREQ_GMI_CREDIT_STALL_sum + TCC_EA0_WRREQ_GMI_CREDIT_STALL_sum)
      / SUM(TCC_BUSY_sum))'
    legacy_id: 30.12.8
- id: 3013
  title: EA Interface
  header:
    metric: Metric
    value: Avg
    unit: Unit
  metrics:
  - metric: grbm.ea_util
    label: EA utilization
    description_note: 'Equation: 100 * (SUM(GRBM_EA_BUSY) / SUM(GRBM_GUI_ACTIVE))'
    legacy_id: 30.13.0
  - metric: fabric.hbm_rd_traffic
    label: EA read request fraction - HBM
    description: 'Percentage of EA read requests destined for the accelerator''s local HBM.
      High values (>90%) are typical for compute workloads. Low values indicate significant
      remote (GMI) or host (IO) read traffic. Equation: 100 * (SUM(TCC_EA0_RDREQ_DRAM_sum)
      / SUM(TCC_EA0_RDREQ_sum))'
  - metric: fabric.ea_rd_bw_fraction_hbm
    label: EA read BW fraction - HBM
    description_note: 'Equation: 100 * (SUM(TCC_EA0_RDREQ_DRAM_32B_sum) / SUM(TCC_EA0_RDREQ_DRAM_32B_sum
      + TCC_EA0_RDREQ_GMI_32B_sum + TCC_EA0_RDREQ_IO_32B_sum))'
    legacy_id: 30.13.2
  - metric: fabric.ea_rd_bw_fraction_gmi
    label: EA read BW fraction - GMI
    description_note: 'Equation: 100 * (SUM(TCC_EA0_RDREQ_GMI_32B_sum) / SUM(TCC_EA0_RDREQ_DRAM_32B_sum
      + TCC_EA0_RDREQ_GMI_32B_sum + TCC_EA0_RDREQ_IO_32B_sum))'
    legacy_id: 30.13.3
  - metric: fabric.ea_rd_bw_fraction_io
    label: EA read BW fraction - IO
    description_note: 'Equation: 100 * (SUM(TCC_EA0_RDREQ_IO_32B_sum) / SUM(TCC_EA0_RDREQ_DRAM_32B_sum
      + TCC_EA0_RDREQ_GMI_32B_sum + TCC_EA0_RDREQ_IO_32B_sum))'
    legacy_id: 30.13.4
  - metric: fabric.hbm_wr_atomic_traffic
    label: EA write request fraction - HBM
    description: 'Percentage of EA write requests (including atomics) destined for HBM. High
      values (>90%) are typical for compute workloads. Equation: 100 * (SUM(TCC_EA0_WRREQ_DRAM_sum)
      / SUM(TCC_EA0_WRREQ_sum))'
  - metric: fabric.atomic_traffic
    label: EA atomic fraction of writes
    description: 'Percentage of EA write requests that are atomic operations. High atomic
      rates can indicate contention-heavy workloads (locks, reductions) and typically have
      higher latency than pure writes. Equation: 100 * (SUM(TCC_EA0_ATOMIC_sum) / SUM(TCC_EA0_WRREQ_sum))'
  - metric: fabric.ea_hbm_wr_vs_atomic_split
    label: EA HBM write vs atomic split
    description_note: 'Equation: 100 * (SUM(TCC_EA0_WRREQ_WRITE_DRAM_sum) / SUM(TCC_EA0_WRREQ_DRAM_sum))'
    legacy_id: 30.13.7
  - metric: fabric.uncached_rd_traffic
    label: EA uncached read fraction
    description: 'Percentage of EA read requests that bypass caching (uncached/streaming reads).
      High uncached rates are expected for streaming workloads. Uses 32B-granularity uncached
      counter relative to total read request count. Equation: 100 * (SUM(TCC_EA0_RD_UNCACHED_32B_sum)
      / SUM(TCC_EA0_RDREQ_sum))'
  - metric: fabric.uncached_wr_atomic_traffic
    label: EA uncached write fraction
    description: 'Percentage of EA write requests that bypass caching (uncached/streaming
      writes). High uncached rates are expected for write-only or streaming workloads. Equation:
      100 * (SUM(TCC_EA0_WR_UNCACHED_32B_sum) / SUM(TCC_EA0_WRREQ_sum))'
- id: 3014
  title: EA Traffic
  header:
    metric: Metric
    value: Avg
    unit: Unit
  metrics:
  - metric: fabric.hbm_rd_bw
    label: EA to HBM read BW
    description: 'Read bandwidth from EA to HBM (DRAM), calculated using the gfx950-specific
      32B-granularity counter. Each count represents 32 bytes of read data transferred. Equation:
      (SUM(TCC_EA0_RDREQ_DRAM_32B_sum * 32)) / (SUM(End_Timestamp - Start_Timestamp))'
  - metric: fabric.hbm_wr_bw
    label: EA to HBM write BW
    description: 'Non-atomic write bandwidth from EA to HBM. Uses the gfx950-specific per-destination
      write counter that separates pure writes from atomics. Equation: (SUM(TCC_EA0_WRREQ_WRITE_DRAM_32B_sum
      * 32)) / (SUM(End_Timestamp - Start_Timestamp))'
  - metric: fabric.hbm_atomic_bw
    label: EA to HBM atomic BW
    description: 'Atomic operation bandwidth from EA to HBM. Atomics involve read-modify-write
      cycles and typically achieve lower effective bandwidth than pure reads or writes. Equation:
      (SUM(TCC_EA0_WRREQ_ATOMIC_DRAM_32B_sum * 32)) / (SUM(End_Timestamp - Start_Timestamp))'
  - metric: fabric.ea_to_hbm_total_bw
    label: EA to HBM total BW
    description_note: 'Equation: (SUM((TCC_EA0_RDREQ_DRAM_32B_sum + TCC_EA0_WRREQ_WRITE_DRAM_32B_sum
      + TCC_EA0_WRREQ_ATOMIC_DRAM_32B_sum) * 32)) / (SUM(End_Timestamp - Start_Timestamp))'
    legacy_id: 30.14.3
  - metric: fabric.xgmi_rd_bw
    label: EA to GMI read BW
    description: 'Read bandwidth from EA via GMI to remote memory. High values indicate significant
      cross-die or cross-socket data movement. Equation: (SUM(TCC_EA0_RDREQ_GMI_32B_sum *
      32)) / (SUM(End_Timestamp - Start_Timestamp))'
  - metric: fabric.xgmi_wr_bw
    label: EA to GMI write BW
    description: 'Write bandwidth from EA via GMI to remote memory. Equation: (SUM(TCC_EA0_WRREQ_WRITE_GMI_32B_sum
      * 32)) / (SUM(End_Timestamp - Start_Timestamp))'
  - metric: fabric.xgmi_atomic_bw
    label: EA to GMI atomic BW
    description: 'Atomic bandwidth from EA via GMI. Remote atomics incur significantly higher
      latency than local HBM atomics. Equation: (SUM(TCC_EA0_WRREQ_ATOMIC_GMI_32B_sum * 32))
      / (SUM(End_Timestamp - Start_Timestamp))'
  - metric: fabric.pcie_rd_bw
    label: EA to IO read BW
    description: 'Read bandwidth from EA via IO (PCIe) interface. Measures host-to-device
      or device-to-device PCIe read data transfer rate. Equation: (SUM(TCC_EA0_RDREQ_IO_32B_sum
      * 32)) / (SUM(End_Timestamp - Start_Timestamp))'
  - metric: fabric.pcie_wr_bw
    label: EA to IO write BW
    description: 'Write bandwidth from EA via IO (PCIe) interface. Measures device-to-host
      PCIe write data transfer rate. Equation: (SUM(TCC_EA0_WRREQ_WRITE_IO_32B_sum * 32))
      / (SUM(End_Timestamp - Start_Timestamp))'
  - metric: fabric.pcie_atomic_bw
    label: EA to IO atomic BW
    description: 'Atomic bandwidth from EA via IO (PCIe) interface. PCIe atomics are rare
      and typically indicate cross-device synchronization. Equation: (SUM(TCC_EA0_WRREQ_ATOMIC_IO_32B_sum
      * 32)) / (SUM(End_Timestamp - Start_Timestamp))'
  - metric: fabric.rd_lat
    label: EA read average latency
    unit: Cycles per Request
    description: 'The average number of cycles an EA read request is in flight, from L2''s
      perspective. Weighted average across all L2 channels (SUM/SUM gives more weight to channels
      with more requests). Higher latency indicates memory-side congestion or long HBM/GMI/IO
      access times. Equation: SUM(TCC_EA0_RDREQ_LEVEL_sum) / SUM(TCC_EA0_RDREQ_sum)'
  - metric: fabric.rd_lat
    label: EA read latency
    unit: Cycles per Request
    display: avg_fabric_rd_lat
    description: 'The number of cycles an EA read request was in flight, from L2''s perspective.
      Ratio of averages across L2 channels (AVG/AVG gives equal weight to each channel). Equation:
      AVG(TCC_EA0_RDREQ_LEVEL_sum) / AVG(TCC_EA0_RDREQ_sum)'
  - metric: fabric.wr_lat
    label: EA write average latency
    unit: Cycles per Request
    description: 'The average number of cycles an EA write request is in flight. Write latency
      is typically lower than read latency since writes can be buffered. Weighted average
      across all L2 channels (SUM/SUM gives more weight to channels with more requests). Equation:
      SUM(TCC_EA0_WRREQ_LEVEL_sum) / SUM(TCC_EA0_WRREQ_sum)'
  - metric: fabric.wr_lat
    label: EA write latency
    unit: Cycles per Request
    display: avg_fabric_wr_lat
    description: 'The number of cycles an EA write request was in flight, from L2''s perspective.
      Ratio of averages across L2 channels (AVG/AVG gives equal weight to each channel). Equation:
      AVG(TCC_EA0_WRREQ_LEVEL_sum) / AVG(TCC_EA0_WRREQ_sum)'
  - metric: fabric.atomic_lat
    label: EA atomic average latency
    unit: Cycles per Request
    description: 'The average number of cycles an EA atomic request is in flight. Atomics
      typically have the highest latency due to read-modify-write semantics. Weighted average
      across all L2 channels (SUM/SUM gives more weight to channels with more requests). Equation:
      SUM(TCC_EA0_ATOMIC_LEVEL_sum) / SUM(TCC_EA0_ATOMIC_sum)'
  - metric: fabric.atomic_lat
    label: EA atomic latency
    unit: Cycles per Request
    display: avg_fabric_atomic_lat
    description: 'The number of cycles an EA atomic request was in flight, from L2''s perspective.
      Ratio of averages across L2 channels (AVG/AVG gives equal weight to each channel). Equation:
      AVG(TCC_EA0_ATOMIC_LEVEL_sum) / AVG(TCC_EA0_ATOMIC_sum)'
