- id: 3005
  title: Normalized Throughput Metrics (per Second)
  header:
    metric: Metric
    value: Avg
    unit: Unit
  metrics:
  - metric: ta.normalized_ta_processing_rate
    label: Normalized TA processing rate
    description_note: 'Equation: SUM(TA_TOTAL_WAVEFRONTS_sum) / (SUM((End_Timestamp - Start_Timestamp))
      / 1000000000)'
    legacy_id: 30.5.0
  - metric: vl1d.normalized_cu_l1_throughput
    label: Normalized CU-L1 throughput
    description_note: 'Equation: SUM(TCP_TOTAL_ACCESSES_sum) / (SUM((End_Timestamp - Start_Timestamp))
      / 1000000000)'
    legacy_id: 30.5.1
  - metric: vl1d.normalized_l1_l2_throughput_reads_writes
    label: Normalized L1-L2 throughput (reads + writes)
    description_note: 'Equation: SUM((TCP_TCC_READ_REQ_sum + TCP_TCC_WRITE_REQ_sum)) / (SUM((End_Timestamp
      - Start_Timestamp)) / 1000000000)'
    legacy_id: 30.5.2
  - metric: vl1d.normalized_l1_l2_throughput_total
    label: Normalized L1-L2 throughput (total)
    description_note: 'Equation: SUM((TCP_TCC_READ_REQ_sum + TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum
      + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum)) / (SUM((End_Timestamp - Start_Timestamp)) / 1000000000)'
    legacy_id: 30.5.3
  - metric: td.normalized_td_l1_cu_throughput
    label: Normalized TD - L1-CU throughput
    description_note: 'Equation: SUM(TD_LOAD_WAVEFRONT_sum) / (SUM((End_Timestamp - Start_Timestamp))
      / 1000000000)'
    legacy_id: 30.5.4
