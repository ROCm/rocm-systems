  - metric: fabric.normalized_ea_io_rd_credit_stall
    label: Normalized EA - IO read credit stall
    description_note: 'Equation: 100 * (SUM(TCC_EA0_RDREQ_IO_CREDIT_STALL_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD))'
