- id: 3018
  title: EA Bottleneck Detection Indicators
  header:
    metric: Metric
    value: Avg
    unit: Unit
  metrics:
  - metric: fabric.rd_hbm_stall
    label: EA HBM BW Bound - Read Credit Pressure
    description: 'Percentage of L2 busy time EA read requests were stalled due to HBM credit
      exhaustion. High values (>10%) indicate HBM read bandwidth is saturated. This is the
      EA-centric view of the HBM read bottleneck. Equation: 100 * (SUM(TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum)
      / SUM(TCC_BUSY_sum))'
  - metric: fabric.wr_hbm_stall
    label: EA HBM BW Bound - Write Credit Pressure
    description: 'Percentage of L2 busy time EA write requests were stalled due to HBM credit
      exhaustion. High values (>10%) indicate HBM write bandwidth is saturated. Equation:
      100 * (SUM(TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum))'
  - metric: fabric.memory_bw_bound_combined_credit_pressure
    label: EA HBM BW Bound - Combined
    description: 'Combined HBM read and write credit stall percentage. This is the primary
      EA-level HBM bandwidth bound indicator. High values (>10%) with high EA utilization
      strongly indicate HBM bandwidth is the bottleneck. Equation: 100 * (SUM(TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum
      + TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum))'
  - metric: fabric.remote_access_pressure_gmi
    label: EA GMI BW Bound - Combined
    description: 'Combined GMI read and write credit stall percentage. High values indicate
      the remote memory (GMI) path is the bottleneck. Relevant for multi-XCD or multi-socket
      workloads with significant cross-die data movement. Equation: 100 * (SUM(TCC_EA0_RDREQ_GMI_CREDIT_STALL_sum
      + TCC_EA0_WRREQ_GMI_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum))'
  - metric: fabric.ea_io_bw_bound_combined
    label: EA IO BW Bound - Combined
    description_note: 'Equation: 100 * (SUM(TCC_EA0_RDREQ_IO_CREDIT_STALL_sum + TCC_EA0_WRREQ_IO_CREDIT_STALL_sum)
      / SUM(TCC_BUSY_sum))'
    legacy_id: 30.18.4
  - metric: fabric.ea_wr_backpressure
    description_note: 'Equation: 100 * (SUM(TCC_EA0_WRREQ_STALL_sum + TCC_TOO_MANY_EA_WRREQS_STALL_sum)
      / SUM(TCC_BUSY_sum))'
    legacy_id: 30.18.5
  - metric: fabric.ea_rd_wr_balance
    description_note: 'Equation: 100 * (SUM(TCC_EA0_RDREQ_sum) / SUM(TCC_EA0_RDREQ_sum + TCC_EA0_WRREQ_sum))'
    legacy_id: 30.18.6
  - metric: fabric.ea_hbm_atomic_pressure
    description_note: 'Equation: 100 * (SUM(TCC_EA0_WRREQ_ATOMIC_DRAM_sum) / SUM(TCC_EA0_WRREQ_DRAM_sum))'
    legacy_id: 30.18.7
  - metric: fabric.ea_stall_destination_dominance_hbm
    description_note: 'Equation: 100 * (SUM(HBM_credit_stalls) / SUM(all_credit_stalls))'
    legacy_id: 30.18.8
  - metric: fabric.ea_stall_destination_dominance_gmi
    description_note: 'Equation: 100 * (SUM(GMI_credit_stalls) / SUM(all_credit_stalls))'
    legacy_id: 30.18.9
  - metric: fabric.ea_stall_destination_dominance_io
    description_note: 'Equation: 100 * (SUM(IO_credit_stalls) / SUM(all_credit_stalls))'
    legacy_id: 30.18.10
