  - metric: fabric.normalized_ea_to_hbm_atomic_req
    label: Normalized EA to HBM atomic requests
    description_note: 'Equation: SUM(TCC_EA0_WRREQ_ATOMIC_DRAM_sum) / (SUM(End_Timestamp -
      Start_Timestamp) / 1000000000)'
