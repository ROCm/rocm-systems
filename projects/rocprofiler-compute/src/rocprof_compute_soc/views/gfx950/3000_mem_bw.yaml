    unit: Unit
  metrics:
  - metric: fabric.normalized_ea_hbm_rd_credit_stall
    label: Normalized EA - HBM read credit stall
    description_note: 'Equation: 100 * (SUM(TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD))'
    legacy_id: 30.16.0
  - metric: fabric.normalized_ea_hbm_wr_credit_stall
    label: Normalized EA - HBM write credit stall
    description_note: 'Equation: 100 * (SUM(TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD))'
    legacy_id: 30.16.1
  - metric: fabric.normalized_ea_gmi_rd_credit_stall
    label: Normalized EA - GMI read credit stall
    description_note: 'Equation: 100 * (SUM(TCC_EA0_RDREQ_GMI_CREDIT_STALL_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD))'
    legacy_id: 30.16.2
  - metric: fabric.normalized_ea_gmi_wr_credit_stall
    label: Normalized EA - GMI write credit stall
    description_note: 'Equation: 100 * (SUM(TCC_EA0_WRREQ_GMI_CREDIT_STALL_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD))'
