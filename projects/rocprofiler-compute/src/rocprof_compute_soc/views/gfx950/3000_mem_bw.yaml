  - metric: fabric.normalized_ea_to_hbm_rd_req
    label: Normalized EA to HBM read requests
    description_note: 'Equation: SUM(TCC_EA0_RDREQ_DRAM_sum) / (SUM(End_Timestamp - Start_Timestamp)
      / 1000000000)'
    legacy_id: 30.17.0
  - metric: fabric.normalized_ea_to_hbm_wr_req
    label: Normalized EA to HBM write requests
    description_note: 'Equation: SUM(TCC_EA0_WRREQ_WRITE_DRAM_sum) / (SUM(End_Timestamp -
      Start_Timestamp) / 1000000000)'
