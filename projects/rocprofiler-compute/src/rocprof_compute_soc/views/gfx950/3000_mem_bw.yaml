- id: 3007
  title: L2 Cache
  header:
    metric: Metric
    value: Avg
    unit: Unit
  metrics:
  - metric: l2.hit_rate
    label: L2 hit rate
    description: 'The ratio of L2 cache hits over total cache accesses (hits + misses). A
      low hit rate (<= 50%) indicates the workload exceeds L2 cache capacity. Equation: 100
      * (SUM(TCC_HIT_sum) / SUM(TCC_HIT_sum + TCC_MISS_sum))'
  - metric: l2.util
    label: L2 utilization
    display: l2_util_whole_channels
    description: 'The ratio of active L2 cycles over total available L2 cycles across all
      channels. High utilization indicates the L2 cache is heavily loaded. Equation: 100 *
      (SUM(TCC_BUSY_sum) / SUM(TO_INT($total_l2_chan) * $GRBM_GUI_ACTIVE_PER_XCD))'
  - metric: l2.tag_stall_rate
    label: L2 tag stall rate
    description_note: 'Equation: 100 * (SUM(TCC_TAG_STALL_sum) / SUM(TCC_BUSY_sum))'
    legacy_id: 30.7.2
  - metric: l2.input_buffer_stall_rate
    label: L2 input buffer stall rate
    description_note: 'Equation: 100 * (SUM(TCC_IB_STALL_sum) / SUM(TCC_BUSY_sum))'
    legacy_id: 30.7.3
  - metric: l2.lat_fifo_full_rate
    label: L2 latency FIFO full rate
    description_note: 'Equation: 100 * (SUM(TCC_LATENCY_FIFO_FULL_sum) / SUM(TCC_BUSY_sum))'
    legacy_id: 30.7.4
  - metric: l2.wr_data_fifo_full_rate
    label: L2 write data FIFO full rate
    description_note: 'Equation: 100 * (SUM(TCC_SRC_FIFO_FULL_sum) / SUM(TCC_BUSY_sum))'
    legacy_id: 30.7.5
  - metric: fabric.wr_stall
    label: L2 to EA write stall rate
    description: 'The percentage of active L2 cycles where write requests to the EA interface
      were stalled. A high rate (>= 10%) indicates the EA write path is saturated. Equation:
      100 * (SUM(TCC_EA0_WRREQ_STALL_sum) / SUM(TCC_BUSY_sum))'
  - metric: fabric.wr_credit_starvation
    label: L2 to EA too many writes stall
    description: 'The percentage of active L2 cycles where L2 could not send a write request
      to EA because the maximum number of pending EA write requests was reached. High values
      indicate write credit starvation at the L2-to-memory interface. Equation: 100 * (SUM(TCC_TOO_MANY_EA_WRREQS_STALL_sum)
      / SUM(TCC_BUSY_sum))'
  - metric: fabric.rd_hbm_stall
    label: L2 to EA read credit stall (HBM)
    description: 'The percentage of active L2 cycles where read requests were stalled due
      to HBM credit exhaustion. High values indicate HBM read bandwidth is saturated. Equation:
      100 * (SUM(TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum))'
  - metric: fabric.wr_hbm_stall
    label: L2 to EA write credit stall (HBM)
    description: 'The percentage of active L2 cycles where write requests were stalled due
      to HBM credit exhaustion. High values indicate HBM write bandwidth is saturated. Equation:
      100 * (SUM(TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum))'
  - metric: fabric.rd_infinity_fabric_stall
    label: L2 to EA read credit stall (GMI)
    description: 'The percentage of active L2 cycles where read requests were stalled due
      to GMI credit exhaustion. High values indicate remote read bandwidth is saturated. Equation:
      100 * (SUM(TCC_EA0_RDREQ_GMI_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum))'
  - metric: fabric.wr_infinity_fabric_stall
    label: L2 to EA write credit stall (GMI)
    description: 'The percentage of active L2 cycles where write requests were stalled due
      to GMI credit exhaustion. High values indicate remote write bandwidth is saturated.
      Equation: 100 * (SUM(TCC_EA0_WRREQ_GMI_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum))'
  - metric: fabric.rd_pcie_stall
    label: L2 to EA read credit stall (IO)
    description: 'The percentage of active L2 cycles where read requests were stalled due
      to IO interface credit exhaustion. High values indicate PCIe/IO read bandwidth is saturated.
      Equation: 100 * (SUM(TCC_EA0_RDREQ_IO_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum))'
  - metric: fabric.wr_pcie_stall
    label: L2 to EA write credit stall (IO)
    description: 'The percentage of active L2 cycles where write requests were stalled due
      to IO interface credit exhaustion. High values indicate PCIe/IO write bandwidth is saturated.
      Equation: 100 * (SUM(TCC_EA0_WRREQ_IO_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum))'
- id: 3008
  title: L2 Traffic
  header:
    metric: Metric
    value: Avg
    unit: Unit
  metrics:
  - metric: l2.rd_req_rate
    label: L2 read request rate
    description_note: 'Equation: SUM(TCC_READ_sum) / SUM(TCC_BUSY_sum)'
    legacy_id: 30.8.0
  - metric: l2.wr_req_rate
    label: L2 write request rate
    description_note: 'Equation: SUM(TCC_WRITE_sum) / SUM(TCC_BUSY_sum)'
    legacy_id: 30.8.1
  - metric: l2.total_req_rate
    label: L2 total request rate
    description_note: 'Equation: SUM(TCC_REQ_sum) / SUM(TCC_BUSY_sum)'
    legacy_id: 30.8.2
  - metric: fabric.rd_lat
    label: L2 to EA read average latency
    unit: Cycles per Request
    description: 'The average number of cycles an EA read request was in flight, from the
      L2 side. Weighted average across all L2 channels (SUM/SUM gives more weight to channels
      with more requests). Equation: SUM(TCC_EA0_RDREQ_LEVEL_sum) / SUM(TCC_EA0_RDREQ_sum)'
  - metric: fabric.rd_lat
    label: L2 to EA read latency
    unit: Cycles per Request
    display: avg_fabric_rd_lat
    description: 'The number of cycles an EA read request was in flight, from the L2 side.
      Ratio of averages across L2 channels (AVG/AVG gives equal weight to each channel). Equation:
      AVG(TCC_EA0_RDREQ_LEVEL_sum) / AVG(TCC_EA0_RDREQ_sum)'
  - metric: fabric.wr_lat
    label: L2 to EA write average latency
    unit: Cycles per Request
    description: 'The average number of cycles an EA write request was in flight, from the
      L2 side. Weighted average across all L2 channels (SUM/SUM gives more weight to channels
      with more requests). Equation: SUM(TCC_EA0_WRREQ_LEVEL_sum) / SUM(TCC_EA0_WRREQ_sum)'
  - metric: fabric.wr_lat
    label: L2 to EA write latency
    unit: Cycles per Request
    display: avg_fabric_wr_lat
    description: 'The number of cycles an EA write request was in flight, from the L2 side.
      Ratio of averages across L2 channels (AVG/AVG gives equal weight to each channel). Equation:
      AVG(TCC_EA0_WRREQ_LEVEL_sum) / AVG(TCC_EA0_WRREQ_sum)'
  - metric: fabric.atomic_lat
    label: L2 to EA atomic average latency
    unit: Cycles per Request
    description: 'The average number of cycles an EA atomic request was in flight, from the
      L2 side. Weighted average across all L2 channels (SUM/SUM gives more weight to channels
      with more requests). Equation: SUM(TCC_EA0_ATOMIC_LEVEL_sum) / SUM(TCC_EA0_ATOMIC_sum)'
  - metric: fabric.atomic_lat
    label: L2 to EA atomic latency
    unit: Cycles per Request
    display: avg_fabric_atomic_lat
    description: 'The number of cycles an EA atomic request was in flight, from the L2 side.
      Ratio of averages across L2 channels (AVG/AVG gives equal weight to each channel). Equation:
      AVG(TCC_EA0_ATOMIC_LEVEL_sum) / AVG(TCC_EA0_ATOMIC_sum)'
  - metric: l2.writeback_rate
    label: L2 writeback rate
    description_note: 'Equation: 100 * (SUM(TCC_WRITEBACK_sum) / SUM(TCC_REQ_sum))'
    legacy_id: 30.8.9
  - metric: l2.eviction_rate
    label: L2 eviction rate
    description_note: 'Equation: 100 * (SUM(TCC_NORMAL_EVICT_sum) / SUM(TCC_REQ_sum))'
    legacy_id: 30.8.10
  - metric: fabric.rd_bw
    label: L2 to EA read BW
    description: 'The read bandwidth from L2 to the EA interface, calculated from the mix
      of 32B, 64B, and 128B read request sizes. Equation: ((SUM((TCC_EA0_RDREQ_32B_sum * 32)
      + (TCC_EA0_RDREQ_64B_sum * 64) + (TCC_EA0_RDREQ_128B_sum * 128))) / (SUM(End_Timestamp
      - Start_Timestamp)))'
  - metric: fabric.to_ea_wr_atomic_bw
    label: L2 to EA write and atomic BW
    description_note: 'Equation: ((SUM((TCC_EA0_WRREQ_64B_sum * 64) + ((TCC_EA0_WRREQ_sum
      - TCC_EA0_WRREQ_64B_sum) * 32))) / (SUM(End_Timestamp - Start_Timestamp)))'
    legacy_id: 30.8.12
  - metric: fabric.hbm_rd_traffic
    label: HBM read fraction
    description: 'The percentage of L2 to EA read requests destined for the accelerator''s
      local HBM. Equation: 100 * (SUM(TCC_EA0_RDREQ_DRAM_sum) / SUM(TCC_EA0_RDREQ_sum))'
  - metric: fabric.hbm_wr_atomic_traffic
    label: HBM write fraction
    description: 'The percentage of L2 to EA write requests destined for the accelerator''s
      local HBM. Equation: 100 * (SUM(TCC_EA0_WRREQ_DRAM_sum) / SUM(TCC_EA0_WRREQ_sum))'
  - metric: l2.non_coherent_req_rate
    label: Non-coherent request rate
    description_note: 'Equation: 100 * (SUM(TCC_NC_REQ_sum) / SUM(TCC_REQ_sum))'
    legacy_id: 30.8.15
  - metric: l2.uncached_req_rate
    label: Uncached request rate
    description_note: 'Equation: 100 * (SUM(TCC_UC_REQ_sum) / SUM(TCC_REQ_sum))'
    legacy_id: 30.8.16
  - metric: l2.coherent_cached_req_rate
    label: Coherent cached request rate
    description_note: 'Equation: 100 * (SUM(TCC_CC_REQ_sum) / SUM(TCC_REQ_sum))'
    legacy_id: 30.8.17
  - metric: l2.probe_req_rate
    label: Probe request rate
    description_note: 'Equation: SUM(TCC_PROBE_sum) / SUM(TCC_BUSY_sum)'
    legacy_id: 30.8.18
  - metric: l2.probe_eviction_rate
    label: Probe eviction rate
    description_note: 'Equation: 100 * (SUM(TCC_PROBE_EVICT_sum) / SUM(TCC_PROBE_sum))'
    legacy_id: 30.8.19
