view: Efficiency Arbiter (EA)
legacy_panel_id: 1400
alias: ea
tables:
- id: 1401
  title: EA Utilization
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: ea.util
    label: Utilization
    description: Percentage of cycles EA is busy processing memory requests.
- id: 1402
  title: EA Traffic Bandwidth
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: ea.dram_rd_bw
  - metric: ea.dram_wr_bw
  - metric: ea.io_bw_rd
    description: PCI-E and other IO read bandwidth from host CPU memory (pinned or mapped)
      through the EA.
  - metric: ea.io_bw_wr
    description: PCI-E and other IO write bandwidth to host CPU memory through the EA.
  - metric: ea.hdm_bw_rd
    description: Host Data Memory (unified memory pages) read bandwidth through the EA.
  - metric: ea.hdm_bw_wr
    description: Host Data Memory (unified memory pages) write bandwidth through the EA.
  - metric: ea.gmi_bw_rd
    description: GMI read bandwidth from peer GPU HBM via Infinity Fabric.
  - metric: ea.gmi_bw_wr
    description: GMI write bandwidth to peer GPU HBM via Infinity Fabric.
