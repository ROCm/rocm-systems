    round: 0
  - metric: l1i.icache_util
    round: 0
  - metric: l1i.hits_per_req
    round: 0
  - metric: l1i.icache_lat
    round: 0
  - metric: l1i.icache_req_stall_rate
    round: 0
  - metric: l1i.gl1_rd_bw
  - metric: l1i.icache_gl1_req_lat
    round: 0
- title: Scalar Data Cache
  header:
    metric: Metric
    value: Value
    unit: Unit
  metrics:
  - metric: sl1d.req
    round: 0
  - metric: sl1d.dcache_util
    round: 0
  - metric: sl1d.hits_per_req
    round: 0
  - metric: sl1d.dcache_lat
    round: 0
  - metric: sl1d.dcache_req_stall_rate
    round: 0
  - metric: sl1d.load_bw
  - metric: sl1d.gl1_rd_bw
