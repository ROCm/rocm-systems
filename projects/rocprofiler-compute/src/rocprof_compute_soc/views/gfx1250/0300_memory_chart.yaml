    round: 0
  - metric: txa.tdm_async_store_req
    round: 0
- title: GL0-GL1 Interface
  header:
    metric: Metric
    value: Value
    unit: Unit
  metrics:
  - metric: gl0.gl1_rd_bw
  - metric: gl0.gl1_wr_bw
