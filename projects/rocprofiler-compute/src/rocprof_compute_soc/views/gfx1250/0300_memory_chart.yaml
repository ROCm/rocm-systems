  - metric: gl2.ea_hbm_bw_wr
  - metric: gl2.ea_hbm_bw_atomic
- title: EA to HBM
  header:
    metric: Metric
    value: Value
    unit: Unit
  metrics:
  - metric: ea.util
    round: 0
  - metric: ea.dram_rd_bw
  - metric: ea.dram_wr_bw
  - metric: ea.io_bw_rd
  - metric: ea.io_bw_wr
  - metric: ea.hdm_bw_rd
  - metric: ea.hdm_bw_wr
