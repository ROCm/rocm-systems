    round: 0
  - metric: gl1.util
    label: GL1C Utilization
    round: 0
  - metric: gl1.gl1c_buffer_full_stall
    round: 0
- title: GLARB (GL1-GL2 Arbiter)
  header:
    metric: Metric
    value: Value
    unit: Unit
  metrics:
  - metric: glarb.glarba_util
    round: 0
  - metric: glarb.glarbc_util
    round: 0
  - metric: glarb.glarbc_buffer_full_stall
    round: 0
