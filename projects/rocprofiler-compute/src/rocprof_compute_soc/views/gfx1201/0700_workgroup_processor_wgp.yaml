    pct_of_peak: false
  - metric: compute.valu_inst_cycles
    round: 0
    pct_of_peak: false
- title: WMMA Instruction FLOPs and IOPs Counting
  header:
    metric: Metric
    value: Avg
    unit: Unit
  metrics:
  - metric: compute.wmma_insts
    round: 0
    pct_of_peak: false
  - metric: compute.wmma_inst_cycles
    round: 0
    pct_of_peak: false
- title: Instruction Cache
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
