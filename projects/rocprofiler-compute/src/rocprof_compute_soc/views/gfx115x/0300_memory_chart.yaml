view: Memory Chart
legacy_panel_id: 300
alias: memchart
tables:
- id: 301
  title: Instruction Cache
  cli_style: mem_chart
  header:
    metric: Metric
    value: Value
    unit: Unit
  metrics:
  - metric: l1i.req
    label: ICache Requests
    description: null
    legacy_id: 3.1.0
  - metric: l1i.hit_rate_excl_dup
    label: ICache Hit Rate
    description: Percentage of instruction cache accesses that are serviced from cache without
      fetching from the GL1 cache. High hit rates indicate good instruction locality. Low
      hit rates may indicate large kernels exceeding instruction cache capacity or divergent
      branches.
    legacy_id: 3.1.1
  - metric: l1i.gl1_rd_bw
    label: ICache-GL1 Read Bandwidth
    unit: Bytes/s
    description: null
    legacy_id: 3.1.2
- id: 302
  title: Scalar Data Cache
  cli_style: mem_chart
  header:
    metric: Metric
    value: Value
    unit: Unit
  metrics:
  - metric: sl1d.req
    label: DCache Requests
    description: null
    legacy_id: 3.2.0
  - metric: sl1d.hit_rate_excl_dup
    label: DCache Hit Rate
    description: Percentage of scalar data cache accesses that hit in cache. High hit rates
      indicate efficient reuse of constant and uniform data. Low hit rates may indicate excessive
      unique constant data or poor temporal locality.
    legacy_id: 3.2.1
  - metric: sl1d.gl1_rd_bw
    label: DCache-GL1 Read Bandwidth
    unit: Bytes/s
    description: null
    legacy_id: 3.2.2
- id: 303
  title: TCP Cache (GL0 Vector Cache)
  cli_style: mem_chart
  header:
    metric: Metric
    value: Value
    unit: Unit
  metrics:
  - metric: gl0.rd_req
    label: TCP Read Requests
    description: null
    legacy_id: 3.3.0
  - metric: gl0.wr_req
    label: TCP Write Requests
    description: null
    legacy_id: 3.3.1
  - metric: gl0.hit_rate
    label: GL0 Cache Hit Rate (TCP Cache)
    description: Percentage of GL0 vector cache (TCP Cache) requests serviced from cache.
      TCP Cache is the first-level cache for vector memory operations. Higher hit rates reduce
      traffic to the GL1 cache and lower memory access latency for vector operations.
    legacy_id: 3.3.2
  - metric: gl0.bw
    label: GL0 Cache BW (TCP Cache)
    unit: Bytes/s
    description: null
    legacy_id: 3.3.3
- id: 304
  title: LDS (Local Data Share)
  cli_style: mem_chart
  header:
    metric: Metric
    value: Value
    unit: Unit
  metrics:
  - metric: compute.insts_lds
    label: LDS Req
    unit: (Requests + $normUnit)
    legacy_id: 3.4.0
  - metric: lds.util
    description: Percentage of the LDS cycle budget across all CUs spent servicing indexed
      (non-direct, non-interpolation) accesses, measured over GPU-active cycles. Because two
      CUs share a workgroup processor's LDS, a saturated LDS reads well below 100% on this
      architecture.
    legacy_id: 3.4.1
  - metric: lds.bank_conflict_rate
    legacy_id: 3.4.2
  - metric: lds.estimated_bw
    unit: Bytes/s
    legacy_id: 3.4.3
- id: 305
  title: TCP-GL1 Interface
  cli_style: mem_chart
  header:
    metric: Metric
    value: Value
    unit: Unit
  metrics:
  - metric: gl0.gl1_rd_bw
    label: TCP-GL1 Read Bandwidth
    unit: Bytes/s
    description: null
    legacy_id: 3.5.0
  - metric: gl0.gl1_wr_bw
    label: TCP-GL1 Write Bandwidth
    unit: Bytes/s
    description: null
