- id: 308
  title: GL2 Cache (L2)
  cli_style: mem_chart
  header:
    metric: Metric
    value: Value
    unit: Unit
  metrics:
  - metric: gl2.util
    description: null
    legacy_id: 3.8.0
  - metric: gl2.hit_rate
    description: Percentage of L2 cache requests that hit in cache. GL2 cache is the GPU's
      final on-chip cache before accessing system memory via GCEA. High hit rates reduce memory
      bandwidth pressure. Low hit rates cause traffic to system memory, increasing latency.
    legacy_id: 3.8.1
  - metric: gl2.fabric_rd_bw
    label: GL2-Fabric Read BW
    unit: Bytes/s
    description: null
    legacy_id: 3.8.2
  - metric: gl2.fabric_wr_bw
    label: GL2-Fabric Write BW
    unit: Bytes/s
    description: null
    legacy_id: 3.8.3
