- id: 306
  title: GL1 Cache (L1)
  cli_style: mem_chart
  header:
    metric: Metric
    value: Value
    unit: Unit
  metrics:
  - metric: gl1.util
    legacy_id: 3.6.0
  - metric: gl1.hit_rate
    label: GL1 Cache Hit Rate
    description: Percentage of L1 cache requests that hit in cache. Higher hit rates reduce
      traffic to the L2 cache and improve memory access latency. Low hit rates may indicate
      poor data locality or working sets exceeding L1 capacity.
    legacy_id: 3.6.1
  - metric: gl1.stall_gl2_backpressure
    description: null
    legacy_id: 3.6.2
- id: 307
  title: GL1-GL2 Interface
  cli_style: mem_chart
