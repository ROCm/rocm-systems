    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: gl0.ta_req_stall
    label: TA Req Stall
    legacy_id: 9.5.0
  - metric: gl0.gl1_back_pressure
    legacy_id: 9.5.1
  - metric: gl0.data_fifo_stall
    label: Data FIFO Stall
    legacy_id: 9.5.2
