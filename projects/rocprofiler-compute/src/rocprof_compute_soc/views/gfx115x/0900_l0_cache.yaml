view: GL0 Cache (TCP Cache)
legacy_panel_id: 900
alias: gl0
tables:
- id: 901
  title: GL0 Utilization
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: gl0.busy
    legacy_id: 9.1.0
- id: 902
  title: GL0 Request Statistics
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: gl0.total_req
    label: Total Requests
    unit: (Count + $normUnit)
    legacy_id: 9.2.0
  - metric: gl0.rd_req
    label: Read Requests
    unit: (Count + $normUnit)
    description: Number of read requests to the GL0 vector cache. High read counts indicate
      memory-intensive load operations. Compare with hit rate to assess cache effectiveness
      for read traffic.
  - metric: gl0.wr_req
    label: Write Requests
    unit: (Count + $normUnit)
    description: Number of write requests to the GL0 vector cache. Write traffic may include
      global memory stores and cache writebacks. High write counts indicate write-intensive
      workloads.
  - metric: gl0.miss_req
    label: Miss Requests
    legacy_id: 9.2.3
- id: 903
  title: GL0 Cache Performance
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: gl0.hit_rate
    label: Hit Rate
    description: Percentage of GL0 cache requests serviced from cache without accessing GL1
      cache. Higher hit rates indicate better data locality and lower memory access latency.
      Low hit rates may indicate working sets exceeding GL0 capacity or poor access patterns.
- id: 904
  title: GL0-GL1 Interface
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: gl0.gl1_rd_req
    label: GL1 Read Requests
    unit: (Count + $normUnit)
    legacy_id: 9.4.0
  - metric: gl0.gl1_rd_128b_req
    legacy_id: 9.4.1
  - metric: gl0.gl1_wr_req
    label: GL1 Write Requests
    unit: (Count + $normUnit)
    legacy_id: 9.4.2
- id: 905
  title: GL0 Stalls
  header:
