    max: Max
    unit: Unit
  metrics:
  - metric: gl1.gl2_rd_req
    label: GL2 Read Requests
    unit: (Count + $normUnit)
    legacy_id: 11.4.0
  - metric: gl1.gl2_rd_128b_req
    unit: (Count + $normUnit)
    legacy_id: 11.4.1
  - metric: gl1.gl2_wr_req
    label: GL2 Write Requests
    unit: (Count + $normUnit)
    legacy_id: 11.4.2
- id: 1105
  title: GL1 Cache Stalls
