    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: wave.wait_for_any
    description: Percentage of wavefront lifetime spent waiting for any reason. High wait
      percentages indicate opportunities to improve performance through better memory access
      patterns, reduced synchronization, or increased occupancy.
  - metric: wave.wait_for_inst_fetch
