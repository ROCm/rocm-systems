- id: 710
  title: Instruction Cache
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: l1i.hit_rate_excl_dup
    label: Icache Hit Rate
    description: Percentage of instruction cache accesses that hit. High hit rates are essential
      for sustained instruction throughput. Low rates may indicate large kernels or divergent
      branches causing instruction cache thrashing.
- id: 711
  title: Scalar Data Cache
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - metric: sl1d.hit_rate_excl_dup
    label: DCache Hit Rate
    description: Percentage of scalar data cache accesses that hit. High hit rates indicate
      efficient reuse of constant and uniform data. Low rates may suggest excessive unique
      constant data or poor temporal locality.
