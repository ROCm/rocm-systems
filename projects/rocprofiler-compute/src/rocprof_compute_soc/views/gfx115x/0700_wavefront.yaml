  title: Utilization
  header:
    metric: Metric
    avg: Avg
    min: Min
    max: Max
    unit: Unit
  metrics:
  - label: WGP Utilization
    unit: Percent
    description: Percentage of GPU active cycles where the Workgroup Processor is busy executing
      wavefronts. RDNA 3.5 WGPs contain two compute units, each with dual SIMD32 units. Low
      utilization may indicate insufficient parallelism or resource bottlenecks.
