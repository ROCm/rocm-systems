fabric.to_ea_wr_atomic_bw:
  name: L2 to EA write and atomic BW
  formula: SUM(TCC_EA0_WRREQ_64B_sum * 64 + NOISE_CLAMP(TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum, TCC_EA0_WRREQ_sum) * 32) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: The write and atomic bandwidth from L2 to the EA interface.
fabric.to_memory_traffic_ratio:
  name: L2 to Memory Traffic Ratio
  formula: 100 * SUM(TCC_EA0_RDREQ_sum + TCC_EA0_WRREQ_sum) / SUM(TCC_REQ_sum)
  unit: Percent
  description: >-
    Percentage of L2 requests that result in L2 to memory through EA traffic. High
    ratio (>50%) indicates most L2 requests go to memory (poor cache locality). Low
    ratio suggests good cache hit rate and workload fits in L2.
fabric.wr_hbm_stall:
  name: Write - HBM Stall
  formula: 100 * SUM(TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum)
  unit: Percent
  description: >-
    The number of cycles the L2-Fabric interface was stalled on write or atomic requests
    to accelerator's local HBM as a percent of the total active L2 cycles.
fabric.wr_infinity_fabric_stall:
  name: Write - Infinity Fabric Stall
  formula: 100 * SUM(TCC_EA0_WRREQ_GMI_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum)
  unit: Percent
  description: >-
    The number of cycles the L2-Fabric interface was stalled on write or atomic requests
    to remote Infinity Fabric connected accelerators or CPUs as a percent of the total
    active L2 cycles.
fabric.wr_pcie_stall:
  name: Write - PCIe Stall
  formula: 100 * SUM(TCC_EA0_WRREQ_IO_CREDIT_STALL_sum) / SUM(TCC_BUSY_sum)
  unit: Percent
  description: >-
    The number of cycles the L2-Fabric interface was stalled on write or atomic requests
    to remote PCIe connected accelerators or CPUs as a percent of the total active
    L2 cycles.
fabric.wr_stall:
  name: Write Stall
  formula: 100 * SUM(TCC_EA0_WRREQ_STALL_sum) / SUM(TCC_BUSY_sum)
  unit: Percent
  description: >-
    The ratio of the total number of cycles the L2-Fabric interface was stalled on
    a write or atomic request to any destination (local HBM, remote accelerator or
    CPU, PCIe connected accelerator or CPU, or remote Infinity Fabric connected accelerator
    or CPU) over the total active L2 cycles.
fabric.xgmi_atomic_bw:
  name: Atomic Bandwidth - Infinity Fabric
  formula: 32 * SUM(TCC_EA0_WRREQ_ATOMIC_GMI_32B_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    Total number of bytes due to L2 atomic requests routed to Infinity Fabric (xGMI
    peer GPU traffic), divided by total duration.
fabric.xgmi_rd_bw:
  name: Read Bandwidth - Infinity Fabric
  formula: 32 * SUM(TCC_EA0_RDREQ_GMI_32B_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    Total number of bytes due to L2 read requests routed to Infinity Fabric (xGMI
    peer GPU traffic), divided by total duration.
fabric.xgmi_wr_bw:
  name: Write Bandwidth - Infinity Fabric
  formula: 32 * SUM(TCC_EA0_WRREQ_WRITE_GMI_32B_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
