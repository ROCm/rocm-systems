inherit: ../gfx942/compute.yaml
compute.dual_issue_valu_util:
  name: Dual-Issue VALU Utilization
  formula: 100 * SUM(SQ_ACTIVE_INST_VALU2) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  description: >-
    Indicates what percent of the kernel's duration the VALU was busy executing dual-issued
    instructions. Computed as the ratio of the total number of cycles spent by the
    scheduler co-issuing VALU instructions over the total CU cycles.
compute.f6f4_ops:
  name: F6F4 OPs
  formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F6F4) / SUM($denom)
  unit: (FLOPs + $normUnit)
  description: >-
    The total number of 4-bit and 6-bit floating-point operations executed on MFMA
    units, per normalization unit. F6/F4 formats are supported in AMD Instinct MI350
    series (gfx950) and later only.
compute.f8_ops:
  description: >-
    The total number of 8-bit floating-point operations executed on MFMA units, per
    normalization unit. F8 (FP8) uses either E4M3 or E5M2 format.
compute.flops_per_norm:
  formula: SUM(64 * (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + SQ_INSTS_VALU_TRANS_F16 + SQ_INSTS_VALU_FMA_F16 * 2) + 512 * SQ_INSTS_VALU_MFMA_MOPS_F8 + 512 * SQ_INSTS_VALU_MFMA_MOPS_F16 + 512 * SQ_INSTS_VALU_MFMA_MOPS_BF16 + 64 * (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + SQ_INSTS_VALU_TRANS_F32 + SQ_INSTS_VALU_FMA_F32 * 2) + 512 * SQ_INSTS_VALU_MFMA_MOPS_F32 + 64 * (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + SQ_INSTS_VALU_TRANS_F64 + SQ_INSTS_VALU_FMA_F64 * 2) + 512 * SQ_INSTS_VALU_MFMA_MOPS_F64 + 512 * SQ_INSTS_VALU_MFMA_MOPS_F6F4) / SUM($denom)
compute.inst_mix_mfma_f6f4:
  name: MFMA-F6F4 Instructions
  formula: SUM(SQ_INSTS_VALU_MFMA_F6F4) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of 4-bit and 6-bit floating point MFMA instructions issued per
    normalization unit. This is supported in AMD Instinct MI350 series (gfx950) and
    later only.
compute.l1_cache_vmem_stalled_by_l1_cache:
  name: L1 Cache - VMEM Stalled by L1 Cache
  formula: 100 * SUM(SQ_VMEM_TA_CMD_FIFO_FULL) / SUM(SQ_BUSY_CYCLES)
  unit: Percent
  description: >-
    Measures backpressure from TCP to SQ. A high stall rate (>= 10%) indicates that
    TCP stall is backpressured to SQ.
compute.mfma_flops_bf16:
  peak: $max_sclk * $cu_per_gpu * 4096 / 1000
compute.mfma_flops_f16:
  peak: $max_sclk * $cu_per_gpu * 4096 / 1000
compute.mfma_flops_f64:
  peak: $max_sclk * $cu_per_gpu * 128 / 1000
compute.mfma_flops_f6f4:
  name: MFMA FLOPs (F6F4)
  formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F6F4) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
  description: ''
  peak: $max_sclk * $cu_per_gpu * 16834 / 1000
  peak_empirical: $MFMAF6F4Flops_empirical_peak
compute.mfma_flops_f8:
  description: >-
    The total number of 8-bit floating point MFMA operations executed per second.
  peak: $max_sclk * $cu_per_gpu * 8192 / 1000
compute.mfma_flops_mxf8:
  name: MFMA FLOPs (MXF8)
  formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F8) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
  description: >-
    The total number of 8-bit microscaling floating point MFMA operations executed
    per second.
  peak: $max_sclk * $cu_per_gpu * 8192 / 1000
  peak_empirical: $MFMAMXF8Flops_empirical_peak
compute.mfma_iops_int8:
  peak: $max_sclk * $cu_per_gpu * 8192 / 1000
compute.normalized_l1_cache_vmem_stalled_by_l1_cache:
  name: Normalized L1 Cache - VMEM Stalled by L1 Cache
  formula: 100 * SUM(SQ_VMEM_TA_CMD_FIFO_FULL) / (SUM($GRBM_GUI_ACTIVE_PER_XCD) * $cu_per_gpu)
  unit: Percent
  description: >-
    Percentage of GPU active time that SQ could not dispatch VMEM instructions because
    the L1 Cache (TCP) command FIFO was full. Averaged across all CUs. High values
    mean L1 cache cannot keep up with memory instruction demand.
compute.num_cus:
  name: Number of CUs
  formula: $cu_per_gpu
  unit: Count
  description: ''
compute.sq_busy_cycles:
  name: SQ_BUSY_CYCLES
  formula: SUM(SQ_BUSY_CYCLES) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: ''
compute.sq_wave_cycles:
  name: SQ_WAVE_CYCLES
  formula: SUM(SQ_WAVE_CYCLES) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: ''
compute.total_flops:
  formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + 2 * SQ_INSTS_VALU_FMA_F16 + SQ_INSTS_VALU_TRANS_F16 + SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + 2 * SQ_INSTS_VALU_FMA_F32 + SQ_INSTS_VALU_TRANS_F32 + SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + 2 * SQ_INSTS_VALU_FMA_F64 + SQ_INSTS_VALU_TRANS_F64) + SQ_INSTS_VALU_MFMA_MOPS_F16 * 512 + SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512 + SQ_INSTS_VALU_MFMA_MOPS_F32 * 512 + SQ_INSTS_VALU_MFMA_MOPS_F64 * 512 + SQ_INSTS_VALU_MFMA_MOPS_F8 * 512 + SQ_INSTS_VALU_MFMA_MOPS_F6F4 * 512) / (SUM(End_Timestamp - Start_Timestamp) / 1e9) / 1e9
compute.valu_co_issue_efficiency:
  name: VALU Co-Issue Efficiency
  formula: 100 * SUM(SQ_ACTIVE_INST_VALU2) / SUM(SQ_ACTIVE_INST_VALU - SQ_ACTIVE_INST_VALU2)
  unit: Percent
  description: >-
    The ratio of quad-cycles where two VALU instructions were co-issued (executed
    simultaneously) to quad-cycles where only a single VALU instruction was issued.
    Measures how efficiently the kernel leverages the MI350's ability to co-issue
    VALU instructions. Unlike Dual-issue VALU Utilization which measures percentage
    of total time, this metric can exceed 100% when dual-issue cycles outnumber single-issue
    cycles.
compute.vmem_issue_rate:
  name: VMEM Issue Rate
  formula: SUM(SQ_INSTS_VMEM) / SUM(SQ_WAVE_CYCLES)
  unit: Instructions per Cycle
  description: >-
    The number of VMEM instructions issued by the SQ (CU) per wave cycle.
compute.vmem_ta_addr_stall:
  description: ''
compute.vmem_ta_cmd_stall:
  description: ''
compute.vmem_ta_data_stall:
  description: ''
