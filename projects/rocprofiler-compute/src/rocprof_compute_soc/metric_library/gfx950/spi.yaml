inherit: ../gfx908/spi.yaml
spi.dispatched_wavefronts:
  formula: AVG(SPI_CS0_WAVE + SPI_CS1_WAVE + SPI_CS2_WAVE + SPI_CS3_WAVE)
spi.dispatched_workgroups:
  formula: AVG(SPI_CS0_NUM_THREADGROUPS + SPI_CS1_NUM_THREADGROUPS + SPI_CS2_NUM_THREADGROUPS + SPI_CS3_NUM_THREADGROUPS)
spi.schedule_pipe_wave_occupancy:
  name: Schedule-Pipe Wave Occupancy
  formula: AVG(SPI_CSQ_P0_OCCUPANCY + SPI_CSQ_P1_OCCUPANCY + SPI_CSQ_P2_OCCUPANCY + SPI_CSQ_P3_OCCUPANCY)
  unit: Wavefronts
  description: >-
    Total number of waves occupying all scheduler-pipe queues. The SPI has 4 scheduler-pipes,
    each with 8 hardware queues.
spi.scheduler_pipe_fifo_full_rate:
  name: Scheduler-Pipe FIFO Full Rate
  formula: 100 * SUM(SPI_CS0_CRAWLER_STALL + SPI_CS1_CRAWLER_STALL + SPI_CS2_CRAWLER_STALL + SPI_CS3_CRAWLER_STALL) / SUM($GRBM_SPI_BUSY_PER_XCD * $se_per_gpu)
  unit: Percent
  description: >-
    Percent of workgroup manager busy cycles where the event/wave order FIFO was full.
    High values indicate backpressure in the scheduler-pipe dispatch ordering logic.
spi.scheduler_pipe_util:
  formula: 100 * SUM(SPI_CS0_BUSY + SPI_CS1_BUSY + SPI_CS2_BUSY + SPI_CS3_BUSY) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $pipes_per_gpu * $se_per_gpu)
spi.scheduler_pipe_wave_util:
  name: Scheduler-Pipe Wave Utilization
  formula: 100 * SUM(SPI_CSC_WAVE_CNT_BUSY) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $pipes_per_gpu * $se_per_gpu)
  unit: Percent
  description: >-
    Percent of total scheduler-pipe cycles when waves are actively resident in the
    scheduler-pipe structures. This measures wave presence in the pipes before dispatch
    to compute units.
spi.sgpr_writes:
  formula: SUM(SPI_SWC_CSC_WR) / SUM(SPI_CS0_WAVE + SPI_CS1_WAVE + SPI_CS2_WAVE + SPI_CS3_WAVE)
spi.vgpr_writes:
  formula: SUM(SPI_VWC0_VDATA_VALID_WR + SPI_VWC1_VDATA_VALID_WR) / SUM(SPI_CS0_WAVE + SPI_CS1_WAVE + SPI_CS2_WAVE + SPI_CS3_WAVE)
spi.workgroups_per_cu:
  formula: AVG(SPI_CS0_NUM_THREADGROUPS + SPI_CS1_NUM_THREADGROUPS + SPI_CS2_NUM_THREADGROUPS + SPI_CS3_NUM_THREADGROUPS) / $numActiveCUs
