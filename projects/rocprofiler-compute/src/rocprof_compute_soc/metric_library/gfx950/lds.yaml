lds.ai:
  formula: SUM($valu_f16_flops + $valu_f32_flops + $valu_f64_flops + $mfma_f16_flops + $mfma_bf16_flops + $mfma_f32_flops + $mfma_f64_flops + $mfma_f8_flops + $mfma_f6f4_flops) / SUM($lds_bytes)
lds.atomic:
  name: LDS ATOMIC
  formula: SUM(SQ_INSTS_LDS_ATOMIC) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: The total number of LDS atomic instructions.
lds.atomic_bw:
  name: LDS ATOMIC Bandwidth
  formula: 64 * SUM(SQ_INSTS_LDS_ATOMIC_BANDWIDTH) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second accessed by LDS atomic operations. Only the
    work-items that executed (execution mask) are counted.
lds.command_fifo_full_rate:
  name: LDS Command FIFO Full Rate
  formula: SUM(SQ_LDS_CMD_FIFO_FULL) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    The number of cycles where the LDS command FIFO was full. High values indicate
    backpressure in LDS instruction dispatch, which may stall wavefronts waiting to
    issue LDS operations.
lds.data_fifo_full_rate:
  name: LDS Data FIFO Full Rate
  formula: SUM(SQ_LDS_DATA_FIFO_FULL) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    The number of cycles where the LDS data FIFO was full. High values indicate
    backpressure in LDS data return path, which may stall wavefronts waiting for LDS
    read/atomic results.
lds.load:
  name: LDS LOAD
  formula: SUM(SQ_INSTS_LDS_LOAD) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: The total number of LDS load instructions.
lds.load_bw:
  name: LDS LOAD Bandwidth
  formula: 64 * SUM(SQ_INSTS_LDS_LOAD_BANDWIDTH) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second loaded from the LDS by load operations. Only the
    work-items that executed (execution mask) are counted.
lds.store:
  name: LDS STORE
  formula: SUM(SQ_INSTS_LDS_STORE) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: The total number of LDS store instructions.
lds.store_bw:
  name: LDS STORE Bandwidth
  formula: 64 * SUM(SQ_INSTS_LDS_STORE_BANDWIDTH) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second stored to the LDS by store operations. Only the
    work-items that executed (execution mask) are counted.
