inherit: ../gfx908/ta.yaml
ta.addr_stalled_by_tc_cycles:
  name: TA_ADDR_STALLED_BY_TC_CYCLES
  formula: SUM(TA_ADDR_STALLED_BY_TC_CYCLES_sum) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: ''
ta.addr_stalled_by_td_cycles:
  name: TA_ADDR_STALLED_BY_TD_CYCLES
  formula: SUM(TA_ADDR_STALLED_BY_TD_CYCLES_sum) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: ''
ta.addresser_stalled_cycles:
  name: TA_ADDRESSER_STALLED_CYCLES
  formula: SUM(TA_ADDRESSER_STALLED_CYCLES_sum) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: ''
ta.busy_cycles:
  name: TA_TA_BUSY
  formula: SUM(TA_TA_BUSY_sum) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: ''
ta.data_stalled_by_tc_cycles:
  name: TA_DATA_STALLED_BY_TC_CYCLES
  formula: SUM(TA_DATA_STALLED_BY_TC_CYCLES_sum) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: ''
ta.global_generic_rd_insts_for_lds:
  name: TA Global/Generic Read Instructions for LDS
  formula: SUM(TA_FLAT_READ_LDS_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of global & generic memory read instructions that return data
    directly to LDS, executed on all compute units on the accelerator, per normalization
    unit. These operations bypass the register file and write results directly into
    LDS memory.
ta.l1_cache_ta_addr_stalled_by_tcp:
  name: L1 Cache - TA Address Stalled by TCP
  formula: 100 * SUM(TA_ADDR_STALLED_BY_TC_CYCLES_sum) / SUM(TA_TA_BUSY_sum)
  unit: Percent
  description: >-
    Measures cycles the TA address path is stalled by TCP (L1 cache). A high rate
    indicates TCP backpressure.
ta.l1_cache_ta_addr_stalled_by_td:
  name: L1 Cache - TA Address Stalled by TD
  formula: 100 * SUM(TA_ADDR_STALLED_BY_TD_CYCLES_sum) / SUM(TA_TA_BUSY_sum)
  unit: Percent
  description: >-
    Measures cycles the TA address path is stalled by TD (texture data). A high rate
    indicates TD return path congestion.
ta.l1_cache_ta_addresser_stalled:
  name: L1 Cache - TA Addresser Stalled
  formula: 100 * SUM(TA_ADDRESSER_STALLED_CYCLES_sum) / SUM(TA_TA_BUSY_sum)
  unit: Percent
  description: >-
    Measures total cycles the TA addresser is stalled. High values indicate address
    generation bottlenecks.
ta.l1_cache_ta_coalesce_rate:
  name: L1 Cache - TA Coalesce Rate
  formula: 100 * 4 * SUM(TA_BUFFER_WAVEFRONTS_sum) / SUM(TA_BUFFER_TOTAL_CYCLES_sum)
  unit: Percent
  description: >-
    Measures the TA's capability in coalescing Buffer or Flat addresses. TA can pass
    4 unique addresses per cycle. The optimal rate is 100% (4 cycles per wavefront),
    the worst case rate is 25% (16 cycles per wavefront). A low rate (<= 50%) indicates
    poor address locality.
ta.l1_cache_ta_data_stalled_by_tcp:
  name: L1 Cache - TA Data Stalled by TCP
  formula: 100 * SUM(TA_DATA_STALLED_BY_TC_CYCLES_sum) / SUM(TA_TA_BUSY_sum)
  unit: Percent
  description: >-
    Measures cycles the TA data path is stalled by TCP (L1 cache). A high rate indicates
    TCP write data backpressure.
ta.normalized_l1_cache_ta_addr_stalled_by_tcp:
  name: Normalized L1 Cache - TA Address Stalled by TCP
  formula: 100 * SUM(TA_ADDR_STALLED_BY_TC_CYCLES_sum) / (SUM($GRBM_GUI_ACTIVE_PER_XCD) * $cu_per_gpu)
  unit: Percent
  description: >-
    Percentage of GPU active time that TA could not send addresses to TCP (L1 Cache)
    because TCP was not ready. Averaged across all CUs. High values indicate L1 cache
    congestion backing up into the address path.
ta.normalized_l1_cache_ta_addr_stalled_by_td:
  name: Normalized L1 Cache - TA Address Stalled by TD
  formula: 100 * SUM(TA_ADDR_STALLED_BY_TD_CYCLES_sum) / (SUM($GRBM_GUI_ACTIVE_PER_XCD) * $cu_per_gpu)
  unit: Percent
  description: >-
    Percentage of GPU active time that TA could not process new addresses because
    the TD (texture data) return path was backed up. Averaged across all CUs. High
    values indicate congestion in the data return path.
ta.normalized_l1_cache_ta_addresser_stalled:
  name: Normalized L1 Cache - TA Addresser Stalled
  formula: 100 * SUM(TA_ADDRESSER_STALLED_CYCLES_sum) / (SUM($GRBM_GUI_ACTIVE_PER_XCD) * $cu_per_gpu)
  unit: Percent
  description: >-
    Percentage of GPU active time that TA's address generation logic was stalled for
    any reason. Averaged across all CUs. High values indicate address computation
    bottlenecks in the L1 front-end.
ta.normalized_l1_cache_ta_data_stalled_by_tcp:
  name: Normalized L1 Cache - TA Data Stalled by TCP
  formula: 100 * SUM(TA_DATA_STALLED_BY_TC_CYCLES_sum) / (SUM($GRBM_GUI_ACTIVE_PER_XCD) * $cu_per_gpu)
  unit: Percent
  description: >-
    Percentage of GPU active time that TA could not send write or store data to TCP
    (L1 Cache) because TCP's data path was full. Averaged across all CUs. High values
    indicate L1 cache write-side congestion.
ta.normalized_ta_processing_rate:
  name: Normalized TA Processing Rate
  formula: SUM(TA_TOTAL_WAVEFRONTS_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
  unit: Instructions/s
  description: >-
    Wavefronts processed by TA per second of kernel execution. Normalized to wall-clock
    time for absolute throughput measurement.
ta.processing_rate:
  name: TA Processing Rate
  formula: SUM(TA_TOTAL_WAVEFRONTS_sum) / SUM(TA_TA_BUSY_sum)
  unit: Instructions per Cycle
  description: >-
    The number of wavefronts TA processes per busy cycle. Measures TA throughput efficiency.
ta.spill_coalescable_insts:
  name: TA Spill/Stack Coalescable Instructions
  formula: SUM(TA_BUFFER_COALESCEABLE_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of coalesceable spill/stack memory instructions executed on all
    compute units, per normalization unit. Higher values indicate better memory access
    patterns for private memory operations.
ta.spill_stack_rd_insts_for_lds:
  name: TA Spill/Stack Read Instructions for LDS
  formula: SUM(TA_BUFFER_READ_LDS_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of spill/stack memory read instructions that return data directly
    to LDS, executed on all compute units on the accelerator, per normalization unit.
    These operations bypass the register file and write results directly into LDS
    memory.
