ta.buffer_coalescable_insts:
  name: TA Buffer Coalescable Instructions
  formula: SUM(TA_BUFFER_COALESCEABLE_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of coalesceable buffer instructions processed by the address
    processing unit, counted once per wavefront, per normalization unit. Higher values
    indicate better memory access patterns for buffer memory operations.
ta.buffer_rd_insts_for_lds:
  name: TA Buffer Read Instructions for LDS
  formula: SUM(TA_BUFFER_READ_LDS_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of buffer memory read instructions that return data directly to
    LDS, executed on all compute units on the accelerator, per normalization unit. These
    operations bypass the register file and write results directly into LDS memory.
ta.global_generic_rd_insts_for_lds:
  name: TA Global/Generic Read Instructions for LDS
  formula: SUM(TA_FLAT_READ_LDS_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of global & generic memory read instructions that return data
    directly to LDS, executed on all compute units on the accelerator, per normalization
    unit. These operations bypass the register file and write results directly into
    LDS memory.
