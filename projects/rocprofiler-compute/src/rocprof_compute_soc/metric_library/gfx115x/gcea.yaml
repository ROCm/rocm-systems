gcea.dram_rd_banks_active:
  name: DRAM Read Banks Active
  formula: SUM(GCEA_RDRAM_NUM_BANKS_VLD_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of system memory banks with pending read requests, per normalization unit.
    More active banks enable better memory-level parallelism.
gcea.dram_rd_bw:
  name: DRAM Read Bandwidth
  formula: 32 * SUM(GCEA_RDRAM_SIZE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes read from system memory (DDR5/LPDDR5 on RDNA 3.5 APUs), divided
    by total duration. High read bandwidth indicates memory-intensive read patterns, a
    key sign of memory-bound workloads.
gcea.dram_rd_chained_req:
  name: DRAM Read Chained Requests
  formula: SUM(GCEA_RDRAM_CHAINED_REQ_PER_CLIGRP_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of sequential read request chains to system memory, per normalization unit.
    Chained requests combine multiple sequential accesses for better memory efficiency.
gcea.dram_rd_req:
  name: DRAM Read Requests
  formula: SUM(GCEA_RDRAM_REQ_PER_CLIGRP_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of read requests sent to system memory (DDR5/LPDDR5 on RDNA 3.5 APUs), per
    normalization unit. High read request counts indicate memory-intensive workloads
    that may be bandwidth limited.
gcea.dram_rd_size_32b_increments:
  name: DRAM Read Size (32B Increments)
  formula: SUM(GCEA_RDRAM_SIZE_REQ_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Total volume of read data transferred from system memory, in 32-byte increments, per
    normalization unit. This quantifies memory read bandwidth consumption.
gcea.dram_wr_banks_active:
  name: DRAM Write Banks Active
  formula: SUM(GCEA_WDRAM_NUM_BANKS_VLD_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of system memory banks with pending write requests, per normalization unit.
    More active banks enable better write bandwidth.
gcea.dram_wr_bw:
  name: DRAM Write Bandwidth
  formula: 32 * SUM(GCEA_WDRAM_SIZE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes written to system memory, divided by total duration. High write
    bandwidth indicates write-intensive workloads.
gcea.dram_wr_chained_req:
  name: DRAM Write Chained Requests
  formula: SUM(GCEA_WDRAM_CHAINED_REQ_PER_CLIGRP_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of sequential write request chains to system memory, per normalization unit.
    Chained writes combine sequential stores for better efficiency.
gcea.dram_wr_req:
  name: DRAM Write Requests
  formula: SUM(GCEA_WDRAM_REQ_PER_CLIGRP_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of write requests sent to system memory, per normalization unit. High write
    request counts indicate write-intensive workloads.
gcea.dram_wr_size_32b_increments:
  name: DRAM Write Size (32B Increments)
  formula: SUM(GCEA_WDRAM_SIZE_REQ_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Total volume of write data transferred to system memory, in 32-byte increments, per
    normalization unit. This quantifies memory write bandwidth consumption.
gcea.probe_req:
  name: GCEA Probe Requests
  formula: SUM(GCEA_PRB_REQ_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of cache coherency probe operations, per normalization unit. These occur when
    external agents or system components require cache synchronization.
gcea.rd_returns:
  name: GCEA Read Returns
  formula: SUM(GCEA_RRET_VLD_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of completed read operations returning data from system memory to the GPU
    caches, per normalization unit.
gcea.sarb_busy:
  name: SARB Busy
  formula: 100 * SUM(GCEA_SARB_BUSY) / SUM(GCEA_ALWAYS_COUNT)
  unit: Percent
  description: >-
    Percentage of cycles the System Arbiter is actively processing memory requests. High
    values indicate significant off-chip memory traffic, a key indicator of memory-bound
    behavior.
gcea.sarb_dram_req:
  name: SARB DRAM Requests
  formula: SUM(GCEA_SARB_DRAM_REQ_PER_VC_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of memory requests destined for system memory (DRAM), excluding requests
    serviced by other system components, per normalization unit.
gcea.sarb_stalled:
  name: SARB Stalled
  formula: 100 * SUM(GCEA_SARB_STALLED) / SUM(GCEA_ALWAYS_COUNT)
  unit: Percent
  description: >-
    Percentage of cycles the System Arbiter has requests but cannot make progress
    due to downstream backpressure. High stall rates indicate memory bandwidth saturation
    or system memory contention.
gcea.sarb_starving:
  name: SARB Starving
  formula: 100 * SUM(GCEA_SARB_STARVING) / SUM(GCEA_ALWAYS_COUNT)
  unit: Percent
  description: >-
    Percentage of cycles the System Arbiter has no requests to process. High starvation
    indicates compute-bound workloads or effective caching reducing memory traffic.
gcea.sarb_total_req:
  name: SARB Total Requests
  formula: SUM(GCEA_SARB_REQ_PER_VC_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Total memory requests processed by the System Arbiter, per normalization unit. This
    represents all traffic between the GPU caches and system memory interface, including
    reads, writes, and atomics.
gcea.sysarb_stall_rate:
  name: SysArb Stall Rate
  formula: 100 * SUM(GCEA_SARB_STALLED_sum) / SUM(GCEA_ALWAYS_COUNT_sum)
  unit: Percent
  description: ''
gcea.sysarb_util:
  name: SysArb Utilization
  formula: 100 * SUM(GCEA_SARB_BUSY_sum) / SUM(GCEA_ALWAYS_COUNT_sum)
  unit: Percent
  description: >-
    Percentage of cycles the System Arbiter, which handles traffic between the GPU
    caches and the system memory interface, is actively processing memory requests. High
    utilization indicates significant off-chip memory activity.
gcea.wr_returns:
  name: GCEA Write Returns
  formula: SUM(GCEA_WRET_VLD_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of completed write acknowledgements from system memory, per normalization
    unit.
