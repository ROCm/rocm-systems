gl2.atomic_req:
  name: GL2 Atomic Requests
  formula: SUM(GL2C_ATOMIC_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of atomic memory operations processed by the GL2 cache. Atomics provide
    thread-safe memory access but may serialize at contended addresses. High counts may
    impact performance.
gl2.ea_rd_req_dram:
  name: EA Read Requests (DRAM)
  formula: SUM(GL2C_EA_RDREQ_DRAM_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of GL2 read requests sent through the EA toward system memory.
gl2.ea_wr_req_dram:
  name: EA Write Requests (DRAM)
  formula: SUM(GL2C_EA_WRREQ_DRAM_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of GL2 write requests sent through the EA toward system memory.
gl2.fabric_rd_bw:
  name: GL2-Fabric Read Bandwidth
  formula: SUM(GL2C_EA_RDREQ_32B_sum * 32 + GL2C_EA_RDREQ_64B_sum * 64 + GL2C_EA_RDREQ_96B_sum * 96 + GL2C_EA_RDREQ_128B_sum * 128) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second the GL2 cache reads from the memory fabric or system
    memory. High values point to a memory bandwidth bottleneck. Its peak is the
    theoretical memory bandwidth at the maximum memory clock that amd-smi reports.
  peak: $max_mclk * 4 * $num_memory_channels * 4 / 1000
gl2.fabric_wr_bw:
  name: GL2-Fabric Write Bandwidth
  formula: SUM(GL2C_EA_WRREQ_64B_sum * 64 + (GL2C_MC_WRREQ_sum - GL2C_EA_WRREQ_64B_sum) * 32) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second the GL2 cache writes to the memory fabric or system
    memory. High values indicate write-intensive workloads. Combined with read
    bandwidth, this shows total memory traffic leaving the GPU caches.
  peak: $max_mclk * 4 * $num_memory_channels * 4 / 1000
gl2.hit_rate:
  name: GL2 Cache Hit Rate
  formula: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
  unit: Percent
  description: Percentage of GL2 cache requests that hit in the cache.
  peak: 100
gl2.hits:
  name: GL2 Cache Hits
  formula: SUM(GL2C_HIT_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of GL2 cache requests that were serviced from cache. High hit counts relative
    to total requests indicate effective caching. Low hit counts suggest memory-bound
    workloads or poor data locality.
gl2.misses:
  name: GL2 Cache Misses
  formula: SUM(GL2C_MISS_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of GL2 cache requests that missed and required fetching through GCEA
    (Graphics Core Efficiency Arbiter). High miss counts indicate heavy memory traffic.
    Consider improving data locality or reducing working set size.
gl2.rd_req:
  name: GL2 Read Requests
  formula: SUM(GL2C_READ_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of read requests to the GL2 cache. High read counts indicate memory-intensive
    load operations. Compare with hit rate to assess GL2 cache effectiveness for reads.
gl2.total_req:
  name: GL2 Total Requests
  formula: SUM(GL2C_REQ_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Total number of GL2 cache requests.
gl2.util:
  name: GL2 Cache Utilization
  formula: 100 * SUM(GL2C_BUSY_sum) / SUM(GL2C_CYCLE_sum)
  unit: Percent
  description: Percentage of cycles the GL2 cache is busy.
gl2.wr_bw:
  name: GL2 Cache Write Bandwidth
  formula: 64 * SUM(GL2C_WRITE_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second written to the GL2 cache. This represents total write
    traffic from GL1 caches to GL2. High bandwidth indicates memory-intensive write
    patterns.
gl2.wr_req:
  name: GL2 Write Requests
  formula: SUM(GL2C_WRITE_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of write requests to the GL2 cache. Write traffic includes stores and cache
    writebacks from GL1. High write counts indicate write-intensive workloads.
