gl2.atomic_req:
  name: GL2 Atomic Requests
  formula: SUM(GL2C_ATOMIC_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of atomic memory operations processed by the GL2 cache, per normalization
    unit. Atomics may serialize at contended addresses, so high counts may impact
    performance.
gl2.ea_rd_req_dram:
  name: EA Read Requests (DRAM)
  formula: SUM(GL2C_EA_RDREQ_DRAM_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of read requests forwarded from GL2 cache through GCEA (Graphics Core
    Efficiency Arbiter) toward system memory, per normalization unit. System-level
    caches may serve these requests before they reach DRAM.
gl2.ea_wr_req_dram:
  name: EA Write Requests (DRAM)
  formula: SUM(GL2C_EA_WRREQ_DRAM_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of write requests, including evictions and writebacks, forwarded from GL2
    cache through GCEA (Graphics Core Efficiency Arbiter) toward system memory, per
    normalization unit. High counts indicate write-intensive workloads consuming memory
    bandwidth.
gl2.fabric_rd_bw:
  name: GL2-Fabric Read Bandwidth
  formula: SUM(GL2C_EA_RDREQ_32B_sum * 32 + GL2C_EA_RDREQ_64B_sum * 64 + GL2C_EA_RDREQ_96B_sum * 96 + GL2C_EA_RDREQ_128B_sum * 128) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes the GL2 cache reads from the memory fabric or system memory,
    divided by total duration. Its peak requires $max_mclk populated in sysinfo (max MEM
    clock from amd-smi).
  peak: $max_mclk * 4 * $num_memory_channels * 4 / 1000
gl2.fabric_wr_bw:
  name: GL2-Fabric Write Bandwidth
  formula: SUM(GL2C_EA_WRREQ_64B_sum * 64 + (GL2C_MC_WRREQ_sum - GL2C_EA_WRREQ_64B_sum) * 32) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes the GL2 cache writes to the memory fabric or system memory,
    divided by total duration. High values indicate write-intensive workloads.
  peak: $max_mclk * 4 * $num_memory_channels * 4 / 1000
gl2.hit_rate:
  name: GL2 Cache Hit Rate
  formula: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
  unit: Percent
  description: >-
    Percentage of GL2 cache requests that are serviced from cache without accessing
    system memory. Low hit rates may indicate poor data locality or working sets that
    exceed cache capacity.
  peak: 100
gl2.hits:
  name: GL2 Cache Hits
  formula: SUM(GL2C_HIT_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of GL2 cache requests that were serviced from cache, per normalization unit.
    High hit counts relative to total requests indicate effective caching.
gl2.misses:
  name: GL2 Cache Misses
  formula: SUM(GL2C_MISS_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of GL2 cache requests that missed and required fetching through GCEA
    (Graphics Core Efficiency Arbiter), per normalization unit. High miss counts
    indicate heavy memory traffic.
gl2.rd_req:
  name: GL2 Read Requests
  formula: SUM(GL2C_READ_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of read requests to the GL2 cache, per normalization unit. High read counts
    indicate memory-intensive load operations.
gl2.total_req:
  name: GL2 Total Requests
  formula: SUM(GL2C_REQ_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Total number of requests received by the GL2 cache from all GL1 caches and other
    clients, per normalization unit. This represents the aggregate memory traffic at the
    GPU's final on-chip cache.
gl2.util:
  name: GL2 Cache Utilization
  formula: 100 * SUM(GL2C_BUSY_sum) / SUM(GL2C_CYCLE_sum)
  unit: Percent
  description: ''
gl2.wr_bw:
  name: GL2 Cache Write Bandwidth
  formula: 64 * SUM(GL2C_WRITE_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes the GL1 caches write to the GL2 cache, divided by total
    duration. High bandwidth indicates memory-intensive write patterns.
gl2.wr_req:
  name: GL2 Write Requests
  formula: SUM(GL2C_WRITE_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of write requests to the GL2 cache, including stores and cache writebacks
    from GL1, per normalization unit. High write counts indicate write-intensive
    workloads.
