gl2.atomic_req:
  name: Atomic Requests
  formula: SUM(GL2C_ATOMIC_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of atomic memory operations processed by the GL2 cache. Atomics provide
    thread-safe memory access but may serialize at contended addresses. High counts
    may impact performance.
gl2.ea_rd_req_dram:
  name: EA Read Requests (DRAM)
  formula: SUM(GL2C_EA_RDREQ_DRAM_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of read requests forwarded from GL2 cache through GCEA (Graphics Core Efficiency
    Arbiter). These requests go toward system memory, though they may be served by
    system-level caches before reaching DRAM. High counts indicate memory-bound workloads.
gl2.ea_wr_req_dram:
  name: EA Write Requests (DRAM)
  formula: SUM(GL2C_EA_WRREQ_DRAM_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of write requests forwarded from GL2 cache through GCEA (Graphics Core
    Efficiency Arbiter). These include evictions and writebacks going toward system
    memory. High counts indicate write-intensive workloads consuming memory bandwidth.
gl2.fabric_rd_bw:
  name: GL2-Fabric Read BW
  formula: SUM(GL2C_EA_RDREQ_32B_sum * 32 + GL2C_EA_RDREQ_64B_sum * 64 + GL2C_EA_RDREQ_96B_sum * 96 + GL2C_EA_RDREQ_128B_sum * 128) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    Read bandwidth between the GL2 cache and the memory fabric/system memory. High
    bandwidth utilization indicates memory-intensive read patterns. This metric helps
    identify when memory bandwidth is a performance bottleneck. Requires $max_mclk
    populated in sysinfo (max MEM clock from amd-smi).
  peak: $max_mclk * 4 * $num_memory_channels * 4 / 1000
gl2.fabric_wr_bw:
  name: GL2-Fabric Write BW
  formula: SUM(GL2C_EA_WRREQ_64B_sum * 64 + NOISE_CLAMP(GL2C_MC_WRREQ_sum - GL2C_EA_WRREQ_64B_sum, GL2C_MC_WRREQ_sum) * 32) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    Write bandwidth between the GL2 cache and the memory fabric/system memory. High
    values indicate write-intensive workloads. Combined with read bandwidth, this
    shows total memory traffic leaving the GPU caches.
  peak: $max_mclk * 4 * $num_memory_channels * 4 / 1000
gl2.hit_rate:
  name: GL2 Cache Hit Rate
  formula: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
  unit: Percent
  description: >-
    Percentage of GL2 cache requests that are serviced from cache without accessing
    system memory. Higher hit rates reduce memory bandwidth pressure and improve performance.
    Low hit rates may indicate poor data locality or working sets that exceed cache
    capacity.
  peak: 100
gl2.hits:
  name: GL2 Cache Hits
  formula: SUM(GL2C_HIT_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of GL2 cache requests that were serviced from cache. High hit counts relative
    to total requests indicate effective caching. Low hit counts suggest memory-bound
    workloads or poor data locality.
gl2.misses:
  name: GL2 Cache Misses
  formula: SUM(GL2C_MISS_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of GL2 cache requests that missed and required fetching through GCEA (Graphics
    Core Efficiency Arbiter). High miss counts indicate heavy memory traffic. Consider
    improving data locality or reducing working set size.
gl2.rd_req:
  name: Read Requests
  formula: SUM(GL2C_READ_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of read requests to the GL2 cache. High read counts indicate memory-intensive
    load operations. Compare with hit rate to assess GL2 cache effectiveness for reads.
gl2.total_req:
  name: Total Requests
  formula: SUM(GL2C_REQ_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Total number of requests received by the GL2 cache from all GL1 caches and other
    clients. This represents the aggregate memory traffic at the GPU's final on-chip
    cache.
gl2.util:
  name: GL2 Cache Utilization
  formula: 100 * SUM(GL2C_BUSY_sum) / SUM(GL2C_CYCLE_sum)
  unit: Percent
  description: ''
gl2.wr_bw:
  name: GL2 Cache Write BW
  formula: 64 * SUM(GL2C_WRITE_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    Achieved write bandwidth at the GL2 cache level. This represents total write traffic
    from GL1 caches to GL2. High bandwidth indicates memory-intensive write patterns.
gl2.wr_req:
  name: Write Requests
  formula: SUM(GL2C_WRITE_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of write requests to the GL2 cache. Write traffic includes stores and cache
    writebacks from GL1. High write counts indicate write-intensive workloads.
