wave.dispatched_threads:
  name: Dispatched Threads
  formula: AVG(SQ_ITEMS_sum)
  unit: Threads
  description: ''
wave.dispatched_waves:
  name: Dispatched Waves
  formula: AVG(SQ_WAVES_sum)
  unit: Wavefronts
  description: ''
wave.issue_wait:
  name: Wave Issue Wait
  formula: 100 * SUM(SQ_WAIT_INST_ANY) / SUM(SQ_WAVE_CYCLES)
  unit: Percent
  description: >-
    Percentage of wavefront execution time spent waiting for instructions to become
    ready for issue. High values may indicate instruction cache misses, complex control
    flow, or pipeline stalls preventing instruction dispatch.
  peak: 100
wave.life:
  name: Wave Life
  formula: SUM(SQ_WAVE_CYCLES_sum) / SUM(SQ_WAVES_sum)
  unit: Cycles
  description: >-
    Average number of cycles from wavefront creation to completion. Longer wave life
    indicates more execution time per wavefront, which may be due to complex kernels,
    memory latency, or synchronization waits.
wave.occupancy:
  name: Wavefront Occupancy
  formula: SUM(SQ_WAVE_CYCLES_sum) / SUM(SQ_BUSY_CYCLES_avr)
  unit: Wavefronts
  description: >-
    Average number of wavefronts resident on the GPU during kernel execution. Higher
    occupancy provides more opportunities to hide memory latency through wavefront
    switching. However, maximum occupancy is not always optimal. Excessive register
    or LDS usage per wavefront may limit occupancy.
  peak: $max_waves_per_cu * $cu_per_gpu
wave.occupancy_pct:
  name: Wavefront Occupancy (Percent)
  formula: 100 * SUM(SQ_WAVE_CYCLES_sum) / SUM(SQ_BUSY_CYCLES_sum * 2 * $max_waves_per_cu)
  unit: Percent
  description: >-
    Resident wavefronts per WGP, averaged over GPU-active cycles, as a percent of
    the maximum wavefronts per WGP.
wave.wait_for_any:
  name: Wait for Any
  formula: 100 * SUM(SQ_WAIT_ANY) / SUM(SQ_WAVE_CYCLES)
  unit: Percent
  description: >-
    Percentage of wavefront execution time spent waiting for data dependencies to
    resolve, such as pending memory operations or prior instruction results. High
    values indicate latency-bound execution that could benefit from increased occupancy
    or reduced dependency chains.
  peak: 100
wave.wait_for_barrier:
  name: Wait for Barrier
  formula: 100 * SUM(SQ_WAIT_BARRIER) / SUM(SQ_WAVE_CYCLES)
  unit: Percent
  description: >-
    Percentage of wavefront lifetime spent at barrier synchronization points. High
    barrier wait times may indicate workload imbalance within workgroups. Consider
    restructuring algorithms to reduce synchronization frequency.
wave.wait_for_counter:
  name: Wait for Counter
  formula: 100 * SUM(SQ_WAIT_CNT_ANY) / SUM(SQ_WAVE_CYCLES)
  unit: Percent
  description: >-
    Percentage of wavefront lifetime spent waiting for memory operation counters.
    High values indicate memory latency is impacting performance. Consider improving
    memory access patterns or increasing occupancy to hide latency.
wave.wait_for_inst_fetch:
  name: Wait for Instruction Fetch
  formula: 100 * SUM(SQ_WAIT_IFETCH) / SUM(SQ_WAVE_CYCLES)
  unit: Percent
  description: >-
    Percentage of wavefront lifetime spent waiting for instruction fetch. High values
    may indicate instruction cache misses, large kernel code, or divergent control
    flow impacting instruction locality.
