gl1.busy:
  name: GL1 Cache Busy
  formula: 100 * SUM(GL1C_BUSY) / SUM(GL1C_CYCLE)
  unit: Percent
  description: >-
    Percentage of cycles the GL1 cache, shared by the Workgroup Processors of a Shader
    Engine, is actively processing requests. High utilization indicates active memory
    traffic from the GL0 caches.
gl1.gl2_bw:
  name: GL1-GL2 Bandwidth
  formula: $gl2_read_bandwidth + $gl2_write_bandwidth
  unit: GB/s
  description: >-
    The number of bytes transferred between the GL1 and GL2 caches by GL1 misses,
    divided by total duration. High bandwidth relative to peak may indicate GL1 cache
    pressure or poor data locality at the GL1 level.
  peak_empirical: $L2Bw_empirical_peak
gl1.gl2_rd_128b_req:
  name: GL2 Read 128B Requests
  formula: SUM(GL1C_GL2_REQ_READ_128B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Number of 128-byte read requests forwarded from GL1 to GL2 cache, per normalization
    unit. This represents large cache line fetches for memory-intensive workloads.
gl1.gl2_rd_bw:
  name: GL1-GL2 Read Bandwidth
  formula: SUM(GL1C_GL2_REQ_READ_32B_sum * 32 + GL1C_GL2_REQ_READ_64B_sum * 64 + GL1C_GL2_REQ_READ_128B_sum * 128) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes L1 (GL1C) reads from L2 (GL2C) to service L1 cache misses,
    divided by total duration. Lower values indicate better L1 cache efficiency.
  peak: $num_gl1c * 128 * $max_sclk / 1000
gl1.gl2_rd_req:
  name: GL1-GL2 Read Requests
  formula: SUM(GL1C_GL2_REQ_READ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Number of read requests forwarded from GL1 to GL2 cache due to misses, per
    normalization unit. High counts may indicate GL1 capacity limitations.
gl1.gl2_stall:
  name: GL2 Stall
  formula: SUM(GL1C_STALL_GL2_GL1_sum) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    Cycles the GL1 cache was stalled waiting for GL2 to accept requests, per
    normalization unit. High stall counts indicate GL2 bandwidth saturation or
    contention, limiting GL1 throughput.
gl1.gl2_wr_bw:
  name: GL1-GL2 Write Bandwidth
  formula: SUM(GL1C_GL2_REQ_WRITE_32B_sum * 32 + GL1C_GL2_REQ_WRITE_64B_sum * 64) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: ''
gl1.gl2_wr_req:
  name: GL1-GL2 Write Requests
  formula: SUM(GL1C_GL2_REQ_WRITE_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Number of write requests forwarded from GL1 to GL2 cache, per normalization unit.
    This includes writebacks and stores that missed in GL1.
gl1.hit_rate:
  name: GL1 Hit Rate
  formula: 100 * SUM(GL1C_REQ_sum - GL1C_REQ_MISS_sum) / SUM(GL1C_REQ_sum)
  unit: Percent
  description: >-
    Percentage of L1 cache (GL1C) requests that hit in cache; GL1C is shared across the
    workgroup processors of a shader engine. Higher hit rates reduce traffic to the L2
    cache and improve performance.
  peak: 100
gl1.lfifo_full_stall:
  name: GL1 LFIFO Full Stall
  formula: SUM(GL1C_STALL_LFIFO_FULL_sum) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    Cycles the GL1 cache was stalled due to the LFIFO (Load FIFO) being full, per
    normalization unit. High stall counts indicate data return path congestion from GL2
    to GL1.
gl1.miss_req:
  name: GL1 Miss Requests
  formula: SUM(GL1C_REQ_MISS_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of GL1 cache requests that missed and required fetching from GL2, per
    normalization unit. High miss counts increase memory latency and traffic to GL2.
gl1.rd_req:
  name: GL1 Read Requests
  formula: SUM(GL1C_REQ_READ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Number of read requests to the GL1 cache, which are loads that missed in GL0, per
    normalization unit. High read counts indicate memory-intensive load operations.
gl1.stall_gl2_backpressure:
  name: GL1 Cache Stall GL2 Backpressure
  formula: 100 * SUM(GL1C_STALL_GL2_GL1_sum) / SUM(GL1C_BUSY_sum)
  unit: Percent
  description: ''
gl1.starve:
  name: GL1 Cache Starve
  formula: 100 * SUM(GL1C_STARVE) / SUM(GL1C_CYCLE)
  unit: Percent
  description: >-
    Percentage of cycles the GL1 cache had no pending requests. High starvation indicates
    either compute-bound workloads with minimal memory traffic, or effective GL0 caching
    reducing traffic to GL1.
gl1.total_req:
  name: GL1 Total Requests
  formula: SUM(GL1C_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total number of requests received by the GL1 cache from all GL0 caches (TCP
    instances) within the shader engine, per normalization unit. This represents
    aggregated memory traffic from multiple Workgroup Processors.
gl1.util:
  name: GL1 Cache Utilization
  formula: 100 * SUM(GL1C_BUSY_sum) / SUM(GL1C_CYCLE_sum)
  unit: Percent
  description: >-
    Percentage of cycles the GL1 cache, shared by the workgroup processors of a shader
    engine, is actively processing requests. High utilization indicates active memory
    traffic through the GL1 cache.
gl1.wr_req:
  name: GL1 Write Requests
  formula: SUM(GL1C_REQ_WRITE_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Number of write requests to the GL1 cache, including stores that missed in GL0 and
    cache writebacks, per normalization unit. High write counts may indicate
    write-intensive workloads.
