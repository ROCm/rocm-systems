GRBM_COUNT_PER_XCD:
  formula: GRBM_COUNT / $num_xcd
GRBM_GUI_ACTIVE_PER_XCD:
  formula: GRBM_GUI_ACTIVE / $num_xcd
GRBM_SPI_BUSY_PER_XCD:
  formula: GRBM_SPI_BUSY / $num_xcd
gl2_read_bandwidth:
  formula: SUM($gl2_read_bytes) / SUM(End_Timestamp - Start_Timestamp)
gl2_read_bytes:
  formula: GL1C_GL2_REQ_READ_32B_sum * 32 + GL1C_GL2_REQ_READ_64B_sum * 64 + GL1C_GL2_REQ_READ_128B_sum * 128
gl2_write_bandwidth:
  formula: SUM($gl2_write_bytes) / SUM(End_Timestamp - Start_Timestamp)
gl2_write_bytes:
  formula: GL1C_GL2_REQ_WRITE_32B_sum * 32 + GL1C_GL2_REQ_WRITE_64B_sum * 64
valu_flops:
  formula: $wave_size * SQ_INSTS_VALU_sum
