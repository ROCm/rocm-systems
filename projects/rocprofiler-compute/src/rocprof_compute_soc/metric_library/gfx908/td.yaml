td.atomic_insts:
  name: TD Atomic Instructions
  formula: SUM(TD_ATOMIC_WAVEFRONT_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The number of atomic instructions submitted to the data-return unit by the address
    processor summed over all compute units on the accelerator, per normalization
    unit. This is expected to be the sum of global/generic and spill/stack atomics
    in the address processor.
td.busy:
  name: Data-Return Busy
  formula: 100 * SUM(TD_TD_BUSY_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  description: >-
    Percent of the total CU cycles the data-return unit was busy processing or waiting
    on data to return to the CU.
td.coalescable_insts:
  name: TD Coalescable Instructions
  formula: SUM(TD_COALESCABLE_WAVEFRONT_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The number of instructions submitted to the data-return unit by the address processor
    that were found to be coalescable, per normalization unit.
td.rd_insts:
  name: TD Read Instructions
  formula: SUM(TD_LOAD_WAVEFRONT_sum - TD_STORE_WAVEFRONT_sum - TD_ATOMIC_WAVEFRONT_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The number of read instructions submitted to the data-return unit by the address
    processor summed over all compute units on the accelerator, per normalization
    unit. This is expected to be the sum of global/generic and spill/stack reads in
    the address processor.
td.tc_stall:
  name: Cache RAM -> Data-Return Stall
  formula: 100 * SUM(TD_TC_STALL_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  description: >-
    Percent of the total CU cycles the data-return unit was stalled on data to be
    returned from the vL1D Cache RAM.
td.wr_insts:
  name: TD Write Instructions
  formula: SUM(TD_STORE_WAVEFRONT_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The number of store instructions submitted to the data-return unit by the address
    processor summed over all compute units on the accelerator, per normalization
    unit. This is expected to be the sum of global/generic and spill/stack stores
    in the address processor.
