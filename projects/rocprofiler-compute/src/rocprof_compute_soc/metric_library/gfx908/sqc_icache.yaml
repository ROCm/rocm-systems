mem.l1i_hit_rate_excl_dup:
  name: L1I Hit Rate (Excluding Duplicate Misses)
  formula: 100 * SUM(SQC_ICACHE_HITS) / SUM(SQC_ICACHE_HITS + SQC_ICACHE_MISSES)
  unit: Percent
  description: >-
    The number of bytes looked up in the L1I cache per unit time. This is also presented
    as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
  peak: 100
mem.l1i_bw:
  name: L1I BW
  formula: 64 * SUM(SQC_ICACHE_REQ) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The percent of L1I requests that hit on a previously loaded line the cache. Calculated
    as the ratio of the number of L1I requests that hit over the number of all L1I
    requests.
  peak: $max_sclk / 1000 * 64 * $sqc_per_gpu
mem.l1i_fetch_lat:
  name: L1I Fetch Latency
  formula: SUM(SQ_IFETCH_LEVEL_ACCUM) / SUM(SQ_IFETCH)
  unit: Cycles
  description: >-
    The average number of cycles spent to fetch instructions to a CU.
  coll_level: SQ_IFETCH_LEVEL
mem.l1i_req:
  name: Req
  formula: SUM(SQC_ICACHE_REQ) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of requests made to the L1I per normalization unit.
mem.l1i_hits_per_req:
  name: L1I Hits per Request
  formula: 100 * SUM(SQC_ICACHE_HITS) / SUM(SQC_ICACHE_REQ)
  unit: Percent
  description: >-
    The percent of L1I requests that hit on a previously loaded cache line. Calculated
    as the ratio of the number of L1I requests that hit over the number of all L1I
    requests.
mem.l1i_l2_rd_bw:
  name: IL1_L2 Read BW
  formula: 64 * SUM(SQC_TC_INST_REQ) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    Bandwidth of read requests from the instruction L1 cache to the L2 cache per unit
    time.
mem.l1i_bw_util:
  name: Bandwidth Utilization
  formula: 100000 * SUM(SQC_ICACHE_REQ) / SUM($max_sclk * $sqc_per_gpu * (End_Timestamp - Start_Timestamp))
  unit: Percent
  description: >-
    The number of bytes looked up in the L1I cache, as a percent of the peak theoretical
    bandwidth. Calculated as the ratio of L1I requests over the total L1I cycles.
mem.l1i_hit_rate_incl_dup:
  name: L1I Hit Rate (Including Duplicate Misses)
  formula: 100 * SUM(SQC_ICACHE_HITS) / SUM(SQC_ICACHE_HITS + SQC_ICACHE_MISSES + SQC_ICACHE_MISSES_DUPLICATE)
  unit: Percent
  description: >-
    The percent of L1I requests that hit [#l1i-cache]_ on a previously loaded line
    the cache. Calculated as the ratio of the number of L1I requests that hit over
    the number of all L1I requests.
mem.l1i_l2_bw_util:
  name: L1I-L2 Bandwidth Utilization
  formula: 100000 * SUM(SQC_TC_INST_REQ) / (2 * SUM($max_sclk * $sqc_per_gpu * (End_Timestamp - Start_Timestamp)))
  unit: Percent
  description: >-
    The percent of the peak theoretical L1I \u2192 L2 cache request bandwidth achieved.
    Calculated as the ratio of the total number of requests from the L1I to the L2
    cache over the total L1I-L2 interface cycles.
mem.l1i_hits:
  name: Hits
  formula: SUM(SQC_ICACHE_HITS) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L1I requests that hit on a previously loaded cache line, per
    normalization-unit.
mem.l1i_misses_non_duplicated:
  name: Misses - Non Duplicated
  formula: SUM(SQC_ICACHE_MISSES) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L1I requests that missed on a cache line that were not already
    pending due to another request, per normalization-unit.
mem.l1i_misses_duplicated:
  name: Misses - Duplicated
  formula: SUM(SQC_ICACHE_MISSES_DUPLICATE) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L1I requests that missed on a cache line that were already
    pending due to another request, per normalization-unit.
mem.l1i_l2_bw:
  name: L1I-L2 Bandwidth
  formula: 64 * SUM(SQC_TC_INST_REQ) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    Total number of bytes transferred across L1I - L2 interface divided by total duration.
