vl1d.access_lat:
  name: vL1D Access Latency
  formula: SUM(TCP_TCP_LATENCY_sum) / SUM(TCP_TA_TCP_STATE_READ_sum)
  unit: Cycles
  description: >-
    Calculated as the average number of cycles that a vL1D cache line request spent in
    the vL1D cache pipeline.
vl1d.atomic_req:
  name: vL1D Atomic Requests
  formula: SUM(TCP_TOTAL_ATOMIC_WITH_RET_sum + TCP_TOTAL_ATOMIC_WITHOUT_RET_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of incoming atomic requests from the address processing unit after
    coalescing.
vl1d.bw_util:
  name: vL1D Bandwidth Utilization
  formula: 100 * 64 * SUM(TCP_TOTAL_CACHE_ACCESSES_sum) / SUM(End_Timestamp - Start_Timestamp) / ($max_sclk / 1000 * 64 * $cu_per_gpu)
  unit: Percent
  description: >-
    Percentage of the peak theoretical vL1D cache bandwidth used by the bytes looked up
    in the vL1D cache by VMEM instructions. The number of bytes is the number of cache
    lines requested times the cache line size; a partial request counts as a full cache
    line.
vl1d.cache_accesses:
  name: vL1D Cache Accesses
  formula: SUM(TCP_TOTAL_CACHE_ACCESSES_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: The total number of cache line lookups in the vL1D.
vl1d.cache_bw:
  name: vL1D Cache Bandwidth
  formula: 64 * SUM(TCP_TOTAL_CACHE_ACCESSES_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second looked up in the vL1D cache by VMEM instructions. The
    number of bytes is the number of cache lines requested times the cache line size; a
    partial request counts as a full cache line.
  peak: $max_sclk / 1000 * 64 * $cu_per_gpu
vl1d.cache_hits:
  name: vL1D Cache Hits
  formula: SUM($vl1d_accesses_minus_read_write_misses - $vl1d_atomic_requests) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The number of cache accesses minus the number of outgoing requests to the L2 cache,
    that is, the number of cache line requests serviced by the vL1D Cache RAM.
vl1d.cc_atomic:
  name: vL1D-L2 CC Atomic Requests
  formula: SUM(TCP_TCC_CC_ATOMIC_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total atomic requests with CC mtype from this TCP to all TCCs Sum over TCP
    instances.
vl1d.cc_rd:
  name: vL1D-L2 CC Read Requests
  formula: SUM(TCP_TCC_CC_READ_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total read requests with CC mtype from this TCP to all TCCs Sum over TCP instances.
vl1d.cc_wr:
  name: vL1D-L2 CC Write Requests
  formula: SUM(TCP_TCC_CC_WRITE_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total write requests with CC mtype from this TCP to all TCCs Sum over TCP instances.
vl1d.coalescing:
  name: vL1D Coalescing
  formula: 100 * 64 * SUM(TA_TOTAL_WAVEFRONTS_sum) / (4 * SUM(TCP_TOTAL_ACCESSES_sum))
  unit: Percent
  description: >-
    Percentage of ideal coalescing the address processing unit achieved for memory
    instructions, ranging from uncoalesced (25%) to fully coalesced (100%). Calculated
    as the average number of thread-requests generated per instruction divided by the
    ideal number of thread-requests per instruction.
vl1d.hit_rate:
  name: vL1D Cache Hit Rate
  formula: 100 - $vl1d_read_write_miss_rate - $vl1d_atomic_miss_rate
  unit: Percent
  description: >-
    Percentage of cache line requests to the vL1D Cache RAM that hit in the vL1D cache.
    Calculated as 100 minus the percent of requests that were sent to the L2.
vl1d.hit_ratio:
  name: UTCL1 Hit Ratio
  formula: 100 * SUM(TCP_UTCL1_TRANSLATION_HIT_sum) / SUM(TCP_UTCL1_REQUEST_sum)
  unit: Percent
  description: Percentage of translation requests to the UTCL1 that hit in the UTCL1.
vl1d.hits:
  name: UTCL1 Hits
  formula: SUM(TCP_UTCL1_TRANSLATION_HIT_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The number of translation requests that hit in the UTCL1, and could be reused.
vl1d.invalidations:
  name: vL1D Invalidations
  formula: SUM(TCP_TOTAL_WRITEBACK_INVALIDATES_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The number of times the vL1D was issued a write-back invalidate command during the
    kernel's execution. This may be triggered by, for example, the buffer_wbinvl1
    instruction.
vl1d.l2_atomic_bw:
  name: vL1D-L2 Atomic Bandwidth
  formula: 64 * SUM(TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second of atomic requests from the vL1D cache to the L2
    cache.
vl1d.l2_atomic_req:
  name: vL1D-L2 Atomic Requests
  formula: SUM(TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The number of atomic requests that are sent through the vL1D to the L2 cache. This
    includes requests for atomics with, and without return.
vl1d.l2_bw:
  name: vL1D-L2 Bandwidth
  formula: 64 * SUM(TCP_TCC_READ_REQ_sum + TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second transferred across the vL1D-L2 interface by VMEM
    instructions. The number of bytes is the number of cache lines requested times the
    cache line size; a partial request counts as a full cache line.
vl1d.l2_rd_bw:
  name: vL1D-L2 Read Bandwidth
  formula: 128 * SUM(TCP_TCC_READ_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second of read requests from the vL1D cache to the L2 cache.
vl1d.l2_rd_lat:
  name: vL1D-L2 Read Latency
  formula: SUM(TCP_TCC_READ_REQ_LATENCY_sum) / SUM(TCP_TCC_READ_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum)
  unit: Cycles
  description: >-
    Calculated as the average number of cycles that the vL1D cache took to issue and
    receive read requests from the L2 Cache. This number also includes requests for
    atomics with return values.
vl1d.l2_rd_req:
  name: vL1D-L2 Read Requests
  formula: SUM(TCP_TCC_READ_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The number of read requests for a vL1D cache line that were not satisfied by the
    vL1D and must be retrieved from the to the L2 Cache.
vl1d.l2_wr_bw:
  name: vL1D-L2 Write Bandwidth
  formula: 64 * SUM(TCP_TCC_WRITE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second of write requests from the vL1D cache to the L2
    cache.
vl1d.l2_wr_lat:
  name: vL1D-L2 Write Latency
  formula: SUM(TCP_TCC_WRITE_REQ_LATENCY_sum) / SUM(TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum)
  unit: Cycles
  description: >-
    Calculated as the average number of cycles that the vL1D cache took to issue and
    receive acknowledgement of a write request to the L2 Cache. This number also
    includes requests for atomics without return values.
vl1d.l2_wr_req:
  name: vL1D-L2 Write Requests
  formula: SUM(TCP_TCC_WRITE_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The number of write requests to a vL1D cache line that were sent through the vL1D to
    the L2 cache.
vl1d.nc_atomic:
  name: vL1D-L2 NC Atomic Requests
  formula: SUM(TCP_TCC_NC_ATOMIC_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total atomic requests with NC mtype from this TCP to all TCCs Sum over TCP
    instances.
vl1d.nc_rd:
  name: vL1D-L2 NC Read Requests
  formula: SUM(TCP_TCC_NC_READ_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total read requests with NC mtype from this TCP to all TCCs Sum over TCP instances.
vl1d.nc_wr:
  name: vL1D-L2 NC Write Requests
  formula: SUM(TCP_TCC_NC_WRITE_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total write requests with NC mtype from this TCP to all TCCs Sum over TCP instances.
vl1d.permission_misses:
  name: UTCL1 Permission Misses
  formula: SUM(TCP_UTCL1_PERMISSION_MISS_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of translation requests that missed in the UTCL1 due to a
    permission error. This is unused and expected to be zero in most configurations for
    modern CDNA accelerators.
vl1d.rd_req:
  name: vL1D Read Requests
  formula: SUM(TCP_TOTAL_READ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of incoming read requests from the address processing unit after
    coalescing.
vl1d.req:
  name: UTCL1 Requests
  formula: SUM(TCP_UTCL1_REQUEST_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: The number of translation requests made to the UTCL1.
vl1d.rw_atomic:
  name: vL1D-L2 RW Atomic Requests
  formula: SUM(TCP_TCC_RW_ATOMIC_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total atomic requests with RW mtype from this TCP to all TCCs Sum over TCP
    instances.
vl1d.rw_rd:
  name: vL1D-L2 RW Read Requests
  formula: SUM(TCP_TCC_RW_READ_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total read requests with RW mtype from this TCP to all TCCs Sum over TCP instances.
vl1d.rw_wr:
  name: vL1D-L2 RW Write Requests
  formula: SUM(TCP_TCC_RW_WRITE_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total write requests with RW mtype from this TCP to all TCCs Sum over TCP instances.
vl1d.stalled_on_l2_data:
  name: vL1D Stalled on L2 Data
  formula: 100 * TCP_PENDING_STALL_CYCLES_sum / TCP_GATE_EN1_sum
  unit: Percent
  description: >-
    Percentage of vL1D active cycles the vL1D was stalled waiting for requested data to
    return from the L2 cache.
vl1d.stalled_on_l2_req:
  name: vL1D Stalled on L2 Requests
  formula: 100 * TCP_TCR_TCP_STALL_CYCLES_sum / TCP_GATE_EN1_sum
  unit: Percent
  description: >-
    Percentage of vL1D active cycles the vL1D was stalled waiting to issue a request for
    data to the L2 cache.
vl1d.tag_ram_stall_atomic:
  name: vL1D Tag RAM Stall (Atomic)
  formula: 100 * TCP_ATOMIC_TAGCONFLICT_STALL_CYCLES_sum / TCP_GATE_EN1_sum
  unit: Percent
  description: >-
    Percentage of vL1D active cycles the vL1D was stalled because atomic requests with
    conflicting tags were looked up concurrently.
vl1d.tag_ram_stall_rd:
  name: vL1D Tag RAM Stall (Read)
  formula: 100 * TCP_READ_TAGCONFLICT_STALL_CYCLES_sum / TCP_GATE_EN1_sum
  unit: Percent
  description: >-
    Percentage of vL1D active cycles the vL1D was stalled because read requests with
    conflicting tags were looked up concurrently.
vl1d.tag_ram_stall_wr:
  name: vL1D Tag RAM Stall (Write)
  formula: 100 * TCP_WRITE_TAGCONFLICT_STALL_CYCLES_sum / TCP_GATE_EN1_sum
  unit: Percent
  description: >-
    Percentage of vL1D active cycles the vL1D was stalled because write requests with
    conflicting tags were looked up concurrently.
vl1d.total_req:
  name: vL1D Total Requests
  formula: SUM(TCP_TOTAL_ACCESSES_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of incoming requests from the address processing unit after
    coalescing.
vl1d.translation_misses:
  name: UTCL1 Translation Misses
  formula: SUM(TCP_UTCL1_TRANSLATION_MISS_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of translation requests that missed in the UTCL1 due to translation
    not being present in the cache.
vl1d.uc_atomic:
  name: vL1D-L2 UC Atomic Requests
  formula: SUM(TCP_TCC_UC_ATOMIC_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total atomic requests with UC mtype from this TCP to all TCCs Sum over TCP
    instances.
vl1d.uc_rd:
  name: vL1D-L2 UC Read Requests
  formula: SUM(TCP_TCC_UC_READ_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total read requests with UC mtype from this TCP to all TCCs Sum over TCP instances.
vl1d.uc_wr:
  name: vL1D-L2 UC Write Requests
  formula: SUM(TCP_TCC_UC_WRITE_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total write requests with UC mtype from this TCP to all TCCs Sum over TCP instances.
vl1d.util:
  name: vL1D Utilization
  formula: 100 * SUM(TCP_GATE_EN2_sum) / SUM(TCP_GATE_EN1_sum)
  unit: Percent
  description: >-
    Percentage of vL1D active cycles the vL1D Cache RAM was actively processing any
    request. This indicates how busy the vL1D Cache RAM was during the kernel execution.
vl1d.wr_req:
  name: vL1D Write Requests
  formula: SUM(TCP_TOTAL_WRITE_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of incoming write requests from the address processing unit after
    coalescing.
