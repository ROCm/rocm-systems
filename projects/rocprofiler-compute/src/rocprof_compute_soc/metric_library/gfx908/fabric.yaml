fabric.atomic:
  name: L2-Fabric Atomic Requests
  formula: SUM(TCC_EA_ATOMIC_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to atomically update 32B or 64B
    of data in any memory location. On MI2XX, Infinity Fabric treats only requests to
    fine-grained or uncached memory as atomic.
fabric.atomic_lat:
  name: L2-Fabric Atomic Latency
  formula: SUM(TCC_EA_ATOMIC_LEVEL_sum) / SUM(TCC_EA_ATOMIC_sum)
  unit: Cycles
  description: >-
    The time-averaged number of cycles atomic requests spent in Infinity Fabric before a
    completion acknowledgement (atomic without return value) or data (atomic with return
    value) was returned to the L2.
fabric.atomic_traffic:
  name: L2-Fabric Atomic Traffic
  formula: 100 * SUM(TCC_EA_ATOMIC_sum) / SUM(TCC_EA_WRREQ_sum)
  unit: Percent
  description: >-
    Percentage of L2 write requests that are atomic requests to any memory location. 32B
    and 64B requests count the same, so this only approximates the share of the
    L2-Fabric write bandwidth used by atomics. On MI2XX, Infinity Fabric treats only
    requests to fine-grained or uncached memory as atomic.
fabric.hbm_peak_bw:
  name: Peak HBM Bandwidth
  formula: $hbmBandwidth
  unit: GB/s
  description: >-
    Maximum theoretical bandwidth of the accelerator's local high-bandwidth memory (HBM)
    per unit time. This value is calculated as the number of HBM channels multiplied by
    the HBM channel width multiplied by the HBM clock frequency.
fabric.hbm_rd:
  name: HBM Read
  formula: SUM(TCC_EA_RDREQ_DRAM_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read 32B or 64B of data from
    the accelerator's local HBM.
fabric.hbm_rd_traffic:
  name: HBM Read Traffic
  formula: 100 * SUM(TCC_EA_RDREQ_DRAM_sum) / SUM(TCC_EA_RDREQ_sum)
  unit: Percent
  description: >-
    Percentage of L2 read requests routed to the accelerator's local high-bandwidth
    memory (HBM). 32B and 64B requests count the same, so this only approximates the
    share of the L2-Fabric read bandwidth directed to the local HBM.
fabric.hbm_wr_atomic:
  name: HBM Write and Atomic
  formula: SUM(TCC_EA_WRREQ_DRAM_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update 32B
    or 64B of data in the accelerator's local HBM.
fabric.hbm_wr_atomic_traffic:
  name: HBM Write and Atomic Traffic
  formula: 100 * SUM(TCC_EA_WRREQ_DRAM_sum) / SUM(TCC_EA_WRREQ_sum)
  unit: Percent
  description: >-
    Percentage of L2 write and atomic requests routed to the accelerator's local HBM.
    32B and 64B requests count the same, so this only approximates the share of
    bandwidth. On MI2XX, Infinity Fabric treats only requests to fine-grained or
    uncached memory as atomic.
fabric.rd_32b:
  name: L2-Fabric Read Requests (32B)
  formula: SUM(TCC_EA_RDREQ_32B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read 32B of data from any
    memory location.
fabric.rd_64b:
  name: L2-Fabric Read Requests (64B)
  formula: SUM(TCC_EA_RDREQ_sum - TCC_EA_RDREQ_32B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read 64B of data from any
    memory location.
fabric.rd_bw:
  name: L2-Fabric Read Bandwidth
  formula: SUM(TCC_EA_RDREQ_32B_sum * 32 + (TCC_EA_RDREQ_sum - TCC_EA_RDREQ_32B_sum) * 64) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second read by the L2 over the Infinity Fabric interface.
  peak: $hbmBandwidth
fabric.rd_bw_norm:
  name: L2-Fabric Read Bytes
  formula: SUM(TCC_EA_RDREQ_32B_sum * 32 + (TCC_EA_RDREQ_sum - TCC_EA_RDREQ_32B_sum) * 64) / SUM($denom)
  unit: (Bytes + $normUnit)
  description: The total number of bytes read by the L2 cache from Infinity Fabric.
fabric.rd_lat:
  name: L2-Fabric Read Latency
  formula: SUM(TCC_EA_RDREQ_LEVEL_sum) / SUM(TCC_EA_RDREQ_sum)
  unit: Cycles
  description: >-
    The time-averaged number of cycles read requests spent in Infinity Fabric before
    data was returned to the L2.
fabric.rd_uncached:
  name: L2-Fabric Read Requests (Uncached)
  formula: SUM(TCC_EA_RD_UNCACHED_32B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read uncached data from any
    memory location. 64B requests for uncached data are counted as two 32B uncached data
    requests.
fabric.remote_rd:
  name: L2-Fabric Remote Read Requests
  formula: SUM(TCC_EA_RDREQ_sum - TCC_EA_RDREQ_DRAM_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read 32B or 64B of data from
    any source other than the accelerator's local HBM.
fabric.remote_rd_traffic:
  name: L2-Fabric Remote Read Traffic
  formula: 100 * SUM(TCC_EA_RDREQ_sum - TCC_EA_RDREQ_DRAM_sum) / SUM(TCC_EA_RDREQ_sum)
  unit: Percent
  description: >-
    Percentage of L2 read requests routed to memory other than the accelerator's local
    HBM, for example the CPU's DRAM or a remote accelerator's HBM. 32B and 64B requests
    count the same, so this only approximates the share of the L2-Fabric read bandwidth
    directed to remote memory.
fabric.remote_wr_atomic:
  name: L2-Fabric Remote Write and Atomic Requests
  formula: SUM(TCC_EA_WRREQ_sum - TCC_EA_WRREQ_DRAM_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update 32B
    or 64B of data in any memory location other than the accelerator's local HBM.
fabric.remote_wr_atomic_traffic:
  name: L2-Fabric Remote Write and Atomic Traffic
  formula: 100 * SUM(TCC_EA_WRREQ_sum - TCC_EA_WRREQ_DRAM_sum) / SUM(TCC_EA_WRREQ_sum)
  unit: Percent
  description: >-
    Percentage of L2 write and atomic requests routed to memory other than the local
    HBM, for example the CPU's DRAM. 32B and 64B requests count the same, so this only
    approximates the share of bandwidth. On MI2XX, Infinity Fabric treats only requests
    to fine-grained or uncached memory as atomic.
fabric.uncached_rd_traffic:
  name: L2-Fabric Uncached Read Traffic
  formula: 100 * SUM(TCC_EA_RD_UNCACHED_32B_sum) / SUM(TCC_EA_RDREQ_32B_sum + 2 * (TCC_EA_RDREQ_sum - TCC_EA_RDREQ_32B_sum))
  unit: Percent
  description: Percentage of L2-Fabric read bytes that come from uncached memory allocations.
fabric.uncached_wr_atomic_traffic:
  name: L2-Fabric Uncached Write and Atomic Traffic
  formula: 100 * SUM(TCC_EA_WR_UNCACHED_32B_sum) / SUM(TCC_EA_WRREQ_sum)
  unit: Percent
  description: >-
    Percentage of write and atomic requests generated by the L2 cache that target
    uncached memory allocations. A 64B write or atomic request counts as two uncached
    requests, so this metric can reach 200% of the write and atomic requests.
fabric.wr_atomic_32b:
  name: L2-Fabric Write and Atomic Requests (32B)
  formula: AVG((TCC_EA_WRREQ_sum - TCC_EA_WRREQ_64B_sum) / $denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update 32B
    of data to any memory location.
fabric.wr_atomic_64b:
  name: L2-Fabric Write and Atomic Requests (64B)
  formula: SUM(TCC_EA_WRREQ_64B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update 64B
    of data in any memory location.
fabric.wr_atomic_bw:
  name: L2-Fabric Write and Atomic Bandwidth
  formula: SUM(TCC_EA_WRREQ_64B_sum * 64 + (TCC_EA_WRREQ_sum - TCC_EA_WRREQ_64B_sum) * 32) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second sent by the L2 over the Infinity Fabric interface by
    write and atomic operations. Infinity Fabric considers a request atomic only if it
    targets non-write-cacheable memory, for example, fine-grained or uncached memory
    allocations.
  peak: $hbmBandwidth
fabric.wr_atomic_bw_norm:
  name: L2-Fabric Write and Atomic Bytes
  formula: SUM(TCC_EA_WRREQ_64B_sum * 64 + (TCC_EA_WRREQ_sum - TCC_EA_WRREQ_64B_sum) * 32) / SUM($denom)
  unit: (Bytes + $normUnit)
  description: >-
    The total number of bytes written by the L2 over Infinity Fabric by write and atomic
    operations. On MI2XX, Infinity Fabric treats only requests to fine-grained or
    uncached memory as atomic.
fabric.wr_atomic_uncached:
  name: L2-Fabric Write and Atomic Requests (Uncached)
  formula: SUM(TCC_EA_WR_UNCACHED_32B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update 32B
    or 64B of uncached data.
fabric.wr_credit_starvation:
  name: L2-Fabric Write Credit Starvation
  formula: 100 * SUM(TCC_TOO_MANY_EA_WRREQS_STALL_sum) / SUM(TCC_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of active L2 cycles the L2-Fabric interface was stalled on write or
    atomic requests to any memory location because too many write/atomic requests were
    currently in flight.
fabric.wr_lat:
  name: L2-Fabric Write and Atomic Latency
  formula: SUM(TCC_EA_WRREQ_LEVEL_sum) / SUM(TCC_EA_WRREQ_sum)
  unit: Cycles
  description: >-
    The time-averaged number of cycles write requests spent in Infinity Fabric before a
    completion acknowledgement was returned to the L2.
