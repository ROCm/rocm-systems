fabric.ai_hbm:
  name: AI HBM
  formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + 2 * SQ_INSTS_VALU_FMA_F16 + SQ_INSTS_VALU_TRANS_F16 + SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + 2 * SQ_INSTS_VALU_FMA_F32 + SQ_INSTS_VALU_TRANS_F32 + SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + 2 * SQ_INSTS_VALU_FMA_F64 + SQ_INSTS_VALU_TRANS_F64) + SQ_INSTS_VALU_MFMA_MOPS_F16 * 512 + SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512 + SQ_INSTS_VALU_MFMA_MOPS_F32 * 512 + SQ_INSTS_VALU_MFMA_MOPS_F64 * 512) / SUM(TCC_BUBBLE_sum * 128 + TCC_EA0_RDREQ_32B_sum * 32 + (TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) * 64 + (TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32 + TCC_EA0_WRREQ_64B_sum * 64)
  unit: FLOPs/Byte
  description: >-
    The Arithmetic Intensity (AI) relative to High-Bandwidth Memory (HBM). It is the
    ratio of total floating-point operations (FLOPs) to total bytes transferred between
    HBM and the L2 cache.
fabric.atomic:
  name: Atomic
  formula: SUM(TCC_EA0_ATOMIC_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to atomically update 32B or
    64B of data in any memory location, per normalization unit. See Request flow for
    more detail. Note that on current CDNA accelerators, such as the MI2XX, requests
    are only considered atomic by Infinity Fabric if they are targeted at non-write-cacheable
    memory, such as fine-grained memory allocations or uncached memory allocations
    on the MI2XX.
fabric.atomic_lat:
  name: Atomic Latency
  formula: SUM(TCC_EA0_ATOMIC_LEVEL_sum) / SUM(TCC_EA0_ATOMIC_sum)
  unit: Cycles
  description: >-
    The time-averaged number of cycles atomic requests spent in Infinity Fabric before
    a completion acknowledgement (atomic without return value) or data (atomic with
    return value) was returned to the L2.
fabric.atomic_traffic:
  name: Atomic Traffic
  formula: 100 * SUM(TCC_EA0_ATOMIC_sum) / SUM(TCC_EA0_WRREQ_sum)
  unit: Percent
  description: >-
    The percent of write requests generated by the L2 cache that are atomic requests
    to any memory location. This breakdown does not consider the size of the request
    (meaning that 32B and 64B requests are both counted as a single request), so this
    metric only approximates the percent of the L2-Fabric Read bandwidth directed
    to a remote location. Note that on current CDNA accelerators, such as the MI2XX,
    requests are only considered atomic by Infinity Fabric if they are targeted at
    fine-grained memory allocations or uncached memory allocations.
fabric.hbm_bw:
  name: HBM Bandwidth
  formula: SUM(TCC_BUBBLE_sum * 128 + TCC_EA0_RDREQ_32B_sum * 32 + (TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) * 64 + (TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32 + TCC_EA0_WRREQ_64B_sum * 64) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The total number of bytes read from and written to High-Bandwidth Memory (HBM)
    per second. It reflects peak single-direction (read-only) bandwidth, so write-heavy
    or mixed kernels fall below it.
fabric.hbm_peak_bw:
  name: Peak HBM Bandwidth
  formula: $hbmBandwidth
  unit: GB/s
  description: >-
    Maximum theoretical bandwidth of the accelerator's local high-bandwidth memory
    (HBM) per unit time. This value is calculated as the number of HBM channels multiplied
    by the HBM channel width multiplied by the HBM clock frequency.
fabric.hbm_rd:
  name: HBM Read
  formula: SUM(TCC_EA0_RDREQ_DRAM_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read 32B or 64B of data
    from the accelerator's local HBM, per normalization unit.
fabric.hbm_rd_traffic:
  name: HBM Read Traffic
  formula: 100 * SUM(TCC_EA0_RDREQ_DRAM_sum) / SUM(TCC_EA0_RDREQ_sum)
  unit: Percent
  description: >-
    The percent of read requests generated by the L2 cache that are routed to the
    accelerator's local high-bandwidth memory (HBM). This breakdown does not consider
    the size of the request (meaning that 32B and 64B requests are both counted as
    a single request), so this metric only approximates the percent of the L2-Fabric
    Read bandwidth directed to the local HBM.
fabric.hbm_wr_atomic:
  name: HBM Write and Atomic
  formula: SUM(TCC_EA0_WRREQ_DRAM_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update
    32B or 64B of data in the accelerator's local HBM, per normalization unit.
fabric.hbm_wr_atomic_traffic:
  name: HBM Write and Atomic Traffic
  formula: 100 * SUM(TCC_EA0_WRREQ_DRAM_sum) / SUM(TCC_EA0_WRREQ_sum)
  unit: Percent
  description: >-
    The percent of write and atomic requests generated by the L2 cache that are routed
    to the accelerator's local high-bandwidth memory (HBM). This breakdown does not
    consider the size of the request (meaning that 32B and 64B requests are both counted
    as a single request), so this metric only approximates the percent of the L2-Fabric
    Write and Atomic bandwidth directed to the local HBM. Note that on current CDNA
    accelerators, such as the MI2XX, requests are only considered atomic by Infinity
    Fabric if they are targeted at fine-grained memory allocations or uncached memory
    allocations.
fabric.rd_32b:
  name: Read (32B)
  formula: SUM(TCC_EA0_RDREQ_32B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read 32B of data from any
    memory location, per normalization unit.
fabric.rd_64b:
  name: Read (64B)
  formula: SUM(TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_32B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read 64B of data from any
    memory location, per normalization unit.
fabric.rd_bw:
  name: L2-Fabric Read BW
  formula: SUM(TCC_EA0_RDREQ_32B_sum * 32 + (TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_32B_sum) * 64) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes read by the L2 over the Infinity Fabric interface per unit
    time.
  peak: $hbmBandwidth
fabric.rd_bw_norm:
  name: Read BW
  formula: SUM(TCC_EA0_RDREQ_32B_sum * 32 + (TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_32B_sum) * 64) / SUM($denom)
  unit: (Bytes + $normUnit)
  description: >-
    The total number of bytes read by the L2 cache from Infinity Fabric divided by
    total duration.
fabric.rd_lat:
  name: L2-Fabric Read Latency
  formula: SUM(TCC_EA0_RDREQ_LEVEL_sum) / SUM(TCC_EA0_RDREQ_sum)
  unit: Cycles
  description: >-
    The time-averaged number of cycles read requests spent in Infinity Fabric before
    data was returned to the L2.
fabric.rd_uncached:
  name: Read (Uncached)
  formula: SUM(TCC_EA0_RD_UNCACHED_32B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read uncached data from
    any memory location, per normalization unit. 64B requests for uncached data are
    counted as two 32B uncached data requests.
fabric.remote_rd:
  name: Remote Read
  formula: SUM(NOISE_CLAMP(TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_DRAM_sum, TCC_EA0_RDREQ_sum)) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read 32B or 64B of data
    from any source other than the accelerator's local HBM, per normalization unit.
fabric.remote_rd_traffic:
  name: Remote Read Traffic
  formula: 100 * SUM(TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_DRAM_sum) / SUM(TCC_EA0_RDREQ_sum)
  unit: Percent
  description: >-
    The percent of read requests generated by the L2 cache that are routed to any
    memory location other than the accelerator's local high-bandwidth memory (HBM)
    - for example, the CPU's DRAM or a remote accelerator's HBM. This breakdown does
    not consider the size of the request (meaning that 32B and 64B requests are both
    counted as a single request), so this metric only approximates the percent of
    the L2-Fabric Read bandwidth directed to a remote location.
fabric.remote_wr_atomic:
  name: Remote Write and Atomic
  formula: SUM(NOISE_CLAMP(TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_DRAM_sum, TCC_EA0_WRREQ_sum)) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update
    32B or 64B of data in any memory location other than the accelerator's local HBM,
    per normalization unit.
fabric.remote_wr_atomic_traffic:
  name: Remote Write and Atomic Traffic
  formula: 100 * SUM(TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_DRAM_sum) / SUM(TCC_EA0_WRREQ_sum)
  unit: Percent
  description: >-
    The percent of read requests generated by the L2 cache that are routed to any
    memory location other than the accelerator's local high-bandwidth memory (HBM)
    - for example, the CPU's DRAM or a remote accelerator's HBM. This breakdown does
    not consider the size of the request (meaning that 32B and 64B requests are both
    counted as a single request), so this metric only approximates the percent of
    the L2-Fabric Read bandwidth directed to a remote location. Note that on current
    CDNA accelerators, such as the MI2XX, requests are only considered atomic by Infinity
    Fabric if they are targeted at fine-grained memory allocations or uncached memory
    allocations.
fabric.uncached_rd_traffic:
  name: Uncached Read Traffic
  formula: 100 * SUM(TCC_EA0_RD_UNCACHED_32B_sum) / SUM(TCC_EA0_RDREQ_sum)
  unit: Percent
  description: >-
    The percent of read requests generated by the L2 cache that are reading from an
    uncached memory allocation. Note, as described in the request flow section, a
    single 64B read request is typically counted as two uncached read requests. So,
    it is possible for the Uncached Read Traffic to reach up to 200% of the total
    number of read requests. This breakdown does not consider the size of the request
    (i.e., 32B and 64B requests are both counted as a single request), so this metric
    only approximates the percent of the L2-Fabric read bandwidth directed to an uncached
    memory location.
fabric.uncached_wr_atomic_traffic:
  name: Uncached Write and Atomic Traffic
  formula: 100 * SUM(TCC_EA0_WR_UNCACHED_32B_sum) / SUM(TCC_EA0_WRREQ_sum)
  unit: Percent
  description: >-
    The percent of write and atomic requests generated by the L2 cache that are targeting
    uncached memory allocations. This breakdown does not consider the size of the
    request (meaning that 32B and 64B requests are both counted as a single request),
    so this metric only approximates the percent of the L2-Fabric read bandwidth directed
    to uncached memory allocations.
fabric.wr_atomic_32b:
  name: Write and Atomic (32B)
  formula: AVG(NOISE_CLAMP((TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) / $denom, TCC_EA0_WRREQ_sum))
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update
    32B of data to any memory location, per normalization unit.
fabric.wr_atomic_64b:
  name: Write and Atomic (64B)
  formula: SUM(TCC_EA0_WRREQ_64B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update
    64B of data in any memory location, per normalization unit.
fabric.wr_atomic_bw:
  name: L2-Fabric Write and Atomic BW
  formula: SUM(TCC_EA0_WRREQ_64B_sum * 64 + (TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes sent by the L2 over the Infinity Fabric interface by write
    and atomic operations per unit time.
  peak: $hbmBandwidth
fabric.wr_atomic_bw_norm:
  name: Write and Atomic BW
  formula: SUM(TCC_EA0_WRREQ_64B_sum * 64 + (TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32) / SUM($denom)
  unit: (Bytes + $normUnit)
  description: >-
    The total number of bytes written by the L2 over Infinity Fabric by write and
    atomic operations divided by total duration. Note that on current CDNA accelerators,
    such as the MI2XX, requests are only considered atomic by Infinity Fabric if they
    are targeted at non-write-cacheable memory, for example, fine-grained memory allocations
    or uncached memory allocations on the MI2XX.
fabric.wr_atomic_uncached:
  name: Write and Atomic (Uncached)
  formula: SUM(TCC_EA0_WR_UNCACHED_32B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update
    32B or 64B of uncached data, per normalization unit.
fabric.wr_credit_starvation:
  name: Write - Credit Starvation
  formula: 100 * SUM(TCC_TOO_MANY_EA_WRREQS_STALL_sum) / SUM(TCC_BUSY_sum)
  unit: Percent
  description: >-
    The number of cycles the L2-Fabric interface was stalled on write or atomic requests
    to any memory location because too many write/atomic requests were currently in
    flight, as a percent of the total active L2 cycles.
fabric.wr_lat:
  name: L2-Fabric Write and Atomic Latency
  formula: SUM(TCC_EA0_WRREQ_LEVEL_sum) / SUM(TCC_EA0_WRREQ_sum)
  unit: Cycles
  description: >-
    The time-averaged number of cycles write requests spent in Infinity Fabric before
    a completion acknowledgement was returned to the L2.
