compute.cu_util:
  name: CU Utilization
  formula: 100 * SUM(SQ_BUSY_CU_CYCLES) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  description: >-
    The percent of total SIMD cycles in the kernel where any SIMD on a CU was actively
    doing any work, summed over all CUs. Low values (less than 100%) indicate that
    the accelerator was not fully saturated by the kernel, or a potential load-imbalance
    issue.
  peak: 100
compute.inst_mix_branch:
  name: Branch Instructions
  formula: SUM(SQ_INSTS_BRANCH) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of branch operations issued. These typically consist of jump
    or branch operations and are used to implement control flow.
compute.inst_mix_salu:
  name: SALU Instructions
  formula: SUM(SQ_INSTS_SALU) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of scalar arithmetic logic unit (SALU) operations issued. Typically
    these are used for address calculations, literal constants, and other operations
    that are provably uniform across a wavefront. Although scalar memory (SMEM) operations
    are issued by the SALU, they are counted separately in this section.
compute.inst_mix_smem:
  name: SMEM Instructions
  formula: SUM(SQ_INSTS_SMEM) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of scalar memory (SMEM) operations issued. These are typically
    used for loading kernel arguments, base-pointers and loads from HIP's __constant__
    memory.
compute.insts_per_wave:
  name: Instructions per Wavefront
  formula: SUM(SQ_INSTS) / SUM(SQ_WAVES)
  unit: Instructions per Wavefront
  description: >-
    The average number of instructions (of all types) executed per wavefront. This
    is averaged over all wavefronts in a kernel dispatch.
compute.ipc:
  name: IPC
  formula: SUM(SQ_INSTS) / SUM(SQ_BUSY_CU_CYCLES)
  unit: Instructions per Cycle
  description: >-
    The ratio of the total number of instructions executed on the CU over the total
    active CU cycles.
  peak: 5
compute.ipc_issued:
  name: IPC (Issued)
  formula: SUM(SQ_INSTS_VALU + SQ_INSTS_VMEM + SQ_INSTS_SALU + SQ_INSTS_SMEM + SQ_INSTS_BRANCH + SQ_INSTS_SENDMSG + SQ_INSTS_VSKIPPED + SQ_INSTS_LDS) / SUM(SQ_ACTIVE_INST_ANY)
  unit: Instructions per Cycle
  description: >-
    The ratio of the total number of (non-internal) instructions issued over the number
    of cycles where the scheduler was actively working on issuing instructions.
compute.mfma_flops_bf16:
  name: MFMA FLOPs (BF16)
  formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_BF16) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
  description: >-
    The total number of 16-bit brain floating point MFMA operations executed per second.
    Note: this does not include any 16-bit brain floating point operations from VALU
    instructions.
  peak: $max_sclk * $cu_per_gpu * 512 / 1000
compute.mfma_flops_f16:
  name: MFMA FLOPs (F16)
  formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F16) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
  description: >-
    The total number of 16-bit floating point MFMA operations executed per second.
    Note: this does not include any 16-bit floating point operations from VALU instructions.
  peak: $max_sclk * $cu_per_gpu * 1024 / 1000
compute.mfma_flops_f32:
  name: MFMA FLOPs (F32)
  formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F32) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
  description: >-
    The total number of 32-bit floating point MFMA operations executed per second.
    Note: this does not include any 32-bit floating point operations from VALU instructions.
  peak: $max_sclk * $cu_per_gpu * 256 / 1000
compute.mfma_flops_f64:
  name: MFMA FLOPs (F64)
  formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F64) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
  description: >-
    The total number of 64-bit floating point MFMA operations executed per second.
    Note: this does not include any 64-bit floating point operations from VALU instructions.
  peak: $max_sclk * $cu_per_gpu * 256 / 1000
compute.mfma_iops_int8:
  name: MFMA IOPs (INT8)
  formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_I8) / SUM(End_Timestamp - Start_Timestamp)
  unit: GIOP/s
  description: >-
    The total number of 8-bit integer MFMA operations executed per second. Note: this
    does not include any 8-bit integer operations from VALU instructions.
  peak: $max_sclk * $cu_per_gpu * 1024 / 1000
compute.salu_util:
  name: SALU Utilization
  formula: 100 * SUM(SQ_ACTIVE_INST_SCA) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  description: >-
    Indicates what percent of the kernel's duration the SALU was busy executing instructions.
    Computed as the ratio of the total number of cycles spent by the scheduler issuing
    SALU or SMEM instructions over the total CU cycles.
  peak: 100
compute.se_util:
  name: Shader Engine Utilization
  formula: 100 * SUM(SQ_BUSY_CYCLES) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $se_per_gpu)
  unit: Percent
  description: >-
    The percent of total shader engine cycles in the kernel where any CU in a shader-engine
    was actively doing any work, normalized over all shader-engines. Low values (e.g.,
    << 100%) indicate that the accelerator was not fully saturated by the kernel,
    or a potential load-imbalance issue.
compute.total_flops:
  name: Performance (GFLOPs)
  formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + 2 * SQ_INSTS_VALU_FMA_F16 + SQ_INSTS_VALU_TRANS_F16 + SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + 2 * SQ_INSTS_VALU_FMA_F32 + SQ_INSTS_VALU_TRANS_F32 + SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + 2 * SQ_INSTS_VALU_FMA_F64 + SQ_INSTS_VALU_TRANS_F64) + SQ_INSTS_VALU_MFMA_MOPS_F16 * 512 + SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512 + SQ_INSTS_VALU_MFMA_MOPS_F32 * 512 + SQ_INSTS_VALU_MFMA_MOPS_F64 * 512) / (SUM(End_Timestamp - Start_Timestamp) / 1e9) / 1e9
  unit: GFLOP/s
  description: >-
    The overall achieved performance, measured in GigaFLOPs per second (GFLOP/s).
    This is calculated as the sum of all VALU and MFMA floating-point operations divided
    by the total execution time. This value is used as the y-coordinate for the kernel's
    point on the Roofline plot.
compute.valu_active_threads:
  name: VALU Active Threads
  formula: SUM(SQ_THREAD_CYCLES_VALU) / SUM(SQ_ACTIVE_INST_VALU)
  unit: Work-items
  description: >-
    Indicates the average level of divergence within a wavefront over the lifetime
    of the kernel. The number of work-items that were active in a wavefront during
    execution of each VALU instruction, time-averaged over all VALU instructions run
    on all wavefronts in the kernel.
  peak: $wave_size
compute.valu_flops_f16:
  name: VALU FLOPs (F16)
  formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + 2 * SQ_INSTS_VALU_FMA_F16 + SQ_INSTS_VALU_TRANS_F16)) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
  description: >-
    The total 16-bit floating-point operations executed per second on the VALU. Note:
    this does not include any F16 operations from MFMA instructions.
compute.valu_flops_f32:
  name: VALU FLOPs (F32)
  formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + 2 * SQ_INSTS_VALU_FMA_F32 + SQ_INSTS_VALU_TRANS_F32)) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
  description: >-
    The total 32-bit floating-point operations executed per second on the VALU. Note:
    this does not include any F32 operations from MFMA instructions.
compute.valu_flops_f64:
  name: VALU FLOPs (F64)
  formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + 2 * SQ_INSTS_VALU_FMA_F64 + SQ_INSTS_VALU_TRANS_F64)) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
  description: >-
    The total 64-bit floating-point operations executed per second on the VALU. Note:
    this does not include any F64 operations from MFMA instructions.
compute.valu_util:
  name: VALU Utilization
  formula: 100 * SUM(SQ_ACTIVE_INST_VALU) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  description: >-
    Indicates what percent of the kernel's duration the VALU was busy executing instructions.
    Does not include VMEM operations. Computed as the ratio of the total number of
    cycles spent by the scheduler issuing VALU instructions over the total CU cycles.
  peak: 100
