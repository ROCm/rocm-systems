wave.active_cycles:
  name: Wavefront Active Cycles
  formula: 4 * SUM(SQ_ACTIVE_INST_ANY) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    The number of cycles wavefronts in the kernel dispatch were actively executing
    instructions, counted per wavefront, so it can include cycles another wavefront was
    executing or stalled. It shows how wavefronts spend their time rather than a precise
    limiter.
wave.cycles:
  name: Wavefront Cycles
  formula: 4 * SUM(SQ_WAVE_CYCLES) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    The number of cycles a wavefront in the kernel dispatch spent resident on a compute
    unit. This is averaged over all wavefronts in a kernel dispatch.
wave.dep_wait_cycles:
  name: Wavefront Dependency Wait Cycles
  formula: 4 * SUM(SQ_WAIT_ANY) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    The number of cycles a wavefront in the kernel dispatch spent resident on a compute
    unit. This is averaged over all wavefronts in a kernel dispatch.
wave.issue_wait_cycles:
  name: Wavefront Issue Wait Cycles
  formula: 4 * SUM(SQ_WAIT_INST_ANY) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    The number of cycles wavefronts in the kernel dispatch could not issue an
    instruction for any reason, for example execution pipe back-pressure or arbitration
    loss, counted per wavefront. It shows how wavefronts spend their time rather than a
    precise limiter.
wave.occupancy:
  name: Wavefront Occupancy
  formula: SUM(SQ_LEVEL_WAVES_ACCUM) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
  unit: Wavefronts
  description: >-
    The time-averaged number of wavefronts resident on the accelerator over the lifetime
    of the kernel. Note: this metric may be inaccurate for short-running kernels (less
    than 1ms).
  peak: $max_waves_per_cu * $cu_per_gpu
wave.occupancy_pct:
  name: Wavefront Occupancy (Percent)
  formula: 100 * SUM(SQ_LEVEL_WAVES_ACCUM) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $numActiveCUs * $max_waves_per_cu)
  unit: Percent
  description: >-
    Percentage of the maximum wavefronts per CU that are resident on active CUs,
    averaged over GPU-active cycles.
wave.restored:
  name: Restored Wavefronts
  formula: AVG(SQ_WAVES_RESTORED)
  unit: Wavefronts
  description: The total number of wavefronts restored from a context-save.
wave.saved:
  name: Saved Wavefronts
  formula: AVG(SQ_WAVES_SAVED)
  unit: Wavefronts
  description: The total number of wavefronts saved at a context-save.
