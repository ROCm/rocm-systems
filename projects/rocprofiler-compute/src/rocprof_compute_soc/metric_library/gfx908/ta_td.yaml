ta.global_rd_insts:
  name: Global/Generic Read Instructions
  formula: SUM(TA_FLAT_READ_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of global & generic memory read instructions executed on all
    compute units on the accelerator, per normalization unit.
ta.global_wr_insts:
  name: Global/Generic Write Instructions
  formula: SUM(TA_FLAT_WRITE_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of global & generic memory write instructions executed on all
    compute units on the accelerator, per normalization unit.
ta.global_atomic_insts:
  name: Global/Generic Atomic Instructions
  formula: SUM(TA_FLAT_ATOMIC_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of global & generic memory atomic (with and without return) instructions
    executed on all compute units on the accelerator, per normalization unit.
ta.spill_rd_insts:
  name: Spill/Stack Read Instructions
  formula: SUM(TA_BUFFER_READ_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of spill/stack memory read instructions executed on all compute
    units on the accelerator, per normalization unit.
ta.spill_wr_insts:
  name: Spill/Stack Write Instructions
  formula: SUM(TA_BUFFER_WRITE_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of spill/stack memory write instructions executed on all compute
    units on the accelerator, per normalization unit.
ta.spill_atomic_insts:
  name: Spill/Stack Atomic Instructions
  formula: SUM(TA_BUFFER_ATOMIC_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of spill/stack memory atomic (with and without return) instructions
    executed on all compute units on the accelerator, per normalization unit. Typically
    unused as these memory operations are typically used to implement thread-local
    storage.
ta.global_insts:
  name: Global/Generic Instructions
  formula: SUM(TA_FLAT_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of global & generic memory instructions executed on all compute
    units on the accelerator, per normalization unit.
ta.spill_insts:
  name: Spill/Stack Instructions
  formula: SUM(TA_BUFFER_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of spill/stack memory instructions executed on all compute units
    on the accelerator, per normalization unit.
ta.busy:
  name: Address Processing Unit Busy
  formula: 100 * SUM(TA_TA_BUSY_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  description: >-
    Percent of the total CU cycles the address processor was busy
ta.address_stall:
  name: Address Stall
  formula: 100 * SUM(TA_ADDR_STALLED_BY_TC_CYCLES_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  description: >-
    Percent of the total CU cycles the address processor was stalled from sending
    address requests further into the vL1D pipeline.
ta.data_stall:
  name: Data Stall
  formula: 100 * SUM(TA_DATA_STALLED_BY_TC_CYCLES_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  description: >-
    Percent of the total CU cycles the address processor was stalled from sending
    write/atomic data further into the vL1D pipeline.
ta.data_processor_address_stall:
  name: "Data-Processor \u2192 Address Stall"
  formula: 100 * SUM(TA_ADDR_STALLED_BY_TD_CYCLES_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  description: >-
    Percent of total CU cycles the address processor was stalled waiting to send command
    data to the data processor.
ta.total_insts:
  name: Total Instructions
  formula: SUM(TA_TOTAL_WAVEFRONTS_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of memory instructions executed by the address processer over
    all compute units on the accelerator, per normalization unit.
ta.spill_stack_total_cycles:
  name: Spill/Stack Total Cycles
  formula: SUM(TA_BUFFER_TOTAL_CYCLES_sum) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    The number of cycles the address processing unit spent working on spill/stack
    instructions, per normalization unit.
ta.spill_stack_coalesced_rd:
  name: Spill/Stack Coalesced Read
  formula: SUM(TA_BUFFER_COALESCED_READ_CYCLES_sum) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    The number of cycles the address processing unit spent working on coalesced spill/stack
    read instructions, per normalization unit.
ta.spill_stack_coalesced_wr:
  name: Spill/Stack Coalesced Write
  formula: SUM(TA_BUFFER_COALESCED_WRITE_CYCLES_sum) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    The number of cycles the address processing unit spent working on coalesced spill/stack
    write instructions, per normalization unit.
td.busy:
  name: Data-Return Busy
  formula: 100 * SUM(TD_TD_BUSY_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  description: >-
    Percent of the total CU cycles the data-return unit was busy processing or waiting
    on data to return to the CU.
td.tc_stall:
  name: "Cache RAM \u2192 Data-Return Stall"
  formula: 100 * SUM(TD_TC_STALL_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  description: >-
    Percent of the total CU cycles the data-return unit was stalled on data to be
    returned from the vL1D Cache RAM.
td.coalescable_insts:
  name: Coalescable Instructions
  formula: SUM(TD_COALESCABLE_WAVEFRONT_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The number of instructions submitted to the data-return unit by the address processor
    that were found to be coalescable, per normalization unit.
td.rd_insts:
  name: Read Instructions
  formula: SUM(TD_LOAD_WAVEFRONT_sum - TD_STORE_WAVEFRONT_sum - TD_ATOMIC_WAVEFRONT_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The number of read instructions submitted to the data-return unit by the address
    processor summed over all compute units on the accelerator, per normalization
    unit. This is expected to be the sum of global/generic and spill/stack reads in
    the address processor.
td.wr_insts:
  name: Write Instructions
  formula: SUM(TD_STORE_WAVEFRONT_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The number of store instructions submitted to the data-return unit by the address
    processor summed over all compute units on the accelerator, per normalization
    unit. This is expected to be the sum of global/generic and spill/stack stores
    in the address processor.
td.atomic_insts:
  name: Atomic Instructions
  formula: SUM(TD_ATOMIC_WAVEFRONT_sum) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The number of atomic instructions submitted to the data-return unit by the address
    processor summed over all compute units on the accelerator, per normalization
    unit. This is expected to be the sum of global/generic and spill/stack atomics
    in the address processor.
