mem.l2_hit_rate:
  name: L2 Cache Hit Rate
  formula: 100 * SUM(TCC_HIT_sum) / SUM(TCC_HIT_sum + TCC_MISS_sum)
  unit: Percent
  description: >-
    The ratio of the number of L2 cache line requests that hit in the L2 cache over
    the total number of incoming cache line requests to the L2 cache.
  peak: 100
mem.l2_bw:
  name: Bandwidth
  formula: 64 * SUM(TCC_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes looked up in the L2 cache per unit time. The number of bytes
    is calculated as the number of cache lines requested multiplied by the cache line
    size. This value does not consider partial requests, so e.g., if only a single
    value is requested in a cache line, the data movement will still be counted as
    a full cache line. This is also presented as a percent of the peak theoretical
    bandwidth achievable on the specific accelerator.
  peak: $max_sclk / 1000 * 64 * TO_INT($total_l2_chan)
mem.fabric_rd_bw:
  name: L2-Fabric Read BW
  formula: SUM(TCC_EA0_RDREQ_32B_sum * 32 + (TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_32B_sum) * 64) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes read by the L2 over the Infinity Fabric interface per unit
    time.
  peak: $hbmBandwidth
mem.fabric_wr_atomic_bw:
  name: L2-Fabric Write and Atomic BW
  formula: SUM(TCC_EA0_WRREQ_64B_sum * 64 + (TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes sent by the L2 over the Infinity Fabric interface by write
    and atomic operations per unit time.
  peak: $hbmBandwidth
mem.fabric_rd_lat:
  name: L2-Fabric Read Latency
  formula: SUM(TCC_EA0_RDREQ_LEVEL_sum) / SUM(TCC_EA0_RDREQ_sum)
  unit: Cycles
  description: >-
    The time-averaged number of cycles read requests spent in Infinity Fabric before
    data was returned to the L2.
mem.fabric_wr_lat:
  name: L2-Fabric Write and Atomic Latency
  formula: SUM(TCC_EA0_WRREQ_LEVEL_sum) / SUM(TCC_EA0_WRREQ_sum)
  unit: Cycles
  description: >-
    The time-averaged number of cycles write requests spent in Infinity Fabric before
    a completion acknowledgement was returned to the L2.
mem.hbm_bw:
  name: HBM Bandwidth
  formula: SUM(TCC_BUBBLE_sum * 128 + TCC_EA0_RDREQ_32B_sum * 32 + (TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) * 64 + (TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32 + TCC_EA0_WRREQ_64B_sum * 64) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The total number of bytes read from and written to High-Bandwidth Memory (HBM)
    per second. The peak empirically measured bandwidth achievable on the specific
    accelerator is displayed alongside for comparison. It reflects peak single-direction
    (read-only) bandwidth, so write-heavy or mixed kernels fall below it.
  peak: $HBMBw_empirical_peak
mem.l2_util:
  name: Utilization
  formula: 100 * SUM(TCC_BUSY_sum) / SUM(TO_INT($total_l2_chan) * $GRBM_GUI_ACTIVE_PER_XCD)
  unit: Percent
  description: >-
    The ratio of the number of cycles an L2 channel was active, summed over all L2
    channels on the accelerator over the total L2 cycles.
mem.l2_peak_bw:
  name: Peak Bandwidth
  formula: 100 * 64 * SUM(TCC_REQ_sum) / SUM(End_Timestamp - Start_Timestamp) / ($max_sclk / 1000 * 64 * TO_INT($total_l2_chan))
  unit: Percent
  description: >-
    The number of bytes looked up in the L2 cache, as a percent of the peak theoretical
    bandwidth achievable on the specific accelerator. The number of bytes is calculated
    as the number of cache lines requested multiplied by the cache line size. This
    value does not consider partial requests, so e.g., if only a single value is requested
    in a cache line, the data movement will still be counted as a full cache line.
mem.hbm_peak_bw:
  name: Peak HBM Bandwidth
  formula: $hbmBandwidth
  unit: GB/s
  description: >-
    Maximum theoretical bandwidth of the accelerator's local high-bandwidth memory
    (HBM) per unit time. This value is calculated as the number of HBM channels multiplied
    by the HBM channel width multiplied by the HBM clock frequency.
mem.fabric_rd_bw_norm:
  name: Read BW
  formula: SUM(TCC_EA0_RDREQ_32B_sum * 32 + (TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_32B_sum) * 64) / SUM($denom)
  unit: (Bytes + $normUnit)
  description: >-
    The total number of bytes read by the L2 cache from Infinity Fabric divided by
    total duration.
mem.fabric_hbm_rd_traffic:
  name: HBM Read Traffic
  formula: 100 * SUM(TCC_EA0_RDREQ_DRAM_sum) / SUM(TCC_EA0_RDREQ_sum)
  unit: Percent
  description: >-
    The percent of read requests generated by the L2 cache that are routed to the
    accelerator's local high-bandwidth memory (HBM). This breakdown does not consider
    the size of the request (meaning that 32B and 64B requests are both counted as
    a single request), so this metric only approximates the percent of the L2-Fabric
    Read bandwidth directed to the local HBM.
mem.fabric_remote_rd_traffic:
  name: Remote Read Traffic
  formula: 100 * SUM(TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_DRAM_sum) / SUM(TCC_EA0_RDREQ_sum)
  unit: Percent
  description: >-
    The percent of read requests generated by the L2 cache that are routed to any
    memory location other than the accelerator's local high-bandwidth memory (HBM)
    - for example, the CPU's DRAM or a remote accelerator's HBM. This breakdown does
    not consider the size of the request (meaning that 32B and 64B requests are both
    counted as a single request), so this metric only approximates the percent of
    the L2-Fabric Read bandwidth directed to a remote location.
mem.fabric_uncached_rd_traffic:
  name: Uncached Read Traffic
  formula: 100 * SUM(TCC_EA0_RD_UNCACHED_32B_sum) / SUM(TCC_EA0_RDREQ_sum)
  unit: Percent
  description: >-
    The percent of read requests generated by the L2 cache that are reading from an
    uncached memory allocation. Note, as described in the request flow section, a
    single 64B read request is typically counted as two uncached read requests. So,
    it is possible for the Uncached Read Traffic to reach up to 200% of the total
    number of read requests. This breakdown does not consider the size of the request
    (i.e., 32B and 64B requests are both counted as a single request), so this metric
    only approximates the percent of the L2-Fabric read bandwidth directed to an uncached
    memory location.
mem.fabric_wr_atomic_bw_norm:
  name: Write and Atomic BW
  formula: SUM(TCC_EA0_WRREQ_64B_sum * 64 + (TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32) / SUM($denom)
  unit: (Bytes + $normUnit)
  description: >-
    The total number of bytes written by the L2 over Infinity Fabric by write and
    atomic operations divided by total duration. Note that on current CDNA accelerators,
    such as the MI2XX, requests are only considered atomic by Infinity Fabric if they
    are targeted at non-write-cacheable memory, for example, fine-grained memory allocations
    or uncached memory allocations on the MI2XX.
mem.fabric_hbm_wr_atomic_traffic:
  name: HBM Write and Atomic Traffic
  formula: 100 * SUM(TCC_EA0_WRREQ_DRAM_sum) / SUM(TCC_EA0_WRREQ_sum)
  unit: Percent
  description: >-
    The percent of write and atomic requests generated by the L2 cache that are routed
    to the accelerator's local high-bandwidth memory (HBM). This breakdown does not
    consider the size of the request (meaning that 32B and 64B requests are both counted
    as a single request), so this metric only approximates the percent of the L2-Fabric
    Write and Atomic bandwidth directed to the local HBM. Note that on current CDNA
    accelerators, such as the MI2XX, requests are only considered atomic by Infinity
    Fabric if they are targeted at fine-grained memory allocations or uncached memory
    allocations.
mem.fabric_remote_wr_atomic_traffic:
  name: Remote Write and Atomic Traffic
  formula: 100 * SUM(TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_DRAM_sum) / SUM(TCC_EA0_WRREQ_sum)
  unit: Percent
  description: >-
    The percent of read requests generated by the L2 cache that are routed to any
    memory location other than the accelerator's local high-bandwidth memory (HBM)
    - for example, the CPU's DRAM or a remote accelerator's HBM. This breakdown does
    not consider the size of the request (meaning that 32B and 64B requests are both
    counted as a single request), so this metric only approximates the percent of
    the L2-Fabric Read bandwidth directed to a remote location. Note that on current
    CDNA accelerators, such as the MI2XX, requests are only considered atomic by Infinity
    Fabric if they are targeted at fine-grained memory allocations or uncached memory
    allocations.
mem.fabric_atomic_traffic:
  name: Atomic Traffic
  formula: 100 * SUM(TCC_EA0_ATOMIC_sum) / SUM(TCC_EA0_WRREQ_sum)
  unit: Percent
  description: >-
    The percent of write requests generated by the L2 cache that are atomic requests
    to any memory location. This breakdown does not consider the size of the request
    (meaning that 32B and 64B requests are both counted as a single request), so this
    metric only approximates the percent of the L2-Fabric Read bandwidth directed
    to a remote location. Note that on current CDNA accelerators, such as the MI2XX,
    requests are only considered atomic by Infinity Fabric if they are targeted at
    fine-grained memory allocations or uncached memory allocations.
mem.fabric_uncached_wr_atomic_traffic:
  name: Uncached Write and Atomic Traffic
  formula: 100 * SUM(TCC_EA0_WR_UNCACHED_32B_sum) / SUM(TCC_EA0_WRREQ_sum)
  unit: Percent
  description: >-
    The percent of write and atomic requests generated by the L2 cache that are targeting
    uncached memory allocations. This breakdown does not consider the size of the
    request (meaning that 32B and 64B requests are both counted as a single request),
    so this metric only approximates the percent of the L2-Fabric read bandwidth directed
    to uncached memory allocations.
mem.fabric_atomic_lat:
  name: Atomic Latency
  formula: SUM(TCC_EA0_ATOMIC_LEVEL_sum) / SUM(TCC_EA0_ATOMIC_sum)
  unit: Cycles
  description: >-
    The time-averaged number of cycles atomic requests spent in Infinity Fabric before
    a completion acknowledgement (atomic without return value) or data (atomic with
    return value) was returned to the L2.
mem.l2_req:
  name: Req
  formula: SUM(TCC_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of incoming requests to the L2 from all clients for all request
    types, per normalization unit.
mem.l2_rd_req:
  name: Read Req
  formula: SUM(TCC_READ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of read requests to the L2 from all clients.
mem.l2_wr_req:
  name: Write Req
  formula: SUM(TCC_WRITE_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of write requests to the L2 from all clients.
mem.l2_atomic_req:
  name: Atomic Req
  formula: SUM(TCC_ATOMIC_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of atomic requests (with and without return) to the L2 from all
    clients.
mem.l2_streaming_req:
  name: Streaming Req
  formula: SUM(TCC_STREAMING_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of incoming requests to the L2 that are marked as streaming.
    The exact meaning of this may differ depending on the targeted accelerator, however
    on an MI2XX this corresponds to non-temporal load or stores. The L2 cache attempts
    to evict streaming requests before normal requests when the L2 is at capacity.
mem.l2_probe_req:
  name: Probe Req
  formula: SUM(TCC_PROBE_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The number of coherence probe requests made to the L2 cache from outside the accelerator.
    On an MI2XX, probe requests may be generated by, for example, writes to fine-grained
    device memory or by writes to coarse-grained device memory.
mem.l2_hits:
  name: Hits
  formula: SUM(TCC_HIT_sum) / SUM($denom)
  unit: (Hits + $normUnit)
  description: >-
    The total number of requests to the L2 from all clients that hit in the cache.
    As noted in the Speed-of-Light section, this includes hit-on-miss requests.
mem.l2_misses:
  name: Misses
  formula: SUM(TCC_MISS_sum) / SUM($denom)
  unit: (Misses + $normUnit)
  description: >-
    The total number of requests to the L2 from all clients that miss in the cache.
    As noted in the Speed-of-Light section, these do not include hit-on-miss requests.
mem.l2_writeback:
  name: Writeback
  formula: SUM(TCC_WRITEBACK_sum) / SUM($denom)
  unit: (Cachelines + $normUnit)
  description: >-
    The total number of L2 cache lines written back to memory for any reason. Write-backs
    may occur due to user code (such as HIP kernel calls to _threadfence_system or
    atomic built-ins) by the command processor's memory acquire/release fences, or
    for other internal hardware reasons.
mem.l2_writeback_internal:
  name: Writeback (Internal)
  formula: SUM(TCC_NORMAL_WRITEBACK_sum) / SUM($denom)
  unit: (Cachelines + $normUnit)
  description: >-
    The total number of L2 cache lines written back to memory for internal hardware
    reasons, per normalization unit.
mem.l2_writeback_vl1d_req:
  name: Writeback (vL1D Req)
  formula: SUM(TCC_ALL_TC_OP_WB_WRITEBACK_sum) / SUM($denom)
  unit: (Cachelines + $normUnit)
  description: >-
    The total number of L2 cache lines written back to memory due to requests initiated
    by the vL1D cache, per normalization unit.
mem.l2_evict_internal:
  name: Evict (Internal)
  formula: SUM(TCC_NORMAL_EVICT_sum) / SUM($denom)
  unit: (Cachelines + $normUnit)
  description: >-
    The total number of L2 cache lines evicted from the cache due to capacity limits,
    per normalization unit.
mem.l2_evict_vl1d_req:
  name: Evict (vL1D Req)
  formula: SUM(TCC_ALL_TC_OP_INV_EVICT_sum) / SUM($denom)
  unit: (Cachelines + $normUnit)
  description: >-
    The total number of L2 cache lines evicted from the cache due to invalidation
    requests initiated by the vL1D cache, per normalization unit.
mem.l2_nc_req:
  name: NC Req
  formula: SUM(TCC_NC_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of requests to the L2 to Not-hardware-Coherent (NC) memory allocations,
    per normalization unit.
mem.l2_uc_req:
  name: UC Req
  formula: SUM(TCC_UC_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of requests to the L2 that go to Uncached (UC) memory allocations.
mem.l2_cc_req:
  name: CC Req
  formula: SUM(TCC_CC_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of requests to the L2 that go to Coherently Cacheable (CC) memory
    allocations.
mem.l2_rw_req:
  name: RW Req
  formula: SUM(TCC_RW_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of requests to the L2 that go to Read-Write coherent memory (RW)
    allocations.
mem.fabric_wr_credit_starvation:
  name: Write - Credit Starvation
  formula: 100 * SUM(TCC_TOO_MANY_EA_WRREQS_STALL_sum) / SUM(TCC_BUSY_sum)
  unit: Percent
  description: >-
    The number of cycles the L2-Fabric interface was stalled on write or atomic requests
    to any memory location because too many write/atomic requests were currently in
    flight, as a percent of the total active L2 cycles.
mem.fabric_rd_32b:
  name: Read (32B)
  formula: SUM(TCC_EA0_RDREQ_32B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read 32B of data from any
    memory location, per normalization unit.
mem.fabric_rd_64b:
  name: Read (64B)
  formula: SUM(TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_32B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read 64B of data from any
    memory location, per normalization unit.
mem.fabric_rd_uncached:
  name: Read (Uncached)
  formula: SUM(TCC_EA0_RD_UNCACHED_32B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read uncached data from
    any memory location, per normalization unit. 64B requests for uncached data are
    counted as two 32B uncached data requests.
mem.fabric_hbm_rd:
  name: HBM Read
  formula: SUM(TCC_EA0_RDREQ_DRAM_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read 32B or 64B of data
    from the accelerator's local HBM, per normalization unit.
mem.fabric_remote_rd:
  name: Remote Read
  formula: SUM(NOISE_CLAMP(TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_DRAM_sum, TCC_EA0_RDREQ_sum)) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to read 32B or 64B of data
    from any source other than the accelerator's local HBM, per normalization unit.
mem.fabric_wr_atomic_32b:
  name: Write and Atomic (32B)
  formula: AVG(NOISE_CLAMP((TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) / $denom, TCC_EA0_WRREQ_sum))
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update
    32B of data to any memory location, per normalization unit.
mem.fabric_wr_atomic_uncached:
  name: Write and Atomic (Uncached)
  formula: SUM(TCC_EA0_WR_UNCACHED_32B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update
    32B or 64B of uncached data, per normalization unit.
mem.fabric_wr_atomic_64b:
  name: Write and Atomic (64B)
  formula: SUM(TCC_EA0_WRREQ_64B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update
    64B of data in any memory location, per normalization unit.
mem.fabric_hbm_wr_atomic:
  name: HBM Write and Atomic
  formula: SUM(TCC_EA0_WRREQ_DRAM_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update
    32B or 64B of data in the accelerator's local HBM, per normalization unit.
mem.fabric_remote_wr_atomic:
  name: Remote Write and Atomic
  formula: SUM(NOISE_CLAMP(TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_DRAM_sum, TCC_EA0_WRREQ_sum)) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to write or atomically update
    32B or 64B of data in any memory location other than the accelerator's local HBM,
    per normalization unit.
mem.fabric_atomic:
  name: Atomic
  formula: SUM(TCC_EA0_ATOMIC_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of L2 requests to Infinity Fabric to atomically update 32B or
    64B of data in any memory location, per normalization unit. See Request flow for
    more detail. Note that on current CDNA accelerators, such as the MI2XX, requests
    are only considered atomic by Infinity Fabric if they are targeted at non-write-cacheable
    memory, such as fine-grained memory allocations or uncached memory allocations
    on the MI2XX.
mem.l2_chan_hit_rate_all:
  name: L2 Cache Hit Rate (Sum over Channels)
  formula: 100 * SUM(TCC_HIT[0] + TCC_HIT[1] + TCC_HIT[2] + TCC_HIT[3] + TCC_HIT[4] + TCC_HIT[5] + TCC_HIT[6] + TCC_HIT[7] + TCC_HIT[8] + TCC_HIT[9] + TCC_HIT[10] + TCC_HIT[11] + TCC_HIT[12] + TCC_HIT[13] + TCC_HIT[14] + TCC_HIT[15] + TCC_HIT[16] + TCC_HIT[17] + TCC_HIT[18] + TCC_HIT[19] + TCC_HIT[20] + TCC_HIT[21] + TCC_HIT[22] + TCC_HIT[23] + TCC_HIT[24] + TCC_HIT[25] + TCC_HIT[26] + TCC_HIT[27] + TCC_HIT[28] + TCC_HIT[29] + TCC_HIT[30] + TCC_HIT[31]) / SUM(TCC_MISS[0] + TCC_HIT[0] + TCC_MISS[1] + TCC_HIT[1] + TCC_MISS[2] + TCC_HIT[2] + TCC_MISS[3] + TCC_HIT[3] + TCC_MISS[4] + TCC_HIT[4] + TCC_MISS[5] + TCC_HIT[5] + TCC_MISS[6] + TCC_HIT[6] + TCC_MISS[7] + TCC_HIT[7] + TCC_MISS[8] + TCC_HIT[8] + TCC_MISS[9] + TCC_HIT[9] + TCC_MISS[10] + TCC_HIT[10] + TCC_MISS[11] + TCC_HIT[11] + TCC_MISS[12] + TCC_HIT[12] + TCC_MISS[13] + TCC_HIT[13] + TCC_MISS[14] + TCC_HIT[14] + TCC_MISS[15] + TCC_HIT[15] + TCC_MISS[16] + TCC_HIT[16] + TCC_MISS[17] + TCC_HIT[17] + TCC_MISS[18] + TCC_HIT[18] + TCC_MISS[19] + TCC_HIT[19] + TCC_MISS[20] + TCC_HIT[20] + TCC_MISS[21] + TCC_HIT[21] + TCC_MISS[22] + TCC_HIT[22] + TCC_MISS[23] + TCC_HIT[23] + TCC_MISS[24] + TCC_HIT[24] + TCC_MISS[25] + TCC_HIT[25] + TCC_MISS[26] + TCC_HIT[26] + TCC_MISS[27] + TCC_HIT[27] + TCC_MISS[28] + TCC_HIT[28] + TCC_MISS[28] + TCC_HIT[29] + TCC_MISS[30] + TCC_HIT[30] + TCC_MISS[31] + TCC_HIT[31])
  unit: Percent
  description: >-
    The percent of total number of requests to the L2 from all clients that hit in
    the cache. As noted in the Speed-of-Light section, this includes hit-on-miss requests.
mem.l2_chan_hit_rate_per_chan:
  name: L2 Cache Hit Rate per Channel
  formula: 100 * TCC_HIT[::_1] / (TCC_HIT[::_1] + TCC_MISS[::_1])
  unit: ''
  description: ''
mem.l2_chan_req_per_normunit:
  name: L2 Requests (per normUnit)
  formula: TO_INT(TCC_REQ[::_1]) / $denom
  unit: ''
  description: ''
mem.l2_chan_rd:
  name: L2 Read
  formula: SUM(TO_INT(TCC_READ[::_1])) / SUM($denom)
  unit: ''
  description: ''
mem.l2_chan_wr:
  name: L2 Write
  formula: SUM(TO_INT(TCC_WRITE[::_1])) / SUM($denom)
  unit: ''
  description: ''
mem.l2_chan_atomic:
  name: L2 Atomic
  formula: SUM(TO_INT(TCC_ATOMIC[::_1])) / SUM($denom)
  unit: ''
  description: ''
mem.l2_chan_fabric_rd:
  name: L2-Fabric Read
  formula: SUM(TO_INT(TCC_EA0_RDREQ[::_1])) / SUM($denom)
  unit: ''
  description: ''
mem.l2_chan_fabric_wr_atomic:
  name: L2-Fabric Write and Atomic
  formula: SUM(TO_INT(TCC_EA0_WRREQ[::_1])) / SUM($denom)
  unit: ''
  description: ''
mem.l2_chan_fabric_atomic:
  name: L2-Fabric Atomic
  formula: SUM(TO_INT(TCC_EA0_ATOMIC[::_1])) / SUM($denom)
  unit: ''
  description: ''
mem.l2_chan_fabric_rd_lat_cycles:
  name: L2-Fabric Read Latency (Cycles)
  formula: TCC_EA0_RDREQ_LEVEL[::_1] / TCC_EA0_RDREQ[::_1]
  unit: ''
  description: ''
mem.l2_chan_fabric_wr_atomic_lat_cycles:
  name: L2-Fabric Write and Atomic Latency (Cycles)
  formula: TCC_EA0_WRREQ_LEVEL[::_1] / TCC_EA0_WRREQ[::_1]
  unit: ''
  description: ''
mem.l2_chan_fabric_atomic_lat_cycles:
  name: L2-Fabric Atomic Latency (Cycles)
  formula: TCC_EA0_ATOMIC_LEVEL[::_1] / TCC_EA0_ATOMIC[::_1] if TCC_EA0_ATOMIC[::_1] != 0 else 0
  unit: ''
  description: ''
mem.l2_chan_fabric_wr_starve:
  name: L2-Fabric Write Starve
  formula: SUM(TO_INT(TCC_TOO_MANY_EA_WRREQS_STALL[::_1])) / SUM($denom)
  unit: ''
  description: ''
mem.l2_chan_fabric_128b_rd_req_per_normunit:
  name: L2-Fabric (128B read requests per normUnit)
  formula: TO_INT(TCC_BUBBLE[::_1]) / $denom
  unit: ''
  description: ''
