sl1d.atomic_req:
  name: sL1D Atomic Requests
  formula: SUM(SQC_DCACHE_ATOMIC) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of atomic requests from sL1D to the L2, per normalization unit.
    Typically unused on current CDNA accelerators.
sl1d.bw:
  name: sL1D Cache BW
  formula: 64 * SUM(SQC_DCACHE_REQ) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes looked up in the sL1D cache per unit time.
  peak: $max_sclk / 1000 * 64 * $sqc_per_gpu
sl1d.bw_util:
  name: sL1D Bandwidth Utilization
  formula: 100000 * SUM(SQC_DCACHE_REQ) / SUM($max_sclk * $sqc_per_gpu * (End_Timestamp - Start_Timestamp))
  unit: Percent
  description: >-
    The number of bytes looked up in the sL1D cache, as a percent of the peak theoretical
    bandwidth. Calculated as the ratio of sL1D requests over the total sL1D cycles.
sl1d.hit_rate_excl_dup:
  name: sL1D Hit Rate (Excluding Duplicate Misses)
  formula: 100 * SUM(SQC_DCACHE_HITS) / SUM(SQC_DCACHE_HITS + SQC_DCACHE_MISSES)
  unit: Percent
  description: >-
    The percent of sL1D requests that hit on a previously loaded line the cache. Calculated
    as the ratio of the number of sL1D requests that hit over the number of all sL1D
    requests.
  peak: 100
sl1d.hit_rate_incl_dup:
  name: sL1D Hit Rate (Including Duplicate Misses)
  formula: 100 * SUM(SQC_DCACHE_HITS) / SUM(SQC_DCACHE_HITS + SQC_DCACHE_MISSES + SQC_DCACHE_MISSES_DUPLICATE)
  unit: Percent
  description: >-
    Indicates the percent of sL1D requests that hit on a previously loaded line the
    cache. The ratio of the number of sL1D requests that hit over the number of all
    sL1D requests.
sl1d.hits:
  name: sL1D Hits
  formula: SUM(SQC_DCACHE_HITS) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of sL1D requests that hit on a previously loaded cache line,
    per normalization unit.
sl1d.hits_per_req:
  name: sL1D Hits per Request
  formula: 100 * SUM(SQC_DCACHE_HITS) / SUM(SQC_DCACHE_REQ)
  unit: Percent
  description: >-
    The percent of sL1D requests that hit on a previously loaded cache line. Calculated
    as the ratio of the number of sL1D requests that hit over the number of all sL1D
    requests.
sl1d.l2_atomic_req:
  name: sL1D-L2 Atomic Requests
  formula: SUM(SQC_TC_DATA_ATOMIC_REQ) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of atomic requests from sL1D to the L2, per normalization unit.
    Typically unused on current CDNA accelerators.
sl1d.l2_bw:
  name: sL1D-L2 BW
  formula: 64 * SUM(SQC_TC_DATA_READ_REQ + SQC_TC_DATA_WRITE_REQ + SQC_TC_DATA_ATOMIC_REQ) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The total number of bytes read from, written to, or atomically updated across
    the sL1D<->L2 interface, divided by total duration. Note that sL1D writes and
    atomics are typically unused on current CDNA accelerators, so in the majority
    of cases this can be interpreted as an sL1D->L2 read bandwidth.
sl1d.l2_bw_util:
  name: sL1D-L2 BW Utilization
  formula: 100000 * SUM(SQC_TC_DATA_READ_REQ + SQC_TC_DATA_WRITE_REQ + SQC_TC_DATA_ATOMIC_REQ) / (2 * SUM($max_sclk * $sqc_per_gpu * (End_Timestamp - Start_Timestamp)))
  unit: Percent
  description: >-
    The percentage of the peak theoretical sL1D - L2 interface bandwidth acheived.
    Calculated as total number of bytes read from, written to, or atomically updated
    across the sL1D - L2 interface.
sl1d.l2_rd_bw:
  name: sL1D_L2 Read BW
  formula: 64 * SUM(SQC_TC_DATA_READ_REQ) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    Bandwidth of read requests from the sL1D cache to the L2 cache per unit time.
sl1d.l2_rd_req:
  name: sL1D-L2 Read Requests
  formula: SUM(SQC_TC_DATA_READ_REQ) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of read requests from sL1D to the L2 per normalization unit.
sl1d.l2_stall_cycles:
  name: Stall Cycles
  formula: SUM(SQC_TC_STALL) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    The total number of cycles the sL1D<->L2 interface was stalled, per normalization
    unit.
sl1d.l2_wr_req:
  name: sL1D-L2 Write Requests
  formula: SUM(SQC_TC_DATA_WRITE_REQ) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of write requests from sL1D to the L2, per normalization unit.
    Typically unused on current CDNA accelerators.
sl1d.misses_duplicated:
  name: Misses- Duplicated
  formula: SUM(SQC_DCACHE_MISSES_DUPLICATE) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of sL1D requests that missed on a cache line that was already
    pending due to another request, per normalization unit.
sl1d.misses_non_duplicated:
  name: sL1D Misses - Non Duplicated
  formula: SUM(SQC_DCACHE_MISSES) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of sL1D requests that missed on a cache line that was not already
    pending due to another request, per normalization unit.
sl1d.rd_req_16_dword:
  name: Read Req (16 DWord)
  formula: SUM(SQC_DCACHE_REQ_READ_16) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of sL1D read requests made for a sixteen dwords of data (64B),
    per normalization unit.
sl1d.rd_req_1_dword:
  name: Read Req (1 DWord)
  formula: SUM(SQC_DCACHE_REQ_READ_1) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of sL1D read requests made for a single dword of data (4B), per
    normalization unit.
sl1d.rd_req_2_dword:
  name: Read Req (2 DWord)
  formula: SUM(SQC_DCACHE_REQ_READ_2) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of sL1D read requests made for a two dwords of data (8B), per
    normalization unit.
sl1d.rd_req_4_dword:
  name: Read Req (4 DWord)
  formula: SUM(SQC_DCACHE_REQ_READ_4) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of sL1D read requests made for a four dwords of data (16B), per
    normalization unit.
sl1d.rd_req_8_dword:
  name: Read Req (8 DWord)
  formula: SUM(SQC_DCACHE_REQ_READ_8) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of sL1D read requests made for a eight dwords of data (32B),
    per normalization unit.
sl1d.rd_req_total:
  name: Read Req (Total)
  formula: SUM(SQC_DCACHE_REQ_READ_1 + SQC_DCACHE_REQ_READ_2 + SQC_DCACHE_REQ_READ_4 + SQC_DCACHE_REQ_READ_8 + SQC_DCACHE_REQ_READ_16) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of sL1D read requests of any size, per normalization unit.
sl1d.req:
  name: sL1D Requests
  formula: SUM(SQC_DCACHE_REQ) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    The total number of requests, of any size or type, made to the sL1D per normalization
    unit.
