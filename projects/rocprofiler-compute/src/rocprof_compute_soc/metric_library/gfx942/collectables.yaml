hbm_read_bandwidth:
  formula: SUM($hbm_read_bytes) / SUM(End_Timestamp - Start_Timestamp)
hbm_read_bytes:
  formula: TCC_BUBBLE_sum * 128 + TCC_EA0_RDREQ_32B_sum * 32 + (TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) * 64
hbm_write_bandwidth:
  formula: SUM($hbm_write_bytes) / SUM(End_Timestamp - Start_Timestamp)
hbm_write_bytes:
  formula: (TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32 + TCC_EA0_WRREQ_64B_sum * 64
l1_bytes:
  formula: 128 * TCP_TOTAL_CACHE_ACCESSES_sum
l2_bytes:
  formula: 128 * (TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum + TCP_TCC_READ_REQ_sum)
mfma_f8_flop_rate:
  formula: SUM($mfma_f8_flops) / SUM(End_Timestamp - Start_Timestamp)
mfma_f8_flops:
  formula: 512 * SQ_INSTS_VALU_MFMA_MOPS_F8
