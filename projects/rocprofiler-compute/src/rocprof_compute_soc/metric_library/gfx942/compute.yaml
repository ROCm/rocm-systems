compute.f8_ops:
  name: F8 OPs
  formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F8) / SUM($denom)
  unit: (FLOPs + $normUnit)
  description: >-
    The total number of 8-bit floating-point operations executed on the MFMA units,
    per normalization unit.
compute.flops_per_norm:
  formula: SUM($valu_f16_flops + $valu_f32_flops + $valu_f64_flops + $mfma_f16_flops + $mfma_bf16_flops + $mfma_f32_flops + $mfma_f64_flops + $mfma_f8_flops) / SUM($denom)
compute.inst_mix_mfma_f8:
  name: MFMA-F8 Instructions
  formula: SUM(SQ_INSTS_VALU_MFMA_F8) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of 8-bit floating point MFMA instructions issued per normalization
    unit. This is supported in AMD Instinct MI300 series and later only.
compute.inst_mix_vmem:
  formula: SUM(SQ_INSTS_VMEM) / SUM($denom)
compute.mfma_flops_bf16:
  peak: $max_sclk * $cu_per_gpu * 2048 / 1000
compute.mfma_flops_f16:
  peak: $max_sclk * $cu_per_gpu * 2048 / 1000
compute.mfma_flops_f8:
  name: MFMA FLOPs (F8)
  formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F8) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
  description: >-
    The total number of 8-bit floating point MFMA operations executed per second.
    It is supported on AMD Instinct MI300 series and later only.
  peak: $max_sclk * $cu_per_gpu * 4096 / 1000
  peak_empirical: $MFMAF8Flops_empirical_peak
compute.mfma_iops_int8:
  peak: $max_sclk * $cu_per_gpu * 4096 / 1000
compute.total_flops:
  formula: $valu_f16_flop_rate + $valu_f32_flop_rate + $valu_f64_flop_rate + $mfma_f16_flop_rate + $mfma_bf16_flop_rate + $mfma_f32_flop_rate + $mfma_f64_flop_rate + $mfma_f8_flop_rate
compute.valu_active_threads:
  peak: $wave_size
compute.vmem_ta_addr_stall:
  description: >-
    The number of cycles the sequencer was stalled waiting to send address requests
    to the address processor due to a full address FIFO, per normalization unit.
compute.vmem_ta_cmd_stall:
  description: >-
    The number of cycles the sequencer was stalled waiting to send commands to the
    address processor due to a full command FIFO, per normalization unit.
compute.vmem_ta_data_stall:
  description: >-
    The number of cycles the sequencer was stalled waiting to send write data to the
    address processor due to a full data FIFO, per normalization unit.
