gl0.ai:
  name: GL0 Arithmetic Intensity
  formula: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / (128 * SUM(TCP_REQ_sum))
  unit: FLOPs/Byte
  description: >-
    Arithmetic intensity relative to GL0 (TCP) requests, at 128 bytes per TCP_REQ as an
    upper bound on GL0 bytes. The FLOP numerator is the VALU FLOPs excluding the WMMA
    instructions already counted in SQ_INSTS_VALU, plus the WMMA FLOPs at 8192 per
    instruction.
gl0.bw:
  name: GL0 Cache Bandwidth
  formula: 128 * SUM(TCP_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second requested from the GL0 vector cache (TCP Cache). Each
    TCP_REQ cache-line request counts as 128 bytes, so this is an upper bound.
  peak_empirical: $L0Bw_empirical_peak
gl0.hit_rate:
  name: GL0 Hit Rate
  formula: 100 * SUM(TCP_REQ_sum - TCP_REQ_MISS_sum) / SUM(TCP_REQ_sum)
  unit: Percent
  description: Percentage of GL0 cache requests that hit in the cache.
gl0.miss_req:
  name: GL0 Miss Requests
  formula: SUM(TCP_REQ_MISS_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of GL0 cache requests that missed and required fetching from GL1. High miss
    counts increase memory access latency. Consider improving data locality or access
    patterns to reduce misses.
gl0.ta_req_stall:
  name: TA Requests Stall
  formula: SUM(TCP_TCP_TA_REQ_STALL_sum) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    Cycles the Texture Addresser was stalled waiting for the GL0 cache to accept
    requests. High stall counts indicate GL0 cache backpressure limiting memory request
    throughput.
gl0.total_req:
  name: GL0 Total Requests
  formula: SUM(TCP_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Total number of requests to the GL0 vector cache, including reads, writes, and
    atomics. This represents the overall memory traffic generated by vector memory
    instructions from the shader cores.
