lds.bank_conflict_rate:
  name: LDS Bank Conflict Rate
  formula: 100 * SUM(SQC_LDS_BANK_CONFLICT_sum) / SUM(SQC_LDS_IDX_ACTIVE_sum)
  unit: Percent
  description: >-
    Percentage of LDS accesses that experienced bank conflicts. Conflicts occur when
    multiple work-items in a wavefront access different addresses in the same LDS
    bank. High conflict rates reduce effective LDS bandwidth. Restructuring data
    layouts can help.
lds.bank_conflicts:
  name: LDS Bank Conflicts
  formula: AVG(SQC_LDS_BANK_CONFLICT_sum)
  unit: Conflicts
  description: >-
    Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
lds.bw:
  name: LDS Bandwidth
  formula: 4 * SUM(SQC_LDS_LOAD_DWORDS_sum + SQC_LDS_STORE_DWORDS_sum + SQC_LDS_ATOMIC_DWORDS_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    LDS byte-access rate from load, store, and atomic dword counters, using four
    bytes per dword.
lds.util:
  name: LDS Utilization
  formula: 100 * SUM(SQC_LDS_IDX_ACTIVE_sum) / (SUM(GRBM_GUI_ACTIVE) * $cu_per_gpu)
  unit: Percent
  description: >-
    Percentage of the LDS cycle budget across all CUs spent servicing indexed
    (non-direct, non-interpolation) accesses, measured over GPU-active cycles. Because
    two CUs share a workgroup processor's LDS, a saturated LDS reads well below 100%
    on this architecture.
