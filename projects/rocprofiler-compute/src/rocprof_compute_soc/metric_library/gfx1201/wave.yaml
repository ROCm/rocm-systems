wave.dispatched_threads:
  name: Dispatched Threads
  formula: AVG(SQ_ITEMS_sum)
  unit: Threads
  description: Total work-items dispatched.
wave.dispatched_wavefronts:
  name: WGP Dispatched Wavefronts
  formula: AVG(SQ_WAVES_sum)
  unit: Wavefronts
  description: Total wavefronts dispatched.
wave.life:
  name: Wavefront Life
  formula: SUM(SQ_WAVE_CYCLES_sum) / SUM(SQ_WAVES_sum)
  unit: Cycles
  description: >-
    Average number of cycles from wavefront creation to completion. Longer wavefront
    life indicates more execution time per wavefront, which may be due to complex
    kernels, memory latency, or synchronization waits.
wave.occupancy_pct:
  name: Wavefront Occupancy (Percent)
  formula: 100 * SUM(SQ_WAVE_CYCLES_sum) / SUM(GRBM_GUI_ACTIVE * $cu_per_gpu * $max_waves_per_cu)
  unit: Percent
  description: >-
    Percentage of the maximum wavefronts per WGP that are resident, averaged over
    GPU-active cycles.
