dispatch.grid_size:
  name: Grid Size
  formula: AVG(Grid_Size)
  unit: Work-items
  description: >-
    Number of work-items in the dispatch grid, from dispatch metadata.
dispatch.lds_allocation:
  name: LDS Allocation
  formula: AVG(LDS_Per_Workgroup)
  unit: Bytes per Workgroup
  description: >-
    The number of bytes of LDS memory (or, shared memory) allocated per workgroup.
    Note: This may also be larger than what was requested at compile time due to
    both allocation granularity and dynamic per-dispatch LDS allocations.
dispatch.scratch_allocation:
  name: Scratch Allocation
  formula: AVG(Scratch_Per_Workitem)
  unit: Bytes per Work-item
  description: >-
    Bytes of scratch memory allocated per work-item, from dispatch metadata.
dispatch.sgprs:
  name: SGPRs
  formula: AVG(SGPR)
  unit: Registers
  description: >-
    Scalar general-purpose registers allocated for the kernel, from dispatch
    metadata. Allocation granularity can increase the reported value above the
    compiler's request.
dispatch.vgprs:
  name: VGPRs
  formula: AVG(Arch_VGPR)
  unit: Registers
  description: >-
    Architectural vector general-purpose registers allocated for the kernel, from
    dispatch metadata. Allocation granularity can increase the reported value above
    the compiler's request.
dispatch.workgroup_size:
  name: Workgroup Size
  formula: AVG(Workgroup_Size)
  unit: Work-items
  description: >-
    Number of work-items per workgroup, from dispatch metadata.
dispatch.workgroups_per_wgp:
  name: Workgroups per WGP
  formula: AVG(Grid_Size / Workgroup_Size) / ($cu_per_gpu / 2)
  unit: Workgroups per WGP
  description: >-
    The number of workgroups in the launch divided by the number of WGPs.
