sl1d.hits_per_req:
  name: sL1D Hit Rate
  formula: 100 * SUM(SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_REQ_sum)
  unit: Percent
  description: Percentage of Scalar Data Cache requests that hit in the cache.
sl1d.load_bw:
  name: sL1D Load Bandwidth
  formula: 4 * SUM(SQC_SMEM_LOAD_DWORDS_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second loaded by scalar memory instructions. The number of
    bytes is the number of dwords each instruction loads multiplied by four;
    bounds-check reductions are ignored.
  peak: '$sqc_per_gpu * 64 * $max_sclk / 1000'
sl1d.req:
  name: sL1D Requests
  formula: SUM(SQC_DCACHE_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: Total Scalar Data Cache requests.
