inherit: ../gfx908/td.yaml
td.spi_stall:
  name: Workgroup manager -> Data-Return Stall
  formula: 100 * SUM(TD_SPI_STALL_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Percent
  description: >-
    Percent of the total CU cycles the data-return unit was stalled by the workgroup
    manager due to initialization of registers as a part of launching new workgroups.
