inherit: ../gfx908/l2.yaml
l2.bw:
  formula: 128 * SUM(TCC_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
l2.chan_fabric_atomic:
  formula: SUM(TO_INT(TCC_EA_ATOMIC[::_1])) / SUM($denom)
l2.chan_fabric_atomic_lat_cycles:
  formula: TCC_EA_ATOMIC_LEVEL[::_1] / TCC_EA_ATOMIC[::_1] if TCC_EA_ATOMIC[::_1] != 0 else 0
l2.chan_fabric_rd:
  formula: SUM(TO_INT(TCC_EA_RDREQ[::_1])) / SUM($denom)
l2.chan_fabric_rd_lat_cycles:
  formula: TCC_EA_RDREQ_LEVEL[::_1] / TCC_EA_RDREQ[::_1]
l2.chan_fabric_wr_atomic:
  formula: SUM(TO_INT(TCC_EA_WRREQ[::_1])) / SUM($denom)
l2.chan_fabric_wr_atomic_lat_cycles:
  formula: TCC_EA_WRREQ_LEVEL[::_1] / TCC_EA_WRREQ[::_1]
l2.peak_bw:
  formula: 100 * 128 * SUM(TCC_REQ_sum) / SUM(End_Timestamp - Start_Timestamp) / ($max_sclk / 1000 * 128 * TO_INT($total_l2_chan))
