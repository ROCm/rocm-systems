l2.ai:
  name: L2 Arithmetic Intensity
  formula: SUM($valu_f16_flops + $valu_f32_flops + $valu_f64_flops + $mfma_f16_flops + $mfma_bf16_flops + $mfma_f32_flops + $mfma_f64_flops) / SUM($l2_bytes)
  unit: FLOPs/Byte
  description: >-
    The Arithmetic Intensity (AI) relative to the L2 Cache. It is the ratio of total
    floating-point operations (FLOPs) to total bytes transferred between the L2 cache
    and the L1 cache.
l2.bw:
  formula: 128 * SUM(TCC_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
l2.peak_bw:
  formula: 100 * 128 * SUM(TCC_REQ_sum) / SUM(End_Timestamp - Start_Timestamp) / ($max_sclk / 1000 * 128 * TO_INT($total_l2_chan))
