remove:
  - fabric.rd_bw_norm
fabric.ai_hbm:
  name: HBM Arithmetic Intensity
  formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + 2 * SQ_INSTS_VALU_FMA_F16 + SQ_INSTS_VALU_TRANS_F16 + SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + 2 * SQ_INSTS_VALU_FMA_F32 + SQ_INSTS_VALU_TRANS_F32 + SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + 2 * SQ_INSTS_VALU_FMA_F64 + SQ_INSTS_VALU_TRANS_F64) + SQ_INSTS_VALU_MFMA_MOPS_F16 * 512 + SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512 + SQ_INSTS_VALU_MFMA_MOPS_F32 * 512 + SQ_INSTS_VALU_MFMA_MOPS_F64 * 512) / SUM(TCC_EA_RDREQ_32B_sum * 32 + (TCC_EA_RDREQ_sum - TCC_EA_RDREQ_32B_sum) * 64 + TCC_EA_WRREQ_64B_sum * 64 + (TCC_EA_WRREQ_sum - TCC_EA_WRREQ_64B_sum) * 32)
  unit: FLOPs/Byte
  description: >-
    The Arithmetic Intensity (AI) relative to High-Bandwidth Memory (HBM). It is the
    ratio of total floating-point operations (FLOPs) to total bytes transferred between
    HBM and the L2 cache.
fabric.atomic:
  formula: SUM(TCC_EA_ATOMIC_sum) / SUM($denom)
fabric.atomic_lat:
  formula: SUM(TCC_EA_ATOMIC_LEVEL_sum) / SUM(TCC_EA_ATOMIC_sum)
fabric.atomic_traffic:
  formula: 100 * SUM(TCC_EA_ATOMIC_sum) / SUM(TCC_EA_WRREQ_sum)
fabric.hbm_bw:
  name: HBM Bandwidth
  formula: SUM(TCC_EA_RDREQ_32B_sum * 32 + (TCC_EA_RDREQ_sum - TCC_EA_RDREQ_32B_sum) * 64 + TCC_EA_WRREQ_64B_sum * 64 + (TCC_EA_WRREQ_sum - TCC_EA_WRREQ_64B_sum) * 32) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The total number of bytes read from and written to High-Bandwidth Memory (HBM)
    per second. It reflects peak single-direction (read-only) bandwidth, so write-heavy
    or mixed kernels fall below it.
  peak_empirical: $HBMBw_empirical_peak
fabric.hbm_rd:
  formula: SUM(TCC_EA_RDREQ_DRAM_sum) / SUM($denom)
fabric.hbm_rd_traffic:
  formula: 100 * SUM(TCC_EA_RDREQ_DRAM_sum) / SUM(TCC_EA_RDREQ_sum)
fabric.hbm_wr_atomic:
  formula: SUM(TCC_EA_WRREQ_DRAM_sum) / SUM($denom)
fabric.hbm_wr_atomic_traffic:
  formula: 100 * SUM(TCC_EA_WRREQ_DRAM_sum) / SUM(TCC_EA_WRREQ_sum)
fabric.rd_32b:
  formula: SUM(TCC_EA_RDREQ_32B_sum) / SUM($denom)
fabric.rd_64b:
  formula: SUM(TCC_EA_RDREQ_sum - TCC_EA_RDREQ_32B_sum) / SUM($denom)
fabric.rd_bw:
  formula: SUM(TCC_EA_RDREQ_32B_sum * 32 + (TCC_EA_RDREQ_sum - TCC_EA_RDREQ_32B_sum) * 64) / SUM(End_Timestamp - Start_Timestamp)
fabric.rd_lat:
  formula: SUM(TCC_EA_RDREQ_LEVEL_sum) / SUM(TCC_EA_RDREQ_sum)
fabric.rd_uncached:
  formula: SUM(TCC_EA_RD_UNCACHED_32B_sum) / SUM($denom)
fabric.remote_rd:
  formula: SUM(NOISE_CLAMP(TCC_EA_RDREQ_sum - TCC_EA_RDREQ_DRAM_sum, TCC_EA_RDREQ_sum)) / SUM($denom)
fabric.remote_rd_traffic:
  formula: 100 * SUM(TCC_EA_RDREQ_sum - TCC_EA_RDREQ_DRAM_sum) / SUM(TCC_EA_RDREQ_sum)
fabric.remote_wr_atomic:
  formula: SUM(NOISE_CLAMP(TCC_EA_WRREQ_sum - TCC_EA_WRREQ_DRAM_sum, TCC_EA_WRREQ_sum)) / SUM($denom)
fabric.remote_wr_atomic_traffic:
  formula: 100 * SUM(TCC_EA_WRREQ_sum - TCC_EA_WRREQ_DRAM_sum) / SUM(TCC_EA_WRREQ_sum)
fabric.uncached_rd_traffic:
  formula: 100 * SUM(TCC_EA_RD_UNCACHED_32B_sum) / SUM(TCC_EA_RDREQ_sum)
fabric.uncached_wr_atomic_traffic:
  formula: 100 * SUM(TCC_EA_WR_UNCACHED_32B_sum) / SUM(TCC_EA_WRREQ_sum)
fabric.wr_atomic_32b:
  formula: AVG(NOISE_CLAMP((TCC_EA_WRREQ_sum - TCC_EA_WRREQ_64B_sum) / $denom, TCC_EA_WRREQ_sum))
fabric.wr_atomic_64b:
  formula: SUM(TCC_EA_WRREQ_64B_sum) / SUM($denom)
fabric.wr_atomic_bw:
  formula: SUM(TCC_EA_WRREQ_64B_sum * 64 + (TCC_EA_WRREQ_sum - TCC_EA_WRREQ_64B_sum) * 32) / SUM(End_Timestamp - Start_Timestamp)
fabric.wr_atomic_uncached:
  formula: SUM(TCC_EA_WR_UNCACHED_32B_sum) / SUM($denom)
fabric.wr_lat:
  formula: SUM(TCC_EA_WRREQ_LEVEL_sum) / SUM(TCC_EA_WRREQ_sum)
