remove:
  - fabric.rd_bw_norm
fabric.ai_hbm:
  name: HBM Arithmetic Intensity
  formula: SUM($valu_f16_flops + $valu_f32_flops + $valu_f64_flops + $mfma_f16_flops + $mfma_bf16_flops + $mfma_f32_flops + $mfma_f64_flops) / SUM($hbm_read_bytes + $hbm_write_bytes)
  unit: FLOPs/Byte
  description: >-
    The Arithmetic Intensity (AI) relative to High-Bandwidth Memory (HBM). It is the
    ratio of total floating-point operations (FLOPs) to total bytes transferred between
    HBM and the L2 cache.
fabric.hbm_bw:
  name: HBM Bandwidth
  formula: SUM(TCC_EA_RDREQ_32B_sum * 32 + (TCC_EA_RDREQ_sum - TCC_EA_RDREQ_32B_sum) * 64 + TCC_EA_WRREQ_64B_sum * 64 + (TCC_EA_WRREQ_sum - TCC_EA_WRREQ_64B_sum) * 32) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The total number of bytes read from and written to High-Bandwidth Memory (HBM) per
    second. Its peak is the single-direction (read-only) bandwidth, so write-heavy or
    mixed kernels fall below it.
  peak_empirical: $HBMBw_empirical_peak
