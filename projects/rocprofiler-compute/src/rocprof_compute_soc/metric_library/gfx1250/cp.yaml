cp.cpc_micro_engine_busy_dispatching_workgroups:
  name: CPC Micro-Engine Busy Dispatching Workgroups
  formula: 100 * SUM(CPC_ME1_DC0_SPI_BUSY_sum) / SUM(CPC_CPC_STAT_BUSY_sum)
  unit: Percent
  description: >-
    Percent of CPC-busy cycles the micro-engine is sending dispatch commands to SPI.
cp.cpc_util:
  name: CPC Utilization
  formula: 100 * SUM(CPC_CPC_STAT_BUSY_sum) / SUM(CPC_ALWAYS_COUNT_sum)
  unit: Percent
  description: >-
    Percentage of GPU-active cycles the CPC is processing compute dispatch packets.
