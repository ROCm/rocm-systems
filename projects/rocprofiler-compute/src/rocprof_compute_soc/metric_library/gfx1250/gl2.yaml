  formula: 32 * SUM(GL2C_EA_RDREQ_CPU_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: Total host CPU read bandwidth between GL2 and EA.
gl2.ea_host_cpu_bw_wr:
  name: GL2-EA Host CPU Bandwidth - Write
  formula: 32 * SUM(GL2C_EA_WRREQ_CPU_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: Total host CPU write bandwidth between GL2 and EA.
gl2.ea_pcie_bw_atomic:
