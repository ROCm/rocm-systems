gl2.ea_wr_lat:
  name: GL2-EA Write Latency
  formula: SUM(GL2C_EA_WRREQ_LEVEL_sum) / SUM(GL2C_EA_WRREQ_sum)
  unit: Cycles
  description: ''
gl2.gl2a_gl2c0_req:
  name: GL2A-GL2C0 Request
  formula: SUM(GL2A_REQ_GL2C0_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Number of requests forwarded by GL2 Arbiter to GL2 Cache partition 0.
gl2.gl2a_gl2c0_req_stall_rate:
  name: GL2A-GL2C0 Request Stall Rate
  formula: 100 * SUM(GL2A_REQ_STALL_GL2C0_sum) / SUM(GL2A_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Arbiter busy cycles when it's stalled forwarding to GL2 Cache
    partition 0.
gl2.gl2a_gl2c1_req:
  name: GL2A-GL2C1 Request
  formula: SUM(GL2A_REQ_GL2C1_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Number of requests forwarded by GL2 Arbiter to GL2 Cache partition 1.
gl2.gl2a_gl2c1_req_stall_rate:
  name: GL2A-GL2C1 Request Stall Rate
  formula: 100 * SUM(GL2A_REQ_STALL_GL2C1_sum) / SUM(GL2A_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Arbiter busy cycles when it's stalled forwarding to GL2 Cache
    partition 1.
gl2.gl2a_gl2c2_req:
  name: GL2A-GL2C2 Request
  formula: SUM(GL2A_REQ_GL2C2_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Number of requests forwarded by GL2 Arbiter to GL2 Cache partition 2.
gl2.gl2a_gl2c2_req_stall_rate:
  name: GL2A-GL2C2 Request Stall Rate
  formula: 100 * SUM(GL2A_REQ_STALL_GL2C2_sum) / SUM(GL2A_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Arbiter busy cycles when it's stalled forwarding to GL2 Cache
    partition 2.
gl2.gl2a_gl2c3_req:
  name: GL2A-GL2C3 Request
  formula: SUM(GL2A_REQ_GL2C3_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: >-
    Number of requests forwarded by GL2 Arbiter to GL2 Cache partition 3.
gl2.gl2a_gl2c3_req_stall_rate:
  name: GL2A-GL2C3 Request Stall Rate
  formula: 100 * SUM(GL2A_REQ_STALL_GL2C3_sum) / SUM(GL2A_BUSY_sum)
  unit: Percent
  description: >-
