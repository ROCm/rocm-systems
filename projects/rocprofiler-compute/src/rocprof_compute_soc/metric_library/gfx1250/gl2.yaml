gl2.ea_req_stall_on_vc3:
  name: GL2-EA Request Stall on VC3
  formula: 100 * SUM(GL2C_EA_REQ_VC3_STALL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles when it's stalled on the GL2 Cache to EA read
    request channel (VC3).
gl2.ea_req_stall_on_vc4:
  name: GL2-EA Request Stall on VC4
  formula: 100 * SUM(GL2C_EA_REQ_VC4_STALL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles when it's stalled on the GL2 Cache to EA write
    request channel (VC4).
gl2.ea_req_stall_on_vc6:
  name: GL2-EA Request Stall on VC6
  formula: 100 * SUM(GL2C_EA_REQ_VC6_STALL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles when it's stalled on the GL2 Cache to EA atomic/priority
