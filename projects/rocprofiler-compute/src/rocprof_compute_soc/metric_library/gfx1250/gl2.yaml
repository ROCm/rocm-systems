    partition 3.
gl2.gl2c0_gl2a_return_stall_rate:
  name: GL2C0-GL2A Return Stall Rate
  formula: 100 * SUM(GL2A_RTN_STALL_GL2C0_sum) / SUM(GL2A_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Arbiter busy cycles GL2 Cache partition 0 cannot return data.
gl2.gl2c1_gl2a_return_stall_rate:
  name: GL2C1-GL2A Return Stall Rate
  formula: 100 * SUM(GL2A_RTN_STALL_GL2C1_sum) / SUM(GL2A_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Arbiter busy cycles GL2 Cache partition 1 cannot return data.
gl2.gl2c2_gl2a_return_stall_rate:
  name: GL2C2-GL2A Return Stall Rate
  formula: 100 * SUM(GL2A_RTN_STALL_GL2C2_sum) / SUM(GL2A_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Arbiter busy cycles GL2 Cache partition 2 cannot return data.
gl2.gl2c3_gl2a_return_stall_rate:
  name: GL2C3-GL2A Return Stall Rate
  formula: 100 * SUM(GL2A_RTN_STALL_GL2C3_sum) / SUM(GL2A_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Arbiter busy cycles GL2 Cache partition 3 cannot return data.
gl2.gl2c_util:
  name: GL2C Utilization
  formula: 100 * SUM(GL2C_BUSY_sum) / SUM(GL2C_CYCLE_sum)
  unit: Percent
  description: Percentage of GL2 Cache cycles when it's busy.
gl2.hit_rate:
  name: GL2 Cache Hit Rate
  formula: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
  unit: Percent
  description: GL2 cache hit rate.
  peak: 100
gl2.lat_fifo_full_stall:
  name: GL2 Latency FIFO Full Stall
  formula: 100 * SUM(GL2C_LATENCY_FIFO_FULL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles stalled due to a full latency FIFO.
gl2.pipeline_stall:
  name: GL2 Pipeline Stall
  formula: 100 * SUM(GL2C_TAG_STALL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles the tag pipeline is stalled.
gl2.source_fifo_full_stall:
  name: GL2 Source FIFO Full Stall
  formula: 100 * SUM(GL2C_SRC_FIFO_FULL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles stalled due to a full source data FIFO.
gl2.tag_stall_cached_ea_fifo_full:
  name: GL2 Tag Stall - Cached EA FIFO Full
  formula: 100 * SUM(GL2C_TAG_CACHED_EA_FIFO_FULL_STALL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles the tag pipeline stalled due to a full cached
    EA FIFO.
gl2.tag_stall_set_full:
  name: GL2 Tag Stall - Set Full
  formula: 100 * SUM(GL2C_TAG_MISS_NOTHING_REPLACEABLE_STALL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles the tag pipeline stalled because no replaceable
    cache line is available.
gl2.tag_stall_writeback_fifo_full:
  name: GL2 Tag Stall - Writeback FIFO Full
  formula: 100 * SUM(GL2C_TAG_WRITEBACK_FIFO_FULL_STALL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles the tag pipeline stalled due to a full writeback
    FIFO.
gl2.util:
  name: GL2 Cache Utilization
  formula: 100 * SUM(GL2A_BUSY_sum) / SUM(GL2A_CYCLE_sum)
  unit: Percent
  description: >-
    Percentage of cycles the GL2 Arbiter is distributing requests across GL2 Cache
    partitions.
