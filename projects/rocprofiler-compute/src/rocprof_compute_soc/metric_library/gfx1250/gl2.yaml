  description: Total PCIe write bandwidth between GL2 and EA.
gl2.ea_rd_lat:
  name: GL2-EA Read Latency
  formula: SUM(GL2C_EA_RDREQ_LEVEL_sum) / SUM(GL2C_EA_RDREQ_sum)
