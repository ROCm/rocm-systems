gl2.ea_atomic_lat:
  name: GL2-EA Atomic Latency
  formula: SUM(GL2C_EA_ATOMIC_LEVEL_sum) / SUM(GL2C_EA_ATOMIC_sum)
  unit: Cycles
  description: ''
gl2.ea_data_stall_on_vc2:
  name: GL2-EA Data Stall on VC2
  formula: 100 * SUM(GL2C_EA_DATA_VC2_STALL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles when it's stalled on the GL2 Cache to EA data
    return channel (VC2).
gl2.ea_data_stall_on_vc3:
  name: GL2-EA Data Stall on VC3
  formula: 100 * SUM(GL2C_EA_DATA_VC3_STALL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles when it's stalled on GL2 Cache to EA data
    channel VC3.
gl2.ea_data_stall_on_vc4:
  name: GL2-EA Data Stall on VC4
  formula: 100 * SUM(GL2C_EA_DATA_VC4_STALL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles when it's stalled on GL2 Cache to EA data
    channel VC4.
gl2.ea_data_stall_on_vc6:
  name: GL2-EA Data Stall on VC6
  formula: 100 * SUM(GL2C_EA_DATA_VC6_STALL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles when it's stalled on GL2 Cache to EA data
    channel VC6.
gl2.ea_data_stall_on_vc7:
  name: GL2-EA Data Stall on VC7
  formula: 100 * SUM(GL2C_EA_DATA_VC7_STALL_sum) / SUM(GL2C_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of GL2 Cache busy cycles when it's stalled on GL2 Cache to EA data
    channel VC7.
gl2.ea_hbm_bw_atomic:
  name: GL2-EA HBM Bandwidth - Atomic
  formula: 32 * SUM(GL2C_EA_ATOMIC_DRAM_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: Total GL2 to Efficiency Arbiter atomic bandwidth.
gl2.ea_hbm_bw_rd:
  name: GL2-EA HBM Bandwidth - Read
  formula: 32 * SUM(GL2C_EA_RDREQ_DRAM_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: Total GL2 to Efficiency Arbiter read bandwidth.
gl2.ea_hbm_bw_wr:
  name: GL2-EA HBM Bandwidth - Write
  formula: 32 * SUM(GL2C_EA_WRREQ_DRAM_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: Total GL2 to Efficiency Arbiter write bandwidth.
gl2.ea_host_cpu_bw_atomic:
