  formula: 32 * SUM(GL2C_EA_ATOMIC_CPU_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: Total host CPU atomic bandwidth between GL2 and EA.
gl2.ea_host_cpu_bw_rd:
