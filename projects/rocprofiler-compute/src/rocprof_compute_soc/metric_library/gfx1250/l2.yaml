l2.ai:
  name: L2 Arithmetic Intensity
  formula: SUM($sp_flops + $wmma_flops) / SUM($gl2_bytes)
  unit: FLOPs/Byte
  description: Arithmetic intensity relative to GL1 bandwidth.
l2.bw:
  name: L2 Cache Bandwidth
  formula: 256 * SUM(GL2C_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes per second looked up in the L2 cache. The number of bytes is
    calculated as the number of cache lines requested multiplied by the cache line size.
    This value does not consider partial requests, so, for example, if only a single
    value is requested in a cache line, the data movement will still be counted as a
    full cache line.
  peak: $max_sclk / 1000 * 256 * TO_INT($total_l2_chan)
