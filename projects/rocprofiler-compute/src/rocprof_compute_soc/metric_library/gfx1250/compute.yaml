compute.valu_iops:
  name: VALU IOPs
  formula: SUM(SP_VALU_IOPS_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GIOP/s
  description: Achieved integer VALU throughput.
  peak: $max_sclk * $cu_per_gpu * 64 / 1000
compute.valu_trans_flops_fp16:
  name: VALU Trans FLOPs (FP16)
  formula: SUM(SP_VALU_FLOPS_FP16_TRANS_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
  description: >-
    Achieved FP16 transcendental (square root, reciprocal, trig) VALU throughput.
    TODO: Double check that transcendental ops are executed within ALU.
  peak: $max_sclk * $cu_per_gpu * 64 / 1000
compute.valu_trans_flops_fp32:
  name: VALU Trans FLOPs (FP32)
