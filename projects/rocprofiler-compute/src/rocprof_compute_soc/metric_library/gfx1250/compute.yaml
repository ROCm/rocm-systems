compute.inst_cache_fetch_lat:
  name: Instruction Cache Fetch Latency
  formula: SUM(SQ_IFETCH_LEVEL_ACCUM) / SUM(SQ_IFETCH_REQS_sum)
  unit: Cycles
  description: >-
    Average latency to fetch instruction from GL1 to Instruction Cache.
  coll_level: SQ_IFETCH_LEVEL
compute.insts_async_load:
  name: Instructions - Async Load
  formula: SUM(SQ_INSTS_ASYNC_LOAD_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of asynchronous memory load instructions (TDM async loads) issued.
compute.insts_async_store:
  name: Instructions - Async Store
  formula: SUM(SQ_INSTS_ASYNC_STORE_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: >-
    Number of asynchronous memory store instructions (TDM async stores) issued.
compute.insts_buffer_load:
  name: Instructions - Buffer Load
  formula: SUM(SQ_INSTS_BUFFER_LOAD_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of buffer load instructions issued.
compute.insts_buffer_store:
  name: Instructions - Buffer Store
  formula: SUM(SQ_INSTS_BUFFER_STORE_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of buffer store instructions issued.
compute.insts_double_precision:
  name: Instructions - Double Precision
  formula: SUM(SQ_INSTS_VALU_DP_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of double-precision VALU instructions issued.
compute.insts_flat_load:
  name: Instructions - Flat Load
  formula: SUM(SQ_INSTS_FLAT_LOAD_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of flat-addressed load instructions issued.
compute.insts_flat_store:
