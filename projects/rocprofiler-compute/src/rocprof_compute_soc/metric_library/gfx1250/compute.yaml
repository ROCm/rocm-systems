  unit: GFLOP/s
  description: Achieved FP64 VALU throughput.
  peak: $max_sclk * $cu_per_gpu * 32 / 1000
compute.valu_fp_operations_fp16:
  name: VALU FP Operations - FP16
  formula: SUM(SP_VALU_FLOPS_FP16_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Total FP16 operations executed by VALU.
compute.valu_fp_operations_fp16_trans:
