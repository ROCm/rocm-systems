compute.insts_internal:
  name: Instructions - Internal
  formula: SUM(SQ_INSTS_INTERNAL_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of internal (non-user-visible) instructions issued.
compute.insts_lds:
  name: Instructions - LDS
  formula: SUM(SQ_INSTS_LDS_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of LDS instructions issued.
compute.insts_lds_atomic_non_return:
  name: Instructions - LDS Atomic Non-Return
