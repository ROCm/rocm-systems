  formula: SUM(SQ_INSTS_TDM_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of Tensor Data Mover instructions issued.
compute.insts_transcendental:
  name: Instructions - Transcendental
  formula: SUM(SQ_INSTS_VALU_TRANS_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of transcendental VALU instructions issued.
compute.insts_valu:
  name: Instructions - VALU
  formula: SUM(SQ_INSTS_VALU_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of VALU instructions issued.
compute.insts_vmem:
  name: Instructions - VMEM
  formula: SUM(SQ_INSTS_TEX_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of VMEM instructions issued.
compute.insts_vmem_atomic_non_return:
  name: Instructions - VMEM Atomic Non-Return
  formula: SUM(SQ_INSTS_TEX_ATOMIC_NORTN_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of non-returning VMEM atomic instructions issued.
compute.insts_vmem_atomic_return:
  name: Instructions - VMEM Atomic Return
  formula: SUM(SQ_INSTS_TEX_ATOMIC_RTN_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of returning VMEM atomic instructions issued.
compute.insts_vmem_flat:
  name: Instructions - VMEM Flat
  formula: SUM(SQ_INSTS_FLAT_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Number of flat-addressed VMEM instructions issued.
compute.ipc:
  name: IPC
  formula: SUM(SQ_INSTS_ALL_sum - SQ_INSTS_INTERNAL_sum) / SUM(SQ_BUSY_CYCLES_sum)
  unit: Instructions per Cycle
  description: Average number of instructions per active WGP cycle.
  peak: 5
compute.pipeline_util_cmacc:
  name: Pipeline Utilization - CMACC
  formula: 100 * SUM(SQ_INST_CYCLES_VALU_CORE_sum) / SUM(SQ_BUSY_CYCLES_sum)
  unit: Percent
  description: >-
    Percentage of WGP-busy cycles the CMACC (FP32/FP16 VALU) pipeline is busy.
compute.pipeline_util_double_precision:
  name: Pipeline Utilization - Double Precision
  formula: 100 * SUM(SQ_INST_CYCLES_VALU_DP_sum) / SUM(SQ_BUSY_CYCLES_sum)
  unit: Percent
  description: Percentage of WGP-busy cycles the FP64 pipeline is busy.
compute.pipeline_util_smacc:
  name: Pipeline Utilization - SMACC
  formula: 100 * SUM(SQ_INST_CYCLES_VALU_SIDE_sum) / SUM(SQ_BUSY_CYCLES_sum)
  unit: Percent
  description: >-
    Percentage of WGP-busy cycles the SMACC (transcendental) pipeline is busy.
compute.pipeline_util_xdl:
  name: Pipeline Utilization - XDL
  formula: 100 * SUM(SQ_INST_CYCLES_VALU_WMMA_sum) / SUM(SQ_BUSY_CYCLES_sum)
  unit: Percent
  description: >-
    Percentage of WGP-busy cycles the XDL (WMMA) pipeline is busy.
compute.tdm_issue_stall_rate:
  name: TDM Issue Stall Rate
  formula: 100 * SUM(SQ_INST_ISSUE_TDM_STALL_sum) / SUM(SQ_BUSY_CYCLES_sum)
  unit: Percent
  description: >-
    Percentage of WGP-busy cycles the TDM pipeline cannot accept a new instruction.
compute.total_flops:
  name: Performance (GFLOPs)
  formula: SUM(SP_VALU_FLOPS_FP16_sum + SP_VALU_FLOPS_FP32_sum + SP_VALU_FLOPS_FP64_sum + SP_VALU_FLOPS_FP16_TRANS_sum + SP_VALU_FLOPS_FP32_TRANS_sum + SP_VALU_FLOPS_FP64_TRANS_sum + SQ_VALU_WMMA_FLOP_FP16_sum * 2048 + SQ_VALU_WMMA_FLOP_BF16_sum * 2048 + SQ_VALU_WMMA_FLOP_FP32_sum * 128 + SQ_VALU_WMMA_FLOP_FP64_sum * 64 + SQ_VALU_WMMA_FLOP_FP8_sum * 4096 + SQ_VALU_WMMA_FLOP_FP6_sum * 8192 + SQ_VALU_WMMA_FLOP_FP4_sum * 8192 + SQ_VALU_WMMA_FLOP_F6F4_sum * 8192) / (SUM(End_Timestamp - Start_Timestamp) / 1e9) / 1e9
  unit: GFLOP/s
  description: >-
    Total achieved compute throughput combining all VALU and WMMA FLOPs.
compute.total_insts:
  name: Total Instructions
  formula: SUM(SQ_INSTS_ALL_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Total instructions issued.
compute.total_lds_insts:
  name: Total LDS Instructions
  formula: SUM(SQ_INSTS_VEC32_LDS_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: Total LDS instructions issued.
compute.valu_flops_fp16:
  name: VALU FLOPs (FP16)
  formula: SUM(SP_VALU_FLOPS_FP16_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
  description: Achieved FP16 VALU throughput.
  peak: $max_sclk * $cu_per_gpu * 128 / 1000
compute.valu_flops_fp32:
  name: VALU FLOPs (FP32)
  formula: SUM(SP_VALU_FLOPS_FP32_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
