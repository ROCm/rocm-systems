dispatch.agprs:
  name: AGPRs
  formula: AVG(Accum_VGPR)
  unit: Registers
  description: Number of accumulation VGPRs allocated per wavefront.
dispatch.grid_size:
  name: Grid Size
  formula: AVG(Grid_Size)
  unit: Work-items
  description: Total number of work-items in the dispatch grid.
dispatch.lds_allocation:
  name: LDS Allocation
  formula: AVG(LDS_Per_Workgroup)
  unit: Bytes per Workgroup
  description: >-
    The number of bytes of LDS memory (or, shared memory) allocated per workgroup. Note:
    This may also be larger than what was requested at compile time due to both
    allocation granularity and dynamic per-dispatch LDS allocations.
dispatch.scratch_allocation:
  name: Scratch Allocation
  formula: AVG(Scratch_Per_Workitem)
  unit: Bytes per Work-item
  description: >-
    The number of bytes of scratch memory per work-item. Scratch memory holds the stack
    and register spills.
dispatch.sgprs:
  name: SGPRs
  formula: AVG(SGPR)
  unit: Registers
  description: >-
    The number of scalar general-purpose registers (SGPRs) allocated per wavefront. On
    this architecture the hardware always allocates 128, whatever the kernel uses, so
    SGPRs do not limit occupancy.
dispatch.vgprs:
  name: VGPRs
  formula: AVG(Arch_VGPR)
  unit: Registers
  description: >-
    The number of architected vector general-purpose registers allocated per wavefront.
    Note: this may not exactly match the number of VGPRs requested by the compiler due
    to allocation granularity.
dispatch.workgroup_size:
  name: Workgroup Size
  formula: AVG(Workgroup_Size)
  unit: Work-items
  description: Number of work-items per workgroup.
dispatch.workgroups_per_wgp:
  name: Workgroups per WGP
  formula: AVG(Grid_Size / Workgroup_Size) / $cu_per_gpu
  unit: Workgroups per WGP
  description: The number of workgroups in the launch divided by the number of WGPs.
