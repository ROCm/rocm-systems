ch.buffer_stall_rate:
  name: Buffer Stall Rate
  formula: 100 * SUM(CHC_STALL_BUFFER_FULL_sum) / SUM(CHC_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of Central Hub Buffer busy cycles when it's stalled due to being full.
ch.cha_chc0_req_stall_rate:
  name: CHA-CHC0 Request Stall Rate
  formula: 100 * SUM(CHA_STALL_CHC0_sum) / SUM(CHA_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of Central Hub Arbiter busy cycles when it's stalled forwarding to
    Central Hub Buffer partition 0.
ch.cha_chc1_req_stall_rate:
  name: CHA-CHC1 Request Stall Rate
  formula: 100 * SUM(CHA_STALL_CHC1_sum) / SUM(CHA_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of Central Hub Arbiter busy cycles when it's stalled forwarding to
    Central Hub Buffer partition 1.
ch.cha_req_path_util:
  name: CHA Request Path Utilization
  formula: 100 * SUM(CHA_REQ_PATH_BUSY_sum) / SUM(CHA_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of Central Hub Arbiter busy cycles when its request path is busy.
ch.cha_return_path_util:
  name: CHA Return Path Utilization
  formula: 100 * SUM(CHA_RET_PATH_BUSY_sum) / SUM(CHA_BUSY_sum)
  unit: Percent
  description: >-
    Percentage of Central Hub Arbiter busy cycles when its return path is busy.
ch.cha_util:
  name: CHA Utilization
  formula: 100 * SUM(CHA_BUSY_sum) / SUM(CHA_CYCLE_sum)
  unit: Percent
  description: >-
    Percentage of cycles Central Hub Arbiter is busy processing memory requests.
ch.chc_bw_rd:
  name: CHC Bandwidth - Read
  formula: SUM(CHC_REQ_READ_32B_sum * 32 + CHC_REQ_READ_64B_sum * 64 + CHC_REQ_READ_128B_sum * 128 + CHC_REQ_READ_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: Read bandwidth through Central Hub Buffer.
ch.chc_bw_wr:
  name: CHC Bandwidth - Write
  formula: 32 * SUM(CHC_REQ_WRITE_32B_DATA_BEATS_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: Write bandwidth through Central Hub Buffer.
ch.chc_gl2_lat_rd:
  name: CHC-GL2 Latency - Read
  formula: SUM(CHC_GL2_REQ_READ_LEVEL_sum) / SUM(CHC_REQ_READ_sum)
  unit: Cycles
  description: ''
ch.chc_gl2_lat_wr:
  name: CHC-GL2 Latency - Write
  formula: SUM(CHC_GL2_REQ_WRITE_LEVEL_sum) / SUM(CHC_REQ_WRITE_sum)
  unit: Cycles
  description: ''
ch.chc_return_arbitration_lat:
  name: CHC Return Arbitration Latency
  formula: SUM(CHC_ARB_RET_LEVEL_sum) / SUM(CHC_REQ_sum)
  unit: Cycles
  description: ''
ch.chc_util:
  name: CHC Utilization
  formula: 100 * SUM(CHC_BUSY_sum) / SUM(CHC_CYCLE_sum)
  unit: Percent
  description: >-
    Percentage of cycles Central Hub Arbiter is busy processing memory requests.
ch.req_lat:
  name: CHA Request Latency
  formula: SUM(CHA_REQ_INFLIGHT_LEVEL_sum) / SUM(CHA_ARB_REQUESTS_sum)
  unit: Cycles
  description: ''
ch.total_req:
  name: CHC Total Requests
  formula: SUM(CHC_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: Total Central Hub Buffer requests.
ch.total_req_128b_rd:
  name: CHC Total Requests - 128B Read
  formula: SUM(CHC_REQ_READ_128B_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: Number of 128-byte Central Hub Buffer read requests.
