  metrics:
  - compute.wmma_flops_fp16
  - compute.wmma_flops_bf16
  - compute.wmma_flops_fp8
  - compute.wmma_flops_mxfp8
  - compute.wmma_flops_fp6
  - compute.wmma_flops_fp4
  - compute.wmma_iops_int8
gl1_cache_util:
