wave.dispatched_threads:
  name: Dispatched Threads
  formula: AVG(SQG_ITEMS_sum)
  unit: Threads
  description: Total work-items dispatched.
wave.dispatched_wavefronts:
  name: WGP Dispatched Wavefronts
  formula: AVG(SQG_WAVES_sum)
  unit: Wavefronts
  description: Total wavefronts dispatched.
wave.life:
  name: Wavefront Life
  formula: SUM(SQG_WAVE_CYCLES_sum) / SUM(SQG_WAVES_sum)
  unit: Cycles
  description: Average wavefront lifetime in cycles.
wave.occupancy:
  name: Wavefront Occupancy
  formula: SUM(SQG_WAVE_CYCLES_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
  unit: Wavefronts
  description: Average number of wavefronts in flight on GPU.
  peak: $max_waves_per_cu * $cu_per_gpu
wave.occupancy_pct:
  name: Wavefront Occupancy (Percent)
  formula: 100 * SUM(SQG_WAVE_CYCLES_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu * $max_waves_per_cu)
  unit: Percent
  description: >-
    Resident wavefronts per WGP, averaged over GPU-active cycles, as a percent of
    the maximum wavefronts per WGP.
