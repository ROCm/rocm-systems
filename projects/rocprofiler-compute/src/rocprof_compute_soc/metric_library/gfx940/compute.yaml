inherit: ../gfx90a/compute.yaml
compute.f8_ops:
  name: F8 OPs
  formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F8) / SUM($denom)
  unit: (FLOPs + $normUnit)
  description: >-
    The total number of 8-bit floating-point operations executed on the MFMA units,
    per normalization unit.
compute.flops_per_norm:
  formula: SUM(64 * (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + SQ_INSTS_VALU_TRANS_F16 + SQ_INSTS_VALU_FMA_F16 * 2) + 512 * SQ_INSTS_VALU_MFMA_MOPS_F8 + 512 * SQ_INSTS_VALU_MFMA_MOPS_F16 + 512 * SQ_INSTS_VALU_MFMA_MOPS_BF16 + 64 * (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + SQ_INSTS_VALU_TRANS_F32 + SQ_INSTS_VALU_FMA_F32 * 2) + 512 * SQ_INSTS_VALU_MFMA_MOPS_F32 + 64 * (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + SQ_INSTS_VALU_TRANS_F64 + SQ_INSTS_VALU_FMA_F64 * 2) + 512 * SQ_INSTS_VALU_MFMA_MOPS_F64) / SUM($denom)
compute.inst_mix_mfma_f8:
  name: MFMA-F8 Instructions
  formula: SUM(SQ_INSTS_VALU_MFMA_F8) / SUM($denom)
  unit: (Instructions + $normUnit)
  description: >-
    The total number of 8-bit floating point MFMA instructions issued per normalization
    unit. This is supported in AMD Instinct MI300 series and later only.
compute.inst_mix_vmem:
  formula: SUM(SQ_INSTS_VMEM) / SUM($denom)
compute.mfma_flops_bf16:
  peak: $max_sclk * $cu_per_gpu * 2048 / 1000
compute.mfma_flops_f16:
  peak: $max_sclk * $cu_per_gpu * 2048 / 1000
compute.mfma_flops_f8:
  name: MFMA FLOPs (F8)
  formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F8) / SUM(End_Timestamp - Start_Timestamp)
  unit: GFLOP/s
  description: >-
    The total number of 8-bit floating point MFMA operations executed per second.
    It is supported on AMD Instinct MI300 series and later only.
  peak: $max_sclk * $cu_per_gpu * 4096 / 1000
  peak_empirical: $MFMAF8Flops_empirical_peak
compute.mfma_iops_int8:
  peak: $max_sclk * $cu_per_gpu * 4096 / 1000
compute.total_flops:
  formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + 2 * SQ_INSTS_VALU_FMA_F16 + SQ_INSTS_VALU_TRANS_F16 + SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + 2 * SQ_INSTS_VALU_FMA_F32 + SQ_INSTS_VALU_TRANS_F32 + SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + 2 * SQ_INSTS_VALU_FMA_F64 + SQ_INSTS_VALU_TRANS_F64) + SQ_INSTS_VALU_MFMA_MOPS_F16 * 512 + SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512 + SQ_INSTS_VALU_MFMA_MOPS_F32 * 512 + SQ_INSTS_VALU_MFMA_MOPS_F64 * 512 + SQ_INSTS_VALU_MFMA_MOPS_F8 * 512) / (SUM(End_Timestamp - Start_Timestamp) / 1e9) / 1e9
compute.valu_active_threads:
  peak: $wave_size
