inherit: ../gfx90a/vl1d.yaml
vl1d.access_lat: !remove
vl1d.ai:
  formula: ( SUM( ($wave_size * ( (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + (2 * SQ_INSTS_VALU_FMA_F16) + SQ_INSTS_VALU_TRANS_F16) + (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + (2 * SQ_INSTS_VALU_FMA_F32) + SQ_INSTS_VALU_TRANS_F32) + (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + (2 * SQ_INSTS_VALU_FMA_F64) + SQ_INSTS_VALU_TRANS_F64) )) + (SQ_INSTS_VALU_MFMA_MOPS_F16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F32 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F64 * 512) + ) / (64 * SUM(TCP_TOTAL_CACHE_ACCESSES_sum)) )
vl1d.bw_util:
  formula: 100 * 128 * SUM(TCP_TOTAL_CACHE_ACCESSES_sum) / SUM(End_Timestamp - Start_Timestamp) / ($max_sclk / 1000 * 128 * $cu_per_gpu)
vl1d.cache_bw:
  peak: !remove
vl1d.cache_bw_128b:
  name: vL1D Cache BW (128-Byte Accesses)
  formula: 128 * SUM(TCP_TOTAL_CACHE_ACCESSES_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes looked up in the vL1D cache as a result of VMEM instructions
    per unit time. The number of bytes is calculated as the number of cache lines
    requested multiplied by the cache line size. This value does not consider partial
    requests, so e.g., if only a single value is requested in a cache line, the data
    movement will still be counted as a full cache line.
  peak: $max_sclk / 1000 * 128 * $cu_per_gpu
vl1d.l2_bw_by_size:
  name: vL1D-L2 Bandwidth (by Request Size)
  formula: SUM(128 * TCP_TCC_READ_REQ_sum + 64 * (TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum)) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The number of bytes transferred across the vL1D-L2 interface as a result of VMEM
    instructions, divided by total duration. The number of bytes is calculated as
    the number of cache lines requested multiplied by the cache line size. This value
    does not consider partial requests, so for instance, if only a single value is
    requested in a cache line, the data movement will still be counted as a full cache
    line.
vl1d.l2_rd_lat: !remove
vl1d.l2_wr_lat: !remove
