dispatch.grid_size:
  name: Grid Size
  formula: AVG(Grid_Size)
  unit: Work-items
  description: Work-items in the dispatch grid, from dispatch metadata.
dispatch.lds_allocation:
  name: LDS Allocation
  formula: AVG(LDS_Per_Workgroup)
  unit: Bytes per Workgroup
  description: >-
    Bytes of LDS allocated per workgroup. Allocation granularity and dynamic
    per-dispatch allocations can increase this above the compile-time request.
dispatch.scratch_allocation:
  name: Scratch Allocation
  formula: AVG(Scratch_Per_Workitem)
  unit: Bytes per Work-item
  description: >-
    Bytes of scratch memory requested per work-item for stack memory and
    register spills and restores.
dispatch.sgprs:
  name: SGPRs
  formula: AVG(SGPR)
  unit: Registers
  description: >-
    Scalar general-purpose registers allocated for the kernel. Allocation
    granularity can increase this above the compiler request.
dispatch.vgprs:
  name: VGPRs
  formula: AVG(Arch_VGPR)
  unit: Registers
  description: >-
    Architected vector general-purpose registers allocated for the kernel.
    Allocation granularity can increase this above the compiler request.
dispatch.workgroup_size:
  name: Workgroup Size
  formula: AVG(Workgroup_Size)
  unit: Work-items
  description: Work-items per workgroup, from dispatch metadata.
dispatch.workgroups_per_wgp:
  name: Workgroups per WGP
  formula: AVG(Grid_Size / Workgroup_Size) / ($cu_per_gpu / 2)
  unit: Workgroups per WGP
  description: Number of workgroups in the launch for each WGP.
