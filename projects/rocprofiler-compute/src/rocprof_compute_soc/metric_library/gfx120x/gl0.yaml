gl0.ai:
  name: GL0 Arithmetic Intensity
  formula: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / (128 * SUM(TCP_REQ_sum))
  unit: FLOPs/Byte
  description: >-
    Floating-point operations per byte requested between the WGP and GL0. Each
    GL0 request counts as 128 bytes.
gl0.bw:
  name: GL0 Cache Bandwidth
  formula: 128 * SUM(TCP_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    The lookup bandwidth between the WGP and GL0. Each GL0 request counts as 128
    bytes.
  peak_empirical: $L0Bw_empirical_peak
gl0.hit_rate:
  name: GL0 Hit Rate
  formula: 100 * SUM(TCP_REQ_sum - TCP_REQ_MISS_sum) / SUM(TCP_REQ_sum)
  unit: Percent
  description: Percentage of GL0 requests that hit.
  peak: 100
gl0.miss_req:
  name: GL0 Miss Requests
  formula: SUM(TCP_REQ_MISS_sum) / SUM($denom)
  unit: (Count + $normUnit)
  description: GL0 requests that missed and were sent toward GL1.
gl0.ta_req_stall:
  name: TA Requests Stall
  formula: SUM(TCP_TCP_TA_REQ_STALL_sum) / SUM($denom)
  unit: (Cycles + $normUnit)
  description: >-
    Cycles the Texture Addresser was stalled waiting for GL0 to accept requests.
gl0.total_req:
  name: GL0 Total Requests
  formula: SUM(TCP_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: Requests to GL0, including reads, writes, and atomics.
