wave.dispatched_threads:
  name: Dispatched Threads
  formula: AVG(SQ_ITEMS_sum)
  unit: Threads
  description: Work-items dispatched.
wave.dispatched_wavefronts:
  name: WGP Dispatched Wavefronts
  formula: AVG(SQ_WAVES_sum)
  unit: Wavefronts
  description: Wavefronts dispatched.
wave.life:
  name: Wavefront Life
  formula: SUM(SQ_WAVE_CYCLES_sum) / SUM(SQ_WAVES_sum)
  unit: Cycles
  description: >-
    Average Sequencer cycles from wavefront creation to completion.
wave.occupancy:
  name: Wavefront Occupancy
  formula: SUM(SQ_WAVE_CYCLES_sum) / SUM(GRBM_GUI_ACTIVE)
  unit: Wavefronts
  description: >-
    Average number of wavefronts resident during GPU-active cycles.
  peak: '$max_waves_per_cu * $cu_per_gpu'
wave.occupancy_pct:
  name: Wavefront Occupancy (Percent)
  formula: 100 * SUM(SQ_WAVE_CYCLES_sum) / SUM(GRBM_GUI_ACTIVE * $cu_per_gpu * $max_waves_per_cu)
  unit: Percent
  description: >-
    Resident wavefronts per WGP as a percentage of the maximum wavefronts per
    WGP, averaged over GPU-active cycles.
