sl1d.hits_per_req:
  name: sL1D Hit Rate
  formula: 100 * SUM(SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_REQ_sum)
  unit: Percent
  description: Percentage of scalar data cache accesses that hit in cache.
  peak: 100
sl1d.load_bw:
  name: sL1D Load Bandwidth
  formula: 4 * SUM(SQC_SMEM_LOAD_DWORDS_sum) / SUM(End_Timestamp - Start_Timestamp)
  unit: GB/s
  description: >-
    Bytes loaded by scalar memory instructions, from the dwords each
    instruction loads.
  peak: '$sqc_per_gpu * 64 * $max_sclk / 1000'
sl1d.req:
  name: sL1D Requests
  formula: SUM(SQC_DCACHE_REQ_sum) / SUM($denom)
  unit: (Requests + $normUnit)
  description: Scalar data cache requests after bank serialization.
