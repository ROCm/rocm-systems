Panel Config:
  id: 1300
  alias: gl2
  title: GL2 Cache (L2)
  data source:
  - metric_table:
      id: 1310
      title: GL2 Cache Request Statistics
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Total Requests:
          avg: SUM(GL2C_REQ_sum) / SUM($denom)
          min: MIN(GL2C_REQ_sum / $denom)
          max: MAX(GL2C_REQ_sum / $denom)
          unit: (Count + $normUnit)
        Read Requests:
          avg: SUM(GL2C_READ_sum) / SUM($denom)
          min: MIN(GL2C_READ_sum / $denom)
          max: MAX(GL2C_READ_sum / $denom)
          unit: (Count + $normUnit)
        Write Requests:
          avg: SUM(GL2C_WRITE_sum) / SUM($denom)
          min: MIN(GL2C_WRITE_sum / $denom)
          max: MAX(GL2C_WRITE_sum / $denom)
          unit: (Count + $normUnit)
        Atomic Requests:
          avg: SUM(GL2C_ATOMIC_sum) / SUM($denom)
          min: MIN(GL2C_ATOMIC_sum / $denom)
          max: MAX(GL2C_ATOMIC_sum / $denom)
          unit: (Count + $normUnit)
        EA Read Requests (Memory):
          avg: SUM(GL2C_EA_RDREQ_DRAM_sum) / SUM($denom)
          min: MIN(GL2C_EA_RDREQ_DRAM_sum / $denom)
          max: MAX(GL2C_EA_RDREQ_DRAM_sum / $denom)
          unit: (Count + $normUnit)
        EA Write Requests (Memory):
          avg: SUM(GL2C_EA_WRREQ_DRAM_sum) / SUM($denom)
          min: MIN(GL2C_EA_WRREQ_DRAM_sum / $denom)
          max: MAX(GL2C_EA_WRREQ_DRAM_sum / $denom)
          unit: (Count + $normUnit)
  - metric_table:
      id: 1311
      title: GL2 Cache Performance
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL2 Cache Hit Rate:
          avg: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
          min: MIN(100 * GL2C_HIT_sum / (GL2C_HIT_sum + GL2C_MISS_sum))
          max: MAX(100 * GL2C_HIT_sum / (GL2C_HIT_sum + GL2C_MISS_sum))
          unit: Percent
        GL2 Cache Hits:
          avg: SUM(GL2C_HIT_sum) / SUM($denom)
          min: MIN(GL2C_HIT_sum / $denom)
          max: MAX(GL2C_HIT_sum / $denom)
          unit: (Count + $normUnit)
        GL2 Cache Misses:
          avg: SUM(GL2C_MISS_sum) / SUM($denom)
          min: MIN(GL2C_MISS_sum / $denom)
          max: MAX(GL2C_MISS_sum / $denom)
          unit: (Count + $normUnit)
  metrics_description:
    Total Requests: >-
      Requests to GL2.
    Read Requests: >-
      Read requests to GL2.
    Write Requests: >-
      Write requests to GL2, including stores and writebacks from GL1.
    Atomic Requests: >-
      Atomic requests processed by GL2.
    EA Read Requests (Memory): >-
      GL2 read requests over the Efficiency Arbiter destined for memory.
      Requests served by Infinity Cache are included.
    EA Write Requests (Memory): >-
      GL2 write requests over the Efficiency Arbiter destined for memory.
      Requests absorbed by Infinity Cache are included.
    GL2 Cache Hit Rate: >-
      Percentage of GL2 lookups that hit.
    GL2 Cache Hits: >-
      GL2 requests that hit.
    GL2 Cache Misses: >-
      GL2 requests that missed and were sent through the Efficiency Arbiter.
