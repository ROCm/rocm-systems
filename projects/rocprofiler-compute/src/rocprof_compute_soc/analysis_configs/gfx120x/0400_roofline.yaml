Panel Config:
  id: 400
  title: Roofline
  data source:
  - metric_table:
      id: 401
      title: Roofline Performance Rates
      header:
        metric: Metric
        value: Value
        unit: Unit
        peak: Peak (Empirical)
      metric:
        VALU FLOPs:
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum)) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $FP32Flops_empirical_peak
        WMMA FLOPs (FP16):
          value: 8192 * SUM(SQ_WMMA_VALU_INSTS_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $WMMAF16Flops_empirical_peak
        VALU FLOPs (F64):
          value: SUM($wave_size * SQ_INSTS_VALU_DP_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $FP64Flops_empirical_peak
        GL0 Cache BW (TCP Cache):
          value: 128 * SUM(TCP_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
          peak: $L0Bw_empirical_peak * 1e9
        LDS BW:
          value: SUM((SQC_LDS_IDX_ACTIVE_sum - SQC_LDS_BANK_CONFLICT_sum) * 4 * $lds_banks_per_cu) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
          peak: $LDSBw_empirical_peak * 1e9
        L2 to Memory BW:
          value: 32 * SUM(GL2C_EA_RDREQ_DRAM_32B_sum + GL2C_EA_WRREQ_DRAM_32B_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
          peak: $VRAMBw_empirical_peak * 1e9

  - metric_table:
      id: 402
      title: Roofline Plot Points
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        AI L0:
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / (128 * SUM(TCP_REQ_sum))
          unit: FLOPs/Byte
        AI LDS:
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / SUM((SQC_LDS_IDX_ACTIVE_sum - SQC_LDS_BANK_CONFLICT_sum) * 4 * $lds_banks_per_cu)
          unit: FLOPs/Byte
        AI VRAM:
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / (32 * SUM(GL2C_EA_RDREQ_DRAM_32B_sum + GL2C_EA_WRREQ_DRAM_32B_sum))
          unit: FLOPs/Byte
        Performance (GFLOPs):
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9) / 1e9
          unit: GFLOP/s

  metrics_description:
    VALU FLOPs: >-
      Estimated floating-point operations per second on the vector ALU, excluding WMMA.
      It can read above or below the true rate.
    WMMA FLOPs (FP16): >-
      Estimated matrix floating-point operations per second across all WMMA data types
      (FP16, BF16, FP8, and BF8), so the rate is not FP16-only.
    VALU FLOPs (F64): >-
      Estimated 64-bit floating-point operations per second on the vector ALU. It can
      read above or below the true rate.
    GL0 Cache BW (TCP Cache): >-
      Bandwidth requested from the GL0 vector cache (TCP Cache). It is an upper bound.
    LDS BW: >-
      Achieved bandwidth for Local Data Share memory operations.
    L2 to Memory BW: >-
      Bandwidth of read and write requests leaving L2 toward memory. It includes
      requests the Infinity Cache serves, so it can exceed the true VRAM traffic and the
      measured VRAM peak.
    AI L0: >-
      Floating-point operations per byte requested from the GL0 vector cache (TCP). It
      can read low, because the GL0 bytes are an upper bound.
    AI LDS: >-
      Arithmetic intensity relative to Local Data Share traffic.
    AI VRAM: >-
      Floating-point operations per byte requested from L2 toward memory. Requests the
      Infinity Cache serves are included, so this can be lower than the true VRAM
      intensity.
    Performance (GFLOPs): >-
      Estimated floating-point operations per second on the vector ALU and WMMA
      combined.
