Panel Config:
  id: 400
  title: Roofline
  data source:
  - metric_table:
      id: 401
      title: Roofline Performance Rates
      header:
        metric: Metric
        value: Value
        unit: Unit
        peak: Peak (Empirical)
      metric:
        VALU FLOPs:
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum)) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $FP32Flops_empirical_peak
        WMMA FLOPs (FP16):
          value: 8192 * SUM(SQ_WMMA_VALU_INSTS_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $WMMAF16Flops_empirical_peak
        VALU FLOPs (F64):
          value: SUM($wave_size * SQ_INSTS_VALU_DP_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $FP64Flops_empirical_peak
        GL0 Cache BW (TCP Cache):
          value: 128 * SUM(TCP_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
          peak: $L0Bw_empirical_peak * 1e9
        LDS BW:
          value: SUM((SQC_LDS_IDX_ACTIVE_sum - SQC_LDS_BANK_CONFLICT_sum) * 4 * $lds_banks_per_cu) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
          peak: $LDSBw_empirical_peak * 1e9
        L2 to Memory BW:
          value: 32 * SUM(GL2C_EA_RDREQ_DRAM_32B_sum + GL2C_EA_WRREQ_DRAM_32B_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
          peak: $VRAMBw_empirical_peak * 1e9

  - metric_table:
      id: 402
      title: Roofline Plot Points
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        AI L0:
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / (128 * SUM(TCP_REQ_sum))
          unit: FLOPs/Byte
        AI LDS:
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / SUM((SQC_LDS_IDX_ACTIVE_sum - SQC_LDS_BANK_CONFLICT_sum) * 4 * $lds_banks_per_cu)
          unit: FLOPs/Byte
        AI VRAM:
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / (32 * SUM(GL2C_EA_RDREQ_DRAM_32B_sum + GL2C_EA_WRREQ_DRAM_32B_sum))
          unit: FLOPs/Byte
        Performance (GFLOPs):
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9) / 1e9
          unit: GFLOP/s

  metrics_description:
    VALU FLOPs: >-
      Estimated floating-point operations on the vector ALU, excluding Wave
      Matrix Multiply Accumulate. Each VALU instruction counts as wavefront-size
      FLOPs.
    WMMA FLOPs (FP16): >-
      Estimated matrix floating-point operations from Wave Matrix Multiply
      Accumulate instructions of every data type (FP16, BF16, FP8, and BF8).
      Each instruction counts as 8192 FLOPs. This is not an FP16-only count.
    VALU FLOPs (F64): >-
      Estimated 64-bit floating-point operations on the vector ALU. Each
      double-precision VALU instruction counts as wavefront-size FLOPs.
    GL0 Cache BW (TCP Cache): >-
      The lookup bandwidth between the WGP and GL0. Each GL0 request counts as
      128 bytes.
    LDS BW: >-
      The bandwidth between the WGP and LDS for indexed accesses after bank-
      conflict stalls. Each bank access counts as 4 bytes.
    L2 to Memory BW: >-
      The read and write bandwidth from GL2 toward memory over the Efficiency
      Arbiter. Each counted request is 32 bytes. Requests served by Infinity
      Cache are included.
    AI L0: >-
      Floating-point operations per byte requested between the WGP and GL0. Each
      GL0 request counts as 128 bytes.
    AI LDS: >-
      Floating-point operations per byte transferred between the WGP and LDS
      for indexed accesses after bank-conflict stalls.
    AI VRAM: >-
      Floating-point operations per byte requested from GL2 toward memory over
      the Efficiency Arbiter. Requests served by Infinity Cache are included.
    Performance (GFLOPs): >-
      Estimated floating-point operations on the vector ALU and Wave Matrix
      Multiply Accumulate combined.
