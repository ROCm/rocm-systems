Panel Config:
  id: 300
  alias: memchart
  title: Memory Chart
  data source:
  - metric_table:
      id: 301
      title: Instruction Cache
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        ICache Requests:
          value: SUM(SQC_ICACHE_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        ICache Hit Rate:
          value: 100 * SUM(SQC_ICACHE_HITS_sum) / SUM(SQC_ICACHE_REQ_sum)
          unit: Percent
  - metric_table:
      id: 302
      title: Scalar Data Cache
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        DCache Requests:
          value: SUM(SQC_DCACHE_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        DCache Hit Rate:
          value: 100 * SUM(SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_REQ_sum)
          unit: Percent
        DCache Load Bandwidth:
          value: 4 * SUM(SQC_SMEM_LOAD_DWORDS_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
  - metric_table:
      id: 303
      title: GL0 Cache (Vector L0)
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        GL0 Hit Rate:
          value: 100 * SUM(TCP_REQ_sum - TCP_REQ_MISS_sum) / SUM(TCP_REQ_sum)
          unit: Percent
  - metric_table:
      id: 304
      title: LDS (Local Data Share)
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        LDS Instructions:
          value: SUM(SQ_INSTS_LDS_sum) / SUM($denom)
          unit: (Instructions + $normUnit)
        LDS Utilization:
          value: 100 * SUM(SQC_LDS_IDX_ACTIVE_sum) / (SUM(GRBM_GUI_ACTIVE) * $cu_per_gpu)
          unit: Percent
        LDS Bank Conflict Rate:
          value: 100 * SUM(SQC_LDS_BANK_CONFLICT_sum) / SUM(SQC_LDS_IDX_ACTIVE_sum)
          unit: Percent
        LDS Bandwidth:
          value: 4 * SUM(SQC_LDS_LOAD_DWORDS_sum + SQC_LDS_STORE_DWORDS_sum + SQC_LDS_ATOMIC_DWORDS_sum)
            / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
  - metric_table:
      id: 308
      title: GL2 Cache (L2)
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        GL2 Hit Rate:
          value: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
          unit: Percent
  - metric_table:
      id: 309
      title: L2 to Memory
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        Memory Read Requests:
          value: SUM(GL2C_EA_RDREQ_DRAM_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        Memory Write Requests:
          value: SUM(GL2C_EA_WRREQ_DRAM_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        Memory Read Bandwidth:
          value: 32 * SUM(GL2C_EA_RDREQ_DRAM_32B_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        Memory Write Bandwidth:
          value: 32 * SUM(GL2C_EA_WRREQ_DRAM_32B_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
  - metric_table:
      id: 310
      title: Workgroup Processors (WGPs)
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        Wavefront Occupancy:
          value: 100 * SUM(SQ_WAVE_CYCLES_sum) / SUM(GRBM_GUI_ACTIVE * $cu_per_gpu * $max_waves_per_cu)
          unit: Percent
        VGPRs:
          value: AVG(Arch_VGPR)
          unit: Registers
        SGPRs:
          value: AVG(SGPR)
          unit: Registers
        LDS Allocation:
          value: AVG(LDS_Per_Workgroup)
          unit: Bytes per Workgroup
        Scratch Allocation:
          value: AVG(Scratch_Per_Workitem)
          unit: Bytes per Work-item
        Workgroups:
          value: AVG(Grid_Size / Workgroup_Size) / ($cu_per_gpu / 2)
          unit: Workgroups per WGP
  metrics_description:
    ICache Requests: >-
      Instruction cache requests from the Sequencer.
    ICache Hit Rate: >-
      Percentage of instruction cache requests that hit.
    DCache Requests: >-
      Scalar data cache requests after bank serialization.
    DCache Hit Rate: >-
      Percentage of scalar data cache requests that hit.
    DCache Load Bandwidth: >-
      The load bandwidth between the WGP and the scalar data cache. Each loaded
      dword counts as 4 bytes. Bounds-check reductions are ignored.
    GL0 Hit Rate: >-
      Percentage of GL0 vector cache (TCP Cache) requests that hit in cache.
    LDS Instructions: >-
      LDS instructions issued, including FLAT instructions that resolve to LDS.
      This counts instructions, not bytes, and does not distinguish reads from
      writes.
    LDS Utilization: >-
      Percentage of GPU-active cycles, across all CUs, spent on indexed LDS
      accesses.
    LDS Bank Conflict Rate: >-
      Percentage of indexed-access LDS cycles spent stalled on bank conflicts.
    LDS Bandwidth: >-
      The bandwidth between the WGP and LDS for loads, stores, and atomics. Each
      dword counts as 4 bytes.
    GL2 Hit Rate: >-
      Percentage of GL2 lookups that hit.
    Memory Read Requests: >-
      GL2 read requests over the Efficiency Arbiter destined for memory.
      Requests served by Infinity Cache are included.
    Memory Write Requests: >-
      GL2 write requests over the Efficiency Arbiter destined for memory.
      Requests absorbed by Infinity Cache are included.
    Memory Read Bandwidth: >-
      The read bandwidth from GL2 toward memory over the Efficiency Arbiter.
      Each counted request is 32 bytes. Requests served by Infinity Cache are
      included.
    Memory Write Bandwidth: >-
      The write bandwidth from GL2 toward memory over the Efficiency Arbiter.
      Each counted request is 32 bytes. Requests absorbed by Infinity Cache are
      included.
    Wavefront Occupancy: >-
      Resident wavefronts per WGP as a percentage of the maximum wavefronts per
      WGP, averaged over GPU-active cycles.
    VGPRs: >-
      Architected vector general-purpose registers allocated for the kernel.
      Allocation granularity can increase this above the compiler request.
    SGPRs: >-
      Scalar general-purpose registers allocated for the kernel. Allocation
      granularity can increase this above the compiler request.
    LDS Allocation: >-
      Bytes of LDS allocated per workgroup. Allocation granularity and dynamic
      per-dispatch allocations can increase this above the compile-time request.
    Scratch Allocation: >-
      Bytes of scratch memory requested per work-item for stack memory and
      register spills and restores.
    Workgroups: >-
      Number of workgroups in the launch for each WGP.
