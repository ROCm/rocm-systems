Panel Config:
  id: 200
  alias: sol
  title: System Speed-of-Light
  data source:
  - metric_table:
      id: 201
      title: System Speed-of-Light
      header:
        metric: Metric
        value: Avg
        unit: Unit
        peak: Peak
        pct_of_peak: Percent of Peak
      metric:
        VALU Issue Rate:
          value: SUM(SQ_INSTS_VALU_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GInstructions/s
          peak: None
          pct_of_peak: false
        WMMA FLOPs (F16->F32 16x16x16):
          value: 8192 * SUM(SQ_WMMA_VALU_INSTS_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 1024 / 1000
          pct_of_peak: true
        FP64 VALU Issue Rate:
          value: SUM(SQ_INSTS_VALU_DP_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GInstructions/s
          peak: None
          pct_of_peak: false
        IPC:
          value: SUM(SQ_INSTS_ALL_sum - SQ_INSTS_INTERNAL_sum) / SUM(SQ_BUSY_CYCLES_sum)
          unit: Instructions per Cycle
          peak: 5
          pct_of_peak: true
        Wavefront Occupancy:
          value: SUM(SQ_WAVE_CYCLES_sum) / SUM(GRBM_GUI_ACTIVE)
          unit: Wavefronts
          peak: $max_waves_per_cu * $cu_per_gpu
          pct_of_peak: true
        GL2 Cache Hit Rate:
          value: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
          unit: Percent
          peak: 100
          pct_of_peak: true
        LDS Bank Conflicts:
          value: AVG(SQC_LDS_BANK_CONFLICT_sum)
          unit: Cycles
          peak: None
          pct_of_peak: false
        GL0 Cache Hit Rate (TCP Cache):
          value: 100 * SUM(TCP_REQ_sum - TCP_REQ_MISS_sum) / SUM(TCP_REQ_sum)
          unit: Percent
          peak: 100
          pct_of_peak: true
        Scalar Data Cache Hit Rate:
          value: 100 * SUM(SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_REQ_sum)
          unit: Percent
          peak: 100
          pct_of_peak: true
        Scalar Data Cache BW:
          value: 4 * SUM(SQC_SMEM_LOAD_DWORDS_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
          peak: $sqc_per_gpu * 64 * $max_sclk * 1e6
          pct_of_peak: true
        Instruction Cache Hit Rate:
          value: 100 * SUM(SQC_ICACHE_HITS_sum) / SUM(SQC_ICACHE_REQ_sum)
          unit: Percent
          peak: 100
          pct_of_peak: true
  metrics_description:
    VALU Issue Rate: >-
      VALU instruction issues, including floating-point and integer
      instructions. This is not a FLOP count and does not account for active
      lanes.
    WMMA FLOPs (F16->F32 16x16x16): >-
      Estimated matrix floating-point operations from Wave Matrix Multiply
      Accumulate instructions. Each instruction counts as 8192 FLOPs for a
      16x16x16 F16->F32 operation.
    FP64 VALU Issue Rate: >-
      Double-precision VALU instruction issues. This is not a FLOP count and
      does not account for active lanes.
    IPC: >-
      User instructions executed per Sequencer busy cycle, excluding internal
      Sequencer instructions.
    Wavefront Occupancy: >-
      Average number of wavefronts resident during GPU-active cycles.
    GL2 Cache Hit Rate: >-
      Percentage of GL2 lookups that hit.
    LDS Bank Conflicts: >-
      Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
    GL0 Cache Hit Rate (TCP Cache): >-
      Percentage of GL0 vector cache (TCP Cache) requests that hit in cache.
    Scalar Data Cache Hit Rate: >-
      Percentage of scalar data cache requests that hit.
    Scalar Data Cache BW: >-
      The load bandwidth between the WGP and the scalar data cache. Each loaded
      dword counts as 4 bytes. Bounds-check reductions are ignored.
    Instruction Cache Hit Rate: >-
      Percentage of instruction cache requests that hit.
