# =============================================================================
# RDNA3.5 (gfx1151) - RDNA3.5 SPI (Shader Processor Input) Performance Metrics
# =============================================================================
# SPI handles wave scheduling and resource allocation to WGPs
# =============================================================================

Panel Config:
  id: 600
  title: Workgroup Manager (SPI)
  data source:
  # =========================================================================
  # SPI Utilization
  # =========================================================================
  - metric_table:
      id: 601
      title: "SPI Utilization"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        SPI Busy:
          # Use GRBM_SPI_BUSY (not SPI_BUSY): SPI_BUSY is summed over all SPI instances, so it
          # can exceed GRBM_GUI_ACTIVE when multiple SEs are busy in the same cycle. GRBM counts
          # "any SPI busy" vs GUI active — same pairing as panel 1700 GRBM SPI Busy.
          avg: AVG((100 * GRBM_SPI_BUSY / GRBM_GUI_ACTIVE) if (GRBM_GUI_ACTIVE != 0) else None)
          min: MIN((100 * GRBM_SPI_BUSY / GRBM_GUI_ACTIVE) if (GRBM_GUI_ACTIVE != 0) else None)
          max: MAX((100 * GRBM_SPI_BUSY / GRBM_GUI_ACTIVE) if (GRBM_GUI_ACTIVE != 0) else None)
          unit: Percent

  # =========================================================================
  # Wave Dispatch Statistics
  # =========================================================================
  - metric_table:
      id: 602
      title: "Wave Dispatch Statistics"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Compute Wave Dispatches:
          avg: AVG(SPI_CSN_WAVE / $denom)
          min: MIN(SPI_CSN_WAVE / $denom)
          max: MAX(SPI_CSN_WAVE / $denom)
          unit: (Count + $normUnit)
        Wave Dispatch Rate:
          avg: AVG((SPI_CSN_WAVE / GRBM_GUI_ACTIVE) if (GRBM_GUI_ACTIVE != 0) else None)
          min: MIN((SPI_CSN_WAVE / GRBM_GUI_ACTIVE) if (GRBM_GUI_ACTIVE != 0) else None)
          max: MAX((SPI_CSN_WAVE / GRBM_GUI_ACTIVE) if (GRBM_GUI_ACTIVE != 0) else None)
          unit: Waves/cycle

  # =========================================================================
  # Resource Allocation
  # =========================================================================
  # To be fixed: SPI_CSN_STALL_* counters not available - commenting out table
  # - metric_table:
  #     id: 603
  #     title: "Resource Allocation Stalls"
  #     header:
  #       metric: Metric
  #       avg: Avg
  #       min: Min
  #       max: Max
  #       unit: Unit
  #     metric:
  #       VGPR Stall:
  #         avg: AVG(SPI_CSN_STALL_VGPR_sum / $denom)
  #         min: MIN(SPI_CSN_STALL_VGPR_sum / $denom)
  #         max: MAX(SPI_CSN_STALL_VGPR_sum / $denom)
  #         unit: (Cycles + $normUnit)
  #       SGPR Stall:
  #         avg: AVG(SPI_CSN_STALL_SGPR_sum / $denom)
  #         min: MIN(SPI_CSN_STALL_SGPR_sum / $denom)
  #         max: MAX(SPI_CSN_STALL_SGPR_sum / $denom)
  #         unit: (Cycles + $normUnit)
  #       LDS Stall:
  #         avg: AVG(SPI_CSN_STALL_LDS_sum / $denom)
  #         min: MIN(SPI_CSN_STALL_LDS_sum / $denom)
  #         max: MAX(SPI_CSN_STALL_LDS_sum / $denom)
  #         unit: (Cycles + $normUnit)
  #       Wave Slot Stall:
  #         avg: AVG(SPI_CSN_STALL_WAVE_sum / $denom)
  #         min: MIN(SPI_CSN_STALL_WAVE_sum / $denom)
  #         max: MAX(SPI_CSN_STALL_WAVE_sum / $denom)
  #         unit: (Cycles + $normUnit)
  #       Barrier Stall:
  #         avg: AVG(SPI_CSN_STALL_BARRIER_sum / $denom)
  #         min: MIN(SPI_CSN_STALL_BARRIER_sum / $denom)
  #         max: MAX(SPI_CSN_STALL_BARRIER_sum / $denom)
  #         unit: (Cycles + $normUnit)

  metrics_description:
    SPI Busy: |-
      Percentage of GPU active (GUI) cycles where any SPI was busy. Computed as
      100 * GRBM_SPI_BUSY / GRBM_GUI_ACTIVE (GRBM block). Do not use block-level SPI_BUSY here:
      it is aggregated over every SPI instance, so summed busy cycles can far exceed GUI-active
      cycles when multiple shader engines are active in parallel.
    Compute Wave Dispatches: |-
      Number of compute shader waves dispatched by SPI (SPI_CSN_WAVE).
    Wave Dispatch Rate: |-
      Average number of waves dispatched per GPU active cycle. Computed as
      SPI_CSN_WAVE / GRBM_GUI_ACTIVE.
    # To be fixed: SPI_CSN_STALL_* counters not available - commenting out descriptions
    # VGPR Stall: |-
    #   Cycles SPI was stalled due to insufficient VGPRs.
    #   Consider reducing VGPR usage per wave.
    # SGPR Stall: |-
    #   Cycles SPI was stalled due to insufficient SGPRs.
    # LDS Stall: |-
    #   Cycles SPI was stalled due to insufficient LDS.
    #   Consider reducing LDS usage per workgroup.
    # Wave Slot Stall: |-
    #   Cycles SPI was stalled due to no available wave slots.
    #   Indicates maximum occupancy reached.
    # Barrier Stall: |-
    #   Cycles SPI was stalled due to barrier resource limits.
