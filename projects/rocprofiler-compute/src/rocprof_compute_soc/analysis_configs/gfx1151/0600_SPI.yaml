# =============================================================================
# RDNA3.5 (gfx1151) - RDNA3.5 SPI (Shader Processor Input) Performance Metrics
# =============================================================================
# SPI handles wave scheduling and resource allocation to WGPs
# =============================================================================

Panel Config:
  id: 600
  title: Workgroup Manager (SPI)
  data source:
  # =========================================================================
  # SPI Utilization
  # =========================================================================
  - metric_table:
      id: 601
      title: "SPI Utilization"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        SPI Busy:
          avg: AVG((100 * SPI_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          min: MIN((100 * SPI_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          max: MAX((100 * SPI_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          unit: Percent

  # =========================================================================
  # Wave Dispatch Statistics
  # =========================================================================
  - metric_table:
      id: 602
      title: "Wave Dispatch Statistics"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Compute Wave Dispatches:
          avg: AVG(SPI_CSN_WAVE_sum / $denom)
          min: MIN(SPI_CSN_WAVE_sum / $denom)
          max: MAX(SPI_CSN_WAVE_sum / $denom)
          unit: Count + $normUnit
        Wave Dispatch Rate:
          avg: AVG((SPI_CSN_WAVE_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          min: MIN((SPI_CSN_WAVE_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          max: MAX((SPI_CSN_WAVE_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          unit: Waves/cycle

  # =========================================================================
  # Resource Allocation
  # =========================================================================
  # Fixme: SPI_CSN_STALL_* counters not available - commenting out table
  # - metric_table:
  #     id: 603
  #     title: "Resource Allocation Stalls"
  #     header:
  #       metric: Metric
  #       avg: Avg
  #       min: Min
  #       max: Max
  #       unit: Unit
  #     metric:
  #       VGPR Stall:
  #         avg: AVG(SPI_CSN_STALL_VGPR_sum / $denom)
  #         min: MIN(SPI_CSN_STALL_VGPR_sum / $denom)
  #         max: MAX(SPI_CSN_STALL_VGPR_sum / $denom)
  #         unit: Cycles + $normUnit
  #       SGPR Stall:
  #         avg: AVG(SPI_CSN_STALL_SGPR_sum / $denom)
  #         min: MIN(SPI_CSN_STALL_SGPR_sum / $denom)
  #         max: MAX(SPI_CSN_STALL_SGPR_sum / $denom)
  #         unit: Cycles + $normUnit
  #       LDS Stall:
  #         avg: AVG(SPI_CSN_STALL_LDS_sum / $denom)
  #         min: MIN(SPI_CSN_STALL_LDS_sum / $denom)
  #         max: MAX(SPI_CSN_STALL_LDS_sum / $denom)
  #         unit: Cycles + $normUnit
  #       Wave Slot Stall:
  #         avg: AVG(SPI_CSN_STALL_WAVE_sum / $denom)
  #         min: MIN(SPI_CSN_STALL_WAVE_sum / $denom)
  #         max: MAX(SPI_CSN_STALL_WAVE_sum / $denom)
  #         unit: Cycles + $normUnit
  #       Barrier Stall:
  #         avg: AVG(SPI_CSN_STALL_BARRIER_sum / $denom)
  #         min: MIN(SPI_CSN_STALL_BARRIER_sum / $denom)
  #         max: MAX(SPI_CSN_STALL_BARRIER_sum / $denom)
  #         unit: Cycles + $normUnit

  metrics_description:
    SPI Busy: |-
      Percentage of cycles where the SPI (Shader Processor Input) was busy.
      SPI handles wave scheduling and resource allocation.
    Compute Wave Dispatches: |-
      Number of compute shader waves dispatched by SPI.
    Wave Dispatch Rate: |-
      Average number of waves dispatched per cycle.
    # Fixme: SPI_CSN_STALL_* counters not available - commenting out descriptions
    # VGPR Stall: |-
    #   Cycles SPI was stalled due to insufficient VGPRs.
    #   Consider reducing VGPR usage per wave.
    # SGPR Stall: |-
    #   Cycles SPI was stalled due to insufficient SGPRs.
    # LDS Stall: |-
    #   Cycles SPI was stalled due to insufficient LDS.
    #   Consider reducing LDS usage per workgroup.
    # Wave Slot Stall: |-
    #   Cycles SPI was stalled due to no available wave slots.
    #   Indicates maximum occupancy reached.
    # Barrier Stall: |-
    #   Cycles SPI was stalled due to barrier resource limits.
