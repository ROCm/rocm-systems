# =============================================================================
# RDNA3.5 (gfx1151) - RDNA3.5 TCP (Texture Cache Per-pipe) Performance Metrics
# =============================================================================
# TCP is the L0 vector cache in RDNA3.5, providing per-WGP caching
# Cache hierarchy: TCP (L0) -> GL1C (L1) -> GL2C (L2)
# =============================================================================

Panel Config:
  id: 800
  title: TCP Cache (L0)
  data source:
  # =========================================================================
  # TCP Utilization
  # =========================================================================
  - metric_table:
      id: 801
      title: "TCP Utilization"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        TCP Busy:
          # To be fixed: Restore when TCP_GATE_EN2 vs GRBM_GUI_ACTIVE ratio is validated for gfx1151.
          # avg: AVG((100 * TCP_GATE_EN2 / GRBM_GUI_ACTIVE) if (GRBM_GUI_ACTIVE != 0) else None)
          # min: MIN((100 * TCP_GATE_EN2 / GRBM_GUI_ACTIVE) if (GRBM_GUI_ACTIVE != 0) else None)
          # max: MAX((100 * TCP_GATE_EN2 / GRBM_GUI_ACTIVE) if (GRBM_GUI_ACTIVE != 0) else None)
          avg: None
          min: None
          max: None
          unit: Percent

  # =========================================================================
  # TCP Request Statistics
  # =========================================================================
  - metric_table:
      id: 802
      title: "TCP Request Statistics"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Total Requests:
          avg: AVG(TCP_REQ_sum / $denom)
          min: MIN(TCP_REQ_sum / $denom)
          max: MAX(TCP_REQ_sum / $denom)
          unit: (Count + $normUnit)
        Read Requests:
          avg: AVG(TCP_REQ_READ_sum / $denom)
          min: MIN(TCP_REQ_READ_sum / $denom)
          max: MAX(TCP_REQ_READ_sum / $denom)
          unit: (Count + $normUnit)
        Write Requests:
          avg: AVG(TCP_REQ_WRITE_sum / $denom)
          min: MIN(TCP_REQ_WRITE_sum / $denom)
          max: MAX(TCP_REQ_WRITE_sum / $denom)
          unit: (Count + $normUnit)
        Miss Requests:
          avg: AVG(TCP_REQ_MISS_sum / $denom)
          min: MIN(TCP_REQ_MISS_sum / $denom)
          max: MAX(TCP_REQ_MISS_sum / $denom)
          unit: (Count + $normUnit)

  # =========================================================================
  # TCP Cache Performance
  # =========================================================================
  - metric_table:
      id: 803
      title: "TCP Cache Performance"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        # TCP_REQ (0x9) and TCP_REQ_MISS (0x11) do not share one counter space: REQ_MISS can
        # exceed TCP_REQ (e.g. finer-granularity miss events), so (TCP_REQ - TCP_REQ_MISS) is invalid.
        TCP Read Hit Rate:
          avg: AVG((100 * TCP_REQ_READ_HIT_LRU_sum / (TCP_REQ_READ_HIT_LRU_sum + TCP_REQ_READ_MISS_EVICT_sum)) if ((TCP_REQ_READ_HIT_LRU_sum + TCP_REQ_READ_MISS_EVICT_sum) != 0) else None)
          min: MIN((100 * TCP_REQ_READ_HIT_LRU_sum / (TCP_REQ_READ_HIT_LRU_sum + TCP_REQ_READ_MISS_EVICT_sum)) if ((TCP_REQ_READ_HIT_LRU_sum + TCP_REQ_READ_MISS_EVICT_sum) != 0) else None)
          max: MAX((100 * TCP_REQ_READ_HIT_LRU_sum / (TCP_REQ_READ_HIT_LRU_sum + TCP_REQ_READ_MISS_EVICT_sum)) if ((TCP_REQ_READ_HIT_LRU_sum + TCP_REQ_READ_MISS_EVICT_sum) != 0) else None)
          unit: Percent

  # =========================================================================
  # TCP-GL1 Interface
  # =========================================================================
  - metric_table:
      id: 804
      title: "TCP-GL1 Interface"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL1 Read Requests:
          avg: AVG(TCP_GL1_REQ_READ_sum / $denom)
          min: MIN(TCP_GL1_REQ_READ_sum / $denom)
          max: MAX(TCP_GL1_REQ_READ_sum / $denom)
          unit: (Count + $normUnit)
        GL1 Read 128B Requests:
          avg: AVG(TCP_GL1_REQ_READ_128B_sum / $denom)
          min: MIN(TCP_GL1_REQ_READ_128B_sum / $denom)
          max: MAX(TCP_GL1_REQ_READ_128B_sum / $denom)
          unit: (Count + $normUnit)
        GL1 Write Requests:
          avg: AVG(TCP_GL1_REQ_WRITE_sum / $denom)
          min: MIN(TCP_GL1_REQ_WRITE_sum / $denom)
          max: MAX(TCP_GL1_REQ_WRITE_sum / $denom)
          unit: (Count + $normUnit)

  # =========================================================================
  # TCP Stalls
  # =========================================================================
  - metric_table:
      id: 805
      title: "TCP Stalls"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        TA Req Stall:
          avg: AVG(TCP_TCP_TA_REQ_STALL_sum / $denom)
          min: MIN(TCP_TCP_TA_REQ_STALL_sum / $denom)
          max: MAX(TCP_TCP_TA_REQ_STALL_sum / $denom)
          unit: (Cycles + $normUnit)
        GL1 Back Pressure:
          avg: AVG(TCP_GL1_TCP_BACK_PRESSURE_sum / $denom)
          min: MIN(TCP_GL1_TCP_BACK_PRESSURE_sum / $denom)
          max: MAX(TCP_GL1_TCP_BACK_PRESSURE_sum / $denom)
          unit: (Cycles + $normUnit)
        Data FIFO Stall:
          avg: AVG(TCP_DATA_FIFO_STALL_sum / $denom)
          min: MIN(TCP_DATA_FIFO_STALL_sum / $denom)
          max: MAX(TCP_DATA_FIFO_STALL_sum / $denom)
          unit: (Cycles + $normUnit)

  metrics_description:
    TCP Busy: |-
      To be fixed: Disabled — Avg / Min / Max are None until the utilization formula is
      validated for gfx1151. Intended meaning: TCP busy as a percent of GRBM GUI-active
      cycles (100 * TCP_GATE_EN2 / GRBM_GUI_ACTIVE when GRBM_GUI_ACTIVE != 0).
    Total Requests: |-
      Total number of requests to the TCP cache including reads, writes, and atomics.
    Read Requests: |-
      Number of read requests to the TCP cache.
    Write Requests: |-
      Number of write requests to the TCP cache.
    Miss Requests: |-
      Number of requests that missed in the TCP cache and required fetching from GL1C.
    TCP Read Hit Rate: |-
      Percentage of TCP read traffic that hit in the LRU way: 100 × TCP_REQ_READ_HIT_LRU /
      (TCP_REQ_READ_HIT_LRU + TCP_REQ_READ_MISS_EVICT). Do not use TCP_REQ − TCP_REQ_MISS for
      hit rate — TCP_REQ (cache line accesses) and TCP_REQ_MISS (miss events) are not paired
      counts; REQ_MISS can be larger than TCP_REQ on real silicon.
    GL1 Read Requests: |-
      Number of read requests sent from TCP to GL1C due to cache misses.
    TA Req Stall: |-
      Cycles TCP stalled the Texture Addresser request interface due to backpressure.
    GL1 Back Pressure: |-
      Cycles TCP was stalled due to back pressure from GL1C.
