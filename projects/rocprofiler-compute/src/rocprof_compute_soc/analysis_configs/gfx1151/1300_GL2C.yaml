# =============================================================================
# RDNA3.5 (gfx1151) - RDNA3.5 GL2C (L2 Cache) Performance Metrics
# =============================================================================
# GL2C is the last-level cache shared across the GPU
# Cache hierarchy: TCP (L0) -> GL1C (L1) -> GL2C (L2) -> Memory
# =============================================================================

Panel Config:
  id: 1300
  title: GL2 Cache (L2)
  data source:
  # =========================================================================
  # GL2C Cache Performance
  # =========================================================================
  - metric_table:
      id: 1301
      title: "GL2C Cache Performance"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL2C Hit Rate:
          avg: SUM(100 * GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
          min: MIN(100 * GL2C_HIT_sum / (GL2C_HIT_sum + GL2C_MISS_sum))
          max: MAX(100 * GL2C_HIT_sum / (GL2C_HIT_sum + GL2C_MISS_sum))
          unit: Percent
        GL2C Hits:
          avg: SUM(GL2C_HIT_sum) / SUM($denom)
          min: MIN(GL2C_HIT_sum / $denom)
          max: MAX(GL2C_HIT_sum / $denom)
          unit: (Count + $normUnit)
        GL2C Misses:
          avg: SUM(GL2C_MISS_sum) / SUM($denom)
          min: MIN(GL2C_MISS_sum / $denom)
          max: MAX(GL2C_MISS_sum / $denom)
          unit: (Count + $normUnit)

  # =========================================================================
  # GL2C Request Statistics
  # =========================================================================
  - metric_table:
      id: 1302
      title: "GL2C Request Statistics"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Total Requests:
          avg: SUM(GL2C_REQ_sum) / SUM($denom)
          min: MIN(GL2C_REQ_sum / $denom)
          max: MAX(GL2C_REQ_sum / $denom)
          unit: (Count + $normUnit)
        Read Requests:
          avg: SUM(GL2C_READ_sum) / SUM($denom)
          min: MIN(GL2C_READ_sum / $denom)
          max: MAX(GL2C_READ_sum / $denom)
          unit: (Count + $normUnit)
        Write Requests:
          avg: SUM(GL2C_WRITE_sum) / SUM($denom)
          min: MIN(GL2C_WRITE_sum / $denom)
          max: MAX(GL2C_WRITE_sum / $denom)
          unit: (Count + $normUnit)
        Atomic Requests:
          avg: SUM(GL2C_ATOMIC_sum) / SUM($denom)
          min: MIN(GL2C_ATOMIC_sum / $denom)
          max: MAX(GL2C_ATOMIC_sum / $denom)
          unit: (Count + $normUnit)
        EA Read Requests (DRAM):
          avg: SUM(GL2C_EA_RDREQ_DRAM_sum) / SUM($denom)
          min: MIN(GL2C_EA_RDREQ_DRAM_sum / $denom)
          max: MAX(GL2C_EA_RDREQ_DRAM_sum / $denom)
          unit: (Count + $normUnit)
        EA Write Requests (DRAM):
          avg: SUM(GL2C_EA_WRREQ_DRAM_sum) / SUM($denom)
          min: MIN(GL2C_EA_WRREQ_DRAM_sum / $denom)
          max: MAX(GL2C_EA_WRREQ_DRAM_sum / $denom)
          unit: (Count + $normUnit)

  # =========================================================================
  # GL2C Bandwidth
  # =========================================================================
  - metric_table:
      id: 1303
      title: "GL2C Bandwidth"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL2C Read BW:
          # 32/64/128 B read bins plus 96 B compressed reads; GL2C_EA_RDREQ_96B covers EA-side 96 B reads.
          avg: SUM(GL2C_READ_32_REQ_sum*32 + GL2C_READ_64_REQ_sum*64 + GL2C_READ_128_REQ_sum*128 + GL2C_COMPRESSED_READ_96_REQ_sum*96) / SUM((End_Timestamp - Start_Timestamp) / 1e9)
          min: MIN((GL2C_READ_32_REQ_sum*32 + GL2C_READ_64_REQ_sum*64 + GL2C_READ_128_REQ_sum*128 + GL2C_COMPRESSED_READ_96_REQ_sum*96) / ((End_Timestamp - Start_Timestamp) / 1e9))
          max: MAX((GL2C_READ_32_REQ_sum*32 + GL2C_READ_64_REQ_sum*64 + GL2C_READ_128_REQ_sum*128 + GL2C_COMPRESSED_READ_96_REQ_sum*96) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s
        GL2C Write BW:
          # Note: GL2C write requests use 64B as the average transaction size.
          avg: SUM(GL2C_WRITE_sum * 64) / SUM((End_Timestamp - Start_Timestamp) / 1e9)
          min: MIN((GL2C_WRITE_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))
          max: MAX((GL2C_WRITE_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s

  metrics_description:
    GL2C Hit Rate: >-
      Percentage of L2 cache requests serviced from cache without accessing system memory.
      GL2C is the last-level cache before system memory. Higher hit rates significantly
      reduce memory bandwidth pressure and improve performance.
    GL2C Hits: >-
      Number of L2 cache requests that were serviced from cache. High hit counts relative
      to total requests indicate effective caching. Low hit counts suggest memory-bound
      workloads or poor data locality.
    GL2C Misses: >-
      Number of L2 cache requests that missed and required fetching from system memory.
      High miss counts indicate heavy memory traffic. Consider improving data locality
      or reducing working set size.
    Total Requests: >-
      Total number of requests received by the L2 cache from all L1 caches and other
      clients. This represents the aggregate memory traffic at the last-level cache.
    Read Requests: >-
      Number of read requests to the L2 cache. High read counts indicate memory-intensive
      load operations. Compare with hit rate to assess L2 cache effectiveness for reads.
    Write Requests: >-
      Number of write requests to the L2 cache. Write traffic includes stores and cache
      writebacks from L1. High write counts indicate write-intensive workloads.
    Atomic Requests: >-
      Number of atomic memory operations processed by the L2 cache. Atomics provide
      thread-safe memory access but may serialize at contended addresses. High counts
      may impact performance.
    EA Read Requests (DRAM): >-
      Number of read requests forwarded from L2 cache to system memory. This represents
      L2 miss traffic that must be serviced by DRAM. High counts indicate memory-bound
      workloads.
    EA Write Requests (DRAM): >-
      Number of write requests forwarded from L2 cache to system memory. This includes
      evictions and writebacks. High counts indicate write-intensive workloads consuming
      memory bandwidth.
    GL2C Read BW: >-
      Achieved read bandwidth at the L2 cache level. This represents total read traffic
      from L1 caches to L2. High bandwidth indicates memory-intensive read patterns.
    GL2C Write BW: >-
      Achieved write bandwidth at the L2 cache level. This represents total write traffic
      from L1 caches to L2. High bandwidth indicates memory-intensive write patterns.
