# =============================================================================
# RDNA3.5 (gfx1152) — System Speed-of-Light
# Layout aligned with gfx950/0200_system_speed_of_light.yaml (throughput first,
# then core/memory, then cache hierarchy). RDNA3.5: standard VALU FLOPs (no MFMA).
# VALU peaks: Navi3-class — 128 FP32 FMAs/CU/cycle, 256 FP16 ops/CU/cycle (wave64).
# Cache: TCP (L0) -> GL1C (L1) -> GL2C (L2). Fabric/MC BW: no Peak / % of peak (no sysinfo BW var on gfx1152).
# =============================================================================

Panel Config:
  id: 200
  title: System Speed-of-Light
  data source:
  - metric_table:
      id: 201
      title: "System Speed-of-Light"
      header:
        metric: Metric
        value: Avg
        unit: Unit
        peak: Peak
        pop: Pct of Peak
      metric:
        # --- Throughput (gfx950-style: rates first) ---
        VALU FLOPs (FP16):
          value: AVG(((SQ_INSTS_VALU_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)) / 1e9)
          unit: GFLOP/s
          peak: ((($max_sclk * $cu_per_gpu) * 256) / 1000)
          pop: ((100 * AVG(((SQ_INSTS_VALU_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)) / 1e9)) / ((($max_sclk * $cu_per_gpu) * 256) / 1000))
        VALU FLOPs (FP32):
          value: AVG(((SQ_INSTS_VALU_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)) / 1e9)
          unit: GFLOP/s
          peak: ((($max_sclk * $cu_per_gpu) * 128) / 1000)
          pop: ((100 * AVG(((SQ_INSTS_VALU_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)) / 1e9)) / ((($max_sclk * $cu_per_gpu) * 128) / 1000))
        IPC:
          value: AVG(((SQ_INSTS_ALL_sum - SQ_INSTS_INTERNAL_sum) / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
          unit: Instr/cycle
          peak: 5
          pop: ((100 * AVG((SQ_INSTS_ALL_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)) / 5)
        Wavefront Occupancy:
          value: AVG((SQ_WAVE_CYCLES_sum / (GRBM_GUI_ACTIVE_sum * $cu_per_gpu)))
          unit: Wavefronts
          peak: ($max_waves_per_cu * $cu_per_gpu)
          pop: (100 * AVG(((SQ_WAVE_CYCLES_sum / (GRBM_GUI_ACTIVE_sum * $cu_per_gpu)) / ($max_waves_per_cu * $cu_per_gpu))))
        Wave Life (cycles):
          value: AVG(((SQ_WAVE_CYCLES / SQ_WAVES) if (SQ_WAVES != 0) else None))
          unit: Cycles
          peak: None
          pop: None
        SQ Busy:
          value: AVG((100 * SQ_BUSY_CYCLES / (GRBM_GUI_ACTIVE * $cu_per_gpu)) if (GRBM_GUI_ACTIVE * $cu_per_gpu != 0) else None)
          unit: Percent
          peak: 100
          pop: AVG((100 * SQ_BUSY_CYCLES / (GRBM_GUI_ACTIVE * $cu_per_gpu)))
        GPU Utilization:
          value: AVG((100 * GRBM_GUI_ACTIVE / GRBM_COUNT) if (GRBM_COUNT != 0) else None)
          unit: Percent
          peak: 100
          pop: AVG((100 * GRBM_GUI_ACTIVE / GRBM_COUNT) if (GRBM_COUNT != 0) else None)
        # --- L2 / fabric / memory controller ---
        L2 Cache Hit Rate:
          value: AVG((100 * GL2C_HIT_sum / (GL2C_HIT_sum + GL2C_MISS_sum)) if ((GL2C_HIT_sum + GL2C_MISS_sum) != 0) else None)
          unit: Percent
          peak: 100
          pop: AVG((100 * GL2C_HIT_sum / (GL2C_HIT_sum + GL2C_MISS_sum)) if ((GL2C_HIT_sum + GL2C_MISS_sum) != 0) else None)
        L2-Fabric Read BW:
          value: AVG(((GL2C_EA_RDREQ_32B * 32 + GL2C_EA_RDREQ_64B * 64
            + GL2C_EA_RDREQ_96B * 96 + GL2C_EA_RDREQ_128B * 128)
            / ((End_Timestamp - Start_Timestamp) / 1e9)))
          unit: Bytes/s
          peak: None
          pop: None
        L2-Fabric Write BW:
          value: AVG((((GL2C_MC_WRREQ - GL2C_EA_WRREQ_64B) * 32 + GL2C_EA_WRREQ_64B * 64)
            / ((End_Timestamp - Start_Timestamp) / 1e9)))
          unit: Bytes/s
          peak: None
          pop: None
        Memory Controller Read BW:
          value: AVG(((GL2C_MC_RDREQ * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)))
          unit: Bytes/s
          peak: None
          pop: None
        Memory Controller Write BW:
          value: AVG(((GL2C_MC_WRREQ * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)))
          unit: Bytes/s
          peak: None
          pop: None
        MC Write Stall:
          value: AVG((100 * GL2C_MC_WRREQ_STALL / (GRBM_GUI_ACTIVE * $total_l2_chan)))
          unit: Percent
          peak: 100
          pop: AVG((100 * GL2C_MC_WRREQ_STALL / (GRBM_GUI_ACTIVE * $total_l2_chan)))
        # --- LDS ---
        LDS Bank Conflicts:
          value: AVG(SQC_LDS_BANK_CONFLICT)
          unit: Conflicts
          peak: None
          pop: None
        Fetch Size:
          value: AVG(((GL2C_EA_RDREQ_32B * 32 + GL2C_EA_RDREQ_64B * 64
            + GL2C_EA_RDREQ_96B * 96 + GL2C_EA_RDREQ_128B * 128) / 1024))
          unit: KB
          peak: None
          pop: None
        Write Size:
          value: AVG((((GL2C_MC_WRREQ - GL2C_EA_WRREQ_64B) * 32 + GL2C_EA_WRREQ_64B * 64) / 1024))
          unit: KB
          peak: None
          pop: None
        TA Busy Util Rate:
          value: AVG((100 * TA_BUSY_avr / GRBM_GUI_ACTIVE) if (GRBM_GUI_ACTIVE != 0) else None)
          unit: Percent
          peak: 100
          pop: AVG((100 * TA_BUSY_avr / GRBM_GUI_ACTIVE) if (GRBM_GUI_ACTIVE != 0) else None)
        TD Busy Util Rate:
          value: AVG((100 * TD_TD_BUSY_avr / GRBM_GUI_ACTIVE) if (GRBM_GUI_ACTIVE != 0) else None)
          unit: Percent
          peak: 100
          pop: AVG((100 * TD_TD_BUSY_avr / GRBM_GUI_ACTIVE) if (GRBM_GUI_ACTIVE != 0) else None)
        Write Unit Stalled:
          value: AVG((100 * GL2C_WRREQ_STALL_max / GRBM_GUI_ACTIVE))
          unit: Percent
          peak: 100
          pop: AVG((100 * GL2C_WRREQ_STALL_max / GRBM_GUI_ACTIVE))
        VMEM Issue Cycles per Wave:
          value: AVG(((4 * SQ_INST_CYCLES_VMEM / SQ_WAVES) if (SQ_WAVES != 0) else 0))
          unit: Cycles/Wave
          peak: None
          pop: None
        Wave Dependency Wait:
          value: AVG(((100 * SQ_WAIT_ANY / SQ_WAVE_CYCLES) if (SQ_WAVE_CYCLES != 0) else 0))
          unit: Percent
          peak: 100
          pop: AVG(((100 * SQ_WAIT_ANY / SQ_WAVE_CYCLES) if (SQ_WAVE_CYCLES != 0) else 0))
        Wave Issue Wait:
          value: AVG(((100 * SQ_WAIT_INST_ANY / SQ_WAVE_CYCLES) if (SQ_WAVE_CYCLES != 0) else 0))
          unit: Percent
          peak: 100
          pop: AVG(((100 * SQ_WAIT_INST_ANY / SQ_WAVE_CYCLES) if (SQ_WAVE_CYCLES != 0) else 0))
        # --- Cache hierarchy: TCP (L0) -> GL1C (L1) -> GL2C client / SQC ---
        TCP Cache Hit Rate:
          value: AVG((100 * (TCP_REQ_sum - TCP_REQ_MISS_sum) / TCP_REQ_sum) if (TCP_REQ_sum != 0) else None)
          unit: Percent
          peak: 100
          pop: AVG((100 * (TCP_REQ_sum - TCP_REQ_MISS_sum) / TCP_REQ_sum) if (TCP_REQ_sum != 0) else None)
        TCP Cache BW:
          value: AVG((TCP_REQ_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s
          peak: ((($max_sclk / 1000) * 256) * $cu_per_gpu * 1e9)
          pop: ((100 * AVG((TCP_REQ_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))) / ((($max_sclk / 1000) * 256) * $cu_per_gpu * 1e9))
        GL1C Hit Rate:
          value: AVG((100 * (GL1C_REQ_sum - GL1C_REQ_MISS_sum) / GL1C_REQ_sum) if (GL1C_REQ_sum != 0) else None)
          unit: Percent
          peak: 100
          pop: AVG((100 * (GL1C_REQ_sum - GL1C_REQ_MISS_sum) / GL1C_REQ_sum) if (GL1C_REQ_sum != 0) else None)
        GL1C Read BW:
          value: AVG((GL1C_REQ_READ_32B_sum*32 + GL1C_REQ_READ_64B_sum*64 + GL1C_REQ_READ_128B_sum*128) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s
          peak: ((($max_sclk / 1000) * 128) * $se_per_gpu * 1e9)
          pop: ((100 * AVG((GL1C_REQ_READ_32B_sum*32 + GL1C_REQ_READ_64B_sum*64 + GL1C_REQ_READ_128B_sum*128) / ((End_Timestamp - Start_Timestamp) / 1e9))) / ((($max_sclk / 1000) * 128) * $se_per_gpu * 1e9))
        GL2C Cache BW:
          value: AVG((GL2C_READ_32_REQ_sum*32 + GL2C_READ_64_REQ_sum*64 + GL2C_READ_128_REQ_sum*128 + GL2C_COMPRESSED_READ_96_REQ_sum*96) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s
          peak: ((($max_sclk / 1000) * 128) * TO_INT_sum($total_l2_chan) * 1e9)
          pop: ((100 * AVG((GL2C_READ_32_REQ_sum*32 + GL2C_READ_64_REQ_sum*64 + GL2C_READ_128_REQ_sum*128 + GL2C_COMPRESSED_READ_96_REQ_sum*96) / ((End_Timestamp - Start_Timestamp) / 1e9))) / ((($max_sclk / 1000) * 128) * TO_INT_sum($total_l2_chan) * 1e9))
        Scalar Data Cache Hit Rate:
          value: AVG((100 * SQC_DCACHE_HITS_sum / SQC_DCACHE_REQ_sum) if (SQC_DCACHE_REQ_sum != 0) else None)
          unit: Percent
          peak: 100
          pop: AVG((100 * SQC_DCACHE_HITS_sum / SQC_DCACHE_REQ_sum) if (SQC_DCACHE_REQ_sum != 0) else None)
        Scalar Data Cache BW:
          value: AVG((SQC_DCACHE_REQ_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s
          peak: ((($max_sclk / 1000) * 64) * $sqc_per_gpu * 1e9)
          pop: ((100 * AVG((SQC_DCACHE_REQ_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))) / ((($max_sclk / 1000) * 64) * $sqc_per_gpu * 1e9))
        Instruction Cache Hit Rate:
          value: AVG((100 * SQC_ICACHE_HITS_sum / SQC_ICACHE_REQ_sum) if (SQC_ICACHE_REQ_sum != 0) else None)
          unit: Percent
          peak: 100
          pop: AVG((100 * SQC_ICACHE_HITS_sum / SQC_ICACHE_REQ_sum) if (SQC_ICACHE_REQ_sum != 0) else None)
        Instruction Cache BW:
          value: AVG((SQC_ICACHE_REQ_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s
          peak: ((($max_sclk / 1000) * 64) * $sqc_per_gpu * 1e9)
          pop: ((100 * AVG((SQC_ICACHE_REQ_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))) / ((($max_sclk / 1000) * 64) * $sqc_per_gpu * 1e9))

  metrics_description:
    VALU FLOPs (FP16): |-
      The number of 16-bit floating point VALU operations executed per second on
      RDNA3.5 (RDNA3.5). RDNA3.5 WGPs contain 2 CUs with 2 SIMD32 units each.
      Theoretical FP16 peak is 2× the FP32 FMA peak (packed half precision).
      Peak calculation: max_sclk × CU_count × 256 ops/cycle (Navi3 / RDNA3-class).
    VALU FLOPs (FP32): |-
      The number of 32-bit floating point VALU operations executed per second.
      Navi3-class (RDNA3) CUs sustain up to 128 V_FMA_F32 ops per cycle per CU
      in wave64 mode (dual-issue VALU). Peak: max_sclk × CU_count × 128 ops/cycle.
    IPC: |-
      Instructions Per Cycle — ratio of instructions executed over busy cycles.
      Calculated as (Total Instructions - Internal Instructions) / Busy Cycles.
      Higher IPC indicates better instruction throughput.
    Wavefront Occupancy: |-
      Time-averaged number of wavefronts resident on the GPU during kernel execution.
      Computed as SQ_WAVE_CYCLES / (GRBM_GUI_ACTIVE × $cu_per_gpu). Peak / % of peak
      compare to $max_waves_per_cu × $cu_per_gpu. Uses SQ_WAVE_CYCLES because
      SQ_ACCUM_PREV is non-functional on gfx1151. RDNA3.5 is primarily wave32 with 16
      wavefront slots per SIMD32 unit.
    Wave Life (cycles): |-
      Average number of cycles a wavefront was alive.
    SQ Busy: |-
      Percent of cycles the shader sequencer was busy (averaged across all CUs/WGPs).
    GPU Utilization: |-
      Percent of time the GPU was active.
    L2 Cache Hit Rate: |-
      GL2C last-level cache hit rate (same as Memory Chart / GL2C panel).
      Formula: 100 * GL2C_HIT_sum / (GL2C_HIT_sum + GL2C_MISS_sum) when the denominator is non-zero.
    L2-Fabric Read BW: |-
      Read bandwidth from L2 to memory fabric (EA read sizes include 96 B on RDNA3).
      Peak / % of peak are N/A (gfx1152 has no sysinfo memory bandwidth variable).
    L2-Fabric Write BW: |-
      Write bandwidth from L2 toward memory (same byte reconstruction as Write Size
      and counter_defs GL2C write sizing): 32 B per (GL2C_MC_WRREQ − GL2C_EA_WRREQ_64B)
      transaction plus 64 B per GL2C_EA_WRREQ_64B (64 B writes / CMPSWAP). Divided by
      kernel wall time for B/s. Peak / % of peak are N/A (no sysinfo memory bandwidth).
    Memory Controller Read BW: |-
      Memory controller read bandwidth. Peak / % of peak are N/A (no sysinfo memory bandwidth).
    Memory Controller Write BW: |-
      Memory controller write bandwidth. Peak / % of peak are N/A (no sysinfo memory bandwidth).
    MC Write Stall: |-
      Percent of cycles the memory controller write path was stalled (averaged across L2 channels).
    LDS Bank Conflicts: |-
      Number of LDS bank conflicts. Peak / % of Peak are N/A for raw counts.
    Fetch Size: |-
      Total kilobytes fetched from video memory (all L2-fabric read requests).
      Peak / % of Peak are N/A (kernel-dependent total, not a rate).
    Write Size: |-
      Total kilobytes written to video memory (MC write + fabric write requests).
      Peak / % of Peak are N/A (kernel-dependent total, not a rate).
    TA Busy Util Rate: |-
      Texture Addresser (TA) utilization vs GPU-active time: mean TA busy cycles
      (TA_BUSY_avr — average of TA_TA_BUSY over TA instances) as a percent of
      GRBM_GUI_ACTIVE. Peak / % of peak use 100% (TA fully busy whenever the GPU is active).
    TD Busy Util Rate: |-
      Texture Data (TD) utilization vs GPU-active time: mean TD busy cycles
      (TD_TD_BUSY_avr — average of TD_TD_BUSY over TD instances; TD_PERF_SEL_td_busy)
      as a percent of GRBM_GUI_ACTIVE. Complements TA Busy Util Rate (address vs data/sampler path).
    Write Unit Stalled: |-
      Percent of time the write unit was stalled (max across L2 channels).
    VMEM Issue Cycles per Wave: |-
      Average number of cycles (wall time) spent issuing VMEM address/data per wavefront.
      Peak / % of Peak are N/A.
    Wave Dependency Wait: |-
      Percent of wave lifetime spent waiting for data dependencies (e.g. VMEM/LDS results).
    Wave Issue Wait: |-
      Percent of wave lifetime spent waiting for any instruction to be ready to issue.
    TCP Cache Hit Rate: |-
      Texture Cache Per-pipe (TCP) hit rate. TCP is the L0 vector cache in RDNA3.5.
      Same as Memory Chart TCP Hit Rate: 100 * (TCP_REQ_sum - TCP_REQ_MISS_sum) / TCP_REQ_sum.
    TCP Cache BW: |-
      TCP request bandwidth (Memory Chart “TCP Request Bandwidth”): TCP_REQ_sum * 64 B divided by kernel wall time.
    GL1C Hit Rate: |-
      GL1 Cache hit rate (same as Memory Chart / GL1C panel).
      Formula: 100 * (GL1C_REQ_sum - GL1C_REQ_MISS_sum) / GL1C_REQ_sum when GL1C_REQ_sum != 0.
    GL1C Read BW: |-
      Achieved read bandwidth at GL1C (32/64/128 B request bins).
    GL2C Cache BW: |-
      Achieved bandwidth at GL2C from client read size counters (32/64/128 B) plus 96 B compressed reads.
    Scalar Data Cache Hit Rate: |-
      Same as Memory Chart Dcache Hit Rate: 100 * SQC_DCACHE_HITS_sum / SQC_DCACHE_REQ_sum
      when SQC_DCACHE_REQ_sum != 0.
    Scalar Data Cache BW: |-
      Bandwidth on the scalar data cache path.
    Instruction Cache Hit Rate: |-
      Same as Memory Chart Icache Hit Rate: 100 * SQC_ICACHE_HITS_sum / SQC_ICACHE_REQ_sum
      when SQC_ICACHE_REQ_sum != 0.
    Instruction Cache BW: |-
      Bandwidth on the instruction cache path.
