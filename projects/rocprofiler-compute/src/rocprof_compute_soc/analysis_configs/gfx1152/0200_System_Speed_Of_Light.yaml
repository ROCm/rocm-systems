# =============================================================================
# RDNA3.5 (gfx1152) - RDNA3.5 System Speed-of-Light Performance Metrics
# =============================================================================
# Note: RDNA3.5 uses standard VALU FLOPs (no matrix cores).
# Theoretical VALU peaks follow Navi3 / RDNA3 (GFX11) rates: 128 FP32 FMAs/CU/cycle (wave64),
# 256 FP16 ops/CU/cycle (2× FP32); per AMD shader throughput tables (Navi3 column).
# Cache hierarchy: TCP (L0) -> GL1C (L1) -> GL2C (L2)
# =============================================================================

Panel Config:
  id: 200
  title: System Speed-of-Light
  description: |-
    Top-level performance summary showing key metrics across compute, memory,
    and cache subsystems for RDNA3.5 (RDNA3.5).

  data source:

  # =========================================================================
  # Speed-of-Light Compute Metrics
  # =========================================================================
  - metric_table:
      id: 201
      title: "System Speed-of-Light"
      header:
        metric: Metric
        value: Avg
        unit: Unit
        peak: Peak
        pop: Pct of Peak
      metric:
        VALU Insts per Wave:
          value: AVG((SQ_INSTS_VALU / SQ_WAVES) if (SQ_WAVES != 0) else None)
          unit: Insts/Wave
          peak: AVG((SQ_INSTS_VALU / SQ_WAVES) if (SQ_WAVES != 0) else None)
          pop: AVG((SQ_INSTS_VALU / SQ_WAVES) if (SQ_WAVES != 0) else None)
        SALU Insts per Wave:
          value: AVG((SQ_INSTS_SALU / SQ_WAVES) if (SQ_WAVES != 0) else None)
          unit: Insts/Wave
          peak: AVG((SQ_INSTS_SALU / SQ_WAVES) if (SQ_WAVES != 0) else None)
          pop: AVG((SQ_INSTS_SALU / SQ_WAVES) if (SQ_WAVES != 0) else None)
        SMEM Insts per Wave:
          value: AVG((SQ_INSTS_SMEM / SQ_WAVES) if (SQ_WAVES != 0) else None)
          unit: Insts/Wave
          peak: AVG((SQ_INSTS_SMEM / SQ_WAVES) if (SQ_WAVES != 0) else None)
          pop: AVG((SQ_INSTS_SMEM / SQ_WAVES) if (SQ_WAVES != 0) else None)
        LDS Insts per Wave:
          value: AVG((SQ_INSTS_LDS / SQ_WAVES) if (SQ_WAVES != 0) else None)
          unit: Insts/Wave
          peak: AVG((SQ_INSTS_LDS / SQ_WAVES) if (SQ_WAVES != 0) else None)
          pop: AVG((SQ_INSTS_LDS / SQ_WAVES) if (SQ_WAVES != 0) else None)
        Tex Load Insts per Wave:
          value: AVG((SQ_INSTS_TEX_LOAD / SQ_WAVES) if (SQ_WAVES != 0) else None)
          unit: Insts/Wave
          peak: AVG((SQ_INSTS_TEX_LOAD / SQ_WAVES) if (SQ_WAVES != 0) else None)
          pop: AVG((SQ_INSTS_TEX_LOAD / SQ_WAVES) if (SQ_WAVES != 0) else None)
        Tex Store Insts per Wave:
          value: AVG((SQ_INSTS_TEX_STORE / SQ_WAVES) if (SQ_WAVES != 0) else None)
          unit: Insts/Wave
          peak: AVG((SQ_INSTS_TEX_STORE / SQ_WAVES) if (SQ_WAVES != 0) else None)
          pop: AVG((SQ_INSTS_TEX_STORE / SQ_WAVES) if (SQ_WAVES != 0) else None)
        Flat Insts per Wave:
          value: AVG((SQ_INSTS_FLAT / SQ_WAVES) if (SQ_WAVES != 0) else None)
          unit: Insts/Wave
          peak: AVG((SQ_INSTS_FLAT / SQ_WAVES) if (SQ_WAVES != 0) else None)
          pop: AVG((SQ_INSTS_FLAT / SQ_WAVES) if (SQ_WAVES != 0) else None)
        # RDNA3.5 VALU FLOPs - Standard vector operations
        VALU FLOPs (FP16):
          value: AVG(((SQ_INSTS_VALU_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)) / 1e9)
          unit: GFLOP/s
          peak: ((($max_sclk * $cu_per_gpu) * 256) / 1000)
          pop: ((100 * AVG(((SQ_INSTS_VALU_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)) / 1e9)) / ((($max_sclk * $cu_per_gpu) * 256) / 1000))
        VALU FLOPs (FP32):
          value: AVG(((SQ_INSTS_VALU_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)) / 1e9)
          unit: GFLOP/s
          peak: ((($max_sclk * $cu_per_gpu) * 128) / 1000)
          pop: ((100 * AVG(((SQ_INSTS_VALU_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)) / 1e9)) / ((($max_sclk * $cu_per_gpu) * 128) / 1000))
        IPC:
          value: AVG(((SQ_INSTS_ALL_sum - SQ_INSTS_INTERNAL_sum) / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
          unit: Instr/cycle
          peak: 5
          pop: ((100 * AVG((SQ_INSTS_ALL_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)) / 5)
        Wavefront Occupancy:
          value: AVG((SQ_WAVE_CYCLES_sum / (GRBM_GUI_ACTIVE_sum * $cu_per_gpu)))
          unit: Wavefronts
          peak: ($max_waves_per_cu * $cu_per_gpu)
          pop: (100 * AVG(((SQ_WAVE_CYCLES_sum / (GRBM_GUI_ACTIVE_sum * $cu_per_gpu)) / ($max_waves_per_cu * $cu_per_gpu))))
        Wave Life (cycles):
          value: AVG(((SQ_WAVE_CYCLES / SQ_WAVES) if (SQ_WAVES != 0) else None))
          unit: Cycles
          peak: AVG(((SQ_WAVE_CYCLES / SQ_WAVES) if (SQ_WAVES != 0) else None))
          pop: AVG(((SQ_WAVE_CYCLES / SQ_WAVES) if (SQ_WAVES != 0) else None))
        SQ Busy:
          value: AVG((100 * SQ_BUSY_CYCLES / (GRBM_GUI_ACTIVE * $cu_per_gpu)) if (GRBM_GUI_ACTIVE * $cu_per_gpu != 0) else None)
          unit: Percent
          peak: 100
          pop: AVG((100 * SQ_BUSY_CYCLES / (GRBM_GUI_ACTIVE * $cu_per_gpu)))
        GPU Utilization:
          value: AVG((100 * GRBM_GUI_ACTIVE / GRBM_COUNT) if (GRBM_COUNT != 0) else None)
          unit: Percent
          peak: 100
          pop: AVG((100 * GRBM_GUI_ACTIVE / GRBM_COUNT) if (GRBM_COUNT != 0) else None)
        L2 Cache Hit Rate:
          value: AVG((((100 * GL2C_HIT) / (GL2C_HIT + GL2C_MISS)) if
            ((GL2C_HIT + GL2C_MISS) != 0) else None))
          unit: Percent
          peak: 100
          pop: AVG((((100 * GL2C_HIT) / (GL2C_HIT + GL2C_MISS)) if
            ((GL2C_HIT + GL2C_MISS) != 0) else None))
        L2-Fabric Read BW:
          value: AVG(((GL2C_EA_RDREQ_32B * 32 + GL2C_EA_RDREQ_64B * 64
            + GL2C_EA_RDREQ_96B * 96 + GL2C_EA_RDREQ_128B * 128)
            / ((End_Timestamp - Start_Timestamp) / 1e9)))
          unit: Bytes/s
          peak: AVG(((GL2C_EA_RDREQ_32B * 32 + GL2C_EA_RDREQ_64B * 64
            + GL2C_EA_RDREQ_96B * 96 + GL2C_EA_RDREQ_128B * 128)
            / ((End_Timestamp - Start_Timestamp) / 1e9)))
          pop: AVG(((GL2C_EA_RDREQ_32B * 32 + GL2C_EA_RDREQ_64B * 64
            + GL2C_EA_RDREQ_96B * 96 + GL2C_EA_RDREQ_128B * 128)
            / ((End_Timestamp - Start_Timestamp) / 1e9)))
        L2-Fabric Write BW:
          value: AVG(((GL2C_EA_WRREQ_64B * 64)
            / ((End_Timestamp - Start_Timestamp) / 1e9)))
          unit: Bytes/s
          peak: AVG(((GL2C_EA_WRREQ_64B * 64)
            / ((End_Timestamp - Start_Timestamp) / 1e9)))
          pop: AVG(((GL2C_EA_WRREQ_64B * 64)
            / ((End_Timestamp - Start_Timestamp) / 1e9)))
        Memory Controller Read BW:
          value: AVG(((GL2C_MC_RDREQ * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)))
          unit: Bytes/s
          peak: AVG(((GL2C_MC_RDREQ * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)))
          pop: AVG(((GL2C_MC_RDREQ * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)))
        Memory Controller Write BW:
          value: AVG(((GL2C_MC_WRREQ * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)))
          unit: Bytes/s
          peak: AVG(((GL2C_MC_WRREQ * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)))
          pop: AVG(((GL2C_MC_WRREQ * 64) / ((End_Timestamp - Start_Timestamp) / 1e9)))
        MC Write Stall:
          value: AVG((100 * GL2C_MC_WRREQ_STALL / (GRBM_GUI_ACTIVE * $total_l2_chan)))
          unit: Percent
          peak: 100
          pop: AVG((100 * GL2C_MC_WRREQ_STALL / (GRBM_GUI_ACTIVE * $total_l2_chan)))
        LDS Bank Conflicts:
          value: AVG(SQC_LDS_BANK_CONFLICT)
          unit: Conflicts
          peak: AVG(SQC_LDS_BANK_CONFLICT)
          pop: AVG(SQC_LDS_BANK_CONFLICT)
        LDS Active Cycles:
          value: AVG((100 * SQC_LDS_IDX_ACTIVE / (GRBM_GUI_ACTIVE * $cu_per_gpu)))
          unit: Percent
          peak: 100
          pop: AVG((100 * SQC_LDS_IDX_ACTIVE / (GRBM_GUI_ACTIVE * $cu_per_gpu)))
        Wave32 VALU Insts per Wave:
          value: AVG(((SQ_INSTS_WAVE32_VALU / SQ_WAVES) if (SQ_WAVES != 0) else 0))
          unit: Insts/Wave
          peak: AVG(((SQ_INSTS_WAVE32_VALU / SQ_WAVES) if (SQ_WAVES != 0) else 0))
          pop: AVG(((SQ_INSTS_WAVE32_VALU / SQ_WAVES) if (SQ_WAVES != 0) else 0))
        Wave32 LDS Insts per Wave:
          value: AVG(((SQ_INSTS_WAVE32_LDS / SQ_WAVES) if (SQ_WAVES != 0) else 0))
          unit: Insts/Wave
          peak: AVG(((SQ_INSTS_WAVE32_LDS / SQ_WAVES) if (SQ_WAVES != 0) else 0))
          pop: AVG(((SQ_INSTS_WAVE32_LDS / SQ_WAVES) if (SQ_WAVES != 0) else 0))
        Occupancy per Active CU:
          value: AVG(((SQ_WAVE_CYCLES / SQ_BUSY_CYCLES) if (SQ_BUSY_CYCLES != 0) else 0))
          unit: Wavefronts
          peak: AVG(((SQ_WAVE_CYCLES / SQ_BUSY_CYCLES) if (SQ_BUSY_CYCLES != 0) else 0))
          pop: AVG(((SQ_WAVE_CYCLES / SQ_BUSY_CYCLES) if (SQ_BUSY_CYCLES != 0) else 0))
        Fetch Size:
          value: AVG(((GL2C_EA_RDREQ_32B * 32 + GL2C_EA_RDREQ_64B * 64
            + GL2C_EA_RDREQ_96B * 96 + GL2C_EA_RDREQ_128B * 128) / 1024))
          unit: KB
          peak: AVG(((GL2C_EA_RDREQ_32B * 32 + GL2C_EA_RDREQ_64B * 64
            + GL2C_EA_RDREQ_96B * 96 + GL2C_EA_RDREQ_128B * 128) / 1024))
          pop: AVG(((GL2C_EA_RDREQ_32B * 32 + GL2C_EA_RDREQ_64B * 64
            + GL2C_EA_RDREQ_96B * 96 + GL2C_EA_RDREQ_128B * 128) / 1024))
        Write Size:
          value: AVG((((GL2C_MC_WRREQ - GL2C_EA_WRREQ_64B) * 32 + GL2C_EA_WRREQ_64B * 64) / 1024))
          unit: KB
          peak: AVG((((GL2C_MC_WRREQ - GL2C_EA_WRREQ_64B) * 32 + GL2C_EA_WRREQ_64B * 64) / 1024))
          pop: AVG((((GL2C_MC_WRREQ - GL2C_EA_WRREQ_64B) * 32 + GL2C_EA_WRREQ_64B * 64) / 1024))
        TA Busy (avg):
          value: AVG((100 * TA_BUSY_avr / GRBM_GUI_ACTIVE))
          unit: Percent
          peak: 100
          pop: AVG((100 * TA_BUSY_avr / GRBM_GUI_ACTIVE))
        TA Busy (max):
          value: AVG((100 * TA_BUSY_max / GRBM_GUI_ACTIVE))
          unit: Percent
          peak: 100
          pop: AVG((100 * TA_BUSY_max / GRBM_GUI_ACTIVE))
        Memory Unit Busy:
          value: AVG((100 * TA_BUSY_max / GRBM_GUI_ACTIVE))
          unit: Percent
          peak: 100
          pop: AVG((100 * TA_BUSY_max / GRBM_GUI_ACTIVE))
        Write Unit Stalled:
          value: AVG((100 * GL2C_WRREQ_STALL_max / GRBM_GUI_ACTIVE))
          unit: Percent
          peak: 100
          pop: AVG((100 * GL2C_WRREQ_STALL_max / GRBM_GUI_ACTIVE))
        VMEM Issue Cycles per Wave:
          value: AVG(((4 * SQ_INST_CYCLES_VMEM / SQ_WAVES) if (SQ_WAVES != 0) else 0))
          unit: Cycles/Wave
          peak: AVG(((4 * SQ_INST_CYCLES_VMEM / SQ_WAVES) if (SQ_WAVES != 0) else 0))
          pop: AVG(((4 * SQ_INST_CYCLES_VMEM / SQ_WAVES) if (SQ_WAVES != 0) else 0))
        Wave Dependency Wait:
          value: AVG(((100 * SQ_WAIT_ANY / SQ_WAVE_CYCLES) if (SQ_WAVE_CYCLES != 0) else 0))
          unit: Percent
          peak: 100
          pop: AVG(((100 * SQ_WAIT_ANY / SQ_WAVE_CYCLES) if (SQ_WAVE_CYCLES != 0) else 0))
        Wave Issue Wait:
          value: AVG(((100 * SQ_WAIT_INST_ANY / SQ_WAVE_CYCLES) if (SQ_WAVE_CYCLES != 0) else 0))
          unit: Percent
          peak: 100
          pop: AVG(((100 * SQ_WAIT_INST_ANY / SQ_WAVE_CYCLES) if (SQ_WAVE_CYCLES != 0) else 0))
        Wave LDS Wait:
          value: AVG(((100 * SQ_WAIT_INST_LDS / SQ_WAVE_CYCLES) if (SQ_WAVE_CYCLES != 0) else 0))
          unit: Percent
          peak: 100
          pop: AVG(((100 * SQ_WAIT_INST_LDS / SQ_WAVE_CYCLES) if (SQ_WAVE_CYCLES != 0) else 0))
        # === Cache Hierarchy: TCP (L0) -> GL1C (L1) -> GL2C (L2) ===
        # TCP: Texture Cache Per-pipe (Vector L0 Cache per WGP)
        TCP Cache Hit Rate:
          value: ROUND((AVG((((TCP_REQ_sum - TCP_REQ_MISS_sum) / TCP_REQ_sum) if (TCP_REQ_sum != 0) else None)) * 100), 0)
          unit: Pct
          peak: 100
          pop: ROUND((AVG((((TCP_REQ_sum - TCP_REQ_MISS_sum) / TCP_REQ_sum) if (TCP_REQ_sum != 0) else None)) * 100), 0)
        TCP Cache BW:
          value: AVG((TCP_TA_REQ_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s
          peak: ((($max_sclk / 1000) * 256) * $cu_per_gpu * 1e9)
          pop: ((100 * AVG((TCP_TA_REQ_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))) / ((($max_sclk / 1000) * 256) * $cu_per_gpu * 1e9))
        # GL1C: Level-1 Graphics Cache
        GL1C Hit Rate:
          value: ROUND((AVG((((GL1C_REQ_sum - GL1C_REQ_MISS_sum) / GL1C_REQ_sum) if (GL1C_REQ_sum != 0) else None)) * 100), 0)
          unit: Pct
          peak: 100
          pop: ROUND((AVG((((GL1C_REQ_sum - GL1C_REQ_MISS_sum) / GL1C_REQ_sum) if (GL1C_REQ_sum != 0) else None)) * 100), 0)
        GL1C Read BW:
          # Note: GL1C requests can be 32B, 64B, or 128B. Using size-specific counters for accuracy.
          value: AVG((GL1C_REQ_READ_32B_sum*32 + GL1C_REQ_READ_64B_sum*64 + GL1C_REQ_READ_128B_sum*128) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s
          peak: ((($max_sclk / 1000) * 128) * $se_per_gpu * 1e9)
          pop: ((100 * AVG((GL1C_REQ_READ_32B_sum*32 + GL1C_REQ_READ_64B_sum*64 + GL1C_REQ_READ_128B_sum*128) / ((End_Timestamp - Start_Timestamp) / 1e9))) / ((($max_sclk / 1000) * 128) * $se_per_gpu * 1e9))
        # GL2C: Level-2 Graphics Cache (Last-level cache)
        GL2C Hit Rate:
          value: AVG((((100 * GL2C_HIT_sum) / (GL2C_HIT_sum + GL2C_MISS_sum)) if ((GL2C_HIT_sum + GL2C_MISS_sum) != 0) else None))
          unit: pct
          peak: 100
          pop: AVG((((100 * GL2C_HIT_sum) / (GL2C_HIT_sum + GL2C_MISS_sum)) if ((GL2C_HIT_sum + GL2C_MISS_sum) != 0) else None))
        GL2C Cache BW:
          # Note: GL2C requests can be 32B, 64B, or 128B. Using size-specific counters for accuracy.
          value: AVG((GL2C_READ_32_REQ_sum*32 + GL2C_READ_64_REQ_sum*64 + GL2C_READ_128_REQ_sum*128) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s
          peak: ((($max_sclk / 1000) * 128) * TO_INT_sum($total_l2_chan) * 1e9)
          pop: ((100 * AVG((GL2C_READ_32_REQ_sum*32 + GL2C_READ_64_REQ_sum*64 + GL2C_READ_128_REQ_sum*128) / ((End_Timestamp - Start_Timestamp) / 1e9))) / ((($max_sclk / 1000) * 128) * TO_INT_sum($total_l2_chan) * 1e9))
        Scalar Data Cache Hit Rate:
          value: AVG((((100 * SQC_DCACHE_HITS_sum) / (SQC_DCACHE_HITS_sum + SQC_DCACHE_MISSES_sum)) if ((SQC_DCACHE_HITS_sum + SQC_DCACHE_MISSES_sum) != 0) else None))
          unit: pct
          peak: 100
          pop: AVG((((100 * SQC_DCACHE_HITS_sum) / (SQC_DCACHE_HITS_sum + SQC_DCACHE_MISSES_sum)) if ((SQC_DCACHE_HITS_sum + SQC_DCACHE_MISSES_sum) != 0) else None))
        Scalar Data Cache BW:
          value: AVG((SQC_DCACHE_REQ_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s
          peak: ((($max_sclk / 1000) * 64) * $sqc_per_gpu * 1e9)
          pop: ((100 * AVG((SQC_DCACHE_REQ_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))) / ((($max_sclk / 1000) * 64) * $sqc_per_gpu * 1e9))
        Instruction Cache Hit Rate:
          value: AVG(((100 * SQC_ICACHE_HITS_sum) / (SQC_ICACHE_HITS_sum + SQC_ICACHE_MISSES_sum)))
          unit: pct
          peak: 100
          pop: AVG(((100 * SQC_ICACHE_HITS_sum) / (SQC_ICACHE_HITS_sum + SQC_ICACHE_MISSES_sum)))
        Instruction Cache BW:
          value: AVG((SQC_ICACHE_REQ_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s
          peak: ((($max_sclk / 1000) * 64) * $sqc_per_gpu * 1e9)
          pop: ((100 * AVG((SQC_ICACHE_REQ_sum * 64) / ((End_Timestamp - Start_Timestamp) / 1e9))) / ((($max_sclk / 1000) * 64) * $sqc_per_gpu * 1e9))

  metrics_description:
    VALU FLOPs (FP16): |-
      The number of 16-bit floating point VALU operations executed per second on 
      RDNA3.5 (RDNA3.5). RDNA3.5 WGPs contain 2 CUs with 2 SIMD32 units each.
      Theoretical FP16 peak is 2× the FP32 FMA peak (packed half precision).
      Peak calculation: max_sclk × CU_count × 256 ops/cycle (Navi3 / RDNA3-class).
    VALU FLOPs (FP32): |-
      The number of 32-bit floating point VALU operations executed per second.
      Navi3-class (RDNA3) CUs sustain up to 128 V_FMA_F32 ops per cycle per CU
      in wave64 mode (dual-issue VALU). Peak: max_sclk × CU_count × 128 ops/cycle.
    IPC: |-
      Instructions Per Cycle - The ratio of instructions executed over busy cycles.
      Calculated as (Total Instructions - Internal Instructions) / Busy Cycles.
      Higher IPC indicates better instruction throughput.
    Wavefront Occupancy: |-
      The time-averaged number of wavefronts resident on the GPU during kernel 
      execution. RDNA3.5 uses Wave32 as the primary wavefront size with 16 
      wavefront slots per SIMD32 unit. Higher occupancy helps hide memory latency.
    TCP Cache Hit Rate: |-
      Texture Cache Per-pipe (TCP) hit rate. TCP is the L0 vector cache in RDNA3.5,
      providing per-WGP caching of vector memory accesses. Calculated as 
      (Requests - Misses) / Requests. Higher hit rates reduce memory traffic to GL1C.
    TCP Cache BW: |-
      Achieved bandwidth at the TCP (L0 cache) level. Measures actual data transfer
      rate between shader cores and the TCP. This is the first level of the 
      RDNA3.5 cache hierarchy before GL1C.
    GL1C Hit Rate: |-
      GL1 Cache hit rate. GL1C is the shared L1 cache serving multiple WGPs within
      a Shader Engine. It sits between TCP and GL2C in the cache hierarchy.
    GL1C Read BW: |-
      Achieved read bandwidth at the GL1C level, measured as requests × cache line
      size (128 bytes). This metric shows data flow from GL1C to TCP.
    GL2C Hit Rate: |-
      GL2 Cache (L2) hit rate. GL2C is the last-level cache shared across the GPU
      before accessing system memory. Higher hit rates reduce off-chip memory traffic.
    GL2C Cache BW: |-
      Achieved bandwidth at the GL2C (L2 cache) level. This represents the total
      cache bandwidth before going to DRAM or system memory.
    Scalar Data Cache Hit Rate: |-
      The percent of Scalar Data Cache requests that hit. SQC-Dcache stores uniform
      scalar data accessed via SMEM instructions. High hit rates indicate good 
      constant data locality.
    Scalar Data Cache BW: |-
      Bandwidth achieved on the scalar data cache path. SMEM operations use this
      path for loading uniform data shared across a wave.
    Instruction Cache Hit Rate: |-
      The percent of Instruction Cache requests that hit. High hit rates indicate
      good instruction locality and reduce instruction fetch stalls.
    Instruction Cache BW: |-
      Bandwidth achieved on the instruction cache path. This affects how quickly
      shader instructions can be fetched and executed.
    VALU Insts per Wave: |-
      Average number of VALU instructions issued per wavefront.
    SALU Insts per Wave: |-
      Average number of SALU instructions issued per wavefront.
    SMEM Insts per Wave: |-
      Average number of scalar memory instructions per wavefront.
    LDS Insts per Wave: |-
      Average number of LDS instructions per wavefront.
    Tex Load Insts per Wave: |-
      Average texture load instructions per wavefront.
    Tex Store Insts per Wave: |-
      Average texture store instructions per wavefront.
    Flat Insts per Wave: |-
      Average flat memory instructions per wavefront.
    Wavefront Occupancy: |-
      Time-averaged number of wavefronts resident on the GPU (derived from SQ_WAVE_CYCLES since SQ_ACCUM_PREV is non-functional on gfx1151).
    Wave Life (cycles): |-
      Average number of cycles a wavefront was alive.
    SQ Busy: |-
      Percent of cycles the shader sequencer was busy (averaged across all CUs/WGPs).
    GPU Utilization: |-
      Percent of time the GPU was active.
    L2 Cache Hit Rate: |-
      Ratio of L2 cache hits to total L2 accesses.
    L2-Fabric Read BW: |-
      Read bandwidth from L2 to memory fabric.
    L2-Fabric Write BW: |-
      Write bandwidth from L2 to memory fabric.
    Memory Controller Read BW: |-
      Memory controller read bandwidth.
    Memory Controller Write BW: |-
      Memory controller write bandwidth.
    MC Write Stall: |-
      Percent of cycles the memory controller write path was stalled (averaged across L2 channels).
    LDS Bank Conflicts: |-
      Number of LDS bank conflicts.
    LDS Active Cycles: |-
      Percent of cycles the LDS was active across all CUs.
    Wave32 VALU Insts per Wave: |-
      Average wave32 VALU instructions per wavefront (wave64 may count 1 or 2).
    Wave32 LDS Insts per Wave: |-
      Average wave32 LDS instructions per wavefront.
    Occupancy per Active CU: |-
      Ratio of SQ_WAVE_CYCLES to SQ_BUSY_CYCLES — approximate wavefronts per active SQ. Note that RDNA SQ counting semantics differ from CDNA, so this is informational only.
    Fetch Size: |-
      Total kilobytes fetched from video memory (all L2-fabric read requests).
    Write Size: |-
      Total kilobytes written to video memory (MC write + fabric write requests).
    TA Busy (avg): |-
      Average percent of cycles TA was busy across instances.
    TA Busy (max): |-
      Maximum percent of cycles TA was busy across instances.
    Memory Unit Busy: |-
      Percent of time the memory unit (TA) is active including stalls (max across TA instances / GRBM_GUI_ACTIVE).
    Write Unit Stalled: |-
      Percent of time the write unit was stalled (max across L2 channels).
    VMEM Issue Cycles per Wave: |-
      Average number of cycles (wall time) spent issuing VMEM address/data per wavefront. Higher values indicate more memory traffic per wave.
    Wave Dependency Wait: |-
      Percent of wave lifetime spent waiting for data dependencies (e.g. waiting for VMEM/LDS results). High values indicate the kernel is latency-bound.
    Wave Issue Wait: |-
      Percent of wave lifetime spent waiting for any instruction to be ready to issue. Includes all stall sources.
    Wave LDS Wait: |-
      Percent of wave lifetime spent waiting specifically for LDS instructions to issue. High values indicate LDS contention.
