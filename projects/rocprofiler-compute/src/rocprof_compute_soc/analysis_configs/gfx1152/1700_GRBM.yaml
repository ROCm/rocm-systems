# =============================================================================
# RDNA3.5 (gfx1152) - RDNA3.5 GRBM (Graphics Register Bus Manager) Metrics
# =============================================================================
# GRBM provides top-level GPU utilization metrics
# =============================================================================

Panel Config:
  id: 1700
  title: Graphics Register Bus Manager (GRBM)
  data source:
  # =========================================================================
  # GPU Utilization
  # =========================================================================
  - metric_table:
      id: 1701
      title: "GPU Utilization"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GPU Busy:
          avg: AVG((100 * GRBM_GUI_ACTIVE_sum / GRBM_COUNT_sum) if (GRBM_COUNT_sum != 0) else None)
          min: MIN((100 * GRBM_GUI_ACTIVE_sum / GRBM_COUNT_sum) if (GRBM_COUNT_sum != 0) else None)
          max: MAX((100 * GRBM_GUI_ACTIVE_sum / GRBM_COUNT_sum) if (GRBM_COUNT_sum != 0) else None)
          unit: Percent
        CP Busy:
          avg: AVG((100 * GRBM_CP_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          min: MIN((100 * GRBM_CP_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          max: MAX((100 * GRBM_CP_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          unit: Percent
        SPI Busy:
          avg: AVG((100 * GRBM_SPI_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          min: MIN((100 * GRBM_SPI_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          max: MAX((100 * GRBM_SPI_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          unit: Percent
        # Fixme: GRBM_GL2C_BUSY_sum not available - commenting out metric
        # GL2C Busy:
        #   avg: AVG((100 * GRBM_GL2C_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
        #   min: MIN((100 * GRBM_GL2C_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
        #   max: MAX((100 * GRBM_GL2C_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
        #   unit: Percent

  # =========================================================================
  # Shader Engine Utilization
  # =========================================================================
  - metric_table:
      id: 1702
      title: "Shader Engine Utilization"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        TA Busy:
          avg: AVG((100 * GRBM_TA_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          min: MIN((100 * GRBM_TA_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          max: MAX((100 * GRBM_TA_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          unit: Percent
        SX Busy:
          avg: AVG((100 * GRBM_SX_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          min: MIN((100 * GRBM_SX_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          max: MAX((100 * GRBM_SX_BUSY_sum / GRBM_GUI_ACTIVE_sum) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          unit: Percent

  metrics_description:
    GPU Busy: |-
      Percentage of time the GPU was actively processing work.
      Calculated as GUI_ACTIVE / GRBM_COUNT cycles.
    CP Busy: |-
      Percentage of cycles the Command Processor was busy.
      CP handles kernel dispatch and command stream processing.
    SPI Busy: |-
      Percentage of cycles the Shader Processor Input was busy.
      SPI handles wave scheduling and resource allocation.
    # Fixme: GRBM_GL2C_BUSY_sum not available - commenting out description
    # GL2C Busy: |-
    #   Percentage of cycles the GL2 Cache was busy.
    #   High utilization indicates memory-intensive workload.
    TA Busy: |-
      Percentage of cycles the Texture Addresser was busy.
    SX Busy: |-
      Percentage of cycles the Shader Export was busy.
