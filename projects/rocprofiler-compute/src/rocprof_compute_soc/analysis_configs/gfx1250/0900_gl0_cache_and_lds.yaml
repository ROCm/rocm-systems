# =============================================================================
# gfx1250 GL0 Cache and LDS Metrics
# =============================================================================
#
# The GL0 Cache (also known as VMW - Vector Memory Write) is the L0 cache
# integrated with each WGP. It handles both cache operations and LDS (Local
# Data Share) accesses. This file covers cache utilization, requests, lookups,
# LDS accesses, set-slot dynamics, GL0-GL1 interface, and UTCL0 processing.
#
# =============================================================================

Panel Config:
  id: 900
  title: GL0 Cache and LDS
  description: |-
    GL0 Cache and LDS metrics for gfx1250. The GL0 cache (VMW) is integrated with
    each WGP and handles both L0 cache operations and LDS accesses. This panel
    covers cache utilization, hit rates, stall analysis, LDS performance,
    GL0-GL1 interface metrics, and address translation (UTCL0) statistics.

  data source:

  - metric_table:
      id: 901
      title: WGP Cache Utilization (LDS + GL0)
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        # Utilization: TX_VMW_VMW_BUSY_sum is summed across all GL0 cache units (one per WGP).
        Utilization:
          avg: 100 * SUM(TX_VMW_VMW_BUSY_sum) / SUM(GRBM_GUI_ACTIVE_sum * $cu_per_gpu)
          min: 100 * MIN(TX_VMW_VMW_BUSY_sum / (GRBM_GUI_ACTIVE_sum * $cu_per_gpu))
          max: 100 * MAX(TX_VMW_VMW_BUSY_sum / (GRBM_GUI_ACTIVE_sum * $cu_per_gpu))
          unit: Percent

  - metric_table:
      id: 902
      title: Cache Requests
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Total Requests:
          avg: SUM(TX_VMW_REQ_sum) / SUM($denom)
          min: MIN(TX_VMW_REQ_sum / $denom)
          max: MAX(TX_VMW_REQ_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - Read:
          avg: SUM(TX_VMW_REQ_READ_sum) / SUM($denom)
          min: MIN(TX_VMW_REQ_READ_sum / $denom)
          max: MAX(TX_VMW_REQ_READ_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - Write:
          avg: SUM(TX_VMW_REQ_WRITE_sum) / SUM($denom)
          min: MIN(TX_VMW_REQ_WRITE_sum / $denom)
          max: MAX(TX_VMW_REQ_WRITE_sum / $denom)
          unit: (Count + $normUnit)
        Request Stall Rate:
          avg: 100 * SUM(TX_VMW_VMW_VCA_REQ_STALL_sum) / SUM(TX_VMW_GATE_EN1_sum)
          min: 100 * MIN(TX_VMW_VMW_VCA_REQ_STALL_sum / TX_VMW_GATE_EN1_sum)
          max: 100 * MAX(TX_VMW_VMW_VCA_REQ_STALL_sum / TX_VMW_GATE_EN1_sum)
          unit: Percent
        Request Latency:
          avg: SUM(TX_VMW_VMW_LATENCY_sum) / SUM(TX_VMW_REQ_sum)
          min: MIN(TX_VMW_VMW_LATENCY_sum / TX_VMW_REQ_sum)
          max: MAX(TX_VMW_VMW_LATENCY_sum / TX_VMW_REQ_sum)
          unit: Cycles
        Total Requests - Sectors:
          avg: SUM(TX_VMW_SECTORS_sum) / SUM($denom)
          min: MIN(TX_VMW_SECTORS_sum / $denom)
          max: MAX(TX_VMW_SECTORS_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - Sector Reads:
          avg: SUM(TX_VMW_SECTORS_READ_sum) / SUM($denom)
          min: MIN(TX_VMW_SECTORS_READ_sum / $denom)
          max: MAX(TX_VMW_SECTORS_READ_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - Sector Writes:
          avg: SUM(TX_VMW_SECTORS_WRITE_sum) / SUM($denom)
          min: MIN(TX_VMW_SECTORS_WRITE_sum / $denom)
          max: MAX(TX_VMW_SECTORS_WRITE_sum / $denom)
          unit: (Count + $normUnit)
  - metric_table:
      id: 903
      title: Cache Lookup
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Cache Lookup Hit Rate:
          avg: 100 * SUM(1 - TX_VMW_REQ_MISS_sum) / SUM(TX_VMW_REQ_sum)
          min: 100 * MIN(1 - TX_VMW_REQ_MISS_sum / TX_VMW_REQ_sum)
          max: 100 * MAX(1 - TX_VMW_REQ_MISS_sum / TX_VMW_REQ_sum)
          unit: Percent
        Cache Sector Lookup Hit Rate:
          avg: 100 * SUM(1 - TX_VMW_SECTOR_MISS_sum) / SUM(TX_VMW_SECTORS_sum)
          min: 100 * MIN(1 - TX_VMW_SECTOR_MISS_sum / TX_VMW_SECTORS_sum)
          max: 100 * MAX(1 - TX_VMW_SECTOR_MISS_sum / TX_VMW_SECTORS_sum)
          unit: Percent
        Cache Capacity Stall Rate:
          avg: 100 * SUM(TX_VMW_ALLOC_STALL_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_ALLOC_STALL_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_ALLOC_STALL_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Cache Total Conflict Stall Rate:
          avg: 100 * SUM(TX_VMW_TOTAL_CONFLICT_STALLS_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_TOTAL_CONFLICT_STALLS_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_TOTAL_CONFLICT_STALLS_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Latency FIFO Stall Rate:
          avg: 100 * SUM(TX_VMW_LFIFO_STALL_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_LFIFO_STALL_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_LFIFO_STALL_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        GL1 Memory Request FIFO Stall Rate:
          avg: 100 * SUM(TX_VMW_MEM_REQ_FIFO_STALL_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_MEM_REQ_FIFO_STALL_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_MEM_REQ_FIFO_STALL_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        # Return Queue Pending Stall Rate: TX_VMW_GL1_PENDING_STALL and TX_VMW_VMW_BUSY
        # are in different profiling passes (TX block is at full capacity — 8 counters/pass,
        # leaving no room to co-locate them via the grouping policy). For memory-bound
        # workloads with low GL0 utilization (e.g. vcopy), cross-pass collection can
        # inflate this ratio above 100%. The value reflects real GL1 back-pressure but
        # with an amplification artifact from different measurement windows.
        Return Queue Pending Stall Rate:
          avg: 100 * SUM(TX_VMW_GL1_PENDING_STALL_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_GL1_PENDING_STALL_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_GL1_PENDING_STALL_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Cache Write Stall Rate - GL1 Read Return:
          avg: 100 * SUM(TX_VMW_GL1_VMW_RDRET_STALL_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_GL1_VMW_RDRET_STALL_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_GL1_VMW_RDRET_STALL_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Set Conflict Stall Rate - Cache Read:
          avg: 100 * SUM(TX_VMW_READ_SETCONFLICT_STALL_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_READ_SETCONFLICT_STALL_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_READ_SETCONFLICT_STALL_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Set Conflict Stall Rate - Cache Write:
          avg: 100 * SUM(TX_VMW_WRITE_SETCONFLICT_STALL_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_WRITE_SETCONFLICT_STALL_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_WRITE_SETCONFLICT_STALL_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Set Conflict Stall Rate - Atomics:
          avg: 100 * SUM(TX_VMW_ATOMIC_SETCONFLICT_STALL_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_ATOMIC_SETCONFLICT_STALL_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_ATOMIC_SETCONFLICT_STALL_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Cache RAM Bank Conflict Stall Rate - Read:
          avg: 100 * SUM(TX_VMW_READ_DATACONFLICT_STALL_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_READ_DATACONFLICT_STALL_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_READ_DATACONFLICT_STALL_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Cache RAM Bank Conflict Stall Rate - Write:
          avg: 100 * SUM(TX_VMW_WRITE_DATACONFLICT_STALL_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_WRITE_DATACONFLICT_STALL_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_WRITE_DATACONFLICT_STALL_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Segment Conflict Stall Rate - Cache:
          avg: 100 * SUM(TX_VMW_CROSS_PORT_SEGMENT_CONFLICT_VC_STALLED_CYCLES_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_CROSS_PORT_SEGMENT_CONFLICT_VC_STALLED_CYCLES_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_CROSS_PORT_SEGMENT_CONFLICT_VC_STALLED_CYCLES_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent

  - metric_table:
      id: 904
      title: LDS Accesses
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        # Show N/A when no user LDS traffic (TX_VMW_LDS_INPUT_ACTIVE_sum == 0).
        LDS Utilization:
          avg: 100 * SUM(TX_VMW_LDS_INPUT_ACTIVE_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_LDS_INPUT_ACTIVE_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_LDS_INPUT_ACTIVE_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        # LDS Utilization (Load/Store/Atomics): TX_VMW_LDS_ACTIVE_*_CNT counters count
        # internal hardware LDS pipeline slots, not user LDS operations. They return
        # large non-zero values even for kernels with LDS_Per_Workgroup=0 (e.g. vcopy).
        # Guard with TX_VMW_LDS_INPUT_ACTIVE_sum > 0 to suppress meaningless ratios
        # for non-LDS workloads. TX_VMW_LDS_INPUT_ACTIVE is 0 when no LDS input is
        # active, correctly identifying kernels with no user LDS operations.
        LDS Utilization - Load:
          avg: 100 * SUM(TX_VMW_LDS_ACTIVE_LOAD_CNT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_LDS_ACTIVE_LOAD_CNT_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_LDS_ACTIVE_LOAD_CNT_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        LDS Utilization - Store:
          avg: 100 * SUM(TX_VMW_LDS_ACTIVE_STORE_CNT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_LDS_ACTIVE_STORE_CNT_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_LDS_ACTIVE_STORE_CNT_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        LDS Utilization - Atomics:
          avg: 100 * SUM(TX_VMW_LDS_ACTIVE_ATOMIC_CNT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_LDS_ACTIVE_ATOMIC_CNT_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_LDS_ACTIVE_ATOMIC_CNT_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        LDS Bank Conflict Stall Rate:
          avg: 100 * SUM(TX_VMW_LDS_BANK_CONFLICT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_LDS_BANK_CONFLICT_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_LDS_BANK_CONFLICT_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        LDS Bank Conflict Stall Rate - Read:
          avg: 100 * SUM(TX_VMW_LDS_BANKCONF_LOAD_CNT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_LDS_BANKCONF_LOAD_CNT_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_LDS_BANKCONF_LOAD_CNT_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        LDS Bank Conflict Stall Rate - Write:
          avg: 100 * SUM(TX_VMW_LDS_BANKCONF_STORE_CNT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_LDS_BANKCONF_STORE_CNT_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_LDS_BANKCONF_STORE_CNT_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        LDS Bank Conflict Stall Rate - Atomic:
          avg: 100 * SUM(TX_VMW_LDS_BANKCONF_ATOMIC_CNT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_LDS_BANKCONF_ATOMIC_CNT_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_LDS_BANKCONF_ATOMIC_CNT_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        LDS Address Conflict Stall Rate:
          avg: 100 * SUM(TX_VMW_LDS_ADDR_CONFLICT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_LDS_ADDR_CONFLICT_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_LDS_ADDR_CONFLICT_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Segment Conflict Stall Rate - LDS:
          avg: 100 * SUM(TX_VMW_CROSS_PORT_SEGMENT_CONFLICT_LDS_STALLED_CYCLES_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_CROSS_PORT_SEGMENT_CONFLICT_LDS_STALLED_CYCLES_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_CROSS_PORT_SEGMENT_CONFLICT_LDS_STALLED_CYCLES_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        LDS Stall Rate:
          avg: 100 * SUM(TX_VMW_LDS_LDS_EXECUTION_STALL_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_LDS_LDS_EXECUTION_STALL_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_LDS_LDS_EXECUTION_STALL_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent

  - metric_table:
      id: 905
      title: Set-Slot Dynamics
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Slot Replacement Rate:
          avg: 100 * SUM(TX_VMW_SLOT_REPLACEMENT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_SLOT_REPLACEMENT_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_SLOT_REPLACEMENT_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Slot Hit Rate:
          avg: 100 * SUM(TX_VMW_SLOT_HIT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_SLOT_HIT_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_SLOT_HIT_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Set Conflict Stall - Same Port:
          avg: 100 * SUM(TX_VMW_SET_CONFLICT_STALL_SAME_PORT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_SET_CONFLICT_STALL_SAME_PORT_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_SET_CONFLICT_STALL_SAME_PORT_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Slot Replacement Stall - Same Port:
          avg: 100 * SUM(TX_VMW_SLOT_STALL_SAME_PORT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_SLOT_STALL_SAME_PORT_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_SLOT_STALL_SAME_PORT_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        Slot Replacement Stall - Cross Port:
          avg: 100 * SUM(TX_VMW_SLOT_STALL_CROSS_PORT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_SLOT_STALL_CROSS_PORT_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_SLOT_STALL_CROSS_PORT_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent

  - metric_table:
      id: 906
      title: GL0-GL1 Interface - Requests and Bandwidth
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL0-GL1 Read Requests:
          avg: SUM(TX_VMW_GL1_REQ_READ_sum) / SUM($denom)
          min: MIN(TX_VMW_GL1_REQ_READ_sum / $denom)
          max: MAX(TX_VMW_GL1_REQ_READ_sum / $denom)
          unit: (Count + $normUnit)
        GL0-GL1 Read Bandwidth:
          avg: SUM(TX_VMW_GL1_REQ_READ_64B_sum * 64 + TX_VMW_GL1_REQ_READ_128B_sum * 128 + TX_VMW_GL1_READ_REQ_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          min: MIN((TX_VMW_GL1_REQ_READ_64B_sum * 64 + TX_VMW_GL1_REQ_READ_128B_sum * 128 + TX_VMW_GL1_READ_REQ_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          max: MAX((TX_VMW_GL1_REQ_READ_64B_sum * 64 + TX_VMW_GL1_REQ_READ_128B_sum * 128 + TX_VMW_GL1_READ_REQ_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          unit: GB/s
        GL0-GL1 Write Requests:
          avg: SUM(TX_VMW_GL1_REQ_WRITE_sum) / SUM($denom)
          min: MIN(TX_VMW_GL1_REQ_WRITE_sum / $denom)
          max: MAX(TX_VMW_GL1_REQ_WRITE_sum / $denom)
          unit: (Count + $normUnit)
        GL0-GL1 Write Bandwidth:
          avg: SUM(TX_VMW_GL1_WRITE_REQ_128B_sum * 128 + TX_VMW_GL1_WRITE_REQ_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          min: MIN((TX_VMW_GL1_WRITE_REQ_128B_sum * 128 + TX_VMW_GL1_WRITE_REQ_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          max: MAX((TX_VMW_GL1_WRITE_REQ_128B_sum * 128 + TX_VMW_GL1_WRITE_REQ_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          unit: GB/s
        GL0-GL1 Atomic Requests - With Return:
          avg: SUM(TX_VMW_GL1_REQ_ATOMIC_WITH_RET_sum) / SUM($denom)
          min: MIN(TX_VMW_GL1_REQ_ATOMIC_WITH_RET_sum / $denom)
          max: MAX(TX_VMW_GL1_REQ_ATOMIC_WITH_RET_sum / $denom)
          unit: (Count + $normUnit)
        GL0-GL1 Atomic Requests - Without Return:
          avg: SUM(TX_VMW_GL1_REQ_ATOMIC_WITHOUT_RET_sum) / SUM($denom)
          min: MIN(TX_VMW_GL1_REQ_ATOMIC_WITHOUT_RET_sum / $denom)
          max: MAX(TX_VMW_GL1_REQ_ATOMIC_WITHOUT_RET_sum / $denom)
          unit: (Count + $normUnit)
        GL0-GL1 Cluster Request:
          avg: SUM(TX_VMW_GL1_CLUSTER_REQ_sum) / SUM($denom)
          min: MIN(TX_VMW_GL1_CLUSTER_REQ_sum / $denom)
          max: MAX(TX_VMW_GL1_CLUSTER_REQ_sum / $denom)
          unit: (Count + $normUnit)
        GL0-GL1 Prefetch Request - CU Scope:
          avg: SUM(TX_VMW_GL1_REQ_CU_PREFETCH_sum) / SUM($denom)
          min: MIN(TX_VMW_GL1_REQ_CU_PREFETCH_sum / $denom)
          max: MAX(TX_VMW_GL1_REQ_CU_PREFETCH_sum / $denom)
          unit: (Count + $normUnit)
        GL0-GL1 Prefetch Request - GL2 Scope:
          avg: SUM(TX_VMW_GL1_REQ_L2_PREFETCH_sum) / SUM($denom)
          min: MIN(TX_VMW_GL1_REQ_L2_PREFETCH_sum / $denom)
          max: MAX(TX_VMW_GL1_REQ_L2_PREFETCH_sum / $denom)
          unit: (Count + $normUnit)
  - metric_table:
      id: 907
      title: GL0-GL1 Interface - Latency
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL0-GL1 Read Latency:
          avg: SUM(TX_VMW_GL1_READ_LATENCY_sum) / SUM(TX_VMW_GL1_REQ_READ_sum)
          min: MIN(TX_VMW_GL1_READ_LATENCY_sum / TX_VMW_GL1_REQ_READ_sum)
          max: MAX(TX_VMW_GL1_READ_LATENCY_sum / TX_VMW_GL1_REQ_READ_sum)
          unit: Cycles
        GL0-GL1 Write Latency:
          avg: SUM(TX_VMW_GL1_WRITE_LATENCY_sum) / SUM(TX_VMW_GL1_REQ_WRITE_sum)
          min: MIN(TX_VMW_GL1_WRITE_LATENCY_sum / TX_VMW_GL1_REQ_WRITE_sum)
          max: MAX(TX_VMW_GL1_WRITE_LATENCY_sum / TX_VMW_GL1_REQ_WRITE_sum)
          unit: Cycles
        GL0-GL1 Cluster Request Latency:
          avg: SUM(TX_VMW_GL1_CLUSTER_LATENCY_sum) / SUM(TX_VMW_GL1_CLUSTER_REQ_sum)
          min: MIN(TX_VMW_GL1_CLUSTER_LATENCY_sum / TX_VMW_GL1_CLUSTER_REQ_sum)
          max: MAX(TX_VMW_GL1_CLUSTER_LATENCY_sum / TX_VMW_GL1_CLUSTER_REQ_sum)
          unit: Cycles

  - metric_table:
      id: 908
      title: GL0-GL1 Interface - Stalls
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL0-GL1 Request Stall:
          avg: 100 * SUM(TX_VMW_GL1_VMW_BACK_PRESSURE_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_GL1_VMW_BACK_PRESSURE_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_GL1_VMW_BACK_PRESSURE_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        GL0 Cache RAM Read Stall by GL1 Write:
          avg: 100 * SUM(TX_VMW_GL1_GRANT_READ_STALL_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          min: 100 * MIN(TX_VMW_GL1_GRANT_READ_STALL_sum / TX_VMW_VMW_BUSY_sum)
          max: 100 * MAX(TX_VMW_GL1_GRANT_READ_STALL_sum / TX_VMW_VMW_BUSY_sum)
          unit: Percent
        GL0 Cache RAM Write Stall by GL1 Return:
