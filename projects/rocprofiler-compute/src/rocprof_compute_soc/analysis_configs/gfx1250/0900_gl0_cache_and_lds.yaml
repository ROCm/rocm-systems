  metrics_description:
    Utilization: >-
      Percentage of cycles GL1 has outstanding memory requests.

    Total Requests: >-
      Total GL0 cache requests.

    Total Requests - Read: >-
      Number of GL0 cache read requests.

    Total Requests - Write: >-
      Number of GL0 cache write requests.

    Request Stall Rate: >-
      Percentage of VMW-busy cycles the GL0 cache cannot accept a new request.

    Request Latency: >-
      Average GL0 cache request latency.

    Total Requests - Sectors: >-
      Total cache sectors involved in GL0 requests.

    Total Requests - Sector Reads: >-
      Number of GL0 cache sectors read.

    Total Requests - Sector Writes: >-
      Number of GL0 cache sectors written.

    Cache Lookup Hit Rate: >-
      GL0 cache lookup hit rate.

    Cache Sector Lookup Hit Rate: >-
      GL0 cache sector-level lookup hit rate.

    Cache Capacity Stall Rate: >-
      Percentage of VMW-busy cycles stalled due to no free GL0 cache lines or MSHR entries.

    Cache Total Conflict Stall Rate: >-
      Percentage of VMW-busy cycles stalled due to any GL0 cache conflict.

    Latency FIFO Stall Rate: >-
      Percentage of VMW-busy cycles stalled because the GL0 latency FIFO is full.

    GL1 Memory Request FIFO Stall Rate: >-
      Percentage of VMW-busy cycles stalled because the GL1 request FIFO is full.

    Return Queue Pending Stall Rate: >-
      Percentage of VMW-busy cycles stalled on a pending GL1 return.

    Cache Write Stall Rate - GL1 Read Return: >-
      Percentage of VMW-busy cycles a GL0 write is stalled by an incoming GL1 read-return.

    Set Conflict Stall Rate - Cache Read: >-
      Percentage of VMW-busy cycles a GL0 read is stalled due to a cache set conflict.

    Set Conflict Stall Rate - Cache Write: >-
      Percentage of VMW-busy cycles a GL0 write is stalled due to a cache set conflict.

    Set Conflict Stall Rate - Atomics: >-
      Percentage of VMW-busy cycles a GL0 atomic is stalled due to a cache set conflict.

    Cache RAM Bank Conflict Stall Rate - Read: >-
      Percentage of VMW-busy cycles a GL0 SRAM read is stalled due to a bank conflict.

    Cache RAM Bank Conflict Stall Rate - Write: >-
      Percentage of VMW-busy cycles a GL0 SRAM write is stalled due to a bank conflict.

    Segment Conflict Stall Rate - Cache: >-
      Percentage of VMW-busy cycles the GL0 cache is stalled due to a cross-port segment conflict.

    LDS Utilization: >-
      Percentage of VMW-busy cycles the LDS controller is executing an LDS operation.

    LDS Utilization - Load: >-
      Percentage of VMW-busy cycles the LDS is executing a load.

    LDS Utilization - Store: >-
      Percentage of VMW-busy cycles the LDS is executing a store.

    LDS Utilization - Atomics: >-
      Percentage of VMW-busy cycles the LDS is executing an atomic.

    LDS Bank Conflict Stall Rate: >-
      Percentage of VMW-busy cycles stalled due to an LDS bank conflict.

    LDS Bank Conflict Stall Rate - Read: >-
      Percentage of VMW-busy cycles stalled due to an LDS read bank conflict.

    LDS Bank Conflict Stall Rate - Write: >-
      Percentage of VMW-busy cycles stalled due to an LDS write bank conflict.

    LDS Bank Conflict Stall Rate - Atomic: >-
      Percentage of VMW-busy cycles stalled due to an LDS atomic bank conflict.

    LDS Address Conflict Stall Rate: >-
      Percentage of VMW-busy cycles stalled due to an LDS address conflict.

    Segment Conflict Stall Rate - LDS: >-
      Percentage of VMW-busy cycles stalled due to a cross-port LDS segment conflict.

    LDS Stall Rate: >-
      Percentage of VMW-busy cycles the LDS is stalled for any reason.

    Slot Replacement Rate: >-
      Percentage of VMW-busy cycles a GL0 cache slot is being replaced.

    Slot Hit Rate: >-
      Percentage of VMW-busy cycles a GL0 cache access hits a valid slot.

    Set Conflict Stall - Same Port: >-
      Percentage of VMW-busy cycles stalled due to a same-port GL0 set conflict.

    Slot Replacement Stall - Same Port: >-
      Percentage of VMW-busy cycles stalled due to a same-port slot replacement.

    Slot Replacement Stall - Cross Port: >-
      Percentage of VMW-busy cycles stalled due to a cross-port slot replacement.

    GL0-GL1 Read Requests: >-
      Number of GL0-GL1 read requests.

    GL0-GL1 Read Bandwidth: >-
      Total GL0-GL1 read bandwidth.

    GL0-GL1 Write Requests: >-
      Number of GL0-GL1 write requests.

    GL0-GL1 Write Bandwidth: >-
      Total GL0-GL1 write bandwidth.

    GL0-GL1 Atomic Requests - With Return: >-
      Number of returning GL0-GL1 atomic requests.

    GL0-GL1 Atomic Requests - Without Return: >-
      Number of non-returning GL0-GL1 atomic requests.

    GL0-GL1 Cluster Request: >-
      Number of GL0-GL1 cluster-scoped read requests.

    GL0-GL1 Prefetch Request - CU Scope: >-
      Number of CU-scoped GL0-GL1 prefetch requests.

    GL0-GL1 Prefetch Request - GL2 Scope: >-
      Number of GL2-scoped GL0-GL1 prefetch requests.

    GL0-GL1 Read Latency: >-
      Average GL0-GL1 read latency.

    GL0-GL1 Write Latency: >-
      Average GL0-GL1 write latency.

    GL0-GL1 Cluster Request Latency: >-
      Average GL0-GL1 cluster request latency.

    GL0-GL1 Request Stall: >-
      Percentage of VMW-busy cycles GL0 is stalled sending requests to GL1.

    GL0 Cache RAM Read Stall by GL1 Write: >-
      Percentage of VMW-busy cycles a GL0 SRAM read is stalled by an incoming GL1 fill.

    GL0 Cache RAM Write Stall by GL1 Return: >-
      Percentage of VMW-busy cycles a GL0 SRAM write is stalled by an incoming GL1 fill.

    UTCL0 Requests: >-
      Total address translation requests sent to UTCL0.

    UTCL0 Requests for GL2 Prefetch: >-
      Number of UTCL0 translation requests for GL2 prefetch operations.

    UTCL0 Thrash Stall Rate: >-
      Percentage of VMW-busy cycles the UTCL0 TLB is thrashing.

    UTCL0-UTCL1 Requests: >-
      Number of UTCL0 TLB misses forwarded to UTCL1.

    UTCL0-UTCL1 Requests - Internal Retry: >-
      Number of UTCL0-UTCL1 translation requests retried internally.

    UTCL0-UTCL1 Returns: >-
      Number of translation results returned from UTCL1 to UTCL0.

    UTCL0-UTCL1 Returns - Permission Fault: >-
      Number of UTCL1 returns with a page permission fault.

    UTCL0-UTCL1 Returns - XNACK Retry: >-
      Number of UTCL1 returns requiring an XNACK retry.

    UTCL0-UTCL1 Returns - Partial Resident Fault: >-
      Number of UTCL1 returns for partially-resident address spaces.

    UTCL0-UTCL1 Returns - No Retry Fault: >-
      Number of UTCL1 returns with a non-retriable fault.

    UTCL1 Request Latency: >-
      Average UTCL0-to-UTCL1 translation latency.

    UTCL1 Request Stall: >-
      Percentage of VMW-busy cycles UTCL0 is stalled sending to UTCL1.

    UTCL0 Lookup Hit Rate: >-
      UTCL0 TLB hit rate.

    UTCL0 Lookup Hit-on-Miss Rate: >-
      Percentage of UTCL0 translation requests served by a pending miss.

    UTCL0 Lookup Latency: >-
      Average UTCL0 address translation latency.

    UTCL0 LFIFO Full Stall: >-
      Percentage of VMW-busy cycles UTCL0 is stalled because its LFIFO is full.

    UTCL0 Max Inflight Stall: >-
      Percentage of VMW-busy cycles UTCL0 has reached the maximum in-flight translation limit.

    UTCL0 Miss FIFO Stall: >-
      Percentage of VMW-busy cycles UTCL0 cannot process a new miss due to a full miss FIFO.

    UTCL0 LFIFO Not-Present Stall: >-
      Percentage of VMW-busy cycles UTCL0 is stalled waiting for an LFIFO slot.
