# gfx1250 Workgroup Manager (SPI) Performance Metrics

Panel Config:
  id: 600
  title: Workgroup Manager (SPI)
  data source:
  - metric_table:
      id: 601
      title: "Utilization"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        SPI Utilization:
          avg: AVG((100 * SPI_BUSY_sum / (GRBM_GUI_ACTIVE_sum * $SE_NUM)) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          min: MIN((100 * SPI_BUSY_sum / (GRBM_GUI_ACTIVE_sum * $SE_NUM)) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          max: MAX((100 * SPI_BUSY_sum / (GRBM_GUI_ACTIVE_sum * $SE_NUM)) if (GRBM_GUI_ACTIVE_sum != 0) else None)
          unit: Percent

  - metric_table:
      id: 602
      title: "Wave Dispatch"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        # SPI_CSN_NUM_THREADGROUPS_* is CS-pipe scoped; SPI_RA_REQ_ALLOC_sum counts
        # successful SPI resource allocations per dispatch (= workgroups launched).
        Dispatched Workgroups:
          avg: AVG(SPI_RA_REQ_ALLOC_sum)
          min: MIN(SPI_RA_REQ_ALLOC_sum)
          max: MAX(SPI_RA_REQ_ALLOC_sum)
          unit: Count
        # SPI_CSN_WAVE_* reads CS0-only (DEBUG_PIPE_SEL); compute uses SPI_ALL_WAVE.
        Dispatched Waves:
          avg: AVG(SPI_ALL_WAVE_sum)
          min: MIN(SPI_ALL_WAVE_sum)
          max: MAX(SPI_ALL_WAVE_sum)
          unit: Count
        Dispatched Clusters:
          avg: AVG(SPI_CSN_NUM_CLUSTERS_sum)
          min: MIN(SPI_CSN_NUM_CLUSTERS_sum)
          max: MAX(SPI_CSN_NUM_CLUSTERS_sum)
          unit: Count
        Dispatched Group-of-Groups:
          avg: AVG(SPI_CSN_NUM_GROUPS_OF_GROUPS_sum)
          min: MIN(SPI_CSN_NUM_GROUPS_OF_GROUPS_sum)
          max: MAX(SPI_CSN_NUM_GROUPS_OF_GROUPS_sum)
          unit: Count
        Wave Dispatch Rate:
          avg: AVG((SPI_ALL_WAVE_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          min: MIN((SPI_ALL_WAVE_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          max: MAX((SPI_ALL_WAVE_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          unit: Waves/cycle
        Thread Dispatch Rate:
          avg: AVG((SPI_ALL_WAVE_ITEMS_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          min: MIN((SPI_ALL_WAVE_ITEMS_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          max: MAX((SPI_ALL_WAVE_ITEMS_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          unit: Threads/cycle
        Per-SE Wave Occupancy:
          avg: AVG((SPI_ALL_WAVE_IN_FLIGHT_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          min: MIN((SPI_ALL_WAVE_IN_FLIGHT_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          max: MAX((SPI_ALL_WAVE_IN_FLIGHT_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          unit: Waves
        Per-SE Wave Life:
          avg: AVG((SPI_ALL_WAVE_IN_FLIGHT_sum / SPI_ALL_WAVE_sum) if (SPI_ALL_WAVE_sum != 0) else None)
          min: MIN((SPI_ALL_WAVE_IN_FLIGHT_sum / SPI_ALL_WAVE_sum) if (SPI_ALL_WAVE_sum != 0) else None)
          max: MAX((SPI_ALL_WAVE_IN_FLIGHT_sum / SPI_ALL_WAVE_sum) if (SPI_ALL_WAVE_sum != 0) else None)
          unit: Cycles
        Context Save Rate:
          avg: AVG((100 * SPI_ALL_WAVE_SAVED_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          min: MIN((100 * SPI_ALL_WAVE_SAVED_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          max: MAX((100 * SPI_ALL_WAVE_SAVED_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          unit: Percent
        Context Restore Rate:
          avg: AVG((100 * SPI_ALL_WAVE_RESTORED_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          min: MIN((100 * SPI_ALL_WAVE_RESTORED_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          max: MAX((100 * SPI_ALL_WAVE_RESTORED_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          unit: Percent
        Wave Dispatch FIFO Full Rate:
          avg: AVG((100 * SPI_RA_WR_CTL_FULL_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          min: MIN((100 * SPI_RA_WR_CTL_FULL_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          max: MAX((100 * SPI_RA_WR_CTL_FULL_sum / SPI_BUSY_sum) if (SPI_BUSY_sum != 0) else None)
          unit: Percent

