  metrics_description:
    SPI Utilization: >-
      Percentage of GPU-busy cycles the SPI is dispatching workgroups.

    Dispatched Workgroups: >-
      Workgroups launched via successful SPI resource allocation
      (SPI_RA_REQ_ALLOC_sum). SPI_CSN_NUM_THREADGROUPS_sum is CS-pipe scoped and
      reads zero for gfx1250 compute dispatches.

    Dispatched Waves: >-
      Total wavefronts dispatched (SPI_ALL_WAVE_sum; SPI_CSN_WAVE_sum is CS-pipe
      scoped and reads zero for gfx1250 compute dispatches).

    Dispatched Clusters: >-
      Total cluster-level dispatches issued by SPI.

    Dispatched Group-of-Groups: >-
      Total group-of-groups dispatch operations issued by SPI.

    Wave Dispatch Rate: >-
      Average wavefronts launched per busy cycle.

    Thread Dispatch Rate: >-
      Average threads launched per busy cycle.

    Per-SE Wave Occupancy: >-
      Average wavefronts in-flight per Shader Engine.

    Per-SE Wave Life: >-
      Average wavefront lifetime in cycles per Shader Engine.

    Context Save Rate: >-
      Percentage of SPI-busy cycles the GPU is saving wavefront contexts.

    Context Restore Rate: >-
      Percentage of SPI-busy cycles the GPU is restoring wavefront contexts.

    Wave Dispatch FIFO Full Rate: >-
      Percentage of SPI-busy cycles the wave dispatch FIFO is full.

    Resource No-Allocation Rate: >-
      Percentage of SPI-busy cycles SPI failed to allocate resources for a workgroup.

    Resource Allocation Rate: >-
      Percentage of SPI-busy cycles SPI successfully allocated resources and dispatched a workgroup.

    Alloc Failure - LDS Full: >-
      Percentage of SPI-busy cycles workgroup allocation failed due to full LDS.

    Alloc Failure - Waveslots Full: >-
      Percentage of SPI-busy cycles workgroup allocation failed due to full wavefront slots.

    Alloc Failure - VGPR Full: >-
      Percentage of SPI-busy cycles workgroup allocation failed due to VGPR exhaustion.

    Alloc Failure - Barrier Full: >-
      Percentage of SPI-busy cycles workgroup allocation failed due to full barrier slots.

    Alloc Failure - Bulky Full: >-
      Percentage of SPI-busy cycles workgroup allocation failed because a bulky workgroup could not be placed.

    Alloc Failure - Named Barriers Full: >-
      Percentage of SPI-busy cycles workgroup allocation failed due to named barrier exhaustion.

    Alloc Failure - Temp Space Full: >-
      Percentage of SPI-busy cycles workgroup allocation failed due to exhausted scratch space.

    Per-Queue Outstanding Dispatch Requests (P0_Q0_sum): >-
      Average in-flight dispatch requests in CPC pipe 0, queue 0.

    Per-Queue Outstanding Dispatch Requests (P0_Q1_sum): >-
      Average in-flight dispatch requests in CPC pipe 0, queue 1.

    Per-Queue Outstanding Dispatch Requests (P1_Q0_sum): >-
      Average in-flight dispatch requests in CPC pipe 1, queue 0.

    Per-Queue Outstanding Dispatch Requests (P1_Q1_sum): >-
      Average in-flight dispatch requests in CPC pipe 1, queue 1.

    CPC Pre-Alloc Request Stall Rate: >-
      Percentage of SPI-busy cycles where SPI cannot accept new pre-allocation requests from CPC because its internal pre-allocation pipeline is full.
