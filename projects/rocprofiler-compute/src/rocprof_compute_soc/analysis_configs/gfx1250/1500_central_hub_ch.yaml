# =============================================================================
# gfx1250 CH (Central Hub) Metrics
# =============================================================================
#
# The Central Hub (CH) manages traffic between shader engines and the GL2 cache.
# It consists of:
#   - CHA: Central Hub Arbiter - handles request arbitration
#   - CHC: Central Hub Buffer - handles request buffering and GL2 interface
#
# =============================================================================

Panel Config:
  id: 1500
  title: Central Hub (CH)
  description: |-
    Central Hub (CH) metrics for gfx1250. The CH manages traffic between shader
    engines and GL2 cache. CHA handles request arbitration, CHC handles
    buffering and GL2 interface.

  data source:

  - metric_table:
      id: 1501
      title: CHA Utilization
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Utilization:
          avg: 100 * SUM(CHA_BUSY_sum) / SUM(CHA_CYCLE_sum)
          min: 100 * MIN(CHA_BUSY_sum / CHA_CYCLE_sum)
          max: 100 * MAX(CHA_BUSY_sum / CHA_CYCLE_sum)
          unit: Percent

  - metric_table:
      id: 1502
      title: CHA Arbitration
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Request Latency:
          avg: SUM(CHA_REQ_INFLIGHT_LEVEL_sum) / SUM(CHA_ARB_REQUESTS_sum)
          min: MIN(CHA_REQ_INFLIGHT_LEVEL_sum / CHA_ARB_REQUESTS_sum)
          max: MAX(CHA_REQ_INFLIGHT_LEVEL_sum / CHA_ARB_REQUESTS_sum)
          unit: Cycles
        CHA-CHC0 Request Stall Rate:
          avg: 100 * SUM(CHA_STALL_CHC0_sum) / SUM(CHA_BUSY_sum)
          min: 100 * MIN(CHA_STALL_CHC0_sum / CHA_BUSY_sum)
          max: 100 * MAX(CHA_STALL_CHC0_sum / CHA_BUSY_sum)
          unit: Percent
        CHA-CHC1 Request Stall Rate:
          avg: 100 * SUM(CHA_STALL_CHC1_sum) / SUM(CHA_BUSY_sum)
          min: 100 * MIN(CHA_STALL_CHC1_sum / CHA_BUSY_sum)
          max: 100 * MAX(CHA_STALL_CHC1_sum / CHA_BUSY_sum)
          unit: Percent
        CHA Request Path Utilization:
          avg: 100 * SUM(CHA_REQ_PATH_BUSY_sum) / SUM(CHA_BUSY_sum)
          min: 100 * MIN(CHA_REQ_PATH_BUSY_sum / CHA_BUSY_sum)
          max: 100 * MAX(CHA_REQ_PATH_BUSY_sum / CHA_BUSY_sum)
          unit: Percent
        CHA Return Path Utilization:
          avg: 100 * SUM(CHA_RET_PATH_BUSY_sum) / SUM(CHA_BUSY_sum)
          min: 100 * MIN(CHA_RET_PATH_BUSY_sum / CHA_BUSY_sum)
          max: 100 * MAX(CHA_RET_PATH_BUSY_sum / CHA_BUSY_sum)
          unit: Percent

  - metric_table:
      id: 1503
      title: CHC Utilization
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Utilization:
          avg: 100 * SUM(CHC_BUSY_sum) / SUM(CHC_CYCLE_sum)
          min: 100 * MIN(CHC_BUSY_sum / CHC_CYCLE_sum)
          max: 100 * MAX(CHC_BUSY_sum / CHC_CYCLE_sum)
          unit: Percent
        Buffer Stall Rate:
          avg: 100 * SUM(CHC_STALL_BUFFER_FULL_sum) / SUM(CHC_BUSY_sum)
          min: 100 * MIN(CHC_STALL_BUFFER_FULL_sum / CHC_BUSY_sum)
          max: 100 * MAX(CHC_STALL_BUFFER_FULL_sum / CHC_BUSY_sum)
          unit: Percent

  - metric_table:
      id: 1504
      title: CHC Requests
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Total Requests:
          avg: SUM(CHC_REQ_sum) / SUM($denom)
          min: MIN(CHC_REQ_sum / $denom)
          max: MAX(CHC_REQ_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - Read:
          avg: SUM(CHC_REQ_READ_sum) / SUM($denom)
          min: MIN(CHC_REQ_READ_sum / $denom)
          max: MAX(CHC_REQ_READ_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - 32B Read:
          avg: SUM(CHC_REQ_READ_32B_sum) / SUM($denom)
          min: MIN(CHC_REQ_READ_32B_sum / $denom)
          max: MAX(CHC_REQ_READ_32B_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - 64B Read:
          avg: SUM(CHC_REQ_READ_64B_sum) / SUM($denom)
          min: MIN(CHC_REQ_READ_64B_sum / $denom)
          max: MAX(CHC_REQ_READ_64B_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - 128B Read:
          avg: SUM(CHC_REQ_READ_128B_sum) / SUM($denom)
          min: MIN(CHC_REQ_READ_128B_sum / $denom)
          max: MAX(CHC_REQ_READ_128B_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - 256B Read:
          avg: SUM(CHC_REQ_READ_256B_sum) / SUM($denom)
          min: MIN(CHC_REQ_READ_256B_sum / $denom)
          max: MAX(CHC_REQ_READ_256B_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - Write:
          avg: SUM(CHC_REQ_WRITE_sum) / SUM($denom)
          min: MIN(CHC_REQ_WRITE_sum / $denom)
          max: MAX(CHC_REQ_WRITE_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - 32B Write:
          avg: SUM(CHC_REQ_WRITE_32B_sum) / SUM($denom)
          min: MIN(CHC_REQ_WRITE_32B_sum / $denom)
          max: MAX(CHC_REQ_WRITE_32B_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - 64B Write:
          avg: SUM(CHC_REQ_WRITE_64B_sum) / SUM($denom)
          min: MIN(CHC_REQ_WRITE_64B_sum / $denom)
          max: MAX(CHC_REQ_WRITE_64B_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - 128B Write:
          avg: SUM(CHC_REQ_WRITE_128B_sum) / SUM($denom)
          min: MIN(CHC_REQ_WRITE_128B_sum / $denom)
          max: MAX(CHC_REQ_WRITE_128B_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - 256B Write:
          avg: SUM(CHC_REQ_WRITE_256B_sum) / SUM($denom)
          min: MIN(CHC_REQ_WRITE_256B_sum / $denom)
          max: MAX(CHC_REQ_WRITE_256B_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - Atomic with Return:
          avg: SUM(CHC_REQ_ATOMIC_WITH_RET_sum) / SUM($denom)
          min: MIN(CHC_REQ_ATOMIC_WITH_RET_sum / $denom)
          max: MAX(CHC_REQ_ATOMIC_WITH_RET_sum / $denom)
          unit: (Count + $normUnit)
        Total Requests - Atomic without Return:
          avg: SUM(CHC_REQ_ATOMIC_WITHOUT_RET_sum) / SUM($denom)
          min: MIN(CHC_REQ_ATOMIC_WITHOUT_RET_sum / $denom)
          max: MAX(CHC_REQ_ATOMIC_WITHOUT_RET_sum / $denom)
          unit: (Count + $normUnit)
  - metric_table:
      id: 1505
      title: CHC Bandwidth and Latency
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        CHC Bandwidth - Read:
          avg: SUM(CHC_REQ_READ_32B_sum * 32 + CHC_REQ_READ_64B_sum * 64 + CHC_REQ_READ_128B_sum * 128 + CHC_REQ_READ_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          min: MIN((CHC_REQ_READ_32B_sum * 32 + CHC_REQ_READ_64B_sum * 64 + CHC_REQ_READ_128B_sum * 128 + CHC_REQ_READ_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          max: MAX((CHC_REQ_READ_32B_sum * 32 + CHC_REQ_READ_64B_sum * 64 + CHC_REQ_READ_128B_sum * 128 + CHC_REQ_READ_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          unit: GB/s
        CHC Bandwidth - Write:
          avg: 32 * SUM(CHC_REQ_WRITE_32B_DATA_BEATS_sum) / SUM(End_Timestamp - Start_Timestamp)
          min: MIN(CHC_REQ_WRITE_32B_DATA_BEATS_sum * 32 / (End_Timestamp - Start_Timestamp))
          max: MAX(CHC_REQ_WRITE_32B_DATA_BEATS_sum * 32 / (End_Timestamp - Start_Timestamp))
          unit: GB/s
        CHC-GL2 Latency - Read:
          avg: SUM(CHC_GL2_REQ_READ_LEVEL_sum) / SUM(CHC_REQ_READ_sum)
          min: MIN(CHC_GL2_REQ_READ_LEVEL_sum / CHC_REQ_READ_sum)
          max: MAX(CHC_GL2_REQ_READ_LEVEL_sum / CHC_REQ_READ_sum)
          unit: Cycles
        CHC-GL2 Latency - Write:
          avg: SUM(CHC_GL2_REQ_WRITE_LEVEL_sum) / SUM(CHC_REQ_WRITE_sum)
          min: MIN(CHC_GL2_REQ_WRITE_LEVEL_sum / CHC_REQ_WRITE_sum)
          max: MAX(CHC_GL2_REQ_WRITE_LEVEL_sum / CHC_REQ_WRITE_sum)
          unit: Cycles
        CHC Return Arbitration Latency:
          avg: SUM(CHC_ARB_RET_LEVEL_sum) / SUM(CHC_REQ_sum)
          min: MIN(CHC_ARB_RET_LEVEL_sum / CHC_REQ_sum)
          max: MAX(CHC_ARB_RET_LEVEL_sum / CHC_REQ_sum)
          unit: Cycles

  metrics_description:
    Utilization: >-
      Percentage of cycles Central Hub Arbiter is busy processing memory requests.

    CHA-CHC0 Request Stall Rate: >-
      Percentage of Central Hub Arbiter busy cycles when it's stalled forwarding to Central Hub Buffer partition 0.

    CHA-CHC1 Request Stall Rate: >-
      Percentage of Central Hub Arbiter busy cycles when it's stalled forwarding to Central Hub Buffer partition 1.

    CHA Request Path Utilization: >-
      Percentage of Central Hub Arbiter busy cycles when its request path is busy.

    CHA Return Path Utilization: >-
      Percentage of Central Hub Arbiter busy cycles when its return path is busy.

    Buffer Stall Rate: >-
      Percentage of Central Hub Buffer busy cycles when it's stalled due to being full.

    Total Requests: >-
      Total Central Hub Buffer requests.

    Total Requests - Read: >-
      Number of Central Hub Buffer read requests.

    Total Requests - 32B Read: >-
      Number of 32-byte Central Hub Buffer read requests.

    Total Requests - 64B Read: >-
      Number of 64-byte Central Hub Buffer read requests.

    Total Requests - 128B Read: >-
      Number of 128-byte Central Hub Buffer read requests.

    Total Requests - 256B Read: >-
      Number of 256-byte Central Hub Buffer read requests.

    Total Requests - Write: >-
      Number of Central Hub Buffer write requests.

    Total Requests - 32B Write: >-
      Number of 32-byte Central Hub Buffer write requests.

    Total Requests - 64B Write: >-
      Number of 64-byte Central Hub Buffer write requests.

    Total Requests - 128B Write: >-
      Number of 128-byte Central Hub Buffer write requests.

    Total Requests - 256B Write: >-
      Number of 256-byte Central Hub Buffer write requests.

    Total Requests - Atomic with Return: >-
      Number of returning Central Hub Buffer atomic requests.

    Total Requests - Atomic without Return: >-
      Number of non-returning Central Hub Buffer atomic requests.

    CHC Bandwidth - Read: >-
      Read bandwidth through Central Hub Buffer.

    CHC Bandwidth - Write: >-
      Write bandwidth through Central Hub Buffer.
