# =============================================================================
# gfx1250 -- Memory chart
# =============================================================================
# Memory-hierarchy walk: instruction and scalar paths, GL0 (vector L0) with LDS, GL0-GL1, GLARB / GL2, and EA to HBM.
# Use with the conceptual gfx1250 performance-model page in the docs.
# =============================================================================

Panel Config:
  id: 300
  title: Memory Chart
  description: >-
    Detailed memory hierarchy metrics for gfx1250: request rates, bandwidth,
    hit rates, and latencies from SQC through GL0, GL1, GL2, and the EA path.

  data source:

  - metric_table:
      id: 301
      title: Instruction Cache
      cli_style: mem_chart
      tui_style: mem_chart
      comparable: false
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        ICache Requests:
          value: SUM(SQC_ICACHE_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        ICache Utilization:
          value: 100 * SUM(SQC_ICACHE_BUSY_CYCLES_sum) / SUM(SQ_BUSY_CYCLES_sum)
          unit: Percent
        ICache Hit Rate:
          value: 100 * SUM(SQC_ICACHE_HITS_sum) / SUM(SQC_ICACHE_REQ_sum)
          unit: Percent
        ICache Latency:
          value: SUM(SQC_ICACHE_INFLIGHT_LEVEL_ACCUM) / SUM(SQC_ICACHE_REQ_sum)
          unit: Cycles
        ICache Request Stall Rate:
          value: 100 * SUM(SQC_ICACHE_INPUT_VALID_READYB_sum) / SUM(SQ_BUSY_CYCLES_sum)
          unit: Percent
        ICache-GL1 Read Bandwidth:
          value: 128 * SUM(SQC_TC_INST_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        ICache-GL1 Request Latency:
          value: SUM(SQC_ICACHE_TC_INFLIGHT_LEVEL_ACCUM) / SUM(SQC_TC_INST_REQ_sum)
          unit: Cycles

  - metric_table:
      id: 302
      title: Scalar Data Cache
      cli_style: mem_chart
      tui_style: mem_chart
      comparable: false
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        Dcache Requests:
          value: SUM(SQC_DCACHE_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        Dcache Utilization:
          value: 100 * SUM(SQC_DCACHE_BUSY_CYCLES_sum) / SUM(SQ_BUSY_CYCLES_sum)
          unit: Percent
        Dcache Hit Rate:
          value: 100 * SUM(SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_REQ_sum)
          unit: Percent
        Dcache Latency:
          value: SUM(SQC_DCACHE_INFLIGHT_LEVEL_ACCUM) / SUM(SQC_DCACHE_REQ_sum)
          unit: Cycles
        Dcache Request Stall Rate:
          value: 100 * SUM(SQC_DCACHE_INPUT_VALID_READYB_sum) / SUM(SQ_BUSY_CYCLES_sum)
          unit: Percent
        Dcache Request Bandwidth:
          value: 4 * SUM(SQC_SMEM_LOAD_DWORDS_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        Dcache-GL1 Read Bandwidth:
          value: 128 * SUM(SQC_TC_DATA_READ_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        Dcache-GL1 Request Latency:
          value: SUM(SQC_DCACHE_TC_INFLIGHT_LEVEL_ACCUM) / SUM(SQC_TC_DATA_READ_REQ_sum)
          unit: Cycles

  - metric_table:
      id: 303
      title: GL0 Cache (Vector L0)
      cli_style: mem_chart
      tui_style: mem_chart
      comparable: false
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        # GL0 Utilization: TX_VMW_VMW_BUSY_sum is summed across all GL0 cache units (one per
        # WGP). Use GRBM_GUI_ACTIVE * cu_per_gpu as the timebase (same as panel 9.01);
        # TX_VMW_GATE_EN1_sum is not comparable and produces >100% artifacts.
        GL0 Utilization:
          value: 100 * SUM(TX_VMW_VMW_BUSY_sum) / SUM(GRBM_GUI_ACTIVE_sum * $cu_per_gpu)
          unit: Percent
        GL0 Total Requests:
          value: SUM(TX_VMW_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        GL0 Read Requests:
          value: SUM(TX_VMW_REQ_READ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        GL0 Write Requests:
          value: SUM(TX_VMW_REQ_WRITE_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        GL0 Atomic Requests:
          value: SUM(TX_VMW_VEC32_REQ_ATOMIC_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        GL0 Hit Rate:
          value: 100 * SUM(1 - TX_VMW_REQ_MISS_sum) / SUM(TX_VMW_REQ_sum)
          unit: Percent
        GL0 Request Latency:
          value: SUM(TX_VMW_VMW_LATENCY_sum) / SUM(TX_VMW_REQ_sum)
          unit: Cycles

  - metric_table:
      id: 304
      title: LDS (Local Data Share)
      cli_style: mem_chart
      tui_style: mem_chart
      comparable: false
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        LDS Load Requests:
          value: SUM(TX_VCA_LDS_LOAD_WAVEFRONTS_sum) / SUM($denom)
          unit: (Wavefronts + $normUnit)
        LDS Store Requests:
          value: SUM(TX_VCA_LDS_STORE_WAVEFRONTS_sum) / SUM($denom)
          unit: (Wavefronts + $normUnit)
        LDS Atomic Requests:
          value: SUM(TX_VCA_LDS_ATOMIC_WAVEFRONTS_sum) / SUM($denom)
          unit: (Wavefronts + $normUnit)
        Async Load Requests:
          value: SUM(TX_VCA_ASYNC_LOAD_WAVEFRONT_sum) / SUM($denom)
          unit: (Wavefronts + $normUnit)
        Async Store Requests:
          value: SUM(TX_VCA_ASYNC_STORE_WAVEFRONT_sum) / SUM($denom)
          unit: (Wavefronts + $normUnit)
        LDS Utilization:
          value: 100 * SUM(TX_VMW_LDS_INPUT_ACTIVE_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          unit: Percent
        # LDS Utilization (Load/Store): guard with TX_VMW_LDS_INPUT_ACTIVE_sum > 0 so kernels
        # without user LDS (e.g. vcopy) do not produce spurious ratios from internal counters.
        LDS Utilization - Load:
          value: 100 * SUM(TX_VMW_LDS_ACTIVE_LOAD_CNT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          unit: Percent
        LDS Utilization - Store:
          value: 100 * SUM(TX_VMW_LDS_ACTIVE_STORE_CNT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          unit: Percent
        LDS Bank Conflict Stall Rate:
          value: 100 * SUM(TX_VMW_LDS_BANK_CONFLICT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          unit: Percent
        LDS Address Conflict Stall Rate:
          value: 100 * SUM(TX_VMW_LDS_ADDR_CONFLICT_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          unit: Percent
        LDS Load Bandwidth:
          value: SUM(TX_VCA_LDS_LOAD_BANDWIDTH_BYTES_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        LDS Store Bandwidth:
          value: SUM(TX_VCA_LDS_STORE_BANDWIDTH_BYTES_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        LDS Atomic Bandwidth:
          value: SUM(TX_VCA_LDS_ATOMIC_BANDWIDTH_BYTES_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        Async Load Bandwidth:
          value: SUM(TX_VCA_ASYNC_LOAD_BANDWIDTH_BYTES_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        Async Store Bandwidth:
          value: SUM(TX_VCA_ASYNC_STORE_BANDWIDTH_BYTES_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        TDM Load Bandwidth:
          value: SUM(TX_VCA_TDM_LOAD_BANDWIDTH_BYTES_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        TDM Store Bandwidth:
          value: SUM(TX_VCA_TDM_STORE_BANDWIDTH_BYTES_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        TDM Load Requests:
          value: SUM(TX_VCA_TENSOR_ASYNC_LOAD_DMA_REQUEST_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TDM Store Requests:
          value: SUM(TX_VCA_TENSOR_ASYNC_STORE_DMA_REQUEST_sum) / SUM($denom)
          unit: (Requests + $normUnit)
  - metric_table:
      id: 305
      title: GL0-GL1 Interface
      cli_style: mem_chart
      tui_style: mem_chart
      comparable: false
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        GL0-GL1 Read Requests:
          value: SUM(TX_VMW_GL1_REQ_READ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        GL0-GL1 Write Requests:
          value: SUM(TX_VMW_GL1_REQ_WRITE_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        GL0-GL1 Read Bandwidth:
          value: SUM(TX_VMW_GL1_REQ_READ_64B_sum * 64 + TX_VMW_GL1_REQ_READ_128B_sum * 128 + TX_VMW_GL1_READ_REQ_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        GL0-GL1 Write Bandwidth:
          value: SUM(TX_VMW_GL1_WRITE_REQ_128B_sum * 128 + TX_VMW_GL1_WRITE_REQ_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        GL0-GL1 Atomic Bandwidth:
          value: 128 * SUM(TX_VMW_GL1_REQ_ATOMIC_WITH_RET_sum + TX_VMW_GL1_REQ_ATOMIC_WITHOUT_RET_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        GL0-GL1 Read Latency:
          value: SUM(TX_VMW_GL1_READ_LATENCY_sum) / SUM(TX_VMW_GL1_REQ_READ_sum)
          unit: Cycles
        GL0-GL1 Write Latency:
          value: SUM(TX_VMW_GL1_WRITE_LATENCY_sum) / SUM(TX_VMW_GL1_REQ_WRITE_sum)
          unit: Cycles
        GL0-GL1 Request Stall Rate:
          value: 100 * SUM(TX_VMW_GL1_VMW_BACK_PRESSURE_sum) / SUM(TX_VMW_VMW_BUSY_sum)
          unit: Percent
        GL1A Utilization:
          value: 100 * SUM(GL1A_BUSY_sum) / SUM(GL1A_CYCLE_sum)
          unit: Percent
        GL1C Utilization:
          value: 100 * SUM(GL1C_BUSY_sum) / SUM(GL1C_CYCLE_sum)
          unit: Percent
        GL1C Buffer Full Stall:
          value: 100 * SUM(GL1C_STALL_BUFFER_FULL_sum) / SUM(GL1C_BUSY_sum)
          unit: Percent

  - metric_table:
      id: 306
      title: GLARB (GL1-GL2 Arbiter)
      cli_style: mem_chart
      tui_style: mem_chart
      comparable: false
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        GLARBA Utilization:
          value: 100 * SUM(GLARBA_BUSY_sum) / SUM(GLARBA_CYCLE_sum)
          unit: Percent
        GLARBA Request Path Utilization:
          value: 100 * SUM(GLARBA_REQ_PATH_BUSY_sum) / SUM(GLARBA_CYCLE_sum)
          unit: Percent
        GLARBA Return Path Utilization:
          value: 100 * SUM(GLARBA_RET_PATH_BUSY_sum) / SUM(GLARBA_CYCLE_sum)
          unit: Percent
        GLARBA Request Latency:
          value: SUM(GLARBA_REQ_INFLIGHT_LEVEL_sum) / SUM(GLARBA_ARB_REQUESTS_sum)
          unit: Cycles
        GLARBC Utilization:
          value: 100 * SUM(GLARBC_BUSY_sum) / SUM(GLARBC_CYCLE_sum)
          unit: Percent
        GLARBC Buffer Full Stall:
          value: 100 * SUM(GLARBC_STALL_BUFFER_FULL_sum) / SUM(GLARBC_BUSY_sum)
          unit: Percent
        GL1-GLARB Read Bandwidth:
          value: SUM(GL1C_GL2_REQ_READ_32B_sum * 32 + GL1C_GL2_REQ_READ_64B_sum * 64 + GL1C_GL2_REQ_READ_128B_sum * 128 + GL1C_GL2_REQ_READ_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        GL1-GLARB Write Bandwidth:
          value: 32 * SUM(GL1C_GL2_REQ_WRITE_32B_DATA_BEATS_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        GLARB-GL2 Read Bandwidth:
          value: SUM(GLARBC_REQ_READ_32B_sum * 32 + GLARBC_REQ_READ_64B_sum * 64 + GLARBC_REQ_READ_128B_sum * 128 + GLARBC_REQ_READ_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        GLARB-GL2 Write Bandwidth:
          value: SUM(GLARBC_REQ_WRITE_32B_sum * 32 + GLARBC_REQ_WRITE_64B_sum * 64 + GLARBC_REQ_WRITE_128B_sum * 128 + GLARBC_REQ_WRITE_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        GLARB-GL2 Atomic Bandwidth:
          value: 64 * SUM(GLARBC_REQ_ATOMIC_WITH_RET_sum + GLARBC_REQ_ATOMIC_WITHOUT_RET_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s

  - metric_table:
      id: 307
      title: GL2 Cache (L2)
      cli_style: mem_chart
      tui_style: mem_chart
      comparable: false
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        GL2A Utilization:
          value: 100 * SUM(GL2A_BUSY_sum) / SUM(GL2A_CYCLE_sum)
          unit: Percent
        GL2C Hit Rate:
          value: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
          unit: Percent
        GL2-EA Read Bandwidth:
          value: 32 * SUM(GL2C_EA_RDREQ_DRAM_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        GL2-EA Write Bandwidth:
          value: 32 * SUM(GL2C_EA_WRREQ_DRAM_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        GL2-EA Atomic Bandwidth:
          value: 32 * SUM(GL2C_EA_ATOMIC_DRAM_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        GL2-EA Read Latency:
          value: SUM(GL2C_EA_RDREQ_LEVEL_sum) / SUM(GL2C_EA_RDREQ_sum)
          unit: Cycles
        GL2-EA Write Latency:
          value: SUM(GL2C_EA_WRREQ_LEVEL_sum) / SUM(GL2C_EA_WRREQ_sum)
          unit: Cycles

  - metric_table:
      id: 308
      title: EA to HBM
      cli_style: mem_chart
      tui_style: mem_chart
      comparable: false
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        EA Utilization:
          value: 100 * SUM(GC_EA_SE_BUSY_CYCLE_sum) / SUM(GC_EA_SE_CYCLE_sum)
          unit: Percent
        DRAM Read Bandwidth:
          value: 32 * SUM(GC_EA_SE_SARB_DRAM_RD_SIZE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        DRAM Write Bandwidth:
          value: 32 * SUM(GC_EA_SE_SARB_DRAM_WR_SIZE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        IO Read Bandwidth:
          value: 32 * SUM(GC_EA_SE_SARB_IO_RD_SIZE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        IO Write Bandwidth:
          value: 32 * SUM(GC_EA_SE_SARB_IO_WR_SIZE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        HDM Read Bandwidth:
          value: 32 * SUM(GC_EA_SE_SARB_HDM_RD_SIZE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        HDM Write Bandwidth:
          value: 32 * SUM(GC_EA_SE_SARB_HDM_WR_SIZE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        GMI Read Bandwidth:
          value: 32 * SUM(GC_EA_SE_SARB_GMI_RD_SIZE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        GMI Write Bandwidth:
          value: 32 * SUM(GC_EA_SE_SARB_GMI_WR_SIZE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
        EA Stall Rate:
          value: 100 * SUM(GC_EA_SE_SARB_STALLED_sum) / SUM(GC_EA_SE_BUSY_CYCLE_sum)
          unit: Percent

  metrics_description:
    ICache Requests: >-
      Total Instruction Cache fetch requests.

    ICache Utilization: >-
      Percentage of shader-busy cycles the Instruction Cache is serving requests.

    ICache Hit Rate: >-
      Instruction Cache hit rate.

    ICache Request Stall Rate: >-
      Percentage of shader-busy cycles the instruction fetch unit is stalled.

    ICache-GL1 Read Bandwidth: >-
      Instruction Cache miss fill bandwidth from GL1.

    Dcache Requests: >-
      Total Scalar Data Cache requests.

    Dcache Utilization: >-
      Percentage of WGP cycles the Scalar Data Cache is serving requests.

    Dcache Hit Rate: >-
      Scalar Data Cache hit rate.

    Dcache Request Stall Rate: >-
      Percentage of WGP cycles the SQC scalar cache is stalled.

    Dcache Request Bandwidth: >-
      Total Scalar Data Cache bandwidth.

    Dcache-GL1 Read Bandwidth: >-
      Scalar Data Cache miss fill bandwidth from GL1.

    GL0 Total Requests: >-
      Total GL0 cache requests.

    GL0 Read Requests: >-
      Number of GL0 read requests.

    GL0 Write Requests: >-
      Number of GL0 write requests.

    GL0 Atomic Requests: >-
      Number of GL0 atomic requests.

    GL0 Utilization: >-
      Percentage of GPU-active cycles (per WGP) the VMW cache controller is busy.

    GL0 Hit Rate: >-
      GL0 cache hit rate.

    GL0 Request Latency: >-
      Average GL0 cache request latency.

    LDS Load Requests: >-
      Number of LDS load requests.

    LDS Store Requests: >-
      Number of LDS store requests.

    LDS Atomic Requests: >-
      Number of LDS atomic requests.

    Async Load Requests: >-
      Number of async load requests.

    Async Store Requests: >-
      Number of async store requests.

    LDS Utilization: >-
      Percentage of VMW-busy cycles the LDS is executing any operation.

    LDS Utilization - Load: >-
      Percentage of VMW-busy cycles the LDS is executing a load.

    LDS Utilization - Store: >-
      Percentage of VMW-busy cycles the LDS is executing a store.

    LDS Bank Conflict Stall Rate: >-
      Percentage of VMW-busy cycles LDS is stalled due to bank conflict.

    LDS Address Conflict Stall Rate: >-
      Percentage of VMW-busy cycles LDS is stalled due to address conflict.

    LDS Load Bandwidth: >-
      Total LDS load bandwidth.

    LDS Store Bandwidth: >-
      Total LDS store bandwidth.

    LDS Atomic Bandwidth: >-
      Total LDS atomic bandwidth.

    Async Load Bandwidth: >-
      Total async load bandwidth.

    Async Store Bandwidth: >-
      Total async store bandwidth.

    TDM Load Bandwidth: >-
      Total TDM load bandwidth.

    TDM Store Bandwidth: >-
      Total TDM store bandwidth.

    TDM Load Requests: >-
      Total TDM load requests.

    TDM Store Requests: >-
      Total TDM store requests.

    GL0-GL1 Read Requests: >-
      Number of GL0-GL1 read requests.

    GL0-GL1 Write Requests: >-
      Number of GL0-GL1 write requests.

    GL0-GL1 Read Bandwidth: >-
      Total GL0-GL1 read bandwidth.

    GL0-GL1 Write Bandwidth: >-
      Total GL0-GL1 write bandwidth.

    GL0-GL1 Atomic Bandwidth: >-
      Total GL0-GL1 atomic bandwidth.

    GL0-GL1 Read Latency: >-
      Average GL0-GL1 read latency.

    GL0-GL1 Write Latency: >-
      Average GL0-GL1 write latency.

    GL0-GL1 Request Stall Rate: >-
      Percentage of VMW-busy cycles GL0 is stalled sending requests to GL1.

    GL1A Utilization: >-
      Percentage of cycles GL1 Arbiter is processing requests from GL0.

    GL1C Utilization: >-
      Percentage of cycles the GL1 is processing requests.

    GL1C Buffer Full Stall: >-
      Percentage of GL1-busy cycles GL1 is stalled due to no available buffer entries.

    GLARBA Utilization: >-
      Percentage of cycles the Graphic Level Arbiter is processing requests.

    GLARBA Request Path Utilization: >-
      Percentage of cycles the GL1 to Graphic Level Arbiter request path is busy.

    GLARBA Return Path Utilization: >-
      Percentage of cycles the GL2 to GL1 return path is busy.

    GLARBA Request Latency: >-
      Average latency of requests sent to the Graphics Level Arbiter.

    GLARBC Utilization: >-
      Percentage of cycles the Graphic Level Arbiter staging buffer is forwarding requests.

    GLARBC Buffer Full Stall: >-
      Percentage of Graphics Level Arbiter busy cycles when it's stalled due to a full buffer.

    GL1-GLARB Read Bandwidth: >-
      Total GL1 to Graphic Level Arbiter read bandwidth.

    GL1-GLARB Write Bandwidth: >-
      Total GL1 to Graphic Level Arbiter write bandwidth.

    GLARB-GL2 Read Bandwidth: >-
      Total Graphic Level Arbiter to GL2 read bandwidth.

    GLARB-GL2 Write Bandwidth: >-
      Total Graphic Level Arbiter to GL2 write bandwidth.

    GLARB-GL2 Atomic Bandwidth: >-
      Total Graphic Level Arbiter to GL2 atomic bandwidth.

    GL2A Utilization: >-
      Percentage of cycles the GL2 Arbiter is distributing requests across GL2 Cache partitions.

    GL2C Hit Rate: >-
      GL2 Cache hit rate.

    GL2-EA Read Bandwidth: >-
      Total GL2 to Efficiency Arbiter read bandwidth.

    GL2-EA Write Bandwidth: >-
      Total GL2 to Efficiency Arbiter write bandwidth.

    GL2-EA Atomic Bandwidth: >-
      Total GL2 to Efficiency Arbiter atomic bandwidth.

    EA Utilization: >-
      Percentage of cycles the Efficiency Arbiter is routing requests toward HBM, IO, or fabric.

    DRAM Read Bandwidth: >-
      Total HBM read bandwidth.

    DRAM Write Bandwidth: >-
      Total HBM write bandwidth.

    IO Read Bandwidth: >-
      Total read bandwidth from host CPU memory (pinned or mapped) through the EA.

    IO Write Bandwidth: >-
      Total write bandwidth to host CPU memory (pinned or mapped) through the EA.

    HDM Read Bandwidth: >-
      Total read bandwidth from Host Data Memory (unified memory pages) through the EA.

    HDM Write Bandwidth: >-
      Total write bandwidth to Host Data Memory (unified memory pages) through the EA.

    GMI Read Bandwidth: >-
      Total read bandwidth from peer GPU HBM via Infinity Fabric.

    GMI Write Bandwidth: >-
      Total write bandwidth to peer GPU HBM via Infinity Fabric.

    EA Stall Rate: >-
      Percentage of EA-busy cycles where the EA is stalled.
