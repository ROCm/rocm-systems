  - metric_table:
      id: 807
      title: Shader-TXA Interface
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        # Shader-TXA bus util: cycle counters are summed across WGPs; normalize against
        # 2 * GRBM_GUI_ACTIVE * cu_per_gpu (bidirectional bus slots per GPU-active cycle).
        Request Bus Utilization:
          avg: 100 * SUM(TX_VCA_IN_ADDR_CYCLES_sum + TX_VCA_IN_DATA_CYCLES_sum) / SUM(2 * GRBM_GUI_ACTIVE_sum * $cu_per_gpu)
          min: 100 * MIN((TX_VCA_IN_ADDR_CYCLES_sum + TX_VCA_IN_DATA_CYCLES_sum) / (2 * GRBM_GUI_ACTIVE_sum * $cu_per_gpu))
          max: 100 * MAX((TX_VCA_IN_ADDR_CYCLES_sum + TX_VCA_IN_DATA_CYCLES_sum) / (2 * GRBM_GUI_ACTIVE_sum * $cu_per_gpu))
          unit: Percent
        Request Bus Utilization - Atomic Data:
          avg: 100 * SUM(TX_VCA_ATOMIC_WRITE_DATA_INPUT_CYCLES_sum) / SUM(2 * GRBM_GUI_ACTIVE_sum * $cu_per_gpu)
          min: 100 * MIN(TX_VCA_ATOMIC_WRITE_DATA_INPUT_CYCLES_sum / (2 * GRBM_GUI_ACTIVE_sum * $cu_per_gpu))
          max: 100 * MAX(TX_VCA_ATOMIC_WRITE_DATA_INPUT_CYCLES_sum / (2 * GRBM_GUI_ACTIVE_sum * $cu_per_gpu))
          unit: Percent

