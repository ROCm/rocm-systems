          min: 100 * MIN(TX_VCA_BUFFER_TOTAL_CYCLES_sum / (2 * TX_VMW_GATE_EN1_sum))
          max: 100 * MAX(TX_VCA_BUFFER_TOTAL_CYCLES_sum / (2 * TX_VMW_GATE_EN1_sum))
          unit: Percent
        Bus Util - Flat Requests:
          avg: 100 * SUM(TX_VCA_FLAT_TOTAL_CYCLES_sum) / (2 * SUM(TX_VMW_GATE_EN1_sum))
          min: 100 * MIN(TX_VCA_FLAT_TOTAL_CYCLES_sum / (2 * TX_VMW_GATE_EN1_sum))
          max: 100 * MAX(TX_VCA_FLAT_TOTAL_CYCLES_sum / (2 * TX_VMW_GATE_EN1_sum))
          unit: Percent

  - metric_table:
