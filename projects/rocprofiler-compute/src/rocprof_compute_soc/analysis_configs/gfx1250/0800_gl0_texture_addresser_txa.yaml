  metrics_description:
    Utilization: >-
      Percentage of cycles the TXA is processing memory requests.

    TXA Stall Rate: >-
      Percentage of cycles the TXA is stalled by the GL0 cache.

    LDS Instructions: >-
      Total LDS instructions processed by TXA.

    LDS Load Instructions: >-
      Number of LDS load instructions processed by TXA.

    LDS Store Instructions: >-
      Number of LDS store instructions processed by TXA.

    LDS Atomics Instructions: >-
      Number of LDS atomic instructions processed by TXA.

    Buffer Instructions: >-
      Total buffer VMEM instructions processed by TXA.

    Buffer Load Instructions: >-
      Number of buffer load instructions processed by TXA.

    Buffer Store Instructions: >-
      Number of buffer store instructions processed by TXA.

    Buffer Atomics Instructions: >-
      Number of buffer atomic instructions processed by TXA.

    Flat Instructions: >-
      Total flat-addressed VMEM instructions processed by TXA.

    Flat Load Instructions: >-
      Number of flat-addressed load instructions processed by TXA.

    Flat Store Instructions: >-
      Number of flat-addressed store instructions processed by TXA.

    Flat Atomics Instructions: >-
      Number of flat-addressed atomic instructions processed by TXA.

    Async Load Instruction: >-
      Number of async load instructions processed by TXA.

    Async Store Instruction: >-
      Number of async store instructions processed by TXA.

    Async Direct Load Instruction: >-
      Number of async direct load instructions processed by TXA.

    Async Direct Store Instruction: >-
      Number of async direct store instructions processed by TXA.

    Cluster Load Instruction: >-
      Number of cluster load instructions processed by TXA.

    Async Cluster Load Instruction: >-
      Number of async cluster load instructions processed by TXA.

    Async Barrier Instruction: >-
      Number of async barrier instructions processed by TXA.

    TDM Instructions: >-
      Total TDM instructions processed by TXA.

    TDM Async Load Instructions: >-
      Number of TDM async load instructions processed by TXA.

    TDM Async Store Instructions: >-
      Number of TDM async store instructions processed by TXA.

    TDM Async Cluster Load Instructions: >-
      Number of TDM async cluster load instructions processed by TXA.

    TDM Async Barrier Instruction: >-
      Number of TDM async barrier instructions processed by TXA.

    Block Load Instruction: >-
      Number of block load instructions processed by TXA.

    Block Store Instruction: >-
      Number of block store instructions processed by TXA.

    Request Bus Utilization: >-
      Percentage of cycles the Shader-to-TXA request bus is carrying a request.

    Request Bus Utilization - Atomic Data: >-
      Percentage of cycles the Shader-to-TXA request bus is carrying atomic write data.

    Command Bus Util: >-
      Percentage of cycles the TXA-to-GL0 command bus is carrying a memory command.

    Command Bus Stall Rate: >-
      Percentage of cycles the TXA-to-GL0 command bus is stalled.

    Request Bus Util: >-
      Percentage of cycles the TXA-to-GL0 request data bus is carrying data.

    Request Bus Stall Rate: >-
      Percentage of cycles the TXA-to-GL0 request data bus is stalled.

    Bus Util - LDS Requests: >-
      Percentage of cycles the TXA-to-GL0 bus is carrying LDS requests.

    Bus Util - Buffer Requests: >-
      Percentage of cycles the TXA-to-GL0 bus is carrying buffer (descriptor-based) VMEM requests.
    Bus Util - Flat Requests: >-
      Percentage of cycles the TXA-to-GL0 bus is carrying flat-addressed VMEM requests.

    LDS Bandwidth - Load: >-
      Total load bandwidth from LDS to WGP registers.

    LDS Bandwidth - Store: >-
      Total store bandwidth from WGP registers to LDS.

    LDS Bandwidth - Atomics: >-
      Total read-modify-write bandwidth for atomics between LDS and WGP registers.

    Async Load Bandwidth: >-
      Total async load bandwidth.

    Async Store Bandwidth: >-
      Total async store bandwidth.

    TDM Load Bandwidth: >-
      Total TDM load bandwidth.

    TDM Store Bandwidth: >-
      Total TDM store bandwidth.

    GL0 Load Bandwidth: >-
      Total GL0 load bandwidth from WGP.

    GL0 Store Bandwidth: >-
      Total GL0 store bandwidth from WGP.

    GL0 Atomics Bandwidth: >-
      Total GL0 atomics bandwidth from WGP.
