          max: 100 * MAX(TX_VCA_VMEMCMD_CYCLES_sum / (2 * GRBM_GUI_ACTIVE_sum * $cu_per_gpu))
          unit: Percent
        Command Bus Stall Rate:
          avg: 100 * SUM(TX_VMW_VMW_VCA_REQ_STALL_sum) / (2 * SUM(TX_VMW_GATE_EN1_sum))
          min: 100 * MIN(TX_VMW_VMW_VCA_REQ_STALL_sum / (2 * TX_VMW_GATE_EN1_sum))
          max: 100 * MAX(TX_VMW_VMW_VCA_REQ_STALL_sum / (2 * TX_VMW_GATE_EN1_sum))
          unit: Percent
        Request Bus Util:
          avg: 100 * SUM(TX_VCA_VMEMREQ_CYCLES_sum) / SUM(2 * GRBM_GUI_ACTIVE_sum * $cu_per_gpu)
          min: 100 * MIN(TX_VCA_VMEMREQ_CYCLES_sum / (2 * GRBM_GUI_ACTIVE_sum * $cu_per_gpu))
          max: 100 * MAX(TX_VCA_VMEMREQ_CYCLES_sum / (2 * GRBM_GUI_ACTIVE_sum * $cu_per_gpu))
          unit: Percent
        Request Bus Stall Rate:
          avg: 100 * SUM(TX_VMW_DATA_FIFO_STALL_sum) / (2 * SUM(TX_VMW_GATE_EN1_sum))
          min: 100 * MIN(TX_VMW_DATA_FIFO_STALL_sum / (2 * TX_VMW_GATE_EN1_sum))
          max: 100 * MAX(TX_VMW_DATA_FIFO_STALL_sum / (2 * TX_VMW_GATE_EN1_sum))
          unit: Percent
        Bus Util - LDS Requests:
          avg: 100 * SUM(TX_VCA_LDS_TOTAL_CYCLES_sum) / (2 * SUM(TX_VMW_GATE_EN1_sum))
          min: 100 * MIN(TX_VCA_LDS_TOTAL_CYCLES_sum / (2 * TX_VMW_GATE_EN1_sum))
          max: 100 * MAX(TX_VCA_LDS_TOTAL_CYCLES_sum / (2 * TX_VMW_GATE_EN1_sum))
          unit: Percent
        Bus Util - Buffer Requests:
