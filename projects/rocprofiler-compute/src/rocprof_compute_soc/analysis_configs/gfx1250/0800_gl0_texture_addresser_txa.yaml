# =============================================================================
# gfx1250 GL0 Texture Addresser (TXA) Metrics
# =============================================================================
#
# The GL0 Texture Addresser (TXA) is the front-end of the GL0 cache that handles
# address generation and request arbitration for various memory operations
# including LDS, VMEM, async, TDM, and block load/store instructions.
#
# =============================================================================

Panel Config:
  id: 800
  title: GL0 Texture Addresser (TXA)
  description: |-
    GL0 Texture Addresser metrics for gfx1250. The TXA is the address generation
    and request handling front-end of the GL0 cache subsystem. It processes
    memory requests from shader cores including LDS, VMEM (buffer/flat),
    async operations, TDM (Tensor Data Mover), and block load/store operations.

  data source:

  - metric_table:
      id: 801
      title: TXA Utilization
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        # Utilization: TX_VCA_VCA_BUSY_sum is summed across all TXA units (one per WGP).
        Utilization:
          avg: 100 * SUM(TX_VCA_VCA_BUSY_sum) / SUM(GRBM_GUI_ACTIVE_sum * $cu_per_gpu)
          min: 100 * MIN(TX_VCA_VCA_BUSY_sum / (GRBM_GUI_ACTIVE_sum * $cu_per_gpu))
          max: 100 * MAX(TX_VCA_VCA_BUSY_sum / (GRBM_GUI_ACTIVE_sum * $cu_per_gpu))
          unit: Percent
        TXA Stall Rate:
          avg: 100 * SUM(TX_VCA_ADDRESSER_STALLED_CYCLES_sum) / SUM(TX_VMW_GATE_EN1_sum)
          min: 100 * MIN(TX_VCA_ADDRESSER_STALLED_CYCLES_sum / TX_VMW_GATE_EN1_sum)
          max: 100 * MAX(TX_VCA_ADDRESSER_STALLED_CYCLES_sum / TX_VMW_GATE_EN1_sum)
          unit: Percent

  - metric_table:
      id: 802
      title: Shader-TXA Requests - LDS
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        LDS Instructions:
          avg: SUM(TX_VCA_LDS_TOTAL_WAVEFRONTS_sum) / SUM($denom)
          min: MIN(TX_VCA_LDS_TOTAL_WAVEFRONTS_sum / $denom)
          max: MAX(TX_VCA_LDS_TOTAL_WAVEFRONTS_sum / $denom)
          unit: (Count + $normUnit)
        LDS Load Instructions:
          avg: SUM(TX_VCA_LDS_LOAD_WAVEFRONTS_sum) / SUM($denom)
          min: MIN(TX_VCA_LDS_LOAD_WAVEFRONTS_sum / $denom)
          max: MAX(TX_VCA_LDS_LOAD_WAVEFRONTS_sum / $denom)
          unit: (Count + $normUnit)
        LDS Store Instructions:
          avg: SUM(TX_VCA_LDS_STORE_WAVEFRONTS_sum) / SUM($denom)
          min: MIN(TX_VCA_LDS_STORE_WAVEFRONTS_sum / $denom)
          max: MAX(TX_VCA_LDS_STORE_WAVEFRONTS_sum / $denom)
          unit: (Count + $normUnit)
        LDS Atomics Instructions:
          avg: SUM(TX_VCA_LDS_ATOMIC_WAVEFRONTS_sum) / SUM($denom)
          min: MIN(TX_VCA_LDS_ATOMIC_WAVEFRONTS_sum / $denom)
          max: MAX(TX_VCA_LDS_ATOMIC_WAVEFRONTS_sum / $denom)
          unit: (Count + $normUnit)
