  - metric_table:
      id: 1303
      title: GL2C-EA Interface - Latencies
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL2-EA Read Latency:
          avg: SUM(GL2C_EA_RDREQ_LEVEL_sum) / SUM(GL2C_EA_RDREQ_sum)
          min: MIN(GL2C_EA_RDREQ_LEVEL_sum / GL2C_EA_RDREQ_sum)
          max: MAX(GL2C_EA_RDREQ_LEVEL_sum / GL2C_EA_RDREQ_sum)
          unit: Cycles
        GL2-EA Write Latency:
          avg: SUM(GL2C_EA_WRREQ_LEVEL_sum) / SUM(GL2C_EA_WRREQ_sum)
          min: MIN(GL2C_EA_WRREQ_LEVEL_sum / GL2C_EA_WRREQ_sum)
          max: MAX(GL2C_EA_WRREQ_LEVEL_sum / GL2C_EA_WRREQ_sum)
          unit: Cycles
        GL2-EA Atomic Latency:
          avg: SUM(GL2C_EA_ATOMIC_LEVEL_sum) / SUM(GL2C_EA_ATOMIC_sum)
          min: MIN(GL2C_EA_ATOMIC_LEVEL_sum / GL2C_EA_ATOMIC_sum)
          max: MAX(GL2C_EA_ATOMIC_LEVEL_sum / GL2C_EA_ATOMIC_sum)
