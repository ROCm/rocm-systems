# =============================================================================
# gfx1250 GL2 Cache Metrics
# =============================================================================
#
# GL2 is the L2 cache shared across shader engines. It consists of:
#   - GL2A: GL2 Arbiter - handles request distribution to GL2C partitions
#   - GL2C: GL2 Cache - the actual cache storage and EA interface
#
# =============================================================================

Panel Config:
  id: 1300
  title: GL2 Cache
  description: |-
    GL2 Cache metrics for gfx1250. GL2 is the shared L2 cache consisting of
    GL2A (arbiter) and GL2C (cache partitions). This panel covers GL2A
    utilization, GL2C-EA stalls, latencies, and bandwidth by destination type.

  data source:

  - metric_table:
      id: 1301
      title: GL2A Processing
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Utilization:
          avg: 100 * SUM(GL2A_BUSY_sum) / SUM(GL2A_CYCLE_sum)
          min: 100 * MIN(GL2A_BUSY_sum / GL2A_CYCLE_sum)
          max: 100 * MAX(GL2A_BUSY_sum / GL2A_CYCLE_sum)
          unit: Percent
        GL2A-GL2C0 Request:
          avg: SUM(GL2A_REQ_GL2C0_sum) / SUM($denom)
          min: MIN(GL2A_REQ_GL2C0_sum / $denom)
          max: MAX(GL2A_REQ_GL2C0_sum / $denom)
          unit: (Count + $normUnit)
        GL2A-GL2C1 Request:
          avg: SUM(GL2A_REQ_GL2C1_sum) / SUM($denom)
          min: MIN(GL2A_REQ_GL2C1_sum / $denom)
          max: MAX(GL2A_REQ_GL2C1_sum / $denom)
          unit: (Count + $normUnit)
        GL2A-GL2C2 Request:
          avg: SUM(GL2A_REQ_GL2C2_sum) / SUM($denom)
          min: MIN(GL2A_REQ_GL2C2_sum / $denom)
          max: MAX(GL2A_REQ_GL2C2_sum / $denom)
          unit: (Count + $normUnit)
        GL2A-GL2C3 Request:
          avg: SUM(GL2A_REQ_GL2C3_sum) / SUM($denom)
          min: MIN(GL2A_REQ_GL2C3_sum / $denom)
          max: MAX(GL2A_REQ_GL2C3_sum / $denom)
          unit: (Count + $normUnit)
        GL2A-GL2C0 Request Stall Rate:
          avg: 100 * SUM(GL2A_REQ_STALL_GL2C0_sum) / SUM(GL2A_BUSY_sum)
          min: 100 * MIN(GL2A_REQ_STALL_GL2C0_sum / GL2A_BUSY_sum)
          max: 100 * MAX(GL2A_REQ_STALL_GL2C0_sum / GL2A_BUSY_sum)
          unit: Percent
        GL2A-GL2C1 Request Stall Rate:
          avg: 100 * SUM(GL2A_REQ_STALL_GL2C1_sum) / SUM(GL2A_BUSY_sum)
          min: 100 * MIN(GL2A_REQ_STALL_GL2C1_sum / GL2A_BUSY_sum)
          max: 100 * MAX(GL2A_REQ_STALL_GL2C1_sum / GL2A_BUSY_sum)
          unit: Percent
        GL2A-GL2C2 Request Stall Rate:
          avg: 100 * SUM(GL2A_REQ_STALL_GL2C2_sum) / SUM(GL2A_BUSY_sum)
          min: 100 * MIN(GL2A_REQ_STALL_GL2C2_sum / GL2A_BUSY_sum)
          max: 100 * MAX(GL2A_REQ_STALL_GL2C2_sum / GL2A_BUSY_sum)
          unit: Percent
        GL2A-GL2C3 Request Stall Rate:
          avg: 100 * SUM(GL2A_REQ_STALL_GL2C3_sum) / SUM(GL2A_BUSY_sum)
          min: 100 * MIN(GL2A_REQ_STALL_GL2C3_sum / GL2A_BUSY_sum)
          max: 100 * MAX(GL2A_REQ_STALL_GL2C3_sum / GL2A_BUSY_sum)
          unit: Percent
        GL2C0-GL2A Return Stall Rate:
          avg: 100 * SUM(GL2A_RTN_STALL_GL2C0_sum) / SUM(GL2A_BUSY_sum)
          min: 100 * MIN(GL2A_RTN_STALL_GL2C0_sum / GL2A_BUSY_sum)
          max: 100 * MAX(GL2A_RTN_STALL_GL2C0_sum / GL2A_BUSY_sum)
          unit: Percent
        GL2C1-GL2A Return Stall Rate:
          avg: 100 * SUM(GL2A_RTN_STALL_GL2C1_sum) / SUM(GL2A_BUSY_sum)
          min: 100 * MIN(GL2A_RTN_STALL_GL2C1_sum / GL2A_BUSY_sum)
          max: 100 * MAX(GL2A_RTN_STALL_GL2C1_sum / GL2A_BUSY_sum)
          unit: Percent
        GL2C2-GL2A Return Stall Rate:
          avg: 100 * SUM(GL2A_RTN_STALL_GL2C2_sum) / SUM(GL2A_BUSY_sum)
          min: 100 * MIN(GL2A_RTN_STALL_GL2C2_sum / GL2A_BUSY_sum)
          max: 100 * MAX(GL2A_RTN_STALL_GL2C2_sum / GL2A_BUSY_sum)
          unit: Percent
        GL2C3-GL2A Return Stall Rate:
          avg: 100 * SUM(GL2A_RTN_STALL_GL2C3_sum) / SUM(GL2A_BUSY_sum)
          min: 100 * MIN(GL2A_RTN_STALL_GL2C3_sum / GL2A_BUSY_sum)
          max: 100 * MAX(GL2A_RTN_STALL_GL2C3_sum / GL2A_BUSY_sum)
          unit: Percent

  - metric_table:
      id: 1310
      title: GL2C Utilization
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL2C Utilization:
          avg: 100 * SUM(GL2C_BUSY_sum) / SUM(GL2C_CYCLE_sum)
          min: 100 * MIN(GL2C_BUSY_sum / GL2C_CYCLE_sum)
          max: 100 * MAX(GL2C_BUSY_sum / GL2C_CYCLE_sum)
          unit: Percent

  - metric_table:
      id: 1311
      title: GL2C Cache Lookup
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL2 Cache Hit Rate:
          avg: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
          min: 100 * MIN(GL2C_HIT_sum / (GL2C_HIT_sum + GL2C_MISS_sum))
          max: 100 * MAX(GL2C_HIT_sum / (GL2C_HIT_sum + GL2C_MISS_sum))
          unit: Percent
        GL2 Pipeline Stall:
          avg: 100 * SUM(GL2C_TAG_STALL_sum) / SUM(GL2C_BUSY_sum)
          min: 100 * MIN(GL2C_TAG_STALL_sum / GL2C_BUSY_sum)
          max: 100 * MAX(GL2C_TAG_STALL_sum / GL2C_BUSY_sum)
          unit: Percent
        GL2 Latency FIFO Full Stall:
          avg: 100 * SUM(GL2C_LATENCY_FIFO_FULL_sum) / SUM(GL2C_BUSY_sum)
          min: 100 * MIN(GL2C_LATENCY_FIFO_FULL_sum / GL2C_BUSY_sum)
          max: 100 * MAX(GL2C_LATENCY_FIFO_FULL_sum / GL2C_BUSY_sum)
          unit: Percent
        GL2 Source FIFO Full Stall:
          avg: 100 * SUM(GL2C_SRC_FIFO_FULL_sum) / SUM(GL2C_BUSY_sum)
          min: 100 * MIN(GL2C_SRC_FIFO_FULL_sum / GL2C_BUSY_sum)
          max: 100 * MAX(GL2C_SRC_FIFO_FULL_sum / GL2C_BUSY_sum)
          unit: Percent
        GL2 Tag Stall - Set Full:
          avg: 100 * SUM(GL2C_TAG_MISS_NOTHING_REPLACEABLE_STALL_sum) / SUM(GL2C_BUSY_sum)
          min: 100 * MIN(GL2C_TAG_MISS_NOTHING_REPLACEABLE_STALL_sum / GL2C_BUSY_sum)
          max: 100 * MAX(GL2C_TAG_MISS_NOTHING_REPLACEABLE_STALL_sum / GL2C_BUSY_sum)
          unit: Percent
        GL2 Tag Stall - Writeback FIFO Full:
          avg: 100 * SUM(GL2C_TAG_WRITEBACK_FIFO_FULL_STALL_sum) / SUM(GL2C_BUSY_sum)
          min: 100 * MIN(GL2C_TAG_WRITEBACK_FIFO_FULL_STALL_sum / GL2C_BUSY_sum)
          max: 100 * MAX(GL2C_TAG_WRITEBACK_FIFO_FULL_STALL_sum / GL2C_BUSY_sum)
          unit: Percent
        GL2 Tag Stall - Cached EA FIFO Full:
          avg: 100 * SUM(GL2C_TAG_CACHED_EA_FIFO_FULL_STALL_sum) / SUM(GL2C_BUSY_sum)
          min: 100 * MIN(GL2C_TAG_CACHED_EA_FIFO_FULL_STALL_sum / GL2C_BUSY_sum)
          max: 100 * MAX(GL2C_TAG_CACHED_EA_FIFO_FULL_STALL_sum / GL2C_BUSY_sum)
          unit: Percent

  - metric_table:
      id: 1302
      title: GL2C-EA Stalls
