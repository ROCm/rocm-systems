  metrics_description:
    Utilization: >-
      Percentage of GL2 Arbiter cycles when it's distributing requests across GL2C partitions.

    GL2C Utilization: >-
      Percentage of GL2 Cache cycles when it's busy.

    GL2 Cache Hit Rate: >-
      GL2 cache hit rate.

    GL2 Pipeline Stall: >-
      Percentage of GL2 Cache busy cycles the tag pipeline is stalled.

    GL2 Latency FIFO Full Stall: >-
      Percentage of GL2 Cache busy cycles stalled due to a full latency FIFO.

    GL2 Source FIFO Full Stall: >-
      Percentage of GL2 Cache busy cycles stalled due to a full source data FIFO.

    GL2 Tag Stall - Set Full: >-
      Percentage of GL2 Cache busy cycles the tag pipeline stalled because no replaceable cache line is available.

    GL2 Tag Stall - Writeback FIFO Full: >-
      Percentage of GL2 Cache busy cycles the tag pipeline stalled due to a full writeback FIFO.

    GL2 Tag Stall - Cached EA FIFO Full: >-
      Percentage of GL2 Cache busy cycles the tag pipeline stalled due to a full cached EA FIFO.

    GL2A-GL2C0 Request: >-
      Number of requests forwarded by GL2 Arbiter to GL2 Cache partition 0.

    GL2A-GL2C1 Request: >-
      Number of requests forwarded by GL2 Arbiter to GL2 Cache partition 1.

    GL2A-GL2C2 Request: >-
      Number of requests forwarded by GL2 Arbiter to GL2 Cache partition 2.

    GL2A-GL2C3 Request: >-
      Number of requests forwarded by GL2 Arbiter to GL2 Cache partition 3.

    GL2A-GL2C0 Request Stall Rate: >-
      Percentage of GL2 Arbiter busy cycles when it's stalled forwarding to GL2 Cache partition 0.

    GL2A-GL2C1 Request Stall Rate: >-
      Percentage of GL2 Arbiter busy cycles when it's stalled forwarding to GL2 Cache partition 1.

    GL2A-GL2C2 Request Stall Rate: >-
      Percentage of GL2 Arbiter busy cycles when it's stalled forwarding to GL2 Cache partition 2.

    GL2A-GL2C3 Request Stall Rate: >-
      Percentage of GL2 Arbiter busy cycles when it's stalled forwarding to GL2 Cache partition 3.

    GL2C0-GL2A Return Stall Rate: >-
      Percentage of GL2 Arbiter busy cycles GL2 Cache partition 0 cannot return data.

    GL2C1-GL2A Return Stall Rate: >-
      Percentage of GL2 Arbiter busy cycles GL2 Cache partition 1 cannot return data.

    GL2C2-GL2A Return Stall Rate: >-
      Percentage of GL2 Arbiter busy cycles GL2 Cache partition 2 cannot return data.

    GL2C3-GL2A Return Stall Rate: >-
      Percentage of GL2 Arbiter busy cycles GL2 Cache partition 3 cannot return data.

    GL2-EA Request Stall on VC3: >-
      Percentage of GL2 Cache busy cycles when it's stalled on the GL2 Cache to EA read request channel (VC3).

    GL2-EA Request Stall on VC4: >-
      Percentage of GL2 Cache busy cycles when it's stalled on the GL2 Cache to EA write request channel (VC4).

    GL2-EA Request Stall on VC6: >-
      Percentage of GL2 Cache busy cycles when it's stalled on the GL2 Cache to EA atomic/priority read channel (VC6).

    GL2-EA Request Stall on VC7: >-
      Percentage of GL2 Cache busy cycles when it's stalled on the GL2 Cache to EA atomic write/priority channel (VC7).

    GL2-EA Data Stall on VC2: >-
      Percentage of GL2 Cache busy cycles when it's stalled on the GL2 Cache to EA data return channel (VC2).

    GL2-EA Data Stall on VC3: >-
      Percentage of GL2 Cache busy cycles when it's stalled on GL2 Cache to EA data channel VC3.

    GL2-EA Data Stall on VC4: >-
      Percentage of GL2 Cache busy cycles when it's stalled on GL2 Cache to EA data channel VC4.

    GL2-EA Data Stall on VC6: >-
      Percentage of GL2 Cache busy cycles when it's stalled on GL2 Cache to EA data channel VC6.

    GL2-EA Data Stall on VC7: >-
      Percentage of GL2 Cache busy cycles when it's stalled on GL2 Cache to EA data channel VC7.

    GL2-EA HBM Bandwidth - Read: >-
      Total HBM read bandwidth between GL2 and EA.

    GL2-EA HBM Bandwidth - Write: >-
      Total HBM write bandwidth between GL2 and EA.

    GL2-EA HBM Bandwidth - Atomic: >-
      Total HBM atomic bandwidth between GL2 and EA.

    GL2-EA Host CPU Bandwidth - Read: >-
      Total host CPU read bandwidth between GL2 and EA.

    GL2-EA Host CPU Bandwidth - Write: >-
      Total host CPU write bandwidth between GL2 and EA.

    GL2-EA Host CPU Bandwidth - Atomic: >-
      Total host CPU atomic bandwidth between GL2 and EA.

    GL2-EA PCIE Bandwidth - Read: >-
      Total PCIe read bandwidth between GL2 and EA.

    GL2-EA PCIE Bandwidth - Write: >-
      Total PCIe write bandwidth between GL2 and EA.

    GL2-EA PCIE Bandwidth - Atomic: >-
      Total PCIe atomic bandwidth between GL2 and EA.

    GL2-EA Remote Node Bandwidth - Read: >-
      Total remote node read bandwidth between GL2 and EA.

