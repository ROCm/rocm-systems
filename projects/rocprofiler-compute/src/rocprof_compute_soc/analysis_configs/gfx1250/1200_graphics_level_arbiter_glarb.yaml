# =============================================================================
# gfx1250 GLARB (Graphics Level Arbiter) Metrics
# =============================================================================
#
# GLARB (Graphics Level Arbiter) manages arbitration between GL1 buffer and GL2 cache.
# It consists of two components:
#   - GLARBA: Arbiter for requests going to GL2
#   - GLARBC: Arbiter for requests coming from clients (GL1 buffer)
#
# =============================================================================

Panel Config:
  id: 1200
  title: GLARB (Graphics Level Arbiter)
  description: |-
    GLARB (Graphics Level Arbiter) metrics for gfx1250. GLARB manages arbitration between
    GL1 caches and GL2. GLARBA handles requests going to GL2, while GLARBC
    handles requests from GL1 cache clients.

  data source:

  - metric_table:
      id: 1201
      title: GLARBA Processing
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Utilization:
          avg: 100 * SUM(GLARBA_BUSY_sum) / SUM(GLARBA_CYCLE_sum)
          min: 100 * MIN(GLARBA_BUSY_sum / GLARBA_CYCLE_sum)
          max: 100 * MAX(GLARBA_BUSY_sum / GLARBA_CYCLE_sum)
          unit: Percent
        GLARBA Request Bus Utilization:
          avg: 100 * SUM(GLARBA_REQ_PATH_BUSY_sum) / SUM(GLARBA_CYCLE_sum)
          min: 100 * MIN(GLARBA_REQ_PATH_BUSY_sum / GLARBA_CYCLE_sum)
          max: 100 * MAX(GLARBA_REQ_PATH_BUSY_sum / GLARBA_CYCLE_sum)
          unit: Percent
        GLARBA Return Bus Utilization:
          avg: 100 * SUM(GLARBA_RET_PATH_BUSY_sum) / SUM(GLARBA_CYCLE_sum)
          min: 100 * MIN(GLARBA_RET_PATH_BUSY_sum / GLARBA_CYCLE_sum)
          max: 100 * MAX(GLARBA_RET_PATH_BUSY_sum / GLARBA_CYCLE_sum)
          unit: Percent
        GLARBA Requests:
          avg: SUM(GLARBA_ARB_REQUESTS_sum) / SUM($denom)
          min: MIN(GLARBA_ARB_REQUESTS_sum / $denom)
          max: MAX(GLARBA_ARB_REQUESTS_sum / $denom)
          unit: (Count + $normUnit)
        GLARBA Request Latency:
          avg: SUM(GLARBA_REQ_INFLIGHT_LEVEL_sum) / SUM(GLARBA_ARB_REQUESTS_sum)
          min: MIN(GLARBA_REQ_INFLIGHT_LEVEL_sum / GLARBA_ARB_REQUESTS_sum)
          max: MAX(GLARBA_REQ_INFLIGHT_LEVEL_sum / GLARBA_ARB_REQUESTS_sum)
          unit: Cycles

  - metric_table:
      id: 1202
      title: GLARBC Utilization
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Utilization:
          avg: 100 * SUM(GLARBC_BUSY_sum) / SUM(GLARBC_CYCLE_sum)
          min: 100 * MIN(GLARBC_BUSY_sum / GLARBC_CYCLE_sum)
          max: 100 * MAX(GLARBC_BUSY_sum / GLARBC_CYCLE_sum)
          unit: Percent
        GLARBC Return Arbitration Latency:
          avg: SUM(GLARBC_ARB_RET_LEVEL_sum) / SUM(GLARBC_REQ_sum)
          min: MIN(GLARBC_ARB_RET_LEVEL_sum / GLARBC_REQ_sum)
          max: MAX(GLARBC_ARB_RET_LEVEL_sum / GLARBC_REQ_sum)
          unit: Cycles
        GLARBC Buffer Full Stall:
          avg: 100 * SUM(GLARBC_STALL_BUFFER_FULL_sum) / SUM(GLARBC_BUSY_sum)
          min: 100 * MIN(GLARBC_STALL_BUFFER_FULL_sum / GLARBC_BUSY_sum)
          max: 100 * MAX(GLARBC_STALL_BUFFER_FULL_sum / GLARBC_BUSY_sum)
          unit: Percent

  - metric_table:
      id: 1203
      title: GLARBC Request
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GLARBC Requests:
          avg: SUM(GLARBC_REQ_sum) / SUM($denom)
          min: MIN(GLARBC_REQ_sum / $denom)
          max: MAX(GLARBC_REQ_sum / $denom)
          unit: (Count + $normUnit)
        GLARBC Requests - Read:
          avg: SUM(GLARBC_REQ_READ_sum) / SUM($denom)
          min: MIN(GLARBC_REQ_READ_sum / $denom)
          max: MAX(GLARBC_REQ_READ_sum / $denom)
          unit: (Count + $normUnit)
        GLARBC Requests - Write:
          avg: SUM(GLARBC_REQ_WRITE_sum) / SUM($denom)
          min: MIN(GLARBC_REQ_WRITE_sum / $denom)
          max: MAX(GLARBC_REQ_WRITE_sum / $denom)
          unit: (Count + $normUnit)
        GLARBC Requests - Atomic with Return:
          avg: SUM(GLARBC_REQ_ATOMIC_WITH_RET_sum) / SUM($denom)
          min: MIN(GLARBC_REQ_ATOMIC_WITH_RET_sum / $denom)
          max: MAX(GLARBC_REQ_ATOMIC_WITH_RET_sum / $denom)
          unit: (Count + $normUnit)
        GLARBC Requests - Atomic without Return:
          avg: SUM(GLARBC_REQ_ATOMIC_WITHOUT_RET_sum) / SUM($denom)
          min: MIN(GLARBC_REQ_ATOMIC_WITHOUT_RET_sum / $denom)
          max: MAX(GLARBC_REQ_ATOMIC_WITHOUT_RET_sum / $denom)
          unit: (Count + $normUnit)
  - metric_table:
      id: 1204
      title: GLARBC Request Bandwidth
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GLARBC Request Bandwidth - Read:
          avg: SUM(GLARBC_REQ_READ_32B_sum * 32 + GLARBC_REQ_READ_64B_sum * 64 + GLARBC_REQ_READ_128B_sum * 128 + GLARBC_REQ_READ_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          min: MIN((GLARBC_REQ_READ_32B_sum * 32 + GLARBC_REQ_READ_64B_sum * 64 + GLARBC_REQ_READ_128B_sum * 128 + GLARBC_REQ_READ_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          max: MAX((GLARBC_REQ_READ_32B_sum * 32 + GLARBC_REQ_READ_64B_sum * 64 + GLARBC_REQ_READ_128B_sum * 128 + GLARBC_REQ_READ_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          unit: GB/s
        GLARBC Request Bandwidth - Write:
          avg: SUM(GLARBC_REQ_WRITE_32B_sum * 32 + GLARBC_REQ_WRITE_64B_sum * 64 + GLARBC_REQ_WRITE_128B_sum * 128 + GLARBC_REQ_WRITE_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          min: MIN((GLARBC_REQ_WRITE_32B_sum * 32 + GLARBC_REQ_WRITE_64B_sum * 64 + GLARBC_REQ_WRITE_128B_sum * 128 + GLARBC_REQ_WRITE_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          max: MAX((GLARBC_REQ_WRITE_32B_sum * 32 + GLARBC_REQ_WRITE_64B_sum * 64 + GLARBC_REQ_WRITE_128B_sum * 128 + GLARBC_REQ_WRITE_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          unit: GB/s
        GLARBC-Client Write ACKs:
          avg: SUM(GLARBC_GLARB_RET_ACK_sum) / SUM($denom)
          min: MIN(GLARBC_GLARB_RET_ACK_sum / $denom)
          max: MAX(GLARBC_GLARB_RET_ACK_sum / $denom)
          unit: (Count + $normUnit)
  - metric_table:
      id: 1205
      title: GLARBC-GL2 Interface
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GLARBC-GL2 Read Latency:
          avg: SUM(GLARBC_GL2_REQ_READ_LEVEL_sum) / SUM(GLARBC_REQ_READ_sum + GLARBC_REQ_ATOMIC_WITH_RET_sum + GLARBC_REQ_NOP_RTN0_sum)
          min: MIN(GLARBC_GL2_REQ_READ_LEVEL_sum / (GLARBC_REQ_READ_sum + GLARBC_REQ_ATOMIC_WITH_RET_sum + GLARBC_REQ_NOP_RTN0_sum))
          max: MAX(GLARBC_GL2_REQ_READ_LEVEL_sum / (GLARBC_REQ_READ_sum + GLARBC_REQ_ATOMIC_WITH_RET_sum + GLARBC_REQ_NOP_RTN0_sum))
          unit: Cycles
        GLARBC-GL2 Write Latency:
          avg: SUM(GLARBC_GL2_REQ_WRITE_LEVEL_sum) / SUM(GLARBC_REQ_WRITE_sum + GLARBC_REQ_ATOMIC_WITHOUT_RET_sum + GLARBC_REQ_NOP_ACK_sum)
          min: MIN(GLARBC_GL2_REQ_WRITE_LEVEL_sum / (GLARBC_REQ_WRITE_sum + GLARBC_REQ_ATOMIC_WITHOUT_RET_sum + GLARBC_REQ_NOP_ACK_sum))
          max: MAX(GLARBC_GL2_REQ_WRITE_LEVEL_sum / (GLARBC_REQ_WRITE_sum + GLARBC_REQ_ATOMIC_WITHOUT_RET_sum + GLARBC_REQ_NOP_ACK_sum))
          unit: Cycles
        GLARBC-GL2 Write ACKs:
          avg: SUM(GLARBC_GL2_RET_ACK_sum) / SUM($denom)
          min: MIN(GLARBC_GL2_RET_ACK_sum / $denom)
          max: MAX(GLARBC_GL2_RET_ACK_sum / $denom)
          unit: (Count + $normUnit)
  metrics_description:
    Utilization: >-
      Percentage of GLARBA/GLARBC cycles the Graphics Level Arbiter is actively processing requests.

    GLARBA Request Bus Utilization: >-
      Percentage of cycles the GL1 to Graphics Level Arbiter request bus is active.

    GLARBA Return Bus Utilization: >-
      Percentage of cycles the GL2-to-GL1 return bus is active.

    GLARBA Requests: >-
      Total requests arbitrated by Graphics Level Arbiter.

    GLARBC Buffer Full Stall: >-
      Percentage of Graphics Level Arbiter busy cycles when it's stalled due to a full buffer.

    GLARBC Requests: >-
      Total requests forwarded by Graphics Level Arbiter to GL2.

    GLARBC Requests - Read: >-
      Number of Graphics Level Arbiter read requests.

    GLARBC Requests - Write: >-
      Number of Graphics Level Arbiter write requests.

    GLARBC Requests - Atomic with Return: >-
      Number of returning Graphics Level Arbiter atomic requests.

    GLARBC Requests - Atomic without Return: >-
      Number of non-returning Graphics Level Arbiter atomic requests.

    GLARBC Request Bandwidth - Read: >-
      Total Graphics Level Arbiter read bandwidth.

    GLARBC Request Bandwidth - Write: >-
      Total Graphics Level Arbiter write bandwidth.

    GLARBC-Client Write ACKs: >-
      Number of write acknowledgments returned from Graphics Level Arbiter to GL1 clients.

    GLARBC-GL2 Read Latency: >-
      Average Graphics Level Arbiter to GL2 read latency.

    GLARBC-GL2 Write ACKs: >-
      Number of write acknowledgments received from GL2 by Graphics Level Arbiter.
