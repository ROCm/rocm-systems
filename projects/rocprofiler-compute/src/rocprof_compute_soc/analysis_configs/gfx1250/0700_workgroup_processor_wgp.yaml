          avg: AVG((100 * SQ_INST_CYCLES_VMEM_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
          min: MIN((100 * SQ_INST_CYCLES_VMEM_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
          max: MAX((100 * SQ_INST_CYCLES_VMEM_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
          unit: Percent
        WGP-GL0 VMEM Read Request Bus Util:
          avg: AVG((100 * SQ_INST_CYCLES_VMEM_LOAD_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
          min: MIN((100 * SQ_INST_CYCLES_VMEM_LOAD_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
          max: MAX((100 * SQ_INST_CYCLES_VMEM_LOAD_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
