          max: MAX((100 * SQ_INST_CYCLES_VMEM_STORE_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
          unit: Percent
        # Metrics 104-107: Dual-port Row0/Row1 bus utilization and stall rates
        Bus Utilization - Row0:
          avg: AVG((100 * SQ_VMEM_REQ_ROW0_BUSY_CYCLES_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
          min: MIN((100 * SQ_VMEM_REQ_ROW0_BUSY_CYCLES_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
