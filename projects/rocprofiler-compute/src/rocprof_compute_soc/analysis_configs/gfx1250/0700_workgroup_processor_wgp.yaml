          min: MIN((100 * SQ_VMEM_REQ_ROW1_BUSY_CYCLES_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
          max: MAX((100 * SQ_VMEM_REQ_ROW1_BUSY_CYCLES_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
          unit: Percent
        Bus Stall Rate - Row1:
          avg: AVG((100 * SQ_VMEM_REQ_ROW1_STALL_CYCLES_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
