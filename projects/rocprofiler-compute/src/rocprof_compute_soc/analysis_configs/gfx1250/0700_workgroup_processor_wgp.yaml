          min: MIN(SQ_INSTS_VALU_DP_sum / $denom)
          max: MAX(SQ_INSTS_VALU_DP_sum / $denom)
          unit: (Count + $normUnit)
        Instructions - VMEM:
          avg: SUM(SQ_INSTS_TEX_sum) / SUM($denom)
          min: MIN(SQ_INSTS_TEX_sum / $denom)
          max: MAX(SQ_INSTS_TEX_sum / $denom)
