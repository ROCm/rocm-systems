  - metric_table:
      id: 706
      title: "VMEM Instruction Mix"
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Instructions - VMEM Flat:
          avg: AVG(SQ_INSTS_FLAT_sum / $denom)
          min: MIN(SQ_INSTS_FLAT_sum / $denom)
          max: MAX(SQ_INSTS_FLAT_sum / $denom)
          unit: (Count + $normUnit)
        Instructions - Global Scratch:
          avg: AVG(SQ_INSTS_VEC32_GLOBAL_SCRATCH_sum / $denom)
          min: MIN(SQ_INSTS_VEC32_GLOBAL_SCRATCH_sum / $denom)
          max: MAX(SQ_INSTS_VEC32_GLOBAL_SCRATCH_sum / $denom)
          unit: (Count + $normUnit)
        # Instructions - VMEM Load (SQ_INSTS_TEX_LOAD_sum): REMOVED for gfx1250.
        # On gfx1250, the MIMG (image_load) and MTBUF-format (buffer_load_format_*)
        # instruction classes do not exist — the assembler rejects them.
        # SQ_INSTS_TEX_LOAD_sum will always be 0 on gfx1250.
        # Instructions - VMEM Store (SQ_INSTS_TEX_STORE_sum): Same reason — removed.
        Instructions - Flat Load:
          avg: AVG(SQ_INSTS_FLAT_LOAD_sum / $denom)
          min: MIN(SQ_INSTS_FLAT_LOAD_sum / $denom)
          max: MAX(SQ_INSTS_FLAT_LOAD_sum / $denom)
          unit: (Count + $normUnit)
        Instructions - Flat Store:
          avg: AVG(SQ_INSTS_FLAT_STORE_sum / $denom)
          min: MIN(SQ_INSTS_FLAT_STORE_sum / $denom)
          max: MAX(SQ_INSTS_FLAT_STORE_sum / $denom)
          unit: (Count + $normUnit)
        Instructions - Buffer Load:
          avg: AVG(SQ_INSTS_BUFFER_LOAD_sum / $denom)
          min: MIN(SQ_INSTS_BUFFER_LOAD_sum / $denom)
          max: MAX(SQ_INSTS_BUFFER_LOAD_sum / $denom)
          unit: (Count + $normUnit)
        Instructions - Buffer Store:
          avg: AVG(SQ_INSTS_BUFFER_STORE_sum / $denom)
          min: MIN(SQ_INSTS_BUFFER_STORE_sum / $denom)
          max: MAX(SQ_INSTS_BUFFER_STORE_sum / $denom)
          unit: (Count + $normUnit)
        Instructions - Global Scratch Load:
          avg: AVG(SQ_INSTS_VEC32_GLOBAL_SCRATCH_LOAD_sum / $denom)
          min: MIN(SQ_INSTS_VEC32_GLOBAL_SCRATCH_LOAD_sum / $denom)
          max: MAX(SQ_INSTS_VEC32_GLOBAL_SCRATCH_LOAD_sum / $denom)
          unit: (Count + $normUnit)
        Instructions - Global Scratch Store:
          avg: AVG(SQ_INSTS_VEC32_GLOBAL_SCRATCH_STORE_sum / $denom)
          min: MIN(SQ_INSTS_VEC32_GLOBAL_SCRATCH_STORE_sum / $denom)
          max: MAX(SQ_INSTS_VEC32_GLOBAL_SCRATCH_STORE_sum / $denom)
          unit: (Count + $normUnit)
        Instructions - Global Scratch Atomics:
          avg: AVG(SQ_INSTS_VEC32_GLOBAL_SCRATCH_ATOMIC_sum / $denom)
          min: MIN(SQ_INSTS_VEC32_GLOBAL_SCRATCH_ATOMIC_sum / $denom)
          max: MAX(SQ_INSTS_VEC32_GLOBAL_SCRATCH_ATOMIC_sum / $denom)
          unit: (Count + $normUnit)
        Instructions - VMEM Atomic RTN:
          avg: AVG(SQ_INSTS_TEX_ATOMIC_RTN_sum / $denom)
          min: MIN(SQ_INSTS_TEX_ATOMIC_RTN_sum / $denom)
