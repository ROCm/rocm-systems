        unit: Unit
      metric:
        WGP-GL0 Request Bus Util:
          avg: 100 * SUM(SQ_INST_CYCLES_TEX_sum) / SUM(SQ_BUSY_CYCLES_sum)
          min: 100 * MIN(SQ_INST_CYCLES_TEX_sum / SQ_BUSY_CYCLES_sum)
          max: 100 * MAX(SQ_INST_CYCLES_TEX_sum / SQ_BUSY_CYCLES_sum)
          unit: Percent
        WGP-GL0 LDS Request Bus Util:
          avg: 100 * SUM(SQ_INST_CYCLES_LDS_sum) / SUM(SQ_BUSY_CYCLES_sum)
          min: 100 * MIN(SQ_INST_CYCLES_LDS_sum / SQ_BUSY_CYCLES_sum)
          max: 100 * MAX(SQ_INST_CYCLES_LDS_sum / SQ_BUSY_CYCLES_sum)
          unit: Percent
        WGP-GL0 VMEM Request Bus Util:
          avg: 100 * SUM(SQ_INST_CYCLES_VMEM_sum) / SUM(SQ_BUSY_CYCLES_sum)
          min: 100 * MIN(SQ_INST_CYCLES_VMEM_sum / SQ_BUSY_CYCLES_sum)
          max: 100 * MAX(SQ_INST_CYCLES_VMEM_sum / SQ_BUSY_CYCLES_sum)
          unit: Percent
        WGP-GL0 VMEM Read Request Bus Util:
          avg: 100 * SUM(SQ_INST_CYCLES_VMEM_LOAD_sum) / SUM(SQ_BUSY_CYCLES_sum)
          min: 100 * MIN(SQ_INST_CYCLES_VMEM_LOAD_sum / SQ_BUSY_CYCLES_sum)
          max: 100 * MAX(SQ_INST_CYCLES_VMEM_LOAD_sum / SQ_BUSY_CYCLES_sum)
          unit: Percent
        WGP-GL0 VMEM Write Request Bus Util:
          avg: 100 * SUM(SQ_INST_CYCLES_VMEM_STORE_sum) / SUM(SQ_BUSY_CYCLES_sum)
          min: 100 * MIN(SQ_INST_CYCLES_VMEM_STORE_sum / SQ_BUSY_CYCLES_sum)
          max: 100 * MAX(SQ_INST_CYCLES_VMEM_STORE_sum / SQ_BUSY_CYCLES_sum)
          unit: Percent
        # Metrics 104-107: Dual-port Row0/Row1 bus utilization and stall rates
        Bus Utilization - Row0:
          avg: 100 * SUM(SQ_VMEM_REQ_ROW0_BUSY_CYCLES_sum) / SUM(SQ_BUSY_CYCLES_sum)
          min: 100 * MIN(SQ_VMEM_REQ_ROW0_BUSY_CYCLES_sum / SQ_BUSY_CYCLES_sum)
          max: 100 * MAX(SQ_VMEM_REQ_ROW0_BUSY_CYCLES_sum / SQ_BUSY_CYCLES_sum)
          unit: Percent
        Bus Stall Rate - Row0:
          avg: 100 * SUM(SQ_VMEM_REQ_ROW0_STALL_CYCLES_sum) / SUM(SQ_BUSY_CYCLES_sum)
          min: 100 * MIN(SQ_VMEM_REQ_ROW0_STALL_CYCLES_sum / SQ_BUSY_CYCLES_sum)
          max: 100 * MAX(SQ_VMEM_REQ_ROW0_STALL_CYCLES_sum / SQ_BUSY_CYCLES_sum)
          unit: Percent
        Bus Utilization - Row1:
          avg: 100 * SUM(SQ_VMEM_REQ_ROW1_BUSY_CYCLES_sum) / SUM(SQ_BUSY_CYCLES_sum)
          min: 100 * MIN(SQ_VMEM_REQ_ROW1_BUSY_CYCLES_sum / SQ_BUSY_CYCLES_sum)
          max: 100 * MAX(SQ_VMEM_REQ_ROW1_BUSY_CYCLES_sum / SQ_BUSY_CYCLES_sum)
          unit: Percent
        Bus Stall Rate - Row1:
          avg: 100 * SUM(SQ_VMEM_REQ_ROW1_STALL_CYCLES_sum) / SUM(SQ_BUSY_CYCLES_sum)
          min: 100 * MIN(SQ_VMEM_REQ_ROW1_STALL_CYCLES_sum / SQ_BUSY_CYCLES_sum)
          max: 100 * MAX(SQ_VMEM_REQ_ROW1_STALL_CYCLES_sum / SQ_BUSY_CYCLES_sum)
          unit: Percent

  - metric_table:
      id: 715
      title: WGP-TXD Interface
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        TXD Data Bus Utilization:
          avg: 100 * SUM(SP_VGPR_TDLDS_DATA_WR_sum) / SUM(SQ_BUSY_CYCLES_sum)
          min: 100 * MIN(SP_VGPR_TDLDS_DATA_WR_sum / SQ_BUSY_CYCLES_sum)
          max: 100 * MAX(SP_VGPR_TDLDS_DATA_WR_sum / SQ_BUSY_CYCLES_sum)
          unit: Percent

  - metric_table:
      id: 716
      title: Instruction Cache
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Icache Hit Rate:
          avg: 100 * SUM(SQC_ICACHE_HITS_sum) / SUM(SQC_ICACHE_HITS_sum + SQC_ICACHE_MISSES_sum)
          min: 100 * MIN(SQC_ICACHE_HITS_sum / (SQC_ICACHE_HITS_sum + SQC_ICACHE_MISSES_sum))
          max: 100 * MAX(SQC_ICACHE_HITS_sum / (SQC_ICACHE_HITS_sum + SQC_ICACHE_MISSES_sum))
          unit: Percent
  - metric_table:
      id: 717
      title: Scalar Data Cache
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Dcache Hit Rate:
          avg: 100 * SUM(SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_REQ_sum)
          min: 100 * MIN(SQC_DCACHE_HITS_sum / SQC_DCACHE_REQ_sum)
          max: 100 * MAX(SQC_DCACHE_HITS_sum / SQC_DCACHE_REQ_sum)
          unit: Percent
        Dcache Request Bandwidth:
          avg: 4 * SUM(SQC_SMEM_LOAD_DWORDS_sum) / SUM($denom)
          min: MIN(SQC_SMEM_LOAD_DWORDS_sum * 4 / $denom)
          max: MAX(SQC_SMEM_LOAD_DWORDS_sum * 4 / $denom)
          unit: (Bytes + $normUnit)
  - metric_table:
      id: 718
      title: SQC-GL1 Interface
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Interface Stall Rate:
          avg: 100 * SUM(SQC_TC_STALL_sum) / SUM(SQ_BUSY_CYCLES_sum)
          min: 100 * MIN(SQC_TC_STALL_sum / SQ_BUSY_CYCLES_sum)
          max: 100 * MAX(SQC_TC_STALL_sum / SQ_BUSY_CYCLES_sum)
          unit: Percent

  metrics_description:
    WGP Utilization: >-
      Percentage of WGP clock cycles at least one wavefront is active.

    Wall Clock: >-
      Total elapsed kernel clock cycles.

    Active WGPs: >-
      Average number of WGPs with at least one active wavefront in a cycle.

    Grid Size: >-
      Total number of work-items in the dispatch grid.

    Workgroup Size: >-
      Number of work-items per workgroup.

    VGPRs: >-
      Number of architectural VGPRs allocated per wave.

    AGPRs: >-
      Number of accumulation VGPRs allocated per wave.

    SGPRs: >-
      Number of SGPRs allocated per wave.

    LDS Allocation: >-
      Bytes of LDS allocated per workgroup.

    Scratch Allocation: >-
      Bytes of scratch (private) memory allocated per work-item.

    Dispatched Waves: >-
      Total wavefronts dispatched.

    Dispatched Threads: >-
      Total work-items dispatched.

    Wave Life: >-
      Average wavefront lifetime in cycles.

    Total Instructions: >-
      Total instructions issued.

    Instructions - Internal: >-
      Number of internal (non-user-visible) instructions issued.

    Instructions - VALU: >-
      Number of VALU instructions issued.

    Instructions - SALU: >-
      Number of SALU instructions issued.

    Instructions - SMEM: >-
      Number of scalar memory instructions issued.

    Instructions - Transcendental: >-
      Number of transcendental VALU instructions issued.

    Instructions - Double Precision: >-
      Number of double-precision VALU instructions issued.

    Instructions - VMEM: >-
      Number of VMEM instructions issued.

    Instructions - LDS: >-
      Number of LDS instructions issued.

    Instructions - VMEM Flat: >-
      Number of flat-addressed VMEM instructions issued.

    Instructions - Global Scratch: >-
      Number of global/scratch VMEM instructions issued.

    Instructions - Flat Load: >-
      Number of flat-addressed load instructions issued.

    Instructions - Flat Store: >-
      Number of flat-addressed store instructions issued.

    Instructions - Buffer Load: >-
      Number of buffer load instructions issued.

    Instructions - Buffer Store: >-
      Number of buffer store instructions issued.

    Instructions - Global Scratch Load: >-
      Number of global/scratch load instructions issued.

    Instructions - Global Scratch Store: >-
      Number of global/scratch store instructions issued.

    Instructions - Global Scratch Atomics: >-
      Number of global/scratch atomic instructions issued.

    Instructions - VMEM Atomic RTN: >-
      Number of returning VMEM atomic instructions issued.

    Instructions - VMEM Atomic NORTN: >-
      Number of non-returning VMEM atomic instructions issued.

    Instructions - Multicast Load: >-
      Number of multicast load instructions issued.

    Instructions - Async Load: >-
      Number of asynchronous memory load instructions (TDM async loads) issued.

    Instructions - Async Store: >-
      Number of asynchronous memory store instructions (TDM async stores) issued.

    Instructions - TDM: >-
      Number of Tensor Data Mover instructions issued.

    Total LDS Instructions: >-
      Total LDS instructions issued.

    Instructions - LDS Load: >-
      Number of LDS load instructions issued.

    Instructions - LDS Store: >-
      Number of LDS store instructions issued.

    Instructions - LDS Atomic RTN: >-
      Number of returning LDS atomic instructions issued.

    Instructions - LDS Atomic NORTN: >-
      Number of non-returning LDS atomic instructions issued.

    Instructions - LDS Other: >-
      Number of miscellaneous LDS operations issued.

    Total VALU Instructions: >-
      Total VALU instructions issued.

    VALU Instructions - Trans: >-
      Number of transcendental VALU instructions issued.

    VALU Instructions - Double Precision: >-
      Number of double-precision VALU instructions issued.

    VALU Instructions - CMACC: >-
      Number of instructions issued that execute on the CMACC (core multiply-accumulate) pipeline.

    VALU Instructions - SMACC: >-
      Number of instructions issued that execute on the SMACC (side multiply-accumulate / transcendental) pipeline.

    VALU Instructions - XDL: >-
      Number of instructions issued that execute on the XDL (eXtreme Deep Learning / WMMA) pipeline.

    VALU Instructions - WMMA: >-
      Number of WMMA instructions issued.

    VALU Integer Operations: >-
      Total integer operations executed by VALU.

    VALU FP Operations - FP16: >-
      Total FP16 operations executed by VALU.

    VALU FP Operations - FP16 Trans: >-
      Total FP16 transcendental operations executed by VALU.

    VALU FP Operations - FP32: >-
      Total FP32 operations executed by VALU.

    VALU FP Operations - FP32 Trans: >-
      Total FP32 transcendental operations executed by VALU.

    VALU FP Operations - FP64: >-
      Total FP64 operations executed by VALU.

    VALU FP Operations - FP64 Trans: >-
      Total FP64 transcendental operations executed by VALU.

    WMMA FP Operations - FP32: >-
      Total FP32 WMMA instruction dispatches.

    WMMA FP Operations - FP64: >-
      Total FP64 WMMA instruction dispatches.

    WMMA FP Operations - FP16: >-
      Total FP16 WMMA instruction dispatches.

    WMMA FP Operations - BF16: >-
      Total BF16 WMMA instruction dispatches.

    WMMA FP Operations - FP8: >-
      Total FP8 WMMA instruction dispatches.

    WMMA FP Operations - FP6: >-
      Total FP6 WMMA instruction dispatches.

    WMMA FP Operations - FP4: >-
      Total FP4 WMMA instruction dispatches.

    WMMA FP Operations - FP6FP4: >-
      Total mixed FP6/FP4 WMMA instruction dispatches.

    WMMA Int Operations - Int8: >-
      Total Int8 WMMA instruction dispatches.

    WMMA Int Operations - Int4: >-
      Total Int4 WMMA instruction dispatches.

    TDM Issue Stall Rate: >-
      Percentage of WGP-busy cycles the TDM pipeline cannot accept a new instruction.

    Pipeline Utilization - CMACC: >-
      Percentage of WGP-busy cycles the CMACC (FP32/FP16 VALU) pipeline is busy.

    Pipeline Utilization - SMACC: >-
      Percentage of WGP-busy cycles the SMACC (transcendental) pipeline is busy.

    Pipeline Utilization - Double Precision: >-
      Percentage of WGP-busy cycles the FP64 pipeline is busy.

    Pipeline Utilization - XDL: >-
      Percentage of WGP-busy cycles the XDL (WMMA) pipeline is busy.

    LDS Access Latency: >-
      Average LDS access latency in cycles.

    WGP-GL0 Request Bus Util: >-
      Percentage of cycles the WGP-to-GL0 request bus is carrying a valid request.

    WGP-GL0 LDS Request Bus Util: >-
      Percentage of cycles the WGP-to-GL0 bus is carrying an LDS request.

    WGP-GL0 VMEM Request Bus Util: >-
      Percentage of cycles the WGP-to-GL0 bus is carrying a VMEM request.

    WGP-GL0 VMEM Read Request Bus Util: >-
      Percentage of cycles the WGP-to-GL0 bus is carrying a VMEM read request.

    WGP-GL0 VMEM Write Request Bus Util: >-
      Percentage of cycles the WGP-to-GL0 bus is carrying a VMEM write request.

    Bus Utilization - Row0: >-
      Percentage of cycles the TXA request bus Row 0 is carrying a valid request.

    Bus Stall Rate - Row0: >-
      Percentage of cycles the TXA request bus Row 0 is stalled.

    Bus Utilization - Row1: >-
      Percentage of cycles the TXA request bus Row 1 is carrying a valid request.

    Bus Stall Rate - Row1: >-
      Percentage of cycles the TXA request bus Row 1 is stalled.

    TXD Data Bus Utilization: >-
      Percentage of cycles the TXD data return bus is carrying valid return data.

    Icache Hit Rate: >-
      Instruction Cache hit rate.

    Dcache Hit Rate: >-
      Scalar Data Cache hit rate.

    Dcache Request Bandwidth: >-
      Total Scalar Data Cache bandwidth.

    Interface Stall Rate: >-
      Percentage of cycles the SQC-GL1 interface is stalled.
