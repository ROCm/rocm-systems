# gfx1250 Workgroup Processor (WGP) Performance Metrics

Panel Config:
  id: 700
  title: Workgroup Processor (WGP)
  data source:
  - metric_table:
      id: 701
      title: Utilization
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        WGP Utilization:
          avg: 100 * SUM(SQG_BUSY_CYCLES_sum) / SUM(SQG_CYCLES_sum)
          min: 100 * MIN(SQG_BUSY_CYCLES_sum / SQG_CYCLES_sum)
          max: 100 * MAX(SQG_BUSY_CYCLES_sum / SQG_CYCLES_sum)
          unit: Percent
        Wall Clock:
          avg: AVG(SQG_REFCLKS_sum)
          min: MIN(SQG_REFCLKS_sum)
          max: MAX(SQG_REFCLKS_sum)
          unit: Cycles
        Active WGPs:
          avg: SUM(SQG_LEVEL_WGP_ACTIVE_ACCUM_sum) / SUM(SQG_CYCLES_sum)
          min: MIN(SQG_LEVEL_WGP_ACTIVE_ACCUM_sum / SQG_CYCLES_sum)
          max: MAX(SQG_LEVEL_WGP_ACTIVE_ACCUM_sum / SQG_CYCLES_sum)
          unit: Count

  - metric_table:
      id: 702
      title: Wavefront Launch Stats
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Grid Size:
          avg: AVG(Grid_Size)
          min: MIN(Grid_Size)
          max: MAX(Grid_Size)
          unit: Work-items
        Workgroup Size:
          avg: AVG(Workgroup_Size)
          min: MIN(Workgroup_Size)
          max: MAX(Workgroup_Size)
          unit: Work-items
        VGPRs:
          avg: AVG(Arch_VGPR)
          min: MIN(Arch_VGPR)
          max: MAX(Arch_VGPR)
          unit: Registers
        AGPRs:
          avg: AVG(Accum_VGPR)
          min: MIN(Accum_VGPR)
          max: MAX(Accum_VGPR)
          unit: Registers
        SGPRs:
          avg: AVG(SGPR)
          min: MIN(SGPR)
          max: MAX(SGPR)
          unit: Registers
        LDS Allocation:
          avg: AVG(LDS_Per_Workgroup)
          min: MIN(LDS_Per_Workgroup)
          max: MAX(LDS_Per_Workgroup)
          unit: Bytes
        Scratch Allocation:
          avg: AVG(Scratch_Per_Workitem)
          min: MIN(Scratch_Per_Workitem)
          max: MAX(Scratch_Per_Workitem)
          unit: Bytes per Work-item

  - metric_table:
      id: 703
      title: Wave Dispatch
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Dispatched Waves:
          avg: AVG(SQG_WAVES_sum)
          min: MIN(SQG_WAVES_sum)
          max: MAX(SQG_WAVES_sum)
          unit: Waves
        Dispatched Threads:
          avg: AVG(SQG_ITEMS_sum)
          min: MIN(SQG_ITEMS_sum)
          max: MAX(SQG_ITEMS_sum)
          unit: Threads
  - metric_table:
      id: 704
      title: Wave Life
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Wave Life:
          avg: SUM(SQG_WAVE_CYCLES_sum) / SUM(SQG_WAVES_sum)
          min: MIN(SQG_WAVE_CYCLES_sum / SQG_WAVES_sum)
          max: MAX(SQG_WAVE_CYCLES_sum / SQG_WAVES_sum)
          unit: Cycles
  - metric_table:
      id: 705
      title: Wave Instruction Mix
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Total Instructions:
          avg: SUM(SQ_INSTS_ALL_sum) / SUM($denom)
          min: MIN(SQ_INSTS_ALL_sum / $denom)
          max: MAX(SQ_INSTS_ALL_sum / $denom)
          unit: (Count + $normUnit)
        Instructions - Internal:
          avg: SUM(SQ_INSTS_INTERNAL_sum) / SUM($denom)
          min: MIN(SQ_INSTS_INTERNAL_sum / $denom)
          max: MAX(SQ_INSTS_INTERNAL_sum / $denom)
          unit: (Count + $normUnit)
        Instructions - VALU:
          avg: SUM(SQ_INSTS_VALU_sum) / SUM($denom)
          min: MIN(SQ_INSTS_VALU_sum / $denom)
          max: MAX(SQ_INSTS_VALU_sum / $denom)
          unit: (Count + $normUnit)
        Instructions - SALU:
          avg: SUM(SQ_INSTS_SALU_sum) / SUM($denom)
          min: MIN(SQ_INSTS_SALU_sum / $denom)
          max: MAX(SQ_INSTS_SALU_sum / $denom)
          unit: (Count + $normUnit)
        Instructions - SMEM:
