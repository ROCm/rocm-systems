          min: MIN((100 * SQ_VMEM_REQ_ROW0_STALL_CYCLES_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
          max: MAX((100 * SQ_VMEM_REQ_ROW0_STALL_CYCLES_sum / SQ_BUSY_CYCLES_sum) if (SQ_BUSY_CYCLES_sum != 0) else None)
