# gfx1250 GL1 Metrics

Panel Config:
  id: 1100
  title: GL1 Cache
  description: |-
    GL1 Cache metrics for gfx1250. GL1 consists of GL1A (arbiter) and GL1C
    (cache buffers). Each SE contains 12 GL1 channels shared by all WGPs.

  data source:

  - metric_table:
      id: 1101
      title: GL1A Processing
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL1A Utilization:
          avg: 100 * SUM(GL1A_BUSY_sum) / SUM(GL1A_CYCLE_sum)
          min: 100 * MIN(GL1A_BUSY_sum / GL1A_CYCLE_sum)
          max: 100 * MAX(GL1A_BUSY_sum / GL1A_CYCLE_sum)
          unit: Percent
        GL1A Request Bus Utilization:
          avg: 100 * SUM(GL1A_REQ_PATH_BUSY_sum) / SUM(GL1A_CYCLE_sum)
          min: 100 * MIN(GL1A_REQ_PATH_BUSY_sum / GL1A_CYCLE_sum)
          max: 100 * MAX(GL1A_REQ_PATH_BUSY_sum / GL1A_CYCLE_sum)
          unit: Percent
        GL1A Return Bus Utilization:
          avg: 100 * SUM(GL1A_RET_PATH_BUSY_sum) / SUM(GL1A_CYCLE_sum)
          min: 100 * MIN(GL1A_RET_PATH_BUSY_sum / GL1A_CYCLE_sum)
          max: 100 * MAX(GL1A_RET_PATH_BUSY_sum / GL1A_CYCLE_sum)
          unit: Percent
        GL1A Requests:
          avg: SUM(GL1A_ARB_REQUESTS_sum) / SUM($denom)
          min: MIN(GL1A_ARB_REQUESTS_sum / $denom)
          max: MAX(GL1A_ARB_REQUESTS_sum / $denom)
          unit: (Count + $normUnit)
        GL1A Request Latency:
          avg: SUM(GL1A_REQ_INFLIGHT_LEVEL_sum) / SUM(GL1A_ARB_REQUESTS_sum)
          min: MIN(GL1A_REQ_INFLIGHT_LEVEL_sum / GL1A_ARB_REQUESTS_sum)
          max: MAX(GL1A_REQ_INFLIGHT_LEVEL_sum / GL1A_ARB_REQUESTS_sum)
          unit: Cycles

  - metric_table:
      id: 1102
      title: GL1C Utilization
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL1C Utilization:
          avg: 100 * SUM(GL1C_BUSY_sum) / SUM(GL1C_CYCLE_sum)
          min: 100 * MIN(GL1C_BUSY_sum / GL1C_CYCLE_sum)
          max: 100 * MAX(GL1C_BUSY_sum / GL1C_CYCLE_sum)
          unit: Percent
        GL1C Return Arbitration Latency:
          avg: SUM(GL1C_ARB_RET_LEVEL_sum) / SUM(GL1C_REQ_sum)
          min: MIN(GL1C_ARB_RET_LEVEL_sum / GL1C_REQ_sum)
          max: MAX(GL1C_ARB_RET_LEVEL_sum / GL1C_REQ_sum)
          unit: Cycles
        GL1C Buffer Full Stall:
          avg: 100 * SUM(GL1C_STALL_BUFFER_FULL_sum) / SUM(GL1C_BUSY_sum)
          min: 100 * MIN(GL1C_STALL_BUFFER_FULL_sum / GL1C_BUSY_sum)
          max: 100 * MAX(GL1C_STALL_BUFFER_FULL_sum / GL1C_BUSY_sum)
          unit: Percent

  - metric_table:
      id: 1103
      title: GL1C Request
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL1C Requests:
          avg: SUM(GL1C_REQ_sum) / SUM($denom)
          min: MIN(GL1C_REQ_sum / $denom)
          max: MAX(GL1C_REQ_sum / $denom)
          unit: (Count + $normUnit)
        GL1C Requests - Read:
          avg: SUM(GL1C_REQ_READ_sum) / SUM($denom)
          min: MIN(GL1C_REQ_READ_sum / $denom)
          max: MAX(GL1C_REQ_READ_sum / $denom)
          unit: (Count + $normUnit)
        GL1C Requests - Write:
          avg: SUM(GL1C_REQ_WRITE_sum) / SUM($denom)
          min: MIN(GL1C_REQ_WRITE_sum / $denom)
          max: MAX(GL1C_REQ_WRITE_sum / $denom)
          unit: (Count + $normUnit)
        GL1C Requests - Atomic with Return:
          avg: SUM(GL1C_REQ_ATOMIC_WITH_RET_sum) / SUM($denom)
          min: MIN(GL1C_REQ_ATOMIC_WITH_RET_sum / $denom)
          max: MAX(GL1C_REQ_ATOMIC_WITH_RET_sum / $denom)
          unit: (Count + $normUnit)
        GL1C Requests - Atomic without Return:
          avg: SUM(GL1C_REQ_ATOMIC_WITHOUT_RET_sum) / SUM($denom)
          min: MIN(GL1C_REQ_ATOMIC_WITHOUT_RET_sum / $denom)
          max: MAX(GL1C_REQ_ATOMIC_WITHOUT_RET_sum / $denom)
          unit: (Count + $normUnit)
  - metric_table:
      id: 1104
      title: GL1C Request Bandwidth
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL1C Request Bandwidth - Read:
          avg: SUM(GL1C_REQ_READ_32B_sum * 32 + GL1C_REQ_READ_64B_sum * 64 + GL1C_REQ_READ_128B_sum * 128 + GL1C_REQ_READ_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          min: MIN((GL1C_REQ_READ_32B_sum * 32 + GL1C_REQ_READ_64B_sum * 64 + GL1C_REQ_READ_128B_sum * 128 + GL1C_REQ_READ_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          max: MAX((GL1C_REQ_READ_32B_sum * 32 + GL1C_REQ_READ_64B_sum * 64 + GL1C_REQ_READ_128B_sum * 128 + GL1C_REQ_READ_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          unit: GB/s
        GL1C Request Bandwidth - Write:
          avg: SUM(GL1C_REQ_WRITE_32B_sum * 32 + GL1C_REQ_WRITE_64B_sum * 64 + GL1C_REQ_WRITE_128B_sum * 128 + GL1C_REQ_WRITE_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          min: MIN((GL1C_REQ_WRITE_32B_sum * 32 + GL1C_REQ_WRITE_64B_sum * 64 + GL1C_REQ_WRITE_128B_sum * 128 + GL1C_REQ_WRITE_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          max: MAX((GL1C_REQ_WRITE_32B_sum * 32 + GL1C_REQ_WRITE_64B_sum * 64 + GL1C_REQ_WRITE_128B_sum * 128 + GL1C_REQ_WRITE_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          unit: GB/s
  - metric_table:
      id: 1105
      title: GL1C Multicast
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL1C Multicast Tracker Depletion Stall:
          avg: 100 * SUM(GL1C_MULTICAST_TRACKER_DEPLETS_sum) / SUM(GL1C_BUSY_sum)
          min: 100 * MIN(GL1C_MULTICAST_TRACKER_DEPLETS_sum / GL1C_BUSY_sum)
          max: 100 * MAX(GL1C_MULTICAST_TRACKER_DEPLETS_sum / GL1C_BUSY_sum)
          unit: Percent
        GL1C Multicast Request - 128B:
          avg: SUM(GL1C_REQ_MULTICAST_128B_sum) / SUM($denom)
          min: MIN(GL1C_REQ_MULTICAST_128B_sum / $denom)
          max: MAX(GL1C_REQ_MULTICAST_128B_sum / $denom)
          unit: (Count + $normUnit)
        GL1C Multicast Request - 256B:
          avg: SUM(GL1C_REQ_MULTICAST_256B_sum) / SUM($denom)
          min: MIN(GL1C_REQ_MULTICAST_256B_sum / $denom)
          max: MAX(GL1C_REQ_MULTICAST_256B_sum / $denom)
          unit: (Count + $normUnit)
        GL1C Request Bandwidth - Multicast:
          avg: SUM(GL1C_REQ_MULTICAST_128B_sum * 128 + GL1C_REQ_MULTICAST_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          min: MIN((GL1C_REQ_MULTICAST_128B_sum * 128 + GL1C_REQ_MULTICAST_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          max: MAX((GL1C_REQ_MULTICAST_128B_sum * 128 + GL1C_REQ_MULTICAST_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          unit: GB/s
        GL1C Multicast Tracker 0 Timeout Rate:
          avg: 100 * SUM(GL1C_REQ_MULTICAST_TIMEOUT0_sum) / SUM(GL1C_BUSY_sum)
          min: 100 * MIN(GL1C_REQ_MULTICAST_TIMEOUT0_sum / GL1C_BUSY_sum)
          max: 100 * MAX(GL1C_REQ_MULTICAST_TIMEOUT0_sum / GL1C_BUSY_sum)
          unit: Percent
        GL1C Multicast Tracker 1 Timeout Rate:
          avg: 100 * SUM(GL1C_REQ_MULTICAST_TIMEOUT1_sum) / SUM(GL1C_BUSY_sum)
          min: 100 * MIN(GL1C_REQ_MULTICAST_TIMEOUT1_sum / GL1C_BUSY_sum)
          max: 100 * MAX(GL1C_REQ_MULTICAST_TIMEOUT1_sum / GL1C_BUSY_sum)
          unit: Percent
        GL1C Multicast Tracker 2 Timeout Rate:
          avg: 100 * SUM(GL1C_REQ_MULTICAST_TIMEOUT2_sum) / SUM(GL1C_BUSY_sum)
          min: 100 * MIN(GL1C_REQ_MULTICAST_TIMEOUT2_sum / GL1C_BUSY_sum)
          max: 100 * MAX(GL1C_REQ_MULTICAST_TIMEOUT2_sum / GL1C_BUSY_sum)
          unit: Percent
        GL1C Multicast Tracker 3 Timeout Rate:
          avg: 100 * SUM(GL1C_REQ_MULTICAST_TIMEOUT3_sum) / SUM(GL1C_BUSY_sum)
          min: 100 * MIN(GL1C_REQ_MULTICAST_TIMEOUT3_sum / GL1C_BUSY_sum)
          max: 100 * MAX(GL1C_REQ_MULTICAST_TIMEOUT3_sum / GL1C_BUSY_sum)
          unit: Percent
        GL1C Multicast-to-Unicast Downgrade Rate:
          avg: 100 * SUM(GL1C_REQ_MULTICAST_DOWNGRADE_sum) / SUM(GL1C_BUSY_sum)
          min: 100 * MIN(GL1C_REQ_MULTICAST_DOWNGRADE_sum / GL1C_BUSY_sum)
          max: 100 * MAX(GL1C_REQ_MULTICAST_DOWNGRADE_sum / GL1C_BUSY_sum)
          unit: Percent

  - metric_table:
      id: 1106
      title: GL1C-GLARB Interface
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL1C-GLARB Read Requests:
          avg: SUM(GL1C_GL2_REQ_READ_sum) / SUM($denom)
          min: MIN(GL1C_GL2_REQ_READ_sum / $denom)
          max: MAX(GL1C_GL2_REQ_READ_sum / $denom)
          unit: (Count + $normUnit)
        GL1C-GLARB Read Requests - 32B:
          avg: SUM(GL1C_GL2_REQ_READ_32B_sum) / SUM($denom)
          min: MIN(GL1C_GL2_REQ_READ_32B_sum / $denom)
          max: MAX(GL1C_GL2_REQ_READ_32B_sum / $denom)
          unit: (Count + $normUnit)
        GL1C-GLARB Read Requests - 64B:
          avg: SUM(GL1C_GL2_REQ_READ_64B_sum) / SUM($denom)
          min: MIN(GL1C_GL2_REQ_READ_64B_sum / $denom)
          max: MAX(GL1C_GL2_REQ_READ_64B_sum / $denom)
          unit: (Count + $normUnit)
        GL1C-GLARB Read Requests - 128B:
          avg: SUM(GL1C_GL2_REQ_READ_128B_sum) / SUM($denom)
          min: MIN(GL1C_GL2_REQ_READ_128B_sum / $denom)
          max: MAX(GL1C_GL2_REQ_READ_128B_sum / $denom)
          unit: (Count + $normUnit)
        GL1C-GLARB Read Requests - 256B:
          avg: SUM(GL1C_GL2_REQ_READ_256B_sum) / SUM($denom)
          min: MIN(GL1C_GL2_REQ_READ_256B_sum / $denom)
          max: MAX(GL1C_GL2_REQ_READ_256B_sum / $denom)
          unit: (Count + $normUnit)
        GL1C-GLARB Write Requests:
          avg: SUM(GL1C_GL2_REQ_WRITE_sum) / SUM($denom)
          min: MIN(GL1C_GL2_REQ_WRITE_sum / $denom)
          max: MAX(GL1C_GL2_REQ_WRITE_sum / $denom)
          unit: (Count + $normUnit)
        GL1C-GLARB Write Requests - 32B:
          avg: SUM(GL1C_GL2_REQ_WRITE_32B_sum) / SUM($denom)
          min: MIN(GL1C_GL2_REQ_WRITE_32B_sum / $denom)
          max: MAX(GL1C_GL2_REQ_WRITE_32B_sum / $denom)
          unit: (Count + $normUnit)
        GL1C-GLARB Write Requests - 64B:
          avg: SUM(GL1C_GL2_REQ_WRITE_64B_sum) / SUM($denom)
          min: MIN(GL1C_GL2_REQ_WRITE_64B_sum / $denom)
          max: MAX(GL1C_GL2_REQ_WRITE_64B_sum / $denom)
          unit: (Count + $normUnit)
        GL1C-GLARB Write Requests - 128B:
          avg: SUM(GL1C_GL2_REQ_WRITE_128B_sum) / SUM($denom)
          min: MIN(GL1C_GL2_REQ_WRITE_128B_sum / $denom)
          max: MAX(GL1C_GL2_REQ_WRITE_128B_sum / $denom)
          unit: (Count + $normUnit)
        GL1C-GLARB Write Requests - 256B:
          avg: SUM(GL1C_GL2_REQ_WRITE_256B_sum) / SUM($denom)
          min: MIN(GL1C_GL2_REQ_WRITE_256B_sum / $denom)
          max: MAX(GL1C_GL2_REQ_WRITE_256B_sum / $denom)
          unit: (Count + $normUnit)
        GL1C-GLARB Read Latency:
          avg: SUM(GL1C_GL2_REQ_READ_LEVEL_sum) / SUM(GL1C_GL2_REQ_READ_sum)
          min: MIN(GL1C_GL2_REQ_READ_LEVEL_sum / GL1C_GL2_REQ_READ_sum)
          max: MAX(GL1C_GL2_REQ_READ_LEVEL_sum / GL1C_GL2_REQ_READ_sum)
          unit: Cycles
        GL1C-GLARB Write Latency:
          avg: SUM(GL1C_GL2_REQ_WRITE_LEVEL_sum) / SUM(GL1C_GL2_REQ_WRITE_sum)
          min: MIN(GL1C_GL2_REQ_WRITE_LEVEL_sum / GL1C_GL2_REQ_WRITE_sum)
          max: MAX(GL1C_GL2_REQ_WRITE_LEVEL_sum / GL1C_GL2_REQ_WRITE_sum)
          unit: Cycles
        GL1C-GLARB Read Bandwidth:
          avg: SUM(GL1C_GL2_REQ_READ_32B_sum * 32 + GL1C_GL2_REQ_READ_64B_sum * 64 + GL1C_GL2_REQ_READ_128B_sum * 128 + GL1C_GL2_REQ_READ_256B_sum * 256) / SUM(End_Timestamp - Start_Timestamp)
          min: MIN((GL1C_GL2_REQ_READ_32B_sum * 32 + GL1C_GL2_REQ_READ_64B_sum * 64 + GL1C_GL2_REQ_READ_128B_sum * 128 + GL1C_GL2_REQ_READ_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          max: MAX((GL1C_GL2_REQ_READ_32B_sum * 32 + GL1C_GL2_REQ_READ_64B_sum * 64 + GL1C_GL2_REQ_READ_128B_sum * 128 + GL1C_GL2_REQ_READ_256B_sum * 256) / (End_Timestamp - Start_Timestamp))
          unit: GB/s
        GL1C-GLARB Write Bandwidth:
          avg: 32 * SUM(GL1C_GL2_REQ_WRITE_32B_DATA_BEATS_sum) / SUM(End_Timestamp - Start_Timestamp)
          min: MIN(GL1C_GL2_REQ_WRITE_32B_DATA_BEATS_sum * 32 / (End_Timestamp - Start_Timestamp))
          max: MAX(GL1C_GL2_REQ_WRITE_32B_DATA_BEATS_sum * 32 / (End_Timestamp - Start_Timestamp))
          unit: GB/s
        GL1C-GLARB Write ACKs:
          avg: SUM(GL1C_GL2_RET_ACK_sum) / SUM($denom)
          min: MIN(GL1C_GL2_RET_ACK_sum / $denom)
          max: MAX(GL1C_GL2_RET_ACK_sum / $denom)
          unit: (Count + $normUnit)
  metrics_description:
    GL1A Utilization: >-
      Percentage of cycles the GL1 Arbiter is processing requests from GL0.

    GL1A Request Bus Utilization: >-
      Percentage of cycles the GL0-to-GL1 request bus is carrying valid requests.

    GL1A Return Bus Utilization: >-
      Percentage of cycles the GL1-to-GL0 return bus is carrying completed data.

    GL1A Requests: >-
      Total requests arbitrated by GL1 Arbiter.

    GL1C Utilization: >-
      Percentage of cycles the GL1 is processing requests.

    GL1C Buffer Full Stall: >-
      Percentage of GL1-busy cycles GL1 is stalled due to no available buffer entries.

    GL1C Requests: >-
      Total requests processed by GL1.

    GL1C Requests - Read: >-
      Number of GL1 read requests.

    GL1C Requests - Write: >-
      Number of GL1 write requests.

    GL1C Requests - Atomic with Return: >-
      Number of returning GL1 atomic requests.

    GL1C Requests - Atomic without Return: >-
      Number of non-returning GL1 atomic requests.

    GL1C Request Bandwidth - Read: >-
      Total GL1 read bandwidth.

    GL1C Request Bandwidth - Write: >-
      Total GL1 write bandwidth.

    GL1C-GLARB Read Requests: >-
      Number of GL1 to Graphics Level Arbiter read requests.

    GL1C-GLARB Read Requests - 32B: >-
      Number of 32-byte GL1 to Graphics Level Arbiter read requests.

    GL1C-GLARB Read Requests - 64B: >-
      Number of 64-byte GL1 to Graphics Level Arbiter read requests.

    GL1C-GLARB Read Requests - 128B: >-
      Number of 128-byte GL1 to Graphics Level Arbiter read requests.

    GL1C-GLARB Read Requests - 256B: >-
      Number of 256-byte GL1 to Graphics Level Arbiter read requests.

    GL1C-GLARB Write Requests: >-
      Number of GL1C to Graphics Level Arbiter write requests.

    GL1C-GLARB Write Requests - 32B: >-
      Number of 32-byte GL1 to Graphics Level Arbiter write requests.

    GL1C-GLARB Write Requests - 64B: >-
      Number of 64-byte GL1 to Graphics Level Arbiter write requests.

    GL1C-GLARB Write Requests - 128B: >-
      Number of 128-byte GL1 to Graphics Level Arbiter write requests.

    GL1C-GLARB Write Requests - 256B: >-
      Number of 256-byte GL1 to Graphics Level Arbiter write requests.

    GL1C-GLARB Read Bandwidth: >-
      Total GL1 to Graphics Level Arbiter read bandwidth.

    GL1C-GLARB Write Bandwidth: >-
      Total GL1 to Graphics Level Arbiter write bandwidth.

    GL1C-GLARB Write ACKs: >-
      Number of write acknowledgments received from Graphics Level Arbiter by GL1.

    GL1C Multicast Tracker Depletion Stall: >-
      Percentage of GL1 Cache busy cycles the multicast tracker resource is depleted.

    GL1C Multicast Request - 128B: >-
      Number of 128-byte multicast requests processed by GL1 Cache.

    GL1C Multicast Request - 256B: >-
      Number of 256-byte multicast requests processed by GL1 Cache.

    GL1C Request Bandwidth - Multicast: >-
      Total GL1 Cache multicast bandwidth.

    GL1C Multicast Tracker 0 Timeout Rate: >-
      Percentage of GL1 Cache busy cycles multicast tracker 0 timed out.

    GL1C Multicast Tracker 1 Timeout Rate: >-
      Percentage of GL1 Cache busy cycles multicast tracker 1 timed out.

    GL1C Multicast Tracker 2 Timeout Rate: >-
      Percentage of GL1 Cache busy cycles multicast tracker 2 timed out.

    GL1C Multicast Tracker 3 Timeout Rate: >-
      Percentage of GL1 Cache busy cycles multicast tracker 3 timed out.

    GL1C Multicast-to-Unicast Downgrade Rate: >-
      Percentage of GL1 Cache busy cycles a multicast request was downgraded to unicast.
