# =============================================================================
# gfx1250 -- System Speed-of-Light
# =============================================================================
# Top-level throughput and cache metrics: VALU and WMMA rates first, then occupancy and memory-path bandwidth, then the
# GL0 -> GL1 -> GL2 hierarchy and fabric. VALU uses SP_* counters; WMMA uses SQ_* counters.
# GL0/GL2 naming follows the gfx1250 memory hierarchy exposed in this configuration.
# =============================================================================

Panel Config:
  id: 200
  title: System Speed-of-Light
  description: >-
    Top-level performance summary across compute, memory, and cache subsystems
    for gfx1250 GPUs.

  data source:

  - metric_table:
      id: 201
      title: System Speed-of-Light
      header:
        metric: Metric
        value: Avg
        unit: Unit
        peak: Peak
        pct_of_peak: Percent of Peak
      metric:
        # gfx1250 has both regular VALU and WMMA FLOPs/IOPs
        # VALU counters: SP_VALU_FLOPS_* (SP block) - listed first as baseline compute
        # WMMA counters: SQ_VALU_WMMA_FLOP_* (SQ block) - specialized matrix ops
        VALU FLOPs (FP16):
          value: SUM(SP_VALU_FLOPS_FP16_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 128 / 1000
          pct_of_peak: true
        VALU FLOPs (FP32):
          value: SUM(SP_VALU_FLOPS_FP32_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 64 / 1000
          pct_of_peak: true
        VALU FLOPs (FP64):
          value: SUM(SP_VALU_FLOPS_FP64_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 32 / 1000
          pct_of_peak: true
        VALU IOPs:
          value: SUM(SP_VALU_IOPS_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GIOP/s
          peak: $max_sclk * $cu_per_gpu * 64 / 1000
          pct_of_peak: true
        VALU Trans FLOPs (FP16):
          value: SUM(SP_VALU_FLOPS_FP16_TRANS_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 64 / 1000
          pct_of_peak: true
        VALU Trans FLOPs (FP32):
          value: SUM(SP_VALU_FLOPS_FP32_TRANS_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 32 / 1000
          pct_of_peak: true
        VALU Trans FLOPs (FP64):
          value: SUM(SP_VALU_FLOPS_FP64_TRANS_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 16 / 1000
          pct_of_peak: true
        # WMMA FLOPs - Each instruction performs multiple FLOPs
        WMMA FLOPs (FP64):
          value: 64 * SUM(SQ_VALU_WMMA_FLOP_FP64_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 16384 / 1000
          pct_of_peak: true
        WMMA FLOPs (FP32):
          value: 128 * SUM(SQ_VALU_WMMA_FLOP_FP32_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 16384 / 1000
          pct_of_peak: true
        WMMA FLOPs (FP16):
          value: 2048 * SUM(SQ_VALU_WMMA_FLOP_FP16_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 131072 / 1000
          pct_of_peak: true
        WMMA FLOPs (BF16):
          value: 2048 * SUM(SQ_VALU_WMMA_FLOP_BF16_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 131072 / 1000
          pct_of_peak: true
        WMMA FLOPs (FP8):
          value: 4096 * SUM(SQ_VALU_WMMA_FLOP_FP8_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 131072 / 1000
          pct_of_peak: true
        WMMA FLOPs (FP6):
          value: 8192 * SUM(SQ_VALU_WMMA_FLOP_FP6_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 131072 / 1000
          pct_of_peak: true
        WMMA FLOPs (FP4):
          value: 8192 * SUM(SQ_VALU_WMMA_FLOP_FP4_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 131072 / 1000
          pct_of_peak: true
        WMMA IOPs (Int8):
          value: 4096 * SUM(SQ_VALU_WMMA_FLOP_I8_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GIOP/s
          peak: $max_sclk * $cu_per_gpu * 131072 / 1000
          pct_of_peak: true
        WMMA IOPs (Int4):
          value: 8192 * SUM(SQ_VALU_WMMA_FLOP_I4_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GIOP/s
          peak: $max_sclk * $cu_per_gpu * 131072 / 1000
          pct_of_peak: true
        Active WGPs:
          value: SUM(SQG_LEVEL_WGP_ACTIVE_ACCUM) / SUM(SQG_CYCLES_sum)
          unit: WGPs per Cycle
          peak: $cu_per_gpu
          pct_of_peak: true
          coll_level: SQG_LEVEL_WGP_ACTIVE
        IPC:
          value: SUM(SQ_INSTS_ALL_sum - SQ_INSTS_INTERNAL_sum) / SUM(SQ_BUSY_CYCLES_sum)
          unit: Instructions per Cycle
          peak: 5
          pct_of_peak: true
        Wavefront Occupancy:
          value: SUM(SQG_WAVE_CYCLES_sum) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu)
          unit: Wavefronts
          peak: $max_waves_per_cu * $cu_per_gpu
          pct_of_peak: true
        LDS Read Bandwidth:
          value: SUM(TX_VCA_LDS_LOAD_BANDWIDTH_BYTES_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
          peak: $max_sclk * $cu_per_gpu * 512 / 1000
          pct_of_peak: true
        LDS Write Bandwidth:
          value: SUM(TX_VCA_LDS_STORE_BANDWIDTH_BYTES_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
          peak: $max_sclk * $cu_per_gpu * 256 / 1000
          pct_of_peak: true
        LDS Bank Conflicts/Access:
          value: SUM(TX_VMW_LDS_BANK_CONFLICT_sum) / SUM(TX_VMW_LDS_INPUT_ACTIVE_sum - TX_VMW_LDS_BANK_CONFLICT_sum)
          unit: Conflicts per Access
          peak: 64
          pct_of_peak: true
        # === Cache Hierarchy: GL0 (L0) -> GL1 (L1) -> GL2 (L2) ===
        # GL0: Vector L0 Cache (per CU)
        GL0 Hit Rate:
          value: ROUND(SUM(TX_VMW_REQ_sum - TX_VMW_REQ_MISS_sum) / SUM(TX_VMW_REQ_sum) * 100, 0)
          unit: Percent
          peak: 100
          pct_of_peak: false
        GL0 Cache BW:
          value: SUM(TX_VCA_CACHE_LOAD_BANDWIDTH_BYTES_sum + TX_VCA_CACHE_STORE_BANDWIDTH_BYTES_sum + TX_VCA_CACHE_ATOMIC_BANDWIDTH_BYTES_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
          peak: $max_sclk / 1000 * 256 * $cu_per_gpu
          pct_of_peak: true
        # GL1: Level-1 Graphics Buffer (Arbiter + 12 channels/SE)
        GL1A Busy Rate:
          value: ROUND(SUM(GL1A_BUSY_sum) / SUM(GL1A_CYCLE_sum) * 100, 0)
          unit: Percent
          peak: 100
          pct_of_peak: false
        # GL2: Level-2 Graphics Cache (Last-level cache on AID)
        GL2 Cache Hit Rate:
          value: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
          unit: Percent
          peak: 100
          pct_of_peak: false
        GL2 Cache BW:
          value: 256 * SUM(GL2C_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
          peak: $max_sclk / 1000 * 256 * TO_INT($total_l2_chan)
          pct_of_peak: true
        GL2 to DRAM Read BW:
          value: 32 * SUM(GC_EA_SE_SARB_DRAM_RD_SIZE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
          peak: $hbmBandwidth
          pct_of_peak: true
        GL2 to DRAM Write BW:
          value: 32 * SUM(GC_EA_SE_SARB_DRAM_WR_SIZE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
          peak: $hbmBandwidth
          pct_of_peak: true
        GL2 to DRAM Read Latency:
          value: SUM(GC_EA_SE_SARB_OUTSTANDING_DRAM_RD_sum) / SUM(GC_EA_SE_DRAM_RD_CMD_POP_sum)
          unit: Cycles
          peak: None
          pct_of_peak: false
        GL2 to DRAM Write Latency:
          value: SUM(GC_EA_SE_SARB_OUTSTANDING_DRAM_WR_sum) / SUM(GC_EA_SE_DRAM_WR_CMD_POP_sum)
          unit: Cycles
          peak: None
          pct_of_peak: false
        Scalar Data Cache Hit Rate:
          value: 100 * SUM(SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_HITS_sum + SQC_DCACHE_MISSES_sum)
          unit: Percent
          peak: 100
          pct_of_peak: false
        Scalar Data Cache BW:
          value: 64 * SUM(SQC_DCACHE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
          peak: $max_sclk / 1000 * 64 * $sqc_per_gpu
          pct_of_peak: true
        Instruction Cache Hit Rate:
          value: 100 * SUM(SQC_ICACHE_HITS_sum) / SUM(SQC_ICACHE_HITS_sum + SQC_ICACHE_MISSES_sum)
          unit: Percent
          peak: 100
          pct_of_peak: false
        Instruction Cache BW:
          value: 64 * SUM(SQC_ICACHE_REQ_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GB/s
          peak: $max_sclk / 1000 * 64 * $sqc_per_gpu
          pct_of_peak: true
        Instruction Cache Fetch Latency:
          value: SUM(SQ_IFETCH_LEVEL_ACCUM) / SUM(SQ_IFETCH_REQS_sum)
          unit: Cycles
          peak: None
          pct_of_peak: false
          coll_level: SQ_IFETCH_LEVEL

  metrics_description:
    VALU FLOPs (FP16): >-
      Achieved FP16 VALU throughput.

    VALU FLOPs (FP32): >-
      Achieved FP32 VALU throughput.

    VALU FLOPs (FP64): >-
      Achieved FP64 VALU throughput.

    VALU IOPs: >-
      Achieved integer VALU throughput.

    VALU Trans FLOPs (FP16): >-
      Achieved FP16 transcendental (square root, reciprocal, trig) VALU throughput.
      TODO: Double check that transcendental ops are executed within ALU.

    VALU Trans FLOPs (FP32): >-
      Achieved FP32 transcendental (square root, reciprocal, trig) VALU throughput.

    VALU Trans FLOPs (FP64): >-
      Achieved FP64 transcendental (square root, reciprocal, trig) VALU throughput.

    WMMA FLOPs (FP64): >-
      Achieved FP64 WMMA throughput.

    WMMA FLOPs (FP32): >-
      Achieved FP32 WMMA throughput.

    WMMA FLOPs (FP16): >-
      Achieved FP16 WMMA throughput.

    WMMA FLOPs (BF16): >-
      Achieved BF16 WMMA throughput.

    WMMA FLOPs (FP8): >-
      Achieved FP8 WMMA throughput.

    WMMA FLOPs (FP6): >-
      Achieved FP6 WMMA throughput.

    WMMA FLOPs (FP4): >-
      Achieved FP4 WMMA throughput.

    WMMA IOPs (Int8): >-
      Achieved Int8 WMMA throughput.

    WMMA IOPs (Int4): >-
      Achieved Int4 WMMA throughput.

    Active WGPs: >-
      Average number of WGPs that had at least one active wavefront in a cycle.

    IPC: >-
      Average number of instructions per active WGP cycle.

    Wavefront Occupancy: >-
      Average number of wavefronts in flight on GPU.

    LDS Read Bandwidth: >-
      Total LDS read bandwidth.

    LDS Write Bandwidth: >-
      Total LDS write bandwidth.

    LDS Bank Conflicts/Access: >-
      Number of LDS bank conflicts per LDS access.

    # === Cache Hierarchy Descriptions: GL0 -> GL1 -> GL2 ===
    GL0 Hit Rate: >-
      GL0 cache hit rate.

    GL0 Cache BW: >-
      Total GL0 cache data bandwidth combining load, store, and atomic traffic.

    GL1A Busy Rate: >-
      Percentage of cycles the GL1 Arbiter busy servicing GL0 miss requests.

    GL2 Cache Hit Rate: >-
      GL2 cache hit rate.

    GL2 Cache BW: >-
      Total GL2 cache data bandwidth combining load, store, and atomic traffic.

    GL2 to DRAM Read BW: >-
      Total read bandwidth from HBM to GL2.

    GL2 to DRAM Write BW: >-
      Total write bandwidth from GL2 to HBM.

    GL2 to DRAM Read Latency: >-
      Average latency to read data from HBM to GL2.

    GL2 to DRAM Write Latency: >-
      Average latency to write data from GL2 to HBM.

    Scalar Data Cache Hit Rate: >-
      Scalar Data Cache hit rate.

    Scalar Data Cache BW: >-
      Total Scalar Data Cache data bandwidth.

    Instruction Cache Hit Rate: >-
      Instruction Cache hit rate.

    Instruction Cache BW: >-
      Total Instruction Cache data bandwidth.

    Instruction Cache Fetch Latency: >-
      Average latency to fetch instruction from GL1 to Instruction Cache.
