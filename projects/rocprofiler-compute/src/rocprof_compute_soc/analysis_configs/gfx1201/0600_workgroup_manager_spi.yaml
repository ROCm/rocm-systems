# gfx1201 (RDNA 4, Navi 48) -- Workgroup Manager (SPI)
# Metric bodies are carried from the gfx1201 metrics port and placed in the
# gfx12 panel template. Tables with no carried metric are empty.
Panel Config:
  id: 600
  alias: spi
  title: Workgroup Manager (SPI)
  data source:
    - metric_table:
        id: 601
        title: SPI Utilization
        header: &id001
          metric: Metric
          avg: Avg
          min: Min
          max: Max
          unit: Unit
        metric:
          SPI Busy:
            avg: 100 * SUM(GRBM_SPI_BUSY) / SUM(GRBM_GUI_ACTIVE)
            min: MIN(100 * GRBM_SPI_BUSY / GRBM_GUI_ACTIVE)
            max: MAX(100 * GRBM_SPI_BUSY / GRBM_GUI_ACTIVE)
            unit: Percent
    - metric_table:
        id: 602
        title: Wave Dispatch Statistics
        header: *id001
        metric:
          Compute Wave Dispatches:
            avg: SUM(SQ_WAVES_sum) / SUM($denom)
            min: MIN(SQ_WAVES_sum / $denom)
            max: MAX(SQ_WAVES_sum / $denom)
            unit: (Count + $normUnit)
          Wave Dispatch Rate:
            avg: SUM(SQ_WAVES_sum) / SUM(GRBM_GUI_ACTIVE)
            min: MIN(SQ_WAVES_sum / GRBM_GUI_ACTIVE)
            max: MAX(SQ_WAVES_sum / GRBM_GUI_ACTIVE)
            unit: Waves/cycle
    - metric_table:
        id: 603
        title: Resource Allocation
        header: *id001
        metric: {}
    - metric_table:
        id: 604
        title: CPC-SPI Interface
        header: *id001
        metric: {}
  metrics_description:
    Compute Wave Dispatches: >-
      Measured dispatched wave count, normalized by the chosen unit. Navi48
      wave-count normalization still requires validation; this count need not
      match the application's launch geometry.
    SPI Busy: >-
      Percentage of GPU-active cycles with the shader input processor busy.
    Wave Dispatch Rate: >-
      Measured dispatched waves per GPU-active cycle. Navi48 wave-count
      normalization still requires validation; compare like workloads in the
      same performance state.
