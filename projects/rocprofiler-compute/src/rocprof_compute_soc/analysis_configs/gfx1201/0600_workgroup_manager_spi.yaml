Panel Config:
  id: 600
  alias: spi
  title: Workgroup Manager (SPI)
  data source:
  - metric_table:
      id: 602
      title: Wave Dispatch Statistics
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Compute Wave Dispatches:
          avg: SUM(SQ_WAVES_sum) / SUM($denom)
          min: MIN(SQ_WAVES_sum / $denom)
          max: MAX(SQ_WAVES_sum / $denom)
          unit: (Count + $normUnit)
        Wave Dispatch Rate:
          avg: SUM(SQ_WAVES_sum) / SUM(GRBM_GUI_ACTIVE)
          min: MIN(SQ_WAVES_sum / GRBM_GUI_ACTIVE)
          max: MAX(SQ_WAVES_sum / GRBM_GUI_ACTIVE)
          unit: Waves/cycle
  metrics_description:
    Compute Wave Dispatches: >-
      Measured dispatched wave count, normalized by the chosen unit. Navi48
      wave-count normalization still requires validation; this count need not
      match the application's launch geometry.
    Wave Dispatch Rate: >-
      Measured dispatched waves per GPU-active cycle. Navi48 wave-count
      normalization still requires validation; compare like workloads in the
      same performance state.
