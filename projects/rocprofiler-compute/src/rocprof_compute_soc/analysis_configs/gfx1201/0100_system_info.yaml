# gfx1201 (RDNA 4, Navi 48) -- System Info
# Metric bodies are carried from the gfx1201 metrics port and placed in the
# gfx12 panel template. Tables with no carried metric are empty.
Panel Config:
  id: 100
  alias: sysinfo
  title: System Info
  data source:
    - raw_csv_table:
        id: 101
        title: System Info
        source: sysinfo.csv
        columnwise: true
  metrics_description: {}
