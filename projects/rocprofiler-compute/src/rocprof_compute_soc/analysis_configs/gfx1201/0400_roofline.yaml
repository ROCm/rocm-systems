# gfx1201 (RDNA 4, Navi 48) -- Roofline
# Metric bodies are carried from the gfx1201 metrics port and placed in the
# gfx12 panel template. Tables with no carried metric are empty.
Panel Config:
  id: 400
  title: Roofline
  data source:
    - metric_table:
        id: 401
        title: Roofline Performance Rates
        header: &id001
          metric: Metric
          value: Avg
          unit: Unit
          peak: Peak
          pct_of_peak: Percent of Peak
        metric:
          VALU FLOPs (FP32):
            value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum)) / SUM(End_Timestamp
              - Start_Timestamp)
            unit: GFLOP/s
            peak: $FP32Flops_empirical_peak
          WMMA FLOPs (F16->F32):
            value: 8192 * SUM(SQ_WMMA_VALU_INSTS_sum) / SUM(End_Timestamp - Start_Timestamp)
            unit: GFLOP/s
            peak: $WMMAF16Flops_empirical_peak
          VALU FLOPs (F64):
            value: SUM($wave_size * SQ_INSTS_VALU_DP_sum) / SUM(End_Timestamp - Start_Timestamp)
            unit: GFLOP/s
            peak: $max_sclk * $cu_per_gpu * $simd_per_cu * $wave_size * 2 / 32 / 1000
          GL2 Cache BW:
            value: SUM(GL1C_GL2_REQ_READ_32B_sum * 32 + GL1C_GL2_REQ_READ_64B_sum * 64 + GL1C_GL2_REQ_READ_128B_sum
              * 128 + GL1C_GL2_REQ_WRITE_32B_sum * 32 + GL1C_GL2_REQ_WRITE_64B_sum * 64) / SUM((End_Timestamp
              - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $L2Bw_empirical_peak * 1e9
          GL1 Cache BW:
            value: SUM(TCP_GL1_REQ_READ_sum * 64 + TCP_GL1_REQ_WRITE_sum * 64) / SUM((End_Timestamp -
              Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $L1Bw_empirical_peak * 1e9
          GL0 Cache BW (TCP Cache):
            value: 64 * SUM(TCP_REQ_sum) / SUM((End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $L0Bw_empirical_peak * 1e9
          LDS BW:
            value: SUM((SQC_LDS_IDX_ACTIVE_sum - SQC_LDS_BANK_CONFLICT_sum) * 4 * $lds_banks_per_cu) /
              SUM((End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $LDSBw_empirical_peak * 1e9
    - metric_table:
        id: 402
        title: Roofline Plot Points
        header: *id001
        metric:
          AI L2:
            value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum)
              / SUM(GL2C_EA_RDREQ_32B_sum * 32 + GL2C_EA_RDREQ_64B_sum * 64 + GL2C_EA_RDREQ_128B_sum *
              128 + (GL2C_EA_RDREQ_sum - GL2C_EA_RDREQ_32B_sum - GL2C_EA_RDREQ_64B_sum - GL2C_EA_RDREQ_128B_sum)
              * 256)
            unit: FLOPs/Byte
          AI L1:
            value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum)
              / (64 * SUM(TCP_REQ_sum))
            unit: FLOPs/Byte
          AI HBM:
            value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum)
              / (256 * SUM(GL2C_EA_RDREQ_DRAM_sum + GL2C_EA_WRREQ_DRAM_sum))
            unit: FLOPs/Byte
          Performance (GFLOPs):
            value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum)
              / (SUM(End_Timestamp - Start_Timestamp) / 1e9) / 1e9
            unit: GFLOP/s
  metrics_description: {}
