# =============================================================================
# RDNA 4 (gfx1201, Navi 48) - Roofline Performance Metrics
# =============================================================================
# Navi 48: 64 CUs, wave32, 8 MB L2, 64 MB Infinity Cache, 256-bit DRAM (GDDR6) at 20 Gbps.
# Cache hierarchy: GL0 (TCP) -> GL1 -> GL2 -> Infinity Cache -> GDDR6.
# The GDDR6 column of roofline.csv (GDDR6Bw) holds the measured GDDR6 bandwidth
# and the MALL column the measured Infinity Cache bandwidth.
# Device-memory bytes are 32-byte granules of GL2C/EA requests destined for DRAM
# (GL2C_EA_RDREQ_DRAM_32B, PERF_SEL 0xa7; GL2C_EA_WRREQ_DRAM_32B, PERF_SEL 0xa8).
# The unsized EA_RDREQ_DRAM / EA_WRREQ_DRAM counters (0xa5 / 0xa6) mix 32-byte
# through 128-byte requests, so a fixed 256 bytes per request overstates them.
# No counter separates Infinity Cache hits from DRAM traffic.
# GL0 bytes use 128 per TCP_REQ as an interim upper bound. TCP_REQ counts
# cache-line requests; move to TCP_SECTORS once that counter is defined.
# WMMA FLOPs count 8192 per 16x16x16 instruction (SQ_WMMA_VALU_INSTS, SQ event 233).
# =============================================================================

Panel Config:
  id: 400
  title: Roofline
  data source:
  - metric_table:
      id: 401
      title: Roofline Performance Rates
      cli_style: Roofline
      header:
        metric: Metric
        value: Value
        unit: Unit
        peak: Peak (Empirical)
      metric:
        VALU FLOPs (FP32):
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum)) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $FP32Flops_empirical_peak
        WMMA FLOPs (F16->F32):
          value: 8192 * SUM(SQ_WMMA_VALU_INSTS_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $WMMAF16Flops_empirical_peak
        VALU FLOPs (F64):
          value: SUM($wave_size * SQ_INSTS_VALU_DP_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $FP64Flops_empirical_peak
        GL0 Cache BW (TCP Cache):
          # Interim upper bound: 128 bytes per TCP_REQ cache-line request.
          value: 128 * SUM(TCP_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
          peak: $L0Bw_empirical_peak * 1e9
        LDS BW:
          value: SUM((SQC_LDS_IDX_ACTIVE_sum - SQC_LDS_BANK_CONFLICT_sum) * 4 * $lds_banks_per_cu) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
          peak: $LDSBw_empirical_peak * 1e9
        GDDR6 BW:
          value: 32 * SUM(GL2C_EA_RDREQ_DRAM_32B_sum + GL2C_EA_WRREQ_DRAM_32B_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
          peak: $GDDR6Bw_empirical_peak * 1e9
        DRAM-Destined BW (Infinity Cache Peak):
          value: 32 * SUM(GL2C_EA_RDREQ_DRAM_32B_sum + GL2C_EA_WRREQ_DRAM_32B_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
          peak: $MALLBw_empirical_peak * 1e9

  - metric_table:
      id: 402
      title: Roofline Plot Points
      cli_style: Roofline
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        # Total FLOP numerator: VALU FLOPs excluding the WMMA instructions already
        # in SQ_INSTS_VALU, plus WMMA FLOPs at 8192 per instruction.
        AI L0:
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / (128 * SUM(TCP_REQ_sum))
          unit: FLOPs/Byte
        AI LDS:
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / SUM((SQC_LDS_IDX_ACTIVE_sum - SQC_LDS_BANK_CONFLICT_sum) * 4 * $lds_banks_per_cu)
          unit: FLOPs/Byte
        AI GDDR6:
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / (32 * SUM(GL2C_EA_RDREQ_DRAM_32B_sum + GL2C_EA_WRREQ_DRAM_32B_sum))
          unit: FLOPs/Byte
        Performance (GFLOPs):
          value: SUM($wave_size * (SQ_INSTS_VALU_sum - SQ_WMMA_VALU_INSTS_sum) + 8192 * SQ_WMMA_VALU_INSTS_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9) / 1e9
          unit: GFLOP/s

  metrics_description:
    VALU FLOPs (FP32): >-
      Floating-point operations per second on the VALU, excluding WMMA
      instructions. Uses the aggregate VALU instruction counter, so it is an
      estimate rather than a precision-specific FLOP count.
    WMMA FLOPs (F16->F32): >-
      Matrix operations per second at 8192 FLOPs per 16x16x16 WMMA instruction.
      The counter does not separate FP16, BF16, FP8, and BF8. The peak is the
      measured FP16 WMMA rate. BF8 has its own measured roof,
      V_WMMA_F32_16X16X16_BF8_BF8, at the same 8192 FLOPs per instruction.
    VALU FLOPs (F64): >-
      64-bit floating-point operations per second on the VALU.
    GL0 Cache BW (TCP Cache): >-
      Achieved bandwidth at the GL0 vector cache (TCP Cache).
    LDS BW: >-
      Achieved bandwidth for Local Data Share memory operations.
    GDDR6 BW: >-
      Bandwidth of GL2C/EA read and write requests destined for DRAM, compared
      with the measured GDDR6 bandwidth. These requests are also served by the
      Infinity Cache, so a working set that fits in it can exceed this peak.
    DRAM-Destined BW (Infinity Cache Peak): >-
      Bandwidth of GL2C/EA read and write requests destined for DRAM, compared
      with the measured Infinity Cache bandwidth. No counter separates
      Infinity Cache hits from DRAM traffic.
    AI L0: >-
      Arithmetic intensity relative to GL0 (TCP) requests.
    AI LDS: >-
      Arithmetic intensity relative to Local Data Share traffic.
    AI GDDR6: >-
      Arithmetic intensity relative to GL2C/EA requests destined for DRAM. The
      plot marks the point at the GDDR6 level. Compare it with both the GDDR6 roof
      and the Infinity Cache (MALL) roof, since those requests can hit in the
      Infinity Cache.
    Performance (GFLOPs): >-
      Achieved VALU plus WMMA throughput in billions of floating-point
      operations per second.
