# gfx1201 (RDNA 4, Navi 48) -- GL2 Cache
# Metric bodies are carried from the gfx1201 metrics port and placed in the
# gfx12 panel template. Tables with no carried metric are empty.
Panel Config:
  id: 1300
  title: GL2 Cache (L2)
  data source:
    - metric_table:
        id: 1310
        title: GL2 Cache Request Statistics
        header: &id001
          metric: Metric
          avg: Avg
          min: Min
          max: Max
          unit: Unit
        metric:
          Total Requests:
            avg: SUM(GL2C_REQ_sum) / SUM($denom)
            min: MIN(GL2C_REQ_sum / $denom)
            max: MAX(GL2C_REQ_sum / $denom)
            unit: (Count + $normUnit)
          Read Requests:
            avg: SUM(GL2C_READ_sum) / SUM($denom)
            min: MIN(GL2C_READ_sum / $denom)
            max: MAX(GL2C_READ_sum / $denom)
            unit: (Count + $normUnit)
          Write Requests:
            avg: SUM(GL2C_WRITE_sum) / SUM($denom)
            min: MIN(GL2C_WRITE_sum / $denom)
            max: MAX(GL2C_WRITE_sum / $denom)
            unit: (Count + $normUnit)
          Atomic Requests:
            avg: SUM(GL2C_ATOMIC_sum) / SUM($denom)
            min: MIN(GL2C_ATOMIC_sum / $denom)
            max: MAX(GL2C_ATOMIC_sum / $denom)
            unit: (Count + $normUnit)
          GCEA Read Requests (DRAM):
            avg: SUM(GL2C_EA_RDREQ_DRAM_sum) / SUM($denom)
            min: MIN(GL2C_EA_RDREQ_DRAM_sum / $denom)
            max: MAX(GL2C_EA_RDREQ_DRAM_sum / $denom)
            unit: (Count + $normUnit)
          GCEA Write Requests (DRAM):
            avg: SUM(GL2C_EA_WRREQ_DRAM_sum) / SUM($denom)
            min: MIN(GL2C_EA_WRREQ_DRAM_sum / $denom)
            max: MAX(GL2C_EA_WRREQ_DRAM_sum / $denom)
            unit: (Count + $normUnit)
    - metric_table:
        id: 1311
        title: GL2 Cache Performance
        header: *id001
        metric:
          GL2 Cache Hit Rate:
            avg: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
            min: MIN(100 * GL2C_HIT_sum / (GL2C_HIT_sum + GL2C_MISS_sum))
            max: MAX(100 * GL2C_HIT_sum / (GL2C_HIT_sum + GL2C_MISS_sum))
            unit: Percent
          GL2 Cache Hits:
            avg: SUM(GL2C_HIT_sum) / SUM($denom)
            min: MIN(GL2C_HIT_sum / $denom)
            max: MAX(GL2C_HIT_sum / $denom)
            unit: (Count + $normUnit)
          GL2 Cache Misses:
            avg: SUM(GL2C_MISS_sum) / SUM($denom)
            min: MIN(GL2C_MISS_sum / $denom)
            max: MAX(GL2C_MISS_sum / $denom)
            unit: (Count + $normUnit)
    - metric_table:
        id: 1304
        title: GL2 Cache Bandwidth
        header: *id001
        metric:
          GL2 Cache Read BW:
            avg: SUM(GL2C_EA_RDREQ_32B_sum * 32 + GL2C_EA_RDREQ_64B_sum * 64 + GL2C_EA_RDREQ_128B_sum * 128 + GL2C_EA_RDREQ_256B_sum * 256) / SUM((End_Timestamp - Start_Timestamp) / 1e9)
            min: MIN((GL2C_EA_RDREQ_32B_sum * 32 + GL2C_EA_RDREQ_64B_sum * 64 + GL2C_EA_RDREQ_128B_sum * 128 + GL2C_EA_RDREQ_256B_sum * 256) / ((End_Timestamp - Start_Timestamp) / 1e9))
            max: MAX((GL2C_EA_RDREQ_32B_sum * 32 + GL2C_EA_RDREQ_64B_sum * 64 + GL2C_EA_RDREQ_128B_sum * 128 + GL2C_EA_RDREQ_256B_sum * 256) / ((End_Timestamp - Start_Timestamp) / 1e9))
            unit: Bytes/s
          GL2 Cache Write BW:
            avg: SUM(GL2C_EA_WRREQ_32B_sum * 32 + GL2C_EA_WRREQ_64B_sum * 64 + GL2C_EA_WRREQ_128B_sum * 128 + GL2C_EA_WRREQ_256B_sum * 256) / SUM((End_Timestamp - Start_Timestamp) / 1e9)
            min: MIN((GL2C_EA_WRREQ_32B_sum * 32 + GL2C_EA_WRREQ_64B_sum * 64 + GL2C_EA_WRREQ_128B_sum * 128 + GL2C_EA_WRREQ_256B_sum * 256) / ((End_Timestamp - Start_Timestamp) / 1e9))
            max: MAX((GL2C_EA_WRREQ_32B_sum * 32 + GL2C_EA_WRREQ_64B_sum * 64 + GL2C_EA_WRREQ_128B_sum * 128 + GL2C_EA_WRREQ_256B_sum * 256) / ((End_Timestamp - Start_Timestamp) / 1e9))
            unit: Bytes/s
  metrics_description: {}
