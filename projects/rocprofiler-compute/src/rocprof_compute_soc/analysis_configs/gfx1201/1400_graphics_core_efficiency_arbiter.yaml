# gfx1201 (RDNA 4, Navi 48) -- Graphics Core Efficiency Arbiter (GCEA)
# Metric bodies are carried from the gfx1201 metrics port and placed in the
# gfx12 panel template. Tables with no carried metric are empty.
Panel Config:
  id: 1400
  title: Graphics Core Efficiency Arbiter (GCEA)
  data source:
    - metric_table:
        id: 1401
        title: GCEA Utilization
        header: &id001
          metric: Metric
          avg: Avg
          min: Min
          max: Max
          unit: Unit
        metric:
          SARB Busy:
            avg: None
            min: None
            max: None
            unit: Percent
          SARB Stalled:
            avg: SUM(GC_EA_SE_SARB_STALLED_sum) / SUM($denom)
            min: MIN(GC_EA_SE_SARB_STALLED_sum / $denom)
            max: MAX(GC_EA_SE_SARB_STALLED_sum / $denom)
            unit: (Cycles + $normUnit)
          SARB Starving:
            avg: SUM(GC_EA_SE_SARB_STARVING_sum) / SUM($denom)
            min: MIN(GC_EA_SE_SARB_STARVING_sum / $denom)
            max: MAX(GC_EA_SE_SARB_STARVING_sum / $denom)
            unit: (Cycles + $normUnit)
          SARB Total Requests:
            avg: SUM(GC_EA_SE_CMD_POP_sum) / SUM($denom)
            min: MIN(GC_EA_SE_CMD_POP_sum / $denom)
            max: MAX(GC_EA_SE_CMD_POP_sum / $denom)
            unit: (Count + $normUnit)
          SARB DRAM Requests:
            avg: SUM(GC_EA_SE_DRAM_RD_CMD_POP_sum + GC_EA_SE_DRAM_WR_CMD_POP_sum) / SUM($denom)
            min: MIN((GC_EA_SE_DRAM_RD_CMD_POP_sum + GC_EA_SE_DRAM_WR_CMD_POP_sum) / $denom)
            max: MAX((GC_EA_SE_DRAM_RD_CMD_POP_sum + GC_EA_SE_DRAM_WR_CMD_POP_sum) / $denom)
            unit: (Count + $normUnit)
    - metric_table:
        id: 1402
        title: GCEA Traffic Bandwidth
        header: *id001
        metric:
          DRAM Read Requests:
            avg: SUM(GC_EA_SE_DRAM_RD_CMD_POP_sum) / SUM($denom)
            min: MIN(GC_EA_SE_DRAM_RD_CMD_POP_sum / $denom)
            max: MAX(GC_EA_SE_DRAM_RD_CMD_POP_sum / $denom)
            unit: (Count + $normUnit)
          DRAM Read Chained Requests:
            avg: None
            min: None
            max: None
            unit: (Count + $normUnit)
          DRAM Read Banks Active:
            avg: None
            min: None
            max: None
            unit: (Count + $normUnit)
          DRAM Read Size (32B increments):
            avg: SUM(GC_EA_SE_SARB_DRAM_RD_SIZE_REQ_sum) / SUM($denom)
            min: MIN(GC_EA_SE_SARB_DRAM_RD_SIZE_REQ_sum / $denom)
            max: MAX(GC_EA_SE_SARB_DRAM_RD_SIZE_REQ_sum / $denom)
            unit: (Count + $normUnit)
          DRAM Write Requests:
            avg: SUM(GC_EA_SE_DRAM_WR_CMD_POP_sum) / SUM($denom)
            min: MIN(GC_EA_SE_DRAM_WR_CMD_POP_sum / $denom)
            max: MAX(GC_EA_SE_DRAM_WR_CMD_POP_sum / $denom)
            unit: (Count + $normUnit)
          DRAM Write Chained Requests:
            avg: None
            min: None
            max: None
            unit: (Count + $normUnit)
          DRAM Write Banks Active:
            avg: None
            min: None
            max: None
            unit: (Count + $normUnit)
          DRAM Write Size (32B increments):
            avg: SUM(GC_EA_SE_SARB_DRAM_WR_SIZE_REQ_sum) / SUM($denom)
            min: MIN(GC_EA_SE_SARB_DRAM_WR_SIZE_REQ_sum / $denom)
            max: MAX(GC_EA_SE_SARB_DRAM_WR_SIZE_REQ_sum / $denom)
            unit: (Count + $normUnit)
    - metric_table:
        id: 1403
        title: GCEA-SDP Interface - Outstanding Requests
        header: *id001
        metric:
          Read Returns:
            avg: SUM(GC_EA_SE_RRET_VLD_sum) / SUM($denom)
            min: MIN(GC_EA_SE_RRET_VLD_sum / $denom)
            max: MAX(GC_EA_SE_RRET_VLD_sum / $denom)
            unit: (Count + $normUnit)
          Write Returns:
            avg: SUM(GC_EA_SE_WRET_VLD_sum) / SUM($denom)
            min: MIN(GC_EA_SE_WRET_VLD_sum / $denom)
            max: MAX(GC_EA_SE_WRET_VLD_sum / $denom)
            unit: (Count + $normUnit)
          Probe Requests:
            avg: None
            min: None
            max: None
            unit: (Count + $normUnit)
    - metric_table:
        id: 1404
        title: GCEA-SDP Interface - Stalls
        header: *id001
        metric:
          DRAM Stall:
            avg: SUM(GC_EA_SE_STALL_DRAM_sum) / SUM($denom)
            min: MIN(GC_EA_SE_STALL_DRAM_sum / $denom)
            max: MAX(GC_EA_SE_STALL_DRAM_sum / $denom)
            unit: (Cycles + $normUnit)
          IO Read Stall:
            avg: SUM(GC_EA_SE_STALL_IO_RD_sum) / SUM($denom)
            min: MIN(GC_EA_SE_STALL_IO_RD_sum / $denom)
            max: MAX(GC_EA_SE_STALL_IO_RD_sum / $denom)
            unit: (Cycles + $normUnit)
          IO Write Stall:
            avg: SUM(GC_EA_SE_STALL_IO_WR_sum) / SUM($denom)
            min: MIN(GC_EA_SE_STALL_IO_WR_sum / $denom)
            max: MAX(GC_EA_SE_STALL_IO_WR_sum / $denom)
            unit: (Cycles + $normUnit)
  metrics_description:
    SARB Busy: >-
      Not available on gfx1201. The GCEA counters have no busy or always-count event.
    SARB Stalled: >-
      Cycles the GCEA front end was ready but the back end could not send to SDP.
    SARB Starving: >-
      Cycles the GCEA back end was ready but the front end had nothing to send.
    SARB Total Requests: >-
      Requests GCEA sent to SDP: DRAM reads and writes, IO reads and writes, and MAM writes.
    SARB DRAM Requests: >-
      DRAM read and write requests GCEA sent to SDP.
    DRAM Read Chained Requests: >-
      Not available on gfx1201.
    DRAM Read Banks Active: >-
      Not available on gfx1201.
    DRAM Read Size (32B increments): >-
      DRAM read data GCEA requested, in 32-byte units.
    DRAM Write Chained Requests: >-
      Not available on gfx1201.
    DRAM Write Banks Active: >-
      Not available on gfx1201.
    DRAM Write Size (32B increments): >-
      DRAM write data GCEA requested, in 32-byte units.
    Read Returns: >-
      Read response data beats from SDP.
    Write Returns: >-
      Write responses from SDP.
    Probe Requests: >-
      Not available on gfx1201.
    DRAM Stall: >-
      Cycles the DRAM front end was ready but the GCEA back end for DRAM was not.
    IO Read Stall: >-
      Cycles the IO read front end was ready but the GCEA back end for IO reads was not.
    IO Write Stall: >-
      Cycles the IO write front end was ready but the GCEA back end for IO writes was not.
