Panel Config:
  id: 1400
  alias: ea
  title: Efficiency Arbiter (EA)
  data source:
  - metric_table:
      id: 1401
      title: EA Utilization
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        SARB Busy:
          avg: None
          min: None
          max: None
          unit: Percent
        SARB Stalled:
          avg: SUM(GC_EA_SE_SARB_STALLED_sum) / SUM($denom)
          min: MIN(GC_EA_SE_SARB_STALLED_sum / $denom)
          max: MAX(GC_EA_SE_SARB_STALLED_sum / $denom)
          unit: (Cycles + $normUnit)
        SARB Starving:
          avg: SUM(GC_EA_SE_SARB_STARVING_sum) / SUM($denom)
          min: MIN(GC_EA_SE_SARB_STARVING_sum / $denom)
          max: MAX(GC_EA_SE_SARB_STARVING_sum / $denom)
          unit: (Cycles + $normUnit)
        SARB Total Requests:
          avg: SUM(GC_EA_SE_CMD_POP_sum) / SUM($denom)
          min: MIN(GC_EA_SE_CMD_POP_sum / $denom)
          max: MAX(GC_EA_SE_CMD_POP_sum / $denom)
          unit: (Count + $normUnit)
        SARB DRAM Requests:
          avg: SUM(GC_EA_SE_DRAM_RD_CMD_POP_sum + GC_EA_SE_DRAM_WR_CMD_POP_sum) / SUM($denom)
          min: MIN((GC_EA_SE_DRAM_RD_CMD_POP_sum + GC_EA_SE_DRAM_WR_CMD_POP_sum) / $denom)
          max: MAX((GC_EA_SE_DRAM_RD_CMD_POP_sum + GC_EA_SE_DRAM_WR_CMD_POP_sum) / $denom)
          unit: (Count + $normUnit)
  - metric_table:
      id: 1402
      title: EA Traffic Bandwidth
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        DRAM Read Requests:
          avg: SUM(GC_EA_SE_DRAM_RD_CMD_POP_sum) / SUM($denom)
          min: MIN(GC_EA_SE_DRAM_RD_CMD_POP_sum / $denom)
          max: MAX(GC_EA_SE_DRAM_RD_CMD_POP_sum / $denom)
          unit: (Count + $normUnit)
        DRAM Read Chained Requests:
          avg: None
          min: None
          max: None
          unit: (Count + $normUnit)
        DRAM Read Banks Active:
          avg: None
          min: None
          max: None
          unit: (Count + $normUnit)
        DRAM Read Size (32B increments):
          avg: SUM(GC_EA_SE_SARB_DRAM_RD_SIZE_REQ_sum) / SUM($denom)
          min: MIN(GC_EA_SE_SARB_DRAM_RD_SIZE_REQ_sum / $denom)
          max: MAX(GC_EA_SE_SARB_DRAM_RD_SIZE_REQ_sum / $denom)
          unit: (Count + $normUnit)
        DRAM Write Requests:
          avg: SUM(GC_EA_SE_DRAM_WR_CMD_POP_sum) / SUM($denom)
          min: MIN(GC_EA_SE_DRAM_WR_CMD_POP_sum / $denom)
          max: MAX(GC_EA_SE_DRAM_WR_CMD_POP_sum / $denom)
          unit: (Count + $normUnit)
        DRAM Write Chained Requests:
          avg: None
          min: None
          max: None
          unit: (Count + $normUnit)
        DRAM Write Banks Active:
          avg: None
          min: None
          max: None
          unit: (Count + $normUnit)
        DRAM Write Size (32B increments):
          avg: SUM(GC_EA_SE_SARB_DRAM_WR_SIZE_REQ_sum) / SUM($denom)
          min: MIN(GC_EA_SE_SARB_DRAM_WR_SIZE_REQ_sum / $denom)
          max: MAX(GC_EA_SE_SARB_DRAM_WR_SIZE_REQ_sum / $denom)
          unit: (Count + $normUnit)
  - metric_table:
      id: 1403
      title: EA-SDP Interface - Outstanding Requests
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Read Returns:
          avg: SUM(GC_EA_SE_RRET_VLD_sum) / SUM($denom)
          min: MIN(GC_EA_SE_RRET_VLD_sum / $denom)
          max: MAX(GC_EA_SE_RRET_VLD_sum / $denom)
          unit: (Count + $normUnit)
        Write Returns:
          avg: SUM(GC_EA_SE_WRET_VLD_sum) / SUM($denom)
          min: MIN(GC_EA_SE_WRET_VLD_sum / $denom)
          max: MAX(GC_EA_SE_WRET_VLD_sum / $denom)
          unit: (Count + $normUnit)
        Probe Requests:
          avg: None
          min: None
          max: None
          unit: (Count + $normUnit)
  - metric_table:
      id: 1404
      title: EA-SDP Interface - Stalls
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        DRAM Stall:
          avg: SUM(GC_EA_SE_STALL_DRAM_sum) / SUM($denom)
          min: MIN(GC_EA_SE_STALL_DRAM_sum / $denom)
          max: MAX(GC_EA_SE_STALL_DRAM_sum / $denom)
          unit: (Cycles + $normUnit)
        IO Read Stall:
          avg: SUM(GC_EA_SE_STALL_IO_RD_sum) / SUM($denom)
          min: MIN(GC_EA_SE_STALL_IO_RD_sum / $denom)
          max: MAX(GC_EA_SE_STALL_IO_RD_sum / $denom)
          unit: (Cycles + $normUnit)
        IO Write Stall:
          avg: SUM(GC_EA_SE_STALL_IO_WR_sum) / SUM($denom)
          min: MIN(GC_EA_SE_STALL_IO_WR_sum / $denom)
          max: MAX(GC_EA_SE_STALL_IO_WR_sum / $denom)
          unit: (Cycles + $normUnit)
  metrics_description:
    DRAM Read Requests: >-
      Read commands reported by the EA DRAM-bound command interface,
      normalized by the chosen unit. This count does not establish physical
      GDDR6 byte traffic.
    DRAM Write Requests: >-
      Write commands reported by the EA DRAM-bound command interface,
      normalized by the chosen unit. This count does not establish physical
      GDDR6 byte traffic.
    SARB Busy: >-
      Not available in this gfx1201 configuration. No qualified EA busy
      measurement and counting denominator are collected.
    SARB Stalled: >-
      Cycles the EA front end was ready but the back end could not send to SDP.
    SARB Starving: >-
      Cycles the EA back end was ready but the front end had nothing to send.
    SARB Total Requests: >-
      Requests EA sent to SDP: DRAM reads and writes, IO reads and writes, and MAM writes.
    SARB DRAM Requests: >-
      DRAM read and write requests EA sent to SDP.
    DRAM Read Chained Requests: >-
      Not available on gfx1201.
    DRAM Read Banks Active: >-
      Not available on gfx1201.
    DRAM Read Size (32B increments): >-
      DRAM read data EA requested, in 32-byte units.
    DRAM Write Chained Requests: >-
      Not available on gfx1201.
    DRAM Write Banks Active: >-
      Not available on gfx1201.
    DRAM Write Size (32B increments): >-
      DRAM write data EA requested, in 32-byte units.
    Read Returns: >-
      Read response data beats from SDP.
    Write Returns: >-
      Write responses from SDP.
    Probe Requests: >-
      Not available on gfx1201.
    DRAM Stall: >-
      Cycles the DRAM front end was ready but the EA back end for DRAM was not.
    IO Read Stall: >-
      Cycles the IO read front end was ready but the EA back end for IO reads was not.
    IO Write Stall: >-
      Cycles the IO write front end was ready but the EA back end for IO writes was not.
