Panel Config:
  id: 200
  alias: sol
  title: System Speed-of-Light
  data source:
  - metric_table:
      id: 201
      title: System Speed-of-Light
      header:
        metric: Metric
        value: Avg
        unit: Unit
        peak: Peak
        pct_of_peak: Percent of Peak
      metric:
        VALU Issue Rate:
          value: SUM(SQ_INSTS_VALU_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GInstructions/s
          peak: None
          pct_of_peak: false
        WMMA FLOPs (F16->F32 16x16x16):
          value: 8192 * SUM(SQ_WMMA_VALU_INSTS_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GFLOP/s
          peak: $max_sclk * $cu_per_gpu * 1024 / 1000
          pct_of_peak: true
        FP64 VALU Issue Rate:
          value: SUM(SQ_INSTS_VALU_DP_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GInstructions/s
          peak: None
          pct_of_peak: false
        IPC:
          value: SUM(SQ_INSTS_ALL_sum - SQ_INSTS_INTERNAL_sum) / SUM(SQ_BUSY_CYCLES_sum)
          unit: Instructions per Cycle
          peak: 5
          pct_of_peak: true
        Wavefront Occupancy:
          value: SUM(SQ_WAVE_CYCLES_sum) / SUM(GRBM_GUI_ACTIVE)
          unit: Wavefronts
          peak: $max_waves_per_cu * $cu_per_gpu
          pct_of_peak: true
        GL2 Cache Hit Rate:
          value: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
          unit: Percent
          peak: 100
          pct_of_peak: true
        LDS Bank Conflicts:
          value: AVG(SQC_LDS_BANK_CONFLICT_sum)
          unit: Cycles
          peak: None
          pct_of_peak: false
        GL0 Cache Hit Rate (TCP Cache):
          value: 100 * SUM(TCP_REQ_sum - TCP_REQ_MISS_sum) / SUM(TCP_REQ_sum)
          unit: Percent
          peak: 100
          pct_of_peak: true
        Scalar Data Cache Hit Rate:
          value: 100 * SUM(SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_REQ_sum)
          unit: Percent
          peak: 100
          pct_of_peak: true
        Scalar Data Cache BW:
          value: 4 * SUM(SQC_SMEM_LOAD_DWORDS_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
          peak: $sqc_per_gpu * 64 * $max_sclk * 1e6
          pct_of_peak: true
        Instruction Cache Hit Rate:
          value: 100 * SUM(SQC_ICACHE_HITS_sum) / SUM(SQC_ICACHE_REQ_sum)
          unit: Percent
          peak: 100
          pct_of_peak: true
  metrics_description:
    VALU Issue Rate: >-
      Billions of VALU instruction issues per second. The counter includes
      floating-point and integer instructions and does not count FLOPs or active
      lanes.
    WMMA FLOPs (F16->F32 16x16x16): >-
      Achieved FP16 WMMA throughput.
    FP64 VALU Issue Rate: >-
      Billions of double-precision VALU instruction issues per second. This is
      an instruction rate, without accounting for FLOPs per instruction or
      active lanes.
    IPC: >-
      Instructions executed per cycle, measuring overall instruction throughput efficiency.
      Higher IPC indicates better utilization of the shader pipeline. Low IPC may indicate
      stalls due to memory latency, register dependencies, or insufficient wavefront
      occupancy to hide latencies.
    Wavefront Occupancy: >-
      Average number of wavefronts resident on the GPU during kernel execution. Higher
      occupancy provides more opportunities to hide memory latency through wavefront
      switching. However, maximum occupancy is not always optimal. Excessive register
      or LDS usage per wavefront may limit occupancy.
    GL2 Cache Hit Rate: >-
      Percentage of L2 lookups that hit.
    LDS Bank Conflicts: >-
      Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
    GL0 Cache Hit Rate (TCP Cache): >-
      Percentage of GL0 vector cache (TCP Cache) requests that hit in cache. The TCP cache
      is the first-level cache for vector memory operations. High hit rates reduce
      traffic to GL1 and improve memory access latency.
    Scalar Data Cache Hit Rate: >-
      Percentage of scalar data cache accesses that hit in cache. The scalar cache
      stores uniform data accessed by scalar instructions. High hit rates indicate
      efficient reuse of constant and uniform data across wavefronts.
    Scalar Data Cache BW: >-
      Bytes loaded by scalar memory instructions, from the dwords each instruction loads.
    Instruction Cache Hit Rate: >-
      Percentage of instruction fetch requests that hit in the instruction cache.
      High hit rates are essential for sustained instruction throughput. Low hit
      rates may indicate large kernel code size or divergent control flow.
