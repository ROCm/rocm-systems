# gfx1201 (RDNA 4, Navi 48) -- System Speed-of-Light
# A metric whose counter the gfx1201 register spec does not define is None, so
# analyze shows N/A for it.
Panel Config:
  id: 200
  title: System Speed-of-Light
  data source:
    - metric_table:
        id: 201
        title: System Speed-of-Light
        header:
          metric: Metric
          value: Avg
          unit: Unit
          peak: Peak
          pct_of_peak: Percent of Peak
        metric:
          VALU FLOPs (FP32):
            value: SUM(SQ_INSTS_VALU_sum * $wave_size) / SUM(End_Timestamp - Start_Timestamp)
            unit: GFLOP/s
            peak: $max_sclk * $cu_per_gpu * 128 / 1000
            pct_of_peak: true
          WMMA FLOPs (F16->F32 16x16x16):
            value: 8192 * SUM(SQ_WMMA_VALU_INSTS_sum) / SUM(End_Timestamp - Start_Timestamp)
            unit: GFLOP/s
            peak: $max_sclk * $cu_per_gpu * 1024 / 1000
            pct_of_peak: true
          VALU FLOPs (F64):
            value: SUM(SQ_INSTS_VALU_DP_sum * $wave_size) / SUM(End_Timestamp - Start_Timestamp)
            unit: GFLOP/s
            peak: $max_sclk * $cu_per_gpu * 4 / 1000
            pct_of_peak: true
          IPC:
            value: SUM(SQ_INSTS_ALL_sum - SQ_INSTS_INTERNAL_sum) / SUM(SQ_BUSY_CYCLES_sum)
            unit: Instr/cycle
            peak: 5
            pct_of_peak: true
          Wavefront Occupancy:
            value: SUM(SQG_WAVE_CYCLES_sum) / SUM(GRBM_GUI_ACTIVE)
            unit: Wavefronts
            peak: $max_waves_per_cu * $cu_per_gpu
            pct_of_peak: true
          GL2 Cache Hit Rate:
            value: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
            unit: Percent
            peak: 100
            pct_of_peak: false
          GL2-Fabric Read BW:
            value: SUM(GL2C_EA_RDREQ_32B_sum * 32 + GL2C_EA_RDREQ_64B_sum * 64 + GL2C_EA_RDREQ_128B_sum
              * 128 + GL2C_EA_RDREQ_256B_sum * 256) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: None
            pct_of_peak: false
          GL2-Fabric Write BW:
            value: SUM(GL2C_EA_WRREQ_32B_sum * 32 + GL2C_EA_WRREQ_64B_sum * 64 + GL2C_EA_WRREQ_128B_sum
              * 128 + GL2C_EA_WRREQ_256B_sum * 256) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: None
            pct_of_peak: false
          LDS Bank Conflicts:
            value: AVG(SQC_LDS_BANK_CONFLICT_sum)
            unit: Cycles
            peak: None
            pct_of_peak: false
          Wave Dependency Wait:
            value: 100 * SUM(SQ_WAIT_ANY_sum) / SUM(SQG_WAVE_CYCLES_sum)
            unit: Percent
            peak: 100
            pct_of_peak: false
          Wave Issue Wait:
            value: 100 * SUM(SQ_WAIT_INST_ANY_sum) / SUM(SQG_WAVE_CYCLES_sum)
            unit: Percent
            peak: 100
            pct_of_peak: false
          GL0 Cache Hit Rate (TCP Cache):
            value: 100 * SUM(TCP_REQ_sum - TCP_REQ_MISS_sum) / SUM(TCP_REQ_sum)
            unit: Percent
            peak: 100
            pct_of_peak: false
          GL0 Cache BW (TCP Cache):
            value: None
            unit: Bytes/s
            peak: None
            pct_of_peak: false
          GL1 Cache Hit Rate:
            value: None
            unit: Percent
            peak: 100
            pct_of_peak: false
          GL1 Cache Read BW:
            value: 32 * SUM(GL1C_GL1_RET_32B_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $num_gl1c * 128 * $max_sclk * 1e6
            pct_of_peak: true
          GL2 Cache BW:
            value: SUM(GL2C_READ_32_REQ_sum * 32 + GL2C_READ_64_REQ_sum * 64 + GL2C_READ_128_REQ_sum *
              128 + GL2C_READ_256_REQ_sum * 256) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $total_l2_chan * 128 * $max_sclk * 1e6
            pct_of_peak: true
          Scalar Data Cache Hit Rate:
            value: 100 * SUM(SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_REQ_sum)
            unit: Percent
            peak: 100
            pct_of_peak: false
          Scalar Data Cache BW:
            value: 4 * SUM(SQC_SMEM_LOAD_DWORDS_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $sqc_per_gpu * 64 * $max_sclk * 1e6
            pct_of_peak: true
          Instruction Cache Hit Rate:
            value: 100 * SUM(SQC_ICACHE_HITS_sum) / SUM(SQC_ICACHE_REQ_sum)
            unit: Percent
            peak: 100
            pct_of_peak: false
          Instruction Cache BW:
            value: None
            unit: Bytes/s
            peak: None
            pct_of_peak: false
  metrics_description:
    VALU FLOPs (FP32): >-
      Floating-point operations per second on the VALU, from all issued VALU
      instructions times the wavefront size. Peak is FP32 FMA single-issue
      (128 FLOPs/CU/cycle). VOPD dual-issue can exceed it.
    WMMA FLOPs (F16->F32 16x16x16): >-
      Matrix FLOPs per second, counting 8192 FLOPs per vec32 WMMA instruction.
      The counter increments once per vec32, so a wave64 WMMA counts twice.
      Peak is 1024 FLOPs/CU/cycle, the published dense FP16 rate of Navi 48.
    VALU FLOPs (F64): >-
      64-bit floating-point operations per second on the VALU. Peak is
      4 FLOPs/CU/cycle, 1/32 of the FP32 FMA rate.
    IPC: >-
      Instructions issued per busy SQ cycle, excluding internal instructions.
    Wavefront Occupancy: >-
      Average number of wavefronts resident on the GPU over GPU-active cycles.
    GL2 Cache Hit Rate: >-
      Percentage of L2 lookups that hit. Navi 48 has an 8 MB L2.
    GL2-Fabric Read BW: >-
      Bytes L2 read over its EA interface, from the 32, 64, 128, and 256-byte read
      request counts. The 64 MB Infinity Cache serves part of this traffic, so it is
      not compared against the GDDR6 peak.
    GL2-Fabric Write BW: >-
      Bytes L2 wrote over its EA interface, from the 32, 64, 128, and 256-byte write
      request counts. The Infinity Cache absorbs part of this traffic, so it is not
      compared against the GDDR6 peak.
    LDS Bank Conflicts: >-
      Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
    Wave Dependency Wait: >-
      Percentage of wave cycles spent waiting for anything, such as pending memory
      operations or prior instruction results.
    Wave Issue Wait: >-
      Percentage of wave cycles spent waiting for any instruction to issue.
    GL0 Cache Hit Rate (TCP Cache): >-
      Percentage of vector L0 cache line accesses that hit.
    GL0 Cache BW (TCP Cache): >-
      Not available on gfx1201. The L0 counters give no access size.
    GL1 Cache Hit Rate: >-
      Not available on gfx1201. GL1 is a write-combining cache in RDNA 4 and has no
      hit or miss counter.
    GL1 Cache Read BW: >-
      Bytes GL1 returned to its clients, from the physical 32-byte beats returned.
    GL2 Cache BW: >-
      Bytes L2 read, from the uncompressed 32, 64, 128, and 256-byte read request counts.
    Scalar Data Cache Hit Rate: >-
      Percentage of scalar data cache requests that hit.
    Scalar Data Cache BW: >-
      Bytes loaded by scalar memory instructions, from the dwords each instruction loads.
    Instruction Cache Hit Rate: >-
      Percentage of instruction cache requests that hit.
    Instruction Cache BW: >-
      Not available on gfx1201. The instruction cache counters give no request size.
