# gfx1201 (RDNA 4, Navi 48) -- System Speed-of-Light
# Metric bodies are carried from the gfx1201 metrics port and placed in the
# gfx12 panel template. Tables with no carried metric are empty.
Panel Config:
  id: 200
  title: System Speed-of-Light
  data source:
    - metric_table:
        id: 201
        title: System Speed-of-Light
        header:
          metric: Metric
          value: Avg
          unit: Unit
          peak: Peak
          pct_of_peak: Percent of Peak
        metric:
          VALU FLOPs (FP32):
            value: SUM(SQ_INSTS_VALU_sum * $wave_size) / SUM(End_Timestamp - Start_Timestamp)
            unit: GFLOP/s
            peak: $max_sclk * $cu_per_gpu * 128 / 1000
            pop: 100 * SUM(SQ_INSTS_VALU_sum * $wave_size) / SUM(End_Timestamp - Start_Timestamp) / ($max_sclk
              * $cu_per_gpu * 128 / 1000)
          WMMA FLOPs (F16->F32 16x16x16):
            value: 8192 * SUM(SQ_WMMA_VALU_INSTS_sum) / SUM(End_Timestamp - Start_Timestamp)
            unit: GFLOP/s
            peak: $max_sclk * $cu_per_gpu * 512 / 1000
            pop: 100 * SUM(SQ_WMMA_VALU_INSTS_sum * 8192) / SUM(End_Timestamp - Start_Timestamp) / ($max_sclk
              * $cu_per_gpu * 512 / 1000)
          VALU FLOPs (F64):
            value: SUM(SQ_INSTS_VALU_DP_sum * $wave_size) / SUM(End_Timestamp - Start_Timestamp)
            unit: GFLOP/s
            peak: $max_sclk * $cu_per_gpu * 4 / 1000
            pop: 100 * SUM(SQ_INSTS_VALU_DP_sum * $wave_size) / SUM(End_Timestamp - Start_Timestamp) /
              ($max_sclk * $cu_per_gpu * 4 / 1000)
          IPC:
            value: SUM(SQ_INSTS_ALL_sum - SQ_INSTS_INTERNAL_sum) / SUM(SQ_BUSY_CYCLES_sum)
            unit: Instr/cycle
            peak: 5
            pop: 100 * SUM(SQ_INSTS_ALL_sum - SQ_INSTS_INTERNAL_sum) / SUM(SQ_BUSY_CYCLES_sum) / 5
          Wavefront Occupancy:
            value: SUM(SQ_WAVE_CYCLES_sum) / SUM(SQ_BUSY_CYCLES_avr)
            unit: Wavefronts
            peak: $max_waves_per_cu * $cu_per_gpu
            pop: ((100 * SUM(SQ_WAVE_CYCLES_sum) / SUM(SQ_BUSY_CYCLES_avr)) / (($max_waves_per_cu * $cu_per_gpu)))
          GL2 Cache Hit Rate:
            value: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
            unit: Percent
            peak: 100
            pop: SUM(100 * GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
          GL2-Fabric Read BW:
            value: SUM(GL2C_EA_RDREQ_32B_sum * 32 + GL2C_EA_RDREQ_64B_sum * 64 + GL2C_EA_RDREQ_128B_sum
              * 128 + (GL2C_EA_RDREQ_sum - GL2C_EA_RDREQ_32B_sum - GL2C_EA_RDREQ_64B_sum - GL2C_EA_RDREQ_128B_sum)
              * 256) / SUM((End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $max_mclk * 2 * $num_hbm_channels * 8 * 1e6
            pop: 100 * SUM(GL2C_EA_RDREQ_32B_sum * 32 + GL2C_EA_RDREQ_64B_sum * 64 + GL2C_EA_RDREQ_128B_sum
              * 128 + (GL2C_EA_RDREQ_sum - GL2C_EA_RDREQ_32B_sum - GL2C_EA_RDREQ_64B_sum - GL2C_EA_RDREQ_128B_sum)
              * 256) / SUM((End_Timestamp - Start_Timestamp) / 1e9) / $max_mclk * 2 * $num_hbm_channels
              * 8 * 1e6
          GL2-Fabric Write BW:
            value: SUM((GL2C_EA_WRREQ_sum - GL2C_EA_WRREQ_64B_sum) * 256 + GL2C_EA_WRREQ_64B_sum * 64)
              / SUM((End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $max_mclk * 2 * $num_hbm_channels * 8 * 1e6
            pop: 100 * SUM((GL2C_EA_WRREQ_sum - GL2C_EA_WRREQ_64B_sum) * 256 + GL2C_EA_WRREQ_64B_sum *
              64) / SUM((End_Timestamp - Start_Timestamp) / 1e9) / ($max_mclk * 2 * $num_hbm_channels
              * 8 * 1e6)
          LDS Bank Conflicts:
            value: AVG(SQC_LDS_BANK_CONFLICT)
            unit: Conflicts
            peak: None
            pop: None
          Wave Dependency Wait:
            value: 100 * SUM(SQ_WAIT_ANY) / SUM(SQ_WAVE_CYCLES)
            unit: Percent
            peak: 100
            pop: SUM(100 * SQ_WAIT_ANY) / SUM(SQ_WAVE_CYCLES)
          Wave Issue Wait:
            value: 100 * SUM(SQ_WAIT_INST_ANY) / SUM(SQ_WAVE_CYCLES)
            unit: Percent
            peak: 100
            pop: SUM(100 * SQ_WAIT_INST_ANY) / SUM(SQ_WAVE_CYCLES)
          GL0 Cache Hit Rate (TCP Cache):
            value: 100 * SUM(TCP_REQ_sum - TCP_REQ_MISS_sum) / SUM(TCP_REQ_sum)
            unit: Percent
            peak: 100
            pop: SUM(100 * (TCP_REQ_sum - TCP_REQ_MISS_sum)) / SUM(TCP_REQ_sum)
          GL0 Cache BW (TCP Cache):
            value: 64 * SUM(TCP_REQ_sum) / SUM((End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $cu_per_gpu * 128 * $max_sclk * 1e6
            pop: 100 * SUM(TCP_REQ_sum * 64) / SUM((End_Timestamp - Start_Timestamp) / 1e9) / ($cu_per_gpu
              * 128 * $max_sclk * 1e6)
          GL1 Cache Hit Rate:
            value: 100 * SUM(GL1C_REQ_sum - GL1C_REQ_MISS_sum) / SUM(GL1C_REQ_sum)
            unit: Percent
            peak: 100
            pop: SUM(100 * (GL1C_REQ_sum - GL1C_REQ_MISS_sum)) / SUM(GL1C_REQ_sum)
          GL1 Cache Read BW:
            value: SUM(GL1C_GL2_REQ_READ_32B_sum * 32 + GL1C_GL2_REQ_READ_64B_sum * 64 + GL1C_GL2_REQ_READ_128B_sum
              * 128) / SUM((End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $cu_per_gpu / 8 * 128 * $max_sclk * 1e6
            pop: 100 * SUM(GL1C_GL2_REQ_READ_32B_sum*32 + GL1C_GL2_REQ_READ_64B_sum*64 + GL1C_GL2_REQ_READ_128B_sum*128)
              / SUM((End_Timestamp - Start_Timestamp) / 1e9) / (($cu_per_gpu / 8) * 128 * $max_sclk *
              1e6)
          GL2 Cache BW:
            value: SUM(GL2C_READ_32_REQ_sum * 32 + GL2C_READ_64_REQ_sum * 64 + GL2C_READ_128_REQ_sum *
              128 + GL2C_COMPRESSED_READ_96_REQ_sum * 96) / SUM((End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $total_l2_chan * 128 * $max_sclk * 1e6
            pop: 100 * SUM(GL2C_READ_32_REQ_sum*32 + GL2C_READ_64_REQ_sum*64 + GL2C_READ_128_REQ_sum*128
              + GL2C_COMPRESSED_READ_96_REQ_sum*96) / SUM((End_Timestamp - Start_Timestamp) / 1e9) / ($total_l2_chan
              * 128 * $max_sclk * 1e6)
          Scalar Data Cache Hit Rate:
            value: 100 * SUM(SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_HITS_sum + SQC_DCACHE_MISSES_sum)
            unit: Percent
            peak: 100
            pop: SUM(100 * SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_HITS_sum + SQC_DCACHE_MISSES_sum)
          Scalar Data Cache BW:
            value: 128 * SUM(SQC_TC_DATA_READ_REQ_sum) / SUM((End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $sqc_per_gpu * 64 * $max_sclk * 1e6
            pop: 100 * SUM(SQC_TC_DATA_READ_REQ_sum * 128) / SUM((End_Timestamp - Start_Timestamp) / 1e9)
              / $sqc_per_gpu * 64 * $max_sclk * 1e6
          Instruction Cache Hit Rate:
            value: 100 * SUM(SQC_ICACHE_HITS_sum) / SUM(SQC_ICACHE_HITS_sum + SQC_ICACHE_MISSES_sum)
            unit: Percent
            peak: 100
            pop: SUM(100 * SQC_ICACHE_HITS_sum) / SUM(SQC_ICACHE_HITS_sum + SQC_ICACHE_MISSES_sum)
          Instruction Cache BW:
            value: 128 * SUM(SQC_TC_INST_REQ_sum) / SUM((End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $sqc_per_gpu * 64 * $max_sclk * 1e6
            pop: 100 * SUM(SQC_TC_INST_REQ_sum * 128) / SUM((End_Timestamp - Start_Timestamp) / 1e9) /
              ($sqc_per_gpu * 64 * $max_sclk * 1e6)
  metrics_description: {}
