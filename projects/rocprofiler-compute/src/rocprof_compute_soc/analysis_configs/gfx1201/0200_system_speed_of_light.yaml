# gfx1201 (RDNA 4, Navi 48) -- System Speed-of-Light
# Metrics without a validated counter expression use None, so analyze shows N/A.
Panel Config:
  id: 200
  alias: sol
  title: System Speed-of-Light
  data source:
    - metric_table:
        id: 201
        title: System Speed-of-Light
        header:
          metric: Metric
          value: Avg
          unit: Unit
          peak: Peak
          pct_of_peak: Percent of Peak
        metric:
          VALU Issue Rate:
            value: SUM(SQ_INSTS_VALU_sum) / SUM(End_Timestamp - Start_Timestamp)
            unit: GInstr/s
            peak: None
            pct_of_peak: false
          WMMA FLOPs (F16->F32 16x16x16):
            value: 8192 * SUM(SQ_WMMA_VALU_INSTS_sum) / SUM(End_Timestamp - Start_Timestamp)
            unit: GFLOP/s
            peak: $max_sclk * $cu_per_gpu * 1024 / 1000
            pct_of_peak: true
          FP64 VALU Issue Rate:
            value: SUM(SQ_INSTS_VALU_DP_sum) / SUM(End_Timestamp - Start_Timestamp)
            unit: GInstr/s
            peak: None
            pct_of_peak: false
          IPC:
            value: SUM(SQ_INSTS_ALL_sum - SQ_INSTS_INTERNAL_sum) / SUM(SQ_BUSY_CYCLES_sum)
            unit: Instr/cycle
            peak: 5
            pct_of_peak: true
          Wavefront Occupancy:
            value: SUM(SQG_WAVE_CYCLES_sum) / SUM(GRBM_GUI_ACTIVE)
            unit: Wavefronts
            peak: $max_waves_per_cu * $cu_per_gpu
            pct_of_peak: true
          GL2 Cache Hit Rate:
            value: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
            unit: Percent
            peak: 100
            pct_of_peak: false
          GL2-Fabric Read BW:
            value: SUM(GL2C_EA_RDREQ_32B_sum * 32 + GL2C_EA_RDREQ_64B_sum * 64 + GL2C_EA_RDREQ_128B_sum
              * 128 + GL2C_EA_RDREQ_256B_sum * 256) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: None
            pct_of_peak: false
          GL2-Fabric Write BW:
            value: SUM(GL2C_EA_WRREQ_32B_sum * 32 + GL2C_EA_WRREQ_64B_sum * 64 + GL2C_EA_WRREQ_128B_sum
              * 128 + GL2C_EA_WRREQ_256B_sum * 256) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: None
            pct_of_peak: false
          LDS Bank Conflicts:
            value: AVG(SQC_LDS_BANK_CONFLICT_sum)
            unit: Cycles
            peak: None
            pct_of_peak: false
          Wave Dependency Wait:
            value: 100 * SUM(SQ_WAIT_ANY_sum) / SUM(SQG_WAVE_CYCLES_sum)
            unit: Percent
            peak: 100
            pct_of_peak: false
          Wave Issue Wait:
            value: 100 * SUM(SQ_WAIT_INST_ANY_sum) / SUM(SQG_WAVE_CYCLES_sum)
            unit: Percent
            peak: 100
            pct_of_peak: false
          GL0 Cache Hit Rate (TCP Cache):
            value: 100 * SUM(TCP_REQ_sum - TCP_REQ_MISS_sum) / SUM(TCP_REQ_sum)
            unit: Percent
            peak: 100
            pct_of_peak: false
          GL0 Cache BW (TCP Cache):
            value: None
            unit: Bytes/s
            peak: None
            pct_of_peak: false
          GL1 Cache Hit Rate:
            value: None
            unit: Percent
            peak: 100
            pct_of_peak: false
          GL1 Cache Read BW:
            value: 32 * SUM(GL1C_GL1_RET_32B_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $num_gl1c * 128 * $max_sclk * 1e6
            pct_of_peak: true
          GL2 Cache BW:
            value: SUM(GL2C_READ_32_REQ_sum * 32 + GL2C_READ_64_REQ_sum * 64 + GL2C_READ_128_REQ_sum *
              128 + GL2C_READ_256_REQ_sum * 256) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $total_l2_chan * 128 * $max_sclk * 1e6
            pct_of_peak: true
          Scalar Data Cache Hit Rate:
            value: 100 * SUM(SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_REQ_sum)
            unit: Percent
            peak: 100
            pct_of_peak: false
          Scalar Data Cache BW:
            value: 4 * SUM(SQC_SMEM_LOAD_DWORDS_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
            unit: Bytes/s
            peak: $sqc_per_gpu * 64 * $max_sclk * 1e6
            pct_of_peak: true
          Instruction Cache Hit Rate:
            value: 100 * SUM(SQC_ICACHE_HITS_sum) / SUM(SQC_ICACHE_REQ_sum)
            unit: Percent
            peak: 100
            pct_of_peak: false
          Instruction Cache BW:
            value: None
            unit: Bytes/s
            peak: None
            pct_of_peak: false
  metrics_description:
    VALU Issue Rate: >-
      Billions of VALU instruction issues per second. The counter includes
      floating-point and integer instructions and does not count FLOPs or active
      lanes. No percentage of FP32 peak is reported.
    WMMA FLOPs (F16->F32 16x16x16): >-
      Estimated matrix FLOPs per second, assuming FP16 inputs with FP32
      accumulation for 16x16x16 matrices. The conversion of 8192 FLOPs per
      counter increment and peak of 1024 FLOPs/CU/cycle are provisional.
      The raw counter counts WMMA issues per vec32 and does not distinguish
      FP16, BF16, or FP8. A fixed wave32 FP16-to-FP32 16x16x16 diagnostic supports
      overlap with the general VALU instruction counter for that instruction.
      Counted wave population, other shapes/types, wave64 interpretation, and
      the applicable peak still require validation.
      Treat the FLOP conversion and percentage of peak as approximations.
    FP64 VALU Issue Rate: >-
      Billions of double-precision VALU instruction issues per second. This is
      an instruction rate, without accounting for FLOPs per instruction or
      active lanes. No percentage of FP64 peak is reported.
    IPC: >-
      Instructions issued per busy SQ cycle, excluding internal instructions.
    Wavefront Occupancy: >-
      Estimated average resident wave count over GPU-active cycles. Navi48
      living-wave counter units and instance reduction still require validation;
      do not treat this as a validated occupancy or resource-limit measurement.
    GL2 Cache Hit Rate: >-
      Percentage of L2 lookups that hit.
    GL2-Fabric Read BW: >-
      Size-weighted L2 read requests over its EA interface, from the configured
      32, 64, 128, and 256-byte categories. Separate compressed request and data
      counters are not included; their overlap and byte coverage require
      qualification. Infinity Cache can serve this traffic, so it is not
      compared against the GDDR6 peak.
    GL2-Fabric Write BW: >-
      Size-weighted L2 write requests over its EA interface, from the configured
      32, 64, 128, and 256-byte categories. Separate compressed request and data
      counters are not included; their overlap and byte coverage require
      qualification. Infinity Cache can absorb this traffic, so it is not
      compared against the GDDR6 peak.
    LDS Bank Conflicts: >-
      Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
    Wave Dependency Wait: >-
      Percentage of wave cycles spent waiting for anything, such as pending memory
      operations or prior instruction results.
    Wave Issue Wait: >-
      Percentage of wave cycles spent waiting for any instruction to issue.
    GL0 Cache Hit Rate (TCP Cache): >-
      Percentage of vector L0 cache line accesses that hit.
    GL0 Cache BW (TCP Cache): >-
      Not available on gfx1201. The L0 counters give no access size.
    GL1 Cache Hit Rate: >-
      Not available in this gfx1201 configuration. No qualified GL1 data hit/miss
      measurement is collected for the Navi48 write-combining stage.
    GL1 Cache Read BW: >-
      Bytes GL1 returned to its clients, from the physical 32-byte beats returned.
    GL2 Cache BW: >-
      Size-weighted uncompressed read requests measured at the GL2 output FIFOs,
      from the 32, 64, 128, and 256-byte categories. This request rate does not
      measure all L2 traffic or physical GDDR6 transfers. The percentage of peak
      uses the L2 interface width, not the GDDR6 peak.
    Scalar Data Cache Hit Rate: >-
      Percentage of scalar data cache requests that hit.
    Scalar Data Cache BW: >-
      Bytes loaded by scalar memory instructions, from the dwords each instruction loads.
    Instruction Cache Hit Rate: >-
      Percentage of instruction cache requests that hit.
    Instruction Cache BW: >-
      Not available on gfx1201. The instruction cache counters give no request size.
