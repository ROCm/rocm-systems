# gfx1201 (RDNA 4, Navi 48) -- GL0 Texture Data (TXD)
# Metric bodies are carried from the gfx1201 metrics port and placed in the
# gfx12 panel template. Tables with no carried metric are empty.
Panel Config:
  id: 1000
  alias: txd
  title: GL0 Texture Data (TXD)
  data source:
    - metric_table:
        id: 1001
        title: TXD Utilization
        header:
          metric: Metric
          avg: Avg
          min: Min
          max: Max
          unit: Unit
        metric: {}
  metrics_description: {}
