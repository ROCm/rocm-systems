# Named formulas that metric formulas use as $name. Analyze computes each one
# on the first pass that holds all of its counters. A formula with SUM is one
# value for all dispatches; one without SUM has a value per dispatch.
# A collectable may use other collectables.
GRBM_COUNT_PER_XCD: GRBM_COUNT / $num_xcd
GRBM_GUI_ACTIVE_PER_XCD: GRBM_GUI_ACTIVE_sum / $num_xcd
GRBM_SPI_BUSY_PER_XCD: GRBM_SPI_BUSY / $num_xcd
hbmBandwidth: $max_mclk / 1000 * 32 * $num_memory_channels
kernelBusyCycles: ROUND(AVG((End_Timestamp - Start_Timestamp) / 1000 * $max_sclk), 0)
numActiveCUs: TO_INT(MIN(ROUND(4 * SUM(SQ_BUSY_CU_CYCLES) / SUM($GRBM_GUI_ACTIVE_PER_XCD), 0) / $max_waves_per_cu * 8 + MIN(MOD(ROUND(4 * SUM(SQ_BUSY_CU_CYCLES) / SUM($GRBM_GUI_ACTIVE_PER_XCD), 0), $max_waves_per_cu), 8), $cu_per_gpu))
sp_flops: SP_VALU_FLOPS_FP16_sum + SP_VALU_FLOPS_FP32_sum + SP_VALU_FLOPS_FP64_sum + SP_VALU_FLOPS_FP16_TRANS_sum + SP_VALU_FLOPS_FP32_TRANS_sum + SP_VALU_FLOPS_FP64_TRANS_sum
wmma_flops: SQ_VALU_WMMA_FLOP_FP16_sum * 2048 + SQ_VALU_WMMA_FLOP_BF16_sum * 2048 + SQ_VALU_WMMA_FLOP_FP32_sum * 128 + SQ_VALU_WMMA_FLOP_FP64_sum * 64 + SQ_VALU_WMMA_FLOP_FP8_sum * 4096 + SQ_VALU_WMMA_FLOP_FP6_sum * 8192 + SQ_VALU_WMMA_FLOP_FP4_sum * 8192 + SQ_VALU_WMMA_FLOP_F6F4_sum * 8192
sp_flop_rate: SUM($sp_flops) / SUM(End_Timestamp - Start_Timestamp)
wmma_flop_rate: SUM($wmma_flops) / SUM(End_Timestamp - Start_Timestamp)
hbm_bytes: 32 * (GC_EA_SE_SARB_DRAM_RD_SIZE_REQ_sum + GC_EA_SE_SARB_DRAM_WR_SIZE_REQ_sum)
gl2_bytes: 128 * (TX_VMW_GL1_REQ_READ_sum + TX_VMW_GL1_REQ_WRITE_sum + TX_VMW_GL1_REQ_ATOMIC_WITH_RET_sum + TX_VMW_GL1_REQ_ATOMIC_WITHOUT_RET_sum)
gl0_bytes: TX_VCA_CACHE_LOAD_BANDWIDTH_BYTES_sum + TX_VCA_CACHE_STORE_BANDWIDTH_BYTES_sum + TX_VCA_CACHE_ATOMIC_BANDWIDTH_BYTES_sum
