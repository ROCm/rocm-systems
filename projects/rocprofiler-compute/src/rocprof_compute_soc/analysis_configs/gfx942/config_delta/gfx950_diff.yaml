- Panel Config:
    id: 1100
  metric_descriptions:
    MFMA FLOPs (F8): >-
      The total number of 8-bit floating point MFMA operations executed per
      second. This is also presented as a percent of the peak theoretical
      F8 MFMA operations achievable on the specific accelerator.
    F8 OPs: The total number of 8-bit floating-point MFMA operations executed, per normalization unit.
- Panel Config:
    id: 1400
  metric_descriptions:
    Atomic Req: The total number of atomic requests from sL1D to the L2, per normalization unit. Typically unused on current CDNA accelerators.
- Panel Config:
    id: 1700
  metric_table:
    id: 1701
    metrics:
    - L2-Fabric Read BW:
        value: SUM(128 * TCC_BUBBLE_sum + 64 * (TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) + 32 * TCC_EA0_RDREQ_32B_sum) / SUM(End_Timestamp - Start_Timestamp)
