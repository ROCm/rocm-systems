Addition:
- Panel Config:
    id: 300
  metric_descriptions:
    sL1D Lat: The average number of cycles scalar L1D cache requests spent in flight before data was returned to a CU.
- Panel Config:
    id: 1500
  metric_descriptions:
    "Sequencer -> TA Address Stall": The number of cycles the sequencer was stalled waiting to send address requests to the address processor due to a full address FIFO, per normalization unit.
    "Sequencer -> TA Command Stall": The number of cycles the sequencer was stalled waiting to send commands to the address processor due to a full command FIFO, per normalization unit.
    "Sequencer -> TA Data Stall": The number of cycles the sequencer was stalled waiting to send write data to the address processor due to a full data FIFO, per normalization unit.
