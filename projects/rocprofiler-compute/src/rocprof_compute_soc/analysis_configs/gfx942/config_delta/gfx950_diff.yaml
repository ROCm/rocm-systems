Modification:
- Panel Config:
    id: 200
  metric_table:
    id: 201
    metrics:
    - MFMA FLOPs (F8):
        peak: ((($max_sclk * $cu_per_gpu) * 4096) / 1000)
        pop: 100 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F8 * 512) / SUM(End_Timestamp - Start_Timestamp) / ($max_sclk * $cu_per_gpu * 4096 / 1000)
    - MFMA FLOPs (BF16):
        peak: ((($max_sclk * $cu_per_gpu) * 2048) / 1000)
        pop: 100 * SUM(SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512) / SUM(End_Timestamp - Start_Timestamp) / ($max_sclk * $cu_per_gpu * 2048 / 1000)
    - MFMA FLOPs (F16):
        peak: ((($max_sclk * $cu_per_gpu) * 2048) / 1000)
        pop: 100 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F16 * 512) / SUM(End_Timestamp - Start_Timestamp) / ($max_sclk * $cu_per_gpu * 2048 / 1000)
    - MFMA FLOPs (F64):
        peak: ((($max_sclk * $cu_per_gpu) * 256) / 1000)
        pop: 100 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F64 * 512) / SUM(End_Timestamp - Start_Timestamp) / ($max_sclk * $cu_per_gpu * 256 / 1000)
    - MFMA IOPs (Int8):
        peak: ((($max_sclk * $cu_per_gpu) * 4096) / 1000)
        pop: 100 * SUM(SQ_INSTS_VALU_MFMA_MOPS_I8 * 512) / SUM(End_Timestamp - Start_Timestamp) / ($max_sclk * $cu_per_gpu * 4096 / 1000)
    - L2-Fabric Read BW:
        value: SUM(128 * TCC_BUBBLE_sum + 64 * (TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) + 32 * TCC_EA0_RDREQ_32B_sum) / SUM(End_Timestamp - Start_Timestamp)
        pop: 100 * (SUM(128 * TCC_BUBBLE_sum + 64 * (TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) + 32 * TCC_EA0_RDREQ_32B_sum) / SUM(End_Timestamp - Start_Timestamp)) / $hbmBandwidth
- Panel Config:
    id: 200
  metric_descriptions:
    Theoretical LDS Bandwidth: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS per unit time (see LDS Bandwidth example for more detail). This is also presented as a percent of the peak theoretical F64 MFMA operations achievable on the specific accelerator.
    L1I Hit Rate: The number of bytes looked up in the L1I cache per unit time. This is also presented as a percent of the peak theoretical bandwidth achievable on the specific accelerator.
    L1I BW: The percent of L1I requests that hit on a previously loaded line the cache. Calculated as the ratio of the number of L1I requests that hit over the number of all L1I requests.
- Panel Config:
    id: 300
  metric_table:
    id: 301
    metrics:
    - Wavefronts:
        value: ROUND(AVG(SPI_CSN_WAVE), 0)
    - Workgroups:
        value: ROUND(AVG(SPI_CSN_NUM_THREADGROUPS), 0)
- Panel Config:
    id: 400
  metric_table:
    id: 401
    metrics:
    - HBM Bandwidth:
        value: SUM( TCC_BUBBLE_sum * 128 + TCC_EA0_RDREQ_32B_sum * 32 + (TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) * 64 + (TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32 + TCC_EA0_WRREQ_64B_sum * 64) / SUM(End_Timestamp - Start_Timestamp)
- Panel Config:
    id: 400
  metric_table:
    id: 402
    metrics:
    - AI HBM:
        value: ( SUM( ($wave_size * ( (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + (2 * SQ_INSTS_VALU_FMA_F16) + SQ_INSTS_VALU_TRANS_F16) + (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + (2 * SQ_INSTS_VALU_FMA_F32) + SQ_INSTS_VALU_TRANS_F32) + (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + (2 * SQ_INSTS_VALU_FMA_F64) + SQ_INSTS_VALU_TRANS_F64) )) + (SQ_INSTS_VALU_MFMA_MOPS_F16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F32 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F64 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F8 * 512) ) / SUM( (TCC_BUBBLE_sum * 128) + (TCC_EA0_RDREQ_32B_sum * 32) + ((TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) * 64) + ((TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32) + (TCC_EA0_WRREQ_64B_sum * 64) ) )
    - AI L2:
        value: ( SUM( ($wave_size * ( (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + (2 * SQ_INSTS_VALU_FMA_F16) + SQ_INSTS_VALU_TRANS_F16) + (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + (2 * SQ_INSTS_VALU_FMA_F32) + SQ_INSTS_VALU_TRANS_F32) + (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + (2 * SQ_INSTS_VALU_FMA_F64) + SQ_INSTS_VALU_TRANS_F64) )) + (SQ_INSTS_VALU_MFMA_MOPS_F16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F32 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F64 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F8 * 512) ) / SUM( (TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum + TCP_TCC_READ_REQ_sum) * 64 ) )
    - AI L1:
        value: ( SUM( ($wave_size * ( (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + (2 * SQ_INSTS_VALU_FMA_F16) + SQ_INSTS_VALU_TRANS_F16) + (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + (2 * SQ_INSTS_VALU_FMA_F32) + SQ_INSTS_VALU_TRANS_F32) + (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + (2 * SQ_INSTS_VALU_FMA_F64) + SQ_INSTS_VALU_TRANS_F64) )) + (SQ_INSTS_VALU_MFMA_MOPS_F16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F32 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F64 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F8 * 512) ) / SUM( TCP_TOTAL_CACHE_ACCESSES_sum * 64 ) )
    - Performance (GFLOPs):
        value: ( SUM( ($wave_size * ( (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + (2 * SQ_INSTS_VALU_FMA_F16) + SQ_INSTS_VALU_TRANS_F16) + (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + (2 * SQ_INSTS_VALU_FMA_F32) + SQ_INSTS_VALU_TRANS_F32) + (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + (2 * SQ_INSTS_VALU_FMA_F64) + SQ_INSTS_VALU_TRANS_F64) )) + (SQ_INSTS_VALU_MFMA_MOPS_F16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F32 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F64 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F8 * 512) ) / (SUM(End_Timestamp - Start_Timestamp) / 1e9) ) / 1e9
- Panel Config:
    id: 600
  metric_table:
    id: 601
    metrics:
    - Scheduler-Pipe Utilization:
        avg: SUM(100 * SPI_CSN_BUSY) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $pipes_per_gpu * $se_per_gpu)
        min: MIN(100 * SPI_CSN_BUSY / ($GRBM_GUI_ACTIVE_PER_XCD * $pipes_per_gpu * $se_per_gpu))
        max: MAX(100 * SPI_CSN_BUSY / ($GRBM_GUI_ACTIVE_PER_XCD * $pipes_per_gpu * $se_per_gpu))
    - Dispatched Workgroups:
        avg: AVG(SPI_CSN_NUM_THREADGROUPS)
        min: MIN(SPI_CSN_NUM_THREADGROUPS)
        max: MAX(SPI_CSN_NUM_THREADGROUPS)
    - Dispatched Wavefronts:
        avg: AVG(SPI_CSN_WAVE)
        min: MIN(SPI_CSN_WAVE)
        max: MAX(SPI_CSN_WAVE)
    - VGPR Writes:
        avg: SUM(4 * SPI_VWC_CSC_WR) / SUM(SPI_CSN_WAVE)
        min: MIN(4 * SPI_VWC_CSC_WR / SPI_CSN_WAVE)
        max: MAX(4 * SPI_VWC_CSC_WR / SPI_CSN_WAVE)
    - SGPR Writes:
        avg: SUM(1 * SPI_SWC_CSC_WR) / SUM(SPI_CSN_WAVE)
        min: MIN(1 * SPI_SWC_CSC_WR / SPI_CSN_WAVE)
        max: MAX(1 * SPI_SWC_CSC_WR / SPI_CSN_WAVE)
