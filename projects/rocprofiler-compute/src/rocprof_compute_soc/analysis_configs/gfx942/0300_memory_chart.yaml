Panel Config:
  id: 300
  title: Memory Chart
  data source:
  - metric_table:
      id: 301
      title: Memory Chart
      header:
        metric: Metric
        value: Value
      metric:
        Wavefront Occupancy:
          value: ROUND(SUM(SQ_LEVEL_WAVES_ACCUM) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $numActiveCUs),
            0)
        VGPR:
          value: ROUND(AVG(Arch_VGPR), 0)
        SGPR:
          value: ROUND(AVG(SGPR), 0)
        LDS Allocation:
          value: ROUND(AVG(LDS_Per_Workgroup), 0)
        Scratch Allocation:
          value: ROUND(AVG(Scratch_Per_Workitem), 0)
        Workgroups:
          value: ROUND(AVG(SPI_CSN_NUM_THREADGROUPS), 0)
        Flat Read:
          value: ROUND(SUM(TA_FLAT_READ_WAVEFRONTS_sum) / SUM($denom), 0)
        Flat Write:
          value: ROUND(SUM(TA_FLAT_WRITE_WAVEFRONTS_sum) / SUM($denom), 0)
        Flat Atomic:
          value: ROUND(SUM(TA_FLAT_ATOMIC_WAVEFRONTS_sum) / SUM($denom), 0)
        Buffer Read:
          value: ROUND(SUM(TA_BUFFER_READ_WAVEFRONTS_sum) / SUM($denom), 0)
        Buffer Write:
          value: ROUND(SUM(TA_BUFFER_WRITE_WAVEFRONTS_sum) / SUM($denom), 0)
        Buffer Atomic:
          value: ROUND(SUM(TA_BUFFER_ATOMIC_WAVEFRONTS_sum) / SUM($denom), 0)
        LDS Req:
          value: ROUND(SUM(SQ_INSTS_LDS) / SUM($denom), 0)
        LDS Util:
          value: ROUND(100 * SUM(SQ_LDS_IDX_ACTIVE) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu), 0)
        VL1 Hit:
          value: ROUND(100 - 100 * SUM(TCP_TCC_READ_REQ_sum + TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum) / SUM(TCP_TOTAL_CACHE_ACCESSES_sum), 0)
        VL1 Coalesce:
          value: ROUND(100 * 64 * SUM(TA_TOTAL_WAVEFRONTS_sum) / (4 * SUM(TCP_TOTAL_ACCESSES_sum)), 0)
        VL1_L2 Read BW:
          value: 128 * SUM(TCP_TCC_READ_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        VL1_L2 Write BW:
          value: 64 * SUM(TCP_TCC_WRITE_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        VL1_L2 Atomic BW:
          value: 64 * SUM(TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        sL1D Rd:
          value: ROUND(SUM(SQC_DCACHE_REQ) / SUM($denom), 0)
        sL1D Hit:
          value: ROUND(100 * SUM(SQC_DCACHE_HITS) / SUM(SQC_DCACHE_REQ), 0)
        sL1D_L2 Read BW:
          value: 64 * SUM(SQC_TC_DATA_READ_REQ) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
