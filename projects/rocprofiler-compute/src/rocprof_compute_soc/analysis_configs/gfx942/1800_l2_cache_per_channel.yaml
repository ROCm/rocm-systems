# AUTOGENERATED FILE. Only edit for testing purposes, not for development. Generated from utils/unified_config.yaml. Generated by utils/split_config.py
Panel Config:
  id: 1800
  title: L2 Cache (per Channel)
  data source:
  - metric_table:
      id: 1801
      title: Aggregate Stats (All channels)
      header:
        metric: Metric
        avg: Avg
        std dev: Std Dev
        min: Min
        max: Max
        unit: Unit
      metric:
        L2 Cache Hit Rate:
          avg: 100 * SUM(TCC_HIT_sum) / SUM(TCC_HIT_sum + TCC_MISS_sum)
          std dev: 100 * STD(TCC_HIT_sum / (TCC_HIT_sum + TCC_MISS_sum))
          min: 100 * MIN(TCC_HIT_sum / (TCC_HIT_sum + TCC_MISS_sum))
          max: 100 * MAX(TCC_HIT_sum / (TCC_HIT_sum + TCC_MISS_sum))
          unit: Percent
  - metric_table:
      id: 1802
      title: L2 Cache Hit Rate (Percent)
      header:
        metric: Metric
        expr: Expression
      metric:
        "Channel ::_1":
          expr: 100 * TCC_HIT[::_1] / (TCC_HIT[::_1] + TCC_MISS[::_1])
        placeholder_range:
          ::_1: $total_l2_chan
      cli_style: simple_box
  - metric_table:
      id: 1803
      title: L2 Requests (per normUnit)
      header:
        metric: Metric
        expr: Expression
      metric:
        "Channel ::_1":
          expr: TO_INT(TCC_REQ[::_1]) / $denom
        placeholder_range:
          ::_1: $total_l2_chan
      cli_style: simple_box
  - metric_table:
      id: 1804
      title: L2 Requests (per normUnit)
      header:
        metric: Metric
        read req: L2 Read
        write req: L2 Write
        atomic req: L2 Atomic
      metric:
        "Channel ::_1":
          read req: SUM(TO_INT(TCC_READ[::_1])) / SUM($denom)
          write req: SUM(TO_INT(TCC_WRITE[::_1])) / SUM($denom)
          atomic req: SUM(TO_INT(TCC_ATOMIC[::_1])) / SUM($denom)
        placeholder_range:
          ::_1: $total_l2_chan
      cli_style: simple_multiple_bar
  - metric_table:
      id: 1805
      title: L2-Fabric Requests (per normUnit)
      header:
        metric: Metric
        read req: L2-Fabric Read
        write req: L2-Fabric Write and Atomic
        atomic req: L2-Fabric Atomic
      metric:
        "Channel ::_1":
          read req: SUM(TO_INT(TCC_EA0_RDREQ[::_1])) / SUM($denom)
          write req: SUM(TO_INT(TCC_EA0_WRREQ[::_1])) / SUM($denom)
          atomic req: SUM(TO_INT(TCC_EA0_ATOMIC[::_1])) / SUM($denom)
        placeholder_range:
          ::_1: $total_l2_chan
      cli_style: simple_multiple_bar
  - metric_table:
      id: 1806
      title: L2-Fabric Read Latency (Cycles)
      header:
        metric: Metric
        expr: Expression
      metric:
        "Channel ::_1":
          expr: TCC_EA0_RDREQ_LEVEL[::_1] / TCC_EA0_RDREQ[::_1]
        placeholder_range:
          ::_1: $total_l2_chan
      cli_style: simple_box
  - metric_table:
      id: 1807
      title: L2-Fabric Write and Atomic Latency (Cycles)
      header:
        metric: Metric
        expr: Expression
      metric:
        "Channel ::_1":
          expr: TCC_EA0_WRREQ_LEVEL[::_1] / TCC_EA0_WRREQ[::_1]
        placeholder_range:
          ::_1: $total_l2_chan
      cli_style: simple_box
  - metric_table:
      id: 1808
      title: L2-Fabric Atomic Latency (Cycles)
      header:
        metric: Metric
        expr: Expression
      metric:
        "Channel ::_1":
          expr: TCC_EA0_ATOMIC_LEVEL[::_1] / TCC_EA0_ATOMIC[::_1] if TCC_EA0_ATOMIC[::_1] != 0 else 0
        placeholder_range:
          ::_1: $total_l2_chan
      cli_style: simple_box
  - metric_table:
      id: 1809
      title: L2-Fabric Read Stall (Cycles per normUnit)
      header:
        metric: Metric
        ea read stall - pcie: L2-Fabric Read Stall (PCIe)
        ea read stall - if: "L2-Fabric Read Stall (Infinity Fabric\u2122)"
        ea read stall - hbm: L2-Fabric Read Stall (HBM)
      metric:
        "Channel ::_1":
          ea read stall - pcie: None
          ea read stall - if: None
          ea read stall - hbm: None
        placeholder_range:
          ::_1: $total_l2_chan
      cli_style: simple_multiple_bar
  - metric_table:
      id: 1810
      title: L2-Fabric Write and Atomic Stall (Cycles per normUnit)
      header:
        metric: Metric
        ea write stall - pcie: L2-Fabric Write Stall (PCIe)
        ea write stall - if: "L2-Fabric Write Stall (Infinity Fabric\u2122)"
        ea write stall - hbm: L2-Fabric Write Stall (HBM)
        ea write stall - starve: L2-Fabric Write Starve
      metric:
        "Channel ::_1":
          ea write stall - pcie: None
          ea write stall - if: None
          ea write stall - hbm: None
          ea write stall - starve: SUM(TO_INT(TCC_TOO_MANY_EA_WRREQS_STALL[::_1])) / SUM($denom)
        placeholder_range:
          ::_1: $total_l2_chan
      cli_style: simple_multiple_bar
  - metric_table:
      id: 1812
      title: L2-Fabric (128B read requests per normUnit)
      header:
        metric: Metric
        expr: Expression
      metric:
        "Channel ::_1":
          expr: TO_INT(TCC_BUBBLE[::_1]) / $denom
        placeholder_range:
          ::_1: $total_l2_chan
      cli_style: simple_box
  metrics_description:
    L2 Cache Hit Rate: The percent of total number of requests to the L2 from all
      clients that hit in the cache. As noted in the Speed-of-Light section, this
      includes hit-on-miss requests.
