Panel Config:
  id: 1300
  title: Instruction Cache
  data source:
  - metric_table:
      id: 1301
      title: L1I Speed-of-Light
      header:
        metric: Metric
        value: Avg
        unit: Unit
      metric:
        Bandwidth Utilization:
          expr: ((SQC_ICACHE_REQ * 100000) / (($max_sclk * $sqc_per_gpu) * (End_Timestamp - Start_Timestamp)))
          unit: Percent
        Cache Hit Rate:
          expr: ((SQC_ICACHE_HITS * 100) / ((SQC_ICACHE_HITS + SQC_ICACHE_MISSES) + SQC_ICACHE_MISSES_DUPLICATE))
          unit: Percent
        L1I-L2 Bandwidth Utilization:
          expr: ((SQC_TC_INST_REQ * 100000) / (2 * ($max_sclk * $sqc_per_gpu) * (End_Timestamp - Start_Timestamp)))
          unit: Percent
      comparable: false
      cli_style: simple_bar
      tui_style: simple_bar
  - metric_table:
      id: 1302
      title: L1I cache accesses
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Req:
          expr: (SQC_ICACHE_REQ / $denom)
          unit: (Requests + $normUnit)
        Hits:
          expr: (SQC_ICACHE_HITS / $denom)
          unit: (Requests + $normUnit)
        Misses - Non Duplicated:
          expr: (SQC_ICACHE_MISSES / $denom)
          unit: (Requests + $normUnit)
        Misses - Duplicated:
          expr: (SQC_ICACHE_MISSES_DUPLICATE / $denom)
          unit: (Requests + $normUnit)
        Cache Hit Rate:
          expr: ((100 * SQC_ICACHE_HITS) / ((SQC_ICACHE_HITS + SQC_ICACHE_MISSES) + SQC_ICACHE_MISSES_DUPLICATE))
          unit: Percent
        Instruction Fetch Latency:
          expr: (SQ_ACCUM_PREV_HIRES / SQ_IFETCH)
          unit: Cycles
          coll_level: SQ_IFETCH_LEVEL
  - metric_table:
      id: 1303
      title: L1I <-> L2 interface
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        L1I-L2 Bandwidth:
          expr: ((SQC_TC_INST_REQ * 64) / (End_Timestamp - Start_Timestamp))
          unit: Gbps
  metrics_description:
    Bandwidth Utilization: The number of bytes looked up in the L1I cache, as a percent of the peak theoretical bandwidth. Calculated as the ratio of L1I requests over the total L1I cycles.
    Cache Hit Rate: The percent of L1I requests that hit [#l1i-cache]_ on a previously loaded line the cache. Calculated as the ratio of the number of L1I requests that hit over the number of all L1I requests.
    L1I-L2 Bandwidth Utilization: >-
      The percent of the peak theoretical L1I \u2192 L2 cache request bandwidth
      achieved. Calculated as the ratio of the total number of requests from the
      L1I to the L2 cache over the total L1I-L2 interface cycles.
    L1I-L2 Bandwidth: Total number of bytes transferred across L1I - L2 interface divided by total duration.
    Req: The total number of requests made to the L1I per normalization-unit
    Hits: The total number of L1I requests that hit on a previously loaded cache line, per normalization-unit.
    Misses - Non Duplicated: The total number of L1I requests that missed on a cache line that were not already pending due to another request, per normalization-unit.
    Misses - Duplicated: The total number of L1I requests that missed on a cache line that were already pending due to another request, per normalization-unit.
    Instruction Fetch Latency: The average number of cycles spent to fetch instructions to a CU.
