# One definition per collectable on this architecture. A panel metric_table
# that names _collect.<name> gets the row appended when the panel is loaded.
collectables:
  valu_flops_f16:
    id: collect.valu_flops_f16
    formula: 64 * SUM(SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + SQ_INSTS_VALU_TRANS_F16 + 2 * SQ_INSTS_VALU_FMA_F16) / SUM(End_Timestamp - Start_Timestamp)
  valu_flops_f32:
    id: collect.valu_flops_f32
    formula: 64 * SUM(SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + SQ_INSTS_VALU_TRANS_F32 + 2 * SQ_INSTS_VALU_FMA_F32) / SUM(End_Timestamp - Start_Timestamp)
  valu_flops_f64:
    id: collect.valu_flops_f64
    formula: 64 * SUM(SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + SQ_INSTS_VALU_TRANS_F64 + 2 * SQ_INSTS_VALU_FMA_F64) / SUM(End_Timestamp - Start_Timestamp)
  vl1d_hit_non_rw:
    id: collect.vl1d_hit_non_rw
    formula: 100 * SUM(TCP_TOTAL_CACHE_ACCESSES_sum - (TCP_TCC_READ_REQ_sum + TCP_TCC_WRITE_REQ_sum)) / SUM(TCP_TOTAL_CACHE_ACCESSES_sum)
  vl1d_hit_atom:
    id: collect.vl1d_hit_atom
    formula: -100 * SUM(TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum) / SUM(TCP_TOTAL_CACHE_ACCESSES_sum)
  hbm_rd_bw:
    id: collect.hbm_rd_bw
    formula: SUM(TCC_EA0_RDREQ_128B_sum * 128 + TCC_EA0_RDREQ_32B_sum * 32 + TCC_EA0_RDREQ_64B_sum * 64) / SUM(End_Timestamp - Start_Timestamp)
  hbm_wr_bw:
    id: collect.hbm_wr_bw
    formula: SUM((TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32 + TCC_EA0_WRREQ_64B_sum * 64) / SUM(End_Timestamp - Start_Timestamp)
  ai_flops_f16:
    id: collect.ai_flops_f16
    formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + 2 * SQ_INSTS_VALU_FMA_F16 + SQ_INSTS_VALU_TRANS_F16))
  ai_flops_f32:
    id: collect.ai_flops_f32
    formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + 2 * SQ_INSTS_VALU_FMA_F32 + SQ_INSTS_VALU_TRANS_F32))
  ai_flops_f64:
    id: collect.ai_flops_f64
    formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + 2 * SQ_INSTS_VALU_FMA_F64 + SQ_INSTS_VALU_TRANS_F64))
  ai_flops_mfma_f16:
    id: collect.ai_flops_mfma_f16
    formula: SUM(SQ_INSTS_VALU_MFMA_MOPS_F16 * 512)
  ai_flops_mfma_bf16:
    id: collect.ai_flops_mfma_bf16
    formula: SUM(SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512)
  ai_flops_mfma_f32:
    id: collect.ai_flops_mfma_f32
    formula: SUM(SQ_INSTS_VALU_MFMA_MOPS_F32 * 512)
  ai_flops_mfma_f64:
    id: collect.ai_flops_mfma_f64
    formula: SUM(SQ_INSTS_VALU_MFMA_MOPS_F64 * 512)
  ai_flops_mfma_f8:
    id: collect.ai_flops_mfma_f8
    formula: SUM(SQ_INSTS_VALU_MFMA_MOPS_F8 * 512)
  ai_flops_mfma_f6f4:
    id: collect.ai_flops_mfma_f6f4
    formula: SUM(SQ_INSTS_VALU_MFMA_MOPS_F6F4 * 512)
  hbm_rd_bytes:
    id: collect.hbm_rd_bytes
    formula: SUM(TCC_EA0_RDREQ_128B_sum * 128 + TCC_EA0_RDREQ_32B_sum * 32 + TCC_EA0_RDREQ_64B_sum * 64)
  hbm_wr_bytes:
    id: collect.hbm_wr_bytes
    formula: SUM((TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32 + TCC_EA0_WRREQ_64B_sum * 64)
  l2_bytes:
    id: collect.l2_bytes
    formula: 128 * SUM(TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum + TCP_TCC_READ_REQ_sum)
  l1_bytes:
    id: collect.l1_bytes
    formula: 128 * SUM(TCP_TOTAL_CACHE_ACCESSES_sum)
  lds_bytes:
    id: collect.lds_bytes
    formula: SUM((SQ_LDS_IDX_ACTIVE - SQ_LDS_BANK_CONFLICT) * 4 * $lds_banks_per_cu)
  perf_valu_f16:
    id: collect.perf_valu_f16
    formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + 2 * SQ_INSTS_VALU_FMA_F16 + SQ_INSTS_VALU_TRANS_F16)) / SUM(End_Timestamp - Start_Timestamp)
  perf_valu_f32:
    id: collect.perf_valu_f32
    formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + 2 * SQ_INSTS_VALU_FMA_F32 + SQ_INSTS_VALU_TRANS_F32)) / SUM(End_Timestamp - Start_Timestamp)
  perf_valu_f64:
    id: collect.perf_valu_f64
    formula: SUM($wave_size * (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + 2 * SQ_INSTS_VALU_FMA_F64 + SQ_INSTS_VALU_TRANS_F64)) / SUM(End_Timestamp - Start_Timestamp)
  perf_mfma_f16:
    id: collect.perf_mfma_f16
    formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F16) / SUM(End_Timestamp - Start_Timestamp)
  perf_mfma_bf16:
    id: collect.perf_mfma_bf16
    formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_BF16) / SUM(End_Timestamp - Start_Timestamp)
  perf_mfma_f32:
    id: collect.perf_mfma_f32
    formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F32) / SUM(End_Timestamp - Start_Timestamp)
  perf_mfma_f64:
    id: collect.perf_mfma_f64
    formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F64) / SUM(End_Timestamp - Start_Timestamp)
  perf_mfma_f8:
    id: collect.perf_mfma_f8
    formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F8) / SUM(End_Timestamp - Start_Timestamp)
  perf_mfma_f6f4:
    id: collect.perf_mfma_f6f4
    formula: 512 * SUM(SQ_INSTS_VALU_MFMA_MOPS_F6F4) / SUM(End_Timestamp - Start_Timestamp)
  ipc_issued_a:
    id: collect.ipc_issued_a
    formula: SUM(SQ_INSTS_VALU + SQ_INSTS_VMEM + SQ_INSTS_SALU + SQ_INSTS_SMEM) / SUM(SQ_ACTIVE_INST_ANY)
  ipc_issued_b:
    id: collect.ipc_issued_b
    formula: SUM(SQ_INSTS_BRANCH + SQ_INSTS_SENDMSG + SQ_INSTS_VSKIPPED + SQ_INSTS_LDS) / SUM(SQ_ACTIVE_INST_ANY)
  flops_total_a:
    id: collect.flops_total_a
    formula: SUM(64 * (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + SQ_INSTS_VALU_TRANS_F16 + SQ_INSTS_VALU_FMA_F16 * 2) + 512 * SQ_INSTS_VALU_MFMA_MOPS_F8 + 512 * SQ_INSTS_VALU_MFMA_MOPS_F16 + 512 * SQ_INSTS_VALU_MFMA_MOPS_BF16) / SUM($denom)
  flops_total_b:
    id: collect.flops_total_b
    formula: SUM(64 * (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + SQ_INSTS_VALU_TRANS_F32 + SQ_INSTS_VALU_FMA_F32 * 2) + 512 * SQ_INSTS_VALU_MFMA_MOPS_F32) / SUM($denom)
  flops_total_c:
    id: collect.flops_total_c
    formula: SUM(64 * (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + SQ_INSTS_VALU_TRANS_F64 + SQ_INSTS_VALU_FMA_F64 * 2) + 512 * SQ_INSTS_VALU_MFMA_MOPS_F64 + 512 * SQ_INSTS_VALU_MFMA_MOPS_F6F4) / SUM($denom)
  td_read_load:
    id: collect.td_read_load
    formula: SUM(TD_LOAD_WAVEFRONT_sum) / SUM($denom)
  td_read_store_atomic_corr:
    id: collect.td_read_store_atomic_corr
    formula: SUM(-(TD_STORE_WAVEFRONT_sum + TD_ATOMIC_WAVEFRONT_sum)) / SUM($denom)
  vl1d_hits_non_rw:
    id: collect.vl1d_hits_non_rw
    formula: SUM(TCP_TOTAL_CACHE_ACCESSES_sum - (TCP_TCC_READ_REQ_sum + TCP_TCC_WRITE_REQ_sum)) / SUM($denom)
  vl1d_hits_atom:
    id: collect.vl1d_hits_atom
    formula: SUM(-(TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum)) / SUM($denom)
