# Experimental uses
Panel Config:
  id: 3000
  title: Memory Bandwidth Analysis
  data source:
  - metric_table:
      id: 3001
      title: L1 Cache
      header:
        metric: Metric
        value: Avg
        unit: Unit
      metric:
        L1 Cache stalled by L2:
          value: SUM((TCP_TCR_TCP_STALL_CYCLES * 100)) / SUM(TCP_GATE_EN2_sum)
          unit: Percent
        L1 Cache - TA coalesce rate:
          value: SUM(((4 * TA_BUFFER_WAVEFRONTS_sum) * 100)) / SUM(TA_BUFFER_TOTAL_CYCLES_sum)
          unit: Percent
        L1 Cache - TA stalled by TCP:
          value: SUM((TCP_TCP_TA_ADDR_STALL_CYCLES_sum * 100)) / SUM(TCP_GATE_EN2_sum)
          unit: Percent
        L1 Cache - Tag RAM 0 Req:
          value: SUM(TCP_TAGRAM0_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        L1 Cache - Tag RAM 1 Req:
          value: SUM(TCP_TAGRAM1_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        L1 Cache - Tag RAM 2 Req:
          value: SUM(TCP_TAGRAM2_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        L1 Cache - Tag RAM 3 Req:
          value: SUM(TCP_TAGRAM3_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        L1 Cache - VMEM stalled by L1 Cache:
          value: SUM((SQ_VMEM_TA_CMD_FIFO_FULL * 100)) / SUM(SQ_BUSY_CYCLES)
          unit: Percent
        L1 Cache - TCP stalled caused by UTCL1:
          value: SUM((TCP_UTCL1_STALL_INFLIGHT_MAX_sum * 100)) / SUM(TCP_GATE_EN2_sum)
          unit: Percent
        L1 Cache - TCP stalled caused by UTCL2:
          value: SUM((TCP_UTCL1_STALL_LFIFO_NO_RES_sum * 100)) / SUM(TCP_GATE_EN2_sum)
          unit: Percent
  - metric_table:
      id: 3002
      title: L1 traffic
      header:
        metric: Metric
        value: Avg
        unit: Unit
      metric:
        VMEM issue rate:
          value: SUM(SQ_INSTS_VMEM) / SUM(SQ_WAVE_CYCLES)
          unit: Instructions per Cycle
        CU-L1 throughput:
          value: SUM(TCP_TOTAL_ACCESSES_sum) / SUM(TCP_GATE_EN2_sum)
          unit: Requests per Cycle
        L1-CU throughput:
          value: SUM(TD_LOAD_WAVEFRONT_sum) / SUM(TD_TD_BUSY_sum)
          unit: Instructions per Cycle
        L1 in bound traffic (TA_TOTAL_WAVEFRONTS):
          value: SUM(TA_TOTAL_WAVEFRONTS_sum) / SUM($denom)
          unit: (Instructions + $normUnit)
        L1 utilization:
          value: SUM((TCP_GATE_EN2_sum * 100)) / SUM(TCP_GATE_EN1_sum)
          unit: Percent
        L1 processing rate:
          value: SUM(TA_TOTAL_WAVEFRONTS_sum) / SUM(TA_TA_BUSY_sum)
          unit: Instructions per Cycle
        L1 latency:
          value: SUM(TCP_TCP_LATENCY_sum) / SUM(TCP_TOTAL_ACCESSES_sum)
          unit: Cycles per Request
        L1-L2 throughput:
          value: SUM((TCP_TCC_READ_REQ_sum + TCP_TCC_WRITE_REQ_sum)) / SUM(TCP_GATE_EN2_sum)
          unit: Requests per Cycle
        L2 read latency:
          value: SUM(TCP_TCC_READ_REQ_LATENCY_sum) / SUM(TCP_TCC_READ_REQ_sum)
          unit: Cycles per Request
        L2 write latency:
          value: SUM(TCP_TCC_WRITE_REQ_LATENCY_sum) / SUM(TCP_TCC_WRITE_REQ_sum)
          unit: Cycles per Request
  - metric_table:
      id: 3003
      title: Raw Counter Value
      header:
        metric: Metric
        value: Avg
        unit: Unit
      metric:
        TCP_TCR_TCP_STALL_CYCLES:
          value: SUM(TCP_TCR_TCP_STALL_CYCLES_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCP Busy (TCP_GATE_EN2_sum):
          value: SUM(TCP_GATE_EN2_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TA_BUFFER_WAVEFRONTS:
          value: SUM(TA_BUFFER_WAVEFRONTS_sum) / SUM($denom)
          unit: (Instructions + $normUnit)
        TA_BUFFER_TOTAL_CYCLES (# of buffer memory accesses cycles):
          value: SUM(TA_BUFFER_TOTAL_CYCLES_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCP_TCP_TA_ADDR_STALL_CYCLES:
          value: SUM(TCP_TCP_TA_ADDR_STALL_CYCLES_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        SQ_VMEM_TA_CMD_FIFO_FULL:
          value: SUM(SQ_VMEM_TA_CMD_FIFO_FULL) / SUM($denom)
          unit: (Cycles + $normUnit)
        SQ_BUSY_CYCLES:
          value: SUM(SQ_BUSY_CYCLES) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCP_UTCL1_STALL_INFLIGHT_MAX:
          value: SUM(TCP_UTCL1_STALL_INFLIGHT_MAX_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCP_UTCL1_STALL_LFIFO_NO_RES:
          value: SUM(TCP_UTCL1_STALL_LFIFO_NO_RES_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        SQ_INSTS_VMEM:
          value: SUM(SQ_INSTS_VMEM) / SUM($denom)
          unit: (Instructions + $normUnit)
        SQ_WAVE_CYCLES:
          value: SUM(SQ_WAVE_CYCLES) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCP_TOTAL_ACCESSES:
          value: SUM(TCP_TOTAL_ACCESSES_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TD_LOAD_WAVEFRONT:
          value: SUM(TD_LOAD_WAVEFRONT_sum) / SUM($denom)
          unit: (Instructions + $normUnit)
        TD_TD_BUSY:
          value: SUM(TD_TD_BUSY_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TA_TOTAL_WAVEFRONTS:
          value: SUM(TA_TOTAL_WAVEFRONTS_sum) / SUM($denom)
          unit: (Instructions + $normUnit)
        TCP_GATE_EN1 (# of free running cycles):
          value: SUM(TCP_GATE_EN1_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TA_TA_BUSY:
          value: SUM(TA_TA_BUSY_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCP_TCP_LATENCY:
          value: SUM(TCP_TCP_LATENCY_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCP_TCC_READ_REQ:
          value: SUM(TCP_TCC_READ_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCP_TCC_WRITE_REQ:
          value: SUM(TCP_TCC_WRITE_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCP_TCC_READ_REQ_LATENCY:
          value: SUM(TCP_TCC_READ_REQ_LATENCY_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCP_TCC_WRITE_REQ_LATENCY:
          value: SUM(TCP_TCC_WRITE_REQ_LATENCY_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCP_TOTAL_CACHE_ACCESSES:
          value: SUM(TCP_TOTAL_CACHE_ACCESSES_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        Num CUs:
          value: $cu_per_gpu
          unit: Count
        TCP_TCC_ATOMIC_WITH_RET_REQ:
          value: SUM(TCP_TCC_ATOMIC_WITH_RET_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCP_TCC_ATOMIC_WITHOUT_RET_REQ:
          value: SUM(TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
  - metric_table:
      id: 3004
      title: L2 Cache
      header:
        metric: Metric
        value: Avg
        unit: Unit
      metric:
        L2 hit rate:
          value: SUM(((100 * TCC_HIT_sum) / (TCC_HIT_sum + TCC_MISS_sum))
            if ((TCC_HIT_sum + TCC_MISS_sum) != 0) else None)
          unit: pct
        L2 utilization:
          value: SUM(((TCC_BUSY_sum * 100) / (TO_INT($total_l2_chan) * $GRBM_GUI_ACTIVE_PER_XCD)))
          unit: pct
        L2 tag stall rate:
          value: SUM(((TCC_TAG_STALL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2 input buffer stall rate:
          value: SUM(((TCC_IB_STALL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2 latency FIFO full rate:
          value: SUM(((TCC_LATENCY_FIFO_FULL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2 write data FIFO full rate:
          value: SUM(((TCC_SRC_FIFO_FULL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2-EA write stall rate:
          value: SUM(((TCC_EA0_WRREQ_STALL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2-EA too many writes stall:
          value: SUM(((TCC_TOO_MANY_EA_WRREQS_STALL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2-EA read credit stall (HBM):
          value: SUM(((TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2-EA write credit stall (HBM):
          value: SUM(((TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2-EA read credit stall (IF):
          value: SUM(((TCC_EA0_RDREQ_GMI_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2-EA write credit stall (IF):
          value: SUM(((TCC_EA0_WRREQ_GMI_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2-EA read credit stall (IO):
          value: SUM(((TCC_EA0_RDREQ_IO_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2-EA write credit stall (IO):
          value: SUM(((TCC_EA0_WRREQ_IO_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
  - metric_table:
      id: 3005
      title: L2 Traffic
      header:
        metric: Metric
        value: Avg
        unit: Unit
      metric:
        L2 read request rate:
          value: SUM(TCC_READ_sum) / SUM(TCC_BUSY_sum)
          unit: Requests per Cycle
        L2 write request rate:
          value: SUM(TCC_WRITE_sum) / SUM(TCC_BUSY_sum)
          unit: Requests per Cycle
        L2 total request rate:
          value: SUM(TCC_REQ_sum) / SUM(TCC_BUSY_sum)
          unit: Requests per Cycle
        L2-EA read latency:
          value: SUM((TCC_EA0_RDREQ_LEVEL_sum / TCC_EA0_RDREQ_sum)
            if (TCC_EA0_RDREQ_sum != 0) else None)
          unit: Cycles per Request
        L2-EA write latency:
          value: SUM((TCC_EA0_WRREQ_LEVEL_sum / TCC_EA0_WRREQ_sum)
            if (TCC_EA0_WRREQ_sum != 0) else None)
          unit: Cycles per Request
        L2-EA atomic latency:
          value: SUM((TCC_EA0_ATOMIC_LEVEL_sum / TCC_EA0_ATOMIC_sum)
            if (TCC_EA0_ATOMIC_sum != 0) else None)
          unit: Cycles per Request
        L2 writeback rate:
          value: SUM(((TCC_WRITEBACK_sum * 100) / TCC_REQ_sum)
            if (TCC_REQ_sum != 0) else None)
          unit: pct
        L2 eviction rate:
          value: SUM(((TCC_NORMAL_EVICT_sum * 100) / TCC_REQ_sum)
            if (TCC_REQ_sum != 0) else None)
          unit: pct
        L2-EA read BW:
          value: SUM(((TCC_EA0_RDREQ_32B_sum * 32) + (TCC_EA0_RDREQ_64B_sum * 64)
            + (TCC_EA0_RDREQ_128B_sum * 128)) / SUM(End_Timestamp - Start_Timestamp))
          unit: GB/s
        L2-EA write and atomic BW:
          value: SUM(((TCC_EA0_WRREQ_64B_sum * 64) + ((TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum)
            * 32)) / SUM(End_Timestamp - Start_Timestamp))
          unit: GB/s
        HBM read fraction:
          value: SUM((100 * (TCC_EA0_RDREQ_DRAM_sum / TCC_EA0_RDREQ_sum))
            if (TCC_EA0_RDREQ_sum != 0) else None)
          unit: pct
        HBM write fraction:
          value: SUM((100 * (TCC_EA0_WRREQ_DRAM_sum / TCC_EA0_WRREQ_sum))
            if (TCC_EA0_WRREQ_sum != 0) else None)
          unit: pct
        Non-coherent request rate:
          value: SUM(((TCC_NC_REQ_sum * 100) / TCC_REQ_sum)
            if (TCC_REQ_sum != 0) else None)
          unit: pct
        Uncached request rate:
          value: SUM(((TCC_UC_REQ_sum * 100) / TCC_REQ_sum)
            if (TCC_REQ_sum != 0) else None)
          unit: pct
        Coherent cached request rate:
          value: SUM(((TCC_CC_REQ_sum * 100) / TCC_REQ_sum)
            if (TCC_REQ_sum != 0) else None)
          unit: pct
        Probe request rate:
          value: SUM(TCC_PROBE_sum) / SUM(TCC_BUSY_sum)
          unit: Requests per Cycle
        Probe eviction rate:
          value: SUM(((TCC_PROBE_EVICT_sum * 100) / TCC_PROBE_sum)
            if (TCC_PROBE_sum != 0) else None)
          unit: pct
  - metric_table:
      id: 3006
      title: L2 Raw Counter Values
      header:
        metric: Metric
        value: Avg
        unit: Unit
      metric:
        TCC_BUSY:
          value: SUM(TCC_BUSY_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_REQ:
          value: SUM(TCC_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_READ:
          value: SUM(TCC_READ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_WRITE:
          value: SUM(TCC_WRITE_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_ATOMIC:
          value: SUM(TCC_ATOMIC_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_HIT:
          value: SUM(TCC_HIT_sum) / SUM($denom)
          unit: (Hits + $normUnit)
        TCC_MISS:
          value: SUM(TCC_MISS_sum) / SUM($denom)
          unit: (Misses + $normUnit)
        TCC_TAG_STALL:
          value: SUM(TCC_TAG_STALL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_IB_STALL:
          value: SUM(TCC_IB_STALL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_LATENCY_FIFO_FULL:
          value: SUM(TCC_LATENCY_FIFO_FULL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_SRC_FIFO_FULL:
          value: SUM(TCC_SRC_FIFO_FULL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_WRITEBACK:
          value: SUM(TCC_WRITEBACK_sum) / SUM($denom)
          unit: (Cachelines + $normUnit)
        TCC_NORMAL_EVICT:
          value: SUM(TCC_NORMAL_EVICT_sum) / SUM($denom)
          unit: (Cachelines + $normUnit)
        TCC_EA0_RDREQ:
          value: SUM(TCC_EA0_RDREQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_EA0_RDREQ_32B:
          value: SUM(TCC_EA0_RDREQ_32B_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_EA0_RDREQ_64B:
          value: SUM(TCC_EA0_RDREQ_64B_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_EA0_RDREQ_128B:
          value: SUM(TCC_EA0_RDREQ_128B_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_EA0_RDREQ_LEVEL:
          value: SUM(TCC_EA0_RDREQ_LEVEL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_EA0_RDREQ_DRAM:
          value: SUM(TCC_EA0_RDREQ_DRAM_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_EA0_WRREQ:
          value: SUM(TCC_EA0_WRREQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_EA0_WRREQ_64B:
          value: SUM(TCC_EA0_WRREQ_64B_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_EA0_WRREQ_STALL:
          value: SUM(TCC_EA0_WRREQ_STALL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_EA0_WRREQ_LEVEL:
          value: SUM(TCC_EA0_WRREQ_LEVEL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_EA0_WRREQ_DRAM:
          value: SUM(TCC_EA0_WRREQ_DRAM_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_TOO_MANY_EA_WRREQS_STALL:
          value: SUM(TCC_TOO_MANY_EA_WRREQS_STALL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_EA0_ATOMIC:
          value: SUM(TCC_EA0_ATOMIC_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_EA0_ATOMIC_LEVEL:
          value: SUM(TCC_EA0_ATOMIC_LEVEL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_EA0_RDREQ_DRAM_CREDIT_STALL:
          value: SUM(TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_EA0_WRREQ_DRAM_CREDIT_STALL:
          value: SUM(TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_EA0_RDREQ_GMI_CREDIT_STALL:
          value: SUM(TCC_EA0_RDREQ_GMI_CREDIT_STALL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_EA0_WRREQ_GMI_CREDIT_STALL:
          value: SUM(TCC_EA0_WRREQ_GMI_CREDIT_STALL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_EA0_RDREQ_IO_CREDIT_STALL:
          value: SUM(TCC_EA0_RDREQ_IO_CREDIT_STALL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_EA0_WRREQ_IO_CREDIT_STALL:
          value: SUM(TCC_EA0_WRREQ_IO_CREDIT_STALL_sum) / SUM($denom)
          unit: (Cycles + $normUnit)
        TCC_NC_REQ:
          value: SUM(TCC_NC_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_UC_REQ:
          value: SUM(TCC_UC_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_CC_REQ:
          value: SUM(TCC_CC_REQ_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_PROBE:
          value: SUM(TCC_PROBE_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        TCC_PROBE_EVICT:
          value: SUM(TCC_PROBE_EVICT_sum) / SUM($denom)
          unit: (Requests + $normUnit)
        Num L2 Channels:
          value: $total_l2_chan
          unit: Count
  - metric_table:
      id: 3007
      title: Normalized L2 Stall Metrics (%)
      header:
        metric: Metric
        value: Avg
        unit: Unit
      metric:
        # Normalized stall metrics use $GRBM_GUI_ACTIVE_PER_XCD as denominator
        # This enables direct comparison with L1 stall metrics (same denominator)
        Normalized L2 - Tag stall:
          value: SUM((TCC_TAG_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
          unit: Percent
        Normalized L2 - Input buffer stall:
          value: SUM((TCC_IB_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
          unit: Percent
        Normalized L2 - Latency FIFO full:
          value: SUM((TCC_LATENCY_FIFO_FULL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
          unit: Percent
        Normalized L2 - Source FIFO full:
          value: SUM((TCC_SRC_FIFO_FULL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
          unit: Percent
        Normalized L2-EA - Write stall:
          value: SUM((TCC_EA0_WRREQ_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
          unit: Percent
        Normalized L2-EA - Too many writes stall:
          value: SUM((TCC_TOO_MANY_EA_WRREQS_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
          unit: Percent
        Normalized L2-EA - Read credit stall (HBM):
          value: SUM((TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
          unit: Percent
        Normalized L2-EA - Write credit stall (HBM):
          value: SUM((TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
          unit: Percent
        Normalized L2-EA - Read credit stall (IF):
          value: SUM((TCC_EA0_RDREQ_GMI_CREDIT_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
          unit: Percent
        Normalized L2-EA - Write credit stall (IF):
          value: SUM((TCC_EA0_WRREQ_GMI_CREDIT_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
          unit: Percent
        Normalized L2-EA - Read credit stall (IO):
          value: SUM((TCC_EA0_RDREQ_IO_CREDIT_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
          unit: Percent
        Normalized L2-EA - Write credit stall (IO):
          value: SUM((TCC_EA0_WRREQ_IO_CREDIT_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
          unit: Percent
  - metric_table:
      id: 3008
      title: Normalized L2 Throughput Metrics (per Second)
      header:
        metric: Metric
        value: Avg
        unit: Unit
      metric:
        # Normalized throughput metrics use wall-clock time for absolute measurement
        Normalized L2 read requests:
          value: SUM(TCC_READ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
          unit: Requests/s
        Normalized L2 write requests:
          value: SUM(TCC_WRITE_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
          unit: Requests/s
        Normalized L2 total requests:
          value: SUM(TCC_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
          unit: Requests/s
        Normalized L2-EA read requests:
          value: SUM(TCC_EA0_RDREQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
          unit: Requests/s
        Normalized L2-EA write requests:
          value: SUM(TCC_EA0_WRREQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
          unit: Requests/s
        Normalized L2 hits:
          value: SUM(TCC_HIT_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
          unit: Hits/s
        Normalized L2 misses:
          value: SUM(TCC_MISS_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
          unit: Misses/s
  - metric_table:
      id: 3009
      title: L2 Bottleneck Detection Indicators
      header:
        metric: Metric
        value: Avg
        unit: Unit
      metric:
        # Bottleneck detection metrics based on mi300_gpu_bandwidth.pdf guidance
        # Thresholds: >=10% back pressure or credit stall indicates bottleneck
        # Memory BW bound: High BW utilization (>80%) + High credit stalls (>10%)
        L2 Back Pressure Indicator:
          value: SUM(((TCC_IB_STALL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2 Memory BW Bound - Read Credit Pressure:
          value: SUM(((TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2 Memory BW Bound - Write Credit Pressure:
          value: SUM(((TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2 Memory BW Bound - Combined Credit Pressure:
          value: SUM((((TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum + TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum) * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2 Internal Resource Pressure - Latency FIFO:
          value: SUM(((TCC_LATENCY_FIFO_FULL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2 Internal Resource Pressure - Source FIFO:
          value: SUM(((TCC_SRC_FIFO_FULL_sum * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
        L2 Cache Efficiency:
          value: SUM(((TCC_HIT_sum * 100) / (TCC_HIT_sum + TCC_MISS_sum))
            if ((TCC_HIT_sum + TCC_MISS_sum) != 0) else None)
          unit: pct
        L2 to Memory Traffic Ratio:
          value: SUM((((TCC_EA0_RDREQ_sum + TCC_EA0_WRREQ_sum) * 100) / TCC_REQ_sum)
            if (TCC_REQ_sum != 0) else None)
          unit: pct
        L2 Remote Access Pressure (IF):
          value: SUM((((TCC_EA0_RDREQ_GMI_CREDIT_STALL_sum + TCC_EA0_WRREQ_GMI_CREDIT_STALL_sum) * 100) / TCC_BUSY_sum)
            if (TCC_BUSY_sum != 0) else None)
          unit: pct
  metrics_description:
    TCP Busy: The number of cycles TCP is processing pending requests.
    L1 Cache - L1 Cache stalled by L2: >-
      Measures backpressure from L2 Cache to L1 Cache. A high stall rate of 10% (>= 10%) indicates that L2 is the bottleneck.
      Equation: SUM((TCP_TCR_TCP_STALL_CYCLES * 100)) / SUM(TCP_GATE_EN2_sum)
    L1 Cache - TA coalesce rate: >-
      Measures the TA's capability in coalescing Buffer or Flat addresses. The optimal rate is 100%, the worst case rate is 25%. A low rate of 50% (<= 50%) indicates that TA is the bottleneck.
      Equation: SUM(((4 * TA_BUFFER_WAVEFRONTS_sum) * 100)) / SUM(TA_BUFFER_TOTAL_CYCLES_sum)
    L1 Cache - TA stalled by TCP: >-
      Measures the aggregated impact of TCP events on TA. A high stall rate of 10% (>= 10%) indicates that TCP is the bottleneck.
      Equation: SUM((TCP_TCP_TA_ADDR_STALL_CYCLES_sum * 100)) / SUM(TCP_GATE_EN2_sum)
    L1 Cache - Tag RAM 0 Req: >-
      The number of TCC (L2) requests from tagram0.
      Equation: SUM(TCP_TAGRAM0_REQ_sum) / SUM($denom)
    L1 Cache - Tag RAM 1 Req: >-
      The number of TCC (L2) requests from tagram1.
      Equation: SUM(TCP_TAGRAM1_REQ_sum) / SUM($denom)
    L1 Cache - Tag RAM 2 Req: >-
      The number of TCC (L2) requests from tagram2.
      Equation: SUM(TCP_TAGRAM2_REQ_sum) / SUM($denom)
    L1 Cache - Tag RAM 3 Req: >-
      The number of TCC (L2) requests from tagram3.
      Equation: SUM(TCP_TAGRAM3_REQ_sum) / SUM($denom)
    L1 Cache - VMEM stalled by L1 Cache: >-
      Measures backpressure from TCP to SQ. A high stall rate of 10% (>= 10%) indicates that TCP stall is backpressured to SQ.
      Equation: SUM((SQ_VMEM_TA_CMD_FIFO_FULL * 100)) / SUM(SQ_BUSY_CYCLES)
    L1 Cache - TCP stalled caused by UTCL1: >-
      Measures backpressure from UTCL1 to TCP (L1). A high stall rate of 10% (>= 10%) indicates that UTCL1 is stalled due to reaching the max inflight count.
      Equation: SUM((TCP_UTCL1_STALL_INFLIGHT_MAX_sum * 100)) / SUM(TCP_GATE_EN2_sum)
    L1 Cache - TCP stalled caused by UTCL2: >-
      Measures backpressure from UTCL2 to TCP (L1). A high stall rate of 10% (>= 10%) indicates that UTCL2 misses is the bottleneck.
      Equation: SUM((TCP_UTCL1_STALL_LFIFO_NO_RES_sum * 100)) / SUM(TCP_GATE_EN2_sum)
    VMEM issue rate: >-
      The number of VMEM instructions issued by the SQ (CU) per SQ (CU) wave cycle.
      Equation: SUM(SQ_INSTS_VMEM) / SUM(SQ_WAVE_CYCLES)
    CU-L1 throughput: >-
      The total number of TA (L1) accesses per active cycle.
      Equation: SUM(TCP_TOTAL_ACCESSES_sum) / SUM(TCP_GATE_EN2_sum)
    L1-CU throughput: >-
      The number of instructions returned to the SQ (CU) per active cycle.
      Equation: SUM(TD_LOAD_WAVEFRONT_sum) / SUM(TD_TD_BUSY_sum)
    L1 in bound traffic (TA_TOTAL_WAVEFRONTS): >-
      The number of instructions processed by TA (L1).
      Equation: SUM(TA_TOTAL_WAVEFRONTS_sum)
    L1 utilization: >-
      Active TA (L1) cycle divide by free cycle.
      Equation: SUM((TCP_GATE_EN2_sum * 100)) / SUM(TCP_GATE_EN1_sum)
    L1 processing rate: >-
      The number of instruction TA (L1) processes in one cycle.
      Equation: SUM(TA_TOTAL_WAVEFRONTS_sum) / SUM(TA_TA_BUSY_sum)
    L1 latency: >-
      The number of cycles to complete memory access instructions normalized by the total number of L1 accesses.
      Equation: SUM(TCP_TCP_LATENCY_sum) / SUM(TCP_TOTAL_ACCESSES_sum)
    L1-L2 throughput: >-
      The total number of TCC (L2) read and TCC (L2) write requests processed in a cycle.
      Equation: SUM((TCP_TCC_READ_REQ_sum + TCP_TCC_WRITE_REQ_sum)) / SUM(TCP_GATE_EN2_sum)
    L2 read latency: >-
      The number of cycles to get 1 cache read response from TCC (L2), including reads and atomics with return.
      Equation: SUM(TCP_TCC_READ_REQ_LATENCY_sum) / SUM(TCP_TCC_READ_REQ_sum)
    L2 write latency: >-
      The number of cycles to get 1 cache write response from TCC (L2), including writes and atomics without return.
      Equation: SUM(TCP_TCC_WRITE_REQ_LATENCY_sum) / SUM(TCP_TCC_WRITE_REQ_sum)
    L2 hit rate: >-
      The ratio of L2 cache hits over total cache accesses (hits + misses). A low hit rate (<= 50%)
      indicates the working set exceeds L2 cache capacity.
      Equation: SUM((100 * TCC_HIT_sum) / (TCC_HIT_sum + TCC_MISS_sum))
    L2 utilization: >-
      The ratio of active L2 cycles over total available L2 cycles across all channels.
      High utilization indicates the L2 cache is heavily loaded.
      Equation: SUM((TCC_BUSY_sum * 100) / (TO_INT($total_l2_chan) * $GRBM_GUI_ACTIVE_PER_XCD))
    L2 tag stall rate: >-
      The percentage of active L2 cycles where the tag pipeline was stalled for any reason.
      A high rate (>= 10%) indicates the L2 tag pipeline is a bottleneck.
      Equation: SUM((TCC_TAG_STALL_sum * 100) / TCC_BUSY_sum)
    L2 input buffer stall rate: >-
      The percentage of active L2 cycles where the input buffer output was stalled,
      meaning L2 cannot accept new requests from L1. A high rate (>= 10%) indicates
      L2 is backpressuring L1 (L1-to-L2 interface bottleneck).
      Equation: SUM((TCC_IB_STALL_sum * 100) / TCC_BUSY_sum)
    L2 latency FIFO full rate: >-
      The percentage of active L2 cycles where the latency FIFO was full, indicating
      too many requests are pending in the L2 cache.
      Equation: SUM((TCC_LATENCY_FIFO_FULL_sum * 100) / TCC_BUSY_sum)
    L2 write data FIFO full rate: >-
      The percentage of active L2 cycles where the source data FIFO was full, indicating
      the write data path is saturated.
      Equation: SUM((TCC_SRC_FIFO_FULL_sum * 100) / TCC_BUSY_sum)
    L2-EA write stall rate: >-
      The percentage of active L2 cycles where write requests to the EA (External Agent)
      interface were stalled. A high rate (>= 10%) indicates the EA write path is saturated.
      Equation: SUM((TCC_EA0_WRREQ_STALL_sum * 100) / TCC_BUSY_sum)
    L2-EA too many writes stall: >-
      The percentage of active L2 cycles where L2 could not send a write request to EA
      because the maximum number of pending EA write requests was reached. High values
      indicate write credit starvation at the L2-to-memory interface.
      Equation: SUM((TCC_TOO_MANY_EA_WRREQS_STALL_sum * 100) / TCC_BUSY_sum)
    L2-EA read credit stall (HBM): >-
      The percentage of active L2 cycles where read requests were stalled due to HBM
      credit exhaustion. High values indicate HBM read bandwidth is saturated.
      Equation: SUM((TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
    L2-EA write credit stall (HBM): >-
      The percentage of active L2 cycles where write requests were stalled due to HBM
      credit exhaustion. High values indicate HBM write bandwidth is saturated.
      Equation: SUM((TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
    L2-EA read credit stall (IF): >-
      The percentage of active L2 cycles where read requests were stalled due to Infinity
      Fabric credit exhaustion. High values indicate remote read bandwidth is saturated.
      Equation: SUM((TCC_EA0_RDREQ_GMI_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
    L2-EA write credit stall (IF): >-
      The percentage of active L2 cycles where write requests were stalled due to Infinity
      Fabric credit exhaustion. High values indicate remote write bandwidth is saturated.
      Equation: SUM((TCC_EA0_WRREQ_GMI_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
    L2 read request rate: >-
      The number of L2 read requests per active L2 cycle, across all L2 channels.
      Equation: SUM(TCC_READ_sum) / SUM(TCC_BUSY_sum)
    L2 write request rate: >-
      The number of L2 write requests per active L2 cycle, across all L2 channels.
      Equation: SUM(TCC_WRITE_sum) / SUM(TCC_BUSY_sum)
    L2 total request rate: >-
      The total number of L2 requests per active L2 cycle, across all L2 channels.
      Equation: SUM(TCC_REQ_sum) / SUM(TCC_BUSY_sum)
    L2-EA read latency: >-
      The average number of cycles an EA read request was in flight, from the L2 side.
      Calculated as the sum of in-flight read requests divided by total read requests.
      Equation: SUM(TCC_EA0_RDREQ_LEVEL_sum) / SUM(TCC_EA0_RDREQ_sum)
    L2-EA write latency: >-
      The average number of cycles an EA write request was in flight, from the L2 side.
      Equation: SUM(TCC_EA0_WRREQ_LEVEL_sum) / SUM(TCC_EA0_WRREQ_sum)
    L2-EA atomic latency: >-
      The average number of cycles an EA atomic request was in flight, from the L2 side.
      Equation: SUM(TCC_EA0_ATOMIC_LEVEL_sum) / SUM(TCC_EA0_ATOMIC_sum)
    L2 writeback rate: >-
      The percentage of L2 requests that result in dirty cache line writebacks to memory.
      Equation: SUM((TCC_WRITEBACK_sum * 100) / TCC_REQ_sum)
    L2 eviction rate: >-
      The percentage of L2 requests that result in cache line evictions due to capacity.
      Equation: SUM((TCC_NORMAL_EVICT_sum * 100) / TCC_REQ_sum)
    L2-EA read BW: >-
      The read bandwidth from L2 to the External Agent (EA) interface, calculated from
      the mix of 32B, 64B, and 128B read request sizes.
      Equation: SUM(((TCC_EA0_RDREQ_32B_sum * 32) + (TCC_EA0_RDREQ_64B_sum * 64) + (TCC_EA0_RDREQ_128B_sum * 128)) / SUM(End_Timestamp - Start_Timestamp))
    L2-EA write and atomic BW: >-
      The write and atomic bandwidth from L2 to the External Agent (EA) interface.
      Equation: SUM(((TCC_EA0_WRREQ_64B_sum * 64) + ((TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32)) / SUM(End_Timestamp - Start_Timestamp))
    HBM read fraction: >-
      The percentage of L2-EA read requests destined for the accelerator's local HBM.
      Equation: SUM((TCC_EA0_RDREQ_DRAM_sum * 100) / TCC_EA0_RDREQ_sum)
    HBM write fraction: >-
      The percentage of L2-EA write requests destined for the accelerator's local HBM.
      Equation: SUM((TCC_EA0_WRREQ_DRAM_sum * 100) / TCC_EA0_WRREQ_sum)
    L2-EA read credit stall (IO): >-
      The percentage of active L2 cycles where read requests were stalled due to IO
      interface credit exhaustion. High values indicate PCIe/IO read bandwidth is saturated.
      Equation: SUM((TCC_EA0_RDREQ_IO_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
    L2-EA write credit stall (IO): >-
      The percentage of active L2 cycles where write requests were stalled due to IO
      interface credit exhaustion. High values indicate PCIe/IO write bandwidth is saturated.
      Equation: SUM((TCC_EA0_WRREQ_IO_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
    Non-coherent request rate: >-
      The percentage of L2 requests that are non-coherent (NC). Non-coherent requests
      bypass cache coherence checks, typically used for streaming or write-only data.
      Equation: SUM((TCC_NC_REQ_sum * 100) / TCC_REQ_sum)
    Uncached request rate: >-
      The percentage of L2 requests that are uncached (UC). Uncached requests bypass
      the L2 cache entirely, going directly to memory.
      Equation: SUM((TCC_UC_REQ_sum * 100) / TCC_REQ_sum)
    Coherent cached request rate: >-
      The percentage of L2 requests that are coherently cached (CC). These requests
      participate in cache coherence protocols.
      Equation: SUM((TCC_CC_REQ_sum * 100) / TCC_REQ_sum)
    Probe request rate: >-
      The number of external probe requests (for cache coherence) per active L2 cycle.
      High probe rates indicate significant coherence traffic.
      Equation: SUM(TCC_PROBE_sum) / SUM(TCC_BUSY_sum)
    Probe eviction rate: >-
      The percentage of probe requests that result in cache line evictions or invalidations.
      High values indicate external coherence traffic is evicting useful data.
      Equation: SUM((TCC_PROBE_EVICT_sum * 100) / TCC_PROBE_sum)
    # Table 3007: Normalized L2 Stall Metrics (%)
    # These metrics use $GRBM_GUI_ACTIVE_PER_XCD as denominator, enabling direct comparison with L1 stalls.
    Normalized L2 - Tag stall: >-
      Percentage of kernel execution time the L2 tag pipeline was stalled for any reason.
      This is the primary L2 bottleneck indicator (lump sum of all internal TCC stalls).
      Normalized to kernel cycles for cross-component comparison with L1 stalls.
      Equation: SUM((TCC_TAG_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
    Normalized L2 - Input buffer stall: >-
      Percentage of kernel execution time the L2 input buffer was stalled, meaning L2
      cannot accept new requests from L1. Indicates L1-to-L2 interface bottleneck.
      Normalized to kernel cycles for cross-component comparison.
      Equation: SUM((TCC_IB_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
    Normalized L2 - Latency FIFO full: >-
      Percentage of kernel execution time the L2 latency FIFO was full, indicating
      too many requests are pending in the L2 cache. Suggests L2 internal congestion.
      Normalized to kernel cycles for cross-component comparison.
      Equation: SUM((TCC_LATENCY_FIFO_FULL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
    Normalized L2 - Source FIFO full: >-
      Percentage of kernel execution time the L2 source data FIFO was full, indicating
      the write data path is saturated.
      Normalized to kernel cycles for cross-component comparison.
      Equation: SUM((TCC_SRC_FIFO_FULL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
    Normalized L2-EA - Write stall: >-
      Percentage of kernel execution time L2 write requests to memory (EA) were stalled.
      Normalized to kernel cycles for cross-component comparison.
      Equation: SUM((TCC_EA0_WRREQ_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
    Normalized L2-EA - Too many writes stall: >-
      Percentage of kernel execution time L2 could not send write requests to memory
      because maximum pending EA write requests was reached. Indicates write credit starvation.
      Normalized to kernel cycles for cross-component comparison.
      Equation: SUM((TCC_TOO_MANY_EA_WRREQS_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
    Normalized L2-EA - Read credit stall (HBM): >-
      Percentage of kernel execution time L2 read requests were stalled due to HBM
      credit exhaustion. High values indicate HBM read bandwidth is saturated.
      Normalized to kernel cycles for cross-component comparison.
      Equation: SUM((TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
    Normalized L2-EA - Write credit stall (HBM): >-
      Percentage of kernel execution time L2 write requests were stalled due to HBM
      credit exhaustion. High values indicate HBM write bandwidth is saturated.
      Normalized to kernel cycles for cross-component comparison.
      Equation: SUM((TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
    Normalized L2-EA - Read credit stall (IF): >-
      Percentage of kernel execution time L2 read requests were stalled due to Infinity
      Fabric credit exhaustion. High values indicate remote read bandwidth is saturated.
      Normalized to kernel cycles for cross-component comparison.
      Equation: SUM((TCC_EA0_RDREQ_GMI_CREDIT_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
    Normalized L2-EA - Write credit stall (IF): >-
      Percentage of kernel execution time L2 write requests were stalled due to Infinity
      Fabric credit exhaustion. High values indicate remote write bandwidth is saturated.
      Normalized to kernel cycles for cross-component comparison.
      Equation: SUM((TCC_EA0_WRREQ_GMI_CREDIT_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
    Normalized L2-EA - Read credit stall (IO): >-
      Percentage of kernel execution time L2 read requests were stalled due to IO
      interface credit exhaustion. High values indicate PCIe/IO read bandwidth is saturated.
      Normalized to kernel cycles for cross-component comparison.
      Equation: SUM((TCC_EA0_RDREQ_IO_CREDIT_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
    Normalized L2-EA - Write credit stall (IO): >-
      Percentage of kernel execution time L2 write requests were stalled due to IO
      interface credit exhaustion. High values indicate PCIe/IO write bandwidth is saturated.
      Normalized to kernel cycles for cross-component comparison.
      Equation: SUM((TCC_EA0_WRREQ_IO_CREDIT_STALL_sum * 100)) / SUM($GRBM_GUI_ACTIVE_PER_XCD)
    # Table 3008: Normalized L2 Throughput Metrics (per Second)
    Normalized L2 read requests: >-
      L2 read requests per second of kernel execution.
      Normalized to wall-clock time for absolute throughput measurement.
      Equation: SUM(TCC_READ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
    Normalized L2 write requests: >-
      L2 write requests per second of kernel execution.
      Normalized to wall-clock time for absolute throughput measurement.
      Equation: SUM(TCC_WRITE_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
    Normalized L2 total requests: >-
      Total L2 requests per second of kernel execution.
      Normalized to wall-clock time for absolute throughput measurement.
      Equation: SUM(TCC_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
    Normalized L2-EA read requests: >-
      L2 to memory (EA) read requests per second of kernel execution.
      Normalized to wall-clock time for absolute throughput measurement.
      Equation: SUM(TCC_EA0_RDREQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
    Normalized L2-EA write requests: >-
      L2 to memory (EA) write requests per second of kernel execution.
      Normalized to wall-clock time for absolute throughput measurement.
      Equation: SUM(TCC_EA0_WRREQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
    Normalized L2 hits: >-
      L2 cache hits per second of kernel execution.
      Normalized to wall-clock time for absolute throughput measurement.
      Equation: SUM(TCC_HIT_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
    Normalized L2 misses: >-
      L2 cache misses per second of kernel execution.
      Normalized to wall-clock time for absolute throughput measurement.
      Equation: SUM(TCC_MISS_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1000000000)
    # Table 3009: L2 Bottleneck Detection Indicators
    # Reference: mi300_gpu_bandwidth.pdf - Thresholds: >=10% back pressure indicates bottleneck
    L2 Back Pressure Indicator: >-
      Percentage of L2 busy time the input buffer was stalled.
      A rate >= 10% indicates L2 is backpressuring L1 (GL1/GL2 potential bottleneck).
      Reference: mi300_gpu_bandwidth.pdf back pressure threshold guidance.
      Equation: SUM((TCC_IB_STALL_sum * 100) / TCC_BUSY_sum)
    L2 Memory BW Bound - Read Credit Pressure: >-
      Percentage of L2 busy time read requests were stalled due to HBM credit exhaustion.
      High values (>10%) combined with high memory utilization indicate memory read bandwidth bound.
      Reference: mi300_gpu_bandwidth.pdf TCC_TAG_STALL breakdown.
      Equation: SUM((TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
    L2 Memory BW Bound - Write Credit Pressure: >-
      Percentage of L2 busy time write requests were stalled due to HBM credit exhaustion.
      High values (>10%) combined with high memory utilization indicate memory write bandwidth bound.
      Reference: mi300_gpu_bandwidth.pdf TCC_TAG_STALL breakdown.
      Equation: SUM((TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum * 100) / TCC_BUSY_sum)
    L2 Memory BW Bound - Combined Credit Pressure: >-
      Combined HBM read and write credit stall percentage.
      This is the primary memory bandwidth bound indicator. High values (>10%) with
      high memory utilization (>80%) strongly indicate memory bandwidth is the bottleneck.
      Reference: mi300_gpu_bandwidth.pdf - High BW + High TCC_TAG_STALL = memory BW bound.
      Equation: SUM(((TCC_EA0_RDREQ_DRAM_CREDIT_STALL_sum + TCC_EA0_WRREQ_DRAM_CREDIT_STALL_sum) * 100) / TCC_BUSY_sum)
    L2 Internal Resource Pressure - Latency FIFO: >-
      Percentage of L2 busy time the latency FIFO was full.
      A rate >= 10% indicates L2 internal resource exhaustion bottleneck.
      This is one of the TCC_TAG_STALL breakdown components (LFIFO full, 2-deep).
      Equation: SUM((TCC_LATENCY_FIFO_FULL_sum * 100) / TCC_BUSY_sum)
    L2 Internal Resource Pressure - Source FIFO: >-
      Percentage of L2 busy time the source data FIFO was full.
      A rate >= 10% indicates L2 write data path bottleneck.
      Equation: SUM((TCC_SRC_FIFO_FULL_sum * 100) / TCC_BUSY_sum)
    L2 Cache Efficiency: >-
      L2 cache hit rate. A low rate (<50%) indicates the working set exceeds L2 cache
      capacity, leading to high memory traffic. This helps distinguish cache-bound
      from memory bandwidth-bound scenarios.
      Equation: SUM((TCC_HIT_sum * 100) / (TCC_HIT_sum + TCC_MISS_sum))
    L2 to Memory Traffic Ratio: >-
      Percentage of L2 requests that result in memory (EA) traffic.
      High ratio (>50%) indicates most L2 requests go to memory (poor cache locality).
      Low ratio suggests good cache hit rate and working set fits in L2.
      Equation: SUM((TCC_EA0_RDREQ_sum + TCC_EA0_WRREQ_sum) * 100 / TCC_REQ_sum)
    L2 Remote Access Pressure (IF): >-
      Combined Infinity Fabric read and write credit stall percentage.
      High values indicate remote memory access bottleneck (multi-GPU or multi-socket).
      Equation: SUM(((TCC_EA0_RDREQ_GMI_CREDIT_STALL_sum + TCC_EA0_WRREQ_GMI_CREDIT_STALL_sum) * 100) / TCC_BUSY_sum)
