---
#
# Rules to define a panel and its data sources:
#    - Each panel has its own yaml file.
#    - Each yaml file has 2 sections: (1) Description Details. (2) Panel Config.
#    - id for each panel/ data_source has to be unique.
#    - The data source of panel support only: raw_csv_table and metric_table for now.
#    - For raw_csv_table, data will be loaded from the specified csv file directly,
#      and may be sorted.
#    - For metric_table, each metric has a single "expr:" with the raw equation.
#      Statistics (avg/min/max) are computed as aggregations on the evaluated
#      result.  "pop:" is omitted -- Pct of Peak is derived in Python from the
#      evaluated avg and peak values.
#

Metric Description:
  METRIC01: Scalar Arithmetic Logic Unit

# Define the panel properties and properties of each metric in the panel.
Panel Config:
  id: 800
  title: # define panel title to display
  data source:
    # Metric table sample (single expr per metric)
    - metric_table:
        id: 801
        title: # subtitle for this table(optional)
        header:
          metric: Metric
          value: Avg
          unit: Unit
          peak: Peak
          pop: Pct of Peak
        metric:
          METRIC01:
            expr: >-
              (100 * SQ_ACTIVE_INST_SCA
              / ($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu))
            unit: Percent
            peak: 100
          METRIC02:
            expr: >-
              (100 * SQ_ACTIVE_INST_VALU
              / ($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu))
            unit: Percent
            peak: 100
    # CSV table sample
    - raw_csv_table:
        id: 802
        source: abc.csv
