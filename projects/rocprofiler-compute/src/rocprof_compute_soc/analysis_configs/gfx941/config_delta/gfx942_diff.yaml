Addition:
  - Panel Config:
      id: 1700
      title: L2 Cache
    metric_tables:
      - metric_table:
          id: 1706
          title: L2 - Fabric interface detailed metrics
          metrics:
            - Read (128B):
                avg: AVG(((TCC_BUBBLE_sum) / $denom))
                min: MIN(((TCC_BUBBLE_sum) / $denom))
                max: MAX(((TCC_BUBBLE_sum) / $denom))
                unit: (Req  + $normUnit)

Deletion:
  []

Modification:
  - Panel Config:
      id: 200
      title: System Speed-of-Light
    metric_tables:
      - metric_table:
          id: 201
          title: System Speed-of-Light
          metrics:
            - MFMA FLOPs (F8):
                unit: GFLOP/s
  - Panel Config:
      id: 400
      title: Roofline
    metric_tables:
      - metric_table:
          id: 402
          title: Roofline Plot Points
          metrics:
            - AI L1:
                value: |
                  ( SUM( ($wave_size * ( (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + (2 * SQ_INSTS_VALU_FMA_F16) + SQ_INSTS_VALU_TRANS_F16) + (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + (2 * SQ_INSTS_VALU_FMA_F32) + SQ_INSTS_VALU_TRANS_F32) + (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + (2 * SQ_INSTS_VALU_FMA_F64) + SQ_INSTS_VALU_TRANS_F64) )) + (SQ_INSTS_VALU_MFMA_MOPS_F16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_BF16 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F32 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F64 * 512) + (SQ_INSTS_VALU_MFMA_MOPS_F8 * 512) ) / SUM( TCP_TOTAL_CACHE_ACCESSES_sum * 64 ) )
  - Panel Config:
      id: 1700
      title: L2 Cache
    metric_tables:
      - metric_table:
          id: 1701
          title: L2 Speed-of-Light
          metrics:
            - L2-Fabric Read BW:
                value: |
                  AVG((128 * TCC_BUBBLE_sum + 64 * (TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) + 32 * TCC_EA0_RDREQ_32B_sum) / (End_Timestamp - Start_Timestamp))
      - metric_table:
          id: 1702
          title: L2-Fabric interface metrics
          metrics:
            - Read BW:
                min: |
                  MIN(((128 * TCC_BUBBLE_sum + 64 * (TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) + 32 * TCC_EA0_RDREQ_32B_sum) / (End_Timestamp - Start_Timestamp)))
                avg: |
                  AVG(((128 * TCC_BUBBLE_sum + 64 * (TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) + 32 * TCC_EA0_RDREQ_32B_sum) / (End_Timestamp - Start_Timestamp)))
                max: |
                  MAX(((128 * TCC_BUBBLE_sum + 64 * (TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) + 32 * TCC_EA0_RDREQ_32B_sum) / (End_Timestamp - Start_Timestamp)))
      - metric_table:
          id: 1706
          title: L2 - Fabric interface detailed metrics
          metrics:
            - Read (64B):
                min: |
                  MIN(MAX(((TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) / $denom), 0))
                avg: |
                  AVG(MAX(((TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) / $denom), 0))
                max: |
                  MAX(MAX(((TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) / $denom), 0))
