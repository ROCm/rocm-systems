# One definition per collectable on this architecture. A panel metric_table
# that names _collect.<name> gets the row appended when the panel is loaded.
collectables:
  gl2_rd_bw:
    id: collect.gl2_rd_bw
    formula: SUM(GL1C_GL2_REQ_READ_32B_sum * 32 + GL1C_GL2_REQ_READ_64B_sum * 64 + GL1C_GL2_REQ_READ_128B_sum * 128) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
  gl2_wr_bw:
    id: collect.gl2_wr_bw
    formula: SUM(GL1C_GL2_REQ_WRITE_32B_sum * 32 + GL1C_GL2_REQ_WRITE_64B_sum * 64) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
  ai_valu_flops:
    id: collect.ai_valu_flops
    formula: SUM($wave_size * SQ_INSTS_VALU_sum)
  gl2_rd_bytes:
    id: collect.gl2_rd_bytes
    formula: SUM(GL1C_GL2_REQ_READ_32B_sum * 32 + GL1C_GL2_REQ_READ_64B_sum * 64 + GL1C_GL2_REQ_READ_128B_sum * 128)
  gl2_wr_bytes:
    id: collect.gl2_wr_bytes
    formula: SUM(GL1C_GL2_REQ_WRITE_32B_sum * 32 + GL1C_GL2_REQ_WRITE_64B_sum * 64)
