Panel Config:
  id: 1000
  title: Compute Units - Instruction Mix
  data source:
  - metric_table:
      id: 1001
      title: Overall Instruction Mix
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        LDS:
          expr: (SQ_INSTS_LDS / $denom)
          unit: (Instructions + $normUnit)
        SALU:
          expr: (SQ_INSTS_SALU / $denom)
          unit: (Instructions + $normUnit)
        SMEM:
          expr: (SQ_INSTS_SMEM / $denom)
          unit: (Instructions + $normUnit)
        Branch:
          expr: (SQ_INSTS_BRANCH / $denom)
          unit: (Instructions + $normUnit)
  - metric_table:
      id: 1002
      title: VALU Arithmetic Instruction Mix
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric: {}
  - metric_table:
      id: 1003
      title: VMEM Instruction Mix
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Global/Generic Instr:
          expr: (TA_FLAT_WAVEFRONTS_sum / $denom)
          unit: (Instructions + $normUnit)
        Global/Generic Read:
          expr: (TA_FLAT_READ_WAVEFRONTS_sum / $denom)
          unit: (Instructions + $normUnit)
        Global/Generic Write:
          expr: (TA_FLAT_WRITE_WAVEFRONTS_sum / $denom)
          unit: (Instructions + $normUnit)
        Global/Generic Atomic:
          expr: (TA_FLAT_ATOMIC_WAVEFRONTS_sum / $denom)
          unit: (Instructions + $normUnit)
        Spill/Stack Instr:
          expr: (TA_BUFFER_WAVEFRONTS_sum / $denom)
          unit: (Instructions + $normUnit)
        Spill/Stack Read:
          expr: (TA_BUFFER_READ_WAVEFRONTS_sum / $denom)
          unit: (Instructions + $normUnit)
        Spill/Stack Write:
          expr: (TA_BUFFER_WRITE_WAVEFRONTS_sum / $denom)
          unit: (Instructions + $normUnit)
        Spill/Stack Atomic:
          expr: (TA_BUFFER_ATOMIC_WAVEFRONTS_sum / $denom)
          unit: (Instructions + $normUnit)
  - metric_table:
      id: 1004
      title: MFMA Arithmetic Instruction Mix
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric: {}
  metrics_description:
    LDS: The total number of LDS (also known as shared memory) operations issued. These include loads, stores, atomics, and HIP's __shfl operations.
    SALU: The total number of scalar arithmetic logic unit (SALU) operations issued. Typically these are used for address calculations, literal constants, and other operations that are provably uniform across a wavefront. Although scalar memory (SMEM) operations are issued by the SALU, they are counted separately in this section.
    SMEM: The total number of scalar memory (SMEM) operations issued. These are typically used for loading kernel arguments, base-pointers and loads from HIP's __constant__ memory.
    Branch: The total number of branch operations issued. These typically consist of jump or branch operations and are used to implement control flow.
    Global/Generic Instr: The total number of global & generic memory instructions executed on all compute units on the accelerator, per normalization unit.
    Global/Generic Read: The total number of global & generic memory read instructions executed on all compute units on the accelerator, per normalization unit.
    Global/Generic Write: The total number of global & generic memory write instructions executed on all compute units on the accelerator, per normalization unit.
    Global/Generic Atomic: The total number of global & generic memory atomic (with and without return) instructions executed on all compute units on the accelerator, per normalization unit.
    Spill/Stack Instr: The total number of spill/stack memory instructions executed on all compute units on the accelerator, per normalization unit.
    Spill/Stack Read: The total number of spill/stack memory read instructions executed on all compute units on the accelerator, per normalization unit.
    Spill/Stack Write: The total number of spill/stack memory write instructions executed on all compute units on the accelerator, per normalization unit.
    Spill/Stack Atomic: The total number of spill/stack memory atomic (with and without return) instructions executed on all compute units on the accelerator, per normalization unit. Typically unused as these memory operations are typically used to implement thread-local storage.
