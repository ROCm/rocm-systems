Panel Config:
  id: 300
  title: Memory Chart
  data source:
  - metric_table:
      id: 301
      title: Memory Chart
      header:
        metric: Metric
        value: Value
        unit: Unit
      metric:
        Wavefront Occupancy:
          value: ROUND(100 * SUM(SQ_LEVEL_WAVES_ACCUM) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $numActiveCUs * $max_waves_per_cu), 1)
          unit: Percent
        VGPR:
          value: ROUND(AVG(Arch_VGPR), 0)
          unit: Registers
        SGPR:
          value: ROUND(AVG(SGPR), 0)
          unit: Registers
        LDS Allocation:
          value: ROUND(AVG(LDS_Per_Workgroup), 0)
          unit: Bytes per Workgroup
        Scratch Allocation:
          value: ROUND(AVG(Scratch_Per_Workitem) * $wave_size / 1024, 3)
          unit: KB per Wave
        Workgroups:
          value: ROUND(AVG(SPI_CSN_NUM_THREADGROUPS) / $numActiveCUs, 1)
          unit: Workgroups per CU
        Flat Read:
          value: ROUND(SUM(TA_FLAT_READ_WAVEFRONTS_sum) / SUM($denom), 0)
          unit: (Instructions + $normUnit)
        Flat Write:
          value: ROUND(SUM(TA_FLAT_WRITE_WAVEFRONTS_sum) / SUM($denom), 0)
          unit: (Instructions + $normUnit)
        Flat Atomic:
          value: ROUND(SUM(TA_FLAT_ATOMIC_WAVEFRONTS_sum) / SUM($denom), 0)
          unit: (Instructions + $normUnit)
        Buffer Read:
          value: ROUND(SUM(TA_BUFFER_READ_WAVEFRONTS_sum) / SUM($denom), 0)
          unit: (Instructions + $normUnit)
        Buffer Write:
          value: ROUND(SUM(TA_BUFFER_WRITE_WAVEFRONTS_sum) / SUM($denom), 0)
          unit: (Instructions + $normUnit)
        Buffer Atomic:
          value: ROUND(SUM(TA_BUFFER_ATOMIC_WAVEFRONTS_sum) / SUM($denom), 0)
          unit: (Instructions + $normUnit)
        LDS Req:
          value: ROUND(SUM(SQ_INSTS_LDS) / SUM($denom), 0)
          unit: (Instructions + $normUnit)
        LDS Util:
          value: ROUND(100 * SUM(SQ_LDS_IDX_ACTIVE) / SUM($GRBM_GUI_ACTIVE_PER_XCD * $cu_per_gpu), 0)
          unit: Percent
        VL1 Hit:
          value: COLLECT_SUM(_collect.vl1d_hit_non_rw, _collect.vl1d_hit_atom)
          unit: Percent
        VL1 Coalesce:
          value: ROUND(100 * 64 * SUM(TA_TOTAL_WAVEFRONTS_sum) / (4 * SUM(TCP_TOTAL_ACCESSES_sum)), 0)
          unit: Percent
        VL1_L2 Read BW:
          value: 128 * SUM(TCP_TCC_READ_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        VL1_L2 Write BW:
          value: 64 * SUM(TCP_TCC_WRITE_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        VL1_L2 Atomic BW:
          value: 64 * SUM(TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        sL1D Rd:
          value: ROUND(SUM(SQC_DCACHE_REQ) / SUM($denom), 0)
          unit: (Requests + $normUnit)
        sL1D Hit:
          value: ROUND(100 * SUM(SQC_DCACHE_HITS) / SUM(SQC_DCACHE_REQ), 0)
          unit: Percent
        sL1D_L2 Read BW:
          value: 64 * SUM(SQC_TC_DATA_READ_REQ) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        IL1 Fetch:
          value: ROUND(SUM(SQC_ICACHE_REQ) / SUM($denom), 0)
          unit: (Requests + $normUnit)
        IL1 Hit:
          value: ROUND(100 * SUM(SQC_ICACHE_HITS) / SUM(SQC_ICACHE_REQ), 0)
          unit: Percent
        IL1_L2 Read BW:
          value: 64 * SUM(SQC_TC_INST_REQ) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        L2 Hit:
          value: ROUND(100 * SUM(TCC_HIT_sum) / SUM(TCC_HIT_sum + TCC_MISS_sum), 0)
          unit: Percent
        L2-Fabric Read BW:
          value: SUM(TCC_EA0_RDREQ_32B_sum * 32 + (TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_32B_sum) * 64) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        L2-Fabric Write and Atomic BW:
          value: SUM(TCC_EA0_WRREQ_64B_sum * 64 + (TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 32) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        _collect.vl1d_hit_non_rw:
          value: 100 * SUM(TCP_TOTAL_CACHE_ACCESSES_sum - (TCP_TCC_READ_REQ_sum + TCP_TCC_WRITE_REQ_sum)) / SUM(TCP_TOTAL_CACHE_ACCESSES_sum)
          _collectable_id: collect.vl1d_hit_non_rw
        _collect.vl1d_hit_atom:
          value: -100 * SUM(TCP_TCC_ATOMIC_WITH_RET_REQ_sum + TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum) / SUM(TCP_TOTAL_CACHE_ACCESSES_sum)
          _collectable_id: collect.vl1d_hit_atom
      comparable: false
      cli_style: mem_chart
  metrics_description:
    Wavefront Occupancy: >-
      Resident wavefronts per active CU, averaged over GPU-active cycles, as a percent of
      the maximum wavefronts per CU.
    VGPR: >-
      The number of architected vector general-purpose registers allocated
      for the kernel, see VALU. Note: this may not exactly match the number of VGPRs
      requested by the compiler due to allocation granularity.
    SGPR: >-
      The number of scalar general-purpose registers allocated for the kernel,
      see SALU. Note: this may not exactly match the number of SGPRs requested by
      the compiler due to allocation granularity.
    LDS Allocation: >-
      The number of bytes of LDS memory (or, shared memory) allocated per workgroup. Note:
      This may also be larger than what was requested at compile time due to both allocation
      granularity and dynamic per-dispatch LDS allocations.
    Scratch Allocation: >-
      The amount of scratch memory requested per wavefront, in KB: the scratch bytes
      requested per work-item multiplied by the wavefront size. Scratch memory is used for
      stack memory on the accelerator, as well as for register spills and restores.
    Workgroups: >-
      The number of workgroups in the launch divided by the number of active CUs.
    Flat Read: >-
      The total number of flat read instructions processed by the address processing unit,
      counted once per wavefront, per normalization unit.
    Flat Write: >-
      The total number of flat write instructions processed by the address processing unit,
      counted once per wavefront, per normalization unit.
    Flat Atomic: >-
      The total number of flat atomic instructions processed by the address processing unit,
      counted once per wavefront, per normalization unit.
    Buffer Read: >-
      The total number of buffer read instructions processed by the address processing unit,
      counted once per wavefront, per normalization unit.
    Buffer Write: >-
      The total number of buffer write instructions processed by the address processing
      unit, counted once per wavefront, per normalization unit.
    Buffer Atomic: >-
      The total number of buffer atomic instructions processed by the address processing
      unit, counted once per wavefront, per normalization unit.
    LDS Req: The total number of LDS instructions (including, but not limited to,
      read/write/atomics and HIP's __shfl instructions) executed per normalization
      unit.
    LDS Util: >-
      Indicates what percent of the total CU cycles the LDS was actively executing
      instructions (including, but not limited to, load, store, atomic and HIP's __shfl
      operations). Calculated as the ratio of the total number of cycles LDS was active over
      the total CU cycles.
    VL1 Hit: >-
      The percent of vL1D cache line requests that hit in the vL1D cache, over the total
      number of cache line requests to the vL1D Cache RAM. Calculated as 100 minus the
      percent of requests that were sent to the L2.
    VL1 Coalesce: Indicates how well memory instructions were coalesced by the address
      processing unit, ranging from uncoalesced (25%) to fully coalesced (100%). Calculated
      as the average number of thread-requests generated per instruction divided by
      the ideal number of thread-requests per instruction.
    VL1_L2 Read BW: Bandwidth of read requests from the vL1D cache to the L2
      cache per unit time.
    VL1_L2 Write BW: Bandwidth of write requests from the vL1D cache to the L2
      cache per unit time.
    VL1_L2 Atomic BW: Bandwidth of atomic requests from the vL1D cache to the L2
      cache per unit time.
    sL1D Rd: The total number of requests, of any size or type, made to the sL1D per
      normalization unit.
    sL1D Hit: >-
      The percent of sL1D requests that hit on a previously loaded cache line. Calculated as
      the ratio of the number of sL1D requests that hit over the number of all sL1D
      requests.
    sL1D_L2 Read BW: Bandwidth of read requests from the sL1D cache to the L2
      cache per unit time.
    IL1 Fetch: >-
      The total number of requests made to the L1I per normalization unit.
    IL1 Hit: >-
      The percent of L1I requests that hit on a previously loaded cache line. Calculated as
      the ratio of the number of L1I requests that hit over the number of all L1I requests.
    IL1_L2 Read BW: Bandwidth of read requests from the instruction L1 cache to
      the L2 cache per unit time.
    L2 Hit: >-
      The percent of L2 cache line requests that hit in the L2 cache, over the total number
      of incoming cache line requests to the L2 cache.
    L2-Fabric Read BW: The number of bytes read by the L2 over the Infinity Fabric
      interface per unit time.
    L2-Fabric Write and Atomic BW: The number of bytes sent by the L2 over the Infinity
      Fabric interface by write and atomic operations per unit time.
