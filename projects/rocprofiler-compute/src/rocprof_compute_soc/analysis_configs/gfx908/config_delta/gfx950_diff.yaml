        pop: None
    - MFMA Utilization:
        value: None
        pop: None
    - VMEM Utilization:
        value: None
        pop: None
    - Branch Utilization:
        value: None
        pop: None
    - vL1D Cache BW:
        value: AVG(((TCP_TOTAL_CACHE_ACCESSES_sum * 64) / (End_Timestamp - Start_Timestamp)))
        peak: ((($max_sclk / 1000) * 64) * $cu_per_gpu)
        pop: ((100 * AVG(((TCP_TOTAL_CACHE_ACCESSES_sum * 64) / (End_Timestamp - Start_Timestamp)))) / ((($max_sclk / 1000) * 64) * $cu_per_gpu))
    - L2 Cache BW:
        value: AVG(((TCC_REQ_sum * 64) / (End_Timestamp - Start_Timestamp)))
        peak: ((($max_sclk / 1000) * 64) * TO_INT($total_l2_chan))
        pop: ((100 * AVG(((TCC_REQ_sum * 64) / (End_Timestamp - Start_Timestamp)))) / ((($max_sclk / 1000) * 64) * TO_INT($total_l2_chan)))
    - L2-Fabric Read BW:
        value: AVG((((TCC_EA0_RDREQ_32B_sum * 32) + ((TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_32B_sum) * 64)) / (End_Timestamp - Start_Timestamp)))
        pop: ((100 * AVG((((TCC_EA0_RDREQ_32B_sum * 32) + ((TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_32B_sum) * 64)) / (End_Timestamp - Start_Timestamp)))) / $hbmBandwidth)
