# Profile shortcut sets for gfx1201 (RDNA4 - Navi48, e.g. Radeon RX 9070)
#
# Each set provides a named subset of the full profile for quick-look analysis.
# Use with: rocprof-compute profile --set <set_option> ...
#
# Panel IDs for gfx1201:
#   200 = System Speed-of-Light
#   300 = Memory Chart
#   500 = CPC
#   600 = SPI
#   700 = WGP
#   900 = L0 Cache (TCP)
#  1100 = L1 Cache (GL1C)
#  1300 = L2 Cache (GL2C)
#  1400 = GCEA
#  1700 = GRBM

sets:
- title: Compute Throughput FLOPS
  set_option: compute_thruput_flops
  description: >-
    Compute throughput metrics: VALU and FP64 instruction issue rates, estimated
    FP16 WMMA throughput, and IPC. VALU issue rates are not FLOP rates.
  metric:
  - 2.1.0: VALU Issue Rate
  - 2.1.1: WMMA FLOPs (F16->F32 16x16x16)
  - 2.1.2: FP64 VALU Issue Rate
  - 2.1.3: IPC

- title: Wavefront Occupancy
  set_option: wavefront_occupancy
  description: >-
    Provisional wavefront occupancy estimate. Navi48 living-wave counter units
    and reduction still require validation before inferring resource limits.
  metric:
  - 2.1.4: Wavefront Occupancy

- title: Memory Throughput
  set_option: mem_thruput
  description: >-
    GL0 and GL2 cache hit rates. GL0 bandwidth and GL1 hit rate are unavailable.
  metric:
  - 2.1.5: GL2 Cache Hit Rate
  - 2.1.11: GL0 Cache Hit Rate (TCP Cache)
  - 2.1.12: GL0 Cache BW (TCP Cache)
  - 2.1.13: GL1 Cache Hit Rate

- title: Memory Fabric Read Throughput
  set_option: mem_fabric_read_thruput
  description: GL2-fabric read bandwidth for identifying memory bottlenecks.
  metric:
  - 2.1.6: GL2-Fabric Read BW

- title: Memory Fabric Write Throughput
  set_option: mem_fabric_write_thruput
  description: GL2-fabric write bandwidth.
  metric:
  - 2.1.7: GL2-Fabric Write BW

- title: GL1 Cache Read Throughput
  set_option: gl1_read_thruput
  description: GL1 cache read bandwidth.
  metric:
  - 2.1.14: GL1 Cache Read BW

- title: GL2 Cache Throughput
  set_option: gl2_thruput
  description: GL2 cache bandwidth.
  metric:
  - 2.1.15: GL2 Cache BW

- title: LDS Performance
  set_option: lds_perf
  description: >-
    LDS (Local Data Share) bank conflicts, issued instructions, and byte-access
    rate from load, store, and atomic dword counters. Hardware normalization
    remains provisional.
  metric:
  - 2.1.8: LDS Bank Conflicts
  - 7.5.7: Instructions - LDS
  - 3.4.3: LDS Bandwidth

- title: Launch Stats
  set_option: launch_stats
  description: >-
    Kernel launch and resource utilization statistics: grid size, workgroup
    size, VGPR/SGPR register usage, LDS allocation.
  metric:
  - 7.2.0: Grid Size
  - 7.2.1: Workgroup Size
  - 7.3.0: Dispatched Waves
  - 7.2.2: VGPRs
  - 7.2.3: SGPRs
  - 7.2.4: LDS Allocation
  - 7.2.5: Scratch Allocation

- title: Instruction Mix
  set_option: inst_mix
  description: >-
    Issued VALU, SALU, SMEM, VMEM (Tex), LDS, and flat instruction counts.
    Per-wave normalization still requires validation on Navi48.
  metric:
  - 7.5.2: Instructions - VALU
  - 7.5.3: Instructions - SALU
  - 7.5.4: Instructions - SMEM
  - 7.6.1: Instructions - TEX Load
  - 7.6.2: Instructions - TEX Store
  - 7.5.7: Instructions - LDS
  - 7.6.0: Instructions - VMEM Flat

- title: Cache Efficiency
  set_option: cache_efficiency
  description: >-
    Instruction, scalar data, GL0, and GL2 cache hit rates and scalar data cache
    bandwidth. GL1 hit rate and instruction cache bandwidth are unavailable.
  metric:
  - 2.1.16: Scalar Data Cache Hit Rate
  - 2.1.17: Scalar Data Cache BW
  - 2.1.18: Instruction Cache Hit Rate
  - 2.1.19: Instruction Cache BW
  - 2.1.11: GL0 Cache Hit Rate (TCP Cache)
  - 2.1.13: GL1 Cache Hit Rate
  - 2.1.5: GL2 Cache Hit Rate
