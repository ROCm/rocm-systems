    - architectures:
      - gfx1150
      - gfx1151
      - gfx1152
      - gfx1153
      expression: ((GL2C_MC_WRREQ_sum-GL2C_EA_WRREQ_64B_sum)*32+GL2C_EA_WRREQ_64B_sum*64)/1024
    - architectures:
      - gfx940
      - gfx941
      - gfx942
      - gfx950
      expression: ((TCC_EA0_WRREQ_sum-TCC_EA0_WRREQ_64B_sum)*32+TCC_EA0_WRREQ_64B_sum*64)/1024
