# Kernel replay overhead benchmark configuration.
#
# There are three ways to collect N counter groups, and they do not collect the same thing:
#
#   application replay  run the whole application N times, once per group. Every dispatch ends up
#                       with every group, at the cost of N application runs. This is the thing
#                       kernel replay is meant to replace.
#   multiplexed         run the application once and rotate the group every few dispatches, which
#                       is what rocprofv3 does with several --pmc flags and no replay. Cheap,
#                       because it does not collect more than one group's worth of counters, and
#                       no dispatch carries every group.
#   kernel replay       run the application once and re-execute each dispatch N times,
#                       snapshotting and restoring the agent's tracked device memory around each
#                       pass. Every dispatch ends up with every group, from one run.
#
# Only application replay and kernel replay produce the same data, so only those two are a
# like-for-like comparison; multiplexed collection is measured as the floor. Which of the two is
# cheaper is entirely a property of the workload, and this configuration is built to measure where
# the crossover is rather than to assert a number.
#
# A benchmark job is one rocprofv3 invocation, so application replay cannot be written down as a
# job: it is N runs whose costs add up. The single-group job below stands in for one of those runs,
# and the benchmark_replay_* views multiply it by the group count to project what the full
# application replay would have cost. scripts/replay_perf.py measures it directly instead, for when
# the projection is not good enough.
#
# The cost model the jobs are laid out against is:
#
#   bytes moved  =  dispatches  x  tracked device footprint  x  passes
#
# One snapshot per replayed dispatch, one restore per subsequent pass, full copies with no dirty
# tracking. So replay wins when the application is expensive to start and cheap per dispatch, and
# loses when it has a large resident footprint or a very high dispatch count. The sweeps below vary
# each of those three terms independently so the resulting numbers can be attributed.
#
# transpose takes: nthreads, iterations, sync-interval, matrix-rows, matrix-cols. Iterations set the
# dispatch count and the matrix dimensions set the footprint, which is why it is used for the
# sweeps.
#
# Run with:
#   rocprofv3-benchmark.py -i kernel-replay.yaml
#   rocprofv3-benchmark.py -i kernel-replay.yaml --filter-rocprofv3 replay_4_groups counters_only
#
# See docs/conceptual/kernel_replay/kernel_replay_performance.md for what the numbers mean.

defaults:
  rocprofv3:
    # The comparison that matters. replay_4_groups collects four groups on every dispatch in one
    # application run; counters_only below collects one group in one run and is what an application
    # replay of the same four groups would repeat four times. Filter to those two for the headline
    # number.
    replay_4_groups:
      [
        --kernel-replay-beta-enabled,
        --pmc,
        SQ_WAVES,
        --pmc,
        GRBM_COUNT,
        --pmc,
        SQ_INSTS_VALU,
        --pmc,
        SQ_BUSY_CYCLES,
      ]
    # The same four groups without replay, which rotates them across dispatches instead of
    # collecting them all everywhere. Not comparable to replay_4_groups on data collected, only on
    # what the group machinery costs when nothing is replayed.
    multiplex_4_groups:
      [--pmc, SQ_WAVES, --pmc, GRBM_COUNT, --pmc, SQ_INSTS_VALU, --pmc, SQ_BUSY_CYCLES]

    # Pass-count sweep at fixed footprint and dispatch count. Wall time should grow roughly
    # linearly in the number of groups; super-linear growth means per-pass fixed cost, which the
    # cost model does not account for and which would be a regression.
    replay_1_group: [--kernel-replay-beta-enabled, --pmc, SQ_WAVES]
    replay_2_groups: [--kernel-replay-beta-enabled, --pmc, SQ_WAVES, --pmc, GRBM_COUNT]
    replay_8_groups:
      [
        --kernel-replay-beta-enabled,
        --pmc,
        SQ_WAVES,
        --pmc,
        GRBM_COUNT,
        --pmc,
        SQ_INSTS_VALU,
        --pmc,
        SQ_BUSY_CYCLES,
        --pmc,
        SQ_WAVE_CYCLES,
        --pmc,
        SQ_INSTS_SALU,
        --pmc,
        SQ_INSTS_VMEM,
        --pmc,
        SQ_INSTS_SMEM,
      ]

    # One counter group, no replay. Two jobs in one: the floor, so that whatever the replay
    # configurations cost above it is attributable to the replay machinery rather than to counter
    # collection, and the unit of application replay, since collecting G groups that way is this
    # run repeated G times. The benchmark_replay_* views look for exactly this configuration when
    # projecting what an application replay would have cost, so it needs to stay in any filtered
    # run that is meant to produce a comparison.
    counters_only: [--pmc, SQ_WAVES]

  benchmark:
    - baseline
    - disabled-sdk-contexts
    - sdk-buffer-overhead
    - sdk-callback-overhead
    - tool-runtime-overhead

  group:
    - kernel-replay

jobs:
  # ---------------------------------------------------------------------------
  # Pass-count axis: same workload, more groups.
  # ---------------------------------------------------------------------------
  - name: replay-pass-sweep
    group: [kernel-replay, pass-sweep]
    command: [transpose, 1, 100, 10, 2048, 2048]
    rocprofv3:
      - [--kernel-replay-beta-enabled, --pmc, SQ_WAVES]
      - [--kernel-replay-beta-enabled, --pmc, SQ_WAVES, --pmc, GRBM_COUNT]
      - [
          --kernel-replay-beta-enabled,
          --pmc,
          SQ_WAVES,
          --pmc,
          GRBM_COUNT,
          --pmc,
          SQ_INSTS_VALU,
          --pmc,
          SQ_BUSY_CYCLES,
        ]

  # ---------------------------------------------------------------------------
  # Footprint axis: same dispatch count and pass count, more resident memory.
  #
  # This is the sweep that exposes the full-footprint-versus-working-set problem. The snapshot
  # covers everything the agent has tracked, not what the kernel touches, so a workload whose
  # resident memory grows while its kernels stay the same size should still get more expensive.
  # If it does not, the snapshot is not doing what the cost model says.
  # ---------------------------------------------------------------------------
  - name: replay-footprint-small
    group: [kernel-replay, footprint-sweep]
    command: [transpose, 1, 100, 10, 1024, 1024]

  - name: replay-footprint-medium
    group: [kernel-replay, footprint-sweep]
    command: [transpose, 1, 100, 10, 4096, 4096]

  - name: replay-footprint-large
    group: [kernel-replay, footprint-sweep]
    command: [transpose, 1, 100, 10, 8192, 8192]

  # ---------------------------------------------------------------------------
  # Dispatch-count axis: same footprint and pass count, more dispatches.
  #
  # One snapshot per replayed dispatch, so per-dispatch fixed cost shows up here and nowhere else.
  # The existing CI perf tests top out around 16 dispatches, where a per-dispatch regression is
  # diluted below the noise floor; these run two orders of magnitude higher.
  # ---------------------------------------------------------------------------
  - name: replay-dispatch-count-low
    group: [kernel-replay, dispatch-sweep]
    command: [transpose, 1, 100, 10, 2048, 2048]

  - name: replay-dispatch-count-high
    group: [kernel-replay, dispatch-sweep]
    command: [transpose, 1, 2000, 100, 2048, 2048]

  # ---------------------------------------------------------------------------
  # Dispatches-per-range axis: same dispatch count, footprint and pass count, but the application
  # synchronizes after every nth dispatch instead of at a fixed cadence.
  #
  # transpose's third argument is how many dispatches it enqueues between stream synchronizations,
  # which is the length of an uninterrupted run of dispatches. Kernel replay drains the agent per
  # replayed dispatch, so an application that already synchronizes constantly has less to lose from
  # that drain than one that keeps a deep queue in flight, and this sweep is what separates the two.
  #
  # It is also the axis range replay will be measured on. Range replay snapshots once per range
  # rather than once per dispatch, which turns the cost model from
  #
  #   dispatches x footprint x passes    into    ranges x footprint x passes
  #
  # so the saving is proportional to how many dispatches fall inside a range. Recording the axis now
  # means the kernel replay numbers it will be compared against already exist, measured on the same
  # workloads, rather than having to be regenerated later against a moved baseline.
  # ---------------------------------------------------------------------------
  - name: replay-sync-every-dispatch
    group: [kernel-replay, range-length-sweep]
    command: [transpose, 1, 500, 1, 2048, 2048]

  - name: replay-sync-every-10-dispatches
    group: [kernel-replay, range-length-sweep]
    command: [transpose, 1, 500, 10, 2048, 2048]

  - name: replay-sync-every-100-dispatches
    group: [kernel-replay, range-length-sweep]
    command: [transpose, 1, 500, 100, 2048, 2048]

  - name: replay-sync-once
    group: [kernel-replay, range-length-sweep]
    command: [transpose, 1, 500, 500, 2048, 2048]

  # ---------------------------------------------------------------------------
  # Application shapes.
  # ---------------------------------------------------------------------------

  # Multi-threaded and multi-stream. Replay drains the agent and holds an exclusive per-agent
  # writer lock across the whole window, so a workload that overlaps work across streams should
  # lose that overlap. This job is here to quantify how much.
  - name: replay-multistream
    group: [kernel-replay, multistream]
    command: [transpose, 4, 500, 10, 2048, 2048]

  - name: replay-multistream-standalone
    group: [kernel-replay, multistream]
    command: [multistream]

  # HIP graphs decline replay: a graph launch is not a single-packet single-dispatch submission.
  # This job is expected to show replay costing approximately nothing, because it is doing
  # approximately nothing. That is the point of measuring it -- a graph-capturing application gets
  # no replay at all, and the benchmark should make that visible rather than leaving it to be
  # discovered in production.
  - name: replay-hip-graph-declines
    group: [kernel-replay, declines]
    command: [hip-graph, 8, 500]

  # A workload with a deterministic dispatch count, so replay's effect on dispatch accounting can
  # be checked rather than inferred.
  - name: replay-reproducible-dispatch-count
    group: [kernel-replay, correctness-adjacent]
    command: [reproducible-dispatch-count]

  # Library-dispatched kernels, which is the shape most real applications actually have.
  - name: replay-hip-in-libraries
    group: [kernel-replay, real-shape]
    command: [hip-in-libraries]
