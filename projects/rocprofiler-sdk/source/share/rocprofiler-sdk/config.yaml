  - definitions:
    - architectures:
      - gfx906
      expression: (TCC_EA_RDREQ_32B_sum*32+(TCC_EA_RDREQ_sum-TCC_EA_RDREQ_32B_sum)*64+RDATA1_SIZE)/1024
    - architectures:
      - gfx9
      - gfx900
      - gfx908
