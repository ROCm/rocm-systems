    - architectures:
      - gfx940
      - gfx941
      - gfx942
      - gfx950
      expression: (TCC_BUBBLE_sum*128 + (TCC_EA0_RDREQ_sum-TCC_BUBBLE_sum-TCC_EA0_RDREQ_32B_sum)*64
        + TCC_EA0_RDREQ_32B_sum*32)/1024
    - architectures:
      - gfx10
      - gfx1010
      - gfx1030
      - gfx1031
      - gfx1032
      - gfx11
      - gfx1100
      - gfx1101
      - gfx1102
      expression: (GL2C_EA_RDREQ_32B_sum*32+GL2C_EA_RDREQ_64B_sum*64+GL2C_EA_RDREQ_96B_sum*96+GL2C_EA_RDREQ_128B_sum*128)/1024
