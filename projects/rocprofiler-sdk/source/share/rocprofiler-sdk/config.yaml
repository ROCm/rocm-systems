rocprofiler-sdk:
  counters-schema-version: 1
  counters:
  - definitions:
    - architectures:
      - gfx10
      - gfx1010
      - gfx1030
      - gfx1031
      - gfx1032
      - gfx11
      - gfx1100
      - gfx1101
      - gfx1102
      - gfx9
      - gfx906
      - gfx908
      - gfx90a
      expression: 400*reduce(SQ_WAIT_INST_LDS,sum)/reduce(SQ_WAVES,sum)/reduce(GRBM_GUI_ACTIVE,max)
    description: 'The percentage of GPUTime ALU units are stalled by the LDS input
      queue being full or the output queue being not ready. If there are LDS bank
      conflicts, reduce them. Otherwise, try reducing the number of LDS accesses if
      possible. Value range: 0% (optimal) to 100% (bad).'
    name: ALUStalledByLDS
    properties: []
  - definitions:
    - architectures:
      - gfx90a
      expression: reduce(GRBM_GUI_ACTIVE,max)*CU_NUM
    description: 'Unit: cycles'
    name: AggSysCycles
    properties: []
  - definitions:
    - architectures:
      - gfx90a
      expression: reduce(SQ_THREAD_CYCLES_VALU,sum)/reduce(SQ_ACTIVE_INST_VALU,sum)
    description: 'Unit: percent'
    name: AvgNumActiveThreads
    properties: []
