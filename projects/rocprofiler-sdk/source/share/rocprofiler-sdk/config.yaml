      - gfx12
      - gfx1200
      - gfx1201
      expression: (GL2C_EA_RDREQ_32B_sum*32+GL2C_EA_RDREQ_64B_sum*64+GL2C_EA_RDREQ_128B_sum*128)/1024
    description: The total kilobytes fetched from the video memory. This is measured
