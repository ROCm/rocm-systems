# Firmware Restrictions YAML Specification
# Schema Version: 1
#
# This file defines minimum firmware version requirements for specific architectures.
# Architectures listed under a firmware type must meet the minimum version requirement,
# otherwise they should be blocked/disabled.
rocprofiler-sdk:
  # Required: Schema version for compatibility
  fw_restriction_schema_version: 1
  
  # List of firmware restrictions
  firmware_restrictions:
    # Example: CP firmware restrictions
    - firmware_type: CP
      min_version: 186
      reason: "CP firmware below version 186 can cause device resets and VM Page Faults on MI3XX devices."
      affected_architectures:
        - "gfx940"
        - "gfx941"
        - "gfx942"
    
    # # Example: SDMA firmware restrictions
    # - firmware_type: SDMA
    #   min_version: 150
