  - name: TaUtil
    description: 'Texture Addressing (TA) unit utilization percentage. Indicates how busy the address calculation and coalescing units are. Unit: percent. Value range: 0% (idle) to 100% (fully utilized).'
    properties: []
    definitions:
    - architectures:
      - gfx90a
      expression: 100*reduce(GRBM_TA_BUSY,max)/reduce(GRBM_GUI_ACTIVE,max)
  - name: TcUtil
    description: 'Texture Cache (TC) utilization percentage. TC is the cache RAM in the vL1D/TCP subsystem. Unit: percent. Value range: 0% (idle) to 100% (fully utilized).'
    properties: []
    definitions:
    - architectures:
      - gfx90a
      expression: 100*reduce(GRBM_TC_BUSY,max)/reduce(GRBM_GUI_ACTIVE,max)
  - name: VALUBusy
    description: 'The percentage of GPUTime vector ALU instructions are processed. Value range: 0% (bad) to 100% (optimal).'
    properties: []
    definitions:
    - architectures:
      - gfx9
      - gfx900
      - gfx906
      - gfx908
      - gfx90a
      - gfx940
      - gfx941
      - gfx942
      - gfx950
      expression: 100*reduce(SQ_ACTIVE_INST_VALU,sum)/CU_NUM/reduce(GRBM_GUI_ACTIVE,max)
    - architectures:
      - gfx12
      - gfx1200
      - gfx1201
      expression: 100*reduce(SQ_INST_CYCLES_VALU,sum)/(SIMD_NUM/4)/reduce(GRBM_GUI_ACTIVE,max)
  - name: VALUInsts
    description: The average number of vector ALU instructions executed per work-item (affected by flow control).
    properties: []
    definitions:
    - architectures:
      - gfx10
      - gfx1010
      - gfx1030
      - gfx1031
      - gfx1032
      - gfx11
      - gfx1100
      - gfx1101
      - gfx1102
      - gfx1150
      - gfx1151
      - gfx9
      - gfx906
      - gfx908
      - gfx90a
      - gfx12
      - gfx1200
      - gfx1201
      expression: reduce(SQ_INSTS_VALU,sum)/reduce(SQ_WAVES,sum)
  - name: VALUUtilization
    description: 'The percentage of active vector ALU threads in a wave. A lower number can mean either more thread divergence in a wave or that the work-group size is not a multiple of 64. Value range: 0% (bad), 100% (ideal - no thread divergence).'
    properties: []
    definitions:
    - architectures:
      - gfx9
      - gfx900
      - gfx906
      - gfx908
      - gfx90a
      - gfx940
      - gfx941
