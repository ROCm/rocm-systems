# Schema History
# Version 3.0.0
# - Initial schema

# Version 3.0.1
# - rocpd_info_pmc.target_arch added NIC type
# - rocpd_info_agent.type added NIC type

# Version 3.0.2
# - Added graph_exec_id and graph_node_id columns to rocpd_kernel_dispatch and rocpd_memory_copy
# - Added rocpd_graph_launch table for HIP graph launch summary records

# Version 3.0.3
# - Added rocpd_info_blob_schema table (self-describing binary blob layout)
# - Added rocpd_info_blob_field table (per-field descriptor for blob schemas)
# - Added rocpd_blob_event table (schema-tagged binary blob instances)
# - Added rocpd_gpu_pc_sample table (GPU PC sampling data)
# - Added rocpd_disassembly_data table (optional persisted instruction text)
# - Added rocpd_event.parent_id for parent/child event relationships
# - Populated rocpd_info_code_object.storage_type (column present since 3.0.1)
