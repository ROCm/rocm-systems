#
# HIP test suite inventory.
#
# Stable, evidence-backed records for the meaningful test groups under
# projects/hip-tests. Facts are derived from CMake suite placement, the
# config/ YAML case metadata, contract source annotations, and the in-repo CI
# workflow - not from the generated catch/TEST_PLAN.md, which is cited as
# evidence but never duplicated here. All source and evidence paths are relative
# to this component directory (projects/hip-tests); CI lanes that live outside
# this repository are marked `external:`.

schema_version: 1
component: hip-tests
source_of_truth:
  suite_placement: catch/*/CMakeLists.txt
  case_metadata: catch/config/configs/*.yaml
  contract_assertions: catch/contract/**/*.cc
  generated_inventory: catch/TEST_PLAN.md
  ci_gates: ../../.github/workflows/*.yml and external CI references in TESTING.md

vocabularies:
  kind: [contract, unit, functional, integration, stress, performance]
  disposition: [keep, merge_into, migrate, demote, retire, new, review]
  gating: [trusted, informational, unstable, not_applicable]
  cadence: [pr, build, on_demand]

# How ctest labels referenced by records are produced. catch/config/parse_config.py
# emits, per case: one [group] tag (the config file stem - e.g. contract,
# performance, stress, multiproc, or the unit subdirectory name), one [level_N]
# tag per declared level, one category tag ([quick]/[standard]/[comprehensive]/
# [full]) for every category whose levels intersect the case (see
# catch/config/configs/test_categories.yaml), the per-case semantic [tag]s from
# the config, and [disabled]/[exclude_<target>] tags for skips.
# catch_discover_tests(ADD_TAGS_AS_LABELS) turns every tag into a ctest label, so
# the ctest_labels below are the stable group/category labels; per-case semantic
# tags also exist but vary case by case.
ctest_label_model:
  group_label: catch/config/parse_config.py emits '[<config-stem>]' per case.
  category_labels: [quick, standard, comprehensive, full]
  level_labels: [level_0, level_1, level_2, level_3, level_4]
  skip_labels: '[disabled], [exclude_<target>] - see catch/config/configs/test_categories.yaml'

suites:

  # ---------------------------------------------------------------------------
  # Contract tier: catch/contract/, built ON by default via BUILD_CONTRACT_TESTS.
  # Each domain subdirectory builds a per-domain Contract<Domain>Test executable
  # through hip_add_exe_to_target(... TEST_TARGET_NAME contract_tests); the
  # contract_tests custom target (declared ALL) aggregates them. @asserts tags
  # feed catch/tools/gen_test_plan.py -> catch/TEST_PLAN.md.
  # ---------------------------------------------------------------------------

  - id: contract-memory
    owner: HIP Runtime - Memory
    name: HIP contract memory-allocation tests
    kind: contract
    domain: memory
    purpose: Public allocation, free, memset, host-memory, pitched, managed, and advise invariants and invalid-input behavior.
    oracle: Return code, allocation/state round-trip, or an explicitly accepted unsupported outcome.
    source:
      paths:
        - catch/contract/memory
        - catch/contract/memset
        - catch/contract/driver_memset_async
        - catch/contract/driver_memset_2d
        - catch/contract/driver_memset_async_2d3d
        - catch/contract/host_memory
        - catch/contract/host_alloc_aliases
        - catch/contract/pitched_memory
        - catch/contract/driver_pitched_memory
        - catch/contract/managed_memory
        - catch/contract/mem_advise
        - catch/contract/mem_advise_v2
        - catch/contract/pointer_info
        - catch/contract/pointer_query
        - catch/contract/symbol_copy
        - catch/contract/mem_batch_discard
      build_option: BUILD_CONTRACT_TESTS
      build_target: contract_tests
      executable_pattern: Contract<Domain>Test per catch/contract/<domain>/CMakeLists.txt (e.g. ContractMemoryTest).
    metadata:
      framework: Catch2
      annotations: '@asserts:'
      config: catch/config/configs/contract.yaml
      generated_plan: catch/TEST_PLAN.md
    execution:
      cadence: pr
      gating: trusted
      ctest_labels: [contract]
      platforms: [linux, windows, wsl]
      backends: [amd, nvidia]
      prerequisites: [HIP runtime and device]
      ci_lane:
        external: TheRock build and HIP runtime test jobs run the device suite; see TESTING.md "Pre-submit and CI gates".
    evidence:
      - path: catch/contract/CMakeLists.txt
        claim: Contract memory domains are built under BUILD_CONTRACT_TESTS via add_subdirectory.
      - path: catch/contract/memory/CMakeLists.txt
        claim: ContractMemoryTest is built by hip_add_exe_to_target with TEST_TARGET_NAME contract_tests.
      - path: catch/config/configs/contract.yaml
        claim: Contract memory cases (Contract_Memory_*) carry level and semantic tags.
      - path: catch/TEST_PLAN.md
        claim: Generated plan enumerates the asserted memory invariants (not duplicated here).
    history: Contract coverage drift is enforced so new public memory APIs cannot land without an invariant or an explicit allowlist rationale.
    disposition: keep
    disposition_rationale: Contract tests are the portable allocation-API baseline; exhaustive sizing and behavior belong to the functional unit-memory group.

