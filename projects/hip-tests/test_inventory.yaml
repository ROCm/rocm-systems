  # ---------------------------------------------------------------------------
  # catch/config governance: two build-time static checks wired by
  # catch/config/CMakeLists.txt under if(ENABLE_YAML_TAGS) (the option
  # catch/CMakeLists.txt defaults ON). Both are ALL custom targets that run
  # during any hip-tests build - they are not CI-workflow jobs - and are pulled
  # in as dependencies of the hip_tests_config header-generation target. They
  # govern the YAML case metadata the unit/group configs declare, not any device
  # API, so they carry no GPU/backend dependency and emit no ctest labels.
  # ---------------------------------------------------------------------------
  - id: static-config-check
    owner: HIP Runtime - Test Governance
    name: HIP test YAML config governance check
    kind: contract
    domain: static_validation
    purpose: Build-time governance (not a device test) - fails the build when any case in the catch/config YAML configs is missing a 'level', carries a 'disabled'/'unsupported' skip that is neither a list nor a {targets, reason} mapping, has a populated skip with no 'reason', or a 'reason' with no real Jira reference from a known project key.
    oracle: catch/config/check_config.py exit code over the catch/config/configs YAML tree; a non-zero exit fails the build.
    source:
      paths:
        - catch/config/check_config.py
        - catch/config/common.py
        - catch/config/CMakeLists.txt
      build_option: ENABLE_YAML_TAGS
      build_target: check_hip_tests_config
    metadata:
      framework: python-static-analysis
      config: catch/config/configs/test_categories.yaml
    execution:
      cadence: build
      gating: trusted
      ctest_labels: []
      platforms: [linux, windows]
      backends: [not_applicable]
      prerequisites: [Python 3; PyYAML; CMake configure with ENABLE_YAML_TAGS=ON (default); no ROCm, GPU, or device required]
      ci_lane:
        external: Runs during any hip-tests build as the check_hip_tests_config ALL custom target wired by catch/config/CMakeLists.txt (ENABLE_YAML_TAGS defaults ON) and as a dependency of hip_tests_config; it is a build-time check, not a dedicated in-repo CI workflow. See TESTING.md "Pre-submit and CI gates".
    evidence:
      - path: catch/config/CMakeLists.txt
