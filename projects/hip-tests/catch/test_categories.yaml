test_categories:
  quick:
    description: "Fast sanity checks - Run pre-commit (target: < 5 min)"
    test_patterns:
      - "*"

    exclude:
    labels:
      - "quick"

  standard:
    description: "Core functionality - Run on every PR (target: < 30 min)"
    test_patterns:
      - "*"

    exclude:
    labels:
      - "standard"

  comprehensive:
    description: "Extended testing - Run nightly (target: < 2 hours)"
    test_patterns:
      - "*"

    exclude:
    labels:
      - "comprehensive"

  full:
    description: "Full testing - Run weekly (target: < 4 hours)"
    test_patterns:
      - "*"

    exclude:
    labels:
      - "full"

exclude_gpu:
  exclude_gpu_gfx110X_windows:
    # Windows-only: all gfx110X variants (gfx1100, gfx1101, gfx1102, ...)
    # this block is ignored entirely when configuring on Linux.
    test_patterns:
      - "Unit_hipStreamValue_Wait_Blocking - uint64_t"
      - "Unit_hipStreamValue_Wait_Blocking - uint32_t"

    labels:
      - "ex_gpu_gfx110X"
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"

  exclude_gpu_gfx94X_linux:
    # Linux-only
    test_patterns:
      # TODO(#4244): Flaky with compiler submodule update — subprocess aborted.
      - "Unit_NonHost_Printf_loop"
      - "Unit_NonHost_Printf_multiple_Threads"
      - "Unit_NonHost_Printf_BufferAvailability"
    labels:
      - "quick"
      - "standard"
      - "full"
      - "comprehensive"
      - "ex_gpu_gfx94X"

  exclude_gpu_gfx950_linux:
    # Linux-only
    test_patterns:
      - "Unit_hipHostRegister_AsyncApis"
      - "Unit_hipMemsetDSync - uint32_t"
      - "Unit_hipMemsetDASyncMulti - int8_t"
      - "Unit_hipStreamValue_Wait_Blocking - uint32_t"
      - "Unit_atomicExch_Positive_Same_Address_Compile_Time"
      - "Unit_hipHostRegister_ReferenceFromKernelandhipMemset - int"
      - "Unit_hipHostRegister_Graphs"
      - "Unit_hipManagedKeyword_SingleGpu"
      - "Unit_hipMemsetSync"
      - "Unit_hipMemset2DSync"
      - "Unit_hipMemsetDASyncMulti - int16_t"
      - "Unit_hipStreamValue_Wait_Blocking - uint64_t"
      - "Unit_hipHostRegister_ReferenceFromKernelandhipMemset - float"
      - "Unit_hipMemsetDSync - int8_t"
      - "Unit_hipMemset3DSync"
      - "Unit_hipMemsetDASyncMulti - uint32_t"
      - "Unit_hipStreamValue_Write - TestParams<uint64_t, PtrType::DevicePtrToHost>"
      - "Unit_hipHostRegister_ReferenceFromKernelandhipMemset - double"
      - "Unit_hipGetProcAddress_MemoryApisRegisterUnReg"
      - "Unit_hipMemsetDSync - int16_t"
      - "Unit_hipMemsetASyncMulti"
      - "Unit_hipHostAlloc_AllocateMoreThanAvailGPUMemory"
      - "Unit_hipStreamValue_Write - TestParams<uint32_t, PtrType::DevicePtrToHost>"
      # TODO(#4244): Flaky with compiler submodule update — subprocess aborted.
      - "Unit_NonHost_Printf_loop"
      - "Unit_NonHost_Printf_multiple_Threads"
      - "Unit_NonHost_Printf_BufferAvailability"
    labels:
      - "quick"
      - "standard"
      - "full"
      - "comprehensive"
      - "ex_gpu_gfx950"


execution_settings:
  default_timeout: 300
  timeout_multiplier: 1 # Multiplier for all timeouts (1, 1.5, 1.75, 2, etc.)
  category_timeouts:
    quick: 300          # 5 minutes
    standard: 1800      # 30 minutes
    comprehensive: 7200 # 2 hours
    full: 14400         # 4 hours
