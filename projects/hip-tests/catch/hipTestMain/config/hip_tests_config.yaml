      - amd_windows
      - amd_wsl
      - nvidia_linux
      - nvidia_windows
  disabled_amd: &disabled_amd
    disabled:
      - amd_linux
      - amd_windows
      - amd_wsl
  disabled_nvidia: &disabled_nvidia
