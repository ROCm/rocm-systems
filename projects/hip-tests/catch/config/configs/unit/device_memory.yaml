    <<: *level_2
    tags: [device_memory_device_lang]
  Unit_Device_memset_Positive:
    <<: *level_2
    tags: [device_memory]
  Unit_Device_memset_Negative_Parameters_RTC:
    <<: *level_2
    tags: [device_memory_device_lang]
