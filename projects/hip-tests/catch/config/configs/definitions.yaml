---
definitions:
  level_0: &level_0
    level: [0]
  level_1: &level_1
    level: [1]
  level_2: &level_2
    level: [2]
  level_3: &level_3
    level: [3]
  level_4: &level_4
    level: [4]
  level_default: &level_default
    level: [0, 1, 2]
  level_stress: &level_stress
    level: [3, 4]
  level_all: &level_all
    level: [0, 1, 2, 3, 4]


# ==============================================================================
# DEVICE FEATURES - Capabilities a test case can list in its 'requires' field
#
# A test case that lists features in 'requires' is disabled when the build is
# tailored to the current machine (HIP_TESTS_TAILOR_TAGS_TO_CURRENT_MACHINE=ON)
# and any of those features is not available on it. A feature is available only
# when every visible device supports it. Each feature is also emitted as a
# [requires_<feature>] tag on the test case.
#
# This list is the single source of truth: 'requires' may only name features
# listed here, and config/sysinfo/hip_tests_sysinfo.cc must report exactly
# these features. Both are enforced at build time.
# ==============================================================================
features:
  images: Image and texture objects (hipDeviceAttributeImageSupport)
  managed_memory: Managed memory allocation (hipDeviceAttributeManagedMemory)
  concurrent_managed_access: Coherent access to managed memory concurrently with the CPU (hipDeviceAttributeConcurrentManagedAccess)
  pageable_memory_access: Coherent access to pageable host memory, HMM (hipDeviceAttributePageableMemoryAccess)
  host_native_atomics: Native atomics on the device-host link (hipDeviceAttributeHostNativeAtomicSupported)
  host_register: Host memory registration via hipHostRegister (hipDeviceAttributeHostRegisterSupported)
  cooperative_launch: Cooperative kernel launch (hipDeviceAttributeCooperativeLaunch)
  cooperative_multi_device_launch: Cooperative kernel launch on multiple devices (hipDeviceAttributeCooperativeMultiDeviceLaunch)
  virtual_memory: Virtual memory management (hipDeviceAttributeVirtualMemoryManagementSupported)
  memory_pools: Stream ordered memory allocator (hipDeviceAttributeMemoryPoolsSupported)
  large_bar: Large BAR, host-visible device memory (hipDeviceAttributeIsLargeBar)
  stream_wait_value: hipStreamWaitValue32/64 (hipDeviceAttributeCanUseStreamWaitValue)
  multi_gpu: At least two visible devices
  p2p: At least two visible devices and every device can access every other device as a peer

# ==============================================================================
# LEVEL PARAMETERS - Test parameters for each level
# These are converted to C++ compile-time constants at build time
# 
# memory_sizes:
# [TODO]
# block_sizes:
# [TODO]
# iterations:
# Number of iterations used for performance, atomic and threadfence tests
# warmups:
# Number of warmup iterations used for performance tests
# cg_iterations:
# Number of iterations used for cooperative groups sync tests
# math_accuracy_iterations:
# Number of iterations used for math accuracy tests with randomly generated inputs
# math_accuracy_max_memory_percentage:
# Percentage of global device memory allowed for math accuracy tests in case the global device memory is lower than max_memory
# math_max_memory:
# Maximum amount of memory to use for math accuracy tests
# math_reduction_factor:
# Percentage of test data to be actually tested
# 
# [TODO] The values below are example defaults and should be replaced with the actual values.
# ==============================================================================
cmd_options:
  # Level 0 - Quick/Smoke Tests
  # Use case: Emulation environment, PR validation, quick sanity checks
  # Runtime: seconds
  level_0:
    memory_sizes: [1K, 1M, 10M]
    block_sizes: [64, 256]
    iterations: 100
    warmups: 10
    cg_iterations: 1
    math_accuracy_iterations: 4294967296
    math_accuracy_max_memory_percentage: 80
    math_max_memory: 1G
    math_reduction_factor: 0.1

  # Level 1 - Standard Tests
  # Use case: Nightly CI, regular regression testing
  # Runtime: minutes
  level_1:
    memory_sizes: [1K, 4K, 64K, 1M, 10M, 50M, 100M]
    block_sizes: [32, 64, 128, 256, 512, 1024]
    iterations: 1000
    warmups: 100
    cg_iterations: 1
    math_accuracy_iterations: 4294967296
    math_accuracy_max_memory_percentage: 80
    math_max_memory: 4G
    math_reduction_factor: 0.1

  # Level 2 - Comprehensive Tests
  # Use case: Release validation, full coverage
  # Runtime: hours
  level_2:
    memory_sizes: [64, 256, 1K, 4K, 16K, 64K, 256K, 1M, 10M, 50M, 100M, 500M, 1G, 2G]
    block_sizes: [32, 64, 96, 128, 192, 256, 384, 512, 768, 1024]
    iterations: 5
    warmups: 5
    cg_iterations: 2
    math_accuracy_iterations: 4294967296
    math_accuracy_max_memory_percentage: 80
    math_max_memory: 8G
    math_reduction_factor: 0.1

  # Level 3 - Performance/Stress Tests
  # Use case: Benchmarks, stress testing
  # Runtime: variable
  level_3:
    memory_sizes: [100M, 1G, 2G]
    block_sizes: [256, 512, 1024]
    iterations: 5
    warmups: 5
    cg_iterations: 5
    math_accuracy_iterations: 4294967296
    math_accuracy_max_memory_percentage: 80
    math_max_memory: 2G
    math_reduction_factor: 100

  # Level 4 - Extended Stress Tests
  # Use case: Full system stress, extended validation
  # Runtime: hours
  level_4:
    memory_sizes: [256M, 512M, 1G, 2G, 4G]
    block_sizes: [256, 512, 1024]
    iterations: 10
    warmups: 5
    cg_iterations: 5
    math_accuracy_iterations: 4294967296
    math_accuracy_max_memory_percentage: 80
    math_max_memory: 4G
    math_reduction_factor: 100
