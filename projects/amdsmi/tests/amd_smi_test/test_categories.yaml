# AMD SMI (amdsmitst) Test Categories Configuration
# Aligned with Test Filter Standardization (quick/standard/comprehensive/full).
#
# Per-ASIC exclusions are not listed in this file. They live in
# amdsmitst.exclude (FILTER[]). generate_exclude_gpu_yaml.py reads that file
# and gpu_family_to_asic below, and writes the exclude_gpu_* blocks into the
# build-tree YAML that parse_test_categories.py reads.
#
# The amdsmitst gtest suites follow the naming scheme
# `<Component><Type>[<Operation>]` (see docs/conceptual/test-design.md):
#   Component : Gpu*, System*, Ifoe*   (Cpu*, Nic* reserved)
#   Type      : *Unit*        - host-side, no hardware/root required
#               *Functional*  - exercises a live device
#   Operation : *ReadOnly*    - queries only, no root required
#               *ReadWrite*   - mutates device state, root required
#
# AMD SMI Test Quality Definitions:
# 1. P0 - **Quick** -  Unit & Smoke tests only (no driver, no sudo required).
# 2. P1 - **Standard** - nightly-easy (driver, read-only, no sudo) (+ P0)
# 3. P2 - **Comprehensive** - nightly-medium (writes, needs sudo) (+ P0/P1) - All tests
# 4. P3 - **Full** - all tests (P0-P2)
#
# Running the categories:
#   - TheRock CI: test_runner.py drives the installed tree with
#       ctest --test-dir <install>/share/amd_smi/tests/ctest -L '^<category>$' -L '^ex_gpu_<arch>$'
#     Use -LE ex_gpu instead of the second -L for GPUs without an arch label.
#     which is self-contained (no top-level enable_testing() needed).
#   - Local dev: enable_testing() is only called in this test subdir, not at the
#     amdsmi top-level CMakeLists.txt, so `ctest` from the build root won't
#     discover these. Run from the test build dir (or point ctest at it):
#       ctest --test-dir <build>/tests/amd_smi_test -L '^quick$' -L '^ex_gpu_<arch>$'

# Cross-ASIC exclusions. amdsmitst.exclude currently keeps both
# PERMANENT_BLACKLIST_ALL_ASICS and TEMPORARY_BLACKLIST_ALL_ASICS empty, so the
# only always-on exclude is disabled gtests.
_common_excludes: &common_excludes
  - "*DISABLED*"

test_categories:
  quick:
    description: "P0 - Quick - Unit & Smoke tests only (no driver, no sudo required)."
    test_patterns:
      - "*Unit.*"
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "P1 - Standard - nightly-easy (driver, read-only, no sudo) (+ P0)"
    test_patterns:
      - "*FunctionalReadOnly.*"
      - "*Unit.*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "P2 - Comprehensive - nightly-medium (writes, needs sudo) (+ P0/P1) - All tests"
    test_patterns:
      - "*"
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  # NOTE: `full` currently equals `comprehensive` (same "*" patterns and
  # excludes; only the labels and timeout differ). It is a placeholder for the
  # standardized 4-tier contract, reserved for future stress / long-haul
  # additions -- it is not buying extra coverage today.
  full:
    description: "P3 - Full - all tests (P0-P2)"
    test_patterns:
      - "*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

# ctest family label -> FILTER[] key in amdsmitst.exclude. 90401 and 90402
# alias 90400 in that file, so gfx94X is the only MI300 family. A FILTER key
# that has patterns and is not listed here, as an alias, or as virtualization
# fails configure. gfx1100 and gfx115X have no FILTER entry after #14026, so
# they get no exclude_gpu block and use the generic suite (-LE ex_gpu).
#
# FILTER[virtualization] is intentionally absent. detect_asic_filter.sh appends
# it only for SR-IOV or VF. Copying it onto a family would also drop those
# tests on bare metal. Unprivileged containers skip read/write cases via
# AMDSMI_NON_PRIVILEGED instead.
gpu_family_to_asic:
  gfx906: vega20
  gfx908: arcturus
  gfx90a: aldebaran
  gfx94X: "90400"
  gfx103X: sienna_cichlid

filter_key_aliases:
  "90401": "90400"
  "90402": "90400"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  # These become per-suite ctest TIMEOUT properties. They are kept under the
  # amdsmi job's GitHub step timeout (timeout_minutes: 45 in TheRock's
  # fetch_test_configurations.py) so a hung suite is killed and reported by
  # ctest (with --output-on-failure) instead of the whole job dying with an
  # opaque "exceeded max execution time". The amdsmitst suites currently run in
  # well under a minute; raise both this and timeout_minutes together if a
  # category ever needs a larger budget.
  category_timeouts:
    quick: 300            # 5 minutes
    standard: 1800        # 30 minutes
    comprehensive: 1800   # 30 minutes
    full: 1800            # 30 minutes
