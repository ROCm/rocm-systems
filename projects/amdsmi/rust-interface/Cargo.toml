[package]
name = "amdsmi"
version = "26.4.0"
edition = "2021"
rust-version = "1.78"
description = "Rust bindings for the AMD System Management Interface (AMD-SMI) library"
documentation = "https://docs.rs/amdsmi"
repository = "https://github.com/ROCm/rocm-systems"
homepage = "https://rocm.docs.amd.com/projects/amdsmi/en/latest/"
readme = "README.md"
license = "MIT"
keywords = ["amd", "gpu", "rocm", "monitoring", "smi"]
categories = ["hardware-support", "os::linux-apis", "api-bindings"]

# Declare that this crate links to the native `amd_smi` library so cargo can
# detect duplicate FFI bindings in a dependency graph.
links = "amd_smi"

# Limit the set of files uploaded to crates.io to the files needed to build
# and use the crate. Anything not matched here is excluded even if it lives
# inside the crate root.
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "examples/**/*.md",
    "examples/**/*.yml",
    "build.rs",
    "callbacks.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]

[package.metadata.docs.rs]
all-features = true
# Sets `cfg(docsrs)` for `cargo doc` on docs.rs so we can conditionally enable
# nightly-only documentation features (e.g. `doc_cfg`).
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
libc = "0.2"

[build-dependencies]
bindgen = "0.70.1"

[lib]
name = "amdsmi"
path = "src/lib.rs"

[[example]]
name = "amdsmi_get_gpu_info"
crate-type = ["bin"]

[[example]]
name = "amdsmi_exporter"
crate-type = ["bin"]

[dev-dependencies]
prometheus-client = "0.23"
axum = "0.8"
clap = "4"
tokio = { version = "1", features = ["full"] }
