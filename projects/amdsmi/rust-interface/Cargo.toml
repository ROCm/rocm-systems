[package]
name = "amdsmi"
version = "26.1.0"
edition = "2021"
rust-version = "1.70"
description = "Rust bindings for AMD System Management Interface (AMD-SMI) library"
documentation = "https://docs.rs/amdsmi"
repository = "https://github.com/ROCm/amdsmi"
homepage = "https://rocm.docs.amd.com/projects/amdsmi/en/latest/"
readme = "README.md"
license = "MIT"
keywords = ["amd", "gpu", "rocm", "monitoring", "smi"]
categories = ["hardware-support", "os::linux-apis", "api-bindings"]

# Prevent multiple versions of this crate from linking to the same native library
links = "amd_smi"

# Include only necessary files in the published crate
include = [
    "src/**/*",
    "examples/**/*",
    "build.rs",
    "callbacks.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]

[dependencies]
libc = "0.2"

[build-dependencies]
bindgen = "0.70.1"

[lib]
name = "amdsmi"
path = "src/lib.rs"

[[example]]
name = "amdsmi_get_gpu_info"
crate-type = ["bin"]

[[example]]
name = "amdsmi_exporter"
crate-type = ["bin"]

[dev-dependencies]
prometheus-client = "0.22.3"
axum = "0.5"
hyper = "0.14"
clap = "3.0"
tokio = { version = "1", features = ["full"] }
