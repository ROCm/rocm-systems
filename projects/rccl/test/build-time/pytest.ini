# pytest.ini
[pytest]
markers =
    build_time: marks build-time regression tests
    compare: base-vs-head ratio gate (needs --compare-base)
    absolute: absolute wall-clock threshold gate (default mode)

testpaths = tests
addopts = --import-mode=importlib

# record_property (the per-target timings) needs xunit1; under the xunit2
# default pytest warns and the numbers are not guaranteed to reach the report.
junit_family = xunit1
