# CTest categories for host-only src/tuning/ microtests.
#
# Suites start with their source unit's stem. The exception is sym_model.cc's
# parameterized SymTdmEndpoints/ instantiation.
test_categories:
  quick: &micro_tuning_quick
    description: "Smoke - host-only src/tuning/ micro-tests, sub-second."
    test_patterns:
      - "CeModel*"
      - "Collnet*"
      - "CostModel*"
      - "Pat*"
      - "SymModel*"
      - "SymTdmEndpoints/SymModelTdmSelectionTest.*"
      - "Tree*"
      - "Tuning*"  # tuning.cc; also matches tuning_general.cc's TuningGeneral suite
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_tuning_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_tuning_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_tuning_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
