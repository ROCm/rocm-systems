# CTest categories for host-only src/ras/ microtests.
#
# Suites start with their source unit's stem. The exception is client_support.cc's
# parameterized Commands/ instantiation.
test_categories:
  quick: &micro_ras_quick
    description: "Smoke - host-only src/ras/ micro-tests, sub-second."
    test_patterns:
      - "Commands/RasClientSupportEnqueueFailureMicrotest.*"
      - "RasClientMicrotest.*"
      - "RasClientSupportMicrotest.*"
      - "RasCollectivesMicrotest.*"
      - "RasDiagnosticsCommonMicrotest.*"
      - "RasDiagnosticsEnvMicrotest.*"
      - "RasDiagnosticsGpuMicrotest.*"
      - "RasDiagnosticsMicrotest.*"
      - "RasMicrotest.*"
      - "RasNetMicrotest.*"
      - "RasParamMicrotest.*"
      - "RasPeersMicrotest.*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_ras_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_ras_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_ras_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
