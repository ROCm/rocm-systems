# CTest categories for the host-only src/transport/generic.cc microtests.
#
# gtest's `*` does not match across the literal `.`, so a suite with no pattern
# here builds and passes locally but never runs under CTest. Keep this in sync
# with the TEST suite names in transport-generic-test.cc.
test_categories:
  quick: &micro_transport_generic_quick
    description: "Smoke - host-only src/transport/generic.cc micro-tests (PAT connection setup), sub-second."
    test_patterns:
      - "PatConnectMicrotest.*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_transport_generic_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_transport_generic_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_transport_generic_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
