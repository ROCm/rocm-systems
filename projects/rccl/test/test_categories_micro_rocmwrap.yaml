# rccl-UnitTestsMicroRocmwrap — shared/ctest schema.
# Host-only micro-tests for src/misc/rocmwrap.cc -- kernel-version probe, cuMem VMM capability
# checks, and rocmLibraryInit's ROCr/DMA-BUF setup (no GPU, no librccl).
# RCCL does not support Windows: exclude_windows matches all tests so generated suites are empty on Windows.

test_categories:
  quick: &micro_rocmwrap_quick
    description: "Smoke — host-only src/misc/rocmwrap.cc cuMem capability and DMA-BUF init micro-tests, sub-second."
    test_patterns:
      - "Rocmwrap*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_rocmwrap_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_rocmwrap_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_rocmwrap_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
