# CTest categories for host-only src/rma/ microtests.
#
# gtest's `*` does not match across the literal `.`, so a suite with no pattern
# here builds and passes locally but never runs under CTest. Keep this in sync
# with the TEST_F suite names in test/host/rma/.
test_categories:
  quick: &micro_rma_quick
    description: "Smoke - host-only src/rma/ micro-tests, sub-second."
    test_patterns:
      # rma.cc
      - "RmaDebugLoggingTest.*"
      - "RmaLaunchTest.*"
      - "RmaProxyGatingTest.*"
      - "RmaProxyReadyTest.*"
      - "RmaPutTest.*"
      - "RmaScheduleTest.*"
      - "RmaWaitSignalTest.*"
      # rma_ce.cc
      - "RmaCe*"
      # rma_proxy.cc
      - "RmaProxyAllocGraphTest.*"
      # rma_proxy_launch.cc
      - "RmaProxyBatchMemOpTest.*"
      - "RmaProxyDescriptorTest.*"
      - "RmaProxyLaunchTest.*"
      - "RmaProxyParamsTest.*"
      - "RmaProxyQueueTest.*"
      - "RmaProxyReclaimTest.*"
      # rma_proxy_progress.cc
      - "RmaProxyProgressTest.*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_rma_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_rma_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_rma_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
