# rccl-UnitTestsMPI — shared/ctest schema (requires ENABLE_MPI_TESTS at configure time).
# RCCL does not support Windows: exclude_windows matches all tests so generated suites are empty on Windows.
#
# Tiers:
#   quick — broad MPI smoke (P2P, SHM, NET, NetIB, ImplicitLaunchOrder, UBR, GraphCapture).
#   quick_env_* — smoke env-overlays (narrow pattern set under non-default env).
#   standard — same test_patterns as comprehensive; lighter env.
#   comprehensive — same test_patterns as standard; adds env (rank logs, implicit launch order,
#     P2P/SHM CE memcpy flags).
#   full_base — same patterns/env as comprehensive; auto algorithm/protocol selection.
#   full_base / full_pow2_* — label "full" + full_regression for CI.
#   full_pow2_* — narrowed to the collective-issuing subset of MPI tests, run under
#     forced (NCCL_ALGO, NCCL_PROTO) combinations. The other MPI suites (raw send/recv
#     P2P/SHM/Net transport tests and direct net-plugin tests) never consult algo/proto,
#     so re-running them under forced env vars adds runtime without coverage.
#     Matrix: (Ring, Tree) x (Simple, LL, LL128). LL128 categories also set
#     RCCL_LL128_FORCE_ENABLE=1 to bypass topo-based gating
#     (LL128 string parsing itself is not compile-gated).
#     Rank count from the job (e.g. NGPU); np in {1,2,4,8} for pow2.

test_categories:
  quick:
    description: "MPI smoke — P2P, SHM, NET, NetIB, ImplicitLaunchOrder, UBR, and GraphCapture coverage."
    test_patterns:
      - "P2pMPITest.*"
      - "ShmMPITest.*"
      - "NetTransportMPITest.*"
      - "NetIbMPITest.*"
      - "ImplicitLaunchOrderMPITest.MultiCommunicatorChain"
      - "UBR_AllReduce.OutOfPlace_MultiNode"
      - "UBR_AllGather.OutOfPlace_MultiNode"
      - "UBR_ReduceScatter.OutOfPlace_MultiNode"
      - "UBR_Broadcast.NonZeroRoot_MultiNode"
      - "UBR_AllToAll.OutOfPlace_MultiNode"
      - "UBR_SendRecv.RingPattern_MultiNode"
      - "UBR_AllToAllStress.InterleavedMultiSize_MultiNode"
      - "UBR_AllToAllStress.InterleavedWithSplitComm_MultiNode"
      - "UBR_AllToAllStress.ConcurrentMultiComm_MultiNode"
      - "UBR_ConcurrentRegHang.*SHOULD_WORK"
      - "GraphCapture_AllToAll.MultiNode"
      - "GraphCapture_AllReduce.MultiNode"
    exclude_windows: &mpi_exclude_windows
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "mpi"
    env_variables: &mpi_quick_env
      - "NCCL_DEBUG=INFO"
      - "NCCL_LAUNCH_MODE=GROUP"
      - "NCCL_DMABUF_ENABLE=1"
      - "NCCL_LOCAL_REGISTER=1"
      - "NCCL_LEGACY_CUDA_REGISTER=1"
      - "NCCL_GRAPH_REGISTER=1"
  quick_env_shm_ce_memcpy_send:
    description: "Shared-memory CE memcpy on send side (mode 1, locality 1)."
    test_patterns:
      - "ShmMPITest.ShmWithMemcpyTest"
    exclude_windows: *mpi_exclude_windows
    labels: &mpi_quick_labels
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "mpi"
    env_variables:
      - "NCCL_DEBUG=INFO"
      - "NCCL_LAUNCH_MODE=GROUP"
      - "NCCL_SHM_DISABLE=0"
      - "NCCL_SHM_USE_CUDA_MEMCPY=1"
      - "NCCL_SHM_MEMCPY_MODE=1"
      - "NCCL_SHM_LOCALITY=1"
  quick_env_shm_ce_memcpy_recv:
    description: "Shared-memory CE memcpy on recv side (mode 2, locality 2)."
    test_patterns:
      - "ShmMPITest.ShmWithMemcpyTest"
    exclude_windows: *mpi_exclude_windows
    labels: *mpi_quick_labels
    env_variables:
      - "NCCL_DEBUG=INFO"
      - "NCCL_LAUNCH_MODE=GROUP"
      - "NCCL_SHM_DISABLE=0"
      - "NCCL_SHM_USE_CUDA_MEMCPY=1"
      - "NCCL_SHM_MEMCPY_MODE=2"
      - "NCCL_SHM_LOCALITY=2"
  quick_env_shm_ce_memcpy_both_simple:
    description: "Shared-memory CE memcpy on both sides under Simple protocol (mode 3)."
    test_patterns:
      - "ShmMPITest.ShmWithMemcpyTest"
    exclude_windows: *mpi_exclude_windows
    labels: *mpi_quick_labels
    env_variables:
      - "NCCL_DEBUG=INFO"
      - "NCCL_LAUNCH_MODE=GROUP"
      - "NCCL_SHM_DISABLE=0"
      - "NCCL_SHM_USE_CUDA_MEMCPY=1"
      - "NCCL_SHM_MEMCPY_MODE=3"
      - "NCCL_SHM_LOCALITY=1"
      - "NCCL_PROTO=Simple"
  quick_env_p2p_workflow:
    description: "P2P workflow with explicit P2P enabled and CUDA memcpy."
    test_patterns:
      - "P2pMPITest.P2pWorkflow"
    exclude_windows: *mpi_exclude_windows
    labels: *mpi_quick_labels
    env_variables:
      - "NCCL_DEBUG=INFO"
      - "NCCL_LAUNCH_MODE=GROUP"
      - "NCCL_P2P_USE_CUDA_MEMCPY=1"
      - "NCCL_LEGACY_CUDA_REGISTER=1"
      - "NCCL_P2P_DISABLE=0"
  quick_env_p2p_ipc_small_buffer:
    description: "P2P IPC registration with very small buffer and SHM disabled."
    test_patterns:
      - "P2pMPITest.P2pIpcBufferRegistration_VerySmallBuffer"
    exclude_windows: *mpi_exclude_windows
    labels: *mpi_quick_labels
    env_variables:
      - "NCCL_DEBUG=INFO"
      - "NCCL_LAUNCH_MODE=GROUP"
      - "NCCL_P2P_USE_CUDA_MEMCPY=1"
      - "NCCL_LEGACY_CUDA_REGISTER=1"
      - "NCCL_SHM_DISABLE=1"
      - "NCCL_LOCAL_REGISTER=1"
  quick_env_net_graph_register:
    description: "Multinode net transport with graph buffer registration."
    test_patterns:
      - "NetTransportMPITest.NetGraphRegisterBufferTest"
    exclude_windows: *mpi_exclude_windows
    labels: *mpi_quick_labels
    env_variables:
      - "NCCL_DEBUG=INFO"
      - "NCCL_LAUNCH_MODE=GROUP"
      - "NCCL_NET_SHARED_COMMS=1"
      - "NCCL_NET_SHARED_BUFFERS=1"
      - "NCCL_IB_DISABLE=0"
      - "NCCL_LEGACY_CUDA_REGISTER=1"
      - "NCCL_GRAPH_REGISTER=1"
  quick_env_netib_xfer_trace:
    description: "InfiniBand transfer suite under TRACE-level NET/INIT logging."
    test_patterns:
      - "NetIbMPITest.SimpleSendRecv:NetIbMPITest.SendRecvMultipleSizes:NetIbMPITest.LargeTransfer:NetIbMPITest.SendRecvDifferentMemoryTypes:NetIbMPITest.SendRecvMultipleSizesFusion:NetIbMPITest.MultipleOutstandingSendRecv"
    exclude_windows: *mpi_exclude_windows
    labels: *mpi_quick_labels
    env_variables:
      - "NCCL_DEBUG=TRACE"
      - "NCCL_DEBUG_SUBSYS=NET,INIT"
      - "NCCL_LAUNCH_MODE=GROUP"
      - "NCCL_DMABUF_ENABLE=1"
  quick_env_netib_xfer_log_ranks:
    description: "InfiniBand SimpleSendRecv with all-rank logging."
    test_patterns:
      - "NetIbMPITest.SimpleSendRecv"
    exclude_windows: *mpi_exclude_windows
    labels: *mpi_quick_labels
    env_variables:
      - "NCCL_DEBUG=TRACE"
      - "NCCL_DEBUG_SUBSYS=NET,INIT"
      - "NCCL_LAUNCH_MODE=GROUP"
      - "NCCL_DMABUF_ENABLE=1"
      - "RCCL_MPI_LOG_ALL_RANKS=1"
  # The QP-sharing functional gate. The same five tests run at three values of
  # RCCL_IB_COMM_NGROUPS: expectations are derived from ngroups by the reference
  # model (test/transport/NetIbMPI/QpShareRefModel.hpp), so no test is pinned to
  # a value and none skips outside one. RCCL_PARAM caches both tunables per
  # process, which is why ngroups varies across categories rather than within a
  # test. See test/transport/NetIbMPI/QpSharingTestGuide.md.
  quick_env_qpshare_ngroups1:
    description: "QP sharing gate, maximum concentration: NGROUPS=1 puts every connection in group 0, so the whole functional set runs on one shared QP. DEPTH_MULTIPLIER=8 is pinned rather than left at the default so the preset does not sit near the saturation ceiling; measured on AINIC that ceiling is between 112 and 128 comms per group even at depth 1, far above anything these tests reach, so 8 is headroom and not a requirement (the under-provisioned point is gated separately by quick_env_qpshare_undersized_depth)."
    test_patterns: &qpshare_functional_tests
      - "NetIbMPITest.QpShareAlgoLayoutSweep:NetIbMPITest.QpShareAlgoChurnLayout:NetIbMPITest.QpShareDataAllConnsTransfer:NetIbMPITest.QpShareDataUnsharedGroups:NetIbMPITest.QpShareDataFlushRouting"
    exclude_windows: *mpi_exclude_windows
    labels: *mpi_quick_labels
    env_variables:
      - "NCCL_IB_MERGE_NICS=0"
      - "NCCL_NET_FORCE_MERGE="
      - "RCCL_IB_COMM_NGROUPS=1"
      - "RCCL_IB_QP_DEPTH_MULTIPLIER=8"
      - "NCCL_GDR_FLUSH_DISABLE=0"
  quick_env_qpshare_ngroups2:
    description: "QP sharing gate, smallest mixed configuration: NGROUPS=2 places a PRIMARY-only group beside a PRIMARY+SECONDARY group — the first point at which group-index arithmetic can be wrong without being invisible. Same five functional tests."
    test_patterns: *qpshare_functional_tests
    exclude_windows: *mpi_exclude_windows
    labels: *mpi_quick_labels
    env_variables:
      - "NCCL_IB_MERGE_NICS=0"
      - "NCCL_NET_FORCE_MERGE="
      - "RCCL_IB_COMM_NGROUPS=2"
      - "RCCL_IB_QP_DEPTH_MULTIPLIER=8"
      - "NCCL_GDR_FLUSH_DISABLE=0"
  quick_env_qpshare_ngroups16:
    description: "QP sharing gate, wide configuration: at NGROUPS=16 the connection counts straddle the shared and unshared regimes within one run, and the layout sweep reaches 33 connections across 16 groups. Same five functional tests. Expected green, but INTERMITTENTLY CRASHES — measured 2 runs in 18 on AINIC (2026-08-17) — on a use-after-free in the group teardown path, so a signal-kill here is that known defect rather than a new regression. The qpshare_uaf_teardown category below reproduces the same bug deterministically and is the acceptance criterion for it; do not add a retry here to make this category look stable."
    test_patterns: *qpshare_functional_tests
    exclude_windows: *mpi_exclude_windows
    labels: *mpi_quick_labels
    env_variables:
      - "NCCL_IB_MERGE_NICS=0"
      - "NCCL_NET_FORCE_MERGE="
      - "RCCL_IB_COMM_NGROUPS=16"
      - "RCCL_IB_QP_DEPTH_MULTIPLIER=8"
      - "NCCL_GDR_FLUSH_DISABLE=0"
  quick_env_qpshare_undersized_depth:
    description: "QP sharing under-provisioned point: NGROUPS=1 at the default depth multiplier (1), so 128 comms share a QP whose queues were sized for one. The invariant is unchanged — no (ngroups, depth, nconns) combination may fail to connect or corrupt a transfer; the transport is expected to size for the group or degrade to an unshared QP via the existing qp_sharing_skip_sender path in connect.cc. It does not do that today, so this category is EXPECTED RED: it is the acceptance criterion for the saturation-fallback fix, deliberately gating rather than disabled. Measured 2026-08-17 on AINIC: 112 comms/group at depth 1 is fine and 128 is not, hence the pinned count — the default counts elsewhere in the suite do not reach the ceiling. The break lands in the data phase (ibv_post_send ENOMEM) after every connection has established, so it is silent until traffic flows."
    test_patterns:
      - "NetIbMPITest.QpShareDataAllConnsTransfer"
    exclude_windows: *mpi_exclude_windows
    # Deliberately NOT *mpi_quick_labels: this category is expected red, and a
    # permanently-red entry in the smoke/precheck gate gets muted, which is how
    # an acceptance criterion quietly stops being one. Selectable and
    # excludable via the qpshare_known_red label instead.
    labels: &qpshare_known_red_labels
      - "rccl"
      - "mpi"
      - "qpshare"
      - "qpshare_known_red"
    env_variables:
      - "NCCL_IB_MERGE_NICS=0"
      - "NCCL_NET_FORCE_MERGE="
      - "RCCL_IB_COMM_NGROUPS=1"
      - "QPSHARE_TEST_NCONNS=128"
  quick_env_qpshare_depth_ceiling:
    description: "QP sharing depth-multiplier ceiling — the same missing capacity check from the opposite side. The multiplier is applied to the QP work-queue sizing as given, so a value the device cannot allocate kills the FIRST connection instead of being clamped to the device limit; nothing is shared yet at that point, so a saturation fallback would not help either. EXPECTED RED, acceptance criterion for clamping the multiplier. Root cause measured 2026-08-17 on AINIC: the shared CQ is sized 768 × NCCL_IB_QPS_PER_CONNECTION × RCCL_IB_QP_DEPTH_MULTIPLIER entries (connect.cc:949, :1730) and passed to ibv_create_cq unchecked against device_attr.max_cqe. Bisected against that device's max_cqe of 65435: qps × depth = 85 passes, 86 fails, on both the qps=1 and qps=2 paths, so the usable depth is floor(max_cqe / (768 × qps)) — 85 at QPS=1, 42 at the default QPS of 2. Both knobs are pinned here because they multiply into the same limit. The ceiling is hardware-dependent — on a NIC with a larger max_cqe this category passes until the multiplier is raised past floor(max_cqe / 768)."
    test_patterns:
      - "NetIbMPITest.QpShareDataAllConnsTransfer"
    exclude_windows: *mpi_exclude_windows
    labels: *qpshare_known_red_labels
    env_variables:
      - "NCCL_IB_MERGE_NICS=0"
      - "NCCL_NET_FORCE_MERGE="
      - "RCCL_IB_COMM_NGROUPS=1"
      - "RCCL_IB_QP_DEPTH_MULTIPLIER=96"
      - "NCCL_IB_QPS_PER_CONNECTION=1"
      - "QPSHARE_TEST_NCONNS=2"
  standard:
    description: "MPI regression — all transport / IB / implicit-launch / UBR / graph-capture suites (same patterns as comprehensive; lighter env)."
    test_patterns: &mpi_all_patterns
      - "P2pMPITest.*"
      - "NetTransportMPITest.*"
      - "ShmMPITest.*"
      - "NetIbMPITest.*"
      - "ImplicitLaunchOrderMPITest.*"
      - "UBR_AllReduce.*"
      - "UBR_AllGather.*"
      - "UBR_ReduceScatter.*"
      - "UBR_Broadcast.*"
      - "UBR_AllToAll.*"
      - "UBR_SendRecv.*"
      - "UBR_AllToAllStress.*"
      - "UBR_ConcurrentRegHang.*SHOULD_WORK"
      - "GraphCapture_AllToAll.*"
      - "GraphCapture_AllReduce.*"
    exclude_windows: *mpi_exclude_windows
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "mpi"
    env_variables:
      - "NCCL_DEBUG=INFO"
  comprehensive:
    description: "MPI exhaustive — same suites as standard; env enables implicit launch, CE memcpy paths, and verbose rank logs."
    test_patterns: *mpi_all_patterns
    exclude_windows: *mpi_exclude_windows
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "mpi"
    env_variables: &mpi_comprehensive_env
      - "NCCL_DEBUG=INFO"
      - "RCCL_MPI_LOG_ALL_RANKS=1"
      - "NCCL_LAUNCH_ORDER_IMPLICIT=1"
      # P2pMPITests / ShmMPITests: enable CE memcpy sub-paths (default off in transport NCCL_PARAM).
      - "NCCL_P2P_USE_CUDA_MEMCPY=1"
      - "NCCL_SHM_USE_CUDA_MEMCPY=1"
  comprehensive_disable_env:
    description: "MPI env-disabled sanity check — runs only ImplicitLaunchOrderMPITest.MultiCommunicatorChain* with RCCL_MPI_LOG_ALL_RANKS=0 and NCCL_LAUNCH_ORDER_IMPLICIT=0 to verify behavior when these env knobs are off."
    test_patterns:
      - "ImplicitLaunchOrderMPITest.MultiCommunicatorChain*"
    exclude_windows: *mpi_exclude_windows
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "mpi"
    env_variables:
      - "NCCL_DEBUG=INFO"
      - "RCCL_MPI_LOG_ALL_RANKS=0"
      - "NCCL_LAUNCH_ORDER_IMPLICIT=0"
  full_base:
    description: "Same patterns and env as comprehensive — auto algorithm/protocol selection (no NCCL_PROTO / NCCL_ALGO)."
    test_patterns: *mpi_all_patterns
    exclude_windows: *mpi_exclude_windows
    labels:
      - "rccl"
      - "mpi"
      - "full"
      - "full_regression"
    env_variables: *mpi_comprehensive_env
  full_disable_env:
    description: "MPI env-disabled sanity check (full tier) — runs only ImplicitLaunchOrderMPITest.MultiCommunicatorChain* with RCCL_MPI_LOG_ALL_RANKS=0 and NCCL_LAUNCH_ORDER_IMPLICIT=0 to verify behavior when these env knobs are off."
    test_patterns:
      - "ImplicitLaunchOrderMPITest.MultiCommunicatorChain*"
    exclude_windows: *mpi_exclude_windows
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "mpi"
    env_variables:
      - "NCCL_DEBUG=INFO"
      - "RCCL_MPI_LOG_ALL_RANKS=0"
      - "NCCL_LAUNCH_ORDER_IMPLICIT=0"
  full_pow2_ring_simple:
    description: "Collective subset under forced Ring + Simple. Run with np in {1,2,4,8} for pow2 rank sweep. Patterns narrowed to tests that issue NCCL collectives — algo/proto have no effect on raw send/recv or net-plugin tests."
    test_patterns: &mpi_collective_patterns
      - "P2pMPITest.P2pWithMemcpyTest"
      - "ImplicitLaunchOrderMPITest.MultiCommunicatorChain"
    exclude_windows: *mpi_exclude_windows
    labels:
      - "rccl"
      - "mpi"
      - "full"
      - "full_regression"
    env_variables:
      - "NCCL_DEBUG=INFO"
      - "RCCL_MPI_LOG_ALL_RANKS=1"
      - "NCCL_LAUNCH_ORDER_IMPLICIT=1"
      - "NCCL_P2P_USE_CUDA_MEMCPY=1"
      - "NCCL_SHM_USE_CUDA_MEMCPY=1"
