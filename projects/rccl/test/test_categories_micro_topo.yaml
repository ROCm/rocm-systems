# rccl-UnitTestsMicroTopo — shared/ctest schema.
# Host-only micro-tests for src/graph (no GPU, no librccl). One suite prefix per unit: gtest's `*` does not
# cross the `.`, so a suite missing here builds and passes locally but never runs under CTest.
# RCCL does not support Windows: exclude_windows matches all tests so generated suites are empty on Windows.

test_categories:
  quick: &micro_topo_quick
    description: "Smoke — host-only src/graph micro-tests, a few seconds."
    test_patterns:
      - "Xml*"
      - "Topo*"
      - "Paths*"
      - "Search*"
      - "GraphRomeModels*"
      - "GraphConnect*"
      - "Rings*"
      - "Trees*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_topo_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_topo_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_topo_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
