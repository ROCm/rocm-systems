# CTest categories for host-only src/plugin/ microtests.
#
# Suites start with their source unit's stem; those for net.cc, plugin_open.cc
# and net/net_v<N>.cc start with Plugin.
test_categories:
  quick: &micro_plugin_quick
    description: "Smoke - host-only src/plugin/ micro-tests, sub-second."
    test_patterns:
      - "CsvTuner*"
      - "Env*"
      - "Gin*"  # gin.cc's GinPluginInitTest and GinFinalizeTest
      - "Plugin*"
      - "Profiler*"
      - "Rma*"  # rma.cc's RmaPluginInitTest and rma/rma_v<N>.cc
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_plugin_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_plugin_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_plugin_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
