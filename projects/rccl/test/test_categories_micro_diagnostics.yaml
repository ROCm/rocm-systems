# CTest categories for the host-only src/diagnostics/p2p.cc and ib_write_bw.cc microtests.
#
# gtest's `*` does not cross `.`, so a suite missing here never runs under CTest; sync with the diag-*-test.cc suites.
test_categories:
  quick: &micro_diagnostics_quick
    description: "Smoke - host-only src/diagnostics/ micro-tests, sub-second."
    test_patterns:
      - "DiagP2pMicrotest.*"
      - "DiagIbWriteBwMicrotest.*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_diagnostics_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_diagnostics_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_diagnostics_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
