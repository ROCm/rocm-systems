# CTest categories for host-only src/enqueue/ microtests.
#
# Suites start with their source unit's stem; task_sched/'s seven files share TaskSched.
test_categories:
  quick: &micro_enqueue_quick
    description: "Smoke - host-only src/enqueue/ micro-tests, sub-second."
    test_patterns:
      - "Enqueue*"
      - "MgmtTaskEnq*"
      - "TaskClassify*"
      - "TaskPostTuning*"
      - "TaskPreTuning*"
      - "TaskPrep*"
      - "TaskSched*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_enqueue_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_enqueue_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_enqueue_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
