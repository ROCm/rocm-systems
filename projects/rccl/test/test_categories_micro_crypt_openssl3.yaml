# rccl-UnitTestsMicroCryptOpenssl3 — shared/ctest schema.
# Host-only micro-tests for src/misc/crypt.cc built with the OpenSSL 3 TLS backend (no GPU, no librccl).
# RCCL does not support Windows: exclude_windows matches all tests so generated suites are empty on Windows.

test_categories:
  quick: &micro_crypt_openssl3_quick
    description: "Smoke — host-only misc/crypt.cc OpenSSL 3 PSK handshake micro-tests, sub-second."
    test_patterns:
      - "CryptPskHandshakeTest.*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_crypt_openssl3_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_crypt_openssl3_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_crypt_openssl3_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
