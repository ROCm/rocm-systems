# rccl-UnitTestsMicroNetIbCastDataPath — shared/ctest schema.
# Host-only micro-tests for src/transport/net_ib_cast/{p2p,scheduler,net_ib_ops_fault}.cc (no GPU, no librccl).
# RCCL does not support Windows: exclude_windows matches all tests so generated suites are empty on Windows.

test_categories:
  quick: &micro_net_ib_cast_data_path_quick
    description: "Smoke — host-only net_ib_cast data-path (isend/irecv/test, QP scheduler, ops fault shims) micro-tests, sub-second."
    test_patterns:
      - "NetIbCastP2p*"
      - "NetIbCastScheduler*"
      - "NetIbOpsFault*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_net_ib_cast_data_path_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_net_ib_cast_data_path_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_net_ib_cast_data_path_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
