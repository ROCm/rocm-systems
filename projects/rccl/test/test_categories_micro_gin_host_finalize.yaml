# CTest categories for rccl-UnitTestsMicroGinHostFinalize.
#
# gtest's `*` does not match across the literal `.`, so a suite with no pattern
# here builds and passes locally but never runs under CTest. Keep this in sync
# with the TEST_F suite names in gin-host-finalize-test.cc.
# RCCL does not support Windows: exclude_windows matches all tests so generated
# suites are empty on Windows.

test_categories:
  quick: &micro_gin_host_finalize_quick
    description: "Smoke - host-only src/gin/gin_host.cc finalize micro-tests, sub-second."
    test_patterns:
      - "GinHostFinalizeTest.*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_gin_host_finalize_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_gin_host_finalize_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_gin_host_finalize_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
