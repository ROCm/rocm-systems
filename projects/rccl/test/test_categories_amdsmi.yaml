# rccl-UnitTestsAmdSmi — shared/ctest schema (ROCm 6.4+, Debug build).
# RCCL does not support Windows: exclude_windows matches all tests so generated suites are empty on Windows.
#
# Suites:
#   AmdSmiFabric* — pure predicate and struct layout checks, no hardware needed.
#   AmdSmiWrap*   — drives the amd_smi_* API against real GPUs; each case skips
#                   when the devices, amd_smi library, or fabric it needs is absent.
#
# Tiers:
#   quick — canonical anchor; NCCL_DEBUG=INFO for library logging.
#   standard — merge quick; override labels.
#   comprehensive — merge quick; override labels.
#   full — merge quick; override labels.

test_categories:
  quick: &amdsmi_quick
    description: "Smoke — amdsmi_wrap fabric predicates, struct layout, and wrapper API, short timeout."
    test_patterns:
      - "AmdSmiFabric*.*"
      - "AmdSmiWrap*.*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "amdsmi"
      - "debug"
    env_variables:
      - "NCCL_DEBUG=INFO"
  standard:
    <<: *amdsmi_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "amdsmi"
      - "debug"
  comprehensive:
    <<: *amdsmi_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "amdsmi"
      - "debug"
  full:
    <<: *amdsmi_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "amdsmi"
      - "debug"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
