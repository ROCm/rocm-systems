# rccl-UnitTestsMicroGinHost — shared/ctest schema.
# Host-only micro-tests for src/gin/gin_host.cc (GIN_PROXY_NTHREADS, proxy-thread CPU
# affinity) and src/gin/gin_host_proxy.cc (GIN_PROXY_POLL_BATCH). No GPU, no librccl.
# RCCL does not support Windows: exclude_windows matches all tests so generated suites are empty on Windows.

test_categories:
  quick: &micro_gin_host_quick
    description: "Smoke — host-only src/gin/gin_host.cc and gin_host_proxy.cc micro-tests, sub-second."
    test_patterns:
      - "GinHost*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_gin_host_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_gin_host_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_gin_host_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
