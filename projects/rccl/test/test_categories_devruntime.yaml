# rccl-UnitTestsDevRuntime — shared/ctest schema.
# Host-only tests for src/dev_runtime.cc (no GPU, no librccl/HIP runtime);
#
# Tiers:
#   quick — canonical anchor.
#   standard — merge quick; override labels.
#   comprehensive — merge quick; override labels.
#   full — merge quick; override labels.

test_categories:
  quick: &devruntime_quick
    description: "Smoke — host-only dev_runtime symMemory/finalize tests, sub-second."
    test_patterns:
      - "SymMemoryObtainTest.*"
      - "DevrFinalizeDrainTest.*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
  standard:
    <<: *devruntime_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
  comprehensive:
    <<: *devruntime_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
  full:
    <<: *devruntime_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
