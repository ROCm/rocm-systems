# rccl-UnitTestsMicroNetIbCastInit — shared/ctest schema.
# Host-only micro-tests for src/transport/net_ib_cast/{init,common,capability,reg,gdr,multiplane,gin,
# net_ib_cast_gid_inspect}.cc (no GPU, no librccl).
# RCCL does not support Windows: exclude_windows matches all tests so generated suites are empty on Windows.

test_categories:
  quick: &micro_net_ib_cast_init_quick
    description: "Smoke — host-only net_ib_cast init, capability and GIN micro-tests, sub-second."
    test_patterns:
      - "NetIbCast*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_net_ib_cast_init_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_net_ib_cast_init_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_net_ib_cast_init_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
