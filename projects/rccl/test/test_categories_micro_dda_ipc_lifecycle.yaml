# CTest categories for host-only DDA IPC lifecycle microtests.
test_categories:
  quick: &micro_dda_ipc_lifecycle_quick
    description: "Smoke - host-only DDA IPC lifecycle tests."
    test_patterns:
      - "DdaIpcLifecycleMicrotest.*"
      - "DdaIpcMemHandlerMicrotest.*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_dda_ipc_lifecycle_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_dda_ipc_lifecycle_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_dda_ipc_lifecycle_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
