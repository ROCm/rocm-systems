# CTest categories for the host-only src/algorithms/dda/ microtests.
#
# gtest's `*` does not cross `.`, so a suite missing here never runs under CTest; sync with the suites under test/host/algorithms/dda/.
test_categories:
  quick: &micro_dda_quick
    description: "Smoke - host-only src/algorithms/dda/ micro-tests, sub-second."
    test_patterns:
      - "FabricMemHandlerTest.*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_dda_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_dda_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_dda_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
