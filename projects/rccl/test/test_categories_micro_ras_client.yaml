# rccl-UnitTestsMicroRasClient — shared/ctest schema.
# Host-only micro-tests for src/ras/client.cc (no GPU, no librccl/HIP runtime); build in Release and Debug.
# RCCL does not support Windows: exclude_windows matches all tests so generated suites are empty on Windows.
#
# gtest's '*' does not match across the literal '.', so every suite name in
# ras-client-test.cc needs its own pattern here or it never runs under CTest.
#
# Tiers:
#   quick — canonical anchor.
#   standard — merge quick; override labels.
#   comprehensive — merge quick; override labels.
#   full — merge quick; override labels.

test_categories:
  quick: &micro_ras_client_quick
    description: "Smoke — host-only src/ras/client.cc micro-tests (argument parsing, socket I/O, RAS handshake), sub-second."
    test_patterns:
      - "RasClientMicrotest.*"
      - "RasClientMicrotestDeathTest.*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_ras_client_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_ras_client_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_ras_client_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
