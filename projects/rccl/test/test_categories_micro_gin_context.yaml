# rccl-UnitTestsMicroGinContext — shared/ctest schema.
# Host-only micro-tests for the rounded-up GIN context count reported on
# ncclDevComm (NVIDIA/nccl#2301). No GPU, no librccl.
# RCCL does not support Windows: exclude_windows matches all tests so generated suites are empty on Windows.

test_categories:
  quick: &micro_gin_context_quick
    description: "Smoke — host-only rounded-up GIN context count micro-tests, sub-second."
    test_patterns:
      - "GinContextCount*"
    exclude_windows:
      - "*"
    labels:
      - "rccl"
      - "quick"
      - "smoke"
      - "precheck"
      - "microtest"
  standard:
    <<: *micro_gin_context_quick
    labels:
      - "rccl"
      - "standard"
      - "regression"
      - "microtest"
  comprehensive:
    <<: *micro_gin_context_quick
    labels:
      - "rccl"
      - "comprehensive"
      - "comprehensive_regression"
      - "microtest"
  full:
    <<: *micro_gin_context_quick
    labels:
      - "rccl"
      - "full"
      - "full_regression"
      - "microtest"

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
