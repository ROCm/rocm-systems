# pytest.ini
[pytest]
markers =
    ir_device: marks tests that exercise librccl_device.bc via IR_test
    peer_pointer: ncclIrGetPeerPointerTeam tests
    coop: ncclCoopAny init/accessor/sync tests
    lsa_barrier: ncclLsaBarrierSession tests
    gin_barrier: ncclGinBarrierSession tests
    composite_barrier: composite ncclBarrierSession tests
    device_accessors: ncclIrDevComm_* accessor / _size getter / *SessionDestroy export tests
    lto_bc: librccl_device.lto.bc (deferred-inlining artifact) structural + link/run tests
    lto_artifact: static analyses of the shipped .bc artifacts (export surface, inline attrs, deferral); no GPU launch
    mpi: multi-rank tests launched under mpirun (need host librccl.so + MPI)

testpaths = tests
addopts = --import-mode=importlib
