# RCCL code coverage on a SLURM GPU cluster.
# Thin caller: triggers + PR-label gating live here; the actual setup->matrix->run flow
# is the reusable workflow .github/workflows/mnctl-run.yml (workload: coverage). The
# coverage matrix and payload live in .github/scripts/ (ci_configure.py, payloads/coverage.py).
name: RCCL Code Coverage

on:
  # Nightly full run, manual run with overridable inputs, and PR runs gated on a label.
  schedule:
    - cron: '0 06 * * *'
  workflow_dispatch:
    inputs:
      targets:
        description: "Which targets to run: 'all', or comma-separated names / gfx archs / cluster names (e.g. 'gfx942,alola')"
        type: string
        default: "all"
      cluster:
        description: "Cluster for a single-image override run (SLURM partition/account/reservation/runner)"
        type: string
        default: "alola"
      rocm_image:
        description: "Override: ROCm base image (empty = run all enabled targets in the table)"
        type: string
        default: ""
      dockerfile:
        description: "Override: mnctl Dockerfile matching the base image OS"
        type: string
        default: "Dockerfile.Multinode.Ubuntu"
      gpu_arch:
        description: "Override: GPU architecture target"
        type: string
        default: "gfx942"
      nodes:
        description: "Override: number of nodes to allocate"
        type: string
        default: "2"
      test_config:
        description: "Override: test_runner.py config filename"
        type: string
        default: "mi300x_mellanox_ib.json"
      test_suite:
        description: "Optional gtest suite filter (empty = all suites in config)"
        type: string
        default: ""
      test_name:
        description: "Optional gtest test-name filter (empty = all tests)"
        type: string
        default: ""
      rccl_tests_ref:
        description: "rccl-tests branch/tag/SHA to build the perf binaries from"
        type: string
        default: "develop"
      rccl_utils_ref:
        description: "rccl-utils branch/tag/SHA providing mnctl (MultiNodeDocker)"
        type: string
        default: "master"
  pull_request:
    types: [labeled, opened, synchronize]

permissions:
  contents: read

# One coverage run per PR/commit; cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  coverage:
    # PR-gated on the label; schedule/dispatch always run.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci: code-coverage')
    uses: ./.github/workflows/mnctl-run.yml
    with:
      workload: coverage
      targets: ${{ inputs.targets || 'all' }}
      cluster: ${{ inputs.cluster || 'alola' }}
      rocm_image: ${{ inputs.rocm_image || '' }}
      dockerfile: ${{ inputs.dockerfile || 'Dockerfile.Multinode.Ubuntu' }}
      gpu_arch: ${{ inputs.gpu_arch || 'gfx942' }}
      nodes: ${{ inputs.nodes || '2' }}
      test_config: ${{ inputs.test_config || 'mi300x_mellanox_ib.json' }}
      test_suite: ${{ inputs.test_suite || '' }}
      test_name: ${{ inputs.test_name || '' }}
      rccl_tests_ref: ${{ inputs.rccl_tests_ref || 'develop' }}
      rccl_utils_ref: ${{ inputs.rccl_utils_ref || 'master' }}
      artifact_prefix: rccl-coverage
    secrets:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
