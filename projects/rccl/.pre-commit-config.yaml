# Pre-commit formatting for projects/rccl/.
#
# projects/rccl/ is in the repo-root config's `exclude:` block, so a bare
# `pre-commit run` (and the hook from `pre-commit install`) checks NOTHING here.
# Always pass -c:
#
#   pre-commit run -c projects/rccl/.pre-commit-config.yaml --all-files
#
# Regexes below are monorepo-relative: pre-commit chdirs to the git toplevel and
# hands hooks toplevel-relative paths, so the `^projects/rccl/` prefix is
# required from any cwd.

# Vendored sources, mirroring the "external" entries in .clang-format-ignore.
# That file governs clang-format only, so without this the whitespace hooks
# would rewrite upstream NVTX headers and conflict on the next sync.
exclude: |
  (?x)^projects/rccl/(
    src/include/nvtx3/
    | src/transport/net_ib/gdaki/doca-gpunetio/
    | src/include/gdrwrap\.h$
    | src/include/mlx5/mlx5dvcore\.h$
    | src/include/ibvcore\.h$
    | src/nccl\.h\.in$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Preserve Markdown hard line breaks (trailing double space).
        args: [--markdown-linebreak-ext=md]
        files: ^projects/rccl/
      - id: end-of-file-fixer
        files: ^projects/rccl/
      - id: check-yaml
        files: ^projects/rccl/

  # clang-format 22 is mandatory: .clang-format uses v22 keys and v18 (the
  # root config's pin) rejects the file outright with
  # "unknown key 'AlignPPAndNotPP'". Scope and output match
  # maint/run-clang-format.sh byte-for-byte over projects/rccl/src.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.0
    hooks:
      - id: clang-format
        files: ^projects/rccl/src/.*\.(h|cc|cu|cuh)$

