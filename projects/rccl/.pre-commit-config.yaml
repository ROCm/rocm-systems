# pre-commit configuration for projects/rccl.
#
# Hooks are adopted one at a time, and start advisory: a hook arrives reporting
# what it would say, and only becomes blocking once the tree is clean enough
# that it blocks nobody. Any one-time cleanup a check needs lands as its own
# commit, recorded in .git-blame-ignore-revs.
#
# Run it locally, from the repository root:
#
#   # once, to run the hooks on `git commit` against your staged files
#   pre-commit install --config projects/rccl/.pre-commit-config.yaml
#
#   # full sweep
#   pre-commit run --config projects/rccl/.pre-commit-config.yaml --all-files
#
#   # just what you changed
#   pre-commit run --config projects/rccl/.pre-commit-config.yaml \
#     --files $(git diff --name-only origin/develop...HEAD)
#
#   # clang-tidy, which is too slow for a commit hook and so is manual-stage
#   pre-commit run --config projects/rccl/.pre-commit-config.yaml \
#     --hook-stage manual clang-tidy
#
# pre-commit itself: `pip install pre-commit` (or `uv tool install pre-commit`).

# Only ever look at files under projects/rccl, whatever file list pre-commit is
# handed.
files: ^projects/rccl/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # C/C++ formatting, advisory only.
  #
  # 134 of the 769 files under src/ do not match .clang-format today, so a
  # reformatting hook would make the first author to touch one of them commit
  # a few hundred lines of unrelated churn. Until a sweep lands as its own
  # commit (recorded in .git-blame-ignore-revs), --dry-run reports what would
  # change without editing anything, and the hook does not fail: clang-format
  # only exits non-zero on a --dry-run difference when given -Werror.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        name: clang-format (advisory, C/C++)
        entry: clang-format --dry-run -style=file
        # Always show output, even when the hook passes, since it always passes.
        verbose: true
        files: ^projects/rccl/src/.*\.(c|cc|cpp|cu|cuh|h|hpp)$

  # C/C++ static analysis, advisory only. Manual stage: unlike clang-format,
  # clang-tidy needs a parsed translation unit, so it configures a build and
  # runs hipify first. That is minutes, not seconds, and it ignores the
  # changed-file list, so it has no business running on `git commit`. CI
  # invokes it explicitly with --hook-stage manual.
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy (advisory, configures a build)
        language: script
        entry: projects/rccl/maint/run-clang-tidy.sh
        # The script picks its own files from the compile database.
        pass_filenames: false
        always_run: true
        stages: [manual]
        verbose: true

  # Python linting, advisory only.
  - repo: local
    hooks:
      - id: pylint-advisory
        name: pylint (advisory, RCCL-owned Python)
        language: python
        additional_dependencies: ["pylint==4.1.3"]
        entry: >-
          bash -c 'pylint --rcfile=projects/rccl/.pylintrc "$@"; status=$?;
          if (( status & 33 )); then exit "$status"; fi' --
        # Always show output, even when the hook passes, since it always passes.
        verbose: true
        files: ^projects/rccl/.*\.py$
