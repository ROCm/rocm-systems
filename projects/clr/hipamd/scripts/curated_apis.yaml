# ============================================================
# A.3 HIP kernel launch + module (10)
#
# Note: hipExtModuleLaunchKernel is OMITTED — declared in hip_ext.h, not
# hip_runtime_api.h, and would require adding hip_ext.h to the verifier
# CMake invocation. Follow-up task.
# ============================================================

# Field budget: 6 = 1(ptr) + 1(dim3_packed) + 1(dim3_packed) + 1(ptr) + 1(size) + 1(handle).
- api: hipLaunchKernel
  category: kernel_launch
  args:
    - {name: function_address, type: ptr,         dir: IN}
    - {name: numBlocks,        type: dim3_packed, dir: IN}
    - {name: dimBlocks,        type: dim3_packed, dir: IN}
    - {name: args,             type: ptr,         dir: IN}
    - {name: sharedMemBytes,   type: size,        dir: IN}
    - {name: stream,           type: handle,      dir: IN}

# Header has gridDim/blockDimX (not numBlocks/dimBlocks); both are dim3 so dim3_packed applies.
# Field budget: 1(ptr) + 1(packed) + 1(packed) + 1(ptr) + 1(uint32) + 1(handle) = 6.
- api: hipLaunchCooperativeKernel
  category: kernel_launch
  args:
    - {name: f,              type: ptr,         dir: IN}
    - {name: gridDim,        type: dim3_packed, dir: IN}
    - {name: blockDimX,      type: dim3_packed, dir: IN}
    - {name: kernelParams,   type: ptr,         dir: IN}
    - {name: sharedMemBytes, type: uint32,      dir: IN}
    - {name: stream,         type: handle,      dir: IN}

- api: hipLaunchCooperativeKernelMultiDevice
  category: kernel_launch
  args:
    - {name: launchParamsList, type: ptr,    dir: IN}
    - {name: numDevices,       type: int32,  dir: IN}
    - {name: flags,            type: uint32, dir: IN}

# hipModuleLaunchKernel: header has individual gridDimX/Y/Z + blockDimX/Y/Z
# uint32s (NOT dim3 args), so dim3_packed is not applicable to those.
# Drop the 6 dim params to fit the budget; keep f, sharedMemBytes, stream,
# kernelParams, extra = 5 payload fields.
- api: hipModuleLaunchKernel
  category: kernel_launch
  args:
    - {name: f,              type: handle, dir: IN}
    - {name: sharedMemBytes, type: uint32, dir: IN}
    - {name: stream,         type: handle, dir: IN}
    - {name: kernelParams,   type: ptr,    dir: IN}
    - {name: extra,          type: ptr,    dir: IN}

# Field budget for hipExtLaunchKernel: 1+1+1+1+1+1+1+1+1 = 9 exactly.
- api: hipExtLaunchKernel
  category: kernel_launch
  args:
    - {name: function_address, type: ptr,         dir: IN}
    - {name: numBlocks,        type: dim3_packed, dir: IN}
    - {name: dimBlocks,        type: dim3_packed, dir: IN}
    - {name: args,             type: ptr,         dir: IN}
    - {name: sharedMemBytes,   type: size,        dir: IN}
    - {name: stream,           type: handle,      dir: IN}
    - {name: startEvent,       type: handle,      dir: IN}
    - {name: stopEvent,        type: handle,      dir: IN}
    - {name: flags,            type: int32,       dir: IN}

- api: hipExtLaunchMultiKernelMultiDevice
  category: kernel_launch
  args:
    - {name: launchParamsList, type: ptr,    dir: IN}
    - {name: numDevices,       type: int32,  dir: IN}
    - {name: flags,            type: uint32, dir: IN}

- api: hipModuleGetFunction
  category: module
  args:
    - {name: function, type: handle,  dir: OUT}
    - {name: module,   type: handle,  dir: IN}
    - {name: kname,    type: cstring, dir: IN}

- api: hipModuleLoadData
  category: module
  args:
    - {name: module, type: handle, dir: OUT}
    - {name: image,  type: ptr,    dir: IN}

- api: hipModuleLoadDataEx
  category: module
  args:
    - {name: module,       type: handle, dir: OUT}
    - {name: image,        type: ptr,    dir: IN}
    - {name: numOptions,   type: uint32, dir: IN}
    - {name: options,      type: ptr,    dir: IN}
    - {name: optionValues, type: ptr,    dir: IN}

- api: hipModuleUnload
  category: module
  args:
    - {name: module, type: handle, dir: IN}

