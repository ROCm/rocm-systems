# Curated HIP APIs for typed parameter capture.
#
# Schema:
#   - api: string (must match HIP header function name exactly)
#     category: streams | events | kernel_launch | memory | graphs | module
#     args:
#       - {name: <param_name>, type: <DSL type>, dir: IN | OUT}
#
# DSL types: handle | ptr | device_ptr | size | int32 | uint32 | int64 |
#            uint64 | float | enum | bool | dim3 | dim3_packed | cstring
#
# Direction: IN (captured at entry, emitted at exit) | OUT (deref'd at exit).
# INOUT is rejected in v1.
#
# Field budget: each API may have at most 9 payload fields after corr_id.
# Use `dim3_packed` instead of `dim3` to fit high-arity launch APIs.
#
# Names are validated against the HIP header signature by a libclang-based
# drift verifier (stacked PR2).

# ============================================================
# A.1 HIP streams + sync (12)
# ============================================================

- api: hipStreamCreate
  category: streams
  args:
    - {name: stream, type: handle, dir: OUT}

- api: hipStreamCreateWithFlags
  category: streams
  args:
    - {name: stream, type: handle, dir: OUT}
    - {name: flags,  type: uint32, dir: IN}

- api: hipStreamCreateWithPriority
  category: streams
  args:
    - {name: stream,   type: handle, dir: OUT}
    - {name: flags,    type: uint32, dir: IN}
    - {name: priority, type: int32,  dir: IN}

- api: hipStreamDestroy
  category: streams
  args:
    - {name: stream, type: handle, dir: IN}

- api: hipStreamGetFlags
  category: streams
  args:
    - {name: stream, type: handle, dir: IN}
    - {name: flags,  type: uint32, dir: OUT}

- api: hipStreamGetPriority
  category: streams
  args:
    - {name: stream,   type: handle, dir: IN}
    - {name: priority, type: int32,  dir: OUT}

- api: hipStreamSynchronize
  category: streams
  args:
    - {name: stream, type: handle, dir: IN}

- api: hipStreamWaitEvent
  category: streams
  args:
    - {name: stream, type: handle, dir: IN}
    - {name: event,  type: handle, dir: IN}
    - {name: flags,  type: uint32, dir: IN}

- api: hipStreamQuery
  category: streams
  args:
    - {name: stream, type: handle, dir: IN}

- api: hipStreamAddCallback
  category: streams
  args:
    - {name: stream,   type: handle, dir: IN}
    - {name: callback, type: ptr,    dir: IN}
    - {name: userData, type: ptr,    dir: IN}
    - {name: flags,    type: uint32, dir: IN}

- api: hipDeviceSynchronize
  category: streams
  args: []

- api: hipStreamAttachMemAsync
  category: streams
  args:
    - {name: stream,  type: handle, dir: IN}
    - {name: dev_ptr, type: ptr,    dir: IN}
    - {name: length,  type: size,   dir: IN}
    - {name: flags,   type: uint32, dir: IN}

