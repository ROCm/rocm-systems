# --- kernel launch + module ---
#
# hipExtModuleLaunchKernel is intentionally OMITTED: it is declared
# in hip_ext.h, not hip_runtime_api.h, and would require adding
# hip_ext.h to the verifier's CMake invocation. Follow-up task.
- api: hipLaunchKernel
  args: [function_address, numBlocks, dimBlocks, args, sharedMemBytes, stream]
  pack_dim3: [numBlocks, dimBlocks]

- api: hipLaunchCooperativeKernel
  args: [f, gridDim, blockDimX, kernelParams, sharedMemBytes, stream]
  pack_dim3: [gridDim, blockDimX]

- api: hipLaunchCooperativeKernelMultiDevice
  args: [launchParamsList, numDevices, flags]

- api: hipModuleLaunchKernel
  args: [f, sharedMemBytes, stream, kernelParams, extra]

- api: hipExtLaunchKernel
  args: [function_address, numBlocks, dimBlocks, args, sharedMemBytes, stream, startEvent, stopEvent, flags]
  pack_dim3: [numBlocks, dimBlocks]

- api: hipExtLaunchMultiKernelMultiDevice
  args: [launchParamsList, numDevices, flags]

- api: hipModuleGetFunction
  args: [function, module, kname]
  out: [function]
  strings: [kname]

- api: hipModuleLoadData
  args: [module, image]
  out: [module]

- api: hipModuleLoadDataEx
  args: [module, image, numOptions, options, optionValues]
  out: [module]

- api: hipModuleUnload
  args: [module]

