# rocm_hip TraceLogging probes: the configuration of shared/rocm-trace/scripts/rocm_trace_gen.py
# for the HIP dispatch tables. Every table entry is traced; this file lists only what the C types
# cannot say. After editing it, or when hip_api_trace.hpp changes, regenerate hip_trace_probes.h
# and .cpp in this directory (see README.md here) and commit them with the change.
#
# Outputs (out) are the parameters the public headers document as [out] or [in,out]
# (hip_runtime_api.h and the other public headers), recorded on exit after the call succeeds.
# The CLR owners review this list: an entry belongs here only if the implementation writes it on
# every success path. Documented outputs the generator cannot record are listed at the end, with
# the reason.
#
# strings: char-pointer outputs and results recorded as text (const char* inputs always are).
# uncapped: kernel names, recorded whole; other strings are capped at ROCM_TRACE_STRING_CAP bytes.
# HIP has no ALLOC keyword entries: allocations are traced through the HSA calls nested in them
# (memory-tracing design, MEM-HLD-03).

version: 1
provider: rocm_hip
output_name: hip_trace_probes
includes:
- hip/hip_runtime.h
- hip/hip_deprecated.h
- hip/amd_detail/amd_hip_gl_interop.h
- hip/amd_detail/hip_api_trace.hpp
tables:
- name: HipDispatchTable
  size_member: size
- name: HipCompilerDispatchTable
  size_member: size
success:
  hipError_t: hipSuccess
defaults:
  level: information
capture_level: rocm_hip_trace_capture

