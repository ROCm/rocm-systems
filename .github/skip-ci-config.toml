# Skip CI Configuration for rocm-systems
#
# This file defines which file patterns can skip TheRock CI.
# When all changed files match these patterns, CI can be skipped.
#
# These patterns extend TheRock's base patterns in
# build_tools/github_actions/skip-ci-base.toml.
#
# Pattern syntax: fnmatch glob patterns (*, ?, [abc])
# See https://docs.python.org/3/library/fnmatch.html
#
# To add platform-specific skips (e.g., skip Windows CI for Linux-only
# projects), use the [skip_ci.linux] or [skip_ci.windows] lists.

version = 1

[skip_ci]
# Common patterns that skip CI on all platforms
common = [
    # Miscellaneous git/github files
    "*.gitignore",
    "*.pre-commit-config.*",
    ".github/label*.yml",
    "*CODEOWNERS",
    "*LICENSE",

    # This file defines CI gating, so a change here is not validated by any CI
    # run it skips. Review it on that basis: a too-broad pattern added here can
    # silently stop CI for unrelated paths.
    ".github/skip-ci-config.toml",

    # Only `.github/workflows/therock-*.yml` participate in TheRock CI; every
    # other workflow here runs on its own triggers and is never called by a
    # TheRock run, so editing one cannot affect a TheRock build. fnmatch has no
    # negation, so this is spelled as "does not start with t". New workflows
    # whose names start with `t` simply don't skip CI, which fails safe.
    ".github/workflows/[!t]*.yml",

    # `therock-rccl-*` is rooted at therock-rccl-ci.yml (schedule +
    # workflow_dispatch only), so it is likewise outside TheRock PR CI.
    ".github/workflows/therock-rccl-*.yml",
    # Test drivers invoked only by those therock-rccl-* workflows; nothing in
    # the build consumes them.
    "projects/rccl/ci/scripts/*",

    "*/.markdownlint-ci2.yaml",
    "tools/systems_pr_bot/*",

    # Documentation files
    "docs/*",
    "*.md",
    "*.rtf",
    "*.rst",
    "*/.readthedocs.yaml",
    "*/.spellcheck.local.yaml",
    "*/.wordlist.txt",
    "projects/*/docs/*",
    "shared/*/docs/*",

    # Vendored API headers are not yet integrated into TheRock builds.
    "runtimes/api-headers/*",

    # Changes to experimental code do not run standard build/test workflows.
    "experimental/*",
]

# Patterns that skip CI only on Linux (e.g., Windows-only projects)
linux = []

# Patterns that skip CI only on Windows (e.g., Linux-only projects)
windows = []
