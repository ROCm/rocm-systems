name: Resolve CI config
description: Resolve build and GPU runner labels from ROCm/therock-ci-config

inputs:
  config-path:
    description: Local checkout path for the shared CI config
    required: false
    default: ci-config
  fallback-gfx94x-runner:
    description: Runner label to use if the shared CI config cannot be loaded
    required: false
    default: linux-gfx942-1gpu-ccs-csp-ossci-rocm
  fallback-gfx94x-sandbox-runner:
    description: Sandbox runner label to use if the shared CI config cannot be loaded
    required: false
    default: linux-mi325-gpu-rocm-cpu-sandbox
  fallback-gfx950-runner:
    description: Runner label for gfx950 if the shared CI config cannot be loaded
    required: false
    default: linux-gfx950-1gpu-ccs-ossci-rocm
  fallback-gfx90a-runner:
    description: Runner label for gfx90a if the shared CI config cannot be loaded
    required: false
    default: linux-gfx90a-gpu-rocm
  fallback-gfx103x-runner:
    description: Runner label for gfx103x if the shared CI config cannot be loaded
    required: false
    default: linux-gfx1030-gpu-rocm
  fallback-gfx110x-runner:
    description: Runner label for gfx110x if the shared CI config cannot be loaded
    required: false
    default: linux-gfx110X-gpu-rocm
  fallback-gfx120x-runner:
    description: Runner label for gfx120x if the shared CI config cannot be loaded
    required: false
    default: linux-gfx120X-gpu-rocm
  fallback-gfx1151-runner:
    description: Runner label for gfx1151 if the shared CI config cannot be loaded
    required: false
    default: linux-gfx1151-gpu-rocm
  fallback-linux-build-runner:
    description: Linux build runner label if the shared CI config cannot be loaded
    required: false
    default: aws-linux-scale-rocm-prod

outputs:
  linux_build_runner:
    description: Linux CPU build runner label
    value: ${{ steps.runner.outputs.linux_build_runner }}
  gfx90a_runner:
    description: Linux gfx90a test runner label
    value: ${{ steps.runner.outputs.gfx90a_runner }}
  gfx94x_runner:
    description: Linux gfx94x test runner label
    value: ${{ steps.runner.outputs.gfx94x_runner }}
  gfx94x_sandbox_runner:
    description: Linux gfx94x sandbox test runner label
    value: ${{ steps.runner.outputs.gfx94x_sandbox_runner }}
  gfx950_runner:
    description: Linux gfx950 test runner label
    value: ${{ steps.runner.outputs.gfx950_runner }}
  gfx103x_runner:
    description: Linux gfx103x (Navi 2x) test runner label
    value: ${{ steps.runner.outputs.gfx103x_runner }}
  gfx110x_runner:
    description: Linux gfx110x (Navi 3x) test runner label
    value: ${{ steps.runner.outputs.gfx110x_runner }}
  gfx120x_runner:
    description: Linux gfx120x (Navi 4x) test runner label
    value: ${{ steps.runner.outputs.gfx120x_runner }}
  gfx1151_runner:
    description: Linux gfx1151 test runner label
    value: ${{ steps.runner.outputs.gfx1151_runner }}

runs:
  using: composite
  steps:
    - name: Checkout CI config
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: ROCm/therock-ci-config
        ref: main
        path: ${{ inputs.config-path }}
      continue-on-error: true

    - name: Resolve runner labels
      id: runner
      shell: bash
      env:
        CI_CONFIG_PATH: ${{ inputs.config-path }}
        FALLBACK_GFX94X_RUNNER: ${{ inputs.fallback-gfx94x-runner }}
        FALLBACK_GFX94X_SANDBOX_RUNNER: ${{ inputs.fallback-gfx94x-sandbox-runner }}
        FALLBACK_GFX950_RUNNER: ${{ inputs.fallback-gfx950-runner }}
        FALLBACK_GFX90A_RUNNER: ${{ inputs.fallback-gfx90a-runner }}
        FALLBACK_GFX103X_RUNNER: ${{ inputs.fallback-gfx103x-runner }}
        FALLBACK_GFX110X_RUNNER: ${{ inputs.fallback-gfx110x-runner }}
        FALLBACK_GFX120X_RUNNER: ${{ inputs.fallback-gfx120x-runner }}
        FALLBACK_GFX1151_RUNNER: ${{ inputs.fallback-gfx1151-runner }}
        FALLBACK_LINUX_BUILD_RUNNER: ${{ inputs.fallback-linux-build-runner }}
      run: python3 "${GITHUB_ACTION_PATH}/resolve_ci_config.py"
