name: Resolve TheRock ref
description: >-
  Reads the pinned ROCm/TheRock commit from .github/therock_ref.json, the
  single source of truth for TheRock's ref across all rocm-systems CI
  workflows. Update it via .github/scripts/update_therock_ref.py.

outputs:
  ref:
    description: The pinned ROCm/TheRock commit SHA.
    value: ${{ steps.read.outputs.ref }}
  commit_date:
    description: The date of the pinned commit (YYYY-MM-DD).
    value: ${{ steps.read.outputs.commit_date }}

runs:
  using: composite
  steps:
    - name: Read TheRock ref config
      id: read
      shell: bash
      run: |
        PYTHON=python3
        command -v python3 >/dev/null 2>&1 || PYTHON=python
        "$PYTHON" -c "
        import json
        import os

        config_path = os.path.join(os.environ['GITHUB_ACTION_PATH'], '..', '..', 'therock_ref.json')
        with open(config_path) as f:
            config = json.load(f)
        print(f'ref={config[\"ref\"]}')
        print(f'commit_date={config[\"commit_date\"]}')
        " >> "$GITHUB_OUTPUT"
