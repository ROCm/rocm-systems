# Prebuilt waitcheck and ConSan artifacts for emulation/rocjitsu/.
#
# Publishes the two binaries documented in
# emulation/rocjitsu/docs/sanitizers.md so users can try the combined
# HSA-tools hook without building the project. The build needs no ROCm SDK:
# the HSA/KFD headers are vendored under lib/rocjitsu/external_headers.
#
# Download a bundle with emulation/rocjitsu/scripts/download_sanitizer_artifacts.py.
name: "rocjitsu-sanitizer-artifacts"

on:
  push:
    branches:
      - shared/rocjitsu/sanitizers
    paths:
      - "emulation/rocjitsu/**"
      - ".github/workflows/rocjitsu-sanitizer-artifacts.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "CMake build type for the published artifacts"
        type: choice
        default: "Release"
        options:
          - Release
          - RelWithDebInfo
      retention_days:
        description: "Days to retain the uploaded artifact"
        default: "30"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ROCJITSU_SOURCE_DIR: ${{ github.workspace }}/emulation/rocjitsu
  ROCJITSU_BUILD_DIR: ${{ github.workspace }}/build
  ROCJITSU_STAGE_DIR: ${{ github.workspace }}/stage
  ZSTD_SHIM_DIR: ${{ github.workspace }}/cmake-shims/zstd
  # Keep in sync with the job's container image; Actions has no YAML anchors.
  BUILD_IMAGE: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:a382085df3ba2419b58aa9051350883a0d0b732a4bc0a4ef60458f8161bb08c6
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
  RETENTION_DAYS: ${{ inputs.retention_days || '30' }}

jobs:
  build:
    name: build sanitizer artifacts
    # Build in the same manylinux image the rest of the ROCm builds use. It is
    # AlmaLinux 8 with glibc 2.28 and gcc-toolset-13, which satisfies the
    # CMake 3.22+ / GCC 13+ requirements in docs/building.md and gives the
    # published binaries a far older glibc floor than a hosted Ubuntu runner.
    runs-on: azure-linux-scale-rocm
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:a382085df3ba2419b58aa9051350883a0d0b732a4bc0a4ef60458f8161bb08c6 # 2026-06-11
    steps:
      - name: Install build dependencies
        run: |
          # The image already carries CMake, Ninja, and gcc-toolset-13.
          dnf install -y -q zlib-devel libzstd-devel jq

      - name: Checkout rocm-systems
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The C++ build reads nothing outside emulation/rocjitsu; the shared
          # ISA tree is only needed by the Python amdisa tests.
          sparse-checkout: |
            emulation/rocjitsu
            .github

      - name: Provide a zstd package config
        run: |
          # RHEL-family libzstd-devel ships the library and headers but none of
          # upstream's CMake package files, so the project's find_package(zstd)
          # has nothing to consume. Point zstd_DIR at a shim that adopts the
          # system library; the project's CMake stays untouched.
          mkdir -p "${ZSTD_SHIM_DIR}"
          cat > "${ZSTD_SHIM_DIR}/zstdConfig.cmake" <<'EOF'
          include(FindPackageHandleStandardArgs)
          find_path(ZSTD_INCLUDE_DIR NAMES zstd.h)
          find_library(ZSTD_LIBRARY NAMES zstd)
          find_package_handle_standard_args(
              zstd
              REQUIRED_VARS ZSTD_LIBRARY ZSTD_INCLUDE_DIR
          )
          if(zstd_FOUND AND NOT TARGET zstd::libzstd_shared)
              add_library(zstd::libzstd_shared UNKNOWN IMPORTED)
              set_target_properties(
                  zstd::libzstd_shared
                  PROPERTIES
                      IMPORTED_LOCATION "${ZSTD_LIBRARY}"
                      INTERFACE_INCLUDE_DIRECTORIES "${ZSTD_INCLUDE_DIR}"
              )
          endif()
          EOF

      - name: Configure
        working-directory: ${{ env.ROCJITSU_SOURCE_DIR }}
        run: |
          # Link libstdc++ statically so the published binaries run on hosts
          # with an older toolchain than the image, matching the approach in
          # scripts/rocjitsu-docker-build.sh. Symbols stay hidden: both targets
          # already link with --exclude-libs,ALL.
          #
          # Keep FetchContent out of the source tree so the checkout stays clean.
          cmake -S . -B "${ROCJITSU_BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DFETCHCONTENT_BASE_DIR="${RUNNER_TEMP}/deps" \
            -Dzstd_DIR="${ZSTD_SHIM_DIR}" \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++" \
            -DBUILD_TESTING=OFF

      - name: Build
        run: |
          # Halve the worker count to avoid OOM and excessive system load on the
          # shared scale set, matching rocjitsu-corpus-tests.yml.
          cmake --build "${ROCJITSU_BUILD_DIR}" \
            --target rocjitsu_dbi_hooks rj_waitcheck \
            -j "$(( ($(nproc) + 1) / 2 ))"

      - name: Stage bundle
        id: stage
        run: |
          set -euo pipefail
          HOOK="${ROCJITSU_BUILD_DIR}/lib/rocjitsu/src/rocjitsu/hooks/librocjitsu_dbi_hooks.so"
          WAITCHECK="${ROCJITSU_BUILD_DIR}/tools/rj_waitcheck"
          test -f "${HOOK}"
          test -f "${WAITCHECK}"

          mkdir -p "${ROCJITSU_STAGE_DIR}/lib" "${ROCJITSU_STAGE_DIR}/bin"
          cp "${HOOK}" "${ROCJITSU_STAGE_DIR}/lib/"
          cp "${WAITCHECK}" "${ROCJITSU_STAGE_DIR}/bin/"

          # Record enough provenance to tie a downloaded bundle back to a commit
          # and to the toolchain baseline the binaries were linked against.
          #
          # Report the highest versioned glibc symbol the binaries actually
          # reference rather than the image's own glibc: the build image is
          # newer than what the artifacts require, and the difference decides
          # whether a given host can run them.
          GLIBC_VERSION="$(
            objdump -T "${HOOK}" "${WAITCHECK}" \
              | grep -o 'GLIBC_[0-9.]*' \
              | sed 's/^GLIBC_//' \
              | sort -V \
              | tail -1
          )"
          IMAGE_GLIBC="$(ldd --version | head -1 | awk '{print $NF}')"
          COMPILER_VERSION="$(g++ --version | head -1)"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg ref "${GITHUB_REF_NAME}" \
            --arg commit "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_number "${GITHUB_RUN_NUMBER}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg build_type "${BUILD_TYPE}" \
            --arg compiler "${COMPILER_VERSION}" \
            --arg glibc "${GLIBC_VERSION}" \
            --arg image_glibc "${IMAGE_GLIBC}" \
            --arg image "${BUILD_IMAGE}" \
            '{
              repository: $repository,
              branch: $ref,
              commit: $commit,
              run_id: $run_id,
              run_number: $run_number,
              run_attempt: $run_attempt,
              build_type: $build_type,
              compiler: $compiler,
              minimum_glibc: $glibc,
              build_image: $image,
              build_image_glibc: $image_glibc,
              run_url: "https://github.com/\($repository)/actions/runs/\($run_id)"
            }' > "${ROCJITSU_STAGE_DIR}/MANIFEST.json"

          cd "${ROCJITSU_STAGE_DIR}"
          # Digests are relative to the bundle root so the download script can
          # verify them after extraction.
          find bin lib -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > sha256sums.txt

          echo "artifact_name=rocjitsu-sanitizers-${BUILD_TYPE}-${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test staged binaries
        working-directory: ${{ env.ROCJITSU_STAGE_DIR }}
        run: |
          set -euo pipefail
          # Confirm the tool starts and the hook resolves every symbol it needs
          # before publishing binaries that users download unbuilt.
          ./bin/rj_waitcheck --help > /dev/null

          # `ldd -r` reports unresolved symbols on stdout but still exits 0,
          # so inspect its output rather than trusting the status.
          ldd -r ./lib/librocjitsu_dbi_hooks.so > ldd.txt 2>&1
          cat ldd.txt
          if grep -q "undefined symbol" ldd.txt; then
            echo "::error::librocjitsu_dbi_hooks.so has unresolved symbols"
            exit 1
          fi
          rm -f ldd.txt

          sha256sum --check --quiet sha256sums.txt
          echo "--- MANIFEST.json ---"
          cat MANIFEST.json

      - name: Upload sanitizer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: ${{ env.ROCJITSU_STAGE_DIR }}
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Summarize
        run: |
          {
            echo "### rocjitsu sanitizer artifacts"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Artifact | \`${{ steps.stage.outputs.artifact_name }}\` |"
            echo "| Build type | \`${BUILD_TYPE}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Retention | ${RETENTION_DAYS} days |"
            echo
            echo "Download with:"
            echo
            echo '```sh'
            echo "python3 emulation/rocjitsu/scripts/download_sanitizer_artifacts.py --run ${GITHUB_RUN_ID}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
