# Prebuilt waitcheck and ConSan artifacts for emulation/rocjitsu/.
#
# Publishes the two binaries documented in
# emulation/rocjitsu/docs/sanitizers.md so users can try the combined
# HSA-tools hook without building the project. The build needs no ROCm SDK:
# the HSA/KFD headers are vendored under lib/rocjitsu/external_headers.
#
# The build itself lives in emulation/rocjitsu/scripts/build_sanitizer_artifacts.sh
# so it can be run and debugged outside Actions; keep it that way and leave
# only the container, the checkout, and the upload here.
#
# Download a bundle with emulation/rocjitsu/scripts/download_sanitizer_artifacts.py.
name: "rocjitsu-sanitizer-artifacts"

on:
  push:
    branches:
      - shared/rocjitsu/sanitizers
    paths:
      - "emulation/rocjitsu/**"
      - ".github/workflows/rocjitsu-sanitizer-artifacts.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "CMake build type for the published artifacts"
        type: choice
        default: "Release"
        options:
          - Release
          - RelWithDebInfo
      retention_days:
        description: "Days to retain the uploaded artifact"
        default: "30"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ROCJITSU_SOURCE_DIR: ${{ github.workspace }}/emulation/rocjitsu
  ROCJITSU_BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
  ROCJITSU_RETENTION_DAYS: ${{ inputs.retention_days || '30' }}
  # Keep in sync with the job's container image; Actions has no YAML anchors.
  ROCJITSU_BUILD_IMAGE: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:a382085df3ba2419b58aa9051350883a0d0b732a4bc0a4ef60458f8161bb08c6

jobs:
  build:
    name: build sanitizer artifacts
    # Build in the same manylinux image the rest of the ROCm builds use. It is
    # AlmaLinux 8 with glibc 2.28 and gcc-toolset-13, which satisfies the
    # CMake 3.22+ / GCC 13+ requirements in docs/building.md and gives the
    # published binaries a far older glibc floor than a hosted Ubuntu runner.
    runs-on: azure-linux-scale-rocm
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:a382085df3ba2419b58aa9051350883a0d0b732a4bc0a4ef60458f8161bb08c6 # 2026-06-11
    steps:
      - name: Checkout rocm-systems
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The C++ build reads nothing outside emulation/rocjitsu; the shared
          # ISA tree is only needed by the Python amdisa tests.
          sparse-checkout: |
            emulation/rocjitsu
            .github

      - name: Install build dependencies
        run: emulation/rocjitsu/scripts/build_sanitizer_artifacts.sh deps

      - name: Build a static zstd
        run: emulation/rocjitsu/scripts/build_sanitizer_artifacts.sh zstd

      - name: Configure
        run: emulation/rocjitsu/scripts/build_sanitizer_artifacts.sh configure

      - name: Build
        run: emulation/rocjitsu/scripts/build_sanitizer_artifacts.sh build

      - name: Stage bundle
        id: stage
        run: emulation/rocjitsu/scripts/build_sanitizer_artifacts.sh stage

      - name: Smoke test staged binaries
        run: emulation/rocjitsu/scripts/build_sanitizer_artifacts.sh smoke-test

      - name: Upload sanitizer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: ${{ steps.stage.outputs.stage_dir }}
          if-no-files-found: error
          retention-days: ${{ env.ROCJITSU_RETENTION_DAYS }}

      - name: Summarize
        run: emulation/rocjitsu/scripts/build_sanitizer_artifacts.sh summary
