name: RCCL suite

# Reusable single-node launcher for an RCCL cluster test suite (gin, device-api).
# The `suite` input selects lib/<suite>.sbatch and its logs/scheduler stream.
#
# ROCm is provisioned on the head node from TheRock CI artifacts (base toolchain
# + libraries only via --base-only); RCCL/rocSHMEM/rccl-tests still build from the
# PR sources on the compute node. Everything is workspace-local and torn down at
# the end: no shared cache, so each leg fetches ROCm and builds OpenMPI itself.
# Set rocm_path to skip the fetch and build against a preinstalled ROCm instead.
on:
  workflow_call:
    inputs:
      suite:
        description: 'Suite to run; selects lib/<suite>.sbatch (e.g. "gin", "device-api").'
        type: string
        required: true
      runs_on:
        description: 'Runner label(s) as a JSON array string; lets a suite target a specific cluster.'
        type: string
        required: false
        default: '["ruby-linux-slurm-scale-runner"]'
      partition:
        description: 'SLURM partition for the compute-node job.'
        type: string
        required: false
        default: 'interactive'
      reservation:
        description: 'SLURM reservation to pin the compute-node job to (e.g. "rccl_ci"). Empty = none.'
        type: string
        required: false
        default: ''
      artifact_group:
        description: 'TheRock artifact group / GPU family for the ROCm floor (e.g. "gfx950-dcgpu").'
        type: string
        required: false
        default: 'gfx950-dcgpu'
      artifact_run_id:
        description: 'TheRock (ROCm/TheRock) workflow run ID to fetch ROCm from. Empty = resolve the latest main run with artifacts.'
        type: string
        required: false
        default: ''
      rocm_path:
        description: 'Absolute path to a preinstalled "hardened" ROCm on the cluster (e.g. /apps/rccl-ci/rocm/rocm-7.0.0). When set, skips the TheRock artifact fetch and builds against this tree as-is.'
        type: string
        required: false
        default: ''
      therock_ref:
        description: 'ROCm/TheRock git ref to check out for build_tools + setup_test_environment.'
        type: string
        required: false
        default: 'b45a06045cbb29c85e221748e653ac2521c6e1bf'
      amdgpu_targets:
        description: 'GPU arch for rocSHMEM/RCCL/rccl-tests (must match the ROCm family ARCH).'
        type: string
        required: false
        default: 'gfx950'
      non_gating:
        description: 'If true, a suite failure does not fail the workflow (continue-on-error).'
        type: boolean
        required: false
        default: false
      timeout_minutes:
        description: 'Job timeout in minutes.'
        type: number
        required: false
        default: 240
    outputs:
      build_failed:
        # true for a build/infra failure, false for a test-only failure. Lets the
        # caller gate builds while keeping tests non-gating. AICOMRCCL-1478.
        description: 'true if a build/infra step failed (not a test-only failure).'
        value: ${{ jobs.suite.outputs.build_failed }}
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run; selects lib/<suite>.sbatch.'
        type: choice
        required: true
        options:
          - device-api
          - gin
          - ext-plugins
      runs_on:
        description: 'Runner label(s) as a JSON array string.'
        type: string
        required: false
        default: '["ruby-linux-slurm-scale-runner"]'
      partition:
        description: 'SLURM partition for the compute-node job.'
        type: string
        required: false
        default: 'interactive'
      reservation:
        description: 'SLURM reservation to pin the compute-node job to (e.g. "rccl_ci"). Empty = none.'
        type: string
        required: false
        default: ''
      artifact_group:
        description: 'TheRock artifact group / GPU family for the ROCm floor (e.g. "gfx950-dcgpu").'
        type: string
        required: false
        default: 'gfx950-dcgpu'
      artifact_run_id:
        description: 'TheRock workflow run ID to fetch ROCm from. Empty = resolve the latest main run with artifacts.'
        type: string
        required: false
        default: ''
      rocm_path:
        description: 'Absolute path to a preinstalled "hardened" ROCm (e.g. /apps/rccl-ci/rocm/rocm-7.0.0). When set, skips the TheRock artifact fetch.'
        type: string
        required: false
        default: ''
      therock_ref:
        description: 'ROCm/TheRock git ref to check out for build_tools + setup_test_environment.'
        type: string
        required: false
        default: 'b45a06045cbb29c85e221748e653ac2521c6e1bf'
      amdgpu_targets:
        description: 'GPU arch for rocSHMEM/RCCL/rccl-tests (must match the ROCm family ARCH).'
        type: string
        required: false
        default: 'gfx950'
      non_gating:
        description: 'If true, a suite failure does not fail the workflow.'
        type: boolean
        required: false
        default: false
      timeout_minutes:
        # workflow_dispatch has no number type; job timeout-minutes coerces it.
        description: 'Job timeout in minutes.'
        type: string
        required: false
        default: '240'

permissions:
  contents: read
  id-token: write

jobs:
  suite:
    name: Single node ${{ inputs.suite }} testing
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    continue-on-error: ${{ inputs.non_gating }}
    permissions:
      contents: read
      id-token: write
    outputs:
      build_failed: ${{ steps.classify.outputs.build_failed }}
    defaults:
      run:
        shell: bash
    env:
      SUITE: ${{ inputs.suite }}
      RCCL_SLURM_PARTITION: ${{ inputs.partition }}
      RCCL_SLURM_RESERVATION: ${{ inputs.reservation }}
      RCCL_AMDGPU_TARGETS: ${{ inputs.amdgpu_targets }}
      ROCM_AMDGPU_FAMILY: ${{ inputs.artifact_group }}
      # Add the test matrix's debug_env (NCCL_DEBUG=INFO, ...) to every run.
      RCCL_CI_DEBUG: '1'
      # rocm-systems goes in CI_SUBDIR; TheRock is checked out at the workspace root.
      CI_SUBDIR: _ci/${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
      VENV_DIR: ${{ github.workspace }}/.venv-${{ inputs.suite }}
      # Separate from VENV_DIR: this one has to exist before provisioning runs.
      RESOLVER_VENV: ${{ github.workspace }}/.venv-resolver-${{ inputs.suite }}
    steps:
      # At the workspace root: setup_test_environment resolves build_tools/ relative
      # to github.workspace. Skipped when rocm_path is set (no fetch needed).
      - name: Checkout ROCm/TheRock
        if: ${{ inputs.rocm_path == '' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ROCm/TheRock
          ref: ${{ inputs.therock_ref }}

      # rocm-systems sources for the compute-node build (rocSHMEM only used by gin).
      - name: Checkout rocm-systems
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: ${{ env.CI_SUBDIR }}
          sparse-checkout: |
            projects/rccl
            projects/rccl-tests
            projects/rocshmem

      # find_latest_artifacts.py imports boto3, which the compute-node runners do
      # not provide system-wide. TheRock's setup_test_environment populates
      # VENV_DIR, but that step runs after resolution, so stand up a dedicated
      # venv here rather than reordering provisioning. TheRock's requirements.txt
      # is used as a constraint file so we land inside the botocore window its
      # build_tools expect instead of whatever boto3 is newest.
      - name: Ensure artifact resolver dependencies
        if: ${{ inputs.rocm_path == '' && inputs.artifact_run_id == '' }}
        run: |
          set -euo pipefail
          if python3 -c 'import boto3' 2>/dev/null; then
            echo "System python3 already provides boto3"
            echo "RESOLVER_PY=python3" >> "${GITHUB_ENV}"
            exit 0
          fi
          constraints=("--constraint" "${GITHUB_WORKSPACE}/requirements.txt")
          [[ -f "${GITHUB_WORKSPACE}/requirements.txt" ]] || constraints=()
          echo "boto3 unavailable to system python3; creating ${RESOLVER_VENV}"
          rm -rf "${RESOLVER_VENV:?}"
          if ! python3 -m venv "${RESOLVER_VENV}"; then
            echo "python3 -m venv failed; falling back to a user-site install"
            python3 -m pip install --quiet --user "${constraints[@]}" boto3
            echo "RESOLVER_PY=python3" >> "${GITHUB_ENV}"
            exit 0
          fi
          "${RESOLVER_VENV}/bin/python" -m pip install --quiet "${constraints[@]}" boto3
          echo "RESOLVER_PY=${RESOLVER_VENV}/bin/python" >> "${GITHUB_ENV}"

      # Pick the TheRock run: explicit artifact_run_id, else the newest main run
      # with artifacts for this family (find_latest_artifacts.py).
      - name: Resolve TheRock artifact run
        id: rocm_run
        if: ${{ inputs.rocm_path == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_GROUP: ${{ inputs.artifact_group }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          if [[ -n "${ARTIFACT_RUN_ID}" ]]; then
            echo "Using pinned TheRock run_id=${ARTIFACT_RUN_ID}"
            echo "run_id=${ARTIFACT_RUN_ID}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          run_id="$("${RESOLVER_PY:-python3}" - <<'PY'
          import os, sys, contextlib
          sys.path.insert(0, "build_tools")
          import find_latest_artifacts as fla
          group = os.environ["ARTIFACT_GROUP"]
          with contextlib.redirect_stdout(sys.stderr):
              results = fla.find_latest_artifacts(artifact_groups=[group], verbose=True)
          if not results:
              sys.stderr.write(f"No TheRock artifacts found for group '{group}'\n")
              sys.exit(1)
          print(results[0].workflow_run_id)
          PY
          )"
          echo "Resolved latest TheRock run_id=${run_id} for ${ARTIFACT_GROUP}"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      # Fetch the ROCm floor into the workspace via TheRock's own action. Skipped
      # when rocm_path is set.
      # NOTE: not --base-only. That set omits the toolchain *_dev artifacts (e.g.
      # amd-llvm_dev, which carries lib/llvm/lib/cmake/AMDDeviceLibs), so
      # find_package(hip) -> find_dependency(AMDDeviceLibs) fails when *building*
      # against it. The full set (filtered to this family) guarantees the cmake/dev
      # bits are present. TODO: slim to base + the specific *_dev we need.
      - name: Provision ROCm from TheRock artifacts
        id: provision
        if: ${{ inputs.rocm_path == '' }}
        uses: ./.github/actions/setup_test_environment
        with:
          ARTIFACT_RUN_ID: ${{ steps.rocm_run.outputs.run_id }}
          ARTIFACT_GROUP: ${{ inputs.artifact_group }}
          OUTPUT_ARTIFACTS_DIR: ${{ github.workspace }}/${{ env.CI_SUBDIR }}/.ci-out/rocm
          VENV_DIR: ${{ env.VENV_DIR }}
          # --run-github-repo: the run-id is TheRock's, but the installer defaults
          # to GITHUB_REPOSITORY (rocm-systems) and 404s without this override.
          FETCH_ARTIFACT_ARGS: "--run-github-repo=ROCm/TheRock"

      # Write rocm.env (ROCM_PATH, ROCM_RELEASE) for the compute-node scripts, from
      # rocm_path (used as-is) or the fetched tree. Fetched-only: rewrite the RHEL
      # /usr/lib64/lib<name>.so absolute paths in the cmake targets to portable -l
      # (they otherwise break `make` on non-RHEL nodes).
      - name: Finalize ROCm env
        id: finalize
        env:
          ROCM_PATH_INPUT: ${{ inputs.rocm_path }}
          FETCHED_ROCM: ${{ github.workspace }}/${{ env.CI_SUBDIR }}/.ci-out/rocm
          RUN_ID: ${{ steps.rocm_run.outputs.run_id }}
        run: |
          set -euo pipefail
          if [[ -n "${ROCM_PATH_INPUT}" ]]; then
            rocm_root="${ROCM_PATH_INPUT}"
            rocm_release="hardened:$(basename "${rocm_root}")"
            patch_libpaths=0
            echo "==> Using preinstalled ROCm at ${rocm_root} (TheRock fetch skipped)"
          else
            rocm_root="${FETCHED_ROCM}"
            rocm_release="therock-run-${RUN_ID}"
            patch_libpaths=1
          fi
          if [[ ! -x "${rocm_root}/bin/hipcc" ]]; then
            echo "ERROR: ROCm at ${rocm_root} has no bin/hipcc" >&2
            ls -la "${rocm_root}" >&2 || true
            exit 1
          fi
          cmake_dir="${rocm_root}/lib/cmake"
          if [[ "${patch_libpaths}" == "1" && -d "${cmake_dir}" ]]; then
            while IFS= read -r -d '' f; do
              sed -i -E 's#/usr/lib64/lib([A-Za-z0-9_.+-]+)\.so#\1#g' "${f}"
              echo "    patched RHEL absolute lib path(s) in ${f}"
            done < <(grep -rlZ '/usr/lib64/lib[^";[:space:]]*\.so' "${cmake_dir}" 2>/dev/null || true)
          fi
          env_out="${GITHUB_WORKSPACE}/${CI_SUBDIR}/.ci-out/rocm.env"
          mkdir -p "$(dirname "${env_out}")"
          {
            printf 'export ROCM_RELEASE=%q\n' "${rocm_release}"
            printf 'export ROCM_PATH=%q\n' "${rocm_root}"
          } > "${env_out}"
          echo "==> Wrote ${env_out} (ROCM_PATH=${rocm_root})"

      - name: Submit ${{ inputs.suite }} build+test to SLURM
        id: submit
        run: |
          set -euo pipefail
          # The provision action activates a Python venv / setup-python (VIRTUAL_ENV,
          # pythonLocation, PATH) for later steps. Handed to the compute node via
          # `sbatch --export=ALL`, that interpreter isn't runnable there and cmake's
          # find_package(Python3) picks it and fails. Scrub it so the compute node
          # builds with its own system python3.
          unset VIRTUAL_ENV PYTHONHOME pythonLocation Python_ROOT_DIR Python3_ROOT_DIR
          PATH="$(printf '%s' "${PATH}" | tr ':' '\n' | grep -vE '/_work/_tool/Python/|/\.venv-' | paste -sd: -)"
          export PATH
          export RCCL_DEVICE_API_WORKDIR="${GITHUB_WORKSPACE}/${CI_SUBDIR}"
          # Workspace-local cache: OpenMPI + downloads live under the per-run
          # workspace, so each leg builds its own and cleanup wipes it.
          export RCCL_DEVICE_API_CACHE="${RCCL_DEVICE_API_WORKDIR}/.ci-out/cache"
          mkdir -p "${RCCL_DEVICE_API_CACHE}"/{ompi,downloads}
          ci_lib="${RCCL_DEVICE_API_WORKDIR}/projects/rccl/tools/ci/lib"
          # submit_slurm_job.py does sbatch --wait + sacct cross-check (a bare
          # --wait exits 0 even for scheduler-killed jobs).
          python3 "${ci_lib}/submit_slurm_job.py" \
            --script "${ci_lib}/${SUITE}.sbatch" \
            --chdir "${RCCL_DEVICE_API_WORKDIR}/.ci-out/${SUITE}-logs" \
            --partition "${RCCL_SLURM_PARTITION}" \
            --reservation "${RCCL_SLURM_RESERVATION}" \
            --export "ALL,RCCL_DEVICE_API_WORKDIR,RCCL_DEVICE_API_CACHE,ROCM_AMDGPU_FAMILY,RCCL_AMDGPU_TARGETS,RCCL_CI_DEBUG"

      - name: Dump compute-node logs
        if: always()
        run: |
          logs_dir="${GITHUB_WORKSPACE}/${CI_SUBDIR}/.ci-out/${SUITE}-logs"
          shopt -s nullglob
          # One collapsible group per log; rccl-<suite>-* is SLURM's whole-job
          # stream, kept last as a fallback for early/killed jobs.
          dump() {
            local title="$1"; shift
            for f in "$@"; do
              echo "::group::${title}: $(basename "${f}")"
              cat "${f}" || true
              echo "::endgroup::"
            done
          }
          dump "build"      "${logs_dir}"/build-*.out "${logs_dir}"/build-*.err
          dump "test"       "${logs_dir}"/test-*.out  "${logs_dir}"/test-*.err
          dump "scheduler"  "${logs_dir}"/rccl-${SUITE}-*.out "${logs_dir}"/rccl-${SUITE}-*.err
          # Verbose per-rank NCCL debug logs (RCCL_CI_DEBUG=1); noisy, kept last.
          dump "nccl-debug" "${logs_dir}"/nccl-debug/nccl-debug.*.log

      # Test-only failure (sbatch drops a `tests-failed` sentinel, exits 0): turn
      # this job red here, where the logs are. AICOMRCCL-1478.
      - name: Fail on test failures
        if: always()
        run: |
          sentinel="${GITHUB_WORKSPACE}/${CI_SUBDIR}/.ci-out/${SUITE}-logs/tests-failed"
          if [[ ! -f "${sentinel}" ]]; then
            echo "${SUITE}: no test failures."
            exit 0
          fi
          # Surface the failed/skipped list on the job Summary tab, not just the log.
          {
            echo "### ${SUITE}: tests failed"
            echo ""
            echo '```'
            cat "${sentinel}"
            echo '```'
            echo ""
            echo "_Full per-test output: the \`test\` log group of this job. Per-rank NCCL logs: the \`nccl-debug\` group._"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::${SUITE} tests failed. See this job's Summary tab for the failed-test list."
          exit 1

      # Tell the caller whether this was a build/infra failure (gating) or a
      # test-only failure (non-gating for gin). AICOMRCCL-1478.
      - name: Classify failure
        id: classify
        if: always()
        run: |
          if [[ "${{ steps.rocm_run.outcome }}" == "failure" \
             || "${{ steps.provision.outcome }}" == "failure" \
             || "${{ steps.finalize.outcome }}" == "failure" \
             || "${{ steps.submit.outcome }}" == "failure" ]]; then
            echo "build_failed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "build_failed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Clean up per-job workspace
        if: always()
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}/${CI_SUBDIR:?}"
          rm -rf "${VENV_DIR:?}"
          rm -rf "${RESOLVER_VENV:?}"
