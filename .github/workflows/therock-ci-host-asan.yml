name: TheRock CI CLR Linux Host ASAN

on:
  push:
    branches:
      - develop
      - release/therock-*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      projects:
        type: string
        description: "Insert space-separated list of projects to test or 'all' to test all projects. ex: 'projects/clr projects/rocminfo'"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  therock-clr-asan-setup:
    name: "Setup"
    runs-on: ubuntu-24.04
    env:
      BASE_REF: HEAD^
    outputs:
      linux_projects: ${{ steps.linux_projects.outputs.projects }}
      package_version: ${{ steps.rocm_package_version.outputs.rocm_package_version }}
      run_host_asan_ci: ${{ steps.check_asan_subtrees.outputs.run_host_asan_ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          fetch-depth: 2

      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          path: TheRock
          ref: f1e3fc2311fde45bf3e17b0e3349200be9caa4b4 # 2026-06-23

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic requests

      - name: Detect changed subtrees
        id: detect
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/pr_detect_changed_subtrees.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --config ".github/repos-config.json"

      - name: Check if host-ASAN CI should run
        id: check_asan_subtrees
        env:
          SUBTREES: ${{ steps.detect.outputs.subtrees }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_PROJECTS: ${{ inputs.projects }}
        run: |
          # On push to main branches or workflow_dispatch: always run.
          # On pull_request: only run if CLR, HIP, or HIP-tests changed.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_host_asan_ci=true" >> "$GITHUB_OUTPUT"
          elif echo "$SUBTREES" | grep -qE "^(projects/clr|projects/hip|projects/hip-tests)$"; then
            echo "run_host_asan_ci=true" >> "$GITHUB_OUTPUT"
          elif [[ "$INPUT_PROJECTS" == "all" || "$INPUT_PROJECTS" == *"projects/clr"* || "$INPUT_PROJECTS" == *"projects/hip"* ]]; then
            echo "run_host_asan_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_host_asan_ci=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine Linux projects to run
        id: linux_projects
        env:
          SUBTREES: ${{ steps.detect.outputs.subtrees }}
          PROJECTS: ${{ inputs.projects }}
          PLATFORM: "linux"
        run: |
          python .github/scripts/therock_configure_ci.py

      - name: Compute package version
        id: rocm_package_version
        run: |
          python TheRock/build_tools/compute_rocm_package_version.py --release-type=dev

  therock-build-linux-host-asan:
    name: Linux host-asan (${{ matrix.projects.projects_to_test }})
    permissions:
      contents: read
      id-token: write
    needs: therock-clr-asan-setup
    if: ${{ needs.therock-clr-asan-setup.outputs.run_host_asan_ci == 'true' && needs.therock-clr-asan-setup.outputs.linux_projects != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.therock-clr-asan-setup.outputs.linux_projects) }}
    runs-on: azure-linux-scale-rocm-heavy-ramdisk
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:48492540591673fdc8d51beb89bde41e7ba13cbb528f643c0a481ba42c4058f2 # 2026-04-16
      options: -v /runner/config:/home/awsconfig/
    env:
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      AMDGPU_FAMILIES: "gfx94X-dcgpu"
      TEATIME_FORCE_INTERACTIVE: 0
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
    steps:
      - name: "Checking out repository for rocm-systems"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Checkout TheRock repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: "ROCm/TheRock"
          path: "TheRock"
          ref: f1e3fc2311fde45bf3e17b0e3349200be9caa4b4 # 2026-06-23

      - name: Install python deps
        run: |
          pip install -r TheRock/requirements.txt

      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      - name: Setup ccache
        run: |
          ./TheRock/build_tools/setup_ccache.py \
            --config-preset "github-oss-dev" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"

      - name: Runner health status
        run: |
          ./TheRock/build_tools/health_status.py

      - name: Fetch sources
        timeout-minutes: 30
        run: |
          ./TheRock/build_tools/fetch_sources.py --jobs 12 --no-include-rocm-systems

      - name: Patch rocm-systems
        run: |
          # Remove patches here if they cannot be applied cleanly, and they have not been deleted from TheRock repo
          # rm ./TheRock/patches/amd-mainline/rocm-systems/0003-Use-is_versioned-true-consistently-in-both-Comgr-Loa.patch

      - name: Configure Projects
        env:
          cmake_preset: "linux-release-host-asan"
          amdgpu_families: ${{ env.AMDGPU_FAMILIES }}
          package_version: ${{ needs.therock-clr-asan-setup.outputs.package_version }}
          extra_cmake_options: "-DTHEROCK_ROCM_SYSTEMS_SOURCE_DIR=../ -DTHEROCK_ENABLE_RCCL=OFF ${{ matrix.projects.cmake_options }}"
          BUILD_DIR: build
        run: |
          python TheRock/build_tools/github_actions/build_configure.py

      - name: Build therock-artifacts and therock-dist
        run: cmake --build TheRock/build --target therock-artifacts therock-dist -- -k 0

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          echo "Full SDK du:"
          echo "------------"
          du -h -d 1 TheRock/build/dist/rocm
          echo "Artifacts:"
          echo "----------"
          du -h -d 1 TheRock/build/artifacts
          echo "CCache Stats:"
          echo "-------------"
          ccache -s

      - name: Configure AWS Credentials
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::692859939525:role/therock-ci-external

      - name: Push artifacts
        run: |
          python3 TheRock/build_tools/artifact_manager.py push \
            --run-id ${{ github.run_id }} \
            --build-dir TheRock/build \
            --stage all

      - name: Post Build Upload
        if: always()
        run: |
          python TheRock/build_tools/github_actions/post_build_upload.py \
            --run-id ${{ github.run_id }} \
            --artifact-group ${{ env.AMDGPU_FAMILIES }} \
            --build-dir TheRock/build \
            --upload

  therock-test-linux-host-asan:
    name: "Test host-asan (${{ matrix.projects.projects_to_test }})"
    needs: [therock-clr-asan-setup, therock-build-linux-host-asan]
    if: ${{ needs.therock-clr-asan-setup.outputs.run_host_asan_ci == 'true' && needs.therock-clr-asan-setup.outputs.linux_projects != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.therock-clr-asan-setup.outputs.linux_projects) }}
    uses: ./.github/workflows/therock-test-packages.yml
    with:
      projects_to_test: ${{ matrix.projects.projects_to_test }}
      amdgpu_families: "gfx94X-dcgpu"
      test_runs_on: "linux-gfx942-1gpu-core42-ossci-rocm"
      platform: "linux"

  therock-clr-asan-summary:
    name: TheRock CI Host ASAN Summary
    if: always()
    needs:
      - therock-clr-asan-setup
      - therock-build-linux-host-asan
      - therock-test-linux-host-asan
    runs-on: ubuntu-24.04
    steps:
      - name: Output failed jobs
        run: |
          echo '${{ toJson(needs) }}'
          FAILED_JOBS="$(echo '${{ toJson(needs) }}' \
            | jq --raw-output \
            'map_values(select(.result!="success" and .result!="skipped")) | keys | join(",")' \
          )"
          if [[ "${FAILED_JOBS}" != "" ]]; then
            echo "The following jobs failed: ${FAILED_JOBS}"
            exit 1
          fi
