# =============================================================================
# TEMPORARY WORKFLOW - MI455 BRINGUP
# =============================================================================
# This workflow is temporary and will be removed once MI455 bringup is complete.
# After bringup, MI455 (gfx125X-dcgpu) will be onboarded into the standard
# multi-arch CI via therock-ci-config.
#
# TODO(geomin12): Delete this workflow once MI455 is fully enabled in
#                 therock-ci-config and the multi-arch CI.
# =============================================================================

# MI455 (gfx125X) Pre-submit CI
#
# NOTE: This workflow ONLY builds/tests for HIP or ROCR changes and is meant
# to provide signal only. It is not a blocking check.
#
# This workflow uses a custom setup job to bypass TheRock's setup_multi_arch.yml
# which ignores family inputs for pull_request events. We hardcode the gfx125X
# config and pass it directly to TheRock's multi_arch_ci_linux.yml.

name: TheRock MI455 Pre-submit CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      # HIP paths
      - 'projects/hip/**'
      - 'projects/hip-tests/**'
      - 'projects/hipfile/**'
      - 'projects/hipother/**'
      # ROCR paths
      - 'projects/rocr-runtime/**'
      - 'projects/rocr-debug-agent/**'
      # Also trigger on changes to this workflow
      - '.github/workflows/therock-mi455-presubmit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      enable_build_jobs: ${{ steps.config.outputs.enable_build_jobs }}
      linux_build_config: ${{ steps.config.outputs.linux_build_config }}
      test_type: ${{ steps.config.outputs.test_type }}
      linux_test_labels: ${{ steps.config.outputs.linux_test_labels }}
      rocm_package_version: ${{ steps.version.outputs.rocm_package_version }}
      external_repo_config: ${{ steps.external.outputs.config_json }}
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: main

      - name: Compute package version
        id: version
        run: |
          python ./build_tools/compute_rocm_package_version.py --release-type=dev

      - name: Output gfx125X build config
        id: config
        run: |
          # Hardcoded gfx125X-dcgpu config for MI455 bringup
          # This bypasses TheRock's setup_multi_arch.yml which ignores family inputs for PRs
          cat >> $GITHUB_OUTPUT << 'EOF'
          enable_build_jobs=true
          linux_build_config={"per_family_info": [{"amdgpu_family": "gfx125X-dcgpu", "amdgpu_targets": "gfx1250", "test-runs-on": "linux-mi455-gpu-rocm", "sanity_check_only_for_family": false, "test_labels_for_family": ["test:hip-tests", "test:rocrtst"]}], "dist_amdgpu_families": "gfx125X-dcgpu", "artifact_group": "multi-arch-release", "build_variant_label": "release", "build_variant_suffix": "", "build_variant_cmake_preset": "", "build_native_linux": true, "build_pytorch": false, "test_python_packages_matrix": [], "pytorch_build_matrix": [], "build_runs_on": "aws-linux-scale-rocm-prod", "prebuilt_stages": "", "baseline_run_id": "", "linux_amdgpu_families": "gfx125X-dcgpu", "windows_amdgpu_families": ""}
          test_type=comprehensive
          linux_test_labels=[]
          EOF

      - name: Output external repo config
        id: external
        run: |
          CONFIG_JSON=$(cat << 'EOF'
          {
            "repository": "${{ github.repository }}",
            "ref": "${{ github.sha }}",
            "checkout_path": "external-repo",
            "source_package": "rocm-systems",
            "fetch_sources_args": "--no-include-rocm-systems"
          }
          EOF
          )
          echo "config_json=$(echo "$CONFIG_JSON" | jq -c .)" >> $GITHUB_OUTPUT

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config).build_variant_label }}
    needs: setup
    if: ${{ needs.setup.outputs.enable_build_jobs == 'true' }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_linux.yml@main
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      repository: ROCm/TheRock
      ref: main
    permissions:
      contents: read
      id-token: write

  mi455_ci_summary:
    name: MI455 CI Summary
    if: always()
    needs:
      - setup
      - linux_build_and_test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: main
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
