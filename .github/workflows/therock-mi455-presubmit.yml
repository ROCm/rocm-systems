# =============================================================================
# TEMPORARY WORKFLOW - MI455 BRINGUP
# =============================================================================
# This workflow is temporary and will be removed once MI455 bringup is complete.
# After bringup, MI455 (gfx125X-dcgpu) will be onboarded into the standard
# multi-arch CI via therock-ci-config.
#
# TODO(geomin12): Delete this workflow once MI455 is fully enabled in
#                 therock-ci-config and the multi-arch CI.
# =============================================================================

# MI455 (gfx125X) Pre-submit CI
#
# This workflow runs MI455-specific tests when HIP or ROCR paths are updated.
# It builds gfx125X-dcgpu and runs limited tests (hip-tests, rocrtst, sanity)
# on the linux-mi455-gpu-rocm runner.

name: TheRock MI455 Pre-submit CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      # HIP paths
      - 'projects/hip/**'
      - 'projects/hip-tests/**'
      - 'projects/hipfile/**'
      - 'projects/hipother/**'
      # ROCR paths
      - 'projects/rocr-runtime/**'
      - 'projects/rocr-debug-agent/**'
      # Also trigger on changes to this workflow
      - '.github/workflows/therock-mi455-presubmit.yml'
    paths-ignore:
      # Ignore documentation updates
      - '**/*.md'
      - 'docs/**'
      - '**/README*'
      - '**/CONTRIBUTING*'
      - '**/LICENSE*'
  workflow_dispatch:
    inputs:
      linux_test_labels:
        type: string
        description: "Test labels to run (default: hip-tests, rocrtst)"
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    uses: ROCm/TheRock/.github/workflows/setup_multi_arch.yml@users/geomin12/mi455-bringup-2
    with:
      build_variant: "release"
      # Only build gfx125X for MI455 pre-submit
      linux_amdgpu_families: "gfx125X"
      windows_amdgpu_families: ""
      linux_test_labels: ${{ inputs.linux_test_labels || '' }}
      repository: ROCm/TheRock
      ref: users/geomin12/mi455-bringup-2
      # Pass family_overrides to configure MI455 test runner and limited tests
      external_repo: >-
        {
          "repository": "${{ github.repository }}",
          "ref": "${{ github.sha }}",
          "family_overrides": {
            "gfx125x": {
              "linux": {
                "test-runs-on": "linux-mi455-gpu-rocm",
                "test_labels_for_family": ["test:hip-tests", "test:rocrtst"],
                "fetch-gfx-targets": ["gfx1250"]
              }
            }
          }
        }

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: setup
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_linux.yml@users/geomin12/mi455-bringup-2
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      repository: ROCm/TheRock
      ref: users/geomin12/mi455-bringup-2
    permissions:
      contents: read
      id-token: write

  mi455_ci_summary:
    name: MI455 CI Summary
    if: always()
    needs:
      - setup
      - linux_build_and_test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: users/geomin12/mi455-bringup-2
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
