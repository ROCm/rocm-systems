# Slurm scripts (rccl_build.sbatch, submit_and_poll.sh, format_report.py) live in
# ROCm/cvs under ci/rccl_perf_gate. Branch protection must require STATUS_CONTEXT.

# Advisory: a detected regression does not fail the gate, only build/infra errors
# do. Logic is in .github/scripts/rccl_perf_gate.py. See AIMVT-285.
name: RCCL Perf Regression Gate

on:
  # One A/B run per commit over-subscribes the single runner and the pinned
  # 4-node reservation, so PR events only seed the pending status hint.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'projects/rccl/**'
      - '.github/workflows/rccl_perf_regression.yml'
      - '.github/scripts/rccl_perf_gate.py'
      - '.github/scripts/tests/test_rccl_perf_gate.py'
  issue_comment:
    # Required: the default is [created, edited, deleted], so without this an
    # edit to an old comment would re-trigger the gate with a new body.
    types: [created]
  workflow_dispatch:
    inputs:
      config:
        description: 'Config JSON path on TW cluster'
        required: false
        default: '/it-share/rccl-ci/configs/ci_detect_prod.json'
      build_rccl:
        description: 'Build librccl from PR source (1=yes, 0=use fixed lib)'
        required: false
        default: '0'

env:
  RCCL_CI_ROOT: /it-share/rccl-ci
  SLURM_RESERVATION: rccl_ci
  NODELIST: mia1-p01-g[22,26,28,32]
  PERF_COMMAND: /perf-regression
  STATUS_CONTEXT: RCCL Perf Regression Gate

# Load-bearing default-deny: without it the jobs that run PR code fall back to
# the repository's default token permissions.
permissions: {}

jobs:
  # Without this the required check sits as a bare "expected" with no hint that
  # a comment is what runs it.
  rccl-perf-hint:
    name: 'RCCL perf gate: pending hint'
    # Fork PRs get a read-only token, so a statuses POST would 403.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    concurrency:
      group: rccl-perf-gate-hint-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out CI scripts
        uses: actions/checkout@v4
        with:
          # Write token: pin to the default branch so a PR cannot edit the
          # script that runs with it (the default here is the merge commit).
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Post pending hint status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/rccl_perf_gate.py set-status \
            --state pending \
            --description "Comment ${PERF_COMMAND} (repo writers) to run the perf gate"

  rccl-perf-resolve:
    name: 'RCCL perf gate: authorize and resolve'
    # Coarse pre-filter only, so an unrelated comment does not start a runner.
    # The exact match and live write-permission check are in rccl_perf_gate.py.
    if: >
      github.event_name == 'workflow_dispatch' ||
      ( github.event.issue.pull_request &&
        contains(github.event.comment.body, '/perf-regression') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    outputs:
      authorized: ${{ steps.ctx.outputs.authorized }}
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      base_ref: ${{ steps.ctx.outputs.base_ref }}
      pr_number: ${{ steps.ctx.outputs.pr_number }}
      requester: ${{ steps.ctx.outputs.requester }}
      head_repo: ${{ steps.ctx.outputs.head_repo }}
    steps:
      - name: Check out CI scripts
        uses: actions/checkout@v4
        with:
          # See rccl-perf-hint. A dispatched ref is trusted (dispatch requires
          # write access), which is what lets this be tested before it merges.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Authorize and resolve PR context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/rccl_perf_gate.py resolve \
            --event "${GITHUB_EVENT_PATH}" \
            --output "${GITHUB_OUTPUT}"

      - name: Reject fork PRs
        # Not supported yet: fork code would execute on our self-hosted runner.
        # Unblock: ephemeral runner pool, or a required-reviewer Environment.
        if: steps.ctx.outputs.authorized == 'true' && steps.ctx.outputs.pr_number != '' && steps.ctx.outputs.head_repo != github.repository
        uses: marocchino/sticky-pull-request-comment@f3bbb8300013c686241004a1c1b5d4045b10bc30  # v2
        with:
          header: rccl-perf-gate
          number: ${{ steps.ctx.outputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          message: |
            🚫 The RCCL perf gate does not run on fork PRs yet (it would execute unvetted code on our self-hosted cluster runner — see AIMVT-285). Push your branch to `${{ github.repository }}` and re-comment `${{ env.PERF_COMMAND }}`.

      - name: Mark commit status pending (PR only)
        if: steps.ctx.outputs.authorized == 'true' && steps.ctx.outputs.pr_number != '' && steps.ctx.outputs.head_repo == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/rccl_perf_gate.py set-status \
            --state pending \
            --description "Perf regression run queued"

      - name: Acknowledge on the PR
        if: steps.ctx.outputs.authorized == 'true' && steps.ctx.outputs.pr_number != '' && steps.ctx.outputs.head_repo == github.repository
        uses: marocchino/sticky-pull-request-comment@f3bbb8300013c686241004a1c1b5d4045b10bc30  # v2
        with:
          header: rccl-perf-gate
          number: ${{ steps.ctx.outputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          message: |
            🏃 **RCCL Perf Regression Gate** queued for commit `${{ steps.ctx.outputs.head_sha }}` (requested by @${{ steps.ctx.outputs.requester }}).

            [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  rccl-perf-build:
    name: 'RCCL perf gate: build reference and candidate'
    needs: rccl-perf-resolve
    # SAME-REPO ONLY: this builds and MPI-executes PR code on the self-hosted
    # runner. A pull_request head-repo guard is dead under issue_comment.
    if: >
      needs.rccl-perf-resolve.outputs.authorized == 'true' &&
      needs.rccl-perf-resolve.outputs.head_repo == github.repository
    concurrency:
      # Per-PR so PRs don't cancel each other; job-level concurrency can't read
      # `needs`, so the key comes from the event.
      group: rccl-perf-gate-build-${{ github.event.issue.number || github.ref }}
      cancel-in-progress: true
    runs-on: [self-hosted, tw-gfx950-ainic-ROCm-scale-runner]
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      config_json: ${{ steps.build.outputs.config_json }}
    steps:
      - name: Checkout PR head (pinned SHA, full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.rccl-perf-resolve.outputs.head_sha }}
          fetch-depth: 0

      - name: Fetch base branch and detect changed paths
        id: paths
        env:
          BASE_REF: ${{ needs.rccl-perf-resolve.outputs.base_ref }}
        run: |
          python3 .github/scripts/rccl_perf_gate.py changed-paths \
            --output "${GITHUB_OUTPUT}"

      - name: Build reference + candidate librccl (single build node)
        id: build
        env:
          RCCL_CHANGED: ${{ steps.paths.outputs.rccl_changed }}
          BUILD_RCCL: ${{ inputs.build_rccl || '0' }}
          CANDIDATE_SRC: ${{ github.workspace }}
          BASE_REF: ${{ needs.rccl-perf-resolve.outputs.base_ref }}
          SOURCE_CONFIG_JSON: ${{ inputs.config || '/it-share/rccl-ci/configs/ci_detect_prod.json' }}
        run: |
          python3 .github/scripts/rccl_perf_gate.py build \
            --output "${GITHUB_OUTPUT}"

      - name: Clean up per-run config copy on build failure
        # detect never runs, so nothing else removes this file from NFS.
        if: failure()
        continue-on-error: true
        env:
          CONFIG_JSON: ${{ steps.build.outputs.config_json }}
        run: python3 .github/scripts/rccl_perf_gate.py cleanup-config

  rccl-perf-detect:
    name: 'RCCL perf gate: A/B detect'
    needs: [rccl-perf-resolve, rccl-perf-build]
    if: >
      needs.rccl-perf-resolve.outputs.authorized == 'true' &&
      needs.rccl-perf-resolve.outputs.head_repo == github.repository &&
      needs.rccl-perf-build.result == 'success'
    concurrency:
      # Thresholds are only valid on the pinned nodes, which host one A/B job at
      # a time. Never cancel: a running allocation must drain to release them.
      group: rccl-perf-gate-pinned-nodes
      cancel-in-progress: false
    runs-on: [self-hosted, tw-gfx950-ainic-ROCm-scale-runner]
    timeout-minutes: 540
    permissions:
      contents: read
    outputs:
      exit_code: ${{ steps.detect.outputs.exit_code }}
    steps:
      - name: Run A/B detector (pinned 4-node allocation)
        id: detect
        # finalize decides pass/fail from the exit code; continue-on-error alone
        # can't tell a regression from an infra error.
        continue-on-error: true
        env:
          CONFIG_JSON: ${{ needs.rccl-perf-build.outputs.config_json }}
        run: |
          python3 .github/scripts/rccl_perf_gate.py detect \
            --output "${GITHUB_OUTPUT}"

      - name: Render report
        # Best-effort: a render hiccup must not turn an advisory regression into
        # a merge-blocking failure.
        if: always()
        continue-on-error: true
        run: |
          python3 "${RCCL_CI_ROOT}/cvs/ci/rccl_perf_gate/format_report.py" \
            "${RCCL_CI_ROOT}/ab_artifacts/ab_regression_report.json" \
            --no-exit-code \
            --output "${RUNNER_TEMP}/rccl_report.md"
          cat "${RUNNER_TEMP}/rccl_report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload rendered report (for finalize)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rccl-perf-report
          path: ${{ runner.temp }}/rccl_report.md
          if-no-files-found: ignore

      - name: Upload A/B artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rccl-ab-report
          path: |
            /it-share/rccl-ci/ab_artifacts/ab_regression_report.json
            /it-share/rccl-ci/ab_artifacts/ab_derived_thresholds.json
            /it-share/rccl-ci/ab_artifacts/rccl_runs.log
          if-no-files-found: ignore

      - name: Clean up per-run config copy
        if: always()
        continue-on-error: true
        env:
          CONFIG_JSON: ${{ needs.rccl-perf-build.outputs.config_json }}
        run: python3 .github/scripts/rccl_perf_gate.py cleanup-config

  rccl-perf-finalize:
    name: 'RCCL perf gate: verdict and report'
    needs: [rccl-perf-resolve, rccl-perf-build, rccl-perf-detect]
    # always(): the commit status must be resolved even when build/detect fail.
    if: always() && needs.rccl-perf-resolve.outputs.authorized == 'true' && needs.rccl-perf-resolve.outputs.head_repo == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      # Must precede download-artifact: checkout cleans the workspace.
      - name: Check out CI scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download rendered report (if any)
        if: needs.rccl-perf-resolve.outputs.pr_number != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: rccl-perf-report
          path: report

      - name: Compute verdict, set commit status, render comment
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.rccl-perf-resolve.outputs.head_sha }}
          BUILD_RESULT: ${{ needs.rccl-perf-build.result }}
          DETECT_RESULT: ${{ needs.rccl-perf-detect.result }}
          DETECT_CODE: ${{ needs.rccl-perf-detect.outputs.exit_code }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/rccl_perf_gate.py verdict \
            --report report/rccl_report.md \
            --comment comment.md \
            --output "${GITHUB_OUTPUT}"

      - name: Post / update PR comment
        if: needs.rccl-perf-resolve.outputs.pr_number != '' && steps.verdict.outputs.publish == 'true'
        uses: marocchino/sticky-pull-request-comment@f3bbb8300013c686241004a1c1b5d4045b10bc30  # v2
        with:
          header: rccl-perf-gate
          number: ${{ needs.rccl-perf-resolve.outputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          path: comment.md

      - name: Enforce result (fail the workflow on build/infra failure)
        # Skipped for superseded runs so a concurrency cancellation is not
        # reported as a failure.
        if: always() && steps.verdict.outputs.publish == 'true'
        env:
          STATE: ${{ steps.verdict.outputs.state }}
        run: python3 .github/scripts/rccl_perf_gate.py enforce

  rccl-perf-selftest:
    name: 'RCCL perf gate: helper unit tests'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run rccl_perf_gate.py unit tests
        run: python3 .github/scripts/tests/test_rccl_perf_gate.py
