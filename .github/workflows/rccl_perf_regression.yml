# NOT a required check: a commit status has no `skipped` state, so requiring it
# blocks every PR that never runs it. A regression does not fail the run either.

# Fork PRs need a second repo writer to comment `/perf-regression <full sha>`;
# that limits who, not what runs. AIMVT-285: gate these behind an environment.

# TODO(AIMVT-285): rccl_build.sbatch, submit_and_poll.sh and format_report.py
# are an unpinned ROCm/cvs working copy; vendor them in-tree.
name: RCCL Perf Regression Gate

on:
  # One A/B run per commit over-subscribes the single runner and the pinned
  # 4-node reservation, so PR events only seed the pending status hint.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'projects/rccl/**'
      - '.github/workflows/rccl_perf_regression.yml'
      - '.github/scripts/rccl_perf_gate.py'
      - '.github/scripts/tests/test_rccl_perf_gate.py'
  issue_comment:
    # Required: the default is [created, edited, deleted], so without this an
    # edit to an old comment would re-trigger the gate with a new body.
    types: [created]
  workflow_dispatch:
    inputs:
      config:
        description: 'Config JSON path on TW cluster'
        required: false
        default: '/it-share/rccl-ci/configs/ci_detect_prod.json'
      build_rccl:
        description: 'Build librccl from PR source (1=yes, 0=use fixed lib)'
        required: false
        default: '0'

env:
  RCCL_CI_ROOT: /it-share/rccl-ci
  SLURM_RESERVATION: rccl_ci
  PERF_COMMAND: /perf-regression
  STATUS_CONTEXT: RCCL Perf Regression Gate

# Every job below sets its own permissions, so this is defence in depth: a job
# added later that forgets gets nothing rather than the repository default.
permissions: {}

jobs:
  # Seeds the status so the PR shows how to run the gate.
  rccl-perf-hint:
    name: 'RCCL perf gate: pending hint'
    # Fork PRs get a read-only token, so a statuses POST would 403.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    concurrency:
      group: rccl-perf-gate-hint-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Inlined rather than checked out: a default-branch checkout cannot see
      # this branch's helper, and pinning buys nothing when the YAML is PR-owned.
      - name: Post pending hint status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context="${STATUS_CONTEXT}" \
            -f target_url="${TARGET_URL}" \
            -f description="Comment ${PERF_COMMAND} (repo writers) to run the perf gate"

  rccl-perf-resolve:
    name: 'RCCL perf gate: authorize and resolve'
    # Coarse pre-filter; the exact match and permission check are in the helper.
    if: >
      github.event_name == 'workflow_dispatch' ||
      ( github.event.issue.pull_request &&
        contains(github.event.comment.body, '/perf-regression') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    outputs:
      authorized: ${{ steps.ctx.outputs.authorized }}
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      base_ref: ${{ steps.ctx.outputs.base_ref }}
      pr_number: ${{ steps.ctx.outputs.pr_number }}
      requester: ${{ steps.ctx.outputs.requester }}
      head_repo: ${{ steps.ctx.outputs.head_repo }}
      vouched_sha: ${{ steps.ctx.outputs.vouched_sha }}
    steps:
      - name: Check out CI scripts
        uses: actions/checkout@v6
        with:
          # Default branch under issue_comment. On dispatch this runs the
          # dispatched ref's helper, which dispatch's write requirement allows.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Authorize and resolve PR context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/rccl_perf_gate.py resolve \
            --event "${GITHUB_EVENT_PATH}" \
            --comment comment.md \
            --output "${GITHUB_OUTPUT}"

      - name: Explain a refusal on the PR
        # always(): a fail-closed permission read exits non-zero above.
        if: always() && steps.ctx.outputs.deny_reason != ''
        uses: marocchino/sticky-pull-request-comment@f3bbb8300013c686241004a1c1b5d4045b10bc30  # v2
        with:
          header: rccl-perf-gate
          number: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}
          path: comment.md

      - name: Mark commit status pending (PR only)
        if: steps.ctx.outputs.authorized == 'true' && steps.ctx.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/rccl_perf_gate.py set-status \
            --state pending \
            --description "Perf regression run queued"

      - name: Acknowledge on the PR
        if: steps.ctx.outputs.authorized == 'true' && steps.ctx.outputs.pr_number != ''
        uses: marocchino/sticky-pull-request-comment@f3bbb8300013c686241004a1c1b5d4045b10bc30  # v2
        with:
          header: rccl-perf-gate
          number: ${{ steps.ctx.outputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          message: |
            🏃 **RCCL Perf Regression Gate** queued for commit `${{ steps.ctx.outputs.head_sha }}` (requested by @${{ steps.ctx.outputs.requester }}).

            [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  rccl-perf-build:
    name: 'RCCL perf gate: build reference and candidate'
    needs: rccl-perf-resolve
    if: needs.rccl-perf-resolve.outputs.authorized == 'true'
    concurrency:
      # Per-PR so PRs don't cancel each other; job-level concurrency can't read
      # `needs`, so the key comes from the event.
      group: rccl-perf-gate-build-${{ github.event.issue.number || github.ref }}
      # Never cancel, for the same reason as detect: this holds a Slurm
      # allocation and `sbatch --wait` would orphan it, still holding nodes.
      cancel-in-progress: false
    runs-on: [self-hosted, tw-gfx950-ainic-ROCm-scale-runner]
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      config_json: ${{ steps.build.outputs.config_json }}
    steps:
      # PR code from an earlier run shares this workspace. checkout's cleaner
      # readdir()s through a symlink at its `path:` into the target directory.
      - name: Delete workspace symlinks left by earlier runs
        run: find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -type l -delete

      # @v4 to match ainic_test_runner.yml on this same self-hosted runner;
      # newer checkout majors need a Node runtime we have not confirmed there.
      - name: Check out CI scripts (pinned, trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          path: .perf-gate-ci
          persist-credentials: false

      # Accepted risk (CodeQL actions/untrusted-checkout): building this code is
      # the point. A SHA pin is not a sandbox -- it can write $HOME, /it-share.
      - name: Check out the candidate (PR head, untrusted)
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.rccl-perf-resolve.outputs.head_repo }}
          ref: ${{ needs.rccl-perf-resolve.outputs.head_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Fetch base branch and detect changed paths
        id: paths
        # Dispatch takes the build from its input, and a tag has no branch to fetch.
        if: github.event_name == 'issue_comment'
        working-directory: candidate
        env:
          BASE_REF: ${{ needs.rccl-perf-resolve.outputs.base_ref }}
        run: |
          python3 "${GITHUB_WORKSPACE}/.perf-gate-ci/.github/scripts/rccl_perf_gate.py" \
            changed-paths --output "${GITHUB_OUTPUT}"

      - name: Build reference + candidate librccl (single build node)
        id: build
        env:
          RCCL_CHANGED: ${{ steps.paths.outputs.rccl_changed }}
          BUILD_RCCL: ${{ inputs.build_rccl || '0' }}
          CANDIDATE_SRC: ${{ github.workspace }}/candidate
          BASE_REF: ${{ needs.rccl-perf-resolve.outputs.base_ref }}
          SOURCE_CONFIG_JSON: ${{ inputs.config || '/it-share/rccl-ci/configs/ci_detect_prod.json' }}
        run: |
          python3 .perf-gate-ci/.github/scripts/rccl_perf_gate.py build \
            --output "${GITHUB_OUTPUT}"

      - name: Clean up per-run config copy on build failure
        # detect never runs, so nothing else removes this file from NFS.
        if: failure() || cancelled()
        continue-on-error: true
        env:
          CONFIG_JSON: ${{ steps.build.outputs.config_json }}
        run: python3 .perf-gate-ci/.github/scripts/rccl_perf_gate.py cleanup-config

  rccl-perf-detect:
    name: 'RCCL perf gate: A/B detect'
    needs: [rccl-perf-resolve, rccl-perf-build]
    if: >
      needs.rccl-perf-resolve.outputs.authorized == 'true' &&
      needs.rccl-perf-build.result == 'success'
    concurrency:
      # Thresholds are only valid on the pinned nodes, which host one A/B job at
      # a time. Never cancel: a running allocation must drain to release them.
      group: rccl-perf-gate-pinned-nodes
      cancel-in-progress: false
    runs-on: [self-hosted, tw-gfx950-ainic-ROCm-scale-runner]
    timeout-minutes: 540
    permissions:
      contents: read
    outputs:
      exit_code: ${{ steps.detect.outputs.exit_code }}
    steps:
      - name: Delete workspace symlinks left by earlier runs
        run: find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -type l -delete

      # path: confines checkout's clean to this subdir, so the build job's
      # candidate/ tree survives. @v4 for this runner, as above.
      - name: Check out CI scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          path: .perf-gate-ci
          persist-credentials: false

      - name: Run A/B detector (pinned 4-node allocation)
        id: detect
        # finalize decides pass/fail from the exit code; continue-on-error alone
        # can't tell a regression from an infra error.
        continue-on-error: true
        env:
          CONFIG_JSON: ${{ needs.rccl-perf-build.outputs.config_json }}
        run: |
          python3 .perf-gate-ci/.github/scripts/rccl_perf_gate.py detect \
            --output "${GITHUB_OUTPUT}"

      - name: Render report
        # Best-effort: a render hiccup must not fail the gate.
        if: always()
        continue-on-error: true
        run: |
          python3 "${RCCL_CI_ROOT}/cvs/ci/rccl_perf_gate/format_report.py" \
            "${RCCL_CI_ROOT}/ab_artifacts/ab_regression_report.json" \
            --no-exit-code \
            --output "${RUNNER_TEMP}/rccl_report.md"
          cat "${RUNNER_TEMP}/rccl_report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload rendered report (for finalize)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rccl-perf-report
          path: ${{ runner.temp }}/rccl_report.md
          if-no-files-found: ignore

      - name: Upload A/B artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rccl-ab-report
          path: |
            /it-share/rccl-ci/ab_artifacts/ab_regression_report.json
            /it-share/rccl-ci/ab_artifacts/ab_derived_thresholds.json
            /it-share/rccl-ci/ab_artifacts/rccl_runs.log
          if-no-files-found: ignore

      - name: Clean up per-run config copy
        if: always()
        continue-on-error: true
        env:
          CONFIG_JSON: ${{ needs.rccl-perf-build.outputs.config_json }}
        run: python3 .perf-gate-ci/.github/scripts/rccl_perf_gate.py cleanup-config

  rccl-perf-finalize:
    name: 'RCCL perf gate: verdict and report'
    needs: [rccl-perf-resolve, rccl-perf-build, rccl-perf-detect]
    # always(): the commit status must be resolved even when build/detect fail.
    if: always() && needs.rccl-perf-resolve.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      # Must precede download-artifact: checkout cleans the workspace.
      - name: Check out CI scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download rendered report (if any)
        if: needs.rccl-perf-resolve.outputs.pr_number != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: rccl-perf-report
          path: report

      - name: Compute verdict, set commit status, render comment
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.rccl-perf-resolve.outputs.head_sha }}
          PR_NUMBER: ${{ needs.rccl-perf-resolve.outputs.pr_number }}
          BUILD_RESULT: ${{ needs.rccl-perf-build.result }}
          DETECT_RESULT: ${{ needs.rccl-perf-detect.result }}
          DETECT_CODE: ${{ needs.rccl-perf-detect.outputs.exit_code }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/rccl_perf_gate.py verdict \
            --report report/rccl_report.md \
            --comment comment.md \
            --output "${GITHUB_OUTPUT}"

      - name: Post / update PR comment
        if: needs.rccl-perf-resolve.outputs.pr_number != ''
        uses: marocchino/sticky-pull-request-comment@f3bbb8300013c686241004a1c1b5d4045b10bc30  # v2
        with:
          header: rccl-perf-gate
          number: ${{ needs.rccl-perf-resolve.outputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          path: comment.md

      - name: Enforce result (fail the workflow on build/infra failure)
        if: always()
        env:
          STATE: ${{ steps.verdict.outputs.state }}
        run: python3 .github/scripts/rccl_perf_gate.py enforce

  rccl-perf-selftest:
    name: 'RCCL perf gate: helper unit tests'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out CI scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Run rccl_perf_gate.py unit tests
        run: python3 .github/scripts/tests/test_rccl_perf_gate.py
