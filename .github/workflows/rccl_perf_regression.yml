# RCCL paired A/B perf-regression gate (on-demand).
#
# DEPLOYMENT: RCCL lives in the ROCm/rocm-systems monorepo at projects/rccl.
# This file belongs at .github/workflows/rccl_perf_regression.yml and runs on the
# self-hosted org runner "tw-gfx950-ainic-ROCm-scale-runner".
#
# The Slurm submit/poll/report scripts these steps call
# (rccl_build.sbatch, rccl_ab.sbatch, submit_and_poll.sh, format_report.py)
# are version-controlled in ROCm/cvs under ci/rccl_perf_gate.
#
# TRIGGER (mandatory pre-merge check, run on demand — see AIMVT-285):
#   Instead of running on every push, the gate runs when an organization
#   member/collaborator comments the exact command `/perf-regression` on the PR
#   (workflow_dispatch is also supported for manual/testing runs). It reports a
#   commit status pinned to the PR head SHA (context below); branch protection
#   should require that context so merge stays blocked until it passes.
#
# Jobs (write tokens are isolated from the jobs that execute PR code):
#   resolve  (ubuntu, WRITE token, NO PR code) authorize + validate command +
#            resolve PR head/base + set pending status + ack comment.
#   build    (self-hosted, read-only token, PR code) build reference + candidate
#            librccl on one build node; per-PR concurrency.
#   detect   (self-hosted, read-only token, PR code) A/B detector on the pinned
#            4-node set; globally serialized; renders + uploads the report.
#   finalize (ubuntu, WRITE token, NO PR code) compute the verdict, set the final
#            commit status, and post the PR comment. Best-effort for runs that a
#            newer request supersedes via concurrency.
#
# Advisory mode: the verdict fails the status only on infra/polling errors, not
# on a detected regression yet (see AIMVT-285 / prior PR description).
name: RCCL Perf Regression Gate

on:
  # Lightweight hint only (see the `hint` job): seeds the required commit status
  # as pending with an instruction to comment the command. Does NOT run the gate.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'projects/rccl/**'
      - '.github/workflows/rccl_perf_regression.yml'
  issue_comment:
    types: [created]
  # Manual dispatch for testing / ad-hoc runs. Inputs mirror a PR run; omit them
  # to use the defaults (A=A detect: ref == cand == current built lib).
  workflow_dispatch:
    inputs:
      config:
        description: 'Config JSON path on TW cluster'
        required: false
        default: '/it-share/rccl-ci/configs/ci_detect_prod.json'
      build_rccl:
        description: 'Build librccl from PR source (1=yes, 0=use fixed lib)'
        required: false
        default: '0'

env:
  RCCL_CI_ROOT: /it-share/rccl-ci
  SLURM_RESERVATION: rccl_ci
  NODELIST: mia1-p01-g[22,26,28,32]
  PERF_COMMAND: /perf-regression
  STATUS_CONTEXT: RCCL Perf Regression Gate (on demand)

# No token by default; grant write only to the jobs that never run PR code.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # hint: on PR open/update, seed the required commit status as `pending` with an
  # instruction to comment the command. This is the ONLY thing that runs on
  # pull_request -- it never checks out or builds PR code. Without it the required
  # check would sit as a bare "expected" with no explanation of how to run it.
  # ---------------------------------------------------------------------------
  hint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    concurrency:
      group: rccl-perf-gate-hint-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Post pending hint status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f "context=${STATUS_CONTEXT}" \
            -f "target_url=${RUN_URL}" \
            -f "description=Comment ${PERF_COMMAND} (org members) to run the perf gate"

  # ---------------------------------------------------------------------------
  # resolve: authorization + context resolution + pending feedback.
  # Runs on a hosted runner and never checks out PR code, so its write-capable
  # token is never exposed to untrusted code.
  # ---------------------------------------------------------------------------
  resolve:
    # Coarse gate: manual dispatch, or a PR comment by an org member/collaborator.
    # The exact command match is enforced in the step below (contains() would
    # also match substrings/quotations, so it can't be trusted for this).
    if: >
      github.event_name == 'workflow_dispatch' ||
      ( github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      base_ref: ${{ steps.ctx.outputs.base_ref }}
      pr_number: ${{ steps.ctx.outputs.pr_number }}
      requester: ${{ steps.ctx.outputs.requester }}
    steps:
      - name: Validate command (exact /perf-regression on PR comments)
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Exact, trimmed, single-line match -- rejects substrings and quotations.
          trimmed="$(printf '%s' "${COMMENT_BODY}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ "${trimmed}" == "${PERF_COMMAND}" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "Comment is not exactly '${PERF_COMMAND}'; not triggering."
          fi

      - name: Resolve PR context
        id: ctx
        if: steps.gate.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            pr="${{ github.event.issue.number }}"
            data="$(gh api "repos/${{ github.repository }}/pulls/${pr}")"
            head_sha="$(printf '%s' "${data}" | jq -r '.head.sha')"
            base_ref="$(printf '%s' "${data}" | jq -r '.base.ref')"
            echo "pr_number=${pr}" >> "$GITHUB_OUTPUT"
            echo "requester=${{ github.event.comment.user.login }}" >> "$GITHUB_OUTPUT"
          else
            head_sha="${{ github.sha }}"
            base_ref="${{ github.ref_name }}"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "requester=${{ github.actor }}" >> "$GITHUB_OUTPUT"
          fi
          # base_ref is untrusted API data -- validate before any downstream git use.
          git check-ref-format "refs/heads/${base_ref}"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "base_ref=${base_ref}" >> "$GITHUB_OUTPUT"

      - name: Mark commit status pending (PR only)
        if: steps.gate.outputs.authorized == 'true' && steps.ctx.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f "context=${STATUS_CONTEXT}" \
            -f "target_url=${RUN_URL}" \
            -f "description=Perf regression run queued"

      - name: Acknowledge on the PR
        if: steps.gate.outputs.authorized == 'true' && steps.ctx.outputs.pr_number != ''
        uses: marocchino/sticky-pull-request-comment@f3bbb8300013c686241004a1c1b5d4045b10bc30  # v2
        with:
          header: rccl-perf-gate
          number: ${{ steps.ctx.outputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          message: |
            🏃 **RCCL Perf Regression Gate** queued for commit `${{ steps.ctx.outputs.head_sha }}` (requested by @${{ steps.ctx.outputs.requester }}).

            [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # ---------------------------------------------------------------------------
  # build: compile reference + candidate librccl on one build node.
  # Runs PR code -> read-only token, per-PR concurrency (so PRs don't cancel
  # each other; a newer /perf-regression on the SAME PR supersedes an older one).
  # ---------------------------------------------------------------------------
  build:
    needs: resolve
    # Forked PRs cannot run this workflow: it builds and MPI-executes the PR's
    # own source on a self-hosted runner, so arbitrary fork code would get
    # arbitrary code execution on our infrastructure. Scope to same-repo PRs
    # only; workflow_dispatch is unaffected (it already requires repo write
    # access to trigger). (Kept from the original -- a no-op under
    # issue_comment/workflow_dispatch, which are never 'pull_request', so the
    # existing guard isn't weakened.)
    if: >
      needs.resolve.outputs.authorized == 'true' &&
      ( github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository )
    # Separate lock from the detect job below: build never touches the pinned
    # nodes, so it shouldn't queue behind another PR's in-flight A/B run.
    # (Real cross-PR parallelism from this also needs a 2nd self-hosted runner
    # -- see "Runner capacity" in the PR's known gaps. With one runner, this
    # still shortens how long the 4-node reservation is held per PR.)
    concurrency:
      # Per-PR so PRs don't cancel each other; job-level concurrency can't read
      # `needs`, so derive the key from the event.
      group: rccl-perf-gate-build-${{ github.event.issue.number || github.ref }}
      cancel-in-progress: true
    runs-on: [self-hosted, tw-gfx950-ainic-ROCm-scale-runner]
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      config_json: ${{ steps.build.outputs.config_json }}
    steps:
      - name: Checkout PR head (pinned SHA, full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/${BASE_REF}"
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Detect changed paths (merge-base)
        id: paths
        env:
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
        run: |
          set -euo pipefail
          base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          # Let grep consume the whole stream (grep -q closes early, which can
          # SIGPIPE git diff -> exit 141 under pipefail -> false 'rccl_changed=0').
          if git diff --name-only "${base}" HEAD | grep '^projects/rccl/' >/dev/null; then
            echo "rccl_changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "rccl_changed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build reference + candidate librccl (single build node)
        id: build
        env:
          BUILD_RCCL: ${{ github.event_name == 'issue_comment' && steps.paths.outputs.rccl_changed || inputs.build_rccl || '0' }}
          CANDIDATE_SRC: ${{ github.workspace }}
          BASE_REF: origin/${{ needs.resolve.outputs.base_ref }}
          _CONFIG: ${{ inputs.config || '/it-share/rccl-ci/configs/ci_detect_prod.json' }}
        run: |
          if [[ "${BUILD_RCCL}" == "1" ]]; then
            # Give every run its own config copy so a concurrent build can't
            # clobber another PR's in-flight detect config.
            RUN_CONFIG="${RCCL_CI_ROOT}/configs/ci_detect_run_${{ github.run_id }}.json"
            cp "${_CONFIG}" "${RUN_CONFIG}"
            # Set the output before sbatch so cleanup-on-failure can find it.
            echo "config_json=${RUN_CONFIG}" >> "$GITHUB_OUTPUT"
            sbatch --wait \
              --export="ALL,CANDIDATE_SRC=${CANDIDATE_SRC},BASE_REF=${BASE_REF},CONFIG_JSON=${RUN_CONFIG}" \
              --reservation="${SLURM_RESERVATION}" \
              "${RCCL_CI_ROOT}/cvs/ci/rccl_perf_gate/sbatch/rccl_build.sbatch"
          else
            echo "config_json=${_CONFIG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up per-run config copy on build failure
        # If sbatch fails after the per-run copy is made, detect never runs, so
        # nothing else removes this file from NFS.
        if: failure()
        env:
          _CONFIG: ${{ steps.build.outputs.config_json }}
        run: |
          case "${_CONFIG}" in
            "${RCCL_CI_ROOT}"/configs/ci_detect_run_*.json) rm -f "${_CONFIG}" ;;
          esac

  # ---------------------------------------------------------------------------
  # detect: A/B detector on the pinned 4-node set. Globally serialized (only one
  # A/B job on those nodes at a time). Runs PR-built artifacts -> read-only
  # token; renders + uploads the report for finalize to post.
  # ---------------------------------------------------------------------------
  detect:
    needs: [resolve, build]
    # Same-repo guard preserved (see build) -- no-op under issue_comment/dispatch.
    if: >
      needs.resolve.outputs.authorized == 'true' &&
      needs.build.result == 'success' &&
      ( github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository )
    # Serialise: the pinned calibration nodes can host only one A/B job at a
    # time, and thresholds are only valid there. Do NOT cancel in-progress (a
    # running allocation must finish cleanly to release the nodes).
    concurrency:
      group: rccl-perf-gate-pinned-nodes
      cancel-in-progress: false
    runs-on: [self-hosted, tw-gfx950-ainic-ROCm-scale-runner]
    timeout-minutes: 540
    permissions:
      contents: read
    outputs:
      exit_code: ${{ steps.detect.outputs.exit_code }}
    steps:
      - name: Run A/B detector (pinned 4-node allocation)
        id: detect
        # Capture the exit code; the finalize job decides pass/fail from it
        # (continue-on-error can't distinguish a regression from an infra error).
        continue-on-error: true
        env:
          _CONFIG: ${{ needs.build.outputs.config_json }}
        run: |
          set +e
          bash "${RCCL_CI_ROOT}/cvs/ci/rccl_perf_gate/submit_and_poll.sh" "${_CONFIG}"
          code=$?
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "${code}"

      - name: Render report
        if: always()
        run: |
          python3 "${RCCL_CI_ROOT}/cvs/ci/rccl_perf_gate/format_report.py" \
            "${RCCL_CI_ROOT}/ab_artifacts/ab_regression_report.json" \
            --no-exit-code \
            --output "${RUNNER_TEMP}/rccl_report.md"
          cat "${RUNNER_TEMP}/rccl_report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload rendered report (for finalize)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rccl-perf-report
          path: ${{ runner.temp }}/rccl_report.md
          if-no-files-found: ignore

      - name: Upload A/B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rccl-ab-report
          path: |
            /it-share/rccl-ci/ab_artifacts/ab_regression_report.json
            /it-share/rccl-ci/ab_artifacts/ab_derived_thresholds.json
            /it-share/rccl-ci/ab_artifacts/rccl_runs.log
          if-no-files-found: ignore

      - name: Clean up per-run config copy
        if: always()
        env:
          _CONFIG: ${{ needs.build.outputs.config_json }}
        run: |
          case "${_CONFIG}" in
            "${RCCL_CI_ROOT}"/configs/ci_detect_run_*.json) rm -f "${_CONFIG}" ;;
          esac

  # ---------------------------------------------------------------------------
  # finalize: compute the verdict and publish feedback. Hosted runner, WRITE
  # token, never checks out PR code. Runs even if build/detect failed so the
  # commit status is always resolved (best-effort if a newer run supersedes it).
  # ---------------------------------------------------------------------------
  finalize:
    needs: [resolve, build, detect]
    if: always() && needs.resolve.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Download rendered report (if any)
        if: needs.resolve.outputs.pr_number != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: rccl-perf-report
          path: report

      - name: Compute verdict and set commit status
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          DETECT_RESULT: ${{ needs.detect.result }}
          DETECT_CODE: ${{ needs.detect.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # If this run was superseded by a newer /perf-regression on the same PR,
          # its build was cancelled by concurrency. Do NOT publish -- the newer
          # run owns the pending status and sticky comment, and an old finalizer
          # writing here would clobber the newer run's feedback for the same
          # SHA/context. (This also skips feedback for manual cancellations;
          # distinguishing them would need a durable current-run marker.)
          if [[ "${BUILD_RESULT}" == "cancelled" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Build cancelled (superseded) -- not publishing status/comment."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          # Advisory: a detected regression (detector exit 1) does NOT fail the
          # gate; only build failures / detector job or infra errors do.
          state=success; desc="Perf gate passed"
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            state=failure; desc="Build job ${BUILD_RESULT}"
          elif [[ "${DETECT_RESULT}" == "cancelled" || "${DETECT_RESULT}" == "skipped" ]]; then
            state=error; desc="Detector ${DETECT_RESULT}"
          elif [[ "${DETECT_RESULT}" != "success" ]]; then
            state=failure; desc="Detector job ${DETECT_RESULT}"
          elif [[ "${DETECT_CODE}" != "0" && "${DETECT_CODE}" != "1" ]]; then
            state=failure; desc="Detector infra error (exit ${DETECT_CODE:-unknown})"
          fi
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "desc=${desc}" >> "$GITHUB_OUTPUT"
          if [[ -n "${HEAD_SHA}" ]]; then
            gh api -X POST "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
              -f "state=${state}" \
              -f "context=${STATUS_CONTEXT}" \
              -f "target_url=${RUN_URL}" \
              -f "description=${desc}"
          fi

      - name: Assemble PR comment
        if: needs.resolve.outputs.pr_number != '' && steps.verdict.outputs.publish == 'true'
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          STATE: ${{ steps.verdict.outputs.state }}
          DESC: ${{ steps.verdict.outputs.desc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "### RCCL Perf Regression Gate (on demand)"
            echo
            echo "- Commit: \`${HEAD_SHA}\`"
            echo "- Result: **${STATE}** — ${DESC}"
            echo "- [Run log](${RUN_URL})"
            echo
            if [[ -f report/rccl_report.md ]]; then
              cat report/rccl_report.md
            fi
          } > comment.md

      - name: Post / update PR comment
        if: needs.resolve.outputs.pr_number != '' && steps.verdict.outputs.publish == 'true'
        uses: marocchino/sticky-pull-request-comment@f3bbb8300013c686241004a1c1b5d4045b10bc30  # v2
        with:
          header: rccl-perf-gate
          number: ${{ needs.resolve.outputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          path: comment.md

      - name: Enforce result (fail the workflow on build/infra failure)
        # Restores the original contract: infra/polling failures fail the run.
        # A detected regression stays advisory (state=success). Skipped for
        # superseded runs so concurrency cancellation isn't reported as failure.
        if: always() && steps.verdict.outputs.publish == 'true'
        env:
          STATE: ${{ steps.verdict.outputs.state }}
        run: |
          if [[ "${STATE}" == "failure" || "${STATE}" == "error" ]]; then
            echo "::error::RCCL Perf Regression Gate ${STATE} -- see the PR status/comment."
            exit 1
          fi
