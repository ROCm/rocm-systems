name: Merge .gitmodules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combine-gitmodules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout super-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # "Commit Merged .gitmodules" pushes with the persisted credentials.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Run Merge Script
        run: python .github/scripts/merge-submodules.py

      - name: Commit Merged .gitmodules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .gitmodules
          git commit -m "Combine subrepo .gitmodules files into root" || echo "No changes"
          git push
