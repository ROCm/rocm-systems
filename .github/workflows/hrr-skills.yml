# Checks for the HRR agent skills. These are the checks that need no GPU: the
# unit suites each skill ships, a syntax pass over their scripts, and the
# structural rules the AMD skills catalogue enforces on anything it federates.
# The behavioural evals need an agent and a language-model gateway, so they are
# not run here.

name: "HRR skills"

on:
  push:
    branches: [develop]
    paths:
      - 'projects/hrr/skills/**'
      # Checked for broken references by the structural job, so a change to it
      # has to run this workflow too.
      - 'projects/hrr/README.md'
      - '.github/workflows/hrr-skills.yml'
  pull_request:
    paths:
      - 'projects/hrr/skills/**'
      - 'projects/hrr/README.md'
      - '.github/workflows/hrr-skills.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: "HRR skills: unit tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            projects/hrr/skills
            .github/workflows
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'

      - name: Compile every Python file
        run: python -m compileall -q projects/hrr/skills

      - name: Run the tests each skill ships
        run: |
          set -euo pipefail
          # Discovered rather than listed, so a new skill is covered the day it
          # lands, and an empty result is a failure rather than a silent pass.
          mapfile -t suites < <(find projects/hrr/skills -name 'test_*.py' -print | sort)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "No skill test suites found under projects/hrr/skills."
            exit 1
          fi
          printf 'Found %s\n' "${suites[@]}"
          # One pytest process per skill: each suite puts its own skill's
          # scripts/ on sys.path, and a module one suite imports stays in
          # sys.modules, so two skills naming a script the same would otherwise
          # test the first one's copy. importlib mode lets test files share a name.
          mapfile -t skills < <(printf '%s\n' "${suites[@]}" | cut -d/ -f1-4 | sort -u)
          rc=0
          for skill in "${skills[@]}"; do
            echo "::group::$skill"
            python -m pytest "$skill" -q -rs --import-mode=importlib || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  script-syntax:
    name: "HRR skills: scripts parse"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            projects/hrr/skills
            .github/workflows
          persist-credentials: false

      - name: Parse every shell script
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find projects/hrr/skills -name '*.sh' -print | sort)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found under projects/hrr/skills."
            exit 1
          fi
          printf '%s\0' "${scripts[@]}" | xargs -0 -n1 bash -n
          echo "${#scripts[@]} shell script(s) parse."

      # The Windows replay path is PowerShell, and nothing else in the tree
      # checks it. pwsh ships on the runner image. The errors are written out
      # as text: left as objects they are buffered for a table, and exit 1
      # discards them unprinted.
      - name: Parse every PowerShell script
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find projects/hrr/skills -name '*.ps1' -print | sort)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No PowerShell scripts found under projects/hrr/skills."
            exit 0
          fi
          # The path goes in as data, so a quote in a file name cannot end the string.
          for script in "${scripts[@]}"; do
            HRR_PS1="$script" pwsh -NoProfile -Command '
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($env:HRR_PS1, [ref]$null, [ref]$errors)
              if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
            '
          done
          echo "${#scripts[@]} PowerShell script(s) parse."

  structural:
    name: "HRR skills: catalogue structural checks"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The whole project, not just the skills: this job checks the references
      # the markdown makes, and a file left out of the checkout is
      # indistinguishable from a broken link.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            projects/hrr
            .github/workflows
          persist-credentials: false

      # The action pins itself, not the uv it installs, which is otherwise
      # whatever is latest on the day.
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: '0.12.21'

      - name: Check there is something to check
        run: |
          set -euo pipefail
          # skillscope suppresses its own "no skills found" error when --docs is
          # given, so a rename that stops matching would leave this job green
          # having graded nothing.
          mapfile -t skills < <(find projects/hrr/skills -mindepth 2 -maxdepth 2 -name SKILL.md -print | sort)
          if [ ${#skills[@]} -eq 0 ]; then
            echo "No skills found under projects/hrr/skills."
            exit 1
          fi
          printf 'Found %s\n' "${skills[@]}"

      # skillscope is the harness the AMD skills catalogue runs. Pinned to a
      # commit, like every action here: it grades the same skills we ship, so
      # its rules changing under us is a thing to adopt deliberately rather
      # than discover on a red run.
      - name: Run skillscope structural checks
        run: |
          uvx --from git+https://github.com/amd/skillscope@68b69e2eff60c41f5d5482bb89f24e07ce4fbebb skillscope \
            --repo . structural \
            --skills-dir 'projects/hrr/skills/*' \
            --skill-files skill-card.md \
            --skill-sections Description,Owner,License \
            --docs 'projects/hrr/README.md'
