name: CUID Formatting

on:
  push:
    branches:
      - develop
    paths:
      - 'projects/cuid/**'
  pull_request:

permissions:
  contents: read

concurrency:
  # PRs: group by PR number so a new commit cancels in-flight runs.
  # Pushes: group by SHA so postsubmit runs never cancel each other.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit / cuid
    runs-on: ubuntu-24.04
    steps:
      # Fetch commit/tree history without checking out the source or submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: .github/actions/scoped-formatting

      - uses: ./.github/actions/scoped-formatting
        with:
          include: '^(projects/cuid/|\.github/workflows/cuid-formatting\.yml\Z)'
          exclude: '(\.(md|rst|rtf)\Z|(^|/)\.readthedocs\.yaml\Z|^projects/cuid/docs/)'
          config: projects/cuid/.pre-commit-config.yaml
