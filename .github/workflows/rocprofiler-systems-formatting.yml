
name: rocprofiler-systems Formatting
run-name: formatting

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rocprofiler-systems-formatting.yml'
      - '.pre-commit-config.yaml'
      - 'projects/rocprofiler-systems/**'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint-md:
    name: "Markdown"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: projects/rocprofiler-systems

      - name: Use markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@6b51ade7a9e4a75a7ad929842dd298a3804ebe8b # v23.1.0
        with:
          globs: "projects/rocprofiler-systems/**/*.md"

  spelling:
    name: "Spelling"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: projects/rocprofiler-systems

      - name: Fetch config
        working-directory:
        shell: sh
        run: |
          cp projects/rocprofiler-systems/.wordlist.txt .
          curl --silent --show-error --fail --location https://raw.github.com/ROCm/rocm-docs-core/develop/.spellcheck.yaml -o .spellcheck.yaml
          curl --silent --show-error --fail --location https://raw.github.com/ROCm/rocm-docs-core/develop/.wordlist.txt >> .wordlist.txt

          sed -i "s|docs/\*\*/\*.md|projects/rocprofiler-systems/docs/**/*.md|g" .spellcheck.yaml

      - name: Run spellcheck
        uses: rojopolis/spellcheck-github-actions@e3cd8e9aec4587ec73bc0e60745aafd45c37aa2e # 0.60.0

      - name: On fail
        if: failure()
        run: |
          echo "Please check for spelling mistakes or add them to '.wordlist.txt' in either the root of this project or in rocm-docs-core."

  pre-commit:
    name: "pre-commit (shared + project hooks)"
    runs-on: ubuntu-latest

    steps:
    # Full checkout: the project config delegates the shared formatters to the
    # repository-root .pre-commit-config.yaml, which must be present on disk.
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install pre-commit
      run: pip install pre-commit

    # Checks the whole project tree rather than just the changed files, which
    # preserves the coverage of the find-based black/gersemi/clang-format jobs
    # this replaced. Tool versions come from the root config, so this project
    # no longer pins clang-format/gersemi/black separately.
    - name: Run pre-commit
      run: |
        FILES=$(git ls-files projects/rocprofiler-systems/ \
          | while IFS= read -r f; do if [ -f "$f" ]; then echo "$f"; fi; done)
        if [ -z "$FILES" ]; then
          echo "No files to check."
          exit 0
        fi
        pre-commit run \
          --config projects/rocprofiler-systems/.pre-commit-config.yaml \
          --show-diff-on-failure \
          --color=always \
          --files $FILES

  includes:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: projects/rocprofiler-systems
    - name: check-includes
      working-directory: projects/rocprofiler-systems/
      run: |
        set +e
        FILES=$(find source examples -type f | egrep '\.(hpp|cpp)(|\.in)$')
        MATCHES=$(egrep 'include "timemory/|include <bits/' ${FILES})
        if [ -n "${MATCHES}" ]; then
          echo -e "\nError! Included timemory header with quotes or bits folder included\n"
          echo -e "### MATCHES: ###"
          echo -e "${MATCHES}"
          echo -e "################"
          exit 1
        fi

  fixedwidth-types:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: projects/rocprofiler-systems
    - name: check-fixedwidth-types
      working-directory: projects/rocprofiler-systems/
      run: |
        bash scripts/check-fixedwidth-types.sh
