# Pytest corpus checks for emulation/rocjitsu/.
#
# Fast smoke tests for rocjitsu. This is likely going to be added to TheRock
# tests, but it is currently a stopgap solution. It allows developers to
# quickly check that their changes to rocjitsu didn't break gfx1250 emulation.
name: "rocjitsu-test-corpus"

on:
  pull_request:
    paths:
      - "emulation/rocjitsu/**"
      - ".github/scripts/rocjitsu_corpus_translation_comment*.py"
      - ".github/workflows/rocjitsu-*.yml"
  push:
    branches:
      - develop
    paths:
      - "emulation/rocjitsu/**"
      - ".github/workflows/rocjitsu-*.yml"
  workflow_dispatch:
    inputs:
      corpus_repository:
        description: "Repository containing the rocjitsu pytest corpus"
        default: "ROCm/rocjitsu-test-corpus"
        required: true
      corpus_ref:
        description: "Branch, tag, or SHA used by all corpus tests"
        # Last updated on 2026/08/11.
        default: "cc781dd88cabd1638d1beeb4539c521ccf27de60"
        required: true

concurrency:
  # Preserve every non-PR run, including manual reruns of one develop commit.
  # This intentionally prevents back-to-back develop pushes from cancelling
  # the full lane so each can publish. PR updates still supersede old revisions.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ROCJITSU_SOURCE_DIR: ${{ github.workspace }}/rocm-systems/emulation/rocjitsu
  ROCJITSU_BUILD_DIR: ${{ github.workspace }}/build
  ROCJITSU_CORPUS_DIR: ${{ github.workspace }}/rocjitsu-test-corpus
  ROCJITSU_DBT_VENV: ${{ github.workspace }}/gfx1250-dbt-venv-${{ github.run_id }}-${{ github.run_attempt }}
  ROCJITSU_HSACO_CORPUS: ${{ github.workspace }}/gfx1250-packaged-hsacos-${{ github.run_id }}-${{ github.run_attempt }}
  ROCJITSU_DBT_CORPUS_REF: cc781dd88cabd1638d1beeb4539c521ccf27de60
  ROCJITSU_DBT_SHA_FRAGMENTS: ${{ github.workspace }}/gfx1250-dbt-sha-pairs-${{ github.run_id }}-${{ github.run_attempt }}/fragments
  ROCJITSU_DBT_SHA_MANIFEST: ${{ github.workspace }}/gfx1250-dbt-sha-pairs-${{ github.run_id }}-${{ github.run_attempt }}/gfx1250-b0-a0-sha-pairs.json
  ROCM_SDK_VERSION: 10.1.0a20260812
  ROCM_SDK_DEVICE_GFX_GROUP: "gfx1100 gfx1201 gfx1250 gfx942 gfx950"
  UV_VERSION: 0.9.26
  UV_HTTP_RETRIES: 10

jobs:
  test:
    runs-on: aws-linux-scale-rocm-prod
    name: test (${{ matrix.name }})
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --user 0:0
      env:
        DEBIAN_FRONTEND: noninteractive
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            allow_failure: false
            # 20,131 verified objects completed in 146.47s locally; 20 minutes
            # leaves substantial runner headroom while this release-only gate lands.
            verify_dbt_idempotence: 1
            dbt_timeout: 60
            dbt_memory_limit_mib: 4096
            dbt_job_timeout: 20
            test_regex: ''
            build_type: Release
            enable_asan: 0
            enable_ubsan: 0
            enable_tsan: 0
            enable_expensive_checks: 0
            sanitizer_runtime: STATIC
            run_simulator_corpus: true
            corpus_soft_timeout: 30
            corpus_hard_timeout: 60
            corpus_rerun_timeout: 600
            corpus_sanitizer: none
          - name: asan-ubsan
            allow_failure: true
            # Sanitized simulator cases need extra interpreter headroom.
            # A failed-test rerun preserves extra diagnostics.
            verify_dbt_idempotence: 0
            dbt_timeout: 180
            dbt_memory_limit_mib: 4096
            dbt_job_timeout: 30
            test_regex: ''
            build_type: RelWithDebInfo
            enable_asan: 1
            enable_ubsan: 1
            enable_tsan: 0
            enable_expensive_checks: 1
            sanitizer_runtime: SHARED
            run_simulator_corpus: true
            corpus_soft_timeout: 240
            corpus_hard_timeout: 480
            corpus_rerun_timeout: 1200
            corpus_sanitizer: clang-asan
          - name: tsan
            allow_failure: false
            verify_dbt_idempotence: 0
            dbt_timeout: 30
            dbt_memory_limit_mib: 4096
            dbt_job_timeout: 20
            run_static_asan_launch: true
            test_regex: ''
            build_type: RelWithDebInfo
            enable_asan: 0
            enable_ubsan: 0
            enable_tsan: 1
            enable_expensive_checks: 0
            sanitizer_runtime: SHARED
            run_simulator_corpus: false
            corpus_soft_timeout: 0
            corpus_hard_timeout: 0
            corpus_rerun_timeout: 0
            corpus_sanitizer: none
          - name: ubsan-gcc
            allow_failure: true
            verify_dbt_idempotence: 0
            # Keep additional headroom for the largest packaged code objects.
            dbt_timeout: 180
            dbt_memory_limit_mib: 8192
            dbt_job_timeout: 30
            test_regex: ''
            build_type: RelWithDebInfo
            enable_asan: 0
            enable_ubsan: 1
            enable_tsan: 0
            enable_expensive_checks: 1
            sanitizer_runtime: SHARED
            c_compiler: gcc
            cxx_compiler: g++
            run_simulator_corpus: true
            corpus_soft_timeout: 240
            corpus_hard_timeout: 480
            corpus_rerun_timeout: 1200
            corpus_sanitizer: none

    steps:
      - name: Install base dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libclang-rt-dev \
            libdrm-dev \
            ninja-build \
            clang

      - name: Checkout rocm-systems
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: rocm-systems
          sparse-checkout: |
            emulation/rocjitsu
            .github
            shared/machine-readable-isa/isa

      - name: Checkout corpus
        if: matrix.run_simulator_corpus
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.inputs.corpus_repository || 'ROCm/rocjitsu-test-corpus' }}
          ref: ${{ github.event.inputs.corpus_ref || env.ROCJITSU_DBT_CORPUS_REF }}
          path: rocjitsu-test-corpus

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Test DBT SHA-pair tooling
        if: matrix.name == 'release'
        run: |
          python3 \
            "${ROCJITSU_SOURCE_DIR}/tests/corpus/test-record-gfx1250-dbt-sha-pairs.py"
          python3 \
            "${GITHUB_WORKSPACE}/rocm-systems/.github/scripts/test-rocjitsu-corpus-translation-comment.py"

      - name: Install ROCm SDK
        run: |
          uv pip install --system --prerelease allow \
            --index-url https://rocm.nightlies.amd.com/whl-multi-arch/ \
            "rocm[devel,libraries]==${ROCM_SDK_VERSION}"
          ROCM_LIB="$(rocm-sdk path --root)"/lib
          echo "LD_LIBRARY_PATH=${ROCM_LIB}:${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"

      - name: Build rocjitsu
        id: build_rocjitsu
        working-directory: ${{ env.ROCJITSU_SOURCE_DIR }}
        shell: bash
        run: |
          ROCMINFO=RocminfoTest
          RCCL_DAEMON=RcclDaemonTest
          EXCLUDED_TESTS="${ROCMINFO}|${RCCL_DAEMON}"
          COMMON_SANITIZER_EXCLUDED_TESTS=(
            # The hardware-backed tools-hook test cannot initialize ROCR when
            # the launcher and hook use a sanitizer-instrumented process image.
            "HsaHooksTest\.TranslateGfx950Mfma16x16ThroughToolsLib"
            "Cdna4ToCdna3SimulatedDispatchTest\..*"
            "Cdna4ToCdna3DbtGuestTest\..*"
            "DaemonTest\.LoggingPlugin"
            "BfeRegressionTest\.ThreadIdxY"
            "LoggingTest\.dispatch_logged"
            "CvtNarrow\.AllTests"
            "RaceTest\..*"
          )
          CLANG_ASAN_UBSAN_EXCLUDED_TESTS=(
            "${COMMON_SANITIZER_EXCLUDED_TESTS[@]}"
            # Direct HIP clients hang in the Clang sanitizer lane. The daemon
            # variants complete their functional checks, but the unsymbolized
            # ROCr library reports process-exit allocations that cannot be
            # suppressed without hiding all leaks originating in ROCr.
            "HipMemcpyTest\.RoundTripFloat"
            "HipMemcpyTest\.RoundTripInt"
            "HipMemcpyTest\.DeviceToDevice"
            "HipVectorAddTest\.CorrectResult"
            "DaemonTest\.HipMemcpyRoundTripFloat"
            "DaemonTest\.HipMemcpyRoundTripInt"
            "DaemonTest\.HipMemcpyDeviceToDevice"
            "DaemonTest\.TwoIndependentClients"
          )
          TSAN_EXCLUDED_TESTS=(
            "${COMMON_SANITIZER_EXCLUDED_TESTS[@]}"
            # Hardware dispatch reports a TSan race while ROCr tears down its
            # async-event bookkeeping, outside rocjitsu-owned code.
            "HsaTranslateTest\.TranslateAndDispatchVectorAdd"
            "HsaTranslateTest\.TranslateAndDispatchMfma16x16"
            # HIP test discovery and the daemon HIP clients initialize the
            # instrumented ROCr runtime, which can report a ConcurrentAsyncEvents
            # race during asynchronous-event teardown outside rocjitsu-owned code.
            # Vector add also exposes unsynchronized simulator/client buffer access.
            "HipMemcpyTest\.RoundTripFloat"
            "HipMemcpyTest\.RoundTripInt"
            "HipMemcpyTest\.DeviceToDevice"
            "HipVectorAddTest\.CorrectResult"
            "DaemonTest\.HipMemcpyRoundTripFloat"
            "DaemonTest\.HipMemcpyRoundTripInt"
            "DaemonTest\.HipMemcpyDeviceToDevice"
            "DaemonTest\.TwoIndependentClients"
            # This test has a five-second wall-clock assertion that becomes
            # load-sensitive at the TSan job's CI-level parallelism.
            "DaemonApi\.FullListenerQueueDoesNotBlockOrRemoveSocket"
            # The DBI dispatch cases run a full simulator in-process against the
            # client's own AQL ring and buffers, so they hit the MAP_SHARED alias
            # limitation described below: every race is GpuMemory::read_mapped
            # reading a host buffer the test thread wrote. Their gtest assertions
            # pass. The non-dispatching HsaDbiNop*Sim cases stay covered.
            # The .* spans the per-target infix, so every target's dispatching
            # Sim case is excluded -- they all share the limitation.
            "HsaDbiNopAsm.*Sim\.PatchedKernelDispatchMatchesOriginal"
            "HsaDbiNopAsm.*Sim\.TrampolineIsActuallyExecutedByGpu"
            "HsaDbiNopProbe.*Sim\.PatchedKernelDispatchMatchesOriginal"
            "HsaDbiNopProbe.*Sim\.ProbeBodyIsActuallyCalledByGpu"
          )

          TEST_REGEX="${{ matrix.test_regex }}"
          CMAKE_CONFIG_FLAGS=()
          if [[ "${{ matrix.enable_asan }}" == "1" || "${{ matrix.enable_ubsan }}" == "1" ]]; then
            if [[ -z "${{ matrix.cxx_compiler }}" || "${{ matrix.cxx_compiler }}" == *clang* ]]; then
              EXCLUDED_TESTS="${EXCLUDED_TESTS}|$(IFS='|'; echo "${CLANG_ASAN_UBSAN_EXCLUDED_TESTS[*]}")"
            else
              EXCLUDED_TESTS="${EXCLUDED_TESTS}|$(IFS='|'; echo "${COMMON_SANITIZER_EXCLUDED_TESTS[*]}")"
            fi
            CMAKE_CONFIG_FLAGS+=(
              -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -g"
              -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g"
            )
          fi
          if [[ "${{ matrix.enable_tsan }}" == "1" ]]; then
            # The CP reads a stable MAP_SHARED alias rather than the client's
            # virtual address. TSan keys shadow state by address and therefore
            # cannot validate the store/load synchronization across those two
            # aliases; these tests cover lifecycle and teardown races only.
            EXCLUDED_TESTS="${EXCLUDED_TESTS}|$(IFS='|'; echo "${TSAN_EXCLUDED_TESTS[*]}")"
          fi
          if [[ -n "${{ matrix.c_compiler }}" ]]; then
            CMAKE_CONFIG_FLAGS+=(-DCMAKE_C_COMPILER="${{ matrix.c_compiler }}")
          fi
          if [[ -n "${{ matrix.cxx_compiler }}" ]]; then
            CMAKE_CONFIG_FLAGS+=(-DCMAKE_CXX_COMPILER="${{ matrix.cxx_compiler }}")
          fi

          CXXFLAGS=""
          if [[ -z "${{ matrix.cxx_compiler }}" || "${{ matrix.cxx_compiler }}" == *clang* ]]; then
            CXXFLAGS="-Wno-error=unknown-warning-option -Wno-error=nested-anon-types"
          fi
          ROCM_PATH=`rocm-sdk path --root` \
            cmake -B "${ROCJITSU_BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_C_FLAGS="${CFLAGS:-}" \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS:-}" \
            "${CMAKE_CONFIG_FLAGS[@]}" \
            -DRJ_ENABLE_ASAN=${{ matrix.enable_asan }} \
            -DRJ_ENABLE_UBSAN=${{ matrix.enable_ubsan }} \
            -DRJ_ENABLE_TSAN=${{ matrix.enable_tsan }} \
            -DRJ_ENABLE_EXPENSIVE_CHECKS=${{ matrix.enable_expensive_checks }} \
            -DRJ_SANITIZER_RUNTIME=${{ matrix.sanitizer_runtime }}

          # Set a conservative number of workers to avoid OOM and excessive system load.
          WORKERS="$(( ($(nproc) + 1) / 2 ))"
          cmake --build "${ROCJITSU_BUILD_DIR}" -j "${WORKERS}"

          CTEST_SELECTION=()
          if [[ -n "${TEST_REGEX}" ]]; then
            CTEST_SELECTION=(-R "${TEST_REGEX}")
          fi
          ctest --test-dir "${ROCJITSU_BUILD_DIR}" \
            "${CTEST_SELECTION[@]}" \
            -E "${EXCLUDED_TESTS}" \
            --output-on-failure \
            -j "${WORKERS}"

          echo "${ROCJITSU_BUILD_DIR}/tools/rocjitsu" >> "${GITHUB_PATH}"
          echo "CXXFLAGS=" >> "${GITHUB_ENV}"

      - name: Test static ASan launcher preload
        if: matrix.run_static_asan_launch
        working-directory: ${{ env.ROCJITSU_SOURCE_DIR }}
        shell: bash
        run: |
          STATIC_ASAN_BUILD_DIR="${ROCJITSU_BUILD_DIR}-asan-static-launch-preload"
          CXXFLAGS="-Wno-error=unknown-warning-option -Wno-error=nested-anon-types"
          ROCM_PATH="$(rocm-sdk path --root)" \
            cmake -B "${STATIC_ASAN_BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS}" \
            -DRJ_ENABLE_ASAN=1 \
            -DRJ_ENABLE_UBSAN=0 \
            -DRJ_ENABLE_TSAN=0 \
            -DRJ_ENABLE_EXPENSIVE_CHECKS=0 \
            -DRJ_SANITIZER_RUNTIME=STATIC

          cmake --build "${STATIC_ASAN_BUILD_DIR}" \
            --target launch_preload_test
          ctest --test-dir "${STATIC_ASAN_BUILD_DIR}" \
            -R '^LaunchPreloadTest\.' \
            --output-on-failure

      - name: Install corpus test dependencies
        if: matrix.run_simulator_corpus
        working-directory: ${{ env.ROCJITSU_CORPUS_DIR }}
        shell: bash
        run: |
          uv pip install --system -r requirements.txt
          ROCM_SDK_DEVICE_PACKAGES=()
          for gfx in ${ROCM_SDK_DEVICE_GFX_GROUP}; do
            ROCM_SDK_DEVICE_PACKAGES+=(
              "rocm-sdk-device-${gfx}==${ROCM_SDK_VERSION}"
            )
          done
          uv pip install --system --prerelease allow \
            --index-url https://rocm.nightlies.amd.com/whl-multi-arch/ \
            "${ROCM_SDK_DEVICE_PACKAGES[@]}"
          rocm-sdk init

      - name: Run amdisa tests
        if: matrix.name == 'release'
        working-directory: ${{ env.ROCJITSU_SOURCE_DIR }}
        run: |
          uv pip install --system -e lib/python
          python -m pytest lib/python/amdisa/tests

      - name: Run corpus tests
        if: matrix.run_simulator_corpus
        # Clean runs on this change completed in 4-13 minutes. The sanitizer
        # rerun budget is capped at 20 minutes within this step-level failsafe.
        timeout-minutes: 60
        working-directory: ${{ env.ROCJITSU_CORPUS_DIR }}
        shell: bash
        env:
          ROCJITSU_ROOT: ${{ env.ROCJITSU_SOURCE_DIR }}
          ROCJITSU_BUILD: ${{ env.ROCJITSU_BUILD_DIR }}
        run: |

          ROCM_PATH="$(rocm-sdk path --root)"
          export ROCM_PATH
          export ROCJITSU_SOURCE_DIR

          corpus_test_status=0

          WORKERS="$(nproc)"
          if (( WORKERS > 16 )); then
            WORKERS=16
          fi
          corpus_test_flags=(
            --workers "${WORKERS}"
            --soft-timeout ${{ matrix.corpus_soft_timeout }}
            --hard-timeout ${{ matrix.corpus_hard_timeout }}
            --rerun-timeout ${{ matrix.corpus_rerun_timeout }}
            --sanitizer ${{ matrix.corpus_sanitizer }}
            --rerun-failed
            --warn-perf
          )
          bash "${ROCJITSU_SOURCE_DIR}/tests/corpus/run-corpus-tests.sh" "${corpus_test_flags[@]}" || corpus_test_status=$?
          exit "${corpus_test_status}"

      - name: Upload simulator corpus diagnostics
        if: ${{ always() && matrix.run_simulator_corpus }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rocjitsu-corpus-diagnostics-${{ matrix.name }}
          path: ${{ env.ROCJITSU_CORPUS_DIR }}/.pytest-artifacts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Compare plain and translated gfx1250 simulator runs
        if: ${{ !cancelled() && matrix.name == 'release' && steps.build_rocjitsu.outcome == 'success' }}
        timeout-minutes: 45
        working-directory: ${{ env.ROCJITSU_CORPUS_DIR }}
        shell: bash
        env:
          ROCJITSU_SEMANTIC_TIMEOUT_SECONDS: 120
        run: |
          ROCM_PATH="$(rocm-sdk path --root)"
          export ROCM_PATH
          LAUNCHER="${ROCJITSU_BUILD_DIR}/tools/rocjitsu/rocjitsu"
          B0_CONFIG="${ROCJITSU_SOURCE_DIR}/configs/gfx1250_mi455x.json"
          A0_CONFIG="${RUNNER_TEMP}/gfx1250_mi455x_a0.json"
          jq '.vm.gpu.device.revision_id = 0' "${B0_CONFIG}" > "${A0_CONFIG}"
          HOTSWAP="${ROCJITSU_BUILD_DIR}/lib/rocjitsu/src/rocjitsu/hooks/libhsa_hotswap_rocjitsu.so"
          test -f "${HOTSWAP}"
          # Stop ROCr loading the hook itself in both legs. Load the branch-built
          # hook explicitly so the candidate leg qualifies this checkout. Keep
          # every env option before the shared NAME=VALUE assignment.
          COMMON_UNSETS="-u LD_PRELOAD"
          COMMON_HOTSWAP_ENV="HSA_HOTSWAP_DISABLE=1"
          PLAIN_WRAPPER="env ${COMMON_UNSETS} -u HSA_TOOLS_LIB -u HSA_TOOLS_DISABLE_REGISTER -u HSA_HOTSWAP_VERBOSE ${COMMON_HOTSWAP_ENV} ${LAUNCHER} --config ${B0_CONFIG} --"
          TRANSLATED_WRAPPER="env ${COMMON_UNSETS} ${COMMON_HOTSWAP_ENV} HSA_TOOLS_DISABLE_REGISTER=1 HSA_TOOLS_LIB=${HOTSWAP} HSA_HOTSWAP_VERBOSE=1 ${LAUNCHER} --config ${A0_CONFIG} --"

          python3 "${ROCJITSU_SOURCE_DIR}/tests/corpus/test-validate-gfx1250-semantic-translations.py"

          python3 -m pytest tests/test_corpus.py \
            --target gfx1250 \
            --suite semantics \
            --run-tests-config "${ROCJITSU_SOURCE_DIR}/tests/corpus/gfx1250_b0_a0_semantic_tests.json" \
            --run-wrapper "${PLAIN_WRAPPER}" \
            --comparison-run-wrapper "${TRANSLATED_WRAPPER}" \
            --comparison-required-stderr "[hsa-hotswap-rj] eager translation " \
            --comparison-required-stderr "outcome=translated" \
            --comparison-required-stderr "translation_status=0 status=0" \
            --artifact-directory .pytest-artifacts/gfx1250-semantic-qualification \
            --timeout "${ROCJITSU_SEMANTIC_TIMEOUT_SECONDS}" \
            -q \
            --tb=short

          python3 "${ROCJITSU_SOURCE_DIR}/tests/corpus/validate-gfx1250-semantic-translations.py" \
            --translator "${ROCJITSU_BUILD_DIR}/tools/rj_dbt_translate" \
            --selection "${ROCJITSU_SOURCE_DIR}/tests/corpus/gfx1250_b0_a0_semantic_tests.json" \
            --expectations "${ROCJITSU_SOURCE_DIR}/tests/corpus/gfx1250_b0_a0_semantic_rewrites.json" \
            --artifact-directory .pytest-artifacts/gfx1250-semantic-qualification \
            --expected-runtime-translations 2

      - name: Upload gfx1250 semantic qualification logs
        if: ${{ always() && matrix.name == 'release' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gfx1250-semantic-qualification-${{ matrix.name }}
          path: |
            ${{ env.ROCJITSU_CORPUS_DIR }}/.pytest-artifacts/gfx1250-semantic-qualification/**/logs
            ${{ env.ROCJITSU_CORPUS_DIR }}/.pytest-artifacts/gfx1250-semantic-qualification/translation-diffs
          if-no-files-found: ignore
          retention-days: 7

      - name: Extract pinned gfx1250 packaged HSACOs
        id: extract_dbt
        if: ${{ !cancelled() && matrix.run_simulator_corpus && steps.build_rocjitsu.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: ${{ env.ROCJITSU_CORPUS_DIR }}
        shell: bash
        run: |
          uv venv --python 3.12 "${ROCJITSU_DBT_VENV}"
          uv pip install \
            --python "${ROCJITSU_DBT_VENV}/bin/python" \
            "pytest>=5.4.1" \
            "pytest-xdist>=1.32.0"
          uv pip install \
            --python "${ROCJITSU_DBT_VENV}/bin/python" \
            --prerelease allow \
            -r "${ROCJITSU_SOURCE_DIR}/tests/corpus/dbt/requirements-gfx1250-dbt.txt"
          "${ROCJITSU_DBT_VENV}/bin/rocm-sdk" init

          DBT_ROCM_PATH="$("${ROCJITSU_DBT_VENV}/bin/rocm-sdk" path --root)"
          LD_LIBRARY_PATH="${DBT_ROCM_PATH}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
            "${ROCJITSU_DBT_VENV}/bin/python" \
            scripts/extract_gfx1250_hsacos.py \
            --environment "${ROCJITSU_DBT_VENV}" \
            --destination "${ROCJITSU_HSACO_CORPUS}"

      - name: Run gfx1250 DBT corpus tests
        id: run_dbt
        if: ${{ !cancelled() && matrix.run_simulator_corpus && steps.extract_dbt.outcome == 'success' }}
        timeout-minutes: ${{ matrix.dbt_job_timeout }}
        working-directory: ${{ env.ROCJITSU_CORPUS_DIR }}
        shell: bash
        run: |
          DBT_ROCM_PATH="$("${ROCJITSU_DBT_VENV}/bin/rocm-sdk" path --root)"
          DBT_TRANSLATOR_BINARY="${ROCJITSU_BUILD_DIR}/tools/rj_dbt_translate"
          DBT_TRANSLATOR="${DBT_TRANSLATOR_BINARY}"
          if [[ "${{ matrix.verify_dbt_idempotence }}" == "1" ]]; then
            DBT_TRANSLATOR="${RUNNER_TEMP}/rj_dbt_translate-verify-idempotence"
            printf '#!/usr/bin/env bash\nexec %q --verify-idempotence --verify-rewrite-discharge "$@"\n' \
              "${DBT_TRANSLATOR_BINARY}" \
              > "${DBT_TRANSLATOR}"
            chmod +x "${DBT_TRANSLATOR}"
          fi
          DBT_WORKERS="$(nproc)"
          if (( DBT_WORKERS > 16 )); then
            DBT_WORKERS=16
          fi
          "${ROCJITSU_DBT_VENV}/bin/python" -m pytest tests/test_corpus.py \
            --target gfx1250 \
            --suite dbt \
            --dbt-corpus "${ROCJITSU_HSACO_CORPUS}" \
            --dbt-translator "${DBT_TRANSLATOR}" \
            --dbt-llvm-objdump "${DBT_ROCM_PATH}/lib/llvm/bin/llvm-objdump" \
            --dbt-package-lock "${ROCJITSU_SOURCE_DIR}/tests/corpus/dbt/gfx1250_20260812_package_lock.json" \
            --dbt-expected-failures "${ROCJITSU_SOURCE_DIR}/tests/corpus/dbt/gfx1250_b0_a0_expected_failures.json" \
            --dbt-expected-rewrites "${ROCJITSU_SOURCE_DIR}/tests/corpus/dbt/gfx1250_b0_a0_expected_rewrites.json" \
            --dbt-allow-incomplete-corpus \
            --dbt-timeout "${{ matrix.dbt_timeout }}" \
            --dbt-memory-limit-mib "${{ matrix.dbt_memory_limit_mib }}" \
            --artifact-directory .pytest-artifacts/gfx1250-dbt \
            -n "${DBT_WORKERS}" \
            --durations=0 \
            -q \
            -rxX \
            --tb=short

      - name: Collect gfx1250 B0-to-A0 SHA pairs
        id: collect_dbt_sha_pairs
        if: >-
          matrix.name == 'release' &&
          steps.run_dbt.outcome == 'success' &&
          (github.event_name == 'pull_request' ||
           (github.ref == 'refs/heads/develop' &&
            (github.event_name == 'push' ||
             (github.event_name == 'workflow_dispatch' &&
              github.event.inputs.corpus_repository == 'ROCm/rocjitsu-test-corpus' &&
              github.event.inputs.corpus_ref == env.ROCJITSU_DBT_CORPUS_REF))))
        timeout-minutes: 15
        working-directory: ${{ env.ROCJITSU_CORPUS_DIR }}
        shell: bash
        run: |
          DBT_WORKERS="$(nproc)"
          if (( DBT_WORKERS > 16 )); then
            DBT_WORKERS=16
          fi
          python3 \
            "${ROCJITSU_SOURCE_DIR}/tests/corpus/record-gfx1250-dbt-sha-pairs.py" \
            collect \
            --translator "${ROCJITSU_BUILD_DIR}/tools/rj_dbt_translate" \
            --corpus "${ROCJITSU_HSACO_CORPUS}" \
            --input-manifest "${ROCJITSU_HSACO_CORPUS}/manifests/SHA256SUMS" \
            --expected-failures "${ROCJITSU_SOURCE_DIR}/tests/corpus/dbt/gfx1250_b0_a0_expected_failures.json" \
            --fragments "${ROCJITSU_DBT_SHA_FRAGMENTS}" \
            --workers "${DBT_WORKERS}" \
            --timeout "${{ matrix.dbt_timeout }}"

      - name: Finalize gfx1250 B0-to-A0 SHA pairs
        id: finalize_dbt_sha_pairs
        if: matrix.name == 'release' && steps.collect_dbt_sha_pairs.outcome == 'success'
        timeout-minutes: 2
        working-directory: ${{ env.ROCJITSU_CORPUS_DIR }}
        shell: bash
        run: |
          python3 \
            "${ROCJITSU_SOURCE_DIR}/tests/corpus/record-gfx1250-dbt-sha-pairs.py" \
            finalize \
            --fragments "${ROCJITSU_DBT_SHA_FRAGMENTS}" \
            --output "${ROCJITSU_DBT_SHA_MANIFEST}" \
            --input-manifest "${ROCJITSU_HSACO_CORPUS}/manifests/SHA256SUMS" \
            --expected-failures "${ROCJITSU_SOURCE_DIR}/tests/corpus/dbt/gfx1250_b0_a0_expected_failures.json" \
            --expected-rewrites "${ROCJITSU_SOURCE_DIR}/tests/corpus/dbt/gfx1250_b0_a0_expected_rewrites.json" \
            --package-lock "${ROCJITSU_SOURCE_DIR}/tests/corpus/dbt/gfx1250_20260812_package_lock.json" \
            --source-commit "${GITHUB_SHA}" \
            --corpus-commit "$(git rev-parse HEAD)" \
            --rocm-sdk-version "${ROCM_SDK_VERSION}"

      - name: Upload develop gfx1250 B0-to-A0 SHA pairs
        if: >-
          matrix.name == 'release' &&
          steps.finalize_dbt_sha_pairs.outcome == 'success' &&
          github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gfx1250-b0-a0-sha-pairs
          path: ${{ env.ROCJITSU_DBT_SHA_MANIFEST }}
          if-no-files-found: error
          retention-days: 45

      # PR jobs intentionally have no write token. They publish only data here;
      # the trusted workflow_run job downloads it and maintains the PR comment.
      - name: Upload PR gfx1250 B0-to-A0 SHA pairs
        if: >-
          matrix.name == 'release' &&
          steps.finalize_dbt_sha_pairs.outcome == 'success' &&
          github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gfx1250-b0-a0-sha-pairs-candidate
          path: ${{ env.ROCJITSU_DBT_SHA_MANIFEST }}
          if-no-files-found: error
          retention-days: 7

      # Debugging aid only. The pinned extraction is reproducible, so retain
      # translator logs but never upload the extracted HSACOs.
      - name: Upload gfx1250 DBT diagnostic logs
        if: always() && matrix.run_simulator_corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gfx1250-dbt-logs-${{ matrix.name }}
          path: ${{ env.ROCJITSU_CORPUS_DIR }}/.pytest-artifacts/gfx1250-dbt
          if-no-files-found: ignore
          retention-days: 7
