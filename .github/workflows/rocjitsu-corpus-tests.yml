# Pytest corpus checks for emulation/rocjitsu/.
#
# Fast smoke tests for rocjitsu. This is likely going to be added to TheRock
# tests, but it is currently a stopgap solution. It allows developers to
# quickly check that their changes to rocjitsu didn't break gfx1250 emulation.
name: "rocjitsu-test-corpus"

on:
  pull_request:
    paths:
      - "emulation/rocjitsu/**"
      - ".github/workflows/rocjitsu-*.yml"
  push:
    branches:
      - main
    paths:
      - "emulation/rocjitsu/**"
      - ".github/workflows/rocjitsu-*.yml"
  workflow_dispatch:
    inputs:
      corpus_repository:
        description: "Repository containing the rocjitsu pytest corpus"
        default: "ROCm/rocjitsu-test-corpus"
        required: true
      corpus_ref:
        description: "Branch, tag, or SHA to check out from the corpus repository"
        # Last updated on 2026/06/23.
        default: "34a1241bb374307d24c5aee93c9fbd2279c1b04b"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ROCJITSU_SOURCE_DIR: ${{ github.workspace }}/rocm-systems/emulation/rocjitsu
  ROCJITSU_BUILD_DIR: ${{ github.workspace }}/build
  ROCJITSU_CORPUS_DIR: ${{ github.workspace }}/rocjitsu-test-corpus

jobs:
  test:
    runs-on: azure-linux-scale-rocm
    name: test (${{ matrix.name }})
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --user 0:0
      env:
        DEBIAN_FRONTEND: noninteractive
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: Release
            enable_asan: 0
            enable_ubsan: 0
            enable_tsan: 0
            enable_msan: 0
          - name: asan-ubsan
            build_type: RelWithDebInfo
            enable_asan: 1
            enable_ubsan: 1
            enable_tsan: 0
            enable_msan: 0

    steps:
      - name: Checkout rocjitsu actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: |
            emulation/rocjitsu/actions

      - name: Run rocjitsu corpus tests
        uses: ./emulation/rocjitsu/actions/rocjitsu-corpus-tests
        with:
          matrix-name: ${{ matrix.name }}
          build-type: ${{ matrix.build_type }}
          enable-asan: ${{ matrix.enable_asan }}
          enable-ubsan: ${{ matrix.enable_ubsan }}
          enable-tsan: ${{ matrix.enable_tsan }}
          enable-msan: ${{ matrix.enable_msan }}
          corpus-repository: ${{ github.event.inputs.corpus_repository || 'ROCm/rocjitsu-test-corpus' }}
          # Last updated on 2026/06/23.
          corpus-ref: ${{ github.event.inputs.corpus_ref || '34a1241bb374307d24c5aee93c9fbd2279c1b04b' }}
