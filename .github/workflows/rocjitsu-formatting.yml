# Formatting checks for the emulation/ subtrees.
name: "rocjitsu-formatting"

on:
  pull_request:
    # NOTE: Only files under these paths trigger CI formatting checks.
    # We should incrementally add more paths here as projects adopt
    # pre-commit.
    # This job is named `pre-commit`, which is the one entry in
    # `checks.required_check_runs` in tools/systems_pr_bot/policy.yml, so a
    # path that is missing here leaves therock-pr-bot waiting out its timeout
    # on a check run that is never created.
    paths:
      - "emulation/mirage/**"
      - "emulation/rocjitsu/**"
      - ".github/scripts/collect_rocjitsu_afl_results.py"
      - ".github/scripts/rocjitsu_fuzz_report.js"
      - ".github/scripts/run_rocjitsu_afl_campaign.py"
      - ".github/scripts/tests/test_collect_rocjitsu_afl_results.py"
      - ".github/scripts/tests/test_rocjitsu_fuzz_report.js"
      - ".github/scripts/tests/test_run_rocjitsu_afl_campaign.py"
      - ".github/workflows/rocjitsu-*.yml"
      - ".pre-commit-config.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Sparse checkout controls which files are on disk, and therefore
          # which files pre-commit can check. To add a new project to this
          # CI job, add its path here. That's the only change needed.
          sparse-checkout: |
            emulation/mirage
            emulation/rocjitsu
            .github

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pre-commit

      - name: Run pre-commit on changed files
        run: |
          # Find the common ancestor between the PR base and head.
          MERGE_BASE=$(git merge-base ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})

          # List files that were added, copied, modified, or renamed in
          # the PR, then keep only those present on disk. HEAD is the
          # pull-request merge commit in GitHub Actions, so diff against
          # the PR head SHA directly to avoid checking files that changed
          # only on the target branch.
          FILES=$(git diff --name-only --diff-filter=ACMR "$MERGE_BASE" ${{ github.event.pull_request.head.sha }} \
            | while IFS= read -r f; do if [ -f "$f" ]; then echo "$f"; fi; done)

          if [ -z "$FILES" ]; then
            echo "No checked-in files changed in sparse checkout, skipping."
            exit 0
          fi

          echo "Checking files:"
          echo "$FILES"
          pre-commit run --files $FILES
