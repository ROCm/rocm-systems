# Formatting checks for the emulation/ subtrees.
name: "rocjitsu-formatting"

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      # Fetch commit/tree history without checking out the source or submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: .github/actions/scoped-formatting

      - uses: ./.github/actions/scoped-formatting
        with:
          include: '^(emulation/(mirage|rocjitsu)/|\.github/workflows/rocjitsu-[^/]*\.yml\Z|\.pre-commit-config\.yaml\Z)'
          sparse-checkout: |
            emulation/mirage
            emulation/rocjitsu
            .github
