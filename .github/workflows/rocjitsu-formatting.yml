# Formatting checks for the emulation/ subtrees.
name: "rocjitsu-formatting"

on:
  pull_request:
    # NOTE: Only files under these paths trigger CI formatting checks.
    # Other shared files (e.g. .github/scripts/) are not covered — run
    # `pre-commit run --all-files` locally to catch issues outside this
    # scope. We should incrementally add more paths here as projects
    # adopt pre-commit.
    # This job is named `pre-commit`, which is the one entry in
    # `checks.required_check_runs` in tools/systems_pr_bot/policy.yml, so a
    # path that is missing here leaves therock-pr-bot waiting out its timeout
    # on a check run that is never created.
    paths:
      - "emulation/mirage/**"
      - "emulation/rocjitsu/**"
      - ".github/workflows/rocjitsu-*.yml"
      - ".github/scripts/test-rocjitsu-formatting.py"
      - ".pre-commit-config.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Sparse checkout controls which files are on disk, and therefore
          # which files pre-commit can check. Keep the full-subtree scan below
          # aligned with this list when adding a gated component.
          sparse-checkout: |
            emulation/mirage
            emulation/rocjitsu
            .github

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pre-commit

      - name: Test formatting file selection
        run: python3 .github/scripts/test-rocjitsu-formatting.py

      - name: Run pre-commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          # HEAD can be GitHub's merge commit; use the PR head for the diff.
          head = os.environ["HEAD_SHA"]
          base = subprocess.check_output(
              ["git", "merge-base", os.environ["BASE_SHA"], head], text=True
          ).strip()
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", "-z", base, head]
          )
          files = {os.fsdecode(path) for path in changed.split(b"\0") if path}
          if files & {".pre-commit-config.yaml", ".github/workflows/rocjitsu-formatting.yml"}:
              tracked = subprocess.check_output([
                  "git", "ls-files", "-z", "--", "emulation/mirage/", "emulation/rocjitsu/"
              ])
              files.update(os.fsdecode(path) for path in tracked.split(b"\0") if path)

          files = sorted(path for path in files if Path(path).is_file())
          if files:
              print(f"Checking {len(files)} files", flush=True)
              raise SystemExit(subprocess.run(["pre-commit", "run", "--files", *files]).returncode)
          print("No checked-in files to check in sparse checkout, skipping.")
          PY

      - name: Install Rust formatter
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --no-self-update

      - name: Check Mirage Rust formatting
        working-directory: emulation/mirage
        run: cargo +1.88.0 fmt --all -- --check
