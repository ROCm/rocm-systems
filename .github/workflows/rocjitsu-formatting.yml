# Formatting checks for emulation/rocjitsu/.
name: "rocjitsu-formatting"

on:
  pull_request:
    # NOTE: Only files under these paths trigger CI formatting checks.
    # Shared files (e.g. .github/scripts/) are not covered — run
    # `pre-commit run --all-files` locally to catch issues outside this
    # scope. We should incrementally add more paths here as projects
    # adopt pre-commit.
    paths:
      - "emulation/rocjitsu/**"
      - ".github/workflows/rocjitsu-*.yml"
      - ".pre-commit-config.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          # Sparse checkout controls which files are on disk, and therefore
          # which files pre-commit can check. To add a new project to this
          # CI job, add its path here. That's the only change needed.
          sparse-checkout: |
            emulation/rocjitsu
            .github

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - run: pip install pre-commit

      - name: Run pre-commit on changed files
        run: |
          # Find the common ancestor between the PR base and head.
          MERGE_BASE=$(git merge-base ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})

          # List files that were added, copied, modified, or renamed in
          # the PR, then keep only those present on disk. HEAD is the
          # pull-request merge commit in GitHub Actions, so diff against
          # the PR head SHA directly to avoid checking files that changed
          # only on the target branch.
          FILES=$(git diff --name-only --diff-filter=ACMR "$MERGE_BASE" ${{ github.event.pull_request.head.sha }} \
            | while IFS= read -r f; do if [ -f "$f" ]; then echo "$f"; fi; done)

          if [ -z "$FILES" ]; then
            echo "No checked-in files changed in sparse checkout, skipping."
            exit 0
          fi

          echo "Checking files:"
          echo "$FILES"
          pre-commit run --files $FILES

  # Clippy is a lint, not a formatter, so it is its own job: it needs the
  # workspace to compile, which pre-commit's per-file model cannot express.
  # The same check runs as a ctest case, but that suite needs a full C++
  # build, and a lint should not wait on one.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # None of the three paths beside `cli` is optional. The
          # workspace reads all of them while compiling, so without one
          # cargo fails before clippy is reached and the job reports a
          # build script or a missing include rather than a lint.
          #
          #   configs   builtin/build.rs reads the rocjitsu presets
          #   schemas   core/build.rs reads simulation_config.fbs
          #   lib/…/include  rocjitsu_sys `include_str!`s rj_status.h to
          #                  check its status codes against the C header,
          #                  and `--all-targets` compiles that test
          #
          # Anything under cli/ that reaches outside it at build time --
          # a build script, an `include_str!` -- belongs in this list too.
          sparse-checkout: |
            emulation/rocjitsu/cli
            emulation/rocjitsu/configs
            emulation/rocjitsu/schemas
            emulation/rocjitsu/lib/rocjitsu/include

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: emulation/rocjitsu/cli

      - name: cargo clippy
        working-directory: emulation/rocjitsu/cli
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
