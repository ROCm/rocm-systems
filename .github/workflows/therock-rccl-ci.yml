name: TheRock CI for rccl

on:
  schedule:
    - cron: '17 6 * * *'    # Nightly 06:17 UTC (smoke)
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Reuse artifacts from a previous run ID (skips build)'
        type: string
        default: ''
      candidate_sha:
        description: 'Exact 40-character source SHA for artifact_run_id (required when reusing artifacts)'
        type: string
        default: ''
      test_scope:
        description: 'smoke (22 curated tests, ~3min) or all'
        type: string
        default: 'smoke'
      test_suites:
        description: 'auto, or comma-separated: single-node,rocprof,pytorch,jax,madengine,accl-profiler'
        type: string
        default: 'auto'
      notify_email:
        description: 'Email address to send test summary report'
        type: string
        default: 'collectives-ci@amd.com'
      notify_webhook:
        description: 'Teams webhook URL for test summary notifications'
        type: string
        default: ''
      madengine_nodes:
        description: 'Number of SLURM nodes for MADEngine workloads'
        type: string
        default: '2'
      accl_profiler_nodes:
        description: 'Number of SLURM nodes for the ACCL profiler sweep'
        type: string
        default: '2'

permissions:
  actions: read
  contents: read

concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit). The workflow name is prepended to avoid conflicts between
  # different workflows.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      run_linux_ci: ${{ steps.plan.outputs.run_linux_ci }}
      test_scope: ${{ steps.plan.outputs.test_scope }}
      amdgpu_families: ${{ steps.plan.outputs.amdgpu_families }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}

    steps:
      - name: "Checking out repository"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # We need the parent commit to do a diff
          fetch-depth: 2

      - name: Resolve immutable RCCL candidate
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          CANDIDATE_SHA_OVERRIDE: ${{ inputs.candidate_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          candidate_sha="$(
            python3 projects/rccl/ci/scripts/candidate_provenance.py resolve \
              --event-name "$EVENT_NAME" \
              --github-ref "$GITHUB_REF_VALUE" \
              --github-sha "$GITHUB_SHA_VALUE" \
              --candidate-sha "$CANDIDATE_SHA_OVERRIDE" \
              --artifact-run-id "$ARTIFACT_RUN_ID"
          )"
          echo "sha=${candidate_sha}" >> "$GITHUB_OUTPUT"
          echo "Candidate source SHA: ${candidate_sha}"

      - name: Plan RCCL CI
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TEST_SCOPE: ${{ inputs.test_scope || 'smoke' }}
          INPUT_TEST_SUITES: ${{ inputs.test_suites || 'auto' }}
        run: |
          python3 projects/rccl/ci/scripts/plan_rccl_ci.py \
            --event-name "$EVENT_NAME" \
            --test-scope "$INPUT_TEST_SCOPE" \
            --test-suites "$INPUT_TEST_SUITES"

  therock-ci-linux:
    name: TheRock CI Linux
    needs: setup
    if: ${{ needs.setup.outputs.run_linux_ci == 'true' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        amdgpu_family: ${{ fromJSON(needs.setup.outputs.amdgpu_families) }}
    uses: ./.github/workflows/therock-rccl-ci-linux.yml
    secrets:
      RCCL_CI_TEAMS_WEBHOOK: ${{ secrets.RCCL_CI_TEAMS_WEBHOOK }}
    with:
      amdgpu_families: ${{ matrix.amdgpu_family }}
      artifact_group: ${{ matrix.amdgpu_family }}
      event_name: ${{ github.event_name }}
      package_version: ADHOCBUILD
      artifact_run_id: ${{ inputs.artifact_run_id }}
      candidate_sha: ${{ needs.setup.outputs.candidate_sha }}
      test_scope: ${{ needs.setup.outputs.test_scope }}
      test_suites: ${{ inputs.test_suites || 'auto' }}
      notify_email: ${{ inputs.notify_email || 'collectives-ci@amd.com' }}
      notify_webhook: ${{ inputs.notify_webhook }}
      madengine_nodes: ${{ inputs.madengine_nodes || '2' }}
      accl_profiler_nodes: ${{ inputs.accl_profiler_nodes || '2' }}
      cmake_options: >
        -DTHEROCK_ENABLE_ALL=OFF
        -DTHEROCK_BUILD_TESTING=ON
        -DTHEROCK_BUNDLE_SYSDEPS=ON
        -DTHEROCK_ENABLE_COMM_LIBS=ON
        -DTHEROCK_ENABLE_ROCPROFV3=ON
        -DTHEROCK_ENABLE_MPI=ON

  therock_ci_summary:
    name: TheRock CI Summary
    if: always()
    needs:
      - setup
      - therock-ci-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Output failed jobs
        run: |
          echo '${{ toJson(needs) }}'
          FAILED_JOBS="$(echo '${{ toJson(needs) }}' \
            | jq --raw-output \
            'map_values(select(.result!="success" and .result!="skipped")) | keys | join(",")' \
          )"
          if [[ "${FAILED_JOBS}" != "" ]]; then
            echo "The following jobs failed: ${FAILED_JOBS}"
            exit 1
          fi
