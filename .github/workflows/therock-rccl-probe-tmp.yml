name: Probe SLURM docker bind mount visibility

# Diagnostic only. Answers one question: when a SLURM task creates a directory
# under /tmp, does the docker daemon on that node see it through `-v`?

on:
  workflow_dispatch:
    inputs:
      test_runs_on:
        type: string
        default: 'ruby-linux-slurm-scale-runner'
      nodes:
        type: string
        default: '2'

permissions:
  contents: read

jobs:
  probe:
    name: 'Probe /tmp visibility'
    runs-on: ${{ inputs.test_runs_on }}
    steps:
      - name: Probe
        shell: bash
        run: |
          set -uo pipefail
          cat > probe_task.sh <<'TASK'
          #!/bin/bash
          echo "=============================================================="
          echo "node=$(hostname) procid=${SLURM_PROCID:-?} job=${SLURM_JOB_ID:-?}"
          echo "=============================================================="

          echo "--- slurm private tmp ---"
          echo "SLURM_TMPDIR=${SLURM_TMPDIR:-<unset>}"
          scontrol show config 2>/dev/null | grep -i -E "JobContainerType|TmpFS" || true
          ls -d /etc/slurm/job_container.conf 2>/dev/null || echo "no job_container.conf"

          echo "--- mount namespaces ---"
          echo "task  mnt ns: $(readlink /proc/self/ns/mnt)"
          dpid=$(pgrep -x dockerd | head -1)
          if [ -n "$dpid" ]; then
            echo "dockerd pid: $dpid"
            echo "dockerd mnt ns: $(readlink /proc/$dpid/ns/mnt 2>/dev/null || echo '<denied>')"
          else
            echo "dockerd not visible from this task"
          fi
          systemctl show docker -p PrivateTmp 2>/dev/null || echo "PrivateTmp: <unknown>"

          echo "--- the actual test ---"
          PROBE=/tmp/probe_${SLURM_JOB_ID:-$$}_${SLURM_PROCID:-0}
          mkdir -p "$PROBE"
          echo "i-am-the-marker" > "$PROBE/marker.txt"
          echo "host sees: $(ls -A "$PROBE" | tr '\n' ' ')"

          IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null \
                | grep -v '<none>' | head -1)
          if [ -z "$IMG" ]; then
            echo "RESULT: INCONCLUSIVE - no local docker image to test with"
            exit 0
          fi
          echo "using image: $IMG"

          out=$(docker run --rm -v "$PROBE":/probe --entrypoint sh "$IMG" \
                  -c 'ls -A /probe; cat /probe/marker.txt 2>/dev/null' 2>&1)
          echo "container sees: $out"

          if echo "$out" | grep -q "i-am-the-marker"; then
            echo "RESULT: VISIBLE - daemon shares /tmp with the job"
          else
            echo "RESULT: NOT-VISIBLE - daemon resolves /tmp elsewhere (bind mount is empty)"
          fi

          echo "--- same test under \$SLURM_TMPDIR, if any ---"
          if [ -n "${SLURM_TMPDIR:-}" ] && [ -d "${SLURM_TMPDIR}" ]; then
            P2="${SLURM_TMPDIR}/probe_$$"
            mkdir -p "$P2" && echo "i-am-the-marker" > "$P2/marker.txt"
            out2=$(docker run --rm -v "$P2":/probe --entrypoint sh "$IMG" \
                     -c 'cat /probe/marker.txt 2>/dev/null' 2>&1)
            echo "container sees: $out2"
          else
            echo "SLURM_TMPDIR unset, skipped"
          fi
          TASK
          chmod +x probe_task.sh

          srun --partition=meta64 \
               --nodes="${{ inputs.nodes }}" \
               --ntasks="${{ inputs.nodes }}" \
               --ntasks-per-node=1 \
               --time=00:10:00 \
               --job-name=madengine-tmp-probe \
               --label \
               ./probe_task.sh
