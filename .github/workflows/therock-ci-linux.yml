name: TheRock CI Linux

on:
  workflow_call:
    inputs:
      cmake_options:
        type: string
      projects_to_test:
        type: string
      package_version:
        type: string
        required: true
      test_runs_on:
        type: string
        default: "linux-gfx942-1gpu-core42-ossci-rocm"


permissions:
  contents: read

jobs:
  therock-build-linux:
    name: Build Linux Packages
    runs-on: azure-linux-scale-rocm
    permissions:
      id-token: write
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:48492540591673fdc8d51beb89bde41e7ba13cbb528f643c0a481ba42c4058f2 # 2026-04-16
      options: -v /runner/config:/home/awsconfig/
    strategy:
      fail-fast: true
    env:
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      AMDGPU_FAMILIES: "gfx94X-dcgpu"
      TEATIME_FORCE_INTERACTIVE: 0
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
      # When "1", fetch the prebuilt amd-llvm/hipify/sysdeps artifacts that
      # TheRock CI already built for the pinned TheRock commit and reuse them
      # instead of recompiling/relinking the compiler on every run. This is a
      # best-effort optimization: if no compatible prebuilt artifacts are found
      # the build transparently falls back to building the compiler from source.
      THEROCK_USE_PREBUILT_COMPILER: "1"
      PREBUILT_ARTIFACTS_DIR: ${{ github.workspace }}/prebuilt-artifacts
    steps:
      - name: "Checking out repository for rocm-systems"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Checkout TheRock repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: "ROCm/TheRock"
          path: "TheRock"
          ref: 685f8c3b89006309b34a7c16de17e841400f0d76 # 2025-05-29 commit

      - name: Install python deps
        run: |
          pip install -r TheRock/requirements.txt

      # safe.directory must be set before Runner health status
      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      - name: Setup ccache
        run: |
          ./TheRock/build_tools/setup_ccache.py \
            --config-preset "github-oss-dev" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"

      - name: Runner health status
        run: |
          ./TheRock/build_tools/health_status.py

      # Reuse the prebuilt compiler toolchain (amd-llvm, hipify) and bundled
      # system dependencies (sysdeps) that TheRock CI already built for the
      # pinned TheRock commit, and -- when a selected test needs them -- the
      # math/ML libraries too. These do not change for a rocm-systems PR, their
      # multi-GB link/codegen steps are not cacheable by ccache, and reusing
      # them removes the largest fixed costs from the build. The rocm-systems
      # sources under test are always built locally. The lookup uses TheRock's
      # own commit so the prebuilt artifacts match the build infrastructure.
      # Everything is best-effort: if no compatible prebuilt artifacts are found
      # the build transparently falls back to building from source.
      - name: Resolve prebuilt artifacts
        id: prebuilt
        if: ${{ env.THEROCK_USE_PREBUILT_COMPILER == '1' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git config --global --add safe.directory "$(pwd)/TheRock" 2>/dev/null || true
          therock_commit="$(git -C TheRock rev-parse HEAD)"
          echo "Looking up prebuilt TheRock artifacts for ${therock_commit} (group ${AMDGPU_FAMILIES})"
          run_id="$(python TheRock/build_tools/find_artifacts_for_commit.py \
            --commit "${therock_commit}" \
            --repo ROCm/TheRock \
            --workflow multi_arch_ci.yml \
            --platform linux \
            --artifact-group "${AMDGPU_FAMILIES}" 2>/dev/null \
            | awk '/Workflow run ID:/ {print $NF; exit}' || true)"
          if [ -z "${run_id}" ]; then
            echo "No compatible prebuilt artifacts found; building from source."
          else
            echo "Found prebuilt artifacts in TheRock run ${run_id}."
          fi
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Fetch and bootstrap prebuilt artifacts
        id: prebuilt_boot
        if: ${{ env.THEROCK_USE_PREBUILT_COMPILER == '1' && steps.prebuilt.outputs.run_id != '' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMAKE_OPTIONS: ${{ inputs.cmake_options }}
        run: |
          set -euo pipefail
          rm -rf "${PREBUILT_ARTIFACTS_DIR}"
          # The compiler toolchain and sysdeps are always reused: they never
          # depend on rocm-systems sources, so they are always ABI-compatible.
          patterns=(amd-llvm hipify sysdeps)
          # Artifact-name prefixes for the math-libs / ml-libs artifact groups in
          # TheRock's BUILD_TOPOLOGY.toml. Keep in sync if those groups change.
          math_lib_patterns=(^blas_ ^rand_ ^fft_ ^prim_ ^sparse_ ^solver_ ^rocwmma_ ^libhipcxx_ ^support_)
          ml_lib_patterns=(^composable-kernel_ ^miopen_ ^hipdnn_ ^hipdnn-integration-tests_ ^miopenprovider_ ^hipblasltprovider_ ^hipdnn-samples_ ^hipkernelprovider_)
          prebuilt_math_ml=""
          # Reuse math/ML libraries as prebuilt only when a selected test needs
          # them (THEROCK_ENABLE_MATH_LIBS/ML_LIBS, set by therock_configure_ci.py).
          # NOTE: prebuilt math/ML libs are built against TheRock's pinned
          # rocm-systems, so this trades a small ABI risk for speed. A full
          # THEROCK_ENABLE_ALL=ON build (CI infra / unknown-path / nightly)
          # intentionally keeps building them from source for maximum coverage.
          case "${CMAKE_OPTIONS}" in
            *THEROCK_ENABLE_ALL=ON*) ;;
            *THEROCK_ENABLE_ML_LIBS=ON*)
              patterns+=("${math_lib_patterns[@]}" "${ml_lib_patterns[@]}")
              prebuilt_math_ml="true"
              ;;
            *THEROCK_ENABLE_MATH_LIBS=ON*)
              patterns+=("${math_lib_patterns[@]}")
              prebuilt_math_ml="true"
              ;;
          esac
          python TheRock/build_tools/fetch_artifacts.py \
            --run-id "${{ steps.prebuilt.outputs.run_id }}" \
            --run-github-repo ROCm/TheRock \
            --platform linux \
            --artifact-group "${AMDGPU_FAMILIES}" \
            --output-dir "${PREBUILT_ARTIFACTS_DIR}" \
            "${patterns[@]}"
          # Mark the fetched artifacts as prebuilt so CMake skips building them.
          # This writes stage/ trees and .prebuilt markers into the build dir and
          # must run before `cmake` configures the project.
          python TheRock/build_tools/buildctl.py bootstrap \
            --build-dir TheRock/build \
            --artifact-dir "${PREBUILT_ARTIFACTS_DIR}" \
            --target-families "${AMDGPU_FAMILIES}"
          # Report what was actually fetched (a partial/expired prebuilt run may
          # be missing artifacts). Anything not actually present must still have
          # its source fetched and be built locally, so only claim a component as
          # prebuilt when its artifacts are on disk.
          compiler_prebuilt=""
          if ls "${PREBUILT_ARTIFACTS_DIR}"/amd-llvm_* >/dev/null 2>&1; then
            compiler_prebuilt="true"
          fi
          if [ -n "${prebuilt_math_ml}" ] && ! ls "${PREBUILT_ARTIFACTS_DIR}"/blas_* >/dev/null 2>&1; then
            echo "WARNING: math/ML libraries requested but absent from the prebuilt run; building them from source."
            prebuilt_math_ml=""
          fi
          echo "compiler=${compiler_prebuilt}" >> "${GITHUB_OUTPUT}"
          echo "math_ml=${prebuilt_math_ml}" >> "${GITHUB_OUTPUT}"

      - name: Fetch sources
        timeout-minutes: 30
        env:
          CMAKE_OPTIONS: ${{ inputs.cmake_options }}
        run: |
          set -eo pipefail
          flags=()
          if [ "${THEROCK_USE_PREBUILT_COMPILER}" = "1" ]; then
            # Skip fetching sources for anything provided as prebuilt above; those
            # subprojects are not built locally so their (large) sources -- e.g.
            # llvm-project, rocm-libraries -- are not needed.
            if [ "${{ steps.prebuilt_boot.outputs.compiler }}" = "true" ]; then
              flags+=(--no-include-compilers)
            fi
            # Math/ML sources are only needed when those libraries are built from
            # source: enabled in the build AND not provided as prebuilt.
            mathml_enabled=0
            case "${CMAKE_OPTIONS}" in
              *THEROCK_ENABLE_ALL=ON*|*THEROCK_ENABLE_MATH_LIBS=ON*|*THEROCK_ENABLE_ML_LIBS=ON*) mathml_enabled=1 ;;
            esac
            if [ "${mathml_enabled}" = "0" ] || [ "${{ steps.prebuilt_boot.outputs.math_ml }}" = "true" ]; then
              flags+=(--no-include-rocm-libraries --no-include-math-libraries)
            fi
          fi
          ./TheRock/build_tools/fetch_sources.py --jobs 12 --no-include-rocm-systems "${flags[@]}"

      - name: Patch rocm-systems
        run: |
          # Remove patches here if they cannot be applied cleanly, and they have not been deleted from TheRock repo
          # rm ./TheRock/patches/amd-mainline/rocm-systems/0003-Use-is_versioned-true-consistently-in-both-Comgr-Loa.patch

      - name: Configure Projects
        env:
          amdgpu_families: ${{ env.AMDGPU_FAMILIES }}
          package_version: ${{ inputs.package_version }}
          extra_cmake_options: "-DTHEROCK_ROCM_SYSTEMS_SOURCE_DIR=../ -DTHEROCK_ENABLE_RCCL=OFF ${{ inputs.cmake_options }}"
          BUILD_DIR: build
        run: |
          python TheRock/build_tools/github_actions/build_configure.py

      - name: Build therock-artifacts and therock-dist
        run: cmake --build TheRock/build --target therock-artifacts therock-dist -- -k 0

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          echo "Full SDK du:"
          echo "------------"
          du -h -d 1 TheRock/build/dist/rocm
          echo "Artifacts:"
          echo "----------"
          du -h -d 1 TheRock/build/artifacts
          echo "CCache Stats:"
          echo "-------------"
          ccache -s

      - name: Configure AWS Credentials
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::692859939525:role/therock-ci-external

      - name: Push artifacts
        run: |
          python3 TheRock/build_tools/artifact_manager.py push \
            --run-id ${{ github.run_id }} \
            --build-dir TheRock/build \
            --stage all

      - name: Post Build Upload
        if: always()
        run: |
          python TheRock/build_tools/github_actions/post_build_upload.py \
            --run-id ${{ github.run_id }} \
            --artifact-group ${{ env.AMDGPU_FAMILIES }} \
            --build-dir TheRock/build \
            --upload

  therock-test-linux:
    name: "Test"
    needs: [therock-build-linux]
    uses: ./.github/workflows/therock-test-packages.yml
    with:
      projects_to_test: ${{ inputs.projects_to_test }}
      amdgpu_families: "gfx94X-dcgpu"
      test_runs_on: ${{ inputs.test_runs_on }}
      platform: "linux"
