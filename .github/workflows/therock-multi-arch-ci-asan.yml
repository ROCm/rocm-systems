# Multi-Arch CI ASAN for rocm-systems
#
# Presubmit and on-demand ASAN builds. The ci:host-asan PR label selects
# host-only instrumentation; ci:asan selects full ASAN. Dispatch defaults to
# full ASAN, while run_rocjitsu selects host-ASAN HIP/ROCr tests on CPU.
#
# For scheduled nightly runs, see therock-multi-arch-ci-asan-nightly.yml.

name: TheRock Multi-Arch CI ASAN

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:
    inputs:
      run_rocjitsu:
        type: boolean
        description: "Build host-ASAN runtime stages only, then run HIP smoke and ROCr quick suites under rocJITsu on CPU"
        default: false
      rocjitsu_artifacts_run_id:
        type: string
        description: "With run_rocjitsu, reuse this repository's host-ASAN runtime artifacts and skip rebuilding"
        default: ""
      rocjitsu_native_comparison:
        type: boolean
        description: "With run_rocjitsu, execute the identical suites natively on gfx942 ASAN GPU runners"
        default: false
      rocjitsu_hsa_xnack:
        type: choice
        description: "Requested XNACK mode for the host-ASAN comparison"
        options: ["0", "1"]
        default: "1"
      linux_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Linux GPU families to build and test. ex: gfx94X, gfx120X"
        default: ""
      linux_test_labels:
        type: string
        description: "If enabled, reduce test set on Linux to the list of labels prefixed with 'test:'. ex: test:rocprim, test:hipcub"
        default: ""
      prebuilt_stages:
        type: string
        default: ""
        description: "Comma-separated build stages to skip (or 'all' for all stages); artifacts are copied from baseline_run_id instead"
      baseline_run_id:
        type: string
        default: ""
        description: "Workflow run ID to copy prebuilt stage artifacts from; required when prebuilt_stages is set"
      baseline_repository:
        type: string
        default: ""
        description: "Repository to query for baseline_run_id. Defaults to github.repository for workflow_dispatch."

permissions:
  contents: read
  actions: read

concurrency:
  # Only allow one run at a time for 'pull_request' events.
  # Allow multiple runs for 'push' and 'workflow_dispatch'.
  #
  # `github.workflow`: each workflow gets its own concurrency group
  # `github.head_ref`: the branch name (only defined for pull_request events)
  # `github.run_id`  : fallback, unique for each run
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    if: ${{ !(inputs.run_rocjitsu && inputs.rocjitsu_artifacts_run_id != '') }}
    uses: ROCm/TheRock/.github/workflows/setup_multi_arch.yml@e0e238c0323f76aeabdd348cfd3798a653820fdc # 2026-09-23
    with:
      build_variant: ${{ inputs.run_rocjitsu && 'host-asan' || 'asan' }}
      # The simulator only consumes HIP/ROCr runtime suites. Excluded stages
      # are skipped outright; no math-library baseline artifacts are copied.
      build_stages: ${{ inputs.run_rocjitsu && 'compiler-runtime,runtime-tests' || '' }}
      build_native_linux: ${{ !inputs.run_rocjitsu }}
      # Python/PyTorch/JAX builds are not supported with ASAN yet
      build_python_packages: false
      build_pytorch: false
      build_jax: false
      linux_amdgpu_families: ${{ inputs.run_rocjitsu && 'gfx94X' || inputs.linux_amdgpu_families || 'gfx94X,gfx950,gfx125X' }}
      linux_test_labels: ${{ inputs.run_rocjitsu && 'test:hip-tests,test:rocrtst' || inputs.linux_test_labels || '' }}
      prebuilt_stages: ${{ !inputs.run_rocjitsu && inputs.prebuilt_stages || '' }}
      baseline_run_id: ${{ !inputs.run_rocjitsu && inputs.baseline_run_id || '' }}
      baseline_repository: ${{ !inputs.run_rocjitsu && (inputs.baseline_repository || (inputs.baseline_run_id != '' && github.repository)) || '' }}
      repository: ROCm/TheRock
      ref: e0e238c0323f76aeabdd348cfd3798a653820fdc # 2026-09-23
      # Dispatch normally enables sandbox GPU testing. Clear both runner keys
      # in simulator mode so these artifacts are tested only on the CPU pool.
      external_repo: >-
        {"repository":"${{ github.repository }}","ref":"${{ github.sha }}",
         "family_overrides":${{ inputs.run_rocjitsu && '{"gfx94x":{"linux":{"test-runs-on":"","test-runs-on-sandbox":""}}}' || '{}' }}}

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: setup
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_linux.yml@e0e238c0323f76aeabdd348cfd3798a653820fdc # 2026-09-23
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      repository: ROCm/TheRock
      ref: e0e238c0323f76aeabdd348cfd3798a653820fdc # 2026-09-23
    permissions:
      contents: read
      id-token: write

  rocjitsu_tests:
    needs: [setup, linux_build_and_test]
    if: >-
      ${{
        always() && !cancelled() && inputs.run_rocjitsu &&
        (
          (inputs.rocjitsu_artifacts_run_id != '' &&
           needs.setup.result == 'skipped' && needs.linux_build_and_test.result == 'skipped') ||
          (inputs.rocjitsu_artifacts_run_id == '' &&
           needs.setup.result == 'success' && needs.linux_build_and_test.result == 'success' &&
           needs.setup.outputs.enable_build_jobs == 'true')
        )
      }}
    uses: ./.github/workflows/host-asan-rocjitsu-tests.yml
    with:
      therock_ref: e0e238c0323f76aeabdd348cfd3798a653820fdc
      artifacts_run_id: ${{ inputs.rocjitsu_artifacts_run_id || github.run_id }}
      native_gpu: ${{ inputs.rocjitsu_native_comparison || false }}
      hsa_xnack: ${{ inputs.rocjitsu_hsa_xnack || '1' }}

  multi_arch_ci_asan_summary:
    name: Multi-Arch CI ASAN Summary
    # always() is needed to show the job statuses regardless of failure
    if: always()
    needs:
      - setup
      - linux_build_and_test
      - rocjitsu_tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: e0e238c0323f76aeabdd348cfd3798a653820fdc # 2026-09-23
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
