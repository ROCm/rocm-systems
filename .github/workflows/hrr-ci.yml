name: HRR CI

# Pull requests always start the workflow. A workflow skipped by a top-level
# "paths" filter creates no check at all, so a required "HRR CI Summary" would
# wait forever on every PR that does not touch HRR. The gate job below does the
# path filtering instead, and the summary job always reports.
#
# Pushes to develop run the same suites for one reason beyond post-merge signal:
# a pull request can only restore caches from its own ref and from the base
# branch, so without a develop run every PR would start with a cold ccache.
on:
  pull_request:
  push:
    branches:
      - develop
    paths:
      - "projects/hrr/**"
      - "!projects/hrr/skills/**"
      - "projects/clr/hipamd/src/hrr/**"
      - ".github/workflows/hrr-ci.yml"
      - ".github/actions/rocprofiler-sdk-util/resolve-ci-config/**"
  workflow_dispatch:

concurrency:
  group: hrr-ci-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a develop run: it is what saves the ccache for later PRs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # One fat binary covers every family that has a test runner, so the GPU jobs
  # download a single artifact instead of rebuilding per architecture.
  #
  # Every arch a pool can hand out has to be listed, not one representative per
  # family: linux-gfx110X-gpu-rocm and linux-gfx120X-gpu-rocm are wildcard
  # pools, and a machine whose arch is missing from the binary fails every
  # workload with hipErrorInvalidImage (200) rather than skipping. gfx1250 is
  # carried so the binary is ready once its runner is enabled below.
  HRR_ARCHS: "gfx90a;gfx942;gfx950;gfx1030;gfx1100;gfx1101;gfx1102;gfx1150;gfx1151;gfx1153;gfx1200;gfx1201;gfx1250"
  ROCM_INDEX_URL: "https://rocm.nightlies.amd.com/whl-multi-arch/"

jobs:
  # ---------------------------------------------------------------------------
  # Path gate. The "on:" block cannot filter pull requests by path (see above),
  # so this job lists the files the pull request changes and sets run=false when
  # none is an HRR path. Every job below is then skipped, not failed, and
  # "HRR CI Summary" still reports. Pushes and manual runs always run.
  # ---------------------------------------------------------------------------
  gate:
    name: "HRR paths changed?"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          run=true
          reason="not a pull request"
          if [ -n "${PR_NUMBER}" ]; then
            reason="the pull request changes an HRR path"
            # The files API lists at most 3000 files; a PR that large is treated
            # as relevant rather than guessed at.
            gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename' > changed-files.txt
            if ! python3 - changed-files.txt <<'PY'
          import sys

          INCLUDE = (
              "projects/hrr/",
              "projects/clr/hipamd/src/hrr/",
              ".github/workflows/hrr-ci.yml",
              ".github/actions/rocprofiler-sdk-util/resolve-ci-config/",
          )
          EXCLUDE = ("projects/hrr/skills/",)

          files = [line.strip() for line in open(sys.argv[1]) if line.strip()]
          relevant = len(files) >= 3000 or any(
              f.startswith(INCLUDE) and not f.startswith(EXCLUDE) for f in files
          )
          sys.exit(0 if relevant else 1)
          PY
            then
              run=false
              reason="the pull request changes no HRR path"
            fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "HRR CI: run=${run} (${reason})" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Host-only unit suite. These 23 cases link nothing but libstdc++/libc: they
  # include <hip/hip_runtime.h> for types but issue no HIP calls, so they need
  # neither a GPU nor the capture library and can run on any platform.
  # ---------------------------------------------------------------------------
  unit:
    name: "Unit (${{ matrix.os }})"
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            projects/hrr
          set-safe-directory: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install ROCm SDK (headers and toolchain only)
        shell: bash
        run: |
          pip install --no-cache-dir --index-url "${ROCM_INDEX_URL}" "rocm[devel]"
          rocm-sdk init
          echo "ROCM_SDK=$(python -c 'import _rocm_sdk_devel,os;print(os.path.dirname(_rocm_sdk_devel.__file__))')" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "${RUNNER_OS}" = "Windows" ]; then
            # The runner builds with MinGW, whose libstdc++/libgcc/winpthread
            # DLLs are not on PATH for later steps, so a dynamically linked
            # binary fails to start at all. Link them in instead.
            extra+=(-DCMAKE_EXE_LINKER_FLAGS=-static)
          fi
          cmake -S projects/hrr -B build -GNinja -Wno-dev \
            "${extra[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${ROCM_SDK}" \
            -DROCM_PATH="${ROCM_SDK}" \
            -DHRR_BUILD_PLAYBACK=ON \
            -DHRR_BUILD_TESTS=ON \
            -DHRR_BUILD_INTEGRATION_TESTS=OFF

      - name: Build
        run: cmake --build build -j

      - name: Assert the expected unit cases are present
        shell: bash
        run: |
          # A case behind an #if leaves the binary with no signal at all -- not
          # failed, not skipped, absent -- so a fully green suite can hide it.
          # Assert the compiled set before trusting the run below.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            PATH="$(cygpath -u "${ROCM_SDK}")/bin:${PATH}"
            export PATH
          fi
          shopt -s nullglob
          bin=(build/tests/unit/hrr-unit-tests*)
          if [ ${#bin[@]} -eq 0 ]; then
            echo "::error::no unit binary under build/tests/unit"
            exit 1
          fi
          python3 projects/hrr/tests/check_expected_cases.py \
            --binary "${bin[0]}" \
            --manifest projects/hrr/tests/expected_cases_unit.txt

      - name: Run unit suite
        shell: bash
        run: |
          # Named hrr-unit-tests.exe on Windows. Resolved with a bash glob
          # rather than find, which on a Windows runner resolves to FIND.EXE.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            # The recovery cases spawn hrr-playback.exe, which loads the SDK's
            # HIP DLLs. Without them on PATH it dies with STATUS_DLL_NOT_FOUND
            # before running anything.
            PATH="$(cygpath -u "${ROCM_SDK}")/bin:${PATH}"
            export PATH
          fi
          shopt -s nullglob
          bin=(build/tests/unit/hrr-unit-tests*)
          if [ ${#bin[@]} -eq 0 ]; then
            echo "::error::no unit binary under build/tests/unit"
            ls -R build/tests || true
            exit 1
          fi
          ls -l "${bin[0]}"
          python3 projects/hrr/tests/run_catch2.py \
            --xml unit-${{ matrix.os }}.xml \
            -- "${bin[0]}"

      # The helpers the suites below rely on (JUnit wrapper, summary table,
      # expected-case check). They are POSIX-process code; once is enough.
      - name: Test the CI helper scripts
        if: ${{ runner.os == 'Linux' }}
        run: python3 -m unittest discover -s projects/hrr/tests -p 'test_*.py' -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-unit-${{ matrix.os }}
          path: unit-${{ matrix.os }}.xml
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Resolve the GPU runner labels from the shared CI config, the same way the
  # rocprofiler-sdk workflows do.
  # ---------------------------------------------------------------------------
  ci_config:
    name: "Resolve runners"
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      gfx90a_runner: ${{ steps.runner.outputs.gfx90a_runner }}
      gfx94x_runner: ${{ steps.runner.outputs.gfx94x_runner }}
      gfx950_runner: ${{ steps.runner.outputs.gfx950_runner }}
      gfx103x_runner: ${{ steps.runner.outputs.gfx103x_runner }}
      gfx110x_runner: ${{ steps.runner.outputs.gfx110x_runner }}
      gfx120x_runner: ${{ steps.runner.outputs.gfx120x_runner }}
      gfx1151_runner: ${{ steps.runner.outputs.gfx1151_runner }}
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions/rocprofiler-sdk-util/resolve-ci-config
          set-safe-directory: true

      - name: Resolve runner labels
        id: runner
        uses: ./.github/actions/rocprofiler-sdk-util/resolve-ci-config

  # ---------------------------------------------------------------------------
  # Builds CLR (which brings in-tree ROCr with it) to get an amdhip64 carrying
  # the HRR capture shims, then projects/hrr against the SDK. The capture build
  # is substituted at run time via LD_LIBRARY_PATH, not linked here. Produces
  # one multi-architecture artifact consumed by every GPU job below.
  # ---------------------------------------------------------------------------
  build:
    name: "Build (multi-arch)"
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    # The integration binaries embed absolute paths into this workspace, so a
    # containerised GPU job has to recreate it (see "Recreate build path").
    outputs:
      workspace: ${{ github.workspace }}
      # The nightly index moves every day. The integration jobs install exactly
      # this version so the capture amdhip64 never runs against a newer ROCr
      # than the one it was built with, however long a GPU queue is.
      sdk_version: ${{ steps.sdk.outputs.version }}
    runs-on: azure-linux-scale-rocm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Hash the compiler by content, not mtime: the SDK wheel is reinstalled
      # every run, so an mtime check would miss on every single object.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: "5G"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            projects/hrr
            projects/clr
            projects/hip
            projects/rocr-runtime
          set-safe-directory: true

      # ROCclr pulls in OpenGL through ROCclrHSA.cmake even with CLR_BUILD_OCL
      # off, so the GL development packages are required to configure CLR.
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libnuma-dev libelf-dev libdrm-dev \
            libgl1-mesa-dev libglx-dev mesa-common-dev \
            libclang-rt-18-dev ccache

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install ROCm SDK
        id: sdk
        run: |
          # CppHeaderParser is required by hipamd/src/CMakeLists.txt.
          pip install --no-cache-dir CppHeaderParser
          pip install --no-cache-dir --index-url "${ROCM_INDEX_URL}" "rocm[libraries,devel]"
          rocm-sdk init
          echo "version=$(python -c 'import importlib.metadata as m; print(m.version("rocm"))')" >> "$GITHUB_OUTPUT"
          echo "ROCM_SDK=$(python -c 'import _rocm_sdk_devel,os;print(os.path.dirname(_rocm_sdk_devel.__file__))')" >> "$GITHUB_ENV"

      # Nothing survived between runs before this: the artifact fan-out only
      # reuses a build WITHIN a run. ccache is the house convention (15
      # workflows) and is carried across runs by actions/cache (9 workflows)
      # because azure-linux-scale-rocm is ephemeral and keeps no state.
      #
      # This cache is a SPEED optimisation only and can never make a stale
      # binary look fresh. The key exists to pick a good starting point; it
      # is ccache itself that decides reuse, and it keys on the preprocessed
      # source plus the command line plus the compiler contents. A changed
      # input is therefore a miss by construction -- restoring a stale cache
      # costs misses, never a wrong object. Do not replace this with a
      # "skip the build if the key matches" scheme: that trades a correctness
      # property for the same speed.
      #
      # Restore everywhere, save only from a push to develop. A pull request can
      # restore its own caches and the base branch's but never write to
      # develop's scope, and a per-run entry of up to 5 GB from every PR run
      # would evict other workflows' caches. One develop entry per push seeds
      # every PR instead.
      - name: Restore ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: hrr-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hrr-ccache-${{ runner.os }}-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      # -DHIP_HRR_CAPTURE_ENABLED is what compiles capture into amdhip64
      # (hip_capture.cpp); the tree has no CMake option for it. CI always sets
      # it, so capture is always on in the build under test.
      - name: Build amdhip64 with the HRR capture shims
        run: |
          cmake -S projects/clr -B build/clr -GNinja -Wno-dev \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS=-DHIP_HRR_CAPTURE_ENABLED \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${ROCM_SDK}" \
            -DROCM_PATH="${ROCM_SDK}" \
            -DHIP_COMMON_DIR="${GITHUB_WORKSPACE}/projects/hip" \
            -DHIP_PLATFORM=amd \
            -DCLR_BUILD_HIP=ON \
            -DCLR_BUILD_OCL=OFF
          cmake --build build/clr --target amdhip64 -j

      - name: Build projects/hrr for every testable architecture
        run: |
          # C and C++ only. CMAKE_HIP_COMPILER_LAUNCHER is deliberately NOT
          # set: HIP device compilation fans one TU out to a code object per
          # --offload-arch and bundles them, and ccache's handling of that
          # multi-output bundling is not something this workflow has proven.
          # A wrong hit there would mean testing a binary that does not match
          # its source, which is exactly the failure mode this cache is
          # required not to introduce. The C++ half (CLR/amdhip64, the bulk of
          # the wall clock) is cached; extend to HIP only after a run proves
          # the arch-embedding check still passes on a fully cached build.
          cmake -S projects/hrr -B build/hrr -GNinja -Wno-dev \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${ROCM_SDK}" \
            -DROCM_PATH="${ROCM_SDK}" \
            -DCMAKE_HIP_COMPILER="${ROCM_SDK}/bin/amdclang++" \
            -DCMAKE_HIP_FLAGS="--rocm-device-lib-path=${ROCM_SDK}/lib/llvm/amdgcn/bitcode" \
            -DGPU_TARGETS="${HRR_ARCHS}" \
            -DCMAKE_HIP_ARCHITECTURES="${HRR_ARCHS}" \
            -DHRR_BUILD_PLAYBACK=ON \
            -DHRR_BUILD_TESTS=ON \
            -DHRR_BUILD_INTEGRATION_TESTS=ON
          cmake --build build/hrr -j

      - name: ccache statistics
        if: always()
        run: ccache --show-stats --verbose || ccache --show-stats

      - name: Assert the expected integration cases are present
        run: |
          # Listing needs no GPU: Catch2 registers cases in static initialisers
          # and --list-tests never calls into HIP. Checked here rather than in
          # the integration jobs so a compiled-out case fails once, straight
          # away, instead of nine times after the fan-out.
          python3 projects/hrr/tests/check_expected_cases.py \
            --binary build/hrr/tests/integration/hrr-integration-tests \
            --manifest projects/hrr/tests/expected_cases_integration.txt

      - name: Confirm every architecture is embedded
        run: |
          found=$("${ROCM_SDK}"/lib/llvm/bin/llvm-objdump --offloading \
            build/hrr/tests/integration/hrr-integration-tests \
            | grep -o 'gfx[0-9a-z]*' | sort -u | tr '\n' ' ')
          echo "embedded: ${found}"
          for arch in ${HRR_ARCHS//;/ }; do
            case " ${found} " in
              *" ${arch} "*) ;;
              *) echo "::error::${arch} missing from the fat binary"; exit 1 ;;
            esac
          done

      - name: Save ccache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: hrr-ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hrr-build
          path: |
            build/hrr
            build/clr/hipamd/lib
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Integration suite on every family that has a test runner.
  # ---------------------------------------------------------------------------
  integration:
    name: "Integration (${{ matrix.family }})"
    needs: [gate, ci_config, build]
    if: ${{ needs.gate.outputs.run == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    runs-on: ${{ matrix.runner }}
    # The suite runs in about 90 seconds. These are scarce single-GPU machines
    # and the default timeout is six hours, so a workload that deadlocks on one
    # part would hold a runner for the rest of the day and publish no log to
    # say why. Fail instead, while the log still gets uploaded.
    timeout-minutes: 30
    # The OSSCI pod pools (gfx90a, gfx950) expose /dev/kfd only to a job with
    # a container spec: run bare there and hipGetDeviceCount returns 100 with
    # no devices. Every other pool is a bare machine and gets no container,
    # since a null image runs the job directly on the runner.
    container:
      image: ${{ matrix.container && 'ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98' || null }}
      options: >-
        --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 110
        --group-add 993
        --group-add 992
        --ulimit memlock=-1:-1
        --security-opt seccomp=unconfined
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        --user 0:0
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { family: gfx90a, container: true, runner: "${{ needs.ci_config.outputs.gfx90a_runner }}" }
          # gfx94x uses the resolved 1-GPU runner: the 8-GPU gfx942 pool
          # exposes /dev/kfd only to a job with a container spec.
          - { family: gfx94x, runner: "${{ needs.ci_config.outputs.gfx94x_runner }}" }
          # The T3 tier needs two visible devices and there is no 2-GPU pool,
          # so gfx950 takes an 8-GPU machine; every other family skips T3.
          # Do not pin HIP_VISIBLE_DEVICES: on the CCS pool fixed indices can
          # be empty even though the job has GPUs.
          - { family: gfx950, container: true, runner: "linux-gfx950-8gpu-ccs-ossci-rocm" }
          - { family: gfx103x, runner: "${{ needs.ci_config.outputs.gfx103x_runner }}" }
          - { family: gfx110x, runner: "${{ needs.ci_config.outputs.gfx110x_runner }}" }
          - { family: gfx120x, runner: "${{ needs.ci_config.outputs.gfx120x_runner }}" }
          - { family: gfx1151, runner: "${{ needs.ci_config.outputs.gfx1151_runner }}" }
          # Not exposed by resolve-ci-config; taken from TheRock's family matrix.
          - { family: gfx1150, runner: "linux-gfx1150-gpu-rocm" }
          - { family: gfx1153, runner: "linux-gfx1153-gpu-rocm" }
          # gfx1250 (MI455) is withheld until linux-mi455-gpu-rocm is healthy.
          # If it is wanted sooner, add it as a separate non-blocking job, as
          # therock-ci.yml does, so the report job never waits on that queue:
          #
          #   - { family: gfx1250, runner: "linux-mi455-gpu-rocm" }
    steps:
      # Only the test runner: this job compiles nothing and takes its binaries
      # from the build artifact. It has to come first, because checkout cleans
      # the workspace and would delete an artifact unpacked before it.
      - name: Checkout test runner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            projects/hrr/tests/run_catch2.py
          sparse-checkout-cone-mode: false
          set-safe-directory: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # Invoked through "python -m" and by script path throughout: on some of
      # these self-hosted machines the console-script wrappers cannot execute,
      # and the system Python has no ensurepip to build a virtualenv with.
      - name: Install ROCm SDK
        env:
          SDK_VERSION: ${{ needs.build.outputs.sdk_version }}
        run: |
          # devel as well as libraries: rocm-sdk init refuses to run without it.
          # The version the build job used, not whatever the index has now.
          python -m pip install --no-cache-dir \
            --index-url "${ROCM_INDEX_URL}" "rocm[libraries,devel]${SDK_VERSION:+==${SDK_VERSION}}"
          # Run as a module where possible. Falling back to the script means
          # locating it: some of these machines install into a --user bin that
          # is not on PATH, leaving command -v empty.
          if ! python -m rocm_sdk init; then
            cli="$(command -v rocm-sdk || true)"
            if [ -z "${cli}" ]; then
              cli="$(python -c 'import site;print(site.USER_BASE)')/bin/rocm-sdk"
            fi
            python "${cli}" init
          fi
          echo "ROCM_SDK=$(python -c 'import _rocm_sdk_devel,os;print(os.path.dirname(_rocm_sdk_devel.__file__))')" >> "$GITHUB_ENV"

      # Unpacked under build/ so the tree matches the build machine's layout.
      # The suite spawns each workload by re-execing HRR_TEST_EXE, which CMake
      # bakes in as an absolute path, so the binary has to sit where it was
      # built or every workload dies in execvp with 127.
      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrr-build
          path: build

      # In a container the workspace moves (/__w/...), which would leave the
      # baked-in HRR_TEST_EXE and HRR_PLAYBACK_EXE pointing nowhere.
      - name: Recreate build path
        env:
          BUILD_WORKSPACE: ${{ needs.build.outputs.workspace }}
        run: |
          if [ -n "${BUILD_WORKSPACE}" ] && [ "${BUILD_WORKSPACE}" != "${PWD}" ]; then
            mkdir -p "$(dirname "${BUILD_WORKSPACE}")"
            ln -sfn "${PWD}" "${BUILD_WORKSPACE}"
          fi

      - name: Restore executable bits
        run: chmod +x build/hrr/playback/hrr-playback build/hrr/tests/*/hrr-*tests

      # CMake gives the binaries a RUNPATH to the SDK's lib directory, where
      # the plain amdhip64 lives. LD_LIBRARY_PATH is searched before RUNPATH, so
      # putting the capture build first here is what selects it.
      - name: Run integration suite
        run: |
          # hipamd/lib holds the amdhip64 carrying the capture shims and must
          # precede the SDK, which ships a plain build under the same soname.
          # No ROCr preload here: CLR was built against the SDK's ROCr, so the
          # two agree and there is no in-tree runtime to substitute.
          # Keep the runner's existing path: setup-python puts libpython there,
          # and replacing it makes python3 fail to start on some GPU machines.
          export LD_LIBRARY_PATH="${PWD}/build/clr/hipamd/lib:${ROCM_SDK}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # A GPU-labelled runner with no visible device is infrastructure
          # failure, not 67 unsupported capabilities. Still run the three
          # CPU-only integration checks and publish their JUnit, then fail the
          # job so the table cannot make a broken runner look green.
          # Exit 1 is "confirmed no device". Any other probe failure (broken
          # ctypes, missing libpython) is not a device count and must not
          # skip the GPU suite.
          set +e
          python3 - <<'PY'
          import sys

          try:
              import ctypes
              hip = ctypes.CDLL("libamdhip64.so.7")
              count = ctypes.c_int()
              status = hip.hipGetDeviceCount(ctypes.byref(count))
          except Exception as exc:
              print(f"GPU probe unavailable: {type(exc).__name__}: {exc}", file=sys.stderr)
              sys.exit(2)
          print(f"hipGetDeviceCount: status={status}, devices={count.value}")
          sys.exit(0 if status == 0 and count.value > 0 else 1)
          PY
          probe_rc=$?
          set -e
          if [ "$probe_rc" -eq 1 ]; then
            echo "::error::GPU runner has no visible ROCm-capable device"
            python3 projects/hrr/tests/run_catch2.py \
              --xml integration-${{ matrix.family }}.xml \
              -- ./build/hrr/tests/integration/hrr-integration-tests "[cpu]"
            exit 1
          fi
          # Keep passing logs to one result line per case. The wrapper captures
          # Catch2 and subprocess output, and only emits it when the suite fails.
          # Time out inside the job's 30 minutes, so a hang prints the cases
          # that finished instead of being cancelled with no output.
          #
          # The selector matters: Catch2 leaves out hidden "[.]" cases unless a
          # tag names them, and every API-matrix tier, the kernel-argument
          # regression and the HSA first-touch case are hidden drivers tagged
          # [hrr]. "[hrr]~[direct]" runs them, leaves out the [hrr][direct]
          # workloads they spawn as subprocesses, and (being an exact tag match)
          # also leaves out the [hrr-direct] workloads and the disabled
          # [hrr-repro] cases.
          python3 projects/hrr/tests/run_catch2.py \
            --xml integration-${{ matrix.family }}.xml --timeout 1200 \
            -- ./build/hrr/tests/integration/hrr-integration-tests "[hrr]~[direct]"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-integration-${{ matrix.family }}
          path: integration-${{ matrix.family }}.xml
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Per-test reporting for every job above. Collected centrally because the
  # publishing action is a container action and so cannot run on the Windows
  # runners.
  # ---------------------------------------------------------------------------
  report:
    name: "Test results"
    needs: [gate, unit, integration]
    if: ${{ always() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout summary script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            projects/hrr/tests/summarize_junit.py
          sparse-checkout-cone-mode: false
          set-safe-directory: true

      - name: Download all results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          merge-multiple: true

      - name: Platform / family table
        if: always()
        run: |
          # Written first so it sits above EnricoMi's suite dump on the job
          # summary and on the HRR test results check page.
          python3 projects/hrr/tests/summarize_junit.py \
            --dir . \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Publish
        # Runs even when the table step exits 1 on unreadable XML.
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: "*.xml"
          check_name: "HRR test results"
          comment_mode: "off"
          # Fork pull requests get a read-only token, and creating a check run
          # then fails with "Resource not accessible by integration". They keep
          # the job summary, which needs no token.
          check_run: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          job_summary: true
          report_individual_runs: true
          deduplicate_classes_by_file_name: true

  # ---------------------------------------------------------------------------
  # Single required-check target. Passes when the path gate skipped everything
  # and when every job that ran succeeded; fails on any failure or cancellation,
  # and on a skip the gate does not explain. Fork PRs skip build and integration
  # on purpose, so those skips are accepted there.
  # ---------------------------------------------------------------------------
  hrr_ci_summary:
    name: "HRR CI Summary"
    if: always()
    needs: [gate, unit, ci_config, build, integration, report]
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          result = {name: job["result"] for name, job in needs.items()}
          print(json.dumps(result, indent=2))

          if result["gate"] != "success":
              print("::error::path gate did not complete: " + result["gate"])
              sys.exit(1)
          if needs["gate"]["outputs"].get("run") != "true":
              print("HRR CI skipped: the pull request changes no HRR path.")
              sys.exit(0)

          fork = os.environ["IS_FORK"] == "true"
          optional = {"build", "integration"} if fork else set()
          bad = [n for n, r in result.items()
                 if r not in ("success",) and not (r == "skipped" and n in optional)]
          if bad:
              print("::error::HRR CI jobs not successful: " + ", ".join(sorted(bad)))
              sys.exit(1)
          PY
