# HRR CI: generated-source checks, the HRR helper-script tests and the host
# unit suite, plus the GPU capture/replay suite (hrr-gpu.yml) for changes that
# touch capture or replay. projects/hrr/tests/scripts/hrr_ci_configure.py
# decides what runs; "HRR CI Summary" reports every platform and GPU family in
# one table.

name: HRR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [develop]
  schedule:
    # Nightly: capture-enabled build and the GPU suite on every HRR family.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      families:
        description: "Comma-separated GPU families (TheRock keys, e.g. gfx94x,gfx110x). Empty: the nightly set."
        type: string
        default: ""
      ignore_test_config:
        description: "Run the cases the suite config skips"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The unit suite only needs HIP headers and the hip CMake package. Pinned so
  # a run does not depend on the day's nightly.
  ROCM_INDEX_URL: "https://rocm.nightlies.amd.com/whl-multi-arch/"
  ROCM_SDK_VERSION: "10.1.0a20260822"

jobs:
  configure:
    name: Configure
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_cpu: ${{ steps.decide.outputs.run_cpu }}
      run_gpu: ${{ steps.decide.outputs.run_gpu }}
      families: ${{ steps.decide.outputs.families }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: projects/hrr/tests/scripts/hrr_ci_configure.py
          sparse-checkout-cone-mode: false

      - name: Checkout TheRock family matrix
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: ROCm/TheRock
          # Keep in sync with the TheRock ref in therock-multi-arch-ci.yml.
          ref: 05add1921fd03b0649f054ec2a7c54d162c0cd99 # 2026-10-08
          path: therock
          sparse-checkout: build_tools/github_actions

      # Current runner labels, as TheRock's setup_multi_arch.yml loads them.
      - name: Checkout TheRock CI runner config
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        continue-on-error: true
        with:
          persist-credentials: false
          repository: ROCm/therock-ci-config
          ref: main
          path: ci-config

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CONFIG_PATH: ci-config
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
          FAMILIES: ${{ inputs.families }}
        run: >-
          python projects/hrr/tests/scripts/hrr_ci_configure.py
          --event "${EVENT}" --repo "${REPO}" --pr-number "${PR_NUMBER}"
          --before "${BEFORE}" --after "${AFTER}" --labels "${LABELS}"
          --is-fork "${IS_FORK}" --families "${FAMILIES}"
          --therock-dir therock

  codegen:
    name: Generated sources
    needs: configure
    if: ${{ needs.configure.outputs.run_cpu == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The API-ID check reads hrr_api_args.h at the base commit.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            projects/hrr
            projects/hip/include
            projects/clr/hipamd/include
            projects/clr/hipamd/src/hrr

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --no-cache-dir PyYAML==6.0.2

      - name: Check generated sources, API IDs and the API matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python projects/hrr/tools/hrr_check_sources.py all --base-sha "${BASE_SHA}"

  scripts:
    name: HRR script tests
    needs: configure
    if: ${{ needs.configure.outputs.run_cpu == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Cone mode also checks out projects/clr/hipamd/src/amdhip.def.in,
          # which gen_hrr_api_args.py reads on import.
          sparse-checkout: |
            .github/workflows/hrr-gpu.yml
            projects/hrr
            projects/clr/hipamd/src/hrr

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install test requirements
        run: python -m pip install --no-cache-dir PyYAML==6.0.2 pytest==8.4.2

      - name: Lint the suite configs
        run: >-
          python projects/hrr/tests/scripts/hrr_test_config.py lint
          projects/hrr/tests/config/unit.yaml
          projects/hrr/tests/config/integration.yaml
          --workflow .github/workflows/hrr-gpu.yml

      - name: Run tests
        run: python -m pytest projects/hrr/tests/scripts

  unit:
    name: Unit (${{ matrix.os }})
    needs: configure
    if: ${{ needs.configure.outputs.run_cpu == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            exe: hrr-unit-tests
            linker_flags: ""
          - os: windows-2022
            exe: hrr-unit-tests.exe
            # The MinGW runtime DLLs are not on PATH in later steps.
            linker_flags: "-static"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            projects/hrr
            projects/hip/include
            projects/clr/hipamd/include

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install the ROCm SDK
        run: |
          python -m pip install --no-cache-dir PyYAML==6.0.2
          python -m pip install --no-cache-dir --index-url "${ROCM_INDEX_URL}" "rocm[devel]==${ROCM_SDK_VERSION}"
          rocm-sdk init
          echo "ROCM_SDK=$(rocm-sdk path --root)" >> "${GITHUB_ENV}"
          rocm-sdk path --bin >> "${GITHUB_PATH}"

      # This tree's HIP headers come first: an API added here is not in the
      # pinned SDK's headers yet. The SDK supplies the hip CMake package.
      # On Windows, cygpath -m gives the drive-letter form a native cmake accepts.
      - name: Configure
        env:
          LINKER_FLAGS: ${{ matrix.linker_flags }}
        run: |
          tree="$(cygpath -m "${PWD}" 2>/dev/null || echo "${PWD}")"
          cmake -S projects/hrr -B build -GNinja -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=${ROCM_SDK}" \
            "-DROCM_PATH=${ROCM_SDK}" \
            "-DHRR_HIP_INCLUDE_DIRS=${tree}/projects/hip/include;${tree}/projects/clr/hipamd/include" \
            "-DCMAKE_EXE_LINKER_FLAGS=${LINKER_FLAGS}" \
            -DHRR_BUILD_PLAYBACK=ON \
            -DHRR_BUILD_TESTS=ON \
            -DHRR_BUILD_INTEGRATION_TESTS=OFF

      - name: Build
        run: cmake --build build -j

      # A case compiled out by an #if leaves no failed or skipped result, so
      # compare the compiled case list with the suite config first.
      - name: Check the compiled case list
        env:
          EXE: ${{ matrix.exe }}
        run: >-
          python projects/hrr/tests/scripts/hrr_test_config.py check
          --binary "build/tests/unit/${EXE}"
          --config projects/hrr/tests/config/unit.yaml

      - name: Run unit suite
        env:
          EXE: ${{ matrix.exe }}
          OS: ${{ matrix.os }}
          HRR_TEST_IGNORE_CONFIG: ${{ inputs.ignore_test_config && '1' || '' }}
        run: >-
          python projects/hrr/tests/scripts/run_catch2.py
          --xml "unit-${OS}.xml"
          --config projects/hrr/tests/config/unit.yaml
          --arch none
          -- "build/tests/unit/${EXE}"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-unit-${{ matrix.os }}
          path: unit-${{ matrix.os }}.xml
          if-no-files-found: ignore
          retention-days: 7

  gpu:
    name: GPU
    needs: configure
    if: ${{ needs.configure.outputs.run_gpu == 'true' }}
    uses: ./.github/workflows/hrr-gpu.yml
    # No secrets: the GPU workflow reads public artifacts with the job token.
    with:
      families: ${{ needs.configure.outputs.families }}
      ignore_test_config: ${{ inputs.ignore_test_config || false }}

  summary:
    name: HRR CI Summary
    needs: [configure, codegen, scripts, unit, gpu]
    if: ${{ always() && (needs.configure.outputs.run_cpu == 'true' || needs.configure.outputs.run_gpu == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            projects/hrr/tests/scripts/hrr_ci_report.py
            projects/hrr/tests/scripts/summarize_junit.py
          sparse-checkout-cone-mode: false

      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          merge-multiple: true
          path: results

      - name: Download base build record
        if: ${{ needs.configure.outputs.run_gpu == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrr-base-${{ github.sha }}
          path: base

      - name: Summarize
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ needs.configure.outputs.reason }}
          RUN_GPU: ${{ needs.configure.outputs.run_gpu }}
          FAMILIES: ${{ needs.configure.outputs.families }}
        run: >-
          python3 projects/hrr/tests/scripts/hrr_ci_report.py
          --reason "${REASON}" --run-gpu "${RUN_GPU}" --families "${FAMILIES}"
          --results-dir results --base-json base/base.json
