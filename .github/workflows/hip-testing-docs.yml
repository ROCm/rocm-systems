name: HIP testing-docs consistency

# A pure static-analysis gate for the hand-maintained HIP testing documentation
# set (no ROCm, GPU, or build required, so it runs quickly and always-on). It
# fails when the connected document set drifts out of consistency: a schema key
# or declared vocabulary is missing or malformed, a disposition/coverage target
# does not resolve, a repository-path-bearing pointer (source_of_truth, a suite's
# metadata.config / metadata.generated_plan, or execution.ci_lane.in_repo) goes
# stale, a referenced TI-NNN incident has no definition or is missing a required
# field, or a local Markdown link or anchor breaks.
#
# The gate has two steps:
#   1. Tool tests: runs the focused unit tests for the checker itself.
#   2. Consistency check: runs the checker against the committed documents.
#
# See projects/hip-tests/TEST_RESTRUCTURING.md (workstreams WS-1 and WS-2) for
# the acceptance criteria these checks implement.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "projects/hip-tests/test_inventory.yaml"
      - "projects/hip-tests/test_coverage_model.yaml"
      - "projects/hip-tests/TESTING.md"
      - "projects/hip-tests/TESTING_INCIDENTS.md"
      - "projects/hip-tests/TEST_RESTRUCTURING.md"
      - "projects/hip-tests/tools/**"

permissions:
  contents: read

jobs:
  testing-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Test testing-docs checker
        run: |
          python -m unittest projects/hip-tests/tools/tests/test_check_testing_docs.py

      - name: Check testing-docs consistency
        run: |
          python projects/hip-tests/tools/check_testing_docs.py
