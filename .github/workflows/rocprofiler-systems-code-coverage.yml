name: rocprofiler-systems Code Coverage
run-name: code-coverage

permissions:
  contents: read

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/rocprofiler-systems-code-coverage.yml'
      - 'projects/rocprofiler-systems/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-systems/docs/**'
      - '!projects/rocprofiler-systems/source/docs/**'
      - '!projects/rocprofiler-systems/source/python/gui/**'
      - '!projects/rocprofiler-systems/docker/**'
      - '!projects/rocprofiler-systems/CMakePresets.json'
  pull_request:
    paths:
      - '.github/workflows/rocprofiler-systems-code-coverage.yml'
      - 'projects/rocprofiler-systems/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-systems/docs/**'
      - '!projects/rocprofiler-systems/source/docs/**'
      - '!projects/rocprofiler-systems/source/python/gui/**'
      - '!projects/rocprofiler-systems/docker/**'
      - '!projects/rocprofiler-systems/CMakePresets.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROCPROFSYS_CI: ON
  ROCPROFSYS_TMPDIR: "%env{PWD}%/testing-tmp"

jobs:
  code-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        rocm-version: ['7.2']

    container:
      image: dgaliffiamd/rocprofiler-systems:ci-rocm-${{ matrix.rocm-version }}-ubuntu-24.04
      options: --cap-add CAP_SYS_ADMIN

    env:
      ROCPROFSYS_VERBOSE: 2
      ROCPROFSYS_CI: 'ON'
      ROCPROFSYS_MAX_THREADS: '64'
      ROCPROFSYS_KEEP_TEST_OUTPUT: '0'

    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: |
          projects/rocprofiler-systems/
          .gitmodules

    - name: Configure ROCm Environment
      shell: bash
      run: |
        echo "/opt/rocm/bin" >> $GITHUB_PATH
        echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

    - name: Install Packages
      timeout-minutes: 25
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 #v4.0.0
      with:
        retry_wait_seconds: 30
        timeout_minutes: 25
        max_attempts: 5
        command: |
          apt-get update &&
          apt-get upgrade -y &&
          apt-get install -y libomp-dev libmpich-dev mpich gcovr &&
          apt-get autoclean

    - name: Install Python Test Dependencies
      timeout-minutes: 10
      shell: bash
      working-directory: projects/rocprofiler-systems/
      run: |
        for env_dir in /opt/conda/envs/py3.{8,9,10,11,12,13}/; do
          if [ -d "${env_dir}" ] && [ -x "${env_dir}bin/python3" ]; then
            echo "Installing requirements into ${env_dir}"
            "${env_dir}bin/python3" -m pip install -r requirements.txt
          fi
        done

    - name: Sync gcov with GCC
      shell: bash
      run: |
        GCC_VER=$(gcc -dumpversion | cut -d. -f1)
        echo "GCC version: ${GCC_VER}"
        update-alternatives \
          --install /usr/bin/gcov gcov /usr/bin/gcov-${GCC_VER} 500

    - name: Configure, Build, and Test
      timeout-minutes: 120
      shell: bash
      working-directory: projects/rocprofiler-systems/
      env:
        GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      run: |
        git config --global --add safe.directory ${GITHUB_WORKSPACE}
        git config --global --add safe.directory ${PWD}
        echo "CMake version: $(cmake --version | head -n 1)"
        echo "Compiler version: $(gcc --version | head -n 1)"
        python3 ./scripts/run-ci.py -B build \
          --name ${{ github.repository_owner }}-${{ github.ref_name }}-ubuntu-noble-codecov \
          --build-jobs $(nproc) \
          --site GitHub \
          --coverage \
          -- \
          -DCMAKE_INSTALL_PREFIX=/opt/rocprofiler-systems \
          -DROCPROFSYS_BUILD_CI=OFF \
          -DROCPROFSYS_BUILD_TESTING=ON \
          -DROCPROFSYS_BUILD_DYNINST=ON \
          -DROCPROFSYS_BUILD_BOOST=ON \
          -DROCPROFSYS_BUILD_TBB=ON \
          -DROCPROFSYS_BUILD_ELFUTILS=ON \
          -DROCPROFSYS_BUILD_LIBIBERTY=ON \
          -DROCPROFSYS_BUILD_DEBUG=OFF \
          -DROCPROFSYS_BUILD_HIDDEN_VISIBILITY=OFF \
          -DROCPROFSYS_USE_MPI=ON \
          -DROCPROFSYS_USE_PYTHON=ON \
          -DROCPROFSYS_PYTHON_PREFIX=/opt/conda/envs \
          -DROCPROFSYS_PYTHON_ENVS="py3.8;py3.9;py3.10;py3.11;py3.12;py3.13" \
          -DROCPROFSYS_MAX_THREADS=64 \
          -DROCPROFSYS_DISABLE_EXAMPLES="transpose;rccl;openmp-target;openmp-vv-offload;lulesh" \
          -DROCPROFSYS_BUILD_NUMBER=${{ github.run_attempt }} \
          -DCMAKE_PREFIX_PATH=/opt/rocm \
          -DUSE_CLANG_OMP=OFF \
          -- \
          -LE "network|gpu"

    - name: Generate Coverage Report
      if: always()
      timeout-minutes: 15
      shell: bash
      working-directory: projects/rocprofiler-systems/
      run: |
        python3 scripts/generate-coverage.py \
          --build-dir build \
          --source-dir . \
          --output-dir .codecov \
          --label all \
          --low-coverage-count 20

    - name: Post Coverage Comment on PR
      if: github.event_name == 'pull_request'
      timeout-minutes: 5
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const mdPath = 'projects/rocprofiler-systems/.codecov/all.md';
          const summaryPath = 'projects/rocprofiler-systems/.codecov/all-summary.json';
          const commentId = '<!-- rocprofiler-systems-coverage -->';

          let body = '';
          if (fs.existsSync(mdPath)) {
            const md = fs.readFileSync(mdPath, 'utf8');
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));

            const pct = summary.coverage_pct;
            const delta = summary.delta_pct || 0;
            let status = '✅';
            // Threshold check — report only for now.
            // To enforce, uncomment the core.setFailed() line below.
            if (delta < -1.0) {
              status = '⚠️ Coverage decreased by more than 1%';
              // core.setFailed(`Coverage regression: ${delta.toFixed(2)}%`);
            }

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const timestamp = new Date().toISOString().replace('T', ' ').replace(/\.\d+Z/, ' UTC');

            body = [
              `<details open>`,
              `<summary><h3>Code Coverage Report ${status}</h3></summary>`,
              ``,
              md,
              ``,
              `> 🔄 Updated: ${timestamp} | [Workflow run](${runUrl})`,
              ``,
              `</details>`,
              ``,
              commentId,
            ].join('\n');
          } else {
            body = [
              `### Code Coverage Report`,
              ``,
              `⚠️ Coverage report was not generated. Check the workflow logs.`,
              ``,
              commentId,
            ].join('\n');
          }

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
          });

          const existing = comments.find(c => c.body.includes(commentId));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body,
            });
          }
