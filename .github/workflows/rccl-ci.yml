name: RCCL cluster CI

# Runs the RCCL suites via rccl-suite.yml, each on the cluster it needs (device-api
# on ruby, gin on tw). Each leg is self-contained: it provisions the ROCm floor from
# TheRock CI artifacts, builds rocSHMEM/RCCL/rccl-tests from the PR sources, and runs.
# ROCm tracks TheRock automatically (latest main run); pass artifact_run_id to pin one.
#
# GIN must use the role label `rccl-gin` (runner
# tw-gfx950-ainic-ROCm-scale-rccl-gin-1), not tw-gfx950-ainic-ROCm-scale-runner.
# Those role runners were registered with --no-default-labels, so runs-on is the
# role label alone -- adding self-hosted matches nothing and the job queues
# forever. Sharing the generic runner serialises GIN behind the 4-node perf-gate.

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'TheRock (ROCm/TheRock) workflow run ID to fetch ROCm from. Empty = latest main run with artifacts.'
        type: string
        required: false
        default: ''
      artifact_group:
        description: 'TheRock artifact group / GPU family for the ROCm floor.'
        type: string
        required: false
        default: 'gfx950-dcgpu'
      therock_ref:
        description: 'ROCm/TheRock git ref for build_tools + setup_test_environment.'
        type: string
        required: false
        default: 'b45a06045cbb29c85e221748e653ac2521c6e1bf'
      amdgpu_targets:
        description: 'GPU arch for rocSHMEM/RCCL/rccl-tests (must match the ROCm family ARCH).'
        type: string
        required: false
        default: 'gfx950'
  pull_request:
    paths:
      - 'projects/rocshmem/**'
      - 'projects/rccl/**'
      - 'projects/rccl-tests/**'
      - 'projects/rccl/tools/ci/**'
      - '.github/workflows/rccl-ci.yml'
      - '.github/workflows/rccl-suite.yml'

permissions:
  contents: read
  id-token: write

# Per-PR: a new push cancels the previous GitHub run. submit_slurm_job.py
# scancels the Slurm allocation so cancelled GIN jobs do not keep holding
# rccl_ci nodes until wall clock.
# cancel-probe: start (push 2 while SLURM is live to capture scancel)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  # device-API suite on ruby.
  device-api:
    name: device-API
    uses: ./.github/workflows/rccl-suite.yml
    permissions:
      contents: read
      id-token: write
    with:
      suite: device-api
      runs_on: '["ruby-linux-slurm-scale-runner"]'
      partition: interactive
      timeout_minutes: 240
      artifact_group: ${{ inputs.artifact_group || 'gfx950-dcgpu' }}
      artifact_run_id: ${{ inputs.artifact_run_id || '' }}
      therock_ref: ${{ inputs.therock_ref || 'b45a06045cbb29c85e221748e653ac2521c6e1bf' }}
      amdgpu_targets: ${{ inputs.amdgpu_targets || 'gfx950' }}

  # GIN suite (WIP) on Tensorwave. Failures show red with logs on this job.
  # non_gating keeps test failures from blocking; build/infra failures gate via
  # gin-build-gate below. AICOMRCCL-1478: enable full gating once GIN lands in develop.
  gin:
    name: GIN
    uses: ./.github/workflows/rccl-suite.yml
    permissions:
      contents: read
      id-token: write
    with:
      suite: gin
      # Role label only; see file header. Do not add self-hosted.
      runs_on: '["rccl-gin"]'
      partition: amd-tw
      # Dedicated RCCL CI nodes on Tensorwave (mia1-p01-g[22,26,28,32]).
      reservation: rccl_ci
      timeout_minutes: 300
      non_gating: true
      artifact_group: ${{ inputs.artifact_group || 'gfx950-dcgpu' }}
      artifact_run_id: ${{ inputs.artifact_run_id || '' }}
      therock_ref: ${{ inputs.therock_ref || 'b45a06045cbb29c85e221748e653ac2521c6e1bf' }}
      amdgpu_targets: ${{ inputs.amdgpu_targets || 'gfx950' }}

  # Gates GIN on build/infra failures only; test failures stay non-gating (red
  # with logs on the GIN job above). AICOMRCCL-1478.
  # GATING TEMPORARILY DISABLED (`if: false`) so GIN can't block merges. To
  # re-enable, restore: if: ${{ needs.gin.outputs.build_failed == 'true' }}
  gin-build-gate:
    name: GIN build gate
    needs: gin
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "GIN build/infra failed; see the GIN job logs." >&2
          exit 1
