name: RCCL cluster CI

# Runs the RCCL suites via rccl-suite.yml, each on the cluster it needs (device-api
# on ruby, gin on tw). Each leg is self-contained: it provisions the ROCm floor from
# TheRock CI artifacts, builds rocSHMEM/RCCL/rccl-tests from the PR sources, and runs.
# ROCm tracks TheRock automatically (latest main run); pass artifact_run_id to pin one.
#
# Nightly and on demand, not PR-triggered. rccl-coco-pr.yml covers RCCL and
# rccl-tests PRs; these suites rejoin it once the device-api tests are restored
# there. Until then, changes under projects/rocshmem are covered only by this
# nightly, not by any PR check.

on:
  schedule:
    # Weekday nightly, offset from rccl-coco-scheduled.yml's 03:47 nightly and from
    # rccl-ainic-tw-gfx950-runner.yml's 02:00 so the three do not contend for
    # the ruby and tw runners. The longest leg here is 5h.
    - cron: '47 12 * * 1-5'
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'TheRock (ROCm/TheRock) workflow run ID to fetch ROCm from. Empty = latest main run with artifacts.'
        type: string
        required: false
        default: ''
      artifact_group:
        description: 'TheRock artifact group / GPU family for the ROCm floor.'
        type: string
        required: false
        default: 'gfx950-dcgpu'
      therock_ref:
        description: 'ROCm/TheRock git ref for build_tools + setup_test_environment.'
        type: string
        required: false
        default: '648a501e56a1e0919976d6f540b7853e63d44998'
      amdgpu_targets:
        description: 'GPU arch for rocSHMEM/RCCL/rccl-tests (must match the ROCm family ARCH).'
        type: string
        required: false
        default: 'gfx950'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  # device-API suite on ruby.
  device-api:
    name: device-API
    uses: ./.github/workflows/rccl-suite.yml
    permissions:
      contents: read
      id-token: write
    with:
      suite: device-api
      runs_on: '["ruby-linux-slurm-scale-runner"]'
      partition: interactive
      timeout_minutes: 240
      artifact_group: ${{ inputs.artifact_group || 'gfx950-dcgpu' }}
      artifact_run_id: ${{ inputs.artifact_run_id || '' }}
      # TheRock pinned ref committed 2026-09-02; bump when refreshing artifacts.
      therock_ref: ${{ inputs.therock_ref || '648a501e56a1e0919976d6f540b7853e63d44998' }}
      amdgpu_targets: ${{ inputs.amdgpu_targets || 'gfx950' }}

  # ext-plugins suite on ruby: builds RCCL, a UCX-enabled OpenMPI, rccl-tests and
  # the tuner example plugin, then runs test/ext-plugins pytest for the mixed and
  # CSV-tuner suites. Non-gating for now so a new suite cannot block merges while
  # it is validated on the runner.
  rccl-ext-plugins:
    name: rccl-ext-plugins
    uses: ./.github/workflows/rccl-suite.yml
    permissions:
      contents: read
      id-token: write
    with:
      suite: ext-plugins
      runs_on: '["ruby-linux-slurm-scale-runner"]'
      partition: interactive
      timeout_minutes: 300
      non_gating: true
      artifact_group: ${{ inputs.artifact_group || 'gfx950-dcgpu' }}
      artifact_run_id: ${{ inputs.artifact_run_id || '' }}
      # TheRock pinned ref committed 2026-09-02; bump when refreshing artifacts.
      therock_ref: ${{ inputs.therock_ref || '648a501e56a1e0919976d6f540b7853e63d44998' }}
      amdgpu_targets: ${{ inputs.amdgpu_targets || 'gfx950' }}

  # GIN suite (WIP) on Tensorwave. Failures show red with logs on this job.
  # non_gating keeps test failures from blocking; build/infra failures gate via
  # gin-build-gate below. AICOMRCCL-1478: enable full gating once GIN lands in develop.
  gin:
    name: GIN
    uses: ./.github/workflows/rccl-suite.yml
    permissions:
      contents: read
      id-token: write
    with:
      suite: gin
      runs_on: '["self-hosted", "tw-gfx950-ainic-ROCm-scale-runner"]'
      partition: amd-tw
      # Dedicated RCCL CI nodes on Tensorwave (mia1-p01-g[22,26,28,32]).
      reservation: rccl_ci
      timeout_minutes: 300
      non_gating: true
      artifact_group: ${{ inputs.artifact_group || 'gfx950-dcgpu' }}
      artifact_run_id: ${{ inputs.artifact_run_id || '' }}
      # TheRock pinned ref committed 2026-09-02; bump when refreshing artifacts.
      therock_ref: ${{ inputs.therock_ref || '648a501e56a1e0919976d6f540b7853e63d44998' }}
      amdgpu_targets: ${{ inputs.amdgpu_targets || 'gfx950' }}

  # Gates GIN on build/infra failures only; test failures stay non-gating (red
  # with logs on the GIN job above). AICOMRCCL-1478.
  # GATING TEMPORARILY DISABLED (`if: false`) so GIN can't block merges. To
  # re-enable, restore: if: ${{ needs.gin.outputs.build_failed == 'true' }}
  gin-build-gate:
    name: GIN build gate
    needs: gin
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "GIN build/infra failed; see the GIN job logs." >&2
          exit 1
