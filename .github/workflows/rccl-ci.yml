name: RCCL cluster CI

# Provisions ROCm + OpenMPI once on the shared /apps/rccl-ci cache, fans the RCCL
# suites (GIN, device-API) out to rccl-suite.yml, then GCs the ROCm build. ROCm
# is a version prefix (default "7.14"); lib/fetch-rocm.sh picks the greatest
# available build. See each job / component for details.

on:
  workflow_dispatch:
    inputs:
      rocm_release:
        description: 'ROCm version to fetch, matched as a prefix (e.g. "7.14" = newest 7.14.*; "7.14.0rc1" pins exactly). Empty = newest available.'
        type: string
        required: false
        default: '7.14'
      rocm_amdgpu_family:
        description: 'Specific GPU family fallback if no multi-arch tarball is found.'
        type: string
        required: false
        default: 'gfx950-dcgpu'
      amdgpu_targets:
        description: 'GPU arch for rocSHMEM/RCCL/rccl-tests (must match the ROCm family ARCH).'
        type: string
        required: false
        default: 'gfx950'
  pull_request:
    paths:
      - 'projects/rocshmem/**'
      - 'projects/rccl/**'
      - 'projects/rccl-tests/**'
      - 'projects/rccl/tools/ci/**'
      - '.github/workflows/rccl-ci.yml'
      - '.github/workflows/rccl-suite.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
  # Preference ranking (not a channel pick): the first channel that has the
  # requested version wins -- prefer GA, then RC (prerelease), then nightly.
  RCCL_ROCM_CHANNELS: 'release prerelease nightly'

jobs:
  # Download ROCm once up front: avoids the legs racing on the cache path and
  # pins them to one resolved version (the query is a prefix like "7.14").
  provision-rocm:
    name: Provision ROCm
    runs-on: ruby-linux-slurm-scale-runner
    outputs:
      rocm_release: ${{ steps.fetch.outputs.rocm_release }}
      # Resolved channel (release|prerelease|nightly), used by cleanup to decide
      # whether the build is durable or GC-able.
      rocm_channel: ${{ steps.fetch.outputs.rocm_channel }}
    env:
      ROCM_RELEASE: ${{ inputs.rocm_release || '7.14' }}
      ROCM_AMDGPU_FAMILY: ${{ inputs.rocm_amdgpu_family || 'gfx950-dcgpu' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Sparse-checkout: only the CI helper scripts are needed here.
          sparse-checkout: projects/rccl/tools/ci
      - name: Fetch ROCm
        id: fetch
        env:
          RCCL_DEVICE_API_WORKDIR: ${{ github.workspace }}
          # Reference the shared build so cleanup-rocm only GCs it once the last
          # run is done.
          ROCM_REF_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          "${{ github.workspace }}/projects/rccl/tools/ci/lib/fetch-rocm.sh"
          # shellcheck disable=SC1091
          source "${{ github.workspace }}/.ci-out/rocm.env"
          echo "rocm_release=${ROCM_RELEASE}" >> "$GITHUB_OUTPUT"
          # The resolved channel is recorded in the cache tree's .stamp.
          channel="$(sed -n 's/^channel=//p' "${ROCM_PATH}/.stamp" 2>/dev/null || true)"
          echo "rocm_channel=${channel}" >> "$GITHUB_OUTPUT"

  # Build OpenMPI once on a compute node (after ROCm), so both legs share a warm
  # cache instead of each rebuilding it / racing on the install path.
  provision-ompi:
    name: Provision OpenMPI
    needs: provision-rocm
    runs-on: ruby-linux-slurm-scale-runner
    env:
      ROCM_RELEASE: ${{ needs.provision-rocm.outputs.rocm_release }}
      ROCM_AMDGPU_FAMILY: ${{ inputs.rocm_amdgpu_family || 'gfx950-dcgpu' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Sparse-checkout: only the CI helper scripts are needed here.
          sparse-checkout: projects/rccl/tools/ci
      # fetch-rocm.sh re-resolves the version/family/channel (to locate the cache
      # tree) even on a cache hit; the public CDNs need no token.
      - name: Resolve ROCm from cache
        env:
          RCCL_DEVICE_API_WORKDIR: ${{ github.workspace }}
        run: "${{ github.workspace }}/projects/rccl/tools/ci/lib/fetch-rocm.sh"
      - name: Build OpenMPI on a compute node
        env:
          RCCL_DEVICE_API_WORKDIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          export RCCL_DEVICE_API_CACHE="${RCCL_DEVICE_API_CACHE:-/apps/rccl-ci}"
          python3 "${{ github.workspace }}/projects/rccl/tools/ci/lib/submit_slurm_job.py" \
            --script "${{ github.workspace }}/projects/rccl/tools/ci/lib/build-ompi.sbatch" \
            --chdir "${{ github.workspace }}/.ci-out/ompi-logs" \
            --export "ALL,RCCL_DEVICE_API_WORKDIR,RCCL_DEVICE_API_CACHE,ROCM_RELEASE,ROCM_AMDGPU_FAMILY"

  # Both legs use the one generic launcher; `suite` picks lib/<suite>.sbatch.
  # rocm_release pins the exact version provision resolved (the leg re-runs the
  # same cascade to locate the cached tree). GIN is non-gating.
  gin:
    name: GIN
    needs: [provision-rocm, provision-ompi]
    uses: ./.github/workflows/rccl-suite.yml
    with:
      suite: gin
      non_gating: true
      timeout_minutes: 300
      rocm_release: ${{ needs.provision-rocm.outputs.rocm_release }}
      rocm_amdgpu_family: ${{ inputs.rocm_amdgpu_family || 'gfx950-dcgpu' }}
      amdgpu_targets: ${{ inputs.amdgpu_targets || 'gfx950' }}

  device-api:
    name: device-API
    needs: [provision-rocm, provision-ompi]
    uses: ./.github/workflows/rccl-suite.yml
    with:
      suite: device-api
      timeout_minutes: 240
      rocm_release: ${{ needs.provision-rocm.outputs.rocm_release }}
      rocm_amdgpu_family: ${{ inputs.rocm_amdgpu_family || 'gfx950-dcgpu' }}
      amdgpu_targets: ${{ inputs.amdgpu_targets || 'gfx950' }}

  # Release this run's ROCm reference (always) and GC the build if unreferenced;
  # rocm-ref.sh only touches the local cache, so no network resolution is needed.
  cleanup-rocm:
    name: Cleanup ROCm
    needs: [provision-rocm, gin, device-api]
    if: always()
    runs-on: ruby-linux-slurm-scale-runner
    env:
      ROCM_RELEASE: ${{ needs.provision-rocm.outputs.rocm_release }}
      # Resolved channel drives GC: rocm-ref.sh only deletes nightly builds;
      # RC/release trees are kept warm on the shared cache.
      ROCM_RELEASE_CHANNEL: ${{ needs.provision-rocm.outputs.rocm_channel }}
      ROCM_AMDGPU_FAMILY: ${{ inputs.rocm_amdgpu_family || 'gfx950-dcgpu' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Sparse-checkout: only the CI helper scripts are needed here.
          sparse-checkout: projects/rccl/tools/ci
      - name: Release ROCm reference and GC if unused
        env:
          ROCM_REF_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          "${{ github.workspace }}/projects/rccl/tools/ci/lib/rocm-ref.sh" release-gc
