name: rocprofiler-sdk Continuous Integration

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'projects/rocprofiler-sdk/**'
      - '!projects/rocprofiler-sdk/*.md'
      - '!projects/rocprofiler-sdk/**/README.md'
      - '!projects/rocprofiler-sdk/CODEOWNERS'
      - '!projects/rocprofiler-sdk/source/docs/**'
      - '.github/workflows/rocprofiler-sdk-continuous_integration.yml'
  pull_request:
    paths:
      - 'projects/rocprofiler-sdk/**'
      - '!projects/rocprofiler-sdk/*.md'
      - '!projects/rocprofiler-sdk/**/README.md'
      - '!projects/rocprofiler-sdk/CODEOWNERS'
      - '!projects/rocprofiler-sdk/source/docs/**'
      - '.github/workflows/rocprofiler-sdk-continuous_integration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # TODO(jrmadsen): replace LD_RUNPATH_FLAG, GPU_TARGETS, etc. with internal handling in cmake
  ROCM_PATH: "/opt/rocm"
  GPU_TARGETS: "gfx900 gfx906 gfx908 gfx90a gfx940 gfx941 gfx942 gfx950 gfx1030 gfx1100 gfx1101 gfx1102 gfx1201"
  PATH: "/usr/bin:$PATH"
  CDASH_URL: "https://my.cdash.org/submit.php?project=rocprofiler-sdk"
  ## No tests should be excluded here except for extreme emergencies; tests should only be disabled in CMake
  ## A task should be assigned directly to fix the issues
  ## Scratch memory tests need to be fixed for ROCm 7.0 release
  navi3_EXCLUDE_TESTS_REGEX: ""
  vega20_EXCLUDE_TESTS_REGEX: ""
  mi200_EXCLUDE_TESTS_REGEX: ""
  mi300_EXCLUDE_TESTS_REGEX: ""
  mi300a_EXCLUDE_TESTS_REGEX: ""
  mi325_EXCLUDE_TESTS_REGEX: ""
  mi3xx_EXCLUDE_TESTS_REGEX: ""
  navi4_EXCLUDE_TESTS_REGEX: ""
  navi3_EXCLUDE_LABEL_REGEX: ""
  vega20_EXCLUDE_LABEL_REGEX: ""
  mi200_EXCLUDE_LABEL_REGEX: ""
  mi300_EXCLUDE_LABEL_REGEX: ""
  mi300a_EXCLUDE_LABEL_REGEX: ""
  mi325_EXCLUDE_LABEL_REGEX: ""
  mi3xx_EXCLUDE_LABEL_REGEX: ""
  navi4_EXCLUDE_LABEL_REGEX: ""
  GLOBAL_CMAKE_OPTIONS: ""

jobs:
  core-deb:
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    strategy:
      fail-fast: false
      matrix:
        system: [
          {gpu: 'navi4', runner: 'rocprofiler-navi4-dind', os: 'ubuntu-22.04', build-type: 'RelWithDebInfo', therock-s3: "gfx120X", ci-flags: '--linter clang-tidy', gpu-target: "gfx1201"},
          {gpu: 'navi3', runner: 'rocprofiler-navi3-dind', os: 'ubuntu-22.04', build-type: 'RelWithDebInfo', therock-s3: "gfx110X", ci-flags: '--linter clang-tidy', gpu-target: "gfx1101"},
          {gpu: 'mi325', runner: 'linux-mi325-1gpu-ossci-rocm', os: 'ubuntu-22.04', build-type: 'RelWithDebInfo', therock-s3: "gfx94X", ci-flags: '--linter clang-tidy', gpu-target: "gfx942"}
        ]

    runs-on: ${{ matrix.system.runner }}
    container:
      image: rocm/dev-ubuntu-22.04:latest
      env:
        DEBIAN_FRONTEND: noninteractive
      options: --privileged

    # define this for containers
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      CORE_EXT_RUNNER: mi325
      GPU_RUNNER: ${{ matrix.system.gpu }}

    steps:
    - name: Install Latest ROCm
      shell: bash
      working-directory: /tmp
      run: |
        apt-get update
        apt-get install -y curl wget python3 python3-pip build-essential coreutils software-properties-common
        add-apt-repository ppa:git-core/ppa
        apt-get update
        apt-get install -y git
        python3 -m pip install awscli
        export PATH=/usr/local/bin:~/.local/bin:$PATH
        KEY=$(aws s3api list-objects-v2 \
          --bucket therock-nightly-tarball \
          --no-sign-request \
          --output json \
          --query "sort_by(Contents[?contains(Key, 'linux-${{ matrix.system.therock-s3 }}')], &LastModified)[-1].Key")
        KEY=${KEY//\"/}
        test -n "$KEY" || { echo "No ${{ matrix.system.therock-s3 }} tarball found"; exit 1; }
        aws s3 cp "s3://therock-nightly-tarball/${KEY}" rocm.tar.gz --no-sign-request
        ls -lh rocm.tar.gz
        echo "Downloaded: ${KEY}"
        export ORIGINAL_ROCM_PATH=$(realpath /opt/rocm)
        rm -rf /opt/rocm
        mkdir -p ${{ env.ROCM_PATH }}
        tar -xf *.tar.gz -C ${{ env.ROCM_PATH }}
        ln -s ${ORIGINAL_ROCM_PATH}/llvm/lib/libomptarget* ${{ env.ROCM_PATH }}/llvm/lib/.
        ln -s ${ORIGINAL_ROCM_PATH}/llvm/bin/clang-linker-wrapper ${{ env.ROCM_PATH }}/llvm/bin/.
        ln -s ${{ env.ROCM_PATH }}/llvm/amdgcn ${{ env.ROCM_PATH }}/.
        ln -s ${ORIGINAL_ROCM_PATH}/llvm/bin/amdclang* ${{ env.ROCM_PATH }}/bin/.
        apt-get install -y libva-amdgpu-dev

    - name: Checkout
      uses: actions/checkout@v5
      with:
        sparse-checkout: projects/rocprofiler-sdk
        submodules: true
        set-safe-directory: true

    - name: Clone ROCDecode
      uses: actions/checkout@v5
      with:
        repository: 'ROCm/rocDecode'
        ref: 'release/rocm-rel-7.0'
        set-safe-directory: true
        path: 'rocDecode'

    - name: Clone ROCJPEG
      uses: actions/checkout@v5
      with:
        repository: 'ROCm/rocJPEG'
        ref: 'release/rocm-rel-7.0'
        set-safe-directory: true
        path: 'rocJPEG'

    - name: Install requirements
      timeout-minutes: 10
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        apt-get install -y g++-11 g++-12 cmake python3-pip libdw-dev libsqlite3-dev libdrm-dev file autoconf pkg-config rpm libzstd-dev
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 10 --slave /usr/bin/g++ g++ /usr/bin/g++-11 --slave /usr/bin/gcov gcov /usr/bin/gcov-11
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 20 --slave /usr/bin/g++ g++ /usr/bin/g++-12 --slave /usr/bin/gcov gcov /usr/bin/gcov-12
        python3 -m pip install -U --user -r requirements.txt
        rm -rf ${{ env.ROCM_PATH }}/lib/*rocprofiler-sdk* ${{ env.ROCM_PATH }}/lib/cmake/*rocprofiler-sdk* ${{ env.ROCM_PATH }}/share/*rocprofiler-sdk* ${{ env.ROCM_PATH }}/libexec/*rocprofiler-sdk* ${{ env.ROCM_PATH }}*/lib/python*/site-packages/roctx ${{ env.ROCM_PATH }}*/lib/python*/site-packages/rocpd

    - name: Special Requirements
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
          echo 'CMAKE_HIP_PLATFORM=amd' >> $GITHUB_ENV
          echo 'HIP_PLATFORM=amd' >> $GITHUB_ENV
          echo 'HIP_RUNTIME=rocclr' >> $GITHUB_ENV
          echo 'HIP_COMPILER=clang++' >> $GITHUB_ENV
          echo 'LLVM_PATH=/opt/rocm/llvm' >> $GITHUB_ENV

    - name: Install Missing ROCm Dependencies
      shell: bash
      run: |
        echo -e "Building & Installing ROCDecode..."
        cmake -B build-rocdecode -DCMAKE_INSTALL_PREFIX=${{ env.ROCM_PATH }} -DCMAKE_PREFIX_PATH=${{ env.ROCM_PATH }} -DCMAKE_CXX_COMPILER=${{ env.ROCM_PATH }}/bin/amdclang++ ${GITHUB_WORKSPACE}/rocDecode
        cmake --build build-rocdecode --target all --parallel 16
        cmake --build build-rocdecode --target install
        echo -e "ROCDecode Installed Successfully!"
        echo -e "Building & Installing ROCJPEG..."
        cmake -B build-rocjpeg -DCMAKE_INSTALL_PREFIX=${{ env.ROCM_PATH }} -DCMAKE_PREFIX_PATH=${{ env.ROCM_PATH }} -DCMAKE_CXX_COMPILER=${{ env.ROCM_PATH }}/bin/amdclang++ ${GITHUB_WORKSPACE}/rocJPEG
        cmake --build build-rocjpeg --target all --parallel 16
        cmake --build build-rocjpeg --target install
        echo -e "ROCJPEG Installed Successfully!"

    - name: List Files
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        echo "PATH: ${PATH}"
        echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"
        which-realpath() { echo -e "\n$1 resolves to $(realpath $(which $1))"; echo "$($(which $1) --version &> /dev/stdout | head -n 1)"; }
        for i in python3 git cmake ctest gcc g++ gcov; do which-realpath $i; done
        cat ${{ env.ROCM_PATH }}/.info/version
        ls -la

    - name: Enable PC Sampling
      if: ${{ contains(matrix.system.runner, 'mi200') || contains(matrix.system.runner, 'mi300a') }}
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run:
          echo 'ROCPROFILER_PC_SAMPLING_BETA_ENABLED=1' >> $GITHUB_ENV

    - name: Configure, Build, and Test
      timeout-minutes: 30
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run:
        PATH=${{ env.ROCM_PATH }}/bin:$PATH
        LD_LIBRARY_PATH=${{ env.ROCM_PATH }}/lib:$LD_LIBRARY_PATH
        /usr/bin/python3 ./source/scripts/run-ci.py -B build
          --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-core
          --build-jobs 16
          --site ${{ matrix.system.runner }}
          --run-attempt ${{ github.run_attempt }}
          --
          -DROCPROFILER_DEP_ROCMCORE=ON
          -DROCPROFILER_BUILD_DOCS=OFF
          -DCMAKE_BUILD_TYPE=${{ matrix.system.build-type }}
          -DCMAKE_INSTALL_PREFIX=/opt/rocprofiler-sdk
          -DCPACK_GENERATOR='DEB;RPM;TGZ'
          -DCPACK_PACKAGING_INSTALL_PREFIX='${{ env.ROCM_PATH }}'
          -DCMAKE_PREFIX_PATH='${{ env.ROCM_PATH }};${{ env.ROCM_PATH }}/llvm'
          -DPython3_EXECUTABLE='/usr/bin/python3'
          -DOPENMP_GPU_TARGETS="${{ matrix.system.gpu-target }}"
          ${{ env.GLOBAL_CMAKE_OPTIONS }}
          --
          -LE "${${{ matrix.system.runner }}_EXCLUDE_LABEL_REGEX}"
          -E "${${{ matrix.system.runner }}_EXCLUDE_TESTS_REGEX}"

    - name: Install
      if: ${{ contains(matrix.system.runner, env.CORE_EXT_RUNNER) }}
      timeout-minutes: 10
      working-directory: projects/rocprofiler-sdk
      run:
        cmake --build build --target install --parallel 16

    - name: Build Packaging
      if: ${{ contains(matrix.system.runner, env.CORE_EXT_RUNNER) }}
      timeout-minutes: 10
      working-directory: projects/rocprofiler-sdk
      run:
        cmake --build build --target package --parallel 16

    - name: Test Install Build
      if: ${{ contains(matrix.system.runner, env.CORE_EXT_RUNNER) }}
      timeout-minutes: 20
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        CMAKE_PREFIX_PATH=/opt/rocprofiler-sdk cmake -B build-samples -DOPENMP_GPU_TARGETS="${{ matrix.system.gpu-target }}" samples
        CMAKE_PREFIX_PATH=/opt/rocprofiler-sdk cmake -B build-tests -DOPENMP_GPU_TARGETS="${{ matrix.system.gpu-target }}" -DGPU_TARGETS="gfx942" tests
        export LD_LIBRARY_PATH=/opt/rocprofiler-sdk/lib:${LD_LIBRARY_PATH}
        cmake --build build-samples --target all --parallel 16
        cmake --build build-tests --target all --parallel 16
        ctest --test-dir build-samples -LE "${${{ matrix.system.runner }}_EXCLUDE_LABEL_REGEX}" -E "${${{ matrix.system.runner }}_EXCLUDE_TESTS_REGEX}" --output-on-failure
        ctest --test-dir build-tests -LE "${${{ matrix.system.runner }}_EXCLUDE_LABEL_REGEX}" -E "${${{ matrix.system.runner }}_EXCLUDE_TESTS_REGEX}" --output-on-failure

    - name: Install Packages
      if: ${{ contains(matrix.system.runner, env.CORE_EXT_RUNNER) }}
      timeout-minutes: 5
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        export PATH=${PATH}:/usr/local/sbin:/usr/sbin:/sbin
        ls -la
        ls -la ./build
        dpkg --force-all -i ./build/rocprofiler-sdk-roctx_*.deb
        dpkg --force-all -i ./build/rocprofiler-sdk-rocpd_*.deb
        for i in $(ls -S ./build/rocprofiler-sdk*.deb | egrep -v 'roctx|rocpd'); do dpkg --force-all -i ${i}; done;

    - name: Test Installed Packages
      if: ${{ contains(matrix.system.runner, env.CORE_EXT_RUNNER) }}
      timeout-minutes: 20
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        CMAKE_PREFIX_PATH=${{ env.ROCM_PATH }} cmake -B build-samples-deb -DOPENMP_GPU_TARGETS="${{ matrix.system.gpu-target }}" ${{ env.ROCM_PATH }}/share/rocprofiler-sdk/samples
        CMAKE_PREFIX_PATH=${{ env.ROCM_PATH }} cmake -B build-tests-deb -DOPENMP_GPU_TARGETS="${{ matrix.system.gpu-target }}" -DGPU_TARGETS="${{ matrix.system.gpu-target }}" ${{ env.ROCM_PATH }}/share/rocprofiler-sdk/tests
        cmake --build build-samples-deb --target all --parallel 16
        cmake --build build-tests-deb --target all --parallel 16
        ctest --test-dir build-samples-deb -LE "${${{ matrix.system.runner }}_EXCLUDE_LABEL_REGEX}" -E "${${{ matrix.system.runner }}_EXCLUDE_TESTS_REGEX}" --output-on-failure
        ctest --test-dir build-tests-deb -LE "${${{ matrix.system.runner }}_EXCLUDE_LABEL_REGEX}" -E "${${{ matrix.system.runner }}_EXCLUDE_TESTS_REGEX}" --output-on-failure

    - name: Archive production artifacts
      if: ${{ github.event_name == 'workflow_dispatch' && contains(matrix.system.runner, env.CORE_EXT_RUNNER) }}
      uses: actions/upload-artifact@v4
      with:
        name: installers-deb
        path: |
          ${{github.workspace}}/build/*.deb
          ${{github.workspace}}/build/*.rpm
          ${{github.workspace}}/build/*.tgz

  core-rpm:
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    strategy:
      fail-fast: false
      matrix:
        runner: ['mi300']
        os: ['rhel-9.1', 'sles-15.4']
        build-type: ['RelWithDebInfo']
        ci-flags: ['']

    runs-on: linux-mi325-1gpu-ossci-rocm
    container:
      image: rocm/rocprofiler-private:${{ matrix.os }}
      credentials:
        username: ${{ secrets.ROCPROFILER_AZURE_CI_USER }}
        password: ${{ secrets.ROCPROFILER_AZURE_CI_PASS }}
      options: --privileged

    # define this for containers
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      OS_TYPE: ${{ matrix.os }}

    steps:
    - name: Install Latest ROCm
      shell: bash
      working-directory: /tmp
      run: |
        python3 -m pip install --upgrade pip pipx
        python3 -m pipx install awscli
        python3 -m pipx ensurepath
        source ~/.bashrc
        KEY=$(aws s3api list-objects-v2 \
          --bucket therock-nightly-tarball \
          --no-sign-request \
          --output json \
          --query "sort_by(Contents[?contains(Key, 'linux-gfx94X')], &LastModified)[-1].Key")
        KEY=${KEY//\"/}
        test -n "$KEY" || { echo "No gfx94X tarball found"; exit 1; }
        aws s3 cp "s3://therock-nightly-tarball/${KEY}" rocm.tar.gz --no-sign-request
        ls -lh rocm.tar.gz
        echo "Downloaded: ${KEY}"
        sudo mkdir -p ${{ env.ROCM_PATH }}
        sudo tar -xf *.tar.gz -C ${{ env.ROCM_PATH }}

    - name: Install Latest AMDGPU RHEL 9.1
      if: ${{ matrix.os == 'rhel-9.1' }}
      shell: bash
      working-directory: /tmp
      run: |
        sudo dnf install https://repo.radeon.com/amdgpu-install/latest/rhel/9.1/$(curl -s https://repo.radeon.com/amdgpu-install/latest/rhel/9.1/ | grep -E '\.rpm"' | sed 's/.*href="//; s/".*//' | sort)
        sudo dnf clean all
        sudo dnf install -y llvm-amdgpu-devel llvm-amdgpu llvm-amdgpu-devel llvm-amdgpu llvm llvm-toolset clang-tools-extra libomp-devel

    - name: Install Latest AMDGPU SLES 15.4
      if: ${{ matrix.os == 'sles-15.4' }}
      shell: bash
      working-directory: /tmp
      run: |
        sudo zypper install -y zypper
        sudo zypper --no-gpg-checks install -y https://repo.radeon.com/amdgpu-install/latest/sle/15.7/$(curl -s https://repo.radeon.com/amdgpu-install/latest/sle/15.7/ | grep -E '\.rpm"' | sed 's/.*href="//; s/".*//' | sort)
        sudo zypper --gpg-auto-import-keys refresh
        sudo zypper remove -y llvm7
        sudo zypper install -y llvm-amdgpu-devel llvm-amdgpu llvm-amdgpu-devel llvm-amdgpu llvm19 llvm19-devel llvm19-opt-viewer

    - name: Checkout
      uses: actions/checkout@v4
      with:
        sparse-checkout: projects/rocprofiler-sdk

    - name: Install requirements
      timeout-minutes: 10
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        python3 -m pip install -U --user -r requirements.txt
        python3 -m pip install -U pip pipx
        python3 -m pipx install cmake
        sudo rm -rf ${{ env.ROCM_PATH }}/lib/*rocprofiler-sdk* ${{ env.ROCM_PATH }}/lib/cmake/*rocprofiler-sdk* ${{ env.ROCM_PATH }}/share/*rocprofiler-sdk* ${{ env.ROCM_PATH }}/libexec/*rocprofiler-sdk*

    - name: Special Requirements
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
          echo 'CMAKE_HIP_PLATFORM=amd' >> $GITHUB_ENV
          echo 'HIP_PLATFORM=amd' >> $GITHUB_ENV
          echo 'HIP_RUNTIME=rocclr' >> $GITHUB_ENV
          echo 'HIP_COMPILER=clang++' >> $GITHUB_ENV
          echo 'DEVICE_LIB_PATH=${{ env.ROCM_PATH }}/llvm/amdgcn/bitcode' >> $GITHUB_ENV
          echo 'HIP_DEVICE_LIB_PATH=${{ env.ROCM_PATH }}/llvm/amdgcn/bitcode' >> $GITHUB_ENV
          echo 'LLVM_PATH=/usr' >> $GITHUB_ENV

    - name: List Files
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        echo "PATH: ${PATH}"
        echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"
        which-realpath() { echo -e "\n$1 resolves to $(realpath $(which $1))"; echo "$($(which $1) --version &> /dev/stdout | head -n 1)"; }
        for i in python3 git cmake ctest gcc g++ gcov; do which-realpath $i; done
        cat ${{ env.ROCM_PATH }}/.info/version
        ls -la

    - name: Enable PC Sampling
      if: ${{ contains(matrix.runner, 'mi200') || contains(matrix.runner, 'mi300a') }}
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run:
          echo 'ROCPROFILER_PC_SAMPLING_BETA_ENABLED=1' >> $GITHUB_ENV

    - name: Configure, Build, and Test
      timeout-minutes: 30
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run:
        python3 -m pipx ensurepath; source ~/.bashrc;
        LD_LIBRARY_PATH=${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/llvm/lib:$LD_LIBRARY_PATH
        PATH=${{ env.ROCM_PATH }}/bin:${{ env.ROCM_PATH }}/llvm/bin:/usr/bin:$PATH
        /usr/bin/python3 ./source/scripts/run-ci.py -B build
          --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.runner }}-core
          --build-jobs 16
          --site linux-mi325-1gpu-ossci-rocm
          --run-attempt ${{ github.run_attempt }}
          ${{ matrix.ci-flags }}
          --
          -DOMP_TARGET_COMPILER=/usr/bin/clang++
          -DROCPROFILER_DEP_ROCMCORE=ON
          -DROCPROFILER_BUILD_DOCS=OFF
          -DOPENMP_GPU_TARGETS=''
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DCMAKE_PREFIX_PATH='${{ env.ROCM_PATH }};${{ env.ROCM_PATH }}/llvm'
          -DPython3_EXECUTABLE=$(which python3)
          ${{ env.GLOBAL_CMAKE_OPTIONS }}
          --
          -LE "${${{ matrix.runner }}_EXCLUDE_LABEL_REGEX}"
          -E "${${{ matrix.runner }}_EXCLUDE_TESTS_REGEX}"

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        runner: ['mi325']
        sanitizer: ['AddressSanitizer', 'ThreadSanitizer', 'LeakSanitizer', 'UndefinedBehaviorSanitizer']
        os: ['ubuntu-22.04']
        build-type: ['RelWithDebInfo']

    if: ${{ contains(github.event_name, 'pull_request') }}
    runs-on: linux-mi325-1gpu-ossci-rocm
    container:
      image: rocm/dev-ubuntu-22.04:latest
      env:
        DEBIAN_FRONTEND: noninteractive
      options: --privileged

    # define this for containers
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      GCC_COMPILER_VERSION: 13

    steps:
    - name: Install Latest ROCm
      shell: bash
      working-directory: /tmp
      run: |
        apt-get update
        apt-get install -y curl wget python3 python3-pip build-essential coreutils software-properties-common
        add-apt-repository ppa:git-core/ppa
        apt-get update
        apt-get install -y git
        python3 -m pip install awscli
        export PATH=/usr/local/bin:~/.local/bin:$PATH
        KEY=$(aws s3api list-objects-v2 \
          --bucket therock-dev-tarball \
          --no-sign-request \
          --output json \
          --query "sort_by(Contents[?contains(Key, 'linux-gfx94X')], &LastModified)[-1].Key")
        KEY=${KEY//\"/}
        test -n "$KEY" || { echo "No gfx94X tarball found"; exit 1; }
        aws s3 cp "s3://therock-dev-tarball/${KEY}" rocm.tar.gz --no-sign-request
        ls -lh rocm.tar.gz
        echo "Downloaded: ${KEY}"
        export ORIGINAL_ROCM_PATH=$(realpath /opt/rocm)
        rm -rf /opt/rocm
        mkdir -p ${{ env.ROCM_PATH }}
        tar -xf *.tar.gz -C ${{ env.ROCM_PATH }}
        ln -s ${ORIGINAL_ROCM_PATH}/llvm/lib/libomptarget* ${{ env.ROCM_PATH }}/llvm/lib/.
        ln -s ${ORIGINAL_ROCM_PATH}/llvm/bin/clang-linker-wrapper ${{ env.ROCM_PATH }}/llvm/bin/.
        ln -s ${{ env.ROCM_PATH }}/llvm/amdgcn ${{ env.ROCM_PATH }}/.
        ln -s ${ORIGINAL_ROCM_PATH}/llvm/bin/amdclang* ${{ env.ROCM_PATH }}/bin/.

    - name: Checkout
      uses: actions/checkout@v4
      with:
        sparse-checkout: projects/rocprofiler-sdk
        submodules: true
        set-safe-directory: true

    - name: Install requirements
      timeout-minutes: 10
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        add-apt-repository ppa:ubuntu-toolchain-r/test
        apt-get update
        apt-get install -y llvm-14 llvm-14-linker-tools clang-tools-14 libomp-14-dev llvm-amdgpu-dev llvm-amdgpu
        rm -rf ${{ env.ROCM_PATH }}/lib/*rocprofiler-sdk* ${{ env.ROCM_PATH }}/lib/cmake/*rocprofiler-sdk* ${{ env.ROCM_PATH }}/share/*rocprofiler-sdk* ${{ env.ROCM_PATH }}/libexec/*rocprofiler-sdk* ${{ env.ROCM_PATH }}*/lib/python*/site-packages/roctx ${{ env.ROCM_PATH }}*/lib/python*/site-packages/rocpd
        apt-get install -y build-essential cmake python3-pip libasan8 libtsan2 software-properties-common clang-15 libdw-dev libsqlite3-dev libdrm-dev file autoconf pkg-config libomp-14-dev
        apt-get upgrade -y
        apt-get install -y gcc-${{ env.GCC_COMPILER_VERSION }} g++-${{ env.GCC_COMPILER_VERSION }}
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_COMPILER_VERSION }} 100 --slave /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_COMPILER_VERSION }} --slave /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_COMPILER_VERSION }}
        python3 -m pip install -U --user -r requirements.txt

    - name: List Files
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        which-realpath() { echo -e "\n$1 resolves to $(realpath $(which $1))"; echo "$($(which $1) --version &> /dev/stdout | head -n 1)"; }
        for i in python3 git cmake ctest gcc g++ gcov; do which-realpath $i; done
        cat ${{ env.ROCM_PATH }}/.info/version
        ls -la

    - name: Enable PC Sampling
      if: ${{ contains(matrix.runner, 'mi200') || contains(matrix.runner, 'mi300a') }}
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: echo 'ROCPROFILER_PC_SAMPLING_BETA_ENABLED=1' >> $GITHUB_ENV

    - name: Special Requirements
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
          echo 'CMAKE_HIP_PLATFORM=amd' >> $GITHUB_ENV
          echo 'HIP_PLATFORM=amd' >> $GITHUB_ENV
          echo 'HIP_RUNTIME=rocclr' >> $GITHUB_ENV
          echo 'HIP_COMPILER=clang++' >> $GITHUB_ENV
          echo 'LLVM_PATH=${{ env.ROCM_PATH }}/llvm' >> $GITHUB_ENV

    - name: Configure, Build, and Test
      timeout-minutes: 45
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run:
        PATH=${{ env.ROCM_PATH }}/bin:$PATH
        LD_LIBRARY_PATH=${{ env.ROCM_PATH }}/lib:$LD_LIBRARY_PATH
        /usr/bin/python3 ./source/scripts/run-ci.py -B build
          --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.runner }}-${{ matrix.sanitizer }}
          --build-jobs 16
          --site linux-mi325-1gpu-ossci-rocm
          --memcheck ${{ matrix.sanitizer }}
          --run-attempt ${{ github.run_attempt }}
          --
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DCMAKE_INSTALL_PREFIX="${{ env.ROCM_PATH }}"
          -DOPENMP_GPU_TARGETS="gfx942"
          -DCPACK_PACKAGING_INSTALL_PREFIX='${{ env.ROCM_PATH }}'
          -DCMAKE_PREFIX_PATH='${{ env.ROCM_PATH }};${{ env.ROCM_PATH }}/llvm'
          -DPython3_EXECUTABLE=$(which python3)
          ${{ env.GLOBAL_CMAKE_OPTIONS }}
          --
          -LE "${${{ matrix.runner }}_EXCLUDE_LABEL_REGEX}"
          -E "${${{ matrix.runner }}_EXCLUDE_TESTS_REGEX}"
