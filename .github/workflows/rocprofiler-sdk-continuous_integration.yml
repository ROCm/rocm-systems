name: rocprofiler-sdk Continuous Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [ develop ]
    paths:
      - 'projects/rocprofiler-sdk/**'
      - '.github/workflows/rocprofiler-sdk-continuous_integration.yml'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-sdk/CODEOWNERS'
      - '!projects/rocprofiler-sdk/source/docs/**'
  pull_request:
    paths:
      - 'projects/rocprofiler-sdk/**'
      - '.github/workflows/rocprofiler-sdk-continuous_integration.yml'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-sdk/CODEOWNERS'
      - '!projects/rocprofiler-sdk/source/docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Needed to push/pull cached Docker layers + GHCR images
permissions:
  contents: read
  packages: write

env:
  # TODO(jrmadsen): replace LD_RUNPATH_FLAG, GPU_TARGETS, etc. with internal handling in cmake
  ROCM_PATH: "/opt/rocm"
  PYTHON_VENV_PATH: "rocprofiler-sdk"
  PYTHON_VENV_ACTIVATE: "rocprofiler-sdk/bin/activate"
  GPU_TARGETS: "gfx906 gfx908 gfx90a gfx942 gfx950 gfx1030 gfx1100 gfx1101 gfx1102 gfx1201"
  PATH: "/usr/bin:$PATH"

  ## No tests should be excluded here except for extreme emergencies; tests should only be disabled in CMake
  ## A task should be assigned directly to fix the issues
  ## Scratch memory tests need to be fixed for ROCm 7.0 release
  navi3_EXCLUDE_TESTS_REGEX: ""
  vega20_EXCLUDE_TESTS_REGEX: ""
  mi200_EXCLUDE_TESTS_REGEX: ""
  mi300_EXCLUDE_TESTS_REGEX: ""
  mi300a_EXCLUDE_TESTS_REGEX: ""
  mi325_EXCLUDE_TESTS_REGEX: ""
  mi3xx_EXCLUDE_TESTS_REGEX: ""
  navi4_EXCLUDE_TESTS_REGEX: ""

  navi3_EXCLUDE_LABEL_REGEX: ""
  vega20_EXCLUDE_LABEL_REGEX: ""
  mi200_EXCLUDE_LABEL_REGEX: ""
  mi300_EXCLUDE_LABEL_REGEX: ""
  mi300a_EXCLUDE_LABEL_REGEX: ""
  mi325_EXCLUDE_LABEL_REGEX: ""
  mi3xx_EXCLUDE_LABEL_REGEX: ""
  navi4_EXCLUDE_LABEL_REGEX: ""

  GLOBAL_CMAKE_OPTIONS: ""
  ENABLE_ROCR_BUILD: "true"
  ENABLE_HIP_CLR_BUILD: "true"
  ENABLE_ROCPROFILER_REGISTER_BUILD: "true"
  ENABLE_AQLPROFILE_BUILD: "true"
  ENABLE_ROCDECODE_BUILD: "true"
  ENABLE_ROCJPEG_BUILD: "true"
  INSTALL_NIGHTLY_ROCM: "true"

  CI_MODE: ${{ github.event_name == 'schedule' && 'Nightly' || 'Continuous' }}
jobs:
  # =============================================================================
  # BUILD JOBS - Run on CPU runners to avoid blocking GPU queues
  # =============================================================================

  # -----------------------------------------------------------------------------
  # Ubuntu / DEB Build job(s)
  # -----------------------------------------------------------------------------
  build-deb:
    name: Build • ${{ matrix.system.gpu }} • ${{ matrix.system.os }}
    strategy:
      fail-fast: false
      matrix:
        system:
          # TEMPORARILY DISABLED: navi3/navi4 jobs pending CI stabilization
          # - { gpu: 'navi4', os: 'ubuntu-22.04', build-type: 'RelWithDebInfo', ci-flags: '--linter clang-tidy', gpu-target: 'gfx120X' }
          # - { gpu: 'navi3', os: 'ubuntu-22.04', build-type: 'RelWithDebInfo', ci-flags: '--linter clang-tidy', gpu-target: 'gfx110X' }
          - { gpu: 'mi325', os: 'ubuntu-22.04', build-type: 'RelWithDebInfo', ci-flags: '--linter clang-tidy', gpu-target: 'gfx94X' }
    runs-on: azure-linux-scale-rocm
    container:
      image: docker.io/rocm/rocprofiler-private:${{ matrix.system.os }}-${{ matrix.system.gpu-target }}-latest
      credentials:
        username: ${{ secrets.ROCPROFILER_AZURE_CI_USER }}
        password: ${{ secrets.ROCPROFILER_AZURE_CI_PASS }}
      env:
        DEBIAN_FRONTEND: noninteractive
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      CORE_EXT_RUNNER: mi325
      GPU_RUNNER: ${{ matrix.system.gpu }}
    steps:
      - name: Clone ROCProfiler SDK & AQLProfile & ROCProfiler Register & ROCR-Runtime & Trace Decoder
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/actions/rocprofiler-sdk-util

            projects/rocprofiler-sdk
            projects/aqlprofile
            projects/rocprofiler-register
            projects/rocprof-trace-decoder
            projects/rocr-runtime
            projects/clr
            projects/hip
          submodules: false
          set-safe-directory: true

      - name: Compute submodule cache key
        id: submods
        shell: bash
        run: |
          git --version
          git config --global --add safe.directory '*'
          git submodule status --recursive | awk '{print $1,$2}' > .git-submodules-status
          echo "hash=$(sha256sum .git-submodules-status | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          git config --file .gitmodules --get-regexp path | awk '{print $2}' > .git-submodule-paths
          { echo "paths<<EOF"; cat .git-submodule-paths; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Restore submodule cache
        uses: actions/cache@v4
        with:
          path: |
            .git/modules
            ${{ steps.submods.outputs.paths }}
          key: submods-${{ runner.os }}-${{ steps.submods.outputs.hash }}
          restore-keys: |
            submods-${{ runner.os }}-
            submods-

      - name: Init/Update submodules
        run: git submodule update --init --recursive --jobs 16

      - name: Clone ROCDecode
        uses: actions/checkout@v6
        with:
          repository: 'ROCm/rocDecode'
          ref: 'release/rocm-rel-7.0'
          set-safe-directory: true
          path: 'rocDecode'

      - name: Clone ROCJPEG
        uses: actions/checkout@v6
        with:
          repository: 'ROCm/rocJPEG'
          ref: 'release/rocm-rel-7.0'
          set-safe-directory: true
          path: 'rocJPEG'

      - name: Install requirements
        timeout-minutes: 10
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: |
          git config --global --add safe.directory '*'
          apt-get update
          apt-get install -y g++-11 g++-12 cmake python3-pip libdw-dev libsqlite3-dev libdrm-dev file autoconf pkg-config rpm libzstd-dev
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 10 --slave /usr/bin/g++ g++ /usr/bin/g++-11 --slave /usr/bin/gcov gcov /usr/bin/gcov-11
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 20 --slave /usr/bin/g++ g++ /usr/bin/g++-12 --slave /usr/bin/gcov gcov /usr/bin/gcov-12
          python3 -m pip install -U --user -r requirements.txt
          python3 -m pip install -U --user cmake==3.24.0

      - name: Build ROCProfiler SDK Dependencies
        uses: ./.github/actions/rocprofiler-sdk-util
        with:
          rocm-path: ${{ env.ROCM_PATH }}
          gpu-target: ${{ matrix.system.gpu-target }}
          compiler-launcher: /usr/bin/ccache
          enable-rocr-build: ${{ env.ENABLE_ROCR_BUILD }}
          enable-hip-clr-build: ${{ env.ENABLE_HIP_CLR_BUILD }}
          enable-rocprofiler-register-build: ${{ env.ENABLE_ROCPROFILER_REGISTER_BUILD }}
          enable-aqlprofile-build: ${{ env.ENABLE_AQLPROFILE_BUILD }}
          enable-rocdecode-build: ${{ env.ENABLE_ROCDECODE_BUILD }}
          enable-rocjpeg-build: ${{ env.ENABLE_ROCJPEG_BUILD }}
          enable-rocprof-trace-decoder-build: 'true'
          install-nightly-rocm: ${{ env.INSTALL_NIGHTLY_ROCM }}
          ccache-key: ccache-${{ matrix.system.os }}-build-deb-${{ matrix.system.gpu }}
          ccache-variant: ccache

      - name: Configure and Build (no tests)
        timeout-minutes: 45
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: |
          LD_LIBRARY_PATH=${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/llvm/lib:$LD_LIBRARY_PATH \
          PATH=${{ env.ROCM_PATH }}/bin:${{ env.ROCM_PATH }}/llvm/bin:$HOME/.local/bin:$PATH \
          python3 ./source/scripts/run-ci.py \
            -B build \
            --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-core-build \
            --build-jobs 16 \
            --mode ${CI_MODE} \
            --site build-deb-cpu \
            --gpu-targets gfx942 \
            --run-attempt ${{ github.run_attempt }} \
            --build-only \
            ${{ matrix.system.ci-flags }} -- \
            -DGPU_TARGETS=gfx942 \
            -DCMAKE_HIP_ARCHITECTURES=gfx942 \
            -DROCPROFILER_DEP_ROCMCORE=ON \
            -DROCPROFILER_BUILD_DOCS=OFF \
            -DROCPROFILER_INTERNAL_RCCL_API_TRACE=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.system.build-type }} \
            -DCMAKE_INSTALL_PREFIX=/opt/rocprofiler-sdk \
            -DCPACK_GENERATOR='DEB;RPM;TGZ' \
            -DCPACK_PACKAGING_INSTALL_PREFIX="$(realpath ${{ env.ROCM_PATH }})" \
            -DPython3_EXECUTABLE=$(which python3) \
            -DCMAKE_PREFIX_PATH='${{ env.ROCM_PATH }};${{ env.ROCM_PATH }}/llvm' \
            ${{ env.GLOBAL_CMAKE_OPTIONS }}

      - name: Install
        if: ${{ contains(matrix.system.gpu, env.CORE_EXT_RUNNER) }}
        timeout-minutes: 10
        working-directory: projects/rocprofiler-sdk
        run: |
          export LD_LIBRARY_PATH=${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/llvm/lib:$LD_LIBRARY_PATH
          export PATH=${{ env.ROCM_PATH }}/bin:${{ env.ROCM_PATH }}/llvm/bin:$PATH
          cmake --build build --target install --parallel 16

      - name: Build Packaging
        if: ${{ contains(matrix.system.gpu, env.CORE_EXT_RUNNER) }}
        timeout-minutes: 10
        working-directory: projects/rocprofiler-sdk
        run: |
          export LD_LIBRARY_PATH=${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/llvm/lib:$LD_LIBRARY_PATH
          export PATH=${{ env.ROCM_PATH }}/bin:${{ env.ROCM_PATH }}/llvm/bin:$PATH
          cmake --build build --target package --parallel 16

      - name: Create build artifact tarball
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: |
          # Create a tarball of the build directory and installed SDK for testing
          tar --zstd -cf rocprofiler-sdk-build-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst \
            build/ \
            samples/ \
            tests/

      - name: Create ROCM dependencies tarball
        shell: bash
        run: |
          # Create a tarball of /opt/rocm and /opt/rocprofiler-sdk for test job
          tar --zstd -cf rocm-deps-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst \
            -C /opt rocm rocprofiler-sdk || tar --zstd -cf rocm-deps-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst -C /opt rocm

      # NOTE: Artifacts are automatically scoped to this workflow run (github.run_id).
      # The test job's `needs: build-deb` ensures it only downloads artifacts from this same run.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-deb-${{ matrix.system.os }}-${{ matrix.system.gpu }}
          path: |
            projects/rocprofiler-sdk/rocprofiler-sdk-build-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst
            projects/rocprofiler-sdk/build/*.deb
            projects/rocprofiler-sdk/build/*.rpm
            projects/rocprofiler-sdk/build/*.tgz
          retention-days: 1
          compression-level: 0

      - name: Upload ROCM dependencies
        uses: actions/upload-artifact@v4
        with:
          name: rocm-deps-deb-${{ matrix.system.os }}-${{ matrix.system.gpu }}
          path: rocm-deps-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst
          retention-days: 1
          compression-level: 0

  # -----------------------------------------------------------------------------
  # Ubuntu / DEB Test job(s) - Run on GPU runners
  # -----------------------------------------------------------------------------
  test-deb:
    name: Test • ${{ matrix.system.gpu }} • ${{ matrix.system.os }}
    needs: build-deb
    strategy:
      fail-fast: false
      matrix:
        system:
          # TEMPORARILY DISABLED: navi3/navi4 jobs pending CI stabilization
          # - { gpu: 'navi4', runner: 'rocprofiler-navi4-dind', os: 'ubuntu-22.04', gpu-target: 'gfx120X' }
          # - { gpu: 'navi3', runner: 'rocprofiler-navi3-dind', os: 'ubuntu-22.04', gpu-target: 'gfx110X' }
          - { gpu: 'mi325', runner: 'linux-gfx942-1gpu-ossci-rocm', os: 'ubuntu-22.04', gpu-target: 'gfx94X' }
    runs-on: ${{ matrix.system.runner }}
    container:
      image: docker.io/rocm/rocprofiler-private:${{ matrix.system.os }}-${{ matrix.system.gpu-target }}-latest
      credentials:
        username: ${{ secrets.ROCPROFILER_AZURE_CI_USER }}
        password: ${{ secrets.ROCPROFILER_AZURE_CI_PASS }}
      env:
        DEBIAN_FRONTEND: noninteractive
      # --env-file /etc/podinfo/gha-gpu-isolation-settings - Required for GPU isolation on OSSCI MIXXX runners
      options:
        --privileged
        --env-file /etc/podinfo/gha-gpu-isolation-settings
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      CORE_EXT_RUNNER: mi325
      GPU_RUNNER: ${{ matrix.system.gpu }}
    steps:
      - name: Clone ROCProfiler SDK (for test scripts)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            projects/rocprofiler-sdk
          submodules: false
          set-safe-directory: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-deb-${{ matrix.system.os }}-${{ matrix.system.gpu }}
          path: artifacts/

      - name: Download ROCM dependencies
        uses: actions/download-artifact@v4
        with:
          name: rocm-deps-deb-${{ matrix.system.os }}-${{ matrix.system.gpu }}
          path: deps/

      - name: Extract build artifacts
        shell: bash
        run: |
          cd projects/rocprofiler-sdk
          apt-get update
          apt-get install -y zstd
          tar --zstd -xf ../../artifacts/rocprofiler-sdk-build-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst

      - name: Extract ROCM dependencies
        shell: bash
        run: |
          rm -rf /opt/rocm /opt/rocm-* /opt/rocprofiler-sdk
          cd /opt
          tar --zstd -xf $GITHUB_WORKSPACE/deps/rocm-deps-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst

      - name: Install requirements
        timeout-minutes: 5
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: |
          git config --global --add safe.directory '*'
          apt-get update
          apt-get install -y python3-pip
          python3 -m pip install -U --user -r requirements.txt

      - name: Enable PC Sampling
        if: ${{ contains(matrix.system.gpu, 'mi200') || contains(matrix.system.gpu, 'mi300a') }}
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: echo 'ROCPROFILER_PC_SAMPLING_BETA_ENABLED=1' >> $GITHUB_ENV

      - name: Run Tests
        timeout-minutes: 30
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: |
          export LD_LIBRARY_PATH=${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/llvm/lib:$LD_LIBRARY_PATH
          export PATH=${{ env.ROCM_PATH }}/bin:${{ env.ROCM_PATH }}/llvm/bin:$HOME/.local/bin:$PATH
          python3 ./source/scripts/run-ci.py -B build \
            --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-core-test \
            --mode ${CI_MODE} \
            --site test-deb-gpu \
            --gpu-targets gfx942 \
            --run-attempt ${{ github.run_attempt }} \
            --test-only \
            -- \
            -- \
            --parallel 4 \
            -LE "${${{ matrix.system.gpu }}_EXCLUDE_LABEL_REGEX}" \
            -E  "${${{ matrix.system.gpu }}_EXCLUDE_TESTS_REGEX}"

      - name: Test Install Build
        if: ${{ contains(matrix.system.gpu, env.CORE_EXT_RUNNER) }}
        timeout-minutes: 20
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: |
          export LD_LIBRARY_PATH=${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/llvm/lib:$LD_LIBRARY_PATH
          export PATH=${{ env.ROCM_PATH }}/bin:${{ env.ROCM_PATH }}/llvm/bin:$HOME/.local/bin:$PATH
          CMAKE_PREFIX_PATH=/opt/rocprofiler-sdk cmake -B build-samples -DGPU_TARGETS="gfx942" -DCMAKE_HIP_ARCHITECTURES="gfx942" samples
          CMAKE_PREFIX_PATH=/opt/rocprofiler-sdk cmake -B build-tests -DGPU_TARGETS="gfx942" -DCMAKE_HIP_ARCHITECTURES="gfx942" tests
          export LD_LIBRARY_PATH=/opt/rocprofiler-sdk/lib:${LD_LIBRARY_PATH}
          cmake --build build-samples --target all --parallel 16
          cmake --build build-tests --target all --parallel 16
          python3 ./source/scripts/run-ci.py -B build-samples \
            --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-install-samples-test \
            --mode ${CI_MODE} \
            --site test-deb-gpu \
            --gpu-targets gfx942 \
            --run-attempt ${{ github.run_attempt }} \
            --test-only \
            -- \
            -- \
            -LE "${${{ matrix.system.gpu }}_EXCLUDE_LABEL_REGEX}" \
            -E "${${{ matrix.system.gpu }}_EXCLUDE_TESTS_REGEX}"
          python3 ./source/scripts/run-ci.py -B build-tests \
            --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-install-tests-test \
            --mode ${CI_MODE} \
            --site test-deb-gpu \
            --gpu-targets gfx942 \
            --run-attempt ${{ github.run_attempt }} \
            --test-only \
            -- \
            -- \
            -LE "${${{ matrix.system.gpu }}_EXCLUDE_LABEL_REGEX}" \
            -E "${${{ matrix.system.gpu }}_EXCLUDE_TESTS_REGEX}"

      - name: Install Packages
        if: ${{ contains(matrix.system.gpu, env.CORE_EXT_RUNNER) }}
        timeout-minutes: 5
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: |
          export LD_LIBRARY_PATH=${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/llvm/lib:$LD_LIBRARY_PATH
          export PATH=${{ env.ROCM_PATH }}/bin:${{ env.ROCM_PATH }}/llvm/bin:$HOME/.local/bin:$PATH
          export PATH=${PATH}:/usr/local/sbin:/usr/sbin:/sbin
          dpkg --force-all -i ../../artifacts/*.deb
          # Re-install in correct order
          dpkg --force-all -i ../../artifacts/rocprofiler-sdk-roctx_*.deb
          dpkg --force-all -i ../../artifacts/rocprofiler-sdk-rocpd_*.deb
          for i in $(ls -S ../../artifacts/rocprofiler-sdk*.deb 2>/dev/null | grep -Ev 'roctx|rocpd'); do dpkg --force-all -i ${i}; done

      - name: Test Installed Packages
        if: ${{ contains(matrix.system.gpu, env.CORE_EXT_RUNNER) }}
        timeout-minutes: 20
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: |
          export LD_LIBRARY_PATH=${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/llvm/lib:$LD_LIBRARY_PATH
          export PATH=${{ env.ROCM_PATH }}/bin:${{ env.ROCM_PATH }}/llvm/bin:$HOME/.local/bin:$PATH
          CMAKE_PREFIX_PATH=${{ env.ROCM_PATH }} cmake -B build-samples-deb -DGPU_TARGETS="gfx942" -DCMAKE_HIP_ARCHITECTURES="gfx942" ${{ env.ROCM_PATH }}/share/rocprofiler-sdk/samples
          CMAKE_PREFIX_PATH=${{ env.ROCM_PATH }} cmake -B build-tests-deb -DGPU_TARGETS="gfx942" -DCMAKE_HIP_ARCHITECTURES="gfx942" ${{ env.ROCM_PATH }}/share/rocprofiler-sdk/tests
          cmake --build build-samples-deb --target all --parallel 16
          cmake --build build-tests-deb --target all --parallel 16
          python3 ./source/scripts/run-ci.py -B build-samples-deb \
            --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-deb-samples-test \
            --mode ${CI_MODE} \
            --site test-deb-gpu \
            --gpu-targets gfx942 \
            --run-attempt ${{ github.run_attempt }} \
            --test-only \
            -- \
            -- \
            -LE "${${{ matrix.system.gpu }}_EXCLUDE_LABEL_REGEX}" \
            -E "${${{ matrix.system.gpu }}_EXCLUDE_TESTS_REGEX}"
          python3 ./source/scripts/run-ci.py -B build-tests-deb \
            --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-deb-tests-test \
            --mode ${CI_MODE} \
            --site test-deb-gpu \
            --gpu-targets gfx942 \
            --run-attempt ${{ github.run_attempt }} \
            --test-only \
            -- \
            -- \
            -LE "${${{ matrix.system.gpu }}_EXCLUDE_LABEL_REGEX}" \
            -E "${${{ matrix.system.gpu }}_EXCLUDE_TESTS_REGEX}"

      - name: Archive production artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && contains(matrix.system.gpu, env.CORE_EXT_RUNNER) }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-deb
          path: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.tgz

  # -----------------------------------------------------------------------------
  # RHEL/SLES (RPM) Build job(s)
  # -----------------------------------------------------------------------------
  build-rpm:
    name: Build • ${{ matrix.system.gpu }} • ${{ matrix.system.os }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - { os: 'rhel-8.8', gpu: 'mi325', gpu-target: 'gfx94X', build-type: 'RelWithDebInfo', ci-flags: '' }
          - { os: 'rhel-9.5', gpu: 'mi325', gpu-target: 'gfx94X', build-type: 'RelWithDebInfo', ci-flags: '' }
          - { os: 'sles-15.6', gpu: 'mi325', gpu-target: 'gfx94X', build-type: 'RelWithDebInfo', ci-flags: '' }
    runs-on: azure-linux-scale-rocm
    container:
      image: docker.io/rocm/rocprofiler-private:${{ matrix.system.os }}-${{ matrix.system.gpu-target }}-latest
      credentials:
        username: ${{ secrets.ROCPROFILER_AZURE_CI_USER }}
        password: ${{ secrets.ROCPROFILER_AZURE_CI_PASS }}
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      OS_TYPE: ${{ matrix.system.os }}
      GPU_RUNNER: ${{ matrix.system.gpu }}
    steps:
      - name: Clone ROCProfiler SDK & AQLProfile & ROCProfiler Register & ROCR-Runtime & Trace Decoder
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/actions/rocprofiler-sdk-util
            projects/rocprofiler-sdk
            projects/aqlprofile
            projects/rocprofiler-register
            projects/rocprof-trace-decoder
            projects/rocr-runtime
            projects/clr
            projects/hip
          submodules: false
          set-safe-directory: true

      - name: Compute submodule cache key
        id: submods
        shell: bash
        run: |
          git --version
          git config --global --add safe.directory '*'
          git submodule status --recursive | awk '{print $1,$2}' > .git-submodules-status
          echo "hash=$(sha256sum .git-submodules-status | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # collect submodule paths for cache 'path'
          git config --file .gitmodules --get-regexp path | awk '{print $2}' > .git-submodule-paths
          { echo "paths<<EOF"; cat .git-submodule-paths; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Restore submodule cache
        uses: actions/cache@v4
        with:
          path: |
            .git/modules
            ${{ steps.submods.outputs.paths }}
          key: submods-${{ runner.os }}-${{ steps.submods.outputs.hash }}
          restore-keys: |
            submods-${{ runner.os }}-
            submods-

      - name: Init/Update submodules
        run: git submodule update --init --recursive --jobs 16

      - name: Install requirements (venv)
        timeout-minutes: 10
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: |
          git config --global --add safe.directory '*'
          python3 -m venv ${{ env.PYTHON_VENV_PATH }}
          source ${{ env.PYTHON_VENV_ACTIVATE }}
          export PATH=/opt/rh/gcc-toolset-11/root/usr/bin:$PATH
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade -r requirements.txt

      - name: Install Curl for RHEL 8.8
        if: ${{ matrix.system.os == 'rhel-8.8' }}
        run: |
          dnf install -y curl
          ln -s /usr/local/bin/curl /usr/bin/curl

      - name: Build ROCProfiler SDK Dependencies
        uses: ./.github/actions/rocprofiler-sdk-util
        with:
          rocm-path: ${{ env.ROCM_PATH }}
          gpu-target: ${{ matrix.system.gpu-target }}
          compiler-launcher: /usr/local/bin/sccache
          enable-rocr-build: ${{ env.ENABLE_ROCR_BUILD }}
          enable-hip-clr-build: ${{ env.ENABLE_HIP_CLR_BUILD }}
          enable-rocprofiler-register-build: ${{ env.ENABLE_ROCPROFILER_REGISTER_BUILD }}
          enable-aqlprofile-build: ${{ env.ENABLE_AQLPROFILE_BUILD }}
          enable-rocprof-trace-decoder-build: 'true'
          install-nightly-rocm: ${{ env.INSTALL_NIGHTLY_ROCM }}
          ccache-key: ccache-${{ matrix.system.os }}-build-rpm-${{ matrix.system.gpu }}
          ccache-variant: sccache

      - name: Configure and Build (no tests)
        timeout-minutes: 45
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: |
          source ${{ env.PYTHON_VENV_ACTIVATE }}
          export PATH=~/.local/bin:/opt/rh/gcc-toolset-11/root/usr/bin:$PATH
          python3 ./source/scripts/run-ci.py -B build \
            --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-core-build \
            --mode ${CI_MODE} \
            --build-jobs 16 \
            --site build-rpm-cpu \
            --gpu-targets gfx942 \
            --run-attempt ${{ github.run_attempt }} \
            --build-only \
            ${{ matrix.system.ci-flags }} \
            -- \
            -DGPU_TARGETS=gfx942 \
            -DCMAKE_HIP_ARCHITECTURES=gfx942 \
            -DROCPROFILER_DEP_ROCMCORE=ON \
            -DROCPROFILER_BUILD_DOCS=OFF \
            -DROCPROFILER_INTERNAL_RCCL_API_TRACE=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.system.build-type }} \
            -DCMAKE_PREFIX_PATH='${{ env.ROCM_PATH }};${{ env.ROCM_PATH }}/llvm' \
            -DPython3_EXECUTABLE=$(which python3) \
            ${{ env.GLOBAL_CMAKE_OPTIONS }}

      - name: Create build artifact tarball
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: |
          tar --zstd -cf rocprofiler-sdk-build-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst \
            build/ \
            ${{ env.PYTHON_VENV_PATH }}/

      - name: Create ROCM dependencies tarball
        shell: bash
        run: |
          tar --zstd -cf rocm-deps-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst \
            -C /opt rocm

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-rpm-${{ matrix.system.os }}-${{ matrix.system.gpu }}
          path: |
            projects/rocprofiler-sdk/rocprofiler-sdk-build-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst
          retention-days: 1
          compression-level: 0

      - name: Upload ROCM dependencies
        uses: actions/upload-artifact@v4
        with:
          name: rocm-deps-rpm-${{ matrix.system.os }}-${{ matrix.system.gpu }}
          path: rocm-deps-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst
          retention-days: 1
          compression-level: 0

  # -----------------------------------------------------------------------------
  # RHEL/SLES (RPM) Test job(s) - Run on GPU runners
  # -----------------------------------------------------------------------------
  test-rpm:
    name: Test • ${{ matrix.system.gpu }} • ${{ matrix.system.os }}
    needs: build-rpm
    strategy:
      fail-fast: false
      matrix:
        system:
          - { os: 'rhel-8.8', runner: 'linux-gfx942-1gpu-ossci-rocm', gpu: 'mi325', gpu-target: 'gfx94X' }
          - { os: 'rhel-9.5', runner: 'linux-gfx942-1gpu-ossci-rocm', gpu: 'mi325', gpu-target: 'gfx94X' }
          - { os: 'sles-15.6', runner: 'linux-gfx942-1gpu-ossci-rocm', gpu: 'mi325', gpu-target: 'gfx94X' }
    runs-on: ${{ matrix.system.runner }}
    container:
      image: docker.io/rocm/rocprofiler-private:${{ matrix.system.os }}-${{ matrix.system.gpu-target }}-latest
      credentials:
        username: ${{ secrets.ROCPROFILER_AZURE_CI_USER }}
        password: ${{ secrets.ROCPROFILER_AZURE_CI_PASS }}
      # --env-file /etc/podinfo/gha-gpu-isolation-settings - Required for GPU isolation on OSSCI MIXXX runners
      options:
        --privileged
        --env-file /etc/podinfo/gha-gpu-isolation-settings
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      OS_TYPE: ${{ matrix.system.os }}
      GPU_RUNNER: ${{ matrix.system.gpu }}
    steps:
      - name: Clone ROCProfiler SDK (for test scripts)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            projects/rocprofiler-sdk
          submodules: false
          set-safe-directory: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-rpm-${{ matrix.system.os }}-${{ matrix.system.gpu }}
          path: artifacts/

      - name: Download ROCM dependencies
        uses: actions/download-artifact@v4
        with:
          name: rocm-deps-rpm-${{ matrix.system.os }}-${{ matrix.system.gpu }}
          path: deps/

      - name: Extract build artifacts
        shell: bash
        run: |
          command -v zstd >/dev/null || dnf install -y zstd || zypper --non-interactive install zstd
          cd projects/rocprofiler-sdk
          tar --zstd -xf ../../artifacts/rocprofiler-sdk-build-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst

      - name: Extract ROCM dependencies
        shell: bash
        run: |
          rm -rf /opt/rocm /opt/rocm-* /opt/rocprofiler-sdk
          cd /opt
          tar --zstd -xf $GITHUB_WORKSPACE/deps/rocm-deps-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst

      - name: Enable PC Sampling
        if: ${{ contains(matrix.system.gpu, 'mi200') || contains(matrix.system.gpu, 'mi300a') }}
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: echo 'ROCPROFILER_PC_SAMPLING_BETA_ENABLED=1' >> $GITHUB_ENV

      - name: Run Tests
        timeout-minutes: 30
        shell: bash
        working-directory: projects/rocprofiler-sdk
        run: |
          if [ ! -f "${{ env.PYTHON_VENV_ACTIVATE }}" ]; then
            echo "::error::Python venv activation script not found: ${{ env.PYTHON_VENV_ACTIVATE }}"
            exit 1
          fi
          source ${{ env.PYTHON_VENV_ACTIVATE }}
          export PATH=~/.local/bin:/opt/rh/gcc-toolset-11/root/usr/bin:$PATH
          python3 ./source/scripts/run-ci.py -B build \
            --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-core-test \
            --mode ${CI_MODE} \
            --site test-rpm-gpu \
            --gpu-targets gfx942 \
            --run-attempt ${{ github.run_attempt }} \
            --test-only \
            -- \
            -- \
            --parallel 4 \
            -LE "${${{ matrix.system.gpu }}_EXCLUDE_LABEL_REGEX}" \
            -E "${${{ matrix.system.gpu }}_EXCLUDE_TESTS_REGEX}"

  # =============================================================================
  # SANITIZER JOBS - Split into build (CPU) and test (GPU)
  # =============================================================================

  # -----------------------------------------------------------------------------
  # Sanitizers Build job(s) - Run on CPU runners
  # -----------------------------------------------------------------------------
  build-sanitizers:
    name: Build • ${{ matrix.system.sanitizer }} • ${{ matrix.system.os }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - { sanitizer: 'AddressSanitizer', os: 'ubuntu-22.04', gpu: 'mi325', gpu-target: 'gfx94X', build-type: 'RelWithDebInfo' }
          - { sanitizer: 'ThreadSanitizer', os: 'ubuntu-22.04', gpu: 'mi325', gpu-target: 'gfx94X', build-type: 'RelWithDebInfo' }
          - { sanitizer: 'LeakSanitizer', os: 'ubuntu-22.04', gpu: 'mi325', gpu-target: 'gfx94X', build-type: 'RelWithDebInfo' }
          - { sanitizer: 'UndefinedBehaviorSanitizer', os: 'ubuntu-22.04', gpu: 'mi325', gpu-target: 'gfx94X', build-type: 'RelWithDebInfo' }

    if: ${{ contains(github.event_name, 'pull_request') }}
    runs-on: azure-linux-scale-rocm
    container:
      image: docker.io/rocm/rocprofiler-private:${{ matrix.system.os }}-${{ matrix.system.gpu-target }}-latest
      credentials:
        username: ${{ secrets.ROCPROFILER_AZURE_CI_USER }}
        password: ${{ secrets.ROCPROFILER_AZURE_CI_PASS }}
      env:
        DEBIAN_FRONTEND: noninteractive

    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      GCC_COMPILER_VERSION: 12
      GPU_RUNNER: ${{ matrix.system.gpu }}

    steps:
    - name: Clone ROCProfiler SDK & AQLProfile & ROCProfiler Register & ROCR-Runtime & Trace Decoder
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/actions/rocprofiler-sdk-util
          projects/rocprofiler-sdk
          projects/aqlprofile
          projects/rocprofiler-register
          projects/rocprof-trace-decoder
          projects/rocr-runtime
          projects/clr
          projects/hip
        submodules: false
        set-safe-directory: true

    - name: Compute submodule cache key
      id: submods
      shell: bash
      run: |
        git --version
        git config --global --add safe.directory '*'
        git submodule status --recursive | awk '{print $1,$2}' > .git-submodules-status
        echo "hash=$(sha256sum .git-submodules-status | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        # collect submodule paths for cache 'path'
        git config --file .gitmodules --get-regexp path | awk '{print $2}' > .git-submodule-paths
        { echo "paths<<EOF"; cat .git-submodule-paths; echo "EOF"; } >> "$GITHUB_OUTPUT"

    - name: Restore submodule cache
      uses: actions/cache@v4
      with:
        path: |
          .git/modules
          ${{ steps.submods.outputs.paths }}
        key: submods-${{ runner.os }}-${{ steps.submods.outputs.hash }}
        restore-keys: |
          submods-${{ runner.os }}-
          submods-

    - name: Init/Update submodules
      run: git submodule update --init --recursive --jobs 16

    - name: Install requirements
      timeout-minutes: 10
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        git config --global --add safe.directory '*'
        apt-get update
        apt-get install -y build-essential cmake python3-pip libasan8 libtsan2 software-properties-common clang-15 libdw-dev libsqlite3-dev libdrm-dev file autoconf pkg-config
        add-apt-repository ppa:ubuntu-toolchain-r/test
        apt-get update
        apt-get upgrade -y
        apt-get install -y gcc-${{ env.GCC_COMPILER_VERSION }} g++-${{ env.GCC_COMPILER_VERSION }}
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_COMPILER_VERSION }} 100 --slave /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_COMPILER_VERSION }} --slave /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_COMPILER_VERSION }}
        python3 -m pip install -U --user -r requirements.txt
        python3 -m pip install -U --user cmake==3.24.0

    - name: Build ROCProfiler SDK Dependencies
      uses: ./.github/actions/rocprofiler-sdk-util
      with:
        rocm-path: ${{ env.ROCM_PATH }}
        gpu-target: ${{ matrix.system.gpu-target }}
        compiler-launcher: /usr/bin/ccache
        enable-rocr-build: ${{ env.ENABLE_ROCR_BUILD }}
        enable-hip-clr-build: ${{ env.ENABLE_HIP_CLR_BUILD }}
        enable-rocprofiler-register-build: ${{ env.ENABLE_ROCPROFILER_REGISTER_BUILD }}
        enable-aqlprofile-build: ${{ env.ENABLE_AQLPROFILE_BUILD }}
        enable-rocprof-trace-decoder-build: 'true'
        install-nightly-rocm: ${{ env.INSTALL_NIGHTLY_ROCM }}
        ccache-key: ccache-${{ matrix.system.os }}-build-sanitizers-${{ matrix.system.gpu }}-${{ matrix.system.sanitizer }}
        ccache-variant: ccache

    - name: Configure and Build (no tests)
      timeout-minutes: 45
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        python3 ./source/scripts/run-ci.py -B build \
          --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-${{ matrix.system.sanitizer }}-build \
          --build-jobs 16 \
          --site build-sanitizers-cpu \
          --gpu-targets gfx942 \
          --memcheck ${{ matrix.system.sanitizer }} \
          --run-attempt ${{ github.run_attempt }} \
          --build-only \
          -- \
          -DGPU_TARGETS=gfx942 \
          -DCMAKE_HIP_ARCHITECTURES=gfx942 \
          -DROCPROFILER_INTERNAL_RCCL_API_TRACE=ON \
          -DCMAKE_BUILD_TYPE=${{ matrix.system.build-type }} \
          -DCMAKE_INSTALL_PREFIX="${{ env.ROCM_PATH }}" \
          -DCMAKE_PREFIX_PATH='${{ env.ROCM_PATH }};${{ env.ROCM_PATH }}/llvm' \
          -DPython3_EXECUTABLE=$(which python3) \
          ${{ env.GLOBAL_CMAKE_OPTIONS }}

    - name: Create build artifact tarball
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        tar --zstd -cf rocprofiler-sdk-build-${{ matrix.system.os }}-${{ matrix.system.gpu }}-${{ matrix.system.sanitizer }}.tar.zst \
          build/

    - name: Create ROCM dependencies tarball
      shell: bash
      run: |
        tar --zstd -cf rocm-deps-${{ matrix.system.os }}-${{ matrix.system.gpu }}-${{ matrix.system.sanitizer }}.tar.zst \
          -C /opt rocm

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-sanitizers-${{ matrix.system.os }}-${{ matrix.system.gpu }}-${{ matrix.system.sanitizer }}
        path: |
          projects/rocprofiler-sdk/rocprofiler-sdk-build-${{ matrix.system.os }}-${{ matrix.system.gpu }}-${{ matrix.system.sanitizer }}.tar.zst
        retention-days: 1
        compression-level: 0

    - name: Upload ROCM dependencies
      uses: actions/upload-artifact@v4
      with:
        name: rocm-deps-sanitizers-${{ matrix.system.os }}-${{ matrix.system.gpu }}-${{ matrix.system.sanitizer }}
        path: rocm-deps-${{ matrix.system.os }}-${{ matrix.system.gpu }}-${{ matrix.system.sanitizer }}.tar.zst
        retention-days: 1
        compression-level: 0

  # -----------------------------------------------------------------------------
  # Sanitizers Test job - Run ALL sanitizer tests on a SINGLE GPU runner
  # This reduces GPU queue pressure by running setup once and testing sequentially
  # -----------------------------------------------------------------------------
  test-sanitizers:
    name: Test • All Sanitizers • mi325 • ubuntu-22.04
    needs: build-sanitizers
    if: ${{ contains(github.event_name, 'pull_request') }}
    runs-on: linux-gfx942-1gpu-ossci-rocm
    container:
      image: docker.io/rocm/rocprofiler-private:ubuntu-22.04-gfx94X-latest
      credentials:
        username: ${{ secrets.ROCPROFILER_AZURE_CI_USER }}
        password: ${{ secrets.ROCPROFILER_AZURE_CI_PASS }}
      env:
        DEBIAN_FRONTEND: noninteractive
      # --env-file /etc/podinfo/gha-gpu-isolation-settings - Required for GPU isolation on OSSCI MIXXX runners
      options:
        --privileged
        --cap-add SYS_PTRACE
        --security-opt seccomp=unconfined
        --env-file /etc/podinfo/gha-gpu-isolation-settings

    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      GCC_COMPILER_VERSION: 12
      GPU_RUNNER: mi325

    steps:
    - name: Clone ROCProfiler SDK (for test scripts)
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          projects/rocprofiler-sdk
        submodules: false
        set-safe-directory: true

    # Download all 4 sanitizer build artifacts
    - name: Download AddressSanitizer build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-sanitizers-ubuntu-22.04-mi325-AddressSanitizer
        path: artifacts/AddressSanitizer/

    - name: Download ThreadSanitizer build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-sanitizers-ubuntu-22.04-mi325-ThreadSanitizer
        path: artifacts/ThreadSanitizer/

    - name: Download LeakSanitizer build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-sanitizers-ubuntu-22.04-mi325-LeakSanitizer
        path: artifacts/LeakSanitizer/

    - name: Download UndefinedBehaviorSanitizer build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-sanitizers-ubuntu-22.04-mi325-UndefinedBehaviorSanitizer
        path: artifacts/UndefinedBehaviorSanitizer/

    # Download ROCm dependencies (same for all sanitizers)
    - name: Download ROCM dependencies
      uses: actions/download-artifact@v4
      with:
        name: rocm-deps-sanitizers-ubuntu-22.04-mi325-AddressSanitizer
        path: deps/

    - name: Extract ROCM dependencies
      shell: bash
      run: |
        apt-get update
        apt-get install -y zstd
        rm -rf /opt/rocm /opt/rocm-* /opt/rocprofiler-sdk
        cd /opt
        tar --zstd -xf $GITHUB_WORKSPACE/deps/rocm-deps-ubuntu-22.04-mi325-AddressSanitizer.tar.zst

    - name: Install requirements
      timeout-minutes: 5
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        git config --global --add safe.directory '*'
        apt-get update
        apt-get install -y python3-pip libasan8 libtsan2
        python3 -m pip install -U --user -r requirements.txt

    - name: Setup kernel parameters for sanitizers
      shell: bash
      run: sudo sysctl -w vm.mmap_rnd_bits=28

    # Run tests for each sanitizer sequentially (continue-on-error ensures all run)
    - name: Test AddressSanitizer
      id: asan
      continue-on-error: true
      timeout-minutes: 30
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        echo "=========================================="
        echo "Running AddressSanitizer Tests"
        echo "=========================================="
        rm -rf build
        tar --zstd -xf ../../artifacts/AddressSanitizer/rocprofiler-sdk-build-ubuntu-22.04-mi325-AddressSanitizer.tar.zst
        export PATH="$HOME/.local/bin:$PATH"
        python3 ./source/scripts/run-ci.py -B build \
          --name ${{ github.repository }}-${{ github.ref_name }}-ubuntu-22.04-mi325-AddressSanitizer-test \
          --mode ${CI_MODE} \
          --site test-sanitizers-gpu \
          --gpu-targets gfx942 \
          --memcheck AddressSanitizer \
          --run-attempt ${{ github.run_attempt }} \
          --test-only \
          -- \
          -- \
          --parallel 4 \
          -LE "${mi325_EXCLUDE_LABEL_REGEX}" \
          -E "${mi325_EXCLUDE_TESTS_REGEX}"

    - name: Test ThreadSanitizer
      id: tsan
      continue-on-error: true
      timeout-minutes: 30
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        echo "=========================================="
        echo "Running ThreadSanitizer Tests"
        echo "=========================================="
        rm -rf build
        tar --zstd -xf ../../artifacts/ThreadSanitizer/rocprofiler-sdk-build-ubuntu-22.04-mi325-ThreadSanitizer.tar.zst
        export PATH="$HOME/.local/bin:$PATH"
        python3 ./source/scripts/run-ci.py -B build \
          --name ${{ github.repository }}-${{ github.ref_name }}-ubuntu-22.04-mi325-ThreadSanitizer-test \
          --mode ${CI_MODE} \
          --site test-sanitizers-gpu \
          --gpu-targets gfx942 \
          --memcheck ThreadSanitizer \
          --run-attempt ${{ github.run_attempt }} \
          --test-only \
          -- \
          -- \
          --parallel 4 \
          -LE "${mi325_EXCLUDE_LABEL_REGEX}" \
          -E "${mi325_EXCLUDE_TESTS_REGEX}"

    - name: Test LeakSanitizer
      id: lsan
      continue-on-error: true
      timeout-minutes: 30
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        echo "=========================================="
        echo "Running LeakSanitizer Tests"
        echo "=========================================="
        rm -rf build
        tar --zstd -xf ../../artifacts/LeakSanitizer/rocprofiler-sdk-build-ubuntu-22.04-mi325-LeakSanitizer.tar.zst
        export PATH="$HOME/.local/bin:$PATH"
        python3 ./source/scripts/run-ci.py -B build \
          --name ${{ github.repository }}-${{ github.ref_name }}-ubuntu-22.04-mi325-LeakSanitizer-test \
          --mode ${CI_MODE} \
          --site test-sanitizers-gpu \
          --gpu-targets gfx942 \
          --memcheck LeakSanitizer \
          --run-attempt ${{ github.run_attempt }} \
          --test-only \
          -- \
          -- \
          --parallel 4 \
          -LE "${mi325_EXCLUDE_LABEL_REGEX}" \
          -E "${mi325_EXCLUDE_TESTS_REGEX}"

    - name: Test UndefinedBehaviorSanitizer
      id: ubsan
      continue-on-error: true
      timeout-minutes: 30
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        echo "=========================================="
        echo "Running UndefinedBehaviorSanitizer Tests"
        echo "=========================================="
        rm -rf build
        tar --zstd -xf ../../artifacts/UndefinedBehaviorSanitizer/rocprofiler-sdk-build-ubuntu-22.04-mi325-UndefinedBehaviorSanitizer.tar.zst
        export PATH="$HOME/.local/bin:$PATH"
        python3 ./source/scripts/run-ci.py -B build \
          --name ${{ github.repository }}-${{ github.ref_name }}-ubuntu-22.04-mi325-UndefinedBehaviorSanitizer-test \
          --mode ${CI_MODE} \
          --site test-sanitizers-gpu \
          --gpu-targets gfx942 \
          --memcheck UndefinedBehaviorSanitizer \
          --run-attempt ${{ github.run_attempt }} \
          --test-only \
          -- \
          -- \
          --parallel 4 \
          -LE "${mi325_EXCLUDE_LABEL_REGEX}" \
          -E "${mi325_EXCLUDE_TESTS_REGEX}"

    # Summary step - report results and fail if any sanitizer failed
    - name: Sanitizer Test Summary
      if: always()
      shell: bash
      run: |
        echo ""
        echo "=========================================="
        echo "         SANITIZER TEST SUMMARY"
        echo "=========================================="
        echo ""
        
        FAILED=0
        
        if [ "${{ steps.asan.outcome }}" == "success" ]; then
          echo "✅ AddressSanitizer:            PASSED"
        else
          echo "❌ AddressSanitizer:            FAILED"
          FAILED=1
        fi
        
        if [ "${{ steps.tsan.outcome }}" == "success" ]; then
          echo "✅ ThreadSanitizer:             PASSED"
        else
          echo "❌ ThreadSanitizer:             FAILED"
          FAILED=1
        fi
        
        if [ "${{ steps.lsan.outcome }}" == "success" ]; then
          echo "✅ LeakSanitizer:               PASSED"
        else
          echo "❌ LeakSanitizer:               FAILED"
          FAILED=1
        fi
        
        if [ "${{ steps.ubsan.outcome }}" == "success" ]; then
          echo "✅ UndefinedBehaviorSanitizer:  PASSED"
        else
          echo "❌ UndefinedBehaviorSanitizer:  FAILED"
          FAILED=1
        fi
        
        echo ""
        echo "=========================================="
        
        if [ $FAILED -eq 1 ]; then
          echo "❌ One or more sanitizer tests FAILED"
          exit 1
        else
          echo "✅ All sanitizer tests PASSED"
        fi
