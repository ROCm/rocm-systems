name: rocprofiler-sdk Continuous Integration

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'projects/rocprofiler-sdk/**'
      - '!projects/rocprofiler-sdk/*.md'
      - '!projects/rocprofiler-sdk/**/README.md'
      - '!projects/rocprofiler-sdk/CODEOWNERS'
      - '!projects/rocprofiler-sdk/source/docs/**'
      - '.github/workflows/rocprofiler-sdk-continuous_integration.yml'
  pull_request:
    paths:
      - 'projects/rocprofiler-sdk/**'
      - '!projects/rocprofiler-sdk/*.md'
      - '!projects/rocprofiler-sdk/**/README.md'
      - '!projects/rocprofiler-sdk/CODEOWNERS'
      - '!projects/rocprofiler-sdk/source/docs/**'
      - '.github/workflows/rocprofiler-sdk-continuous_integration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # TODO(jrmadsen): replace LD_RUNPATH_FLAG, GPU_TARGETS, etc. with internal handling in cmake
  ROCM_PATH: "/opt/rocm-custom"
  GPU_TARGETS: "gfx900 gfx906 gfx908 gfx90a gfx940 gfx941 gfx942 gfx950 gfx1030 gfx1100 gfx1101 gfx1102 gfx1201"
  PATH: "/usr/bin:$PATH"
  CDASH_URL: "https://my.cdash.org/submit.php?project=rocprofiler-sdk"
  ## No tests should be excluded here except for extreme emergencies; tests should only be disabled in CMake
  ## A task should be assigned directly to fix the issues
  ## Scratch memory tests need to be fixed for ROCm 7.0 release
  navi3_EXCLUDE_TESTS_REGEX: ""
  vega20_EXCLUDE_TESTS_REGEX: ""
  mi200_EXCLUDE_TESTS_REGEX: ""
  mi300_EXCLUDE_TESTS_REGEX: ""
  mi300a_EXCLUDE_TESTS_REGEX: ""
  mi325_EXCLUDE_TESTS_REGEX: ""
  mi3xx_EXCLUDE_TESTS_REGEX: ""
  navi4_EXCLUDE_TESTS_REGEX: ""
  navi3_EXCLUDE_LABEL_REGEX: ""
  vega20_EXCLUDE_LABEL_REGEX: ""
  mi200_EXCLUDE_LABEL_REGEX: ""
  mi300_EXCLUDE_LABEL_REGEX: ""
  mi300a_EXCLUDE_LABEL_REGEX: ""
  mi325_EXCLUDE_LABEL_REGEX: ""
  mi3xx_EXCLUDE_LABEL_REGEX: ""
  navi4_EXCLUDE_LABEL_REGEX: ""
  GLOBAL_CMAKE_OPTIONS: ""

jobs:
  core-deb:
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    strategy:
      fail-fast: false
      matrix:
        system: [
          {gpu: 'navi4', runner: 'linux-rx9070-gpu-rocm', os: 'ubuntu-22.04', build-type: 'RelWithDebInfo', therock-s3: "gfx120X", ci-flags: '--linter clang-tidy', gpu-target: 'gfx1201'},
          {gpu: 'navi3', runner: 'linux-gfx110X-gpu-rocm', os: 'ubuntu-22.04', build-type: 'RelWithDebInfo', therock-s3: "gfx110X", ci-flags: '--linter clang-tidy', gpu-target: 'gfx1101'},
          {gpu: 'mi325', runner: 'linux-mi325-1gpu-ossci-rocm', os: 'ubuntu-22.04', build-type: 'RelWithDebInfo', therock-s3: "gfx94X", ci-flags: '--linter clang-tidy', gpu-target: 'gfx942'},
          {gpu: 'mi355', runner: 'linux-mi355-1gpu-ossci-rocm', os: 'ubuntu-22.04', build-type: 'RelWithDebInfo', therock-s3: "gfx950", ci-flags: '--linter clang-tidy', gpu-target: 'gfx950'}
        ]

    runs-on: ${{ matrix.system.runner }}

    # define this for containers
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      CORE_EXT_RUNNER: mi325
      GPU_RUNNER: ${{ matrix.system.gpu }}

    steps:
    - name: Install Latest ROCm
      shell: bash
      working-directory: /tmp
      run: |
        [ $(cat /etc/os-release | grep "24.04" | wc -l) > 1 ] && python3 -m pip install awscli --break-system-packages || python3 -m pip install awscli
        export PATH=/usr/local/bin:~/.local/bin:$PATH
        KEY=$(aws s3api list-objects-v2 \
          --bucket therock-nightly-tarball \
          --no-sign-request \
          --output json \
          --query "sort_by(Contents[?contains(Key, '${{ matrix.system.therock-s3 }}')], &LastModified)[-1].Key")
        KEY=${KEY//\"/}
        test -n "$KEY" || { echo "No ${{ matrix.system.therock-s3 }} tarball found"; exit 1; }
        aws s3 cp "s3://therock-nightly-tarball/${KEY}" rocm.tar.gz --no-sign-request
        ls -lh rocm.tar.gz
        echo "Downloaded: ${KEY}"
        sudo mkdir -p /opt/rocm-custom
        sudo tar -xf *.tar.gz -C /opt/rocm-custom

    - name: Checkout
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          projects/rocprofiler-sdk
          projects/aqlprofile        
        submodules: true
        set-safe-directory: true

    - name: Install requirements
      timeout-minutes: 10
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        git config --global --add safe.directory '*'
        output=$(sudo apt-get update 2>&1) && exit_status=$? || exit_status=$?
        sudo apt-get install -y build-essential coreutils git cmake g++-11 g++-12 python3-pip libdw-dev libsqlite3-dev rccl-dev rccl-unittests rocjpeg-dev rocjpeg-test rocdecode-dev rocdecode-test
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 10 --slave /usr/bin/g++ g++ /usr/bin/g++-11 --slave /usr/bin/gcov gcov /usr/bin/gcov-11
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 20 --slave /usr/bin/g++ g++ /usr/bin/g++-12 --slave /usr/bin/gcov gcov /usr/bin/gcov-12
        [ $(cat /etc/os-release | grep "24.04" | wc -l) > 1 ] && python3 -m pip install -U --user -r requirements.txt --break-system-packages || python3 -m pip install -U --user -r requirements.txt
        sudo rm -rf /opt/rocm/lib/*rocprofiler-sdk* /opt/rocm/lib/cmake/*rocprofiler-sdk* /opt/rocm/share/*rocprofiler-sdk* /opt/rocm/libexec/*rocprofiler-sdk* /opt/rocm*/lib/python*/site-packages/roctx /opt/rocm*/lib/python*/site-packages/rocpd
        sudo rm -rf /opt/rocm-custom/lib/*rocprofiler-sdk* /opt/rocm-custom/lib/cmake/*rocprofiler-sdk* /opt/rocm-custom/share/*rocprofiler-sdk* /opt/rocm-custom/libexec/*rocprofiler-sdk*

    - name: List Files
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        echo "PATH: ${PATH}"
        echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"
        which-realpath() { echo -e "\n$1 resolves to $(realpath $(which $1))"; echo "$($(which $1) --version &> /dev/stdout | head -n 1)"; }
        for i in python3 git cmake ctest gcc g++ gcov; do which-realpath $i; done
        cat /opt/rocm-custom/.info/version
        ls -la
        
    - name: Build and Install Aqlprofile
      shell: bash
      working-directory: projects/aqlprofile
      run: |
        echo "Install Aqlprofile."
        export LD_LIBRARY_PATH=/opt/rocm-custom/lib:$LD_LIBRARY_PATH
        export PATH=/opt/rocm-custom/bin:$PATH
        /usr/bin/cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=/opt/rocm-custom -DCMAKE_INSTALL_PREFIX=/opt/rocm-custom -DGPU_TARGETS='gfx906,gfx90a,gfx942,gfx1101,gfx1201' .
        /usr/bin/cmake --build build --target all --parallel 16
        /usr/bin/cmake --build build --target install
        echo "✅ Installation complete!"
  
    - name: Enable PC Sampling
      if: ${{ contains(matrix.system.runner, 'mi200') || contains(matrix.system.runner, 'mi300a') }}
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run:
          echo 'ROCPROFILER_PC_SAMPLING_BETA_ENABLED=1' >> $GITHUB_ENV

    - name: Special Requirements
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
          echo 'CMAKE_HIP_PLATFORM=amd' >> $GITHUB_ENV
          echo 'HIP_PLATFORM=amd' >> $GITHUB_ENV
          echo 'HIP_RUNTIME=rocclr' >> $GITHUB_ENV
          echo 'HIP_COMPILER=amdclang' >> $GITHUB_ENV
          echo 'HIP_CLANG_PATH=/opt/rocm-custom/llvm/bin' >> $GITHUB_ENV
          echo 'DEVICE_LIB_PATH=/opt/rocm-custom/llvm/amdgcn/bitcode' >> $GITHUB_ENV
          echo 'HIP_DEVICE_LIB_PATH=/opt/rocm-custom/llvm/amdgcn/bitcode' >> $GITHUB_ENV
          echo 'HSA_PATH=/opt/rocm-custom' >> $GITHUB_ENV
          echo 'LLVM_PATH=/opt/rocm-custom/llvm' >> $GITHUB_ENV

    - name: Configure, Build, and Test
      timeout-minutes: 30
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run:
        LD_LIBRARY_PATH=/opt/rocm-custom/lib:/opt/rocm-custom/llvm/lib:$LD_LIBRARY_PATH
        PATH=/opt/rocm-custom/bin:/opt/rocm-custom/llvm/bin:/usr/bin:$PATH
        /usr/bin/python3 ./source/scripts/run-ci.py -B build
          --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-core
          --build-jobs 16
          --site ${{ matrix.system.runner }}
          --run-attempt ${{ github.run_attempt }}
          --
          -DROCPROFILER_DEP_ROCMCORE=ON
          -DROCPROFILER_BUILD_DOCS=OFF
          -DOPENMP_GPU_TARGETS=${{ matrix.system.gpu-target }}
          -DCMAKE_BUILD_TYPE=${{ matrix.system.build-type }}
          -DCMAKE_INSTALL_PREFIX=/opt/rocprofiler-sdk
          -DCPACK_GENERATOR='DEB;RPM;TGZ'
          -DCPACK_PACKAGING_INSTALL_PREFIX='/opt/rocm-custom'
          -DCMAKE_PREFIX_PATH='/opt/rocm-custom;/opt/rocm-custom/lib;/opt/rocm-custom/lib/cmake;/opt/rocm-custom/llvm;/opt/rocm-custom/llvm/lib'
          -DPython3_EXECUTABLE='/usr/bin/python3'
          ${{ env.GLOBAL_CMAKE_OPTIONS }}
          --
          -LE "${${{ matrix.system.runner }}_EXCLUDE_LABEL_REGEX}"
          -E "${${{ matrix.system.runner }}_EXCLUDE_TESTS_REGEX}"

    - name: Install
      if: ${{ contains(matrix.system.runner, env.CORE_EXT_RUNNER) }}
      timeout-minutes: 10
      working-directory: projects/rocprofiler-sdk
      run:
        sudo cmake --build build --target install --parallel 16

    - name: Build Packaging
      if: ${{ contains(matrix.system.runner, env.CORE_EXT_RUNNER) }}
      timeout-minutes: 10
      working-directory: projects/rocprofiler-sdk
      run:
        cmake --build build --target package --parallel 16

    - name: Test Install Build
      if: ${{ contains(matrix.system.runner, env.CORE_EXT_RUNNER) }}
      timeout-minutes: 20
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        CMAKE_PREFIX_PATH=/opt/rocprofiler-sdk cmake -B build-samples samples
        CMAKE_PREFIX_PATH=/opt/rocprofiler-sdk cmake -B build-tests -DGPU_TARGETS="gfx942" tests
        export LD_LIBRARY_PATH=/opt/rocprofiler-sdk/lib:${LD_LIBRARY_PATH}
        cmake --build build-samples --target all --parallel 16
        cmake --build build-tests --target all --parallel 16
        ctest --test-dir build-samples -LE "${${{ matrix.system.runner }}_EXCLUDE_LABEL_REGEX}" -E "${${{ matrix.system.runner }}_EXCLUDE_TESTS_REGEX}" --output-on-failure
        ctest --test-dir build-tests -LE "${${{ matrix.system.runner }}_EXCLUDE_LABEL_REGEX}" -E "${${{ matrix.system.runner }}_EXCLUDE_TESTS_REGEX}" --output-on-failure

    - name: Install Packages
      if: ${{ contains(matrix.system.runner, env.CORE_EXT_RUNNER) }}
      timeout-minutes: 5
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        export PATH=${PATH}:/usr/local/sbin:/usr/sbin:/sbin
        ls -la
        ls -la ./build
        sudo dpkg --force-all -i ./build/rocprofiler-sdk-roctx_*.deb
        sudo dpkg --force-all -i ./build/rocprofiler-sdk-rocpd_*.deb
        for i in $(ls -S ./build/rocprofiler-sdk*.deb | egrep -v 'roctx|rocpd'); do sudo dpkg --force-all -i ${i}; done;

    - name: Test Installed Packages
      if: ${{ contains(matrix.system.runner, env.CORE_EXT_RUNNER) }}
      timeout-minutes: 20
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run:
        CMAKE_PREFIX_PATH=/opt/rocm-custom cmake -B build-samples-deb /opt/rocm-custom/share/rocprofiler-sdk/samples
        CMAKE_PREFIX_PATH=/opt/rocm-custom cmake -B build-tests-deb -DGPU_TARGETS="gfx942" /opt/rocm-custom/share/rocprofiler-sdk/tests
        cmake --build build-samples-deb --target all --parallel 16
        cmake --build build-tests-deb --target all --parallel 16
        ctest --test-dir build-samples-deb -LE "${${{ matrix.system.runner }}_EXCLUDE_LABEL_REGEX}" -E "${${{ matrix.system.runner }}_EXCLUDE_TESTS_REGEX}" --output-on-failure
        ctest --test-dir build-tests-deb -LE "${${{ matrix.system.runner }}_EXCLUDE_LABEL_REGEX}" -E "${${{ matrix.system.runner }}_EXCLUDE_TESTS_REGEX}" --output-on-failure

    - name: Archive production artifacts
      if: ${{ github.event_name == 'workflow_dispatch' && contains(matrix.system.runner, env.CORE_EXT_RUNNER) }}
      uses: actions/upload-artifact@v4
      with:
        name: installers-deb
        path: |
          ${{github.workspace}}/build/*.deb
          ${{github.workspace}}/build/*.rpm
          ${{github.workspace}}/build/*.tgz

  core-rpm:
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    strategy:
      fail-fast: false
      matrix:
        runner: ['mi300']
        os: ['rhel-9.1', 'sles-15.4']
        build-type: ['RelWithDebInfo']
        ci-flags: ['']

    runs-on: linux-mi325-1gpu-ossci-rocm
    container:
      image: rocm/rocprofiler-private:${{ matrix.os }}
      credentials:
        username: ${{ secrets.ROCPROFILER_AZURE_CI_USER }}
        password: ${{ secrets.ROCPROFILER_AZURE_CI_PASS }}

    # define this for containers
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      OS_TYPE: ${{ matrix.os }}

    steps:
    - name: Install Latest ROCm
      shell: bash
      working-directory: /tmp
      run: |
        python3 -m pip install --upgrade pip pipx
        python3 -m pipx install awscli
        python3 -m pipx ensurepath
        source ~/.bashrc
        KEY=$(aws s3api list-objects-v2 \
          --bucket therock-nightly-tarball \
          --no-sign-request \
          --output json \
          --query "sort_by(Contents[?contains(Key, 'gfx94X')], &LastModified)[-1].Key")
        KEY=${KEY//\"/}
        test -n "$KEY" || { echo "No gfx94X tarball found"; exit 1; }
        aws s3 cp "s3://therock-nightly-tarball/${KEY}" rocm.tar.gz --no-sign-request
        ls -lh rocm.tar.gz
        echo "Downloaded: ${KEY}"
        sudo mkdir -p /opt/rocm-custom
        sudo tar -xf *.tar.gz -C /opt/rocm-custom
        sudo ln -s /opt/rocm-custom /opt/rocm

    - name: Checkout
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          projects/rocprofiler-sdk
          projects/aqlprofile 
        
    - name: Install requirements
      timeout-minutes: 10
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        git config --global --add safe.directory '*'
        python3 -m pip install -U --user -r requirements.txt
        python3 -m pipx install cmake
        sudo rm -rf /opt/rocm/lib/*rocprofiler-sdk* /opt/rocm/lib/cmake/*rocprofiler-sdk* /opt/rocm/share/*rocprofiler-sdk* /opt/rocm/libexec/*rocprofiler-sdk*
        sudo rm -rf /opt/rocm-custom/lib/*rocprofiler-sdk* /opt/rocm-custom/lib/cmake/*rocprofiler-sdk* /opt/rocm-custom/share/*rocprofiler-sdk* /opt/rocm-custom/libexec/*rocprofiler-sdk*

    - name: Special Requirements
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
          echo 'CMAKE_HIP_PLATFORM=amd' >> $GITHUB_ENV
          echo 'HIP_PLATFORM=amd' >> $GITHUB_ENV
          echo 'HIP_RUNTIME=rocclr' >> $GITHUB_ENV
          echo 'HIP_COMPILER=amdclang' >> $GITHUB_ENV
          echo 'HIP_CLANG_PATH=/opt/rocm-custom/llvm/bin' >> $GITHUB_ENV
          echo 'DEVICE_LIB_PATH=/opt/rocm-custom/llvm/amdgcn/bitcode' >> $GITHUB_ENV
          echo 'HIP_DEVICE_LIB_PATH=/opt/rocm-custom/llvm/amdgcn/bitcode' >> $GITHUB_ENV
          echo 'HSA_PATH=/opt/rocm-custom' >> $GITHUB_ENV
          echo 'LLVM_PATH=/opt/rocm-custom/llvm' >> $GITHUB_ENV

    - name: List Files
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        echo "PATH: ${PATH}"
        echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"
        which-realpath() { echo -e "\n$1 resolves to $(realpath $(which $1))"; echo "$($(which $1) --version &> /dev/stdout | head -n 1)"; }
        for i in python3 git cmake ctest gcc g++ gcov; do which-realpath $i; done
        cat /opt/rocm-custom/.info/version
        ls -la

    - name: Build and Install Aqlprofile
      shell: bash
      working-directory: projects/aqlprofile
      run: |
        echo "Install Aqlprofile."
        export LD_LIBRARY_PATH=/opt/rocm-custom/lib:$LD_LIBRARY_PATH
        export PATH=/opt/rocm-custom/bin:$PATH
        /usr/bin/cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=/opt/rocm-custom -DCMAKE_INSTALL_PREFIX=/opt/rocm-custom -DGPU_TARGETS='gfx906,gfx90a,gfx942,gfx1101,gfx1201' .
        /usr/bin/cmake --build build --target all --parallel 16
        /usr/bin/cmake --build build --target install
        echo "✅ Installation complete!"
  
    - name: Enable PC Sampling
      if: ${{ contains(matrix.runner, 'mi200') || contains(matrix.runner, 'mi300a') }}
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run:
          echo 'ROCPROFILER_PC_SAMPLING_BETA_ENABLED=1' >> $GITHUB_ENV

    - name: Configure, Build, and Test
      timeout-minutes: 30
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run:
        python3 -m pipx ensurepath; source ~/.bashrc;
        LD_LIBRARY_PATH=/opt/rocm-custom/lib:/opt/rocm-custom/llvm/lib:$LD_LIBRARY_PATH
        PATH=/opt/rocm-custom/bin:/opt/rocm-custom/llvm/bin:/usr/bin:$PATH
        /usr/bin/python3 ./source/scripts/run-ci.py -B build
          --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.runner }}-core
          --build-jobs 16
          --site linux-mi325-1gpu-ossci-rocm
          --run-attempt ${{ github.run_attempt }}
          ${{ matrix.ci-flags }}
          --
          -DROCPROFILER_DEP_ROCMCORE=ON
          -DROCPROFILER_BUILD_DOCS=OFF
          -DOPENMP_GPU_TARGETS=gfx942
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DCMAKE_PREFIX_PATH='/opt/rocm-custom;/opt/rocm-custom/lib;/opt/rocm-custom/lib/cmake;/opt/rocm-custom/llvm;/opt/rocm-custom/llvm/lib'
          -DPython3_EXECUTABLE=$(which python3)
          ${{ env.GLOBAL_CMAKE_OPTIONS }}
          --
          -LE "${${{ matrix.runner }}_EXCLUDE_LABEL_REGEX}"
          -E "${${{ matrix.runner }}_EXCLUDE_TESTS_REGEX}"
  
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        runner: ['mi325']
        sanitizer: ['AddressSanitizer', 'ThreadSanitizer', 'LeakSanitizer', 'UndefinedBehaviorSanitizer']
        os: ['ubuntu-22.04']
        build-type: ['RelWithDebInfo']

    if: ${{ contains(github.event_name, 'pull_request') }}
    runs-on: linux-mi325-1gpu-ossci-rocm

    # define this for containers
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      GCC_COMPILER_VERSION: 13

    steps:
    - name: Install Latest ROCm
      shell: bash
      working-directory: /tmp
      run: |
        [ $(cat /etc/os-release | grep "24.04" | wc -l) > 1 ] && python3 -m pip install awscli --break-system-packages || python3 -m pip install awscli
        export PATH=/usr/local/bin:~/.local/bin:$PATH
        KEY=$(aws s3api list-objects-v2 \
          --bucket therock-nightly-tarball \
          --no-sign-request \
          --output json \
          --query "sort_by(Contents[?contains(Key, 'gfx94X')], &LastModified)[-1].Key")
        KEY=${KEY//\"/}
        test -n "$KEY" || { echo "No gfx94X tarball found"; exit 1; }
        aws s3 cp "s3://therock-nightly-tarball/${KEY}" rocm.tar.gz --no-sign-request
        ls -lh rocm.tar.gz
        echo "Downloaded: ${KEY}"
        sudo mkdir -p /opt/rocm-custom
        sudo tar -xf *.tar.gz -C /opt/rocm-custom

    - name: Checkout
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          projects/rocprofiler-sdk
          projects/aqlprofile    
        submodules: true
        set-safe-directory: true

    - name: Install requirements
      timeout-minutes: 10
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        git config --global --add safe.directory '*'
        sudo apt-get update
        sudo apt-get install -y build-essential cmake python3-pip libasan8 libtsan2 software-properties-common clang-15 libdw-dev libsqlite3-dev
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get upgrade -y
        sudo apt-get install -y gcc-${{ env.GCC_COMPILER_VERSION }} g++-${{ env.GCC_COMPILER_VERSION }}
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_COMPILER_VERSION }} 100 --slave /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_COMPILER_VERSION }} --slave /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_COMPILER_VERSION }}
        python3 -m pip install -U --user -r requirements.txt
        sudo rm -rf /opt/rocm/lib/*rocprofiler-sdk* /opt/rocm/lib/cmake/*rocprofiler-sdk* /opt/rocm/share/*rocprofiler-sdk* /opt/rocm/libexec/*rocprofiler-sdk*
        sudo rm -rf /opt/rocm-custom/lib/*rocprofiler-sdk* /opt/rocm-custom/lib/cmake/*rocprofiler-sdk* /opt/rocm-custom/share/*rocprofiler-sdk* /opt/rocm-custom/libexec/*rocprofiler-sdk*

    - name: List Files
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        which-realpath() { echo -e "\n$1 resolves to $(realpath $(which $1))"; echo "$($(which $1) --version &> /dev/stdout | head -n 1)"; }
        for i in python3 git cmake ctest gcc g++ gcov; do which-realpath $i; done
        cat /opt/rocm-custom/.info/version
        ls -la
        
    - name: Build and Install Aqlprofile
      shell: bash
      working-directory: projects/aqlprofile
      run: |
        echo "Install Aqlprofile."
        export LD_LIBRARY_PATH=/opt/rocm-custom/lib:$LD_LIBRARY_PATH
        export PATH=/opt/rocm-custom/bin:$PATH
        /usr/bin/cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=/opt/rocm-custom -DCMAKE_INSTALL_PREFIX=/opt/rocm-custom -DGPU_TARGETS='gfx906,gfx90a,gfx942,gfx1101,gfx1201' .
        /usr/bin/cmake --build build --target all --parallel 16
        /usr/bin/cmake --build build --target install
        echo "✅ Installation complete!"
  
    - name: Enable PC Sampling
      if: ${{ contains(matrix.runner, 'mi200') || contains(matrix.runner, 'mi300a') }}
      shell: bash
      working-directory: projects/rocprofiler-sdk
