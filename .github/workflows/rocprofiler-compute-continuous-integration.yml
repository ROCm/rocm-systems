name: rocprofiler-compute Continuous Integration
run-name: rocprofiler-compute-ci

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: false
        default: 'continuous'
        type: choice
        options:
          - continuous
          - nightly
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/rocprofiler-compute-continuous-integration.yml'
      - 'projects/rocprofiler-compute/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-compute/docs/**'
      - '!projects/rocprofiler-compute/source/docs/**'
      - '!projects/rocprofiler-compute/source/python/gui/**'
      - '!projects/rocprofiler-compute/docker/**'
      - '!projects/rocprofiler-compute/CMakePresets.json'
  pull_request:
    paths:
      - '.github/workflows/rocprofiler-compute-continuous-integration.yml'
      - 'projects/rocprofiler-compute/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-compute/docs/**'
      - '!projects/rocprofiler-compute/source/docs/**'
      - '!projects/rocprofiler-compute/source/python/gui/**'
      - '!projects/rocprofiler-compute/docker/**'
      - '!projects/rocprofiler-compute/CMakePresets.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROCPROFSYS_CI: ON
  ROCM_PATH: "/opt/rocm"

jobs:
  ci_config:
    name: Load CI config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gfx94x_runner: ${{ steps.runner.outputs.gfx94x_runner }}
      gfx950_runner: ${{ steps.runner.outputs.gfx950_runner }}
      gfx90a_runner: ${{ steps.runner.outputs.gfx90a_runner }}
      gfx1151_runner: ${{ steps.runner.outputs.gfx1151_runner }}
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/rocprofiler-sdk-util/resolve-ci-config
          set-safe-directory: true

      - name: Resolve runner labels
        id: runner
        uses: ./.github/actions/rocprofiler-sdk-util/resolve-ci-config

  prepare_matrix:
    needs: ci_config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.generate_matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: projects/rocprofiler-compute/.github

      - name: Generate and output matrix
        id: generate_matrix
        working-directory: projects/rocprofiler-compute/.github
        env:
          GFX950_RUNNER: ${{ needs.ci_config.outputs.gfx950_runner }}
          GFX94X_RUNNER: ${{ needs.ci_config.outputs.gfx94x_runner }}
          GFX90A_RUNNER: ${{ needs.ci_config.outputs.gfx90a_runner }}
          GFX1151_RUNNER: ${{ needs.ci_config.outputs.gfx1151_runner }}
        run: |
          if [ '${{ github.event_name }}' = 'schedule' ] || [ '${{ inputs.mode }}' = 'nightly' ]; then
            MATRIX_CONTENT=$(cat ci-matrix.yml | yq '.matrix-ubuntu-nightly' -I=0 -o=json)
          else
            MATRIX_CONTENT=$(cat ci-matrix.yml | yq '.matrix-ubuntu-ci' -I=0 -o=json)
          fi

          # Map arch to resolved runner labels from therock-ci-config
          declare -A RUNNER_MAP=(
            ["gfx950"]="$GFX950_RUNNER"
            ["gfx94X"]="$GFX94X_RUNNER"
            ["gfx90a"]="$GFX90A_RUNNER"
            ["gfx1151"]="$GFX1151_RUNNER"
          )
          for arch in "${!RUNNER_MAP[@]}"; do
            runner="${RUNNER_MAP[$arch]}"
            if [ -n "$runner" ]; then
              MATRIX_CONTENT=$(echo "$MATRIX_CONTENT" | \
                jq -c --arg arch "$arch" --arg runner "$runner" \
                '[.[] | if .arch == $arch then .runner = $runner else . end]')
            fi
          done

          echo "matrix=${MATRIX_CONTENT}" >> $GITHUB_OUTPUT

  ubuntu:
    name: Ubuntu ${{ matrix.system.os-release }} • ${{ matrix.system.arch }}
    needs: prepare_matrix
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}
    runs-on: ${{ matrix.system.runner }}
    env:
      HIP_PLATFORM: "amd"
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/rocm/rocprofiler-ubuntu:${{ matrix.system.os-release }}-compute-ci-multiarch
      # --env-file /etc/podinfo/gha-gpu-isolation-settings - Required for GPU isolation on OSSCI MIXXX runners
      options:
        --privileged
        --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --cap-add CAP_SYS_ADMIN
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        --pull always

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'rocprofiler-compute-develop' || github.ref }}
          sparse-checkout: |
            projects/rocprofiler-compute
            shared/ctest

      - name: Setup Environment
        id: setup_env
        run: |
          if [ '${{ github.event_name }}' = 'schedule' ]; then
            MODE=Nightly
            ADD_COVERAGE="--coverage"
          else
            MODE=Continuous
            ADD_COVERAGE=""
          fi
          echo "mode=${MODE}" >> $GITHUB_OUTPUT
          echo "add_coverage=${ADD_COVERAGE}" >> $GITHUB_OUTPUT

          if [ '${{ matrix.system.os-release }}' = '24.04' ]; then
            CODE_NAME=noble
          else
            CODE_NAME=jammy
          fi
          echo "code_name=${CODE_NAME}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt install -y pkg-config python3-dev
          echo "✅ ROCm Dependencies Installed!"

      - name: Install Latest Nightly ROCm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ env.ROCM_PATH }}"
          tarball=$(ls /opt/rocm-*-multiarch.tar.gz | head -n 1)
          tar -xf "${tarball}" -C "${{ env.ROCM_PATH }}"
          rm -f "${tarball}"
          ROCM_PACKAGE_VERSION=$(python3 -c "import json; m=json.load(open('${{ env.ROCM_PATH }}/share/therock/therock_manifest.json')); print(m['rocm_package_version'].split('+')[0])")
          ROCM_VERSION=$(python3 -c "import json; print(json.load(open('${{ env.ROCM_PATH }}/share/therock/therock_manifest.json'))['rocm_version'])")
          echo "ROCM_PACKAGE_VERSION=${ROCM_PACKAGE_VERSION}" >> "${GITHUB_ENV}"
          echo "ROCM_VERSION=${ROCM_VERSION}" >> "${GITHUB_ENV}"
          echo "ROCm ${ROCM_PACKAGE_VERSION} installed to: ${{ env.ROCM_PATH }}"
          echo "✅ ROCm Installation Complete!"

      - name: Output TheRock Manifest
        run: |
          cat ${{ env.ROCM_PATH }}/share/therock/therock_manifest.json

      - name: Install Python Requirements
        working-directory: projects/rocprofiler-compute
        run: |
          pip --version
          for i in 1 2 3; do
            pip install -r requirements.txt --break-system-packages --ignore-installed --timeout 60 && break
            echo "⚠️ pip install attempt $i failed, retrying..."
            sleep 10
          done
          for i in 1 2 3; do
            pip install -r requirements-test.txt --break-system-packages --ignore-installed --timeout 60 && break
            echo "⚠️ pip install attempt $i failed, retrying..."
            sleep 10
          done
          echo "✅ pip requirements installed!"

      - name: Install PyTorch (TheRock nightlies)
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.system.arch }}" in
            gfx950)  DEVICE_EXTRA="device-gfx950" ;;
            gfx1151) DEVICE_EXTRA="device-gfx1151" ;;
            gfx94X)  DEVICE_EXTRA="device-gfx942" ;;
            gfx90a)  DEVICE_EXTRA="device-gfx90a" ;;
            *)
              echo "::error::No PyTorch device mapping for arch ${{ matrix.system.arch }}"
              exit 1
              ;;
          esac

          TORCH_VERSION=$(python3 <<'PY'
          import os
          import re
          import subprocess
          import sys

          SUPPORTED_TORCH_RELEASES = frozenset({(2, 13), (2, 14)})

          def torch_release(version: str) -> tuple[int, int]:
              base = version.split("+", 1)[0]
              major, minor, *_ = base.split(".")
              return int(major), int(minor)

          def torch_sort_key(version: str) -> tuple[int, ...]:
              base = version.split("+", 1)[0]
              return tuple(int(part) for part in base.split("."))

          def rocm_suffix(version: str) -> str:
              return version.split("+rocm", 1)[1]

          rocm_tag = os.environ["ROCM_PACKAGE_VERSION"]
          rocm_base = os.environ["ROCM_VERSION"]
          proc = subprocess.run(
              [
                  "pip",
                  "index",
                  "versions",
                  "torch",
                  "--index-url",
                  "https://rocm.nightlies.amd.com/whl-multi-arch/",
              ],
              capture_output=True,
              text=True,
              check=True,
          )
          all_versions = sorted(
              set(re.findall(r"(\d+\.\d+\.\d+\+rocm[^\s,]+)", proc.stdout)),
              key=lambda version: (rocm_suffix(version), torch_sort_key(version)),
              reverse=True,
          )
          supported_versions = [
              version
              for version in all_versions
              if torch_release(version) in SUPPORTED_TORCH_RELEASES
          ]
          if not supported_versions:
              raise SystemExit(
                  "No supported torch wheel (2.13.x or 2.14.x) found on "
                  "https://rocm.nightlies.amd.com/whl-multi-arch/"
              )

          exact = [
              version
              for version in supported_versions
              if version.endswith(f"+rocm{rocm_tag}")
          ]
          if exact:
              print(exact[0])
              sys.exit(0)

          fallback = [
              version
              for version in supported_versions
              if rocm_suffix(version).startswith(rocm_base)
          ]
          if not fallback:
              raise SystemExit(
                  "No supported torch wheel (2.13.x or 2.14.x) found for "
                  f"ROCm package version {rocm_tag!r} or ROCm line {rocm_base!r}"
              )

          chosen = fallback[0]
          print(
              f"::warning::No exact torch wheel for ROCm {rocm_tag!r}; "
              f"falling back to {chosen} (same ROCm line {rocm_base!r})",
              file=sys.stderr,
          )
          print(chosen)
          PY
          )
          echo "Installing torch ${TORCH_VERSION} for ROCm ${ROCM_PACKAGE_VERSION} (${DEVICE_EXTRA})"

          torch_installed=0
          for i in 1 2 3; do
            if pip install --break-system-packages \
              --index-url https://rocm.nightlies.amd.com/whl-multi-arch/ \
              "torch[${DEVICE_EXTRA}]==${TORCH_VERSION}" --timeout 120; then
              torch_installed=1
              break
            fi
            if [ "$i" -lt 3 ]; then
              echo "⚠️ PyTorch install attempt $i failed, retrying..."
              sleep 10
            fi
          done
          if [ "$torch_installed" -ne 1 ]; then
            echo "::error::PyTorch install failed after 3 attempts"
            exit 1
          fi

          python3 -c "import torch; print(f'torch {torch.__version__}, cuda={torch.cuda.is_available()}')"
          echo "✅ PyTorch installed!"

      - name: Configure, Build, and Test
        id: test
        continue-on-error: true
        timeout-minutes: ${{ steps.setup_env.outputs.mode == 'Nightly' && 120 || 90 }}
        working-directory: projects/rocprofiler-compute
        run: |
          set -e
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          git config --global --add safe.directory ${PWD}
          PATH=${{ env.ROCM_PATH }}/bin:${{ env.ROCM_PATH }}/llvm/bin:$PATH \
          LD_LIBRARY_PATH=${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/llvm/lib:${{ env.ROCM_PATH }}/lib/rocm_sysdeps/lib:$LD_LIBRARY_PATH \
          python3 ./tools/run-ci.py \
            --name "ROCm/rocprofiler-compute-${{ github.ref_name }}-ubuntu-${{ matrix.system.os-release }}-${{ matrix.system.gpu }}" \
            --actor "${{ github.actor }}" \
            --site ${{ matrix.system.runner }} \
            --mode ${{ steps.setup_env.outputs.mode }} \
            --build-jobs 16 \
            ${{ steps.setup_env.outputs.add_coverage }} \
            -- \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ env.ROCM_PATH }} \
            -DENABLE_TESTS=ON \
            -DINSTALL_TESTS=ON \
            -DPYTEST_NUMPROCS=8 \
            -DTORCH_TRACE_PYTHON=/usr/bin/python3 \
            -- \
            -L full \
            -LE full_rocprofiler_compute_ci_exclude

      - name: Upload Test Logs (on failure)
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: failed-test-logs-ubuntu-${{ matrix.system.os-release }}-${{ matrix.system.arch }}
          path: |
            projects/rocprofiler-compute/build/ctest-results.xml
            projects/rocprofiler-compute/build/Testing/Temporary/**
          retention-days: 2

      - name: Check Test Results
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.test.outcome }}" == "failure" ]]; then
            echo "::error::Tests failed - see CDash for details: https://my.cdash.org/index.php?project=rocprofiler-compute"
            exit 1
          fi
          echo "✅ All tests passed!"
