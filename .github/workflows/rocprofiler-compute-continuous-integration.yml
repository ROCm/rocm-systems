name: rocprofiler-compute Continuous Integration
run-name: rocprofiler-compute-ci

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode (also selects the default matrix when arch is "default")'
        required: false
        default: 'continuous'
        type: choice
        options:
          - continuous
          - nightly
      arch:
        description: 'GPU arch to run. "default" uses the matrix for the selected mode; any other value ignores the mode filter.'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - all
          - gfx950
          - gfx94X
          - gfx90a
          - gfx1151
      os-release:
        description: 'Ubuntu release to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '22.04'
          - '24.04'
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/rocprofiler-compute-continuous-integration.yml'
      - 'projects/rocprofiler-compute/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-compute/docs/**'
      - '!projects/rocprofiler-compute/source/docs/**'
      - '!projects/rocprofiler-compute/source/python/gui/**'
      - '!projects/rocprofiler-compute/docker/**'
      - '!projects/rocprofiler-compute/CMakePresets.json'
  pull_request:
    paths:
      - '.github/workflows/rocprofiler-compute-continuous-integration.yml'
      - 'projects/rocprofiler-compute/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-compute/docs/**'
      - '!projects/rocprofiler-compute/source/docs/**'
      - '!projects/rocprofiler-compute/source/python/gui/**'
      - '!projects/rocprofiler-compute/docker/**'
      - '!projects/rocprofiler-compute/CMakePresets.json'

permissions:
  contents: read

concurrency:
  # Dispatch runs are keyed by their selection so a single-arch run does not
  # cancel (or get cancelled by) a PR run or another arch on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}-{2}', inputs.mode, inputs.arch, inputs.os-release) || '' }}
  cancel-in-progress: true

env:
  ROCPROFSYS_CI: ON
  # ROCM_PATH is discovered from the venv at runtime, see "Install nightly ROCm
  # and PyTorch wheels".
  ROCM_VENV: "/opt/rocm-venv"
  WHEEL_INDEX_URL: "https://nightly.repo.amd.com/rocm/whl-next/"

jobs:
  ci_config:
    name: Load CI config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gfx94x_runner: ${{ steps.runner.outputs.gfx94x_runner }}
      gfx950_runner: ${{ steps.runner.outputs.gfx950_runner }}
      gfx90a_runner: ${{ steps.runner.outputs.gfx90a_runner }}
      gfx1151_runner: ${{ steps.runner.outputs.gfx1151_runner }}
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/rocprofiler-sdk-util/resolve-ci-config
          set-safe-directory: true

      - name: Resolve runner labels
        id: runner
        uses: ./.github/actions/rocprofiler-sdk-util/resolve-ci-config

  prepare_matrix:
    needs: ci_config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.generate_matrix.outputs.matrix }}
      mode: ${{ steps.generate_matrix.outputs.mode }}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: projects/rocprofiler-compute/.github

      - name: Generate and output matrix
        id: generate_matrix
        working-directory: projects/rocprofiler-compute/.github
        env:
          GFX950_RUNNER: ${{ needs.ci_config.outputs.gfx950_runner }}
          GFX94X_RUNNER: ${{ needs.ci_config.outputs.gfx94x_runner }}
          GFX90A_RUNNER: ${{ needs.ci_config.outputs.gfx90a_runner }}
          GFX1151_RUNNER: ${{ needs.ci_config.outputs.gfx1151_runner }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_OS: ${{ inputs.os-release }}
        run: |
          set -e
          if [ "$EVENT_NAME" = 'schedule' ] || { [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$INPUT_MODE" = 'nightly' ]; }; then
            MODE=nightly
          else
            MODE=continuous
          fi
          echo "mode=${MODE}" >> $GITHUB_OUTPUT

          MATRIX_CONTENT=$(yq '.matrix-ubuntu' ci-matrix.yml -I=0 -o=json)

          # Entries are tagged with the modes they run in. A dispatch that names
          # an arch bypasses the mode tags; otherwise filter by effective mode.
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "${INPUT_ARCH:-default}" != 'default' ]; then
            MATRIX_CONTENT=$(echo "$MATRIX_CONTENT" | jq -c --arg arch "$INPUT_ARCH" \
              '[.[] | select($arch == "all" or .arch == $arch)]')
          else
            MATRIX_CONTENT=$(echo "$MATRIX_CONTENT" | jq -c --arg mode "$MODE" \
              '[.[] | select(.modes | index($mode))]')
          fi

          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ -n "$INPUT_OS" ] && [ "$INPUT_OS" != 'all' ]; then
            MATRIX_CONTENT=$(echo "$MATRIX_CONTENT" | jq -c --arg os "$INPUT_OS" \
              '[.[] | select(."os-release" == $os)]')
          fi

          # Apply the per-mode override (test-label, timeout-minutes) so the job
          # only sees the final values.
          MATRIX_CONTENT=$(echo "$MATRIX_CONTENT" | jq -c --arg mode "$MODE" \
            '[.[] | (if $mode == "continuous" then . + (.continuous // {}) else . end) | del(.continuous)]')

          if [ "$(echo "$MATRIX_CONTENT" | jq 'length')" -eq 0 ]; then
            echo "::error::No matrix entries match (event=${EVENT_NAME}, mode=${MODE}, arch=${INPUT_ARCH}, os-release=${INPUT_OS})"
            exit 1
          fi

          # Map arch to resolved runner labels from therock-ci-config
          declare -A RUNNER_MAP=(
            ["gfx950"]="$GFX950_RUNNER"
            ["gfx94X"]="$GFX94X_RUNNER"
            ["gfx90a"]="$GFX90A_RUNNER"
            ["gfx1151"]="$GFX1151_RUNNER"
          )
          for arch in "${!RUNNER_MAP[@]}"; do
            runner="${RUNNER_MAP[$arch]}"
            if [ -n "$runner" ]; then
              MATRIX_CONTENT=$(echo "$MATRIX_CONTENT" | \
                jq -c --arg arch "$arch" --arg runner "$runner" \
                '[.[] | if .arch == $arch then .runner = $runner else . end]')
            fi
          done

          echo "matrix=${MATRIX_CONTENT}" >> $GITHUB_OUTPUT

  ubuntu:
    name: Ubuntu ${{ matrix.system.os-release }} • ${{ matrix.system.arch }}
    needs: prepare_matrix
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}
    runs-on: ${{ matrix.system.runner }}
    env:
      HIP_PLATFORM: "amd"
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/rocm/rocprofiler-ubuntu:${{ matrix.system.os-release }}-compute-ci-base
      # --env-file /etc/podinfo/gha-gpu-isolation-settings - Required for GPU isolation on OSSCI MIXXX runners
      options:
        --privileged
        --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --cap-add CAP_SYS_ADMIN
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        --pull always

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'rocprofiler-compute-develop' || github.ref }}
          sparse-checkout: |
            projects/rocprofiler-compute
            shared/ctest

      - name: Setup Environment
        id: setup_env
        run: |
          if [ '${{ needs.prepare_matrix.outputs.mode }}' = 'nightly' ]; then
            MODE=Nightly
            ADD_COVERAGE="--coverage"
          else
            MODE=Continuous
            ADD_COVERAGE=""
          fi
          echo "mode=${MODE}" >> $GITHUB_OUTPUT
          echo "add_coverage=${ADD_COVERAGE}" >> $GITHUB_OUTPUT

          if [ '${{ matrix.system.os-release }}' = '24.04' ]; then
            CODE_NAME=noble
          else
            CODE_NAME=jammy
          fi
          echo "code_name=${CODE_NAME}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt install -y pkg-config
          # Drop this once the nightly image carries the Dockerfile.ubuntu.ci change.
          apt install -y python3-venv python3-dev
          echo "✅ ROCm Dependencies Installed!"

      - name: Install nightly ROCm and PyTorch wheels
        shell: bash
        env:
          GFX_TARGET: ${{ matrix.system.gfx-target }}
        run: |
          set -e
          python3 -m venv "${ROCM_VENV}"
          "${ROCM_VENV}/bin/pip" install --upgrade pip

          # cmake 3.21 misses Python 3.12 headers. Drop once the nightly image has this.
          "${ROCM_VENV}/bin/pip" install 'cmake==3.28.*'

          # rocprof-compute is tested against PyTorch 2.14. The torch wheel pins
          # the ROCm build it was made against, which pins ROCm here too.
          "${ROCM_VENV}/bin/pip" install \
            --index-url "${WHEEL_INDEX_URL}" \
            --timeout 600 \
            "torch[device-${GFX_TARGET}]==2.14.*" \
            "rocm[libraries,profiler,devel]"

          "${ROCM_VENV}/bin/rocm-sdk" init

          # pip only warns on an unknown extra, so assert the device wheel landed.
          "${ROCM_VENV}/bin/pip" show "rocm-sdk-device-${GFX_TARGET}" > /dev/null

          # $GITHUB_ENV is a file; every later step in this job starts with these
          # set. A plain export would not outlive this step.
          rocm_path="$("${ROCM_VENV}/bin/rocm-sdk" path --root)"
          {
            echo "ROCM_PATH=${rocm_path}"
            echo "HIP_PATH=${rocm_path}"
            echo "HIP_DEVICE_LIB_PATH=${rocm_path}/lib/llvm/amdgcn/bitcode"
            echo "PATH=${ROCM_VENV}/bin:${rocm_path}/bin:${rocm_path}/lib/llvm/bin:${PATH}"
            echo "LD_LIBRARY_PATH=${rocm_path}/lib:${rocm_path}/lib/llvm/lib:${rocm_path}/lib/rocm_sysdeps/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          } >> "${GITHUB_ENV}"

          echo "ROCm installed to: ${rocm_path}"
          echo "✅ ROCm Installation Complete!"

      - name: Output TheRock Manifest
        run: |
          cat "${ROCM_PATH}/share/therock/therock_manifest.json"

      - name: Install Python Requirements
        working-directory: projects/rocprofiler-compute
        run: |
          set -e
          pip --version
          pip install -r requirements.txt -r requirements-test.txt --timeout 300
          echo "✅ pip requirements installed!"

      - name: Configure, Build, and Test
        id: test
        continue-on-error: true
        timeout-minutes: ${{ matrix.system.timeout-minutes }}
        working-directory: projects/rocprofiler-compute
        run: |
          set -e
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          git config --global --add safe.directory ${PWD}
          python3 ./tools/run-ci.py \
            --name "ROCm/rocprofiler-compute-${{ github.ref_name }}-ubuntu-${{ matrix.system.os-release }}-${{ matrix.system.gpu }}" \
            --actor "${{ github.actor }}" \
            --site ${{ matrix.system.runner }} \
            --mode ${{ steps.setup_env.outputs.mode }} \
            --build-jobs 16 \
            ${{ steps.setup_env.outputs.add_coverage }} \
            -- \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${ROCM_PATH}" \
            -DENABLE_TESTS=ON \
            -DINSTALL_TESTS=ON \
            -DPYTEST_NUMPROCS=8 \
            -- \
            -L ${{ matrix.system.test-label }} \
            -LE ${{ matrix.system.test-label }}_rocprofiler_compute_ci_exclude

      - name: Upload Test Logs (on failure)
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: failed-test-logs-ubuntu-${{ matrix.system.os-release }}-${{ matrix.system.arch }}
          path: |
            projects/rocprofiler-compute/build/ctest-results.xml
            projects/rocprofiler-compute/build/Testing/Temporary/**
          retention-days: 2

      - name: Check Test Results
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.test.outcome }}" == "failure" ]]; then
            echo "::error::Tests failed - see CDash for details: https://my.cdash.org/index.php?project=rocprofiler-compute"
            exit 1
          fi
          echo "✅ All tests passed!"
