# Temporary experiment for ROCm/rocm-systems#12833. Do not merge this workflow.
# Each dispatch uses a separate run ID so baseline/candidate stage artifacts
# cannot overwrite each other. The only differing build input is systems ref.
name: TheRock RocJITsu batching timing
run-name: RocJITsu batching timing - ${{ inputs.variant }}

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Source revision to measure, with all test cases retained
        required: true
        type: choice
        default: candidate
        options:
          - baseline
          - candidate

permissions:
  contents: read
  id-token: write

jobs:
  emulation:
    name: Emulation - ${{ inputs.variant }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_build_portable_linux_artifacts.yml@ae64858bd53c53a6bf5f10137cbe72fc93c1eca5
    with:
      stage_name: emulation
      stage_display_name: Emulation - ${{ inputs.variant }}
      timeout_minutes: 240
      dist_amdgpu_families: gfx94X-dcgpu;gfx110X-all;gfx1151;gfx120X-all;gfx125X-dcgpu
      rocm_package_version: 10.2.0.dev0+ae64858bd53c53a6bf5f10137cbe72fc93c1eca5
      build_runs_on: aws-linux-scale-rocm-small
      release_type: ci
      repository: ROCm/TheRock
      ref: ae64858bd53c53a6bf5f10137cbe72fc93c1eca5
      external_repo_config: >-
        {
          "repository": "ROCm/rocm-systems",
          "ref": "${{ inputs.variant == 'baseline' && 'e74abbafe3e0ab6b3c8fa4229ce386ead8ceec9f' || 'a7cc536f7f1527b3066c3b59ec0b1201205f10e0' }}",
          "checkout_path": "external-rocm-systems",
          "source_package": "ROCM_SYSTEMS",
          "submodule_path": "rocm-systems",
          "fetch_sources_args": "--skip-submodules rocm-systems --dvc-projects external-rocm-systems",
          "extra_cmake_options": "-DTHEROCK_ROCJITSU_TEST_JOBS=1",
          "projects": "emulation/rocjitsu",
          "family_overrides": {}
        }
