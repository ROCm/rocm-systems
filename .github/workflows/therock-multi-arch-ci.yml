# Multi-Arch CI for rocm-systems
#
# This workflow replicates TheRock's multi-arch CI pipeline by calling
# TheRock's reusable workflows directly. It provides sharded, multi-stage
# builds with per-architecture testing.
#
# Key differences from therock-ci.yml:
# - Uses TheRock's multi-arch sharded build pipeline (foundation -> compiler-runtime -> math-libs)
# - Supports prebuilt stages to skip certain build stages
# - Better parallelization across GPU architectures

# TheRock ref: TEMPORARILY pointed at the branch users/geomin12/remove-external-configure-ci
# to test ROCm/TheRock#<PR>. Restore a pinned SHA before merging.
# NOTE: update all `@<ref>` refs and `ref:` inputs together when switching

# =============================================================================
# TEMPORARY: MI455 (gfx125X) bringup configuration
# TODO(geomin12): Remove this block once MI455 is fully enabled in therock-ci-config
#
# The gfx125x_family_overrides JSON configures MI455-specific test settings:
# - test-runs-on: Custom runner label for MI455 hardware
# - test_labels_for_family: Limit tests to hip-tests, rocrtst (sanity always runs)
# - Container options with ulimit for RCCL compatibility
# =============================================================================

name: TheRock Multi-Arch CI

on:
  push:
    branches:
      - develop
      - release/therock-*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      linux_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Linux GPU families to build and test. ex: gfx94X, gfx120X (empty = skip linux)"
        default: ""
      linux_test_labels:
        type: string
        description: "If enabled, reduce test set on Linux to the list of labels prefixed with 'test:'. ex: test:rocprim, test:hipcub"
        default: ""
      windows_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Windows GPU families to build and test. ex: gfx94X, gfx120X (empty = skip windows)"
        default: ""
      windows_test_labels:
        type: string
        description: "If enabled, reduce test set on Windows to the list of labels prefixed with 'test:' ex: test:rocprim, test:hipcub"
        default: ""
      prebuilt_stages:
        type: string
        default: ""
        description: "Comma-separated build stages to skip (or 'all' for all stages); artifacts are copied from baseline_run_id instead"
      baseline_run_id:
        type: string
        default: ""
        description: "Workflow run ID to copy prebuilt stage artifacts from; required when prebuilt_stages is set"
      build_python_packages:
        type: boolean
        default: false
        description: "Build ROCm Python packages"
      build_pytorch:
        type: boolean
        default: false
        description: "Build PyTorch wheels"
      build_jax:
        type: boolean
        default: false
        description: "Build JAX wheels"
      build_native_linux:
        type: boolean
        default: false
        description: "Build native Linux packages and run install tests"
      baseline_repository:
        type: string
        default: ""
        description: "Repository to query for baseline_run_id. Defaults to github.repository for workflow_dispatch."

permissions:
  contents: read
  actions: read

concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit). The workflow name is prepended to avoid conflicts between
  # different workflows.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    uses: ROCm/TheRock/.github/workflows/setup_multi_arch.yml@users/geomin12/remove-external-configure-ci
    with:
      build_variant: "release"
      # Limit GPU families for rocm-systems CI
      # Note: gfx125X is added for MI455 bringup with limited tests (hip-tests, rocrtst, sanity)
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families || 'gfx94X,gfx950,gfx125X' }}
      windows_amdgpu_families: ${{ inputs.windows_amdgpu_families || 'gfx110X' }}
      linux_test_labels: ${{ inputs.linux_test_labels || '' }}
      windows_test_labels: ${{ inputs.windows_test_labels || '' }}
      # TEST-BRANCH REGRESSION: build_stages and the Linux-only Windows skip
      # both came from compute_build_stages.py, which needs changed_projects
      # *before* setup runs. changed_projects is now computed inside setup, so
      # that input is unavailable here. Omitting build_stages falls back to the
      # documented fail-safe (empty = build every stage) and Windows uses the
      # default families. This only costs build time, not correctness, but the
      # real PR must restore selective builds -- see the PR description.
      prebuilt_stages: ${{ inputs.prebuilt_stages || '' }}
      baseline_run_id: ${{ inputs.baseline_run_id || '' }}
      build_python_packages: ${{ inputs.build_python_packages || false }}
      build_pytorch: ${{ inputs.build_pytorch || false }}
      build_jax: ${{ inputs.build_jax || false }}
      build_native_linux: ${{ inputs.build_native_linux || false }}
      baseline_repository: ${{ inputs.baseline_repository || (inputs.baseline_run_id != '' && github.repository) || '' }}
      # Enable automatic stage reuse - TheRock finds commit-compatible baselines
      # and determines which stages to rebuild based on changed files
      stage_reuse_mode: reuse-stage
      repository: ROCm/TheRock
      ref: users/geomin12/remove-external-configure-ci
      # event_name/pr_number/base_sha/head_sha let TheRock fetch this repo's
      # diff; projects_config maps that diff onto changed projects (replacing
      # the retired configure_external_repo_ci.py); skip_ci_config supplies the
      # skip patterns. skip_ci_config is REQUIRED even though the file does not
      # exist yet -- without the key TheRock falls back to its own skip config,
      # which would skip CI for a therock-*.yml-only PR.
      #
      # TEMPORARY: MI455 bringup - pass family_overrides to configure test runner and limited tests
      # TODO(geomin12): Remove family_overrides once MI455 is in therock-ci-config
      # NOTE: MI455 machine is down - test-runs-on set to "" until back online (was: linux-mi455-gpu-rocm)
      external_repo: >-
        {
          "repository": "${{ github.repository }}",
          "ref": "${{ github.sha }}",
          "event_name": "${{ github.event_name }}",
          "pr_number": "${{ github.event.pull_request.number }}",
          "base_sha": "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}",
          "head_sha": "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}",
          "projects_config": ".github/repos-config.json",
          "skip_ci_config": ".github/skip-ci-config.toml",
          "family_overrides": {
            "gfx125x": {
              "linux": {
                "test-runs-on": "",
                "test_labels_for_family": ["test:hip-tests", "test:rocrtst"],
                "fetch-gfx-targets": ["gfx1250"]
              }
            }
          }
        }

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: [setup]
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_linux.yml@users/geomin12/remove-external-configure-ci
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      # changed_projects is intentionally NOT passed yet. setup still computes
      # it, and still uses it to drop prebuilt stages that build a changed
      # project, but the artifact-granular build/test work it feeds downstream
      # is unfinished. Leaving it unset keeps a full test run here.
      repository: ROCm/TheRock
      ref: users/geomin12/remove-external-configure-ci
    permissions:
      contents: read
      id-token: write

  windows_build_and_test:
    name: Windows::${{ fromJSON(needs.setup.outputs.windows_build_config || '{}').build_variant_label || 'skip' }}
    needs: [setup]
    if: >-
      ${{
        needs.setup.outputs.windows_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_windows.yml@users/geomin12/remove-external-configure-ci
    with:
      build_config: ${{ needs.setup.outputs.windows_build_config }}
      test_labels: ${{ needs.setup.outputs.windows_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      # changed_projects intentionally not passed yet; see the Linux job above.
      repository: ROCm/TheRock
      ref: users/geomin12/remove-external-configure-ci
    permissions:
      contents: read
      id-token: write

  multi_arch_ci_summary:
    name: Multi-Arch CI Summary
    if: always()
    needs:
      - setup
      - linux_build_and_test
      - windows_build_and_test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: users/geomin12/remove-external-configure-ci
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
