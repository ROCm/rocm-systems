name: rocprofiler-systems Python Linting
run-name: Python

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/rocprofiler-systems-python.yml'
      - 'projects/rocprofiler-systems/pyproject.toml'
      - 'projects/rocprofiler-systems/**/*.py'
  pull_request:
    paths:
      - '.github/workflows/rocprofiler-systems-python.yml'
      - 'projects/rocprofiler-systems/pyproject.toml'
      - 'projects/rocprofiler-systems/**/*.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        sparse-checkout: projects/rocprofiler-systems
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.17.1
    - name: Lint with ruff
      working-directory: projects/rocprofiler-systems
      run: |
        # ruff options are defined in pyproject.toml
        ruff check .
