name: rocprofiler-systems Python Linting
run-name: Python

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/rocprofiler-systems-python.yml'
      - 'projects/rocprofiler-systems/pyproject.toml'
      - 'projects/rocprofiler-systems/**/*.py'
  pull_request:
    paths:
      - '.github/workflows/rocprofiler-systems-python.yml'
      - 'projects/rocprofiler-systems/pyproject.toml'
      - 'projects/rocprofiler-systems/**/*.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        sparse-checkout: projects/rocprofiler-systems
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.17.1
    - name: Lint with ruff
      working-directory: projects/rocprofiler-systems
      run: |
        # ruff options are defined in pyproject.toml
        ruff check .
