name: profiler-hub CI
run-name: profiler-hub-ci

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/profiler-hub-ci.yml'
      - 'profilers/profiler-hub/**'
      - '!profilers/profiler-hub/build/**'
      - '!profilers/profiler-hub/docs/**'
      - '!profilers/profiler-hub/README.md'
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/profiler-hub-ci.yml'
      - 'profilers/profiler-hub/**'
      - '!profilers/profiler-hub/build/**'
      - '!profilers/profiler-hub/docs/**'
      - '!profilers/profiler-hub/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No CMake is pinned: both images ship one ahead of apt's on PATH, so a pin
  # would downgrade it.
  #
  # Floors mirrored from profilers/profiler-hub/cmake/*.cmake for the prefix the
  # fetch-disabled lane builds from source. Keep the two in step.
  FMT_VERSION: "11.1.3"
  SPDLOG_VERSION: "1.15.3"
  NLOHMANN_JSON_VERSION: "3.11.3"
  GTEST_VERSION: "1.14.0"
  BENCHMARK_VERSION: "1.8.3"
  # Bump when the prefix *recipe* changes - the build() flags, the set of
  # projects, or anything else affecting the cached prefix that the version
  # numbers above do not already name. Versions alone do not describe the build.
  DEPS_RECIPE_REV: "1"

jobs:
  # Guards the class rather than the instances: a dependency added later
  # cannot reach the network on the default configure without being noticed.
  dependency-gate-lint:
    name: cmake acquisition gate lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            profilers/profiler-hub
            .github/workflows

      - name: Check CMake reaches the network only under the gate
        run: python3 profilers/profiler-hub/scripts/check_dependency_gate.py

      # The callee-side check above proves no CMake file can fetch outside the
      # gate. It never opens a workflow, so it cannot see a job that forgot to
      # state the flag - which has happened once already.
      - name: Check every workflow configuring profiler-hub states the gate
        run: python3 profilers/profiler-hub/scripts/check_workflow_gate.py

  # Lane 1 of 2: downloading is permitted, and stated. Covers the full matrix.
  build-test-fetch:
    name: fetch=ON / ${{ matrix.os }} / ${{ matrix.compiler.name }} / ${{ matrix.build-type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        compiler:
          - { name: gcc,   cc: gcc,   cxx: g++,     pkg: 'gcc g++' }
          - { name: clang, cc: clang, cxx: clang++, pkg: 'clang' }
        build-type: [Debug, Release]

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            profilers/profiler-hub
            .github/workflows

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ${{ matrix.compiler.pkg }} \
            libsqlite3-dev libspdlog-dev libfmt-dev nlohmann-json3-dev \
            libgtest-dev libgmock-dev libbenchmark-dev
          # Installed on both runners on purpose, including where they are too
          # old to satisfy the floors: that exercises reject-then-fetch, which
          # is the case the acquisition gate exists for.

      - name: Configure (fetch enabled)
        working-directory: profilers/profiler-hub
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          cmake --version
          ${CXX} --version
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DPROFILER_HUB_BUILD_TESTS=ON \
            -DPROFILER_HUB_BUILD_BENCHMARKS=ON \
            -DPROFILER_HUB_FETCH_DEPENDENCIES=ON

      - name: Build
        working-directory: profilers/profiler-hub
        run: cmake --build build --parallel $(nproc)

      - name: Verify library artifacts
        working-directory: profilers/profiler-hub
        run: |
          set -e
          test -f build/lib/libprofiler-hub.so || { echo "::error::libprofiler-hub.so not built"; exit 1; }
          test -f build/lib/libprofiler-hub.a  || { echo "::error::libprofiler-hub.a not built";  exit 1; }
          ls -la build/lib/

      - name: Test
        working-directory: profilers/profiler-hub/build
        run: ctest --output-on-failure --output-junit test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.compiler.name }}-${{ matrix.build-type }}
          path: profilers/profiler-hub/build/test-results.xml
          if-no-files-found: warn

  # Lane 2 of 2: same matrix, configure with no network reachable. Only steps
  # named "(network)" may reach out - a convention nothing enforces.
  # The extra cells prove linkage under each toolchain, not stricter acquisition
  # policy.
  build-test-no-fetch:
    name: fetch=OFF / ${{ matrix.os }} / ${{ matrix.compiler.name }} / ${{ matrix.build-type }} / isolated configure
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        compiler:
          - { name: gcc,   cc: gcc,   cxx: g++,     pkg: 'gcc g++' }
          - { name: clang, cc: clang, cxx: clang++, pkg: 'clang' }
        build-type: [Debug, Release]
    env:
      DEPS_PREFIX: ${{ github.workspace }}/deps-prefix

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            profilers/profiler-hub
            .github/workflows

      - name: Install system dependencies (network)
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler.pkg }} util-linux curl

      # Build type is deliberately not in the key: the prefix is always Release,
      # so the Debug and Release cells share one entry. No restore-keys - a
      # partial prefix would configure and then fail to link.
      - name: Restore dependency prefix
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: >-
            profiler-hub-deps-${{ matrix.os }}-${{ matrix.compiler.name }}-recipe${{ env.DEPS_RECIPE_REV }}-fmt${{ env.FMT_VERSION }}-spdlog${{ env.SPDLOG_VERSION }}-json${{ env.NLOHMANN_JSON_VERSION }}-gtest${{ env.GTEST_VERSION }}-benchmark${{ env.BENCHMARK_VERSION }}

      # Built with the cell's own compiler: a clang cell linking a gcc-built
      # prefix would be testing something other than what this lane claims.
      - name: Build dependency prefix from source (network)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          set -euo pipefail
          SRC="${RUNNER_TEMP}/deps-src"
          mkdir -p "${SRC}" "${DEPS_PREFIX}"

          # Same repositories and tags the cmake/*.cmake files declare, so this
          # prefix holds what a fetch-enabled build would have produced.
          clone() { git clone --depth 1 --branch "$2" "$1" "${SRC}/$3"; }
          clone https://github.com/fmtlib/fmt.git       "${FMT_VERSION}"            fmt
          clone https://github.com/gabime/spdlog.git    "v${SPDLOG_VERSION}"        spdlog
          clone https://github.com/nlohmann/json.git    "v${NLOHMANN_JSON_VERSION}" json
          clone https://github.com/google/googletest.git "v${GTEST_VERSION}"        googletest
          clone https://github.com/google/benchmark.git "v${BENCHMARK_VERSION}"     benchmark

          build() {
            local name="$1"; shift
            cmake -S "${SRC}/${name}" -B "${SRC}/${name}/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="${DEPS_PREFIX}" \
              -DCMAKE_PREFIX_PATH="${DEPS_PREFIX}" \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              "$@"
            cmake --build "${SRC}/${name}/build" --parallel "$(nproc)"
            cmake --install "${SRC}/${name}/build"
          }

          build fmt -DFMT_TEST=OFF -DFMT_DOC=OFF
          # External fmt is not optional: cmake/spdlog.cmake rejects a spdlog
          # whose exported target lacks SPDLOG_FMT_EXTERNAL.
          build spdlog -DSPDLOG_FMT_EXTERNAL=ON -DSPDLOG_BUILD_TESTS=OFF -DSPDLOG_BUILD_EXAMPLE=OFF
          build json -DJSON_BuildTests=OFF
          build googletest -DBUILD_GMOCK=ON -DINSTALL_GTEST=ON
          build benchmark -DBENCHMARK_ENABLE_TESTING=OFF -DBENCHMARK_ENABLE_GTEST_TESTS=OFF

      - name: Stage SQLite3 amalgamation (network)
        working-directory: profilers/profiler-hub
        run: |
          set -euo pipefail
          # cmake/sqlite3.cmake clones at configure time outside the gate, so
          # pre-populating its build-tree location is what lets the isolated
          # configure run. Not a fix; the lint lists the same pending exception.
          SQLITE_TAG="$(sed -n 's/.*"\(version-[0-9.]*\)".*/\1/p' cmake/sqlite3.cmake | head -1)"
          test -n "${SQLITE_TAG}" || { echo "::error::could not read SQLITE3_GIT_TAG from cmake/sqlite3.cmake"; exit 1; }
          echo "Staging SQLite3 ${SQLITE_TAG}"
          DST="${PWD}/build-no-fetch/external/sqlite3"
          mkdir -p "$(dirname "${DST}")"
          git clone --depth 1 --filter=blob:none --branch "${SQLITE_TAG}" \
            https://github.com/sqlite/sqlite.git "${DST}"
          (cd "${DST}" && ./configure --disable-tcl && make sqlite3.c)
          test -f "${DST}/sqlite3.c" && test -f "${DST}/sqlite3.h"

      - name: Configure with no network namespace (fetch disabled)
        working-directory: profilers/profiler-hub
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/isolated-configure.sh" <<'ISOLATED'
          set -euo pipefail
          cd "${SRC_DIR}"

          # An isolation wrapper that silently no-ops would leave this lane
          # green with the network up - the exact false negative it exists to
          # prevent. Assert the namespace before trusting the configure.
          ifaces="$(sed -n '3,$s/^[[:space:]]*\([^:]*\):.*/\1/p' /proc/net/dev | grep -v '^lo$' || true)"
          if [[ -n "${ifaces}" ]]; then
            echo "::error::isolation failed open: non-loopback interfaces present: ${ifaces}"
            exit 1
          fi
          if curl -sS --max-time 10 -o /dev/null https://github.com 2>/dev/null; then
            echo "::error::isolation failed open: github.com is reachable inside the namespace"
            exit 1
          fi
          echo "Network namespace confirmed: loopback only, github.com unreachable"

          # No CMake is pinned, so this echo is the only record of the version
          # the 3.25 floor was actually checked against. Keep it.
          cmake --version
          ${CXX} --version

          cmake -S . -B build-no-fetch \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_PREFIX_PATH="${DEPS_PREFIX}" \
            -DPROFILER_HUB_BUILD_TESTS=ON \
            -DPROFILER_HUB_BUILD_BENCHMARKS=ON \
            -DPROFILER_HUB_FETCH_DEPENDENCIES=OFF
          ISOLATED

          # Unprivileged `unshare -rn` needs a user namespace, which Ubuntu
          # 24.04 restricts by default. Take the net namespace as root and drop
          # straight back so the build tree stays owned by the runner account.
          sudo unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env PATH="${PATH}" HOME="${HOME}" \
                CC="${{ matrix.compiler.cc }}" CXX="${{ matrix.compiler.cxx }}" \
                BUILD_TYPE="${{ matrix.build-type }}" \
                SRC_DIR="${PWD}" DEPS_PREFIX="${DEPS_PREFIX}" \
            bash "${RUNNER_TEMP}/isolated-configure.sh"

      - name: Build
        working-directory: profilers/profiler-hub
        run: cmake --build build-no-fetch --parallel $(nproc)

      - name: Verify library artifacts
        working-directory: profilers/profiler-hub
        run: |
          set -e
          test -f build-no-fetch/lib/libprofiler-hub.so || { echo "::error::libprofiler-hub.so not built"; exit 1; }
          test -f build-no-fetch/lib/libprofiler-hub.a  || { echo "::error::libprofiler-hub.a not built";  exit 1; }
          ls -la build-no-fetch/lib/

      - name: Test
        working-directory: profilers/profiler-hub/build-no-fetch
        run: ctest --output-on-failure --output-junit test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-no-fetch-${{ matrix.os }}-${{ matrix.compiler.name }}-${{ matrix.build-type }}
          path: profilers/profiler-hub/build-no-fetch/test-results.xml
          if-no-files-found: warn
