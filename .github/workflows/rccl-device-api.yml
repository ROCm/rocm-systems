name: RCCL device-API CI

# Builds RCCL + rccl-tests with ENABLE_DEVICE_API=1 and runs the device-API
# benchmark suite (symmetric memory / LSA device kernels / GIN proxy) on a single
# 8-GPU node of the Ruby MI350 slurm-backed scale runner.
#
# Topology:
#   GH runner (ruby-linux-slurm-scale-runner)  ── login node
#       ├─ lib/fetch-rocm.sh   download ROCm dist tarball (curl+tar) off the
#       │                       GPU allocation → /apps/rccl-ci, writes rocm.env
#       └─ `sbatch --wait` ──► compute node → lib/device-api.sbatch:
#              build-ompi.sh (OpenMPI) → RCCL install.sh → rccl-tests install.sh
#              → run-device-api-ci.sh (benchmarks)
#
# ROCm/OpenMPI are version-keyed and cached on the shared /apps/rccl-ci NFS mount;
# RCCL and rccl-tests are rebuilt every run so breakage is caught.

# Reusable (called by rccl-ci.yml; also runnable via workflow_dispatch).
on:
  workflow_call:
    inputs:
      rocm_release_channel:
        description: 'TheRock tarball channel (release|nightly|dev|prerelease).'
        type: string
        required: false
        default: 'release'
      rocm_release:
        description: 'ROCm version to fetch, matched as a prefix (e.g. "7.14" = newest 7.14.*; "7.14.0rc1" pins exactly). Empty = newest available.'
        type: string
        required: false
        default: '7.14'
      rocm_amdgpu_family:
        description: 'Specific GPU family fallback if no multi-arch tarball is found.'
        type: string
        required: false
        default: 'gfx950-dcgpu'
      amdgpu_targets:
        description: 'RCCL --amdgpu_targets value (must match the ROCm family ARCH).'
        type: string
        required: false
        default: 'gfx950'
    secrets:
      # Existing GitHub App creds; used only to mint a rockrel-scoped actions:read
      # token for the prerelease-artifacts leg. Optional: without them (or if the
      # App is not installed on rockrel) resolution falls back to nightly.
      # Callers should pass `secrets: inherit` to enable the RC / multi-arch leg.
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      rocm_release_channel:
        description: 'TheRock tarball channel to fetch ROCm from. "release" = durable GA builds (e.g. 7.13.0); "nightly" is retention-limited.'
        type: choice
        required: false
        options:
          - release
          - nightly
          - dev
          - prerelease
        default: release
      rocm_release:
        description: 'ROCm version to fetch, matched as a prefix (e.g. "7.14" = newest 7.14.*; "7.14.0rc1" pins exactly). Empty = newest available. Resolution cascades release -> prerelease -> prerelease-artifacts -> nightly, multiarch-first.'
        type: string
        required: false
        default: '7.14'
      rocm_amdgpu_family:
        description: 'TheRock artifact group / GPU family for the ROCm tarball.'
        type: string
        required: false
        default: 'gfx950-dcgpu'
      amdgpu_targets:
        description: 'RCCL --amdgpu_targets value (must match the ROCm family ARCH).'
        type: string
        required: false
        default: 'gfx950'

permissions:
  contents: read

jobs:
  device-api:
    name: Single node device API Testing
    runs-on: ruby-linux-slurm-scale-runner
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      RCCL_AMDGPU_TARGETS: ${{ inputs.amdgpu_targets || 'gfx950' }}
      ROCM_AMDGPU_FAMILY: ${{ inputs.rocm_amdgpu_family || 'gfx950-dcgpu' }}
      # ROCM_RELEASE is a version prefix (e.g. "7.14"); empty => newest available.
      ROCM_RELEASE: ${{ inputs.rocm_release }}
      ROCM_RELEASE_CHANNEL: ${{ inputs.rocm_release_channel || 'release' }}
      # Stability-first cascade used by fetch-rocm.sh (overrides ROCM_RELEASE_CHANNEL).
      RCCL_ROCM_CHANNELS: 'release prerelease prerelease-artifacts nightly'
      # Add the test matrix's debug_env (NCCL_DEBUG=INFO, ...) to every run.
      RCCL_CI_DEBUG: '1'
      # Per-(run, attempt) checkout+build dir so parallel legs sharing the NFS
      # _work never collide.
      CI_SUBDIR: _ci/device-api-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: ${{ env.CI_SUBDIR }}

      # Mint a short-lived, rockrel-scoped token (actions:read only) from the
      # existing GitHub App, so fetch-rocm.sh can find the ROCm/rockrel release
      # run for the prerelease-artifacts leg (RC + multi-arch tarballs). Requires
      # the App (secrets.APP_ID) to be installed on ROCm/rockrel. continue-on-error
      # so that if it isn't, resolution just falls back to nightly.
      - name: Generate rockrel read token
        id: rockrel-token
        continue-on-error: true
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: rockrel
          permission-actions: read

      - name: Provision ROCm (TheRock, version ${{ inputs.rocm_release || 'latest' }}) on the head node
        env:
          GH_TOKEN: ${{ steps.rockrel-token.outputs.token }}
        run: |
          set -euo pipefail
          export RCCL_DEVICE_API_WORKDIR="${GITHUB_WORKSPACE}/${CI_SUBDIR}"
          # Shared, version-keyed ROCm/OpenMPI cache on /apps NFS (safe to share).
          export RCCL_DEVICE_API_CACHE="${RCCL_DEVICE_API_CACHE:-/apps/rccl-ci}"
          echo "Workdir: ${RCCL_DEVICE_API_WORKDIR}"
          echo "Cache root: ${RCCL_DEVICE_API_CACHE}"
          if ! mkdir -p "${RCCL_DEVICE_API_CACHE}"/{rocm,ompi,downloads}; then
            echo "ERROR: cannot create ${RCCL_DEVICE_API_CACHE} (is /apps writable by $(id -un)?)" >&2
            exit 1
          fi
          # Fetch ROCm on the login node; writes ${workdir}/.ci-out/rocm.env.
          "${RCCL_DEVICE_API_WORKDIR}/projects/rccl/tools/ci/lib/fetch-rocm.sh"

      - name: Submit device-API build+test to SLURM
        run: |
          set -euo pipefail
          export RCCL_DEVICE_API_WORKDIR="${GITHUB_WORKSPACE}/${CI_SUBDIR}"
          logs_dir="${RCCL_DEVICE_API_WORKDIR}/.ci-out/device-api-logs"
          mkdir -p "${logs_dir}"
          cd "${logs_dir}"

          export RCCL_DEVICE_API_CACHE="${RCCL_DEVICE_API_CACHE:-/apps/rccl-ci}"
          echo "Cache root: ${RCCL_DEVICE_API_CACHE}"

          # `--wait` blocks until terminal; `--parsable` makes stdout just the job id.
          set +e
          job_id="$(sbatch --parsable --wait \
            --export=ALL,RCCL_DEVICE_API_WORKDIR,RCCL_DEVICE_API_CACHE,ROCM_RELEASE,ROCM_RELEASE_CHANNEL,ROCM_AMDGPU_FAMILY,RCCL_AMDGPU_TARGETS,RCCL_CI_DEBUG \
            "${RCCL_DEVICE_API_WORKDIR}/projects/rccl/tools/ci/lib/device-api.sbatch")"
          rc=$?
          set -e
          job_id="${job_id%%;*}"
          echo "sbatch --wait rc=${rc}, job_id=${job_id}"
          if [[ ${rc} -ne 0 ]]; then
            echo "ERROR: sbatch reported failure (rc=${rc})" >&2
            exit "${rc}"
          fi

          # `sbatch --wait` can still exit 0 for scheduler-killed jobs (TIMEOUT/OOM/node failure); cross-check via sacct (retry: accounting can lag).
          state=""; exit_code=""
          if [[ -n "${job_id}" ]]; then
            for _ in $(seq 1 10); do
              line="$(sacct -j "${job_id}" -X -n -P --format=State,ExitCode 2>/dev/null | head -n1 || true)"
              state="${line%%|*}"; state="${state%% *}"
              exit_code="${line##*|}"
              case "${state}" in
                ""|RUNNING|PENDING|REQUEUED|COMPLETING|RESIZING) sleep 3 ;;
                *) break ;;
              esac
            done
          fi
          echo "sacct: state=${state:-<unavailable>} exit_code=${exit_code:-<unavailable>}"

          # Only trust an explicit COMPLETED; empty state = no sacct, fall back to rc=0.
          if [[ -n "${state}" && "${state}" != "COMPLETED" ]]; then
            echo "ERROR: job ${job_id} terminal state=${state} (exit ${exit_code})" >&2
            exit 1
          fi
          if [[ -n "${exit_code}" && "${exit_code%%:*}" != "0" ]]; then
            echo "ERROR: job ${job_id} reported ExitCode=${exit_code}" >&2
            exit 1
          fi
          echo "device-api job ${job_id} succeeded (state=${state:-<no sacct>})"

      - name: Dump compute-node logs
        if: always()
        run: |
          logs_dir="${GITHUB_WORKSPACE}/${CI_SUBDIR}/.ci-out/device-api-logs"
          shopt -s nullglob
          # One collapsible group per log; rccl-device-api-* is SLURM's whole-job
          # stream, kept last as a fallback for early/killed jobs.
          dump() {
            local title="$1"; shift
            for f in "$@"; do
              echo "::group::${title}: $(basename "${f}")"
              cat "${f}" || true
              echo "::endgroup::"
            done
          }
          dump "build"     "${logs_dir}"/build-*.out "${logs_dir}"/build-*.err
          dump "test"      "${logs_dir}"/test-*.out  "${logs_dir}"/test-*.err
          dump "scheduler" "${logs_dir}"/rccl-device-api-*.out "${logs_dir}"/rccl-device-api-*.err
          # Verbose per-rank NCCL debug logs (RCCL_CI_DEBUG=1); noisy, kept last.
          dump "nccl-debug" "${logs_dir}"/nccl-debug/nccl-debug.*.log

      - name: Clean up per-job workdir
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE:?}/${CI_SUBDIR:?}"
