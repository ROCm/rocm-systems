name: Block RCCL subtree PRs

# Fails when a pull request targeting develop changes projects/rccl or
# projects/rccl-tests. pull_request_target runs this definition from the
# trusted base branch so a PR cannot rewrite the guard. The job never
# checks out PR code; it only reads PR metadata through the GitHub API.
# Always runs on develop-bound PRs (no path filter) so it can be a
# required status check without blocking unrelated PRs as "expected
# checks were not posted".
# After this lands, add `rccl-subtree-freeze` as a required check on develop.
#
# On/off switch: repository variable RCCL_SUBTREE_FREEZE
# (Settings → Secrets and variables → Actions → Variables).
# Unset or true/on/1 keeps the freeze active. false/off/0 disables it;
# the job still runs and succeeds so a required check is not left pending.

on:
  pull_request_target:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  rccl-subtree-freeze:
    name: rccl-subtree-freeze
    runs-on: ubuntu-24.04
    steps:
      - name: Reject changes under frozen RCCL trees
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RCCL_SUBTREE_FREEZE: ${{ vars.RCCL_SUBTREE_FREEZE }}
        run: |
          set -euo pipefail

          freeze_switch="${RCCL_SUBTREE_FREEZE:-true}"
          freeze_switch="${freeze_switch,,}"
          if [[ "${freeze_switch}" == "false" || "${freeze_switch}" == "off" || "${freeze_switch}" == "0" ]]; then
            msg="RCCL subtree freeze is off (RCCL_SUBTREE_FREEZE=${RCCL_SUBTREE_FREEZE:-unset})."
            echo "${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          frozen_prefixes=(
            "projects/rccl"
            "projects/rccl-tests"
          )
          # GitHub's pull-files REST endpoint returns at most 3000 files.
          max_listed_files=3000

          is_frozen() {
            local path="$1"
            local prefix
            for prefix in "${frozen_prefixes[@]}"; do
              if [[ "$path" == "$prefix" || "$path" == "$prefix/"* ]]; then
                return 0
              fi
            done
            return 1
          }

          fail_closed() {
            echo "::error::$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          if [[ -z "${PR_NUMBER}" ]]; then
            fail_closed "Missing pull request number; failing closed."
          fi

          if ! changed_files=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.changed_files'); then
            fail_closed "Failed to fetch pull request metadata; failing closed."
          fi
          if [[ -z "${changed_files}" || "${changed_files}" == "null" ]]; then
            fail_closed "Pull request metadata omitted changed_files; failing closed."
          fi
          if (( changed_files > max_listed_files )); then
            fail_closed "PR changes ${changed_files} files; GitHub lists at most ${max_listed_files}. Failing closed."
          fi

          files_json=$(mktemp)
          paths_out=$(mktemp)
          # --paginate writes one JSON array per page; jq -s add concatenates them.
          if ! gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" > "${files_json}"; then
            fail_closed "Failed to list pull request files; failing closed."
          fi

          listed_files=$(jq -s 'add // [] | length' "${files_json}")
          if (( listed_files < changed_files )); then
            fail_closed "Listed ${listed_files} files but PR reports ${changed_files}. Failing closed."
          fi

          jq -s -r '(add // [])[] | .filename, (.previous_filename // empty)' "${files_json}" > "${paths_out}"
          mapfile -t paths < "${paths_out}"

          blocked=()
          for path in "${paths[@]}"; do
            [[ -z "$path" ]] && continue
            if is_frozen "$path"; then
              blocked+=("$path")
            fi
          done

          if ((${#blocked[@]} > 0)); then
            {
              echo "### RCCL subtree freeze"
              echo
              echo "This PR cannot land: it modifies frozen trees \`projects/rccl\` and/or \`projects/rccl-tests\`."
              echo
              echo "Blocked paths:"
              echo
              printf -- '- `%s`\n' "${blocked[@]}"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::PR touches frozen RCCL subtrees and cannot be merged."
            exit 1
          fi

          echo "No frozen RCCL subtree paths were changed."
          echo "RCCL subtree freeze: no blocked paths." >> "$GITHUB_STEP_SUMMARY"
