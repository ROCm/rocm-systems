name: Block RCCL subtree PRs

# Fails PRs into develop that touch projects/rccl or projects/rccl-tests.
# pull_request_target runs this workflow and its helper script from the base
# branch, so a PR cannot disable its own guard. There is no path filter, so
# the check posts on every develop PR and can be marked required.
# Flipping RCCL_SUBTREE_FREEZE_ENABLED and merging to develop re-posts the
# check on every open develop PR, so idle PRs follow the current setting.

on:
  pull_request_target:
    branches: [develop]
  push:
    branches: [develop]
    paths:
      - '.github/workflows/rccl-subtree-freeze.yml'
      - '.github/scripts/rccl_subtree_freeze.py'
  workflow_dispatch:

env:
  # Set to false and merge to develop to lift the freeze.
  RCCL_SUBTREE_FREEZE_ENABLED: true

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  rccl-subtree-freeze:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SCRIPT: .github/scripts/rccl_subtree_freeze.py
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/rccl_subtree_freeze.py
          sparse-checkout-cone-mode: false

      - name: Check this PR
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 "$SCRIPT" evaluate --repo "$REPO" --pr "$PR_NUMBER"

      - name: Re-check open develop PRs
        if: github.event_name != 'pull_request_target'
        run: python3 "$SCRIPT" reevaluate-open --repo "$REPO" --base develop
