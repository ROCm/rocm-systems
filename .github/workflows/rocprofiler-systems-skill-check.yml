name: rocprofiler-systems-skill-check

on:
  pull_request:
    paths:
      - "projects/rocprofiler-systems/skills/**"
      - ".github/workflows/rocprofiler-systems-skill-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    uses: amd/skillscope/.github/workflows/reusable.yml@0f734b2dd344cd72b5e016ad6c3b1ac2ce36f6f3 # v0.1.3
    with:
      # One level down: each directory with a SKILL.md is graded on its own.
      # The parent folder is not itself a skill.
      skills: projects/rocprofiler-systems/skills/*
      routing: off
      behavioral: off
