name: rocprofiler-sdk Build CI Docker Images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/rocprofiler-sdk-build-ci-docker-images.yml'
      - 'projects/rocprofiler-sdk/docker/Dockerfile.ci'
  pull_request:
    paths:
      - '.github/workflows/rocprofiler-sdk-build-ci-docker-images.yml'
      - 'projects/rocprofiler-sdk/docker/Dockerfile.ci'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Needed to push/pull cached Docker layers + GHCR images
permissions:
  contents: read
  packages: write

jobs:
  # -----------------------------------------------------------------------------
  # Build a cached CI base image per OS using Buildx + GHA cache (Item #6)
  # -----------------------------------------------------------------------------
  build-ci-images:
    name: Build CI Images • ${{ matrix.system.os }} • ${{ matrix.system.gpu }}
    runs-on: azure-linux-scale-rocm
    strategy:
      fail-fast: false
      matrix:
        system:
          - { os: 'ubuntu-22.04', gpu: 'gfx94X', rocdecode: true, rocjpeg: true }
          - { os: 'ubuntu-22.04', gpu: 'gfx110X', rocdecode: true, rocjpeg: true }
          - { os: 'ubuntu-22.04', gpu: 'gfx120X', rocdecode: true, rocjpeg: true }
          - { os: 'ubuntu-24.04', gpu: 'gfx94X', rocdecode: true, rocjpeg: true }
          - { os: 'ubuntu-24.04', gpu: 'gfx110X', rocdecode: true, rocjpeg: true }
          - { os: 'ubuntu-24.04', gpu: 'gfx120X', rocdecode: true, rocjpeg: true }
          - { os: 'almalinux-8.10', gpu: 'gfx94X', rocdecode: false, rocjpeg: false }
          - { os: 'almalinux-10', gpu: 'gfx94X', rocdecode: false, rocjpeg: false }
          - { os: 'sles-15.7', gpu: 'gfx94X', rocdecode: false, rocjpeg: false }

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            projects/rocprofiler-sdk/ci_docker/

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
          aws --version

      - name: Login to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: docker.io
          username: ${{ secrets.ROCPROFILER_AZURE_CI_USER }}
          password: ${{ secrets.ROCPROFILER_AZURE_CI_PASS }}

      - name: Build and Push Docker Images
        env:
          ROCDECODE_REF: develop
          ROCJPEG_REF: develop
          BUILD_ROCDECODE: ${{ matrix.system.rocdecode }}
          BUILD_ROCJPEG: ${{ matrix.system.rocjpeg }}
        run: |
          chmod +x projects/rocprofiler-sdk/ci_docker/docker-build.sh
          projects/rocprofiler-sdk/ci_docker/docker-build.sh ${{ matrix.system.os }} --push --gpus ${{ matrix.system.gpu }}
