# PerfXpert agent guardrails — CPU-only PR lane.
#
# The constraints this suite covers (tool allowlists, schema field caps, fence
# size, air-gap decision parity, red-team attacks) were previously enforced
# only by tests nobody ran automatically, so a change could contradict them
# and still merge. No GPU and no provider credentials are needed: everything
# here runs air-gapped against fixtures.
name: PerfXpert CI

on:
  pull_request:
    branches: [develop, amd-staging, amd-mainline]
    paths:
      - 'experimental/python/perfxpert/**'
      - '.github/workflows/perfxpert-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: experimental/python/perfxpert

jobs:
  guardrails:
    name: Agent guardrails (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    # No PERFXPERT_AIRGAP here on purpose: several tests exercise live-session
    # wiring against a fake provider and assert behaviour that air-gap mode
    # skips, so forcing it globally would disable the checks it looks like it
    # is strengthening. Tests set the mode they need. Nothing in this lane
    # reaches a network provider; no credentials are configured.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          set-safe-directory: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # PERFXPERT_SKIP_BUNDLED_BUILD: setup.py otherwise builds the bundled
      # perfxpert-code binary, which needs bun and the opencode submodule.
      # Neither is present on a clean runner, and no test in this lane uses
      # the binary.
      #
      # The litellm extra is not optional for coverage: it is what routes
      # non-OpenAI models, so without it that path skips itself and CI would
      # report green on a lane it never ran.
      - name: Install
        env:
          PERFXPERT_SKIP_BUNDLED_BUILD: '1'
        run: python -m pip install --upgrade pip && pip install -e '.[dev,litellm]'

      - name: Agent construction and runtime guardrails
        run: pytest tests/test_agents tests/test_runtime -q

      - name: Fence composition
        run: pytest tests/test_fence -q

      - name: Air-gap and output parity
        run: pytest tests/test_parity tests/test_integration/test_airgap_parity.py -q

      - name: Red team
        run: pytest tests/test_red_team -q

      - name: Regression gate false positives
        run: pytest tests/test_regression_gate -q

      - name: Exit dashboard
        run: pytest tests/test_exit_dashboard -q
