name: rocprofiler-compute Formatting

on:
  push:
    branches:
      - develop
    paths:
      - 'projects/rocprofiler-compute/**'
  pull_request:

permissions:
  contents: read

concurrency:
  # PRs: group by PR number so a new commit cancels in-flight runs.
  # Pushes: group by SHA so postsubmit runs never cancel each other.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit / rocprofiler-compute
    runs-on: ubuntu-24.04
    steps:
      # Fetch commit/tree history without checking out the source or submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: .github/actions/scoped-formatting

      - uses: ./.github/actions/scoped-formatting
        with:
          include: '^(projects/rocprofiler-compute/|\.github/workflows/rocprofiler-compute-formatting\.yml\Z)'
          exclude: '(\.(md|rst|rtf)\Z|(^|/)\.(readthedocs|markdownlint-ci2|spellcheck\.local)\.yaml\Z|(^|/)\.wordlist\.txt\Z|^docs/|^projects/[^/]+/docs/)'
          config: projects/rocprofiler-compute/.pre-commit-config.yaml
          submodules: recursive
