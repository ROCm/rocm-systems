
name: rocprofiler-systems Clang-Tidy
run-name: clang-tidy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rocprofiler-systems-clang-tidy.yml'
      - 'projects/rocprofiler-systems/.clang-tidy'
      - 'projects/rocprofiler-systems/scripts/clang-tidy-check.py'
      - 'projects/rocprofiler-systems/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!projects/rocprofiler-systems/docs/**'
      - '!projects/rocprofiler-systems/source/docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    container:
      image: dgaliffiamd/rocprofiler-systems:ci-rocm-7.2-ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            projects/rocprofiler-systems
            .gitmodules
          submodules: recursive

      - name: Configure ROCm environment
        run: |
          echo "/opt/rocm/bin" >> $GITHUB_PATH
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: CMake configure
        working-directory: projects/rocprofiler-systems
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$PWD"
          cmake --preset debug

      - name: Run clang-tidy-check
        working-directory: projects/rocprofiler-systems
        run: |
          python3 scripts/clang-tidy-check.py \
            --base "origin/${{ github.base_ref }}" \
            --build-path build/debug
