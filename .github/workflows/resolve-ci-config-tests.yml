name: resolve-ci-config Tests
run-name: resolve-ci-config-tests

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/actions/rocprofiler-sdk-util/resolve-ci-config/**'
      - '.github/workflows/resolve-ci-config-tests.yml'
  pull_request:
    paths:
      - '.github/actions/rocprofiler-sdk-util/resolve-ci-config/**'
      - '.github/workflows/resolve-ci-config-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/rocprofiler-sdk-util/resolve-ci-config

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Run tests
        working-directory: .github/actions/rocprofiler-sdk-util/resolve-ci-config
        run: python -m unittest test_resolve_ci_config -v
