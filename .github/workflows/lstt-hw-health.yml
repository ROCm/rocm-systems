# Reports the BIOS, BMC and GPU state of each LSTT lab machine and compares it
# with a checked-in baseline, so an undocumented firmware or driver change on a
# CI host shows up as a red job naming the host and the layer.
#
# Baselines live in .github/lstt/baselines/<host>.env. An empty EXPECT_* value
# is reported but not enforced, which is how a host is onboarded before its
# target versions are agreed.
name: LSTT hardware health

on:
  pull_request:
    paths:
      - '.github/workflows/lstt-hw-health.yml'
      - '.github/lstt/baselines/**'
  workflow_dispatch:
  schedule:
    # Nightly drift check. Schedules only run from the default branch, so this
    # starts firing after merge, not on the PR.
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  health:
    name: ${{ matrix.host }}
    # Self-hosted lab hardware: never auto-run untrusted fork-PR code on it.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: lsttstrix
            label: lstt-gfx1151
            gfx: gfx1151
            bmc: false
    runs-on:
      - self-hosted
      - ${{ matrix.label }}
    timeout-minutes: 20
    env:
      BASELINE: .github/lstt/baselines/${{ matrix.host }}.env

    steps:
      # Every workflow on a runner shares one $GITHUB_WORKSPACE, and the other
      # CI jobs here run their containers as root, so the leftovers they
      # abandon are root-owned. These steps run bare as the `runner` user,
      # which cannot delete them, and checkout's clean step would die with
      # EACCES. Borrow root from a container to clear the directory first.
      - name: Clean workspace
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            alpine:3 find . -mindepth 1 -delete

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/lstt/baselines
          sparse-checkout-cone-mode: false

      # Host-level, so no container: /sys/class/dmi is what the firmware
      # exposes to the booted kernel.
      - name: BIOS
        shell: bash
        run: |
          set -euo pipefail
          # A baseline that omits a key must behave like an empty one, not
          # trip `set -u`.
          . "$BASELINE"
          : "${EXPECT_BIOS:=}"
          got="$(cat /sys/class/dmi/id/bios_version)"
          bios_date="$(cat /sys/class/dmi/id/bios_date)"
          product="$(cat /sys/class/dmi/id/product_name)"
          echo "### ${{ matrix.host }} ($product)" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${EXPECT_BIOS}" ]; then
            echo "- BIOS: $got ($bios_date) — no baseline recorded" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$got" = "${EXPECT_BIOS}" ]; then
            echo "- BIOS: $got ($bios_date)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- BIOS: $got, expected ${EXPECT_BIOS}" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::BIOS is $got but the baseline says ${EXPECT_BIOS}. Update $BASELINE if the change was intended."
            exit 1
          fi

      # In-band IPMI through the host's own BMC device, so no network
      # credentials are needed. Requires ipmitool and /dev/ipmi0 on the host.
      - name: BMC
        if: ${{ matrix.bmc }}
        shell: bash
        run: |
          set -euo pipefail
          . "$BASELINE"
          : "${EXPECT_BMC:=}"
          sudo ipmitool mc info > mc.txt
          got="$(awk -F': *' '/Firmware Revision/ {print $2; exit}' mc.txt)"
          if [ -z "${EXPECT_BMC}" ]; then
            echo "- BMC: $got — no baseline recorded" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$got" = "${EXPECT_BMC}" ]; then
            echo "- BMC: $got" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- BMC: $got, expected ${EXPECT_BMC}" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::BMC firmware is $got but the baseline says ${EXPECT_BMC}."
            exit 1
          fi

      # Recent hardware events (ECC errors, fan and power faults) that are
      # otherwise only visible by logging in to the BMC. Never fails the job.
      - name: BMC event log
        if: ${{ matrix.bmc && !cancelled() }}
        shell: bash
        run: |
          {
            echo "<details><summary>Recent BMC events</summary>"
            echo
            echo '```'
            sudo ipmitool sel elist 2>&1 | tail -20 || echo "could not read the event log"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # The driver version the host booted, which is what the GPU step below
      # depends on. Checked outside the container for the same reason as BIOS.
      - name: amdgpu driver
        shell: bash
        run: |
          set -euo pipefail
          . "$BASELINE"
          : "${EXPECT_AMDGPU:=}"
          got="$(cat /sys/module/amdgpu/version 2>/dev/null || echo not-loaded)"
          if [ "$got" = not-loaded ]; then
            echo "- amdgpu: not loaded" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The amdgpu module is not loaded, so no GPU test can run on this host."
            exit 1
          fi
          if [ -n "${EXPECT_AMDGPU}" ] && [ "$got" != "${EXPECT_AMDGPU}" ]; then
            echo "- amdgpu: $got, expected ${EXPECT_AMDGPU}" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::amdgpu is $got but the baseline says ${EXPECT_AMDGPU}."
            exit 1
          fi
          echo "- amdgpu: $got" >> "$GITHUB_STEP_SUMMARY"

      # The same container shape the real CI jobs use, so this proves what they
      # need: the devices are passed through and ROCm sees the right ASIC.
      - name: GPU
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri --group-add video \
            rocm/dev-ubuntu-22.04:7.2 \
            bash -c 'rocminfo | grep -E "Marketing Name|gfx" | sort -u; rocminfo | grep -q ${{ matrix.gfx }}' \
            > gpu.txt 2>&1 || { cat gpu.txt; echo "::error::${{ matrix.gfx }} was not visible inside the container."; exit 1; }
          {
            echo "- GPU: ${{ matrix.gfx }} visible"
            echo "<details><summary>rocminfo</summary>"
            echo
            echo '```'
            cat gpu.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
