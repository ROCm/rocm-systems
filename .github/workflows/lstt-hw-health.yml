# Reports the BIOS, BMC and GPU state of each LSTT lab machine and compares it
# with the expected values in the matrix, so an undocumented firmware or driver
# change on a CI host shows up as a red job naming the host and the layer.
#
# This repository is public. System BIOS and BMC firmware are public releases,
# so the expected values live in the matrix below, and a value is printed only
# when it equals the one committed there. A difference is reported without
# either value. The amdgpu driver on the lab hosts is an internal build: its
# version is never read into a log, only whether the module is loaded.
#
# An empty or missing expected value is reported as not recorded and not
# enforced, which is how a host is onboarded. To record or bump one, read it on
# the host (cat /sys/class/dmi/id/bios_version) and change the matrix.
name: LSTT hardware health

on:
  pull_request:
    paths:
      - '.github/workflows/lstt-hw-health.yml'
  workflow_dispatch:
  schedule:
    # Nightly drift check. Schedules only run from the default branch, so this
    # starts firing after merge, not on the PR.
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  health:
    name: ${{ matrix.host }}
    # Self-hosted lab hardware: never auto-run untrusted fork-PR code on it.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: lsttstrix
            label: lstt-gfx1151
            gfx: gfx1151
            bios: 'X53 Ver. 01.08.00'
            bmc: false
    runs-on:
      - self-hosted
      - ${{ matrix.label }}
    timeout-minutes: 20

    steps:
      # Host-level, so no container: /sys/class/dmi is what the firmware
      # exposes to the booted kernel. Nothing here reads the repository, so
      # there is no checkout.
      - name: BIOS
        shell: bash
        env:
          HOST: ${{ matrix.host }}
          EXPECT_BIOS: ${{ matrix.bios }}
        run: |
          set -euo pipefail
          got="$(cat /sys/class/dmi/id/bios_version)"
          echo "### ${HOST}" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${EXPECT_BIOS}" ]; then
            echo "- BIOS: not recorded for this host" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$got" = "${EXPECT_BIOS}" ]; then
            echo "- BIOS: $got (matches)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- BIOS: differs from the expected value" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::BIOS on ${HOST} differs from the value in the matrix of lstt-hw-health.yml. Read it on the host, and change the matrix if the update was intended."
            exit 1
          fi

      # In-band IPMI through the host's own BMC device, so no network
      # credentials are needed. Requires ipmitool and /dev/ipmi0 on the host.
      - name: BMC
        if: ${{ matrix.bmc }}
        shell: bash
        env:
          HOST: ${{ matrix.host }}
          EXPECT_BMC: ${{ matrix.bmc_firmware }}
        run: |
          set -euo pipefail
          got="$(sudo ipmitool mc info | awk -F': *' '/Firmware Revision/ {print $2; exit}')"
          if [ -z "${EXPECT_BMC}" ]; then
            echo "- BMC: not recorded for this host" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$got" = "${EXPECT_BMC}" ]; then
            echo "- BMC: $got (matches)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- BMC: differs from the expected value" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::BMC firmware on ${HOST} differs from the value in the matrix of lstt-hw-health.yml."
            exit 1
          fi

      # Whether the module the GPU step below depends on is loaded. The version
      # is never printed: it is an internal build.
      - name: amdgpu driver
        shell: bash
        run: |
          set -euo pipefail
          if ! cat /sys/module/amdgpu/version > /dev/null 2>&1; then
            echo "- amdgpu: not loaded" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The amdgpu module is not loaded, so no GPU test can run on this host."
            exit 1
          fi
          echo "- amdgpu: loaded" >> "$GITHUB_STEP_SUMMARY"

      # The same container shape the real CI jobs use, so this proves what they
      # need: the devices are passed through and ROCm sees the right ASIC.
      # Nothing from rocminfo or docker is printed: its output includes the
      # kernel driver version, and a log of a failure would too.
      - name: GPU
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm \
              --device=/dev/kfd --device=/dev/dri --group-add video \
              rocm/dev-ubuntu-22.04:7.2 \
              bash -c 'rocminfo | grep -q ${{ matrix.gfx }}' > /dev/null 2>&1; then
            echo "- GPU: ${{ matrix.gfx }} visible" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- GPU: ${{ matrix.gfx }} not visible" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${{ matrix.gfx }} was not visible inside the container. Run the same docker command on the host for details."
            exit 1
          fi
