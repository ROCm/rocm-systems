# Reports the BIOS and GPU state of each LSTT CI host, so a firmware or driver
# change on a host shows up in the job summary naming the host and the layer.
# Nothing is recorded or compared: the job reads the current state and checks
# that the host is the one the matrix row names, that the amdgpu module is
# loaded, and that ROCm sees the expected GPU.
#
# This repository is public. System BIOS firmware is a public release, so its
# version is printed. The amdgpu driver on these hosts is an internal build: its
# version is never read into a log, only whether the module is loaded.
#
# The checks live in .github/scripts/lstt_hw_health.py, so the same command
# can be run by hand on a host and gives the same result as this job.
#
# There is no BMC step yet: no host in the matrix has a BMC. Add one with the
# first host that does, together with a green run. It needs ipmitool and
# /dev/ipmi0 on the host, and a passwordless sudo rule for the runner user so
# that `sudo -n ipmitool` fails at once, with a clear message, without it.
name: LSTT hardware health

on:
  pull_request:
    paths:
      - '.github/workflows/lstt-hw-health.yml'
      - '.github/scripts/lstt_hw_health.py'
  workflow_dispatch:
  schedule:
    # Nightly report. Schedules only run from the default branch, so this
    # starts firing after merge, not on the PR.
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  health:
    name: ${{ matrix.host }}
    # Self-hosted hardware: never auto-run untrusted fork-PR code on it.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: lsttstrix
            label: lstt-gfx1151
            gfx: gfx1151
    runs-on:
      - ${{ matrix.label }}
      - ${{ matrix.host }}
    timeout-minutes: 20

    steps:
      # Only the script is needed, so the fetch is sparse.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts/lstt_hw_health.py
          sparse-checkout-cone-mode: false

      # Host-level, so no container: /sys/class/dmi is what the firmware
      # exposes to the booted kernel. The script checks the host identity first
      # (a GPU label can be on several hosts, so runs-on also selects by host
      # name), then BIOS, the amdgpu module and the GPU, and reports every
      # layer even when one fails.
      - name: Hardware health
        shell: bash
        env:
          HOST: ${{ matrix.host }}
          GFX: ${{ matrix.gfx }}
        run: python3 .github/scripts/lstt_hw_health.py --host "$HOST" --gfx "$GFX"
