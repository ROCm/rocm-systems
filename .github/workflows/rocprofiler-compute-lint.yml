name: rocprofiler-compute Lint

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-22.04
    outputs:
      rocprofiler-compute: ${{ steps.detect.outputs.rocprofiler-compute }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Detect rocprofiler-compute changes
      id: detect
      run: |
        git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
        if git diff --name-only FETCH_HEAD HEAD | grep -q '^projects/rocprofiler-compute/'; then
          echo "rocprofiler-compute=true" >> "${GITHUB_OUTPUT}"
        else
          echo "rocprofiler-compute=false" >> "${GITHUB_OUTPUT}"
        fi

  python:
    needs: filter
    if: ${{ needs.filter.outputs.rocprofiler-compute == 'true' }}
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        sparse-checkout: projects/rocprofiler-compute
    - name: Set up Python '3.x'
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      working-directory: projects/rocprofiler-compute
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff==0.14.11
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
    - name: Run Ruff Linter and Import Sorter
      working-directory: projects/rocprofiler-compute
      run: |
        ruff check . --fix --exit-zero
    - name: Run Ruff Formatter
      working-directory: projects/rocprofiler-compute
      run: |
        ruff format .
    - name: Check for formatting/linting changes
      working-directory: projects/rocprofiler-compute
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add -A .
        if ! git diff --cached --quiet; then
          echo "::error::Files were modified by ruff. Please run 'ruff check . --fix && ruff format .' locally and commit the changes."
          git diff --cached --patch
          exit 1
        else
          echo "Ruff found no issues or all issues were fixed and files are clean."
        fi

  cmake:
    needs: filter
    if: ${{ needs.filter.outputs.rocprofiler-compute == 'true' }}
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: projects/rocprofiler-compute
    - name: Install dependencies
      working-directory: projects/rocprofiler-compute
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip
        python3 -m pip install gersemi==0.22.1
    - name: gersemi
      working-directory: projects/rocprofiler-compute
      run: |
        set +e
        gersemi -i $(find . -type f | egrep 'CMakeLists.txt|\.cmake$')
        if [ $(git diff | wc -l) -gt 0 ]; then
          echo -e "\nError! CMake code not formatted. Run gersemi...\n"
          echo -e "\nFiles:\n"
          git diff --name-only
          echo -e "\nFull diff:\n"
          git diff
          exit 1
        fi

  cxx:
    needs: filter
    if: ${{ needs.filter.outputs.rocprofiler-compute == 'true' }}
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: projects/rocprofiler-compute
    - name: Install dependencies
      working-directory: projects/rocprofiler-compute
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip
        python3 -m pip install clang-format==22.1.0
    - name: clang-format
      working-directory: projects/rocprofiler-compute
      run: |
        set +e
        clang-format -i $(find src -type f | egrep '\.(h|hpp|hh|c|cc|cpp)(|\.in)$')
        if [ $(git diff | wc -l) -gt 0 ]; then
          echo -e "\nError! cxx code not formatted. Run clang-format...\n"
          echo -e "\nFiles:\n"
          git diff --name-only
          echo -e "\nFull diff:\n"
          git diff
          exit 1
        fi

  python-bytecode:
    needs: filter
    if: ${{ needs.filter.outputs.rocprofiler-compute == 'true' }}
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: projects/rocprofiler-compute
    - name: find-bytecode
      working-directory: projects/rocprofiler-compute
      run: |
        set +e
        FILES=$(find . -type f | egrep '__pycache__|\.pyc$')
        if [ -n "${FILES}" ]; then
          echo -e "\nError! Python bytecode included in commit\n"
          echo -e "### FILES: ###"
          echo -e "${FILES}"
          echo -e "##############"
          exit 1
        fi
