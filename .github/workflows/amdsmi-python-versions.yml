# ---------------------------------------------------------------------------
# AMD SMI Python-version loader tests.
#
# The amdsmi loader and wrapper must behave identically across every CPython
# version AMD SMI supports (3.6.8 through the latest release). This job runs the
# version-independent loader contract tests under a matrix of interpreters so a
# change that only breaks on a specific version is caught. No GPU required.
# ---------------------------------------------------------------------------

name: AMDSMI Python Version Tests

on:
  pull_request:
    branches: [develop]
    paths:
      - 'projects/amdsmi/py-interface/**'
      - 'projects/amdsmi/tools/generator.py'
      - 'projects/amdsmi/tools/disable_system_fallback.py'
      - 'projects/amdsmi/tests/python/**'
      - 'projects/amdsmi/tests/run_amdsmi_python_versions_test.py'
      - '.github/workflows/amdsmi-python-versions.yml'
  push:
    branches: [develop]
    paths:
      - 'projects/amdsmi/py-interface/**'
      - 'projects/amdsmi/tools/generator.py'
      - 'projects/amdsmi/tools/disable_system_fallback.py'
      - 'projects/amdsmi/tests/python/**'
      - 'projects/amdsmi/tests/run_amdsmi_python_versions_test.py'
      - '.github/workflows/amdsmi-python-versions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Group by PR number so a new push supersedes the previous run. Pushes to
  # develop fall back to the commit sha, which is unique, so post-merge runs
  # never cancel each other.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  python-version-tests:
    name: Python ${{matrix.python-version}}
    # Self-hosted runner: never auto-run untrusted fork-PR code on it.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    timeout-minutes: 15
    # Job container: other lstt-ci jobs leave root-owned files a host-side
    # checkout can't clean. Official python images, mirrored to the runners'
    # local registry; the full variants ship git for actions/checkout.
    container:
      image: localhost:5000/python:${{matrix.python-version}}-${{matrix.debian}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: '3.6',  debian: bullseye }
          - { python-version: '3.7',  debian: bullseye }
          - { python-version: '3.8',  debian: bookworm }
          - { python-version: '3.9',  debian: bookworm }
          - { python-version: '3.10', debian: bookworm }
          - { python-version: '3.11', debian: bookworm }
          - { python-version: '3.12', debian: bookworm }
          - { python-version: '3.13', debian: bookworm }
          - { python-version: '3.14', debian: bookworm }

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # rocm-systems is a large monorepo; only the amdsmi tests are needed.
          sparse-checkout: |
            projects/amdsmi
            .github/workflows

      - name: Run loader tests under this interpreter
        run: |
          python${{matrix.python-version}} projects/amdsmi/tests/run_amdsmi_python_versions_test.py \
            --interpreters "$(command -v python${{matrix.python-version}})"
