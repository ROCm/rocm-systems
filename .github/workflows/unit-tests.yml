name: Scoped Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: unit-tests / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Register lightweight suites here with their inputs and test command.
      # Every row inspects the complete Git diff before installing dependencies.
      matrix:
        include:
          - suite: changed-files
            include: '^\.github/actions/changed-files/'
            sparse-checkout: |
              .github/actions/changed-files
              .github/workflows
            dependencies: pyyaml
            run: python -B -m unittest discover -s .github/actions/changed-files/tests -v
          - suite: formatting
            include: '^\.github/(actions/scoped-formatting/|workflows/)'
            sparse-checkout: |
              .github/actions/changed-files
              .github/actions/scoped-formatting
              .github/workflows
            dependencies: pyyaml
            run: python -B -m unittest discover -s .github/actions/scoped-formatting/tests -v
          - suite: systems-pr-bot
            include: '^(tools/systems_pr_bot/|\.github/workflows/)'
            sparse-checkout: |
              tools/systems_pr_bot
              .github/workflows
            dependencies: requests pyyaml
            run: python -B tools/systems_pr_bot/test_policy_check_ut.py -v
    steps:
      - name: Checkout scope inspector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: .github/actions/changed-files

      - name: Select tests from the complete diff
        id: scope
        uses: ./.github/actions/changed-files
        with:
          include: ${{ matrix.include }}
          always-include: '^\.github/(actions/changed-files/|workflows/unit-tests\.yml\Z)'

      - name: Checkout test inputs
        if: steps.scope.outputs.affected == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ matrix.sparse-checkout }}

      - name: Set up Python
        if: steps.scope.outputs.affected == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install test dependencies
        if: steps.scope.outputs.affected == 'true' && matrix.dependencies != ''
        env:
          TEST_DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          read -r -a dependencies <<< "$TEST_DEPENDENCIES"
          python -m pip install "${dependencies[@]}"

      - name: Run tests
        if: steps.scope.outputs.affected == 'true'
        run: ${{ matrix.run }}
