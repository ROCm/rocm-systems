# Shared pre-commit formatting gate.
#
# The job below MUST stay named `pre-commit`: that is the check-run name
# therock-pr-bot requires (`required_check_runs` in
# tools/systems_pr_bot/policy.yml). Renaming it, or making it a matrix, makes
# the bot wait 900s for a check that never appears.
#
# To onboard a project: see ONBOARDED_SUBTREES in
# .github/scripts/run_pre_commit_by_subtree.py, which lists all of the steps.
name: "Pre-commit Format & Lint"
on:
  pull_request:
    branches:
      - develop
    paths:
      - "projects/rccl/**"
      - ".github/workflows/pre-formatting.yml"
      - ".github/scripts/run_pre_commit_by_subtree.py"
      - ".github/scripts/tests/test_run_pre_commit_by_subtree.py"
      # This job's file list comes from pr_detect_changed_subtrees.py reading
      # repos-config.json, so a change to either can silently empty the gate.
      # Both are listed here so such a PR is checked by the gate it changes.
      - ".github/scripts/pr_detect_changed_subtrees.py"
      - ".github/repos-config.json"
      - ".pre-commit-config.yaml"
      # Do NOT add '!**/*.md'-style negations here. rccl's hooks genuinely
      # check Markdown, and because this workflow publishes the only check-run
      # the bot requires, a paths: miss means no check-run at all and a 900s
      # bot timeout -- not a skipped check.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code (initial)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          # 2 commits: the merge ref plus its first parent, which is the base
          # commit the merge was computed against. See "Get list of changed
          # files" below.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest requests pre-commit

      - name: Unit-test the subtree runner
        # This job's verdict is only as trustworthy as the script that decides
        # which files get checked, so test it before believing its green.
        run: python -m pytest .github/scripts/tests/test_run_pre_commit_by_subtree.py

      - name: Detect changed subtrees
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .github/scripts/pr_detect_changed_subtrees.py \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --config ".github/repos-config.json"

      - name: Checkout full repo with changed subtrees
        if: steps.detect.outputs.subtrees
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          sparse-checkout: |
            .github
            ${{ steps.detect.outputs.subtrees }}
          fetch-depth: 2
          submodules: false

      - name: Get list of changed files
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail
          # HEAD is refs/pull/N/merge. Its first parent is the base commit that
          # merge was computed against, so `HEAD^ HEAD` is exactly this PR's
          # own change -- the same idiom therock-ci.yml uses.
          #
          # Do NOT diff against a freshly fetched base tip instead. The merge
          # ref is recomputed asynchronously, so once develop moves the diff
          # also contains the REVERSE of everything merged in the window, and
          # this job would fail a contributor for files they never touched.
          #
          # --diff-filter=ACMR drops deletions: they are not on disk, and
          # pre-commit cannot check a file that no longer exists.
          git diff --name-only --diff-filter=ACMR HEAD^1 HEAD \
            > "$RUNNER_TEMP/changed-files.txt"
          echo "Changed files:"
          sed 's/^/  /' "$RUNNER_TEMP/changed-files.txt"

      - name: Run pre-commit
        shell: bash
        run: |
          set -euo pipefail
          # Check-only: this publishes the check-run the bot requires, so a
          # formatting failure must fail the job. Each onboarded subtree is
          # checked with its own config -- see the script for why the root
          # config cannot be used.
          python .github/scripts/run_pre_commit_by_subtree.py \
            --files-from "$RUNNER_TEMP/changed-files.txt"
