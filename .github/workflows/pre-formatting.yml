# Shared pre-commit formatting gate.
#
# The job below MUST stay named `pre-commit`: that becomes the published
# check-run name, and therock-pr-bot declares `required_check_runs: [pre-commit]`
# in tools/systems_pr_bot/policy.yml. Renaming it — or turning this into a
# matrix, which suffixes the job name — makes the bot wait 900s for a check that
# never appears. Do not add a `name:` to the job.
#
# Scope is controlled by `paths:` below plus ONBOARDED_SUBTREES in
# .github/scripts/run_pre_commit_by_subtree.py. Onboarding a project is those
# two lines; files outside an onboarded subtree are ignored rather than being
# checked against the repo-root config.
name: "Pre-commit Format & Lint"
on:
  pull_request:
    branches:
      - develop
    # Only PRs touching an onboarded subtree (or this job's own machinery) run
    # the gate. Add a project's path here when it onboards.
    paths:
      - "projects/rccl/**"
      - ".github/workflows/pre-formatting.yml"
      - ".github/scripts/run_pre_commit_by_subtree.py"
      - ".pre-commit-config.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    # Formatting finishes in ~2 minutes; the 360-minute default just burns a
    # runner if pip or a hook mirror hangs.
    timeout-minutes: 20
    steps:
#      - name: Generate a token
#        id: generate-token
#        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
#        with:
#          app-id: ${{ secrets.APP_ID }}
#          private-key: ${{ secrets.APP_PRIVATE_KEY }}
#          owner: ${{ github.repository_owner }}

      - name: Checkout code (initial)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic requests pre-commit

      - name: Detect changed subtrees
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .github/scripts/pr_detect_changed_subtrees.py \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --config ".github/repos-config.json"

      - name: Checkout full repo with changed subtrees
        if: steps.detect.outputs.subtrees
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          sparse-checkout: |
            .github
            ${{ steps.detect.outputs.subtrees }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false

      - name: Get list of changed files
        id: changed-files
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin -- "$BASE_REF"
          # Written to a file, not a space-joined step output: paths may contain
          # spaces, and joining then re-splitting on IFS corrupts them.
          git diff --name-only FETCH_HEAD HEAD > "$RUNNER_TEMP/changed-files.txt"
          echo "Changed files:"
          sed 's/^/  /' "$RUNNER_TEMP/changed-files.txt"

      - name: Disable submodule recursion
        run: git config submodule.recurse false

      - name: Run pre-commit
        shell: bash
        run: |
          set -euo pipefail
          # Check-only. This job publishes the repo's single required check, so
          # a formatting failure must fail the job — it previously wrapped the
          # run in `set +e` and auto-committed fixes instead, which meant the
          # gate could never go red.
          #
          # Each onboarded subtree is checked with its OWN .pre-commit-config.yaml.
          # The root config cannot be used for them: they are listed in its
          # `exclude:` block (so it would check nothing and exit 0), and for
          # projects/rccl its clang-format v18.1.4 pin cannot even parse
          # projects/rccl/.clang-format.
          python .github/scripts/run_pre_commit_by_subtree.py \
            --files-from "$RUNNER_TEMP/changed-files.txt"
