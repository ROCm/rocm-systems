# Shared pre-commit formatting gate.
#
# The job below MUST stay named `pre-commit`: that is the check-run name
# therock-pr-bot requires (`required_check_runs` in
# tools/systems_pr_bot/policy.yml). Renaming it, or making it a matrix, makes
# the bot wait 900s for a check that never appears.
#
# To onboard a project: add its path to `paths:` and to ONBOARDED_SUBTREES in
# .github/scripts/run_pre_commit_by_subtree.py.
name: "Pre-commit Format & Lint"
on:
  pull_request:
    branches:
      - develop
    paths:
      - "projects/rccl/**"
      - ".github/workflows/pre-formatting.yml"
      - ".github/scripts/run_pre_commit_by_subtree.py"
      - ".pre-commit-config.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
#      - name: Generate a token
#        id: generate-token
#        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
#        with:
#          app-id: ${{ secrets.APP_ID }}
#          private-key: ${{ secrets.APP_PRIVATE_KEY }}
#          owner: ${{ github.repository_owner }}

      - name: Checkout code (initial)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic requests pre-commit

      - name: Detect changed subtrees
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .github/scripts/pr_detect_changed_subtrees.py \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --config ".github/repos-config.json"

      - name: Checkout full repo with changed subtrees
        if: steps.detect.outputs.subtrees
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          sparse-checkout: |
            .github
            ${{ steps.detect.outputs.subtrees }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false

      - name: Get list of changed files
        id: changed-files
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin -- "$BASE_REF"
          # A file, not a space-joined step output: paths may contain spaces.
          git diff --name-only FETCH_HEAD HEAD > "$RUNNER_TEMP/changed-files.txt"
          echo "Changed files:"
          sed 's/^/  /' "$RUNNER_TEMP/changed-files.txt"

      - name: Disable submodule recursion
        run: git config submodule.recurse false

      - name: Run pre-commit
        shell: bash
        run: |
          set -euo pipefail
          # Check-only: this publishes the repo's single required check, so a
          # formatting failure must fail the job. Each onboarded subtree is
          # checked with its own config -- see the script for why the root
          # config cannot be used.
          python .github/scripts/run_pre_commit_by_subtree.py \
            --files-from "$RUNNER_TEMP/changed-files.txt"
