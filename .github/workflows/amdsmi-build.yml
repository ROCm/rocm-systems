# ---------------------------------------------------------------------------
# AMD-SMI CI.
#
# Builds, installs, and tests AMD-SMI against AMD GPUs on self-hosted
# runners BM/VM, using per-distro containers to cover a matrix of
# Debian/RPM distros. TheRock CI only runs in containers so it doesn't cover
# every scenario
#
# Aims to follow TheRock CI conventions as closely as possible.
# ---------------------------------------------------------------------------

name: AMDSMI CI

on:
  pull_request:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/amdsmi-build.yml'
  push:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/amdsmi-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Group by PR number so a new push supersedes the previous run. Pushes to
  # develop fall back to the commit sha, which is unique, so post-merge runs
  # never cancel each other.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: true
  BUILD_TYPE: Release
  ROCM_DIR: /opt/rocm

defaults:
  run:
    shell: bash

jobs:
  manylinux-build:
    name: Build (Manylinux Gate)
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    env:
      BUILD_DIR: /tmp/amdsmi-build

    steps:
      # rocm-systems is a large monorepo; the wheel gate only needs the amdsmi
      # project and this workflow, so sparse-checkout keeps the fetch cheap.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            projects/amdsmi
            .github/workflows

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select build interpreter
        run: |
          set -euo pipefail
          # The manylinux image periodically drops EOL interpreters
          # (e.g. cp38 was removed once Python 3.8 reached end-of-life),
          # so pick the newest available stable CPython rather than
          # hardcoding a version that may vanish on the next image bump.
          PY_BUILD=""
          for _py in cp313 cp312 cp311 cp310 cp39; do
            _cand="/opt/python/${_py}-${_py}/bin/python3"
            if [ -x "$_cand" ]; then PY_BUILD="$_cand"; break; fi
          done
          if [ -z "$PY_BUILD" ]; then
            echo "ERROR: no suitable CPython interpreter found under /opt/python" >&2
            exit 1
          fi
          echo "Using build interpreter: $PY_BUILD ($("$PY_BUILD" --version 2>&1))"
          echo "PY_BUILD=$PY_BUILD" >> "$GITHUB_ENV"

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          dnf -y install git make gcc gcc-c++ cmake ninja-build openssl-devel libnl3-devel libmnl-devel
          "$PY_BUILD" -m pip install --upgrade pip

      - name: Configure
        run: |
          set -euo pipefail
          rm -rf "$BUILD_DIR"
          cmake -S "$GITHUB_WORKSPACE/projects/amdsmi" -B "$BUILD_DIR" \
            -DENABLE_ESMI_LIB=ON \
            -DBUILD_PYTHON_WHEEL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$PY_BUILD"

      - name: Build library and wheel
        # The CMake `python_wheel` target is part of ALL (gated on
        # BUILD_PYTHON_WHEEL), so this single build produces both the
        # SONAME-isolated libamd_smi_python.so and the .whl that bundles it --
        # no separate `pip wheel` invocation, which would bypass the target's
        # disable_system_fallback.py loader-flag step.
        run: make -C "$BUILD_DIR" -j"$(nproc)"

      - name: Verify wheel artifact
        run: |
          set -euo pipefail
          wheel_dir="$BUILD_DIR/py-interface/python_package"
          shopt -s nullglob
          wheels=("$wheel_dir"/*.whl)
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "ERROR: no wheel produced under $wheel_dir" >&2
            exit 1
          fi
          printf 'Python wheel built: %s\n' "${wheels[@]}"
          echo "WHEEL=${wheels[0]}" >> "$GITHUB_ENV"

      - name: Install and import the wheel
        run: |
          set -euo pipefail
          # Prove the wheel is installable and loads its bundled library, not
          # just that the file exists. No GPU needed for import.
          "$PY_BUILD" -m pip install "$WHEEL"
          "$PY_BUILD" -c "import amdsmi; print('import amdsmi OK from', amdsmi.__file__)"
          # A tolerant import succeeds even when the bundled .so fails to load,
          # so assert the wheel-private libamd_smi_python.so actually loaded and
          # that a no-GPU-safe exported symbol is callable.
          "$PY_BUILD" "$GITHUB_WORKSPACE/projects/amdsmi/tests/verify_bundled_library_loads.py"
          echo "Build gate passed"

  # Single job covering every distro + package format. The build-time logic
  # (package manager, distro quirks) is autodetected by run_amdsmi_build.py
  # from /etc/os-release, so the matrix only needs the OS label plus the
  # artifact format used for upload.
  build-and-test:
    name: ${{ matrix.os }}
    # Privileged self-hosted runner (SYS_MODULE + host /lib/modules): never
    # auto-run untrusted fork-PR code on it. Mirrors the guard other CI jobs use.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        include:
          - { os: Ubuntu20,    package_format: deb, arch_suffix: _amd64.deb }
          - { os: Ubuntu22,    package_format: deb, arch_suffix: _amd64.deb }
          - { os: Debian10,    package_format: deb, arch_suffix: _amd64.deb }
          - { os: SLES,        package_format: rpm, arch_suffix: .rpm }
          - { os: RHEL8,       package_format: rpm, arch_suffix: .rpm }
          - { os: RHEL9,       package_format: rpm, arch_suffix: .rpm }
          - { os: RHEL10,      package_format: rpm, arch_suffix: .rpm }
          - { os: AlmaLinux8,  package_format: rpm, arch_suffix: .rpm }
          - { os: AzureLinux3, package_format: rpm, arch_suffix: .rpm }
    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: --rm --privileged --device=/dev/kfd --device=/dev/dri --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=64G --cap-add=SYS_MODULE -v /lib/modules:/lib/modules -u root

    steps:
      # rocm-systems is a large monorepo; only the amdsmi project and this
      # workflow are needed, so sparse-checkout keeps the fetch cheap.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            projects/amdsmi
            .github/workflows

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set Project Directory
        run: |
          set -euo pipefail
          # Evaluate inside the container: ${{ github.workspace }} is the host
          # runner path, but these steps run in a container where the repo is
          # mounted elsewhere. $GITHUB_WORKSPACE is the in-container mount.
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/projects/amdsmi" >> $GITHUB_ENV

      - name: Set Artifact Metadata
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          echo "PR_NUMBER=PR${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%m%d%y-%H%M)" >> $GITHUB_ENV

      - name: Run AMDSMI Build and Install
        run: |
          set -euo pipefail
          # The script autodetects package manager, format, and distro
          # quirks (Debian10 archived repos, RHEL10/AlmaLinux8 QA_RPATHS,
          # AzureLinux3 more_itertools, etc.) from /etc/os-release.
          python3 "${{ env.PROJECT_DIR }}/tests/amdsmi_build/run_amdsmi_build.py" \
            --project-dir "${{ env.PROJECT_DIR }}" \
            --os-label "${{ matrix.os }}" \
            --test-results-dir "/tmp/test-results-${{ matrix.os }}"

      # The previous step exits non-zero if any build/install/wheel-verify
      # stage failed; on failure we dump the per-stage result files for
      # quick triage in the GitHub Actions log. Full logs are still
      # uploaded via the test-results artifact below.
      - name: Dump build/install/wheel result files on failure
        if: failure()
        run: |
          set +e
          for f in build_result.txt install_result.txt verify_wheel_result.txt; do
            path="/tmp/test-results-${{ matrix.os }}/$f"
            if [ -f "$path" ]; then
              echo "===== $f ====="
              cat "$path"
            fi
          done

      - name: Upload Package Artifact
        # Not consumed by any downstream job; kept so a reviewer can download
        # the built .deb/.rpm from a PR run for manual testing.
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amd-smi-lib-${{ matrix.package_format }}-${{ matrix.os }}-${{ env.PR_NUMBER }}-${{ env.BUILD_DATE }}
          # 99999 is the local (non-release) package version CPack stamps when
          # ROCM_LIBPATCH_VERSION is unset, so it matches every dev-built package.
          path: |
            ${{ env.PROJECT_DIR }}/build/amd-smi-lib*99999-local${{ matrix.arch_suffix }}
            ${{ env.PROJECT_DIR }}/build/amd-smi-lib-*99999-local*.rpm
          if-no-files-found: warn
          retention-days: 7

      - name: AMDSMI Command Tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/test-results-${{ matrix.os }}
          commands=(
            "amd-smi version"
            "amd-smi list"
            "amd-smi static"
            "amd-smi firmware"
            "amd-smi ucode"
            "amd-smi bad-pages"
            "amd-smi metric"
            "amd-smi process"
            "amd-smi topology"
            "amd-smi monitor"
            "amd-smi dmon"
            "amd-smi xgmi"
            "amd-smi partition"
          )
          # Command failures are not hard fails here; the AMDSMI CI
          # Summary step scans amd-smi_*.log for 'Error code:' / 'Traceback'
          # / 'AmdSmiException' and surfaces any failures in the summary.
          for cmd in "${commands[@]}"; do
            debug_cmd="$cmd --loglevel debug"
            echo "Running: $debug_cmd"
            log="/tmp/test-results-${{ matrix.os }}/$(echo $cmd | tr ' ' '_').log"
            rc=0
            eval "$debug_cmd" > "$log" 2>&1 || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "Command '$debug_cmd' failed (exit $rc)."
              cat "$log"
              echo "Error code: $rc" >> "$log"
            fi
          done

      - name: Upload AMDSMI Command Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amdsmi-command-tests-${{ matrix.os }}
          path: /tmp/test-results-${{ matrix.os }}

      - name: Run AMDSMI, Python, and Example Tests
        run: |
          set -euo pipefail
          RESULTS_DIR=/tmp/test-results-${{ matrix.os }}

          cd /opt/rocm/share/amd_smi/tests
          source amdsmitst.exclude
          source detect_asic_filter.sh
          echo "GTEST_EXCLUDE=${GTEST_EXCLUDE}"
          ./amdsmitst --gtest_filter="-${GTEST_EXCLUDE}" > "$RESULTS_DIR/amdsmi_tests.log" 2>&1

          cd /opt/rocm/share/amd_smi/tests/python_unittest
          ./integration_test.py -v > "$RESULTS_DIR/integration_test_output.txt" 2>&1
          ./unit_tests.py -v > "$RESULTS_DIR/unit_test_output.txt" 2>&1
          python3 test_abi_compat.py -v > "$RESULTS_DIR/abi_compat_output.txt" 2>&1
          if [ -f ./perf_tests.py ]; then
            ./perf_tests.py -v > "$RESULTS_DIR/perf_test_output.txt" 2>&1 || echo 'perf_tests.py failed'
          else
            echo "perf_tests.py not present; skipping" > "$RESULTS_DIR/perf_test_output.txt"
          fi

          cd ${{ env.PROJECT_DIR }}/example
          rm -rf build
          cmake -B build -DENABLE_ESMI_LIB=OFF
          make -C build -j $(nproc)
          cd build
          ./amd_smi_drm_ex > "$RESULTS_DIR/amd_smi_drm_ex.log" 2>&1 || echo 'amd_smi_drm_ex failed'
          ./amd_smi_nodrm_ex > "$RESULTS_DIR/amd_smi_nodrm_ex.log" 2>&1 || echo 'amd_smi_nodrm_ex failed'

      - name: AMDSMI Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/amdsmi_tests.log || echo "No AMDSMI test results"

      - name: Integration Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/integration_test_output.txt || echo "No integration test results"

      - name: Unit Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/unit_test_output.txt || echo "No unit test results"

      - name: Perf Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/perf_test_output.txt || echo "No perf test results"

      - name: ABI Compat Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/abi_compat_output.txt || echo "No ABI compat results"

      - name: Example DRM Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/amd_smi_drm_ex.log || echo "No DRM example results"

      - name: Example NoDRM Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/amd_smi_nodrm_ex.log || echo "No NoDRM example results"

      - name: AMDSMI CI Summary
        if: always()
        run: |
          set -euo pipefail
          python3 "${{ env.PROJECT_DIR }}/tests/amdsmi_build/run_amdsmi_build.py" summarize \
            --results-dir "/tmp/test-results-${{ matrix.os }}" \
            --os-label "${{ matrix.os }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"
