name: AMDSMI CI

on:
  pull_request:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/amdsmi-build.yml'
  push:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/amdsmi-build.yml'
  workflow_dispatch:

permissions:
  contents: read
env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: true
  BUILD_TYPE: Release
  ROCM_DIR: /opt/rocm

defaults:
  run:
    shell: bash

jobs:
  debian-buildinstall:
    name: Build
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    continue-on-error: true
    strategy:
      max-parallel: 10
      matrix:
        os: [Ubuntu20, Ubuntu22, Debian10]
    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: --rm --privileged --device=/dev/kfd --device=/dev/dri --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=64G --cap-add=SYS_MODULE -v /lib/modules:/lib/modules -u root

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set Artifact Metadata
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          echo "PR_NUMBER=PR${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%m%d%y-%H%M)" >> $GITHUB_ENV

      - name: Set Project Directory
        run: |
          set -euo pipefail
          TARGET_DIR=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/CMakeLists.txt" -exec dirname {} \;)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find $GITHUB_WORKSPACE -maxdepth 2 -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
          fi
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Run AMDSMI Build and Install
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/tests/amdsmi_build/run_amdsmi_build.py" | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: run_amdsmi_build.py not found"
            exit 1
          fi
          echo "Using runner script: $SCRIPT"

          ARGS=(
            --project-dir "${{ env.PROJECT_DIR }}"
            --os-label "${{ matrix.os }}"
            --test-results-dir "/tmp/test-results-${{ matrix.os }}"
            --package-manager apt
            --package-format deb
          )

          if [ "${{ matrix.os }}" = "Debian10" ]; then
            ARGS+=(--debian10-sources)
          fi

          echo "Running: python3 $SCRIPT ${ARGS[*]}"
          python3 "$SCRIPT" "${ARGS[@]}"

      - name: AMDSMI Build Result
        if: always()
        run: |
          set -euo pipefail
          RESULT="/tmp/test-results-${{ matrix.os }}/build_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            grep -q "FAILED" "$RESULT" && echo "::error::Build FAILED for ${{ matrix.os }}" || true
          fi

      - name: AMDSMI Installation Result
        if: always()
        run: |
          set -euo pipefail
          RESULT="/tmp/test-results-${{ matrix.os }}/install_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            grep -q "FAILED" "$RESULT" && echo "::error::Installation FAILED for ${{ matrix.os }}" || true
          fi

      - name: Verify Wheel Site-Packages Result
        if: always()
        run: |
          set -euo pipefail
          RESULT="/tmp/test-results-${{ matrix.os }}/verify_wheel_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            grep -q "FAILED" "$RESULT" && echo "::error::Wheel verification FAILED for ${{ matrix.os }}" || true
          fi

      - name: Upload Debian Package Artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amd-smi-lib-deb-${{ matrix.os }}-${{ env.PR_NUMBER }}-${{ env.BUILD_DATE }}
          path: ${{ env.PROJECT_DIR }}/build/amd-smi-lib*99999-local_amd64.deb
          if-no-files-found: warn
          retention-days: 7

      - name: Uninstall
        if: always()
        run: |
          set -euo pipefail
          set -e
          apt remove -y amd-smi-lib || true
          rm -f /usr/local/bin/amd-smi
          if [ -d /opt/rocm/share/amd_smi ]; then
            rm -rf /opt/rocm/share/amd_smi
          fi

  debian-test:
    name: Tests
    needs: debian-buildinstall
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    continue-on-error: true
    strategy:
      max-parallel: 10
      matrix:
        os: [Ubuntu20, Ubuntu22, Debian10]
    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: --rm --privileged --device=/dev/kfd --device=/dev/dri --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=64G --cap-add=SYS_MODULE -v /lib/modules:/lib/modules -u root

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set Project Directory
        run: |
          set -euo pipefail
          TARGET_DIR=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/CMakeLists.txt" -exec dirname {} \;)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find $GITHUB_WORKSPACE -maxdepth 2 -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
          fi
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Run AMDSMI Build and Install
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/tests/amdsmi_build/run_amdsmi_build.py" | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: run_amdsmi_build.py not found"
            exit 1
          fi

          ARGS=(
            --project-dir "${{ env.PROJECT_DIR }}"
            --os-label "${{ matrix.os }}"
            --test-results-dir "/tmp/test-results-${{ matrix.os }}"
            --package-manager apt
            --package-format deb
          )

          if [ "${{ matrix.os }}" = "Debian10" ]; then
            ARGS+=(--debian10-sources)
          fi

          python3 "$SCRIPT" "${ARGS[@]}"

      - name: AMDSMI Command Tests
        shell: bash
        run: |
          set -euo pipefail
          set -e
          mkdir -p /tmp/test-results-${{ matrix.os }}
          commands=(
            "amd-smi version"
            "amd-smi list"
            "amd-smi static"
            "amd-smi firmware"
            "amd-smi ucode"
            "amd-smi bad-pages"
            "amd-smi metric"
            "amd-smi process"
            "amd-smi topology"
            "amd-smi monitor"
            "amd-smi dmon"
            "amd-smi xgmi"
            "amd-smi partition"
          )
          for cmd in "${commands[@]}"; do
            debug_cmd="$cmd --loglevel debug"
            echo "Running: $debug_cmd"
            log="/tmp/test-results-${{ matrix.os }}/$(echo $cmd | tr ' ' '_').log"
            if ! eval "$debug_cmd" > "$log" 2>&1; then
              echo "Command '$debug_cmd' failed."
              cat "$log"
              exit 1
            fi
          done

      - name: Upload AMDSMI Command Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amdsmi-command-tests-${{ matrix.os }}
          path: /tmp/test-results-${{ matrix.os }}

      - name: Run AMDSMI, Python, and Example Tests
        shell: bash
        run: |
          set -euo pipefail
          set -e
          RESULTS_DIR=/tmp/test-results-${{ matrix.os }}

          cd /opt/rocm/share/amd_smi/tests
          source amdsmitst.exclude
          source detect_asic_filter.sh
          echo "GTEST_EXCLUDE=${GTEST_EXCLUDE}"
          ./amdsmitst --gtest_filter="-${GTEST_EXCLUDE}" > "$RESULTS_DIR/amdsmi_tests.log" 2>&1

          cd /opt/rocm/share/amd_smi/tests/python_unittest
          ./integration_test.py -v > "$RESULTS_DIR/integration_test_output.txt" 2>&1
          ./unit_tests.py -v > "$RESULTS_DIR/unit_test_output.txt" 2>&1
          if [ -f ./perf_tests.py ]; then
            ./perf_tests.py -v > "$RESULTS_DIR/perf_test_output.txt" 2>&1 || echo 'perf_tests.py failed'
          else
            echo "perf_tests.py not present; skipping" > "$RESULTS_DIR/perf_test_output.txt"
          fi

          cd ${{ env.PROJECT_DIR }}/example
          rm -rf build
          cmake -B build -DENABLE_ESMI_LIB=OFF
          make -C build -j $(nproc)
          cd build
          ./amd_smi_drm_ex > "$RESULTS_DIR/amd_smi_drm_ex.log" 2>&1 || echo 'amd_smi_drm_ex failed'
          ./amd_smi_nodrm_ex > "$RESULTS_DIR/amd_smi_nodrm_ex.log" 2>&1 || echo 'amd_smi_nodrm_ex failed'

      - name: AMDSMI Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/amdsmi_tests.log || echo "No AMDSMI test results"

      - name: Integration Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/integration_test_output.txt || echo "No integration test results"

      - name: Unit Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/unit_test_output.txt || echo "No unit test results"

      - name: Perf Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/perf_test_output.txt || echo "No perf test results"

      - name: Example DRM Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/amd_smi_drm_ex.log || echo "No DRM example results"

      - name: Example NoDRM Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/amd_smi_nodrm_ex.log || echo "No NoDRM example results"

      - name: CI Summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          declare -a FAILURES=()
          DETAILS=""

          echo "=========================================="
          echo "CI SUMMARY for ${{ matrix.os }}"
          echo "=========================================="

          # 1. build/install/verify stage results
          for result_file in "$RESULTS_DIR"/*_result.txt; do
            [ -f "$result_file" ] || continue
            if grep -q "FAILED" "$result_file"; then
              STAGE=$(basename "$result_file" _result.txt | tr '_' ' ')
              FAILURES+=("$STAGE")
              CONTENT=$(cat "$result_file")
              DETAILS+=$'\n'"#### ${STAGE}"$'\n\n'"\`\`\`"$'\n'"${CONTENT}"$'\n'"\`\`\`"$'\n'
              echo "FAILED: $STAGE"
            fi
          done

          # 2. amd-smi command test logs
          CMD_FAILS=""
          for log in "$RESULTS_DIR"/amd-smi_*.log; do
            [ -f "$log" ] || continue
            CMD=$(basename "$log" .log | sed 's/amd-smi_//')
            if grep -qE "Traceback|AmdSmiException|Error code:" "$log" 2>/dev/null; then
              CMD_FAILS+=" $CMD"
            fi
          done
          if [ -n "$CMD_FAILS" ]; then
            FAILURES+=("Command tests:$CMD_FAILS")
            DETAILS+=$'\n'"#### Command Tests"$'\n\n'"Failed: \`$CMD_FAILS\`"$'\n'
          fi

          # 3. AMDSMI gtest output
          if [ -f "$RESULTS_DIR/amdsmi_tests.log" ]; then
            GTEST_FAILS=$(grep -c "\[  FAILED  \]" "$RESULTS_DIR/amdsmi_tests.log" 2>/dev/null || true)
            if [ "${GTEST_FAILS:-0}" -gt 0 ] 2>/dev/null; then
              FAILURES+=("AMDSMI Tests ($GTEST_FAILS)")
              FULL_LOG=$(cat "$RESULTS_DIR/amdsmi_tests.log")
              DETAILS+=$'\n'"#### AMDSMI Tests — $GTEST_FAILS failure(s)"$'\n\n'"\`\`\`"$'\n'"${FULL_LOG}"$'\n'"\`\`\`"$'\n'
            fi
          fi

          # 4. Python test outputs (integration / unit / perf)
          for test_file in integration_test_output.txt unit_test_output.txt perf_test_output.txt; do
            FULL="$RESULTS_DIR/$test_file"
            [ -f "$FULL" ] || continue
            PY_FAILS=$(grep -cE "^FAIL:|^ERROR:" "$FULL" 2>/dev/null || true)
            if [ "${PY_FAILS:-0}" -gt 0 ] 2>/dev/null; then
              TEST_NAME=$(basename "$test_file" _output.txt | tr '_' ' ')
              FAILURES+=("${TEST_NAME} ($PY_FAILS)")
              FULL_LOG=$(cat "$FULL")
              DETAILS+=$'\n'"#### ${TEST_NAME} — $PY_FAILS failure(s)"$'\n\n'"\`\`\`"$'\n'"${FULL_LOG}"$'\n'"\`\`\`"$'\n'
            fi
          done

          # 5. example test results (segfault detection)
          for ex_log in amd_smi_drm_ex.log amd_smi_nodrm_ex.log; do
            FULL="$RESULTS_DIR/$ex_log"
            [ -f "$FULL" ] || continue
            if grep -qiE "segfault|SIGSEGV|abort" "$FULL" 2>/dev/null; then
              EX_NAME="${ex_log%.log}"
              FAILURES+=("Example $EX_NAME")
              FULL_LOG=$(cat "$FULL")
              DETAILS+=$'\n'"#### Example ${EX_NAME}"$'\n\n'"\`\`\`"$'\n'"${FULL_LOG}"$'\n'"\`\`\`"$'\n'
            fi
          done

          {
            if [ ${#FAILURES[@]} -gt 0 ]; then
              echo "## :x: CI Failed — ${{ matrix.os }}"
              echo ""
              echo "**${#FAILURES[@]} failure(s) detected:**"
              echo ""
              for f in "${FAILURES[@]}"; do
                echo "- :red_circle: ${f}"
              done
              echo "$DETAILS"
            else
              echo "## :white_check_mark: CI Passed — ${{ matrix.os }}"
              echo ""
              echo "All stages and tests passed successfully."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#FAILURES[@]} -gt 0 ]; then
            echo "::error::${#FAILURES[@]} failure(s) for ${{ matrix.os }}: ${FAILURES[*]}"
          else
            echo "All stages and tests PASSED for ${{ matrix.os }}"
          fi

  rpm-buildinstall:
    name: Build
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    continue-on-error: true
    strategy:
      max-parallel: 10
      matrix:
        os:
          - SLES
          - RHEL8
          - RHEL9
          - RHEL10
          - AzureLinux3
          - AlmaLinux8
    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: --rm --privileged --device=/dev/kfd --device=/dev/dri --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=64G --cap-add=SYS_MODULE -v /lib/modules:/lib/modules -u root

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set Artifact Metadata
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          echo "PR_NUMBER=PR${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%m%d%y-%H%M)" >> $GITHUB_ENV

      - name: Set Project Directory
        run: |
          set -euo pipefail
          TARGET_DIR=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/CMakeLists.txt" -exec dirname {} \;)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find $GITHUB_WORKSPACE -maxdepth 2 -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
          fi
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Run AMDSMI Build and Install
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/tests/amdsmi_build/run_amdsmi_build.py" | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: run_amdsmi_build.py not found"
            exit 1
          fi

          case "${{ matrix.os }}" in
            SLES) PKG_MGR=zypper ;;
            RHEL8|RHEL9|RHEL10|AlmaLinux8|AzureLinux3) PKG_MGR=dnf ;;
            *) PKG_MGR=dnf ;;
          esac

          ARGS=(
            --project-dir "${{ env.PROJECT_DIR }}"
            --os-label "${{ matrix.os }}"
            --test-results-dir "/tmp/test-results-${{ matrix.os }}"
            --package-manager "$PKG_MGR"
            --package-format rpm
          )

          case "${{ matrix.os }}" in
            RHEL10|AlmaLinux8) ARGS+=(--qa-rpaths --retries 5) ;;
          esac

          if [ "${{ matrix.os }}" = "AzureLinux3" ]; then
            ARGS+=(--skip-setuptools-upgrade --install-more-itertools)
          fi

          echo "Running: python3 $SCRIPT ${ARGS[*]}"
          python3 "$SCRIPT" "${ARGS[@]}"

      - name: AMDSMI Build Result
        if: always()
        run: |
          set -euo pipefail
          RESULT="/tmp/test-results-${{ matrix.os }}/build_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            grep -q "FAILED" "$RESULT" && echo "::error::Build FAILED for ${{ matrix.os }}" || true
          fi

      - name: AMDSMI Installation Result
        if: always()
        run: |
          set -euo pipefail
          RESULT="/tmp/test-results-${{ matrix.os }}/install_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            grep -q "FAILED" "$RESULT" && echo "::error::Installation FAILED for ${{ matrix.os }}" || true
          fi

      - name: Verify Wheel Site-Packages Result
        if: always()
        run: |
          set -euo pipefail
          RESULT="/tmp/test-results-${{ matrix.os }}/verify_wheel_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            grep -q "FAILED" "$RESULT" && echo "::error::Wheel verification FAILED for ${{ matrix.os }}" || true
          fi

      - name: Upload RPM Package Artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amd-smi-lib-rpm-${{ matrix.os }}-${{ env.PR_NUMBER }}-${{ env.BUILD_DATE }}
          path: ${{ env.PROJECT_DIR }}/build/amd-smi-lib-*99999-local*.rpm
          if-no-files-found: warn
          retention-days: 7

      - name: Uninstall
        if: always()
        run: |
          set -euo pipefail
          set -e
          case ${{ matrix.os }} in
            SLES) zypper remove -y amd-smi-lib || true ;;
            RHEL8|RHEL9|RHEL10|AlmaLinux8|AzureLinux3) dnf remove -y amd-smi-lib || true ;;
          esac
          rm -f /usr/local/bin/amd-smi
          if [ -d /opt/rocm/share/amd_smi ]; then
            rm -rf /opt/rocm/share/amd_smi
          fi

  rpm-test:
    name: Tests
    needs: [rpm-buildinstall, debian-test]
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    continue-on-error: true
    strategy:
      max-parallel: 10
      matrix:
        os:
          - SLES
          - RHEL8
          - RHEL9
          - RHEL10
          - AzureLinux3
          - AlmaLinux8
    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: --rm --privileged --device=/dev/kfd --device=/dev/dri --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=64G --cap-add=SYS_MODULE -v /lib/modules:/lib/modules -u root

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set Project Directory
        run: |
          set -euo pipefail
          TARGET_DIR=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/CMakeLists.txt" -exec dirname {} \;)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find $GITHUB_WORKSPACE -maxdepth 2 -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
          fi
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Run AMDSMI Build and Install
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/tests/amdsmi_build/run_amdsmi_build.py" | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: run_amdsmi_build.py not found"
            exit 1
          fi

          case "${{ matrix.os }}" in
            SLES) PKG_MGR=zypper ;;
            RHEL8|RHEL9|RHEL10|AlmaLinux8|AzureLinux3) PKG_MGR=dnf ;;
            *) PKG_MGR=dnf ;;
          esac

          ARGS=(
            --project-dir "${{ env.PROJECT_DIR }}"
            --os-label "${{ matrix.os }}"
            --test-results-dir "/tmp/test-results-${{ matrix.os }}"
            --package-manager "$PKG_MGR"
            --package-format rpm
          )

          case "${{ matrix.os }}" in
            RHEL10|AlmaLinux8) ARGS+=(--qa-rpaths --retries 5) ;;
          esac

          if [ "${{ matrix.os }}" = "AzureLinux3" ]; then
            ARGS+=(--skip-setuptools-upgrade --install-more-itertools)
          fi

          python3 "$SCRIPT" "${ARGS[@]}"

      - name: AMDSMI Command Tests
        shell: bash
        run: |
          set -euo pipefail
          set -e
          mkdir -p /tmp/test-results-${{ matrix.os }}
          commands=(
            "amd-smi version"
            "amd-smi list"
            "amd-smi static"
            "amd-smi firmware"
            "amd-smi ucode"
            "amd-smi bad-pages"
            "amd-smi metric"
            "amd-smi process"
            "amd-smi topology"
            "amd-smi monitor"
            "amd-smi dmon"
            "amd-smi xgmi"
            "amd-smi partition"
          )
          for cmd in "${commands[@]}"; do
            debug_cmd="$cmd --loglevel debug"
            echo "Running: $debug_cmd"
            log="/tmp/test-results-${{ matrix.os }}/$(echo $cmd | tr ' ' '_').log"
            if ! eval "$debug_cmd" > "$log" 2>&1; then
              echo "Command '$debug_cmd' failed."
              cat "$log"
              exit 1
            fi
          done

      - name: Upload AMDSMI Command Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amdsmi-command-tests-${{ matrix.os }}
          path: /tmp/test-results-${{ matrix.os }}

      - name: Run AMDSMI, Python, and Example Tests
        shell: bash
        run: |
          set -euo pipefail
          set -e
          RESULTS_DIR=/tmp/test-results-${{ matrix.os }}

          cd /opt/rocm/share/amd_smi/tests
          source amdsmitst.exclude
          source detect_asic_filter.sh
          echo "GTEST_EXCLUDE=${GTEST_EXCLUDE}"
          ./amdsmitst --gtest_filter="-${GTEST_EXCLUDE}" > "$RESULTS_DIR/amdsmi_tests.log" 2>&1

          cd /opt/rocm/share/amd_smi/tests/python_unittest
          ./integration_test.py -v > "$RESULTS_DIR/integration_test_output.txt" 2>&1
          ./unit_tests.py -v > "$RESULTS_DIR/unit_test_output.txt" 2>&1
          if [ -f ./perf_tests.py ]; then
            ./perf_tests.py -v > "$RESULTS_DIR/perf_test_output.txt" 2>&1 || echo 'perf_tests.py failed'
          else
            echo "perf_tests.py not present; skipping" > "$RESULTS_DIR/perf_test_output.txt"
          fi

          cd ${{ env.PROJECT_DIR }}/example
          rm -rf build
          cmake -B build -DENABLE_ESMI_LIB=OFF
          make -C build -j $(nproc)
          cd build
          ./amd_smi_drm_ex > "$RESULTS_DIR/amd_smi_drm_ex.log" 2>&1 || echo 'amd_smi_drm_ex failed'
          ./amd_smi_nodrm_ex > "$RESULTS_DIR/amd_smi_nodrm_ex.log" 2>&1 || echo 'amd_smi_nodrm_ex failed'

      - name: AMDSMI Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/amdsmi_tests.log || echo "No AMDSMI test results"

      - name: Integration Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/integration_test_output.txt || echo "No integration test results"

      - name: Unit Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/unit_test_output.txt || echo "No unit test results"

      - name: Perf Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/perf_test_output.txt || echo "No perf test results"

      - name: Example DRM Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/amd_smi_drm_ex.log || echo "No DRM example results"

      - name: Example NoDRM Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/amd_smi_nodrm_ex.log || echo "No NoDRM example results"

      - name: CI Summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          declare -a FAILURES=()
          DETAILS=""

          echo "=========================================="
          echo "CI SUMMARY for ${{ matrix.os }}"
          echo "=========================================="

          # 1. build/install/verify stage results
          for result_file in "$RESULTS_DIR"/*_result.txt; do
            [ -f "$result_file" ] || continue
            if grep -q "FAILED" "$result_file"; then
              STAGE=$(basename "$result_file" _result.txt | tr '_' ' ')
              FAILURES+=("$STAGE")
              CONTENT=$(cat "$result_file")
              DETAILS+=$'\n'"#### ${STAGE}"$'\n\n'"\`\`\`"$'\n'"${CONTENT}"$'\n'"\`\`\`"$'\n'
              echo "FAILED: $STAGE"
            fi
          done

          # 2. amd-smi command test logs
          CMD_FAILS=""
          for log in "$RESULTS_DIR"/amd-smi_*.log; do
            [ -f "$log" ] || continue
            CMD=$(basename "$log" .log | sed 's/amd-smi_//')
            if grep -qE "Traceback|AmdSmiException|Error code:" "$log" 2>/dev/null; then
              CMD_FAILS+=" $CMD"
            fi
          done
          if [ -n "$CMD_FAILS" ]; then
            FAILURES+=("Command tests:$CMD_FAILS")
            DETAILS+=$'\n'"#### Command Tests"$'\n\n'"Failed: \`$CMD_FAILS\`"$'\n'
          fi

          # 3. AMDSMI gtest output
          if [ -f "$RESULTS_DIR/amdsmi_tests.log" ]; then
            GTEST_FAILS=$(grep -c "\[  FAILED  \]" "$RESULTS_DIR/amdsmi_tests.log" 2>/dev/null || true)
            if [ "${GTEST_FAILS:-0}" -gt 0 ] 2>/dev/null; then
              FAILURES+=("AMDSMI Tests ($GTEST_FAILS)")
              FULL_LOG=$(cat "$RESULTS_DIR/amdsmi_tests.log")
              DETAILS+=$'\n'"#### AMDSMI Tests — $GTEST_FAILS failure(s)"$'\n\n'"\`\`\`"$'\n'"${FULL_LOG}"$'\n'"\`\`\`"$'\n'
            fi
          fi

          # 4. Python test outputs (integration / unit / perf)
          for test_file in integration_test_output.txt unit_test_output.txt perf_test_output.txt; do
            FULL="$RESULTS_DIR/$test_file"
            [ -f "$FULL" ] || continue
            PY_FAILS=$(grep -cE "^FAIL:|^ERROR:" "$FULL" 2>/dev/null || true)
            if [ "${PY_FAILS:-0}" -gt 0 ] 2>/dev/null; then
              TEST_NAME=$(basename "$test_file" _output.txt | tr '_' ' ')
              FAILURES+=("${TEST_NAME} ($PY_FAILS)")
              FULL_LOG=$(cat "$FULL")
              DETAILS+=$'\n'"#### ${TEST_NAME} — $PY_FAILS failure(s)"$'\n\n'"\`\`\`"$'\n'"${FULL_LOG}"$'\n'"\`\`\`"$'\n'
            fi
          done

          # 5. example test results (segfault detection)
          for ex_log in amd_smi_drm_ex.log amd_smi_nodrm_ex.log; do
            FULL="$RESULTS_DIR/$ex_log"
            [ -f "$FULL" ] || continue
            if grep -qiE "segfault|SIGSEGV|abort" "$FULL" 2>/dev/null; then
              EX_NAME="${ex_log%.log}"
              FAILURES+=("Example $EX_NAME")
              FULL_LOG=$(cat "$FULL")
              DETAILS+=$'\n'"#### Example ${EX_NAME}"$'\n\n'"\`\`\`"$'\n'"${FULL_LOG}"$'\n'"\`\`\`"$'\n'
            fi
          done

          {
            if [ ${#FAILURES[@]} -gt 0 ]; then
              echo "## :x: CI Failed — ${{ matrix.os }}"
              echo ""
              echo "**${#FAILURES[@]} failure(s) detected:**"
              echo ""
              for f in "${FAILURES[@]}"; do
                echo "- :red_circle: ${f}"
              done
              echo "$DETAILS"
            else
              echo "## :white_check_mark: CI Passed — ${{ matrix.os }}"
              echo ""
              echo "All stages and tests passed successfully."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#FAILURES[@]} -gt 0 ]; then
            echo "::error::${#FAILURES[@]} failure(s) for ${{ matrix.os }}: ${FAILURES[*]}"
          else
            echo "All stages and tests PASSED for ${{ matrix.os }}"
          fi
