name: AMDSMI CI

on:
  pull_request:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/amdsmi-build.yml'
  push:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/amdsmi-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: true
  BUILD_TYPE: Release
  ROCM_DIR: /opt/rocm

jobs:
  manylinux-wheels:
    name: Manylinux Wheels
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Build manylinux wheels
        run: |
          set -euo pipefail
          set -x
          PROJECT_DIR=$GITHUB_WORKSPACE/projects/amdsmi
          BUILD_DIR=/tmp/amdsmi-build
          RAW_WHEELS=/tmp/raw-wheels
          WHEEL_OUT=$GITHUB_WORKSPACE/wheels
          PY_BUILD=/opt/python/cp38-cp38/bin/python3

          echo "Using manylinux image: quay.io/pypa/manylinux_2_28_x86_64"

          echo "Installing build prerequisites..."
          dnf -y install git make gcc gcc-c++ cmake ninja-build openssl-devel
          # cmake is available directly in manylinux_2_28 (AlmaLinux 8)

          echo "Configuring and building core..."
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          cmake "$PROJECT_DIR" -DBUILD_TESTS=OFF -DENABLE_ESMI_LIB=ON -DBUILD_PYTHON_LIB=ON -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PY_BUILD"
          make -j"$(nproc)"

          echo "Building wheels..."
          mkdir -p "$RAW_WHEELS" "$WHEEL_OUT"
          chmod 777 "$WHEEL_OUT"
          $PY_BUILD -m pip install --upgrade pip setuptools wheel auditwheel
          for PY in /opt/python/cp38-cp38/bin/python3 /opt/python/cp39-cp39/bin/python3 /opt/python/cp310-cp310/bin/python3 /opt/python/cp311-cp311/bin/python3 /opt/python/cp312-cp312/bin/python3 /opt/python/cp313-cp313/bin/python3; do
            if [ ! -x "$PY" ]; then
              echo "Skipping missing interpreter $PY"
              continue
            fi
            echo "Building wheel with $PY"
            $PY -m pip install --upgrade pip setuptools wheel
            pushd "$BUILD_DIR/py-interface/python_package"
            rm -rf build dist *.whl *.egg-info
            $PY -m pip wheel --no-deps --no-build-isolation -w "$RAW_WHEELS" .
            popd
          done

          echo "Raw wheels built:"
          ls -al "$RAW_WHEELS" || true

          if ! ls "$RAW_WHEELS"/*.whl >/dev/null 2>&1; then
            echo "No wheels were built; aborting."
            exit 1
          fi

          echo "Repairing wheels with auditwheel..."
          if ! $PY_BUILD -m auditwheel repair "$RAW_WHEELS"/*.whl --wheel-dir "$WHEEL_OUT"; then
            echo "auditwheel repair failed; keeping raw wheels only."
            cp -v "$RAW_WHEELS"/*.whl "$WHEEL_OUT"/
          fi
          sync

          echo "Wheels in output:"
          ls -al "$WHEEL_OUT"

      - name: List built wheels
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/wheels"
          ls -al "${GITHUB_WORKSPACE}/wheels"
          if ! ls "${GITHUB_WORKSPACE}"/wheels/*.whl >/dev/null 2>&1; then
            echo "No wheels found after manylinux build; failing."
            exit 1
          fi

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amdsmi-manylinux-wheels-${{ github.sha }}
          path: ${{ github.workspace }}/wheels/*.whl
          if-no-files-found: error

      - name: Upload downloadable Python wheels
        uses: actions/upload-artifact@v4
        with:
          name: amdsmi-python-wheels
          path: ${{ github.workspace }}/wheels/*.whl
          if-no-files-found: warn
          retention-days: 90

  debian-buildinstall:
    name: Build
    needs: manylinux-wheels
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    continue-on-error: true
    strategy:
      max-parallel: 10
      matrix:
        os: [Ubuntu20, Ubuntu22, Ubuntu24, Debian10]
    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: --rm --privileged --device=/dev/kfd --device=/dev/dri --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=64G --cap-add=SYS_MODULE -v /lib/modules:/lib/modules -u root
    env:
      WHEEL_ARTIFACT_DIR: ${{ github.workspace }}/wheels

    steps:
      - uses: actions/checkout@v4

      - name: Download manylinux wheels
        uses: actions/download-artifact@v4
        id: download-wheels
        continue-on-error: true
        with:
          name: amdsmi-manylinux-wheels-${{ github.sha }}
          path: ${{ env.WHEEL_ARTIFACT_DIR }}

      - name: Verify wheel download (fallback via API)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WHEEL_DIR="${{ env.WHEEL_ARTIFACT_DIR }}"
          mkdir -p "$WHEEL_DIR"
          sync

          WHEEL_COUNT=$(find "$WHEEL_DIR" -name "*.whl" -type f 2>/dev/null | wc -l)
          if [ "$WHEEL_COUNT" -gt 0 ]; then
            echo "Found $WHEEL_COUNT wheel(s) from artifact download:"
            find "$WHEEL_DIR" -name "*.whl" -type f
          else
            echo "WARNING: No wheels from download-artifact action; falling back to GitHub API..."
            ARTIFACT_INFO=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=amdsmi-manylinux-wheels-${{ github.sha }}")
            ARTIFACT_URL=$(echo "$ARTIFACT_INFO" | python3 -c "import sys,json; arts=json.load(sys.stdin).get('artifacts',[]); print(arts[0]['archive_download_url'] if arts else '')")

            if [ -z "$ARTIFACT_URL" ]; then
              echo "ERROR: Could not find artifact via API. Available artifacts:"
              curl -sS \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                | python3 -c "import sys,json; [print(f'  {a[\"name\"]} (id={a[\"id\"]}, size={a[\"size_in_bytes\"]})') for a in json.load(sys.stdin).get('artifacts',[])]"
              exit 1
            fi

            echo "Downloading artifact via API..."
            curl -sS -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              -o /tmp/wheels-artifact.zip \
              "$ARTIFACT_URL"
            python3 -m zipfile -e /tmp/wheels-artifact.zip "$WHEEL_DIR"
            rm -f /tmp/wheels-artifact.zip

            WHEEL_COUNT=$(find "$WHEEL_DIR" -name "*.whl" -type f | wc -l)
            if [ "$WHEEL_COUNT" -eq 0 ]; then
              echo "ERROR: No .whl files found even after API fallback"
              ls -laR "$WHEEL_DIR"
              exit 1
            fi
            echo "Successfully downloaded $WHEEL_COUNT wheel(s) via API fallback:"
            find "$WHEEL_DIR" -name "*.whl" -type f
          fi

      - name: Set Artifact Metadata
        if: github.event_name == 'pull_request'
        run: |
          # Set PR number and date for artifact naming
          echo "PR_NUMBER=PR${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          # Set date in MMDDYY-HHMM format (UTC time)
          echo "BUILD_DATE=$(date -u +%m%d%y-%H%M)" >> $GITHUB_ENV

      - name: Set Project Directory
        run: |
          # Find the directory containing the main CMakeLists.txt for AMDSMI
          TARGET_DIR=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/CMakeLists.txt" -exec dirname {} \;)

          if [ -z "$TARGET_DIR" ]; then
            echo "Could not find CMakeLists.txt in projects/amdsmi. Searching root..."
            TARGET_DIR=$(find $GITHUB_WORKSPACE -maxdepth 2 -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
          fi

          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Update repositories for Debian10
        if: matrix.os == 'Debian10'
        run: |
          set -e
          echo 'Updating repositories for Debian10 (archived)'
          cat > /etc/apt/sources.list << EOF
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          EOF
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99-disable-check-valid-until
          apt update


      - name: Build AMDSMI
        shell: bash
        run: |
          set -e
          echo 'Building on ${{ matrix.os }}'
          BUILD_FOLDER=${{ env.PROJECT_DIR }}/build
          RETRIES=3

          for i in $(seq 1 $RETRIES); do
            echo "Build attempt $i for ${{ matrix.os }}..."
            rm -rf $BUILD_FOLDER
            mkdir -p $BUILD_FOLDER
            cd $BUILD_FOLDER

            # Configure, build, and package
            if cmake ${{ env.PROJECT_DIR }} -DBUILD_TESTS=ON -DENABLE_ESMI_LIB=ON -DBUILD_PYTHON_LIB=ON 2>&1 | tee cmake.log && \
               make -j $(nproc) 2>&1 | tee make.log && \
               # Skipping local pip wheel build — using manylinux wheels instead
               make package 2>&1 | tee package.log; then

              # Parse and report warnings as GitHub annotations
              echo "::group::Build Warnings"
              grep -i "warning" cmake.log make.log package.log | while read -r line; do
                echo "::warning::$line"
              done
              echo "::endgroup::"

              echo "Build successful on attempt $i"
              break
            else
              echo "Build failed on attempt $i"
              if [ $i -eq $RETRIES ]; then
                echo "All $RETRIES build attempts failed. Exiting."
                exit 1
              fi
              sleep $((2 * i))
            fi
          done
          echo "Build completed on ${{ matrix.os }}"

      - name: Upload Debian Package Artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: amd-smi-lib-deb-${{ matrix.os }}-${{ env.PR_NUMBER }}-${{ env.BUILD_DATE }}
          path: ${{ env.PROJECT_DIR }}/build/amd-smi-lib*99999-local_amd64.deb
          if-no-files-found: warn
          retention-days: 7

      - name: Install AMDSMI
        run: |
          set -e
          cd ${{ env.PROJECT_DIR }}/build
          if [ "${{ matrix.os }}" != "Debian10" ]; then
            apt update
          fi

          # Locate deb artifacts early and fail with a clear message if missing.
          debs=$(find . -maxdepth 1 -name "amd-smi-lib*99999-local_amd64.deb" -o -name "amd-smi-lib-tests*99999-local_amd64.deb" | tr '\n' ' ')
          if [ -z "$debs" ]; then
            echo "No amd-smi deb artifacts found in $PWD"
            ls -l .
            exit 1
          fi

          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "Installation attempt $i for ${{ matrix.os }}..."
            if apt install -y $debs; then
              echo "Installation successful on attempt $i"
              ln -s /opt/rocm/bin/amd-smi /usr/local/bin

              # Install the manylinux wheel
              echo 'Installing manylinux wheel package...'
              PYTHON_CMD=python3
              $PYTHON_CMD -m pip install --upgrade pip
              echo "Available wheels:"
              find "${{ env.WHEEL_ARTIFACT_DIR }}" -name "*.whl" -type f -ls 2>/dev/null || echo "WARNING: No wheels found!"
              $PYTHON_CMD -m pip install --force-reinstall --no-index --find-links="${{ env.WHEEL_ARTIFACT_DIR }}" amdsmi
              echo "Installed amdsmi package info:"
              $PYTHON_CMD -m pip show amdsmi 2>/dev/null || echo "WARNING: amdsmi not found in pip"

              # Verify Installation
              echo 'Verifying installation:'
              if ! amd-smi version --loglevel=DEBUG 2>&1; then echo "amd-smi version failed with $?" ; exit 1; fi
              if ! python3 -m pip list | grep amd; then echo "pip list | grep amd failed with $?" ; exit 1; fi
              if ! python3 -m pip list | grep pip; then echo "pip list | grep pip failed with $?" ; exit 1; fi
              if ! python3 -m pip list | grep setuptools; then echo "pip list | grep setuptools failed with $?" ; exit 1; fi
              echo 'Completed installation on ${{ matrix.os }}'

              # Verify wheel installation
              echo 'Verifying wheel installation...'
              cd /tmp && $PYTHON_CMD -c "import amdsmi; print('✓ Import successful'); amdsmi.amdsmi_init(); print('✓ Library loaded'); amdsmi.amdsmi_shut_down(); print('✓ Wheel working!')"
              echo 'Python wheel build and install completed on ${{ matrix.os }}'
              break
            else
              echo "Installation failed on attempt $i"
              if [ $i -eq $RETRIES ]; then
                echo "All $RETRIES installation attempts failed. Exiting."
                exit 1
              fi
              sleep $((2 * i))
            fi
          done
          echo "Build completed on ${{ matrix.os }}"

      - name: Uninstall
        if: always()
        run: |
          set -e
          echo 'Uninstalling on ${{ matrix.os }}'
          apt remove -y amd-smi-lib || true
          rm -f /usr/local/bin/amd-smi
          if [ -d /opt/rocm/share/amd_smi ]; then
            echo '/opt/rocm/share/amd_smi exists. Removing.'
            rm -rf /opt/rocm/share/amd_smi
          fi
          echo 'Uninstall done on ${{ matrix.os }}'

  debian-test:
    name: Tests
    needs: debian-buildinstall
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    continue-on-error: true
    strategy:
      max-parallel: 10
      matrix:
        os: [Ubuntu20, Ubuntu22, Ubuntu24, Debian10]
    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: --rm --privileged --device=/dev/kfd --device=/dev/dri --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=64G --cap-add=SYS_MODULE -v /lib/modules:/lib/modules -u root
    env:
      WHEEL_ARTIFACT_DIR: ${{ github.workspace }}/wheels

    steps:
      - uses: actions/checkout@v4

      - name: Download manylinux wheels
        uses: actions/download-artifact@v4
        id: download-wheels
        continue-on-error: true
        with:
          name: amdsmi-manylinux-wheels-${{ github.sha }}
          path: ${{ env.WHEEL_ARTIFACT_DIR }}

      - name: Verify wheel download (fallback via API)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WHEEL_DIR="${{ env.WHEEL_ARTIFACT_DIR }}"
          mkdir -p "$WHEEL_DIR"
          sync

          WHEEL_COUNT=$(find "$WHEEL_DIR" -name "*.whl" -type f 2>/dev/null | wc -l)
          if [ "$WHEEL_COUNT" -gt 0 ]; then
            echo "Found $WHEEL_COUNT wheel(s) from artifact download:"
            find "$WHEEL_DIR" -name "*.whl" -type f
          else
            echo "WARNING: No wheels from download-artifact action; falling back to GitHub API..."
            ARTIFACT_INFO=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=amdsmi-manylinux-wheels-${{ github.sha }}")
            ARTIFACT_URL=$(echo "$ARTIFACT_INFO" | python3 -c "import sys,json; arts=json.load(sys.stdin).get('artifacts',[]); print(arts[0]['archive_download_url'] if arts else '')")

            if [ -z "$ARTIFACT_URL" ]; then
              echo "ERROR: Could not find artifact via API. Available artifacts:"
              curl -sS \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                | python3 -c "import sys,json; [print(f'  {a[\"name\"]} (id={a[\"id\"]}, size={a[\"size_in_bytes\"]})') for a in json.load(sys.stdin).get('artifacts',[])]"
              exit 1
            fi

            echo "Downloading artifact via API..."
            curl -sS -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              -o /tmp/wheels-artifact.zip \
              "$ARTIFACT_URL"
            python3 -m zipfile -e /tmp/wheels-artifact.zip "$WHEEL_DIR"
            rm -f /tmp/wheels-artifact.zip

            WHEEL_COUNT=$(find "$WHEEL_DIR" -name "*.whl" -type f | wc -l)
            if [ "$WHEEL_COUNT" -eq 0 ]; then
              echo "ERROR: No .whl files found even after API fallback"
              ls -laR "$WHEEL_DIR"
              exit 1
            fi
            echo "Successfully downloaded $WHEEL_COUNT wheel(s) via API fallback:"
            find "$WHEEL_DIR" -name "*.whl" -type f
          fi

      - name: Set Project Directory
        run: |
          TARGET_DIR=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/CMakeLists.txt" -exec dirname {} \;)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find $GITHUB_WORKSPACE -maxdepth 2 -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
          fi
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Update repositories for Debian10
        if: matrix.os == 'Debian10'
        run: |
          set -e
          echo 'Updating repositories for Debian10 (archived)'
          cat > /etc/apt/sources.list << EOF
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          EOF
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99-disable-check-valid-until
          apt update


      - name: Build and Install for Test
        shell: bash
        run: |
          set -e
          echo 'Building for test on ${{ matrix.os }}'
          BUILD_FOLDER=${{ env.PROJECT_DIR }}/build
          RETRIES=3

          for i in $(seq 1 $RETRIES); do
            echo "Build attempt $i for ${{ matrix.os }} test..."
            rm -rf $BUILD_FOLDER
            mkdir -p $BUILD_FOLDER
            cd $BUILD_FOLDER

            if cmake ${{ env.PROJECT_DIR }} -DBUILD_TESTS=ON -DENABLE_ESMI_LIB=ON -DBUILD_PYTHON_LIB=ON && \
               make -j $(nproc) && \
               # Skipping local pip wheel build — using manylinux wheels instead
               make package; then

              echo "Build successful on attempt $i"
              break
            else
              echo "Build failed on attempt $i"
              if [ $i -eq $RETRIES ]; then
                echo "All $RETRIES build attempts failed. Exiting."
                exit 1
              fi
              sleep $((2 * i))
            fi
          done

          echo 'Installing for test on ${{ matrix.os }}'
          for i in $(seq 1 $RETRIES); do
            echo "Installation attempt $i for test on ${{ matrix.os }}..."
            if apt install -y $BUILD_FOLDER/amd-smi-lib*99999-local_amd64.deb; then
              echo "Installation successful on attempt $i"
              ln -s /opt/rocm/bin/amd-smi /usr/local/bin
              echo 'Install done for test on ${{ matrix.os }}'
              break
            else
              echo "Installation failed on attempt $i"
              if [ $i -eq $RETRIES ]; then
                echo "All $RETRIES installation attempts failed. Exiting."
                exit 1
              fi
              sleep $((2 * i))
            fi
          done

      - name: Install manylinux wheel
        shell: bash
        run: |
          set -e
          PYTHON_CMD=python3
          $PYTHON_CMD -m pip install --upgrade pip
          echo "Available wheels:"
          find "${{ env.WHEEL_ARTIFACT_DIR }}" -name "*.whl" -type f -ls 2>/dev/null || echo "WARNING: No wheels found!"
          echo "Installing manylinux wheel..."
          $PYTHON_CMD -m pip install --force-reinstall --no-index --find-links="${{ env.WHEEL_ARTIFACT_DIR }}" amdsmi
          echo "Installed amdsmi package info:"
          $PYTHON_CMD -m pip show amdsmi 2>/dev/null || echo "WARNING: amdsmi not found in pip"
          echo "Verifying wheel import..."
          cd /tmp && $PYTHON_CMD -c "import amdsmi; print('Import successful'); amdsmi.amdsmi_init(); print('Library loaded'); amdsmi.amdsmi_shut_down(); print('Wheel verified')"

      - name: AMDSMI Command Tests
        shell: bash
        run: |
          set -e
          echo "Running AMDSMI commands on ${{ matrix.os }}"
          mkdir -p /tmp/test-results-${{ matrix.os }}
          commands=(
            "amd-smi version"
            "amd-smi list"
            "amd-smi static"
            "amd-smi firmware"
            "amd-smi ucode"
            "amd-smi bad-pages"
            "amd-smi metric"
            "amd-smi process"
            "amd-smi topology"
            "amd-smi monitor"
            "amd-smi dmon"
            "amd-smi xgmi"
            "amd-smi partition"
          )
          for cmd in "${commands[@]}"; do
            debug_cmd="$cmd --loglevel debug"
            echo "Running: $debug_cmd"
            if ! eval "$debug_cmd" > /tmp/test-results-${{ matrix.os }}/$(echo $cmd | tr ' ' '_').log 2>&1; then
              echo "Command '$debug_cmd' failed."
              cat /tmp/test-results-${{ matrix.os }}/$(echo $cmd | tr ' ' '_').log
              exit 1
            else
              echo "$debug_cmd passed."
            fi
          done
          echo "AMDSMI commands done on ${{ matrix.os }}"

      - name: Upload AMDSMI Command Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amdsmi-command-tests-${{ matrix.os }}
          path: /tmp/test-results-${{ matrix.os }}

      - name: Run AMDSMI, Python, and Example Tests
        shell: bash
        run: |
          set -e
          echo 'Running other tests on ${{ matrix.os }}'

          # AMDSMI Tests
          echo 'Running AMDSMI tests'
          cd /opt/rocm/share/amd_smi/tests
          source amdsmitst.exclude

          AMDSMI_RETRIES=3
          for attempt in $(seq 1 $AMDSMI_RETRIES); do
            echo "AMDSMI test attempt $attempt for ${{ matrix.os }}..."
            if ./amdsmitst --gtest_filter="-$(echo ${BLACKLIST_ALL_ASICS})" > /tmp/test-results-${{ matrix.os }}/amdsmi_tests.log 2>&1; then
              echo "AMDSMI tests passed on attempt $attempt"
              echo "=============== TEST OUTPUT ==============="
              cat /tmp/test-results-${{ matrix.os }}/amdsmi_tests.log | grep -E "\[==========\]|\[  PASSED  \]|\[  SKIPPED \]|\[  FAILED  \]"
              echo "=============================================="
              echo "AMDSMI tests done"
              break
            else
              TEST_EXIT_CODE=$?
              echo "AMDSMI tests failed on attempt $attempt with exit code $TEST_EXIT_CODE"
              if [ $attempt -eq $AMDSMI_RETRIES ]; then
                echo "All $AMDSMI_RETRIES AMDSMI test attempts failed. Final failure."
                echo "=============== TEST OUTPUT ==============="
                cat /tmp/test-results-${{ matrix.os }}/amdsmi_tests.log | grep -E "\[==========\]|\[  PASSED  \]|\[  SKIPPED \]|\[  FAILED  \]"
                echo "=============================================="
                echo "AMDSMI tests failed"
                exit $TEST_EXIT_CODE
              else
                echo "Retrying AMDSMI tests in $((2 * attempt)) seconds..."
                sleep $((2 * attempt))
              fi
            fi
          done

          # Python Tests
          echo 'Running Python tests'
          cd /opt/rocm/share/amd_smi/tests/python_unittest
          echo "Running integration tests..."
          if ! ./integration_test.py -v > /tmp/test-results-${{ matrix.os }}/integration_test_output.txt 2>&1; then
            echo "Integration tests failed!"
            echo "=============== INTEGRATION TEST OUTPUT ==============="
            tail -100 /tmp/test-results-${{ matrix.os }}/integration_test_output.txt
            echo "======================================================="
            exit 1
          else
            echo "Integration tests passed"
          fi

          echo "Running unit tests..."
          if ! ./unit_tests.py -v > /tmp/test-results-${{ matrix.os }}/unit_test_output.txt 2>&1; then
            echo "Unit tests failed!"
            echo "=============== UNIT TEST OUTPUT ==============="
            tail -100 /tmp/test-results-${{ matrix.os }}/unit_test_output.txt
            echo "================================================"
            exit 1
          else
            echo "Unit tests passed"
          fi

          echo "Python tests done"

          # Example Tests
          echo 'Running Example tests'
          cd ${{ env.PROJECT_DIR }}/example
          rm -rf build
          cmake -B build -DENABLE_ESMI_LIB=OFF
          make -C build -j $(nproc)
          cd build
