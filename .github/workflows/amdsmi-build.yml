# ---------------------------------------------------------------------------
# AMD-SMI CI.
#
# Builds, installs, and tests AMD-SMI against AMD GPUs on self-hosted
# runners BM/VM, using per-distro containers to cover a matrix of
# Debian/RPM distros. TheRock CI only runs in containers so it doesn't cover
# every scenario
#
# Aims to follow TheRock CI conventions as closely as possible.
# ---------------------------------------------------------------------------

name: AMDSMI CI

on:
  pull_request:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/amdsmi-build.yml'
  push:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/amdsmi-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: true
  BUILD_TYPE: Release
  ROCM_DIR: /opt/rocm

defaults:
  run:
    shell: bash

jobs:
  # Single job covering every distro + package format. The build-time logic
  # (package manager, distro quirks) is autodetected by run_amdsmi_build.py
  # from /etc/os-release, so the matrix only needs the OS label plus the
  # artifact format used for upload.
  build-and-test:
    name: ${{ matrix.os }}
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    continue-on-error: true
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        include:
          - { os: Ubuntu20,    package_format: deb, arch_suffix: _amd64.deb }
          - { os: Ubuntu22,    package_format: deb, arch_suffix: _amd64.deb }
          - { os: Debian10,    package_format: deb, arch_suffix: _amd64.deb }
          - { os: SLES,        package_format: rpm, arch_suffix: .rpm }
          - { os: RHEL8,       package_format: rpm, arch_suffix: .rpm }
          - { os: RHEL9,       package_format: rpm, arch_suffix: .rpm }
          - { os: RHEL10,      package_format: rpm, arch_suffix: .rpm }
          - { os: AlmaLinux8,  package_format: rpm, arch_suffix: .rpm }
          - { os: AzureLinux3, package_format: rpm, arch_suffix: .rpm }
    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: --rm --privileged --device=/dev/kfd --device=/dev/dri --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=64G --cap-add=SYS_MODULE -v /lib/modules:/lib/modules -u root

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set Artifact Metadata
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          echo "PR_NUMBER=PR${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%m%d%y-%H%M)" >> $GITHUB_ENV

      - name: Set Project Directory
        run: |
          set -euo pipefail
          TARGET_DIR=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/CMakeLists.txt" -exec dirname {} \;)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find $GITHUB_WORKSPACE -maxdepth 2 -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
          fi
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Run AMDSMI Build and Install
        run: |
          set -euo pipefail
          SCRIPT=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/tests/amdsmi_build/run_amdsmi_build.py" | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: run_amdsmi_build.py not found"
            exit 1
          fi
          echo "Using runner script: $SCRIPT"

          # The script autodetects package manager, format, and distro
          # quirks (Debian10 archived repos, RHEL10/AlmaLinux8 QA_RPATHS,
          # AzureLinux3 more_itertools, etc.) from /etc/os-release.
          python3 "$SCRIPT" \
            --project-dir "${{ env.PROJECT_DIR }}" \
            --os-label "${{ matrix.os }}" \
            --test-results-dir "/tmp/test-results-${{ matrix.os }}"

      # DEBUG (experiment only): show exactly what the NIC driver-detection
      # checks in amdsmi_init.py can see on this runner. The checks gate the
      # AMDSMI_INIT_AMD_NICS flag purely on module initstate (ionic / bnxt_en),
      # while amdgpu additionally confirms a bound PCI device. This dumps the
      # same sysfs the checkers read, plus the actual enumerated handle counts,
      # so we can confirm "module live but zero NIC handles".
      - name: DEBUG NIC driver detection
        if: always()
        run: |
          set +e
          echo "===== module initstate (what check_*_driver reads) ====="
          for m in amdgpu ionic bnxt_en; do
            f="/sys/module/$m/initstate"
            if [ -e "$f" ]; then
              printf "  %-8s initstate: %s\n" "$m" "$(cat "$f" 2>&1)"
            else
              printf "  %-8s initstate: <absent>\n" "$m"
            fi
          done
          echo "===== bound PCI devices per driver (the check amdgpu does, NIC checks skip) ====="
          for d in amdgpu ionic bnxt_en; do
            dir="/sys/bus/pci/drivers/$d"
            if [ -d "$dir" ]; then
              bdfs=$(find "$dir" -maxdepth 1 -type l -printf '%f ' 2>/dev/null)
              printf "  %-8s bound: %s\n" "$d" "${bdfs:-<none>}"
            else
              printf "  %-8s driver dir: <absent>\n" "$d"
            fi
          done
          echo "===== lsmod (nic-related) ====="
          lsmod 2>/dev/null | grep -iE 'ionic|bnxt|amdgpu' || echo "  (none)"
          echo "===== PCI vendor/device/class of bound NIC functions ====="
          # The AI-NIC (Pensando) discovery in smi_nic_subsystem.cpp only
          # registers a device when it finds vendor 0x1dd8 + mgmt device 0x0008
          # (bridge) plus downstream ports 0x1dd8:0x1002. Dump the actual IDs so
          # we can tell whether these are AI-NIC managed parts or plain ionic
          # ethernet NICs (which the library correctly does NOT enumerate).
          for d in ionic bnxt_en; do
            dir="/sys/bus/pci/drivers/$d"
            [ -d "$dir" ] || continue
            for l in "$dir"/*; do
              [ -L "$l" ] || continue
              bdf=$(basename "$l")
              case "$bdf" in
                *:*) : ;;   # looks like a BDF
                *) continue ;;
              esac
              v=$(cat "/sys/bus/pci/devices/$bdf/vendor" 2>/dev/null)
              dev=$(cat "/sys/bus/pci/devices/$bdf/device" 2>/dev/null)
              cls=$(cat "/sys/bus/pci/devices/$bdf/class" 2>/dev/null)
              printf "  %-7s %s  vendor=%s device=%s class=%s\n" "$d" "$bdf" "$v" "$dev" "$cls"
            done
          done
          echo "  (AI-NIC discovery wants vendor=0x1dd8 device=0x0008 mgmt + 0x1002 ports)"
          echo "===== any 0x1dd8:0x0008 (AI-NIC mgmt) anywhere on PCI bus? ====="
          found_mgmt=0
          for dpath in /sys/bus/pci/devices/*; do
            v=$(cat "$dpath/vendor" 2>/dev/null)
            dev=$(cat "$dpath/device" 2>/dev/null)
            if [ "$v" = "0x1dd8" ]; then
              printf "  %s vendor=%s device=%s\n" "$(basename "$dpath")" "$v" "$dev"
              [ "$dev" = "0x0008" ] && found_mgmt=1
            fi
          done
          echo "  found 0x1dd8:0x0008 mgmt device: $found_mgmt"
          echo "===== enumerated handle counts (what get_*_handles return) ====="
          python3 - <<'PY'
          # Mirror exactly what the CLI's get_nic_choices() does, and split the
          # two possible failure modes apart:
          #   (a) get_*_handles() returns 0  -> enumeration gap
          #   (b) handles returned but amdsmi_get_*_info() fails/empty -> info gap
          try:
              import amdsmi.amdsmi_interface as ai
              w = ai.amdsmi_wrapper
              try:
                  ai.amdsmi_init(ai.AmdSmiInitFlags.INIT_ALL_PROCESSORS)
              except Exception as e:
                  print(f"  amdsmi_init: {e}")

              # Per-socket processor counts by type (what get_*_handles iterate)
              try:
                  import ctypes
                  sockets = ai.amdsmi_get_socket_handles()
                  print(f"  socket count: {len(sockets)}")
                  # Include AMD_GPU so we can prove the GPU path enumerates >0
                  # through the exact same handles_by_type mechanism the NIC
                  # path uses (apples-to-apples comparison).
                  type_map = {
                      "AMD_GPU": w.AMDSMI_PROCESSOR_TYPE_AMD_GPU,
                      "AMD_NIC": w.AMDSMI_PROCESSOR_TYPE_AMD_NIC,
                      "BRCM_NIC": w.AMDSMI_PROCESSOR_TYPE_BRCM_NIC,
                      "BRCM_SWITCH": w.AMDSMI_PROCESSOR_TYPE_BRCM_SWITCH,
                  }
                  for tname, tval in type_map.items():
                      total = 0
                      for s in sockets:
                          cnt = ctypes.c_uint32()
                          null_ptr = ctypes.POINTER(w.amdsmi_processor_handle)()
                          try:
                              ai._check_res(
                                  w.amdsmi_get_processor_handles_by_type(
                                      s, tval, null_ptr, ctypes.byref(cnt)
                                  )
                              )
                              total += cnt.value
                          except Exception as e:
                              print(f"    handles_by_type[{tname}] socket err: {e}")
                      print(f"  processor_handles_by_type {tname}: {total}")

                  # Full per-socket breakdown: socket info string (GPU sockets
                  # carry a BDF, CPU sockets are plain ids) plus the processor
                  # types each socket actually exposes. This shows whether the
                  # bound NICs appear as sockets/processors at all.
                  print("  --- per-socket breakdown ---")
                  for si, s in enumerate(sockets):
                      try:
                          sinfo = ai.amdsmi_get_socket_info(s)
                      except Exception as e:
                          sinfo = f"<info err: {e}>"
                      try:
                          # Enumerate ALL processors in this socket via the
                          # wrapper (count, then fill), then classify each.
                          pcnt = ctypes.c_uint32()
                          null_ptr = ctypes.POINTER(w.amdsmi_processor_handle)()
                          ai._check_res(
                              w.amdsmi_get_processor_handles(
                                  s, ctypes.byref(pcnt), null_ptr
                              )
                          )
                          tcounts = {}
                          if pcnt.value > 0:
                              c_handles = (w.amdsmi_processor_handle * pcnt.value)()
                              ai._check_res(
                                  w.amdsmi_get_processor_handles(
                                      s, ctypes.byref(pcnt), c_handles
                                  )
                              )
                              for i in range(pcnt.value):
                                  ph = w.amdsmi_processor_handle(c_handles[i])
                                  try:
                                      pt = ai.amdsmi_get_processor_type(ph)["processor_type"]
                                  except Exception as e:
                                      pt = f"<type err: {e}>"
                                  tcounts[pt] = tcounts.get(pt, 0) + 1
                          print(f"    socket[{si}] info={sinfo!r} total={pcnt.value} processors={tcounts}")
                      except Exception as e:
                          print(f"    socket[{si}] info={sinfo!r} processors ERROR {e}")
              except Exception as e:
                  print(f"  per-socket type probe ERROR: {e}")

              # GPU handle list for a direct contrast against the NIC paths.
              try:
                  gpu_handles = ai.get_gpu_handles()
                  print(f"  get_gpu_handles: {len(gpu_handles)}")
              except Exception as e:
                  print(f"  get_gpu_handles: ERROR {e}")

              # Handle lists + info calls (mode a vs b)
              probes = [
                  ("get_nic_handles", "amdsmi_get_nic_info"),
                  ("get_ainic_handles", "amdsmi_get_ainic_info"),
                  ("get_switch_handles", None),
              ]
              for hfn, ifn in probes:
                  try:
                      handles = getattr(ai, hfn)()
                      print(f"  {hfn}: {len(handles)}")
                      if ifn:
                          for idx, h in enumerate(handles):
                              try:
                                  info = getattr(ai, ifn)(h)
                                  print(f"    {ifn}[{idx}]: {info}")
                              except Exception as e:
                                  print(f"    {ifn}[{idx}]: ERROR {e}")
                  except Exception as e:
                      print(f"  {hfn}: ERROR {e}")

              try:
                  ai.amdsmi_shut_down()
              except Exception:
                  pass
          except Exception as e:
              print(f"  amdsmi import failed: {e}")
          PY

      # DEBUG (experiment only): dump --help for every base subcommand whose
      # CLI test failed, to see which args (notably --nic) are advertised on
      # this runner and how the CLI behaves when invoked with no NIC hardware.
      - name: DEBUG amd-smi subcommand help
        if: always()
        run: |
          set +e
          echo "===== amd-smi version ====="
          amd-smi version
          echo "===== amd-smi list ====="
          amd-smi list
          for sub in bad-pages fabric firmware list metric monitor partition process static topology xgmi node; do
            echo "======================================================"
            echo "===== amd-smi $sub --help ====="
            echo "======================================================"
            amd-smi "$sub" --help
            echo "----- exit: $? -----"
            echo "===== amd-smi $sub --nic (if applicable) ====="
            amd-smi "$sub" --nic
            echo "----- amd-smi $sub --nic exit: $? -----"
          done

      # The previous step exits non-zero if any build/install/wheel-verify
      # stage failed; on failure we dump the per-stage result files for
      # quick triage in the GitHub Actions log. Full logs are still
      # uploaded via the test-results artifact below.
      - name: Dump build/install/wheel result files on failure
        if: failure()
        run: |
          set +e
          for f in build_result.txt install_result.txt verify_wheel_result.txt; do
            path="/tmp/test-results-${{ matrix.os }}/$f"
            if [ -f "$path" ]; then
              echo "===== $f ====="
              cat "$path"
            fi
          done

      - name: Upload Package Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amd-smi-lib-${{ matrix.package_format }}-${{ matrix.os }}-${{ env.PR_NUMBER }}-${{ env.BUILD_DATE }}
          path: |
            ${{ env.PROJECT_DIR }}/build/amd-smi-lib*99999-local${{ matrix.arch_suffix }}
            ${{ env.PROJECT_DIR }}/build/amd-smi-lib-*99999-local*.rpm
          if-no-files-found: warn
          retention-days: 7

      - name: Run AMDSMI, Python, CLI, and Example Tests
        run: |
          set -euo pipefail
          RESULTS_DIR=/tmp/test-results-${{ matrix.os }}
          mkdir -p "$RESULTS_DIR"

          cd /opt/rocm/share/amd_smi/tests
          source amdsmitst.exclude
          source detect_asic_filter.sh
          echo "GTEST_EXCLUDE=${GTEST_EXCLUDE}"
          ./amdsmitst --gtest_filter="-${GTEST_EXCLUDE}" > "$RESULTS_DIR/amdsmi_tests.log" 2>&1

          cd /opt/rocm/share/amd_smi/tests/python_unittest
          ./integration_test.py -v > "$RESULTS_DIR/integration_test_output.txt" 2>&1
          ./unit_tests.py -v > "$RESULTS_DIR/unit_test_output.txt" 2>&1
          # amd-smi CLI test suite. Failures hard-fail the step (no `|| echo`)
          # and are surfaced by the AMDSMI CI Summary step, which scans
          # cli_test_output.txt for 'FAIL:'/'ERROR:' lines.
          ./cli_unit_test.py -v > "$RESULTS_DIR/cli_test_output.txt" 2>&1
          if [ -f ./perf_tests.py ]; then
            ./perf_tests.py -v > "$RESULTS_DIR/perf_test_output.txt" 2>&1 || echo 'perf_tests.py failed'
          else
            echo "perf_tests.py not present; skipping" > "$RESULTS_DIR/perf_test_output.txt"
          fi

          cd ${{ env.PROJECT_DIR }}/example
          rm -rf build
          cmake -B build -DENABLE_ESMI_LIB=OFF
          make -C build -j $(nproc)
          cd build
          ./amd_smi_drm_ex > "$RESULTS_DIR/amd_smi_drm_ex.log" 2>&1 || echo 'amd_smi_drm_ex failed'
          ./amd_smi_nodrm_ex > "$RESULTS_DIR/amd_smi_nodrm_ex.log" 2>&1 || echo 'amd_smi_nodrm_ex failed'

      - name: AMDSMI Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/amdsmi_tests.log || echo "No AMDSMI test results"

      - name: Integration Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/integration_test_output.txt || echo "No integration test results"

      - name: Unit Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/unit_test_output.txt || echo "No unit test results"

      - name: CLI Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/cli_test_output.txt || echo "No CLI test results"

      - name: Perf Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/perf_test_output.txt || echo "No perf test results"

      - name: Example DRM Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/amd_smi_drm_ex.log || echo "No DRM example results"

      - name: Example NoDRM Test Results
        if: always()
        run: cat /tmp/test-results-${{ matrix.os }}/amd_smi_nodrm_ex.log || echo "No NoDRM example results"

      - name: Upload AMDSMI Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amdsmi-test-results-${{ matrix.os }}
          path: /tmp/test-results-${{ matrix.os }}

      - name: AMDSMI CI Summary
        if: always()
        run: |
          set -euo pipefail
          SCRIPT=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/tests/amdsmi_build/run_amdsmi_build.py" | head -1)
          python3 "$SCRIPT" summarize \
            --results-dir "/tmp/test-results-${{ matrix.os }}" \
            --os-label "${{ matrix.os }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Uninstall
        if: always()
        run: |
          set -euo pipefail
          case "${{ matrix.package_format }}" in
            deb) apt remove -y amd-smi-lib || true ;;
            rpm)
              case "${{ matrix.os }}" in
                SLES) zypper remove -y amd-smi-lib || true ;;
                *) dnf remove -y amd-smi-lib || true ;;
              esac
              ;;
          esac
          rm -f /usr/local/bin/amd-smi
          if [ -d /opt/rocm/share/amd_smi ]; then
            rm -rf /opt/rocm/share/amd_smi
          fi
