name: AMDSMI CI

on:
  pull_request:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/amdsmi-build.yml'
  push:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/amdsmi-build.yml'
  workflow_dispatch:

permissions:
  contents: read
env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: true
  BUILD_TYPE: Release
  ROCM_DIR: /opt/rocm

jobs:
  manylinux-build:
    name: Build (Manylinux Gate)
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build AMDSMI
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=$GITHUB_WORKSPACE/projects/amdsmi
          BUILD_DIR=/tmp/amdsmi-build
          PY_BUILD=/opt/python/cp38-cp38/bin/python3

          echo "Installing build prerequisites..."
          dnf -y install git make gcc gcc-c++ cmake ninja-build openssl-devel

          echo "Configuring and building AMDSMI..."
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          cmake "$PROJECT_DIR" \
            -DBUILD_TESTS=ON \
            -DENABLE_ESMI_LIB=ON \
            -DBUILD_PYTHON_WHEEL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$PY_BUILD"
          make -j"$(nproc)"

          echo "Building Python wheel..."
          $PY_BUILD -m pip install --upgrade pip setuptools wheel
          cd "$BUILD_DIR/py-interface/python_package"
          rm -rf build dist *.whl *.egg-info
          $PY_BUILD -m pip wheel --no-deps --no-build-isolation -w . .
          echo "Python wheel built: $(ls *.whl)"
          echo "Build gate passed"


  debian-test:
    name: Tests (${{ matrix.os }})
    needs: manylinux-build
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    continue-on-error: true
    strategy:
      max-parallel: 10
      matrix:
        os: [Ubuntu20, Ubuntu22, Ubuntu24, Debian10]
    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: --rm --privileged --device=/dev/kfd --device=/dev/dri --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=64G --cap-add=SYS_MODULE -v /lib/modules:/lib/modules -u root

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set Project Directory
        run: |
          TARGET_DIR=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/CMakeLists.txt" -exec dirname {} \;)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find $GITHUB_WORKSPACE -maxdepth 2 -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
          fi
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Run AMDSMI Build and Install
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/tests/run_amdsmi_build.py" | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: run_amdsmi_build.py not found"
            exit 1
          fi
          echo "Using runner script: $SCRIPT"

          ARGS=(
            --project-dir "${{ env.PROJECT_DIR }}"
            --os-label "${{ matrix.os }}"
            --test-results-dir "/tmp/test-results-${{ matrix.os }}"
            --package-manager apt
          )

          if [ "${{ matrix.os }}" = "Debian10" ]; then
            ARGS+=(--debian10-sources)
          fi

          echo "Running: python3 $SCRIPT ${ARGS[*]}"
          python3 "$SCRIPT" "${ARGS[@]}" || {
            EXIT_CODE=$?
            echo ""
            echo "=========================================="
            echo "AMDSMI build/install FAILED for ${{ matrix.os }} (exit code $EXIT_CODE)"
            echo "=========================================="
            echo "Log directory contents:"
            ls -la logs/amdsmi/ 2>/dev/null || true
            exit $EXIT_CODE
          }

      # ── Build / Install Result Display ──────────────────────────

      - name: AMDSMI Build Result
        if: always()
        run: |
          echo "=========================================="
          echo "AMDSMI BUILD RESULT for ${{ matrix.os }}"
          echo "=========================================="
          RESULT="/tmp/test-results-${{ matrix.os }}/build_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            if grep -q "FAILED" "$RESULT"; then
              echo "::error::Build FAILED for ${{ matrix.os }}"
            fi
          else
            echo "No build result file found for ${{ matrix.os }}"
          fi

      - name: AMDSMI Installation Result
        if: always()
        run: |
          echo "=========================================="
          echo "AMDSMI INSTALLATION RESULT for ${{ matrix.os }}"
          echo "=========================================="
          RESULT="/tmp/test-results-${{ matrix.os }}/install_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            if grep -q "FAILED" "$RESULT"; then
              echo "::error::Installation FAILED for ${{ matrix.os }}"
            fi
          else
            echo "No install result file found for ${{ matrix.os }}"
          fi

      - name: Verify Wheel Site-Packages Result
        if: always()
        run: |
          echo "=========================================="
          echo "VERIFY WHEEL SITE-PACKAGES for ${{ matrix.os }}"
          echo "=========================================="
          RESULT="/tmp/test-results-${{ matrix.os }}/verify_wheel_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            if grep -q "FAILED" "$RESULT"; then
              echo "::error::Wheel verification FAILED for ${{ matrix.os }}"
            fi
          else
            echo "No verify wheel result file found for ${{ matrix.os }}"
          fi

      # ── Test Execution ─────────────────────────────────────────

      - name: Run AMDSMI Command Tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p "$RESULTS_DIR"
          echo "Running amd-smi command tests for ${{ matrix.os }}..."
          COMMANDS="version list static firmware ucode bad-pages metric process topology monitor dmon xgmi partition"
          FAILED_CMDS=""
          for CMD in $COMMANDS; do
            echo "--- amd-smi $CMD --loglevel debug ---"
            if amd-smi $CMD --loglevel debug > "$RESULTS_DIR/amd-smi_${CMD}.log" 2>&1; then
              echo "PASS: amd-smi $CMD"
            else
              echo "FAIL: amd-smi $CMD (exit code $?)"
              FAILED_CMDS="$FAILED_CMDS $CMD"
            fi
            cat "$RESULTS_DIR/amd-smi_${CMD}.log"
          done
          if [ -n "$FAILED_CMDS" ]; then
            echo "::error::Command tests FAILED for ${{ matrix.os }}:$FAILED_CMDS"
            exit 1
          fi
          echo "All command tests passed"

      - name: Run AMDSMI Tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p "$RESULTS_DIR"
          TEST_DIR="/opt/rocm/share/amd_smi/tests"
          if [ ! -d "$TEST_DIR" ]; then
            echo "Test directory $TEST_DIR not found; skipping"
            exit 0
          fi
          cd "$TEST_DIR"
          source amdsmitst.exclude 2>/dev/null || true
          if [ -f detect_asic_filter.sh ]; then
            source detect_asic_filter.sh 2>/dev/null || true
          fi
          if [ -n "${GTEST_EXCLUDE:-}" ]; then
            echo "GTEST_EXCLUDE=$GTEST_EXCLUDE"
            ./amdsmitst --gtest_filter="-${GTEST_EXCLUDE}" 2>&1 | tee "$RESULTS_DIR/amdsmi_tests.log"
          else
            ./amdsmitst 2>&1 | tee "$RESULTS_DIR/amdsmi_tests.log"
          fi

      - name: Run Integration Tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p "$RESULTS_DIR"
          TEST_DIR="/opt/rocm/share/amd_smi/tests/python_unittest"
          if [ ! -d "$TEST_DIR" ]; then
            echo "Python test directory $TEST_DIR not found; skipping"
            exit 0
          fi
          cd "$TEST_DIR"
          echo "Running integration tests..."
          ./integration_test.py -v 2>&1 | tee "$RESULTS_DIR/integration_test_output.txt"

      - name: Run Unit Tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p "$RESULTS_DIR"
          TEST_DIR="/opt/rocm/share/amd_smi/tests/python_unittest"
          if [ ! -d "$TEST_DIR" ]; then
            echo "Python test directory $TEST_DIR not found; skipping"
            exit 0
          fi
          cd "$TEST_DIR"
          echo "Running unit tests..."
          ./unit_tests.py -v 2>&1 | tee "$RESULTS_DIR/unit_test_output.txt"

      - name: Run Perf Tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p "$RESULTS_DIR"
          TEST_DIR="/opt/rocm/share/amd_smi/tests/python_unittest"
          if [ ! -d "$TEST_DIR" ] || [ ! -f "$TEST_DIR/perf_tests.py" ]; then
            echo "Perf test script not found; skipping"
            exit 0
          fi
          cd "$TEST_DIR"
          echo "Running perf tests..."
          ./perf_tests.py -v 2>&1 | tee "$RESULTS_DIR/perf_test_output.txt"

      - name: Run Example Tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p "$RESULTS_DIR"
          EXAMPLE_DIR="${{ env.PROJECT_DIR }}/example"
          if [ ! -d "$EXAMPLE_DIR" ]; then
            echo "Example directory $EXAMPLE_DIR not found; skipping"
            exit 0
          fi
          cd "$EXAMPLE_DIR"
          rm -rf build
          # Repair cmake if pip wrapper is broken (e.g. after setuptools upgrade on SLES)
          if ! cmake --version >/dev/null 2>&1; then
            python3 -m pip install --force-reinstall cmake 2>/dev/null || true
            hash -r
          fi
          cmake -B build -DENABLE_ESMI_LIB=OFF -DCMAKE_PREFIX_PATH=/opt/rocm
          make -C build -j"$(nproc)" amd_smi_drm_ex amd_smi_nodrm_ex
          for BIN in amd_smi_drm_ex amd_smi_nodrm_ex; do
            if [ -x "build/$BIN" ]; then
              echo "--- Running $BIN ---"
              ./build/$BIN 2>&1 | tee "$RESULTS_DIR/${BIN}.log" || true
            fi
          done

      # ── Test Result Display ────────────────────────────────────

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amdsmi-test-results-${{ matrix.os }}
          path: /tmp/test-results-${{ matrix.os }}

      - name: AMDSMI Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "AMDSMI TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/amdsmi_tests.log"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            FAILED=$(grep -E "\[  FAILED  \]" "$FILE" | head -20 || true)
            if [ -n "$FAILED" ]; then
              echo ""
              echo "::error::AMDSMI test failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No AMDSMI test results found"
          fi

      - name: Integration Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "INTEGRATION TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/integration_test_output.txt"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            FAILED=$(grep -E "^FAIL:" "$FILE" | head -20 || true)
            if [ -n "$FAILED" ]; then
              echo ""
              echo "::error::Integration test failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No integration test results found"
          fi

      - name: Unit Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "UNIT TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/unit_test_output.txt"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            FAILED=$(grep -E "^FAIL:" "$FILE" | head -20 || true)
            if [ -n "$FAILED" ]; then
              echo ""
              echo "::error::Unit test failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No unit test results found"
          fi

      - name: Perf Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "PERF TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/perf_test_output.txt"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            FAILED=$(grep -E "^FAIL:" "$FILE" | head -20 || true)
            if [ -n "$FAILED" ]; then
              echo ""
              echo "::error::Perf test failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No perf test results found"
          fi

      - name: Example DRM Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "EXAMPLE DRM TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          cat /tmp/test-results-${{ matrix.os }}/amd_smi_drm_ex.log 2>/dev/null || echo "No DRM example results"

      - name: Example NoDRM Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "EXAMPLE NoDRM TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          cat /tmp/test-results-${{ matrix.os }}/amd_smi_nodrm_ex.log 2>/dev/null || echo "No NoDRM example results"

      - name: CI Summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          declare -a FAILURES=()
          DETAILS=""

          echo "=========================================="
          echo "CI SUMMARY for ${{ matrix.os }}"
          echo "=========================================="

          # 1. Check build/install/verify stage results
          for result_file in "$RESULTS_DIR"/*_result.txt; do
            [ -f "$result_file" ] || continue
            if grep -q "FAILED" "$result_file"; then
              STAGE=$(basename "$result_file" _result.txt | tr '_' ' ')
              FAILURES+=("$STAGE")
              CONTENT=$(cat "$result_file")
              DETAILS+=$'\n'"#### ${STAGE}"$'\n\n'"\`\`\`"$'\n'"${CONTENT}"$'\n'"\`\`\`"$'\n'
              echo "FAILED: $STAGE"
              sed 's/^/  /' "$result_file"
            fi
          done

          # 2. Check amd-smi command test logs
          CMD_FAILS=""
          for log in "$RESULTS_DIR"/amd-smi_*.log; do
            [ -f "$log" ] || continue
            CMD=$(basename "$log" .log | sed 's/amd-smi_//')
            if grep -qE "Traceback|AmdSmiException|Error code:" "$log" 2>/dev/null; then
              CMD_FAILS+=" $CMD"
            fi
          done
          if [ -n "$CMD_FAILS" ]; then
            FAILURES+=("Command tests:$CMD_FAILS")
            DETAILS+=$'\n'"#### Command Tests"$'\n\n'"Failed commands:"$'\n'
            for log in "$RESULTS_DIR"/amd-smi_*.log; do
              [ -f "$log" ] || continue
              CMD=$(basename "$log" .log | sed 's/amd-smi_//')
              if grep -qE "Traceback|AmdSmiException|Error code:" "$log" 2>/dev/null; then
                DETAILS+="- ${CMD} (log: ${log})"$'\n'
              fi
            done
            echo "Command test failures:$CMD_FAILS"
          fi

          # 3. Check AMDSMI C++ test output
          if [ -f "$RESULTS_DIR/amdsmi_tests.log" ]; then
            GTEST_FAILS=$(grep -c "\[  FAILED  \]" "$RESULTS_DIR/amdsmi_tests.log" 2>/dev/null || true)
            if [ "${GTEST_FAILS:-0}" -gt 0 ] 2>/dev/null; then
              FAILURES+=("AMDSMI Tests ($GTEST_FAILS)")
              FULL_LOG=$(cat "$RESULTS_DIR/amdsmi_tests.log")
              DETAILS+=$'\n'"#### AMDSMI Tests — $GTEST_FAILS failure(s)"$'\n\n'"\`\`\`"$'\n'"${FULL_LOG}"$'\n'"\`\`\`"$'\n'
              echo "AMDSMI Tests: $GTEST_FAILS failure(s)"
              grep "\[  FAILED  \]" "$RESULTS_DIR/amdsmi_tests.log" | head -30 | sed 's/^/  /'
            fi
          fi

          # 4. Check Python test outputs
          for test_file in integration_test_output.txt unit_test_output.txt perf_test_output.txt; do
            FULL="$RESULTS_DIR/$test_file"
            [ -f "$FULL" ] || continue
            PY_FAILS=$(grep -cE "^FAIL:|^ERROR:" "$FULL" 2>/dev/null || true)
            if [ "${PY_FAILS:-0}" -gt 0 ] 2>/dev/null; then
              TEST_NAME=$(basename "$test_file" _output.txt | tr '_' ' ')
              FAILURES+=("${TEST_NAME} ($PY_FAILS)")
              FULL_LOG=$(cat "$FULL")
              DETAILS+=$'\n'"#### ${TEST_NAME} — $PY_FAILS failure(s)"$'\n\n'"\`\`\`"$'\n'"${FULL_LOG}"$'\n'"\`\`\`"$'\n'
              echo "${TEST_NAME}: $PY_FAILS failure(s)"
              grep -E "^FAIL:|^ERROR:" "$FULL" | head -30 | sed 's/^/  /'
            fi
          done

          # 5. Check example test results
          for ex_log in amd_smi_drm_ex.log amd_smi_nodrm_ex.log; do
            FULL="$RESULTS_DIR/$ex_log"
            [ -f "$FULL" ] || continue
            if grep -qiE "segfault|SIGSEGV|abort" "$FULL" 2>/dev/null; then
              EX_NAME="${ex_log%.log}"
              FAILURES+=("Example $EX_NAME")
              FULL_LOG=$(cat "$FULL")
              DETAILS+=$'\n'"#### Example ${EX_NAME}"$'\n\n'"\`\`\`"$'\n'"${FULL_LOG}"$'\n'"\`\`\`"$'\n'
              echo "Example $EX_NAME: errors detected"
            fi
          done

          # Write GitHub Actions Job Summary
          {
            if [ ${#FAILURES[@]} -gt 0 ]; then
              echo "## :x: CI Failed — ${{ matrix.os }}"
              echo ""
              echo "**${#FAILURES[@]} failure(s) detected:**"
              echo ""
              for f in "${FAILURES[@]}"; do
                echo "- :red_circle: ${f}"
              done
              echo "$DETAILS"
            else
              echo "## :white_check_mark: CI Passed — ${{ matrix.os }}"
              echo ""
              echo "All stages and tests passed successfully."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#FAILURES[@]} -gt 0 ]; then
            echo ""
            echo "::error::${#FAILURES[@]} failure(s) for ${{ matrix.os }}: ${FAILURES[*]}"
          else
            echo "All stages and tests PASSED for ${{ matrix.os }}"
          fi


  rpm-test:
    name: Tests (${{ matrix.os }})
    needs: [manylinux-build, debian-test]
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    continue-on-error: true
    strategy:
      max-parallel: 10
      matrix:
        os:
          - SLES
          - RHEL8
          - RHEL9
          - RHEL10
          - AzureLinux3
          - AlmaLinux8
    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: --rm --privileged --device=/dev/kfd --device=/dev/dri --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=64G --cap-add=SYS_MODULE -v /lib/modules:/lib/modules -u root

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set Project Directory
        run: |
          TARGET_DIR=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/CMakeLists.txt" -exec dirname {} \;)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR=$(find $GITHUB_WORKSPACE -maxdepth 2 -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
          fi
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Setup Python
        shell: bash
        run: |
          # RHEL8/AlmaLinux8 ship Python 3.6; the build script needs 3.8+
          if python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3,8) else 1)' 2>/dev/null; then
            echo "Python 3 is already 3.8+: $(python3 --version)"
            exit 0
          fi
          echo "System python3 is too old: $(python3 --version 2>&1 || echo not found)"
          echo "Installing a newer Python..."
          if command -v dnf &>/dev/null; then
            dnf install -y python38 python38-pip python38-setuptools 2>/dev/null || \
              dnf install -y python3.8 python3.8-pip 2>/dev/null || true
          elif command -v zypper &>/dev/null; then
            zypper --non-interactive install python311 python311-pip 2>/dev/null || \
              zypper --non-interactive install python310 python310-pip 2>/dev/null || \
              zypper --non-interactive install python39 python39-pip 2>/dev/null || \
              zypper --non-interactive install python38 python38-pip 2>/dev/null || true
          fi
          for PY in python3.11 python3.10 python3.9 python3.8; do
            if command -v "$PY" &>/dev/null; then
              alternatives --set python3 "$(command -v $PY)" 2>/dev/null || \
                ln -sf "$(command -v $PY)" /usr/bin/python3
              break
            fi
          done
          echo "Python 3 is now: $(python3 --version)"
          python3 -c 'import sys; assert sys.version_info>=(3,8)'

      - name: Run AMDSMI Build and Install
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(find $GITHUB_WORKSPACE -path "*/projects/amdsmi/tests/run_amdsmi_build.py" | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: run_amdsmi_build.py not found"
            exit 1
          fi
          echo "Using runner script: $SCRIPT"

          # Determine package manager
          case "${{ matrix.os }}" in
            SLES)          PKG_MGR=zypper ;;
            RHEL8|RHEL9|RHEL10|AlmaLinux8|AzureLinux3) PKG_MGR=dnf ;;
            *)             PKG_MGR=dnf ;;
          esac

          ARGS=(
            --project-dir "${{ env.PROJECT_DIR }}"
            --os-label "${{ matrix.os }}"
            --test-results-dir "/tmp/test-results-${{ matrix.os }}"
            --package-manager "$PKG_MGR"
            --package-format rpm
          )

          # RHEL10 and AlmaLinux8 need QA_RPATHS and more retries
          case "${{ matrix.os }}" in
            RHEL10|AlmaLinux8)
              ARGS+=(--qa-rpaths --retries 5)
              ;;
          esac

          # AzureLinux3: skip setuptools upgrade, install more_itertools
          if [ "${{ matrix.os }}" = "AzureLinux3" ]; then
            ARGS+=(--skip-setuptools-upgrade --install-more-itertools)
          fi

          echo "Running: python3 $SCRIPT ${ARGS[*]}"
          python3 "$SCRIPT" "${ARGS[@]}" || {
            EXIT_CODE=$?
            echo ""
            echo "=========================================="
            echo "AMDSMI build/install FAILED for ${{ matrix.os }} (exit code $EXIT_CODE)"
            echo "=========================================="
            echo "Log directory contents:"
            ls -la logs/amdsmi/ 2>/dev/null || true
            exit $EXIT_CODE
          }

      # ── Build / Install Result Display ──────────────────────────

      - name: AMDSMI Build Result
        if: always()
        run: |
          echo "=========================================="
          echo "AMDSMI BUILD RESULT for ${{ matrix.os }}"
          echo "=========================================="
          RESULT="/tmp/test-results-${{ matrix.os }}/build_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            if grep -q "FAILED" "$RESULT"; then
              echo "::error::Build FAILED for ${{ matrix.os }}"
            fi
          else
            echo "No build result file found for ${{ matrix.os }}"
          fi

      - name: AMDSMI Installation Result
        if: always()
        run: |
          echo "=========================================="
          echo "AMDSMI INSTALLATION RESULT for ${{ matrix.os }}"
          echo "=========================================="
          RESULT="/tmp/test-results-${{ matrix.os }}/install_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            if grep -q "FAILED" "$RESULT"; then
              echo "::error::Installation FAILED for ${{ matrix.os }}"
            fi
          else
            echo "No install result file found for ${{ matrix.os }}"
          fi

      - name: Verify Wheel Site-Packages Result
        if: always()
        run: |
          echo "=========================================="
          echo "VERIFY WHEEL SITE-PACKAGES for ${{ matrix.os }}"
          echo "=========================================="
          RESULT="/tmp/test-results-${{ matrix.os }}/verify_wheel_result.txt"
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
            if grep -q "FAILED" "$RESULT"; then
              echo "::error::Wheel verification FAILED for ${{ matrix.os }}"
            fi
          else
            echo "No verify wheel result file found for ${{ matrix.os }}"
          fi

      # ── Test Execution ─────────────────────────────────────────

      - name: Run AMDSMI Command Tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p "$RESULTS_DIR"
          echo "Running amd-smi command tests for ${{ matrix.os }}..."
          COMMANDS="version list static firmware ucode bad-pages metric process topology monitor dmon xgmi partition"
          FAILED_CMDS=""
          for CMD in $COMMANDS; do
            echo "--- amd-smi $CMD --loglevel debug ---"
            if amd-smi $CMD --loglevel debug > "$RESULTS_DIR/amd-smi_${CMD}.log" 2>&1; then
              echo "PASS: amd-smi $CMD"
            else
              echo "FAIL: amd-smi $CMD (exit code $?)"
              FAILED_CMDS="$FAILED_CMDS $CMD"
            fi
            cat "$RESULTS_DIR/amd-smi_${CMD}.log"
          done
          if [ -n "$FAILED_CMDS" ]; then
            echo "::error::Command tests FAILED for ${{ matrix.os }}:$FAILED_CMDS"
            exit 1
          fi
          echo "All command tests passed"

      - name: Run AMDSMI Tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p "$RESULTS_DIR"
          TEST_DIR="/opt/rocm/share/amd_smi/tests"
          if [ ! -d "$TEST_DIR" ]; then
            echo "Test directory $TEST_DIR not found; skipping"
            exit 0
          fi
          cd "$TEST_DIR"
          source amdsmitst.exclude 2>/dev/null || true
          if [ -f detect_asic_filter.sh ]; then
            source detect_asic_filter.sh 2>/dev/null || true
          fi
          if [ -n "${GTEST_EXCLUDE:-}" ]; then
            echo "GTEST_EXCLUDE=$GTEST_EXCLUDE"
            ./amdsmitst --gtest_filter="-${GTEST_EXCLUDE}" 2>&1 | tee "$RESULTS_DIR/amdsmi_tests.log"
          else
            ./amdsmitst 2>&1 | tee "$RESULTS_DIR/amdsmi_tests.log"
          fi

      - name: Run Integration Tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p "$RESULTS_DIR"
          TEST_DIR="/opt/rocm/share/amd_smi/tests/python_unittest"
          if [ ! -d "$TEST_DIR" ]; then
            echo "Python test directory $TEST_DIR not found; skipping"
            exit 0
          fi
          cd "$TEST_DIR"
          echo "Running integration tests..."
          ./integration_test.py -v 2>&1 | tee "$RESULTS_DIR/integration_test_output.txt"

      - name: Run Unit Tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p "$RESULTS_DIR"
          TEST_DIR="/opt/rocm/share/amd_smi/tests/python_unittest"
          if [ ! -d "$TEST_DIR" ]; then
            echo "Python test directory $TEST_DIR not found; skipping"
            exit 0
          fi
          cd "$TEST_DIR"
          echo "Running unit tests..."
          ./unit_tests.py -v 2>&1 | tee "$RESULTS_DIR/unit_test_output.txt"

      - name: Run Perf Tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p "$RESULTS_DIR"
          TEST_DIR="/opt/rocm/share/amd_smi/tests/python_unittest"
          if [ ! -d "$TEST_DIR" ] || [ ! -f "$TEST_DIR/perf_tests.py" ]; then
            echo "Perf test script not found; skipping"
            exit 0
          fi
          cd "$TEST_DIR"
          echo "Running perf tests..."
          ./perf_tests.py -v 2>&1 | tee "$RESULTS_DIR/perf_test_output.txt"

      - name: Run Example Tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p "$RESULTS_DIR"
          EXAMPLE_DIR="${{ env.PROJECT_DIR }}/example"
          if [ ! -d "$EXAMPLE_DIR" ]; then
            echo "Example directory $EXAMPLE_DIR not found; skipping"
            exit 0
          fi
          cd "$EXAMPLE_DIR"
          rm -rf build
          # Repair cmake if pip wrapper is broken (e.g. after setuptools upgrade on SLES)
          if ! cmake --version >/dev/null 2>&1; then
            python3 -m pip install --force-reinstall cmake 2>/dev/null || true
            hash -r
          fi
          cmake -B build -DENABLE_ESMI_LIB=OFF -DCMAKE_PREFIX_PATH=/opt/rocm
          make -C build -j"$(nproc)" amd_smi_drm_ex amd_smi_nodrm_ex
          for BIN in amd_smi_drm_ex amd_smi_nodrm_ex; do
            if [ -x "build/$BIN" ]; then
              echo "--- Running $BIN ---"
              ./build/$BIN 2>&1 | tee "$RESULTS_DIR/${BIN}.log" || true
            fi
          done

      # ── Test Result Display ────────────────────────────────────

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amdsmi-test-results-${{ matrix.os }}
          path: /tmp/test-results-${{ matrix.os }}

      - name: AMDSMI Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "AMDSMI TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/amdsmi_tests.log"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            FAILED=$(grep -E "\[  FAILED  \]" "$FILE" | head -20 || true)
            if [ -n "$FAILED" ]; then
              echo ""
              echo "::error::AMDSMI test failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No AMDSMI test results found"
          fi

      - name: Integration Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "INTEGRATION TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/integration_test_output.txt"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            FAILED=$(grep -E "^FAIL:" "$FILE" | head -20 || true)
            if [ -n "$FAILED" ]; then
              echo ""
              echo "::error::Integration test failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No integration test results found"
          fi

      - name: Unit Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "UNIT TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/unit_test_output.txt"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            FAILED=$(grep -E "^FAIL:" "$FILE" | head -20 || true)
            if [ -n "$FAILED" ]; then
              echo ""
              echo "::error::Unit test failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No unit test results found"
          fi

      - name: Perf Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "PERF TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          FILE="/tmp/test-results-${{ matrix.os }}/perf_test_output.txt"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            FAILED=$(grep -E "^FAIL:" "$FILE" | head -20 || true)
            if [ -n "$FAILED" ]; then
              echo ""
              echo "::error::Perf test failures for ${{ matrix.os }}:%0A${FAILED}"
            fi
          else
            echo "No perf test results found"
          fi

      - name: Example DRM Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "EXAMPLE DRM TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          cat /tmp/test-results-${{ matrix.os }}/amd_smi_drm_ex.log 2>/dev/null || echo "No DRM example results"

      - name: Example NoDRM Test Results
        if: always()
        run: |
          echo "=========================================="
          echo "EXAMPLE NoDRM TEST RESULTS for ${{ matrix.os }}"
          echo "=========================================="
          cat /tmp/test-results-${{ matrix.os }}/amd_smi_nodrm_ex.log 2>/dev/null || echo "No NoDRM example results"

      - name: CI Summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          RESULTS_DIR="/tmp/test-results-${{ matrix.os }}"
          declare -a FAILURES=()
          DETAILS=""

          echo "=========================================="
          echo "CI SUMMARY for ${{ matrix.os }}"
          echo "=========================================="

          # 1. Check build/install/verify stage results
          for result_file in "$RESULTS_DIR"/*_result.txt; do
            [ -f "$result_file" ] || continue
            if grep -q "FAILED" "$result_file"; then
              STAGE=$(basename "$result_file" _result.txt | tr '_' ' ')
              FAILURES+=("$STAGE")
              CONTENT=$(cat "$result_file")
              DETAILS+=$'\n'"#### ${STAGE}"$'\n\n'"\`\`\`"$'\n'"${CONTENT}"$'\n'"\`\`\`"$'\n'
              echo "FAILED: $STAGE"
              sed 's/^/  /' "$result_file"
            fi
          done

          # 2. Check amd-smi command test logs
          CMD_FAILS=""
          for log in "$RESULTS_DIR"/amd-smi_*.log; do
            [ -f "$log" ] || continue
            CMD=$(basename "$log" .log | sed 's/amd-smi_//')
            if grep -qE "Traceback|AmdSmiException|Error code:" "$log" 2>/dev/null; then
              CMD_FAILS+=" $CMD"
            fi
          done
          if [ -n "$CMD_FAILS" ]; then
            FAILURES+=("Command tests:$CMD_FAILS")
            DETAILS+=$'\n'"#### Command Tests"$'\n\n'"Failed commands:\`$CMD_FAILS\`"$'\n'
            for log in "$RESULTS_DIR"/amd-smi_*.log; do
              [ -f "$log" ] || continue
              CMD=$(basename "$log" .log | sed 's/amd-smi_//')
              if grep -qE "Traceback|AmdSmiException|Error code:" "$log" 2>/dev/null; then
                LOG_CONTENT=$(cat "$log")
                DETAILS+=$'\n'"##### amd-smi ${CMD}"$'\n\n'"\`\`\`"$'\n'"${LOG_CONTENT}"$'\n'"\`\`\`"$'\n'
              fi
            done
            echo "Command test failures:$CMD_FAILS"
          fi

          # 3. Check AMDSMI C++ test output
          if [ -f "$RESULTS_DIR/amdsmi_tests.log" ]; then
            GTEST_FAILS=$(grep -c "\[  FAILED  \]" "$RESULTS_DIR/amdsmi_tests.log" 2>/dev/null || true)
            if [ "${GTEST_FAILS:-0}" -gt 0 ] 2>/dev/null; then
              FAILURES+=("AMDSMI Tests ($GTEST_FAILS)")
              FULL_LOG=$(cat "$RESULTS_DIR/amdsmi_tests.log")
              DETAILS+=$'\n'"#### AMDSMI Tests — $GTEST_FAILS failure(s)"$'\n\n'"\`\`\`"$'\n'"${FULL_LOG}"$'\n'"\`\`\`"$'\n'
              echo "AMDSMI Tests: $GTEST_FAILS failure(s)"
              grep "\[  FAILED  \]" "$RESULTS_DIR/amdsmi_tests.log" | head -30 | sed 's/^/  /'
            fi
          fi

          # 4. Check Python test outputs
          for test_file in integration_test_output.txt unit_test_output.txt perf_test_output.txt; do
            FULL="$RESULTS_DIR/$test_file"
            [ -f "$FULL" ] || continue
            PY_FAILS=$(grep -cE "^FAIL:|^ERROR:" "$FULL" 2>/dev/null || true)
            if [ "${PY_FAILS:-0}" -gt 0 ] 2>/dev/null; then
              TEST_NAME=$(basename "$test_file" _output.txt | tr '_' ' ')
              FAILURES+=("${TEST_NAME} ($PY_FAILS)")
              FULL_LOG=$(cat "$FULL")
              DETAILS+=$'\n'"#### ${TEST_NAME} — $PY_FAILS failure(s)"$'\n\n'"\`\`\`"$'\n'"${FULL_LOG}"$'\n'"\`\`\`"$'\n'
              echo "${TEST_NAME}: $PY_FAILS failure(s)"
              grep -E "^FAIL:|^ERROR:" "$FULL" | head -30 | sed 's/^/  /'
            fi
          done

          # 5. Check example test results
          for ex_log in amd_smi_drm_ex.log amd_smi_nodrm_ex.log; do
            FULL="$RESULTS_DIR/$ex_log"
            [ -f "$FULL" ] || continue
            if grep -qiE "segfault|SIGSEGV|abort" "$FULL" 2>/dev/null; then
              EX_NAME="${ex_log%.log}"
              FAILURES+=("Example $EX_NAME")
              FULL_LOG=$(cat "$FULL")
              DETAILS+=$'\n'"#### Example ${EX_NAME}"$'\n\n'"\`\`\`"$'\n'"${FULL_LOG}"$'\n'"\`\`\`"$'\n'
              echo "Example $EX_NAME: errors detected"
            fi
          done

          # Write GitHub Actions Job Summary
          {
            if [ ${#FAILURES[@]} -gt 0 ]; then
              echo "## :x: CI Failed — ${{ matrix.os }}"
              echo ""
              echo "**${#FAILURES[@]} failure(s) detected:**"
              echo ""
              for f in "${FAILURES[@]}"; do
                echo "- :red_circle: ${f}"
              done
              echo "$DETAILS"
            else
              echo "## :white_check_mark: CI Passed — ${{ matrix.os }}"
              echo ""
              echo "All stages and tests passed successfully."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#FAILURES[@]} -gt 0 ]; then
            echo ""
            echo "::error::${#FAILURES[@]} failure(s) for ${{ matrix.os }}: ${FAILURES[*]}"
          else
            echo "All stages and tests PASSED for ${{ matrix.os }}"
          fi
