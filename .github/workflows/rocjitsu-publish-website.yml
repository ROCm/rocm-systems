# Publish the Rocjitsu dashboard from develop.
# A change under emulation/rocjitsu/website/dashboard/ replaces gh-pages/rocjitsu-dashboard/.

name: "rocjitsu-publish-website"

on:
  push:
    branches:
      - develop
    paths:
      - "emulation/rocjitsu/website/dashboard/**"
      - ".github/workflows/rocjitsu-publish-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rocjitsu-publish-website
  cancel-in-progress: false

jobs:
  publish:
    name: Publish rocjitsu dashboard
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: emulation/rocjitsu/website/dashboard/package-lock.json

      - name: Verify and build rocjitsu dashboard
        working-directory: emulation/rocjitsu/website/dashboard
        run: |
          npm ci
          npm run test:e2e:install
          npm run verify

      - name: Generate publishing token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish rocjitsu dashboard
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          # GITHUB_TOKEN pushes do not trigger branch-based Pages builds.
          github_token: ${{ steps.app-token.outputs.token }}
          publish_branch: gh-pages
          publish_dir: ./emulation/rocjitsu/website/dashboard/dist
          destination_dir: rocjitsu-dashboard
          commit_message: "Publish rocjitsu dashboard"
          # Skip the default root .nojekyll file so only rocjitsu-dashboard changes.
          enable_jekyll: true
