name: rocprofiler-systems RedHat Linux (GCC, Python, ROCm)
run-name: redhat

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/rocprofiler-systems-redhat.yml'
      - 'projects/rocprofiler-systems/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-systems/docs/**'
      - '!projects/rocprofiler-systems/source/docs/**'
      - '!projects/rocprofiler-systems/source/python/gui/**'
      - '!projects/rocprofiler-systems/docker/**'
  pull_request:
    paths:
      - '.github/workflows/rocprofiler-systems-redhat.yml'
      - 'projects/rocprofiler-systems/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-systems/docs/**'
      - '!projects/rocprofiler-systems/source/docs/**'
      - '!projects/rocprofiler-systems/source/python/gui/**'
      - '!projects/rocprofiler-systems/docker/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROCPROFSYS_CI: ON
  ROCPROFSYS_TMPDIR: "%env{PWD}%/testing-tmp"
  ROCPROFSYS_KEEP_TEST_OUTPUT: '0'
  OMPI_ALLOW_RUN_AS_ROOT: 1
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
  ROCPROFSYS_MAX_THREADS: '64'
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  rhel:
    runs-on: ubuntu-latest
    container:
      image: dgaliffiamd/rocprofiler-systems:ci-rocm-${{ matrix.rocm-version }}-rhel-${{ matrix.os-release }}
      options: --shm-size=512m

    strategy:
      fail-fast: false
      matrix:
        compiler: ['g++']
        os-release: ['8.10', '9', '10']
        rocm-version: ['6.3', '6.4', '7.0', '7.1', '7.2']
        exclude:
          - os-release: '10'
            rocm-version: '6.3'
          - os-release: '10'
            rocm-version: '6.4'
          - os-release: '10'
            rocm-version: '7.0'

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            projects/rocprofiler-systems/
            .github/actions/
            .gitmodules

      - name: Configure environment
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          echo "CC=$(echo '${{ matrix.compiler }}' | sed 's/+/c/g')" >> $GITHUB_ENV
          echo "CXX=${{ matrix.compiler }}" >> $GITHUB_ENV
          echo "OS_VERSION_MAJOR=$(. /etc/os-release; echo "${VERSION_ID}" | cut -d. -f1)" >> $GITHUB_ENV
          echo "/opt/rocm/bin" >> $GITHUB_PATH
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Install packages
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          if [ $OS_VERSION_MAJOR -eq 8 ]; then
            wget https://commondatastorage.googleapis.com/perfetto-luci-artifacts/v47.0/linux-amd64/trace_processor_shell \
              -P /opt/trace_processor/bin
            chmod +x /opt/trace_processor/bin/trace_processor_shell
            # Set env var so validate_perfetto_trace() uses the downloaded binary
            echo "ROCPROFSYS_TRACE_PROC_SHELL=/opt/trace_processor/bin/trace_processor_shell" >> $GITHUB_ENV
          fi
          if [ $OS_VERSION_MAJOR -eq 10 ]; then
            # TODO: Move package install to the docker.
            dnf install -y --enablerepo=crb mpich mpich-devel
            echo "/usr/lib64/mpich/bin" >> $GITHUB_PATH
          fi

      - uses: ./.github/actions/rocprofiler-systems-ccache
        with:
          cache-key: ccache-redhat-${{ github.job }}-${{ matrix.os-release }}-${{ matrix.compiler }}-${{ matrix.rocm-version }}

      - name: Configure
        timeout-minutes: 10
        uses: ./.github/actions/rocprofiler-systems-configure
        with:
          cmake-flags: >-
            -DCMAKE_C_COMPILER=${{ env.CC }}
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
            -DCMAKE_INSTALL_PREFIX=/opt/rocprofiler-systems
            -DROCPROFSYS_USE_MPI=OFF
            -DROCPROFSYS_USE_OMPT=OFF
            -DROCPROFSYS_USE_PYTHON=ON
            -DROCPROFSYS_BUILD_DYNINST=ON
            -DROCPROFSYS_BUILD_BOOST=ON
            -DROCPROFSYS_BUILD_TBB=ON
            -DROCPROFSYS_BUILD_ELFUTILS=ON
            -DROCPROFSYS_BUILD_LIBIBERTY=ON
            -DROCPROFSYS_CI_MPI_RUN_AS_ROOT=ON
            -DROCPROFSYS_INSTALL_PERFETTO_TOOLS=OFF
            -DROCPROFSYS_PYTHON_PREFIX=/opt/conda/envs
            -DROCPROFSYS_PYTHON_ENVS="py3.8;py3.9;py3.10;py3.11"
            -DROCPROFSYS_DISABLE_EXAMPLES="transpose;rccl;openmp-target;openmp-vv-offload"

      - name: Build
        timeout-minutes: 40
        uses: ./.github/actions/rocprofiler-systems-build

      - name: Test
        timeout-minutes: 60
        uses: ./.github/actions/rocprofiler-systems-test
        with:
          cdash-build-name: >-
            ${{ github.repository_owner }}-${{ github.ref_name }}-rhel-${{ matrix.os-release }}-${{ matrix.compiler }}-python-mpip-rocm-${{ matrix.rocm-version }}

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s -v || true

      - name: Check for leftover buffered files
        uses: ./.github/actions/rocprofiler-systems-check-leftover

      - name: Post-build
        timeout-minutes: 25
        uses: ./.github/actions/rocprofiler-systems-post-build
        with:
          skip-cpack: "true"
          use-modulefile: "false"
          # System python on RHEL 8 is 3.6, which does not work with test suite
          python-executable: /opt/conda/envs/py3.8/bin/python

      # trace_processor_shell daemonizes during tests; clean it up explicitly.
      - name: Kill Perfetto
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          RUNNING_PROCS=$(pgrep trace_processor_shell || true)
          if [ -n "${RUNNING_PROCS}" ]; then kill -9 ${RUNNING_PROCS}; fi

      - uses: ./.github/actions/rocprofiler-systems-artifacts

  rhel-system-deps:
    runs-on: ubuntu-latest
    container:
      image: dgaliffiamd/rocprofiler-systems:ci-rocm-7.2-rhel-${{ matrix.os-release }}
      options: --shm-size=512m

    strategy:
      fail-fast: false
      matrix:
        # RHEL 8.10's system TBB (2018.2) is older than the effective
        # minimum (2018.6) required by the oneTBB targets
        os-release: ['9', '10']
        compiler: ['g++', 'amdclang++']
        include:
          - compiler: 'g++'
            cc: 'gcc'
            use-clang-omp: 'OFF'
          - compiler: 'amdclang++'
            cc: 'amdclang'
            use-clang-omp: 'ON'

    env:
      ROCPROFSYS_MAX_THREADS: '64'

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            projects/rocprofiler-systems/
            .github/actions/
            .gitmodules

      - name: Configure environment
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.compiler }}" >> $GITHUB_ENV
          echo "OS_VERSION_MAJOR=$(. /etc/os-release; echo "${VERSION_ID}" | cut -d. -f1)" >> $GITHUB_ENV
          echo "/opt/rocm/bin" >> $GITHUB_PATH
          echo "/opt/rocm/llvm/bin" >> $GITHUB_PATH
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Install packages
        shell: bash
        run: |
          if [ $OS_VERSION_MAJOR -eq 10 ]; then
            # TODO: Move package install to the docker.
            dnf install -y --enablerepo=crb mpich mpich-devel
            echo "/usr/lib64/mpich/bin" >> $GITHUB_PATH
          fi

      - name: Install system dependency packages
        timeout-minutes: 25
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 #v4.0.0
        with:
          retry_wait_seconds: 30
          timeout_minutes: 25
          max_attempts: 5
          shell: bash
          command: |
            # System TBB (ROCPROFSYS_BUILD_TBB=OFF) lives in CodeReady Builder (crb)
            # on RHEL 9/10; binutils-devel provides libiberty/BFD
            # (ROCPROFSYS_BUILD_LIBIBERTY=OFF). elfutils (libdw/libelf) is already
            # present in the base image.
            dnf install -y --enablerepo=crb tbb-devel
            dnf install -y binutils-devel
            dnf clean all

      - uses: ./.github/actions/rocprofiler-systems-ccache
        with:
          cache-key: ccache-redhat-system-deps-${{ github.job }}-${{ matrix.os-release }}-${{ matrix.compiler }}

      - name: Install Python test dependencies
        timeout-minutes: 10
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          for env_dir in /opt/conda/envs/py3.{8,9,10,11,12,13}/; do
            if [ -d "${env_dir}" ] && [ -x "${env_dir}bin/python3" ]; then
              "${env_dir}bin/python3" -m pip install -r requirements.txt
            fi
          done

      - name: Configure
        timeout-minutes: 10
        uses: ./.github/actions/rocprofiler-systems-configure
        with:
          cmake-flags: >-
            -DCMAKE_C_COMPILER=${{ matrix.cc }}
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
            -DCMAKE_INSTALL_PREFIX=/opt/rocprofiler-systems
            -DROCPROFSYS_USE_PYTHON=ON
            -DROCPROFSYS_USE_MPI_HEADERS=ON
            -DROCPROFSYS_CI_MPI_RUN_AS_ROOT=ON
            -DROCPROFSYS_BUILD_DYNINST=ON
            -DROCPROFSYS_BUILD_TBB=OFF
            -DROCPROFSYS_BUILD_ELFUTILS=OFF
            -DROCPROFSYS_BUILD_LIBIBERTY=OFF
            -DROCPROFSYS_BUILD_HIDDEN_VISIBILITY=ON
            -DROCPROFSYS_PYTHON_PREFIX=/opt/conda/envs
            -DROCPROFSYS_PYTHON_ENVS="py3.8;py3.9;py3.10;py3.11;py3.12;py3.13"
            -DROCPROFSYS_STRIP_LIBRARIES=OFF
            -DROCPROFSYS_DISABLE_EXAMPLES="transpose;rccl;openmp-target;openmp-vv;videodecode;jpegdecode;network"
            -DUSE_CLANG_OMP=${{ matrix.use-clang-omp }}

      - name: Build
        timeout-minutes: 40
        uses: ./.github/actions/rocprofiler-systems-build

      - name: Test
        timeout-minutes: 60
        uses: ./.github/actions/rocprofiler-systems-test
        with:
          cdash-build-name: >-
            ${{ github.repository_owner }}-${{ github.ref_name }}-rhel-${{ matrix.os-release }}-system-deps-${{ matrix.compiler }}

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s -v || true

      - name: Check for leftover buffered files
        uses: ./.github/actions/rocprofiler-systems-check-leftover

      - name: Post-build
        timeout-minutes: 25
        uses: ./.github/actions/rocprofiler-systems-post-build
        with:
          skip-cpack: "true"
          use-modulefile: "false"
          python-executable: /opt/conda/envs/py3.8/bin/python

      # trace_processor_shell daemonizes during tests; clean it up explicitly.
      - name: Kill Perfetto
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          RUNNING_PROCS=$(pgrep trace_processor_shell || true)
          if [ -n "${RUNNING_PROCS}" ]; then kill -9 ${RUNNING_PROCS}; fi

      - uses: ./.github/actions/rocprofiler-systems-artifacts
