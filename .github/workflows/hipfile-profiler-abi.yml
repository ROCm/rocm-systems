name: hipfile-profiler-abi
run-name: Verify hipFile dispatch-table ABI against rocprofiler-sdk

# Compile-only guard that catches hipFile dispatch-table ABI changes that would
# break the rocprofiler-sdk profiler build post-merge. The profiler re-enforces
# hipFile's ABI with its own static_asserts (projects/rocprofiler-sdk/.../hipfile/abi.cpp);
# this job compiles those asserts against hipFile's REAL headers so a forgotten
# version bump fails at hipFile PR time instead of after the merge into TheRock.
#
# This is the ONLY hipFile job that checks out projects/rocprofiler-sdk. It is
# kept separate from the main build jobs so their working trees stay pure
# hipFile.

env:
  AIS_INPUT_CI_IMAGE: ${{ inputs.ci_image }}

on:
  workflow_call:
    inputs:
      ci_image:
        description: "Full CI image name & tag"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  profiler_abi:
    name: profiler ABI compile check
    runs-on: [ubuntu-24.04]
    steps:
      - name: Set AIS CI container name
        # On non-pull_request triggering workflows, AIS_PR_NUMBER may be empty.
        run: |
          echo "AIS_PR_NUMBER=$(echo "${GITHUB_REF}" | sed 's|[^0-9]||g')" >> "${GITHUB_ENV}"
      - name: Compute container name
        run: |
          echo "AIS_CONTAINER_NAME=${AIS_PR_NUMBER:=${GITHUB_RUN_ID}}_${GITHUB_JOB}_profiler_abi" >> "${GITHUB_ENV}"
      - name: Fetching code repository...
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rocm-systems
          # This job needs the profiler source in addition to hipFile so it can
          # compile the profiler's ABI asserts against hipFile's real headers.
          sparse-checkout: |
            projects/hipfile
            projects/rocprofiler-sdk
            .github/workflows
      - name: Authenticating to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Starting Docker Container
        run: |
          docker run \
            -dt \
            --rm \
            --pull always \
            -v ${GITHUB_WORKSPACE}:/mnt/ais:ro \
            --name "${AIS_CONTAINER_NAME}" \
            "${AIS_INPUT_CI_IMAGE}"
      - name: Compile profiler ABI checks against hipFile headers
        run: |
          docker exec \
            -t \
            "${AIS_CONTAINER_NAME}" \
            /bin/bash -c '
              CXX=amdclang++ \
                /mnt/ais/rocm-systems/projects/hipfile/util/check-profiler-abi.sh \
                /mnt/ais/rocm-systems
            '
      - name: Cleanup & Stop the Docker container
        if: ${{ always() }}
        run: |
          if docker inspect "${AIS_CONTAINER_NAME}" >/dev/null 2>&1; then
            docker stop "${AIS_CONTAINER_NAME}"
          else
            echo "Container ${AIS_CONTAINER_NAME} does not exist; skipping stop"
          fi
