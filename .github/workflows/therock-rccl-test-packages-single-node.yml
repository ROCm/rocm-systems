name: TheRock Test Packages single-node for rccl

on:
  workflow_call:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
      artifact_run_id:
        type: string
  workflow_dispatch:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
      artifact_run_id:
        type: string

permissions:
  contents: read

jobs:
  test_rccl_single_node:
    name: 'Test single-node'
    runs-on: ${{ inputs.test_runs_on }}
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 110
        --group-add 993
        --group-add 992
        --ulimit memlock=-1:-1
        --security-opt seccomp=unconfined
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        --user 0:0
    defaults:
      run:
        shell: bash
    env:
      VENV_DIR: ${{ github.workspace }}/.venv
      ARTIFACT_RUN_ID: "${{ inputs.artifact_run_id }}"
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "ROCm/TheRock"
          # TODO(rocm-systems#6439): revert to pinned commit
          # (was 685f8c3b89006309b34a7c16de17e841400f0d76, 2026-05-29) before
          # merging. Temporarily testing against TheRock branch
          # users/dravindr/tr_rccl2 which carries the matching
          # artifact-rccl.toml change (TheRock#5469) that ships bin/rccl/**
          # so build/bin/rccl/CTestTestfile.cmake is available to
          # test_runner.py.
          ref: users/dravindr/tr_rccl2

      - name: Run setup test environment workflow
        uses: './.github/actions/setup_test_environment'
        with:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
          AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
          ARTIFACT_GROUP: ${{ inputs.artifact_group }}
          OUTPUT_ARTIFACTS_DIR: ${{ env.OUTPUT_ARTIFACTS_DIR }}
          VENV_DIR: ${{ env.VENV_DIR }}
          FETCH_ARTIFACT_ARGS: "--rccl --tests"
          IS_PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}

      - name: Test
        timeout-minutes: 15
        # Drive rccl single-node tier via shared test_runner.py
        # (rocm-systems#6439 + TheRock#5469). rocm-systems#4573 installs
        # tier + arch-exclude labels into bin/rccl/CTestTestfile.cmake, so
        # `ctest -L <tier>` is the right surface. The legacy
        # `-k "not test_rccl_correctness_tests"` filter is dropped: the
        # rccl-tests perf binaries live in a separate artifact and aren't
        # CTests under bin/rccl/, so MPI-on-mi325 cannot trigger here.
        env:
          TEST_COMPONENT: rccl
          TEST_TYPE: quick
          AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
        run: |
          python ./build_tools/github_actions/test_executable_scripts/test_runner.py
