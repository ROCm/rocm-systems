# HRR GPU suite: build an amdhip64 with HRR capture compiled in, then run the
# HRR capture/replay integration suite on each requested GPU family.
#
# Called by hrr-ci.yml, which decides when this runs and on which families.
#
# Interim: the build job and projects/hrr/tests/scripts/hrr_capture_build.py
# rebuild CLR with capture enabled on top of TheRock release artifacts. They
# stay until TheRock can build and run the HRR integration suite. Defining the
# hrr-capture variant is not enough: nothing selects it, and it does not
# install the test binaries.

name: HRR GPU

on:
  workflow_call:
    inputs:
      families:
        description: JSON list of {family, runner, backend, arch, config} from hrr_ci_configure.py
        type: string
        required: true
      simulator_families:
        description: Simulator rows from that list. [] skips the rocJitsu jobs.
        type: string
        default: "[]"
      gpu_families:
        description: Real-GPU rows from that list. [] skips the GPU jobs.
        type: string
        default: "[]"
      ignore_test_config:
        description: Run the cases the suite config skips
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build capture-enabled HIP and HRR
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:cf4f6d9909056906e4a1c0bc4c245658a0af4c6a6174082a86adfa2d518b7aeb # 2026-08-18
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            projects/clr
            projects/hip
            projects/hrr

      - name: Checkout TheRock artifact tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: ROCm/TheRock
          # Keep in sync with the TheRock ref in therock-multi-arch-ci.yml.
          ref: 488e66e7c2220df926c2762e9b97a50becfb4239 # 2026-10-21
          path: therock
          sparse-checkout: |
            build_tools
            cmake/therock_amdgpu_targets.cmake
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Install TheRock Python requirements
        run: python3 -m pip install --no-cache-dir -r therock/requirements.txt

      - name: Install base ROCm artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 projects/hrr/tests/scripts/hrr_capture_build.py fetch-base

      # No cache restore: a cache hit left librocm_kpack.so.0 out of the tree and
      # Verify failed. Off until that failure is understood, so the build always
      # runs. The `cache-key` and `stage` commands of hrr_capture_build.py are
      # the pieces to reuse.
      - name: Build
        run: python3 projects/hrr/tests/scripts/hrr_capture_build.py build

      - name: Verify
        run: python3 projects/hrr/tests/scripts/hrr_capture_build.py verify

      - name: Upload base build record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hrr-base-${{ github.run_id }}
          path: build/base.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hrr-capture-${{ github.run_id }}
          path: |
            build/base.json
            build/capture-lib/
            build/hrr/playback/hrr-playback
            build/hrr/tests/integration/hrr-integration-tests
            build/hrr/tests/integration/*.so
          if-no-files-found: error
          retention-days: 7

  # rocJitsu has no family or architecture argument: every simulator job would
  # build the same binary, so build it once here. The simulator jobs download
  # it from the artifact. The launcher is tools/rocjitsu/rocjitsu and finds
  # librocjitsu.so at ../../ from its own path, so the tarball keeps the build/rocjitsu layout, and tar keeps the
  # exec bit that upload-artifact would drop.
  rocjitsu-build:
    name: Build rocJitsu
    if: inputs.simulator_families != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            emulation/rocjitsu
            runtimes/api-headers
            shared/machine-readable-isa

      - name: Checkout TheRock artifact tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: ROCm/TheRock
          ref: 488e66e7c2220df926c2762e9b97a50becfb4239 # 2026-10-21
          path: therock
          sparse-checkout: |
            build_tools
            cmake/therock_amdgpu_targets.cmake
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Install rocJitsu build packages
        shell: bash
        run: |
          set -euo pipefail
          sudo -n apt-get update
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang libdrm-dev ninja-build

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Python requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/hrr-venv"
          "${RUNNER_TEMP}/hrr-venv/bin/python" -m pip install --no-cache-dir \
            -r therock/requirements.txt 'cmake==3.31.10' 'PyYAML==6.0.2'
          echo "${RUNNER_TEMP}/hrr-venv/bin" >> "${GITHUB_PATH}"

      - name: Build rocJitsu
        shell: bash
        run: |
          set -euo pipefail
          cmake -S emulation/rocjitsu -B build/rocjitsu -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rocjitsu --target rocjitsu_bin rocjitsu_shared -j

      - name: Package rocJitsu
        shell: bash
        run: |
          set -euo pipefail
          # The glob must expand inside build/rocjitsu, so cd there. tar keeps
          # symlinks, so a versioned librocjitsu.so chain survives.
          ls -l build/rocjitsu/tools/rocjitsu/rocjitsu build/rocjitsu/librocjitsu.so*
          (cd build/rocjitsu && tar -cf "${GITHUB_WORKSPACE}/rocjitsu.tar" tools/rocjitsu/rocjitsu librocjitsu.so*)
          tar -tvf rocjitsu.tar

      - name: Upload rocJitsu
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rocjitsu-${{ github.run_id }}
          path: rocjitsu.tar
          if-no-files-found: error
          retention-days: 7

  simulator:
    name: rocJitsu (${{ matrix.family }})
    needs: [build, rocjitsu-build]
    if: inputs.simulator_families != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.simulator_families) }}
    # The same image as the real-GPU job, without devices. The build job's
    # workspace path is this container's workspace, so the paths compiled into
    # the test binaries resolve without a symlink on the runner.
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --user 0:0
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            emulation/rocjitsu/configs
            projects/hrr/tests

      - name: Checkout TheRock artifact tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: ROCm/TheRock
          ref: 488e66e7c2220df926c2762e9b97a50becfb4239 # 2026-10-21
          path: therock
          sparse-checkout: |
            build_tools
            cmake/therock_amdgpu_targets.cmake
            requirements.txt
          sparse-checkout-cone-mode: false

      # The prebuilt rocJitsu and the capture-enabled amdhip64 load libdrm at run
      # time. The container runs as root, so this does not use sudo.
      - name: Install libdrm
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libdrm2 libdrm-amdgpu1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Python requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/hrr-venv"
          "${RUNNER_TEMP}/hrr-venv/bin/python" -m pip install --no-cache-dir \
            -r therock/requirements.txt 'PyYAML==6.0.2'
          echo "${RUNNER_TEMP}/hrr-venv/bin" >> "${GITHUB_PATH}"

      - name: Download rocJitsu
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rocjitsu-${{ github.run_id }}
          path: rocjitsu-artifact

      - name: Unpack rocJitsu
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rocjitsu
          tar -C build/rocjitsu -xf rocjitsu-artifact/rocjitsu.tar
          ls -l build/rocjitsu/tools/rocjitsu build/rocjitsu/librocjitsu.so*
          echo "${GITHUB_WORKSPACE}/build/rocjitsu/tools/rocjitsu" >> "${GITHUB_PATH}"

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrr-capture-${{ github.run_id }}
          path: build

      - name: Install base ROCm artifacts and the capture-enabled amdhip64
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python projects/hrr/tests/scripts/hrr_capture_build.py install-base

      - name: Run integration suite
        env:
          FAMILY: ${{ matrix.family }}
          ARCH: ${{ matrix.arch }}
          # The config path stays data. The shell does not assemble the command.
          # Local mode: the simulator runs inside each process. Daemon mode
          # (rocjitsu --daemon) fails hipMemCreate and hangs gfx90a replay.
          LAUNCHER: ${{ format('rocjitsu --config {0} --', matrix.config) }}
          HRR_TEST_IGNORE_CONFIG: ${{ inputs.ignore_test_config && '1' || '' }}
        shell: bash
        run: >-
          python projects/hrr/tests/scripts/run_catch2.py
          --xml "integration-${FAMILY}.xml"
          --timeout 1200
          --config projects/hrr/tests/config/integration.yaml
          --os linux --arch "${ARCH}"
          --launcher "${LAUNCHER}"
          -- build/hrr/tests/integration/hrr-integration-tests

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-integration-${{ matrix.family }}
          path: integration-${{ matrix.family }}.xml
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Integration (${{ matrix.family }})
    needs: build
    if: inputs.gpu_families != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.gpu_families) }}
    # The image and options TheRock's test_component.yml uses for GPU tests.
    # Running in a container also gives this job the build job's workspace
    # path, which the test binaries have compiled in.
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: >-
        --ipc host
        --user 0:0
        --ulimit memlock=-1:-1
        --ulimit nofile=1048576:1048576
        --security-opt seccomp=unconfined
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e ROCR_VISIBLE_DEVICES
        -e KUBE_CPU_REQUEST
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            projects/hrr/tests/config
            projects/hrr/tests/scripts

      - name: Checkout TheRock artifact tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: ROCm/TheRock
          ref: 488e66e7c2220df926c2762e9b97a50becfb4239 # 2026-10-21
          path: therock
          sparse-checkout: |
            build_tools
            cmake/therock_amdgpu_targets.cmake
            requirements.txt
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # Install into a virtualenv under RUNNER_TEMP, which is removed when the
      # job ends. A bare "python -m pip install" writes into setup-python's
      # interpreter under _work/_tool on the runner's host, which the next job
      # on the same machine reuses. Later steps pick the venv up from PATH.
      - name: Install Python requirements
        run: |
          python -m venv "${RUNNER_TEMP}/hrr-venv"
          "${RUNNER_TEMP}/hrr-venv/bin/python" -m pip install --no-cache-dir -r therock/requirements.txt
          echo "${RUNNER_TEMP}/hrr-venv/bin" >> "${GITHUB_PATH}"

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hrr-capture-${{ github.run_id }}
          path: build

      - name: Install base ROCm artifacts and the capture-enabled amdhip64
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python projects/hrr/tests/scripts/hrr_capture_build.py install-base

      - name: Run integration suite
        env:
          FAMILY: ${{ matrix.family }}
          HRR_TEST_IGNORE_CONFIG: ${{ inputs.ignore_test_config && '1' || '' }}
          # A regions case faults the GPU on purpose; without this ROCr writes a
          # gpucore file of about 160 MB into the workspace.
          HSA_DISABLE_COREDUMP_ON_EXCEPTION: "1"
        # --arch auto finds this machine's GPU with the installed rocminfo.
        # github.workspace is the runner's host path, which a container need
        # not have; GITHUB_WORKSPACE is the path inside the container.
        run: >-
          ROCM_SDK="${GITHUB_WORKSPACE}/dist"
          python projects/hrr/tests/scripts/run_catch2.py
          --xml "integration-${FAMILY}.xml"
          --timeout 1200
          --config projects/hrr/tests/config/integration.yaml
          --os linux --arch auto
          -- build/hrr/tests/integration/hrr-integration-tests

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-integration-${{ matrix.family }}
          path: integration-${{ matrix.family }}.xml
          if-no-files-found: ignore
          retention-days: 7
