# DEPRECATED: retained solely for media-libs-ci.yml.
#
# This was a shared component-test workflow for TheRock single-arch CI, which
# was removed in b7ae4f90d3a. Its only remaining caller is
# therock-media-test-packages.yml, itself reachable only from media-libs-ci.yml.
#
# Do not add new callers. Slated for removal once media libs CI moves to
# TheRock's multi-arch pipeline (therock-multi-arch-ci.yml).

name: Test component

on:
  workflow_call:
    inputs:
      artifact_run_id:
        type: string
        default: ""
      amdgpu_families:
        type: string
      test_runs_on:
        type: string
      platform:
        type: string
      component:
        type: string
      default_container_image:
        type: string
        default: "ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98"
      aws_role_to_assume:
        # IAM role assumed before the test step, for components whose test
        # script needs AWS access. Empty by default, which skips the credential
        # step entirely.
        type: string
        default: ""
      aws_region:
        type: string
        default: "us-east-1"


permissions:
  contents: read

jobs:
  test_component:
    name: >-
      Test ${{ fromJSON(inputs.component).job_name }}
      (shard ${{ matrix.shard }} of ${{ fromJSON(inputs.component).total_shards }})
      ${{ fromJSON(inputs.component).expect_failure == true && '(xfail)' || '' }}
    runs-on: ${{ inputs.test_runs_on }}
    continue-on-error: ${{ fromJSON(inputs.component).expect_failure == true }}
    permissions:
      contents: read
      # Used only by the credential step below, i.e. only when the caller passes
      # aws_role_to_assume. One job serves every component, so the permission is
      # declared unconditionally and EVERY caller has to grant it: permissions
      # can be maintained or reduced through a reusable-workflow chain, never
      # elevated, so a caller that withholds it makes this file fail to start.
      id-token: write
    container:
      # If the component has specified an alternate image, honor that option.
      # Otherwise use the default image.
      image: >-
        ${{ inputs.platform == 'linux' &&
            (fromJSON(inputs.component).container_image || inputs.default_container_image)
            || null
        }}
      # Container options are configured by TheRock's
      # build_tools/github_actions/fetch_test_configurations.py.
      options: ${{ fromJSON(inputs.component).container_options }}
    strategy:
      fail-fast: false
      matrix:
        # The shard array is based on "total_shards" from "fetch_test_configurations.py"
        # The test executable will shard based on the array. (ex: [1, 2, 3, 4] = four test shards)
        shard: ${{ fromJSON(inputs.component).shard_arr }}
    defaults:
      run:
        shell: bash
    env:
      VENV_DIR: ${{ github.workspace }}/.venv
      ARTIFACT_RUN_ID: "${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}"
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
    steps:
      - name: "Fetch 'build_tools' from repository"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: "ROCm/TheRock"
          ref: ca768a2d07f0166d586de37b5460edca63512b24 # 2026-11-27
          sparse-checkout: build_tools
          path: "prejob"

      - name: Pre-job cleanup processes on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: . '${{ github.workspace }}\prejob\build_tools\github_actions\cleanup_processes.ps1'

      - name: Pre-job cleanup GPU processes on Linux
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 5
        run: bash ./prejob/build_tools/github_actions/cleanup_processes.sh

      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: "ROCm/TheRock"
          ref: ca768a2d07f0166d586de37b5460edca63512b24 # 2026-11-27

      - name: Run setup test environment workflow
        uses: './.github/actions/setup_test_environment'
        with:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
          ARTIFACT_GROUP: ${{ inputs.amdgpu_families }}
          OUTPUT_ARTIFACTS_DIR: ${{ env.OUTPUT_ARTIFACTS_DIR }}
          VENV_DIR: ${{ env.VENV_DIR }}
          FETCH_ARTIFACT_ARGS: ${{ fromJSON(inputs.component).fetch_artifact_args }}
          IS_PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}

      - name: Driver / GPU sanity check
        if: ${{ !fromJSON(inputs.component).linux_cpu_runner }}
        timeout-minutes: 3
        run: |
          python ./build_tools/print_driver_gpu_info.py

      - name: Setup Additional Requirements
        if: ${{ fromJSON(inputs.component).additional_requirements_files != '' }}
        run: |
          python ./build_tools/install_additional_requirements.py \
          --requirements-files=${{ join(fromJSON(inputs.component).additional_requirements_files, ',') }}

      - name: Set thread limits
        if: ${{ runner.os == 'Linux' }}
        run: |
          if [[ -n "${KUBE_CPU_REQUEST:-}" ]]; then
            CPU_COUNT="${KUBE_CPU_REQUEST%.*}"
            echo "OPENBLAS_NUM_THREADS=${CPU_COUNT}" >> $GITHUB_ENV
            echo "OMP_NUM_THREADS=${CPU_COUNT}" >> $GITHUB_ENV
            echo "Thread limits set: OPENBLAS_NUM_THREADS=${CPU_COUNT}, OMP_NUM_THREADS=${CPU_COUNT} (from KUBE_CPU_REQUEST=${KUBE_CPU_REQUEST})"
          else
            echo "KUBE_CPU_REQUEST not set, thread limits not configured"
          fi

      # Last step before the test, so the whole session lifetime is available to
      # it. Skipped for pull requests from forks, where the rocDecode
      # conformance sweep prints a skip banner and exits 0.
      - name: Configure AWS credentials
        if: ${{ inputs.aws_role_to_assume != '' && !github.event.pull_request.head.repo.fork }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.aws_role_to_assume }}

      - name: Test
        timeout-minutes: ${{ fromJSON(inputs.component).timeout_minutes }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ fromJSON(inputs.component).total_shards }}
          TEST_TYPE: ${{ fromJSON(inputs.component).test_type }}
          TEST_COMPONENT: ${{ fromJSON(inputs.component).job_name }}
          # Windows hip-tests (PAL=1, ROCR=0) set this via matrix; other
          # components leave it empty. See: https://github.com/ROCm/TheRock/issues/3587
          GPU_ENABLE_PAL: ${{ fromJSON(inputs.component).gpu_enable_pal }}
        run: |
          if [[ "${{ inputs.amdgpu_families }}" == "gfx125X-dcgpu" ]]; then
            python ./build_tools/memory_monitor.py --phase "Test ${{ fromJSON(inputs.component).job_name }}" -- \
              bash -c '${{ fromJSON(inputs.component).test_script }}'
          else
            ${{ fromJSON(inputs.component).test_script }}
          fi

      # GitHub's 'Complete job' step is unaware of launched executables
      # and will fail to clean up orphan processes.
      - name: Post-job cleanup processes on Windows
        if: ${{ always() && runner.os == 'Windows' }}
        shell: powershell
        run: . '${{ github.workspace }}\build_tools\github_actions\cleanup_processes.ps1'

      - name: Post-job cleanup GPU processes on Linux
        if: ${{ always() && runner.os == 'Linux' }}
        timeout-minutes: 5
        run: bash ./build_tools/github_actions/cleanup_processes.sh
