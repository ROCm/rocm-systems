name: "rocjitsu-website"

on:
  pull_request:
    paths:
      - "emulation/rocjitsu/website/dashboard/**"
      - ".github/workflows/rocjitsu-website-test.yml"
      - ".github/workflows/rocjitsu-publish-website.yml"
      - ".github/workflows/rocjitsu-benchmarks.yml"
  push:
    branches:
      - develop
    paths:
      - "emulation/rocjitsu/website/dashboard/**"
      - ".github/workflows/rocjitsu-website-test.yml"
      - ".github/workflows/rocjitsu-publish-website.yml"
      - ".github/workflows/rocjitsu-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-data:
    name: Verify dashboard data tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: emulation/rocjitsu/website/dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: emulation/rocjitsu/website/dashboard/scripts/dashboard-data/requirements-test.txt

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bash git jq

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"

      - name: Install Python test dependencies
        run: python -m pip install -r scripts/dashboard-data/requirements-test.txt

      - name: Test dashboard data tools
        run: python -m pytest scripts/dashboard-data/tests

  verify:
    name: Verify website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: emulation/rocjitsu/website/dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: emulation/rocjitsu/website/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Verify website
        run: npm run verify

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: rocjitsu-website-playwright-results
          path: |
            emulation/rocjitsu/website/dashboard/test-results
            emulation/rocjitsu/website/dashboard/playwright-report
          if-no-files-found: ignore
          retention-days: 7
