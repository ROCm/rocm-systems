name: "rocjitsu-website"

on:
  pull_request:
    paths:
      - "emulation/rocjitsu/website/**"
      - ".github/workflows/rocjitsu-website-test.yml"
  push:
    branches:
      - develop
    paths:
      - "emulation/rocjitsu/website/**"
      - ".github/workflows/rocjitsu-website-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: emulation/rocjitsu/website
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: emulation/rocjitsu/website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Smoke test production hosting and caching
        run: npm run test:e2e:production

      - name: Run chart race tests
        run: npm run test:e2e:chart-race

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rocjitsu-website-playwright-results
          path: |
            emulation/rocjitsu/website/test-results
            emulation/rocjitsu/website/playwright-report
          if-no-files-found: ignore
          retention-days: 7
