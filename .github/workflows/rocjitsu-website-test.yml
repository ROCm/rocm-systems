name: "rocjitsu-website"

on:
  pull_request:
    paths:
      - "emulation/rocjitsu/website/dashboard/**"
      - ".github/workflows/rocjitsu-website-test.yml"
      - ".github/workflows/rocjitsu-publish-website.yml"
  push:
    branches:
      - develop
    paths:
      - "emulation/rocjitsu/website/dashboard/**"
      - ".github/workflows/rocjitsu-website-test.yml"
      - ".github/workflows/rocjitsu-publish-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publisher:
    name: Test dashboard publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: emulation/rocjitsu/website/dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install publisher test dependencies
        run: python -m pip install pytest pytest-xdist

      - name: Run publisher tests
        run: python -m pytest -q tests/python -n "$(nproc)"

  verify:
    name: Verify website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: emulation/rocjitsu/website/dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: emulation/rocjitsu/website/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Verify website
        run: npm run verify

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: rocjitsu-website-playwright-results
          path: |
            emulation/rocjitsu/website/dashboard/test-results
            emulation/rocjitsu/website/dashboard/playwright-report
          if-no-files-found: ignore
          retention-days: 7
