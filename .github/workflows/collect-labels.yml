name: Collect Labels

on:
  workflow_dispatch:
    inputs:
      repoListFile:
        description: 'Path to JSON file with repo list'
        required: true
        default: '.github/repos-config.json'

permissions:
  contents: read

jobs:
  collect-labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout super-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install PyYAML requests

      - name: Collect labels from source repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOLISTFILE: ${{ github.event.inputs.repoListFile }}
        run: |
          python .github/scripts/collect-labels.py "${REPOLISTFILE}"

      - name: Print generated labels.yml
        run: |
          echo "Contents of labels.yml:"
          cat .github/labels.yml
