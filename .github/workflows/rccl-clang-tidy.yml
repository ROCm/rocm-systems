name: "RCCL clang-tidy"

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'projects/rccl/**'
      - '.github/workflows/rccl-clang-tidy.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      image: rocm/dev-ubuntu-26.04:10.1.0-full
    env:
      ROCM_PATH: /opt/rocm
      # Pin a valid arch so RCCL's configure never probes for a GPU (there is
      # none on CI). hipify compiles no device code, so any gfx9xx is equivalent.
      GPU_TARGETS: gfx942
    steps:
      - name: Checkout rccl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # rocm-systems is a large monorepo; fetch only what the analysis needs.
          sparse-checkout: projects/rccl

      - name: Install build deps
        # Only what configure + hipify need. Nothing is compiled and the tests
        # are not built, so the test libraries, lcov and ccache are not
        # installed.
        #
        # Checked against rocm/dev-ubuntu-26.04:10.1.0-full; the three already
        # present are listed anyway, so the job keeps working if a later image
        # drops them.
        #
        #   build-essential  host compiler and make            (preinstalled)
        #   perl             hipify-perl, which stages the
        #                    sources to analyse                (preinstalled)
        #   python3          find_package(Python3 ... REQUIRED)
        #                    and the embedded tuner header     (preinstalled)
        #   cmake            configure                         (missing)
        #   git              rocm-cmake and version queries
        #                    at configure time                 (missing)
        #   rocm-cmake       find_package(ROCM); without it CMake
        #                    downloads and builds it from GitHub (missing)
        #
        # clang-tidy itself needs no package: the image carries it at both
        # /opt/rocm/lib/llvm/bin and /opt/rocm/llvm/bin, though neither is on
        # PATH, which is why run-clang-tidy.sh looks for it by absolute path.
        run: |
          apt-get update
          apt-get install --assume-yes --no-install-recommends \
            build-essential \
            cmake \
            git \
            perl \
            python3 \
            rocm-cmake

      - name: Put ROCm on PATH
        run: echo "/opt/rocm/bin" >> "$GITHUB_PATH"

      - name: Fetch the NCCL ref used to tell RCCL-owned files from upstream
        # maint/run-clang-tidy.sh hides findings in files NVIDIA/nccl ships at
        # the same path, and refuses to run rather than silently widening its
        # scope when it cannot work out which those are. Blobless and shallow:
        # only the tree listing is needed, not file contents.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add nccl https://github.com/NVIDIA/nccl.git
          git remote set-url --push nccl no_push
          git fetch --no-tags --depth=1 --filter=blob:none nccl master

      - name: Run clang-tidy
        # Advisory: the script exits 0 on findings unless --strict is passed.
        # It configures the build and runs hipify itself when the build
        # directory has no compile database yet.
        run: |
          bash projects/rccl/maint/run-clang-tidy.sh \
            --build-dir "$RUNNER_TEMP/rccl-clang-tidy-build"

      - name: Summarise findings
        if: always()
        run: |
          FINDINGS="$RUNNER_TEMP/rccl-clang-tidy-build/clang-tidy-findings.txt"
          {
            echo "## clang-tidy (advisory)"
            echo
            if [ ! -s "$FINDINGS" ]; then
              echo "No findings in RCCL-owned files."
            else
              echo "$(wc -l < "$FINDINGS") finding(s) in RCCL-owned files:"
              echo
              echo '```'
              cat "$FINDINGS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rccl-clang-tidy-findings
          path: ${{ runner.temp }}/rccl-clang-tidy-build/clang-tidy-*.txt
          if-no-files-found: warn
