name: RCCL clang-tidy

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'projects/rccl/**'
      - '.github/workflows/rccl-clang-tidy.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      image: rocm/dev-ubuntu-26.04:10.1.0-full
    env:
      ROCM_PATH: /opt/rocm
      GPU_TARGETS: gfx942
    steps:
      - name: Install build deps
        # Before the checkout, deliberately. actions/checkout needs git on
        # PATH; without it it silently falls back to downloading a tarball via
        # the REST API, which leaves no .git directory and ignores
        # sparse-checkout. Installing everything here keeps that ordering
        # requirement from being something anyone has to remember.
        #
        # Only what configure + hipify need. Nothing is compiled and the tests
        # are not built, so the test libraries, lcov and ccache are not
        # installed.
        #
        # Checked against rocm/dev-ubuntu-26.04:10.1.0-full; build-essential,
        # perl and python3 are already present, and are listed anyway so the
        # job keeps working if a later image drops them. cmake, git and
        # rocm-cmake are not present. Without rocm-cmake, CMake downloads and
        # builds it from GitHub.
        run: |
          apt-get update
          apt-get install --assume-yes --no-install-recommends \
            build-essential \
            cmake \
            git \
            perl \
            python3 \
            rocm-cmake

      - name: Checkout rccl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No fetch-depth: this analyses the tree, not a diff, so no merge
          # base and no history are needed.
          sparse-checkout: projects/rccl

      - name: Put ROCm on PATH
        run: echo "/opt/rocm/bin" >> "$GITHUB_PATH"

      - name: Fetch the NCCL ref used to tell RCCL-owned files from upstream
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add nccl https://github.com/NVIDIA/nccl.git
          git remote set-url --push nccl no_push
          git fetch --no-tags --depth=1 --filter=blob:none nccl master

      - name: Run clang-tidy
        run: |
          bash projects/rccl/maint/run-clang-tidy.sh \
            --build-dir "$RUNNER_TEMP/rccl-clang-tidy-build"

      - name: Summarise findings
        if: always()
        run: |
          FINDINGS="$RUNNER_TEMP/rccl-clang-tidy-build/clang-tidy-findings.txt"
          {
            echo "## clang-tidy (advisory)"
            echo
            if [ ! -s "$FINDINGS" ]; then
              echo "No findings in RCCL-owned files."
            else
              echo "$(wc -l < "$FINDINGS") finding(s) in RCCL-owned files:"
              echo
              echo '```'
              cat "$FINDINGS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rccl-clang-tidy-findings
          path: ${{ runner.temp }}/rccl-clang-tidy-build/clang-tidy-*.txt
          if-no-files-found: warn
