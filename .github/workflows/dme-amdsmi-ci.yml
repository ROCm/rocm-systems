###############################################################################
# Device Metrics Exporter – AMDSMI Integration CI
#
# Architecture under test:
#
#   ┌─────────────────────────┐
#   │      GPU-Agent          │  C/C++ daemon, links to libamdsmi
#   │  amdsmi → GPU driver    │  (built from gpu-agent repo, overlaying
#   └────────┬────────────────┘   this repo's projects/amdsmi source)
#            │ gRPC (:50061)
#   ┌────────▼────────────────┐
#   │ Device Metrics Exporter │  Go application, Prometheus client
#   │  Prometheus /metrics    │  (built from device-metrics-exporter repo)
#   └────────┬────────────────┘
#            │ HTTP :5000
#   ┌────────▼────────────────┐
#   │   Prometheus / curl     │  scrapes /metrics
#   └─────────────────────────┘
#
# The DME repo (device-metrics-exporter) contains:
#   - gpuagent   (submodule → ROCm/gpu-agent)
#   - libamdsmi  (submodule → ROCm/amdsmi)   ← we overlay our AMDSMI here
#   - libgimsmi  (submodule → private, skipped)
#
# Build flow (all via Make targets that use Docker-in-Docker):
#   1. make gpuagent-build           – create builder container image
#   2. make gpuagent-compile-full    – compile gpu-agent + amdsmi in Docker
#   3. make profiler-libdependent-assets – build profiler dependency libs
#   4. make pkg                      – produce .deb / .rpm packages 
#     (with gpu-agent binary and systemd unit files for both services)
#
# Integration test:
#   1. Install the built package
#   2. Start gpuagent.service + amd-metrics-exporter.service
#   3. Verify gRPC port (50051) and HTTP port (5000) are listening
#   4. Curl /metrics and validate Prometheus-format output
#   5. Check for expected AMD GPU metric names
###############################################################################

name: Device Metrics Exporter CI

on:
  pull_request:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/dme-amdsmi-ci.yml'
  push:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '.github/workflows/dme-amdsmi-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: true
  BUILD_TYPE: Release
  ROCM_DIR: /opt/rocm
  DME_REPO: https://github.com/ROCm/device-metrics-exporter.git
  DME_DIR: /tmp/device-metrics-exporter
  # Expected artifact locations produced by the Makefile
  GPUAGENT_BIN: /tmp/device-metrics-exporter/gpuagent/sw/nic/build/x86_64/sim/bin/gpuagent
  PROMETHEUS_VERSION: 2.55.1
  PROMETHEUS_PORT: 19090

# ---------------------------------------------------------------------------
#  Reusable shell fragments (via YAML anchors are not supported in GHA, so we
#  keep a composite script in env and reference it.  Alternatively these could
#  be extracted to a shared action under .github/actions/.)
# ---------------------------------------------------------------------------

jobs:
  # ==========================================================================
  #  DEB: Build → Install → Integration Test
  # ==========================================================================
  debian:
    name: DEB – ${{ matrix.os }}
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        os: [Ubuntu20, Ubuntu22, Debian10]

    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: >-
        --rm --privileged
        --device=/dev/kfd --device=/dev/dri
        --group-add video
        --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
        --shm-size=64G
        --cap-add=SYS_MODULE
        -v /lib/modules:/lib/modules
        -v /var/run/docker.sock:/var/run/docker.sock

    steps:
      - uses: actions/checkout@v4

      - name: Set Artifact Metadata
        if: github.event_name == 'pull_request'
        run: |
          echo "PR_NUMBER=PR${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%m%d%y-%H%M)" >> $GITHUB_ENV

      # -- Distro-specific repo fixups --------------------------------------
      - name: Fix archived repos (Debian10)
        if: matrix.os == 'Debian10'
        run: |
          set -e
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          EOF
          echo 'Acquire::Check-Valid-Until "false";' \
            > /etc/apt/apt.conf.d/99-disable-check-valid-until
          apt-get update

      # -- Install build + runtime prerequisites ----------------------------
      - name: Install prerequisites (DEB)
        run: |
          set -e
          apt-get update || true
          apt-get install -y --no-install-recommends \
            ca-certificates git curl wget make \
            build-essential pkg-config \
            cmake ninja-build \
            python3 python3-pip \
            golang-go \
            docker.io jq net-tools iproute2 \
            systemd

      # -- Validate workspace -----------------------------------------------
      - name: Validate checkout
        run: |
          set -eu
          test -d "$GITHUB_WORKSPACE" || { echo "GITHUB_WORKSPACE missing"; exit 1; }
          test -d "$GITHUB_WORKSPACE/projects/amdsmi" || { echo "projects/amdsmi missing"; exit 1; }
          echo "Workspace OK: $GITHUB_WORKSPACE"

      # -- Clone DME, overlay our AMDSMI source -----------------------------
      - name: Clone DME + overlay AMDSMI
        run: |
          set -eu
          rm -rf "$DME_DIR"

          # Clone WITHOUT recurse-submodules (libgimsmi is private/SSH-only)
          GIT_TERMINAL_PROMPT=0 git clone --depth 1 "$DME_REPO" "$DME_DIR"

          # Disable the private libgimsmi submodule
          git -C "$DME_DIR" config submodule.libgimsmi.update none || true

          # Rewrite SSH → HTTPS for CI (containers lack SSH host keys)
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

          # Init only the submodules we need
          git -C "$DME_DIR" submodule update --init --recursive --depth 1 \
            -- gpuagent libamdsmi

          # Overlay this repo's AMDSMI source onto DME's libamdsmi submodule
          AMDSMI_SRC="$GITHUB_WORKSPACE/projects/amdsmi"
          if [ -d "$DME_DIR/libamdsmi" ]; then
            # Keep .git metadata so submodule status still works
            find "$DME_DIR/libamdsmi" -mindepth 1 -maxdepth 1 ! -name ".git" \
              -exec rm -rf {} +

            if [ -d "$GITHUB_WORKSPACE/.git" ]; then
              git -C "$GITHUB_WORKSPACE" archive --format=tar HEAD:projects/amdsmi \
                | tar -xf - -C "$DME_DIR/libamdsmi"
            else
              tar -C "$AMDSMI_SRC" --exclude=.git -cf - . \
                | tar -xf - -C "$DME_DIR/libamdsmi"
            fi
          fi

          echo "--- Submodule status ---"
          git -C "$DME_DIR" submodule status

      # -- Build gpu-agent + AMDSMI libs + package --------------------------
      - name: Build Device Metrics Exporter
        shell: bash
        run: |
          set -euo pipefail
          cd "$DME_DIR"
          echo "=== Building on ${{ matrix.os }} ==="
          RETRIES=3

          for i in $(seq 1 $RETRIES); do
            echo "Build attempt $i on ${{ matrix.os }}..."
            if make gpuagent-build 2>&1 | tee /tmp/gpuagent-build.log && \
               (make gpuagent-compile-full 2>&1 | tee /tmp/gpuagent-compile.log || make gpuagent-compile 2>&1 | tee /tmp/gpuagent-compile.log) && \
               make profiler-libdependent-assets 2>&1 | tee /tmp/profiler-libdependent-assets.log && \
               make pkg 2>&1 | tee /tmp/pkg.log; then
              echo "Build successful on attempt $i"
              break
            else
              echo "Build failed on attempt $i"
              if [ $i -eq $RETRIES ]; then
                echo "All $RETRIES build attempts failed"
                exit 1
              fi
              sleep $((2 * i))
            fi
          done

          test -x "$GPUAGENT_BIN" || {
            echo "ERROR: gpuagent binary not found at $GPUAGENT_BIN"
            find "$DME_DIR/gpuagent/sw/nic/build" -type f -name 'gpuagent*' 2>/dev/null || true
            exit 1
          }

          echo "::group::Build warnings"
          grep -i "warning" /tmp/gpuagent-build.log /tmp/gpuagent-compile.log /tmp/profiler-libdependent-assets.log /tmp/pkg.log \
            | while read -r line; do echo "::warning::$line"; done || true
          echo "::endgroup::"

          echo "::group::Package artifacts"
          find bin -maxdepth 1 -type f \( -name "*.deb" -o -name "*.rpm" \) -ls 2>/dev/null || true
          echo "::endgroup::"

      - name: Upload package artifacts (DEB)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dme-deb-${{ matrix.os }}-${{ env.PR_NUMBER }}-${{ env.BUILD_DATE }}
          path: ${{ env.DME_DIR }}/bin/*.deb
          if-no-files-found: warn
          retention-days: 7

      # -- Install the package ----------------------------------------------
      - name: Install package (DEB)
        run: |
          set -e
          DEB_PKG="$(find "$DME_DIR/bin" -maxdepth 1 -name '*.deb' -print -quit)"
          if [ -z "$DEB_PKG" ]; then
            echo "ERROR: No .deb produced under $DME_DIR/bin/"
            ls -la "$DME_DIR/bin/" 2>/dev/null || true
            exit 1
          fi

          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "Install attempt $i on ${{ matrix.os }}..."
            if dpkg -i "$DEB_PKG" || apt-get -f install -y; then
              echo "Install successful on attempt $i"
              break
            fi
            if [ $i -eq $RETRIES ]; then
              echo "All $RETRIES install attempts failed"
              exit 1
            fi
            sleep $((2 * i))
          done

          echo "::group::Installed unit files"
          systemctl list-unit-files | grep -E '(metrics-exporter|gpuagent)' || true
          echo "::endgroup::"

      # -- Integration test: start services, verify gRPC + HTTP metrics -----
      - name: Integration test – start services
        run: |
          set -eu
          mkdir -p /tmp/test-results

          systemctl daemon-reload || true

          # Start gpu-agent (gRPC server on :50061, reads GPU via amdsmi)
          systemctl enable --now gpuagent.service || true
          # Start Device Metrics Exporter (HTTP :5000, connects to gpu-agent via gRPC)
          systemctl enable --now amd-metrics-exporter.service || true

          # Give services time to initialise
          sleep 5

          echo "::group::Service status"
          systemctl status gpuagent.service --no-pager 2>&1 || true
          systemctl status amd-metrics-exporter.service --no-pager 2>&1 || true
          echo "::endgroup::"

      - name: Integration test – verify ports
        run: |
          set -eu
          echo "Checking listening ports..."
          ss -ltnp 2>/dev/null | tee /tmp/test-results/ports.log

          # gpu-agent gRPC port (default 50061)
          if ss -ltnp | grep -qE ':50061\b'; then
            echo "PASS: gpu-agent gRPC port :50061 is listening"
          else
            echo "::error::gpu-agent gRPC port :50061 not detected"
            exit 1
          fi

          # DME HTTP port
          if ss -ltnp | grep -q ':5000\b'; then
            echo "PASS: DME metrics port :5000 is listening"
          else
            echo "::error::DME metrics port :5000 not detected"
            exit 1
          fi

      - name: Integration test – validate /metrics
        shell: bash
        run: |
          set -eu
          METRICS_URL="http://127.0.0.1:5000/metrics"
          RESULT_DIR="/tmp/test-results"
          PASS=true

          # --- Test 1: endpoint reachable ---
          echo "--- Test 1: /metrics endpoint reachability ---"
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$METRICS_URL" || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "PASS: /metrics returned HTTP 200"
          else
            echo "FAIL: /metrics returned HTTP $HTTP_CODE"
            PASS=false
          fi

          # --- Test 2: Prometheus-format output ---
          echo "--- Test 2: Prometheus text format ---"
          curl -sf "$METRICS_URL" > "$RESULT_DIR/metrics_full.log" 2>/dev/null || true

          TOTAL_LINES=$(wc -l < "$RESULT_DIR/metrics_full.log" 2>/dev/null || echo 0)
          echo "Total metric lines: $TOTAL_LINES"
          head -n 80 "$RESULT_DIR/metrics_full.log" | tee "$RESULT_DIR/metrics_head.log"

          if [ "$TOTAL_LINES" -lt 5 ]; then
            echo "FAIL: Too few lines from /metrics ($TOTAL_LINES)"
            PASS=false
          else
            echo "PASS: /metrics returned $TOTAL_LINES lines"
          fi

          # --- Test 3: Expected AMD GPU metric names ---
          # These are standard metrics exposed by the DME when gpu-agent is connected
          echo "--- Test 3: Expected GPU metric names ---"
          EXPECTED_METRICS=(
            "amd_gpu"
            "temperature"
            "gpu_utilization\|utilization"
            "memory\|mem"
            "power"
          )
          for pattern in "${EXPECTED_METRICS[@]}"; do
            if grep -qiE "$pattern" "$RESULT_DIR/metrics_full.log" 2>/dev/null; then
              echo "  PASS: Found metric matching '$pattern'"
            else
              echo "  WARN: No metric matching '$pattern' (may require real GPU hardware)"
            fi
          done

          # --- Test 4: Prometheus HELP/TYPE metadata ---
          echo "--- Test 4: Prometheus metadata ---"
          HELP_COUNT=$(grep -c '^# HELP' "$RESULT_DIR/metrics_full.log" 2>/dev/null || echo 0)
          TYPE_COUNT=$(grep -c '^# TYPE' "$RESULT_DIR/metrics_full.log" 2>/dev/null || echo 0)
          echo "  HELP lines: $HELP_COUNT, TYPE lines: $TYPE_COUNT"
          if [ "$HELP_COUNT" -gt 0 ] && [ "$TYPE_COUNT" -gt 0 ]; then
            echo "  PASS: Prometheus metadata present"
          else
            echo "  WARN: No Prometheus HELP/TYPE metadata (may need real GPU)"
          fi

          # --- Summary ---
          if [ "$PASS" = "false" ]; then
            echo "::error::Integration test FAILED"
            exit 1
          fi
          echo "Integration test PASSED"


      - name: Integration test – validate Prometheus scrape
        shell: bash
        run: |
          set -eu
          RESULT_DIR="/tmp/test-results"
          PROM_ROOT="/tmp/prometheus"
          PROM_PORT="${PROMETHEUS_PORT}"
          PROM_VER="${PROMETHEUS_VERSION}"
          ARCHIVE="prometheus-${PROM_VER}.linux-amd64.tar.gz"

          mkdir -p "$RESULT_DIR" "$PROM_ROOT"
          rm -rf "$PROM_ROOT"/*

          curl -fsSL -o "$PROM_ROOT/$ARCHIVE" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VER}/${ARCHIVE}"
          tar -xzf "$PROM_ROOT/$ARCHIVE" -C "$PROM_ROOT"
          PROM_BIN="$(find "$PROM_ROOT" -type f -name prometheus | head -n1)"

          printf '%s\n' \
            'global:' \
            '  scrape_interval: 5s' \
            '  scrape_timeout: 5s' \
            'scrape_configs:' \
            '  - job_name: dme' \
            '    metrics_path: /metrics' \
            '    static_configs:' \
            '      - targets: ["127.0.0.1:5000"]' \
            > "$PROM_ROOT/prometheus.yml"

          "$PROM_BIN" \
            --config.file="$PROM_ROOT/prometheus.yml" \
            --storage.tsdb.path="$PROM_ROOT/data" \
            --web.listen-address="127.0.0.1:${PROM_PORT}" \
            > "$RESULT_DIR/prometheus.log" 2>&1 &
          echo $! > "$RESULT_DIR/prometheus.pid"

          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:${PROM_PORT}/-/ready" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS "http://127.0.0.1:${PROM_PORT}/api/v1/targets" > "$RESULT_DIR/prometheus_targets.json"
          jq -e '.status == "success"' "$RESULT_DIR/prometheus_targets.json" >/dev/null
          jq -e '.data.activeTargets | map(select(.labels.job == "dme" and .health == "up")) | length > 0' \
            "$RESULT_DIR/prometheus_targets.json" >/dev/null

          curl -fsSG --data-urlencode 'query=up{job="dme"}' \
            "http://127.0.0.1:${PROM_PORT}/api/v1/query" > "$RESULT_DIR/prometheus_query.json"
          jq -e '.status == "success" and (.data.result | length > 0) and ((.data.result[0].value[1] | tonumber) >= 1)' \
            "$RESULT_DIR/prometheus_query.json" >/dev/null

          echo "PASS: Prometheus can scrape DME /metrics endpoint"

      # -- Artifacts & cleanup ----------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dme-results-deb-${{ matrix.os }}
          path: |
            /tmp/test-results/
            /tmp/gpuagent-build.log
            /tmp/gpuagent-compile.log
            /tmp/profiler-libdependent-assets.log
            /tmp/pkg.log
          if-no-files-found: ignore

      - name: Dump journals on failure
        if: failure()
        run: |
          set +e
          echo "::group::gpuagent journal"
          journalctl -u gpuagent.service -n 300 --no-pager 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::amd-metrics-exporter journal"
          journalctl -u amd-metrics-exporter.service -n 300 --no-pager 2>/dev/null || true
          echo "::endgroup::"

      - name: Cleanup
        if: always()
        run: |
          set +e
          if [ -f /tmp/test-results/prometheus.pid ]; then
            kill "$(cat /tmp/test-results/prometheus.pid)" 2>/dev/null || true
          fi
          systemctl stop amd-metrics-exporter.service 2>/dev/null || true
          systemctl stop gpuagent.service 2>/dev/null || true
          systemctl daemon-reload 2>/dev/null || true
          apt-get remove -y amdgpu-exporter amd-metrics-exporter gpuagent 2>/dev/null || true
          apt-get autoremove -y 2>/dev/null || true
          rm -rf "$DME_DIR" /tmp/test-results /tmp/*.log

  # ==========================================================================
  #  RPM: Build → Install → Integration Test
  # ==========================================================================
  rpm:
    name: RPM – ${{ matrix.os }}
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        os: [SLES, RHEL8, RHEL9, RHEL10, AzureLinux3, AlmaLinux8]

    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: >-
        --rm --privileged
        --device=/dev/kfd --device=/dev/dri
        --group-add video
        --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
        --shm-size=64G
        --cap-add=SYS_MODULE
        -v /lib/modules:/lib/modules
        -v /var/run/docker.sock:/var/run/docker.sock

    steps:
      - uses: actions/checkout@v4

      - name: Set Artifact Metadata
        if: github.event_name == 'pull_request'
        run: |
          echo "PR_NUMBER=PR${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%m%d%y-%H%M)" >> $GITHUB_ENV

      # -- Determine package manager ----------------------------------------
      - name: Set package manager
        run: |
          set -e
          case "${{ matrix.os }}" in
            SLES)
              echo "PKG_MGR=zypper" >> "$GITHUB_ENV" ;;
            *)
              echo "PKG_MGR=dnf" >> "$GITHUB_ENV" ;;
          esac

      # -- Install build + runtime prerequisites ----------------------------
      - name: Install prerequisites (RPM)
        run: |
          set -e
          install_docker_compat() {
            # Prefer podman + podman-docker wrapper; fall back to symlink
            $PKG_MGR install -y podman 2>/dev/null || true
            $PKG_MGR install -y podman-docker 2>/dev/null || true
            if ! command -v docker >/dev/null 2>&1; then
              command -v podman >/dev/null 2>&1 && \
                ln -sf "$(command -v podman)" /usr/local/bin/docker || true
            fi
          }

          case "$PKG_MGR" in
            zypper)
              zypper --non-interactive refresh || true
              zypper --non-interactive install -y \
                git make gcc gcc-c++ \
                cmake ninja \
                python3 python3-pip \
                go \
                jq iproute2 net-tools || true
              install_docker_compat
              ;;
            dnf)
              dnf -y install \
                git make gcc gcc-c++ \
                cmake ninja-build \
                python3 python3-pip \
                golang \
                jq iproute net-tools \
                podman || true
              install_docker_compat
              ;;
          esac

      # -- Validate workspace -----------------------------------------------
      - name: Validate checkout
        run: |
          set -eu
          test -d "$GITHUB_WORKSPACE" || { echo "GITHUB_WORKSPACE missing"; exit 1; }
          test -d "$GITHUB_WORKSPACE/projects/amdsmi" || { echo "projects/amdsmi missing"; exit 1; }
          echo "Workspace OK: $GITHUB_WORKSPACE"

      # -- Clone DME, overlay our AMDSMI source -----------------------------
      - name: Clone DME + overlay AMDSMI
        run: |
          set -eu
          rm -rf "$DME_DIR"

          # Clone WITHOUT recurse-submodules (libgimsmi is private/SSH-only)
          GIT_TERMINAL_PROMPT=0 git clone --depth 1 "$DME_REPO" "$DME_DIR"

          # Disable the private libgimsmi submodule
          git -C "$DME_DIR" config submodule.libgimsmi.update none || true

          # Rewrite SSH → HTTPS for CI (containers lack SSH host keys)
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

          # Init only the submodules we need
          git -C "$DME_DIR" submodule update --init --recursive --depth 1 \
            -- gpuagent libamdsmi

          # Overlay this repo's AMDSMI source onto DME's libamdsmi submodule
          AMDSMI_SRC="$GITHUB_WORKSPACE/projects/amdsmi"
          if [ -d "$DME_DIR/libamdsmi" ]; then
            find "$DME_DIR/libamdsmi" -mindepth 1 -maxdepth 1 ! -name ".git" \
              -exec rm -rf {} +

            if [ -d "$GITHUB_WORKSPACE/.git" ]; then
              git -C "$GITHUB_WORKSPACE" archive --format=tar HEAD:projects/amdsmi \
                | tar -xf - -C "$DME_DIR/libamdsmi"
            else
              tar -C "$AMDSMI_SRC" --exclude=.git -cf - . \
                | tar -xf - -C "$DME_DIR/libamdsmi"
            fi
          fi

          echo "--- Submodule status ---"
          git -C "$DME_DIR" submodule status

      # -- Build gpu-agent + AMDSMI libs + package --------------------------
      - name: Build Device Metrics Exporter
        shell: bash
        run: |
          set -euo pipefail
          cd "$DME_DIR"
          echo "=== Building on ${{ matrix.os }} ==="

          case "${{ matrix.os }}" in
            RHEL10|AlmaLinux8) export QA_RPATHS=$((0x0010 | 0x0002)) ;;
          esac

          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "Build attempt $i on ${{ matrix.os }}..."
            if make gpuagent-build 2>&1 | tee /tmp/gpuagent-build.log && \
               (make gpuagent-compile-full 2>&1 | tee /tmp/gpuagent-compile.log || make gpuagent-compile 2>&1 | tee /tmp/gpuagent-compile.log) && \
               make profiler-libdependent-assets 2>&1 | tee /tmp/profiler-libdependent-assets.log && \
               make pkg 2>&1 | tee /tmp/pkg.log; then
              echo "Build successful on attempt $i"
              break
            else
              echo "Build failed on attempt $i"
              if [ $i -eq $RETRIES ]; then
                echo "All $RETRIES build attempts failed"
                exit 1
              fi
              sleep $((2 * i))
            fi
          done

          test -x "$GPUAGENT_BIN" || {
            echo "ERROR: gpuagent binary not found at $GPUAGENT_BIN"
            find "$DME_DIR/gpuagent/sw/nic/build" -type f -name 'gpuagent*' 2>/dev/null || true
            exit 1
          }

          echo "::group::Build warnings"
          grep -i "warning" /tmp/gpuagent-build.log /tmp/gpuagent-compile.log /tmp/profiler-libdependent-assets.log /tmp/pkg.log \
            | while read -r line; do echo "::warning::$line"; done || true
          echo "::endgroup::"

          echo "::group::Package artifacts"
          find bin -maxdepth 1 -type f \( -name "*.deb" -o -name "*.rpm" \) -ls 2>/dev/null || true
          echo "::endgroup::"

      - name: Upload package artifacts (RPM)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dme-rpm-${{ matrix.os }}-${{ env.PR_NUMBER }}-${{ env.BUILD_DATE }}
          path: ${{ env.DME_DIR }}/bin/*.rpm
          if-no-files-found: warn
          retention-days: 7

      # -- Install the package ----------------------------------------------
      - name: Install package (RPM)
        run: |
          set -e
          RPM_PKG="$(find "$DME_DIR/bin" -maxdepth 1 -name '*.rpm' -print -quit)"
          if [ -z "$RPM_PKG" ]; then
            echo "ERROR: No .rpm produced under $DME_DIR/bin/"
            ls -la "$DME_DIR/bin/" 2>/dev/null || true
            exit 1
          fi

          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "Install attempt $i on ${{ matrix.os }}..."
            case "$PKG_MGR" in
              zypper) timeout 10m zypper --no-refresh --no-gpg-checks install -y "$RPM_PKG" ;;
              dnf) timeout 10m dnf install -y --skip-broken --disablerepo='*' "$RPM_PKG" ;;
            esac && break

            if [ $i -eq $RETRIES ]; then
              echo "All $RETRIES install attempts failed"
              exit 1
            fi
            sleep $((2 * i))
          done

          echo "::group::Installed unit files"
          systemctl list-unit-files | grep -E '(metrics-exporter|gpuagent)' || true
          echo "::endgroup::"

      # -- Integration test: start services, verify gRPC + HTTP metrics -----
      - name: Integration test – start services
        run: |
          set -eu
          mkdir -p /tmp/test-results

          systemctl daemon-reload || true
          systemctl enable --now gpuagent.service || true
          systemctl enable --now amd-metrics-exporter.service || true

          sleep 5

          echo "::group::Service status"
          systemctl status gpuagent.service --no-pager 2>&1 || true
          systemctl status amd-metrics-exporter.service --no-pager 2>&1 || true
          echo "::endgroup::"

      - name: Integration test – verify ports
        run: |
          set -eu
          echo "Checking listening ports..."
          ss -ltnp 2>/dev/null | tee /tmp/test-results/ports.log

          if ss -ltnp | grep -qE ':5005[0-9]|:5006[0-9]'; then
            echo "PASS: gpu-agent gRPC port is listening"
          else
            echo "WARN: gpu-agent gRPC port not detected (may use a different port)"
          fi

          if ss -ltnp | grep -q ':5000\b'; then
            echo "PASS: DME metrics port :5000 is listening"
          else
            echo "WARN: DME metrics port :5000 not detected"
          fi

      - name: Integration test – validate /metrics
        shell: bash
        run: |
          set -eu
          METRICS_URL="http://127.0.0.1:5000/metrics"
          RESULT_DIR="/tmp/test-results"
          PASS=true

          # --- Test 1: endpoint reachable ---
          echo "--- Test 1: /metrics endpoint reachability ---"
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$METRICS_URL" || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "PASS: /metrics returned HTTP 200"
          else
            echo "FAIL: /metrics returned HTTP $HTTP_CODE"
            PASS=false
          fi

          # --- Test 2: Prometheus-format output ---
          echo "--- Test 2: Prometheus text format ---"
          curl -sf "$METRICS_URL" > "$RESULT_DIR/metrics_full.log" 2>/dev/null || true

          TOTAL_LINES=$(wc -l < "$RESULT_DIR/metrics_full.log" 2>/dev/null || echo 0)
          echo "Total metric lines: $TOTAL_LINES"
          head -n 80 "$RESULT_DIR/metrics_full.log" | tee "$RESULT_DIR/metrics_head.log"

          if [ "$TOTAL_LINES" -lt 5 ]; then
            echo "FAIL: Too few lines from /metrics ($TOTAL_LINES)"
            PASS=false
          else
            echo "PASS: /metrics returned $TOTAL_LINES lines"
          fi

          # --- Test 3: Expected AMD GPU metric names ---
          echo "--- Test 3: Expected GPU metric names ---"
          EXPECTED_METRICS=(
            "amd_gpu"
            "temperature"
            "gpu_utilization\|utilization"
            "memory\|mem"
            "power"
          )
          for pattern in "${EXPECTED_METRICS[@]}"; do
            if grep -qiE "$pattern" "$RESULT_DIR/metrics_full.log" 2>/dev/null; then
              echo "  PASS: Found metric matching '$pattern'"
            else
              echo "  WARN: No metric matching '$pattern' (may require real GPU hardware)"
            fi
          done

          # --- Test 4: Prometheus HELP/TYPE metadata ---
          echo "--- Test 4: Prometheus metadata ---"
          HELP_COUNT=$(grep -c '^# HELP' "$RESULT_DIR/metrics_full.log" 2>/dev/null || echo 0)
          TYPE_COUNT=$(grep -c '^# TYPE' "$RESULT_DIR/metrics_full.log" 2>/dev/null || echo 0)
          echo "  HELP lines: $HELP_COUNT, TYPE lines: $TYPE_COUNT"
          if [ "$HELP_COUNT" -gt 0 ] && [ "$TYPE_COUNT" -gt 0 ]; then
            echo "  PASS: Prometheus metadata present"
          else
            echo "  WARN: No Prometheus HELP/TYPE metadata (may need real GPU)"
          fi

          # --- Summary ---
          if [ "$PASS" = "false" ]; then
            echo "::error::Integration test FAILED"
            exit 1
          fi
          echo "Integration test PASSED"


      - name: Integration test – validate Prometheus scrape
        shell: bash
        run: |
          set -eu
          RESULT_DIR="/tmp/test-results"
          PROM_ROOT="/tmp/prometheus"
          PROM_PORT="${PROMETHEUS_PORT}"
          PROM_VER="${PROMETHEUS_VERSION}"
          ARCHIVE="prometheus-${PROM_VER}.linux-amd64.tar.gz"

          mkdir -p "$RESULT_DIR" "$PROM_ROOT"
          rm -rf "$PROM_ROOT"/*

          curl -fsSL -o "$PROM_ROOT/$ARCHIVE" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VER}/${ARCHIVE}"
          tar -xzf "$PROM_ROOT/$ARCHIVE" -C "$PROM_ROOT"
          PROM_BIN="$(find "$PROM_ROOT" -type f -name prometheus | head -n1)"

          printf '%s\n' \
            'global:' \
            '  scrape_interval: 5s' \
            '  scrape_timeout: 5s' \
            'scrape_configs:' \
            '  - job_name: dme' \
            '    metrics_path: /metrics' \
            '    static_configs:' \
            '      - targets: ["127.0.0.1:5000"]' \
            > "$PROM_ROOT/prometheus.yml"

          "$PROM_BIN" \
            --config.file="$PROM_ROOT/prometheus.yml" \
            --storage.tsdb.path="$PROM_ROOT/data" \
            --web.listen-address="127.0.0.1:${PROM_PORT}" \
            > "$RESULT_DIR/prometheus.log" 2>&1 &
          echo $! > "$RESULT_DIR/prometheus.pid"

          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:${PROM_PORT}/-/ready" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS "http://127.0.0.1:${PROM_PORT}/api/v1/targets" > "$RESULT_DIR/prometheus_targets.json"
          jq -e '.status == "success"' "$RESULT_DIR/prometheus_targets.json" >/dev/null
          jq -e '.data.activeTargets | map(select(.labels.job == "dme" and .health == "up")) | length > 0' \
            "$RESULT_DIR/prometheus_targets.json" >/dev/null

          curl -fsSG --data-urlencode 'query=up{job="dme"}' \
            "http://127.0.0.1:${PROM_PORT}/api/v1/query" > "$RESULT_DIR/prometheus_query.json"
          jq -e '.status == "success" and (.data.result | length > 0) and ((.data.result[0].value[1] | tonumber) >= 1)' \
            "$RESULT_DIR/prometheus_query.json" >/dev/null

          echo "PASS: Prometheus can scrape DME /metrics endpoint"

      # -- Artifacts & cleanup ----------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dme-results-rpm-${{ matrix.os }}
          path: |
            /tmp/test-results/
            /tmp/gpuagent-build.log
            /tmp/gpuagent-compile.log
            /tmp/profiler-libdependent-assets.log
            /tmp/pkg.log
          if-no-files-found: ignore

      - name: Dump journals on failure
        if: failure()
        run: |
          set +e
          echo "::group::gpuagent journal"
          journalctl -u gpuagent.service -n 300 --no-pager 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::amd-metrics-exporter journal"
          journalctl -u amd-metrics-exporter.service -n 300 --no-pager 2>/dev/null || true
          echo "::endgroup::"

      - name: Cleanup
        if: always()
        run: |
          set +e
          if [ -f /tmp/test-results/prometheus.pid ]; then
            kill "$(cat /tmp/test-results/prometheus.pid)" 2>/dev/null || true
          fi
          systemctl stop amd-metrics-exporter.service 2>/dev/null || true
          systemctl stop gpuagent.service 2>/dev/null || true
          systemctl daemon-reload 2>/dev/null || true
          case "$PKG_MGR" in
            zypper) zypper remove -y amd-metrics-exporter gpuagent amdgpu-exporter 2>/dev/null || true ;;
            dnf)    dnf remove -y amd-metrics-exporter gpuagent amdgpu-exporter 2>/dev/null || true ;;
          esac
          rm -rf "$DME_DIR" /tmp/test-results /tmp/*.log
