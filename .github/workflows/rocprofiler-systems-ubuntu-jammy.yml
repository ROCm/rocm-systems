name: rocprofiler-systems Ubuntu 22.04 (GCC, Python, ROCm)
run-name: ubuntu-jammy

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/rocprofiler-systems-ubuntu-jammy.yml'
      - 'projects/rocprofiler-systems/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-systems/docs/**'
      - '!projects/rocprofiler-systems/source/docs/**'
      - '!projects/rocprofiler-systems/source/python/gui/**'
      - '!projects/rocprofiler-systems/docker/**'
  pull_request:
    paths:
      - '.github/workflows/rocprofiler-systems-ubuntu-jammy.yml'
      - 'projects/rocprofiler-systems/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-systems/docs/**'
      - '!projects/rocprofiler-systems/source/docs/**'
      - '!projects/rocprofiler-systems/source/python/gui/**'
      - '!projects/rocprofiler-systems/docker/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROCPROFSYS_CI: ON
  ROCPROFSYS_TMPDIR: "%env{PWD}%/testing-tmp"
  ROCPROFSYS_KEEP_TEST_OUTPUT: '0'
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  ubuntu-jammy:
    runs-on: ubuntu-latest
    container:
      image: dgaliffiamd/rocprofiler-systems:ci-rocm-${{ matrix.rocm-version }}-ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ['g++']
        rocm-version: ['6.3', '6.4', '7.0', '7.1', '7.2']

    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      ROCPROFSYS_MAX_THREADS: '64'

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            projects/rocprofiler-systems/
            .github/actions/
            .gitmodules

      - name: Configure ROCm Environment
        shell: bash
        run: |
          echo "/opt/rocm/bin" >> $GITHUB_PATH
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Install Packages
        timeout-minutes: 25
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 #v4.0.0
        with:
          retry_wait_seconds: 30
          timeout_minutes: 25
          max_attempts: 5
          command: |
            apt-get update &&
            apt-get upgrade -y &&
            apt-get install -y ${{ matrix.compiler }} &&
            apt-get autoclean

      - uses: ./.github/actions/rocprofiler-systems-ccache
        with:
          cache-key: ccache-jammy-${{ github.job }}-${{ matrix.compiler }}-${{ matrix.rocm-version }}

      - name: Install Python test dependencies
        timeout-minutes: 10
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          for env_dir in /opt/conda/envs/py3.{8,9,10,11}/; do
            if [ -d "${env_dir}" ] && [ -x "${env_dir}bin/python3" ]; then
              "${env_dir}bin/python3" -m pip install -r requirements.txt
            fi
          done

      - name: Sanity check ROCm
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: /opt/rocm/bin/hipcc -O3 -c ./examples/transpose/transpose.cpp -o /tmp/transpose.o

      - name: Test environment modules
        timeout-minutes: 15
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          source /usr/share/modules/init/$(basename ${SHELL})
          module avail

      - name: Set compiler env
        shell: bash
        run: |
          echo "CC=$(echo '${{ matrix.compiler }}' | sed 's/+/c/g')" >> $GITHUB_ENV
          echo "CXX=${{ matrix.compiler }}" >> $GITHUB_ENV

      - name: Configure
        timeout-minutes: 10
        uses: ./.github/actions/rocprofiler-systems-configure
        with:
          cmake-flags: >-
            -DCMAKE_C_COMPILER=${{ env.CC }}
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
            -DCMAKE_INSTALL_PREFIX=/opt/rocprofiler-systems-dev
            -DROCPROFSYS_USE_PYTHON=ON
            -DROCPROFSYS_BUILD_DYNINST=ON
            -DROCPROFSYS_BUILD_TBB=ON
            -DROCPROFSYS_BUILD_ELFUTILS=ON
            -DROCPROFSYS_BUILD_LIBIBERTY=ON
            -DROCPROFSYS_BUILD_HIDDEN_VISIBILITY=ON
            -DROCPROFSYS_PYTHON_PREFIX=/opt/conda/envs
            -DROCPROFSYS_PYTHON_ENVS="py3.8;py3.9;py3.10;py3.11"
            -DROCPROFSYS_STRIP_LIBRARIES=OFF
            -DROCPROFSYS_DISABLE_EXAMPLES="transpose;rccl;openmp-target;openmp-vv;videodecode;jpegdecode;network"
            -DUSE_CLANG_OMP=OFF

      - name: Build
        timeout-minutes: 40
        uses: ./.github/actions/rocprofiler-systems-build

      - name: Test
        timeout-minutes: 60
        uses: ./.github/actions/rocprofiler-systems-test
        with:
          cdash-build-name: >-
            ${{ github.repository_owner }}-${{ github.ref_name }}-ubuntu-jammy-${{ matrix.compiler }}-rocm-${{ matrix.rocm-version }}-python-internal-dyninst

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s -v || true

      - name: Check for leftover buffered files
        timeout-minutes: 5
        uses: ./.github/actions/rocprofiler-systems-check-leftover

      - name: Post-build
        timeout-minutes: 25
        uses: ./.github/actions/rocprofiler-systems-post-build
        with:
          install-prefix: /opt/rocprofiler-systems-dev

      - uses: ./.github/actions/rocprofiler-systems-artifacts

  ubuntu-jammy-system-deps:
    runs-on: ubuntu-latest
    container:
      image: dgaliffiamd/rocprofiler-systems:ci-rocm-7.2-ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ['g++', 'amdclang++']
        include:
          - compiler: 'g++'
            cc: 'gcc'
            use-clang-omp: 'OFF'
          - compiler: 'amdclang++'
            cc: 'amdclang'
            use-clang-omp: 'ON'

    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      ROCPROFSYS_MAX_THREADS: '64'

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            projects/rocprofiler-systems/
            .github/actions/
            .gitmodules

      - name: Configure ROCm Environment
        shell: bash
        run: |
          echo "/opt/rocm/bin" >> $GITHUB_PATH
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Install system dependency packages
        timeout-minutes: 25
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 #v4.0.0
        with:
          retry_wait_seconds: 30
          timeout_minutes: 25
          max_attempts: 5
          command: |
            apt-get update &&
            apt-get upgrade -y &&
            apt-get install -y g++ \
              binutils-dev libboost-all-dev libtbb-dev \
              libdw-dev libdwarf-dev libelf-dev libiberty-dev &&
            apt-get autoclean

      - uses: ./.github/actions/rocprofiler-systems-ccache
        with:
          cache-key: ccache-jammy-system-deps-${{ github.job }}-${{ matrix.compiler }}

      - name: Install Python test dependencies
        timeout-minutes: 10
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          python3 -m pip install -r requirements.txt
          for env_dir in /opt/conda/envs/py3.{8,9,10,11}/; do
            if [ -d "${env_dir}" ] && [ -x "${env_dir}bin/python3" ]; then
              "${env_dir}bin/python3" -m pip install -r requirements.txt
            fi
          done

      - name: Sanity check ROCm
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: /opt/rocm/bin/hipcc -O3 -c ./examples/transpose/transpose.cpp -o /tmp/transpose.o

      - name: Configure
        timeout-minutes: 10
        uses: ./.github/actions/rocprofiler-systems-configure
        with:
          cmake-flags: >-
            -DCMAKE_C_COMPILER=${{ matrix.cc }}
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
            -DCMAKE_INSTALL_PREFIX=/opt/rocprofiler-systems
            -DROCPROFSYS_USE_PYTHON=ON
            -DROCPROFSYS_BUILD_DYNINST=ON
            -DROCPROFSYS_BUILD_TBB=OFF
            -DROCPROFSYS_BUILD_ELFUTILS=OFF
            -DROCPROFSYS_BUILD_LIBIBERTY=OFF
            -DROCPROFSYS_BUILD_HIDDEN_VISIBILITY=ON
            -DROCPROFSYS_PYTHON_PREFIX=/opt/conda/envs
            -DROCPROFSYS_PYTHON_ENVS="py3.8;py3.9;py3.10;py3.11"
            -DROCPROFSYS_STRIP_LIBRARIES=OFF
            -DROCPROFSYS_DISABLE_EXAMPLES="transpose;rccl;openmp-target;openmp-vv;videodecode;jpegdecode;network"
            -DUSE_CLANG_OMP=${{ matrix.use-clang-omp }}

      - name: Build
        timeout-minutes: 40
        uses: ./.github/actions/rocprofiler-systems-build

      - name: Test
        timeout-minutes: 60
        uses: ./.github/actions/rocprofiler-systems-test
        with:
          cdash-build-name: >-
            ${{ github.repository_owner }}-${{ github.ref_name }}-ubuntu-jammy-system-deps-${{ matrix.compiler }}

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s -v || true

      - name: Check for leftover buffered files
        timeout-minutes: 5
        uses: ./.github/actions/rocprofiler-systems-check-leftover

      - name: Post-build
        timeout-minutes: 25
        uses: ./.github/actions/rocprofiler-systems-post-build
        with:
          skip-cpack: "true"

      - uses: ./.github/actions/rocprofiler-systems-artifacts
