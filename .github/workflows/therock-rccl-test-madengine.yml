name: TheRock Test MADEngine Workloads for rccl

on:
  workflow_call:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
      artifact_run_id:
        type: string
      workload:
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        type: string
        default: '2'
      notify_email:
        type: string
        default: ''
      teams_webhook:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
        default: 'ruby-linux-slurm-scale-runner'
      artifact_run_id:
        description: 'Reuse artifacts from a previous build run ID'
        type: string
      workload:
        description: 'MADEngine workload to run'
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        description: 'Number of SLURM nodes to allocate'
        type: string
        default: '2'
      notify_email:
        description: 'Email address to send test summary report'
        type: string
        default: ''
      teams_webhook:
        description: 'Teams webhook URL for notifications'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test_madengine:
    name: 'Test MADEngine ${{ inputs.workload }} (${{ inputs.nodes }}N)'
    runs-on: ${{ inputs.test_runs_on }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - name: Probe docker group propagation
        run: |
          set +e
          echo "SHARD=${{ matrix.shard }} runner=${RUNNER_NAME} host=$(hostname)"
          echo "--- credentials of THIS job process ---"
          echo "  id: $(id)"
          echo "  /proc/self/status Groups: $(grep ^Groups /proc/self/status)"
          echo "--- what the directory says right now ---"
          echo "  id -nG z1_coco: $(id -nG z1_coco 2>&1)"
          echo "  getent group docker: $(getent group docker 2>&1)"
          echo "--- docker ---"
          echo "  docker ps -a: $(docker ps -a 2>&1 | head -2 | tr '\n' '|')"
          echo "  docker info: $(docker info 2>&1 | grep -iE 'permission|ServerVersion|ERROR' | head -2 | tr '\n' '|')"
          echo "  socket: $(ls -l /var/run/docker.sock 2>&1)"
          echo "--- runner service process ---"
          for pid in $(pgrep -f Runner.Listener | head -2); do
            echo "  pid=$pid started=$(ps -o lstart= -p $pid 2>/dev/null)"
            echo "  groups of runner proc: $(grep ^Groups /proc/$pid/status 2>/dev/null)"
          done
          exit 0
