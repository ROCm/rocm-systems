name: TheRock Test MADEngine Workloads for rccl

# Diagnostic only. /tmp is private per job (job_container/tmpfs), so dockerd
# cannot see it. This probe asks which alternative workspace root *is* visible.

on:
  workflow_dispatch:
    inputs:
      amdgpu_families:
        type: string
        default: 'gfx950-dcgpu'
      artifact_group:
        type: string
        default: 'gfx950-dcgpu'
      test_runs_on:
        type: string
        default: 'ruby-linux-slurm-scale-runner'
      artifact_run_id:
        type: string
        default: ''
      workload:
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        type: string
        default: '2'
      notify_email:
        type: string
        default: ''
      teams_webhook:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  probe:
    name: 'Probe workspace roots'
    runs-on: ${{ inputs.test_runs_on }}
    steps:
      - name: Probe
        shell: bash
        run: |
          set -uo pipefail
          cat > probe_task.sh <<'TASK'
          #!/bin/bash
          echo "=============================================================="
          echo "node=$(hostname) procid=${SLURM_PROCID:-?} job=${SLURM_JOB_ID:-?}"

          IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null \
                | grep -v '<none>' | head -1)
          if [ -z "$IMG" ]; then
            echo "INCONCLUSIVE - no local docker image"
            exit 0
          fi

          try_root() {
            root="$1"
            printf '%-42s ' "$root"
            if [ ! -d "$root" ]; then echo "ABSENT"; return; fi
            if [ ! -w "$root" ]; then echo "NOT-WRITABLE"; return; fi
            d="$root/probe_${SLURM_JOB_ID:-$$}_${SLURM_PROCID:-0}"
            mkdir -p "$d" 2>/dev/null || { echo "MKDIR-FAILED"; return; }
            echo "i-am-the-marker" > "$d/marker.txt" 2>/dev/null \
              || { echo "WRITE-FAILED"; rm -rf "$d"; return; }
            out=$(docker run --rm -v "$d":/probe --entrypoint sh "$IMG" \
                    -c 'cat /probe/marker.txt 2>/dev/null' 2>/dev/null)
            if echo "$out" | grep -q "i-am-the-marker"; then
              echo "VISIBLE"
            else
              echo "NOT-VISIBLE"
            fi
            rm -rf "$d"
          }

          echo "--- candidate workspace roots ---"
          try_root /tmp
          try_root /var/tmp
          try_root /dev/shm
          try_root "$HOME"
          try_root /apps/rccl-ci/madengine
          try_root /scratch
          try_root /local

          echo "--- df of the promising ones ---"
          df -h /var/tmp /apps/rccl-ci/madengine 2>/dev/null | sed 's/^/  /'
          TASK
          chmod +x probe_task.sh

          srun --partition=meta64 \
               --nodes="${{ inputs.nodes }}" \
               --ntasks="${{ inputs.nodes }}" \
               --ntasks-per-node=1 \
               --time=00:10:00 \
               --job-name=madengine-root-probe \
               --label \
               ./probe_task.sh
