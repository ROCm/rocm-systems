name: TheRock Test MADEngine Workloads for rccl

on:
  workflow_call:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
      artifact_run_id:
        type: string
      workload:
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        type: string
        default: '2'
      notify_email:
        type: string
        default: ''
      teams_webhook:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
        default: 'ruby-linux-slurm-scale-runner'
      artifact_run_id:
        description: 'Reuse artifacts from a previous build run ID'
        type: string
      workload:
        description: 'MADEngine workload to run'
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        description: 'Number of SLURM nodes to allocate'
        type: string
        default: '2'
      notify_email:
        description: 'Email address to send test summary report'
        type: string
        default: ''
      teams_webhook:
        description: 'Teams webhook URL for notifications'
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  test_madengine:
    name: 'Test MADEngine ${{ inputs.workload }} (${{ inputs.nodes }}N)'
    runs-on: ${{ inputs.test_runs_on }}
    env:
      OUTPUT_ARTIFACTS_DIR: "./build"
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "ROCm/TheRock"
          ref: a30607adeaf0306b8d8edcbf4f1f1bc8299d3e1e # 2026-08-24
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: python3 -m pip install -r requirements.txt
      - name: Fetch artifacts
        run: |
          python3 build_tools/install_rocm_from_artifacts.py \
            --run-id=33600170341 --artifact-group=gfx950-dcgpu \
            --output-dir="${OUTPUT_ARTIFACTS_DIR}" --rccl 2>&1 | tail -2
      - name: Resolve librccl deps inside the base image
        run: |
          set +e
          ART="${GITHUB_WORKSPACE}/build"
          echo "artifacts at $ART"
          timeout 1800 srun -N1 --ntasks-per-node=1 -p meta64 -t 20 \
            --job-name=depcheck bash -c "
              echo '=== '\$(hostname -s)' ===';
              docker run --rm -v $ART:/art:ro rocm/primus:v26.4 bash -c '
                echo \"--- ldd of the CI librccl inside the image ---\";
                ldd /art/lib/librccl.so 2>&1 | sed \"s|^|  |\" | head -20;
                echo \"--- unresolved ---\";
                ldd /art/lib/librccl.so 2>&1 | grep \"not found\" | sed \"s|^|  |\";
              ' 2>&1 | tail -30;
            " 2>&1 | head -40
          echo "--- what the artifacts could supply ---"
          for l in libamd_smi librocm-core libhsa-runtime64 libroctx64 librocprofiler-register libamdhip64; do
            printf '  %-26s %s\n' "$l" "$(find "$ART" -name "$l.so*" -printf '%f ' 2>/dev/null | head -c 120)"
          done
          exit 0
