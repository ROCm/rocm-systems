name: TheRock Test MADEngine Workloads for rccl

# Diagnostic only. The admin says the backing store for a job's private /tmp is
# /scratch/slurm/<job_id>. If that path is reachable and writable from inside
# the job AND visible to the docker daemon, we need nothing from them: pointing
# SLURM_TMPDIR there fixes the bind mount and keeps the plugin's own cleanup.

on:
  workflow_dispatch:
    inputs:
      amdgpu_families:
        type: string
        default: 'gfx950-dcgpu'
      artifact_group:
        type: string
        default: 'gfx950-dcgpu'
      test_runs_on:
        type: string
        default: 'ruby-linux-slurm-scale-runner'
      artifact_run_id:
        type: string
        default: ''
      workload:
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        type: string
        default: '2'
      notify_email:
        type: string
        default: ''
      teams_webhook:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  probe:
    name: 'Probe /scratch/slurm backing store'
    runs-on: ${{ inputs.test_runs_on }}
    steps:
      - name: Probe
        shell: bash
        run: |
          set -uo pipefail
          cat > probe_task.sh <<'TASK'
          #!/bin/bash
          echo "=============================================================="
          echo "node=$(hostname) procid=${SLURM_PROCID:-?} job=${SLURM_JOB_ID:-?}"

          BACKING=/scratch/slurm/${SLURM_JOB_ID}

          echo "--- is the backing store there ---"
          ls -ld /scratch /scratch/slurm "$BACKING" 2>&1 | sed 's/^/  /'

          echo "--- is a job's /tmp the same storage as the backing store ---"
          echo "written-via-tmp" > /tmp/probe_marker.txt 2>/dev/null \
            && echo "  wrote /tmp/probe_marker.txt" || echo "  cannot write /tmp"
          if [ -f "$BACKING/probe_marker.txt" ]; then
            echo "  SAME-STORAGE: the file shows up at $BACKING"
          else
            echo "  DIFFERENT: not visible at $BACKING"
            ls -A "$BACKING" 2>&1 | head -5 | sed 's/^/    /'
          fi

          echo "--- can the job write to the backing path directly ---"
          D="$BACKING/probe_direct_${SLURM_PROCID:-0}"
          if mkdir -p "$D" 2>/dev/null && echo "i-am-the-marker" > "$D/marker.txt" 2>/dev/null; then
            echo "  WRITABLE: $D"
          else
            echo "  NOT-WRITABLE: $D"
            exit 0
          fi

          echo "--- does the docker daemon see it ---"
          IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null \
                | grep -v '<none>' | head -1)
          if [ -z "$IMG" ]; then echo "  INCONCLUSIVE - no local image"; exit 0; fi
          out=$(docker run --rm -v "$D":/probe --entrypoint sh "$IMG" \
                  -c 'cat /probe/marker.txt 2>/dev/null' 2>/dev/null)
          if echo "$out" | grep -q "i-am-the-marker"; then
            echo "  RESULT: VISIBLE - SLURM_TMPDIR=$BACKING is the fix"
          else
            echo "  RESULT: NOT-VISIBLE - backing path does not help"
          fi

          echo "--- space ---"
          df -h "$BACKING" 2>&1 | sed 's/^/  /'
          TASK
          chmod +x probe_task.sh

          srun --partition=meta64 \
               --nodes="${{ inputs.nodes }}" \
               --ntasks="${{ inputs.nodes }}" \
               --ntasks-per-node=1 \
               --time=00:10:00 \
               --job-name=madengine-scratch-probe \
               --label \
               ./probe_task.sh
