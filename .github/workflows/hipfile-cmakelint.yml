# Run cmakelint over the CMake files

name: "hipFile cmakelint"

on:
  push:
    branches: [develop]
    paths:
      - 'projects/hipfile/**.cmake'
      - 'projects/hipfile/**/CMakeLists.txt'
      - 'projects/hipfile/.cmakelintrc'
      - '.github/workflows/hipfile-cmakelint.yml'
  pull_request:
    paths:
      - 'projects/hipfile/**.cmake'
      - 'projects/hipfile/**/CMakeLists.txt'
      - 'projects/hipfile/.cmakelintrc'
      - '.github/workflows/hipfile-cmakelint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hipfile-cmakelint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            projects/hipfile
            .github/workflows

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up cmakelint
        run: |
          python -m pip install --upgrade pip
          python -m pip install cmakelint

      - name: Lint all CMake files
        run: |
          cd projects/hipfile
          FILES=$(find . -type f \( -name "CMakeLists.txt" -o -name "*.cmake" \))
          if [ -z "$FILES" ]; then
            echo "No CMake files found!"
            exit 1
          fi
          echo "Linting the following files:"
          echo "$FILES"
          cmakelint $FILES
