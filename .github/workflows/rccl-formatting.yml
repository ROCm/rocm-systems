# Formatting checks for projects/rccl/.
#
# The job below MUST stay named `pre-commit`. therock-pr-bot declares
# `required_check_runs: [pre-commit]` (tools/systems_pr_bot/policy.yml) and that
# is the repo's only merge-gating check; renaming the job renames the published
# check-run and every rccl PR goes back to failing with "Timed out waiting for
# required checks to complete".
#
# TODO(AITESTAUTO-6995): fold this into a shared / TheRock-packaged formatting
# job once the per-project *-formatting.yml sprawl is consolidated, so packages
# aren't each carrying their own copy. Note this cannot simply reuse
# pre-formatting.yml as it stands: that job runs the repo-root config, whose
# clang-format is pinned to v18.1.4, and projects/rccl/.clang-format uses
# clang-format 22 keys that v18 cannot parse at all (it exits 1 with
# "unknown key 'AlignPPAndNotPP'"). Consolidating therefore requires bumping the
# root pin to 22.x first, which reformats every other project in the repo.
name: "rccl-formatting"

on:
  pull_request:
    branches:
      - develop
      # Matches systems-pr-bot.yml's own trigger. Without it, an rccl PR
      # targeting pr-bot-test is gated by the bot with no producer for the
      # required `pre-commit` check-run, and waits out the 900s timeout.
      - pr-bot-test
    # Only files under these paths trigger this check.
    #
    # Keep `projects/rccl/**` broad -- docs included. Narrowing it (e.g. to
    # exclude docs/) means a docs-only rccl PR publishes no `pre-commit`
    # check-run at all, which reintroduces the therock-pr-bot timeout this
    # workflow exists to fix.
    #
    # The repo-root .pre-commit-config.yaml is deliberately NOT listed: it is
    # also watched by rocjitsu-formatting.yml, whose job is likewise named
    # `pre-commit`, and the bot collapses same-named check-runs last-wins.
    paths:
      - "projects/rccl/**"
      - ".github/workflows/rccl-formatting.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    # A formatting job should finish in ~2 minutes; the 360-minute default just
    # burns a runner if pip or a hook mirror hangs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Sparse checkout controls which files are on disk, and therefore
          # which files pre-commit can check. Both entries are load-bearing:
          # projects/rccl for the sources and its .pre-commit-config.yaml,
          # .github for this workflow file.
          sparse-checkout: |
            projects/rccl
            .github

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - run: pip install pre-commit

      - name: Run pre-commit on changed rccl files
        # Passed through env: rather than interpolated into the shell body, per
        # the workflow hardening in c07b6e644f1 ("ci: harden security for
        # workflows", #9701).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # pipefail matters here: GitHub's default shell is `bash -e {0}`, and
          # errexit only inspects the LAST stage of a pipeline. Without it a
          # failing `git diff` yields an empty file list, which this script then
          # reports as "nothing to check" and exits 0 -- a silent green on the
          # repo's only required check.
          set -euo pipefail

          # Find the common ancestor between the PR base and head.
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "merge-base: $MERGE_BASE"

          # Files added, copied, modified or renamed by the PR. HEAD is the
          # pull-request merge commit in GitHub Actions, so diff against the PR
          # head SHA directly to avoid checking files that changed only on the
          # target branch. Kept as a bare assignment (not a pipeline) so that
          # `set -e` aborts the job if git fails.
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$MERGE_BASE" "$HEAD_SHA")

          # Keep only paths present on disk; the sparse checkout omits the rest.
          FILES=()
          while IFS= read -r f; do
            if [ -n "$f" ] && [ -f "$f" ]; then FILES+=("$f"); fi
          done <<< "$CHANGED"

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No checked-in files changed in sparse checkout, skipping."
            exit 0
          fi

          echo "Checking ${#FILES[@]} file(s):"
          printf '  %s\n' "${FILES[@]}"

          # --show-diff-on-failure is required, not cosmetic: every hook in the
          # rccl config is a fixer, so without it a red run prints only
          # "files were modified by this hook" -- no filename, no diff -- and
          # that is the entire signal a contributor gets from the merge gate.
          pre-commit run -c projects/rccl/.pre-commit-config.yaml \
            --show-diff-on-failure --color=always \
            --files "${FILES[@]}"
