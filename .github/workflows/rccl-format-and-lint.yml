name: RCCL format and lint

# Every check in here is driven by projects/rccl/.pre-commit-config.yaml, so
# that the list of checks lives in one file and a developer can run locally
# exactly what CI runs.
#
# Two jobs rather than one: the pre-commit job finishes in about 30 seconds on
# a bare runner, while clang-tidy needs the ROCm container, three minutes of
# which is pulling the image. Sharing a job would put formatting feedback
# behind that pull for no benefit.

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'projects/rccl/**'
      - '.github/workflows/rccl-format-and-lint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout rccl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The hooks run against the files changed in the PR, and working out
          # which those are needs the base commit; a shallow clone has no such
          # history. Measured at 13s on this repository.
          fetch-depth: 0
          sparse-checkout: |
            projects/rccl
            .github

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit hook environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('projects/rccl/.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      - name: Run pre-commit on changed files
        run: |
          pre-commit run \
            --config projects/rccl/.pre-commit-config.yaml \
            --from-ref ${{ github.event.pull_request.base.sha }} \
            --to-ref ${{ github.event.pull_request.head.sha }}

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    # The findings are advisory, so a failure here must not read as a gate.
    # The job also depends on fetching NVIDIA/nccl, and an outage there should
    # not block a pull request either. The findings are in the step summary.
    continue-on-error: true
    # Observed at 5m33s, of which 3m04s is the image pull. Generous enough for
    # a slow pull, tight enough to catch a hang.
    timeout-minutes: 15
    container:
      image: rocm/dev-ubuntu-26.04:10.1.0-full
    env:
      ROCM_PATH: /opt/rocm
      GPU_TARGETS: gfx942
      RCCL_CLANG_TIDY_BUILD_DIR: ${{ github.workspace }}/projects/rccl/build/clang-tidy
    steps:
      - name: Install build deps
        # Before the checkout, deliberately. actions/checkout needs git on
        # PATH; without it it silently falls back to downloading a tarball via
        # the REST API, which leaves no .git directory and ignores
        # sparse-checkout. Installing everything here keeps that ordering
        # requirement from being something anyone has to remember.
        #
        # Only what configure + hipify need. Nothing is compiled and the tests
        # are not built, so the test libraries, lcov and ccache are not
        # installed. python3-venv is for pre-commit, which drives the hook.
        #
        # Checked against rocm/dev-ubuntu-26.04:10.1.0-full; build-essential,
        # perl and python3 are already present, and are listed anyway so the
        # job keeps working if a later image drops them. cmake, git and
        # rocm-cmake are not present. Without rocm-cmake, CMake downloads and
        # builds it from GitHub.
        run: |
          apt-get update
          apt-get install --assume-yes --no-install-recommends \
            build-essential \
            cmake \
            git \
            perl \
            python3 \
            python3-venv \
            rocm-cmake

      - name: Checkout rccl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No fetch-depth: this analyses the tree, not a diff, so no merge
          # base and no history are needed.
          sparse-checkout: projects/rccl

      - name: Put ROCm on PATH
        run: echo "/opt/rocm/bin" >> "$GITHUB_PATH"

      - name: Fetch the NCCL ref used to tell RCCL-owned files from upstream
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add nccl https://github.com/NVIDIA/nccl.git
          git remote set-url --push nccl no_push
          git fetch --no-tags --depth=1 --filter=blob:none nccl master

      - name: Install pre-commit
        # In a venv: the image's python3 is externally managed, so a plain
        # `pip install` refuses to touch it.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pre-commit
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Run clang-tidy
        # A manual-stage hook, so it is listed alongside the other checks but
        # never runs on `git commit`, where its build step would be unwelcome.
        run: |
          pre-commit run \
            --config projects/rccl/.pre-commit-config.yaml \
            --hook-stage manual \
            clang-tidy

      - name: Summarise findings
        if: always()
        run: |
          FINDINGS="$RCCL_CLANG_TIDY_BUILD_DIR/clang-tidy-findings.txt"
          {
            echo "## clang-tidy (advisory)"
            echo
            if [ ! -s "$FINDINGS" ]; then
              echo "No findings in RCCL-owned files."
            else
              echo "$(wc -l < "$FINDINGS") finding(s) in RCCL-owned files:"
              echo
              echo '```'
              cat "$FINDINGS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rccl-clang-tidy-findings
          path: projects/rccl/build/clang-tidy/clang-tidy-*.txt
          if-no-files-found: warn
