name: RCCL format and lint

# Every check in here is driven by projects/rccl/.pre-commit-config.yaml, so
# that the list of checks lives in one file and a developer can run locally
# exactly what CI runs.
#
# Two jobs rather than one: the pre-commit job finishes in about 30 seconds on
# a bare runner, while clang-tidy needs the ROCm container, three minutes of
# which is pulling the image. Sharing a job would put formatting feedback
# behind that pull for no benefit.

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'projects/rccl/**'
      - '.github/workflows/rccl-format-and-lint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout rccl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The hooks run against the files changed in the PR, and working out
          # which those are needs the base commit; a shallow clone has no such
          # history. Measured at 13s on this repository.
          fetch-depth: 0
          sparse-checkout: |
            projects/rccl
            .github

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit hook environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('projects/rccl/.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      - name: Run pre-commit on changed files
        run: |
          pre-commit run \
            --config projects/rccl/.pre-commit-config.yaml \
            --from-ref ${{ github.event.pull_request.base.sha }} \
            --to-ref ${{ github.event.pull_request.head.sha }}

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    # The findings are advisory, so a failure here must not read as a gate.
    # The job also depends on fetching NVIDIA/nccl, and an outage there should
    # not block a pull request either. The findings are in the step summary.
    continue-on-error: true
    # Observed at 5m33s, of which 3m04s is the image pull. Generous enough for
    # a slow pull, tight enough to catch a hang.
    timeout-minutes: 15
    container:
      image: rocm/dev-ubuntu-26.04:10.1.0-full
    env:
      ROCM_PATH: /opt/rocm
      GPU_TARGETS: gfx942
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install --assume-yes --no-install-recommends git

      - name: Checkout rccl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No fetch-depth: this analyses the tree, not a diff, so no merge
          # base and no history are needed.
          sparse-checkout: projects/rccl

      - name: Run clang-tidy
        run: projects/rccl/maint/ci-clang-tidy.sh

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rccl-clang-tidy-findings
          path: projects/rccl/build/clang-tidy/clang-tidy-*.txt
          if-no-files-found: warn
