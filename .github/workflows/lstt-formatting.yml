name: LSTT Formatting

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/lstt-formatting.yml"
      - "projects/rdc/**"
      - "projects/amdsmi/**"
      - "projects/rocm-smi-lib/**"
      - "!**/*.md"
      - "!**/*.rtf"
      - "!**/*.rst"
      - "!**/.readthedocs.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [rdc, amdsmi, rocm-smi-lib]

    name: ${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: projects/${{ matrix.project }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        working-directory: projects/${{ matrix.project }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'develop' }}
        run: >
          pre-commit run
          --show-diff-on-failure
          --color=always
          --from-ref "origin/${BASE_REF}"
          --to-ref HEAD
