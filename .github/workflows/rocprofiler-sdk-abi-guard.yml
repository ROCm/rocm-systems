name: Rocprofiler-SDK ABI Guard
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  abi:
    uses: ./.github/workflows/abi-guard.yml
    with:
      # required inputs:
      versioning_spec: "projects/rocprofiler-sdk/versioning.yml"
      source_directory: "projects/rocprofiler-sdk"
      # optional tweaks:
      cmake_config_args: "-DROCPROFILER_BUILD_DEBUG=ON"
      cmake_build_type: "RelWithDebInfo"
      install_packages: "libsqlite3-dev libdw-dev"
      container: "rocm/dev-ubuntu-22.04:7.0.2"
      # rocprofiler-sdk build has hidden folders in build tree:
      #  - build/external/packages/otf2-source-src/build-backend/.libs
      #  - build/external/packages/otf2-source-src/build-backend/.deps
      # which aren't preserved/restored properly by the cache action, so we disable it.
      use_cached_build: false
