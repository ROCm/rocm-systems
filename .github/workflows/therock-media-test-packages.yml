# DEPRECATED: retained solely for media-libs-ci.yml.
#
# Sibling of the TheRock single-arch test workflows removed in b7ae4f90d3a.
# media-libs-ci.yml is now its only consumer.
#
# Do not add new callers. Slated for removal once media libs CI moves to
# TheRock's multi-arch pipeline (therock-multi-arch-ci.yml).

# TBD: Add customer test cases
name: TheRock Test Packages for media libs

on:
  workflow_call:
    inputs:
      amdgpu_families:
        type: string
      test_runs_on:
        type: string
      platform:
        type: string
      artifact_run_id:
        type: string
        default: ""
    secrets:
      # Read access to the private bucket holding the rocDecode conformance
      # stream corpus. Forwarded to the rocdecode job only.
      ROCDECODE_AWS_ACCESS_KEY_ID:
        required: false
      ROCDECODE_AWS_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  test_rocdecode:
    name: 'Test rocdecode'
    if: ${{ inputs.platform == 'linux' }}
    uses: './.github/workflows/therock-test-component.yml'
    secrets:
      ROCDECODE_AWS_ACCESS_KEY_ID: ${{ secrets.ROCDECODE_AWS_ACCESS_KEY_ID }}
      ROCDECODE_AWS_SECRET_ACCESS_KEY: ${{ secrets.ROCDECODE_AWS_SECRET_ACCESS_KEY }}
    with:
      artifact_run_id: ${{ inputs.artifact_run_id }}
      amdgpu_families: ${{ inputs.amdgpu_families }}
      test_runs_on: ${{ inputs.test_runs_on }}
      platform: "linux"
      # The conformance sweep downloads and unpacks a multi-GiB corpus, builds
      # the videoDecode sample and then decodes several hundred streams per
      # codec, each as its own process, so the budget here is dominated by the
      # sweep rather than by CTest.
      #
      # boto3 fetches the corpus and is already present: setup_test_environment
      # runs `uv pip install -r requirements-test.txt` into VENV_DIR before this
      # step, and that pulls in boto3/botocore/s3transfer. Nothing is installed
      # here -- that venv is built by uv and has no pip in it, so `python -m pip`
      # fails outright. If boto3 ever stops arriving that way the sweep does not
      # quietly skip: run_conformance_sweep.py treats a missing SDK under
      # GITHUB_ACTIONS as a hard error.
      component: >-
        {
          "job_name": "rocdecode",
          "fetch_artifact_args": "--rocdecode --tests",
          "timeout_minutes": 60,
          "test_script": "python ./build/share/rocdecode/test/run_rocdecode.py",
          "shard_arr": [1],
          "total_shards": 1,
          "test_type": "full",
          "container_image": "ghcr.io/rocm/no_rocm_image_ubuntu24_04_media@sha256:d715ae2db664b055c90343e00588ce9ac3eec387513fe359396e5e08e75521ca",
          "container_options": "--ipc host --group-add video --device /dev/kfd --device /dev/dri --group-add 992 --group-add 110 --ulimit memlock=-1:-1 --security-opt seccomp=unconfined --env-file /etc/podinfo/gha-gpu-isolation-settings --user 0:0"
        }

  test_rocjpeg:
    name: 'Test rocjpeg'
    if: ${{ inputs.platform == 'linux' }}
    uses: './.github/workflows/therock-test-component.yml'
    with:
      artifact_run_id: ${{ inputs.artifact_run_id }}
      amdgpu_families: ${{ inputs.amdgpu_families }}
      test_runs_on: ${{ inputs.test_runs_on }}
      platform: "linux"
      component: >-
        {
          "job_name": "rocjpeg",
          "fetch_artifact_args": "--rocjpeg --tests",
          "timeout_minutes": 10,
          "test_script": "python ./build/share/rocjpeg/test/run_rocjpeg.py",
          "shard_arr": [1],
          "total_shards": 1,
          "test_type": "full",
          "container_image": "ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98",
          "container_options": "--ipc host --group-add video --device /dev/kfd --device /dev/dri --group-add 992 --group-add 110 --ulimit memlock=-1:-1 --security-opt seccomp=unconfined --env-file /etc/podinfo/gha-gpu-isolation-settings --user 0:0"
        }
