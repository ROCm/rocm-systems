name: hipfile-ci
run-name: Main hipFile CI workflow to coordinate jobs for a single platform

on:
  workflow_call:
    inputs:
      ci_image:
        description: "Full CI image name & tag"
        required: true
        type: string
      cxx_compiler:
        description: "C++ compiler to use"
        required: true
        type: string
      cxx_standard:
        description: "C++ standard to use for building"
        required: true
        type: number
      platform:
        required: true
        type: string
      rocm_version:
        description: "Target ROCm MAJOR.MINOR.PATCH Version"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  build_and_test:
    uses: ./.github/workflows/hipfile-build.yml
    with:
      ci_image: ${{ inputs.ci_image }}
      cxx_compiler: ${{ inputs.cxx_compiler }}
      cxx_standard: ${{ inputs.cxx_standard }}
      generate_coverage: ${{ inputs.cxx_standard == 20 && inputs.cxx_compiler == 'amdclang++' }}
      platform: ${{ inputs.platform }}
      rocm_version: ${{ inputs.rocm_version }}
      upload_artifacts: true

  python_bindings:
    needs: [build_and_test]
    uses: ./.github/workflows/hipfile-python-bindings.yml
    with:
      ais_hipfile_pkg_dev_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_dev_filename }}
      ais_hipfile_pkg_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_filename }}
      ci_image: ${{ needs.build_and_test.outputs.ci_image }}
      cxx_compiler: ${{ inputs.cxx_compiler }}
      cxx_standard: ${{ inputs.cxx_standard }}
      platform: ${{ inputs.platform }}
      rocm_version: ${{ inputs.rocm_version }}
      # python/tests/main.py is an end-to-end hardware exercise of the bindings, and
      # is platform/compiler/standard independent, so run it once on an AIS
      # runner for a single representative leg rather than fanning it out. This
      # is the same ubuntu-10.2.0 leg codeql/sanitizers/clang_tidy target.
      run_hardware_test: ${{ inputs.platform == 'ubuntu' && inputs.cxx_compiler == 'amdclang++' && inputs.cxx_standard == 20 && inputs.rocm_version == '10.2.0' }}

  # The system tests run on the self-hosted AIS runners, so they only run on
  # the production amdclang++ C++20 legs. The clang++, g++, and C++23 legs
  # exist to check that hipFile builds and passes its unit tests with other
  # compilers and standards; re-running the storage suites on them would
  # mostly repeat the same kernel, driver, and filesystem coverage.
  AIS_system_tests:
    if: ${{ inputs.cxx_compiler == 'amdclang++' && inputs.cxx_standard == 20 }}
    needs: [build_and_test]
    uses: ./.github/workflows/hipfile-ci-system.yml
    with:
      ais_hipfile_pkg_dev_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_dev_filename }}
      ais_hipfile_pkg_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_filename }}
      ais_mount_path: /mnt/ais/ext4
      ci_image: ${{ needs.build_and_test.outputs.ci_image }}
      cxx_compiler: ${{ inputs.cxx_compiler }}
      cxx_standard: ${{ inputs.cxx_standard }}
      mount_label: system_ext4
      platform: ${{ inputs.platform }}
      rocm_version: ${{ inputs.rocm_version }}

  AIS_system_xfs_tests:
    if: ${{ inputs.cxx_compiler == 'amdclang++' && inputs.cxx_standard == 20 }}
    needs: [build_and_test]
    uses: ./.github/workflows/hipfile-ci-system.yml
    with:
      ais_hipfile_pkg_dev_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_dev_filename }}
      ais_hipfile_pkg_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_filename }}
      ais_mount_path: /mnt/ais/xfs
      ci_image: ${{ needs.build_and_test.outputs.ci_image }}
      cxx_compiler: ${{ inputs.cxx_compiler }}
      cxx_standard: ${{ inputs.cxx_standard }}
      mount_label: system_xfs
      platform: ${{ inputs.platform }}
      rocm_version: ${{ inputs.rocm_version }}

  AIS_system_lvm16_tests:
    if: ${{ inputs.cxx_compiler == 'amdclang++' && inputs.cxx_standard == 20 }}
    needs: [build_and_test]
    uses: ./.github/workflows/hipfile-ci-system.yml
    with:
      ais_hipfile_pkg_dev_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_dev_filename }}
      ais_hipfile_pkg_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_filename }}
      ais_mount_path: /mnt/ais/lvm16
      ci_image: ${{ needs.build_and_test.outputs.ci_image }}
      cxx_compiler: ${{ inputs.cxx_compiler }}
      cxx_standard: ${{ inputs.cxx_standard }}
      mount_label: system_lvm16
      platform: ${{ inputs.platform }}
      rocm_version: ${{ inputs.rocm_version }}

  AIS_system_lvm_mirror_tests:
    if: ${{ inputs.cxx_compiler == 'amdclang++' && inputs.cxx_standard == 20 }}
    needs: [build_and_test]
    uses: ./.github/workflows/hipfile-ci-system.yml
    with:
      ais_hipfile_pkg_dev_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_dev_filename }}
      ais_hipfile_pkg_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_filename }}
      ais_mount_path: /mnt/ais/lvm_mirror
      ci_image: ${{ needs.build_and_test.outputs.ci_image }}
      cxx_compiler: ${{ inputs.cxx_compiler }}
      cxx_standard: ${{ inputs.cxx_standard }}
      mount_label: system_lvm_mirror
      platform: ${{ inputs.platform }}
      rocm_version: ${{ inputs.rocm_version }}

  AIS_system_mdraid0_tests:
    if: ${{ inputs.cxx_compiler == 'amdclang++' && inputs.cxx_standard == 20 }}
    needs: [build_and_test]
    uses: ./.github/workflows/hipfile-ci-system.yml
    with:
      ais_hipfile_pkg_dev_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_dev_filename }}
      ais_hipfile_pkg_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_filename }}
      ais_mount_path: /mnt/ais/mdraid0
      ci_image: ${{ needs.build_and_test.outputs.ci_image }}
      cxx_compiler: ${{ inputs.cxx_compiler }}
      cxx_standard: ${{ inputs.cxx_standard }}
      mount_label: system_mdraid0
      platform: ${{ inputs.platform }}
      rocm_version: ${{ inputs.rocm_version }}

  AIS_system_nfs_tests:
    if: ${{ inputs.cxx_compiler == 'amdclang++' && inputs.cxx_standard == 20 }}
    needs: [build_and_test]
    uses: ./.github/workflows/hipfile-ci-system.yml
    with:
      ais_hipfile_pkg_dev_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_dev_filename }}
      ais_hipfile_pkg_filename: ${{ needs.build_and_test.outputs.ais_hipfile_pkg_filename }}
      ais_mount_path: /mnt/ais/nfs
      ci_image: ${{ needs.build_and_test.outputs.ci_image }}
      cxx_compiler: ${{ inputs.cxx_compiler }}
      cxx_standard: ${{ inputs.cxx_standard }}
      mount_label: system_nfs
      platform: ${{ inputs.platform }}
      rocm_version: ${{ inputs.rocm_version }}
