name: "rocjitsu-handbook"

on:
  pull_request:
    paths:
      # Source links can target any file within Rocjitsu.
      - "emulation/rocjitsu/**"
      - "!emulation/rocjitsu/docs/sphinx/**"
      - ".github/workflows/rocjitsu-handbook-test.yml"
      - ".github/workflows/rocjitsu-publish-website.yml"
  push:
    branches:
      - develop
    paths:
      - "emulation/rocjitsu/**"
      - "!emulation/rocjitsu/docs/sphinx/**"
      - ".github/workflows/rocjitsu-handbook-test.yml"
      - ".github/workflows/rocjitsu-publish-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify rocjitsu handbook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: emulation/rocjitsu/website/handbook
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: emulation/rocjitsu/website/handbook/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Build handbook
        run: .venv/bin/python -m mkdocs build --strict -f mkdocs.yml

      - name: Test canonical documentation publishing
        run: .venv/bin/python -m unittest discover -s tests

      - name: Set up Node.js for browser-script tests
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"

      - name: Test repository counts
        run: node --test tests/repository-stats.test.cjs
