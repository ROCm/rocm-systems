name: RCCL coco run

# Reusable launcher for the coco harness (ROCm/tRCCL). One call runs one coco
# job to completion and reports its exit status.
#
# `runs_on` and `job` are a matched pair: each coco job is bound in tRCCL to
# the machine it expects and cannot be repointed from here, so a job meant for
# the ruby cluster must be paired with a ruby runner label.
on:
  workflow_call:
    inputs:
      mode:
        description: 'coco subcommand: run or pr.'
        type: string
        required: false
        default: 'run'
      runs_on:
        description: 'Runner label to run on.'
        type: string
        required: true
      job:
        description: 'coco job key to run.'
        type: string
        required: true
      concurrency_group:
        description: 'Concurrency group, set by the caller so each job serialises independently.'
        type: string
        required: true
      coco_ref:
        description: 'ROCm/tRCCL git ref (commit, tag, or branch) to check out the harness at.'
        type: string
        required: false
        default: 'main'
      trigger_kind:
        description: 'coco --trigger-kind, recorded against the run. Required, so a caller that does not wire it through fails rather than mislabelling its run.'
        type: string
        required: true
      coco_args:
        description: 'Additional coco flags, word-split verbatim (e.g. "-vv --prune-build").'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'Pull request number (mode=pr).'
        type: string
        required: false
        default: ''
      pr_sha:
        description: 'PR head SHA, 40 hex (mode=pr).'
        type: string
        required: false
        default: ''
      pr_repo:
        description: 'Monorepo slug (mode=pr).'
        type: string
        required: false
        default: 'ROCm/rocm-systems'
      software:
        description: 'Component to swap to PR head (mode=pr).'
        type: string
        required: false
        default: 'rccl'
      build_only:
        description: >-
          Pass --build-only to `coco pr` (mode=pr only): compile every stack in
          the job config and run no tests. The paired smoke job runs as a
          separate caller against the same per-run directory once this one has
          finished, so it reads those stacks from coco's cache rather than
          compiling them again.
        type: boolean
        required: false
        default: false
      timeout_minutes:
        description: 'Job timeout in minutes.'
        type: number
        required: false
        default: 600
    secrets:
      APP_ID:
        description: 'GitHub App ID, used to mint a read token for the coco harness repository.'
        required: true
      APP_PRIVATE_KEY:
        description: 'Private key for APP_ID.'
        required: true
      RCCL_COCO_DB_URL:
        description: 'coco database URL for result ingest. Omit to run without publishing.'
        required: false
    outputs:
      ephemeral_dir:
        description: >-
          The per-run directory this job built into, set for mode=pr only and
          empty otherwise. Both halves of a PR gate report the same path, and
          it stays on disk after the job ends so the other half can still be
          using it; the caller is responsible for deleting it once both have
          finished.
        value: ${{ jobs.coco.outputs.ephemeral_dir }}

permissions:
  contents: read

jobs:
  coco:
    # Must not vary per PR: this becomes the second half of the
    # "<caller job> / <this job>" status-check name that branch protection
    # matches on literally. The PR number is in the run summary instead.
    name: ${{ inputs.job }}
    # workflow_call has no allow-list of callers: any repository can invoke
    # this by full reference and reach these self-hosted runners.
    # github.repository is the caller's, so this confines it to this repo.
    if: github.repository == 'ROCm/rocm-systems'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      ephemeral_dir: ${{ steps.artifact_dir.outputs.ephemeral }}
    # Queue rather than cancel: two runs in one group are distinct work, such
    # as a nightly and a manual dispatch. Superseding an earlier run is a PR
    # concern, handled by the caller's workflow-level concurrency.
    concurrency:
      group: ${{ inputs.concurrency_group }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      LOG_FILE: ${{ github.workspace }}/coco-${{ inputs.mode }}-${{ inputs.job }}-${{ github.run_id }}.log
      COCO_DIR: ${{ github.workspace }}/_coco-${{ github.run_id }}-${{ github.run_attempt }}
      ARTIFACT_NAME: coco-${{ inputs.mode }}-${{ inputs.job }}${{ inputs.mode == 'pr' && format('-pr{0}', inputs.pr_number) || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout rocm-systems
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          sparse-checkout: .github/actions/checkout-coco-harness

      - name: Checkout the coco harness
        uses: ./.github/actions/checkout-coco-harness
        with:
          ref: ${{ inputs.coco_ref }}
          path: ${{ env.COCO_DIR }}/tRCCL
          client-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Ruby only: its system Python is 3.10, below what coco needs. OCI's is
      # new enough, and the pip cache fails there.
      - name: Set up Python
        if: contains(inputs.runs_on, 'ruby')
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ env.COCO_DIR }}/tRCCL/pyproject.toml

      - name: Install coco
        working-directory: ${{ env.COCO_DIR }}/tRCCL
        env:
          COCO_VENV: ${{ env.COCO_DIR }}/venv
        run: |
          set -euo pipefail
          # Never activated; invoked by absolute path.
          python3 -m venv "${COCO_VENV}"
          "${COCO_VENV}/bin/python3" -m pip install -e .
          # Surfaces a packaging problem here rather than after the queue.
          "${COCO_VENV}/bin/coco" --help > /dev/null
          echo "==> coco installed from $(git rev-parse HEAD)"

      # Where coco writes build trees, logs and scripts, and what gets
      # archived. Periodic runs use the job config's stage_dir as-is; a PR run
      # appends a per-run subdirectory that the caller deletes once both halves
      # finish.
      #
      # Both halves of one gate resolve the same path, since a cluster's build
      # and smoke configs declare the same stage_dir, and coco's cache is keyed
      # on (component, fingerprint, stage_dir) -- sharing it is what lets smoke
      # reuse build's stacks. Keyed on run id, not run_attempt: "re-run failed
      # jobs" bumps the attempt without re-running a build that passed, which
      # would leave the retried smoke job nothing to reuse.
      - name: Resolve coco artifact directory
        id: artifact_dir
        working-directory: ${{ env.COCO_DIR }}/tRCCL
        env:
          MODE: ${{ inputs.mode }}
          JOB: ${{ inputs.job }}
          COCO_VENV: ${{ env.COCO_DIR }}/venv
          RUN_SUBDIR: pr-${{ github.run_id }}
        run: |
          set -euo pipefail
          # initialise_plugins() must run before load_job_config: the
          # type-discriminated union over test configs is built from the
          # plugin registry, and without it every job whose type comes from a
          # plugin (rccl_test) fails validation.
          stage_dir=$("${COCO_VENV}/bin/python3" -c '
          import os
          from coco.core.registry import initialise_plugins
          initialise_plugins()
          from coco.core.config import load_job_config
          print(load_job_config(os.environ["JOB"]).advanced.stage_dir or "")
          ')
          if [[ "${MODE}" == 'pr' ]]; then
            if [[ -z "${stage_dir}" ]]; then
              echo "::error::Job ${JOB} has no advanced.stage_dir; mode=pr needs one to derive its per-run directory."
              exit 1
            fi
            output_dir="${stage_dir%/}/${RUN_SUBDIR}"
            mkdir -p "${output_dir}"
            # The real bound on growth: the caller's cleanup job only gets a
            # path when both halves published outputs, which a skipped, failed
            # or cancelled call does not. The cutoff is far longer than any
            # gate can take, so it cannot hit a live run. Errors stay visible,
            # since a sweep that silently stopped working would let the tree
            # grow until the filesystem filled, but must not fail the gate.
            find "${stage_dir%/}" -mindepth 1 -maxdepth 1 -type d -name 'pr-*' \
              -mtime +2 -print -exec rm -rf {} + || true
            echo "COCO_OUTPUT=${output_dir}" >> "${GITHUB_ENV}"
            echo "dir=${output_dir}" >> "${GITHUB_OUTPUT}"
            echo "ephemeral=${output_dir}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ -z "${stage_dir}" ]]; then
            echo "::warning::Job ${JOB} has no advanced.stage_dir; artifact will contain console logs only."
          fi
          echo "dir=${stage_dir}" >> "${GITHUB_OUTPUT}"

      - name: Launch coco
        id: launch
        working-directory: ${{ env.COCO_DIR }}/tRCCL
        env:
          MODE: ${{ inputs.mode }}
          JOB: ${{ inputs.job }}
          BUILD_ONLY: ${{ inputs.build_only }}
          TRIGGER_KIND: ${{ inputs.trigger_kind }}
          COCO_ARGS: ${{ inputs.coco_args }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_REPO: ${{ inputs.pr_repo }}
          PR_SHA: ${{ inputs.pr_sha }}
          SOFTWARE: ${{ inputs.software }}
          COCO_DATABASE_URL: ${{ secrets.RCCL_COCO_DB_URL }}
          COCO_VENV: ${{ env.COCO_DIR }}/venv
        run: |
          set -euo pipefail
          unset VIRTUAL_ENV PYTHONHOME pythonLocation Python_ROOT_DIR Python3_ROOT_DIR
          PATH="$(printf '%s' "${PATH}" | tr ':' '\n' | grep -vE '/_work/_tool/Python/' | paste -sd: -)"
          export PATH
          if [[ -z "${COCO_DATABASE_URL:-}" ]]; then
            echo "::warning::RCCL_COCO_DB_URL is empty; this run will not publish results to the coco database."
          fi

          if [[ "${MODE}" == 'pr' ]]; then
            if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" -le 0 ]]; then
              echo "::error::mode=pr requires pr_number"
              exit 1
            fi
            if [[ ! "${PR_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::mode=pr requires a full 40-hex pr_sha"
              exit 1
            fi
            pr_args=()
            if [[ "${BUILD_ONLY}" == "true" ]]; then
              pr_args+=(--build-only)
            fi
            echo "==> coco pr --job ${JOB} -o ${COCO_OUTPUT} ${pr_args[*]-} ${COCO_ARGS}"
            "${COCO_VENV}/bin/coco" pr \
              --job "${JOB}" \
              --repo "${PR_REPO}" \
              --pr "${PR_NUMBER}" \
              --sha "${PR_SHA}" \
              --software "${SOFTWARE}" \
              --trigger-kind "${TRIGGER_KIND}" \
              -o "${COCO_OUTPUT}" \
              ${pr_args[@]+"${pr_args[@]}"} \
              ${COCO_ARGS} > "${LOG_FILE}" 2>&1
          elif [[ "${MODE}" == 'run' ]]; then
            echo "==> coco run --job ${JOB} --trigger-kind ${TRIGGER_KIND} ${COCO_ARGS}"
            "${COCO_VENV}/bin/coco" run \
              --job "${JOB}" \
              --trigger-kind "${TRIGGER_KIND}" \
              ${COCO_ARGS} > "${LOG_FILE}" 2>&1
          else
            echo "::error::mode must be run or pr, got: ${MODE}"
            exit 1
          fi

      # coco exits 0 from a run that failed to compile, because its exit status
      # counts only non-passing tests and a stack that did not build has its
      # tests marked SKIPPED: --build-only marks them before building, and
      # --skip-failed-builds marks them on a failure. Both halves of a PR gate
      # are affected, so both are checked. The log line is the only signal
      # (AICOMRCCL-2375); drop this step once coco reports it.
      - name: Fail on a build failure coco did not report
        if: inputs.mode == 'pr' && steps.launch.outcome == 'success'
        run: |
          set -uo pipefail
          if [[ ! -s "${LOG_FILE}" ]]; then
            echo "::error::${LOG_FILE} is missing or empty; cannot confirm the build succeeded."
            exit 1
          fi
          if grep -nE 'Stack .+ build failed:|Fetch failed for shared software ' "${LOG_FILE}"; then
            echo "::error::coco logged a build or fetch failure but exited 0, because --build-only classifies every test as skipped. Failing the job on the log instead."
            exit 1
          fi
          echo "No build or fetch failures in $(basename "${LOG_FILE}")."

      # Artifact names must be unique within a run: v4 artifacts are immutable,
      # so a second upload under a name already used fails with a 409.
      - name: Upload coco console logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}-console
          path: ${{ github.workspace }}/coco-*-${{ github.run_id }}.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coco output logs
        if: always() && steps.artifact_dir.outputs.dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}-output
          path: |
            ${{ steps.artifact_dir.outputs.dir }}/logs
            ${{ steps.artifact_dir.outputs.dir }}/scripts
            ${{ steps.artifact_dir.outputs.dir }}/harness_*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Run summary
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          JOB: ${{ inputs.job }}
          TRIGGER_KIND: ${{ inputs.trigger_kind }}
          COCO_REF: ${{ inputs.coco_ref }}
          COCO_ARGS: ${{ inputs.coco_args }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_REPO: ${{ inputs.pr_repo }}
          PR_SHA: ${{ inputs.pr_sha }}
          ARTIFACT_DIR: ${{ steps.artifact_dir.outputs.dir }}
          LAUNCH_OUTCOME: ${{ steps.launch.outcome }}
        run: |
          title="${JOB}"
          if [[ "${MODE}" == 'pr' ]]; then
            title="${JOB} (PR #${PR_NUMBER})"
          fi
          {
            echo "### ${title}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| mode | \`${MODE}\` |"
            echo "| outcome | \`${LAUNCH_OUTCOME}\` |"
            echo "| trigger kind | \`${TRIGGER_KIND}\` |"
            echo "| coco ref | \`${COCO_REF}\` |"
            echo "| artifact dir | \`${ARTIFACT_DIR:-(none)}\` |"
            if [[ "${MODE}" == 'pr' ]]; then
              echo "| repo | \`${PR_REPO}\` |"
              echo "| head sha | \`${PR_SHA}\` |"
            fi
            echo "| extra flags | \`${COCO_ARGS:-(none)}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${LAUNCH_OUTCOME}" != "success" && -s "${LOG_FILE}" ]]; then
            echo "::group::$(basename "${LOG_FILE}") (tail)"
            tail -n 200 "${LOG_FILE}"
            echo "::endgroup::"
          fi

      # COCO_OUTPUT deliberately survives: on a PR run the sibling half shares
      # that directory and may still be using it. The caller deletes it.
      - name: Clean up harness checkout
        if: always()
        run: |
          rm -rf "${COCO_DIR}"
          rm -f "${LOG_FILE}"
