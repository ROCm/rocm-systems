name: RCCL coco run

# Reusable launcher for one coco job from the ROCm/tRCCL harness.
#
# `job` is bound to a cluster in tRCCL, so `runs_on` must name a runner on that cluster.
on:
  workflow_call:
    inputs:
      mode:
        description: 'coco subcommand: run or pr.'
        type: string
        required: false
        default: 'run'
      runs_on:
        description: 'Runner label to run on.'
        type: string
        required: true
      job:
        description: 'coco job key to run.'
        type: string
        required: true
      concurrency_group:
        description: 'Concurrency group, set by the caller so each job serialises independently.'
        type: string
        required: true
      coco_ref:
        description: 'ROCm/tRCCL git ref (commit, tag, or branch) to check out the harness at.'
        type: string
        required: false
        default: '1.4.x'
      trigger_kind:
        description: 'coco --trigger-kind, recorded against the run. Required, so a caller that does not wire it through fails rather than mislabelling its run.'
        type: string
        required: true
      coco_args:
        description: 'Additional coco flags, word-split verbatim (e.g. "-vv --prune-build").'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'Pull request number (mode=pr).'
        type: string
        required: false
        default: ''
      pr_sha:
        description: 'PR head SHA, 40 hex (mode=pr).'
        type: string
        required: false
        default: ''
      pr_repo:
        description: 'Monorepo slug (mode=pr).'
        type: string
        required: false
        default: 'ROCm/rocm-systems'
      software:
        description: 'Component to swap to PR head (mode=pr).'
        type: string
        required: false
        default: 'rccl'
      build_job:
        description: >-
          coco job key compiled with --build-only before `job` runs (mode=pr).
          Its stacks are a superset of `job`'s, so the test pass reads them from
          coco's cache rather than compiling them again.
        type: string
        required: false
        default: ''
      timeout_minutes:
        description: 'Job timeout in minutes.'
        type: number
        required: false
        default: 600
    secrets:
      APP_ID:
        description: 'GitHub App ID, used to mint a read token for the coco harness repository.'
        required: true
      APP_PRIVATE_KEY:
        description: 'Private key for APP_ID.'
        required: true
      RCCL_COCO_DB_URL:
        description: 'coco database URL for result ingest. Omit to run without publishing.'
        required: false
      HF_TOKEN:
        description: 'Hugging Face token. Exported to the build and test jobs as MAD_SECRETS_HFTOKEN. Omit to run without it.'
        required: false

permissions:
  contents: read

jobs:
  coco:
    # Branch protection matches "<caller job> / <this job>" literally, so this must not vary per PR.
    name: ${{ inputs.job }}
    # Any repository can invoke a workflow_call by full reference and reach
    # these self-hosted runners; github.repository is the caller's.
    if: github.repository == 'ROCm/rocm-systems'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Queue rather than cancel; superseding is the caller's workflow-level concern.
    concurrency:
      group: ${{ inputs.concurrency_group }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      # Also read by the Ruby runners' BASH_ENV, and by coco's OCI hooks, which
      # expect the harness at ${COCO_DIR}/tRCCL.
      COCO_DIR: ${{ github.workspace }}/_coco
      ARTIFACT_NAME: coco-${{ inputs.mode }}-${{ inputs.job }}${{ inputs.mode == 'pr' && format('-pr{0}', inputs.pr_number) || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
      # ~/.cache/pip is on a small NFS home quota, here and on the compute nodes.
      PIP_NO_CACHE_DIR: '1'
    steps:
      # In RUNNER_TEMP, so no step deletes NFS files coco may still hold open.
      - name: Set up coco scratch
        env:
          MODE: ${{ inputs.mode }}
          JOB: ${{ inputs.job }}
          BUILD_JOB: ${{ inputs.build_job }}
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "${RUNNER_TEMP}/coco.XXXXXX")
          # A nightly run reuses a persistent stage_dir, so this marks the
          # point before which an old *_summary.md must not reappear.
          touch "${scratch}/launch.stamp"
          {
            echo "CI_SCRATCH=${scratch}"
            echo "COCO_VENV=${scratch}/venv"
            echo "LOG_FILE=${scratch}/coco-${MODE}-${JOB}-${GITHUB_RUN_ID}.log"
            echo "BUILD_LOG=${scratch}/coco-pr-${BUILD_JOB}-${GITHUB_RUN_ID}.log"
            echo "LAUNCH_STAMP=${scratch}/launch.stamp"
            echo "REPORTS_FILE=${scratch}/reports.md"
          } >> "${GITHUB_ENV}"

      # Not at the workspace root: checkout's clean there would delete COCO_DIR.
      - name: Checkout rocm-systems
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: coco-rocm-systems
          sparse-checkout: .github/actions/rccl-checkout-coco-harness

      - name: Checkout the coco harness
        uses: ./coco-rocm-systems/.github/actions/rccl-checkout-coco-harness
        with:
          ref: ${{ inputs.coco_ref }}
          path: ${{ env.COCO_DIR }}/tRCCL
          client-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Install coco
        working-directory: ${{ env.COCO_DIR }}/tRCCL
        run: |
          set -euo pipefail
          # Never activated; invoked by absolute path.
          python3 -m venv "${COCO_VENV}"
          "${COCO_VENV}/bin/python3" -m pip install -e .
          # Surfaces a packaging problem here rather than after the queue.
          "${COCO_VENV}/bin/coco" --help > /dev/null
          echo "==> coco installed from $(git rev-parse HEAD)"

      # Scheduled runs (mode=run) use advanced.stage_dir from the tRCCL job
      # config; PR runs write under this job's scratch.
      - name: Resolve coco artifact directory
        id: artifact_dir
        working-directory: ${{ env.COCO_DIR }}/tRCCL
        env:
          MODE: ${{ inputs.mode }}
          JOB: ${{ inputs.job }}
          PR_DIR: ${{ env.CI_SCRATCH }}/pr
        run: |
          set -euo pipefail
          if [[ "${MODE}" == 'pr' ]]; then
            mkdir -p "${PR_DIR}"
            echo "COCO_OUTPUT=${PR_DIR}" >> "${GITHUB_ENV}"
            echo "dir=${PR_DIR}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          stage_dir=$("${COCO_VENV}/bin/python3" -c '
          import os
          from coco.core.config import load_job_config
          print(load_job_config(os.environ["JOB"]).advanced.stage_dir or "")
          ')
          if [[ -z "${stage_dir}" ]]; then
            echo "::warning::Job ${JOB} has no advanced.stage_dir; artifact will contain console logs only."
          fi
          echo "dir=${stage_dir}" >> "${GITHUB_OUTPUT}"

      - name: Launch coco
        id: launch
        working-directory: ${{ env.COCO_DIR }}/tRCCL
        env:
          MODE: ${{ inputs.mode }}
          JOB: ${{ inputs.job }}
          BUILD_JOB: ${{ inputs.build_job }}
          TRIGGER_KIND: ${{ inputs.trigger_kind }}
          COCO_ARGS: ${{ inputs.coco_args }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_REPO: ${{ inputs.pr_repo }}
          PR_SHA: ${{ inputs.pr_sha }}
          SOFTWARE: ${{ inputs.software }}
          COCO_DATABASE_URL: ${{ secrets.RCCL_COCO_DB_URL }}
          # sbatch --export=ALL carries the launcher environment to the compute
          # jobs, so both the build-only pass and the test pass see this.
          MAD_SECRETS_HFTOKEN: ${{ secrets.HF_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${COCO_DATABASE_URL:-}" ]]; then
            echo "::warning::RCCL_COCO_DB_URL is empty; this run will not publish results to the coco database."
          fi

          # coco exits 0 after a build failure: unbuilt stacks' tests are marked
          # SKIPPED and only non-passing tests set the exit status. The log is the
          # only signal (AICOMRCCL-2375); drop once coco reports it.
          assert_built() {
            local log="$1"
            if [[ ! -s "${log}" ]]; then
              echo "::error::${log} is missing or empty; cannot confirm the build succeeded."
              return 1
            fi
            if grep -nE 'Stack .+ build failed:|Fetch failed for shared software ' "${log}"; then
              echo "::error::coco logged a build or fetch failure but exited 0. Failing the job on the log instead."
              return 1
            fi
            echo "No build or fetch failures in $(basename "${log}")."
          }

          # The build job and the smoke job it feeds can declare different baselines.
          job_baseline() {
            "${COCO_VENV}/bin/python3" -c '
          import sys
          from coco.core.config import load_job_config
          print(load_job_config(sys.argv[1]).comparison.baseline)
          ' "$1"
          }

          # Backgrounded so the trap can pass a cancel on to coco.
          run_coco() {
            "${COCO_VENV}/bin/coco" "$@" &
            local pid=$!
            trap 'kill -TERM "${pid}" 2>/dev/null; wait "${pid}" || true; exit 130' INT TERM
            wait "${pid}"
            trap - INT TERM
          }

          coco_pr() {
            local job="$1" log="$2"
            shift 2
            echo "==> coco pr --job ${job} -o ${COCO_OUTPUT} $* ${COCO_ARGS}"
            run_coco pr \
              --job "${job}" \
              --repo "${PR_REPO}" \
              --pr "${PR_NUMBER}" \
              --sha "${PR_SHA}" \
              --software "${SOFTWARE}" \
              --trigger-kind "${TRIGGER_KIND}" \
              -o "${COCO_OUTPUT}" \
              "$@" \
              ${COCO_ARGS} > "${log}" 2>&1
            assert_built "${log}"
          }

          if [[ "${MODE}" == 'pr' ]]; then
            if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" -le 0 ]]; then
              echo "::error::mode=pr requires pr_number"
              exit 1
            fi
            if [[ ! "${PR_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::mode=pr requires a full 40-hex pr_sha"
              exit 1
            fi
            # Superset first, into the same -o tree the test pass reads its
            # stacks back out of.
            if [[ -n "${BUILD_JOB}" ]]; then
              coco_pr "${BUILD_JOB}" "${BUILD_LOG}" --build-only \
                --baseline-stack "$(job_baseline "${BUILD_JOB}")"
            fi
            coco_pr "${JOB}" "${LOG_FILE}" --baseline-stack "$(job_baseline "${JOB}")"
          elif [[ "${MODE}" == 'run' ]]; then
            echo "==> coco run --job ${JOB} --trigger-kind ${TRIGGER_KIND} ${COCO_ARGS}"
            run_coco run \
              --job "${JOB}" \
              --trigger-kind "${TRIGGER_KIND}" \
              ${COCO_ARGS} > "${LOG_FILE}" 2>&1
          else
            echo "::error::mode must be run or pr, got: ${MODE}"
            exit 1
          fi

      # Artifact names must be unique within a run; a reused name 409s.
      - name: Upload coco console logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}-console
          path: |
            ${{ env.BUILD_LOG }}
            ${{ env.LOG_FILE }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coco output logs
        if: always() && steps.artifact_dir.outputs.dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}-output
          path: |
            ${{ steps.artifact_dir.outputs.dir }}/logs
            ${{ steps.artifact_dir.outputs.dir }}/scripts
            ${{ steps.artifact_dir.outputs.dir }}/harness_*.log
            ${{ steps.artifact_dir.outputs.dir }}/reports
          if-no-files-found: warn
          retention-days: 14

      - name: Run summary
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          JOB: ${{ inputs.job }}
          TRIGGER_KIND: ${{ inputs.trigger_kind }}
          COCO_REF: ${{ inputs.coco_ref }}
          COCO_ARGS: ${{ inputs.coco_args }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_REPO: ${{ inputs.pr_repo }}
          PR_SHA: ${{ inputs.pr_sha }}
          ARTIFACT_DIR: ${{ steps.artifact_dir.outputs.dir }}
          LAUNCH_OUTCOME: ${{ steps.launch.outcome }}
          LAUNCH_STAMP: ${{ env.LAUNCH_STAMP }}
        run: |
          set -uo pipefail
          title="${JOB}"
          if [[ "${MODE}" == 'pr' ]]; then
            title="${JOB} (PR #${PR_NUMBER})"
          fi
          {
            echo "### ${title}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| mode | \`${MODE}\` |"
            echo "| outcome | \`${LAUNCH_OUTCOME}\` |"
            echo "| trigger kind | \`${TRIGGER_KIND}\` |"
            echo "| coco ref | \`${COCO_REF}\` |"
            echo "| artifact dir | \`${ARTIFACT_DIR:-(none)}\` |"
            if [[ "${MODE}" == 'pr' ]]; then
              echo "| repo | \`${PR_REPO}\` |"
              echo "| head sha | \`${PR_SHA}\` |"
            fi
            echo "| extra flags | \`${COCO_ARGS:-(none)}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

          # Each stack's markdown summary, written this run only (a persistent
          # stage_dir keeps an older report from a prior night alongside it).
          # Also kept at REPORTS_FILE so the PR-comment step need not re-glob it.
          if [[ -n "${ARTIFACT_DIR}" && -d "${ARTIFACT_DIR}/reports" ]]; then
            : > "${REPORTS_FILE}"
            find "${ARTIFACT_DIR}/reports" -name '*_summary.md' \
              -newer "${LAUNCH_STAMP}" -print0 | sort -z |
              while IFS= read -r -d '' md; do
                # The PR build-only pass's own report (every *-pr-build.yaml job's
                # fixed `tag: pr-smoke-build`) is a superset build and reports
                # little beyond what the smoke pass's own report already shows.
                # Worth reading only when the build itself is why this run failed.
                if [[ "${LAUNCH_OUTCOME}" == "success" &&
                      "$(basename "${md}")" == "pr-smoke-build_summary.md" ]]; then
                  continue
                fi
                { echo; cat "${md}"; } | tee -a "${GITHUB_STEP_SUMMARY}" "${REPORTS_FILE}" > /dev/null
              done
            # Every report this run wrote can be the skipped build-only one;
            # leave no empty file for the upload step to turn into a blank PR comment.
            [[ -s "${REPORTS_FILE}" ]] || rm -f "${REPORTS_FILE}"
          fi

          if [[ "${LAUNCH_OUTCOME}" != "success" ]]; then
            for log in "${BUILD_LOG:-}" "${LOG_FILE:-}"; do
              [[ -s "${log}" ]] || continue
              echo "::group::$(basename "${log}") (tail)"
              tail -n 200 "${log}"
              echo "::endgroup::"
            done
          fi

      # Posting to the PR needs issues: write, which this job does not hold --
      # it checks out and builds PR-controlled code, and must not also carry a
      # write token. A separate job with no PR checkout posts this artifact.
      - name: Upload the PR summary
        if: always() && inputs.mode == 'pr' && steps.artifact_dir.outputs.dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}-summary
          path: ${{ env.REPORTS_FILE }}
          if-no-files-found: ignore
          retention-days: 14
