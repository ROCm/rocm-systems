name: Debug hipMemPrefetchAsync flake (issue 8271)

# Manually triggered workflow that runs the two intermittently failing prefetch
# tests on gfx942 repeatedly to capture failure logs.
# Issue: https://github.com/ROCm/TheRock/issues/8271
#
# Failing tests:
#   - Unit_hipMemPrefetchAsync_Basic_AllDevices
#   - Unit_hipMemPrefetchBatchAsync_SingleOperationSingleLocation

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "TheRock artifact run ID to pull packages from"
        required: true
        type: string
      repeat_count:
        description: "Number of parallel repetitions (to stress the flake)"
        required: false
        default: "10"
        type: choice
        options: ["5", "10", "20", "30"]

permissions:
  contents: read

jobs:
  # Repeat the test N times in parallel using matrix, reusing the standard
  # therock-test-component infrastructure so container/runner setup is identical
  # to the CI runs where the flake is observed.
  debug-run-1:
    uses: ./.github/workflows/therock-test-component.yml
    with:
      artifact_run_id: ${{ inputs.artifact_run_id }}
      amdgpu_families: gfx94X-dcgpu
      test_runs_on: linux-gfx942-1gpu-ccs-csp-ossci-rocm
      platform: linux
      component: >-
        {
          "job_name": "hip-tests prefetch flake debug",
          "fetch_artifact_args": "--tests",
          "timeout_minutes": 30,
          "test_script": "AMD_LOG_LEVEL=3 AMD_LOG_MASK=0x7FFFFFFF HIP_TESTS_REGEX='Unit_hipMemPrefetchAsync_Basic_AllDevices|Unit_hipMemPrefetchBatchAsync_SingleOperationSingleLocation' SHARD_INDEX=1 TOTAL_SHARDS=1 python projects/hip-tests/catch/packaging/run_hiptests.py",
          "platform": ["linux"],
          "total_shards_dict": {"linux": 1},
          "test_type": "standard",
          "shard_arr": [1],
          "total_shards": 1,
          "test_runner": "linux-gfx942-1gpu-ccs-csp-ossci-rocm",
          "container_options": "--ipc host --user 0:0 --ulimit memlock=-1:-1 --ulimit nofile=1048576:1048576 --security-opt seccomp=unconfined --group-add video --device /dev/kfd --device /dev/dri --group-add 993 --group-add 992 --group-add 110 --env-file /etc/podinfo/gha-gpu-isolation-settings -e ROCR_VISIBLE_DEVICES -e KUBE_CPU_REQUEST"
        }

  debug-run-2:
    if: ${{ fromJSON(inputs.repeat_count) >= 2 }}
