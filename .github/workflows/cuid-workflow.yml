name: CUID CI

on:
  pull_request:
    branches: [develop]
    paths:
      - 'shared/cuid/**'
      - 'shared/sha256/**'
      - '.github/workflows/cuid-workflow.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: true
  BUILD_TYPE: Release
  ROCM_DIR: /opt/rocm

jobs:
  vectors-drift-check:
    name: CUID Conformance Vectors
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    container:
      # Same shape as the clang-tidy job: this is a self-hosted runner shared
      # with container jobs that run as root, so a job running bare as the
      # unprivileged `runner` user cannot delete their leftovers and
      # actions/checkout's clean step dies with EACCES on .git/FETCH_HEAD.
      image: ${{ vars.Ubuntu22_DOCKER_IMAGE }}
      options: --rm -u root

    steps:
      # Container runs as root, so clean any root-owned leftovers before checkout.
      # GITHUB_WORKSPACE is a bind-mounted directory, not just its contents.
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            shared/cuid/tests/vectors
          sparse-checkout-cone-mode: false

      # What this verifies, exactly: that cuid_vectors.txt is what the
      # cuid_vectors.py sitting beside it produces. That catches a hand-edited
      # table -- the only way a vector can decay in the direction of the bug it
      # was meant to catch -- and nothing else.
      #
      # It does NOT verify the amdgpu driver. The kernel has no copy of this
      # table; its KUnit known-answer test asserts a subset of the rows, and
      # nothing compares that subset with this file.
      - name: Check the conformance vectors match their generator
        run: python3 shared/cuid/tests/vectors/cuid_vectors.py --check

  build-and-test:
    name: Build and Test
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    # Ubuntu22 gates the merge; the other self-hosted distros stay advisory
    # because their runner flakiness is unrelated to CUID.
    continue-on-error: ${{ matrix.os != 'Ubuntu22' }}
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        os:
          - Ubuntu20
          - Ubuntu22
          - Debian10
          - SLES
          - RHEL8
          - RHEL9
          - RHEL10
          - AzureLinux3
          - AlmaLinux8
    container:
      image: ${{ vars[format('{0}_DOCKER_IMAGE', matrix.os)] }}
      options: --rm --privileged --device=/dev/kfd --device=/dev/dri --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --shm-size=64G --cap-add=SYS_MODULE -v /lib/modules:/lib/modules -u root

    steps:
      # Container runs as root, so clean any root-owned leftovers before checkout.
      # GITHUB_WORKSPACE is a bind-mounted directory, not just its contents.
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Container images ship no machine-id, and without one the library gives
      # no component a temporary CUID, so the tests would only see the refusal.
      # cuid_gpu_paths fakes /sys, /dev and /run but reads the real
      # /etc/machine-id. A random one is what systemd writes on first boot.
      - name: Give the container a machine-id
        run: |
          set -eu
          if ! grep -qE '^[0-9a-f]{32}$' /etc/machine-id 2>/dev/null; then
            tr -d '-' < /proc/sys/kernel/random/uuid > /etc/machine-id
          fi

      - name: Set Project Directory
        run: |
          # Find the directory containing the main CMakeLists.txt for CUID
          # Prioritize finding it in shared/cuid
          TARGET_DIR=$(find $GITHUB_WORKSPACE -path "*/shared/cuid/CMakeLists.txt" -exec dirname {} \;)

          if [ -z "$TARGET_DIR" ]; then
            echo "Could not find CMakeLists.txt in shared/cuid. Searching workspace..."
            TARGET_DIR=$(find $GITHUB_WORKSPACE -name "CMakeLists.txt" | grep "shared/cuid" | head -n 1 | xargs dirname)
          fi

          if [ -z "$TARGET_DIR" ]; then
             echo "Could not find CMakeLists.txt for CUID."
             exit 1
          fi

          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Build and Install CUID
        run: |
          set -e
          echo 'Building on ${{ matrix.os }}'

          # Ensure build directory exists
          BUILD_FOLDER=${{ env.PROJECT_DIR }}/build
          rm -rf $BUILD_FOLDER
          mkdir -p $BUILD_FOLDER
          cd $BUILD_FOLDER

          # The lifecycle suite needs Python 3.9; distros shipping an older
          # python3 build without it.
          LIFECYCLE=OFF
          if python3 -c 'import sys; sys.exit(sys.version_info < (3, 9))'; then
            LIFECYCLE=ON
          fi
          echo "LIFECYCLE=$LIFECYCLE" >> $GITHUB_ENV

          # Configure
          cmake ${{ env.PROJECT_DIR }} -DBUILD_TESTS=ON -DAMDCUID_BUILD_LIFECYCLE_TESTS=$LIFECYCLE

          # Build
          make -j $(nproc)

          # Install
          # This requires sudo or root, container runs as root
          make install

      - name: Run CUID Tests
        run: |
          set -e
          echo 'Running CUID tests on ${{ matrix.os }}'

          OUTPUT_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p $OUTPUT_DIR
          TEST_LOG="$OUTPUT_DIR/amdcuid_test.log"

          # Run the test binary
          if /opt/rocm/core/share/amdcuid/tests/amdcuid_test > $TEST_LOG 2>&1; then
             echo "CUID tests passed"
          else
             echo "CUID tests failed"
             cat $TEST_LOG
             exit 1
          fi

      # cuid_gpu_paths runs GPU discovery against a synthetic /sys, /dev and /run
      # it mounts in a private mount namespace, so it needs root with
      # CAP_SYS_ADMIN, which this privileged root container has. It exits 77,
      # which CTest reports as skipped, only for a non-root caller; require that
      # it passed so a skip cannot pass the gate. The merge-gating Ubuntu22 job
      # must run it.
      - name: Run the registered CTest suite
        run: |
          set -e
          OUTPUT_DIR="/tmp/test-results-${{ matrix.os }}"
          mkdir -p $OUTPUT_DIR
          CTEST_LOG="$OUTPUT_DIR/ctest.log"
          if [ "$LIFECYCLE" != ON ] && [ "${{ matrix.os }}" = Ubuntu22 ]; then
             echo "cuid_gpu_paths was not built: python3 is older than 3.9"
             exit 1
          fi
          cd ${{ env.PROJECT_DIR }}/build
          if ctest --output-on-failure > $CTEST_LOG 2>&1 &&
             { [ "$LIFECYCLE" != ON ] || grep -Eq 'cuid_gpu_paths \.+ +Passed' $CTEST_LOG; }; then
             echo "CTest suite passed"
          else
             echo "CTest suite failed"
             cat $CTEST_LOG
             exit 1
          fi

      - name: Display Test Results
        if: always()
        run: |
          echo "Displaying CUID test results for ${{ matrix.os }}"
          cat /tmp/test-results-${{ matrix.os }}/amdcuid_test.log || echo "No CUID test results found for ${{ matrix.os }}"
          cat /tmp/test-results-${{ matrix.os }}/ctest.log || echo "No CTest results found for ${{ matrix.os }}"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cuid-test-results-${{ matrix.os }}
          path: /tmp/test-results-${{ matrix.os }}

  clang-tidy:
    name: clang-tidy
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_TYPE }}
    container:
      # this runs once rather than across full build-and-test matrix
      image: ${{ vars.Ubuntu22_DOCKER_IMAGE }}
      options: --rm -u root

    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Project Directory
        run: |
          # Find the directory containing the main CMakeLists.txt for CUID
          # Prioritize finding it in shared/cuid
          TARGET_DIR=$(find $GITHUB_WORKSPACE -path "*/shared/cuid/CMakeLists.txt" -exec dirname {} \;)

          if [ -z "$TARGET_DIR" ]; then
            echo "Could not find CMakeLists.txt in shared/cuid. Searching workspace..."
            TARGET_DIR=$(find $GITHUB_WORKSPACE -name "CMakeLists.txt" | grep "shared/cuid" | head -n 1 | xargs dirname)
          fi

          if [ -z "$TARGET_DIR" ]; then
             echo "Could not find CMakeLists.txt for CUID."
             exit 1
          fi

          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Configure CUID
        run: |
          set -e

          BUILD_FOLDER=${{ env.PROJECT_DIR }}/build
          rm -rf $BUILD_FOLDER
          mkdir -p $BUILD_FOLDER
          cd $BUILD_FOLDER

          cmake ${{ env.PROJECT_DIR }} -DBUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          make -j $(nproc)

      - name: Run clang-tidy
        run: |
          set -e

          if ! command -v clang-tidy &> /dev/null; then
            apt-get update && apt-get install -y clang-tidy
          fi

          cd ${{ env.PROJECT_DIR }}
          # .clang-tidy at the project root is picked up per-file automatically.
          clang-tidy -p build $(find lib/src -name '*.cc')
