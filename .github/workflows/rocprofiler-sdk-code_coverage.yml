name: rocprofiler-sdk Code Coverage

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'projects/rocprofiler-sdk/**'
      - '.github/actions/rocprofiler-sdk-util/action.yml'
      - '.github/scripts/rocprofiler_sdk_s3_handoff.py'
      - '.github/workflows/rocprofiler-sdk-code_coverage.yml'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-sdk/CODEOWNERS'
      - '!projects/rocprofiler-sdk/source/docs/**'
  pull_request:
    paths:
      - 'projects/rocprofiler-sdk/**'
      - '.github/actions/rocprofiler-sdk-util/action.yml'
      - '.github/scripts/rocprofiler_sdk_s3_handoff.py'
      - '.github/workflows/rocprofiler-sdk-code_coverage.yml'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-sdk/CODEOWNERS'
      - '!projects/rocprofiler-sdk/source/docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # TODO(jrmadsen): replace LD_RUNPATH_FLAG, GPU_TARGETS, etc. with internal handling in cmake
  ROCM_PATH: "/opt/rocm"
  GPU_TARGETS: "gfx906 gfx908 gfx90a gfx942 gfx950 gfx1030 gfx1100 gfx1101 gfx1102 gfx1201"
  PATH: "/usr/bin:$PATH"
  ## No tests should be excluded here except for extreme emergencies; tests should only be disabled in CMake
  ## A task should be assigned directly to fix the issue
  ## Scratch memory tests need to be fixed for ROCm 7.0 release
  navi3_EXCLUDE_TESTS_REGEX: ""
  vega20_EXCLUDE_TESTS_REGEX: ""
  mi200_EXCLUDE_TESTS_REGEX: ""
  mi300_EXCLUDE_TESTS_REGEX: ""
  mi300a_EXCLUDE_TESTS_REGEX: ""
  mi325_EXCLUDE_TESTS_REGEX: ""
  mi3xx_EXCLUDE_TESTS_REGEX: ""
  navi4_EXCLUDE_TESTS_REGEX: ""
  navi3_EXCLUDE_LABEL_REGEX: ""
  vega20_EXCLUDE_LABEL_REGEX: ""
  mi200_EXCLUDE_LABEL_REGEX: ""
  mi300_EXCLUDE_LABEL_REGEX: ""
  mi300a_EXCLUDE_LABEL_REGEX: ""
  mi325_EXCLUDE_LABEL_REGEX: ""
  mi3xx_EXCLUDE_LABEL_REGEX: ""
  navi4_EXCLUDE_LABEL_REGEX: ""
  GLOBAL_CMAKE_OPTIONS: ""
  ENABLE_ROCR_BUILD: "true"
  ENABLE_HIP_CLR_BUILD: "true"
  ENABLE_ROCPROFILER_REGISTER_BUILD: "true"
  ENABLE_AQLPROFILE_BUILD: "true"
  ENABLE_ROCDECODE_BUILD: "true"
  ENABLE_ROCJPEG_BUILD: "true"
  INSTALL_NIGHTLY_ROCM: "true"
  CI_MODE: ${{ github.event_name == 'schedule' && 'Nightly' || 'Continuous' }}
  ROCPROFILER_SDK_ARTIFACT_BUCKET: "therock-ci-artifacts-external"
  ROCPROFILER_SDK_ARTIFACT_PREFIX: "ROCm-rocm-systems/rocprofiler-sdk/ci-handoff/${{ github.run_id }}"
  ROCPROFILER_SDK_ARTIFACT_REGION: "us-east-2"

jobs:
  build-code-coverage:
    name: Build Code Coverage • ${{ matrix.system.gpu }} • ${{ matrix.system.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        system:
          - { gpu: 'mi325', os: 'ubuntu-22.04', build-type: 'Release', gpu-family: 'gfx94X', gpu-target: 'gfx942' }

    runs-on: azure-linux-scale-rocm
    container:
      image: docker.io/rocm/rocprofiler-private:${{ matrix.system.os }}-${{ matrix.system.gpu-family }}-latest
      credentials:
        username: ${{ secrets.ROCPROFILER_AZURE_CI_USER }}
        password: ${{ secrets.ROCPROFILER_AZURE_CI_PASS }}
      env:
        DEBIAN_FRONTEND: noninteractive
      options: -v /runner/config:/home/awsconfig/

    # define this for containers
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      GPU_RUNNER: ${{ matrix.system.gpu }}
      GCC_COMPILER_VERSION: 11
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini

    steps:
    - name: Clone ROCProfiler SDK & AQLProfile & ROCProfiler Register & ROCR-Runtime
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/actions/rocprofiler-sdk-util
          .github/scripts
          projects/rocprofiler-sdk
          projects/aqlprofile
          projects/rocprofiler-register
          projects/rocr-runtime
          projects/clr
          projects/hip
        submodules: false
        set-safe-directory: true

    - name: Compute submodule cache key
      id: submods
      shell: bash
      run: |
        git config --global --add safe.directory '*'
        git submodule status --recursive | awk '{print $1,$2}' > .git-submodules-status
        echo "hash=$(sha256sum .git-submodules-status | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        # collect submodule paths for cache 'path'
        git config --file .gitmodules --get-regexp path | awk '{print $2}' > .git-submodule-paths
        { echo "paths<<EOF"; cat .git-submodule-paths; echo "EOF"; } >> "$GITHUB_OUTPUT"

    - name: Restore submodule cache
      uses: actions/cache@v5
      with:
        path: |
          .git/modules
          ${{ steps.submods.outputs.paths }}
        key: submods-${{ runner.os }}-${{ steps.submods.outputs.hash }}
        restore-keys: |
          submods-${{ runner.os }}-
          submods-

    - name: Init/Update submodules
      run: git submodule update --init --recursive --jobs 16

    - name: Clone ROCDecode
      uses: actions/checkout@v6
      with:
        repository: 'ROCm/rocDecode'
        ref: 'release/rocm-rel-7.0'
        set-safe-directory: true
        path: 'rocDecode'

    - name: Clone ROCJPEG
      uses: actions/checkout@v6
      with:
        repository: 'ROCm/rocJPEG'
        ref: 'release/rocm-rel-7.0'
        set-safe-directory: true
        path: 'rocJPEG'

    - name: Configure Env
      shell: bash
      run: |
        echo "${PATH}:/usr/local/bin:${HOME}/.local/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:/usr/local/lib:${HOME}/.local/lib" >> $GITHUB_ENV

    - name: Install requirements
      timeout-minutes: 10
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        git config --global --add safe.directory '*'
        apt-get update
        apt-get install -y build-essential ccache python3-pip gcovr libdw-dev libsqlite3-dev libdrm-dev file autoconf pkg-config rpm zstd
        python3 -m pip install -U --user cmake==3.24.0
        python3 -m pip install -U --user -r requirements.txt

    - name: Sync gcov with compilers
      timeout-minutes: 10
      shell: bash
      run: |
        apt-get install -y gcc-${{ env.GCC_COMPILER_VERSION }} g++-${{ env.GCC_COMPILER_VERSION }}
        update-alternatives \
          --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_COMPILER_VERSION }} 500 \
          --slave /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_COMPILER_VERSION }} \
          --slave /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_COMPILER_VERSION }}

    - name: Build ROCProfiler SDK Dependencies
      uses: ./.github/actions/rocprofiler-sdk-util
      with:
        rocm-path: ${{ env.ROCM_PATH }}
        gpu-family: ${{ matrix.system.gpu-family }}
        compiler-launcher: /usr/bin/ccache
        enable-rocr-build: ${{ env.ENABLE_ROCR_BUILD }}
        enable-hip-clr-build: ${{ env.ENABLE_HIP_CLR_BUILD }}
        enable-rocprofiler-register-build: ${{ env.ENABLE_ROCPROFILER_REGISTER_BUILD }}
        enable-aqlprofile-build: ${{ env.ENABLE_AQLPROFILE_BUILD }}
        enable-rocdecode-build: ${{ env.ENABLE_ROCDECODE_BUILD }}
        enable-rocjpeg-build: ${{ env.ENABLE_ROCJPEG_BUILD }}
        install-nightly-rocm: ${{ env.INSTALL_NIGHTLY_ROCM }}
        ccache-key: ccache-${{ matrix.system.os }}-code-coverage-${{ matrix.system.gpu }}
        ccache-variant: ccache

    - name: Configure and Build Code Coverage
      timeout-minutes: 45
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        python3 ./source/scripts/run-ci.py -B build \
          --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-codecov-build \
          --build-jobs 16 \
          --mode ${CI_MODE} \
          --site build-code-coverage-cpu \
          --gpu-targets ${{ env.GPU_TARGETS }} \
          --run-attempt ${{ github.run_attempt }} \
          --build-only \
          -- \
          -DROCPROFILER_BUILD_CODECOV=ON \
          -DROCPROFILER_INTERNAL_RCCL_API_TRACE=ON \
          -DCMAKE_BUILD_TYPE=${{ matrix.system.build-type }} \
          -DCMAKE_HIP_ARCHITECTURES=${{ matrix.system.gpu-target }} \
          -DCMAKE_PREFIX_PATH='${{ env.ROCM_PATH }};${{ env.ROCM_PATH }}/llvm' \
          -DPython3_EXECUTABLE=$(which python3) \
          ${{ env.GLOBAL_CMAKE_OPTIONS }}

    - name: Create build artifact tarball
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        tar --use-compress-program='zstd -T0 -3' -cf rocprofiler-sdk-codecov-build-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst \
          build/

    - name: Create ROCM dependencies tarball
      shell: bash
      run: |
        tar --use-compress-program='zstd -T0 -3' -cf rocm-deps-codecov-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst \
          -C /opt rocm

    - name: Install S3 handoff dependencies
      shell: bash
      run: |
        python3 -m pip install -U --user \
          'boto3>=1.21.0,<1.24; python_version < "3.7"' \
          'boto3>=1.26.0; python_version >= "3.7"'

    - name: Configure AWS Credentials
      if: ${{ always() && !github.event.pull_request.head.repo.fork }}
      uses: aws-actions/configure-aws-credentials@v6.0.0
      with:
        aws-region: ${{ env.ROCPROFILER_SDK_ARTIFACT_REGION }}
        role-to-assume: arn:aws:iam::692859939525:role/therock-ci-external

    - name: Upload build handoff artifacts to S3
      shell: bash
      run: |
        python3 .github/scripts/rocprofiler_sdk_s3_handoff.py upload \
          --bucket "${{ env.ROCPROFILER_SDK_ARTIFACT_BUCKET }}" \
          --prefix "${{ env.ROCPROFILER_SDK_ARTIFACT_PREFIX }}/code-coverage/build-code-coverage/${{ matrix.system.os }}/${{ matrix.system.gpu }}" \
          --file "projects/rocprofiler-sdk/rocprofiler-sdk-codecov-build-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst" \
          --file "rocm-deps-codecov-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst"

  run-code-coverage:
    name: Run Code Coverage • ${{ matrix.system.gpu }} • ${{ matrix.system.os }}
    needs: build-code-coverage
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        system:
          - { gpu: 'mi325', runner: 'linux-gfx942-1gpu-ossci-rocm', os: 'ubuntu-22.04', gpu-family: 'gfx94X', gpu-target: 'gfx942' }

    runs-on: ${{ matrix.system.runner }}
    container:
      image: docker.io/rocm/rocprofiler-private:${{ matrix.system.os }}-${{ matrix.system.gpu-family }}-latest
      credentials:
        username: ${{ secrets.ROCPROFILER_AZURE_CI_USER }}
        password: ${{ secrets.ROCPROFILER_AZURE_CI_PASS }}
      env:
        DEBIAN_FRONTEND: noninteractive
      options: --privileged --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --env-file /etc/podinfo/gha-gpu-isolation-settings

    # define this for containers
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      GPU_RUNNER: ${{ matrix.system.gpu }}
      GCC_COMPILER_VERSION: 11

    steps:
    - name: Clone ROCProfiler SDK
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/scripts
          projects/rocprofiler-sdk
        submodules: false
        set-safe-directory: true

    - name: Download build handoff artifacts from S3
      shell: bash
      run: |
        python3 .github/scripts/rocprofiler_sdk_s3_handoff.py download \
          --bucket "${{ env.ROCPROFILER_SDK_ARTIFACT_BUCKET }}" \
          --prefix "${{ env.ROCPROFILER_SDK_ARTIFACT_PREFIX }}/code-coverage/build-code-coverage/${{ matrix.system.os }}/${{ matrix.system.gpu }}" \
          --file "projects/rocprofiler-sdk/rocprofiler-sdk-codecov-build-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst" \
          --file "rocm-deps-codecov-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst"

    - name: Install requirements
      timeout-minutes: 10
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        git config --global --add safe.directory '*'
        apt-get update
        apt-get install -y python3-pip gcovr wkhtmltopdf xvfb xfonts-base xfonts-75dpi xfonts-100dpi xfonts-utils xfonts-encodings libfontconfig zstd
        python3 -m pip install -U --user cmake==3.24.0
        python3 -m pip install -U --user -r requirements.txt

    - name: Extract build artifacts
      shell: bash
      run: |
        cd projects/rocprofiler-sdk
        tar --use-compress-program='zstd -d -T0' -xf rocprofiler-sdk-codecov-build-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst

    - name: Extract ROCM dependencies
      shell: bash
      run: |
        rm -rf /opt/rocm /opt/rocm-* /opt/rocprofiler-sdk
        cd /opt
        tar --use-compress-program='zstd -d -T0' -xf $GITHUB_WORKSPACE/rocm-deps-codecov-${{ matrix.system.os }}-${{ matrix.system.gpu }}.tar.zst

    - name: Load Existing XML Code Coverage
      if: github.event_name == 'pull_request'
      id: load-coverage
      uses: actions/cache@v5
      with:
        key: ${{ github.event.pull_request.base.sha }}-codecov
        path: projects/rocprofiler-sdk/.codecov/*.xml

    - name: Configure Env
      shell: bash
      run: |
        echo "${PATH}:/usr/local/bin:${HOME}/.local/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:/usr/local/lib:${HOME}/.local/lib" >> $GITHUB_ENV

    - name: Sync gcov with compilers
      timeout-minutes: 10
      shell: bash
      run: |
        apt-get install -y gcc-${{ env.GCC_COMPILER_VERSION }} g++-${{ env.GCC_COMPILER_VERSION }}
        update-alternatives \
          --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_COMPILER_VERSION }} 500 \
          --slave /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_COMPILER_VERSION }} \
          --slave /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_COMPILER_VERSION }}

    - name: Enable PC Sampling
      if: ${{ contains(matrix.system.gpu, 'mi200') || contains(matrix.system.gpu, 'mi300a') }}
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
          echo 'ROCPROFILER_PC_SAMPLING_BETA_ENABLED=1' >> $GITHUB_ENV

    - name: Test Total Code Coverage
      timeout-minutes: 30
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        python3 ./source/scripts/run-ci.py -B build \
          --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-codecov \
          --mode ${CI_MODE} \
          --site ${{ matrix.system.runner }} \
          --gpu-targets ${{ env.GPU_TARGETS }} \
          --coverage all \
          --run-attempt ${{ github.run_attempt }} \
          --test-only \
          -- \
          -- \
          -LE "${${{ matrix.system.gpu }}_EXCLUDE_LABEL_REGEX}" \
          -E "${${{ matrix.system.gpu }}_EXCLUDE_TESTS_REGEX}"

    - name: Test Unit/Integration Code Coverage
      timeout-minutes: 30
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        find build -type f -name '*.gcda' -delete
        python3 ./source/scripts/run-ci.py -B build \
          --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-codecov-tests \
          --mode ${CI_MODE} \
          --site ${{ matrix.system.runner }} \
          --gpu-targets ${{ env.GPU_TARGETS }} \
          --coverage tests \
          --run-attempt ${{ github.run_attempt }} \
          --test-only \
          -- \
          -- \
          -LE "${${{ matrix.system.gpu }}_EXCLUDE_LABEL_REGEX}" \
          -E "${${{ matrix.system.gpu }}_EXCLUDE_TESTS_REGEX}"

    - name: Test Samples Code Coverage
      timeout-minutes: 30
      working-directory: projects/rocprofiler-sdk
      shell: bash
      run: |
        find build -type f -name '*.gcda' -delete
        python3 ./source/scripts/run-ci.py -B build \
          --name ${{ github.repository }}-${{ github.ref_name }}-${{ matrix.system.os }}-${{ matrix.system.gpu }}-codecov-samples \
          --mode ${CI_MODE} \
          --site ${{ matrix.system.runner }} \
          --gpu-targets ${{ env.GPU_TARGETS }} \
          --coverage samples \
          --run-attempt ${{ github.run_attempt }} \
          --test-only \
          -- \
          -- \
          -LE "${${{ matrix.system.gpu }}_EXCLUDE_LABEL_REGEX}" \
          -E "${${{ matrix.system.gpu }}_EXCLUDE_TESTS_REGEX}"

    - name: Save XML Code Coverage
      id: save-coverage
      uses: actions/cache/save@v5
      with:
        key: ${{ github.sha }}-codecov
        path: |
          projects/rocprofiler-sdk/.codecov/*.xml

    - id: generatereport
      name: Generate Code Coverage Comment
      if: github.event_name == 'pull_request'
      timeout-minutes: 10
      working-directory: projects/rocprofiler-sdk
      shell: bash
      run: |
        echo "PWD: ${PWD}"
        ls -la

        for i in "all" "tests" "samples"; do
            wkhtmltoimage --enable-local-file-access --quality 70 .codecov/${i}.html .codecov/${i}.png
        done
        ls -la .codecov
        which -a git
        git --version

        ./source/scripts/upload-image-to-github.py --bot --token ${{ secrets.GITHUB_TOKEN }} --files .codecov/{all,tests,samples}.png --output-dir .codecov --name pr-${{ github.event.pull_request.number }}

        echo -e "\n${PWD}:"
        ls -la .

        echo -e "\n.codecov:"
        ls -la .codecov

        get-base-md-contents() { cat .codecov/${1}.png.md; }
        get-full-md-contents() { cat .codecov/${1}.png.md .codecov/${1}.md; }
        cat << EOF > .codecov/report.md
        # Code Coverage Report

        ## Tests Only
        $(get-base-md-contents tests)

        ## Samples Only
        $(get-base-md-contents samples)

        ## Tests + Samples
        $(get-base-md-contents all)

        <!-- code-coverage-comment-identifier -->
        EOF

        echo 'CODECOVERAGE_REPORT<<EOF' > $GITHUB_OUTPUT
        cat .codecov/report.md >> $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT

    - name: Write Code Coverage Comment
      if: github.event_name == 'pull_request'
      timeout-minutes: 10
      uses: actions/github-script@v6
      env:
        COMMENT_BODY: |
          <details>
          <summary><h2>Code Coverage Report</h2></summary>

          <!-- Keep the empty line above to render markdown properly -->
          ${{ steps.generatereport.outputs.CODECOVERAGE_REPORT }}
          </details>
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const commentIdentifier = '<!-- code-coverage-comment-identifier -->'; // Used to identify codecov comment
            const commentBody = process.env.COMMENT_BODY;

            // Fetch existing comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            // Check for an existing comment
            const existingComment = comments.find(comment => comment.body.includes(commentIdentifier));

            if (existingComment) {
              // Update the existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
              core.info(`Updated comment with ID: ${existingComment.id}`);
            } else {
              // Create a new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody,
              });
              core.info('Created a new comment.');
            }

    - name: Archive Code Coverage Data
      if: ${{ github.event_name == 'workflow_dispatch' }}
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-details
        path: |
          ${{github.workspace}}/projects/rocprofiler-sdk/.codecov/*

    - name: Verify Test Labels
      timeout-minutes: 5
      shell: bash
      working-directory: projects/rocprofiler-sdk
      run: |
        pushd build
        #
        # if following fails, there is a test that does not have
        # a label identifying it as sample or test (unit or integration).
        # Recommended labels are:
        #   - samples
        #   - unittests
        #   - integration-tests
        #
        ctest -N -LE 'samples|tests' -E "${${{ matrix.system.gpu }}_EXCLUDE_TESTS_REGEX}" -O ctest.mislabeled.log
        grep 'Total Tests: 0' ctest.mislabeled.log
        #
        # if following fails, then there is overlap between the labels.
        # A test cannot both be a sample and (unit/integration) test.
        #
        ctest -N -O ctest.all.log
        ctest -N -O ctest.samples.log -L samples
        ctest -N -O ctest.tests.log -L tests
        NUM_ALL=$(grep 'Total Tests:' ctest.all.log | awk '{print $NF}')
        NUM_SAMPLE=$(grep 'Total Tests:' ctest.samples.log | awk '{print $NF}')
        NUM_TEST=$(grep 'Total Tests:' ctest.tests.log | awk '{print $NF}')
        NUM_SUM=$((${NUM_SAMPLE} + ${NUM_TEST}))
        echo "Total tests: ${NUM_ALL}"
        echo "Total labeled tests: ${NUM_SUM}"
        if [ ${NUM_ALL} != ${NUM_SUM} ]; then
            echo "Test label overlap"
            exit 1
        fi
        popd
