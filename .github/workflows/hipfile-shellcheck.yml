# Run ShellCheck (https://www.shellcheck.net/) over shell scripts

name: "hipFile ShellCheck"

on:
  push:
    branches: [develop]
    paths:
      - 'projects/hipfile/**.sh'
      - '.github/workflows/hipfile-shellcheck.yml'
  pull_request:
    paths:
      - 'projects/hipfile/**.sh'
      - '.github/workflows/hipfile-shellcheck.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hipfile-shellcheck:
    name: "hipFile: Run ShellCheck over shell scripts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            projects/hipfile
            .github/workflows
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
