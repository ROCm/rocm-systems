name: update_CI_image
run-name: Update latest hipFile CI image

env:
  AIS_DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}/hipfile

on:
  # We only expect merges into develop
  push:
    branches:
      - develop
    paths:
      - projects/hipfile/util/docker/**
      - projects/hipfile/util/files-changed.sh
      - .github/workflows/hipfile-image-build.yml
      - .github/workflows/hipfile-image-update.yml
  workflow_dispatch:
    # Requires write access to trigger
    inputs:
      pull_from_cache:
        description: Build image with 'latest' cache
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:

  update_AIS_CI_image:
    env:
      AIS_CI_IMAGE_NAME: ais_ci_${{ matrix.supported_platforms }}
      AIS_INPUT_PLATFORM: ${{ matrix.supported_platforms }}
      AIS_ROCM_VERSION: ${{ matrix.rocm_versions }}
    runs-on: [ubuntu-24.04]
    container: docker:28.5
    # NOTE: nightly is intentionally absent here. This job refreshes the static
    # latest-rocm<ver> images post-merge, but the nightly target moves daily, so
    # nightly images are refreshed by hipfile-image-update-nightly.yml (daily and
    # on Dockerfile-change merge) instead. Keep this matrix in sync with
    # hipfile-ci-toplevel.yml's SUPPORTED_PLATFORMS/ROCM_VERSIONS/MATRIX_EXCLUDE
    # (and MATRIX_INCLUDE if used) for the non-nightly rows.
    strategy:
      matrix:
        supported_platforms:
          - ubuntu
        rocm_versions:
          - 10.2.0
    steps:
      - name: Fetching code repository...
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            projects/hipfile
            .github/workflows

      - name: Authenticating to GitHub Container Registry.
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set target AIS CI Image
        id: ci-image
        run: |
          AIS_CI_IMAGE="${AIS_DOCKER_REGISTRY}/${AIS_CI_IMAGE_NAME}:latest-rocm${AIS_ROCM_VERSION}"
          echo "AIS_CI_IMAGE=$(printf '%s' "${AIS_CI_IMAGE}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"

      - name: Set Docker Cache Instruction
        id: use-cache
        # If triggered by a push, pull_from_cache will be null. Note
        # however `false == null` resolves to `true`. Use empty string to check
        # for 'null'.
        # See: https://docs.github.com/en/actions/reference/workflows-and-actions/expressions
        # for how null gets converted when compared to non-null, and converted into a string.
        #
        # The job runs in the Alpine-based docker image, which has no bash, so
        # this and the build step below must be POSIX sh.
        env:
          AIS_PULL_FROM_CACHE: ${{ format('{0}', inputs.pull_from_cache) == '' || inputs.pull_from_cache }}
          AIS_CI_IMAGE: ${{ steps.ci-image.outputs.AIS_CI_IMAGE }}
        run: |
          if [ "${AIS_PULL_FROM_CACHE}" = "true" ]; then
            echo "CACHE_FROM_CMD=--cache-from=type=registry,ref=${AIS_CI_IMAGE}-cache" >> "${GITHUB_OUTPUT}"
          else
            echo "CACHE_FROM_CMD=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Docker Builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: ais-builder
          driver: docker-container
          cache-binary: false # True uses the GHA Cache Backend

      - name: Build & Push latest base image for AIS CI
        # CACHE_FROM_CMD may be empty, so ${VAR:+"${VAR}"} expands to nothing
        # in that case and to a single argument otherwise.
        env:
          AIS_CI_IMAGE: ${{ steps.ci-image.outputs.AIS_CI_IMAGE }}
          AIS_CACHE_FROM_CMD: ${{ steps.use-cache.outputs.CACHE_FROM_CMD }}
        run: |
          docker buildx build \
            -f "${GITHUB_WORKSPACE}/projects/hipfile/util/docker/DOCKERFILE.${AIS_CI_IMAGE_NAME}" \
            --target base \
            --provenance=false \
            --build-arg ROCM_VERSION="${AIS_ROCM_VERSION}" \
            --cache-to=type=registry,ref="${AIS_CI_IMAGE}-cache" \
            ${AIS_CACHE_FROM_CMD:+"${AIS_CACHE_FROM_CMD}"} \
            --push \
            -t "${AIS_CI_IMAGE}" \
            "${GITHUB_WORKSPACE}/projects/hipfile/util/docker"
