name: "hipFile clang-format"

on:
  push:
    branches: [develop]
    paths:
      - 'projects/hipfile/**/*.c'
      - 'projects/hipfile/**/*.cpp'
      - 'projects/hipfile/**/*.h'
      - 'projects/hipfile/.clang-format'
      - '.github/workflows/hipfile-clang-format.yml'
  pull_request:
    paths:
      - 'projects/hipfile/**/*.c'
      - 'projects/hipfile/**/*.cpp'
      - 'projects/hipfile/**/*.h'
      - 'projects/hipfile/.clang-format'
      - '.github/workflows/hipfile-clang-format.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hipfile-clang-format:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            projects/hipfile
            .github/workflows

      - name: Install clang-format
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y clang-format-18

      - name: Run clang-format style check for C/C++ code
        uses: DoozyX/clang-format-lint-action@bcb4eb2cb0d707ee4f3e5cc3b456eb075f12cf73 # v0.20
        with:
          source: 'projects/hipfile'
          extensions: 'c,h,cpp'
          clangFormatVersion: 18
          style: file
