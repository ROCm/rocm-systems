# ---------------------------------------------------------------------------
# AMD-SMI manylinux Python wheel build.
#
# Builds portable AMD-SMI Python wheels (manylinux_2_28, RPM + Debian) and
# smoke-tests the import.
#
# Unlike TheRock CI, which builds native rpm/deb packages, this produces
# pip-installable wheels. No GPU required.
# ---------------------------------------------------------------------------

name: AMDSMI Manylinux Wheels

on:
  pull_request:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '!projects/amdsmi/docs/**'
      - '!projects/amdsmi/**/*.md'
      - '!projects/amdsmi/**/*.rst'
      - '.github/workflows/amdsmi-manylinux-build.yml'
  push:
    branches: [develop]
    paths:
      - 'projects/amdsmi/**'
      - '!projects/amdsmi/docs/**'
      - '!projects/amdsmi/**/*.md'
      - '!projects/amdsmi/**/*.rst'
      - '.github/workflows/amdsmi-manylinux-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Group by PR number so a new push supersedes the previous run. Pushes to
  # develop fall back to the commit sha, which is unique, so post-merge runs
  # never cancel each other.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-amdsmi-wheels:
    name: ${{matrix.target.name}}
    runs-on: ${{matrix.target.runs-on}}
    container: ${{matrix.target.container}}
    # Build directory for build_wheel.py's CMake tree. This mirrors
    # build_wheel.py's own default (/tmp/amdsmi-build); it is set explicitly
    # here so the build step and the SONAME conflict check, which reads both
    # libraries back from it, stay coupled to one value.
    env:
      AMDSMI_WHEEL_BUILD_DIR: /tmp/amdsmi-build

    strategy:
      fail-fast: false
      matrix:
        target:
          - id: rpm
            name: Build RPM Wheels (AlmaLinux 8 / manylinux_2_28)
            runs-on: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            python-bin: /opt/python/cp310-cp310/bin/python3
            os-variant: AlmaLinux8
            repair-flag: '--repair'
            release-flag: '--release'
            artifact-prefix: amdsmi-rpm-wheels
          - id: debian
            name: Build Debian Wheels (Ubuntu 22.04)
            runs-on: ubuntu-22.04
            container: ''
            python-bin: python3
            os-variant: Ubuntu22
            repair-flag: ''
            release-flag: ''
            artifact-prefix: amdsmi-debian-wheels

    steps:
      # rocm-systems is a large monorepo; the wheel build only needs the amdsmi
      # project, so sparse-checkout keeps the fetch cheap.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            projects/amdsmi
            .github/workflows

      - name: Install Debian build prerequisites
        if: matrix.target.id == 'debian'
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc g++ cmake ninja-build libssl-dev libdrm-dev \
            libnl-3-dev libnl-genl-3-dev libmnl-dev

      - name: Install RPM build prerequisites
        if: matrix.target.id == 'rpm'
        run: |
          dnf install -y libnl3-devel libmnl-devel

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build wheels
        run: |
          ${{matrix.target.python-bin}} \
            "$GITHUB_WORKSPACE/projects/amdsmi/tools/build_wheel.py" \
            --project-dir "$GITHUB_WORKSPACE/projects/amdsmi" \
            --build-dir "$AMDSMI_WHEEL_BUILD_DIR" \
            --output-dir "$GITHUB_WORKSPACE/wheels" \
            --os-variant ${{matrix.target.os-variant}} \
            ${{matrix.target.repair-flag}} ${{matrix.target.release-flag}}

      - name: Verify wheels exist
        run: |
          ls -al "$GITHUB_WORKSPACE/wheels"
          if ! ls "$GITHUB_WORKSPACE"/wheels/*.whl >/dev/null 2>&1; then
            echo "No wheels found; failing."
            exit 1
          fi

      - name: Verify system/wheel SONAMEs are distinct
        run: |
          ${{matrix.target.python-bin}} \
            "$GITHUB_WORKSPACE/projects/amdsmi/tests/run_amdsmi_pkg_conflict_test.py" \
            --build-root "$AMDSMI_WHEEL_BUILD_DIR"

      - name: Smoke test (install + import)
        run: |
          ${{matrix.target.python-bin}} -m pip install --upgrade pip
          ${{matrix.target.python-bin}} -m pip install "$GITHUB_WORKSPACE"/wheels/*.whl
          # Prove the installed wheel is what imports (resolves under pip's
          # location), not some other amdsmi on the path.
          ${{matrix.target.python-bin}} -c "import os, subprocess, amdsmi; out = subprocess.check_output(['${{matrix.target.python-bin}}', '-m', 'pip', 'show', 'amdsmi'], text=True); loc = next((l.split(':', 1)[1].strip() for l in out.splitlines() if l.startswith('Location:')), ''); p = os.path.realpath(amdsmi.__file__); print('import from', p, 'pip loc', loc); assert loc and p.startswith(os.path.realpath(loc)), 'wheel is not the imported amdsmi'; print('amdsmi import OK')"
          # The wheel must ship with the system-library fallback disabled, so a
          # build-step ordering regression that leaves it enabled fails here
          # rather than shipping a wheel that can silently load a system .so.
          ${{matrix.target.python-bin}} -c "import amdsmi.amdsmi_wrapper as w; assert not w._AMDSMI_ALLOW_SYSTEM_FALLBACK, 'wheel shipped with system fallback enabled'; print('fallback disabled OK')"

      # Now consumed by test-wheel-no-gpu below, and kept so a reviewer can
      # download the built wheel from a run. Named by commit SHA for traceability.
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.target.artifact-prefix}}-${{github.sha}}
          path: ${{github.workspace}}/wheels/*.whl
          if-no-files-found: error
          retention-days: 30

  # The smoke test above runs inside the build container, which necessarily has
  # a modern pip and every build dependency already present. This job is the
  # opposite case, and the one users actually hit: stock distro images with no
  # GPU, no ROCm, and no netlink libraries installed. It guards the property
  # that makes the wheel worth shipping -- that it carries everything it needs.
  #
  # Only the repaired manylinux wheel is portable, so only that artifact is
  # exercised here; the Debian leg's linux_x86_64 wheel is tied to its build host.
  test-wheel-no-gpu:
    name: No-GPU install (${{matrix.os.name}})
    needs: build-amdsmi-wheels
    runs-on: ubuntu-22.04
    container: ${{matrix.os.image}}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          # Oldest supported deb. Stock pip 20.0.2 predates PEP 600.
          - { name: 'Ubuntu 20.04', image: 'ubuntu:20.04' }
          - { name: 'Ubuntu 22.04', image: 'ubuntu:22.04' }
          # PEP 668 marks the interpreter externally managed; the harness
          # falls back to --break-system-packages on its own.
          - { name: 'Ubuntu 24.04', image: 'ubuntu:24.04' }
          # glibc 2.28 is the manylinux_2_28 floor and Python 3.6.8 is the
          # oldest interpreter AMD SMI supports, so this leg is what catches a
          # manylinux baseline bump that would strand RHEL 8 users.
          - { name: 'AlmaLinux 8', image: 'almalinux:8' }
          - { name: 'RHEL 9 (UBI)', image: 'registry.access.redhat.com/ubi9/ubi:latest' }

    steps:
      # Runs before checkout because the stock images ship no git.
      - name: Install prerequisites
        run: |
          set -eu
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq git python3 python3-pip
          else
            yum install -y -q git python3 python3-pip
          fi
          # Ubuntu 20.04 (pip 20.0.2) and AlmaLinux 8 (pip 9.0.3) ship a pip
          # that predates PEP 600 and rejects manylinux_2_28 outright. Newer
          # pips need nothing, and PEP 668 images refuse the upgrade, so this
          # is best-effort: the harness reports an unusable pip by name.
          python3 -m pip install --quiet --upgrade pip || true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            projects/amdsmi
            .github/workflows

      - name: Download manylinux wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: amdsmi-rpm-wheels-${{github.sha}}
          path: wheels

      - name: Install and exercise the wheel without a GPU
        run: |
          python3 projects/amdsmi/tests/run_amdsmi_wheel_nogpu_test.py \
            --wheel wheels --expect-no-gpu
