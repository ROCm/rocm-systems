# CI for rocjitsu (experimental/rocjitsu).
#
# Runs on PRs and pushes that touch experimental/rocjitsu/**, plus manual
# dispatch. Uses sparse checkout so only rocjitsu sources are fetched.
#
# All tests run on the CPU emulator — no GPU hardware required.
# HIP device kernels are compiled with vanilla clang++ (AMDGPU backend).
#
# Jobs:
#   build-test  - clang (Release), build + ctest

name: rocjitsu CI

on:
  pull_request:
    branches: [develop]
    paths:
      - "experimental/rocjitsu/**"
      - ".github/workflows/rocjitsu-ci.yml"
  push:
    branches: [develop]
    paths:
      - "experimental/rocjitsu/**"
      - ".github/workflows/rocjitsu-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Linux (clang, Release)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout rocjitsu sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: experimental/rocjitsu
          sparse-checkout-cone-mode: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libdrm-dev

      - name: Install ROCm SDK (HIP headers + device libs)
        run: |
          pip install --index-url https://repo.amd.com/rocm/whl/gfx950-dcgpu/ rocm-sdk-core
          CORE=$(python3 -c "import importlib; print(importlib.import_module('_rocm_sdk_core').__path__[0])")
          echo "ROCM_PATH=$CORE" >> $GITHUB_ENV
          ln -sf libhsa-runtime64.so.1 "$CORE/lib/libhsa-runtime64.so"
          printf '#!/bin/bash\nexec clang++ -x hip --offload-arch=gfx950 -I"%s/include" --rocm-path="%s/lib/llvm" "$@"\n' "$CORE" "$CORE" > "$CORE/bin/hipcc"
          chmod +x "$CORE/bin/hipcc"
          ln -sf "$CORE/lib/llvm/amdgcn" "$CORE/amdgcn"
          printf '#!/bin/bash\nexec clang++ -x hip --offload-arch=gfx950 "$@"\n' > "$CORE/bin/amdclang++"
          chmod +x "$CORE/bin/amdclang++"

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="-Werror"
          -DRJ_BUILD_GUI=OFF
          experimental/rocjitsu

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120
