              -DUSE_CLANG_OMP=OFF
            python_envs_glob: "py3.{8,9,10,11}"
            install_prefix: /opt/rocprofiler-systems
            container_opts: ""
            is_rhel: false
            use_setup_env: false
            kill_perfetto: false
            sanity_check_rocm: true
            ccache_key_distro: ubuntu-jammy-system-deps
            system_deps_apt: >-
              g++ binutils-dev libboost-all-dev libtbb-dev
              libdw-dev libdwarf-dev libelf-dev libiberty-dev

