name: rocprofiler-systems Build and Test
run-name: build-and-test

# Path exclusions are defined once here — this is the canonical location.
# All four former distro-specific workflow files are replaced by this single
# matrix-driven file.  Adding a new distro means adding one include: entry.

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/rocprofiler-systems-build.yml'
      - 'projects/rocprofiler-systems/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-systems/docs/**'
      - '!projects/rocprofiler-systems/source/docs/**'
      - '!projects/rocprofiler-systems/source/python/gui/**'
      - '!projects/rocprofiler-systems/docker/**'
      - '!projects/rocprofiler-systems/CMakePresets.json'
  pull_request:
    paths:
      - '.github/workflows/rocprofiler-systems-build.yml'
      - 'projects/rocprofiler-systems/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-systems/docs/**'
      - '!projects/rocprofiler-systems/source/docs/**'
      - '!projects/rocprofiler-systems/source/python/gui/**'
      - '!projects/rocprofiler-systems/docker/**'
      - '!projects/rocprofiler-systems/CMakePresets.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROCPROFSYS_CI: ON
  ROCPROFSYS_TMPDIR: "%env{PWD}%/testing-tmp"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Primary builds: all distros × all ROCm versions × g++
  # Replaces: ubuntu-jammy.yml, ubuntu-noble.yml, debian.yml, redhat.yml
  # (primary jobs only — system-deps are in the job below)
  # 26 matrix entries total: 5 jammy + 5 noble + 4 debian + 12 rhel
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: ${{ matrix.container_opts }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Ubuntu 22.04 (Jammy) ──────────────────────────────────────────
          - name: "Ubuntu 22.04 • g++ • ROCm 6.3"
            image: dgaliffiamd/rocprofiler-systems:ci-rocm-6.3-ubuntu-22.04
            distro: jammy
            compiler: g++
            cc: gcc
            cdash_suffix: ubuntu-jammy-g++-rocm-6.3-python-internal-dyninst-hidden-viz
            cmake_flags: >-
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_INSTALL_PREFIX=/opt/rocprofiler-systems-dev
              -DROCPROFSYS_BUILD_TESTING=ON
              -DROCPROFSYS_USE_PYTHON=ON
              -DROCPROFSYS_BUILD_DYNINST=ON
              -DROCPROFSYS_BUILD_TBB=ON
              -DROCPROFSYS_BUILD_ELFUTILS=ON
              -DROCPROFSYS_BUILD_LIBIBERTY=ON
              -DROCPROFSYS_BUILD_HIDDEN_VISIBILITY=ON
              -DROCPROFSYS_PYTHON_PREFIX=/opt/conda/envs
              "-DROCPROFSYS_PYTHON_ENVS=py3.8;py3.9;py3.10;py3.11"
              -DROCPROFSYS_STRIP_LIBRARIES=OFF
              -DROCPROFSYS_MAX_THREADS=64
              "-DROCPROFSYS_DISABLE_EXAMPLES=transpose;rccl;openmp-target;openmp-vv;videodecode;jpegdecode;network"
              -DUSE_CLANG_OMP=OFF
            python_envs_glob: "py3.{8,9,10,11}"
            install_prefix: /opt/rocprofiler-systems-dev
            install_cleanup: "rm -fr /opt/rocprofiler-systems-dev/"
            cpack_prefix: /opt/rocprofiler-systems
            container_opts: ""
            is_rhel: false
            use_setup_env: false
            kill_perfetto: false
            apt_install_compiler: true
            sanity_check_rocm: true
            test_env_modules: true
            ccache_key_distro: ubuntu-jammy

          - name: "Ubuntu 22.04 • g++ • ROCm 6.4"
            image: dgaliffiamd/rocprofiler-systems:ci-rocm-6.4-ubuntu-22.04
            distro: jammy
            compiler: g++
            cc: gcc
            cdash_suffix: ubuntu-jammy-g++-rocm-6.4-python-internal-dyninst-hidden-viz
