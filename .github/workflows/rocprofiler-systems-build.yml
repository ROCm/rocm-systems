            cpack_prefix: ""
            container_opts: "--shm-size=512m"
            is_rhel: true
            os_major: "10"
            use_setup_env: true
            kill_perfetto: true
            apt_install_compiler: false
            sanity_check_rocm: false
            test_env_modules: false
            ccache_key_distro: redhat

    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      ROCPROFSYS_CI: 'ON'
      ROCPROFSYS_MAX_THREADS: '64'
      ROCPROFSYS_KEEP_TEST_OUTPUT: '0'
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            projects/rocprofiler-systems/
            .gitmodules

      - name: Configure ROCm environment (Ubuntu / Debian)
        if: ${{ !matrix.is_rhel }}
        shell: bash
        run: |
          echo "/opt/rocm/bin" >> $GITHUB_PATH
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Configure RHEL environment
        if: ${{ matrix.is_rhel }}
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.compiler }}" >> $GITHUB_ENV
          echo "OS_VERSION_MAJOR=$(cat /etc/os-release | grep 'VERSION_ID' | sed 's/=/ /1' | awk '{print $NF}' | sed 's/"//g' | sed 's/\./ /g' | awk '{print $1}')" >> $GITHUB_ENV
          echo "/opt/rocm/bin" >> $GITHUB_PATH
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Install compiler packages (Jammy)
        if: ${{ matrix.apt_install_compiler }}
        timeout-minutes: 25
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 #v4.0.0
        with:
          retry_wait_seconds: 30
          timeout_minutes: 25
          max_attempts: 5
          command: |
            cd projects/rocprofiler-systems/
            apt-get update &&
            apt-get upgrade -y &&
            apt-get install -y ${{ matrix.compiler }} &&
            apt-get autoclean

      - name: Install RHEL-specific packages
        if: ${{ matrix.is_rhel }}
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          if [ "${{ matrix.os_major }}" = "8" ]; then
            wget https://commondatastorage.googleapis.com/perfetto-luci-artifacts/v47.0/linux-amd64/trace_processor_shell -P /opt/trace_processor/bin &&
            chmod +x /opt/trace_processor/bin/trace_processor_shell
            echo "ROCPROFSYS_TRACE_PROC_SHELL=/opt/trace_processor/bin/trace_processor_shell" >> $GITHUB_ENV
          fi
          if [ "${{ matrix.os_major }}" = "10" ]; then
            dnf install -y --enablerepo=crb mpich mpich-devel
            echo "/usr/lib64/mpich/bin" >> $GITHUB_PATH
          fi

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.ccache_key_distro }}-${{ github.job }}-${{ matrix.distro }}-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.ccache_key_distro }}-${{ github.job }}-${{ matrix.distro }}-${{ matrix.compiler }}-

      - name: Configure ccache
        shell: bash
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --max-size=1G
          ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime,pch_defines
          ccache -z
          ccache -p | head -20

      - name: Install Python test dependencies
        timeout-minutes: 10
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          for env_dir in /opt/conda/envs/${{ matrix.python_envs_glob }}/; do
            if [ -d "${env_dir}" ] && [ -x "${env_dir}bin/python3" ]; then
              echo "Installing requirements into ${env_dir}"
              "${env_dir}bin/python3" -m pip install -r requirements.txt
            fi
          done

      - name: Sanity check ROCm
        if: ${{ matrix.sanity_check_rocm }}
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          /opt/rocm/bin/hipcc -O3 -c ./examples/transpose/transpose.cpp -o /tmp/transpose.o

      - name: Test Environment Modules
        if: ${{ matrix.test_env_modules }}
        timeout-minutes: 15
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          set -v
          source /usr/share/modules/init/$(basename ${SHELL})
          module avail

      - name: Configure, Build, and Test
        timeout-minutes: 115
        shell: bash
        working-directory: projects/rocprofiler-systems/
        env:
          GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          git config --global --add safe.directory ${PWD}
          echo "CMake version: $(cmake --version | head -n 1)"
          echo "Compiler version: $(${{ matrix.compiler }} --version | head -n 1)"
          python3 ./scripts/run-ci.py -B build \
            --name "${{ github.repository_owner }}-${{ github.ref_name }}-${{ matrix.cdash_suffix }}" \
            --build-jobs $(nproc) \
            --site GitHub \
            -- \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            ${{ matrix.cmake_flags }} \
            -DROCPROFSYS_BUILD_EXAMPLES=ON \
            -DROCPROFSYS_BUILD_NUMBER=${{ github.run_attempt }} \
            -- \
            -LE "network|gpu" || \
            { cat build/Testing/Temporary/LastBuild*.log 2>/dev/null; exit 1; }

      - name: Annotate build warnings and errors
        if: always()
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          shopt -s nullglob
          logs=(build/Testing/Temporary/LastBuild*.log)
          [ ${#logs[@]} -eq 0 ] && exit 0
          WARNINGS=$(grep -h ' warning:' "${logs[@]}" 2>/dev/null | wc -l)
          ERRORS=$(grep -h ' error:' "${logs[@]}" 2>/dev/null | wc -l)
          if [ "$((WARNINGS + ERRORS))" -gt 0 ]; then
            echo "::warning::Build: ${ERRORS} error(s), ${WARNINGS} warning(s) — expand step for details"
          fi

      - name: ccache stats
        if: always()
        shell: bash
        run: |
          echo "=== ccache stats ==="
          ccache -s -v || true
          echo "=== ccache dir size ==="
          du -sh "${CCACHE_DIR}" || true

      - name: Check for leftover buffered files
        timeout-minutes: 5
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          set -v
          if find /tmp -maxdepth 1 -name 'buffered*' -print -quit | grep -q .; then
            echo "Error: Found leftover buffered storage files in /tmp:"
            ls -lh /tmp/buffered*
            exit 1
          else
            echo "✓ No buffered storage files found in /tmp"
          fi

      - name: Install
        timeout-minutes: 10
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          cmake --build build --target install --parallel $(nproc)
          ${{ matrix.install_cleanup }}

      - name: CPack and Install
        if: ${{ !matrix.is_rhel }}
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          cd build
          cpack -G STGZ
          mkdir -p ${{ matrix.cpack_prefix }}
          ./rocprofiler-systems-*.sh --prefix=${{ matrix.cpack_prefix }} --exclude-subdir --skip-license

      - name: Test Install with Modulefile
        if: ${{ !matrix.use_setup_env }}
        timeout-minutes: 15
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          set -v
          source /usr/share/modules/init/$(basename ${SHELL})
          module use ${{ matrix.cpack_prefix }}/share/modulefiles
          module avail
          module load rocprofiler-systems
          ./scripts/test-install.sh --test-rocprof-sys-{instrument,avail,sample,python,rewrite,runtime}=1

      - name: Test Install with setup-env.sh
        if: ${{ matrix.use_setup_env }}
        timeout-minutes: 10
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          set -v
          source /opt/rocprofiler-systems/share/rocprofiler-systems/setup-env.sh
          export PYTHON_EXECUTABLE=/opt/conda/envs/py3.8/bin/python
          export PATH=/opt/conda/envs/py3.8/bin:${PATH}
          ./scripts/test-install.sh --test-rocprof-sys-{instrument,avail,sample,rewrite,runtime,python}=1

      - name: Test User API
        timeout-minutes: 10
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          set -v
          ./scripts/test-find-package.sh --install-dir ${{ matrix.install_prefix }}

      - name: Kill Perfetto
        if: ${{ matrix.kill_perfetto && (success() || failure()) }}
        continue-on-error: true
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          set +e
          RUNNING_PROCS=$(pgrep trace_processor_shell)
          if [ -n "${RUNNING_PROCS}" ]; then kill -s 9 ${RUNNING_PROCS}; fi

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: projects/rocprofiler-systems/build/test-results.xml
          check_name: "Tests — ${{ matrix.name }}"
          comment_mode: always

      - name: CTest artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ github.job }}-${{ strategy.job-index }}-log
          path: |
            projects/rocprofiler-systems/build/*.log

      - name: Data artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ github.job }}-${{ strategy.job-index }}-files
          path: |
            projects/rocprofiler-systems/build/rocprofsys-tests-config/*.cfg
            projects/rocprofiler-systems/build/rocprofsys-tests-output/**/*.txt
            projects/rocprofiler-systems/build/rocprofsys-tests-output/**/*-instr*.json

  # ──────────────────────────────────────────────────────────────────────────
  # System-dependency builds: validate that system-provided libs substitute
  # for the bundled ones (BUILD_{TBB,ELFUTILS,LIBIBERTY}=OFF).
  # 8 matrix entries: 2 jammy + 2 noble + 4 rhel (9×2 + 10×2)
