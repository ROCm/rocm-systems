            use_clang_omp: "ON"
            cdash_suffix: rhel-10-system-deps-amdclang++
            cmake_flags: >-
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_INSTALL_PREFIX=/opt/rocprofiler-systems-dev
              -DROCPROFSYS_BUILD_TESTING=ON
              -DROCPROFSYS_USE_PYTHON=ON
              -DROCPROFSYS_USE_MPI_HEADERS=ON
              -DROCPROFSYS_CI_MPI_RUN_AS_ROOT=ON
              -DROCPROFSYS_BUILD_DYNINST=ON
              -DROCPROFSYS_BUILD_TBB=OFF
              -DROCPROFSYS_BUILD_ELFUTILS=OFF
              -DROCPROFSYS_BUILD_LIBIBERTY=OFF
              -DROCPROFSYS_BUILD_HIDDEN_VISIBILITY=ON
              -DROCPROFSYS_PYTHON_PREFIX=/opt/conda/envs
              "-DROCPROFSYS_PYTHON_ENVS=py3.8;py3.9;py3.10;py3.11;py3.12;py3.13"
              -DROCPROFSYS_STRIP_LIBRARIES=OFF
              -DROCPROFSYS_MAX_THREADS=64
              "-DROCPROFSYS_DISABLE_EXAMPLES=transpose;rccl;openmp-target;openmp-vv;videodecode;jpegdecode;network"
              -DUSE_CLANG_OMP=ON
            python_envs_glob: "py3.{8,9,10,11,12,13}"
            install_prefix: /opt/rocprofiler-systems
            container_opts: "--shm-size=512m"
            is_rhel: true
            os_major: "10"
            use_setup_env: true
            kill_perfetto: true
            sanity_check_rocm: false
            ccache_key_distro: redhat-system-deps

    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      ROCPROFSYS_CI: 'ON'
      ROCPROFSYS_MAX_THREADS: '64'
      ROCPROFSYS_KEEP_TEST_OUTPUT: '0'
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            projects/rocprofiler-systems/
            .gitmodules

      - name: Configure ROCm environment (Ubuntu)
        if: ${{ !matrix.is_rhel }}
        shell: bash
        run: |
          echo "/opt/rocm/bin" >> $GITHUB_PATH
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Configure RHEL environment
        if: ${{ matrix.is_rhel }}
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.compiler }}" >> $GITHUB_ENV
          echo "OS_VERSION_MAJOR=$(cat /etc/os-release | grep 'VERSION_ID' | sed 's/=/ /1' | awk '{print $NF}' | sed 's/"//g' | sed 's/\./ /g' | awk '{print $1}')" >> $GITHUB_ENV
          echo "/opt/rocm/bin" >> $GITHUB_PATH
          echo "/opt/rocm/llvm/bin" >> $GITHUB_PATH
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Install RHEL mpich (RHEL 10)
        if: ${{ matrix.is_rhel && matrix.os_major == '10' }}
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          dnf install -y --enablerepo=crb mpich mpich-devel
          echo "/usr/lib64/mpich/bin" >> $GITHUB_PATH

      - name: Install system dependency packages (Ubuntu)
        if: ${{ !matrix.is_rhel }}
        timeout-minutes: 25
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 #v4.0.0
        with:
          retry_wait_seconds: 30
          timeout_minutes: 25
          max_attempts: 5
          command: |
            cd projects/rocprofiler-systems/
            apt-get update &&
            apt-get upgrade -y &&
            apt-get install -y ${{ matrix.system_deps_apt }} &&
            apt-get autoclean

      - name: Install system dependency packages (RHEL)
        if: ${{ matrix.is_rhel }}
        timeout-minutes: 25
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 #v4.0.0
        with:
          retry_wait_seconds: 30
          timeout_minutes: 25
          max_attempts: 5
          shell: bash
          command: |
            dnf install -y --enablerepo=crb tbb-devel
            dnf install -y binutils-devel
            dnf clean all

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.ccache_key_distro }}-${{ github.job }}-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.ccache_key_distro }}-${{ github.job }}-${{ matrix.compiler }}-

      - name: Configure ccache
        shell: bash
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --max-size=1G
          ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime,pch_defines
          ccache -z
          ccache -p | head -20

      - name: Install Python test dependencies
        timeout-minutes: 10
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          for env_dir in /opt/conda/envs/${{ matrix.python_envs_glob }}/; do
            if [ -d "${env_dir}" ] && [ -x "${env_dir}bin/python3" ]; then
              echo "Installing requirements into ${env_dir}"
              "${env_dir}bin/python3" -m pip install -r requirements.txt
            fi
          done

      - name: Sanity check ROCm
        if: ${{ matrix.sanity_check_rocm }}
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          /opt/rocm/bin/hipcc -O3 -c ./examples/transpose/transpose.cpp -o /tmp/transpose.o

      - name: Configure, Build, and Test with system dependencies
        timeout-minutes: 115
        shell: bash
        working-directory: projects/rocprofiler-systems/
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          git config --global --add safe.directory ${PWD}
          echo "CMake version: $(cmake --version | head -n 1)"
          echo "Compiler version: $(${{ matrix.compiler }} --version | head -n 1)"
          echo "Testing build with SYSTEM dependencies (ROCPROFSYS_BUILD_{TBB,ELFUTILS,LIBIBERTY}=OFF)"
          python3 ./scripts/run-ci.py -B build \
            --name "${{ github.repository_owner }}-${{ github.ref_name }}-${{ matrix.cdash_suffix }}" \
            --build-jobs $(nproc) \
            --site GitHub \
            -- \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            ${{ matrix.cmake_flags }} \
            -DROCPROFSYS_BUILD_EXAMPLES=ON \
            -DROCPROFSYS_BUILD_NUMBER=${{ github.run_attempt }} \
            -- \
            -LE "network|gpu" || \
            { cat build/Testing/Temporary/LastBuild*.log 2>/dev/null; exit 1; }

      - name: Annotate build warnings and errors
        if: always()
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          shopt -s nullglob
          logs=(build/Testing/Temporary/LastBuild*.log)
          [ ${#logs[@]} -eq 0 ] && exit 0
          WARNINGS=$(grep -h ' warning:' "${logs[@]}" 2>/dev/null | wc -l)
          ERRORS=$(grep -h ' error:' "${logs[@]}" 2>/dev/null | wc -l)
          if [ "$((WARNINGS + ERRORS))" -gt 0 ]; then
            echo "::warning::Build: ${ERRORS} error(s), ${WARNINGS} warning(s) — expand step for details"
          fi

      - name: ccache stats
        if: always()
        shell: bash
        run: |
          echo "=== ccache stats ==="
          ccache -s -v || true
          echo "=== ccache dir size ==="
          du -sh "${CCACHE_DIR}" || true

      - name: Install
        timeout-minutes: 10
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          cmake --install build --prefix ${{ matrix.install_prefix }}

      - name: Test Install with Modulefile
        if: ${{ !matrix.use_setup_env }}
        timeout-minutes: 15
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          set -v
          source /usr/share/modules/init/$(basename ${SHELL})
          module use ${{ matrix.install_prefix }}/share/modulefiles
          module avail
          module load rocprofiler-systems
          ./scripts/test-install.sh --test-rocprof-sys-{instrument,avail,sample,python,rewrite,runtime}=1

      - name: Test Install with setup-env.sh
        if: ${{ matrix.use_setup_env }}
        timeout-minutes: 10
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          set -v
          source ${{ matrix.install_prefix }}/share/rocprofiler-systems/setup-env.sh
          export PYTHON_EXECUTABLE=/opt/conda/envs/py3.8/bin/python
          export PATH=/opt/conda/envs/py3.8/bin:${PATH}
          ./scripts/test-install.sh --test-rocprof-sys-{instrument,avail,sample,rewrite,runtime,python}=1

      - name: Kill Perfetto
        if: ${{ matrix.kill_perfetto && (success() || failure()) }}
        continue-on-error: true
        shell: bash
        working-directory: projects/rocprofiler-systems/
        run: |
          set +e
          RUNNING_PROCS=$(pgrep trace_processor_shell)
          if [ -n "${RUNNING_PROCS}" ]; then kill -s 9 ${RUNNING_PROCS}; fi

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: projects/rocprofiler-systems/build/test-results.xml
          check_name: "Tests — ${{ matrix.name }}"
          comment_mode: always

      - name: CTest artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ github.job }}-${{ strategy.job-index }}-log
          path: |
            projects/rocprofiler-systems/build/*.log

      - name: Data artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ github.job }}-${{ strategy.job-index }}-files
          path: |
            projects/rocprofiler-systems/build/rocprofsys-tests-config/*.cfg
            projects/rocprofiler-systems/build/rocprofsys-tests-output/**/*.txt
            projects/rocprofiler-systems/build/rocprofsys-tests-output/**/*-instr*.json

  rhel-compiler-check:
    name: RHEL compiler check / gcc-toolset-${{ matrix.gcc-toolset }}
    runs-on: ubuntu-latest
    container:
      image: dgaliffiamd/rocprofiler-systems:ci-rocm-${{ matrix.rocm-version }}-rhel-${{ matrix.os-release }}
      options: --shm-size=512m

    strategy:
      fail-fast: false
      matrix:
        os-release: ['8.10']
        rocm-version: ['7.2']
        gcc-toolset: ['13', '14', '15']
        build-type: ['Release']

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            projects/rocprofiler-systems
            .gitmodules
          submodules: recursive

      - name: Install GCC Toolset
        shell: bash
        run: |
          dnf install -y \
            gcc-toolset-${{ matrix.gcc-toolset }}-binutils \
            gcc-toolset-${{ matrix.gcc-toolset }}-gcc \
            gcc-toolset-${{ matrix.gcc-toolset }}-gcc-c++ \
            gcc-toolset-${{ matrix.gcc-toolset }}-gcc-gfortran
          TS=/opt/rh/gcc-toolset-${{ matrix.gcc-toolset }}/root/usr/bin
          echo "CC=${TS}/gcc" >> "${GITHUB_ENV}"
          echo "CXX=${TS}/g++" >> "${GITHUB_ENV}"
          echo "${TS}" >> "${GITHUB_PATH}"
          "${TS}/gcc" --version

      - name: Configure environment
        shell: bash
        run: |
          echo "/opt/rocm/bin" >> "${GITHUB_PATH}"
          echo "ROCM_PATH=/opt/rocm" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> "${GITHUB_ENV}"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-redhat-${{ github.job }}-${{ matrix.os-release }}-gcc${{ matrix.gcc-toolset }}-${{ matrix.rocm-version }}-${{ matrix.build-type }}-${{ github.sha }}
          restore-keys: |
            ccache-redhat-${{ github.job }}-${{ matrix.os-release }}-gcc${{ matrix.gcc-toolset }}-${{ matrix.rocm-version }}-${{ matrix.build-type }}-
            ccache-redhat-${{ github.job }}-${{ matrix.os-release }}-gcc${{ matrix.gcc-toolset }}-${{ matrix.rocm-version }}-

      - name: Configure ccache
        shell: bash
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --max-size=1G
          ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime,pch_defines
          ccache -z
          ccache -p | head -20

      - name: Configure
        timeout-minutes: 30
        shell: bash
        working-directory: projects/rocprofiler-systems/
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${PWD}"
          cmake --version
          cmake -B build . \
            -DCMAKE_C_COMPILER=${CC} \
            -DCMAKE_CXX_COMPILER=${CXX} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_INSTALL_PREFIX=/opt/rocprofiler-systems \
            -DROCPROFSYS_BUILD_TESTING=OFF \
            -DROCPROFSYS_USE_PYTHON=ON \
            -DROCPROFSYS_BUILD_DYNINST=ON \
            -DROCPROFSYS_BUILD_TBB=ON \
            -DROCPROFSYS_BUILD_ELFUTILS=ON \
            -DROCPROFSYS_BUILD_LIBIBERTY=ON \
            -DROCPROFSYS_PYTHON_PREFIX=/opt/conda/envs \
            "-DROCPROFSYS_PYTHON_ENVS=py3.8;py3.9;py3.10;py3.11;py3.12;py3.13" \
            -DROCPROFSYS_BUILD_NUMBER=${{ github.run_attempt }}

      - name: Build
        timeout-minutes: 60
        shell: bash
        working-directory: projects/rocprofiler-systems/
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake --build build --target all --parallel $(nproc)

      - name: ccache stats
        if: always()
        shell: bash
        run: |
          echo "=== ccache stats ==="
          ccache -s -v || true
          echo "=== ccache dir size ==="
          du -sh "${CCACHE_DIR}" || true

