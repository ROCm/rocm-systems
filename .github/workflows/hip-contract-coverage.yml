name: HIP contract-test coverage

# Two pure static-analysis gates for the contract-test suite (no ROCm, GPU, or
# build required, so both run quickly and always-on):
#   1. Coverage: fails when a newly-added public HIP runtime API (declared in
#      projects/hip/include/hip/hip_runtime_api.h) ships without a corresponding
#      contract test and is not on the intentionally-uncovered allowlist
#      (projects/hip-tests/catch/contract/uncovered_apis.txt).
#   2. Test plan: fails when catch/TEST_PLAN.md is out of date with the test
#      sources (a case was added, renamed, or removed, or an @asserts tag
#      changed, without regenerating the plan).
#
# See projects/hip-tests/catch/contract/AUTHORING.md for how to add a contract
# test and keep both current.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "projects/hip/include/hip/**"
      - "projects/hip-tests/catch/contract/**"
      - "projects/hip-tests/catch/config/configs/contract.yaml"
      - "projects/hip-tests/catch/tools/**"
      - "projects/hip-tests/catch/TEST_PLAN.md"

jobs:
  contract-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check contract-test coverage
        run: |
          python projects/hip-tests/catch/contract/tools/check_contract_coverage.py --check

      - name: Check test plan is up to date
        run: |
          python projects/hip-tests/catch/tools/gen_test_plan.py --check
