name: ABI Compliance Check

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'projects/amdsmi/**'
  push:
    branches:
      - develop
    paths:
      - 'projects/amdsmi/**'
  workflow_dispatch:

# Runs untrusted fork code on pull_request events: no write permissions here.
# PR labeling is handled by abi-compliance-report.yml via workflow_run on the
# trusted base ref where pull-requests: write is safe to hold.
permissions:
  contents: read

jobs:
  major_abi_check:
    name: Major ABI Compliance Check
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Environment
        run: |
          sudo rm -rf $GITHUB_WORKSPACE/* || true
          sudo rm -rf $GITHUB_WORKSPACE/.[!.]* || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq perl build-essential git universal-ctags
          git clone https://github.com/lvc/abi-compliance-checker.git
          cd abi-compliance-checker
          sudo make install
          abi-compliance-checker --version

      - name: Checkout current code (new version)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Vendor abi_check.py from the trusted base ref so the fork's copy is never executed.
      - name: Checkout base ref to vendor ABI check script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.base_ref || github.ref_name }}
          persist-credentials: false
          path: _base

      - name: Fetch base branch for PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Fetching base branch: $BASE_REF"
          git fetch origin "$BASE_REF:$BASE_REF"
          git branch -a

      - name: Determine Base Ref
        id: base_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "ref=$BASE_REF" >> $GITHUB_OUTPUT
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            echo "ref=$BEFORE_SHA" >> $GITHUB_OUTPUT
          else
            echo "ref=" >> $GITHUB_OUTPUT
          fi

      - name: Run Major ABI Compliance Check
        id: run_major
        if: steps.base_ref.outputs.ref != ''
        env:
          BASE_REF: ${{ steps.base_ref.outputs.ref }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 _base/projects/amdsmi/tests/abi_check/abi_check.py \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            --project-path projects/amdsmi \
            --mode major
        continue-on-error: true

      - name: Save outcome for PR labeling
        if: always() && github.event_name == 'pull_request'
        env:
          OUTCOME: ${{ steps.run_major.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "$OUTCOME" > outcome.txt
          echo "$PR_NUMBER" > pr_number.txt

      - name: Upload Major ABI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-abi-report
          path: |
            abi_report.html
            outcome.txt
            pr_number.txt
          if-no-files-found: warn

      - name: Report Major ABI Check Results
        if: always()
        env:
          OUTCOME: ${{ steps.run_major.outcome }}
        run: |
          if [[ "$OUTCOME" == "failure" ]]; then
            echo "::warning::MAJOR ABI BREAKAGE FOUND. Check Run Major ABI Compliance Check logs or the major-abi-report artifact."
          elif [[ "$OUTCOME" == "success" ]]; then
            echo "Major ABI check succeeded."
          else
            echo "Major ABI check was skipped (no baseline ref available)."
          fi

  minor_abi_check:
    name: Minor ABI Compliance Check
    needs: major_abi_check
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Environment
        run: |
          sudo rm -rf $GITHUB_WORKSPACE/* || true
          sudo rm -rf $GITHUB_WORKSPACE/.[!.]* || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq perl build-essential git universal-ctags
          git clone https://github.com/lvc/abi-compliance-checker.git
          cd abi-compliance-checker
          sudo make install
          abi-compliance-checker --version

      - name: Checkout current code (new version)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Vendor abi_check.py from the trusted base ref so the fork's copy is never executed.
      - name: Checkout base ref to vendor ABI check script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.base_ref || github.ref_name }}
          persist-credentials: false
          path: _base

      - name: Fetch base branch for PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Fetching base branch: $BASE_REF"
          git fetch origin "$BASE_REF:$BASE_REF"
          git branch -a

      - name: Determine Base Ref
        id: base_ref_minor
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "ref=$BASE_REF" >> $GITHUB_OUTPUT
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            echo "ref=$BEFORE_SHA" >> $GITHUB_OUTPUT
          else
            echo "ref=" >> $GITHUB_OUTPUT
          fi

      - name: Run Minor ABI Compliance Check (Strict)
        id: run_minor
        if: steps.base_ref_minor.outputs.ref != ''
        env:
          BASE_REF: ${{ steps.base_ref_minor.outputs.ref }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 _base/projects/amdsmi/tests/abi_check/abi_check.py \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            --project-path projects/amdsmi \
            --mode minor
        continue-on-error: true

      - name: Save outcome for PR labeling
        if: always() && github.event_name == 'pull_request'
        env:
          OUTCOME: ${{ steps.run_minor.outcome }}
        run: |
          echo "$OUTCOME" > outcome.txt

      - name: Upload Minor ABI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minor-abi-report
          path: |
            abi_report.html
            outcome.txt
          if-no-files-found: warn

      - name: Report Minor ABI Check Results
        if: always()
        env:
          OUTCOME: ${{ steps.run_minor.outcome }}
        run: |
          if [[ "$OUTCOME" == "failure" ]]; then
            echo "::warning::MINOR ABI CHANGES FOUND (STRICT CHECK). Check Run Minor ABI Compliance Check logs or the minor-abi-report artifact."
          elif [[ "$OUTCOME" == "success" ]]; then
            echo "Minor ABI check (Strict) succeeded."
          else
            echo "Minor ABI check was skipped (no baseline ref available)."
          fi
