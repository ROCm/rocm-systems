name: RCCL host unit tests

# Builds and runs RCCL's CPU-only host unit-test binary (rccl-HostUnitTests, added
# in PR #9320) on every PR touching projects/rccl/**. No GPU or network hardware is
# required: the binary is compiled with `hipcc --offload-host-only` and links no
# HIP/ROCm runtime. The workflow's own path is in the trigger so it self-runs on the
# PR that introduces it. JIRA ID: AICOMRCCL-1711

on:
  pull_request:
    paths:
      - 'projects/rccl/**'
      - '.github/workflows/rccl-host-unit-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  host-unit-tests:
    name: Host unit tests (CPU-only)
    runs-on: ubuntu-latest
    container:
      image: rocm/dev-ubuntu-22.04:7.2
    env:
      ROCM_PATH: /opt/rocm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build deps
        # The ROCm dev image ships hipcc/hipify but not cmake or a host toolchain.
        run: |
          apt-get update
          apt-get install -y cmake git python3 build-essential rocm-cmake \
            moreutils libgtest-dev libgmock-dev libfmt-dev

      - name: Put ROCm on PATH
        run: echo "/opt/rocm/bin" >> "$GITHUB_PATH"

      - name: Stage hipified sources
        working-directory: projects/rccl
        run: |
          cmake -B build -DGPU_TARGETS=gfx942 -DBUILD_TESTS=OFF
          cmake --build build --target hipify_all -j"$(nproc)"

      - name: Build & run host unit tests
        # Build/run/log logic lives in the script so the same command runs locally
        # and in CI, and the suite (filters, flags, build type) can be tuned there
        # without editing this workflow. See run_host_tests.sh for the knobs.
        run: bash projects/rccl/test/host/run_host_tests.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-unit-test-results
          path: |
            projects/rccl/test/host/host_tests.log
            projects/rccl/test/host/host_tests.xml
