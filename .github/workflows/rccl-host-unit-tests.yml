name: RCCL host unit tests

# Builds and runs RCCL's CPU-only host unit-test binary (rccl-HostUnitTests, added
# in PR #9320) on every PR to develop touching projects/rccl/**. No GPU or network
# hardware is required: the binary is compiled with `hipcc --offload-host-only` and
# links no HIP/ROCm runtime. The workflow's own path is in the trigger so it
# self-runs on the PR that introduces it. JIRA ID: AICOMRCCL-1711
#
# TODO(AICOMRCCL-1711): fold this into TheRock's packaged CI once the host-test
# gate stabilizes

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'projects/rccl/**'
      - '.github/workflows/rccl-host-unit-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  rccl-host-unit-tests:
    name: Host unit tests (CPU-only)
    runs-on: ubuntu-24.04
    container:
      image: rocm/dev-ubuntu-22.04:7.14.0-full
    env:
      ROCM_PATH: /opt/rocm
      # Pin a valid arch so RCCL's configure never probes for a GPU (none on CI).
      # hipify compiles no device code, so any gfx9xx works identically.
      GPU_TARGETS: gfx942
    steps:
      - name: Checkout rccl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # rocm-systems is a large monorepo; only fetch what the host tests need.
          sparse-checkout: projects/rccl

      - name: Install build deps
        # The ROCm dev image ships hipcc/hipify but not cmake or a host toolchain.
        # Dependency list lives in run_host_tests.sh (single source of truth).
        run: bash projects/rccl/test/host/run_host_tests.sh deps

      - name: Put ROCm LLVM on PATH
        run: echo "/opt/rocm/llvm/bin" >> "$GITHUB_PATH"

      # Every pipeline command lives in run_host_tests.sh (single source of truth,
      # runnable identically in CI and locally). Each phase is its own step so a
      # failure is clearly attributable to configure vs build vs run.
      - name: RCCL configure
        run: bash projects/rccl/test/host/run_host_tests.sh rccl-configure

      - name: Stage hipified sources
        run: bash projects/rccl/test/host/run_host_tests.sh hipify

      - name: Configure host tests
        run: bash projects/rccl/test/host/run_host_tests.sh configure

      - name: Build host tests
        run: bash projects/rccl/test/host/run_host_tests.sh build

      - name: Run host tests
        run: bash projects/rccl/test/host/run_host_tests.sh run

      # Assemble the coverage profiles the run phase produced into per-binary
      # reports plus an overall line/branch union (the CI coverage metric). Runs
      # even if the suite failed so partial coverage is still captured.
      - name: Coverage
        if: always()
        run: bash projects/rccl/test/host/run_host_tests.sh coverage

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-unit-test-results
          path: |
            projects/rccl/test/host/host_tests.log
            projects/rccl/test/host/host_tests.xml
            projects/rccl/test/host/build/coverage/**/coverage.txt
            projects/rccl/test/host/build/coverage/**/html/**
            projects/rccl/test/host/build/coverage/overall/combined.lcov
            projects/rccl/test/host/build/coverage/overall/summary.txt
