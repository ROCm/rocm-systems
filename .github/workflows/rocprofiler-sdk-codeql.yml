name: rocprofiler-sdk Advanced Analysis

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rocprofiler-sdk-codeql.yml'
      - '.github/actions/rocprofiler-sdk-util/action.yml'
      - 'projects/rocprofiler-sdk/**'
      - 'shared/sha256/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-sdk/CODEOWNERS'
      - '!projects/rocprofiler-sdk/source/docs/**'

  push:
    branches:
      - develop
    paths:
      - '.github/workflows/rocprofiler-sdk-codeql.yml'
      - '.github/actions/rocprofiler-sdk-util/action.yml'
      - 'projects/rocprofiler-sdk/**'
      - 'shared/sha256/**'
      - '!**/*.md'
      - '!**/*.rtf'
      - '!**/*.rst'
      - '!**/.markdownlint-ci2.yaml'
      - '!**/.readthedocs.yaml'
      - '!**/.spellcheck.local.yaml'
      - '!**/.wordlist.txt'
      - '!projects/rocprofiler-sdk/CODEOWNERS'
      - '!projects/rocprofiler-sdk/source/docs/**'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Python and Actions analysis do not need a ROCm build or private registry
    # credentials, which are unavailable to pull requests from forks.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: python
          build-mode: none
        - language : actions
          build-mode: none
    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/actions/rocprofiler-sdk-util
          projects/rocprofiler-sdk
          shared/sha256
          projects/clr
          projects/hip
          .github/workflows/rocprofiler-sdk-codeql.yml
          .github/workflows/rocprofiler-sdk-formatting.yml
        submodules: 'false'

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
