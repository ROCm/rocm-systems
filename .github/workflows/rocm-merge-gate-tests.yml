name: ROCm Merge Gate tests

# Unit tests for the rocm-merge-gate merge gate. This is a plain pull_request
# workflow with a read-only token, kept separate from rocm-merge-gate.yml so PR
# code never runs under that workflow's pull_request_target privileges.

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/rocm-merge-gate.yml'
      - '.github/workflows/rocm-merge-gate-tests.yml'
      - '.github/scripts/rocm_merge_gate.py'
      - '.github/scripts/tests/rocm_merge_gate_test.py'
  pull_request:
    paths:
      - '.github/workflows/rocm-merge-gate.yml'
      - '.github/workflows/rocm-merge-gate-tests.yml'
      - '.github/scripts/rocm_merge_gate.py'
      - '.github/scripts/tests/rocm_merge_gate_test.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  rocm-merge-gate-tests:
    runs-on: ubuntu-24.04
    steps:
      # Only .github is checked out; `validate` resolves freeze paths through
      # git, which reads the commit tree rather than the working tree.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # pytest matches the other .github/scripts tests; pyyaml lets the tests
      # assert on the freeze list that rocm-merge-gate.yml actually ships.
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run merge gate tests
        run: python -m pytest .github/scripts/tests/rocm_merge_gate_test.py -v

      # Fails if FREEZES is unparseable or names a path that is not in the repo.
      - name: Validate the shipped freeze config
        run: python .github/scripts/rocm_merge_gate.py validate
