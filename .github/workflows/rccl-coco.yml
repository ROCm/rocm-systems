name: RCCL coco

# Single entry point for coco (ROCm/tRCCL) on Ruby and OCI: scheduled runs, PR
# build/smoke, and manual dispatch of either. Every fan-out job calls the
# shared launcher, rccl-coco-run.yml.
#
# The setup job resolves mode once, selecting which fan-out jobs run:
#   - schedule, weekday cron            -> nightly,            trigger_kind=scheduled
#   - schedule, Saturday cron           -> weekly or monthly,   trigger_kind=scheduled
#     (monthly on the 3rd Saturday, weekly on the others)
#   - pull_request                      -> pr,                  trigger_kind=ci
#   - workflow_dispatch with pr_number  -> pr,                  trigger_kind=ci
#   - workflow_dispatch without one     -> periodic_mode input, trigger_kind=manual
#
# Fork PRs are skipped: a fork-triggered run gets no secrets. A maintainer
# dispatches those by hand with pr_number and pr_sha.
#
# "RCCL PR gate" is the check to mark required on the protected branches.
#
# Cron is UTC and ignores DST, so a fixed entry drifts an hour across the year.
# 03:47 UTC is 21:47 CST in winter and 22:47 CDT in summer, both after the
# 21:00 CST window in which the runner's node may be restarted. Neither entry
# may move earlier than 03:00 UTC, which is when that window opens.
on:
  schedule:
    - cron: '47 3 * * 1-5'
    - cron: '47 3 * * 6'
  # Unfiltered by path: a workflow skipped by `paths` never reports its checks,
  # so a required check would block every PR that does not touch RCCL. The path
  # test is the `changes` job.
  pull_request:
    branches: [develop, main, rccl-develop, rccl_develop]
  workflow_dispatch:
    inputs:
      coco_ref:
        description: 'ROCm/tRCCL ref for the coco harness.'
        type: string
        required: false
        default: 'main'
      dry_run:
        description: 'Resolve stacks and submissions without building or running anything.'
        type: boolean
        required: false
        default: false
      periodic_mode:
        description: 'Which periodic run to drive by hand. Ignored once pr_number is set.'
        type: choice
        options:
          - nightly
          - weekly
          - monthly
        required: false
        default: 'nightly'
      pr_number:
        description: 'Pull request number. Set to re-run PR smoke by hand; leave unset for a manual nightly-style run.'
        type: number
        required: false
      pr_sha:
        description: 'Full 40-hex PR head SHA. Required when pr_number is set.'
        type: string
        required: false
      pr_repo:
        description: 'Monorepo slug. Required when pr_number is set.'
        type: string
        required: false
        default: 'ROCm/rocm-systems'

permissions:
  contents: read

# One in-flight run per PR; every other trigger is keyed on its own run id, so
# a scheduled run is never cancelled by a later one. Cancelling is safe: coco
# traps SIGINT/SIGTERM and scancels its allocations before exiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a PR touches anything this workflow tests; non-PR events resolve
  # true. The path list lives in .github/scripts/rccl_detect_coco_changes.py.
  changes:
    name: Detect RCCL changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # A skipped step publishes no output, so non-PR events fall through to
      # true. Both 'true' and 'false' are non-empty, so a real verdict stands.
      rccl: ${{ steps.filter.outputs.rccl || 'true' }}
    steps:
      - name: Checkout scripts
        if: github.event_name == 'pull_request'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          sparse-checkout: .github/scripts
          # The commit checked out for a PR is the merge commit, whose first
          # parent is the tip of the base branch.
          fetch-depth: 2

      - name: Check for RCCL changes
        id: filter
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/rccl_detect_coco_changes.py --base-ref HEAD^

  # Resolves once for both clusters. Must not be split per cluster: each would
  # clone the harness ref separately and the two could pin different coco
  # commits if that ref moved in between.
  setup:
    name: Setup
    needs: changes
    if: needs.changes.outputs.rccl == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      coco_ref: ${{ steps.resolve.outputs.coco_ref }}
      coco_args: ${{ steps.resolve.outputs.coco_args }}
      trigger_kind: ${{ steps.resolve.outputs.trigger_kind }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_sha: ${{ steps.resolve.outputs.pr_sha }}
      pr_repo: ${{ steps.resolve.outputs.pr_repo }}
    steps:
      # Both action directories are needed: resolve-coco-run's relative `uses:`
      # for checkout-coco-harness resolves against this workspace, not the
      # action's own directory.
      - name: Checkout rocm-systems
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          sparse-checkout: |
            .github/actions/checkout-coco-harness
            .github/actions/resolve-coco-run

      - name: Resolve coco run parameters
        id: resolve
        uses: ./.github/actions/resolve-coco-run
        with:
          coco_ref: ${{ inputs.coco_ref || 'main' }}
          # A scheduled run has no inputs context, so these fall back to the
          # same value their dispatch input defaults to.
          dry_run: ${{ inputs.dry_run || false }}
          periodic_mode: ${{ inputs.periodic_mode || 'nightly' }}
          schedule: ${{ github.event.schedule }}
          pr_number: ${{ inputs.pr_number }}
          pr_sha: ${{ inputs.pr_sha }}
          pr_repo: ${{ inputs.pr_repo }}
          client-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  # Periodic fan-out. Unordered; the cluster queues these itself.
  ruby-perf:
    name: 'Perf (ruby64-rccl-perf-nightly)'
    needs: setup
    if: needs.setup.outputs.mode == 'nightly'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      job: ruby64-rccl-perf-nightly
      runs_on: ruby-linux-slurm-scale-runner
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      # Multi-node sweep across several software stacks; ~6h typical.
      timeout_minutes: 720
      concurrency_group: rccl-coco-nightly-perf

  ruby-perf-weekly:
    name: 'Perf (ruby64-rccl-perf-weekly)'
    needs: setup
    if: needs.setup.outputs.mode == 'weekly'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      job: ruby64-rccl-perf-weekly
      runs_on: ruby-linux-slurm-scale-runner
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      # Topology sweep up to 16 nodes; runs across the weekend.
      timeout_minutes: 2880
      concurrency_group: rccl-coco-weekly-perf

  ruby-perf-monthly:
    name: 'Perf (ruby64-rccl-perf-monthly)'
    needs: setup
    if: needs.setup.outputs.mode == 'monthly'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      job: ruby64-rccl-perf-monthly
      runs_on: ruby-linux-slurm-scale-runner
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      # Weekly's topology sweep plus a full datatype matrix.
      timeout_minutes: 2880
      concurrency_group: rccl-coco-monthly-perf

  ruby-coverage:
    name: 'Coverage (ruby64-rccl-coverage-nightly)'
    needs: setup
    if: needs.setup.outputs.mode == 'nightly'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      job: ruby64-rccl-coverage-nightly
      runs_on: ruby-linux-slurm-scale-runner
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      # Instrumented build; gtest lanes run well slower than release.
      timeout_minutes: 720
      concurrency_group: rccl-coco-nightly-coverage

  ruby-unit:
    name: 'Unit (ruby64-rccl-unit-nightly)'
    needs: setup
    if: needs.setup.outputs.mode == 'nightly'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      job: ruby64-rccl-unit-nightly
      runs_on: ruby-linux-slurm-scale-runner
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      timeout_minutes: 720
      concurrency_group: rccl-coco-nightly-unit

  oci-perf:
    name: 'Perf (oci-rccl-perf-nightly)'
    needs: setup
    if: needs.setup.outputs.mode == 'nightly'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      job: oci-rccl-perf-nightly
      runs_on: oci-linux-slurm-scale-runner
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      timeout_minutes: 720
      concurrency_group: rccl-coco-nightly-oci-perf

  oci-perf-weekly:
    name: 'Perf (oci-rccl-perf-weekly)'
    needs: setup
    if: needs.setup.outputs.mode == 'weekly'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      job: oci-rccl-perf-weekly
      runs_on: oci-linux-slurm-scale-runner
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      timeout_minutes: 2880
      concurrency_group: rccl-coco-weekly-oci-perf

  oci-perf-monthly:
    name: 'Perf (oci-rccl-perf-monthly)'
    needs: setup
    if: needs.setup.outputs.mode == 'monthly'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      job: oci-rccl-perf-monthly
      runs_on: oci-linux-slurm-scale-runner
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      timeout_minutes: 2880
      concurrency_group: rccl-coco-monthly-oci-perf

  oci-unit:
    name: 'Unit (oci-rccl-unit-nightly)'
    needs: setup
    if: needs.setup.outputs.mode == 'nightly'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      job: oci-rccl-unit-nightly
      runs_on: oci-linux-slurm-scale-runner
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      timeout_minutes: 720
      concurrency_group: rccl-coco-nightly-oci-unit

  oci-nixl:
    name: 'NIXL (oci-nixl-nightly)'
    needs: setup
    if: needs.setup.outputs.mode == 'nightly'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      job: oci-nixl-nightly
      runs_on: oci-linux-slurm-scale-runner
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      timeout_minutes: 120
      concurrency_group: rccl-coco-nightly-oci-nixl

  # PR fan-out. Build and smoke are separate jobs per cluster; build compiles a
  # wider stack list (debug, backtrace) than smoke runs. Smoke waits on build
  # and shares its per-run output directory, so coco's cache serves the stacks
  # build already compiled.
  #
  # Nothing here may pass --prune-build: in a directory shared with the other
  # half it deletes that half's build trees. resolve-coco-run withholds it for
  # mode=pr.
  ruby-build:
    name: Ruby build (ruby64-rccl-pr-build)
    needs: setup
    if: needs.setup.outputs.mode == 'pr'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      mode: pr
      build_only: true
      job: ruby64-rccl-pr-build
      runs_on: ruby-linux-slurm-scale-runner
      pr_number: ${{ needs.setup.outputs.pr_number }}
      pr_sha: ${{ needs.setup.outputs.pr_sha }}
      pr_repo: ${{ needs.setup.outputs.pr_repo }}
      software: rccl
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      timeout_minutes: 15
      concurrency_group: rccl-coco-pr-${{ needs.setup.outputs.pr_number }}-ruby-build

  ruby-smoke:
    name: Ruby smoke (ruby64-rccl-pr-smoke)
    needs: [setup, ruby-build]
    if: needs.setup.outputs.mode == 'pr'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      mode: pr
      job: ruby64-rccl-pr-smoke
      runs_on: ruby-linux-slurm-scale-runner
      pr_number: ${{ needs.setup.outputs.pr_number }}
      pr_sha: ${{ needs.setup.outputs.pr_sha }}
      pr_repo: ${{ needs.setup.outputs.pr_repo }}
      software: rccl
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      timeout_minutes: 40
      concurrency_group: rccl-coco-pr-${{ needs.setup.outputs.pr_number }}-ruby-smoke

  oci-build:
    name: OCI build (oci-rccl-pr-build)
    needs: setup
    if: needs.setup.outputs.mode == 'pr'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      mode: pr
      build_only: true
      job: oci-rccl-pr-build
      runs_on: oci-linux-slurm-scale-runner
      pr_number: ${{ needs.setup.outputs.pr_number }}
      pr_sha: ${{ needs.setup.outputs.pr_sha }}
      pr_repo: ${{ needs.setup.outputs.pr_repo }}
      software: rccl
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      timeout_minutes: 15
      concurrency_group: rccl-coco-pr-${{ needs.setup.outputs.pr_number }}-oci-build

  oci-smoke:
    name: OCI smoke (oci-rccl-pr-smoke)
    needs: [setup, oci-build]
    if: needs.setup.outputs.mode == 'pr'
    uses: ./.github/workflows/rccl-coco-run.yml
    secrets: inherit
    with:
      mode: pr
      job: oci-rccl-pr-smoke
      runs_on: oci-linux-slurm-scale-runner
      pr_number: ${{ needs.setup.outputs.pr_number }}
      pr_sha: ${{ needs.setup.outputs.pr_sha }}
      pr_repo: ${{ needs.setup.outputs.pr_repo }}
      software: rccl
      trigger_kind: ${{ needs.setup.outputs.trigger_kind }}
      coco_ref: ${{ needs.setup.outputs.coco_ref }}
      coco_args: ${{ needs.setup.outputs.coco_args }}
      timeout_minutes: 40
      concurrency_group: rccl-coco-pr-${{ needs.setup.outputs.pr_number }}-oci-smoke

  # Runs only when both halves passed. A failed half must keep its directory:
  # the path is keyed on run_id, so "re-run failed jobs" leaves the passing
  # build's output in place for the retried smoke job to reuse, and deleting it
  # would force that retry to compile from cold inside smoke's own budget.
  # Directories left behind by a failed run are collected by the age-based
  # sweep in rccl-coco-run.yml, which is the real backstop either way.
  #
  # Never gating: losing scratch space must not fail a PR that passed.
  ruby-pr-cleanup:
    name: Ruby PR cleanup
    if: >-
      needs.ruby-build.result == 'success' &&
      needs.ruby-smoke.result == 'success'
    needs: [ruby-build, ruby-smoke]
    runs-on: ruby-linux-slurm-scale-runner
    timeout-minutes: 10
    steps:
      - name: Remove the shared per-run directory
        env:
          BUILD_DIR: ${{ needs.ruby-build.outputs.ephemeral_dir }}
          SMOKE_DIR: ${{ needs.ruby-smoke.outputs.ephemeral_dir }}
          RUN_SUBDIR: pr-${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          removed=0
          # Both halves should name the same directory, but that is a tRCCL
          # config invariant this workflow cannot enforce, so try each.
          for target in "${BUILD_DIR:-}" "${SMOKE_DIR:-}"; do
            [[ -n "${target}" && -d "${target}" ]] || continue
            # Refuse anything that is not this run's own subdirectory, so a
            # malformed output can never expand into the parent stage_dir.
            if [[ "$(basename "${target}")" != "${RUN_SUBDIR}" ]]; then
              echo "::warning::Refusing to remove ${target}: not this run's directory."
              continue
            fi
            rm -rf "${target}" && echo "Removed ${target}" || \
              echo "::warning::Could not fully remove ${target}."
            removed=1
          done
          if (( ! removed )); then
            echo "Nothing to remove; the age-based sweep will collect any leftovers."
          fi

  oci-pr-cleanup:
    name: OCI PR cleanup
    if: >-
      needs.oci-build.result == 'success' &&
      needs.oci-smoke.result == 'success'
    needs: [oci-build, oci-smoke]
    runs-on: oci-linux-slurm-scale-runner
    timeout-minutes: 10
    steps:
      - name: Remove the shared per-run directory
        env:
          BUILD_DIR: ${{ needs.oci-build.outputs.ephemeral_dir }}
          SMOKE_DIR: ${{ needs.oci-smoke.outputs.ephemeral_dir }}
          RUN_SUBDIR: pr-${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          removed=0
          for target in "${BUILD_DIR:-}" "${SMOKE_DIR:-}"; do
            [[ -n "${target}" && -d "${target}" ]] || continue
            if [[ "$(basename "${target}")" != "${RUN_SUBDIR}" ]]; then
              echo "::warning::Refusing to remove ${target}: not this run's directory."
              continue
            fi
            rm -rf "${target}" && echo "Removed ${target}" || \
              echo "::warning::Could not fully remove ${target}."
            removed=1
          done
          if (( ! removed )); then
            echo "Nothing to remove; the age-based sweep will collect any leftovers."
          fi

  # The one status check to mark required on the protected branches. It runs
  # on every PR regardless of what the PR touches, so it always reports a
  # result; the smoke jobs cannot be required directly because a skipped
  # `uses:` job never publishes its "<caller> / <callee>" check name at all.
  pr-gate:
    name: RCCL PR gate
    if: always() && github.event_name == 'pull_request'
    needs: [changes, setup, ruby-build, ruby-smoke, oci-build, oci-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require build and smoke to have passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SETUP_RESULT: ${{ needs.setup.result }}
          RCCL_CHANGED: ${{ needs.changes.outputs.rccl }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          RUBY_BUILD_RESULT: ${{ needs.ruby-build.result }}
          RUBY_SMOKE_RESULT: ${{ needs.ruby-smoke.result }}
          OCI_BUILD_RESULT: ${{ needs.oci-build.result }}
          OCI_SMOKE_RESULT: ${{ needs.oci-smoke.result }}
        run: |
          set -euo pipefail
          # Never pass on an inconclusive detection: a failed `changes` job
          # leaves rccl empty, which must not read as "nothing to test".
          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "::error::Change detection did not complete (${CHANGES_RESULT}); cannot confirm whether RCCL was touched."
            exit 1
          fi
          if [[ "${RCCL_CHANGED}" != "true" ]]; then
            echo "No RCCL changes in this PR; coco smoke not required."
            exit 0
          fi
          # Fork-triggered runs get no secrets, so the smoke jobs above were
          # skipped rather than run.
          if [[ "${IS_FORK}" == "true" ]]; then
            echo "::error::Fork PRs do not run coco smoke automatically. A maintainer must dispatch the 'RCCL coco' workflow with this PR's pr_number and pr_sha, confirm it passes, then override this check."
            exit 1
          fi
          # Distinguished from a build or smoke failure: setup resolves the
          # coco commit, so its failure means nothing was dispatched at all.
          if [[ "${SETUP_RESULT}" != "success" ]]; then
            echo "::error::Setup did not complete (${SETUP_RESULT}); no coco run was dispatched."
            exit 1
          fi
          status=0
          for entry in "ruby build:${RUBY_BUILD_RESULT}" \
                       "ruby smoke:${RUBY_SMOKE_RESULT}" \
                       "oci build:${OCI_BUILD_RESULT}" \
                       "oci smoke:${OCI_SMOKE_RESULT}"; do
            echo "${entry%%:*}: ${entry#*:}"
            [[ "${entry#*:}" == "success" ]] || status=1
          done
          if (( status )); then
            echo "::error::coco build or smoke did not pass on every cluster."
          fi
          exit "${status}"
