name: RDC-DME Metric Sync Check

on:
  schedule:
    - cron: '23 9 * * 1'  # Weekly on Monday at 9:23 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'projects/rdc/include/rdc/rdc.h'
      - 'projects/rdc/tools/dme_rdc_metric_mapping.json'
      - 'projects/rdc/tools/dme_rdc_metric_sync_check.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rocm-systems
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            projects/rdc/include/rdc/rdc.h
            projects/rdc/tools/
          sparse-checkout-cone-mode: false

      - name: Checkout device-metrics-exporter
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/device-metrics-exporter
          path: dme-upstream
          sparse-checkout: |
            pkg/
            internal/
            cmd/

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Run sync check
        id: sync-check
        run: |
          python3 projects/rdc/tools/dme_rdc_metric_sync_check.py \
            --rdc-header projects/rdc/include/rdc/rdc.h \
            --mapping projects/rdc/tools/dme_rdc_metric_mapping.json \
            --dme-path dme-upstream \
            --output sync-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dme-rdc-sync-report
          path: sync-report.json

      - name: Create or update issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('sync-report.json', 'utf8'));
            const unmapped = report.unmapped_dme_metrics || [];
            const stale = report.stale_mappings || [];
            let body = '## DME-RDC Metric Sync Gap Detected\n\n';
            body += `RDC fields: ${report.rdc_field_count}\n`;
            body += `Mapped: ${report.mapped}, Skipped: ${report.skipped}\n\n`;
            if (unmapped.length > 0) {
              body += '### New Unmapped DME Metrics\n\n';
              unmapped.forEach(m => { body += `- \`${m}\`\n`; });
            }
            if (stale.length > 0) {
              body += '\n### Stale Mappings\n\n';
              stale.forEach(s => { body += `- \`${s.dme}\` -> \`${s.rdc}\`: ${s.issue}\n`; });
            }
            // Hidden marker uniquely identifies issues this workflow owns. This is the
            // primary match key; title/label/author are secondary guards.
            const MARKER = '<!-- rdc-dme-sync-check -->';
            const title = '[RDC] DME metric sync gap detected';
            const labels = ['project: rdc'];
            const assignees = ['adam360x'];
            // Issues cannot be assigned to a team; @-mentioning the team is the
            // supported way to notify all of its members.
            const team = '@ROCm/rdc-reviewers';
            body = `${MARKER}\n${body}\n\ncc ${team}\n---\nLast updated by RDC-DME Sync Check workflow (run ${context.runId}).`;
            // Refresh the newest OPEN issue this workflow opened (authored by the bot,
            // carrying our marker) instead of filing a new one weekly. Only the first
            // page of open bot issues is checked - that is plenty, and we never touch
            // closed issues: if a gap regresses after the issue was closed, a fresh
            // issue is opened.
            const candidates = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });
            const match = candidates.data.find(i =>
              !i.pull_request &&
              i.title === title &&
              (i.body || '').includes(MARKER)
            );
            if (match) {
              // Body holds the latest snapshot; a comment is what actually notifies
              // subscribers/assignees (issue body edits send no notification).
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: body,
                labels: labels,
                assignees: assignees,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Sync gap still present as of run ${context.runId}. Snapshot above refreshed.\n\n` +
                  `Unmapped: ${unmapped.length}, stale: ${stale.length}.\n\ncc ${team}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: labels,
                assignees: assignees,
              });
            }
