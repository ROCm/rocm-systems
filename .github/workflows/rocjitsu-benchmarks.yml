name: "rocjitsu-benchmarks"

on:
  push:
    branches:
      - "develop"
    paths:
      - "emulation/rocjitsu/**"
      - ".github/workflows/rocjitsu-benchmarks.yml"
  workflow_dispatch:

# Each job grants only the access it needs.
permissions: {}

defaults:
  run:
    shell: bash

env:
  # Land only after the threading-aware dashboard has deployed.
  # TODO: Pin the published corpus revision with both suites and threadingMode metadata.
  CORPUS_SHA: 2aa02d4ed18aa4c311f3ec96c7619c3d984ac368 # rocjitsu-test-corpus#54
  TENSILE_SHA: dd77374194a3ea1a7258cd54f87af6747b6362a5
  TENSILE_SOURCE: ${{ github.workspace }}/rocm-libraries
  HSA_ENABLE_SDMA_COPY_SIZE_OVERRIDE: "0"
  ROCJITSU_SOURCE_DIR: ${{ github.workspace }}/rocm-systems/emulation/rocjitsu
  CORPUS_SOURCE_DIR: ${{ github.workspace }}/rocjitsu-test-corpus
  RESULTS_BRANCH: gh-pages-rocjitsu
  RESULTS_ARTIFACT: rocjitsu-benchmark-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  benchmark:
    name: Run nightly benchmark
    runs-on: rocjitsu-benchmark
    timeout-minutes: 210
    permissions:
      contents: read
    outputs:
      machine: ${{ steps.machine.outputs.name }}
      ran: ${{ steps.benchmark.outcome == 'success' || steps.benchmark.outcome == 'failure' || steps.benchmark_single.outcome == 'success' || steps.benchmark_single.outcome == 'failure' }}
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --user 0:0
      env:
        DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Set benchmark paths
        run: |
          BENCHMARK_DIR="${RUNNER_TEMP}/rocjitsu-benchmark-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "ROCJITSU_BUILD_DIR=${BENCHMARK_DIR}/build"
            echo "ROCJITSU_VENV=${BENCHMARK_DIR}/venv"
            echo "ROCJITSU_RESULT_DIR=${BENCHMARK_DIR}/results"
            echo "TENSILE_BUILD_DIR=${BENCHMARK_DIR}/tensile-native"
            echo "TENSILE_CANDIDATE_ARTIFACTS=${BENCHMARK_DIR}/tensile-candidates"
            echo "TENSILE_CANDIDATE_RUNNER=${BENCHMARK_DIR}/tensile-native/tensile_candidate"
            echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)"
          } >> "${GITHUB_ENV}"

      - name: Install base dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            git \
            libclang-rt-dev \
            libdrm-dev \
            ninja-build \
            zlib1g-dev

      - name: Checkout rocm-systems
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: rocm-systems
          persist-credentials: false

      - name: Checkout benchmark corpus
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ROCm/rocjitsu-test-corpus
          ref: ${{ env.CORPUS_SHA }}
          path: rocjitsu-test-corpus
          persist-credentials: false

      - name: Checkout pinned TensileLite source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ROCm/rocm-libraries
          ref: ${{ env.TENSILE_SHA }}
          path: rocm-libraries
          persist-credentials: false

      - name: Record benchmark machine
        id: machine
        run: echo "name=${RUNNER_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: |
          python -m venv "${ROCJITSU_VENV}"
          "${ROCJITSU_VENV}/bin/python" -m pip install \
            --disable-pip-version-check \
            -r "${CORPUS_SOURCE_DIR}/benchmarks/requirements.txt"

          ROCM_PATH="$("${ROCJITSU_VENV}/bin/rocm-sdk" path --root)"
          echo "ROCM_PATH=${ROCM_PATH}" >> "${GITHUB_ENV}"
          echo "${ROCM_PATH}/bin" >> "${GITHUB_PATH}"
          echo "${ROCJITSU_VENV}/bin" >> "${GITHUB_PATH}"
          echo "LD_LIBRARY_PATH=${ROCM_PATH}/lib:${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"

      - name: Build rocjitsu
        run: |
          cmake -S "${ROCJITSU_SOURCE_DIR}" -B "${ROCJITSU_BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DLTO=OFF \
            -DRJ_ENABLE_ASAN=OFF \
            -DRJ_ENABLE_MSAN=OFF \
            -DRJ_ENABLE_TSAN=OFF \
            -DRJ_ENABLE_UBSAN=OFF \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/lib/llvm/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/lib/llvm/bin/amdclang++"
          cmake --build "${ROCJITSU_BUILD_DIR}" \
            --target rocjitsu_bin rocjitsu_shared

      - name: Prepare TensileLite candidates
        id: tensile
        run: |
          "${ROCJITSU_VENV}/bin/python" -m pip install \
            -r "${TENSILE_SOURCE}/projects/hipblaslt/tensilelite/requirements.txt"
          "${ROCJITSU_VENV}/bin/python" -m pip install \
            "${TENSILE_SOURCE}/projects/hipblaslt/tensilelite/rocisa" \
            --config-settings "build-dir=${TENSILE_BUILD_DIR}/rocisa" \
            --config-settings "cmake.define.ROCM_PATH=${ROCM_PATH}" \
            --config-settings "cmake.define.CMAKE_PREFIX_PATH=${ROCM_PATH}" \
            --config-settings "cmake.define.CMAKE_CXX_COMPILER=${ROCM_PATH}/bin/amdclang++"
          cmake -S "${CORPUS_SOURCE_DIR}/corpus/benchmarks/tensile_candidates" \
            -B "${TENSILE_BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTENSILE_SOURCE="${TENSILE_SOURCE}" \
            -DROCM_PATH="${ROCM_PATH}" -DCMAKE_PREFIX_PATH="${ROCM_PATH}" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++" \
            -DPython_EXECUTABLE="${ROCJITSU_VENV}/bin/python" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "${TENSILE_BUILD_DIR}" --target tensile_candidate
          "${ROCJITSU_VENV}/bin/python" \
            "${CORPUS_SOURCE_DIR}/corpus/benchmarks/tensile_candidates/generate.py" \
            --source-root "${TENSILE_SOURCE}" \
            --output "${TENSILE_CANDIDATE_ARTIFACTS}"

      - name: Run default-thread nightly suite
        timeout-minutes: 60
        id: benchmark
        working-directory: ${{ env.CORPUS_SOURCE_DIR }}
        run: |
          "${ROCJITSU_VENV}/bin/python" -m benchmarks.runner \
            --rocjitsu-source-dir "${ROCJITSU_SOURCE_DIR}" \
            --build-dir "${ROCJITSU_BUILD_DIR}" \
            --target-config "gfx950=${ROCJITSU_SOURCE_DIR}/configs/gfx950_mi355x_kmd.json" \
            --target-config "gfx1250=${ROCJITSU_SOURCE_DIR}/configs/gfx1250_mi455x.json" \
            --run-wrapper "\"${ROCJITSU_BUILD_DIR}/tools/rocjitsu/rocjitsu\" --config {config} --" \
            --manifest benchmarks/suites/nightly.toml \
            --output "${ROCJITSU_RESULT_DIR}/default"

      - name: Run single-thread nightly suite
        if: ${{ !cancelled() && steps.tensile.outcome == 'success' }}
        timeout-minutes: 60
        id: benchmark_single
        working-directory: ${{ env.CORPUS_SOURCE_DIR }}
        run: |
          "${ROCJITSU_VENV}/bin/python" -m benchmarks.runner \
            --rocjitsu-source-dir "${ROCJITSU_SOURCE_DIR}" \
            --build-dir "${ROCJITSU_BUILD_DIR}" \
            --target-config "gfx950=${ROCJITSU_SOURCE_DIR}/configs/gfx950_mi355x_kmd.json" \
            --target-config "gfx1250=${ROCJITSU_SOURCE_DIR}/configs/gfx1250_mi455x.json" \
            --run-wrapper "\"${ROCJITSU_BUILD_DIR}/tools/rocjitsu/rocjitsu\" --config {config} --" \
            --manifest benchmarks/suites/nightly-single.toml \
            --output "${ROCJITSU_RESULT_DIR}/single"

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RESULTS_ARTIFACT }}
          path: ${{ env.ROCJITSU_RESULT_DIR }}
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish dashboard data
    needs: benchmark
    if: ${{ !cancelled() && github.ref == 'refs/heads/develop' && needs.benchmark.outputs.ran == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BENCHMARK_MACHINE: ${{ needs.benchmark.outputs.machine }}

    steps:
      - name: Download benchmark diagnostics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.RESULTS_ARTIFACT }}
          path: incoming

      - name: Checkout publisher corpus
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ROCm/rocjitsu-test-corpus
          ref: ${{ env.CORPUS_SHA }}
          path: rocjitsu-test-corpus
          persist-credentials: false

      - name: Checkout repository for publication
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: publication

      - name: Checkout dashboard validator
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ROCm/rocm-systems
          path: dashboard
          persist-credentials: false
          sparse-checkout: emulation/rocjitsu/website/dashboard

      - name: Set up publisher Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Publish dashboard-ready result
        working-directory: publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RUN_ID="github-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          TRIGGER=auto
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TRIGGER=manual
          fi
          # Read metadata before switching this checkout to the results branch.
          COMMIT_MESSAGE="$(git show -s --format=%s "${GITHUB_SHA}")"

          MAX_ATTEMPTS=20
          for ATTEMPT in $(seq 1 "${MAX_ATTEMPTS}"); do
            # Reconstruct every attempt from the latest results branch instead
            # of rebasing a commit containing a stale generated index.
            git reset --hard HEAD
            git clean -ffd

            set +e
            git ls-remote --exit-code --heads origin \
              "refs/heads/${RESULTS_BRANCH}" >/dev/null
            REMOTE_STATUS=$?
            set -e
            if [[ "${REMOTE_STATUS}" == 0 ]]; then
              git fetch --no-tags origin \
                "+refs/heads/${RESULTS_BRANCH}:refs/remotes/origin/${RESULTS_BRANCH}"
              git switch --detach "refs/remotes/origin/${RESULTS_BRANCH}"
            elif [[ "${REMOTE_STATUS}" == 2 ]]; then
              git switch --orphan \
                "publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ATTEMPT}"
              git rm -rf --ignore-unmatch .
            else
              exit "${REMOTE_STATUS}"
            fi

            PUBLISHED=0
            PUBLISH_STATUS=0
            for THREADING in default single; do
              RAW_RUN="${GITHUB_WORKSPACE}/incoming/${THREADING}/run.json"
              if [[ ! -f "${RAW_RUN}" ]]; then
                echo "No ${THREADING} run.json; skipping publication"
                continue
              fi
              SUITE_RUN_ID="${RUN_ID}"
              ENVIRONMENT_ID="rocjitsu-benchmark-u2404-4150afe4-rocm-10.1.0a20260812"
              if [[ "${THREADING}" == single ]]; then
                SUITE_RUN_ID="${RUN_ID}-single"
                ENVIRONMENT_ID="${ENVIRONMENT_ID}-single"
              fi
              if (
                cd "${CORPUS_SOURCE_DIR}"
                python -m benchmarks.dashboard_publish \
                  --raw-run "${RAW_RUN}" \
                  --data-dir "${GITHUB_WORKSPACE}/publication/rocjitsu-dashboard/data" \
                  --run-id "${SUITE_RUN_ID}" \
                  --repository "https://github.com/${GITHUB_REPOSITORY}" \
                  --environment-id "${ENVIRONMENT_ID}" \
                  --expected-sha "${GITHUB_SHA}" \
                  --expected-corpus-sha "${CORPUS_SHA}" \
                  --machine-id "${BENCHMARK_MACHINE}" \
                  --trigger "${TRIGGER}" \
                  --branch develop \
                  --commit-message "${COMMIT_MESSAGE}" \
                  --source-ref "${GITHUB_REF_NAME}" \
                  --is-beta
              ); then
                PUBLISHED=$((PUBLISHED + 1))
              else
                echo "::error::Could not publish ${THREADING} benchmark run"
                PUBLISH_STATUS=1
              fi
            done
            if [[ "${PUBLISHED}" == 0 ]]; then
              echo "No benchmark runs available to publish"
              exit "${PUBLISH_STATUS}"
            fi

            node "${GITHUB_WORKSPACE}/dashboard/emulation/rocjitsu/website/dashboard/scripts/validate-dashboard-data.mjs" \
              "${GITHUB_WORKSPACE}/publication/rocjitsu-dashboard/data"

            git add rocjitsu-dashboard/data
            if git diff --cached --quiet; then
              echo "Dashboard run ${RUN_ID} is already published"
              exit "${PUBLISH_STATUS}"
            fi
            git commit --signoff \
              -m "Publish rocjitsu benchmark run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            if git push origin "HEAD:refs/heads/${RESULTS_BRANCH}"; then
              exit "${PUBLISH_STATUS}"
            fi
            if [[ "${ATTEMPT}" == "${MAX_ATTEMPTS}" ]]; then
              exit 1
            fi
            DELAY=$((ATTEMPT * 2))
            if ((DELAY > 30)); then
              DELAY=30
            fi
            sleep "$((DELAY + RANDOM % 5))"
          done
