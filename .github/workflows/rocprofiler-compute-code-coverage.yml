name: rocprofiler-compute Nightly Coverage
run-name: rocprofiler-compute-nightly-coverage

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      runner_matrix:
        description: 'Runner configuration'
        required: false
        type: string
  push:
    branches: [ users/jamessiddeley-amd/improve-cdash ]
    paths:
      - '.github/workflows/rocprofiler-compute-nightly-coverage.yml'
      - 'projects/rocprofiler-compute/**'

env:
  ROCM_PATH: "/opt/rocm"
  ROCM_VERSION: "7.0.0"

jobs:
  prepare_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate_matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: projects/rocprofiler-compute

      - name: Generate matrix
        id: generate_matrix
        run: |
          MATRIX='[
            { "os-release": "22.04", "gpu": "mi355", "arch": "gfx950", "runner": "linux-mi355-1gpu-ossci-rocm", "code-name": "jammy" },
            { "os-release": "24.04", "gpu": "mi355", "arch": "gfx950", "runner": "linux-mi355-1gpu-ossci-rocm", "code-name": "noble" },
            { "os-release": "22.04", "gpu": "mi325", "arch": "gfx94X", "runner": "linux-mi325-1gpu-ossci-rocm", "code-name": "jammy" },
            { "os-release": "24.04", "gpu": "mi325", "arch": "gfx94X", "runner": "linux-mi325-1gpu-ossci-rocm", "code-name": "noble" }
          ]'
          
          if [ -n "${{ github.event.inputs.runner_matrix }}" ]; then
            MATRIX='${{ github.event.inputs.runner_matrix }}'
          fi
          
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT

  coverage:
    name: Coverage • ${{ matrix.system.gpu }} • Ubuntu ${{ matrix.system.os-release }}
    needs: prepare_matrix
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}
    runs-on: ${{ matrix.system.runner }}
    env:
      HIP_PLATFORM: "amd"
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
    permissions:
      packages: read
    container:
      image: ghcr.io/rocm/rocprofiler-ubuntu:${{ matrix.system.os-release }}-systems-ci-${{ matrix.system.arch }}
      options: 
        --privileged 
        --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --cap-add CAP_SYS_ADMIN
        
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: projects/rocprofiler-compute

      - name: Install amdgpu and dependencies
        shell: bash
        run: |
          ROCM_MAJOR=$(echo ${{ env.ROCM_VERSION }} | sed 's/\./ /g' | awk '{print $1}')
          ROCM_MINOR=$(echo ${{ env.ROCM_VERSION }} | sed 's/\./ /g' | awk '{print $2}')
          ROCM_VERSN=$(( (${ROCM_MAJOR}*10000)+(${ROCM_MINOR}*100) ))
          wget -N -P /tmp/ https://repo.radeon.com/amdgpu-install/${ROCM_MAJOR}.${ROCM_MINOR}/ubuntu/${{ matrix.system.code-name }}/amdgpu-install_${ROCM_MAJOR}.${ROCM_MINOR}.${ROCM_VERSN}-1_all.deb
          apt-get install -y /tmp/amdgpu-install_${ROCM_MAJOR}.${ROCM_MINOR}.${ROCM_VERSN}-1_all.deb
          apt-get update
          apt install -y amd-smi-lib libdw-dev rocjpeg-test rocdecode-test rccl-dev
          echo "✅ amdgpu and ROCm dependencies Installed!"

      - name: Install MPI
        run: |
          apt install -y libopenmpi-dev
          echo "✅ MPI Installed!"

      - name: Install ROCm
        run: |
          apt install -y rocm-dev
          echo "✅ ROCm Installation Complete!"

      - name: Configure, Build, Test, and Upload Coverage
        id: run_coverage
        timeout-minutes: 120
        working-directory: projects/rocprofiler-compute
        continue-on-error: true
        run: |
          set -e
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          git config --global --add safe.directory ${PWD}
          
          BUILD_NAME="${{ matrix.system.gpu }}-${{ matrix.system.os-release }}-${{ matrix.system.arch }}-nightly-$(date +%Y%m%d)"
          
          PATH=${{ env.ROCM_PATH }}/bin:${{ env.ROCM_PATH }}/llvm/bin:$PATH \
          LD_LIBRARY_PATH=${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/llvm/lib:$LD_LIBRARY_PATH \
          python3 ./utils/run-ci.py \
            --build-name "${BUILD_NAME}" \
            --mode "Nightly" \
            --build-jobs 16 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ env.ROCM_PATH }} \
            -DENABLE_COVERAGE=ON \
            -DENABLE_TESTS=ON \
            -DPYTEST_NUMPROCS=8

      - name: Extract Coverage and Test Statistics
        id: extract_stats
        if: always()
        working-directory: projects/rocprofiler-compute
        run: |
          if [ -f "build/coverage.xml" ]; then
            COVERAGE_INFO=$(python3 -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('build/coverage.xml')
              root = tree.getroot()
              line_rate = float(root.get('line-rate', 0)) * 100
              print(f'{line_rate:.1f}%')
          except Exception as e:
              print('N/A')
          ")
            echo "coverage=${COVERAGE_INFO}" >> $GITHUB_OUTPUT
          else
            echo "coverage=N/A" >> $GITHUB_OUTPUT
          fi
          
          if [ -f "build/Testing/Temporary/LastTest.log" ]; then
            TESTS_PASSED=$(grep -oP '\d+(?= tests passed)' build/Testing/Temporary/LastTest.log | tail -1 || echo "0")
            TESTS_FAILED=$(grep -oP '\d+(?= tests failed)' build/Testing/Temporary/LastTest.log | tail -1 || echo "0")
            TESTS_TOTAL=$((TESTS_PASSED + TESTS_FAILED))
            echo "tests_passed=${TESTS_PASSED}" >> $GITHUB_OUTPUT
            echo "tests_failed=${TESTS_FAILED}" >> $GITHUB_OUTPUT
            echo "tests_total=${TESTS_TOTAL}" >> $GITHUB_OUTPUT
          else
            echo "tests_passed=0" >> $GITHUB_OUTPUT
            echo "tests_failed=0" >> $GITHUB_OUTPUT
            echo "tests_total=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate Summary
        if: always()
        run: |
          echo "## Coverage Report - ${{ matrix.system.gpu }} Ubuntu ${{ matrix.system.os-release }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Line Coverage** | ${{ steps.extract_stats.outputs.coverage }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tests Passed** | ${{ steps.extract_stats.outputs.tests_passed }}/${{ steps.extract_stats.outputs.tests_total }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tests Failed** | ${{ steps.extract_stats.outputs.tests_failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **GPU** | ${{ matrix.system.gpu }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Architecture** | ${{ matrix.system.arch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **OS** | Ubuntu ${{ matrix.system.os-release }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Runner** | ${{ matrix.system.runner }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View on CDash](https://my.cdash.org/index.php?project=rocprofiler-compute)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.system.gpu }}-${{ matrix.system.os-release }}
          path: |
            projects/rocprofiler-compute/build/Testing/Temporary/LastTest*.log
            projects/rocprofiler-compute/build/coverage.xml
          retention-days: 7