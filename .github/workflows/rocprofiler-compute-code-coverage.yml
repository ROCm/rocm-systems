name: rocprofiler-compute Nightly Coverage
run-name: rocprofiler-compute-nightly-coverage

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      runner_matrix:
        description: 'Runner configuration'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/rocprofiler-compute-nightly-coverage.yml'
      - 'projects/rocprofiler-compute/utils/run-ci.py'

env:
  ROCM_PATH: "/opt/rocm"

jobs:
  prepare_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate_matrix.outputs.matrix }}

    steps:
      - name: Generate matrix
        id: generate_matrix
        run: |
          MATRIX='[{"os-release":"22.04","gpu":"mi355","arch":"gfx950","runner":"linux-mi355-1gpu-ossci-rocm","code-name":"jammy"},{"os-release":"24.04","gpu":"mi355","arch":"gfx950","runner":"linux-mi355-1gpu-ossci-rocm","code-name":"noble"},{"os-release":"22.04","gpu":"mi325","arch":"gfx94X","runner":"linux-mi325-1gpu-ossci-rocm","code-name":"jammy"},{"os-release":"24.04","gpu":"mi325","arch":"gfx94X","runner":"linux-mi325-1gpu-ossci-rocm","code-name":"noble"}]'
          
          if [ -n "${{ github.event.inputs.runner_matrix }}" ]; then
            MATRIX='${{ github.event.inputs.runner_matrix }}'
          fi
          
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT

  coverage:
    name: Coverage • ${{ matrix.system.gpu }} • Ubuntu ${{ matrix.system.os-release }}
    needs: prepare_matrix
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}
    runs-on: ${{ matrix.system.runner }}
    env:
      HIP_PLATFORM: "amd"
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
    permissions:
      packages: read
    container:
      image: ghcr.io/rocm/rocprofiler-ubuntu:${{ matrix.system.os-release }}-systems-ci-${{ matrix.system.arch }}
      options: 
        --privileged 
        --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --cap-add CAP_SYS_ADMIN
        
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: projects/rocprofiler-compute

      - name: Install system dependencies
        shell: bash
        run: |
          apt-get update
          apt install -y amd-smi-lib libdw-dev libopenmpi-dev
          echo "✅ System dependencies Installed!"

      - name: Install ROCm from TheRock tarball
        shell: bash
        run: |
          set -e
          echo "Checking for ROCm tarballs in /opt..."
          ls -la /opt/*.tar.gz || echo "No tarballs found in /opt/"

          # Find the tarball
          TARBALL=$(ls /opt/rocm-*.tar.gz 2>/dev/null | head -n 1)

          if [ -z "${TARBALL}" ]; then
            echo "❌ Error: No ROCm tarball found in /opt/"
            echo "Available files in /opt/:"
            ls -la /opt/
            exit 1
          fi

          echo "Found ROCm tarball: ${TARBALL}"

          # Extract version from tarball filename
          TARBALL_ROCM_VERSION=$(basename ${TARBALL} | grep -oP '(?<=rocm-)\d+\.\d+\.\d+(?=-)')
          echo "Tarball ROCm version: ${TARBALL_ROCM_VERSION}"

          # Create target directory
          ROCM_INSTALL_DIR="${{ env.ROCM_PATH }}-${TARBALL_ROCM_VERSION}"
          mkdir -p ${ROCM_INSTALL_DIR}

          # Extract tarball
          echo "Extracting ${TARBALL} to ${ROCM_INSTALL_DIR}..."
          tar -xzf ${TARBALL} -C ${ROCM_INSTALL_DIR} --strip-components=1

          # Create symlink
          ln -sf ${ROCM_INSTALL_DIR} ${{ env.ROCM_PATH }}

          echo "ROCm installed to: ${{ env.ROCM_PATH }} -> ${ROCM_INSTALL_DIR}"

          # Verify installation
          if [ -f "${{ env.ROCM_PATH }}/bin/amdclang++" ]; then
            echo "Compiler version:"
            ${{ env.ROCM_PATH }}/bin/amdclang++ --version
          else
            echo "⚠️  Warning: amdclang++ not found at expected location"
          fi

          echo "✅ ROCm Installation Complete (from TheRock tarball)!"

      - name: Install Python Dependencies
        working-directory: projects/rocprofiler-compute
        run: |
          pip install -r requirements.txt --break-system-packages --ignore-installed
          pip install -r requirements-test.txt --break-system-packages --ignore-installed
          echo "✅ Python dependencies installed!"

      - name: Configure, Build, Test, and Upload Coverage
        id: run_coverage
        timeout-minutes: 120
        working-directory: projects/rocprofiler-compute
        continue-on-error: true
        run: |
          set -e
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          git config --global --add safe.directory ${PWD}
          
          BUILD_NAME="${{ matrix.system.gpu }}-${{ matrix.system.os-release }}-${{ matrix.system.arch }}-nightly-$(date +%Y%m%d)"
          
          PATH=${{ env.ROCM_PATH }}/bin:${{ env.ROCM_PATH }}/llvm/bin:$PATH \
          LD_LIBRARY_PATH=${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/llvm/lib:$LD_LIBRARY_PATH \
          python3 ./utils/run-ci.py \
            --build-name "${BUILD_NAME}" \
            --mode "Nightly" \
            --build-jobs 16 \
            --pytest-numprocs 8 \
            --install

      - name: Check Coverage Configuration
        if: always()
        working-directory: projects/rocprofiler-compute
        run: |
          if [ -f "build/CMakeCache.txt" ]; then
            echo "Checking build configuration in CMakeCache:"
            grep "ENABLE_TESTS" build/CMakeCache.txt || echo "ENABLE_TESTS not found!"
            grep "ENABLE_COVERAGE" build/CMakeCache.txt || echo "ENABLE_COVERAGE not found!"
            grep "INSTALL_TESTS" build/CMakeCache.txt || echo "INSTALL_TESTS not found!"
          fi

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.system.gpu }}-${{ matrix.system.os-release }}
          path: |
            projects/rocprofiler-compute/build/Testing/Temporary/LastTest*.log
            projects/rocprofiler-compute/build/coverage.xml
          retention-days: 7
