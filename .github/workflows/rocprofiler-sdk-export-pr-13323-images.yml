name: rocprofiler-sdk Export PR 13323 Test Images

on:
  workflow_dispatch:
  push:
    branches:
      - users/lamikr/rocprofiler_sdk_pr13323_test_ci_with_modified_docker_images

permissions:
  contents: read

jobs:
  export-images:
    name: Export • ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, rhel-8.8, rhel-9.5, sles-15.6]
        gpu: [gfx94X]

    steps:
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.ROCPROFILER_AZURE_CI_USER }}
          password: ${{ secrets.ROCPROFILER_AZURE_CI_PASS }}

      - name: Pull the test image
        run: |
          IMAGE="docker.io/rocm/rocprofiler-private:${{ matrix.os }}-${{ matrix.gpu }}-test-pr-13323-v2"
          echo "Pulling ${IMAGE}..."
          docker pull "${IMAGE}"

      - name: Save image to tar file
        run: |
          IMAGE="docker.io/rocm/rocprofiler-private:${{ matrix.os }}-${{ matrix.gpu }}-test-pr-13323-v2"
          OUTPUT="rocprofiler-test-${{ matrix.os }}-${{ matrix.gpu }}.tar"

          echo "Saving image to tar file..."
          docker save "${IMAGE}" -o "${OUTPUT}"

          echo "Compressing..."
          gzip "${OUTPUT}"

          echo "Final size:"
          ls -lh "${OUTPUT}.gz"

      - name: Upload image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.os }}-${{ matrix.gpu }}-pr-13323
          path: rocprofiler-test-${{ matrix.os }}-${{ matrix.gpu }}.tar.gz
          retention-days: 7
          compression-level: 0
