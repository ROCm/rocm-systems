# --------------------------------------------------------------
# dynolog <-> RDC Integration CI
# --------------------------------------------------------------
# Architecture:
#   RdcWrapperExample (C++)
#       -> dynolog RdcWrapper         (dynolog's in-process integration shim)
#       -> librdc / librdc_bootstrap  (embedded RDC, built from projects/rdc)
#       -> libamd_smi.so              -> /dev/kfd
#
# dynolog runs RDC embedded inside its telemetry daemon via the shim in
# dynolog/src/gpumon/amd. The PRIMARY signal here is compiling + linking that
# shim against a freshly-built RDC: it catches RDC API/ABI/build changes that
# would break the downstream dynolog integration. Running the example on a GPU
# is an additional runtime check that soft-passes when no GPU metrics exist.
#
# The heavy lifting lives in Python helpers under
# projects/rdc/tests/dynolog_integration/. Run any phase locally with:
#     python3 -m dynolog_integration <subcommand>
# --------------------------------------------------------------
name: RDC dynolog Integration CI

on:
  pull_request:
    branches: [develop]
    paths:
      - 'projects/rdc/include/**'
      - 'projects/rdc/rdc_libs/**'
      - 'projects/rdc/common/**'
      - 'projects/rdc/CMakeLists.txt'
      - 'projects/rdc/cmake_modules/**'
      - 'projects/rdc/tests/dynolog_integration/**'
      - '.github/workflows/rdc-dynolog-ci.yml'
  workflow_dispatch:
    inputs:
      dynolog_ref:
        description: 'dynolog ref to build (branch, tag, or commit SHA)'
        default: 'b301ce05b3b25e2f48e4525bfc52a0ba6fe77446'
        type: string

permissions:
  contents: read

concurrency:
  group: rdc-dynolog-integration-${{ github.ref }}
  cancel-in-progress: true

# Force bash for every `run:` step. The default container shell on
# Debian/Ubuntu images is /bin/sh (dash), which does not support
# `set -o pipefail` or other bashisms used below.
defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: true
  BUILD_TYPE: RelWithDebInfo
  ROCM_DIR: /opt/rocm
  GRPC_ROOT: /opt/grpc
  GRPC_VERSION: "1.67.1"
  GPU_TARGETS: ${{ vars.GPU_TARGETS || 'gfx942' }}
  DYNOLOG_REPO: https://github.com/facebookincubator/dynolog.git
  # Automatic runs pin an immutable SHA so a re-tagged upstream cannot silently
  # change what CI builds. Manual runs may override via workflow_dispatch.
  DYNOLOG_REF: ${{ inputs.dynolog_ref || 'b301ce05b3b25e2f48e4525bfc52a0ba6fe77446' }}
  DYNOLOG_DIR: /tmp/dynolog
  EXAMPLE_RUN_SECONDS: '30'

jobs:
  integration-test:
    name: RDC dynolog Integration
    # Privileged self-hosted GPU runner: never auto-run untrusted fork-PR code on it.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    runs-on:
      - self-hosted
      # vars.RUNNER_TYPE must be set to a self-hosted AMD GPU runner label;
      # with it unset the job silently never schedules.
      - ${{ vars.RUNNER_TYPE }}
    timeout-minutes: 120
    container:
      image: ${{ vars.RDC_DOCKER_IMAGE || 'rocm/dev-ubuntu-22.04:7.2' }}
      options: >-
        --rm --privileged
        --device=/dev/kfd
        --device=/dev/dri
        --group-add video

    steps:
      # --------------------------------------------------------
      # Setup
      # --------------------------------------------------------
      - name: Checkout Super-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            projects/amdsmi
            projects/rdc

      - name: Build metadata
        run: echo "TODAY=$(date +%Y_%m_%d)" >> "$GITHUB_ENV"

      - name: Locate RDC and AMDSMI projects
        run: |
          set -euo pipefail
          RDC_DIR=$(find "$GITHUB_WORKSPACE" -path "*/projects/rdc/CMakeLists.txt" -exec dirname {} \; -quit)
          AMDSMI_DIR=$(find "$GITHUB_WORKSPACE" -path "*/projects/amdsmi/CMakeLists.txt" -exec dirname {} \; -quit)
          if [ -z "${RDC_DIR}" ]; then
            echo "::error::Could not locate projects/rdc/CMakeLists.txt"
            exit 1
          fi
          if [ -z "${AMDSMI_DIR}" ]; then
            echo "::error::Could not locate projects/amdsmi/CMakeLists.txt"
            exit 1
          fi
          echo "RDC_DIR=${RDC_DIR}" >> "$GITHUB_ENV"
          echo "RDC_TESTS_DIR=${RDC_DIR}/tests" >> "$GITHUB_ENV"
          echo "AMDSMI_DIR=${AMDSMI_DIR}" >> "$GITHUB_ENV"
          echo "RDC project:    ${RDC_DIR}"
          echo "AMDSMI project: ${AMDSMI_DIR}"

      - name: Install build tools
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            if apt-get update; then ok=1; break; fi
            sleep 5
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::apt-get update failed after 3 attempts"
            exit 1
          fi
          # RDC build deps mirror rdc-ci.yml; ninja-build is added for
          # dynolog's standalone RDC shim (glog is built from source below).
          apt-get install -y --no-install-recommends \
            autoconf automake build-essential ccache clang cmake curl git gzip \
            hip-dev hip-runtime-amd hipcc hsa-rocr-dev jq \
            libcap-dev libc++-dev libdrm-dev libgflags-dev \
            libgtest-dev libtool libmnl-dev libnl-3-dev libnl-genl-3-dev \
            ninja-build pkg-config python3 \
            rocm-core rocm-developer-tools rocm-device-libs rocm-smi-lib \
            rocprofiler-dev rocprofiler-plugins rocprofiler-register rocprofiler-sdk \
            tar unzip wget zip zstd

      # Gate the CI helper logic (rocm_version_code / evaluate) before the long
      # build so regressions in the helpers are caught fast and never merge
      # unexercised.
      - name: Run helper unit tests
        working-directory: ${{ env.RDC_TESTS_DIR }}
        run: |
          set -euo pipefail
          python3 -m unittest \
            dynolog_integration.test_build \
            dynolog_integration.test_run_example -v

      # git is only present after the apt install above (the ROCm dev image
      # ships without it), so mark the checkout safe here rather than earlier.
      - name: Mark workspace safe for git
        run: git config --global --replace-all safe.directory "$GITHUB_WORKSPACE"

      # dynolog's shim links glog. The ROCm dev image cannot install
      # libgoogle-glog-dev (its libunwind-dev dependency is unavailable there),
      # so build a minimal shared glog from source with stack unwinding and the
      # optional gflags integration disabled.
      - name: Build and install glog
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.6.0 https://github.com/google/glog.git /tmp/glog
          cmake -S /tmp/glog -B /tmp/glog/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DWITH_GFLAGS=OFF \
            -DWITH_UNWIND=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/glog/build --parallel "$(nproc)"
          cmake --install /tmp/glog/build
          ldconfig

      # --------------------------------------------------------
      # Phase 1 - Build gRPC (RDC's client/server transport)
      # --------------------------------------------------------
      - name: Fetch gRPC source
        run: |
          set -euo pipefail
          git clone --branch "v${GRPC_VERSION}" --depth 1 \
            https://github.com/grpc/grpc.git /tmp/grpc
          git -C /tmp/grpc submodule update --init --depth 1 \
            third_party/abseil-cpp \
            third_party/boringssl-with-bazel \
            third_party/cares/cares \
            third_party/protobuf \
            third_party/re2 \
            third_party/zlib

      - name: Build and install gRPC
        run: |
          set -euo pipefail
          cmake -S /tmp/grpc -B /tmp/grpc/build \
            -DgRPC_INSTALL=ON \
            -DgRPC_BUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="${GRPC_ROOT}" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/grpc/build --parallel "$(nproc)"
          cmake --install /tmp/grpc/build
          echo "${GRPC_ROOT}/lib" > /etc/ld.so.conf.d/grpc.conf
          ldconfig

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-rdc-dynolog-ccache-${{ github.ref_name }}-${{ env.TODAY }}
          restore-keys: |
            ${{ runner.os }}-rdc-dynolog-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-rdc-dynolog-ccache-

      # --------------------------------------------------------
      # Phase 2 - Build and install amd-smi (RDC dependency)
      # --------------------------------------------------------
      - name: Build and install amd-smi
        working-directory: ${{ env.AMDSMI_DIR }}
        run: |
          set -euo pipefail
          # RDC's metric fetcher links amdsmi_get_cpu_* (ESMI/CPU), so amd-smi
          # must be built with the E-SMI library enabled or librdc fails to link.
          cmake -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_INSTALL_PREFIX=${ROCM_DIR} \
            -DENABLE_ESMI_LIB=ON \
            -DBUILD_TESTS=OFF
          make -C build -j "$(nproc)"
          make -C build install
          ldconfig

      # --------------------------------------------------------
      # Phase 3 - Build and install RDC from the mono-repo
      # --------------------------------------------------------
      - name: Build and install RDC
        working-directory: ${{ env.RDC_DIR }}
        run: |
          set -euo pipefail
          cmake -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DGRPC_DESIRED_VERSION="${GRPC_VERSION}" \
            -DGRPC_ROOT="${GRPC_ROOT}" \
            -DBUILD_RUNTIME=ON \
            -DBUILD_PROFILER=ON \
            -DBUILD_RVS=OFF \
            -DBUILD_TESTS=OFF \
            -DGPU_TARGETS="${GPU_TARGETS}" \
            -DCMAKE_INSTALL_PREFIX=${ROCM_DIR}
          make -C build -j "$(nproc)"
          make -C build install
          ldconfig
          echo "=== Verify RDC installation ==="
          # Assert exactly the artifacts dynolog's shim links/needs, with clear
          # errors instead of a failing glob under `set -euo pipefail`.
          missing=0
          for f in \
            "${ROCM_DIR}/lib/librdc.so" \
            "${ROCM_DIR}/lib/librdc_bootstrap.so" \
            "${ROCM_DIR}/lib/rdc/librdc_rocp.so" \
            "${ROCM_DIR}/lib/cmake/rdc/rdc-config.cmake" \
            "${ROCM_DIR}/include/rdc/rdc.h"; do
            if [ -e "$f" ]; then
              echo "  present: $f"
            else
              echo "::error::missing expected RDC artifact: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      # --------------------------------------------------------
      # Phase 4 - Build the dynolog RDC shim + example
      # --------------------------------------------------------
      - name: Clone dynolog
        working-directory: ${{ env.RDC_TESTS_DIR }}
        run: |
          python3 -m dynolog_integration clone \
            --repo "${DYNOLOG_REPO}" \
            --ref "${DYNOLOG_REF}" \
            --dest "${DYNOLOG_DIR}"

      - name: Build dynolog RDC wrapper and example
        working-directory: ${{ env.RDC_TESTS_DIR }}
        run: |
          python3 -m dynolog_integration build-wrapper \
            --dynolog-dir "${DYNOLOG_DIR}" \
            --rocm-dir "${ROCM_DIR}" \
            --grpc-dir "${GRPC_ROOT}"

      # --------------------------------------------------------
      # Phase 5 - Run the example on GPU and verify metrics
      # --------------------------------------------------------
      - name: Run RdcWrapperExample
        working-directory: ${{ env.RDC_TESTS_DIR }}
        run: |
          python3 -m dynolog_integration run-example \
            --binary "${DYNOLOG_DIR}/dynolog/src/gpumon/amd/build/examples/RdcWrapperExample" \
            --rocm-dir "${ROCM_DIR}" \
            --duration "${EXAMPLE_RUN_SECONDS}" \
            --ld-library-path "${ROCM_DIR}/lib:${ROCM_DIR}/lib/rdc:${ROCM_DIR}/lib/rdc/grpc/lib:${GRPC_ROOT}/lib" \
            --log-file /tmp/rdc-dynolog-example.log

      # --------------------------------------------------------
      # Cleanup & artifacts
      # --------------------------------------------------------
      - name: Collect logs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/integration-logs
          for src in /tmp/rdc-dynolog-example.log; do
            [ -f "${src}" ] && cp "${src}" /tmp/integration-logs/ || true
          done
          {
            echo "=== System ==="
            uname -a
            echo "=== GPU devices ==="
            ls -la /dev/kfd /dev/dri/ 2>&1 || true
            echo "=== RDC / AMDSMI libs ==="
            ldconfig -p | grep -E 'rdc|amd_smi' || true
          } > /tmp/integration-logs/system-info.txt 2>&1

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rdc-dynolog-integration-logs
          path: /tmp/integration-logs/
          retention-days: 7
