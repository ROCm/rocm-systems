name: hipfile-codeql
run-name: Run CodeQL C/C++ analysis on hipFile

# CodeQL's C/C++ extractor works by tracing the real compiler invocations, so
# init -> build -> analyze must all run in the SAME environment. We therefore
# run the whole job inside the prebuilt hipFile CI image (job-level container),
# rather than the host-runner + `docker exec` pattern used by hipfile-clang-tidy
# (the tracer's environment would not reach a compiler launched in a separate
# `docker exec` process).
#
# Python and GitHub Actions are already covered repo-wide by codeql.yml; this
# workflow exists to close the C/C++ gap, which needs an observed build.

env:
  # A single arch is enough: CodeQL traces the host compilation (done once
  # regardless of arch count); extra gfx targets only recompile device code,
  # which the C/C++ extractor does not analyze.
  AIS_HIP_ARCHITECTURES: gfx942

on:
  workflow_call:
    inputs:
      ci_image:
        description: "Full CI image name & tag"
        required: true
        type: string

permissions:
  contents: read
  # required to pull the CI image from GHCR
  packages: read
  # required to upload analysis results
  security-events: write

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: [ubuntu-24.04]
    timeout-minutes: 45
    container:
      image: ${{ inputs.ci_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetching code repository...
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          sparse-checkout: |
            projects/hipfile

      - name: Configure Git safe directory
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended,security-and-quality
          # Unless specified, CodeQL sets the maximum amount of memory it
          # can use based on the following formula expressed in MB:
          #
          # CodeQL_memory = total - [1024 + (scale * max(total - 8192, 0))]
          #
          # Where scale is an internal value currently set to 5%, and total is
          # the total amount of memory available on the system. In other words,
          # CodeQL can use up to all of the memory minus a fixed 1 GB of RAM, and
          # 5% of all memory above 8 GB. On a runner with 16 GB of RAM, CodeQL
          # will reserve up to ~90% of the total memory on the system.
          # This default may be leaving too little for building hipFile.
          # 80% of 16 GB is 13.1 GB, which leaves ~3.2 GB for hipFile.
          ram: 13107

      - name: Configure and build hipFile
        # Plain build (no clang-tidy): we only want CodeQL to observe the
        # compiler. Debug build type keeps optimizations off so the extracted
        # database is closer to the source.
        #
        # We also restrict the parallelism here to avoid getting OOM killed by
        # contending with CodeQL. Peak memory measured locally on a system
        # constrained to 4 CPUs and 16 GB, 5 trials of each, with the ram cap
        # above already applied:
        #
        #   build         | compilers | without CodeQL | with CodeQL | OOM kills
        #   --------------|-----------|----------------|-------------|----------
        #   --parallel    |        62 |         6.0 GB |     13.5 GB |        16
        #   --parallel 4  |         8 |         1.7 GB |      5.6 GB |         0
        #
        # "without CodeQL" is the cmake build on its own; "with CodeQL" is the
        # whole container, so it also covers the extractor and the database it
        # builds. Most of the memory is CodeQL's, and its share grows with the
        # number of compilers it has to trace -- so bounding the build bounds
        # CodeQL too.
        #
        # The build runs fine unbounded on its own, so this bound is only
        # needed where CodeQL runs alongside it.
        shell: bash
        run: |
          cmake \
            -B /tmp/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=amdclang++ \
            -DCMAKE_HIP_ARCHITECTURES="${{ env.AIS_HIP_ARCHITECTURES }}" \
            -DCMAKE_HIP_PLATFORM=amd \
            projects/hipfile
          cmake --build /tmp/build --parallel "$(nproc)"

      - name: Report memory usage
        # Runs on failure too, which is when it matters most: exit code 137
        # from the build step above means the kernel OOM killed it.
        #
        # memory.peak is a kernel-maintained high-water mark for the whole
        # container (build, CodeQL extractor and runner agent alike), so it
        # captures the true peak without having to sample. A non-zero oom_kill
        # in memory.events confirms the kernel killed something in this cgroup.
        # dmesg is not usable here: reading the kernel ring buffer needs
        # CAP_SYSLOG, which this container does not have.
        if: ${{ always() }}
        shell: bash
        run: |
          show() {
            printf '  %-20s %s\n' "$1" "$(cat "/sys/fs/cgroup/$1" 2>/dev/null || echo '(unavailable)')"
          }
          echo "cgroup memory (bytes, 'max' means no limit set):"
          show memory.max
          show memory.peak
          show memory.current
          show memory.swap.max
          show memory.swap.peak
          show memory.swap.current
          echo "memory.events (oom_kill > 0 means the kernel killed a process here):"
          sed 's/^/  /' /sys/fs/cgroup/memory.events 2>/dev/null || echo "  (unavailable)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          category: "/hipfile/language:c-cpp"
