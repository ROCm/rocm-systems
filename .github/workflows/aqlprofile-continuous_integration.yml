name: AqlProfile Continuous Integration

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'projects/aqlprofile/**'
      - '!projects/aqlprofile/*.md'
      - '!projects/aqlprofile/CODEOWNERS'
      - '!projects/aqlprofile/source/docs/**'
      - '.github/workflows/aqlprofile-continuous_integration.yml'
  pull_request:
    paths:
      - 'projects/aqlprofile/**'
      - '!projects/aqlprofile/*.md'
      - '!projects/aqlprofile/CODEOWNERS'
      - '!projects/aqlprofile/source/docs/**'
      - '.github/workflows/aqlprofile-continuous_integration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # TODO(jrmadsen): replace LD_RUNPATH_FLAG, GPU_TARGETS, etc. with internal handling in cmake
  PATH: "/usr/bin:$PATH"
  navi3_EXCLUDE_TESTS_REGEX: ""
  vega20_EXCLUDE_TESTS_REGEX: ""
  mi200_EXCLUDE_TESTS_REGEX: ""
  mi300_EXCLUDE_TESTS_REGEX: ""
  mi300a_EXCLUDE_TESTS_REGEX: ""
  mi325_EXCLUDE_TESTS_REGEX: ""
  navi4_EXCLUDE_TESTS_REGEX: ""
  navi3_EXCLUDE_LABEL_REGEX: ""
  vega20_EXCLUDE_LABEL_REGEX: ""
  mi200_EXCLUDE_LABEL_REGEX: ""
  mi300_EXCLUDE_LABEL_REGEX: ""
  mi300a_EXCLUDE_LABEL_REGEX: ""
  mi325_EXCLUDE_LABEL_REGEX: ""
  navi4_EXCLUDE_LABEL_REGEX: ""

jobs:
  core-deb:
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    strategy:
      fail-fast: false
      matrix:
        system: [
          {gpu: 'navi4', runner: 'rocprofiler-navi4-dind', os: 'ubuntu:22.04', build-type: 'RelWithDebInfo'},
          {gpu: 'navi3', runner: 'rocprofiler-navi3-dind', os: 'ubuntu:22.04', build-type: 'RelWithDebInfo'},
          {gpu: 'mi3xx', runner: 'linux-mi325-1gpu-ossci-rocm', os: 'ubuntu:22.04', build-type: 'RelWithDebInfo'}
        ]

    runs-on: ${{ matrix.system.runner }}
    container: ${{ matrix.system.os }}

    permissions:
      contents: read
      pull-requests: write

    # define this for containers
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      GPU_RUNNER: ${{ matrix.system.gpu }}

    steps:
    - name: Install Latest ROCm
      if: ${{matrix.system.gpu == 'mi3xx'}}
      shell: bash
      working-directory: /tmp
      run: |
        python3 -m pip install --upgrade pip pipx
        python3 -m pipx install awscli
        KEY=$(~/.local/bin/aws s3api list-objects-v2 \
          --bucket therock-nightly-tarball \
          --no-sign-request \
          --output json \
          --query "sort_by(Contents[?contains(Key, 'gfx94X')], &LastModified)[-1].Key")
        KEY=${KEY//\"/}
        test -n "$KEY" || { echo "No gfx94X tarball found"; exit 1; }
        ~/.local/bin/aws s3 cp "s3://therock-nightly-tarball/${KEY}" rocm.tar.gz --no-sign-request
        ls -lh rocm.tar.gz
        echo "Downloaded: ${KEY}"
        sudo mkdir -p /opt/rocm-custom
        sudo tar -xf *.tar.gz -C /opt/rocm-custom

    - uses: actions/checkout@v4
      with:
        sparse-checkout: projects/aqlprofile
        set-safe-directory: true

    - name: Install requirements
      timeout-minutes: 10
      shell: bash
      run: |
        [ "${GPU_RUNNER}" == "mi3xx" ] && export PRE_COMMAND="sudo"
        git config --global --add safe.directory '*'
        $PRE_COMMAND apt-get update
        $PRE_COMMAND apt-get install -y build-essential cmake g++-11 g++-12 python3-pip libgtest-dev libgmock-dev
        $PRE_COMMAND update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 10 --slave /usr/bin/g++ g++ /usr/bin/g++-11 --slave /usr/bin/gcov gcov /usr/bin/gcov-11
        $PRE_COMMAND update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 20 --slave /usr/bin/g++ g++ /usr/bin/g++-12 --slave /usr/bin/gcov gcov /usr/bin/gcov-12

    - name: List Files
      shell: bash
      run: |
        echo "PATH: ${PATH}"
        echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"
        which-realpath() { echo -e "\n$1 resolves to $(realpath $(which $1))"; echo "$($(which $1) --version &> /dev/stdout | head -n 1)"; }
        for i in python3 git cmake ctest gcc g++ gcov; do which-realpath $i; done
        cat /opt/rocm/.info/version
        ls -la
        pwd

    - name: Configure, Build, and Test
      # if: ${{matrix.system.gpu != 'mi3xx'}}
      timeout-minutes: 30
      shell: bash
      run:
        LD_LIBRARY_PATH=$(pwd)/build:$LD_LIBRARY_PATH /usr/bin/ctest --output-on-failure -VV -DCTEST_SOURCE_DIRECTORY="$(pwd)"
          -DCTEST_BINARY_DIRECTORY="$(pwd)/build" -DAQLPROFILE_BUILD_NUM_JOBS="16" -DCTEST_SITE="${RUNNER_HOSTNAME}"
          -DCTEST_BUILD_NAME=PR_${{ github.ref_name }}_${{ github.repository }}-${{ matrix.os }}-${{ matrix.gpu }}-core
          -DCMAKE_CTEST_ARGUMENTS=""
          -DAQLPROFILE_BUILD_TESTS=ON
          -DAQLPROFILE_EXTRA_CONFIGURE_ARGS=""
          -S $(pwd)/projects/aqlprofile/dashboard.cmake

    # - name: Configure, Build, and Test (MI3xx)
    #   if: ${{matrix.system.gpu == 'mi3xx'}}
    #   timeout-minutes: 30
    #   shell: bash
    #   run: |
    #     export LD_LIBRARY_PATH=$(pwd)/build:/opt/rocm-custom/lib:$LD_LIBRARY_PATH
    #     export PATH=/opt/rocm-custom/bin:$PATH
    #     /usr/bin/cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=/opt/rocm-custom -DCMAKE_INSTALL_PREFIX=/opt/rocm-custom -DCPACK_PACKAGING_INSTALL_PREFIX=/opt/rocm-custom -DCPACK_GENERATOR='DEB;RPM;STGZ' -DGPU_TARGETS='gfx906,gfx90a,gfx942,gfx1101,gfx1201' -DAQLPROFILE_BUILD_TESTS=ON $(pwd)/projects/aqlprofile
    #     /usr/bin/cmake --build build --target all --parallel 16
    #     sudo /usr/bin/cmake --build build --target install
    #     /usr/bin/ctest --output-on-failure -VV --test-dir build

  core-rpm:
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    strategy:
      fail-fast: false
      matrix:
        runner: ['mi300']
        os: ['rhel-9', 'sles-15']
        build-type: ['RelWithDebInfo']
        ci-flags: ['--linter clang-tidy']

    runs-on: rocprofiler-${{ matrix.os }}

    permissions:
      contents: read
      pull-requests: write

    # define this for containers
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1

    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: projects/aqlprofile
        set-safe-directory: true

    - name: Install requirements
      timeout-minutes: 10
      shell: bash
      run: git config --global --add safe.directory '*'

    - name: List Files
      shell: bash
      run: |
        echo "PATH: ${PATH}"
        echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"
        which-realpath() { echo -e "\n$1 resolves to $(realpath $(which $1))"; echo "$($(which $1) --version &> /dev/stdout | head -n 1)"; }
        for i in python3 git cmake ctest gcc g++ gcov; do which-realpath $i; done
        cat /opt/rocm/.info/version
        ls -la
        pwd

    - name: Configure, Build, and Test
      timeout-minutes: 30
      shell: bash
      run:
        LD_LIBRARY_PATH=$(pwd)/build:$LD_LIBRARY_PATH ctest --output-on-failure -VV -DCTEST_SOURCE_DIRECTORY="$(pwd)"
          -DCTEST_BINARY_DIRECTORY="$(pwd)/build" -DAQLPROFILE_BUILD_NUM_JOBS="16" -DCTEST_SITE="${RUNNER_HOSTNAME}"
          -DCTEST_BUILD_NAME=PR_${{ github.ref_name }}_${{ github.repository }}-${{ matrix.os }}-${{ matrix.runner }}-core
          -DCMAKE_CTEST_ARGUMENTS=""
          -DAQLPROFILE_BUILD_TESTS=ON
          -DAQLPROFILE_EXTRA_CONFIGURE_ARGS=""
          -S $(pwd)/projects/aqlprofile/dashboard.cmake
