[package]
name = "rocddi"
description = "Early-access private heterogeneous device interface for ROCm runtime frontends"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[features]
# Test-only callback allocator hooks for native rollback fault injection.
allocator-test-hooks = []

[lints]
workspace = true
