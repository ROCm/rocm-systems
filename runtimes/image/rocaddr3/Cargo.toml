[package]
name = "rocaddr3"
description = "GFX12 surface layouts through AMD AddrLib3"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false
crate-type = ["rlib"]

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
unreachable = "deny"
unwrap_used = "deny"
