[package]
name = "libhsa"
description = "Early-access HSA runtime ABI frontend over the private rocddi core"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "hsa_runtime64"
crate-type = ["cdylib"]
doc = false
doctest = false

[dependencies]
rocddi = { path = "../.." }

[lints.rust]
missing_docs = "allow"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
unreachable = "deny"
unwrap_used = "deny"
