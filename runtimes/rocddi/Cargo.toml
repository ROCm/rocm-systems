[workspace]
members = [
    ".",
    "frontends/libamdf",
    "frontends/libhsa",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ROCm/rocm-systems"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
unreachable = "deny"
unwrap_used = "deny"

[package]
name = "rocddi"
description = "Early-access private heterogeneous device interface for ROCm runtime frontends"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

# GNU symbol versions are attached to the HSA C entry points in one codegen
# unit. The assembler requires the version aliases and their definitions in
# the same object file.
[profile.dev.package.libhsa]
codegen-units = 1

[profile.release.package.libhsa]
codegen-units = 1
