exclude: |
  (?x)
    third_party/
    # avoid checking build directories for any subproject
    | build/
    | build-.*/
    | _build/
    # external source of truth
    | shared/amdgpu-windows-interop
    # these projects have their own pre-commit-config.yaml
    | projects/amdsmi/
    | projects/cuid/
    | projects/rdc/
    | projects/rocm-smi-lib/
    | projects/rocprofiler-compute/
    | projects/rocprofiler-systems/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # Public MR ISA XMLs are intentionally checked-in vendor inputs; each
        # existing architecture file already exceeds the generic size limit.
        exclude: ^shared/machine-readable-isa/isa/

  # Two black hooks so that directories with skip-string-normalization
  # (listed in the first hook) are kept separate from directories where
  # black enforces double quotes (the second hook). This is necessary
  # because black picks a single pyproject.toml for an entire invocation
  # based on the common ancestor of all input files. Running two hooks
  # ensures each group gets its own config context.
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        name: black (skip-string-normalization)
        args: ["--skip-string-normalization"]
        files: ^emulation/rocjitsu/
      - id: black
        name: black
        exclude: ^emulation/rocjitsu/

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.4
    hooks:
      - id: clang-format
        name: clang-format (C/C++/ObjC)
        entry: clang-format -i -style=file
        files: '\.(c|cpp|cc|h|hpp|m|mm)$'

  # gersemi: CMake formatter (replaces cmake-format and cmake-lint)
  - repo: https://github.com/BlankSpruce/gersemi
    rev: 0.25.1
    hooks:
      - id: gersemi
        # rocprofiler-sdk formats its CMake with cmake-format, enforced by the
        # cmake job in rocprofiler-sdk-formatting.yml, and the two tools disagree
        # about the same files. Running gersemi there rewrites files cmake-format
        # considers clean and breaks that project's CI. It has no
        # pre-commit-config.yaml of its own, so it is excluded here rather than
        # in the top-level exclude, which would also drop the generic hooks.
        exclude: ^projects/rocprofiler-sdk/
