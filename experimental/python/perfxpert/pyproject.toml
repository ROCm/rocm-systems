[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perfxpert"
version = "0.1.0"
description = "AI-powered GPU trace analysis for rocprofiler-sdk databases"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Advanced Micro Devices, Inc." }]
requires-python = ">=3.10"
# Phase 1 (agentic refactor) adds pydantic/pyyaml/jsonschema for structured
# knowledge loading and schema validation. LLM enhancement still requires
# anthropic or openai (optional extras below).
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
llm  = ["anthropic>=0.18", "openai>=1.0"]
rich = ["rich>=13.0"]
# claude-agent-sdk enables --llm claude-code using Claude Code's stored credentials
# (falls back to ANTHROPIC_API_KEY if CLI not found)
all  = ["anthropic>=0.18", "openai>=1.0", "rich>=13.0", "claude-agent-sdk>=0.1"]
dev  = ["pytest>=8.0", "pytest-asyncio>=0.21", "flake8", "black"]

[project.scripts]
perfxpert = "perfxpert.__main__:main"

[project.urls]
Homepage      = "https://github.com/ROCm/rocm-systems"
Documentation = "https://rocm.docs.amd.com"

[tool.setuptools]
packages = [
    "perfxpert",
    "perfxpert.analysis",
    "perfxpert.formatters",
    "perfxpert.ai_analysis",
    "perfxpert.ai_analysis.tests",
]

[tool.setuptools.package-data]
perfxpert = [
    "ai_analysis/share/*.md",
    "ai_analysis/share/*.png",
    "ai_analysis/docs/*.md",
    "ai_analysis/docs/*.json",
    "formatters/templates/*.html",
]

[tool.pytest.ini_options]
testpaths = [
    "perfxpert/ai_analysis/tests",
    "tests",
]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.black]
line-length = 120
target-version = ["py38", "py310"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
