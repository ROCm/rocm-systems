  GCEA:
    limit: 4
    arch_limits:
      gfx1151: 2
    note: "Graphics Command Engine Arbiter"
  GL1A:
    limit: 4
    arch_limits:
      gfx1151: 4
    note: "Graphics L1 address block"
  GL1C:
    limit: 4
    arch_limits:
      gfx1151: 4
    note: "Graphics L1 cache block"
  GL2A:
    limit: 4
