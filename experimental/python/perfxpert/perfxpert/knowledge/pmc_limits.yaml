# Per-block counter collection limits used by rocprofv3 pass planning.
# Architecture-specific values mirror the rocprofiler-compute
# mi_gpu_spec.yaml perfmon_config table in this repository.

per_block_limits:
  SQ:
    limit: 4
    arch_limits:
      gfx908: 8
      gfx90a: 8
      gfx940: 8
      gfx941: 8
      gfx942: 8
      gfx950: 8
      gfx1151: 8
    note: "Shader Sequencer"
  GRBM:
    limit: 4
    arch_limits:
      gfx908: 2
      gfx90a: 2
      gfx940: 2
      gfx941: 2
      gfx942: 2
      gfx950: 2
      gfx1151: 2
    note: "Global Register Bus Manager — system-wide cycle counters"
  TCC:
    limit: 4
    arch_limits:
      gfx908: 4
      gfx90a: 4
      gfx940: 4
      gfx941: 4
      gfx942: 4
      gfx950: 4
    note: "Texture Cache Controller (L2) — derived FETCH_SIZE/WRITE_SIZE must isolate; see rocprofv3_counter_limits.yaml"
  TCP:
    limit: 4
    arch_limits:
      gfx908: 4
      gfx90a: 4
      gfx940: 4
      gfx941: 4
      gfx942: 4
      gfx950: 4
      gfx1151: 4
    note: "Texture Cache Per-CU (vector L1)"
  TA:
    limit: 4
    arch_limits:
      gfx908: 2
      gfx90a: 2
      gfx940: 2
      gfx941: 2
      gfx942: 2
      gfx950: 2
      gfx1151: 2
    note: "Texture Address unit"
  TD:
    limit: 4
    arch_limits:
      gfx908: 2
      gfx90a: 2
      gfx940: 2
      gfx941: 2
      gfx942: 2
      gfx950: 2
    note: "Texture Data unit"
  CPC:
    limit: 4
    arch_limits:
      gfx908: 2
      gfx90a: 2
      gfx940: 2
      gfx941: 2
      gfx942: 2
      gfx950: 2
      gfx1151: 2
    note: "Command Processor Compute"
  CPF:
    limit: 4
    arch_limits:
      gfx908: 2
      gfx90a: 2
      gfx940: 2
      gfx941: 2
      gfx942: 2
      gfx950: 2
    note: "Command Processor Fetch"
