name: "PerfXpert CI"

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, work/*]

jobs:
  test:
    name: "Unit + Agent + CLI tests (${{ matrix.mode.name }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: agentic
            env: {}
          - name: legacy
            env:
              PERFXPERT_LEGACY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          cd experimental/python/perfxpert
          pip install -e '.[dev]'
      - name: Run tests (${{ matrix.mode.name }})
        env: ${{ matrix.mode.env }}
        run: |
          cd experimental/python/perfxpert
          pytest perfxpert/ai_analysis/tests tests/test_cli -v

  integration:
    name: "Integration tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          cd experimental/python/perfxpert
          pip install -e '.[dev]'
      - name: Run integration
        run: |
          cd experimental/python/perfxpert
          pytest tests/test_integration -v

  opencode-wrapper:
    name: "OpenCode wrapper smoke test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          cd experimental/python/perfxpert
          pip install -e '.[dev]'
      - name: Wrapper test
        run: |
          cd experimental/python/perfxpert
          pytest tests/test_tools/test_opencode_launcher.py tests/test_integration/test_opencode_config.py -v

  lint-ci-order:
    name: "Assert agentic is primary matrix entry"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Check agentic is first in matrix
        run: |
          cd experimental/python/perfxpert
          first_mode=$(grep -A 5 "matrix:" .github/workflows/perfxpert-ci.yml | grep "name:" | head -1 | grep -o "agentic\|legacy")
          test "$first_mode" = "agentic" || { echo "agentic must be first in matrix"; exit 1; }

  phase5-gate:
    name: "Phase 5 Go/No-Go (parity + red-team + false-positive)"
    if: github.event.pull_request.draft == false
    needs: [test, integration, opencode-wrapper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          cd experimental/python/perfxpert
          pip install -e '.[dev]'
      - name: Red-team suite (14 attacks, 100% required)
        run: |
          cd experimental/python/perfxpert
          pytest -m red_team -v -x
      - name: Parity suite (≥ 95% agreement)
        run: |
          cd experimental/python/perfxpert
          pytest -m parity -v
      - name: Regression-gate false-positive (≤ 5%)
        run: |
          cd experimental/python/perfxpert
          pytest -m regression_gate -v
      - name: Airgap parity invariant (100% identical)
        run: |
          cd experimental/python/perfxpert
          pytest tests/test_integration/test_airgap.py tests/test_integration/test_airgap_intent_classify.py -v
      - name: MCP exposure split (0 execution tools exposed)
        run: |
          cd experimental/python/perfxpert
          pytest tests/test_integration/test_mcp_exposure.py -v
      - name: Generate exit dashboard
        run: |
          cd experimental/python/perfxpert
          python scripts/exit_dashboard.py --output exit_dashboard.json --allow-partial
      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-exit-dashboard
          path: experimental/python/perfxpert/exit_dashboard.json
          retention-days: 30
