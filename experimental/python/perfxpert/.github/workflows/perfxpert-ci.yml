name: "PerfXpert CI"

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, work/*]

jobs:
  unit-and-agent:
    name: "Unit + Agent tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          cd experimental/python/perfxpert
          pip install -e '.[dev]'
      - name: Run tests
        run: |
          cd experimental/python/perfxpert
          pytest perfxpert/ai_analysis/tests -v

  integration:
    name: "Integration tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          cd experimental/python/perfxpert
          pip install -e '.[dev]'
      - name: Run integration
        run: |
          cd experimental/python/perfxpert
          pytest tests/test_integration -v

  opencode-wrapper:
    name: "OpenCode wrapper smoke test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          cd experimental/python/perfxpert
          pip install -e '.[dev]'
      - name: Wrapper test
        run: |
          cd experimental/python/perfxpert
          pytest tests/test_tools/test_opencode_launcher.py tests/test_integration/test_opencode_config.py -v

  phase5-gate:
    name: "Phase 5 Go/No-Go (parity + red-team + false-positive)"
    if: github.event.pull_request.draft == false
    needs: [unit-and-agent, integration, opencode-wrapper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          cd experimental/python/perfxpert
          pip install -e '.[dev]'
      - name: Red-team suite (14 attacks, 100% required)
        run: |
          cd experimental/python/perfxpert
          pytest -m red_team -v -x
      - name: Parity suite (≥ 95% agreement)
        run: |
          cd experimental/python/perfxpert
          pytest -m parity -v
      - name: Regression-gate false-positive (≤ 5%)
        run: |
          cd experimental/python/perfxpert
          pytest -m regression_gate -v
      - name: Airgap parity invariant (100% identical)
        run: |
          cd experimental/python/perfxpert
          pytest tests/test_integration/test_airgap.py tests/test_integration/test_airgap_intent_classify.py -v
      - name: MCP exposure split (0 execution tools exposed)
        run: |
          cd experimental/python/perfxpert
          pytest tests/test_integration/test_mcp_exposure.py -v
      - name: Generate exit dashboard
        run: |
          cd experimental/python/perfxpert
          python scripts/exit_dashboard.py --output exit_dashboard.json --allow-partial
      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-exit-dashboard
          path: experimental/python/perfxpert/exit_dashboard.json
          retention-days: 30
