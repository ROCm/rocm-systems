# z cannot chmod an immutable file, so h clears the flag first. Nothing here can
# set it again afterwards: systemd-tmpfiles applies the lines for one path
# sorted by type, which puts every h before z.
h /sys/firmware/efi/efivars/AmdCuidKey-e41c1f7f-63cb-46b9-bf27-36a55f92a06d - - - - -i
z /sys/firmware/efi/efivars/AmdCuidKey-e41c1f7f-63cb-46b9-bf27-36a55f92a06d 0600 root root -
